<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<style>
:root{--cream:#FFF8EA;--line:#F3D9B5;--pink:#F0708F;--pink-soft:#FFE3EC;--ink:#2F3A2A;--ok:#3E9E5B;--ok-soft:#DDF2E2;--no:#D9534F;--no-soft:#FBE1DF;
--en:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9cd3f0;font-family:var(--en);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:inherit;color:inherit}
.lab{position:fixed;left:0;top:0;transform:translate(-50%,-100%);cursor:pointer;background:var(--cream);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font:800 20px var(--en);box-shadow:0 4px 0 #0002;white-space:nowrap;display:none;z-index:3}
.lab small{font:600 15px var(--zh);margin-left:6px;color:#6b6455}
.lab i{font-style:normal;color:var(--ok)}
.lab.done{background:var(--ok-soft);border-color:var(--ok)}
.lab.next{border-color:var(--pink);background:#fff;animation:pulse 1.1s infinite}
.lab.big{font-size:26px;padding:10px 22px;background:#fff3a8;border-color:#f6b93b}
@keyframes pulse{50%{transform:translate(-50%,-112%) scale(1.06)}}
#hud{position:fixed;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:6}
#hud button,#hud .chip{font:800 18px var(--en);background:var(--cream);border:3px solid var(--line);border-radius:14px;padding:7px 12px;cursor:pointer}
#modeChip small{font:600 13px var(--zh);margin-left:4px}
#goal{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--cream);border:3px solid var(--line);border-radius:18px;padding:8px 22px;text-align:center;z-index:5;max-width:56vw;display:none}
#goal b{font-size:22px}#goal small{display:block;font:500 15px var(--zh);color:#6b6455}
#homeTab{position:fixed;right:12px;top:12px;z-index:6;font:800 18px var(--en);background:var(--pink);color:#fff;border:0;border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 #c74d6c;cursor:pointer}
#homeTab small{display:block;font:600 12px var(--zh)}
#help{position:fixed;left:12px;bottom:12px;font:500 14px var(--zh);color:#fff;text-shadow:0 1px 3px #0009;z-index:4}
#zoom{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px;z-index:5}
#zoom button{width:56px;height:56px;font:800 30px var(--en);background:var(--cream);border:3px solid var(--line);border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #0002}
#panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(1000px,94vw);max-height:56vh;overflow-y:auto;background:linear-gradient(#fffdf6,#fff3e0);border:4px solid var(--line);border-radius:28px;box-shadow:0 10px 0 #0002;padding:18px 26px 16px;text-align:center;z-index:10;display:none}
#panel.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}
.spk{display:flex;align-items:center;gap:14px;text-align:left}
.spk .ava{font-size:54px;line-height:1;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tag{display:inline-block;font:800 17px var(--en);background:var(--pink-soft);color:#b23a5c;border-radius:999px;padding:4px 16px}
.tag.bonus{background:#fff1b8;color:#9a6b00}
.q{font-size:clamp(26px,3.8vw,42px);margin:6px 0;line-height:1.15;font-weight:800}
.say{font-size:clamp(22px,3vw,34px);line-height:1.3;margin:4px 0}
.zhl{font:500 clamp(16px,2vw,21px)/1.45 var(--zh);color:#5d5646;margin-top:4px}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.opt{font:800 clamp(22px,3vw,32px) var(--en);background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;gap:10px;min-width:150px;justify-content:center}
.opt .ic{font-size:1.5em;line-height:1}
.opt.ok,.opt.ok:disabled{background:var(--ok-soft);border-color:var(--ok);transform:scale(1.06);opacity:1}
.opt.no{background:var(--no-soft);border-color:var(--no);opacity:.45}
.opt:disabled{opacity:.45;cursor:default}
.opt.pick{border-color:var(--pink);background:var(--pink-soft)}
.fb{font:800 clamp(20px,2.6vw,30px) var(--en);min-height:34px}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.btn{font:800 clamp(20px,2.6vw,28px) var(--en);border:0;border-radius:999px;padding:11px 30px;background:#fff;box-shadow:0 5px 0 var(--line);cursor:pointer;margin:4px}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #c74d6c}

.bigic{font-size:clamp(56px,8vw,100px);line-height:1;display:inline-block;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
.fill{font-size:clamp(24px,3.4vw,40px);font-weight:800;margin:6px 0}
.fill .slot{display:inline-block;min-width:120px;border-bottom:5px dashed var(--pink);color:var(--pink);padding:0 6px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.card{width:150px;background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 6px;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.card .ic{font-size:54px;line-height:1.1;display:block}.card b{display:block;font-size:22px}.card small{font:600 15px var(--zh);color:#6b6455}

.ltag{display:inline-block;margin-top:4px;font:700 12px var(--zh);border-radius:999px;padding:2px 8px;background:#eef6ff;color:#2b6cb0}
.ltag.p{background:#e7f8ec;color:#2f855a}.ltag.e{background:#fff4d6;color:#b7791f}.ltag.f{background:#f3e8ff;color:#6b46c1}.ltag.m{background:#e6f6ff;color:#2b6cb0}.ltag.c{background:#ffeede;color:#c05621}
.lzh{margin-top:10px;text-align:left;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font:500 clamp(15px,1.8vw,19px)/1.6 var(--zh);color:#5d5646}

.len{display:flex;flex-direction:column;gap:6px;align-items:center;margin:6px 0}

.len button:before{content:"🔊 ";font-size:.8em}
.namecard{display:inline-block;font:800 clamp(40px,7vw,80px) var(--en);background:#fff;border:5px dashed var(--pink);border-radius:26px;padding:8px 40px;margin:6px 0;color:#b23a5c;min-width:300px}

.pair{margin-top:8px;font:600 clamp(16px,2vw,21px)/1.6 var(--en);background:#fff;border-radius:14px;padding:6px 14px;display:inline-block;text-align:left}
.pair span{display:block;font:700 15px var(--zh);color:#b23a5c}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}

.rule.seen{border-color:var(--ok);background:var(--ok-soft)}
.rule .ic{font-size:56px;display:block;line-height:1.1}.rule b{display:block;font-size:clamp(17px,2vw,23px);white-space:pre-line;line-height:1.15}.rule small{font:600 14px var(--zh);color:#6b6455}
.mt{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}

.mtl{display:flex;justify-content:space-between;font:800 18px var(--en)}
.medal{font-size:110px;line-height:1;animation:wob 1.4s infinite}
.stars{font-size:56px;color:#f0a000;letter-spacing:6px}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(#fff8 0,#0000 60%),linear-gradient(#7cc6f0,#bfe6ff 60%,#9ad66b 60%);padding:20px}
#title h1{font-size:clamp(44px,8vw,104px);margin:0;line-height:1;color:#fff;text-shadow:0 5px 0 #f0708f,0 8px 18px #0004}
#title .sub{font:700 clamp(18px,2.4vw,28px) var(--zh);color:#3a5a2a}
#title .cow{font-size:clamp(70px,12vw,140px);animation:bob 1.8s infinite}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.modes button{width:min(320px,80vw);background:#fff;border:4px solid var(--line);border-radius:24px;padding:14px;cursor:pointer;box-shadow:0 6px 0 #0002;text-align:center}
.modes b{display:block;font-size:30px}.modes span{display:block;font:800 20px var(--zh);color:#b23a5c}.modes small{display:block;font:500 15px var(--zh);color:#6b6455;margin-top:4px}
#load{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#bfe6ff;font:800 28px var(--en)}
#load .bar{width:min(420px,80vw);height:18px;border-radius:999px;background:#fff;overflow:hidden;border:3px solid var(--line)}
#load .bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
#fade{position:fixed;inset:0;background:#fff;z-index:15;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
.conf{position:fixed;top:-60px;font-size:44px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#homeDrawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--cream);z-index:25;transform:translateX(105%);transition:transform .35s;box-shadow:-10px 0 30px #0003;overflow-y:auto;padding:18px}
#homeDrawer.on{transform:none}
.hdTop{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hdTop h2{flex:1;margin:0;font-size:26px}.hdTop h2 small{display:block;font:600 15px var(--zh);color:#6b6455}
.hdTop button{font-size:22px;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 12px;cursor:pointer}
.hdBig button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;cursor:pointer}
.hdBig i{font-style:normal;font-size:40px}.hdBig b{display:block;font-size:22px}.hdBig small{font:500 15px var(--zh);color:#6b6455}
.hdP{font:500 17px/1.6 var(--zh)}.hdEn{font:800 24px var(--en);margin:6px 0}
.hdBtn{display:inline-block;font:800 20px var(--zh);background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;text-decoration:none;color:var(--ink)}
.hdBtn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.hdNote{margin-top:12px;font:500 15px/1.6 var(--zh);background:#fff4d6;border-radius:12px;padding:8px 12px}
.stampBox{display:flex;gap:14px;align-items:center;margin:10px 0}
.stamp{width:110px;height:110px;border-radius:50%;border:5px dashed #ccc;display:grid;place-items:center;font:800 18px var(--en);text-align:center;color:#aaa}
.stamp.got{border-color:var(--pink);color:var(--pink);background:#fff;transform:rotate(-8deg)}
.rcp{background:#fff;border-radius:16px;padding:10px 14px;margin:10px 0}.rcp h3{margin:0;font-size:22px}.rcp h3 small{font:600 16px var(--zh);margin-left:8px}
.rcp .tg{display:inline-block;font:700 13px var(--zh);background:#e7f8ec;color:#2f855a;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0}.rcp .tg.adult{background:#ffe3e3;color:#c53030}
.rcp li{font:500 16px/1.6 var(--zh)}
.hdAllergy{font:700 16px/1.6 var(--zh);background:#ffe3e3;color:#9b2c2c;border-radius:12px;padding:8px 12px}
#credit{position:fixed;right:10px;bottom:6px;font:500 11px var(--zh);color:#fff;text-shadow:0 1px 2px #0008;z-index:4}
#rot{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:#000a;color:#fff;font:600 15px var(--zh);padding:7px 14px;border-radius:12px;z-index:6;white-space:nowrap}
@media (max-width:700px),(max-height:500px){
 #goal{padding:5px 12px;top:8px;max-width:50vw}#goal b{font-size:16px}#goal small{font-size:12px}
 #hud{top:auto;bottom:8px;left:8px}#hud button,#hud .chip{font-size:14px;padding:5px 8px}
 #homeTab{font-size:14px;padding:6px 10px;top:8px;right:8px}
 #help,#credit{display:none}
 #panel{padding:10px 12px;border-radius:20px;bottom:6px;max-height:60vh}
 .opts{gap:8px}.opt{padding:7px 12px;min-width:110px}.btn{padding:8px 18px}
 #zoom{right:6px}#zoom button{width:44px;height:44px;font-size:24px}
 .lab{font-size:15px;padding:4px 10px}.lab small{display:none}
 .card{width:110px}.card .ic{font-size:40px}.card b{font-size:17px}
 .rgrid{grid-template-columns:repeat(2,1fr)}.rule .ic{font-size:40px}
 .spk .ava{font-size:40px}
}
@media (max-height:500px) and (orientation:landscape){#panel{left:auto;right:58px;transform:none;width:min(560px,52vw);max-height:80vh;bottom:8px}#panel.on{animation:none}.q{font-size:22px}.say{font-size:19px}.zhl{font-size:14px}.namecard{font-size:30px;min-width:180px;padding:4px 18px}.bigic{font-size:40px}.opt{font-size:19px}.btn{font-size:17px}.spk .ava{display:none}.card{width:92px}.card .ic{font-size:32px}.card b{font-size:15px}.rule .ic{font-size:30px}.fill{font-size:21px}}
@media (max-width:500px) and (orientation:portrait){#rot{display:block}}
@media (min-width:1800px){#panel{width:1320px;padding:26px 40px}.q{font-size:52px}.say{font-size:42px}.opt{font-size:40px;padding:16px 34px}.btn{font-size:34px}.zhl{font-size:27px}
 #goal b{font-size:30px}#goal small{font-size:19px}.lab{font-size:26px}#zoom button{width:80px;height:80px;font-size:40px}#hud button,#hud .chip,#homeTab{font-size:24px}.card{width:200px}.card .ic{font-size:72px}.card b{font-size:28px}}
</style>

<body>
<div id="load"><div>🐮 Loading Olimomo's Farm…</div><div class="bar"><i id="loadBar"></i></div><small style="font:600 16px var(--zh)">牧場準備中</small></div>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud"><div class="chip" id="prog">⭐ 0 / 4</div><button id="modeChip">🎓<small>上課</small></button><button id="mute" aria-label="sound">🔊</button><button id="fs" aria-label="fullscreen">⛶</button></div>
<div id="goal"><b id="goalEn"></b><small id="goalZh"></small></div>
<button id="homeTab" type="button">🏠 回家任務<small>Home missions</small></button>
<aside id="homeDrawer"><div id="hdIn"></div></aside>
<div id="zoom"><button id="zin" aria-label="zoom in">＋</button><button id="zout" aria-label="zoom out">－</button></div>

<div id="fade"></div>
<div id="title" style="display:none">
  <div class="cow">🐮🎈</div>
  <h1>Olimomo's Farm</h1>
  <div class="sub">哞力全開英語營 · 乳此美好　3D 牧場</div>
  <div class="modes">
    <button type="button" data-m="class"><b>🎓 Class</b><span>上課模式</span><small>營隊上課用：基本題目，老師帶著走</small></button>
    <button type="button" data-m="explore"><b>🧭 Explore</b><span>探索模式</span><small>回家自己玩：基本題＋Learn more 知識卡＋進階題</small></button>
  </div>
  <small style="font:600 15px var(--zh);color:#3a5a2a">玩到一半也可以按左上角換模式</small>
</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "./lib/GLTFLoader.js";
import * as SU from "./lib/SkeletonUtils.js";
import * as C from "./content.js";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== 裝置 ===== */
const TOUCH=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;
const SMALL=Math.min(innerWidth,innerHeight)<600;
const LOW=SMALL||(TOUCH&&(navigator.hardwareConcurrency||4)<=4);
$("help").textContent=TOUCH?"👆 點地面走路　單指拖曳轉視角　兩指縮放":"🖱️ 點地面走路　拖曳轉視角　滾輪縮放　WASD／方向鍵";

/* ===== 聲音：微軟語音 mp3（audio/<hash>.mp3），沒有就用瀏覽器朗讀 ===== */
const hsh=t=>{let x=5381;for(const c of t.trim())x=((x<<5)+x+c.codePointAt(0))>>>0;return x.toString(36)};
let AUD=new Set(),muted=false,cur=null,voice=null;
fetch("audio/manifest.json").then(r=>r.json()).then(a=>AUD=new Set(a)).catch(()=>{});
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/Samantha|Google US|Jenny|Aria|Ana/i.test(x.name))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopVoice(){if(cur){cur.pause();cur=null}try{speechSynthesis.cancel()}catch(_){}}
function say(t){stopVoice();if(muted||!t)return Promise.resolve();const k=hsh(t);
 if(AUD.has(k))return new Promise(res=>{const a=new Audio("audio/"+k+".mp3");cur=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res())});
 return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=.85;u.pitch=1.2;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch(_){res()}})}
let actx=null;
function sfx(type){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.07;
 if(type==="ok"){o.frequency.value=660;o.frequency.setValueAtTime(880,c.currentTime+.1);o.frequency.setValueAtTime(1175,c.currentTime+.2)}else if(type==="no"){o.type="triangle";o.frequency.value=240;o.frequency.setValueAtTime(180,c.currentTime+.12)}else o.frequency.value=520;
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36)}catch(_){}}
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";if(muted)stopVoice()};
$("fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
function confetti(n=26){const em=["⭐","🎉","🐮","🌼","🥛","💖","🌈"];for(let i=0;i<n;i++){const d=document.createElement("div");d.className="conf";d.textContent=em[i%em.length];d.style.left=Math.random()*100+"vw";d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function toast(t){const d=document.createElement("div");d.textContent=t;Object.assign(d.style,{position:"fixed",top:"70px",left:"50%",transform:"translateX(-50%)",background:"#000b",color:"#fff",font:"600 16px var(--zh)",padding:"8px 16px",borderRadius:"12px",zIndex:50});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ===== 模式 ===== */
let MODE="class";
const setMode=m=>{MODE=m;$("modeChip").innerHTML=m==="explore"?"🧭<small>探索</small>":"🎓<small>上課</small>"};
$("modeChip").onclick=()=>{setMode(MODE==="class"?"explore":"class");toast(MODE==="explore"?"探索模式：會出現 Learn more 知識卡和進階題":"上課模式：只有基本題目")};

/* ===== 3D 基本 ===== */
const renderer=new THREE.WebGLRenderer({canvas:$("c"),antialias:!LOW,powerPreference:"high-performance"});

  critters.forEach(f=>f(t,dt));farm.clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>200)c.position.x=-200});
  C.STATIONS.forEach(s=>{const k=done.has(s.id)?1:1+Math.sin(t*3)*.12;s.ring.scale.set(k,k,k)});farm.cring.visible=!!farm.enterClass;farm.cring.scale.setScalar(1+Math.sin(t*3)*.12);
  if(camMode==="map"){const c=mapFocus||tmp.set(0,0,14);camera.position.lerp(new THREE.Vector3(c.x,mapFocus?30:118,c.z+(mapFocus?26:34)),Math.min(1,dt*2));camera.lookAt(c)}
  else{camT.lerp(v3.set(o.position.x,1.8,o.position.z),Math.min(1,dt*6));camera.position.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(camT)}
  sun.position.set(o.position.x+40,70,o.position.z+30);sun.target.position.copy(o.position)}
 else if(active===room){animOli(room.oli,t,false);room.oli.rotation.y=.3+Math.sin(t*.8)*.12}
 updLabels();if(active)renderer.render(active.scene,camera)}

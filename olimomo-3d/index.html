<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Olimomo's Farm 3D 哞力全開英語營</title>
<style>
:root{--cream:#FFF8EA;--line:#F3D9B5;--pink:#F0708F;--pink-soft:#FFE3EC;--ink:#2F3A2A;--ok:#3E9E5B;--ok-soft:#DDF2E2;--no:#D9534F;--no-soft:#FBE1DF;
--en:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;--zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9cd3f0;font-family:var(--en);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font-family:inherit;color:inherit}
.lab{position:fixed;left:0;top:0;transform:translate(-50%,-100%);cursor:pointer;background:var(--cream);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font:800 20px var(--en);box-shadow:0 4px 0 #0002;white-space:nowrap;display:none;z-index:3}
.lab small{font:600 15px var(--zh);margin-left:6px;color:#6b6455}
.lab i{font-style:normal;color:var(--ok)}
.lab.done{background:var(--ok-soft);border-color:var(--ok)}
.lab.next{border-color:var(--pink);background:#fff;animation:pulse 1.1s infinite}
.lab.big{font-size:26px;padding:10px 22px;background:#fff3a8;border-color:#f6b93b}
@keyframes pulse{50%{transform:translate(-50%,-112%) scale(1.06)}}
#hud{position:fixed;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:6}
#hud button,#hud .chip{font:800 18px var(--en);background:var(--cream);border:3px solid var(--line);border-radius:14px;padding:7px 12px;cursor:pointer}
#modeChip small{font:600 13px var(--zh);margin-left:4px}
#goal{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--cream);border:3px solid var(--line);border-radius:18px;padding:8px 22px;text-align:center;z-index:5;max-width:56vw;display:none}
#goal b{font-size:22px}#goal small{display:block;font:500 15px var(--zh);color:#6b6455}
#homeTab{position:fixed;right:12px;top:12px;z-index:6;font:800 18px var(--en);background:var(--pink);color:#fff;border:0;border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 #c74d6c;cursor:pointer}
#homeTab small{display:block;font:600 12px var(--zh)}
#help{position:fixed;left:12px;bottom:12px;font:500 14px var(--zh);color:#fff;text-shadow:0 1px 3px #0009;z-index:4}
#zoom{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px;z-index:5}
#zoom button{width:56px;height:56px;font:800 30px var(--en);background:var(--cream);border:3px solid var(--line);border-radius:50%;cursor:pointer;box-shadow:0 4px 0 #0002}
#panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(1000px,94vw);max-height:56vh;overflow-y:auto;background:linear-gradient(#fffdf6,#fff3e0);border:4px solid var(--line);border-radius:28px;box-shadow:0 10px 0 #0002;padding:18px 26px 16px;text-align:center;z-index:10;display:none}
#panel.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}
.spk{display:flex;align-items:center;gap:14px;text-align:left}
.spk .ava{font-size:54px;line-height:1;flex:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tag{display:inline-block;font:800 17px var(--en);background:var(--pink-soft);color:#b23a5c;border-radius:999px;padding:4px 16px}
.tag.bonus{background:#fff1b8;color:#9a6b00}
.q{font-size:clamp(26px,3.8vw,42px);margin:6px 0;line-height:1.15;font-weight:800}
.say{font-size:clamp(22px,3vw,34px);line-height:1.3;margin:4px 0}
.zhl{font:500 clamp(16px,2vw,21px)/1.45 var(--zh);color:#5d5646;margin-top:4px}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.opt{font:800 clamp(22px,3vw,32px) var(--en);background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 22px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;gap:10px;min-width:150px;justify-content:center}
.opt .ic{font-size:1.5em;line-height:1}
.opt.ok,.opt.ok:disabled{background:var(--ok-soft);border-color:var(--ok);transform:scale(1.06);opacity:1}
.opt.no{background:var(--no-soft);border-color:var(--no);opacity:.45}
.opt:disabled{opacity:.45;cursor:default}
.opt.pick{border-color:var(--pink);background:var(--pink-soft)}
.fb{font:800 clamp(20px,2.6vw,30px) var(--en);min-height:34px}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.btn{font:800 clamp(20px,2.6vw,28px) var(--en);border:0;border-radius:999px;padding:11px 30px;background:#fff;box-shadow:0 5px 0 var(--line);cursor:pointer;margin:4px}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #c74d6c}
.btn.sm{font-size:18px;padding:7px 18px}
.bigic{font-size:clamp(56px,8vw,100px);line-height:1;display:inline-block;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.08)}}
.fill{font-size:clamp(24px,3.4vw,40px);font-weight:800;margin:6px 0}
.fill .slot{display:inline-block;min-width:120px;border-bottom:5px dashed var(--pink);color:var(--pink);padding:0 6px}
.cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.card{width:150px;background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 6px;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.card .ic{font-size:54px;line-height:1.1;display:block}.card b{display:block;font-size:22px}.card small{font:600 15px var(--zh);color:#6b6455}
.card.seen{border-color:var(--ok);background:var(--ok-soft)}
.ltag{display:inline-block;margin-top:4px;font:700 12px var(--zh);border-radius:999px;padding:2px 8px;background:#eef6ff;color:#2b6cb0}
.ltag.p{background:#e7f8ec;color:#2f855a}.ltag.e{background:#fff4d6;color:#b7791f}.ltag.f{background:#f3e8ff;color:#6b46c1}.ltag.m{background:#e6f6ff;color:#2b6cb0}.ltag.c{background:#ffeede;color:#c05621}
.lzh{margin-top:10px;text-align:left;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font:500 clamp(15px,1.8vw,19px)/1.6 var(--zh);color:#5d5646}
.lzh b{display:block;color:#b23a5c}
.len{display:flex;flex-direction:column;gap:6px;align-items:center;margin:6px 0}
.len button{font:800 clamp(20px,2.6vw,28px) var(--en);background:none;border:0;cursor:pointer;color:var(--ink)}
.len button:before{content:"🔊 ";font-size:.8em}
.namecard{display:inline-block;font:800 clamp(40px,7vw,80px) var(--en);background:#fff;border:5px dashed var(--pink);border-radius:26px;padding:8px 40px;margin:6px 0;color:#b23a5c;min-width:300px}
.wmap{font:800 clamp(24px,3.2vw,36px) var(--en)}
.wmap small{display:block;font:600 18px var(--zh)}
.pair{margin-top:8px;font:600 clamp(16px,2vw,21px)/1.6 var(--en);background:#fff;border-radius:14px;padding:6px 14px;display:inline-block;text-align:left}
.pair span{display:block;font:700 15px var(--zh);color:#b23a5c}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0}
.rule{background:#fff;border:4px solid var(--line);border-radius:22px;padding:10px 6px;cursor:pointer}
.rule.seen{border-color:var(--ok);background:var(--ok-soft)}
.rule .ic{font-size:56px;display:block;line-height:1.1}.rule b{display:block;font-size:clamp(17px,2vw,23px);white-space:pre-line;line-height:1.15}.rule small{font:600 14px var(--zh);color:#6b6455}
.mt{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.cup{width:110px;height:140px;border:6px solid #8a5a3c;border-top:0;border-radius:0 0 34px 34px;position:relative;overflow:hidden;background:#fff}
.cup i{position:absolute;left:0;right:0;bottom:0;height:85%;transition:background .3s}
.mt input{width:min(320px,60vw);accent-color:var(--pink)}
.mtl{display:flex;justify-content:space-between;font:800 18px var(--en)}
.medal{font-size:110px;line-height:1;animation:wob 1.4s infinite}
.stars{font-size:56px;color:#f0a000;letter-spacing:6px}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:radial-gradient(#fff8 0,#0000 60%),linear-gradient(#7cc6f0,#bfe6ff 60%,#9ad66b 60%);padding:20px}
#title h1{font-size:clamp(44px,8vw,104px);margin:0;line-height:1;color:#fff;text-shadow:0 5px 0 #f0708f,0 8px 18px #0004}
#title .sub{font:700 clamp(18px,2.4vw,28px) var(--zh);color:#3a5a2a}
#title .cow{font-size:clamp(70px,12vw,140px);animation:bob 1.8s infinite}
.modes{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.modes button{width:min(320px,80vw);background:#fff;border:4px solid var(--line);border-radius:24px;padding:14px;cursor:pointer;box-shadow:0 6px 0 #0002;text-align:center}
.modes b{display:block;font-size:30px}.modes span{display:block;font:800 20px var(--zh);color:#b23a5c}.modes small{display:block;font:500 15px var(--zh);color:#6b6455;margin-top:4px}
.aimg{height:1.7em;width:auto;vertical-align:middle;filter:drop-shadow(0 3px 3px #0002)}
.opt .aimg{height:64px}.card .aimg{height:84px}.bigic .aimg{height:clamp(84px,13vw,150px)}.rule .aimg{height:92px}.ava .aimg{height:72px}.medal .aimg{height:150px}.wmap .aimg{height:110px;border-radius:14px;display:block;margin:0 auto 4px}
#title .cow img{height:clamp(110px,18vw,210px);vertical-align:bottom}
@media (max-width:700px),(max-height:500px){.opt .aimg{height:40px}.card .aimg{height:52px}.bigic .aimg{height:64px}.rule .aimg{height:54px}.ava .aimg{height:46px}.medal .aimg{height:90px}.wmap .aimg{height:70px}#title .cow img{height:90px}}
@media (min-width:1800px){.opt .aimg{height:96px}.card .aimg{height:120px}.rule .aimg{height:130px}}
#load{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#bfe6ff;font:800 28px var(--en)}
#load .bar{width:min(420px,80vw);height:18px;border-radius:999px;background:#fff;overflow:hidden;border:3px solid var(--line)}
#load .bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
#fade{position:fixed;inset:0;background:#fff;z-index:15;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
.conf{position:fixed;top:-60px;font-size:44px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
#homeDrawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--cream);z-index:25;transform:translateX(105%);transition:transform .35s;box-shadow:-10px 0 30px #0003;overflow-y:auto;padding:18px}
#homeDrawer.on{transform:none}
.hdTop{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hdTop h2{flex:1;margin:0;font-size:26px}.hdTop h2 small{display:block;font:600 15px var(--zh);color:#6b6455}
.hdTop button{font-size:22px;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 12px;cursor:pointer}
.hdBig button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;margin:8px 0;cursor:pointer}
.hdBig i{font-style:normal;font-size:40px}.hdBig b{display:block;font-size:22px}.hdBig small{font:500 15px var(--zh);color:#6b6455}
.hdP{font:500 17px/1.6 var(--zh)}.hdEn{font:800 24px var(--en);margin:6px 0}
.hdBtn{display:inline-block;font:800 20px var(--zh);background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;text-decoration:none;color:var(--ink)}
.hdBtn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.hdNote{margin-top:12px;font:500 15px/1.6 var(--zh);background:#fff4d6;border-radius:12px;padding:8px 12px}
.stampBox{display:flex;gap:14px;align-items:center;margin:10px 0}
.stamp{width:110px;height:110px;border-radius:50%;border:5px dashed #ccc;display:grid;place-items:center;font:800 18px var(--en);text-align:center;color:#aaa}
.stamp.got{border-color:var(--pink);color:var(--pink);background:#fff;transform:rotate(-8deg)}
.rcp{background:#fff;border-radius:16px;padding:10px 14px;margin:10px 0}.rcp h3{margin:0;font-size:22px}.rcp h3 small{font:600 16px var(--zh);margin-left:8px}
.rcp .tg{display:inline-block;font:700 13px var(--zh);background:#e7f8ec;color:#2f855a;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0}.rcp .tg.adult{background:#ffe3e3;color:#c53030}
.rcp li{font:500 16px/1.6 var(--zh)}
.hdAllergy{font:700 16px/1.6 var(--zh);background:#ffe3e3;color:#9b2c2c;border-radius:12px;padding:8px 12px}
#credit{position:fixed;right:10px;bottom:6px;font:500 11px var(--zh);color:#fff;text-shadow:0 1px 2px #0008;z-index:4}
#rot{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:70px;background:#000a;color:#fff;font:600 15px var(--zh);padding:7px 14px;border-radius:12px;z-index:6;white-space:nowrap}
@media (max-width:700px),(max-height:500px){
 #goal{padding:5px 12px;top:8px;max-width:50vw}#goal b{font-size:16px}#goal small{font-size:12px}
 #hud{top:auto;bottom:8px;left:8px}#hud button,#hud .chip{font-size:14px;padding:5px 8px}
 #homeTab{font-size:14px;padding:6px 10px;top:8px;right:8px}
 #help,#credit{display:none}
 #panel{padding:10px 12px;border-radius:20px;bottom:6px;max-height:60vh}
 .opts{gap:8px}.opt{padding:7px 12px;min-width:110px}.btn{padding:8px 18px}
 #zoom{right:6px}#zoom button{width:44px;height:44px;font-size:24px}
 .lab{font-size:15px;padding:4px 10px}.lab small{display:none}
 .card{width:110px}.card .ic{font-size:40px}.card b{font-size:17px}
 .rgrid{grid-template-columns:repeat(2,1fr)}.rule .ic{font-size:40px}
 .spk .ava{font-size:40px}
}
@media (max-height:500px) and (orientation:landscape){#panel{left:auto;right:58px;transform:none;width:min(560px,52vw);max-height:80vh;bottom:8px}#panel.on{animation:none}.q{font-size:22px}.say{font-size:19px}.zhl{font-size:14px}.namecard{font-size:30px;min-width:180px;padding:4px 18px}.bigic{font-size:40px}.opt{font-size:19px}.btn{font-size:17px}.spk .ava{display:none}.card{width:92px}.card .ic{font-size:32px}.card b{font-size:15px}.rule .ic{font-size:30px}.fill{font-size:21px}}
@media (max-width:500px) and (orientation:portrait){#rot{display:block}}
@media (min-width:1800px){#panel{width:1320px;padding:26px 40px}.q{font-size:52px}.say{font-size:42px}.opt{font-size:40px;padding:16px 34px}.btn{font-size:34px}.zhl{font-size:27px}
 #goal b{font-size:30px}#goal small{font-size:19px}.lab{font-size:26px}#zoom button{width:80px;height:80px;font-size:40px}#hud button,#hud .chip,#homeTab{font-size:24px}.card{width:200px}.card .ic{font-size:72px}.card b{font-size:28px}}

/* ===== 獎品視窗、點數統計 ===== */
#prize{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:#0004;pointer-events:auto}
#prize.on{display:flex}
#prize .pbox{background:linear-gradient(#fffdf2,#ffe9c7);border:6px solid #ffc93c;border-radius:36px;padding:24px 44px;text-align:center;box-shadow:0 16px 0 #0003;animation:pp .45s cubic-bezier(.2,1.6,.4,1)}
#prize.bad .pbox{border-color:#7fb8ff;background:linear-gradient(#f5fbff,#dcefff)}
@keyframes pp{from{transform:scale(.3) rotate(-12deg);opacity:0}}
#prize img{height:200px;max-width:80vw;object-fit:contain;animation:wob 1.2s infinite}
#prize .pt{font:800 64px var(--en);color:#e0661f}
#prize .pz{font:700 34px var(--zh);color:#5d5646}
#prize .pz b{color:#b23a5c}
#prize .ok{font:800 52px var(--zh);color:#3e9e5b}
#prize.bad .ok{color:#2b6cb0}
#tally{position:fixed;inset:0;z-index:46;display:none;overflow-y:auto;background:radial-gradient(#fff8 0,#0000 60%),linear-gradient(#7cc6f0,#bfe6ff 55%,#9ad66b 55%);text-align:center;padding:24px 16px}
#tally.on{display:block}
#tally h2{font:800 56px var(--zh);margin:10px 0;color:#fff;text-shadow:0 4px 0 #f0708f}
#tally .big{font:800 140px var(--en);color:#ffcf33;text-shadow:0 6px 0 #c47f00,0 10px 24px #0004;line-height:1}
#tally .big small{font-size:56px;color:#fff;text-shadow:0 4px 0 #c47f00}
#tally .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1200px;margin:16px auto}
#tally .grid div{background:#fffc;border-radius:18px;padding:6px;width:120px}
#tally .grid img{height:90px;max-width:100%;object-fit:contain}
#tally .st{font:700 30px var(--zh);color:#2f3a2a;margin:8px}
#tally .cr{font:500 30px var(--zh);color:#3a5a2a;margin-top:18px}
body.pon #goal{display:none!important}
#pts{background:#fff3a8!important;border-color:#f6b93b!important}
#endBtn{background:#e7f8ec!important;border-color:#3e9e5b!important}
/* ===== 字體：其他裝置最小 30px ===== */
.lab,.lab small{font-size:30px}.lab{padding:8px 20px}
#hud button,#hud .chip,#homeTab,#modeChip small{font-size:30px}
#goal{max-width:62vw;top:84px}#goal b{font-size:36px}#goal small{font-size:30px}
#help{font-size:30px}
#zoom button{width:76px;height:76px;font-size:40px}
#panel{width:min(1400px,96vw);max-height:66vh}
.tag{font-size:30px}.q{font-size:48px}.say{font-size:40px}.zhl{font-size:30px}.fb{font-size:36px;min-height:44px}
.opt{font-size:38px;padding:12px 26px}.btn{font-size:36px}.btn.sm{font-size:30px;padding:10px 22px}
.fill{font-size:44px}.fill .slot{min-width:160px}
.card{width:240px}.card b{font-size:34px}.card small{font-size:30px}.ltag{font-size:30px}.lzh{font-size:30px}.len button{font-size:36px}
.namecard{font-size:80px}.wmap{font-size:42px}.wmap small{font-size:30px}.pair,.pair span{font-size:30px}
.rule b{font-size:32px}.rule small{font-size:30px}.mtl{font-size:30px}.rgrid{grid-template-columns:repeat(4,1fr)}
.stars{font-size:70px}
#title .sub{font-size:36px}.modes button{width:min(440px,90vw)}.modes b{font-size:44px}.modes span{font-size:34px}.modes small,#title>small{font-size:30px!important}
#load{font-size:36px}#load small{font-size:30px!important}
#homeDrawer{width:min(820px,100vw)}
.hdTop h2{font-size:40px}.hdTop h2 small,.hdTop button,.hdBig b,.hdBig small,.hdP,.hdEn,.hdBtn,.hdNote,.rcp h3,.rcp h3 small,.rcp .tg,.rcp li,.hdAllergy,.stamp{font-size:30px}
.hdBig i{font-size:56px}.stamp{width:150px;height:150px}
/* ===== 手機：最小 18px（直式、橫式都可用） ===== */
@media (max-width:700px),(max-height:500px){
 .lab,.lab small{font-size:18px}.lab{padding:5px 12px}
 #hud{top:auto;bottom:8px;left:8px;gap:6px;flex-wrap:wrap;max-width:62vw}#hud button,#hud .chip,#modeChip small{font-size:18px;padding:5px 9px}
 #homeTab{font-size:18px;padding:6px 10px;top:8px;right:8px}
 #goal{padding:5px 12px;top:8px;max-width:58vw}#goal b{font-size:19px}#goal small{font-size:18px}
 #help{display:none}
 #zoom button{width:48px;height:48px;font-size:26px}
 #panel{width:96vw;padding:10px 12px;border-radius:20px;bottom:6px;max-height:58vh}
 .tag{font-size:18px}.q{font-size:24px}.say{font-size:21px}.zhl{font-size:18px}.fb{font-size:20px;min-height:26px}
 .opt{font-size:20px;padding:7px 12px;min-width:100px}.btn{font-size:20px;padding:8px 18px}.btn.sm{font-size:18px;padding:6px 14px}

<script type="module">
import * as THREE from "three";
import * as C from "./content.js";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== 裝置 ===== */
const TOUCH=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;
const SMALL=Math.min(innerWidth,innerHeight)<600;
const LOW=SMALL||(TOUCH&&(navigator.hardwareConcurrency||4)<=4);
$("help").textContent=TOUCH?"👆 點地面走路　兩指轉動、縮放":"🖱️ 點地面走路　拖曳轉動";

/* ===== 聲音：微軟語音 mp3（audio/<hash>.mp3），沒有就用瀏覽器朗讀 ===== */
const hsh=t=>{let x=5381;for(const c of t.trim())x=((x<<5)+x+c.codePointAt(0))>>>0;return x.toString(36)};
let AUD=new Set(),muted=false,cur=null,voice=null;
fetch("audio/manifest.json").then(r=>r.json()).then(a=>AUD=new Set(a)).catch(()=>{});
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/Samantha|Google US|Jenny|Aria|Ana/i.test(x.name))||v[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopVoice(){if(cur){cur.pause();cur=null}try{speechSynthesis.cancel()}catch(_){}}
function say(t){stopVoice();if(muted||!t)return Promise.resolve();const k=hsh(t);
 if(AUD.has(k))return new Promise(res=>{const a=new Audio("audio/"+k+".mp3");cur=a;a.onended=a.onerror=()=>res();a.play().catch(()=>res())});
 return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=.85;u.pitch=1.2;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)}catch(_){res()}})}
let actx=null;
function sfx(type){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.07;
 if(type==="ok"){o.frequency.value=660;o.frequency.setValueAtTime(880,c.currentTime+.1);o.frequency.setValueAtTime(1175,c.currentTime+.2)}else if(type==="no"){o.type="triangle";o.frequency.value=240;o.frequency.setValueAtTime(180,c.currentTime+.12)}else o.frequency.value=520;
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36)}catch(_){}}
$("mute").onclick=()=>{muted=!muted;$("mute").textContent=muted?"🔇":"🔊";if(muted){stopVoice();gull.pause()}else if(active===fly)gull.play().catch(()=>{})};
$("fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
function confetti(n=26){const em=["⭐","🎉","🐮","🌼","🥛","💖","🌈"];for(let i=0;i<n;i++){const d=document.createElement("div");d.className="conf";d.textContent=em[i%em.length];d.style.left=Math.random()*100+"vw";d.style.animationDuration=(1.6+Math.random()*1.6)+"s";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function toast(t){const d=document.createElement("div");d.textContent=t;Object.assign(d.style,{position:"fixed",top:"70px",left:"50%",transform:"translateX(-50%)",background:"#000b",color:"#fff",font:"600 16px var(--zh)",padding:"8px 16px",borderRadius:"12px",zIndex:50});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ===== 模式 ===== */
let MODE="class";
const setMode=m=>{MODE=m;$("modeChip").innerHTML=m==="explore"?"🧭<small>探索</small>":"🎓<small>上課</small>"};

/* ===== 3D 基本 ===== */
const renderer=new THREE.WebGLRenderer({canvas:$("c"),antialias:!LOW,powerPreference:"high-performance"});

/* ===== 圖（全部由 Gemini 畫，art/*.webp）===== */
const ART=["olimomo","olimomo_walk","olimomo_yay","cow_holstein","cow_holstein_eat","cow_jersey","calf","calf_jersey","bull","hen","chick","butterfly","barn","classroom","cowshed","parlor","milking_robot","cold_tank","hay_round","hay_stack","feed_trough","water_trough","tree","tree_apple","flowers","fence","gate","balloon","milk_bottles","sun","grass_tile","dirt_tile","classroom_bg","taiwan_map","seagull"];
const TEX={};
const BOARD={x:.5,y:.40,w:.29};   /* 教室背景圖裡黑板的位置（比例） */
async function loadAll(){const L=new THREE.TextureLoader();let n=0;
 await Promise.all(ART.map(async k=>{const t=await L.loadAsync("art/"+k+".webp");t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;TEX[k]=t;n++;$("loadBar").style.width=(n/ART.length*100)+"%"}));
 /* 大門招牌：把字寫進 Gemini 畫的空白招牌 */
 const im=TEX.gate.image,c=document.createElement("canvas");c.width=im.width;c.height=im.height;const g=c.getContext("2d");g.drawImage(im,0,0);
 g.textAlign="center";g.textBaseline="middle";g.fillStyle="#5a3b1c";g.font=`800 ${Math.round(im.width*.075)}px "Baloo 2","Arial Rounded MT Bold",sans-serif`;g.fillText("Olimomo's Farm",im.width*.5,im.height*.225);
 const gt=new THREE.CanvasTexture(c);gt.colorSpace=THREE.SRGBColorSpace;TEX.gate=gt;
 /* 教室黑板寫上歡迎詞 */
 const bi=TEX.classroom_bg.image,c2=document.createElement("canvas");c2.width=bi.width;c2.height=bi.height;const g2=c2.getContext("2d");g2.drawImage(bi,0,0);g2.textAlign="center";g2.textBaseline="middle";
 const BX=bi.width*BOARD.x,BY=bi.height*BOARD.y,BW=bi.width*BOARD.w;g2.fillStyle="#ffffff";g2.font=`800 ${Math.round(BW*.085)}px "Baloo 2","Arial Rounded MT Bold",sans-serif`;g2.fillText("Welcome to",BX,BY-BW*.11);
 g2.fillStyle="#ffe066";g2.font=`800 ${Math.round(BW*.12)}px "Baloo 2","Arial Rounded MT Bold",sans-serif`;g2.fillText("Olimomo's Farm!",BX,BY+BW*.01);
 g2.fillStyle="#ffd3e0";g2.font=`700 ${Math.round(BW*.055)}px "PingFang TC","Noto Sans TC",sans-serif`;g2.fillText("哞力全開英語營 · 乳此美好",BX,BY+BW*.12);
 const ct=new THREE.CanvasTexture(c2);ct.colorSpace=THREE.SRGBColorSpace;TEX.classroom_bg=ct}
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
function mesh(geo,m,x=0,y=0,z=0,cast=true){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;return o}
function canvasTex(w,h,draw,rep){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);t.colorSpace=THREE.SRGBColorSpace;return t}
function skyTex(top,mid,bot){return canvasTex(2,256,g=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,top);gr.addColorStop(.6,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,2,256)})}
function lights(scene){scene.add(new THREE.HemisphereLight(0xffffff,0x9fd07a,2.2));const s=new THREE.DirectionalLight(0xfff3df,1.2);s.position.set(40,70,30);scene.add(s,s.target);return s}
/* 地上的圓形影子 */
const blobTex=canvasTex(128,128,g=>{const r=g.createRadialGradient(64,64,4,64,64,62);r.addColorStop(0,"rgba(40,60,20,.45)");r.addColorStop(1,"rgba(40,60,20,0)");g.fillStyle=r;g.fillRect(0,0,128,128)});
blobTex.wrapS=blobTex.wrapT=THREE.ClampToEdgeWrapping;
/* 立牌：Gemini 圖做成永遠面向鏡頭的 3D 立牌，腳底踩在地上 */
function stand(name,h,{shadow=true,fog=true}={}){const t=TEX[name],a=t.image.width/t.image.height;
 const m=new THREE.SpriteMaterial({map:t,alphaTest:.12,fog});const s=new THREE.Sprite(m);s.center.set(.5,.02);s.scale.set(h*a,h,1);
 const g=new THREE.Group();g.add(s);
 if(shadow){const b=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:blobTex,transparent:true,depthWrite:false}));b.rotation.x=-Math.PI/2;b.position.y=.04;b.scale.set(h*a*.8,h*.45,1);g.add(b)}
 g.userData={spr:s,h,a,name,face:1,base:name};return g}
function setArt(o,name){const u=o.userData,t=TEX[name];if(u.name===name)return;u.name=name;u.spr.material.map=t;u.a=t.image.width/t.image.height;u.spr.scale.x=u.h*u.a*u.face}
const camRight=new THREE.Vector3();
/* 依照螢幕方向決定朝左或朝右（圖都是朝右畫的） */
function faceBy(o,dx,dz){camRight.setFromMatrixColumn(camera.matrixWorld,0);const d=dx*camRight.x+dz*camRight.z;if(Math.abs(d)<.02)return;const f=d>=0?1:-1;const u=o.userData;if(u.face!==f){u.face=f;u.spr.scale.x=u.h*u.a*f}}
/* 走路／發呆的彈跳 */
function bounce(o,t,moving,k=1){const s=o.userData.spr,ph=o.userData.ph||0;
 if(moving){s.position.y=Math.abs(Math.sin(t*9*k+ph))*.18*o.userData.h*.12;s.material.rotation=Math.sin(t*9*k+ph)*.06}
 else{s.position.y=0;s.material.rotation*=.85;const sq=1+Math.sin(t*2.2+ph)*.018;s.scale.y=o.userData.h*sq}}

const COWART={holstein:"cow_holstein",jersey:"cow_jersey",calf:"calf",calf_jersey:"calf_jersey",bull:"bull"};
const COWH={holstein:2.6,jersey:2.5,calf:1.7,calf_jersey:1.6,bull:2.8};
function makeCow(kind="holstein"){const o=stand(COWART[kind],COWH[kind]);o.userData.kind=kind;o.userData.ph=rnd(0,30);o.userData.state="Idle";return o}
/* 狀態：Idle／Walk／Eating（荷蘭牛吃草換成低頭吃草的圖） */
function play(c,name){const u=c.userData;if(u.state===name)return;u.state=name;if(u.kind==="holstein")setArt(c,name==="Eating"?"cow_holstein_eat":"cow_holstein")}
function makeOli(h=2.6){const o=stand("olimomo",h);o.userData.body=o.userData.spr;o.userData.ph=0;return o}
function animOli(o,t,moving){setArt(o,moving?"olimomo_walk":"olimomo");bounce(o,t,moving,1)}
function cloud(){const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xffffff});for(let i=0;i<5;i++)g.add(mesh(new THREE.SphereGeometry(rnd(2.2,3.6),14,10),m,i*2.6-5,rnd(-.6,.8),rnd(-1,1),false));g.scale.setScalar(rnd(.8,1.4));return g}
function textTex(lines,w=1024,h=256,bg="#fff8ea",fg="#2f3a2a"){return canvasTex(w,h,g=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.textAlign="center";g.textBaseline="middle";lines.forEach(([t,size,y,col])=>{g.fillStyle=col||fg;g.font=`800 ${size}px "Baloo 2","Arial Rounded MT Bold","PingFang TC",sans-serif`;g.fillText(t,w/2,y)})})}

/* ===== 場景 1：熱氣球飛越台灣（地面是 Gemini 畫的台灣地圖）===== */
const fly={scene:new THREE.Scene()};
const MAPW=170,MAPH=MAPW*572/1024;
const mp=(px,py)=>new THREE.Vector3((px/1024-.5)*MAPW,0,(py/572-.5)*MAPH);
function buildFly(){const S=fly.scene;S.background=skyTex("#5fb6ee","#a9dcf7","#dff3ff");S.fog=new THREE.Fog(0xcfeaf8,170,420);lights(S);
 const sea=mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshBasicMaterial({color:0x3aa6e6}),0,-.2,0,false);sea.rotation.x=-Math.PI/2;S.add(sea);
 const map=mesh(new THREE.PlaneGeometry(MAPW,MAPH),new THREE.MeshBasicMaterial({map:TEX.taiwan_map}),0,0,0,false);map.rotation.x=-Math.PI/2;S.add(map);
 fly.lun=mp(448,250);fly.tp=mp(706,74);
 const barn=stand("barn",4.5,{shadow:false});barn.position.copy(fly.lun).add(new THREE.Vector3(2.2,0,-1.2));S.add(barn);
 const cw=stand("cow_holstein",3,{shadow:false});cw.position.copy(fly.lun).add(new THREE.Vector3(-2.4,0,1));S.add(cw);
 const ring=mesh(new THREE.TorusGeometry(5,.45,10,40),new THREE.MeshBasicMaterial({color:0xfff176}),fly.lun.x,.4,fly.lun.z,false);ring.rotation.x=Math.PI/2;ring.visible=false;S.add(ring);fly.ring=ring;
 fly.clouds=[];for(let i=0;i<12;i++){const c=cloud();const a=rnd(0,6.28),r=rnd(60,110);c.position.set(Math.cos(a)*r,rnd(24,36),Math.sin(a)*r*.6);S.add(c);fly.clouds.push(c)}
 const sun=stand("sun",30,{shadow:false,fog:false});sun.position.set(-70,60,-120);S.add(sun);
 const bal=new THREE.Group();const bs=stand("balloon",14,{shadow:false});bal.add(bs);const ol=stand("olimomo_yay",3.4,{shadow:false});ol.position.set(0,.6,0);ol.userData.spr.renderOrder=2;ol.userData.spr.material.depthTest=false;bal.add(ol);
 S.add(bal);fly.bal=bal;fly.oli=ol;
 const path=[fly.tp,mp(650,120),mp(560,170),mp(500,215),fly.lun].map(v=>new THREE.Vector3(v.x,16,v.z));
 fly.curve=new THREE.CatmullRomCurve3(path);bal.position.copy(path[0]);fly.tpLab=[fly.tp];
 fly.tgt=new THREE.Vector3();fly.look=new THREE.Vector3();
 /* 海鷗（Gemini 畫的）在海上繞圈飛 */
 fly.gulls=[];[[-70,-10,26,.16,16],[70,10,30,-.13,20],[-40,40,22,.2,14],[60,-35,24,.18,18],[0,52,28,-.15,15],[-75,-40,34,.12,22],[80,40,20,.22,16]].forEach(([cx,cz,r,sp,y],i)=>{const g=stand("seagull",4.2,{shadow:false});g.userData.cx=cx;g.userData.cz=cz;g.userData.r=r;g.userData.sp=sp;g.userData.y=y;g.userData.ph=i*1.7;S.add(g);fly.gulls.push(g)})}

/* ===== 場景 2：牧場 ===== */
const farm={scene:new THREE.Scene()};const F=farm.scene;
const STPOS={calf:[26,12],hay:[-26,12],yard:[-26,-30],milk:[26,-30]};
const PLACEPOS={cows:[-26,-30],plant:[38,32],hay:[-26,12],milking:[26,-30],machine:[22,-35],calf:[26,12],classroom:[-14,30]};
const CLASSDOOR=new THREE.Vector3(-14,0,36);
let sun;const critters=[];const cows=[];
function buildFarm(){F.background=skyTex("#5fb6ee","#a9dcf7","#e8f6ff");F.fog=new THREE.Fog(0xd6eefa,90,240);sun=lights(F);
 const gt=TEX.grass_tile.clone();gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(60,60);gt.needsUpdate=true;
 const ground=mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({map:gt}),0,0,0,false);ground.rotation.x=-Math.PI/2;F.add(ground);
 const path=(x,z,w,d)=>{const t=TEX.dirt_tile.clone();t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/6,d/6);t.needsUpdate=true;const p=mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({map:t}),x,.03,z,false);p.rotation.x=-Math.PI/2;F.add(p)};
 path(0,0,6,100);path(0,12,58,5);path(0,-30,58,5);path(-26,-9,5,46);path(26,-9,5,46);path(-7,36,14,4);
 const put=(name,h,x,z,o={})=>{const s=stand(name,h,o);s.position.set(x,0,z);if(o.flip){s.userData.face=-1;s.userData.spr.scale.x*=-1}F.add(s);return s};
 /* 樹 */
 for(let i=0;i<(LOW?36:60);i++){const a=rnd(0,6.28),r=rnd(66,115);put(Math.random()<.35?"tree_apple":"tree",rnd(10,15),Math.cos(a)*r,Math.sin(a)*r)}
 [[-26,54],[16,56],[-42,42],[44,44],[-45,-56],[46,-54],[0,-76],[-20,-72],[20,-70],[-46,0],[46,-6]].forEach(([x,z],i)=>put(i%3?"tree":"tree_apple",rnd(8,11),x,z));
 /* 花 */
 const freeSpot=(x,z)=>!(Math.abs(x)<4.5||Math.abs(z-12)<4||Math.abs(z+30)<4||(Math.abs(Math.abs(x)-26)<4&&z>-34&&z<14)||(Math.abs(x-26)<10&&Math.abs(z-12)<8)||(Math.abs(x+26)<16&&Math.abs(z+30)<13)||(Math.abs(x-26)<11&&Math.abs(z+30)<7)||(Math.abs(x+14)<7&&Math.abs(z-31)<8)||(Math.abs(x+30)<10&&Math.abs(z-12)<9));

 const fillHTML=()=>{let s=sent();if(pick)s=s.replace(pick,`<span class="slot">${pick}</span>`);return s.replace(/___/g,`<span class="slot">&nbsp;</span>`)};
 panel(`<span class="tag">${tag}</span><div class="q">${p.q}</div>`+(p.mix?`<div class="mt"><div class="cup"><i id="cupI"></i></div><div><div class="mtl"><span>☕ More tea</span><span>More milk 🥛</span></div><input type="range" id="mx" min="0" max="100" value="50"></div></div>`:"")
  +`<div class="fill" id="f">${fillHTML()}</div><div class="opts" id="o"></div><div><button class="btn sm" id="h">🔊 Listen</button><button class="btn sm" id="m">🎤 Try it!</button><button class="btn pink" id="nx" ${p.chips?'style="display:none"':""}>Next ▶</button></div><div class="fb" id="fb"></div><div class="zhl">${p.zh}</div>`);
 say(p.ask);
 const cup=()=>{const k=mixV/100;$("cupI").style.background=`rgb(${Math.round(150+105*k)},${Math.round(85+160*k)},${Math.round(45+180*k)})`};
 if(p.mix){cup();$("mx").oninput=e=>{mixV=+e.target.value;cup();$("f").innerHTML=fillHTML()};$("mx").onchange=()=>say(mixV>=50?"More milk!":"More black tea!")}
 (p.chips||[]).forEach(w=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="ic">${WIMG[w]?IMG(WIMG[w]):(C.WICON[w]||"💬")}</span>${w}`;b.onclick=()=>{pick=w;P.querySelectorAll("#o .opt").forEach(x=>x.classList.toggle("pick",x===b));$("f").innerHTML=fillHTML();$("nx").style.display="";say(sent())};$("o").appendChild(b)});
 $("h").onclick=()=>say(pick||!p.chips?sent():p.ask);
 $("m").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,fb=$("fb");
  if(p.chips&&!pick){fb.textContent="先選一張卡！";fb.className="fb no";return}
  if(!SR){fb.textContent="大聲說出來就很棒了！👏";fb.className="fb ok";return}
  const r=new SR();r.lang="en-US";fb.textContent="🎤 Listening…";fb.className="fb";
  r.onresult=e=>{const said=e.results[0][0].transcript.toLowerCase(),ws=sent().toLowerCase().replace(/[^a-z' ]/g,"").split(" ").filter(w=>w.length>2),hit=ws.filter(w=>said.includes(w)).length,ok=hit>=Math.ceil(ws.length/2);fb.textContent=ok?"⭐ Great job! 說得很好！":"Try again! 再說一次（I heard: "+said+"）";fb.className="fb "+(ok?"ok":"no");if(ok){sfx("ok");confetti(14);say("Great job!")}};
  r.onerror=()=>{fb.textContent="聽不到聲音，再試一次。";fb.className="fb no"};r.start()};
 await click("nx")}

const clock=new THREE.Clock(),tmp=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

 if(active===fly){const b=fly.bal;
  if(flyT>=0&&flyT<1){flyT=Math.min(1,flyT+dt/9);const p=fly.curve.getPointAt(flyT);b.position.copy(p);const ah=fly.curve.getPointAt(Math.min(1,flyT+.02));b.rotation.y=Math.atan2(ah.x-p.x,ah.z-p.z)}
  b.position.y=16+Math.sin(t*2)*.5;if(flyT>=1)fly.ring.scale.setScalar(1+Math.sin(t*4)*.12);
  /* 鏡頭繞著目標轉（單指拖曳、兩指旋轉縮放都可以） */
  const tg=flyT<0?fly.tgt.set(0,0,0):(flyT<1?fly.tgt.copy(b.position).setY(11):fly.tgt.copy(fly.lun));
  const fd=fDist*(camera.aspect<1?1.75:1);const cp=tmp.set(tg.x+Math.sin(fYaw)*Math.cos(fPitch)*fd,tg.y+Math.sin(fPitch)*fd,tg.z+Math.cos(fYaw)*Math.cos(fPitch)*fd);
  camera.position.lerp(cp,Math.min(1,dt*3));fly.look.lerp(tg,Math.min(1,dt*3));camera.lookAt(fly.look);
  fly.gulls.forEach(g=>{const u=g.userData,a=t*u.sp+u.ph,x=u.cx+Math.cos(a)*u.r,z=u.cz+Math.sin(a)*u.r*.7;faceBy(g,x-g.position.x,z-g.position.z);g.position.set(x,u.y+Math.sin(t*1.3+u.ph)*1.5,z);u.spr.scale.y=u.h*(.72+.28*Math.abs(Math.sin(t*7+u.ph)))});
  fly.clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>110)c.position.x=-110});bounce(fly.oli,t,false)}
 else if(active===farm){const o=farm.oli;let mx=0,mz=0,moving=false;
  if(!locked){if(keys.w||keys.arrowup)mz-=1;if(keys.s||keys.arrowdown)mz+=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1}
  const step=(dx,dz)=>{const sp=8*dt;o.position.x=Math.max(-50,Math.min(50,o.position.x+dx*sp));o.position.z=Math.max(-78,Math.min(56,o.position.z+dz*sp));faceBy(o,dx,dz);moving=true};
  if(mx||mz){target=null;const l=Math.hypot(mx,mz);mx/=l;mz/=l;const sy=Math.sin(yaw),cy=Math.cos(yaw);step(mx*cy+mz*sy,-mx*sy+mz*cy)}
  else if(target){const dx=target.x-o.position.x,dz=target.z-o.position.z,d=Math.hypot(dx,dz);if(d<.35){target=null;const cb=onArrive;onArrive=null;if(cb)cb()}else step(dx/d,dz/d)}
  animOli(o,t,moving);
  if(!locked&&!busy){if(!done.has("class")&&Math.hypot(o.position.x-CLASSDOOR.x,o.position.z-CLASSDOOR.z)<2.6)runClass();
   else for(const s of C.STATIONS){if(done.has(s.id))continue;const [x,z]=STPOS[s.id];if(Math.hypot(o.position.x-x,o.position.z-z)<2.6){runStation(s);break}}}
  cows.forEach(c=>{const u=c.userData;if(!u.wander||u.eat)return;u.ph+=dt;const cyc=(u.ph*.08)%1;
   if(cyc<.45){const a=u.ph*.18,tx=u.wander.cx+Math.cos(a)*u.wander.r,tz=u.wander.cz+Math.sin(a*1.3)*u.wander.r*.7,dx=tx-c.position.x,dz=tz-c.position.z,d=Math.hypot(dx,dz);if(d>.1){play(c,"Walk");const sp=Math.min(d,.9*dt);c.position.x+=dx/d*sp;c.position.z+=dz/d*sp;}else play(c,"Idle")}
   else play(c,cyc<.75?"Eating":"Idle")});
  cows.forEach(c=>{const u=c.userData,lp=u.lp||(u.lp=c.position.clone());faceBy(c,c.position.x-lp.x,c.position.z-lp.z);lp.copy(c.position);bounce(c,t,u.state==="Walk",.6)});
  critters.forEach(f=>f(t,dt));farm.clouds.forEach(c=>{c.position.x+=dt*1.2;if(c.position.x>200)c.position.x=-200});
  C.STATIONS.forEach(s=>{const k=done.has(s.id)?1:1+Math.sin(t*3)*.12;s.ring.scale.set(k,k,k)});farm.cring.scale.setScalar(done.has("class")?1:1+Math.sin(t*3)*.12);
  if(camMode==="map"){const c=mapFocus||tmp.set(0,0,14);camera.position.lerp(new THREE.Vector3(c.x,mapFocus?30:118,c.z+(mapFocus?26:34)),Math.min(1,dt*2));camera.lookAt(c)}
  else{camT.lerp(v3.set(o.position.x,1.8,o.position.z),Math.min(1,dt*6));camera.position.set(camT.x+Math.sin(yaw)*Math.cos(pitch)*dist,camT.y+Math.sin(pitch)*dist,camT.z+Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(camT)}
  sun.position.set(o.position.x+40,70,o.position.z+30);sun.target.position.copy(o.position)}
 else if(active===room){const vh=2*12.9*Math.tan(Math.PI*25/180),k=Math.max(1,vh*camera.aspect/room.bgW);room.bg.scale.set(k,k,1);animOli(room.oli,t,false);room.oli.userData.spr.material.rotation=Math.sin(t*.8)*.04}
 updLabels();if(active)renderer.render(active.scene,camera)}

/* ===== 開始 ===== */
(async function main(){
 try{await loadAll()}catch(e){$("load").innerHTML="😢 牧場載入失敗，請重新整理（"+e.message+"）";return}
 buildFly();buildFarm();buildRoom();
 C.STATIONS.forEach(s=>{const [x,z]=STPOS[s.id];s.lab=label(`${s.label}<small>${s.zhName}</small><i></i>`,new THREE.Vector3(x,4.6,z),farm,"",()=>{if(!locked)walkTo(x,z)});s.lab.show=false});
 farm.classLab=label(`Classroom<small>簡報室</small><i></i>`,new THREE.Vector3(CLASSDOOR.x,4.6,CLASSDOOR.z),farm,"next",()=>{if(!locked)walkTo(CLASSDOOR.x,CLASSDOOR.z)});farm.classLab.show=false;
 setScene(fly);camera.position.set(26,92,96);camera.lookAt(0,4,-6);frame();
 $("load").style.display="none";$("title").style.display="flex";
 document.querySelectorAll("#title [data-m]").forEach(b=>b.onclick=()=>{setMode(b.dataset.m);sfx("tap");startFly()});
 window.__oli={showTally,reward,get fYaw(){return fYaw},camera,farm,fly,room,C,done,runStation,STPOS,SCORE,walkTo,get locked(){return locked},set locked(v){locked=v},get active(){return active}};
})();

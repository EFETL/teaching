<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>倒數｜投影畫面</title>
<style>
:root{--bg:#0a0c11;--panel:#141924;--line:#2b3446;--txt:#f2f4f9;--dim:#9aa4b8;
--ok:#22c55e;--warn:#fbbf24;--c1:#7c3aed;--c2:#a78bfa;--fs:1;--u:min(1vw,1.62vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
#root{flex:1;display:flex;flex-direction:column;min-height:0}

/* ── 頂部 ── */
.top{display:flex;align-items:center;gap:2vw;padding:1.4vh 2.2vw;
background:linear-gradient(120deg,var(--c1),var(--c2));flex-shrink:0}
.top .em{font-size:calc(3.4 * var(--u) * var(--fs));line-height:1}
.top .ti{flex:1;min-width:0}
.top h1{font-size:calc(2.5 * var(--u) * var(--fs));letter-spacing:.1em;color:#fff;
text-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sb{font-size:calc(1.25 * var(--u) * var(--fs));color:rgba(255,255,255,.9);margin-top:.2vh}
.clock{font-size:calc(4.2 * var(--u) * var(--fs));font-weight:800;font-variant-numeric:tabular-nums;
color:#fff;letter-spacing:.03em;text-shadow:0 2px 10px rgba(0,0,0,.35);line-height:1}
.clock.warn{color:#fde047}
.clock.danger{color:#fecaca;animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}

/* ── 主體 ── */
.main{flex:1;overflow-y:auto;padding:1.3vh 2.6vw 1.2vh;scrollbar-width:thin}
.main::-webkit-scrollbar{width:1.1vw}
.main::-webkit-scrollbar-track{background:#161c28}
.main::-webkit-scrollbar-thumb{background:var(--c2);border-radius:1vw;border:.15vw solid #161c28}
.morehint{position:absolute;left:0;right:0;bottom:0;height:9vh;pointer-events:none;
background:linear-gradient(to bottom,rgba(10,12,17,0),rgba(10,12,17,.96));
display:flex;align-items:flex-end;justify-content:center;padding-bottom:1vh;
font-size:calc(1.4 * var(--u) * var(--fs));color:var(--c2);font-weight:700;letter-spacing:.1em}
.mainwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.envlabel{display:inline-flex;align-items:center;gap:1vw;margin-bottom:.9vh}
.envlabel .bg{background:var(--c1);color:#fff;font-size:calc(1.5 * var(--u) * var(--fs));
font-weight:800;padding:.5vh 1.4vw;border-radius:.8vw;letter-spacing:.06em}
.envlabel h2{font-size:calc(2.2 * var(--u) * var(--fs));letter-spacing:.05em}
.lead{font-size:calc(1.5 * var(--u) * var(--fs));color:var(--dim);margin-bottom:.8vh}
.rule{background:#16233d;border-left:.5vw solid var(--c2);border-radius:0 1vw 1vw 0;
padding:1vh 1.6vw;font-size:calc(1.7 * var(--u) * var(--fs));line-height:1.7;margin-bottom:1.1vh}
.keep{background:#2c2409;border:.22vw dashed #d97706;border-radius:1vw;
padding:.9vh 1.6vw;font-size:calc(1.55 * var(--u) * var(--fs));color:#fcd34d;margin-bottom:1.1vh;line-height:1.7}
.q{font-size:calc(1.85 * var(--u) * var(--fs));margin-bottom:1vh;line-height:1.72}
.qcols{column-count:2;column-gap:2.6vw}
.qcols .q{break-inside:avoid;-webkit-column-break-inside:avoid}
@media(max-aspect-ratio:5/4){.qcols{column-count:1}}
.opt{font-size:calc(1.7 * var(--u) * var(--fs));color:#ccd4e6;padding-left:2vw;line-height:1.8;margin-top:.3vh}
.q.bonus{background:#1b1430;border:.2vw dashed #7c3aed;border-radius:1vw;
padding:1.3vh 1.8vw;color:#c4b5fd;font-size:calc(1.55 * var(--u) * var(--fs))}
.poem{background:#111722;border:.15vw solid var(--line);border-radius:1vw;
padding:1.1vh 2vw;margin:1vh 0;font-size:calc(1.85 * var(--u) * var(--fs));line-height:1.72;letter-spacing:.1em}
.poem span{color:var(--dim);font-size:calc(1.2 * var(--u) * var(--fs));margin-right:1.2vw}
.formula{text-align:center;font-size:calc(2.1 * var(--u) * var(--fs));line-height:2;margin:1.6vh 0;
font-family:"Times New Roman",serif;background:#111722;border-radius:1vw;padding:1.4vh}
table{width:100%;border-collapse:collapse;font-size:calc(1.5 * var(--u) * var(--fs));margin:.9vh 0}
table td,table th{border:.12vw solid var(--line);padding:.55vh 1vw}
table th{background:#1c2230;color:var(--dim);font-size:calc(1.3 * var(--u) * var(--fs))}
table .n{background:#1c2230;text-align:center;font-weight:700;width:9%}
table .w{text-align:center;font-size:calc(2.1 * var(--u) * var(--fs));font-weight:800;width:12%;color:var(--c2)}
table .c{background:#1c2230;text-align:center;font-weight:700}
table.bh td{text-align:center;padding:.7vh .4vw}
table.yr .y{text-align:center}
.att{border:.15vw solid #b45309;background:#1d1608;border-radius:1vw;padding:.9vh 1.6vw;margin-bottom:1vh}
.att h4{font-size:calc(1.6 * var(--u) * var(--fs));color:#fbbf24;margin-bottom:.9vh}
.att p{font-size:calc(1.5 * var(--u) * var(--fs));margin-bottom:.6vh;line-height:1.85}
.small{font-size:calc(1.3 * var(--u) * var(--fs));color:var(--dim);margin-top:.7vh}
.attbig{font-size:calc(1.9 * var(--u) * var(--fs));line-height:2}
.attbig p{margin-bottom:1vh}
.attbig table{font-size:calc(1.75 * var(--u) * var(--fs))}
.attbig table .w{font-size:calc(2.4 * var(--u) * var(--fs))}
.attbig table td,.attbig table th{padding:1.1vh 1.3vw}

/* ── 訊息／碎片 ── */
.reveal{text-align:center;padding:4vh 2vw;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.reveal .mg{font-size:calc(7 * var(--u) * var(--fs));font-weight:800;letter-spacing:.35em;
color:var(--ok);margin-bottom:2.5vh;text-shadow:0 0 4vw rgba(34,197,94,.25)}
.reveal .fr{width:calc(15 * var(--u) * var(--fs));height:calc(15 * var(--u) * var(--fs));background:#fff;color:#111;
border-radius:2vw;display:flex;align-items:center;justify-content:center;
font-size:calc(9 * var(--u) * var(--fs));font-weight:800;margin:0 auto 2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
.reveal .fn{font-size:calc(1.9 * var(--u) * var(--fs));color:var(--dim);line-height:1.9}
.reveal .fn b{color:var(--txt)}

/* ── 最終合體 ── */
.fin{text-align:center;padding:3vh 2vw;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.fin h3{font-size:calc(2.6 * var(--u) * var(--fs));letter-spacing:.15em;margin-bottom:2.5vh;color:var(--c2)}
.fincards{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;margin-bottom:3vh}
.fincards div{width:calc(11 * var(--u) * var(--fs));height:calc(11 * var(--u) * var(--fs));background:#fff;color:#111;
border-radius:1.6vw;display:flex;align-items:center;justify-content:center;
font-size:calc(6.5 * var(--u) * var(--fs));font-weight:800;box-shadow:0 1.5vh 4vh rgba(0,0,0,.45)}
.fin p{font-size:calc(1.9 * var(--u) * var(--fs));color:var(--dim);line-height:2}
.fin .done{font-size:calc(6 * var(--u) * var(--fs));font-weight:800;letter-spacing:.35em;color:var(--ok);margin:2vh 0}

/* ── 待機 ── */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vw}
.idle .t{font-size:calc(9 * var(--u) * var(--fs));font-weight:800;letter-spacing:.5em;margin-bottom:2vh}
.idle .s{font-size:calc(2 * var(--u) * var(--fs));color:var(--dim);line-height:2.1}
.idle .story{font-size:calc(1.85 * var(--u) * var(--fs));color:#ccd4e6;line-height:2.2;max-width:60vw;margin-top:3vh;text-align:left}
.idle .story em{color:var(--c2);font-style:normal;font-weight:700}

/* ── 底部進度 ── */
.bot{display:flex;gap:1vw;padding:1.2vh 2.2vw;background:#111722;border-top:.12vw solid var(--line);flex-shrink:0}
.pill{flex:1;text-align:center;padding:.9vh;border-radius:.8vw;background:#1c2230;
border:.14vw solid var(--line);font-size:calc(1.3 * var(--u) * var(--fs));color:var(--dim)}
.pill.on{border-color:var(--c2);color:var(--txt);background:#22203a}
.pill.done{background:#0f2318;border-color:var(--ok);color:#86efac}
.pill b{font-size:calc(1.7 * var(--u) * var(--fs));margin-right:.5vw}
.hint{position:fixed;bottom:1vh;right:1.2vw;font-size:11px;color:#39425a}
</style>
</head>
<body>
<div id="root"></div>
<div class="hint">teaching.efetl.com</div>

<script src="../data.js"></script>
<script>
var S={stage:0,show:'idle',unlocked:{},remain:0,running:false,fs:1,phase:''};

function esc(x){return x==null?'':x;}
function stage(){return CD.stages[S.stage];}
function fmt(s){s=Math.max(0,s|0);return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function envHtml(k){
  var st=stage(), e=st[k];
  var h='<div class="envlabel"><span class="bg">信封 '+k+'</span><h2>'+e.title+'</h2></div>';
  h+='<div class="lead">'+e.lead+'</div>';
  h+='<div class="rule">'+e.rule+'</div>';
  if(k==='A'&&e.keep) h+='<div class="keep">✍️ '+e.keep+'</div>';
  h+=(k==='A')?('<div class="qcols">'+e.body+'</div>'):e.body;
  if(k==='A'&&st.att&&st.att.length){
    h+='<div class="att"><h4>📎 這一關有附件</h4><p>'+
       st.att.map(function(a){return '・'+a.t;}).join('　')+
       '<br><span class="small">需要查表時，老師會單獨投出來。</span></p></div>';
  }
  return h;
}

function render(){
  var r=document.getElementById('root');
  document.documentElement.style.setProperty('--fs',S.fs);

  if(S.show==='idle'){
    r.innerHTML='<div class="idle"><div class="t">倒　數</div>'+
      '<div class="s">國三密室逃脫　│　四關接力　│　60 分鐘</div>'+
      '<div class="story">去年這個時候，有一個學長也在這間教室裡。<br><br>'+
      '他畢業那天，沒有把東西帶走。他留下了<em>四個信封</em>。<br><br>'+
      '「<em>我不想把它留給隨便一個人。<br>　想拿走的，得先證明他真的準備好了。</em>」<br><br>'+
      '每個信封裡，還有下一個信封。<br>'+
      '但他多做了一件事——<em>後面的題目，會用到前面的答案。</em><br>'+
      '所以什麼都不要擦掉。</div></div>';
    return;
  }

  var st=stage();
  document.documentElement.style.setProperty('--c1',st.c1);
  document.documentElement.style.setProperty('--c2',st.c2);

  var body='';
  if(S.show==='msg'){
    body='<div class="reveal"><div class="mg">'+st.msg+'</div>'+
      '<div class="fr">'+st.frag.c+'</div>'+
      '<div class="fn">這一關的碎片：正面「<b>'+st.frag.c+'</b>」・背面「<b>'+st.frag.n+'</b>」<br>'+
      '抄在筆記本上，四關結束要用。</div></div>';
  } else if(S.show==='final'){
    var SHUF=[2,0,3,1];   // 固定亂序：得・你・及・來（不是原句順序）
    var got=CD.stages.map(function(x,i){return (S.unlocked['s'+i+'C'])?x.frag:null;});
    var disp=S.finalOpen?got:SHUF.map(function(i){return got[i];});
    body='<div class="fin"><h3>🏆 最終合體</h3>'+
      '<div class="fincards">'+disp.map(function(f){
        return '<div>'+(f?f.c:'?')+'</div>';}).join('')+'</div>'+
      (S.finalOpen
        ? '<div class="done">'+CD.final.phrase+'</div><p>別回頭 → 還有時間 → 冷靜想 → 就現在</p>'
        : '<p>把四個字排成一句通順的話。<br>再把每個字<b>背面的數字</b>依同樣順序唸出來。<br>那就是最後那個箱子的密碼。</p>');
    body+='</div>';
  } else if(S.show.indexOf('att:')===0){
    var ai=parseInt(S.show.split(':')[1],10), a=st.att[ai];
    body='<div class="mainwrap"><div class="main"><div class="envlabel"><span class="bg">附件</span><h2>'+a.t+'</h2></div>'+
      '<div class="attbig">'+a.h+'</div></div>'+
      '<div class="morehint" id="mh" style="display:none">▼ 下面還有內容 ▼</div></div>';
  } else {
    body='<div class="mainwrap"><div class="main">'+envHtml(S.show)+'</div>'+
         '<div class="morehint" id="mh" style="display:none">▼ 下面還有內容 ▼</div></div>';
  }

  var cl='clock'+(S.remain<=60?' danger':S.remain<=300?' warn':'');
  var pills=['A','B','C'].map(function(k){
    var done=S.unlocked['s'+S.stage+k];
    var on=(S.show===k);
    var nm={A:'找出線索',B:'主謎題',C:'回溯'}[k];
    return '<div class="pill'+(done?' done':'')+(on?' on':'')+'"><b>'+k+'</b>'+nm+(done?' ✓':'')+'</div>';
  }).join('');

  r.innerHTML=
    '<div class="top"><span class="em">'+st.emoji+'</span>'+
      '<div class="ti"><h1>第 '+st.n+' 關　'+st.name+'</h1>'+
      '<div class="sb">'+st.sub+'</div></div>'+
      '<div class="'+cl+'">'+fmt(S.remain)+'</div></div>'+
    (S.show==='msg'||S.show==='final' ? '<div class="main">'+body+'</div>' : body)+
    '<div class="bot">'+pills+'</div>';
}

function mainEl(){return document.querySelector('.main');}
/* 只更新時鐘，不動 DOM，避免捲動位置被重設 */
function updClock(){
  var c=document.querySelector('.clock');
  if(!c)return;
  c.textContent=fmt(S.remain);
  c.className='clock'+(S.remain<=60?' danger':S.remain<=300?' warn':'');
}
/* 畫面簽章：只有這些變了才需要重畫 */
function sig(){
  return [S.stage,S.show,S.fs,S.finalOpen?1:0,JSON.stringify(S.unlocked||{})].join('|');
}
var lastSig=null;
function updHint(){
  var m=mainEl(), h=document.getElementById('mh');
  if(!m||!h)return;
  h.style.display=(m.scrollHeight-m.scrollTop-m.clientHeight>8)?'flex':'none';
}
function bindScroll(){
  var m=mainEl(); if(!m)return;
  m.addEventListener('scroll',updHint);
  setTimeout(updHint,30);
}
/* 遙控捲動 */
var lastCmd=0;
function doCmd(){
  var m=mainEl(); if(!m||!S.cmd)return;
  var c=S.cmd;
  if(c.id===lastCmd)return; lastCmd=c.id;
  var step=Math.round(m.clientHeight*0.75);
  if(c.k==='down') m.scrollBy({top:step,behavior:'smooth'});
  else if(c.k==='up') m.scrollBy({top:-step,behavior:'smooth'});
  else if(c.k==='top') m.scrollTo({top:0,behavior:'smooth'});
  else if(c.k==='end') m.scrollTo({top:m.scrollHeight,behavior:'smooth'});
  else if(c.k==='fit') autofit();
  setTimeout(updHint,420);
}
/* 自動縮到剛好一頁 */
function autofit(){
  var f=1.5, keep=(mainEl()?mainEl().scrollTop:0);
  for(var i=0;i<20;i++){
    document.documentElement.style.setProperty('--fs',f);
    var m=mainEl(); if(!m)break;
    if(m.scrollHeight<=m.clientHeight+2) break;
    f-=0.04; if(f<0.6){f=0.6;break;}
  }
  S.fs=Math.round(f*100)/100;
  lastSig=sig();
  if(mainEl()) mainEl().scrollTop=keep;
  try{ if(window._bc) window._bc.postMessage({__fs:S.fs}); }catch(e){}
  setTimeout(updHint,30);
}
/* ── 接收控制台的狀態 ── */
function apply(d){
  S=Object.assign(S,d);
  var g=sig();
  if(g===lastSig){ updClock(); doCmd(); return; }
  lastSig=g;
  render(); bindScroll(); updHint(); doCmd();
}
try{
  var bc=new BroadcastChannel('cd_show');
  window._bc=bc;
  bc.onmessage=function(e){ if(e.data&&e.data.__fs)return; apply(e.data); };
  bc.postMessage({__hello:1});
}catch(e){}
/* 投影視窗自己也能用鍵盤捲 */
document.addEventListener('keydown',function(e){
  var m=mainEl(); if(!m)return;
  var step=Math.round(m.clientHeight*0.75);
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();m.scrollBy({top:step,behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();m.scrollBy({top:-step,behavior:'smooth'});}
  if(e.key==='Home'){e.preventDefault();m.scrollTo({top:0,behavior:'smooth'});}
  if(e.key==='End'){e.preventDefault();m.scrollTo({top:m.scrollHeight,behavior:'smooth'});}
  setTimeout(updHint,420);
});
window.addEventListener('storage',function(e){
  if(e.key==='cd_show_state'&&e.newValue){ try{apply(JSON.parse(e.newValue));}catch(x){} }
});
try{ var v=localStorage.getItem('cd_show_state'); if(v) S=Object.assign(S,JSON.parse(v)); }catch(e){}
lastSig=sig();render();bindScroll();updHint();
</script>
<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

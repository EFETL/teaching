<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>倒數｜投影畫面</title>
<style>
:root{--bg:#0a0c11;--panel:#141924;--line:#2b3446;--txt:#f2f4f9;--dim:#9aa4b8;
--ok:#22c55e;--warn:#fbbf24;--c1:#7c3aed;--c2:#a78bfa;--fs:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
#root{flex:1;display:flex;flex-direction:column;min-height:0}

/* ── 頂部 ── */
.top{display:flex;align-items:center;gap:2vw;padding:1.4vh 2.2vw;
background:linear-gradient(120deg,var(--c1),var(--c2));flex-shrink:0}
.top .em{font-size:calc(3.4vw * var(--fs));line-height:1}
.top .ti{flex:1;min-width:0}
.top h1{font-size:calc(2.5vw * var(--fs));letter-spacing:.1em;color:#fff;
text-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sb{font-size:calc(1.25vw * var(--fs));color:rgba(255,255,255,.9);margin-top:.2vh}
.clock{font-size:calc(4.2vw * var(--fs));font-weight:800;font-variant-numeric:tabular-nums;
color:#fff;letter-spacing:.03em;text-shadow:0 2px 10px rgba(0,0,0,.35);line-height:1}
.clock.warn{color:#fde047}
.clock.danger{color:#fecaca;animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}

/* ── 主體 ── */
.main{flex:1;overflow-y:auto;padding:2.2vh 3vw 2vh;scrollbar-width:thin}
.main::-webkit-scrollbar{width:1.1vw}
.main::-webkit-scrollbar-track{background:#161c28}
.main::-webkit-scrollbar-thumb{background:var(--c2);border-radius:1vw;border:.15vw solid #161c28}
.morehint{position:absolute;left:0;right:0;bottom:0;height:9vh;pointer-events:none;
background:linear-gradient(to bottom,rgba(10,12,17,0),rgba(10,12,17,.96));
display:flex;align-items:flex-end;justify-content:center;padding-bottom:1vh;
font-size:calc(1.4vw * var(--fs));color:var(--c2);font-weight:700;letter-spacing:.1em}
.mainwrap{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.envlabel{display:inline-flex;align-items:center;gap:1vw;margin-bottom:1.6vh}
.envlabel .bg{background:var(--c1);color:#fff;font-size:calc(1.5vw * var(--fs));
font-weight:800;padding:.5vh 1.4vw;border-radius:.8vw;letter-spacing:.06em}
.envlabel h2{font-size:calc(2.2vw * var(--fs));letter-spacing:.05em}
.lead{font-size:calc(1.6vw * var(--fs));color:var(--dim);margin-bottom:1.4vh}
.rule{background:#16233d;border-left:.5vw solid var(--c2);border-radius:0 1vw 1vw 0;
padding:1.5vh 1.8vw;font-size:calc(1.75vw * var(--fs));line-height:1.85;margin-bottom:2vh}
.keep{background:#2c2409;border:.22vw dashed #d97706;border-radius:1vw;
padding:1.4vh 1.8vw;font-size:calc(1.6vw * var(--fs));color:#fcd34d;margin-bottom:2vh;line-height:1.8}
.q{font-size:calc(1.85vw * var(--fs));margin-bottom:1.6vh;line-height:1.9}
.opt{font-size:calc(1.7vw * var(--fs));color:#ccd4e6;padding-left:2vw;line-height:2.05;margin-top:.4vh}
.q.bonus{background:#1b1430;border:.2vw dashed #7c3aed;border-radius:1vw;
padding:1.3vh 1.8vw;color:#c4b5fd;font-size:calc(1.55vw * var(--fs))}
.poem{background:#111722;border:.15vw solid var(--line);border-radius:1vw;
padding:1.8vh 2.4vw;margin:1.6vh 0;font-size:calc(2vw * var(--fs));line-height:2.3;letter-spacing:.12em}
.poem span{color:var(--dim);font-size:calc(1.2vw * var(--fs));margin-right:1.2vw}
.formula{text-align:center;font-size:calc(2.1vw * var(--fs));line-height:2;margin:1.6vh 0;
font-family:"Times New Roman",serif;background:#111722;border-radius:1vw;padding:1.4vh}
table{width:100%;border-collapse:collapse;font-size:calc(1.5vw * var(--fs));margin:1.4vh 0}
table td,table th{border:.12vw solid var(--line);padding:.9vh 1.1vw}
table th{background:#1c2230;color:var(--dim);font-size:calc(1.3vw * var(--fs))}
table .n{background:#1c2230;text-align:center;font-weight:700;width:9%}
table .w{text-align:center;font-size:calc(2.1vw * var(--fs));font-weight:800;width:12%;color:var(--c2)}
table .c{background:#1c2230;text-align:center;font-weight:700}
table.bh td{text-align:center;padding:.7vh .4vw}
table.yr .y{text-align:center}
.att{border:.15vw solid #b45309;background:#1d1608;border-radius:1vw;padding:1.5vh 1.9vw;margin-bottom:1.6vh}
.att h4{font-size:calc(1.6vw * var(--fs));color:#fbbf24;margin-bottom:.9vh}
.att p{font-size:calc(1.5vw * var(--fs));margin-bottom:.6vh;line-height:1.85}
.small{font-size:calc(1.3vw * var(--fs));color:var(--dim);margin-top:.7vh}
.attbig{font-size:calc(1.9vw * var(--fs));line-height:2}
.attbig p{margin-bottom:1vh}
.attbig table{font-size:calc(1.75vw * var(--fs))}
.attbig table .w{font-size:calc(2.4vw * var(--fs))}
.attbig table td,.attbig table th{padding:1.1vh 1.3vw}

/* ── 訊息／碎片 ── */
.reveal{text-align:center;padding:4vh 2vw;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.reveal .mg{font-size:calc(7vw * var(--fs));font-weight:800;letter-spacing:.35em;
color:var(--ok);margin-bottom:2.5vh;text-shadow:0 0 4vw rgba(34,197,94,.25)}
.reveal .fr{width:calc(15vw * var(--fs));height:calc(15vw * var(--fs));background:#fff;color:#111;
border-radius:2vw;display:flex;align-items:center;justify-content:center;
font-size:calc(9vw * var(--fs));font-weight:800;margin:0 auto 2vh;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
.reveal .fn{font-size:calc(1.9vw * var(--fs));color:var(--dim);line-height:1.9}
.reveal .fn b{color:var(--txt)}

/* ── 最終合體 ── */
.fin{text-align:center;padding:3vh 2vw;display:flex;flex-direction:column;justify-content:center;min-height:100%}
.fin h3{font-size:calc(2.6vw * var(--fs));letter-spacing:.15em;margin-bottom:2.5vh;color:var(--c2)}
.fincards{display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;margin-bottom:3vh}
.fincards div{width:calc(11vw * var(--fs));height:calc(11vw * var(--fs));background:#fff;color:#111;
border-radius:1.6vw;display:flex;align-items:center;justify-content:center;
font-size:calc(6.5vw * var(--fs));font-weight:800;box-shadow:0 1.5vh 4vh rgba(0,0,0,.45)}
.fin p{font-size:calc(1.9vw * var(--fs));color:var(--dim);line-height:2}
.fin .done{font-size:calc(6vw * var(--fs));font-weight:800;letter-spacing:.35em;color:var(--ok);margin:2vh 0}

/* ── 待機 ── */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vw}
.idle .t{font-size:calc(9vw * var(--fs));font-weight:800;letter-spacing:.5em;margin-bottom:2vh}
.idle .s{font-size:calc(2vw * var(--fs));color:var(--dim);line-height:2.1}
.idle .story{font-size:calc(1.85vw * var(--fs));color:#ccd4e6;line-height:2.2;max-width:60vw;margin-top:3vh;text-align:left}
.idle .story em{color:var(--c2);font-style:normal;font-weight:700}

/* ── 底部進度 ── */
.bot{display:flex;gap:1vw;padding:1.2vh 2.2vw;background:#111722;border-top:.12vw solid var(--line);flex-shrink:0}
.pill{flex:1;text-align:center;padding:.9vh;border-radius:.8vw;background:#1c2230;
border:.14vw solid var(--line);font-size:calc(1.3vw * var(--fs));color:var(--dim)}
.pill.on{border-color:var(--c2);color:var(--txt);background:#22203a}
.pill.done{background:#0f2318;border-color:var(--ok);color:#86efac}
.pill b{font-size:calc(1.7vw * var(--fs));margin-right:.5vw}
.hint{position:fixed;bottom:1vh;right:1.2vw;font-size:11px;color:#39425a}
</style>
</head>
<body>
<div id="root"></div>
<div class="hint">teaching.efetl.com</div>

<script src="../data.js"></script>
<script>
var S={stage:0,show:'idle',unlocked:{},remain:0,running:false,fs:1,phase:''};

function esc(x){return x==null?'':x;}
function stage(){return CD.stages[S.stage];}
function fmt(s){s=Math.max(0,s|0);return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function envHtml(k){
  var st=stage(), e=st[k];
  var h='<div class="envlabel"><span class="bg">信封 '+k+'</span><h2>'+e.title+'</h2></div>';
  h+='<div class="lead">'+e.lead+'</div>';
  h+='<div class="rule">'+e.rule+'</div>';
  if(k==='A'&&e.keep) h+='<div class="keep">✍️ '+e.keep+'</div>';
  h+=e.body;
  if(k==='A'&&st.att&&st.att.length){
    h+='<div class="att"><h4>📎 這一關有附件</h4><p>'+
       st.att.map(function(a){return '・'+a.t;}).join('　')+
       '<br><span class="small">需要查表時，老師會單獨投出來。</span></p></div>';
  }
  return h;
}

function render(){
  var r=document.getElementById('root');
  document.documentElement.style.setProperty('--fs',S.fs);

  if(S.show==='idle'){
    r.innerHTML='<div class="idle"><div class="t">倒　數</div>'+
      '<div class="s">國三密室逃脫　│　四關接力　│　60 分鐘</div>'+
      '<div class="story">去年這個時候，有一個學長也在這間教室裡。<br><br>'+
      '他畢業那天，沒有把東西帶走。他留下了<em>四個信封</em>。<br><br>'+
      '「<em>我不想把它留給隨便一個人。<br>　想拿走的，得先證明他真的準備好了。</em>」<br><br>'+
      '每個信封裡，還有下一個信封。<br>'+
      '但他多做了一件事——<em>後面的題目，會用到前面的答案。</em><br>'+
      '所以什麼都不要擦掉。</div></div>';
    return;
  }

  var st=stage();
  document.documentElement.style.setProperty('--c1',st.c1);
  document.documentElement.style.setProperty('--c2',st.c2);

  var body='';
  if(S.show==='msg'){
    body='<div class="reveal"><div class="mg">'+st.msg+'</div>'+
      '<div class="fr">'+st.frag.c+'</div>'+
      '<div class="fn">這一關的碎片：正面「<b>'+st.frag.c+'</b>」・背面「<b>'+st.frag.n+'</b>」<br>'+
      '抄在筆記本上，四關結束要用。</div></div>';
  } else if(S.show==='final'){
    var SHUF=[2,0,3,1];   // 固定亂序：得・你・及・來（不是原句順序）
    var got=CD.stages.map(function(x,i){return (S.unlocked['s'+i+'C'])?x.frag:null;});
    var disp=S.finalOpen?got:SHUF.map(function(i){return got[i];});
    body='<div class="fin"><h3>🏆 最終合體</h3>'+
      '<div class="fincards">'+disp.map(function(f){
        return '<div>'+(f?f.c:'?')+'</div>';}).join('')+'</div>'+
      (S.finalOpen
        ? '<div class="done">'+CD.final.phrase+'</div><p>別回頭 → 還有時間 → 冷靜想 → 就現在</p>'
        : '<p>把四個字排成一句通順的話。<br>再把每個字<b>背面的數字</b>依同樣順序唸出來。<br>那就是最後那個箱子的密碼。</p>');
    body+='</div>';
  } else if(S.show.indexOf('att:')===0){
    var ai=parseInt(S.show.split(':')[1],10), a=st.att[ai];
    body='<div class="mainwrap"><div class="main"><div class="envlabel"><span class="bg">附件</span><h2>'+a.t+'</h2></div>'+
      '<div class="attbig">'+a.h+'</div></div>'+
      '<div class="morehint" id="mh" style="display:none">▼ 下面還有內容 ▼</div></div>';
  } else {
    body='<div class="mainwrap"><div class="main">'+envHtml(S.show)+'</div>'+
         '<div class="morehint" id="mh" style="display:none">▼ 下面還有內容 ▼</div></div>';
  }

  var cl='clock'+(S.remain<=60?' danger':S.remain<=300?' warn':'');
  var pills=['A','B','C'].map(function(k){
    var done=S.unlocked['s'+S.stage+k];
    var on=(S.show===k);
    var nm={A:'找出線索',B:'主謎題',C:'回溯'}[k];
    return '<div class="pill'+(done?' done':'')+(on?' on':'')+'"><b>'+k+'</b>'+nm+(done?' ✓':'')+'</div>';
  }).join('');

  r.innerHTML=
    '<div class="top"><span class="em">'+st.emoji+'</span>'+
      '<div class="ti"><h1>第 '+st.n+' 關　'+st.name+'</h1>'+
      '<div class="sb">'+st.sub+'</div></div>'+
      '<div class="'+cl+'">'+fmt(S.remain)+'</div></div>'+
    (S.show==='msg'||S.show==='final' ? '<div class="main">'+body+'</div>' : body)+
    '<div class="bot">'+pills+'</div>';
}

function mainEl(){return document.querySelector('.main');}
/* 只更新時鐘，不動 DOM，避免捲動位置被重設 */
function updClock(){
  var c=document.querySelector('.clock');
  if(!c)return;
  c.textContent=fmt(S.remain);
  c.className='clock'+(S.remain<=60?' danger':S.remain<=300?' warn':'');
}
/* 畫面簽章：只有這些變了才需要重畫 */
function sig(){
  return [S.stage,S.show,S.fs,S.finalOpen?1:0,JSON.stringify(S.unlocked||{})].join('|');
}
var lastSig=null;
function updHint(){
  var m=mainEl(), h=document.getElementById('mh');
  if(!m||!h)return;
  h.style.display=(m.scrollHeight-m.scrollTop-m.clientHeight>8)?'flex':'none';
}
function bindScroll(){
  var m=mainEl(); if(!m)return;
  m.addEventListener('scroll',updHint);
  setTimeout(updHint,30);
}
/* 遙控捲動 */
var lastCmd=0;
function doCmd(){
  var m=mainEl(); if(!m||!S.cmd)return;
  var c=S.cmd;
  if(c.id===lastCmd)return; lastCmd=c.id;
  var step=Math.round(m.clientHeight*0.75);
  if(c.k==='down') m.scrollBy({top:step,behavior:'smooth'});
  else if(c.k==='up') m.scrollBy({top:-step,behavior:'smooth'});
  else if(c.k==='top') m.scrollTo({top:0,behavior:'smooth'});
  else if(c.k==='end') m.scrollTo({top:m.scrollHeight,behavior:'smooth'});
  else if(c.k==='fit') autofit();
  setTimeout(updHint,420);
}
/* 自動縮到剛好一頁 */
function autofit(){
  var f=1.4, keep=(mainEl()?mainEl().scrollTop:0);
  for(var i=0;i<20;i++){
    document.documentElement.style.setProperty('--fs',f);
    var m=mainEl(); if(!m)break;
    if(m.scrollHeight<=m.clientHeight+2) break;
    f-=0.05; if(f<0.7){f=0.7;break;}
  }
  S.fs=Math.round(f*100)/100;
  lastSig=sig();
  if(mainEl()) mainEl().scrollTop=keep;
  try{ if(window._bc) window._bc.postMessage({__fs:S.fs}); }catch(e){}
  setTimeout(updHint,30);
}
/* ── 接收控制台的狀態 ── */
function apply(d){
  S=Object.assign(S,d);
  var g=sig();
  if(g===lastSig){ updClock(); doCmd(); return; }
  lastSig=g;
  render(); bindScroll(); updHint(); doCmd();
}
try{
  var bc=new BroadcastChannel('cd_show');
  window._bc=bc;
  bc.onmessage=function(e){ if(e.data&&e.data.__fs)return; apply(e.data); };
  bc.postMessage({__hello:1});
}catch(e){}
/* 投影視窗自己也能用鍵盤捲 */
document.addEventListener('keydown',function(e){
  var m=mainEl(); if(!m)return;
  var step=Math.round(m.clientHeight*0.75);
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();m.scrollBy({top:step,behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();m.scrollBy({top:-step,behavior:'smooth'});}
  if(e.key==='Home'){e.preventDefault();m.scrollTo({top:0,behavior:'smooth'});}
  if(e.key==='End'){e.preventDefault();m.scrollTo({top:m.scrollHeight,behavior:'smooth'});}
  setTimeout(updHint,420);
});
window.addEventListener('storage',function(e){
  if(e.key==='cd_show_state'&&e.newValue){ try{apply(JSON.parse(e.newValue));}catch(x){} }
});
try{ var v=localStorage.getItem('cd_show_state'); if(v) S=Object.assign(S,JSON.parse(v)); }catch(e){}
lastSig=sig();render();bindScroll();updHint();
</script>
</body>
</html>

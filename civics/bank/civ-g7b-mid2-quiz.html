<script>
const QS=[{"stem": "關於「文化」的意義，下列敘述何者最正確？", "opts": [["A", "只包含藝術、音樂、電影等精緻的創作成果"], ["B", "人類為求生存，適應或改變環境所創造的一切生活方式的總稱"], ["C", "政府為了管理人民而制定的各種法律規範"], ["D", "自然界原本就存在、未經人類創造的一切事物"]], "ans": "B", "exp": "文化是人類為求生存、適應或改變環境所創造的一切生活方式的總稱，包括器具、儀式、習慣與價值觀念等，範圍遠比「藝術」廣泛。"}, {"stem": "下列何者「不」屬於文化的範疇？", "opts": [["A", "排灣族的琉璃珠工藝技術"], ["B", "農曆春節圍爐守歲的習俗"], ["C", "臺灣中央山脈自然形成的高山地形"], ["D", "社會上普遍認為「敬老尊賢」是美德的觀念"]], "ans": "C", "exp": "文化是「人類創造或學習而來」的成果。中央山脈屬於未經人類創造的自然環境，不是文化；(A) 器物、(B) 習俗、(D) 價值觀念都屬於文化。"}, {"stem": "文化的內容可以分成器物、制度與理念等面向。下列何者屬於「器物」面向？", "opts": [["A", "捷運、高鐵等交通工具與建築"], ["B", "政府訂定的限塑政策"], ["C", "認為人人平等的價值觀"], ["D", "伊斯蘭教的宗教信仰"]], "ans": "A", "exp": "器物指人類創造出來、看得見摸得到的物質成果，如建築與交通工具；(B) 屬制度，(C)(D) 屬理念。"}, {"stem": "1990年代，許多從中國或東南亞來臺定居的女性常被稱為「大陸新娘」、「外籍新娘」，後來社會逐漸改稱為「新住民」。這項改變最主要的意義是什麼？", "opts": [["A", "為了方便政府統計外來人口的數量"], ["B", "因為這個稱呼聽起來比較新潮流行"], ["C", "為了區分她們與本地居民的不同身分"], ["D", "拿掉稱呼中的歧視意涵，表達社會對此族群的尊重與平等對待"]], "ans": "D", "exp": "我們對人事物的稱呼往往隱含深層意涵。「新娘」等稱呼帶有貼標籤與歧視的意味，改稱「新住民」具有落葉生根的意涵，象徵社會對此族群的尊重有所改善。"}, {"stem": "有些人習慣以「瑪麗亞」統稱所有來自菲律賓的女性移工。這種稱呼方式的問題在於？", "opts": [["A", "這個名字的發音不容易記住"], ["B", "菲律賓其實沒有人取名叫瑪麗亞"], ["C", "以單一名字統稱一群人，未將對方視為獨立個體，是不尊重的表現"], ["D", "這個稱呼會讓她們無法順利找到工作"]], "ans": "C", "exp": "每位移工都有自己的名字，卻被用一個統稱概括，等於忽略她們是獨立的個體，是一種缺乏尊重的刻板稱呼。"}, {"stem": "隨著科技進步與強勢文化的擴張，不同背景的人們逐漸以相似的方式生活，某些少數族群的文化甚至瀕臨消失。我們之所以要「維護文化多樣性」，最主要的理由是？", "opts": [["A", "避免文化因單一化而使創造力衰竭，讓文化能持續發展與創新"], ["B", "讓現在的弱勢文化有機會翻身成為新的強勢文化"], ["C", "使各種文化彼此互不往來，才不會被別人同化"], ["D", "證明傳統文化的價值一定高於現代文化"]], "ans": "A", "exp": "文化若走向單一化，創造力便會衰竭。維護多樣性是為了讓不同文化都能保有特質，並在交流中持續發展與創新。"}, {"stem": "下列何者是「文化普遍性」的正確說明？", "opts": [["A", "每個社會的文化表現方式完全相同，沒有差別"], ["B", "文化會隨著時代不斷累積、改造與創新"], ["C", "文化具有約束力量，使人表現出合乎該文化的行為"], ["D", "文化存在於每一個人類社會中，並具有某些共通的元素"]], "ans": "D", "exp": "普遍性指文化存在於每個人類社會，且各社會的文化間有共通元素（如都有婚喪喜慶儀式）。(A) 錯在「完全相同」，(B) 為累積性，(C) 為制約性。"}, {"stem": "「世界各地的民族，幾乎都發展出慶祝結婚的儀式。」這句話最能說明文化的哪一項特性？", "opts": [["A", "差異性"], ["B", "普遍性"], ["C", "累積性"], ["D", "制約性"]], "ans": "B", "exp": "各地雖然婚禮形式不同，但「都有結婚儀式」這個共通點，正是文化普遍性的展現。"}, {"stem": "在臺灣參加婚禮時多使用紅色的紅包袋，日本則多使用白色的祝儀袋。這最能說明文化的哪一項特性？", "opts": [["A", "普遍性"], ["B", "累積性"], ["C", "差異性"], ["D", "制約性"]], "ans": "C", "exp": "同樣是送禮金這件事，不同社會因價值觀（紅色代表喜氣、白色代表純潔）而有不同的表現方式，屬於文化的差異性。"}, {"stem": "近年來透過婚姻、求學或工作來到臺灣的新住民，在生活上常會遇到什麼樣的困難？", "opts": [["A", "因語言隔閡與文化背景差異而遭到誤解，在人際互動、工作選擇及文化傳承上面臨挑戰"], ["B", "因為法律明文規定新住民一律不得在臺灣工作"], ["C", "因為政府完全沒有任何協助新住民的相關措施"], ["D", "因為他們的母語被列為國家語言而受到使用限制"]], "ans": "A", "exp": "新住民常因語言與文化差異招致社會大眾誤解，在人際互動、工作選擇及文化傳承等面向面臨不少挑戰，因此政府訂有相關照顧服務措施加以協助。"}, {"stem": "除了傳統的紙本喜帖之外，現在也發展出電子喜帖的形式。這最能說明文化的哪一項特性？", "opts": [["A", "普遍性"], ["B", "差異性"], ["C", "制約性"], ["D", "累積性"]], "ans": "D", "exp": "文化會隨著時代不斷累積、延續並加入新的元素而改變創新，喜帖從紙本到電子化正是累積性的例子。"}, {"stem": "國立政治大學因為校內有許多來自不同國家的學生，決議學生只要檢附證明文件，每學年可請2日「多元文化假」，並將原住民族的歲時祭儀假由1日延長為5日。政大是以何種方式促進多元文化的發展？", "opts": [["A", "辦理文化活動，強化自身認同"], ["B", "修改放假規範，有利文化傳承"], ["C", "提倡檢舉機制，處罰不當言論"], ["D", "設置母語教學，消除文化位階"]], "ans": "B", "exp": "政大是透過修訂「請假規範」這項校內制度，讓學生有足夠時間返鄉參與祭儀與文化活動，屬於以制度促進文化傳承的做法。"}, {"stem": "在臺灣，親友參加婚宴時通常會包上雙數的紅包禮金。這種行為最能說明文化的哪一項特性？", "opts": [["A", "制約性"], ["B", "累積性"], ["C", "普遍性"], ["D", "差異性"]], "ans": "A", "exp": "「大家都這麼做、不這麼做會被認為失禮」顯示文化對人的行為具有約束力量，使人表現出合乎該文化的行為，即制約性。"}, {"stem": "下列何者是「文化制約性」的正確說明？", "opts": [["A", "文化會隨時代改變而不斷創新"], ["B", "各地文化的表現方式不盡相同"], ["C", "文化具有約束力量，使處在同一文化的人表現出合乎該文化的行為"], ["D", "每一個人類社會中都存在著文化"]], "ans": "C", "exp": "制約性強調文化對成員行為的規範與約束力。(A) 為累積性、(B) 為差異性、(D) 為普遍性。"}, {"stem": "「世界各國人民都為了溝通而發展出語言，但各國表達感謝的說法卻不相同。」這兩句話依序說明文化的哪兩項特性？", "opts": [["A", "累積性、制約性"], ["B", "普遍性、差異性"], ["C", "差異性、普遍性"], ["D", "制約性、累積性"]], "ans": "B", "exp": "「都發展出語言」是各社會的共通元素，屬普遍性；「說法不相同」是不同群體的表現方式有別，屬差異性。"}, {"stem": "臺北車站大廳是許多移工假日聚會的地點。有民眾反對移工坐在大廳，認為影響動線且「有礙觀瞻」；最後臺鐵決定不明文禁止席地而坐，並訂定公共空間使用辦法，地板上也出現象徵友善的微笑地貼。關於此事，下列敘述何者最恰當？", "opts": [["A", "反對民眾的說法完全客觀，不含任何偏見"], ["B", "為了維持秩序，應全面禁止民眾使用公共空間"], ["C", "移工來臺工作，本來就不應該有休閒與社交活動"], ["D", "認為移工聚會「有礙觀瞻」隱含文化位階，最終的決定則展現包容文化差異的精神"]], "ans": "D", "exp": "以「有礙觀瞻」評價他人的休閒方式，是以自身標準區分優劣，隱含文化位階；臺鐵最後選擇不禁止並訂定使用規範，體現包容差異、營造友善社會。"}, {"stem": "臺灣的披薩店把國人常吃的皮蛋加入披薩，做出只有臺灣才有的「皮蛋披薩」。這個現象最能說明什麼？", "opts": [["A", "不同文化交流後會累積創新，產生新的文化內容"], ["B", "外來文化進入後必然會完全取代本土文化"], ["C", "文化之間確實存在高低優劣的差別"], ["D", "各地文化各自獨立，不會受其他文化影響"]], "ans": "A", "exp": "義式披薩與臺灣飲食結合，形成新的文化內容，是文化交流帶來累積與創新的典型例子。"}, {"stem": "下列何者是「主流文化」的正確意義？", "opts": [["A", "由政府立法強制規定全體人民必須遵守的文化"], ["B", "只有少數特定群體才擁有的獨特文化"], ["C", "在社會中被大多數人遵循與認同的價值、信仰及規範"], ["D", "從國外傳入但尚未被本地社會接受的文化"]], "ans": "C", "exp": "主流文化指被社會上多數人認同與遵循的價值、信仰和規範，我國多以漢民族文化為主流，並非由法律強制規定。"}, {"stem": "下列何者最適合作為我國「主流文化」的例子？", "opts": [["A", "動漫愛好者的角色扮演（cosplay）活動"], ["B", "每年農曆三月許多民眾參與媽祖遶境的宗教活動"], ["C", "偶像明星粉絲群發展出的應援文化"], ["D", "網路社群使用縮短字詞、同音字的流行語"]], "ans": "B", "exp": "媽祖遶境是被我國多數人認同與參與的漢民族宗教活動，屬主流文化；(A)(C)(D) 都是特定群體發展出的次文化。"}, {"stem": "社會中的部分成員因為職業、年齡、宗教等差異，形成具有共同想法與行為模式的群體，並發展出專屬的獨特文化。這種文化稱為？", "opts": [["A", "主流文化"], ["B", "強勢文化"], ["C", "弱勢文化"], ["D", "次文化"]], "ans": "D", "exp": "因職業、年齡、宗教、族群等差異而形成的獨特文化即為次文化，如青少年次文化、應援文化等。"}, {"stem": "關於次文化的「次」字，下列說明何者正確？", "opts": [["A", "並非次等之意，只是有別於主流文化，兩者無高低優劣之分"], ["B", "表示比主流文化低一等，理應逐漸被淘汰"], ["C", "表示在社會中人數排名第二多的文化"], ["D", "表示尚未獲得政府承認、屬於違法的文化"]], "ans": "A", "exp": "次文化的「次」指的是「與主流文化有差異」，不是次等，兩者並存反而讓社會文化內涵更豐富多元。"}, {"stem": "下列何者最屬於「青少年次文化」的表現？", "opts": [["A", "全國學校統一使用國語進行教學"], ["B", "農曆春節時家家戶戶貼春聯"], ["C", "學生之間流行、以縮短字詞或同音字替代平常用語的網路用語"], ["D", "憲法明文保障人民的言論自由"]], "ans": "C", "exp": "網路流行語是青少年因年齡與共同生活經驗而發展出的獨特語言文化，屬於次文化；其餘選項屬主流文化或制度層面。"}, {"stem": "政府制定「新住民照顧服務措施」，協助新住民適應我國生活。此項政策最主要的目的是？", "opts": [["A", "要求新住民放棄原本的文化，全面融入主流文化"], ["B", "保障新住民的權利與福利，並使其文化能夠獲得尊重"], ["C", "限制新住民只能從事特定的少數行業"], ["D", "便於統計新住民的人數以加強管理"]], "ans": "B", "exp": "該措施是為了協助新住民適應生活、保障其權利與福利，並讓新住民帶來的文化受到尊重，屬於以政策落實多元文化的做法。"}, {"stem": "關於臺灣多元文化的形成，下列敘述何者最恰當？", "opts": [["A", "因為政府規定每個人都必須擁有不同的文化"], ["B", "因為臺灣自古以來只有漢民族一個族群"], ["C", "因為臺灣完全排除外來文化，才保有自己的特色"], ["D", "各族群先後因貿易、移民等因素來臺，帶來不同文化並相互交流融合"]], "ans": "D", "exp": "臺灣是移民社會，原住民族、閩南、客家、外省及新住民等族群先後來臺，各自帶來的文化相互接觸、支持與交流，形成豐富的多元文化。"}, {"stem": "下列何者是「文化位階」的正確意義？", "opts": [["A", "政府依法為各族群文化排定應優先保護的順序"], ["B", "文化隨著時間累積而內容愈來愈豐富的過程"], ["C", "不同文化相互接觸後產生競爭與排序，被區分出高低優劣、進步落後"], ["D", "各種文化平等並存、互相尊重的理想狀態"]], "ans": "C", "exp": "文化位階是不同文化接觸後產生的競爭與排序現象，使文化被分出高低優劣，進而造成文化間的不平等。"}, {"stem": "關於「強勢文化」，下列敘述何者正確？", "opts": [["A", "在經濟、權力、傳播媒體等資源上居於優勢，容易支配或評價其他文化"], ["B", "一定是社會中人口數量最多的族群所擁有的文化"], ["C", "其文化內容必然比其他文化更加優秀進步"], ["D", "因為資源不足而容易受到壓制，甚至面臨消失"]], "ans": "A", "exp": "強勢文化的關鍵在於「握有較多資源與權力」，而不是內容本身比較優越，更不是人口多寡的必然結果。(D) 是弱勢文化的描述。"}, {"stem": "關於「弱勢文化」，下列敘述何者正確？", "opts": [["A", "指使用人數較少，但受法律特別保障而享有優待的文化"], ["B", "資源處於劣勢、容易受到支配壓制，甚至面臨消失危機的文化"], ["C", "指年代較為久遠、已經不合時宜的傳統文化"], ["D", "指從國外傳入但還沒有被本地民眾接受的文化"]], "ans": "B", "exp": "弱勢文化是在資源與權力上處於劣勢、容易被強勢文化支配的一方，並非以年代久遠或人數多寡來界定。"}, {"stem": "強勢文化除了透過殖民、戰爭等強迫方式擴張外，還常透過什麼途徑影響弱勢文化？", "opts": [["A", "禁止人民接觸任何大眾傳播媒體"], ["B", "大幅減少本國商品的對外出口"], ["C", "立法保障弱勢文化的傳承與發展"], ["D", "以商品或媒體包裝行銷自身文化，使人在不自覺中接受其傳遞的觀念"]], "ans": "D", "exp": "強迫式的擴張容易引發抵抗與衝突；相對地，透過商品與媒體行銷則使弱勢文化在不自覺中接受強勢文化的價值觀，影響更為深遠。"}, {"stem": "「美國以豐厚的資源與資金製作電影，並大舉促銷至世界各國，無形中也傳遞了美國文化的價值觀。」這個現象最能說明什麼？", "opts": [["A", "強勢文化透過媒體與商品擴張其影響力"], ["B", "文化具有普遍性，各國文化本來就相同"], ["C", "弱勢文化正在對強勢文化進行抵抗"], ["D", "政府已經以立法方式保障了多元文化"]], "ans": "A", "exp": "電影是大眾傳播媒體，握有資源優勢的一方藉此行銷自身文化與價值觀，是強勢文化擴張的典型方式。"}, {"stem": "日治時期推行的「皇民化運動」獎勵說日語的民眾，並頒發「國語家庭」認定證書、辦理活動宣傳日語使用。此政策最能反映下列何種現象？", "opts": [["A", "統治者充分尊重臺灣各族群的母語"], ["B", "文化的累積性使臺灣的語言更加豐富"], ["C", "統治者藉由政策維護日語及其文化的優越地位，形成文化位階"], ["D", "臺灣民眾自願放棄母語，過程中沒有任何外力介入"]], "ans": "C", "exp": "皇民化運動是統治階級透過法令與教育等手段建立日語的優越地位、限制其他語言使用，屬於人為造成的文化位階。"}, {"stem": "政府遷臺後推行「國語運動」，從公務員、學校教育到出版發行、民間活動都要求以國語發音。此政策造成什麼影響？", "opts": [["A", "使各族群的母語都獲得平等的發展機會"], ["B", "臺語、客語、原住民族語等本土語言受到限制，今日面臨傳承困難"], ["C", "使臺灣成為一個沒有主流文化的社會"], ["D", "讓社會中所有的次文化都因此消失"]], "ans": "B", "exp": "國語運動使許多母語被禁止在公共場合使用，本土語言的使用人口大幅減少，造成今日語言傳承的困境。"}, {"stem": "西元1965年馬祖初級中學的學生手冊中，訂有「要說國語，不講方言」的生活公約。此規定最能說明什麼？", "opts": [["A", "文化具有普遍性，各校規定都相同"], ["B", "政府當時已積極保障語言的多樣性"], ["C", "學生可以自由選擇要使用哪一種語言"], ["D", "統治者透過學校教育強化語言之間的文化位階"]], "ans": "D", "exp": "學校是文化傳遞的重要場域，以校規要求學生不說方言，等於藉教育強化「國語優於方言」的高低排序，形成文化位階。"}, {"stem": "關於文化不平等現象，下列敘述何者最正確？", "opts": [["A 公權力制裁，故稱正式規範。法律無法規範內在思想，且其制定會受其他規範影響。"}, {"stem": "課本指出，國家通常只針對「社會最低限度的行為準則」制定法律。其主要原因為何？", "opts": [["A", "因為立法機關的立法委員人數不足"], ["B", "因為每個人對是非善惡認知不同，且法律無法涵蓋生活各層面"], ["C", "因為法律本身並不具有任何強制力"], ["D", "因為倫理道德的強制力遠高於法律"]], "ans": "B", "exp": "每個人對是非善惡標準不一，法律也不可能對社會生活各方面一一立法，因此僅就最低限度的行為準則加以規定。"}, {"stem": "「法律僅能約束人的外在行為，無法規範內在思想。」根據此敘述，最適當的推論是下列何者？", "opts": [["A", "維持社會秩序仍須各種社會規範相互輔助與配合"], ["B", "法律既然有此限制，就應該全面加以廢除"], ["C", "社會秩序僅靠法律一種規範即可完全維持"], ["D", "應將宗教信仰的戒律全部立法強制執行"]], "ans": "A", "exp": "正因法律有其侷限，風俗習慣、倫理道德、宗教信仰等非正式規範仍不可或缺，各種規範需相輔相成。"}, {"stem": "小明在捷運上未讓座給身旁的孕婦，引來其他乘客側目與議論。就社會規範的效力而言，下列敘述何者正確？", "opts": [["A", "他受到輿論批評，但不會受國家公權力制裁"], ["B", "他已觸犯法律，將被處以罰鍰"], ["C", "他會被警察強制帶回警局處理"], ["D", "他違反宗教戒律，須依戒律受罰"]], "ans": "A", "exp": "現行法律僅規範業者須設置優先席，並未強制民眾讓座。是否讓座取決於道德規範與個人決定，未讓座僅會受輿論批評。"}, {"stem": "下列各項行為中，何者屬於違反「正式規範」？", "opts": [["A", "過年時沒有回家與家人圍爐"], ["B", "在公車上大聲播放手機影片"], ["C", "清明節時沒有回鄉掃墓祭祖"], ["D", "在法規禁止的時段燃放爆竹煙火"]], "ans": "D", "exp": "施放爆竹煙火受爆竹煙火管理條例及地方法規限制，違反者將受公權力處罰，屬違反正式規範；其餘三者違反的是非正式規範。"}, {"stem": "關於「公權力」的敘述，下列何者最為正確？", "opts": [["A", "指人民彼此之間相互監督的力量"], ["B", "指宗教團體用以約束信徒的力量"], ["C", "指社會輿論對個人形成的批評壓力"], ["D", "指人民賦予政府執行法律與政策的權力"]], "ans": "D", "exp": "公權力是人民賦予政府執行法律和政策的權力，例如警察可在法律規定範圍內強制人民遵守其要求。"}, {"stem": "課本提到「法律是唯一具有強制力的社會規範」。根據此敘述，下列推論何者最為適當？", "opts": [["A", "其他社會規範對人們的行為毫無任何影響力"], ["B", "其他規範可透過良知與輿論發揮約束力，但無公權力制裁"], ["C", "應將其他社會規範全部改寫為法律條文"], ["D", "法律的功能已足以完全取代倫理道德"]], "ans": "B", "exp": "非正式規範雖不具強制力，仍能啟迪內在良知並約束外在行為，只是違反時由輿論與良心而非國家加以制裁。"}, {"stem": "下列何者是風俗習慣、倫理道德與宗教信仰三者的共同點？", "opts": [["A", "都由國家的立法機關制定通過"], ["B", "違反時都會受到國家公權力處罰"], ["C", "都具有啟迪內在良知、約束外在行為的功能"], ["D", "都是在短時間內迅速制定完成"]], "ans": "C", "exp": "三者皆由社會長時間累積形成，具有啟迪個人內在良知與約束外在行為的功能，但不具強制力。"}, {"stem": "傳統上人們習慣在節慶時施放爆竹煙火增添喜氣，但基於安全與居住品質考量，政府制定爆竹煙火管理條例加以規範。此例最能說明下列何者？", "opts": [["A", "非正式規範可以完全取代法律的功能"], ["B", "國家透過正式規範改變不合時宜的非正式規範"], ["C", "風俗習慣一旦形成之後就永遠不會改變"], ["D", "法律的制定完全不會受到任何文化影響"]], "ans": "B", "exp": "這是「正式規範改變非正式規範」的例子：國家以法律改變不分時間地點施放爆竹煙火的舊有習慣。"}, {"stem": "過去對身心障礙者的協助多出於善心助人，如今 能說明下列何者？", "opts": [["A", "傳統祭典與動物保護觀念在變遷中尋求新的平衡"], ["B", "宗教規範同樣具有國家公權力的強制力"], ["C", "我國法律已全面禁止舉辦任何民俗祭典"], ["D", "風俗習慣完全不受新興價值觀念的影響"]], "ans": "A", "exp": "隨動物保護與生命倫理觀念普及，傳統祭祀方式逐漸調整，展現風俗習慣隨社會變遷而調整的特性。"}, {"stem": "在臺灣，摸小孩的頭表示嘉許或鼓勵；但在泰國、寮國等地，此舉卻被視為禁忌。此現象說明社會規範具有下列何種特性？", "opts": [["A", "全世界各地的規範內容完全一致"], ["B", "會因地區與文化的不同而有差異"], ["C", "所有社會規範都必須由法律規定"], ["D", "社會規範的形成與宗教信仰無關"]], "ans": "B", "exp": "社會規範是文化的一環，不同文化間的規範不一定相同，某社會被允許的行為可能被另一社會視為違反規範。"}, {"stem": "同樣以米飯為主食，我們習慣端起碗吃飯、以碗就口喝湯，但南韓人認為這是不合宜的行為。面對這類文化差異，最適當的態度是下列何者？", "opts": [["A", "要求對方立即改成我們的做法"], ["B", "認定對方的社會規範是錯誤的"], ["C", "先了解彼此文化差異並學習尊重"], ["D", "推動立法統一各國的用餐禮儀"]], "ans": "C", "exp": "身處多元社會，應先了解彼此的文化差異，學習尊重他人的社會規範，才能避免誤解與衝突。"}, {"stem": "依身心障礙者權益保障法規定，未提供對號座的大眾運輸工具，應設置供有需要者優先乘坐的座位，其比率不得低於總座位數的多少？", "opts": [["A", "5%"], ["B", "10%"], ["C", "15%"], ["D", "25%"]], "ans": "C", "exp": "該法明定此類優先座位（原稱博愛座）比率不得低於總座位數的15%，並須標示或播放提醒禮讓座位的警語。"}, {"stem": "關於我國博愛座（優先席）的相關規定，下列敘述何者正確？", "opts": [["A", "法律強制民眾必須讓座，否則將被處罰"], ["B", "法律規範業者須設置座位，是否讓座仍取決道德與個人決定"], ["C", "民國114年修法後，我國已全面廢除該座位"], ["D", "修法之前，有實際需求的民眾不得使用該座位"]], "ans": "B", "exp": "法律僅規範業者設置座位並提醒禮讓，並未強制民眾讓座；民國114年修法是將博愛座更名為優先席，而非廢除。"}, {"stem": "白白在社群媒體上發布四則動態。下列哪一則所描述的情境，主要對應到「法律」這項社會規範？", "opts": [["A", "公車上有人把影片聲音開得很大聲"], ["B", "快考試了，和同學一起去文昌宮拜拜"], ["C", "在路口看見警察正在取締騎樓擺攤的攤販"], ["D", "端午節到了，要應景吃個粽子"]], "ans": "C", "exp": "警察依法取締違規擺攤，是國家行使公權力強制執行法律；(A)屬倫理道德、(B)屬宗教信仰、(D)屬風俗習慣。"}, {"stem": "承上題，「端午節到了，要應景吃個粽子」所對應的社會規範是下列何者？", "opts": [["A", "風俗習慣"], ["B", "宗教信仰"], ["C", "法律規定"], ["D", "倫理道德"]], "ans": "A", "exp": "端午節吃粽子屬於中華文化長期相沿成習的年節習俗，是典型的風俗習慣。"}, {"stem": "綜合本課所學，下列關於社會規範的敘述何者最為正確？", "opts": [["A", "社會規範雖可能限制部分自由，卻能減少衝突、促進社會和諧"], ["B", "只要制定完善的法律，社會秩序就能完全獲得維持"], ["C", "非正式規範因為不具強制力，對社會運作毫無作用"], ["D", "社會規範一旦形成之後，便不會隨時空環境而改變"]], "ans": "A", "exp": "遵守社會規範雖限制部分自由，但能減少社會衝突、促進和諧與群體進步。法律只是最低限度準則，非正式規範仍具約束功能，且各種規範都會隨時空變遷。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "下課鐘聲一響，同學們立刻衝出教室奔向籃球場，最早抵達的班級就能使用球場，晚到的同學只能在旁邊等待。上述球場的分配方式屬於下列何者？", "opts": [["A", "抽籤決定"], ["B", "輪流使用"], ["C", "先占先贏"], ["D", "預約登記"]], "ans": "C", "exp": "誰先到就歸誰使用，屬於「先占先贏」。抽籤靠運氣、輪流有排定順序、預約登記需事先登記，皆與題幹不符。"}, {"stem": "關於「先占先贏」這種資源分配方法的優點，下列敘述何者最正確？", "opts": [["A", "只要願意付出時間成本，就有機會取得資源"], ["B", "每個人取得資源的機率完全相同"], ["C", "最能因應每個人的個別差異與需求"], ["D", "可以完全避免使用者之間發生衝突"]], "ans": "A", "exp": "先占先贏的優點是規則簡單直接，只要願意花時間去占位就能取得資源。機率相同是抽籤的特色；滿足個別差異是相互協調的優點；先占先贏反而容易引發爭奪衝突。"}, {"stem": "學校把有限的電腦教室使用權以抽籤方式分配給各班，這種方法最可能產生下列何種缺點？", "opts": [["A", "動作慢的班級永遠搶不到"], ["B", "需要付出大量體力排隊等待"], ["C", "沒有登記的班級臨時無法使用"], ["D", "抽中的班級不一定真的需要，可能造成資源浪費"]], "ans": "D", "exp": "抽籤全憑運氣，抽中者不一定是最需要的人，真正有需求的人反而可能用不到，形成資源浪費。(A) 是先占先贏的缺點，(B) 是排隊使用的缺點，(C) 是預約登記的缺點。"}, {"stem": "某校規定每週一至週五各年級輪流使用視聽教室。這種資源分配方法的主要優點為何？", "opts": [["A", "使用者付出金錢即可優先取得"], ["B", "所有班級都有機會使用到該資源"], ["C", "一定能將資源分配給最需要的人"], ["D", "完全不需要學校介入管理"]], "ans": "B", "exp": "輪流使用的優點是人人（各班）都輪得到，機會平均。但輪到的人不一定有需求，這才是它的缺點，故 (C) 錯誤。"}, {"stem": "小禾班上想使用川堂布置成園遊會攤位，於是各班派代表開會溝通、彼此讓步後達成協議。關於這種「相互協調」的資源分配方法，下列何者是它的缺點？", "opts": [["A", "協調過程往往耗費較長時間，且不一定能成功"], ["B", "完全憑運氣，需要的人可能一直得不到"], ["C", "經濟弱勢者無法取得資源"], ["D", "缺乏彈性，臨時有需求時無法使用"]], "ans": "A", "exp": "相互協調能因應個別差異、滿足不同使用者需求，但溝通耗時，也未必談得攏。(B) 是抽籤的缺點，(C) 是使用者付費的缺點，(D) 是預約登記的缺點。"}, {"stem": "圖書館的討論室採「事先上網登記」的方式提供借用。這種分配方法最主要的缺點是什麼？", "opts": [["A", "造成使用者之間搶奪資源的衝突"], ["B", "讓有錢的人優先取得資源"], ["C", "缺乏彈性，若未事先登記，臨時就無法使用"], ["D", "需要花費大量體力排隊等候"]], "ans": "C", "exp": "預約登記可節省時間、減少糾紛、符合個人時間安排，但必須事先登記，臨時起意想用就用不到，彈性不足。"}, {"stem": "下列關於「使用者付費」這種資源分配方法的敘述，何者最為正確？", "opts": [["A", "它是最能保障弱勢者權益的方法"], ["B", "買賣雙方依自身利益選擇，通常最簡便且最有效率"], ["C", "它必須由政府主導才能進行"], ["D", "它可以確保每個人都取得相同數量的資源"]], "ans": "B", "exp": "使用者付費透過價格把資源分配給願意且能夠付費的人，買賣雙方各依自身利益判斷，是最簡便有效率的方法。但它對經濟弱勢者不利，也不保證人人取得相同數量。"}, {"stem": "某遊樂園推出「快速通關券」，多付一筆費用就能免排隊優先搭乘設施。有人批評這種做法並不公平，這種批評主要是針對「使用者付費」的哪一項缺點？", "opts": [["A", "分配速度太慢，效率不佳"], ["B", "需要耗費大量時間協調"], ["C", "容易造成資源長期被占用"], ["D", "在資源分配上處境不利者不易取得資源"]], "ans": "D", "exp": "使用者付費以「付得起錢」為門檻，經濟弱勢者難以享有資源，這正是它常被質疑不公平之處。"}, {"stem": "阿明想去人氣餐廳吃飯，於是先用手機App在網路上訂位，到店後直接入座，不必在門口排隊。餐廳採用的資源分配方法是下列何者？", "opts": [["A", "預約登記"], ["B", "先占先贏"], ["C", "抽籤決定"], ["D", "輪流使用"]], "ans": "A", "exp": "事先登記取得使用權，屬於預約登記，可節省現場排隊時間、符合個人時間安排並減少糾紛。"}, {"stem": "飛機依照票價高低分為經濟艙、商務艙與頭等艙，想要更寬敞舒適的座位就必須付出更高的費用。這種分配座位資源的方法是下列何者？", "opts": [["A", "抽籤決定"], ["B", "使用者付費"], ["C", "先占先贏"], ["D", "相互協調"]], "ans": "B", "exp": "透過價格高低分配不同等級的座位，願意付較高費用者享有較好的資源，屬於使用者付費。路邊停車格收費也是同樣的道理。"}, {"stem": "在日常生活的各種資源分配方法中，課本指出哪一種通常是「最簡便且最有效率」的方式？", "opts": [["A", "抽籤決定"], ["B", "先占先贏"], ["C", "輪流使用"], ["D", "使用者付費"]], "ans": "D", "exp": "透過價格把資源分配給願意付費的人，買賣雙方各自衡量利益，交易成本低，是市場上最常被使用、也最有效率的資源分配機制。"}, {"stem": "我國公共自行車推廣初期採「前30分鐘免費騎乘」，結果常出現一車難求；後來取消免費優惠、回歸付費使用後，無車可借的情形反而改善。這段敘述顯示公共自行車的資源分配方式產生了何種轉變？", "opts": [["A", "由使用者付費轉為抽籤決定"], ["B", "由輪流使用轉為預約登記"], ["C", "由先占先贏轉為使用者付費"], ["D", "由政府管制轉為相互協調"]], "ans": "C", "exp": "免費騎乘時誰先騎到就是誰的，屬於先占先贏；取消優惠後改由願意付費者使用，屬於使用者付費，需求較低者會減少借用，車輛周轉因而改善。"}, {"stem": "新冠肺炎（COVID-19）疫情爆發初期，口罩若完全自由買賣，價格立刻飆漲，許多收入較低的民眾因此買不到口罩。這個現象最能說明下列何項道理？", "opts": [["A", "單以價格來分配資源時，經濟處境不利者容易取得不到必需資源"], ["B", "價格機制無法反映消費者的購買意願"], ["C", "抽籤是分配防疫物資最有效率的方法"], ["D", "生產者不會因價格上漲而增加產量"]], "ans": "A", "exp": "價格雖然有效率，但對弱勢者不利，因此資源分配除了效率外還須兼顧公平正義，這正是政府後來介入管制口罩的理由。"}, {"stem": "某校規定籃球場「上課時間由學校排定各班體育課使用，下課時間則先到先用」。其中「上課時間由學校排定各班使用」屬於下列哪一種分配方法？", "opts": [["A", "使用者付費"], ["B", "輪流使用"], ["C", "先占先贏"], ["D", "抽籤決定"]], "ans": "B", "exp": "依照排定順序讓各班依序使用，屬於輪流使用；下課時間先到先用才是先占先贏。同一項資源在不同情況下可搭配多種分配方法。"}, {"stem": "課本提到，社會在分配資源時，除了追求「效率」之外，還必須考量下列何者？", "opts": [["A", "使每個人得到完全相同數量的資源"], ["B", "讓生產者獲得最高的利潤"], ["C", "由政府完全取代市場決定所有價格"], ["D", "分配是否合理，並符合公平正義"]], "ans": "D", "exp": "課本強調資源分配須兼顧效率與公平正義，特別是面對生存、醫療等基本人權議題時，更要照顧弱勢者的需求，而非只追求效率或齊頭式平均。"}, {"stem": "下列有關「消費行為」的敘述，何者最為正確？", "opts": [["A", "為滿足食、衣、住、行、育、樂等各方面欲望的行為"], ["B", "只有購買有形物品才算，接受服務不算"], ["C", "只有成年人才會從事，國中生不算消費者"], ["D", "運用資源製造與提供產品的行為"]], "ans": "A", "exp": "消費行為是為滿足各種欲望所進行的行為，購買產品或付費使用他人提供的服務都算，因此我們每個人都是消費者。(D) 描述的是生產行為。"}, {"stem": "小華花 60 元買一杯飲料。從經濟學的角度來看，這 60 元的「價格」對小華而言代表什麼？", "opts": [["A", "飲料店的生產成本"], ["B", "飲料店的利潤"], ["C", "他為了得到這杯飲料所付出的代價"], ["D", "這杯飲料的機會成本必定為零"]], "ans": "C", "exp": "消費者購買產品所支付的價格，就是為了得到該產品所付出的代價；價格高低會影響購買意願，進而影響金錢資源的分配。"}, {"stem": "在其他條件不變的情況下，當某項產品的價格上升時，消費者對該產品的購買數量通常會如何變化？", "opts": [["A", "增加"], ["B", "減少"], ["C", "完全不變"], ["D", "先增加後不變"]], "ans": "B", "exp": "價格上升代表消費者要付出的代價變高，會減少購買數量；價格下跌則代價變低，會增加購買數量，這是價格影響消費者最基本的原則。"}, {"stem": "當菠蘿麵包一個 30 元時，小華願意且能夠買 2 個；當價格上漲到 35 元時，他只買 1 個。若在其他條件不變下，麵包價格下降到 25 元，依課本的原則推論，小華的購買數量最可能為下列何者？", "opts": [["A", "0 個"], ["B", "1 個"], ["C", "2 個"], ["D", "3 個"]], "ans": "D", "exp": "價格下跌，消費者付出的代價變低，購買數量會增加。價格由 30 元降到 25 元，購買數量應多於原本的 2 個，故 3 個最合理。"}, {"stem": "手搖飲料店推出「第二杯半價」活動後，同學們買的杯數明顯增加。這個現象最能說明下列何者？", "opts": [["A", "價格下降會使消費者增加購買數量"], ["B", "消費者的所得水準提高了"], ["C", "消費者的偏好突然改變了"], ["D", "消費者預期未來價格會下跌"]], "ans": "A", "exp": "第二杯半價實際上降低了平均購買價格，屬於「價格因素」的影響，價格下跌使購買數量增加。所得、偏好、預期心理都屬於非價格因素，題幹中並未出現。"}, {"stem": "下列四位同學改變購買數量的原因中，何者是由「價格因素」所造成的？", "opts": [["A", "小美因為喜歡的偶像代言，買了兩罐洗髮精"], ["B", "阿豪發現常喝的牛奶漲價，改成兩天喝一瓶"], ["C", "小柏打工賺了錢，所得增加後開始每天吃早午餐"], ["D", "阿宏聽說下週衛生紙要漲價，先搬了三箱回家"]], "ans": "B", "exp": "只有 (B) 是因為「產品本身價格改變」而改變購買數量，屬於價格因素。(A) 是偏好、(C) 是所得水準、(D) 是預期心理，都屬於非價格因素。"}, {"stem": "颱風來襲前，民眾預期颱風過後蔬菜價格將大幅上漲，紛紛在賣場搶購蔬菜。此時影響消費者購買行為的主要因素為何？", "opts": [["A", "蔬菜目前的價格下跌"], ["B", "消費者的所得增加"], ["C", "消費者對未來價格的預期心理"], ["D", "生產者降低了生產成本"]], "ans": "C", "exp": "民眾是因為「預期未來會漲價」而提前大量購買，屬於非價格因素中的預期心理，而非現在的價格改變。"}, {"stem": "近年來我國國民所得逐年增加，出國旅遊的人次也隨之明顯成長。影響此一消費現象的主要因素是下列何者？", "opts": [["A", "機票價格大幅下跌"], ["B", "消費者預期機票將漲價"], ["C", "政府管制旅遊人數"], ["D", "消費者的所得水準提高"]], "ans": "D", "exp": "題幹明確指出是「國民所得增加」帶動出國人次成長，屬於非價格因素中的所得水準。所得增加，消費者對產品的購買能力與意願隨之提高。"}, {"stem": "某泡麵廠商斥資請當紅明星代言新產品，廣告推出後銷量明顯上升。廠商此舉主要是希望影響消費者的哪一項因素？", "opts": [["A", "消費者的偏好"], ["B", "消費者的所得水準"], ["C", "產品本身的價格"], ["D", "廠商的生產成本"]], "ans": "A", "exp": "請明星代言、加深商品印象，是為了提高消費者對該產品的喜好程度（偏好），屬於非價格因素，並未改變產品售價。"}, {"stem": "下列各項措施中，何者最主要是基於「公平正義」而非「效率」的考量？", "opts": [["A", "快篩試劑開放民眾自由購買"], ["B", "民營客運停駛長期虧損的路線"], ["C", "政府補助業者維持偏鄉公車路線"], ["D", "電影院依座位位置訂定不同票價"]], "ans": "C", "exp": "補助虧損的偏鄉公車路線並不符合效率原則，而是為了保障偏鄉居民的交通權益，屬於公平正義的考量。(A)(B)(D) 都是讓資源依市場機制做最有效率的運用。"}, {"stem": "下列關於影響消費者資源分配之因素的敘述，何者正確？", "opts": [["A", "只有產品價格會影響消費者的購買決定"], ["B", "所得水準、消費者偏好與預期心理都屬於非價格因素"], ["C", "預期未來會漲價時，消費者會減少現在的購買量"], ["D", "消費者所得增加時，購買數量必定會減少"]], "ans": "B", "exp": "除了價格因素外，所得水準、消費者偏好、對未來價格的預期心理等非價格因素也會影響消費。預期漲價時通常會提前搶購，(C) 錯誤；所得增加通常會提高購買力，(D) 錯誤。"}, {"stem": "消費者小南對空心菜與青江菜的喜好程度相同。某日他到菜市場，發現空心菜的價格比青江菜高出許多。在其他條件不變下，依課本推論小南最可能的選擇及原因為何？", "opts": [["A", "買空心菜，因為價格高代表品質好"], ["B", "買空心菜，因為他的偏好改變了"], ["C", "兩種都不買，因為所得減少了"], ["D", "買青江菜，因為在喜好相同時會選擇代價較低者"]], "ans": "D", "exp": "在偏好相同、其他條件不變時，消費者會依價格高低做出對自己最有利的選擇，選擇價格較低的青江菜，這正是價格影響消費者資源分配的表現。"}, {"stem": "下列有關「生產行為」與「生產者」的敘述，何者最為正確？", "opts": [["A", "運用各種資源製造或提供產品的行為稱為生產行為，其決策者稱為生產者或廠商"], ["B", "只有大型企業的董事長才算生產者"], ["C", "生產行為只包括製造有形的物品"], ["D", "生產者從事生產的主要目的是追求公平正義"]], "ans": "A", "exp": "生產行為是運用資源製造或提供產品的行為，決策者即生產者（廠商），包含大公司董事長、早餐店老闆、市場小販等。生產也包含提供醫療、清潔等無形服務，且主要目的是獲取利潤。"}, {"stem": "生產者運用資源所生產出來的成果稱為「產品」，包括有形的財貨與無形的勞務。下列何者屬於「勞務」？", "opts": [["A", "農夫種出來的稻米"], ["B", "工廠生產的球鞋"], ["C", "醫師提供的診療服務"], ["D", "麵包店做出的吐司"]], "ans": "C", "exp": "稻米、球鞋、吐司都是看得見、摸得到的有形物品，屬於財貨；醫療、清潔、運輸等無形的服務則屬於勞務，兩者都是生產出來的產品。"}, {"stem": "下列四個人當中，何者在經濟活動中最明顯是扮演「生產者」的角色？", "opts": [["A", "到超商買飲料解渴的高中生"], ["B", "在夜市擺攤賣鹽酥雞的小販"], ["C", "花錢去電影院看電影的上班族"], ["D", "付費搭乘捷運通勤的乘客"]], "ans": "B", "exp": "賣鹽酥雞的小販是製造並提供產品的決策者，屬於生產者；其餘三者都是付費取得產品或服務以滿足欲望，屬於消費者。"}, {"stem": "一般而言，生產者從事生產行為最主要的目的是下列何者？", "opts": [["A", "增加就業機會"], ["B", "提升國家形象"], ["C", "消除資源的稀少性"], ["D", "獲取利潤"]], "ans": "D", "exp": "課本指出生產者從事生產行為是為了獲取利潤，並以利潤的角度考量如何把所擁有的資源做最有效的配置。"}, {"stem": "依課本的定義，「利潤」應如何計算？", "opts": [["A", "銷貨收入扣除生產成本後所剩下的部分"], ["B", "產品價格乘以生產成本"], ["C", "生產成本扣除銷貨收入"], ["D", "產品價格加上生產成本"]], "ans": "A", "exp": "利潤＝銷貨收入－生產成本。因此廠商想提高利潤，只有兩條路：增加銷貨收入，或降低生產成本。"}, {"stem": "某飲料店一杯紅茶售價 40 元，本月共賣出 2,000 杯。依課本定義，該店本月紅茶的「銷貨收入」應如何計算？", "opts": [["A", "40 元減去每杯的成本"], ["B", "40 元 × 2,000 杯"], ["C", "2,000 杯除以 40 元"], ["D", "40 元加上 2,000 杯的成本"]], "ans": "B", "exp": "銷貨收入是銷售產品的收入，等於產品價格乘以銷售量，即 40×2,000＝80,000 元。要增加銷貨收入，可提高價格或增加銷售量。"}, {"stem": "某手搖飲品牌老闆想提高店裡的利潤。依課本所述，他可以採取的方向為何？", "opts": [["A", "只能提高產品價格，別無他法"], ["B", "只能減少員工人數"], ["C", "增加銷貨收入或降低生產成本"], ["D", "同時增加成本並減少收入"]], "ans": "C", "exp": "因為利潤＝銷貨收入－生產成本，所以提高利潤的兩大方法就是增加銷貨收入（提高價格或增加銷售量）與降低生產成本。"}, {"stem": "生產成本是生產者使用生產資源時必須支付的代價。其中「支付使用土地的成本」，一般稱為下列何者？", "opts": [["A", "地租"], ["B", "薪資"], ["C", "利息"], ["D", "利潤"]], "ans": "A", "exp": "使用土地的代價稱為地租，聘雇員工的代價稱為薪資，向銀行借款的代價稱為利息，這些都屬於生產成本；利潤則是收入扣除成本後剩下的部分。"}, {"stem": "某餐廳老闆向銀行貸款 200 萬元購買新式烤箱，每年須支付銀行一筆費用。這筆費用屬於下列哪一種生產成本？", "opts": [["A", "地租"], ["B", "薪資"], ["C", "利潤"], ["D", "利息"]], "ans": "D", "exp": "向銀行貸款所支付的代價稱為利息，屬於生產成本的一種。生產資源的價格會影響生產成本，進而影響生產者的資源分配。"}, {"stem": "某連鎖餐廳引進自助點餐機取代部分外場人員，並取消電視廣告支出。該餐廳這些做法主要是想達成下列何項目的？", "opts": [["A", "增加產品的銷售數量"], ["B", "降低生產成本以提高利潤"], ["C", "提高產品的售價"], ["D", "增加消費者的所得水準"]], "ans": "B", "exp": "減少人力支出、刪減廣告支出、減少店面租金與水電原料支出，都是降低生產成本的方法，目的在於提高利潤。不過降低成本時仍須維持產品品質，才能維持商譽、留住消費者。"}, {"stem": "某早餐店推出集點兌換、加開外送服務並發送折價傳單，來店人次因而明顯增加。該店的做法主要是想達成下列何者？", "opts": [["A", "降低員工薪資支出"], ["B", "減少店面租金"], ["C", "增加銷售數量以提高銷貨收入"], ["D", "降低原料的採購價格"]], "ans": "C", "exp": "發傳單、請人代言、增加外送服務等，都是刺激消費意願、提高銷售數量的方法，目的在增加銷貨收入。若是減少支出，才屬於降低生產成本。"}, {"stem": "生產者在進行生產決策時，必須面對三大生產選擇的課題。下列何者正確地列出這三項課題？", "opts": [["A", "生產什麼、如何生產、為誰生產"], ["B", "賣多少錢、賣給誰、什麼時候賣"], ["C", "誰出資、誰管理、誰負責"], ["D", "資源有限、欲望無窮、必須選擇"]], "ans": "A", "exp": "生產者必須決定「生產什麼」「如何生產」「為誰生產」三大課題，並以利潤的角度考量如何把有限的資源做最有效的配置。"}, {"stem": "農夫昱平種出有機酪梨後，思考究竟要主打運動員市場，還是鎖定注重養生的上班族。他正在思考的是下列哪一項生產課題？", "opts": [["A", "生產什麼"], ["B", "如何生產"], ["C", "生產多少"], ["D", "為誰生產"]], "ans": "D", "exp": "決定針對哪些特性的消費族群研發與行銷，屬於「為誰生產」的課題；決定種水稻或酪梨是「生產什麼」，決定用哪種肥料或製程則是「如何生產」。"}, {"stem": "麵包店老闆在思考究竟要聘請師傅以手工製作麵包，還是購買自動化機器大量生產。他所面對的是下列哪一項生產課題？", "opts": [["A", "生產什麼"], ["B", "如何生產"], ["C", "為誰生產"], ["D", "賣給誰"]], "ans": "B", "exp": "選擇手工製作或機器生產，是在決定生產的方式與所使用的生產資源組合，屬於「如何生產」的課題。"}, {"stem": "農夫阿德原本種植小白菜，每公斤售價 50 元。近來小白菜價格上漲到每公斤 70 元，而青江菜價格不變。在其他條件不變下，阿德最可能採取下列何種做法？", "opts": [["A", "減少小白菜產量，改種青江菜"], ["B", "完全停止耕作"], ["C", "增加小白菜的種植面積與產量"], ["D", "把小白菜的售價降到 30 元"]], "ans": "C", "exp": "產品價格上漲代表每公斤可多賺 20 元，利潤增加，生產者會願意增加產量。這說明「價格愈高，生產數量增加」的原則。"}, {"stem": "某農夫的土地只能擇一種植。當市場上高麗菜價格提高時，他選擇多種高麗菜；當高麗菜價格下跌、白蘿蔔價格提高時，他就改種白蘿蔔。這個例子最能說明下列何項概念？", "opts": [["A", "產品價格的變動會影響生產者對資源的分配"], ["B", "消費者的偏好決定了農產品的生產成本"], ["C", "政府管制是決定生產內容的唯一因素"], ["D", "生產成本與生產選擇之間毫無關係"]], "ans": "A", "exp": "農夫的土地是有限資源，他會依照哪一種作物價格較高（利潤較大）來決定種什麼，這正是價格引導生產者做資源分配的典型例子。"}, {"stem": "新聞報導：某地高麗菜價格暴跌，農民乾脆放棄採收，開放民眾免費入園自行採摘。依課本概念判斷，農民做此決定最主要的原因為何？", "opts": [["A", "農民希望藉此提高高麗菜的市場價格"], ["B", "農民想藉此增加銷貨收入"], ["C", "政府規定農產品必須免費開放"], ["D", "採收所需的成本已超過可得的銷貨收入，採收反而虧損"]], "ans": "D", "exp": "當價格低到採收成本大於銷貨收入時，採收不但沒有利潤還會虧損，農民自然放棄採收。這也顯示價格下跌會使生產意願與生產數量減少。"}, {"stem": "飲料店老闆宇軒堅持使用新鮮木瓜製作木瓜牛奶。若木瓜的價格下跌，而木瓜牛奶的售價與銷售量都維持不變，則木瓜牛奶這項產品最可能出現下列何種變化？", "opts": [["A", "銷貨收入減少"], ["B", "利潤增加"], ["C", "生產成本增加"], ["D", "生產意願降低"]], "ans": "B", "exp": "木瓜是原料，價格下跌使生產成本降低；售價與銷售量不變表示銷貨收入不變。利潤＝銷貨收入－生產成本，成本下降則利潤增加，生產意願也會提高。"}, {"stem": "某廠商評估生產甜甜圈與生產衣服兩種方案，估計兩者的銷貨收入都是 80 萬元，但甜甜圈的生產成本為 50 萬元、衣服的生產成本為 65 萬元。若僅考量利潤，該廠商的選擇及理由為何？", "opts": [["A", "選擇生產衣服，因為成本較高代表品質較好"], ["B", "兩者皆可，因為兩者利潤相同"], ["C", "選擇生產甜甜圈，因為銷貨收入相同時成本較低者利潤最大"], ["D", "兩者都不生產，因為都會虧損"]], "ans": "C", "exp": "甜甜圈利潤為 80－50＝30 萬元，衣服利潤為 80－65＝15 萬元。當銷貨收入相同時，生產成本較低者利潤較大，廠商自然選擇生產甜甜圈。"}, {"stem": "疫情期間我國政府實施「口罩實名制」，管制口罩的價格與購買數量。這種政府介入管制的做法，最主要的缺點為下列何者？", "opts": [["A", "市場缺乏競爭，消費者與生產者可選擇的空間變少"], ["B", "使口罩價格大幅飆漲"], ["C", "讓經濟弱勢者完全買不到口罩"], ["D", "使政府無法達成穩定價格的目標"]], "ans": "A", "exp": "政府管制的優點是公平、穩定價格，確保人人買得到；缺點則是市場缺乏競爭，消費者與生產者的選擇都變少。價格飆漲與弱勢者買不到，反而是「自由買賣」時可能出現的問題。"}, {"stem": "某文具廠商發現自家筆記本的售價從 60 元調漲為 80 元後，銷售數量仍維持不變。在其他條件不變下，依課本原則推論該廠商最可能採取下列何種做法？", "opts": [["A", "立即停止生產筆記本"], ["B", "轉而生產利潤更低的產品"], ["C", "大幅提高生產成本"], ["D", "增加筆記本的生產數量"]], "ans": "D", "exp": "價格上漲而銷售數量不變，表示銷貨收入與利潤增加，生產者會願意增加產量；反之價格下跌則會減產，或改生產其他利潤較高的產品。"}, {"stem": "某手搖飲店老闆打算把每杯飲料調漲 15 元，以增加銷貨收入。依課本概念，他在做決定時最應該同時考量下列何者？", "opts": [["A", "政府是否會立法禁止漲價"], ["B", "價格上漲後消費者的購買數量可能減少，使銷售量下降"], ["C", "漲價一定會使生產成本同步下降"], ["D", "消費者的所得必定會因此提高"]], "ans": "B", "exp": "銷貨收入＝價格×銷售量。提高價格雖能增加每杯的收入，但價格上升會使消費者減少購買數量、銷售量下降，未必真的能增加銷貨收入，因此漲價必須審慎評估。"}, {"stem": "課本形容價格就像是「一隻看不見的手」。關於市場價格的形成與功能，下列敘述何者最為正確？", "opts": [["A", "市場價格完全由政府單方面決定"], ["B", "市場價格只由生產者依生產成本片面決定"], ["C", "市場價格由消費者與生產者共同決定，並引導資源做最有效率的分配與使用"], ["D", "市場價格的高低與資源如何分配之間沒有任何關聯"]], "ans": "C", "exp": "消費者依價格決定買多少，生產者依價格決定生產多少，雙方在市場上互相調整、達成共識後共同決定產品價格，使資源流向最有價值的用途，這就是價格「看不見的手」的功能。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "課本引用「科技始終來自於人性」這句話。關於科技發展的主要目的，下列敘述何者最為正確？", "opts": [["A", "為了完全取代人類的所有勞動工作"], ["B", "為了改善人類生活，使生活更加便利舒適"], ["C", "為了讓國家能夠壟斷國際貿易市場"], ["D", "為了限制人民自由以維護社會秩序"]], "ans": "B", "exp": "科技發展的主要目的是改善人類生活，但同時也隱藏著風險和隱憂，因此我們必須學習如何善用科技、持善去惡。"}, {"stem": "下列何者最符合課本對「資訊科技」的定義？", "opts": [["A", "專門用來設計交通工具引擎的機械技術"], ["B", "以基因改造提升農作物產量的生物技術"], ["C", "透過電腦網路和電信傳輸等資訊系統，迅速傳遞、蒐集、儲存圖文影音與訊息的技術"], ["D", "利用核能發電供應家庭用電的能源技術"]], "ans": "C", "exp": "資訊科技是指透過電腦網路與電信傳輸等資訊系統，快速傳遞、蒐集、儲存圖文影音與訊息的技術，是現代科技中影響最顯著的一項。"}, {"stem": "下列何者屬於資訊科技發展帶來的「正面」影響？", "opts": [["A", "民眾可以藉由網路平臺參與公共事務"], ["B", "網路詐騙案件層出不窮"], ["C", "個人醫療紀錄遭到他人變賣"], ["D", "假訊息流竄造成民眾錯誤判斷"]], "ans": "A", "exp": "網路使資訊快速傳播、打破國界限制、加速電子商務往來，也讓人民能透過網路平臺參與公共事務，屬於正面影響；(B)(C)(D) 都是資訊科技的隱憂。"}, {"stem": "網路上流傳「某食品含有致癌物」的貼文，許多民眾未經查證就大量轉傳，事後證實為假消息。這最能說明資訊科技的何項隱憂？", "opts": [["A", "網路犯罪層出不窮"], ["B", "資訊公開侵犯隱私"], ["C", "智慧財產難以保障"], ["D", "資訊內容真偽難辨"]], "ans": "D", "exp": "網路普及加速訊息傳遞，但民眾不易辨別訊息真偽，可能造成錯誤判斷，這正是「資訊內容真偽難辨」的隱憂。"}, {"stem": "某企業將蒐集到的顧客醫療紀錄與財務資料轉賣給廣告商牟利。這最能反映資訊科技的何項隱憂？", "opts": [["A", "資訊內容真偽難辨"], ["B", "資訊公開侵犯隱私"], ["C", "科技發展造成大量失業"], ["D", "網路使用打破國界限制"]], "ans": "B", "exp": "個人醫療紀錄、財務資訊等資料若遭他人濫用或變賣，對民眾的隱私與財產將構成威脅，屬於「資訊公開侵犯隱私」的隱憂。"}, {"stem": "阿明架設假的購物網站，騙取民眾匯款後隨即關閉網站。此行為最符合資訊科技的何項隱憂？", "opts": [["A", "網路犯罪層出不窮"], ["B", "資訊內容真偽難辨"], ["C", "資訊公開侵犯隱私"], ["D", "著作財產權遭到侵害"]], "ans": "A", "exp": "利用電腦網路進行犯罪，如網路詐騙、電腦駭客等，已成為嚴重的社會問題，屬於「網路犯罪層出不窮」。"}, {"stem": "小華未經同意，破解同學電腦的密碼並登入查看私人檔案。依課本說明，此行為最可能觸犯下列何者？", "opts": [["A", "著作權法的重製罪"], ["B", "商標法的仿冒罪"], ["C", "刑法的妨害電腦使用罪"], ["D", "專利法的侵害專利罪"]], "ans": "C", "exp": "課本明白指出，若無故駭入他人電腦，會觸犯刑法的「妨害電腦使用罪」。"}, {"stem": "小玲把班上同學的身分證字號、住家電話張貼在公開的網路社團。此行為最可能違反下列哪一部法律？", "opts": [["A", "著作權法"], ["B", "專利法"], ["C", "商標法"], ["D", "個人資料保護法"]], "ans": "D", "exp": "洩漏他人隱私資料會違反個人資料保護法；身分證字號、電話等屬於足以辨別個人的個人資料。"}, {"stem": "面對跨國網路犯罪頻傳，課本提到我國政府積極推動參與下列哪一個組織，希望透過國際合作打擊網路犯罪？", "opts": [["A", "世界貿易組織"], ["B", "國際刑警組織"], ["C", "世界衛生組織"], ["D", "世界智慧財產組織"]], "ans": "B", "exp": "跨國犯罪集團藉由網路犯罪，導致國家安全、企業運作與民眾財產受害，臺灣希望參與國際刑警組織，透過國際合作打擊網路犯罪。"}, {"stem": "關於「資訊倫理」的實踐，下列做法何者最為適當？", "opts": [["A", "在網路上發言尊重他人，並對自己的言論負責"], ["B", "看到聳動的訊息立刻轉傳，讓更多人知道"], ["C", "為了報復同學，把對方的私人照片公開分享"], ["D", "使用免費軟體時，順手破解其付費功能"]], "ans": "A", "exp": "個人應遵守資訊倫理規範，尊重他人並對自己的言論負責；轉傳未查證訊息、散布他人私密照片、破解軟體都違反資訊倫理甚至違法。"}, {"stem": "下列何者最符合「數位足跡」（Digital Footprint）的意義？", "opts": [["A", "政府為了防疫而記錄民眾的健康狀況"], ["B", "電腦系統自動備份的作業系統檔案"], ["C", "我們在網路上從事的所有活動或行為所留下的痕跡，如搜尋過的關鍵字、分享過的照片、看過的影片"], ["D", "網路業者為使用者設定的專屬帳號與密碼"]], "ans": "C", "exp": "數位足跡就是我們在網路上活動所留下的痕跡，包括搜尋關鍵字、分享的照片、影音平臺看過的影片等。"}, {"stem": "上班族小雯對美妝有興趣，常上網瀏覽新品，最近她發現社群網站不斷跳出美妝品牌廣告。雖然她從未主動留下個資，社群網站卻已掌握她的興趣與搜尋模式。這個現象主要凸顯何種爭議？", "opts": [["A", "科技發展威脅國家安全的維護"], ["B", "智慧財產權因科技發展而受限"], ["C", "國家利益與個人利益間的衝突"], ["D", "科技發展對於個人隱私的侵犯"]], "ans": "D", "exp": "數位足跡可讓企業追蹤個人的興趣及慣用搜尋模式，若被不當利用就會衍生個資隱私爭議，屬於科技發展對個人隱私的侵犯。"}, {"stem": "下列何種做法最有助於減少留下數位足跡、避免個資外洩？", "opts": [["A", "線上遊戲或線上購物結束後確實登出，並定期清除 cookie、掃毒"], ["B", "一律使用社群網站帳號快速註冊其他網站與遊戲"], ["C", "在所有網站都使用同一組簡單好記的密碼"], ["D", "隨手點擊網頁跳出的廣告以了解最新商品"]], "ans": "A", "exp": "課本的檢核建議包括：使用完畢確實登出、定期清除 cookie 與掃毒、避免用社群帳號註冊其他網站，才能減少數位足跡與個資外洩風險。"}, {"stem": "下列關於「智慧財產」的敘述，何者最為正確？", "opts": [["A", "是指創作者所擁有的土地、房屋等不動產"], ["B", "是創作者花費心力與智慧，透過構思、創作、發明等過程而產生價值的無形產物"], ["C", "是政府為鼓勵創作而發給創作者的獎金"], ["D", "是任何人只要腦中想到就能主張擁有的想法"]], "ans": "B", "exp": "智慧財產是經由構思、創作、發明等過程產生價值的「無形」產物，具有原創性與經濟價值，不是土地房屋等有形財產。"}, {"stem": "課本指出「智慧財產權」是指下列何者？", "opts": [["A", "人民依法對自己土地所享有的支配權利"], ["B", "消費者購買商品後所享有的退換貨權利"], ["C", "人類精神活動的成果且能產生經濟上的價值，而受到法律保護的權利"], ["D", "政府對於國家重要產業所享有的專賣權利"]], "ans": "C", "exp": "智慧財產權的定義是「人類精神活動的成果且能產生經濟上的價值，而受到法律保護的權利」。"}, {"stem": "國家立法保障智慧財產權，最主要的目的為何？", "opts": [["A", "增加政府的稅收來源"], ["B", "限制外國商品進入本國市場"], ["C", "讓創作者能永久獨占其創作，不受任何限制"], ["D", "讓創作者可自行利用其智慧財產獲取報酬，以激勵創作意願"]], "ans": "D", "exp": "保障智慧財產權是為了讓創作者能利用其創作成果獲取報酬，鼓勵更多人投入創作，並防止抄襲仿冒扼殺創作意願。"}, {"stem": "下列哪一部法律的立法目的是「保障著作人著作權益，調和社會公共利益，促進國家文化發展」？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "個人資料保護法"]], "ans": "A", "exp": "著作權法的立法目的即為保障著作人權益、調和社會公共利益、促進國家文化發展。"}, {"stem": "某部法律的目的是「保障商標權及消費者利益，維護市場公平競爭，促進企業正常發展」。該法律應為下列何者？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "個人資料保護法"]], "ans": "B", "exp": "商標法保障商標權及消費者利益，維護市場公平競爭，促進企業正常發展。"}, {"stem": "「鼓勵、保護、利用發明、新型及設計創作，以促進產業發展」是下列哪一部法律的立法目的？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "民法"]], "ans": "C", "exp": "專利法的立法目的在鼓勵、保護、利用發明、新型及設計創作，以促進產業發展。"}, {"stem": "關於智慧財產權的取得方式，下列敘述何者正確？", "opts": [["A", "著作權必須經過申請審查核准後才能取得"], ["B", "商標權於商品製造完成時即自動取得"], ["C", "專利權經註冊登記後立即取得，不需審查"], ["D", "著作權於創作完成時即享有，專利權則須經申請審查核准後才取得"]], "ans": "D", "exp": "三種權利的取得方式不同：著作權「創作完成即享有」、商標權「經註冊取得」、專利權「申請審查核准後取得」。這是段考常考的辨別重點。"}, {"stem": "陳老闆設計了一個獨特圖案，想作為自家飲料店的招牌標誌並專用。依課本說明，他應如何取得該圖案的商標權？", "opts": [["A", "向主管機關申請註冊，經核准後取得"], ["B", "設計完成時即自動取得，不必辦理任何手續"], ["C", "只要先在店門口懸掛使用滿一年即可取得"], ["D", "向法院提起訴訟，由法官判決取得"]], "ans": "A", "exp": "商標權必須「經註冊取得」，與著作權「創作完成即享有」不同。"}, {"stem": "小天自己作詞作曲寫了一首歌，並錄製成音檔。這首歌屬於下列哪一種智慧財產權的保障範圍？", "opts": [["A", "商標權"], ["B", "專利權"], ["C", "著作權"], ["D", "營業秘密權"]], "ans": "C", "exp": "著作權法保障文學、科學、藝術或其他學術範圍的創作，音樂創作屬於著作權保障的範圍，且創作完成即享有。"}, {"stem": "某公司研發出「可自動偵測空氣品質並調整風速的電風扇」，具有產業利用價值，想申請法律保護。應依下列哪一部法律申請？", "opts": [["A", "著作權法"], ["B", "專利法"], ["C", "商標法"], ["D", "個人資料保護法"]], "ans": "B", "exp": "具有產業利用價值的發明與重要研究成果，可依專利法申請專利權。"}, {"stem": "知名超商的招牌標誌可以用來區別自己與他人的商品或服務。這屬於下列何者的保障範圍？", "opts": [["A", "專利權"], ["B", "著作權"], ["C", "著作人格權"], ["D", "商標權"]], "ans": "D", "exp": "商標是可用來區別自己與他人商品或服務的標誌，受商標法保障。"}, {"stem": "下列有關智慧財產權類型的配對，何者完全正確？", "opts": [["A", "小說創作—著作權；手機新技術—專利權；企業標誌—商標權"], ["B", "小說創作—商標權；手機新技術—著作權；企業標誌—專利權"], ["C", "小說創作—專利權；手機新技術—商標權；企業標誌—著作權"], ["D", "小說創作—著作權；手機新技術—商標權；企業標誌—專利權"]], "ans": "A", "exp": "文學藝術創作歸著作權、具產業利用價值的技術發明歸專利權、辨識商品服務來源的標誌歸商標權，三者要能清楚辨別。"}, {"stem": "某公司設計的商標與知名品牌太過近似，使消費者有混淆誤認之虞。依課本說明，此商標會有何結果？", "opts": [["A", "仍可註冊，但須支付原品牌權利金"], ["B", "無法註冊取得商標權"], ["C", "可以註冊，但保護期限縮短為十年"], ["D", "應改依專利法申請保護"]], "ans": "B", "exp": "太過近似的商標，使消費者有混淆誤認之虞者，無法註冊商標，以維護市場公平競爭與消費者利益。"}, {"stem": "一家廠商在設計新產品時，想使用他人已取得的專利技術。正確的做法為何？", "opts": [["A", 處以有期徒刑、拘役或罰金等刑罰？", "opts": [["A", "引用他人文章一小段並註明出處"], ["B", "在社群網站分享官方影片的網址連結"], ["C", "向同學借書來閱讀"], ["D", "未經授權擅自重製遊戲軟體並販售盜版"]], "ans": "D", "exp": "未經授權擅自重製遊戲軟體、販售盜版、將影劇音樂在網路上公開傳輸等，侵害他人著作權益嚴重，可能被處有期徒刑、拘役或科（併科）罰金。"}, {"stem": "我國為審理智慧財產權相關案件，特別設立下列哪一個機關？", "opts": [["A", "憲法法庭"], ["B", "少年及家事法院"], ["C", "智慧財產及商業法院"], ["D", "中央選舉委員會"]], "ans": "C", "exp": "因科技推陳出新使智慧財產權糾紛層出不窮，我國設立智慧財產及商業法院，專責審理相關案件。"}, {"stem": "課本提到西元 2001 年被提出的「創用 CC」概念，其主要作用為何？", "opts": [["A", "讓著作人挑選適合的授權條款並簡易標示，降低著作在流通與使用上的法律障礙"], ["B", "由政府統一收取權利金後再分配給創作者"], ["C", "讓所有著作在完成之後立即進入公共領域"], ["D", "提供創作者免費申請專利權的管道"]], "ans": "A", "exp": "創用 CC 讓著作人從中挑選適合自己著作的授權條款，透過簡易標示將著作授權給大眾使用，降低法律障礙並兼顧私益與公益。"}, {"stem": "茸茸老師喜歡在網路上分享自己設計的學習單，同意有需要的人下載並自行修改，但必須標示作者姓名，且不得用來營利。她的授權條件最符合下列哪一組創用 CC 標示？", "opts": [["A", "姓名標示、禁止改作"], ["B", "姓名標示、非商業性"], ["C", "非商業性、禁止改作"], ["D", "完全不設任何條件"]], "ans": "B", "exp": "「必須標示作者姓名」對應「姓名標示」，「不得營利」對應「非商業性」；因為允許自行修改，所以不能標示「禁止改作」。"}, {"stem": "課本提到近來 ChatGPT 等 AI 工具興起。關於使用 AI 產出的圖畫、文章，下列敘述何者最為正確？", "opts": [["A", "AI 產生的內容一律不受任何法律規範"], ["B", "只要是 AI 做出來的，直接引用一定沒有侵權問題"], ["C", "AI 產出的內容必須先申請商標才可以使用"], ["D", "若直接引用 AI 所產出的圖畫、文章，仍可能有侵權疑慮"]], "ans": "D", "exp": "課本指出運用 AI 所產出的圖畫、文章，若是直接引用，也可能有侵權疑慮，使用時仍須留意智慧財產權的規範。"}, {"stem": "著作權法所保障的著作須具有「原創性」。下列何者最符合原創性的意義？", "opts": [["A", "該著作必須是全世界第一個出現的作品"], ["B", "該著作必須具有商業上的高度價值"], ["C", "該著作須為獨立完成且非抄襲他人，足以表現著作人的獨特性"], ["D", "該著作必須先經主管機關審查核准"]], "ans": "C", "exp": "原創性是指著作須獨立完成、非抄襲他人，並足以表現著作人的獨特性，並非要求是世界首創或具高度商業價值。"}, {"stem": "在全球化之下，為了促進各國合作保護智慧財產權，並主管多項國際智慧財產權公約的行政事務，聯合國設立了下列哪一個組織？", "opts": [["A", "世界智慧財產組織"], ["B", "國際刑警組織"], ["C", "世界衛生組織"], ["D", "綠色和平組織"]], "ans": "A", "exp": "聯合國設立「世界智慧財產組織」，透過國際合作促進智慧財產權保護；國際刑警組織主要用於打擊跨國犯罪。"}, {"stem": "綜合本課內容，下列關於科技發展與智慧財產的敘述，何者最為正確？", "opts": [["A", "科技發展只會帶來便利，不會產生任何風險"], ["B", "科技發展使智慧財產更容易被複製傳遞，因此更需要重視智慧財產權的保障"], ["C", "保障智慧財產權應毫無限制，才能徹底鼓勵創作"], ["D", "網路上的資源都是免費公開的，可以任意下載使用"]], "ans": "B", "exp": "科技發展的成果本身就是一項智慧財產，且科技使智慧財產更易複製傳遞，因此更需保障；但保障不能毫無限制，仍須以保障期限與合理使用調和公共利益。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "關於「家庭」的意義，下列何者最符合課本的定義？", "opts": [["A", "只要住在同一個屋簷下的人，就一定構成家庭"], ["B", "家庭必須由三代同堂的成員才能組成"], ["C", "以永久共同生活為目的，由具有婚姻、血緣或收養等關係的人所組成的親屬團體"], ["D", "家庭是國家為了徵稅而設立的行政單位"]], "ans": "C", "exp": "課本定義家庭是「以永久共同生活為目的，由具有婚姻、血緣或收養等關係的人所組成的親屬團體」。單純同住（如室友）不算家庭，家庭也不限定要三代同堂。"}, {"stem": "課本指出，家庭是「最基本的社會單位」，也是我們「最早接觸的團體」。這句話最主要在強調什麼？", "opts": [["A", "家庭的規模一定比其他社會團體大"], ["B", "家庭是個人成長與社會化的起點，對個人和社會的影響深遠"], ["C", "家庭成員一定要住在一起才算是一家人"], ["D", "家庭的組成與功能永遠不會改變"]], "ans": "B", "exp": "家庭是個人最早接觸的團體，生活習慣與價值觀多從家庭中習得，因此是社會最基本的單位，對個人與社會發展影響深遠。"}, {"stem": "依據我國民法規定，家庭中的親屬關係分為三大類。下列何者「不」屬於民法規範的親屬關係？", "opts": [["A", "配偶"], ["B", "血親"], ["C", "姻親"], ["D", "鄰居"]], "ans": "D", "exp": "民法將親屬關係分為配偶、血親、姻親三類。鄰居只是居住位置相近，並無法律上的親屬關係。"}, {"stem": "阿明與小美想成為法律上的配偶。依現行民法規定，下列哪一項是必要的程序？", "opts": [["A", "訂立書面的結婚書約，並到戶政機關完成結婚登記"], ["B", "舉辦公開的婚宴，並宴請兩桌以上的賓客"], ["C", "向法院聲請認可其婚姻關係"], ["D", "先同居滿一年，再向鄰里長報備"]], "ans": "A", "exp": "我國採「登記婚」，雙方基於彼此同意訂立書面契約（並有證人簽名），再向戶政機關完成結婚登記，即互為配偶。婚宴、法院認可皆非婚姻成立要件；向法院聲請的是「收養」。"}, {"stem": "課本提到，民國108年立法院三讀通過司法院釋字第七四八號解釋施行法。此法最主要的意義是什麼？", "opts": [["A", "降低結婚的法定年齡"], ["B", "允許相同性別的兩人可以登記結婚"], ["C", "規定夫妻必須平均分擔家務"], ["D", "廢除我國的收養制度"]], "ans": "B", "exp": "司法院釋字第七四八號解釋施行法於民國108年通過，使相同性別者也可以依法登記結婚，互為配偶，是我國婚姻制度的重要變革。"}, {"stem": "下列何者與本人的關係屬於「直系血親」？", "opts": [["A", "哥哥"], ["B", "舅舅"], ["C", "堂姐"], ["D", "外祖母"]], "ans": "D", "exp": "直系血親是具備「出生的直接關係」的自然血親，如祖父母、外祖父母、父母、子女、孫子女。哥哥、舅舅、堂姐雖有血緣，但沒有直接的出生關係，屬於旁系血親。"}, {"stem": "要判斷一個人是自己的「直系血親」還是「旁系血親」，關鍵的差別在於下列何者？", "opts": [["A", "雙方之間是否具有出生的直接關係"], ["B", "雙方是否住在同一個家中"], ["C", "雙方是否為相同的姓氏"], ["D", "雙方是否有互相扶養的義務"]], "ans": "A", "exp": "直系血親指具備出生直接關係者；旁系血親則有共同血緣，但無出生的直接關係。是否同住、同姓都不是判斷標準。"}, {"stem": "阿倫在整理自己的血親關係圖時，發現下列四位親人中，只有一位與他屬於「旁系血親」。請問是哪一位？", "opts": [["A", "曾祖母"], ["B", "父親"], ["C", "姑姑"], ["D", "外公"]], "ans": "C", "exp": "曾祖母、父親、外公與阿倫都有直接的出生關係，屬於直系血親；姑姑是父親的姊妹，與阿倫有血緣但無出生的直接關係，屬於旁系血親。"}, {"stem": "關於「法定血親」的敘述，下列何者正確？", "opts": [["A", "法定血親就是自然血親的另一個名稱"], ["B", "只要雙方口頭同意就可以成立，不需要經過任何機關"], ["C", "養子女在法律上的權利義務比親生子女少"], ["D", "又稱「擬制血親」，須經法院認可收養才成立，權利義務與自然血親相同"]], "ans": "D", "exp": "法定血親又稱擬制血親，是經由法定收養程序向法院聲請而成立的親屬關係，例如養父母與養子女；其法律上的權利義務與自然血親相同。"}, {"stem": "大雄的父母經法院認可，正式收養了小夫。依民法規定，小夫與大雄父母之間屬於下列何種關係？", "opts": [["A", "姻親"], ["B", "法定血親"], ["C", "旁系血親"], ["D", "沒有任何親屬關係"]], "ans": "B", "exp": "透過法定收養程序成立的親屬關係屬於法定血親（擬制血親），養父母與養子女的權利義務與自然血親相同。"}, {"stem": "「姻親」關係是因為下列何者而產生？", "opts": [["A", "出生"], ["B", "收養"], ["C", "婚姻"], ["D", "同居"]], "ans": "C", "exp": "姻親是由婚姻存續而產生的親屬關係。因出生而來的是自然血親，因收養而來的是法定血親。"}, {"stem": "依民法規定，姻親只有三種類型。下列何者「不」屬於民法所規定的姻親？", "opts": [["A", "血親的血親"], ["B", "血親的配偶"], ["C", "配偶的血親"], ["D", "配偶的血親的配偶"]], "ans": "A", "exp": "民法規定的姻親僅限「血親的配偶」、「配偶的血親」、「配偶的血親的配偶」三種，並不包括「血親的血親」。"}, {"stem": "小庭的哥哥結婚了。請問嫂嫂與小庭之間，屬於下列哪一種親屬關係？", "opts": [["A", "配偶的血親"], ["B", "血親的配偶"], ["C", "配偶的血親的配偶"], ["D", "法定血親"]], "ans": "B", "exp": "哥哥是小庭的血親（旁系血親），嫂嫂是哥哥的配偶，因此嫂嫂與小庭的關係是「血親的配偶」。"}, {"stem": "阿華結婚後，稱呼太太的父母為「岳父、岳母」。這種親屬關係屬於下列何者？", "opts": [["A", "直系血親"], ["B", "法定血親"], ["C", "血親的配偶"], ["D", "配偶的血親"]], "ans": "D", "exp": "太太是阿華的配偶，太太的父母是配偶的血親，因此屬於姻親中的「配偶的血親」。俗稱公公、婆婆者亦同理。"}, {"stem": "兩兄弟的妻子之間互稱「妯娌」。這在民法上屬於哪一種姻親關係？", "opts": [["A", "配偶的血親的配偶"], ["B", "配偶的血親"], ["C", "血親的配偶"], ["D", "旁系血親"]], "ans": "A", "exp": "以其中一位妻子為本人，丈夫是配偶，丈夫的兄弟是配偶的血親，該兄弟的妻子則是「配偶的血親的配偶」，即妯娌。"}, {"stem": "小安的爺爺和小安的外公見面時，習慣互稱對方為「親家」。依民法規定，兩人的關係應如何判斷？", "opts": [["A", "屬於直系姻親"], ["B", "屬於旁系血親"], ["C", "屬於「血親的配偶的血親」，並不是民法上的姻親"], ["D", "屬於法定血親"]], "ans": "C", "exp": "民法規定的姻親僅限三種。俗稱的「親家」屬於「血親的配偶的血親」，不在三種姻親之列，因此在法律上兩人並無親屬關係。"}, {"stem": "姐姐的丈夫與妹妹的丈夫，兩人之間彼此互稱為下列何者？", "opts": [["A", "妯娌"], ["B", "親家"], ["C", "連理"], ["D", "連襟"]], "ans": "D", "exp": "姐妹的丈夫彼此互為「連襟」；兄弟的妻子彼此互為「妯娌」。兩者在民法上都屬於「配偶的血親的配偶」。"}, {"stem": "下列關於親屬關係的配對，何者正確？", "opts": [["A", "養母與養女——法定血親"], ["B", "媳婦與婆婆——旁系血親"], ["C", "表哥與表妹——姻親"], ["D", "丈夫與妻子——直系血親"]], "ans": "A", "exp": "養母與養女經收養成立，屬於法定血親。媳婦與婆婆是姻親（配偶的血親）；表哥與表妹有共同血緣，屬旁系血親；丈夫與妻子則互為配偶，不是血親。"}, {"stem": "依課本內容，「家庭型態」主要是依據下列何者來分類？", "opts": [["A", "家庭的年收入高低"], ["B", "家庭居住的縣市地區"], ["C", "同住（組成）的家庭成員"], ["D", "家中長輩從事的職業"]], "ans": "C", "exp": "課本明白指出「家庭型態是依同住成員進行分類」，因此小家庭、折衷家庭、大家庭的差別在於同住的成員有哪些。"}, {"stem": "由一對夫妻與其未婚子女所組成的家庭，稱為下列何者？", "opts": [["A", "折衷家庭"], ["B", "小家庭"], ["C", "大家庭"], ["D", "隔代教養家庭"]], "ans": "B", "exp": "一對夫妻與其未婚子女所組成的家庭稱為小家庭，又稱「核心家庭」，是現代高度都市化社會中最主要的家庭型態。"}, {"stem": "小家庭再加上這對夫妻的直系血親長輩（例如祖父母、曾祖父母）所組成的家庭，稱為下列何者？", "opts": [["A", "折衷家庭"], ["B", "聯合家庭"], ["C", "頂客家庭"], ["D", "重組家庭"]], "ans": "A", "exp": "小家庭再加上該對夫妻的直系血親長輩，即為折衷家庭（又稱主幹家庭）。聯合家庭是大家庭的別稱。"}, {"stem": "折衷家庭因為成員的組成特色，常被稱為下列哪一個名稱？", "opts": [["A", "血緣家庭"], ["B", "核心家庭"], ["C", "通勤家庭"], ["D", "三代家庭"]], "ans": "D", "exp": "折衷家庭以三代同住居多，因此又稱「三代家庭」。血緣家庭是大家庭的別稱，核心家庭是小家庭的別稱。"}, {"stem": "由數個具有血緣關係的小家庭所組成的家庭稱為大家庭，它又稱為下列何者？", "opts": [["A", "主幹家庭"], ["B", "聯合家庭"], ["C", "繼親家庭"], ["D", "祖孫家庭"]], "ans": "B", "exp": "大家庭由數個具血緣關係的小家庭組成，又稱「血緣家庭」或「聯合家庭」。主幹家庭是折衷家庭的別稱，繼親家庭是重組家庭的別稱。"}, {"stem": "阿寶家中同住的成員有：阿寶、爸爸、媽媽、爺爺、奶奶。請問阿寶家屬於下列哪一種家庭型態？", "opts": [["A", "小家庭"], ["B", "大家庭"], ["C", "折衷家庭"], ["D", "單親家庭"]], "ans": "C", "exp": "阿寶家是一對夫妻與未婚子女，再加上這對夫妻的直系血親長輩（祖父母），三代同住，屬於折衷家庭。"}, {"stem": "小杰家中同住的成員有：小杰、爸爸、媽媽、伯父、伯母、堂哥、爺爺、奶奶。請問小杰家最接近下列哪一種家庭型態？", "opts": [["A", "折衷家庭"], ["B", "大家庭"], ["C", "小家庭"], ["D", "兩地家庭"]], "ans": "B", "exp": "小杰家中包含爸爸與伯父兩個具有血緣關係的小家庭同住，屬於大家庭（聯合家庭）；折衷家庭只有一對夫妻加上其直系長輩。"}, {"stem": "所謂「頂客家庭（DINK）」指的是下列何者？", "opts": [["A", "夫妻雙方都有工作收入，但沒有生育子女的家庭"], ["B", "夫妻雙方都沒有工作，靠長輩接濟的家庭"], ["C", "只有父親或母親與未婚子女組成的家庭"], ["D", "由祖父母照顧孫子女所組成的家庭"]], "ans": "A", "exp": "雙薪家庭指夫妻雙方都就業且有收入；其中選擇不生育子女者稱為「頂客家庭」（Double Income No Kids）。"}, {"stem": "父母因為離婚或一方死亡等原因，只由父親或母親與未婚子女組成的家庭，稱為下列何者？", "opts": [["A", "重組家庭"], ["B", "兩地家庭"], ["C", "隔代教養家庭"], ["D", "單親家庭"]], "ans": "D", "exp": "單親家庭是指因離婚、一方死亡等原因，僅由父親或母親與未婚子女所組成的家庭。"}, {"stem": "志明離婚後帶著兒子，與同樣帶著女兒的春嬌再婚，共同組成一個新家庭。這種家庭型態稱為下列何者？", "opts": [["A", "聯合家庭"], ["B", "頂客家庭"], ["C", "重組家庭"], ["D", "跨國婚姻家庭"]], "ans": "C", "exp": "父母雙方或其中一方帶著前次婚姻的子女共組的家庭，稱為重組家庭，又稱「繼親家庭」。"}, {"stem": "美美的爸爸長期在高雄工作，媽媽與美美住在臺北，只有假日全家才通勤團聚。美美家屬於下列哪一種家庭型態？", "opts": [["A", "兩地家庭"], ["B", "單親家庭"], ["C", "隔代教養家庭"], ["D", "折衷家庭"]], "ans": "A", "exp": "家庭成員因工作或其他因素平日分居兩地，放假時以通勤方式團聚，稱為兩地家庭，又稱「通勤家庭」。父母婚姻關係仍存續，並非單親家庭。"}, {"stem": "阿凱的父母到外縣市工作，將他託付給爺爺奶奶照顧，家中只有祖父母與孫子女同住。這種家庭型態又稱為下列何者？", "opts": [["A", "繼親家庭"], ["B", "祖孫家庭"], ["C", "血緣家庭"], ["D", "頂客家庭"]], "ans": "B", "exp": "父母因工作或其他因素將子女託付祖父母照顧，家中僅有祖父母與孫子女，稱為隔代教養家庭，又稱「祖孫家庭」。"}, {"stem": "由本國人士與外籍人士透過婚姻所組成的家庭，又稱為下列何者？", "opts": [["A", "通勤家庭"], ["B", "擬制家庭"], ["C", "新住民家庭"], ["D", "聯合家庭"]], "ans": "C", "exp": "跨國婚姻家庭是本國人士與外籍人士透過婚姻組成的家庭，又稱「新住民家庭」。"}, {"stem": "關於多樣化的家庭型態，下列敘述何者最正確？", "opts": [["A", "隔代教養家庭一定同時也是單親家庭"], ["B", "重組家庭中的成員彼此之間都沒有血緣關係"], ["C", "兩地家庭代表夫妻感情不睦、已經離婚"], ["D", "不論屬於哪一種家庭型態，家人之間都應相互關心與扶持"]], "ans": "D", "exp": "課本強調多樣化家庭生活模式背後的原因複雜，但不論是哪一種型態的家庭，家人間都應相互關心與扶持。(A)(B)(C) 皆為對家庭型態的錯誤推論。"}, {"stem": "課本說明造成家庭型態轉變的原因。下列何者「不」屬於課本所列的原因？", "opts": [["A", "國家立法禁止三代同堂"], ["B", "婚姻觀念的轉變"], ["C", "生育觀念的變化"], ["D", "女性就業的普遍"]], "ans": "A", "exp": "課本列出的原因為：婚姻觀念的轉變、生育觀念的變化、居住與就業地點的變遷、女性就業的普遍。我國並無禁止三代同堂的法律。"}, {"stem": "傳統社會認為「男大當婚、女大當嫁」且婚姻應「從一而終」，現代則有許多人視婚姻為個人的自由選擇，選擇不婚、晚婚，甚至離婚或再婚。此變化最直接反映下列哪一項因素？", "opts": [["A", "生育觀念的變化"], ["B", "女性就業的普遍"], ["C", "婚姻觀念的轉變"], ["D", "居住與就業地點的變遷"]], "ans": "C", "exp": "題幹描述人們對「是否結婚、婚姻是否從一而終」的看法改變，屬於婚姻觀念的轉變，也使單親家庭、重組家庭比例增加。"}, {"stem": "隨著「傳宗接代」的觀念改變，愈來愈多人選擇不生育或只生育一個孩子。此現象最直接造成下列何種結果？", "opts": [["A", "大家庭的比例明顯上升"], ["B", "家庭子女人數普遍減少"], ["C", "跨國婚姻家庭大量增加"], ["D", "收養制度因此被廢除"]], "ans": "B", "exp": "生育觀念改變使得許多人選擇少生或不生，直接造成家庭子女人數普遍減少，也是形成少子化現象的因素之一。"}, {"stem": "農業社會的人們安土重遷，但隨著工業化與都市化的發展，人們不再局限於單一居住與就業地點，家人分居的現象日漸增加。這段敘述說明哪一項因素影響了家庭型態？", "opts": [["A", "婚姻觀念的轉變"], ["B", "生育觀念的變化"], ["C", "女性就業的普遍"], ["D", "居住與就業地點的變遷"]], "ans": "D", "exp": "工業化與都市化使人們的居住與就業地點改變，家人分居增加，因而出現兩地家庭、隔代教養家庭等型態。"}, {"stem": "傳統社會強調「男主外，女主內」，隨著性別平等觀念興起，婦女不再受限於傳統性別觀念而出外就業。此變化最可能使下列哪一種家庭型態增加？", "opts": [["A", "隔代教養家庭"], ["B", "單親家庭"], ["C", "雙薪家庭"], ["D", "大家庭"]], "ans": "C", "exp": "女性就業普遍後，夫妻雙方都有工作收入，雙薪家庭因而成為常見的家庭型態。"}, {"stem": "某研究團隊公布統計資料，指出該國「頂客家庭比例逐年提高」。此一現象與下列何者的關係最密切？", "opts": [["A", "生養小孩的觀念改變"], ["B", "該國離婚率居高不下"], ["C", "三代同堂家庭大幅增加"], ["D", "夫妻異地工作情形普遍"]], "ans": "A", "exp": "頂客家庭是雙薪但不生育子女的家庭，其比例提高最直接反映的是生育（生養小孩）觀念的改變，與離婚率、三代同堂或異地工作無直接關聯。"}, {"stem": "課本提到家庭具備的基本功能。下列何者「不」屬於家庭的基本功能？", "opts": [["A", "生育功能"], ["B", "教育功能"], ["C", "經濟功能"], ["D", "立法功能"]], "ans": "D", "exp": "課本列舉家庭的基本功能包括生育、教育、經濟、保護與照顧等。立法是國家（立法機關）的職權，不是家庭的功能。"}, {"stem": "「農業社會需要充足的勞動力，強調繁衍家族血緣，因此生育率高。」這段敘述最能反映家庭的哪一項功能？", "opts": [["A", "保護與照顧功能"], ["B", "生育功能"], ["C", "經濟功能"], ["D", "教育功能"]], "ans": "B", "exp": "繁衍後代、傳承家族血緣屬於家庭的生育功能；農業社會因需要勞動力而特別重視此功能，生育率也較高。"}, {"stem": "課本提到，現代也有人選擇以「收養」的方式來延續家庭傳承。這種做法與下列哪一項家庭功能的轉變最相關？", "opts": [["A", "生育功能"], ["B", "經濟功能"], ["C", "教育功能"], ["D", "保護與照顧功能"]], "ans": "A", "exp": "課本在說明生育功能的轉變時指出：人們生育觀念改變，有人選擇少生或不生，也有人選擇收養來延續家庭傳承。"}, {"stem": "「個人的成長受家庭影響最大，生活習慣與價值觀念大多從家庭成員的互動中習得。」這段話說明家庭具有下列哪一項功能？", "opts": [["A", "生育功能"], ["B", "經濟功能"], ["C", "教育功能"], ["D", "保護與照顧功能"]], "ans": "C", "exp": "在家庭中學習生活習慣、價值觀念與人際互動技能，屬於家庭的教育功能。"}, {"stem": "由於雙薪家庭增加，父母與子女相處的時間減少，依課本所述，部分家庭教育功能改由下列何者補充？", "opts": [["A", "法院與警察機關"], ["B", "大眾傳播媒體與教育機構（如安親班、補習班）"], ["C", "醫院與安養機構"], ["D", "工廠與商店"]], "ans": "B", "exp": "課本指出，雙薪家庭增加使親子相處時間減少，部分家庭教育功能由大眾傳播媒體與教育機構（安親班、補習班等）替代或補充。"}, {"stem": "傳統社會中家庭是生產的基本單位，透過自給自足滿足食衣住行的需求；現代社會則大多透過市場消費來滿足生活需求。這屬於哪一項家庭功能的轉變？", "opts": [["A", "生育功能"], ["B", "教育功能"], ["C", "保護與照顧功能"], ["D", "經濟功能"]], "ans": "D", "exp": "家庭由「生產單位」轉變為「消費單位」，生產功能逐漸被工廠與商店取代，屬於經濟功能的轉變。"}, {"stem": "現代社會家庭成員人數減少，長輩與病人的照顧有一部分需由社會福利、醫療與安養機構補足。這反映家庭哪一項功能的轉變？", "opts": [["A", "生育功能"], ["B", "經濟功能"], ["C", "保護與照顧功能"], ["D", "教育功能"]], "ans": "C", "exp": "傳統社會家庭多比鄰而居、彼此支援，發揮保護與照顧功能；現代家庭人數減少，部分保護與照顧功能需由社會福利、醫療與安養機構補足。"}, {"stem": "近年來愈來愈多社會團體推出「親子共學」活動，讓大人與小孩一同學習。依課本內容，這股熱潮對家庭功能的意義為何？", "opts": [["A", "在社會團體的協助下，家庭的教育功能不但沒有減弱，反而日益茁壯"], ["B", "顯示家庭的教育功能已經完全被學校取代"], ["C", "說明家庭的經濟功能正在快速消失"], ["D", "證明父母不需要再參與子女的學習活動"]], "ans": "A", "exp": "課本指出，藉由親子共學，家庭的教育功能不但沒有減弱，反而在多元社會團體的協助下日益茁壯，家長甚至可能成為孩子學習活動的老師。"}, {"stem": "有人擔心把孩子的學習「全部交給學校、安親班」。依課本，這樣的安排最可能造成下列何種問題？", "opts": [["A", "家庭的生育功能明顯下降"], ["B", "家庭的經濟功能被市場取代"], ["C", "家庭的保護功能過度膨脹"], ["D", "親子相處時間變少，影響家庭教育功能的發揮"]], "ans": "D", "exp": "課本提到，父母為孩子安排安親班、才藝班等課後活動雖能提供照顧，但也可能使親子相處時間變少，影響家庭教育功能的發揮。"}, {"stem": "關於「把長輩送到安養機構照顧」，下列敘述何者最符合課本的討論方向？", "opts": [["A", "完全沒有缺點，是照顧長輩最好的選擇"], ["B", "優點是可獲得專業照顧，缺點是可能缺乏親情互動、經濟支出增加"], ["C", "這代表家庭的教育功能已被機構完全取代"], ["D", "法律明文規定子女不得將長輩送往安養機構"]], "ans": "B", "exp": "安養機構由專業人員照顧，長輩可獲得較妥善的照顧；但缺點是缺乏親情互動，且經濟支出可能增加。這屬於家庭保護與照顧功能的轉變，並非教育功能。"}, {"stem": "面對家庭功能的轉變，課本建議我們應該如何因應？", "opts": [["A", "拒絕使用任何社會資源，家中事務一律自己承擔"], ["B", "要求政府立法規定全國家庭型態一致"], ["C", "在與家人的親密關係中相互尊重扶持，並善用社會資源協助家庭功能發揮"], ["D", "減少與家人的互動，以避免產生衝突"]], "ans": "C", "exp": "課本指出，因應家庭功能的轉變，我們除了學習與家人相互尊重、扶持外，也要思考如何運用各種社會資源協助家庭功能發揮，使家庭成為每個人的避風港。"}, {"stem": "綜合本課內容，下列敘述何者最為正確？", "opts": [["A", "家庭的型態與功能會隨社會變遷而改變，但家庭仍是提供個人溫暖與安全的重要角色"], ["B", "只有核心家庭才是正常且健全的家庭型態"], ["C", "家庭功能一旦被其他機構分擔，家庭就失去了存在的意義"], ["D", "民法明文規定家庭必須維持三代同堂"]], "ans": "A", "exp": "社會變遷使家庭型態日趨多樣、家庭功能也部分由其他單位協助分擔，但家庭仍難以被取代，是提供成員溫暖與安全的避風港；(B)(C)(D) 均與課本旨意不符。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

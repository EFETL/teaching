<script>
const QS=[{"stem": "「地方上的人民依法選舉並組織地方政府，自行管理地方上的公共事務。」這段話是在說明下列何者的意義？", "opts": [["A", "權力分立"], ["B", "主權在民"], ["C", "地方自治"], ["D", "均權制度"]], "ans": "C", "exp": "課本對「地方自治」的定義即為：地方上的人民依法選出地方行政首長與民意代表，組成地方政府，自行管理地方上的公共事務。"}, {"stem": "下列何者「不是」推行地方自治的重要性？", "opts": [["A", "使政治事務能夠分層負責"], ["B", "使中央政府得以獨攬全國一切事務"], ["C", "讓政府規畫的政策更貼近地方人民的生活需求"], ["D", "提供地方人民參與公共事務的機會，培養民主觀念與責任"]], "ans": "B", "exp": "地方自治的用意正是把部分事務下放給地方，讓政治事務分層負責，而不是讓中央獨攬全部事務。"}, {"stem": "颱風來襲時，是否停班停課是由各縣市首長宣布，而不是由中央統一決定，最主要的理由為何？", "opts": [["A", "中央政府沒有處理天然災害的任何權力"], ["B", "停班停課屬於司法權的範圍"], ["C", "憲法明文規定災害防救是地方的專屬立法權"], ["D", "各地降雨量、風力與受災程度不同，交由地方因地制宜較符合實際需要"]], "ans": "D", "exp": "中央負責制定全國一致的標準與作業辦法，地方則依轄區降水量、風力等危害程度，因地制宜決定是否停班停課。"}, {"stem": "我國中央與地方的權限劃分採「均權制度」，此一原則主要規定於下列何者？", "opts": [["A", "中華民國憲法"], ["B", "地方制度法"], ["C", "財政收支劃分法"], ["D", "行政院組織法"]], "ans": "A", "exp": "課本指出「依據我國憲法規定，中央與地方的權限劃分採均權制度」。地方制度法規範的則是地方自治團體的組成與自治事項。"}, {"stem": "依均權制度的精神，下列何項事務最應由中央政府統籌辦理？", "opts": [["A", "某市的垃圾清運路線安排"], ["B", "某縣學校營養午餐的收費標準"], ["C", "國防與外交事務"], ["D", "某市文化園區的展覽活動"]], "ans": "C", "exp": "具有「全國一致性質」的事務，如國防、外交與司法制度，應由中央政府統籌辦理；其餘三者都具有因地制宜的性質。"}, {"stem": "依均權制度，下列何者最屬於「因地制宜」而由地方政府負責的事務？", "opts": [["A", "制定全國一致的司法制度"], ["B", "依轄區風雨程度決定是否發布停班停課"], ["C", "與他國簽訂條約"], ["D", "統籌全國國防兵力的配置"]], "ans": "B", "exp": "天然災害宣布停班停課、公共衛生、都市計畫等，都是因地制宜性質的事務，由地方政府負責。"}, {"stem": "若中央政府與地方政府對某事務的權限歸屬發生爭議，依憲法規定應交由下列何機關解決？", "opts": [["A", "司法院"], ["B", "行政院"], ["C", "監察院"], ["D", "立法院"]], "ans": "D", "exp": "憲法規定，中央與地方權限劃分若發生爭議，交由立法院解決。"}, {"stem": "「中央政府主管全國事務，地方政府主管地方事務」，這樣的分權方式屬於下列何者？", "opts": [["A", "垂直分權"], ["B", "水平分權"], ["C", "五權分立"], ["D", "主權在民"]], "ans": "A", "exp": "垂直分權是指政府權力因層級不同而分屬中央與地方；水平分權則是同一層級政府內部的分權。"}, {"stem": "「中央政府採五權分立的制度，地方政府則分為行政權與立法權。」這種分權方式屬於下列何者？", "opts": [["A", "垂直分權"], ["B", "水平分權"], ["C", "均權制度"], ["D", "中央集權"]], "ans": "B", "exp": "水平分權指同一層級政府把權力分配給不同部門，使彼此相互制衡；中央的五權分立與地方的行政、立法分立都屬之。"}, {"stem": "我國地方自治團體的種類與地方政府的組成，主要規定於下列哪一部法律？", "opts": [["A", "憲法增修條文"], ["B", "公民投票法"], ["C", "地方制度法"], ["D", "財政收支劃分法"]], "ans": "C", "exp": "中央政府依憲法及憲法增修條文組成；地方政府（地方自治團體）則依「地方制度法」設立與運作。"}, {"stem": "依地方制度法規定，下列何者「不是」地方自治團體？", "opts": [["A", "臺灣省政府"], ["B", "新竹市"], ["C", "臺中市和平區"], ["D", "彰化縣田中鎮"]], "ans": "A", "exp": "民國86年修憲後省已「虛級化」，成為行政院的派出機關，不再是地方自治團體。新竹市為與縣同級的市、和平區為直轄市山地原住民區、田中鎮為縣所管轄的鎮，皆屬地方自治團體。"}, {"stem": "民國86年修憲後將「省」虛級化，現在省的地位為何？", "opts": [["A", "仍是地方自治團體，並設有省議會"], ["B", "已全部升格改制為直轄市"], ["C", "改隸屬於立法院，負責監督地方"], ["D", "成為行政院的派出機關，不再是地方自治團體"]], "ans": "D", "exp": "省政府因與中央政府的行政範圍高度重疊，為提高政府效能而虛級化，現為行政院的派出機關。"}, {"stem": "我國目前設有幾個「直轄市山地原住民區」？", "opts": [["A", "3個"], ["B", "6個"], ["C", "13個"], ["D", "22個"]], "ans": "B", "exp": "全國共有6個直轄市山地原住民區，分別由原臺北縣烏來鄉、桃園縣復興鄉、臺中縣和平鄉，以及高雄縣那瑪夏鄉、桃源鄉、茂林鄉改制而來。"}, {"stem": "關於我國目前的行政區劃分，下列敘述何者正確？", "opts": [["A", "4個直轄市、18個縣市"], ["B", "5個直轄市、17個縣市"], ["C", "6個直轄市、13個縣及3個與縣同級的市"], ["D", "6個直轄市、16個縣，且無與縣同級的市"]], "ans": "C", "exp": "我國共22個行政區：6個直轄市（臺北、新北、桃園、臺中、臺南、高雄）、13個縣，以及基隆市、新竹市、嘉義市3個與縣同級的市。"}, {"stem": "下列哪一組全部都是「與縣同級的市」？", "opts": [["A", "基隆市、新竹市、嘉義市"], ["B", "臺北市、新北市、桃園市"], ["C", "板橋區、豐原區、鳳山區"], ["D", "彰化市、屏東市、竹北市"]], "ans": "A", "exp": "(B) 為直轄市；(C) 為直轄市轄下的區；(D) 為縣所管轄、與鄉鎮同級的縣轄市。"}, {"stem": "下列何者「不是」我國進行地方政府合併與改制的主要原因？", "opts": [["A", "整合行政資源"], ["B", "均衡區域發展"], ["C", "改善地方政府的行政效率與財政收入"], ["D", "減少人民選舉地方行政首長的機會"]], "ans": "D", "exp": "改制升格的目的在整合資源、均衡區域發展、提升行政效率與財政收入，並非為了剝奪人民的選舉權。"}, {"stem": "臺中縣、臺中市合併改制為臺中市後，原本由臺中縣管轄的「豐原市」變成下列何者？", "opts": [["A", "獨立的直轄市"], ["B", "仍為縣轄市，繼續選舉市長"], ["C", "臺中市豐原區，區長由市長任免"], ["D", "直轄市山地原住民區，可選舉區長"]], "ans": "C", "exp": "縣市合併改制為直轄市後，原本的鄉、鎮、縣轄市一律改制為「區」；區不是地方自治團體，區長由市長依法任免。"}, {"stem": "下列何者屬於「地方行政機關」？", "opts": [["A", "臺南市議會"], ["B", "屏東縣里港鄉公所"], ["C", "苗栗縣議會"], ["D", "連江縣議會"]], "ans": "B", "exp": "地方行政機關包括直轄市政府、縣（市）政府、鄉（鎮、縣轄市）公所與直轄市山地原住民區公所；各級議會則屬地方立法機關。"}, {"stem": "下列何者屬於「地方立法機關」？", "opts": [["A", "高雄市那瑪夏區民代表會"], ["B", "新北市政府"], ["C", "花蓮縣吉安鄉公所"], ["D", "嘉義市政府"]], "ans": "A", "exp": "地方立法機關包括直轄市議會、縣（市）議會、鄉（鎮、縣轄市）民代表會與直轄市山地原住民區民代表會。"}, {"stem": "關於地方行政機關的職權，下列敘述何者錯誤？", "opts": [["A", "處理地方自治事務"], ["B", "執行上級政府委辦的事項"], ["C", "監督下級政府機關"], ["D", "議決地方自治條例與預算"]], "ans": "D", "exp": "議決自治條例與預算是地方「立法機關」的職權；行政機關負責的是編列預算與執行政策。"}, {"stem": "關於地方立法機關的職權，下列何者正確？", "opts": [["A", "任免地方行政首長"], ["B", "直接執行地方自治事務與建設工程"], ["C", "議決地方自治條例與預算，並質詢、監督行政機關施政"], ["D", "審判違法失職的地方公務員"]], "ans": "C", "exp": "地方民意代表由人民選出，負責反映民意、議決自治條例與預算，並質詢監督地方行政機關的施政。"}, {"stem": "教育部委請各地方政府辦理國中教育會考，這屬於地方行政機關的何種工作？", "opts": [["A", "執行上級政府的委辦事項"], ["B", "議決地方自治條例"], ["C", "行使地方立法權"], ["D", "行使司法審判權"]], "ans": "A", "exp": "地方行政機關除處理自治事務外，還須執行上級政府依法委託辦理的事項，稱為「委辦事項」。"}, {"stem": "某縣議會審查縣政府送來的工程預算，認為編列不合理而加以刪減。這最能展現地方政府的何種運作原則？", "opts": [["A", "中央集權"], ["B", "立法機關對行政機關的監督制衡"], ["C", "司法獨立"], ["D", "均權制度"]], "ans": "B", "exp": "預算由地方行政機關編列，再由地方立法機關議決，形成水平分權下行政與立法相互制衡的關係。"}, {"stem": "地方政府實施地方自治時，所擁有的政府權力包括下列何者？", "opts": [["A", "行政權、立法權、司法權"], ["B", "行政權、考試權"], ["C", "立法權、監察權"], ["D", "行政權與立法權"]], "ans": "D", "exp": "地方自治僅包含行政權與立法權，其餘三權仍屬於中央政府。"}, {"stem": "承上題，下列哪一組權力仍專屬於中央政府，地方政府並不具備？", "opts": [["A", "司法權、考試權、監察權"], ["B", "行政權、立法權"], ["C", "立法權、司法權"], ["D", "考試權、行政權"]], "ans": "A", "exp": "中央政府採五權分立，其中司法權、考試權與監察權不下放給地方，地方政府只有行政與立法兩權。"}, {"stem": "「由地方立法機關通過、地方行政機關公布，且僅適用於該地方行政區的自治法規」，稱為下列何者？", "opts": [["A", "命令"], ["B", "憲法增修條文"], ["C", "自治條例"], ["D", "法律"]], "ans": "C", "exp": "狹義的「法律」須由立法院通過、總統公布；地方立法機關通過、地方行政機關公布的規範則稱為自治條例。"}, {"stem": "關於自治條例的敘述，下列何者正確？", "opts": [["A", "通過後可適用於全國各行政區"], ["B", "由中央政府制定後交由地方公布"], ["C", "效力高於中央政府所制定的法律"], ["D", "不得牴觸憲法及中央法令，且僅適用於該地方行政區"]], "ans": "D", "exp": "自治條例有地域限制，只適用於該地方行政區，且位階低於憲法與中央的法律、命令，不得牴觸。"}, {"stem": "「苗栗縣石虎保育自治條例」是下列何者行使職權的成果？", "opts": [["A", "立法院三讀通過後由總統公布"], ["B", "苗栗縣議會議決通過，由苗栗縣政府公布"], ["C", "內政部依職權發布的行政命令"], ["D", "苗栗縣民代表會議決通過"]], "ans": "B", "exp": "縣的立法機關是縣議會（縣並沒有「縣民代表會」），自治條例由縣議會議決通過、縣政府公布。"}, {"stem": "各縣市學校營養午餐的收費標準與食材可以有所不同，這最能說明地方自治的何種特色？", "opts": [["A", "地方須完全遵守中央訂定的統一標準"], ["B", "地方法規可以牴觸中央法令"], ["C", "因地制宜，能貼近在地需求並較快回應民意"], ["D", "地方政府擁有司法審判的權力"]], "ans": "C", "exp": "營養午餐的收費與食材屬因地制宜性質，由各縣市政府自行決定，展現地方自治具有彈性、貼近民眾需求的特色。"}, {"stem": "下列 」；區不是地方自治團體，因此山地鄉失去自治權，經多方爭取後才於民國103年修法恢復。"}, {"stem": "依地方制度法規定，直轄市之區由山地鄉改制者，其區長的資格有何特別限制？", "opts": [["A", "須具有大學以上學歷"], ["B", "以山地原住民為限"], ["C", "須由直轄市市長從市府官員中指派"], ["D", "須由區民代表互相推選兼任"]], "ans": "B", "exp": "法律規定「直轄市之區由山地鄉改制者，其區長以山地原住民為限」，以落實原住民族自治精神，但也曾引發非原住民居民權益的爭議。"}, {"stem": "下列哪一組「地方行政機關—地方立法機關」的搭配是正確的？", "opts": [["A", "澎湖縣政府—澎湖縣民代表會"], ["B", "花蓮縣吉安鄉公所—花蓮縣議會"], ["C", "臺北市議會—臺北市政府"], ["D", "澎湖縣政府—澎湖縣議會"]], "ans": "D", "exp": "縣的行政機關是縣政府、立法機關是縣議會；鄉的行政機關是鄉公所、立法機關是鄉民代表會，兩個層級不可混搭。(C) 則是把行政機關與立法機關寫反了。"}, {"stem": "以澎湖縣為例，「編列」預算與「議決」預算的機關分別為何？", "opts": [["A", "澎湖縣議會、澎湖縣政府"], ["B", "行政院、立法院"], ["C", "澎湖縣政府、澎湖縣議會"], ["D", "澎湖縣政府、行政院"]], "ans": "C", "exp": "地方行政機關（縣政府）負責編列預算並執行，地方立法機關（縣議會）負責審查與議決預算。"}, {"stem": "地方政府經費的多寡往往影響地方自治的成效。下列作法何者最有助於健全地方財政？", "opts": [["A", "加強地方稅收稽徵、爭取中央補助款，並積極自行籌措財源"], ["B", "停止一切公共建設以節省開支"], ["C", "拒絕接受中央撥給的統籌分配款"], ["D", "由地方議會直接向人民徵收原屬中央的稅目"]], "ans": "A", "exp": "課本列出健全地方財政的三種方式：加強地方稅收的稽徵、爭取中央對地方的補助款、積極自行籌措財源。"}, {"stem": "地方政府依「財政收支劃分法」向中央取得的款項，稱為下列何者？", "opts": [["A", "地方稅"], ["B", "統籌分配款"], ["C", "規費"], ["D", "自治條例"]], "ans": "B", "exp": "依財政收支劃分法取得的統籌分配款，屬於「爭取中央對地方補助款」這一類財源，與地方自行稽徵的直轄市及縣（市）稅不同。"}, {"stem": "澎湖縣舉辦海上花火節，吸引大批遊客到訪並創造龐大觀光產值。此作法屬於健全地方財政的哪一種方式？", "opts": [["A", "加強地方稅收的稽徵"], ["B", "爭取中央對地方的補助款"], ["C", "減少地方立法機關對預算的監督"], ["D", "積極自行籌措財源，以活動促進觀光與經濟發展"]], "ans": "D", "exp": "辦理活動促進觀光事業與經濟發展，屬於地方政府「積極自行籌措財源」的作法，可減少對中央補助款的依賴。"}, {"stem": "嘉義縣透過核實編列預算、加強清理欠稅、活化資產、節省債務利息等措施，使財政收支由赤字轉為盈餘。這最能說明什麼？", "opts": [["A", "地方政府開源節流、妥善運用經費，有助於提升地方自治的成效"], ["B", "地方財政只要完全依賴中央補助款就已足夠"], ["C", "地方行政機關的財政作為不必受議會監督"], ["D", "地方稅收多寡與地方自治的成效無關"]], "ans": "A", "exp": "經費多寡往往影響地方自治的成效，行政機關除增闢財源外，更應妥善運用經費、提高政府效能。"}, {"stem": "關於地方財政與地方自治的關係，下列敘述何者最正確？", "opts": [["A", "地方經費的多寡與地方自治成效無關"], ["B", "地方行政機關可自行決定預算，不必送交議會"], ["C", "行政機關應增闢財源並妥善運用經費，立法機關則須謹慎議決預算"], ["D", "地方立法機關負責執行預算，行政機關負責監督預算"]], "ans": "C", "exp": "地方行政機關負責增闢財源、妥善用錢以提高效能；地方立法機關則負起監督之責、謹慎議決預算，兩者分工才能促進地方發展。"}, {"stem": "下列關於中央政府與地方政府關係的敘述，何者最恰當？", "opts": [["A", "地方政府完全獨立於中央之外，互不相干"], ["B", "中央政府可以任意撤換人民選出的地方行政首長"], ["C", "地方政府只需推動自治事項，不必配合中央的政策"], ["D", "地方政府需要中央的統籌規畫與資源挹注，中央的政策也需地方協力推動"]], "ans": "D", "exp": "中央與地方是分權且合作的關係：地方需要中央的資源與統籌規畫，中央政策也要靠地方協力推行，兩者相互配合才能有效提供公共服務。"}, {"stem": "小明的家鄉是彰化縣田中鎮，則直接管理他家鄉公共事務的行政機關與立法機關分別為何？", "opts": [["A", "彰化縣政府、彰化縣議會"], ["B", "田中鎮公所、田中鎮民代表會"], ["C", "彰化縣政府、田中鎮民代表會"], ["D", "田中鎮公所、彰化縣議會"]], "ans": "B", "exp": "鎮與鄉、縣轄市同級，其行政機關為鎮公所、立法機關為鎮民代表會；彰化縣政府與縣議會則是上一級的地方政府。"}, {"stem": "下列有關「地方自治」的敘述，何者錯誤？", "opts": [["A", "地方行政首長由該地人民依法選舉產生"], ["B", "地方民意代表由該地人民依法選舉產生"], ["C", "地方立法機關可制定與中央法律相牴觸的自治條例"], ["D", "地方自治團體對轄區內部分公共事務享有自治權限"]], "ans": "C", "exp": "自治條例不得牴觸憲法及中央政府頒布的法律與命令，否則無效。"}, {"stem": "綜合本課內容，下列關於我國地方政府的敘述，何者正確？", "opts": [["A", "中央與地方採均權制度，地方自治團體依地方制度法設立，並由行政、立法兩機關相互制衡"], ["B", "地方政府比照中央採五權分立，另設有地方司法院與地方監察院"], ["C", "直轄市所轄的每一個區都可以選舉自己的區長與區民代表"], ["D", "省是我國層級最高的地方自治團體，統轄各縣市政府"]], "ans": "A", "exp": "(B) 地方只有行政權與立法權；(C) 只有6個直轄市山地原住民區可民選區長與區民代表，一般的區區長由市長任免；(D) 省已虛級化，是行政院的派出機關，不再是地方自治團體。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

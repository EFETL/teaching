<script>
const QS=[{"stem": "廠商之所以要和其他廠商競爭，最主要的目的是什麼？", "opts": [["A", "吸引消費者購買產品，增加銷貨收入以提高利潤"], ["B", "減少市場上產品的種類"], ["C", "幫助政府增加稅收"], ["D", "降低消費者可以選擇的機會"]], "ans": "A", "exp": "課本指出廠商為了增加銷貨收入以提高利潤，必須與其他廠商競爭，吸引消費者購買其產品。"}, {"stem": "下列關於「價格競爭」的敘述，何者最正確？", "opts": [["A", "廠商透過研發新產品來吸引消費者"], ["B", "廠商刻意提高售價以塑造高級形象"], ["C", "廠商透過降價，讓消費者花較少的錢卻能得到相同的滿足"], ["D", "廠商要求政府補助以降低成本"]], "ans": "C", "exp": "價格競爭是指廠商以降價方式讓消費者覺得撿到便宜，用較少的錢得到相同滿足，進而增加銷售量。"}, {"stem": "下列哪一項行銷做法屬於「價格競爭」？", "opts": [["A", "餐廳增建兒童遊戲區吸引親子客"], ["B", "飲料店推出「第二杯半價」的優惠"], ["C", "手機業者發表新一代旗艦機種"], ["D", "業者邀請當紅明星代言廣告"]], "ans": "B", "exp": "打折、第二件半價、買一送一都是直接調整價格來吸引買氣，屬於價格競爭；其餘三項是靠服務、創新或形象取勝的非價格競爭。"}, {"stem": "非價格競爭之下，即使產品價格不是最低、甚至比別家更高，消費者仍願意購買，最主要是因為廠商做了什麼？", "opts": [["A", "政府規定消費者必須購買該產品"], ["B", "市場上廠商家數太少，消費者無從選擇"], ["C", "消費者根本不在意價格的高低"], ["D", "透過創新、改良產品或提升服務品質，提供更好、更有特色的產品或服務"]], "ans": "D", "exp": "非價格競爭是靠創新、品質、特色與客製化服務創造價值，所以價格較高消費者仍願意買單。"}, {"stem": "下列何者「不」屬於非價格競爭的做法？", "opts": [["A", "全館商品一律結帳打八折"], ["B", "推出限量的聯名獨家商品"], ["C", "提供客製化的專屬服務"], ["D", "改良產品包裝並提升品質"]], "ans": "A", "exp": "打折是直接調整價格，屬於價格競爭；其餘三項都是不靠降價、改以特色與品質取勝的非價格競爭。"}, {"stem": "南一課本提到，非價格競爭又可以稱為下列何者？", "opts": [["A", "削價競爭"], ["B", "惡性競爭"], ["C", "價值競爭"], ["D", "不公平競爭"]], "ans": "C", "exp": "非價格競爭著重為商品創造附加價值，因此又稱為「價值競爭」。"}, {"stem": "超商增設代收款項、到店取貨寄貨、影印文件與代售票券等功能，這屬於哪一種競爭方式？", "opts": [["A", "價格競爭"], ["B", "不公平競爭"], ["C", "廠商的聯合行為"], ["D", "非價格競爭"]], "ans": "D", "exp": "超商並未調整商品售價，而是以更多元完善的服務吸引顧客上門，屬於非價格競爭。"}, {"stem": "手搖飲店推出「集點兌換周邊商品」與「線上會員累積點數」，這類做法最主要的目的是什麼？", "opts": [["A", "降低原料的生產成本"], ["B", "增加消費者對品牌的忠誠度"], ["C", "減少店內販售的產品種類"], ["D", "配合政府法令的強制規定"]], "ans": "B", "exp": "課本將集點、會員累積點數列為非價格競爭手法，目的是提高消費者的忠誠度，促使其重複消費。"}, {"stem": "課本探究活動指出：餐廳提供飲料免費續杯，顧客喝愈多杯，等於每杯的價格愈便宜。依此推論，免費續杯屬於哪一種競爭方式？", "opts": [["A", "價格競爭"], ["B", "非價格競爭"], ["C", "不公平競爭"], ["D", "聯合哄抬價格"]], "ans": "A", "exp": "免費續杯使每杯飲料的平均價格下降，等同於變相降價，因此課本將其歸類為價格競爭。"}, {"stem": "廠商長期採取削價競爭，最可能造成下列哪一種結果？", "opts": [["A", "廠商的利潤必然長期不斷增加"], ["B", "消費者一定可以永遠享受低價與好品質"], ["C", "政府的稅收一定會 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

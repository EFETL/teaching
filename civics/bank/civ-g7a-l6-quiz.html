<script>
const QS=[{"stem": "關於「社區」的意義，下列敘述何者最正確？", "opts": [["A", "社區必須經過政府核定才能成立"], ["B", "社區的範圍有明確的法律界線"], ["C", "社區是居住在某一特定地區的一群人，因彼此常往來接觸、生活息息相關而自然形成的公共生活領域"], ["D", "社區成員彼此之間必須具有血緣關係"]], "ans": "C", "exp": "課本指出社區是居住在特定地區的一群人，因往來接觸且生活息息相關而「自然形成」的公共生活領域，不須政府核定，也不以血緣為條件。"}, {"stem": "社區是由居民、地區、共同關係、社區意識和社區組織等要素所組成。其中最關鍵的要素是下列何者？", "opts": [["A", "社區意識"], ["B", "社區組織"], ["C", "地區"], ["D", "共同關係"]], "ans": "A", "exp": "課本強調由居民的認同感和歸屬感所凝聚而成的「社區意識」，是社區最關鍵的要素，有了它才會進一步成立組織、解決問題。"}, {"stem": "社區意識主要是由居民的哪兩種心理所凝聚而成？", "opts": [["A", "服從感與紀律感"], ["B", "競爭心與榮譽心"], ["C", "責任感與階級感"], ["D", "認同感與歸屬感"]], "ans": "D", "exp": "居民對社區產生「我是這裡人」的認同感與歸屬感，才形成社區意識，進而願意關心公共事務。"}, {"stem": "關於社區的範圍大小，下列敘述何者最正確？", "opts": [["A", "社區的範圍就是村里的行政區範圍，不可更動"], ["B", "社區大小不一，小至一條街、一棟大樓，大至一個村落或鄉鎮都可能形成社區"], ["C", "社區的範圍必須由鄉鎮市公所正式劃定"], ["D", "社區的範圍一定要跨越兩個以上的縣市"]], "ans": "B", "exp": "課本指出社區的範圍並沒有明確的界線，大小不一，小到一條街或一棟大樓，大到一個村落或鄉鎮都可能形成社區。"}, {"stem": "當社區居民面對共同的問題或需要時，通常會採取下列何種作為？", "opts": [["A", "成立社區組織，一起解決問題或達成目標"], ["B", "各自搬離社區，另尋居住地"], ["C", "等待中央政府主動派員處理"], ["D", "解散原有的社區意識"]], "ans": "A", "exp": "居民因共同問題產生「休戚與共」的社區意識後，會進一步成立社區組織來解決問題或達成共同目標。"}, {"stem": "社區參與的「主體」是下列何者？", "opts": [["A", "縣市政府"], ["B", "民意代表"], ["C", "警察機關"], ["D", "社區居民"]], "ans": "D", "exp": "課本明白指出「社區參與的主體是居民」，由居民一起投注心力、主動參與社區事務，才能提升社區生活品質。"}, {"stem": "若社區居民都採取「自掃門前雪」的態度，最可能造成什麼結果？", "opts": [["A", "能有效提升社區的公共設施品質"], ["B", "公共問題無人處理，最後受害的還是居民自己"], ["C", "可以節省社區的公共經費支出"], ["D", "能自然增強居民的社區意識"]], "ans": "B", "exp": "課本指出，居民若都只顧自己、不管公共事務，社區問題無人解決，最後受害的還是居民自身。"}, {"stem": "課本建議社區居民應以下列何種態度來參與社區事務？", "opts": [["A", "以「多一事不如少一事」的態度旁觀"], ["B", "以「花錢請人做就好」的態度外包"], ["C", "以「經營自己家」的態度投入"], ["D", "以「等政府來做」的態度等待"]], "ans": "C", "exp": "課本鼓勵居民以「經營自己家」的態度參與社區事務，培養利他精神與處理公共事務的能力。"}, {"stem": "新竹市育英社區發展協會帶領民眾一起繪製「社區地圖」，其主要功用為何？", "opts": [["A", "供政府劃定選舉區使用"], ["B", "作為社區房地產買賣的依據"], ["C", "用來向政府申請都市更新補助"], ["D", "讓居民認識社區的範圍與主要設施"]], "ans": "D", "exp": "課本說明透過社區地圖能讓居民認識社區的範圍與主要設施，深度認識社區的環境和歷史。"}, {"stem": "苗栗縣後龍鎮溪洲社區發展協會編印「溪洲社區報」，最主要的目的為何？", "opts": [["A", "傳遞社區訊息、溝通居民意見，並增進居民對社區的歸屬感"], ["B", "販售廣告版面以增加協會收入"], ["C", "取代地方政府所發布的公文公告"], ["D", "記錄並公開居民的個人隱私資料"]], "ans": "A", "exp": "社區報是傳遞社區訊息、意見溝通的管道，目的在增進居民對社區的歸屬感，強化社區意識。"}, {"stem": "高雄市美濃區的「黃蝶祭」以客家古禮進行，其最主要的訴求為何？", "opts": [["A", "推廣客家美食觀光以增加收入"], ["B", "爭取原住民族的傳統領域"], ["C", "訴求人與自然永續依存，凝聚在地共識，發展農村生態"], ["D", "反對政府在社區設置社區學堂"]], "ans": "C", "exp": "課本說明祭蝶（黃蝶祭）儀式訴求人與自然永續依存，凝聚在地共識，以發展農村生態為願景，屬於守護環境生態的社區參與。"}, {"stem": "美濃將「油紙傘」融入文化創意並結合觀光旅遊，這樣的社區參與最主要達成什麼效果？", "opts": [["A", "消除社區內的貧富差距"], ["B", "推廣並傳承客家的傳統文化"], ["C", "取消社區的公共事務會議"], ["D", "阻止外地遊客進入社區"]], "ans": "B", "exp": "課本指出油紙傘結合文創與觀光旅遊，是為了推廣客家的傳統文化，屬於傳承在地手工藝的社區參與。"}, {"stem": "美濃把原本廢棄的空間轉型為長輩聚會與學子念書的「青銀夥房」，這個做法最能展現什麼精神？", "opts": [["A", "活化閒置空間，為社區注入老幼互助關懷的精神"], ["B", "擴大社區的行政管轄範圍"], ["C", "提高社區的房屋租金收益"], ["D", "限制年輕人進入社區活動"]], "ans": "A", "exp": "課本說明原本廢棄的空間轉型成社區長輩聚會與學子念書的青銀夥房，為在地社區注入互助關懷的精神。"}, {"stem": "某大樓住戶因菸味從管道間、窗戶飄到鄰居家而引發爭議。依課本情境，最先出面協調處理的社區組織是下列何者？", "opts": [["A", "縣市政府環保局"], ["B", "村里辦公處"], ["C", "社區管理委員會"], ["D", "地方法院"]], "ans": "C", "exp": "課文情境中是由社區管理委員會張貼公告並出面處理菸味擾鄰的爭議，屬於社區內部自行處理公共事務的組織。"}, {"stem": "面對社區內的二手菸爭議，下列何種處理方式最符合「社區參與」的精神？", "opts": [["A", "由抽菸者自行決定，其他住戶不得表示意見"], ["B", "直接請警察將抽菸住戶趕出社區"], ["C", "受害住戶自行搬家以避開菸味"], ["D", "由管委會召開會議制定社區菸害防制規範，例如統一設置社區吸菸室"]], "ans": "D", "exp": "社區參與強調居民透過討論、協商共同訂定規範來解決公共問題，課本建議的作法即為召開會議制定菸害防制規範並設置吸菸室。"}, {"stem": "抽菸住戶主張「在自己家抽菸是個人的自由權」，鄰居則主張健康受到危害。這個爭議最能說明下列何種觀念？", "opts": [["A", "個人自由高於一切，不受任何限制"], ["B", "個人可以主張自由，但不得因個人自由而對他人造成危害"], ["C", "社區的公共事務應全部交由中央政府決定"], ["D", "社區內不應成立任何自治組織"]], "ans": "B", "exp": "課本的參考答案指出，居民可以主張個人自由，但不得因行使個人自由而對他人造成危害，這是公共生活的基本原則。"}, {"stem": "依原住民族基本法規定，「部落」的定義為何？", "opts": [["A", "原住民自願組成的營利性社團"], ["B", "由政府直接劃定並開發的觀光園區"], ["C", "原住民於原住民族地區一定區域內，依其傳統規範共同生活結合而成的團體"], ["D", "原住民在都市中租屋居住所形成的社區"]], "ans": "C", "exp": "原住民族基本法明訂部落是指原住民於原住民族地區一定區域內，依其傳統規範共同生活結合而成，並經中央原住民族主管機關核定的團體。"}, {"stem": "依法「部落」必須經過下列哪一個機關核定？", "opts": [["A", "原住民族委員會"], ["B", "內政部"], ["C", "教育部"], ["D", "文化部"]], "ans": "A", "exp": "我國中央原住民族主管機關為原住民族委員會，部落須 function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

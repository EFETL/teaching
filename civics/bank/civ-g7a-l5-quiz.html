<script>
const QS=[{"stem": "我國憲法規定人民有受國民教育的權利與義務。依此判斷，國中生每天到學校上課這件事，性質為何？", "opts": [["A", "只是一種義務，並不是權利"], ["B", "只是一種權利，並不是義務"], ["C", "既是權利，同時也是義務"], ["D", "既不是權利，也不是義務"]], "ans": "C", "exp": "憲法明定人民有受國民教育的「權利」與「義務」，所以就學同時具備兩種性質，不能只擇一。"}, {"stem": "課本提到「學生是學習的主體」，因此教師的教學安排與學校舉辦的各項活動，都應該優先考量學生的哪一項權利？", "opts": [["A", "受教權"], ["B", "財產權"], ["C", "隱私權"], ["D", "選舉權"]], "ans": "A", "exp": "學生是學習的主體，教師教學與學校活動都應考量學生的受教權，不可任意剝奪學生上課學習的機會。"}, {"stem": "上課時，小宇不斷在座位上大聲喧鬧、走動，使得鄰座同學完全無法專心聽講。小宇的行為主要侵害了同學的哪一項權利？", "opts": [["A", "身體自主權"], ["B", "財產權"], ["C", "名譽權"], ["D", "學習權"]], "ans": "D", "exp": "學生之間有責任尊重彼此的學習權，避免干擾其他人的學習；喧鬧使他人無法聽課，侵害的是同學的學習權。"}, {"stem": "阿明把遙控玩具車帶到學校，上課時操作它到處亂跑，嚴重妨害教學進行。依課本所述，老師的正確處理方式為何？", "opts": [["A", "當場沒收後直接丟棄銷毀"], ["B", "暫時代為保管，並盡快通知家長領回"], ["C", "移送警察機關依法處理"], ["D", "沒收後歸學校所有，充作教學器材"]], "ans": "B", "exp": "學生攜帶到校的物品若足以妨害教學或干擾學習，教師依法可「暫時代為保管」，並盡快通知家長領回，而非永久沒收。"}, {"stem": "依課本內容，教師原則上不得任意沒收學生的物品，但下列哪一類物品是例外？", "opts": [["A", "上課時把玩的手機"], ["B", "課本下偷看的漫畫書"], ["C", "下課交換的遊戲卡片"], ["D", "法定的違禁品"]], "ans": "D", "exp": "課本明白指出，除「法定違禁品」外不得任意沒收，以免侵害學生的財產權益。其餘物品只能暫時代為保管。"}, {"stem": "小華未經同意就拿走同學放在抽屜裡的計算機使用，用完才歸還。小華的行為主要侵犯了同學哪一方面的權利？", "opts": [["A", "財產方面"], ["B", "學習方面"], ["C", "身體自主方面"], ["D", "名譽方面"]], "ans": "A", "exp": "每個人都有自由使用自己物品的權利，學生之間應避免未經同意擅自使用他人財物，這屬於財產方面的權利。"}, {"stem": "依課本，「國家應保障學生不受身心的侵害」是哪一部法律的規定？", "opts": [["A", "民法"], ["B", "教育基本法"], ["C", "兒童權利公約"], ["D", "性別平等工作法"]], "ans": "B", "exp": "教育基本法規定國家應保障學生不受身心的侵害，這是學生身體自主方面權利的重要法律依據。"}, {"stem": "「每個人都有管理自己身心的權利及能力，沒有經過本人同意，任何人都不能任意碰觸。」這段話說明的是學生哪一方面的權利？", "opts": [["A", "學習方面"], ["B", "財產方面"], ["C", "身體自主方面"], ["D", "名譽方面"]], "ans": "C", "exp": "身體自主權指的就是每個人是自己身心的主人，有權管理與保護自己的身心，未經同意他人不得侵犯。"}, {"stem": "關於「校園霸凌」，下列敘述何者正確？", "opts": [["A", "即使出於開玩笑的動機，仍可能造成同學一輩子不可抹滅的傷害"], ["B", "只要不動手打人，就一定不算霸凌"], ["C", "只發生在校內，網路上的行為不算"], ["D", "只要事後道歉，受害者的權利就沒有受損"]], "ans": "A", "exp": "課本強調學生之間不能因為開玩笑等理由做出校園霸凌行為，以免造成同學一輩子不可抹滅的傷害；霸凌也包含言語、關係、網路等非肢體形式。"}, {"stem": "下課時間，小傑趁同學不在，任意翻動同學的書包和置物櫃察看內容。他的行為侵犯了同學的哪一項權利？", "opts": [["A", "學習權"], ["B", "受教權"], ["C", "身體自主權"], ["D", "隱私權"]], "ans": "D", "exp": "課本提到不宜任意翻動他人的書包、置物櫃，否則就是侵犯個人隱私。"}, {"stem": "小美在班級群組張貼文章，公開嘲諷同學的外貌與家庭。此行為主要侵害同學的哪一項權利？", "opts": [["A", "財產權"], ["B", "名譽權"], ["C", "受教權"], ["D", "身體自主權"]], "ans": "B", "exp": "任何人皆不能在任何情境或場合做出辱罵等傷害他人名譽的行為；網路言論是公開的，撰文者必須為自己的言論負責。"}, {"stem": "小凱認為學校對他的懲處程序不當，導致自己的權益受損。依課本，他可以依法向下列哪一個單位提出申訴？", "opts": [["A", "校務會議"], ["B", "性別平等教育委員會"], ["C", "學生申訴評議委員會"], ["D", "家長會"]], "ans": "C", "exp": "學生權益若因學校不當懲處或決議而受損，可依法向「學生申訴評議委員會」提出申訴，以維護自身權益。"}, {"stem": "下列同學的行為，何者「不」屬於校園霸凌？", "opts": [["A", "長期在網路上散布同學的不實謠言"], ["B", "每天聯合全班孤立、不理睬某位同學"], ["C", "反覆用綽號嘲笑同學的身體特徵"], ["D", "體育課練球時不小心撞到同學造成擦傷"]], "ans": "D", "exp": "霸凌是「故意且持續（重複）」的身心傷害行為。體育課的意外碰撞並非故意且持續，因此不構成霸凌。"}, {"stem": "依課本對校園霸凌的說明，下列何者是判斷霸凌最關鍵的要素？", "opts": [["A", "同儕之間故意且持續（重複）的身體或心理傷害行為"], ["B", "一定要造成明顯的外傷才算"], ["C", "一定要有兩人以上共同實施才算"], ["D", "一定要發生在校園圍牆之內才算"]], "ans": "A", "exp": "課本定義霸凌為同儕之間「故意且持續」的身體或心理傷害行為，使受害者的身體、隱私、名譽等權利受損，與是否有外傷、人數或地點無關。"}, {"stem": "課本引用的調查指出，臺灣有 47% 的兒少曾涉入網路霸凌事件，而且最常發生在哪些場域？", "opts": [["A", "學校的走廊與樓梯間"], ["B", "線上遊戲與社交平臺"], ["C", "補習班與安親班"], ["D", "學校的營養午餐時間"]], "ans": "B", "exp": "該調查顯示網路霸凌最常發生在線上遊戲與社交平臺，提醒學生在網路上也要尊重他人權利。"}, {"stem": "若發現同學遭受校園霸凌，除了告訴師長與家長外，還可以撥打教育部設置的防制校園霸凌專線。該專線號碼為何？", "opts": [["A", "110"], ["B", "113"], ["C", "1953"], ["D", "1999"]], "ans": "C", "exp": "教育部防制校園霸凌專線為 1953，是學生遇到霸凌時可以求助的管道之一。"}, {"stem": "疫情嚴重時，教育部宣布改為線上學習，學校也提供線上學習平臺（如因材網）供學生使用。這項政策主要是為了保障學生的哪一項權利？", "opts": [["A", "學習權與受教權"], ["B", "財產權"], ["C", "隱私權"], ["D", "身體自主權"]], "ans": "A", "exp": "「停課不停學」的用意在於即使無法到校，仍能保障學生繼續學習的機會，屬於學習權與受教權的保障。"}, {"stem": "依課本說明，臺灣中小學生若要帶手機或平板到校，應遵守的規定為何？", "opts": [["A", "完全禁止攜帶，一經發現即永久沒收"], ["B", "可以自由攜帶並隨時使用，學校不得干涉"], ["C", "只要不影響上課，不需任何程序即可使用"], ["D", "必須事先提出申請，並依照規定使用"]], "ans": "D", "exp": "課本指出中小學生帶手機或平板到校必須事先提出申請，並依照規定使用，兼顧學生財產權與全班的學習權。"}, {"stem": "「兒童有表達意見與參與的權利」，這項規定出自下列何者？", "opts": [["A", "中華民國憲法"], ["B", "教育基本法"], ["C", "聯合國兒童權利公約"], ["D", "世界人權宣言"]], "ans": "C", "exp": "課本在討論學生參與校園公共事務時，明確引用聯合國「兒童權利公約」，指出兒童有表達意見與參與的權利。"}, {"stem": "依課本定義，「校園公共事務」是指下列何者？", "opts": [["A", "只有校長與主任才能決定的行政事務"], ["B", "與學校每個人有關且需要處理的事務"], ["C", "只跟老師教學有關、與學生無關的事務"], ["D", "學生私人之間的金錢往來與交友問題"]], "ans": "B", "exp": "校園公共事務通常是指與學校每個人有關、且需要共同處理的事務，如制服樣式、飲水機擺放地點等。"}, {"stem": "下列哪一項最適合被歸類為「校園公共事務」？", "opts": [["A", "小明日記本裡寫的心事"], ["B", "導師家中客廳的裝潢風格"], ["C", "同學互相贈送的生日禮物"], ["D", "學校飲水機的擺放地點"]], "ans": "D", "exp": "公共事務須與學校每個人有關且需要處理，飲水機擺放地點影響全校師生使用；其餘三者皆屬個人私事。"}, {"stem": "七年三班要修改班規中關於「值日生輪值方式」的規定。依課本說明，這項事務應由誰參與決定？", "opts": [["A", "只有七年三班的學生"], ["B", "全校所有班級的學生"], ["C", "全校的教職員工"], ["D", "全校學生家長"]], "ans": "A", "exp": "班規屬於班級事務，只有該班學生才能參與決定，決定後也僅適用該班共同遵守。"}, {"stem": "某校要重新票選下學期營養午餐的菜色。依課本說明，這項事務適合由誰參與討論形成共識？", "opts": [["A", "只有班聯會幹部"], ["B", "只有各班班長"], ["C", "全校學生"], ["D", "只有校長與總務主任"]], "ans": "C", "exp": "學校營養午餐的菜色與全校師生共同相關，因此全校學生都可以參與討論來形成共識。"}, {"stem": "為什麼「班規」只由該班學生決定，「營養午餐菜色」卻可由全校學生參與討論？最主要的原因是？", "opts": [["A", "因為班規比較不重要，可以隨便決定"], ["B", "因為公共事務涉及的對象與適用範圍不同"], ["C", "因為只有午餐才需要花錢，班規不用"], ["D", "因為法律規定所有事情都必須全校投票"]], "ans": "B", "exp": "課本指出公共事務因涉及的對象及適用範圍不同，可以參與決定的人也會不同，這是判斷「誰可以參與」的關鍵。"}, {"stem": "依康軒課本，學生要有效處理校園公共事務，其歷程的正確順序為何？", "opts": [["A", "釐清公共事務範圍 → 深入了解事務內容 → 藉由學生自治形成決定"], ["B", "藉由學生自治形成決定 → 釐清公共事務範圍 → 深入了解事務內容"], ["C", "深入了解事務內容 → 藉由學生自治形成決定 → 釐清公共事務範圍"], ["D", "釐清公共事務範圍 → 藉由學生自治形成決定 → 深入了解事務內容"]], "ans": "A", "exp": "課本的處理歷程為：先釐清學生可以參與哪些公共事務，其次深入了解該事務的相關資訊，最後再藉由學生自治形成處理的共識。"}, {"stem": "小組想推動「改善校園廁所異味」的提案，正處於「深入了解公共事務內容」的階段。下列何者最符合這個階段應做的事？", "opts": [["A", "直接舉手表決要不要改建廁所"], ["B", "立刻向校長遞交陳情書要求撥款"], ["C", "先在班會通過決議再說"], ["D", "訪談清潔人員並對全校做問卷調查"]], "ans": "D", "exp": "深入了解階段應透過各種管道蒐集資料，例如尋求專業人士建議、以問卷調查或訪談了解相關成員想法，之後才進入形成決定的階段。"}, {"stem": "在蒐集公共事務相關資料時，課本強調應該獲得下列何者，才能做出較合適的決定？", "opts": [["A", "只蒐集支持自己立場的資料"], ["B", "正反面意見的完整資訊"], ["C", "只採納老師一個人的看法"], ["D", "只參考網路上點閱率最高的說法"]], "ans": "B", "exp": "課本指出應透過問卷、訪談或專業建議等過程，獲得「正反面意見的完整資訊」，避免偏聽單一立場。"}, {"stem": "依課本，實施「學生自治」的先決條件為何？", "opts": [["A", "必須先取得全體家長書面同意"], ["B", "必須先經過縣市政府核准"], ["C", "必須遵守學校規定與社會規範（政府法令）"], ["D", "必須由校長親自擔任主席"]], "ans": "C", "exp": "學生自治不是完全不受限制，其先決條件是必須遵守學校規定與社會規範（政府法令），才能在合法範圍內運作。"}, {"stem": "下列何者最符合課本對「學生自治」的定義？", "opts": [["A", "由學校行政人員代替學生決定所有事務"], ["B", "由家長會決定學生在校的一切活動"], ["C", "學生可以不受任何規範自由行動"], ["D", "由學生參與管理與學生有關的公共事務"]], "ans": "D", "exp": "學生自治是指由學生參與管理與學生有關的公共事務，例如班級生活公約的制定、班服的討論等。"}, {"stem": "關於「學生自治的實施步驟」，下列順序何者正確？", "opts": [["A", "成立自治組織 → 訂定自治規範 → 推展各項自治活動"], ["B", "訂定自治規範 → 成立自治組織 → 推展各項自治活動"], ["C", "推展各項自治活動 → 成立自治組織 → 訂定自治規範"], ["D", "成立自治組織 → 推展各項自治活動 → 訂定自治規範"]], "ans": "A", "exp": "課本圖示的三步驟為：1. 成立自治組織（如班會、班聯會、學生社團）2. 訂定自治規範（如班級公約、社團組織章程）3. 推展各項自治活動（如討論班服、舉辦班級郊遊）。"}, {"stem": "下列何者屬於學生自治步驟中的「成立自治組織」？", "opts": [["A", "制定班級公約"], ["B", "訂定社團組織章程"], ["C", "成立班聯會"], ["D", "舉辦班級郊遊活動"]], "ans": "C", "exp": "班會、班聯會、學生社團屬於「自治組織」；班級公約與社團章程屬於「自治規範」；郊遊、討論班服則屬於「自治活動」。"}, {"stem": "下列何者屬於學生自治步驟中的「訂定自治規範」？", "opts": [["A", "選出班長與各股股長"], ["B", "制定班級生活公約"], ["C", "舉辦班級同樂會"], ["D", "成立熱音社"]], "ans": "B", "exp": "班級公約、社團組織章程都是學生自己訂定、用來共同遵守的自治規範。"}, {"stem": "班會討論班服樣式時，班長提醒：「贊成人數少的意見也要讓他說完，不能忽略。」這句話體現了會議討論的哪一項原則？", "opts": [["A", "多數尊重少數"], ["B", "少數服從多數"], ["C", "先提名先表決"], ["D", "一事不再議"]], "ans": "A", "exp": "課本指出「少數的意見不應被忽略」即為「多數尊重少數」；而「決議結果每個人都有遵守的責任」則是「少數服從多數」。"}, {"stem": "班會表決通過班遊地點後，投反對票的小玉仍然依決議一同前往。這種做法最符合下列哪一項原則？", "opts": [["A", "多數尊重少數"], ["B", "權宜問題優先"], ["C", "秩序問題優先"], ["D", "少數服從多數"]], "ans": "D", "exp": "決議的結果每個人都有遵守的責任，即使原本持反對意見，也應遵守多數決的決議，這就是少數服從多數。"}, {"stem": "依課本，若班會討論時完全忽略少數同學的意見，最可能造成什麼後果？", "opts": [["A", "提高決議的合法性，讓決議更有效力"], ["B", "少數同學心生不滿而衍生衝突，影響共識凝聚"], ["C", "使會議程序更完整，符合會議規範"], ["D", "讓班級決議自動失效，必須重新開會"]], "ans": "B", "exp": "課本指出少數意見若被忽略，可能導致其不滿而衍生衝突，進而影響共識的凝聚，形成公共事務處理的阻力。"}, {"stem": "關於「多數決」，下列敘述何者正確？", "opts": [["A", "多數決可以決定所有事情，沒有任何限制"], ["B", "多數決只能用在選舉，不能用在其他議題"], ["C", "不可以用多數決限制或剝奪少數人的基本權利"], ["D", "多數決必須全體一致同意才算通過"]], "ans": "C", "exp": "多數決是民主社會最常採行的表決方式，但並非所有事物都適合多數決；尤其不能用多數決限制或剝奪少數人的基本權利。"}, {"stem": "關於班會中「主席」的職責，下列敘述何者正確？", "opts": [["A", "應率先發表自己的立場，帶領同學表決"], ["B", "可以直接決定議案通過與否，不必表決"], ["C", "對於自己不喜歡的提案可以拒絕討論"], ["D", "主持表決時原則上不發表意見，也不參與表決"]], "ans": "D", "exp": "主席主持表決，原則上不發表意見也不參與表決，必須態度中立、立場公正，才能維持會議的公平。"}, {"stem": "班會進行中發生議事程序爭議，依會議規範，應由誰負責裁決「權宜問題」與「秩序問題」？", "opts": [["A", "主席"], ["B", "司儀"], ["C", "紀錄"], ["D", "導師"]], "ans": "A", "exp": "主席的職權包括維持會場秩序、裁決權宜問題與秩序問題，並處理提案的討論與表決。"}, {"stem": "班會中「司儀」的主要職責為何？", "opts": [["A", "詳實記錄表決票數與決議要點"], ["B", "宣讀（宣布）會議程序"], ["C", "裁決權宜問題與秩序問題"], ["D", "對每項提案提供專業意見"]], "ans": "B", "exp": "司儀負責宣讀會議程序，使會議依序進行；記錄票數是紀錄的工作，裁決爭議則屬主席職權。"}, {"stem": "依會議規範，班會「紀錄」應詳實記錄的內容，包括下列何者？", "opts": [["A", "每位同學發言的完整逐字稿"], ["B", "老師對每位同學的表現評語"], ["C", "選舉或表決的方法、票數及結果"], ["D", "全班同學各科的段考成績"]], "ans": "C", "exp": "紀錄應詳實記載報告事宜、選舉或表決的方法與票數結果，以及決議的要點。"}, {"stem": "依課本，導師（教師）在班會中扮演的角色為何？", "opts": [["A", "提示會議規則，討論時不提供意見，也不加入表決"], ["B", "擔任主席，直接主導所有議題的結論"], ["C", "擁有兩票的表決權，以確保決議正確"], ["D", "對班會決議有最終否決權，可任意推翻"]], "ans": "A", "exp": "課本說明導師的角色是在會議中提示會議規則，討論時不提供意見，也不加入表決，讓學生真正練習自治。"}, {"stem": "班會進行到一半，走廊傳來巨大喧鬧聲，使同學完全聽不清楚發言者的意見。此時出席人可以向主席提出下列何者？", "opts": [["A", "臨時動議"], ["B", "秩序問題"], ["C", "附議"], ["D", "權宜問題"]], "ans": "D", "exp": "權宜問題是指議場偶發的緊急事件，影響議場全體，例如議場喧擾妨礙出席人的聽覺，可提請主席制止。"}, {"stem": "班會正在討論「班服樣式」，但小安發言時卻一直談論班遊地點。此時同學可以向主席提出下列何者？", "opts": [["A", "權宜問題"], ["B", "秩序問題"], ["C", "臨時動議"], ["D", "附署"]], "ans": "B", "exp": "秩序問題是指議題進行中發生議事程序錯誤，例如發言超出議題範圍，出席人得請求主席糾正。"}, {"stem": "關於班會中的「提案」，下列敘述何者正確？", "opts": [["A", "開會中以口頭提出，並經一人以上附議"], ["B", "由主席單獨決定，不需其他人同意"], ["C", "開會前以書面呈現，並經一人以上「附署」"], ["D", "只要有人喊出來就自動成立，不需程序"]], "ans": "C", "exp": "提案是在開會「前」以書面呈現，並經一人以上「附署」；口頭提出並經「附議」的則是動議。"}, {"stem": "關於班會中的「動議」，下列敘述何者正確？", "opts": [["A", "開會前以書面呈現，並經一人以上附署"], ["B", "開會中以口頭提出，並經一人以上「附議」"], ["C", "必須經全班三分之二同意才能提出"], ["D", "只有班級幹部才有資格提出"]], "ans": "B", "exp": "動議是在開會中以口頭提出，並須經一人以上「附議」才能成立，與會前書面的「提案」（需附署）不同。"}, {"stem": "班會流程中，若有成員想提出「並非最初提案或動議」的其他議題進行討論，應在哪一個階段提出？", "opts": [["A", "臨時動議"], ["B", "報告事項"], ["C", "宣布開會"], ["D", "散會"]], "ans": "A", "exp": "臨時動議是提供成員在會議中提出非原訂議程議案的階段，讓臨時想到的議題也能被討論。"}, {"stem": "依會議規範，若同一議題有多個處理方案被提出，表決的順序原則為何？", "opts": [["A", "由主席自行決定先表決哪一案"], ["B", "由票數最多的班級幹部決定"], ["C", "依提案人座號由小到大排列"], ["D", "先提議（提名）者先表決"]], "ans": "D", "exp": "表決的順序原則是「先提名（提議），先表決」，表決方式通常有舉手、投票、起立等，並依多數決原則宣布結果。"}, {"stem": "七年五班班會表決通過「每週五為班級整潔加強日」。關於這項決議的效力，下列敘述何者正確？", "opts": [["A", "只對投贊成票的同學有效"], ["B", "對全校每一個班級都有拘束力"], ["C", "對該班學生具有拘束力，應共同遵守"], ["D", "因為只是班會，所以不具任何拘束力"]], "ans": "C", "exp": "班會的決議對該班學生具有拘束力，該班學生應共同遵守，才能維持班級的和諧運作；但其效力不及於其他班級。"}, {"stem": "班會討論時，關於發言應注意的事項，下列何者正確？", "opts": [["A", "想到什麼就可以直接大聲說出來，不必經過任何人"], ["B", "發言須先徵求主席同意，並尊重他人發言、避免人身攻擊"], ["C", "只有班級幹部才享有討論與發言的權利"], ["D", "為了展現氣勢，可以用言語攻擊反對者"]], "ans": "B", "exp": "課本指出與會成員都有討論的權利，但發言時須徵求主席同意、表達盡量簡明扼要，並應尊重別人的發言、避免人身攻擊。"}, {"stem": "阿哲與同學為了球場使用順序發生激烈爭執，雙方情緒都很激動。依課本建議，下列何者是最適當的處理方式？", "opts": [["A", "先讓情緒冷靜、離開衝突現場，再以同理心溝通，必要時向師長或專業輔導機構求助"], ["B", "立刻以武力解決，讓對方知道自己不好惹"], ["C", "找更多同學一起孤立對方，逼他讓步"], ["D", "完全不理會、假裝沒發生，讓事情自然過去"]], "ans": "A", "exp": "課本指出衝突未必都是負面的，只要處理得當反而能增進處理事務與人際互動的能力；正確做法是先冷靜情緒、離開現場，以同理心溝通，無法解決時再向信任的親友、師長或專業輔導機構尋求協助。以暴力或孤立處理只會惡化同儕關係。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "下列哪一項最符合課本對「社會變遷」的定義？", "opts": [["A", "個人為適應團體生活而改變自己的行為習慣"], ["B", "人類社會在器物、制度、理念等層次不斷改變的過程"], ["C", "政府為解決社會問題所推動的各項福利政策"], ["D", "人口由鄉村移往都市所造成的人口分布改變"]], "ans": "B", "exp": "社會變遷是指人類社會各個面向（包含器物、制度、理念等層次）不斷改變的過程，例如教學方式從板書變成數位化教學、從重男輕女轉為強調性別平等。(A) 是個人的社會化；(C)(D) 只是社會變遷的其中一種表現或成因，範圍太窄。"}, {"stem": "小明整理課堂筆記，把「智慧型手機、電動機車、電子白板」歸為同一類。這一類屬於社會變遷的哪一個層次？", "opts": [["A", "理念層次"], ["B", "制度層次"], ["C", "器物層次"], ["D", "環境層次"]], "ans": "C", "exp": "人類創造的各種器具、文物與技術屬於器物層次。手機、機車、電子白板都是具體的工具與技術產品。"}, {"stem": "下列何者屬於社會變遷中的「制度」層次？", "opts": [["A", "政府修法禁止行車中操作手機"], ["B", "廠商研發出續航力更長的電池"], ["C", "民眾逐漸接受性別平等的價值觀"], ["D", "學校添購電子白板等數位設備"]], "ans": "A", "exp": "典章制度、風俗習慣及法律等屬於制度層次，修法屬之。(B)(D) 是器物層次；(C) 是理念層次。"}, {"stem": "下列哪一個例子屬於社會變遷的「理念」層次改變？", "opts": [["A", "車站將人工剪票改為機器自動驗票"], ["B", "立法院三讀通過保障移工權益的法案"], ["C", "政府在人行道上鋪設導盲磚"], ["D", "社會大眾逐漸揚棄重男輕女的想法"]], "ans": "D", "exp": "內心的價值觀與想法屬於理念層次。(A)(C) 屬器物層次，(B) 屬制度層次。"}, {"stem": "課本指出，隨著科技發展，各種工具與技術推陳出新，加速了社會變遷。其中哪一個層次的變化最為明顯？", "opts": [["A", "制度"], ["B", "器物"], ["C", "理念"], ["D", "風俗"]], "ans": "B", "exp": "科技發展直接帶來工具與技術的推陳出新，因此在社會變遷的三個層次中，以器物的變化最為明顯、也最容易被察覺。"}, {"stem": "智慧型手機普及後，有些駕駛在行車時操作手機而危害交通安全，政府因此修法禁止此類行為。這個例子最能說明什麼？", "opts": [["A", "器物的變遷需要制度的配合，才不會造成失序"], ["B", "制度的變遷必須依賴器物的發明才能落實"], ["C", "理念的改變是社會變遷中唯一重要的力量"], ["D", "科技發展必然帶來社會秩序的全面崩壞"]], "ans": "A", "exp": "手機（器物）普及帶來新的失序現象，必須靠修法（制度）來規範，說明器物層次的變遷需要制度或理念配合，才不會造成失序。"}, {"stem": "承上題，課本認為要「根本」解決行車使用手機的問題，除了修法之外，最重要的是什麼？", "opts": [["A", "全面禁止民眾購買智慧型手機"], ["B", "研發可以自動偵測駕駛行為的車輛"], ["C", "民眾秉持正確觀念使用手機，也就是理念的改變"], ["D", "不斷加重罰鍰金額使違規者不敢再犯"]], "ans": "C", "exp": "課本明白指出，法律只能規範外在行為，民眾若能秉持正確的觀念（理念層次）使用手機，才是根本的解決之道。"}, {"stem": "低排碳量的電動機車有助於實現環保理念。這個例子說明社會變遷中：", "opts": [["A", "器物層次的變化一定領先制度與理念"], ["B", "理念層次的改變完全不受器物影響"], ["C", "制度層次的變遷會阻礙器物的發明"], ["D", "制度或理念的變遷，有時需要器物的發明才能落實"]], "ans": "D", "exp": "環保是理念，但要真正做到減碳，仍須依靠電動機車這類器物的發明。這說明理念（或制度）的變遷有時需要器物配合才能落實。"}, {"stem": "關於社會變遷中器物、制度、理念三個層次的關係，下列敘述何者正確？", "opts": [["A", "三者會相互影響，必須兼顧均衡發展"], ["B", "三者各自獨立，彼此不會互相牽動"], ["C", "三者變遷的速度完全相同，不會失衡"], ["D", "器物層次最不重要，可以忽略不計"]], "ans": "A", "exp": "課本強調三個層次的變動會相互影響，若無法彼此兼顧、平衡發展，可能造成社會失序的現象。"}, {"stem": "課本指出，判斷不公平現象是否存在，一般可以由哪四個角度來看？", "opts": [["A", "自由、平等、博愛、人權"], ["B", "責任承擔、貢獻肯定、利益分配、需求滿足"], ["C", "生產、分配、交換、消費"], ["D", "器物、制度、理念、環境"]], "ans": "B", "exp": "課本列出判斷不公平的四個角度：責任承擔是否適當、貢獻是否受到肯定、利益是否合理分配、需求是否獲得滿足。"}, {"stem": "調查顯示，女性負責家庭中照顧工作的比率不僅高於男性，投入的時間也多於男性。這種現象屬於哪一種不公平？", "opts": [["A", "貢獻肯定的不公平"], ["B", "利益分配的不公平"], ["C", "需求滿足的不公平"], ["D", "責任承擔的不公平"]], "ans": "D", "exp": "女性走入職場後仍承擔較多的家庭照顧工作，是「責任」分配上的失衡，屬於責任承擔的不公平。"}, {"stem": "漁船工作工時長、危險性高，國人上船意願低落，政府因而開放國際漁工彌補勞動力不足，但他們的付出並未獲得應有的肯定與尊重。這屬於哪一種不公平？", "opts": [["A", "責任承擔的不公平"], ["B", "需求滿足的不公平"], ["C", "貢獻肯定的不公平"], ["D", "利益分配的不公平"]], "ans": "C", "exp": "國際漁工實際上補足了我國漁業的勞動力，對產業有貢獻，但這份貢獻未被社會與法規肯定，屬於貢獻肯定的不公平。"}, {"stem": "課本提到，相對於雇主而言，國際漁工的薪資明顯偏低。這種情形屬於下列何種不公平？", "opts": [["A", "責任承擔的不公平"], ["B", "利益分配的不公平"], ["C", "貢獻肯定的不公平"], ["D", "需求滿足的不公平"]], "ans": "B", "exp": "薪資是勞動所得的分配結果。漁工付出勞力卻只拿到微薄薪資，雇主取得大部分利益，屬於利益分配的不公平。要注意同一事件可能同時涉及多種不公平面向。"}, {"stem": "許多人行道上設置變電箱、電線杆等設施，使人行道寬度大幅縮減，妨礙行人通行，對身心障礙者更造成危險。這最直接反映哪一種不公平？", "opts": [["A", "需求滿足的不公平"], ["B", "責任承擔的不公平"], ["C", "貢獻肯定的不公平"], ["D", "利益分配的不公平"]], "ans": "A", "exp": "公共設施的設置忽略身心障礙者實際所需，使其未獲得可滿足其需求的適當資源，屬於需求滿足的不公平。"}, {"stem": "當資方未分配給勞方合理的薪資，而將多數利益納為己有時，最直接呈現哪一種不公平？長期下來會造成什麼結果？", "opts": [["A", "需求滿足的不公平；使勞工缺乏工作意願"], ["B", "責任承擔的不公平；使資方投資意願下降"], ["C", "利益分配的不公平；不利於縮短貧富差距"], ["D", "貢獻肯定的不公平；使物價快速上漲"]], "ans": "C", "exp": "勞資雙方分配不均屬於利益分配的不公平；長期分配不均會使財富持續向資方集中，不利於縮短貧富差距。"}, {"stem": "「我國受僱人員報酬及營業盈餘占國家總經濟生產的比重圖」顯示，受僱人員報酬所占比重逐漸下降。這張圖最適合用來說明下列何者？", "opts": [["A", "我國經濟成長已經完全停滯"], ["B", "勞工的每週工作時數逐年增加"], ["C", "政府稅收不足以推動社會福利"], ["D", "勞方相對於資方所能享受到的經濟成長利益減少"]], "ans": "D", "exp": "受僱人員報酬占比下降、營業盈餘占比相對上升，代表經濟成長的果實較多流向資方，勞方分到的比例減少，呈現利益分配的不公平。"}, {"stem": "統計顯示，我國年所得最高 20% 家庭與最低 20% 家庭的所得差距倍數長期居高不下。這項數據最能反映下列何者？", "opts": [["A", "我國失業率持續攀升"], ["B", "我國貧富差距的問題未見改善"], ["C", "我國人口老化速度加快"], ["D", "我國物價上漲幅度過大"]], "ans": "B", "exp": "高低所得組的差距倍數，是衡量貧富差距最常用的指標；倍數居高不下代表貧富差距問題並未改善。"}, {"stem": "依課本所述，「公平正義」的內涵包含哪兩個部分？", "opts": [["A", "確保每個人得到均等的機會，並在此前提下讓弱勢者得到更多照顧"], ["B", "讓所有人分配到完全相同數量的資源，不因能力與需求而有差異"], ["C", "保障強者的努力成果，弱者應自行承擔失敗的後果"], ["D", "由政府統一分配所有社會資源，取消個人的自由選擇"]], "ans": "A", "exp": "公平正義有兩層：先確保「機會均等」，再在此前提下對弱勢者提供「更多照顧」。它不等於齊頭式的平均分配。"}, {"stem": "我國實施義務教育，保障每位國民的受教權，讓來自不同家庭背景的孩子都擁有均等的入學與學習機會。這最符合公平正義的哪一項內涵？", "opts": [["A", "讓弱勢者得到更多照顧"], ["B", "社會資源完全平均分配"], ["C", "保障個人財產不受侵犯"], ["D", "每個人得到均等的機會"]], "ans": "D", "exp": "義務教育不分家庭背景一律保障受教權，是讓每個人都能公平取得教育機會，屬於「機會均等」這一層。"}, {"stem": "國家運用徵收的稅金發展社會福利政策，提供弱勢者各項生活照顧。這體現公平正義的哪一項內涵？", "opts": [["A", "每個人得到均等的機會"], ["B", "使所有人的所得完全相同"], ["C", "在機會均等的前提下，讓弱勢者得到更多照顧"], ["D", "依個人納稅金額多寡分配福利"]], "ans": "C", "exp": "把稅金用於照顧地位或資源相對弱勢的人，是在機會均等的基礎上再給予額外的照顧與利益。"}, {"stem": "法律規定，雇主對求職人或所僱用的員工，不得以種族、性別、年齡、五官、身心障礙等理由予以歧視。這項規定最主要是為了保障什麼？", "opts": [["A", "國民的就業機會平等"], ["B", "弱勢者可以領到更多的補助金"], ["C", "雇主自由挑選員工的權利"], ["D", "勞工加入工會的結社自由"]], "ans": "A", "exp": "禁止就業歧視的目的，是讓每個人不因先天或無關能力的特質而被排除，屬於保障「機會均等」的制度設計。"}, {"stem": "政府宣布將公務人員履歷表中的照片欄位刪除。這項作法最主要的用意是：", "opts": [["A", "節省列印履歷表的成本"], ["B", "避免因外貌而產生就業歧視，落實機會均等"], ["C", "讓政府完全不知道應徵者的任何個人資料"], ["D", "使弱勢者可以優先獲得錄取"]], "ans": "B", "exp": "照片會揭露五官、外貌等與工作能力無關的資訊，容易造成就業歧視。刪除照片欄位是為了讓評選回歸能力，落實機會均等。"}, {"stem": "依身心障礙者權益保障法規定，達到法定規模的民營事業機構必須進用一定比例的身心障礙者。這項規定最符合下列何種精神？", "opts": [["A", "讓所有國民的工作機會完全平均分配"], ["B", "由政府直接僱用全國所有身心障礙者"], ["C", "要求企業放棄追求合理利潤"], ["D", "在機會均等的基礎上，給予弱勢者更多照顧"]], "ans": "D", "exp": "定額進用制度是為身心障礙者「額外」保留就業機會，屬於公平正義中「讓弱勢者得到更多照顧」的展現。"}, {"stem": "某公司徵才啟事註明「歡迎身心障礙者應徵」，並說明公司依法規模須僱用一定比例的身障者。對此，下列判斷何者最適當？", "opts": [["A", "這是明顯的就業歧視，因為它排除了非身心障礙者"], ["B", "這違反機會均等原則，應該立即撤下啟事"], ["C", "這是依法對弱勢者提供更多照顧，並非就業歧視"], ["D", "這屬於社會變遷中器物層次的改變"]], "ans": "C", "exp": "就業歧視指的是「不利」的差別待遇。依法為身障者保留名額是給予弱勢者更多照顧，屬於落實公平正義，並非歧視。"}, {"stem": "作家林立青創辦友洗社創公司，聘僱無家者從事高壓清洗等工作，讓無家者習得一技之長，也能藉此賺取所得。根據此內容判斷，下列敘述何者正確？", "opts": [["A", "友洗社創公司是由無家者共同出資成立的企業"], ["B", "友洗社創公司以提供工作機會的方式協助無家者自立"], ["C", "政府補助是該公司唯一且主要的收入來源"], ["D", "至今尚未有任何無家者因此脫離街頭生活"]], "ans":  ["B", "只提供給公教人員與軍人居住"], ["C", "採只租不賣的方式，以弱勢民眾為優先承租對象"], ["D", "由民間建商興建後自由訂價出租"]], "ans": "C", "exp": "社會住宅只租不賣、租金較低，以經濟或其他因素而居於弱勢處境的民眾為優先承租對象，目的在落實居住正義。"}, {"stem": "政府提供房租補助、租屋協助給有居住需求的弱勢家庭，最主要是為了實現下列何種理念？", "opts": [["A", "居住正義"], ["B", "言論自由"], ["C", "政黨政治"], ["D", "多元文化"]], "ans": "A", "exp": "提供宜居住宅、房租補助或津貼、租屋協助，是為了保障國民的居住權益、實現居住正義，讓人民不必買房也能滿足居住需求。"}, {"stem": "我國推動社會福利的經費主要來自下列何者？", "opts": [["A", "政府發行彩券的全部盈餘"], ["B", "民眾繳納的稅收與社會保險的保費"], ["C", "外國政府提供的無償援助"], ["D", "公務人員自願捐出的薪水"]], "ans": "B", "exp": "課本明白指出，社會福利的經費主要來自稅收與社會保險的保費，因此民眾誠實納稅與繳納保費，是社會福利順利運作的基礎。"}, {"stem": "歐洲各國大多具有完善的社會福利制度，因此這些國家通常出現下列何種情形？", "opts": [["A", "政府完全不必編列社會福利預算"], ["B", "民眾不必繳納任何稅金"], ["C", "社會福利完全由宗教團體負責"], ["D", "需要龐大稅收支應，租稅負擔率相對較高"]], "ans": "D", "exp": "完善的社會福利需要龐大財政支持，因此歐洲（尤其北歐）國家的租稅負擔率相對較高，正是「享受多少權利，就要承擔多少責任」的體現。"}, {"stem": "治療罕見疾病的藥物昂貴又不一定適用健保給付，因此罕見疾病基金會為患者募款、籌措醫療與生活費用。這個例子最能說明下列何者？", "opts": [["A", "民間力量可以彌補現行社會福利的不足"], ["B", "政府應完全退出社會福利的推動"], ["C", "社會保險的保費應該全部由患者負擔"], ["D", "罕見疾病患者不需要任何社會福利協助"]], "ans": "A", "exp": "當社會福利措施無法顧及所有弱勢群體的需求，或民眾不符合申請資格時，民間力量的投入正可以彌補其不足，共構福利社會。"}, {"stem": "身為國民，下列何種作為最能善盡個人對社會福利的責任？", "opts": [["A", "盡量都不看醫生以節省健保支出"], ["B", "誠實納稅並按時繳納社會保險保費"], ["C", "拒絕領取任何政府提供的補助"], ["D", "要求政府取消所有社會福利措施"]], "ans": "B", "exp": "社會福利經費主要來自稅收與保費，民眾誠實納稅、按時繳納保費，才能讓制度順利運作並發揮功能，這是個人最基本的責任。"}, {"stem": "下列何種行為最符合「建立正確使用社會福利資源」的觀念？", "opts": [["A", "為了方便就醫而到多家醫院重複領藥"], ["B", "要求醫師做非必要的檢查以「用回本」"], ["C", "以不實資料申請低收入戶補助"], ["D", "依實際需要就醫，避免浪費醫療與健保資源"]], "ans": "D", "exp": "社會福利資源有限，民眾應避免以違法或不當手段取得資格，也不應重複就醫取藥或要求不必要的檢查，才能讓資源分配給真正需要的人。"}, {"stem": "健保署統計顯示，民國112年有人1年就醫高達859次，大約1天跑2趟醫院。此現象最可能造成下列何種問題？", "opts": [["A", "提升全體國民的健康水準"], ["B", "使健保保費不斷降低"], ["C", "造成醫療與健保資源的浪費"], ["D", "提高醫療院所的服務品質"]], "ans": "C", "exp": "過度且非必要的就醫會消耗有限的醫療與健保資源，使真正需要的人難以獲得適切照護，是社會福利資源被浪費的典型例子。"}, {"stem": "我國貧窮率在西元2021年僅為1.3%，遠低於日本的15.6%與德國的16%。課文指出此數據背後隱含的問題為何？", "opts": [["A", "低收入戶審查門檻嚴格，使貧窮率被低估"], ["B", "我國國民所得已經超越日本與德國"], ["C", "我國社會福利支出為全世界最高"], ["D", "我國人口太少，統計上不具意義"]], "ans": "A", "exp": "我國以取得低收入戶資格者為貧窮人口，但審查門檻嚴格（例如假定民眾有基本工資收入），使貧窮率被低估，可能有數百萬貧窮人口被排除在補助之外。"}, {"stem": "單親媽媽美玉因身體癱瘓、行動不便而無法工作，卻因被認定「有工作能力」而無法通過低收入戶審查。針對這種情況，政府最適當的改善方向為何？", "opts": [["A", "制定新的職業保險，強制美玉投保"], ["B", "大量增加社會住宅的興建數量"], ["C", "嚴格執行工廠的勞動安全檢查"], ["D", "檢討並放寬社會救助的資格審查門檻"]], "ans": "D", "exp": "問題核心在於社會救助（低收入戶）審查門檻過高，使真正貧窮的民眾無法獲得補助，因此最直接的改善方式是修法降低申請資格門檻。"}, {"stem": "新北市等縣市與四大超商合作的「幸福保衛站」，為18歲以下遇到困難的學生提供餐點，採「救急不救窮」原則。此計畫最能說明下列何者？", "opts": [["A", "社會福利完全可以由超商業者獨力完成"], ["B", "社會保險應該擴大納保對象至全體學生"], ["C", "政府與民間合作，可以更即時滿足弱勢者的基本需求"], ["D", "學生的基本生活需求不屬於社會福利的範圍"]], "ans": "C", "exp": "幸福保衛站由地方政府結合民間超商與善款推動，是政府與民間通力合作、共同建構社會安全網的例子，能即時協助陷入困境的弱勢學生。"}, {"stem": "芒草心慈善協會設置專門安置女性無家者的收容所「潭馨園」，最主要的目標是協助她們找到穩定的工作，並能在外獨立租屋。此目標與下列哪兩項社會福利最有關？", "opts": [["A", "社會保險與醫療保健"], ["B", "社會住宅與國民就業"], ["C", "社會津貼與社會保險"], ["D", "醫療保健與社會津貼"]], "ans": "B", "exp": "「找到穩定工作」對應國民就業，「在外獨立租屋、不再無家可歸」對應社會住宅（居住權益的保障）。"}, {"stem": "政府推動強制投保的社會保險，最主要的精神為何？", "opts": [["A", "藉由社會互助，將個人的生活風險轉由社會共同分攤"], ["B", "讓收入愈高的人享有愈好的醫療品質"], ["C", "使政府可以增加稅收以平衡財政"], ["D", "讓民眾自行承擔所有生活上的風險"]], "ans": "A", "exp": "社會保險的核心精神是「社會互助、共同承擔風險」，透過全民繳費與政府補助，把個人可能面對的生、老、病、死、傷、殘、失業等風險由社會共同分攤。"}, {"stem": "全民健康保險不論國民繳交的健保費高低，均給予相同程度的健康照護。此設計最能展現下列何種精神？", "opts": [["A", "使用者付費，多繳費者多得到照顧"], ["B", "依社會地位高低分配醫療資源"], ["C", "自助與互助，保障全民平等的就醫權益"], ["D", "鼓勵民眾盡量多繳保費以換取更佳醫療"]], "ans": "C", "exp": "全民健保基於自助與互助精神規畫，保險對象不因身分或保費多寡而有不同醫療品質，使弱勢族群同樣享有平等的醫療資源。"}, {"stem": "關於「社會津貼」與「社會救助」的比較，下列敘述何者正確？", "opts": [["A", "兩者都必須先繳納保費才能請領"], ["B", "兩者都只以現金給付，不提供任何服務"], ["C", "社會津貼只給低收入戶，社會救助則人人可領"], ["D", "社會津貼較具普及性，社會救助則針對經濟弱勢與遭逢急難者"]], "ans": "D", "exp": "社會津貼屬普及性質，只要符合特定身分或需求（如生育、育兒、老年、身心障礙）即可請領；社會救助則以經濟弱勢或遭受急難、災害者為對象，需經資格審查。兩者皆不必先繳保費。"}, {"stem": "許多公寓沒有設置電梯，使行動不便的身障者或年長者外出不易，政府因此補助裝設樓梯升降椅。此措施最主要的目的為何？", "opts": [["A", "提高老舊公寓的房屋價格"], ["B", "滿足特定群體的需求，提升其生活品質與尊嚴"], ["C", "增加建築業者的工作機會"], ["D", "強制所有公寓都必須改建為電梯大樓"]], "ans": "B", "exp": "針對身心障礙者與年長者的行動需求提供協助，屬於福利服務的範疇，目的在滿足不同群體的需求，使其享有公平與尊嚴的生活。"}, {"stem": "教育部補助各縣市學校採購身心障礙學生交通車。此措施最主要保障下列何者？", "opts": [["A", "學校教師的勞動權益"], ["B", "學生家庭的居住權益"], ["C", "身心障礙學生的就學權益"], ["D", "交通運輸業者的營業利益"]], "ans": "C", "exp": "補助身心障礙學生交通車，是針對身心障礙這個特定群體提供的服務措施，目的在保障其就學權益，使其能與他人一樣接受教育。"}, {"stem": "面對高齡人口快速增加，下列哪一項政府措施屬於「福利服務」的範疇？", "opts": [["A", "為社區長者辦理共餐服務"], ["B", "發給退休勞工老年年金給付"], ["C", "提供長者免費健康檢查"], ["D", "興建樂齡社會住宅"]], "ans": "A", "exp": "共餐服務屬生活照顧面向，是針對長者需求就近提供的服務措施，屬福利服務。(B)屬社會保險給付、(C)屬醫療保健、(D)屬社會住宅。"}, {"stem": "為了因應少子化問題、減輕家長養育子女的經濟負擔，政府最可能採取下列何種措施？", "opts": [["A", "提高國民年金保險的投保年齡"], ["B", "提供育兒津貼與托育補助"], ["C", "加強辦理身心障礙者家務服務"], ["D", "擴大興建只租不賣的社會住宅"]], "ans": "B", "exp": "育兒津貼、生育津貼與托育補助都是以現金或費用補助方式減輕家長養育子女的負擔，是政府因應少子化最直接的社會津貼措施。"}, {"stem": "政府推動「脫貧自立計畫」，其中讓受助者以勞動換取收入的「以工代賑」，屬於下列哪一項社會福利？", "opts": [["A", "社會保險"], ["B", "社會津貼"], ["C", "醫療保健"], ["D", "社會救助"]], "ans": "D", "exp": "脫貧自立計畫與以工代賑，是政府為扶助經濟弱勢者維持基本生活並協助其自立、脫離對救助依賴的做法，屬於社會救助。"}, {"stem": "我國社會救助的內容主要包含下列何者？", "opts": [["A", "生活扶助、醫療補助、急難救助及災害救助"], ["B", "生育津貼、育兒津貼及老年津貼"], ["C", "全民健保、勞工保險及國民年金保險"], ["D", "職業訓練、就業媒合及職業安全衛生"]], "ans": "A", "exp": "社會救助的四大內容為生活扶助、醫療補助、急難救助及災害救助。(B)為社會津貼、(C)為社會保險、(D)為國民就業。"}, {"stem": "課文指出，僅依賴個人或民間團體行善，難以促成社會的公平正義。其主要理由為何？", "opts": [["A", "民間團體的行善行為都違反法律規定"], ["B", "政府禁止民間團體從事任何救助工作"], ["C", "行善是一種選擇而非責任義務，不易長久維持且力量有限"], ["D", "民間團體擁有的資源遠比政府還要多"]], "ans": "C", "exp": "行善必須行善者「願意」且「能夠」提供資源，屬於個人選擇而非義務，因此不易長期持續、力量也有限，必須由國家運用公權力建立制度才能普遍保障人民。"}, {"stem": "既然國家能運用公權力調度資源，為何仍需要民間團體參與社會福利？", "opts": [["A", "因為政府依法不得直接提供任何福利服務"], ["B", "因為民間團體熟悉在地情況，較能即時發現並協助周遭居民的需求"], ["C", "因為民間團體可以完全取代政府的社會福利責任"], ["D", "因為政府希望藉此大幅減少稅收"]], "ans": "B", "exp": "國家的經費與資源有限，而個人與民間團體基於對生活環境的熟悉，較能在第一時間知曉在地需求並提供即時協助，因此雙方需相互合作、共構福利社會。"}, {"stem": "政府運用國家資源建立「社會安全網」，其最主要的功能為何？", "opts": [["A", "監控國民的日常生活與消費行為"], ["B", "限制民眾自由遷徙與選擇職業"], ["C", "使國家的財政收入極大化"], ["D", "提供基本的生活保障，使每個人都能擁有選擇的自由"]], "ans": "D", "exp": "政府針對人民基本生活的各種需要，運用國家資源建立社會安全網，提供基本生活保障，讓每個人擁有選擇的自由，以實現具有人性尊嚴的生活。"}, {"stem": "下列哪一組「措施」與「所屬社會福利項目」的搭配是正確的？", "opts": [["A", "發放低收入戶生活扶助金——社會津貼"], ["B", "政府辦理免費流感疫苗接種——社會住宅"], ["C", "成立就業服務站並提供職業訓練——國民就業"], ["D", "民眾參加全民健康保險——社會救助"]], "ans": "C", "exp": "(A)生活扶助屬社會救助；(B)疫苗接種屬醫療保健；(D)全民健保屬社會保險；只有(C)搭配正確。"}, {"stem": "綜合本課內容，國家推動社會福利最根本的目的為何？", "opts": [["A", "保障國民的基本生活，維護人性尊嚴與選擇自由"], ["B", "增加政府的稅收以擴充國防武力"], ["C", "使民眾長期依賴補助而不必努力工作"], ["D", "由政府完全取代家庭與民間團體的所有功能"]], "ans": "A", "exp": "推動社會福利、保障個人基本生活是現代國家的重要責任，其根本目的在於讓每個人都能享有平等且有尊嚴的生活，保有追求理想生活的選擇自由。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

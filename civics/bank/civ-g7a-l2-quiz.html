<script>
const QS=[{"stem": "小美出生時，醫生依據她的染色體與生殖器官構造，判定她為女生。這種區分性別的方式，屬於下列何者？", "opts": [["A", "社會性別"], ["B", "生理性別"], ["C", "性別氣質"], ["D", "性別角色期待"]], "ans": "B", "exp": "生理性別是以染色體、生殖器官等與生俱來的身體構造為基準來區分性別，與後天社會期待無關。"}, {"stem": "「男生應該剛強勇敢、女生應該秀氣溫柔」，這種社會對不同性別在氣質、行為與態度上的期待，形成了個人的何種認知？", "opts": [["A", "生理性別"], ["B", "人性尊嚴"], ["C", "社會性別"], ["D", "身體自主權"]], "ans": "C", "exp": "社會性別是社會期望不同性別表現出的行為模式，是個人在成長過程中後天學習而來的。"}, {"stem": "下列關於「生理性別」與「社會性別」的比較，何者正確？", "opts": [["A", "兩者都是與生俱來，無法改變"], ["B", "兩者都是後天學習而來的結果"], ["C", "生理性別由社會期待決定，社會性別由染色體決定"], ["D", "生理性別與生俱來，社會性別是後天學習"]], "ans": "D", "exp": "生理性別來自身體構造，屬與生俱來；社會性別則是透過家庭、學校、媒體等途徑後天學習形塑而成。"}, {"stem": "下列哪一個情境，最能說明「家庭」是個人學習社會性別的重要途徑？", "opts": [["A", "父母買模型汽車給兒子、買布偶娃娃給女兒"], ["B", "廣告找男明星代言汽車、找女明星代言洗衣機"], ["C", "班級選舉時男生常被選為體育股長"], ["D", "電視劇中醫生多由男演員扮演"]], "ans": "A", "exp": "父母因子女的生理性別採取不同教養方式，家庭是個人最早學習社會性別的場所；(B)(D) 屬大眾傳播媒體，(C) 屬學校。"}, {"stem": "阿明發現連續劇裡的司機、律師大多由男性擔任，護理師、家庭主婦大多由女性擔任。此現象最能說明下列何種途徑影響了人們的社會性別學習？", "opts": [["A", "家庭"], ["B", "學校"], ["C", "大眾傳播媒體"], ["D", "政府法規"]], "ans": "C", "exp": "戲劇、電影、廣告等大眾傳播媒體的內容，會反覆傳遞特定性別形象，影響社會大眾對社會性別的學習。"}, {"stem": "下列何者屬於學校影響學生社會性別認知的例子？", "opts": [["A", "母親要求女兒學習做家事"], ["B", "老師選班級幹部時，習慣讓男生當體育股長、女生當學藝股長"], ["C", "汽車廣告一律由男性代言"], ["D", "電影中英雄角色多為男性"]], "ans": "B", "exp": "學校的課程安排、教師態度與活動設計，都是學生學習社會性別的重要管道。"}, {"stem": "當社會上長期對某一性別形成「固定且僵化」的看法，並以此作為評價他人的標準時，這稱為下列何者？", "opts": [["A", "性別偏見"], ["B", "性別歧視"], ["C", "性別暴力"], ["D", "性別刻板印象"]], "ans": "D", "exp": "性別刻板印象的關鍵在於「固定、僵化的看法」，並以此作為評價他人的標準。"}, {"stem": "小華是男生，因為害怕蟑螂而被同學評論「這樣一點都不像男生」。這種對不符合性別期待者抱持負面態度的情形，屬於下列何者？", "opts": [["A", "性別偏見"], ["B", "性別刻板印象"], ["C", "性別歧視"], ["D", "性騷擾"]], "ans": "A", "exp": "性別偏見是指當個人行為不符合社會對其性別的期待時，社會對此人抱持負面的評價或態度。"}, {"stem": "某公司規定「幼兒園教師限女性報名」，只錄用女性擔任幼教老師。這種以實際制度作出不利差別對待的行為，屬於下列何者？", "opts": [["A", "性別刻板印象"], ["B", "性別偏見"], ["C", "性別歧視"], ["D", "性別氣質"]], "ans": "C", "exp": "性別歧視是因性別偏見而以實際方法或制度採取不利的差別對待，已造成具體的權益受損。"}, {"stem": "依課本所述，性別刻板印象、性別偏見、性別歧視三者的發展順序，下列何者正確？", "opts": [["A", "性別歧視→性別偏見→性別刻板印象"], ["B", "性別刻板印象→性別偏見→性別歧視"], ["C", "性別偏見→性別刻板印象→性別歧視"], ["D", "性別歧視→性別刻板印象→性別偏見"]], "ans": "B", "exp": "社會性別過度僵化形成刻板印象，進而對不符期待者產生負面評價（偏見），最後化為不利的差別對待（歧視）。"}, {"stem": "下列敘述何者屬於「性別刻板印象」，而非性別偏見或性別歧視？", "opts": [["A", "公司以性別而非能力決定升遷人選"], ["B", "認為不會煮飯的女生「不夠賢慧」"], ["C", "徵才廣告註明「限女性應徵」"], ["D", "認為男生讀理工、女生讀文史比較適合"]], "ans": "D", "exp": "(D) 只是對兩性適合科系的固定僵化看法，屬刻板印象；(B) 是負面評價屬偏見；(A)(C) 已形成差別待遇，屬歧視。"}, {"stem": "「同工不同酬」的現象，使職場上有相同貢獻的工作者未能獲得公平對待。此現象最適合歸類為下列何者？", "opts": [["A", "性別歧視"], ["B", "性別刻板印象"], ["C", "性別氣質"], ["D", "性別平等"]], "ans": "A", "exp": "同工不同酬是以制度作出實際的不利差別待遇，屬於性別歧視。"}, {"stem": "雇主認為「已婚女性要照顧家庭，無法全力以赴工作」，因而不願錄用。此想法所造成的主要傷害為何？", "opts": [["A", "使男性喪失照顧家庭的機會"], ["B", "使女性在職場上不受尊重、貢獻未被肯定"], ["C", "使雇主必須支付更高薪資"], ["D", "使女性得以享有更多產假權益"]], "ans": "B", "exp": "這種性別偏見容易讓女性在職場遭受排擠，貢獻未能被肯定，是性別不平等造成的具體傷害。"}, {"stem": "課本提到，性別刻板印象會「忽視個別差異」，其最主要的負面影響為何？", "opts": [["A", "使法律無法執行"], ["B", "使國家人口減少"], ["C", "限制個人自由選擇的空間"], ["D", "使薪資水準普遍下降"]], "ans": "C", "exp": "用單一性別標準評價每個人，會忽略個人的興趣與能力差異，限制個人選擇職業與生活方式的自由。"}, {"stem": "下列有關「性別不平等造成的影響」，何者最為嚴重且直接侵害個人身心健康與人身安全？", "opts": [["A", "性騷擾與性侵害"], ["B", "同工不同酬"], ["C", "職業選擇受限"], ["D", "家務分工不均"]], "ans": "A", "exp": "課本指出性騷擾或性侵害是嚴重侵害個人身心健康與人身安全的性別暴力行為。"}, {"stem": "阿光認為「男兒有淚不輕彈」，因此看到男同學哭泣就加以嘲笑。依課本觀點，下列回應何者最為適當？", "opts": [["A", "男生的確不應該在公開場合哭泣"], ["B", "哭泣是女生才有的權利"], ["C", "應該規定男生不得在校內哭泣"], ["D", "情緒宣洩是人性本能，不應以性別給予負面評價"]], "ans": "D", "exp": "課本明確指出，情緒的宣洩是人性的本能，不應要求「男兒有淚不輕彈」或給予負面評價。"}, {"stem": "要改善性別不平等，課本指出可以從哪兩個方面著手？", "opts": [["A", "經濟與外交"], ["B", "家庭與宗教"], ["C", "觀念與制度"], ["D", "科技與醫療"]], "ans": "C", "exp": "性別不平等來自個人過去學習的性別觀念與社會制度，因此改善之道也從「觀念」與「制度」兩方面探討。"}, {"stem": "下列何者屬於從「觀念層面」促進性別平等的做法？", "opts": [["A", "立法院三讀通過性別平等工作法"], ["B", "面對他人時避免以性別刻板印象妄下論斷"], ["C", "學校設置性別平等教育委員會"], ["D", "勞動部公布每年的同酬日"]], "ans": "B", "exp": "注意自己的言行、回歸「個人」的本質、不以性別刻板印象評斷他人，屬於觀念層面的改善；其餘皆屬制度層面。"}, {"stem": "下列何者屬於從「制度層面」促進性別平等的做法？", "opts": [["A", "政府制定符合性別平等的法規與制度"], ["B", "培養尊重多元性別的態度"], ["C", "站在對方立場思考問題"], ["D", "提醒自己不要嘲笑他人的性別氣質"]], "ans": "A", "exp": "制度 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

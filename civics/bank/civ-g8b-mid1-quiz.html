<script>
const QS=[{"stem": "法律和道德、風俗習慣同樣都是社會規範，但法律有一項其他規範所沒有的特色。這項特色是什麼？", "opts": [["A", "法律的內容永遠不會修改"], ["B", "法律只規範政府，不規範人民"], ["C", "法律具有國家的強制力，違反時會受到制裁"], ["D", "法律必須全體國民投票同意才能適用"]], "ans": "C", "exp": "課本指出「法律是具有強制力的社會規範」。道德與風俗違反時多半只受輿論譴責，法律則由國家以公權力強制實施。"}, {"stem": "在我國，由立法院通過、並經總統公布的法律，屬於下列何者？", "opts": [["A", "狹義的法律"], ["B", "廣義的法律"], ["C", "命令"], ["D", "自治規章"]], "ans": "A", "exp": "課本區分廣義與狹義：狹義的法律專指立法院通過、總統公布者；廣義的法律則包含憲法、法律與命令三者。"}, {"stem": "下列哪一組合，才是課本所說的「廣義的法律」？", "opts": [["A", "憲法、道德、命令"], ["B", "法律、命令、校規"], ["C", "憲法、法律、風俗習慣"], ["D", "憲法、法律、命令"]], "ans": "D", "exp": "廣義的法律包含憲法、法律、命令三者，三者位階與效力並不相同。道德、風俗、校規並非廣義法律。"}, {"stem": "關於憲法、法律與命令三者的關係，下列敘述何者正確？", "opts": [["A", "三者位階相同，效力也一樣"], ["B", "位階低者若牴觸位階高者，則牴觸的部分無效"], ["C", "位階高者必須配合位階低者修正"], ["D", "命令的效力高於法律，因為命令較具體"]], "ans": "B", "exp": "課本明示「位階低者牴觸位階高者則無效」。位階由高至低為憲法、法律、命令。"}, {"stem": "我國憲法被稱為「國家根本大法」，其內容主要規範什麼？", "opts": [["A", "人民的權利與義務，以及政府的組織與職權"], ["B", "買賣契約的成立要件"], ["C", "各級學校的招生名額"], ["D", "各種犯罪的刑度輕重"]], "ans": "A", "exp": "憲法作為根本大法，主要規定人民權利義務及政府組織職權等重要事項；契約、招生、刑度屬於法律或命令的層次。"}, {"stem": "我國現行憲法的內容，包括下列哪兩部分？", "opts": [["A", "憲法本文與國民教育法"], ["B", "憲法本文與司法判決"], ["C", "憲法增修條文與行政命令"], ["D", "憲法本文與憲法增修條文"]], "ans": "D", "exp": "課本說明我國憲法包括「憲法本文」與「憲法增修條文」兩部分，兩者都屬於憲法位階。"}, {"stem": "「任何法律與命令若牴觸憲法，即為無效。」這句話說明憲法具有下列哪一項特性？", "opts": [["A", "原則性"], ["B", "最高性"], ["C", "固定性"], ["D", "具體性"]], "ans": "B", "exp": "最高性指憲法是最高的法律規範，位階最高，其他法令都不得與它牴觸。"}, {"stem": "我國憲法的條文相當簡明扼要，只針對政府組織與人民權利義務等重要事項作規定。這反映憲法的哪一項特性？", "opts": [["A", "最高性"], ["B", "固定性"], ["C", "原則性"], ["D", "強制性"]], "ans": "C", "exp": "原則性指憲法只就重要事項作原則、扼要的規範，細節則留給法律與命令去補充落實。"}, {"stem": "憲法的制定與修改程序，比一般法律繁複許多。這項特性又可稱為「穩定性」，它是指下列何者？", "opts": [["A", "固定性"], ["B", "最高性"], ["C", "原則性"], ["D", "公開性"]], "ans": "A", "exp": "固定性（穩定性）指憲法的制定與修改程序比普通法律更為繁複，目的是避免憲法被輕易更動。"}, {"stem": "依課本所述，我國憲法本文最初是由下列哪一個機關制定？", "opts": [["A", "立法院"], ["B", "制憲國民大會"], ["C", "總統府"], ["D", "憲法法庭"]], "ans": "B", "exp": "憲法由制憲國民大會制定；現行修憲則由立法院提案、選舉人複決，最後由總統公布。"}, {"stem": "依我國現行修憲程序，立法院提出憲法修正案並公告半年後，須由誰做出最後決定？", "opts": [["A", "由總統直接決定是否公布"], ["B", "由憲法法庭判決是否通過"], ["C", "由行政院院會決議"], ["D", "由選舉人投票複決"]], "ans": "D", "exp": "修憲案經立法院決議提出、公告半年後，須交由選舉人（公民）投票複決，通過後才由總統公布。"}, {"stem": "關於「法律」（狹義）的制定與公布，下列敘述何者正確？", "opts": [["A", "由行政院制定，行政院長公布"], ["B", "由憲法法庭制定，總統公布"], ["C", "由立法院制定與修改，總統公布"], ["D", "由選舉人複決通過後生效"]], "ans": "C", "exp": "狹義法律的制定、修改權在立法院（經三讀通過），再由總統公布。選舉人複決是修憲程序，不是立法程序。"}, {"stem": "「命令」多半是哪個機關依據法律的授權所訂定？", "opts": [["A", "立法院"], ["B", "行政機關"], ["C", "法院"], ["D", "制憲國民大會"]], "ans": "B", "exp": "命令由行政機關基於法律授權訂定並發布，用來補充並落實法律的相關規定。"}, {"stem": "下列哪一組名稱，屬於課本所說「法律」層級常見的名稱？", "opts": [["A", "法、律、條例、通則"], ["B", "規程、規則、細則、辦法"], ["C", "標準、準則、綱要、辦法"], ["D", "本文、增修條文"]], "ans": "A", "exp": "法律的名稱有法、律、條例、通則；規程、規則、細則、辦法、綱要、標準、準則則是命令的名稱。"}, {"stem": "小禾在網路上查到一份法規叫做「國民教育法施行細則」。依名稱判斷，它屬於下列哪一種位階？", "opts": [["A", "憲法"], ["B", "法律"], ["C", "命令"], ["D", "憲法增修條文"]], "ans": "C", "exp": "名稱中含「細則」者屬命令，由行政機關訂定，用來補充落實「國民教育法」這部法律。"}, {"stem": "若將憲法、法律、命令依「位階與效力」由高至低排列，正確順序為何？", "opts": [["A", "命令→法律→憲法"], ["B", "法律→憲法→命令"], ["C", "憲法→命令→法律"], ["D", "憲法→法律→命令"]], "ans": "D", "exp": "位階高低為憲法最高、法律次之、命令最低；愈往下愈具體，效力則愈弱。"}, {"stem": "課本以受國民教育為例說明位階關係：憲法第21條規定人民有受國民教育的權利與義務，據此制定「國民教育法」規定6至15歲國民應受國民教育，再訂定「國民教育法施行細則」規定入學年齡的計算方式。這個例子最能說明下列何者？", "opts": [["A", "法律依憲法而制定，命令則用來補充並落實法律規定"], ["B", "命令的效力高於法律，因此規定得比較細"], ["C", "憲法必須依照法律的內容來修改"], ["D", "三者由不同人民團體各自制定，互不相關"]], "ans": "A", "exp": "這正是位階金字塔的典型例子：憲法作原則性規定，法律具體實現憲法內涵，命令再補充落實法律。"}, {"stem": "「6歲至15歲的國民，應受國民教育。」這條規定出自國民教育法。它屬於下列哪一位階？", "opts": [["A", "憲法"], ["B", "法律"], ["C", "命令"], ["D", "校規"]], "ans": "B", "exp": "「國民教育法」名稱為「法」，是立法院通過、總統公布的狹義法律。"}, {"stem": "某部行政機關訂定的辦法，其內容與立法院制定的法律規定相互衝突。依法律位階原則，結果應是如何？", "opts": [["A", "該法律應配合辦法修正"], ["B", "兩者都繼續有效，由人民自行選擇適用"], ["C", "該辦法牴觸法律的部分無效"], ["D", "應由行政院決定哪一個有效"]], "ans": "C", "exp": "命令不得牴觸憲法與法律，牴觸者無效；位階低者永遠必須讓位給位階高者。"}, {"stem": "當一部法律有牴觸憲法的疑慮時，依課本所述，應由下列哪一個機關判斷是否違憲？", "opts": [["A", "立法院"], ["B", "監察院"], ["C", "行政院"], ["D", "憲法法庭"]], "ans": "D", "exp": "憲法法庭掌理解釋憲法、統一解釋法律及命令，由它判決法律或命令是否違憲，以確保憲法的最高性。"}, {"stem": "某一法律被憲法法庭判決違憲後，依課本所述，接下來應如何處理？", "opts": [["A", "繼續適用，直到下次修憲時一併處理"], ["B", "必須盡快修正或立即廢止，以免侵害人民權利"], ["C", "改由行政機關以命令的形式重新發布"], ["D", "交由全體選舉人投票決定是否保留"]], "ans": "B", "exp": "課本明白指出，經判決違憲的法律與命令必須盡快修正或立即廢止，避免繼續侵害人民權利。"}, {"stem": "依課本的修憲程序圖，下列順序何者正確？", "opts": [["A", "立法委員提議→立法院決議提出憲法修正案→公告半年→選舉人投票複決→總統公布"], ["B", "總統提案→立法院三讀通過→總統公布"], ["C", "行政院提案→憲法法庭審查→公告半年→總統公布"], ["D", "選舉人連署→制憲國民大會表決→總統公布"]], "ans": "A", "exp": "修憲須經立委提議、立法院決議提出修正案、公告半年、選舉人複決，通過後才由總統公布，程序遠比立法繁複。"}, {"stem": "我國憲法修正案要交付選舉人複決時，須達到下列哪一項門檻才算通過？", "opts": [["A", "出席投票人數過半數同意"], ["B", "立法委員三分之二同意"], ["C", "有效同意票超過投票人數的半數"], ["D", "有效同意票超過選舉人總額的半數"]], "ans": "D", "exp": "依憲法增修條文，修憲複決須「有效同意票超過選舉人總額之半數」才通過，門檻極高，展現憲法的固定性。"}, {"stem": "憲法修正案經立法院決議提出後，依規定須先「公告」多久，才能交付選舉人複決？", "opts": [["A", "一個月"], ["B", "三個月"], ["C", "半年"], ["D", "一年"]], "ans": "C", "exp": "修憲案須公告半年，讓社會有充分時間討論後，再舉行複決投票。"}, {"stem": "民國111年，立法院通過「18歲公民權修憲案」並交付公民複決，最後結果為何？", "opts": [["A", "因有效同意票未達選舉人總額的半數而不通過"], ["B", "因立法院未三讀通過而作廢"], ["C", "順利通過，選舉權年齡已下修至18歲"], ["D", "因憲法法庭判決違憲而失效"]], "ans": "A", "exp": "這是我國史上第一次憲法修正案的公民複決，結果有效同意票未達選舉人總額的一半，因此不通過，選舉權年齡仍維持20歲。"}, {"stem": "修憲案要通過如此高的門檻，而一般法律只要立法院三讀通過、總統公布即可。這樣的差異最能凸顯憲法的哪一項特性？", "opts": [["A", "最高性"], ["B", "固定性"], ["C", "原則性"], ["D", "具體性"]], "ans": "B", "exp": "憲法修改程序比普通法律繁複許多，正是固定性（穩定性）的表現，目的在維持憲政秩序的穩定。"}, {"stem": "憲法常被稱為「人民權利的保障書」，主要理由為何？", "opts": [["A", "憲法條文最多，規定最詳細"], ["B", "憲法由人民親自撰寫並簽名"], ["C", "民主國家把人民的基本權利規定在憲法中，遭非法侵害時可請求救濟"], ["D", "憲法規定人民不必負擔任何義務"]], "ans": "C", "exp": "課本指出民主國家將人民的權利明定於憲法，當基本權利受政府或他人非法侵害時，人民可依法請求救濟，故稱人民權利的保障書。"}, {"stem": "我國憲法第7條規定：「中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。」這保障的是下列哪一項權利？", "opts": [["A", "自由權"], ["B", "受益權"], ["C", "參政權"], ["D", "平等權"]], "ans": "D", "exp": "憲法第7條是平等權的核心條文，指人民享有同等的權利、負擔相同的義務，國家不可任意差別對待。"}, {"stem": "考場規則原則上一視同仁，但視障考生依法可申請特殊考場並延長作答時間。這樣的做法應如何理解？", "opts": [["A", "違反平等權，因為考生待遇不同"], ["B", "屬於合理的差別待遇，是為保障處境不利群體"], ["C", "屬於自由權的行使"], ["D", "屬於參政權的範圍"]], "ans": "B", "exp": "平等不等於齊頭式的相同對待。政府為保障處境不利的群體，可依法給予 "stem": "下列關於「契約自由原則」的敘述，何者最為正確？", "opts": [["A", "契約內容完全不受任何限制"], ["B", "當事人可自行決定是否訂約、與誰訂約及訂約的內容與方式"], ["C", "只要契約已成立，任何一方都可以隨時反悔"], ["D", "未成年人也可以完全自由地訂定任何契約"]], "ans": "B", "exp": "契約自由原則基於尊重個人自由意思，讓當事人自行決定訂約與否、對象、內容與方式；但仍受法律與公序良俗限制，未成年人也另受行為能力規定的限制。"}, {"stem": "小明想與人簽訂一份「代為販賣違禁品」的契約。依民法規定，這份契約的效力為何？", "opts": [["A", "有效，因為雙方意思表示一致"], ["B", "有效，因為契約自由不受限制"], ["C", "有效，但要先向政府登記"], ["D", "無效，因為契約內容違反法律規定"]], "ans": "D", "exp": "契約自由並非毫無限制，契約內容不得違反法律規定、公共秩序或善良風俗，否則契約無效。"}, {"stem": "阿川在自家店門口的騎樓堆放大量貨物，阻礙行人通行，還說：「我在自己店門口堆東西是我的權利。」他的行為違反民法的哪一項原則？", "opts": [["A", "誠實信用原則"], ["B", "契約自由原則"], ["C", "禁止權利濫用"], ["D", "消滅時效"]], "ans": "C", "exp": "騎樓土地雖屬私人所有，但行使權利不得濫用而違反公共利益或損害他人權益，阻礙通行屬於權利濫用，應予禁止。"}, {"stem": "民法規定「消滅時效」，其意義為下列何者？", "opts": [["A", "權利人若超過一定時間不行使權利，權利會喪失或受到限制"], ["B", "契約簽訂滿一定時間後自動變成書面契約"], ["C", "未成年人滿一定年齡後自動取得完全行為能力"], ["D", "契約金額經過一定時間後會自動增加"]], "ans": "A", "exp": "消滅時效是指權利人在一定期間內不行使權利，該權利即喪失或受到限制，目的在使法律關係早日確定。"}, {"stem": "「法律不保障在權利上睡著的人」這句話，最能說明民法的哪一項規定？", "opts": [["A", "誠實信用原則"], ["B", "消滅時效"], ["C", "契約自由原則"], ["D", "禁止權利濫用"]], "ans": "B", "exp": "這句話正是消滅時效的精神：長期不主張自己的權利，權利就可能喪失或受限。"}, {"stem": "小妍借錢給小蓁後，一直到15年後才向小蓁追討。依民法消滅時效的規定，最可能出現下列何種結果？", "opts": [["A", "小蓁必須連本帶利加倍償還"], ["B", "小妍可以請求法院強制小蓁立刻還錢"], ["C", "契約自動轉為書面契約繼續有效"], ["D", "小蓁可以主張時效已過而拒絕還錢"]], "ans": "D", "exp": "一般而言借款請求返還的時效為15年，超過時效未行使權利，債務人可主張拒絕給付，這就是「法律不保障在權利上睡著的人」。"}, {"stem": "民法上所稱的「行為能力」，是指下列何者？", "opts": [["A", "一個人賺取金錢的能力"], ["B", "一個人負擔刑事責任的能力"], ["C", "一個人能獨立行使有效法律行為的能力"], ["D", "一個人參與選舉投票的能力"]], "ans": "C", "exp": "行為能力是指能否獨立從事在法律上有效的行為（如自己訂定契約），與經濟能力、刑事責任能力或參政權都不同。"}, {"stem": "民法主要依據哪些條件，將人的行為能力區分為三種？", "opts": [["A", "年齡以及精神、心智狀態"], ["B", "學歷以及工作經驗"], ["C", "財產多寡以及收入高低"], ["D", "性別以及居住地區"]], "ans": "A", "exp": "民法依「年齡」與「精神、心智狀態」把行為能力人分為無行為能力人、限制行為能力人、完全行為能力人三類。"}, {"stem": "今年6歲、就讀幼兒園大班的小安，在民法上屬於下列何種行為能力人？", "opts": [["A", "完全行為能力人"], ["B", "無行為能力人"], ["C", "限制行為能力人"], ["D", "受監護宣告人"]], "ans": "B", "exp": "未滿7歲的未成年人屬於無行為能力人，其法律行為無效，須由法定代理人代為行使。"}, {"stem": "小安（5歲）自己拿零用錢到玩具店買了一台500元的遙控車。依民法規定，這個買賣行為的效力為何？", "opts": [["A", "有效，因為屬於日常生活所必需"], ["B", "有效，因為雙方意思表示一致"], ["C", "效力未定，須經父母事後承認"], ["D", "無效，須由法定代理人代為行使才有效力"]], "ans": "D", "exp": "未滿7歲為無行為能力人，其法律行為一律「無效」，不是「效力未定」，必須由法定代理人代為行使才會產生效力。故店員會說「要請你爸媽來買才可以喔」。"}, {"stem": "一位因精神障礙而無法辨識自己意思、經法院作出監護宣告的成年人，在民法上屬於下列何者？", "opts": [["A", "完全行為能力人"], ["B", "限制行為能力人"], ["C", "無行為能力人"], ["D", "視情況由當事人自行選擇"]], "ans": "C", "exp": "受監護宣告的人與未滿7歲者同樣屬於無行為能力人，其法律行為無效，須由法定代理人代為行使。"}, {"stem": "依民法規定，「監護宣告」是由下列哪一個機關作出？", "opts": [["A", "法院"], ["B", "戶政事務所"], ["C", "地政事務所"], ["D", "衛生福利部"]], "ans": "A", "exp": "因精神障礙或其他心智缺陷而無法辨識其意思者，須由特定人向法院聲請，並由法院作出監護宣告。"}, {"stem": "今年14歲、就讀八年級的小南，在民法上屬於下列何種行為能力人？", "opts": [["A", "無行為能力人"], ["B", "限制行為能力人"], ["C", "完全行為能力人"], ["D", "受監護宣告人"]], "ans": "B", "exp": "7歲以上未滿18歲的未成年人屬於限制行為能力人，國中生大多屬於此類。"}, {"stem": "依民法規定，「限制行為能力人」的年齡範圍為下列何者？", "opts": [["A", "未滿7歲"], ["B", "7歲以上未滿16歲"], ["C", "12歲以上未滿18歲"], ["D", "7歲以上未滿18歲"]], "ans": "D", "exp": "行為能力的兩個年齡分界是7歲與18歲：未滿7歲為無行為能力人，7歲以上未滿18歲為限制行為能力人，年滿18歲為完全行為能力人。"}, {"stem": "限制行為能力人所做的法律行為，原則上必須符合下列何種條件才具有法律效力？", "opts": [["A", "須由法定代理人完全代為行使"], ["B", "須經過法院裁定同意"], ["C", "須經法定代理人事前允許或事後承認"], ["D", "只要當事人自己同意即可"]], "ans": "C", "exp": "限制行為能力人已有部分判斷能力，其行為「原則上」須經法定代理人事前允許或事後承認才有效，並非像無行為能力人那樣一律由法定代理人代為行使。"}, {"stem": "雖然限制行為能力人的行為原則上須經法定代理人同意，但有兩種例外情形不必取得同意也具效力，這兩種情形是下列何者？", "opts": [["A", "單純獲得法律上利益，以及依其年齡及身分、日常生活所必需的行為"], ["B", "金額在1000元以下，以及在學校內完成的行為"], ["C", "有同學陪同，以及事先通知導師的行為"], ["D", "使用自己打工所得，以及在網路上完成的行為"]], "ans": "A", "exp": "民法第77條的例外有二：純獲法律上利益（如領獎學金、接受贈禮），以及依其年齡及身分、日常生活所必需者（如買文具、搭公車）。"}, {"stem": "國二的小華獲得學校頒發的獎學金5000元，也收下了阿姨送的生日禮物。這些行為的效力為何？", "opts": [["A", "無效，因為小華是未成年人"], ["B", "有效，因為屬於單純獲得法律上利益"], ["C", "無效，須由法定代理人代為領取"], ["D", "效力未定，須父母事後承認"]], "ans": "B", "exp": "領獎學金、接受贈禮屬於「純獲法律上利益」的行為，限制行為能力人不必取得法定代理人同意，仍具法律效力。"}, {"stem": "國中生小康用零用錢到文具店買了一支筆，又刷了學生卡搭公車上學。媽媽事後主張「未成年交易無效」要求退貨。下列判斷何者正確？", "opts": [["A", "可以主張無效，因為小康未滿18歲"], ["B", "可以主張無效，因為小康沒有經過媽媽同意"], ["C", "可以主張無效，因為小康是無行為能力人"], ["D", "不可以主張無效，因為屬於依其年齡及身分、日常生活所必需的行為"]], "ans": "D", "exp": "買文具、搭公車符合國中生年齡與身分、屬日常生活所必需，不必取得法定代理人同意即具法律效力，家長不能事後主張無效。"}, {"stem": "16歲的小禾想在外租屋，自行前往找房東簽約。依民法規定，房東最正確的處理方式為下列何者？", "opts": [["A", "直接讓小禾簽約，因為租屋是日常生活所必需"], ["B", "拒絕出租，因為未成年人一律不得承租房屋"], ["C", "要求小禾提出父母的同意書，或請父母陪同簽約"], ["D", "讓小禾簽約，但租金要提高作為保障"]], "ans": "C", "exp": "16歲屬限制行為能力人，租屋契約金額較高、非日常生活所必需，須經法定代理人（父母）事前允許或事後承認才有效。"}, {"stem": "15歲的小美未經父母同意，自行向3C用品店訂購一台價值3萬元的筆記型電腦，並向店家強調「我有能力支付3萬元」。依民法規定，下列判斷何者最正確？", "opts": [["A", "契約效力未定，若父母不承認即無效，家長可要求退貨退款"], ["B", "契約有效，因為小美有能力支付價金"], ["C", "契約有效，因為3C用品屬於日常生活必需品"], ["D", "契約無效，因為小美是無行為能力人"]], "ans": "A", "exp": "15歲為限制行為能力人；高價3C用品在實務上多不被認定為日常生活必需品，也非純獲利益，故須法定代理人允許或承認，父母不同意時契約不生效力。小美本人有無支付能力並不影響判斷。"}, {"stem": "依民法規定，未成年子女的「法定代理人」通常是下列何者？", "opts": [["A", "學校的導師"], ["B", "父母"], ["C", "里長"], ["D", "法院指定的檢察官"]], "ans": "B", "exp": "民法規定父母為其未成年子女的法定代理人，負責代為或同意其法律行為。"}, {"stem": "年滿18歲且未受監護宣告的人，在民法上屬於下列何者？", "opts": [["A", "完全行為能力人"], ["B", "限制行為能力人"], ["C", "無行為能力人"], ["D", "須視是否已就業而定"]], "ans": "A", "exp": "年滿18歲的成年人且精神狀態健全者，屬完全行為能力人，其法律行為具完全效力。"}, {"stem": "22歲的艾莎自行與房東簽訂租屋契約。此契約的效力為何？", "opts": [["A", "無效，須父母陪同才有效"], ["B", "效力未定，須父母事後承認"], ["C", "有效，艾莎為完全行為能力人可獨立訂約"], ["D", "無效，租屋契約一律須經法院公證"]], "ans": "C", "exp": "22歲已成年，屬完全行為能力人，可獨立從事有效的法律行為，自行簽訂租屋契約完全有效。"}, {"stem": "關於「完全行為能力人」的敘述，下列何者正確？", "opts": [["A", "其法律行為須經配偶同意才有效"], ["B", "其法律行為一律無效"], ["C", "其法律行為須由法定代理人代為行使"], ["D", "可獨立從事有效的法律行為，並自行承擔契約上的權利義務"]], "ans": "D", "exp": "完全行為能力人的行為在法律上具完全效力，可自行訂約並須履行契約義務，若不履行則須負相應的法律責任。"}, {"stem": "關於民法上行為能力的年齡分界，下列敘述何者完全正確？", "opts": [["A", "未滿7歲為無行為能力人；7歲以上未滿18歲為限制行為能力人；年滿18歲為完全行為能力人"], ["B", "未滿7歲為限制行為能力人；7歲以上未滿20歲為無行為能力人；年滿20歲為完全行為能力人"], ["C", "未滿12歲為無行為能力人；12歲以上未滿18歲為限制行為能力人；年滿18歲為完全行為能力人"], ["D", "未滿7歲為無行為能力人；7歲以上未滿20歲為限制行為能力人；年滿20歲為完全行為能力人"]], "ans": "A", "exp": "我國民法成年年齡已修正為18歲。行為能力的兩條界線是7歲與18歲，須牢記：未滿7歲（無效）、7歲以上未滿18歲（須法定代理人允許或承認）、年滿18歲（完全有效）。"}, {"stem": "民法對未成年人及受監護宣告者的法律行為加以限制，最主要的用意為下列何者？", "opts": [["A", "減少政府處理民事案件的負擔"], ["B", "避免未成年人取得任何財產"], ["C", "保護判斷能力或社會經驗不足者的權益"], ["D", "讓商家可以自由決定要不要交易"]], "ans": "C", "exp": "未成年人與受監護宣告者因判斷能力或社會經驗不足，民法限制其法律行為，是為了保護他們的權益，避免因判斷失誤而受到不利影響。"}, {"stem": "依民法規定，下列何者屬於「侵權行為」的定義？", "opts": [["A", "未依約定的時間交付商品"], ["B", "未在時效內請求返還借款"], ["C", "未簽訂書面契約即進行交易"], ["D", "因故意或過失，不法侵害他人的財物、身體健康等權益"]], "ans": "D", "exp": "侵權行為指因故意或過失損害他人財物、傷害他人身體健康等，須負損害賠償責任；（A）屬債務不履行，（B）涉及消滅時效，（C）不影響一般契約成立。"}, {"stem": "油漆工人在工作時不小心踢倒油漆桶，弄髒了鄰居的牆面。就民法而言，這位工人的心態應屬下列何者？", "opts": [["A", "故意"], ["B", "過失"], ["C", "正當防衛"], ["D", "緊急避難"]], "ans": "B", "exp": "過失是指行為人應注意、能注意卻未注意，在疏忽情況下使意外結果發生；若是明知並有意使結果發生（如故意在牆上塗鴉），則屬故意。"}, {"stem": "民法規定侵權行為人須負「損害賠償責任」，其主要用意為下列何者？", "opts": [["A", "彌補被害人所受的損失"], ["B", "懲罰加害人使其得到報應"], ["C", "增加國家的財政收入"], ["D", "剝奪加害人的行為能力"]], "ans": "A", "exp": "損害賠償的目的不在懲罰加害人（懲罰是刑法的功能），而在填補被害人的損失，使其回復原有狀態。"}, {"stem": "依民法規定，損害賠償的方式應優先採取下列何者？", "opts": [["A", "以金錢賠償為原則，例外才回復原狀"], ["B", "由被害人自行選擇是否要求道歉"], ["C", "以回復原狀為原則，無法回復原狀時才以金錢賠償替代"], ["D", "一律由法院決定加害人應服勞役的時數"]], "ans": "C", "exp": "損害賠償以「回復原狀」為原則，若無法回復原狀，才以金錢賠償替代。"}, {"stem": "阿明打球時不慎打破鄰居的玻璃窗。依民法損害賠償的原則，他最應優先採取的做法為下列何者？", "opts": [["A", "等鄰居向法院起訴後再處理"], ["B", "直接付一筆錢給鄰居，不必修復"], ["C", "向鄰居道歉即可，不須負任何責任"], ["D", "負責把玻璃窗修復，回復成原來的樣子"]], "ans": "D", "exp": "損害賠償以回復原狀為原則，玻璃窗可以修復，因此應先修復；若損害無法回復原狀時，才改以金錢賠償。"}, {"stem": "契約訂定後，若當事人一方未履行契約內容，這在民法上稱為下列何者？", "opts": [["A", "權利濫用"], ["B", "侵權行為"], ["C", "消滅時效"], ["D", "債務不履行"]], "ans": "D", "exp": "契約成立後未依約履行義務即為「債務不履行」，與因故意過失侵害他人權益的「侵權行為」不同。"}, {"stem": "小華向網路賣家下單並付款後，賣家遲遲不依約定出貨。賣家的行為屬於下列何者？", "opts": [["A", "權利濫用"], ["B", "侵權行為"], ["C", "債務不履行"], ["D", "契約自始無效"]], "ans": "C", "exp": "買賣契約成立後，賣方不依約定交貨或買方不依約定付款，都屬於債務不履行。"}, {"stem": "當一方發生債務不履行時，權利受損的另一方依民法規定可以主張下列何種救濟？", "opts": [["A", "要求對方入獄服刑"], ["B", "要求解除契約、減少價金或請求損害賠償"], ["C", "要求撤銷對方的行為能力"], ["D", "自行取走對方等值的財物抵債"]], "ans": "B", "exp": "債務不履行時，權利受損的一方可以要求解除契約、減少價金或請求損害賠償。入獄服刑屬刑事責任，自行取走他人財物則可能另構成違法行為。"}];

  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "小禾從小學會用餐前要洗手、在公車上要讓座、上課要舉手發言。課本把這種「個人學習各種知識、技能與規範，表現出符合社會期待的合宜行為」的過程稱為什麼？", "opts": [["A", "社會變遷"], ["B", "社會福利"], ["C", "社會化"], ["D", "社會規範"]], "ans": "C", "exp": "社會化是指個人學習知識、技能與規範，表現出符合社會期待之合宜行為的過程。人不能離群獨居，必須透過社會化融入社會生活。"}, {"stem": "下列關於「社會化」的敘述，何者最正確？", "opts": [["A", "社會化是終身持續進行的過程，不會在某個年齡結束"], ["B", "社會化只在幼兒時期進行，長大成人後就停止"], ["C", "社會化是由政府強制規定人民必須接受的訓練"], ["D", "社會化只能透過學校的正式課程才能完成"]], "ans": "A", "exp": "人在一生中不斷接觸新的群體與環境，必須持續學習新的知識、技能與規範，因此社會化是終身的歷程，而非只發生在童年，也不限於學校一種途徑。"}, {"stem": "課本提到社會化的主要途徑包括家庭、學校、同儕團體與傳播媒體。其中「個人最早接觸的社會組織，家人的言行舉止與生活習慣對個人產生潛移默化的影響，是建立人格的重要途徑」，指的是哪一項？", "opts": [["A", "學校"], ["B", "同儕團體"], ["C", "傳播媒體"], ["D", "家庭"]], "ans": "D", "exp": "家庭是個人最早接觸的社會組織，家人的言行舉止與生活習慣對個人具有潛移默化的影響，是建立人格最重要的途徑。"}, {"stem": "「小美因為班上同學都在做資源回收，自己也跟著養成隨手分類的習慣。」這最能說明哪一種社會化途徑的影響力？", "opts": [["A", "家庭"], ["B", "同儕團體"], ["C", "傳播媒體"], ["D", "政府機關"]], "ans": "B", "exp": "同儕之間因年齡、生活經驗相近，容易形成認同感，因而彼此影響言行舉止。小美受班上同學影響而改變行為，屬於同儕團體的社會化作用。"}, {"stem": "課本提到某一社會化途徑「透過有系統的課程，讓個人學習社會期許的行為準則與價值規範，同時協助個人發展潛能，培養適應生活的能力」。這指的是下列何者？", "opts": [["A", "學校"], ["B", "家庭"], ["C", "同儕團體"], ["D", "傳播媒體"]], "ans": "A", "exp": "學校透過有系統、有計畫的課程，教導學生知識與價值規範，並協助其發展潛能、培養適應社會生活的能力。"}, {"stem": "阿賢每天看新聞台報導海洋汙染的專題，漸漸養成減塑、自備環保杯的習慣。這屬於下列哪一種社會化途徑？", "opts": [["A", "家庭"], ["B", "學校"], ["C", "傳播媒體"], ["D", "同儕團體"]], "ans": "C", "exp": "電視、報紙、網路等傳播媒體提供各種資訊，會在無形中影響個人的價值觀與行為，屬於重要的社會化途徑。"}, {"stem": "下列哪一個例子「不屬於」社會化的表現？", "opts": [["A", "小華跟著媽媽學會用餐時不可大聲喧嘩"], ["B", "小明打噴嚏時反射性地閉上眼睛"], ["C", "小玉在學校學會排隊等候的規矩"], ["D", "小安受朋友影響開始關心動物保育議題"]], "ans": "B", "exp": "打噴嚏閉眼是與生俱來的生理反射，不需要透過學習；其餘三項都是經由家庭、學校或同儕「學習」而來的行為，才屬於社會化。"}, {"stem": "課本強調「人不能離群獨居」，因此必須透過社會化融入社會生活。這句話最主要說明的是：", "opts": [["A", "個人的能力必然勝過群體的力量"], ["B", "政府應該限制人民的自由以維持秩序"], ["C", "每個人都應該完全放棄自己的想法"], ["D", "個人必須學習社會的規範才能與他人共同生活"]], "ans": "D", "exp": "人是群居的，必須學會社會共同的知識、技能與規範，才能被群體接納並順利與他人互動，這正是社會化的意義。"}, {"stem": "下列關於社會化四種途徑的配對，何者「錯誤」？", "opts": [["A", "傳播媒體──個人最早接觸、對人格影響最深的社會組織"], ["B", "家庭──家人言行舉止具潛移默化的影響"], ["C", "學校──透過系統課程學習社會期許的行為準則"], ["D", "同儕團體──年齡與生活經驗相近，容易形成認同感"]], "ans": "A", "exp": "「個人最早接觸、對人格影響最深的社會組織」是家庭，不是傳播媒體。傳播媒體是透過資訊在無形中影響個人價值觀。"}, {"stem": "課本將「與眾人權益有關的事務，如規畫公共設施、擬定規範制度」稱為什麼？", "opts": [["A", "私人事務"], ["B", "社會福利"], ["C", "公共事務"], ["D", "社會規範"]], "ans": "C", "exp": "公共事務是指與眾人權益有關的事務，例如公共設施的規畫、規範制度的擬定等，因為涉及群體成員的利益分配與權利保障。"}, {"stem": "下列何者屬於「公共事務」？", "opts": [["A", "阿明決定今晚要吃牛肉麵還是水餃"], ["B", "小芳挑選自己房間窗簾的顏色"], ["C", "大雄把自家陽臺的盆栽移到向陽處"], ["D", "社區住戶討論中庭盆栽該如何規畫擺置"]], "ans": "D", "exp": "自家陽臺盆栽如何擺放屬於私人事務；社區中庭盆栽的規畫涉及全體社區居民的生活，屬於公共事務。判斷關鍵在於是否「涉及眾人權益」。"}, {"stem": "判斷一件事情是「公共事務」還是「私人事務」，最主要的依據是下列何者？", "opts": [["A", "花費金額的多寡"], ["B", "是否涉及眾人的權益"], ["C", "參與人數是否超過十人"], ["D", "是否由政府出面主辦"]], "ans": "B", "exp": "公共事務的核心特徵是「涉及與眾人有關的權益」，與花費多寡、人數多少或是否由政府主辦無必然關係。"}, {"stem": "課本指出，如果社會成員對公共事務漠不關心，最可能造成下列哪一種結果？", "opts": [["A", "可能讓少數人決定公共事務的發展方向，且因缺乏監督使資源分配不公"], ["B", "政府會因此自動提高服務品質，讓決策更符合眾人需求"], ["C", "決策速度變慢，但決策品質必定會提升"], ["D", "公共事務會自動消失，社會不再需要制度"]], "ans": "A", "exp": "成員若漠不關心，公共事務可能由少數人決定，也可能因缺乏監督而影響成員權益，或使資源分配不公，這正是課本強調應主動參與的理由。"}, {"stem": "課本提到「參與公共事務並非強加於社會成員的負擔，而是對社會成員的保障」。這句話的意思最接近下列何者？", "opts": [["A", "參與公共事務是法律規定的義務，不參加會被處罰"], ["B", "只有政治人物才需要參與公共事務"], ["C", "參與公共事務能維護自身權益，也讓決策貼近成員需求"], ["D", "參與公共事務只是形式，不會影響決策結果"]], "ans": "C", "exp": "積極關心與了解公共事務，不僅可以維護自身權益，也能讓決策者做決定時兼顧與貼近成員的需求，因此是保障而非負擔。"}, {"stem": "社區住戶要求管理委員會公布施工進度與經費資料。這項行動最主要發揮了下列哪一種功能？", "opts": [["A", "增加社區的施工經費"], ["B", "進行監督以避免弊端"], ["C", "減少住戶的管理費負擔"], ["D", "取代管委會行使決策權"]], "ans": "B", "exp": "要求公布進度與經費，屬於成員對公共事務的監督，可防止少數人操弄或發生弊端，是參與公共事務的重要方式。"}, {"stem": "下列哪一項「不是」課本所說「積極參與公共事務」的好處？", "opts": [["A", "維護群體成員的權益"], ["B", "讓決策貼近群體成員的需求"], ["C", "進行監督以防止少數人操弄"], ["D", "保證每個人的意見都會被完全採納"]], "ans": "D", "exp": "公共事務需要透過討論與溝通形成共識，不可能每個人的意見都被完全採納；(A)(B)(C) 才是課本列出的參與效益。"}, {"stem": "在公聽會上，大家對停車場的設計提出不同看法，最後主辦單位表示「感謝各位出席和發言，讓設計更符合使用需求」。這個例子最能說明參與公共事務的哪一項價值？", "opts": [["A", "可以避免政府花費任何經費"], ["B", "可以讓少數人快速做出決定"], ["C", "可以讓決策更貼近成員的實際需求"], ["D", "可以取代法律的規範功能"]], "ans": "C", "exp": "成員發言表達需求後，決策者能兼顧並貼近成員需求，使公共政策更符合實際使用情形，這是參與公共事務的重要效益。"}, {"stem": "課本指出「國民」是指下列何者？", "opts": [["A", "具備一國國籍的人民"], ["B", "年滿20歲並具有選舉權的人"], ["C", "在一國境內居住超過五年的外國人"], ["D", "已完成國民教育的所有居民"]], "ans": "A", "exp": "國民是指具備一國國籍的人民。我國憲法規定「具有中華民國國籍者為中華民國國民」，與年齡、居住年限或學歷無關。"}, {"stem": "「以父母親的國籍為準，出生時父或母具該國國籍，即為該國國民。」這是取得國籍的哪一種原則？", "opts": [["A", "屬地主義"], ["B", "屬人主義"], ["C", "歸化"], ["D", "收養"]], "ans": "B", "exp": "屬人主義又稱血統主義，以父母的國籍為判斷依據；屬地主義（出生地主義）則以出生地為準。我國國籍法採屬人主義為主、屬地主義為輔。"}, {"stem": "有關我國國籍取得原則的敘述，下列何者正確？", "opts": [["A", "完全採屬地主義，凡在我國出生者一律取得我國國籍"], ["B", "完全採屬人主義，不承認任何其他取得方式"], ["C", "以屬地主義為主、屬人主義為輔"], ["D", "以屬人主義為主、屬地主義為輔"]], "ans": "D", "exp": "我國國籍法採取「屬人主義為主，屬地主義為輔」，並另有「歸化」作為出生以外取得國籍的方式。"}, {"stem": "來自土耳其的藝人吳鳳，經由申請程序取得我國國籍，成為中華民國國民。他取得國籍的方式屬於下列何者？", "opts": [["A", "屬人主義"], ["B", "屬地主義"], ["C", "歸化"], ["D", "收養未成年子女"]], "ans": "C", "exp": "歸化是指因出生以外的原因（如婚姻、收養、長期居留、投資等），透過申請並經政府核可而取得該國國籍。"}, {"stem": "下列關於「廣義公民」與「狹義公民」的敘述，何者正確？", "opts": [["A", "廣義公民指民主國家的全體國民；狹義公民指具備法定資格能行使參政權的國民"], ["B", "廣義公民指年滿18歲者；狹義公民指年滿20歲者"], ["C", "廣義公民指在國內居住者；狹義公民指在國外居住者"], ["D", "廣義公民與狹義公民的範圍完全相同，只是稱呼不同"]], "ans": "A", "exp": "廣義的公民是民主國家中的全體國民；狹義的公民則指具備法定資格、能行使參政權的國民，範圍較小。"}, {"stem": "依課本內容，我國國民年滿幾歲有選舉、罷免權？", "opts": [["A", "年滿16歲"], ["B", "年滿17歲"], ["C", "年滿18歲"], ["D", "年滿20歲"]], "ans": "D", "exp": "依據憲法規定，中華民國國民年滿20歲有依法選舉之權，亦有罷免權；公民投票權則依公民投票法為年滿18歲。"}, {"stem": "依課本內容，下列哪一項權利，我國國民年滿18歲即可行使？", "opts": [["A", "選舉權"], ["B", "公民投票權"], ["C", "罷免權"], ["D", "以上皆須年滿20歲"]], "ans": "B", "exp": "依公民投票法，國民年滿18歲有公民投票權，可落實創制、複決權；選舉、罷免權依憲法為年滿20歲。"}, {"stem": "小豪今年17歲，是本國籍國中生。依課本內容判斷，下列何者是他「目前可以做」的？", "opts": [["A", "投票選出里長"], ["B", "參加公民投票"], ["C", "對校園安全問題向學校表達意見"], ["D", "連署罷免地方民意代表"]], "ans": "C", "exp": "社會成員對公共事務都有表達意見的權利；但若要透過選舉、罷免或公民投票參與，則須具備狹義公民身分（符合法定年齡等資格）。"}, {"stem": "「社會成員都能表達意見，但只有具備狹義公民身分者才能投票。」這句話最主要說明下列何者？", "opts": [["A", "身分不同會影響可參與公共事務的方式與範圍"], ["B", "只有公民才需要關心公共事務"], ["C", "表達意見的權利只屬於成年人"], ["D", "投票是唯一有效的社會參與方式"]], "ans": "A", "exp": "社會中的成員因身分不同，可參與的公共事務也有差異；人人均可關心與表達意見，但行使參政權須具備法定資格。"}, {"stem": "在臺工作的外籍移工阿蒂，與我國國民相比，下列敘述何者正 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "課本指出，民眾透過報紙、雜誌、電視、廣播和社群網路等管道接收來自全球的資訊，這些管道被統稱為什麼？", "opts": [["A", "輿論"], ["B", "媒體"], ["C", "閱聽人"], ["D", "公共意見"]], "ans": "B", "exp": "傳遞資訊給大眾的各種管道（報紙、雜誌、電視、廣播、網路等）統稱為「媒體」；接收資訊的人才叫「閱聽人」。"}, {"stem": "下列何者最符合課本對「閱聽人」的定義？", "opts": [["A", "專門製作新聞節目的記者與編輯"], ["B", "負責管理媒體的政府主管機關"], ["C", "接收媒體資訊的讀者、聽眾與觀眾"], ["D", "在媒體上刊登廣告的廠商"]], "ans": "C", "exp": "閱聽人指的是接收媒體訊息的「讀者、聽眾與觀眾」，也就是一般收看、收聽、閱讀媒體內容的民眾。"}, {"stem": "在公共議題的討論過程中，媒體因為能匯集公共意見、監督政府，被視為獨立於行政、立法、司法之外的什麼？", "opts": [["A", "第四權"], ["B", "第五權"], ["C", "考試權"], ["D", "監察權"]], "ans": "A", "exp": "媒體被稱為「第四權」，代表它是行政、立法、司法三權之外，具有監督政府、匯集民意功能的重要力量。"}, {"stem": "媒體大幅揭露「黑心油品事件」的發展經過、政府處理進度，以及哪些廠商使用到問題原料。這最符合媒體公共角色中的哪一項？", "opts": [["A", "促成討論、形成民意"], ["B", "設定議題、引導關注"], ["C", "監督媒體、要求自律"], ["D", "報導事實、提供訊息"]], "ans": "D", "exp": "把事件經過、處理進度等客觀事實傳達給民眾，屬於「報導事實、提供訊息」這一階段的角色。"}, {"stem": "某電視臺以頭條、連續一週專題方式反覆報導「校園霸凌」，使該議題成為社會關注焦點。這展現媒體的哪一種公共角色？", "opts": [["A", "報導事實、提供訊息"], ["B", "設定議題、引導關注"], ["C", "促成討論、形成民意"], ["D", "提供娛樂、休閒放鬆"]], "ans": "B", "exp": "媒體透過版面大小、報導次數多寡決定新聞的強度，引領民眾把注意力放在特定議題上，這就是「議題設定」。"}, {"stem": "某新聞網站在報導下方開放留言區，並製作線上投票，讓贊成與反對的民眾互相討論，最後凝聚出社會的共識。這屬於媒體公共角色的哪一項？", "opts": [["A", "促成討論、形成民意"], ["B", "報導事實、提供訊息"], ["C", "設定議題、引導關注"], ["D", "置入性行銷"]], "ans": "A", "exp": "媒體提供各種管道與平臺，讓不同立場的輿論相互討論、凝聚共識，屬於「促成討論、形成民意」。"}, {"stem": "依課本說明，公共意見形成的過程中，媒體扮演角色的順序，下列何者最正確？", "opts": [["A", "設定議題→報導事實→形成民意"], ["B", "形成民意→報導事實→設定議題"], ["C", "報導事實提供訊息→設定議題引導關注→促成討論形成民意"], ["D", "促成討論→報導事實→引導關注"]], "ans": "C", "exp": "媒體先把事實報導出來讓民眾知道，再透過報導強度引導關注，最後提供討論平臺凝聚共識形成民意。"}, {"stem": "下列何者「不是」課本所提到媒體具備的功能？", "opts": [["A", "提供訊息"], ["B", "監督政府"], ["C", "教育文化與休閒娛樂"], ["D", "直接制定並執行公共政策"]], "ans": "D", "exp": "制定與執行公共政策是政府（行政、立法機關）的職權，媒體只能報導、監督與匯集民意，不能取代政府行使公權力。"}, {"stem": "課本提到，媒體與社群網路已成為人民與政府之間互動的「橋梁」。下列敘述何者最能說明這句話？", "opts": [["A", "政府透過社群網路宣導政策，民眾也在平臺上表達意見供政府參考"], ["B", "政府可以規定媒體只能報導對政府有利的新聞"], ["C", "媒體取代政府成為公共政策的最後決定者"], ["D", "民眾必須親自到政府機關才能表達意見"]], "ans": "A", "exp": "「橋梁」是雙向的：政府藉媒體與社群網路傳達政策、了解民意，民眾也藉此表達看法影響施政。"}, {"stem": "課本對「社群網路」的定義，下列敘述何者最正確？", "opts": [["A", "政府為推動政策而設立的官方新聞頻道"], ["B", "專門販售商品、提供金流服務的購物網站"], ["C", "存在於網際網路上，讓成員在虛擬聊天室、論壇自由創作、分享與交流意見的討論平臺"], ["D", "由電視臺經營、只能單向播送節目的有線頻道"]], "ans": "C", "exp": "社群網路的核心是「網際網路上供成員自由交流、分享意見與經驗的虛擬討論平臺」，具有雙向互動的性質。"}, {"stem": "相較於傳統的報紙與電視，社群網路最明顯的特性是下列何者？", "opts": [["A", "只能單向接收訊息，閱聽人無法回應"], ["B", "訊息可雙向傳遞，能打破時間與空間的限制"], ["C", "所有內容都經過嚴格查證，正確性最高"], ["D", "只有取得執照的專業記者才能發表內容"]], "ans": "B", "exp": "社群網路無區域限制、能即時雙向傳遞訊息，是它和傳統媒體最大的差異；但也因人人可發言，內容未必經過查證。"}, {"stem": "小禾的媽媽從 LINE 群組收到「亞馬孫雨林大火」的照片，馬上想轉傳給國外的朋友。這個例子最能說明社群網路的什麼特性？", "opts": [["A", "內容全部經過事實查核"], ["B", "只能在特定時間收看"], ["C", "傳播對象僅限本國民眾"], ["D", "傳播速度快、範圍廣，訊息容易被大量轉傳"]], "ans": "D", "exp": "社群網路的高度傳播力使訊息瞬間擴散，因此若未查證就轉傳，假訊息也會跟著快速蔓延。"}, {"stem": "阿宏用手機拍下住家附近河川遭工廠排放廢水的畫面，剪輯成影片上傳網路，引起社會關注這個被主流媒體忽略的問題。阿宏的角色最接近下列何者？", "opts": [["A", "公民記者"], ["B", "置入性行銷業者"], ["C", "內容農場經營者"], ["D", "媒體主管機關"]], "ans": "A", "exp": "閱聽人從被動的接收者變成主動的資訊提供者，主動報導主流媒體忽略的主題，就是「公民記者」的崛起。"}, {"stem": "我國行政院國家發展委員會設置的「公共政策網路參與平臺」，讓民眾可以線上提案、附議，作為政府施政參考。這屬於社群網路對公共參與影響中的哪一項？", "opts": [["A", "公民記者崛起"], ["B", "置入性行銷普及"], ["C", "公共政策參與平臺的建置"], ["D", "媒體自律機制的建立"]], "ans": "C", "exp": "政府建置線上平臺讓民眾提案、討論公共議題，屬於「公共政策參與平臺建置」，使民意可直接進入政策形成過程。"}, {"stem": "瑞典女孩桑柏格（Greta Thunberg）發起「週五拚未來」抗議氣候變遷的罷課活動，透過媒體與網路吸引全球數萬名學生響應，臺灣學生也在社群網路上串聯。這個例子最能說明什麼？", "opts": [["A", "媒體具有置入性行銷的商業考量"], ["B", "網路號召與串聯社會運動，打破時空限制"], ["C", "媒體報導必然存在隱藏的歧視"], ["D", "政府透過網路限制人民集會結社"]], "ans": "B", "exp": "過去參與社會運動須親自到場，如今透過社群網路即可跨國串聯號召，任何想為議題發聲的人都能參與。"}, {"stem": "關於社群網路對公共參與的影響，下列敘述何者「錯誤」？", "opts": [["A", "使人民參與社會的機會變得容易且多樣化"], ["B", "閱聽人可從被動接收者變成主動提供者"], ["C", "可打破時空限制進行串聯與號召"], ["D", "因為人人可發言，所以網路上的訊息都不必再查證"]], "ans": "D", "exp": "正因為人人都能發言、缺乏守門機制，網路訊息更需要查證；「不必查證」的說法完全違背媒體識讀的精神。"}, {"stem": "有民眾在網路上發起連署「廢除博愛座設置」，引發社會廣泛討論。這個現象最能反映下列何者？", "opts": [["A", "社群網路降低公共參與的門檻，使議題容易被提出與討論"], ["B", "網路連署的結果具有法律強制力，政府必須照辦"], ["C", "只有立法委員才能提出公共議題"], ["D", "社群網路上的議題都不會受到主流媒體注意"]], "ans": "A", "exp": "網路連署讓一般民眾也能發起議題、匯集支持者，降低參與門檻；但連署本身是民意表達，並無法律強制力。"}, {"stem": "課本提醒，社群網路的興起雖使討論更方便，但使用時仍需小心，主要是要避免下列何種情形？", "opts": [["A", "政府依法公開政策資訊"], ["B", "被有心人士透過大量留言「帶風向」，影響我們對事情的看法"], ["C", "民眾使用事實查核平臺查證訊息"], ["D", "媒體提供多元立場的報導"]], "ans": "B", "exp": "有心人士可能透過操作網路留言製造特定輿論，使閱聽人誤以為那就是多數民意，因此需保持思辨與查證能力。"}, {"stem": "「媒體識讀」的意義，下列何者最正確？", "opts": [["A", "具備操作攝影機與剪輯軟體的技術能力"], ["B", "能背誦各家媒體的創辦人與經營者名單"], ["C", "認識和解讀媒體的能力，能了解訊息來源與目的並加以判斷"], ["D", "完全拒絕接收任何媒體訊息以免受騙"]], "ans": "C", "exp": "媒體識讀強調的是「自主思辨」——認識媒體運作、判斷訊息來源與目的、解讀內容，而不是拒看媒體或學技術。"}, {"stem": "課本指出閱聽人必須覺察的媒體現象，「不」包含下列何者？", "opts": [["A", "媒體報導未必反映事實"], ["B", "媒體報導有特定立場"], ["C", "媒體內容存在隱藏的歧視"], ["D", "媒體報導必定完整呈現所有觀點"]], "ans": "D", "exp": "每天的新聞極多，媒體不可能全面報導所有事件與觀點；「必定完整呈現」正好與課本要提醒的現象相反。"}, {"stem": "某新聞為搶獨家，未經查證即報導「火車座位皆設有安全帶」，事後被指出與事實不符。這屬於下列哪一種媒體現象？", "opts": [["A", "媒體報導未必反映事實"], ["B", "媒體內容存在隱藏歧視"], ["C", "媒體行使第四權監督政府"], ["D", "閱聽人行使媒體接近使用權"]], "ans": "A", "exp": "媒體為求快速與獨家而未善盡查證之責，造成錯誤報導，屬於「報導未必反映事實」。"}, {"stem": "「置入性行銷」的意思，下列何者最正確？", "opts": [["A", "媒體公開刊登廣告並清楚標示為廣告"], ["B", "閱聽人主動撰稿投書媒體推薦商品"], ["C", "媒體將想推銷的商品以聲音、視覺等設計融入訊息中，不知不覺影響閱聽人的消費行為"], ["D", "政府強制媒體播放公益宣導短片"]], "ans": "C", "exp": "置入性行銷的關鍵在於「隱藏」——把商品藏進節目或報導內容中，讓閱聽人在不知不覺中受到影響。"}, {"stem": "某談話性節目在討論健康議題時，主持人反覆提到特定品牌的保健食品，觀眾看完後紛紛去購買。這最可能是下列何者？", "opts": [["A", "媒體行使第四權"], ["B", "置入性行銷"], ["C", "媒體接近使用權"], ["D", "公民記者報導"]], "ans": "B", "exp": "媒體為追求廣告收益，把商品訊息設計融入節目內容中影響消費行為，即為置入性行銷。"}, {"stem": "某媒體只擷取支持罷工民眾發言中的片段，讓閱聽人誤以為該民眾反對罷工。這屬於下列哪一種媒體現象？", "opts": [["A", "媒體報導有特定立場，透過內容選擇刻意「帶風向」"], ["B", "媒體充分行使報導事實的功能"], ["C", "閱聽人行使更正權"], ["D", "媒體善盡查證責任"]], "ans": "A", "exp": "媒體基於自身立場或商業考量，透過剪輯、內容篩選引導輿論方向，使不同意見無法被公平呈現。"}, {"stem": "媒體以誇大標題報導特定宗教的負面新聞，使閱聽人逐漸對該宗教信仰產生偏見。這屬於下列哪一種媒體現象？", "opts": [["A", "媒體行使第四權監督政府"], ["B", "閱聽人行使媒體接近使用權"], ["C", "媒體促成討論形成民意"], ["D", "媒體內容存在隱藏的歧視"]], "ans": "D", "exp": "媒體可能在報導中不自覺加入主觀想法，強化對性別、族群、宗教或階級的刻板印象、偏見與歧視。"}, {"stem": "娛樂新聞不斷報導明星的極端瘦身方式，並強調「身材纖細才是美」，導致部分民眾刻意節食影響健康。這個例子最能說明什麼？", "opts": [["A", "媒體行使媒體接近使用權"], ["B", "媒體內容中的刻板印象會影響閱聽人的價值判斷"], ["C", "媒體已善盡查證責任"], ["D", "這屬於政府的置入性行銷"]], "ans": "B", "exp": "媒  "假訊息的傳播速度一定比真實訊息慢"]], "ans": "A", "exp": "假訊息強調「故意」虛構或扭曲並意圖影響他人認知；謠言自古即有，只是網路使其大量產製；且經設計的假訊息往往傳得比真訊息更快。"}, {"stem": "閱聽人發現報導不實而要求媒體刊登更正啟事，屬於媒體接近使用權中的哪一項？", "opts": [["A", "使用權"], ["B", "著作權"], ["C", "更正權"], ["D", "隱私權"]], "ans": "C", "exp": "接近權包含「更正權」（訂正不實報導）與「答辯權」（回應不公平說法）；自行產製內容供媒體刊播則屬「使用權」。"}, {"stem": "社區居民不滿主流媒體長期忽略河川汙染問題，於是自行撰寫報導向報社投稿，揭露這件事。這屬於媒體接近使用權中的哪一項？", "opts": [["A", "更正權"], ["B", "使用權"], ["C", "答辯權"], ["D", "隱私權"]], "ans": "B", "exp": "使用權是指閱聽人能自行撰寫內容或製作節目提供媒體刊登、播放的權利，把自己的聲音送進媒體。"}, {"stem": "關於「媒體接近使用權」，下列敘述何者「錯誤」？", "opts": [["A", "閱聽人可要求媒體更正錯誤或不公允的報導"], ["B", "閱聽人可自行產製優良內容並透過媒體與他人分享"], ["C", "行使此權利有助於閱聽人從被動接收者成為主動參與者"], ["D", "閱聽人可以要求媒體只報導對自己有利的新聞"]], "ans": "D", "exp": "媒體接近使用權是為了矯正錯誤、平衡意見並讓多元聲音被聽見，不是讓任何人操控媒體只報導對自己有利的內容。"}, {"stem": "閱聽人以「疑、想、查、問、戳」查核資訊正確性，避免假新聞瘋傳造成恐慌。這是以何種方式監督媒體？", "opts": [["A", "政府監督"], ["B", "利益團體監督"], ["C", "公民監督"], ["D", "媒體自我監督"]], "ans": "C", "exp": "閱聽人（一般民眾）自主查證、檢舉、要求更正，屬於「公民監督」；由媒體業者自訂規範約束自己才是媒體自律。"}, {"stem": "在社群網路上發表言論時，下列哪一項行為最可能觸犯刑法妨害名譽罪，並須負民事賠償責任？", "opts": [["A", "在留言區以不實內容辱罵、造謠攻擊特定他人"], ["B", "針對政府政策提出具體且有依據的批評"], ["C", "分享事實查核中心的查核報告"], ["D", "在平臺上附議自己認同的公共政策提案"]], "ans": "A", "exp": "在網路上辱罵他人或散布不實內容損害他人名譽，可能構成刑法妨害名譽罪，並須負民事損害賠償責任。"}, {"stem": "手機遊戲要求玩家授權使用 GPS 定位、相機與儲存空間，玩家等於同意將個人資料回傳給遊戲公司。這種情形最直接衍生下列何種問題？", "opts": [["A", "網路詐騙集團一定會被繩之以法"], ["B", "資訊內容真偽難以辨別"], ["C", "媒體置入性行銷更加普及"], ["D", "個人資料外洩，隱私權受到侵犯"]], "ans": "D", "exp": "大量個資回傳形成資安隱憂，一旦外洩將危及個人隱私與財產，因此我國制定個人資料保護法加以規範。"}, {"stem": "下列何者最符合「具備媒體識讀能力的現代公民」應有的表現？", "opts": [["A", "看到聳動標題立刻轉傳，讓更多人及早知道"], ["B", "只接收單一媒體的訊息，避免被不同說法混淆"], ["C", "接觸多元媒體並相互比對，查證後再決定是否分享，發言時避免歧視與侵犯他人權益"], ["D", "認為所有網路訊息都是假的，完全不參與公共討論"]], "ans": "C", "exp": "媒體識讀強調保持懷疑態度、多元來源比對、主動查證，並為自己的言論負責，這既是保護自己也是保護別人。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

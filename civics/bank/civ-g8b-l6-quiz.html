<script>
const QS=[{"stem": "聯合國為了避免兒少在法律上處於弱勢地位，於西元1989年通過下列哪一項國際文件，成為各國保障兒少權益的重要依據？", "opts": [["A", "世界人權宣言"], ["B", "兒童權利公約"], ["C", "消除對婦女一切形式歧視公約"], ["D", "身心障礙者權利公約"]], "ans": "B", "exp": "聯合國於1989年通過「兒童權利公約」（CRC），宣示兒童權利的原則，是國際上保護兒少最重要的公約。我國並制定「兒童權利公約施行法」，要求政府制定法規與執行政策時都要符合公約規定。"}, {"stem": "依照「兒童權利公約」的定義，所謂「兒童」是指幾歲以下的人？", "opts": [["A", "未滿12歲"], ["B", "未滿15歲"], ["C", "未滿18歲"], ["D", "未滿20歲"]], "ans": "C", "exp": "兒童權利公約所稱的「兒童」是指未滿18歲者，範圍較廣；我國「兒童及少年福利與權益保障法」則把未滿12歲者稱為兒童，兩者定義不同，是考試常見的對照重點。"}, {"stem": "依我國「兒童及少年福利與權益保障法」的規定，下列關於年齡界定的敘述，何者正確？", "opts": [["A", "兒童指未滿12歲者，少年指12歲以上未滿18歲者"], ["B", "兒童指未滿14歲者，少年指14歲以上未滿18歲者"], ["C", "兒童指未滿12歲者，少年指12歲以上未滿20歲者"], ["D", "兒童指未滿18歲者，少年指18歲以上未滿20歲者"]], "ans": "A", "exp": "「兒童及少年福利與權益保障法」明確規定：兒童＝未滿12歲；少年＝12歲以上未滿18歲。這是本課最基本也最常考的年齡界定。"}, {"stem": "小美今年11歲、哥哥小強今年16歲。依「兒童及少年福利與權益保障法」的分類，兩人分別屬於什麼身分？", "opts": [["A", "兩人都是兒童"], ["B", "兩人都是少年"], ["C", "小美是少年，小強是兒童"], ["D", "小美是兒童，小強是少年"]], "ans": "D", "exp": "未滿12歲為兒童，故11歲的小美是兒童；12歲以上未滿18歲為少年，故16歲的小強是少年。"}, {"stem": "政府制定「兒童及少年福利與權益保障法」的主要目的為何？", "opts": [["A", "加重處罰犯罪的少年，以維護社會治安"], ["B", "限制兒少的自由，避免他們影響社會秩序"], ["C", "促進兒少身心健全發展，規定兒少的保護與福利措施"], ["D", "規定雇主僱用童工的工作時間與工作內容"]], "ans": "C", "exp": "該法的目的在促進兒少身心健全發展，內容包含「保護措施」與「福利措施」兩大類；規範童工是勞動基準法，處理少年犯罪是少年事件處理法。"}, {"stem": "下列何者屬於「兒童及少年福利與權益保障法」中政府「主動提供」的福利措施？", "opts": [["A", "在公共停車場設置婦幼專屬停車位"], ["B", "禁止兒少吸菸、飲酒、嚼食檳榔"], ["C", "禁止兒少出入妨害身心健康的場所"], ["D", "對出版品及遊戲軟體實施分級制度"]], "ans": "A", "exp": "福利措施是政府「主動提供」的服務，如婦幼停車位、親子廁所、親職教育講座、安置困境兒少等；(B)(C)(D)屬於政府「明確禁止」的保護措施。"}, {"stem": "下列何者屬於「兒童及少年福利與權益保障法」中的「保護措施」？", "opts": [["A", "辦理親職教育講座"], ["B", "提供兒少休閒、娛樂與文化活動的空間"], ["C", "建構親子廁所與親子車位"], ["D", "規定兒少不得出入危害身心健康的場所"]], "ans": "D", "exp": "保護措施是「禁止」性質的規定，例如禁止兒少吸菸飲酒、禁止出入不良場所、出版品與遊戲軟體分級等；(A)(B)(C)都屬於政府主動提供的福利措施。"}, {"stem": "某電子遊戲場業者讓國中生進入限制級的遊戲場所，經主管機關查獲。依「兒童及少年福利與權益保障法」，該業者最可能面臨下列何種處分？", "opts": [["A", "保護管束"], ["B", "罰鍰、公布姓名、勒令歇業等行政罰"], ["C", "有期徒刑與拘役"], ["D", "感化教育"]], "ans": "B", "exp": "該法規定相關場所負責人未善盡責任時，將面臨罰鍰、公布姓名、勒令歇業等「行政罰」；保護管束與感化教育是少年保護處分，不會用在業者身上。"}, {"stem": "小明的父母經常放任年僅5歲的弟弟單獨留在家中無人照顧。依「兒童及少年福利與權益保障法」，這對父母最可能受到下列何種處分？", "opts": [["A", "移送少年法院審理"], ["B", "處以感化教育"], ["C", "處以罰鍰並接受親職教育輔導"], ["D", "勒令歇業"]], "ans": "C", "exp": "該法規定父母不得讓6歲以下兒童獨處或由不適當的人照顧；父母未善盡職責時，可處罰鍰並命其接受親職教育輔導，屬於行政罰而非刑罰。"}, {"stem": "我國對出版品、電影及遊戲軟體實施「分級制度」，最主要的目的為何？", "opts": [["A", "避免兒少接觸不適合其身心發展的內容"], ["B", "減少業者的營業成本"], ["C", "增加政府的稅收來源"], ["D", "保障出版業者的著作財產權"]], "ans": "A", "exp": "分級制度屬於保護措施，目的是讓不同年齡層接觸適合的內容，避免兒少身心受到不良影響；遊戲軟體廠商應在產品上標示分級標識，父母也不可讓兒少接觸不符級別的內容。"}, {"stem": "政府制定「兒童及少年性剝削防制條例」的主要目的為何？", "opts": [["A", "規範兒少的打工時間與工作內容"], ["B", "處理12歲以上未滿18歲少年的觸法行為"], ["C", "提供兒少休閒娛樂與文化活動空間"], ["D", "防制兒少遭受任何形式的性剝削"]], "ans": "D", "exp": "該條例的立法目的即為防制兒少遭受任何形式的性剝削，維護其身心健全發展，並對被害兒少提供保護與安置。"}, {"stem": "依「兒童及少年性剝削防制條例」，與幾歲以下的兒少進行性交易即屬違法？", "opts": [["A", "未滿12歲"], ["B", "未滿18歲"], ["C", "未滿20歲"], ["D", "未滿16歲"]], "ans": "B", "exp": "該條例規定與「未滿18歲」的兒童或少年進行性交易，或散布、播送、持有兒少性影像等行為，都會受到刑罰或罰鍰處分。"}, {"stem": "下列何種行為最可能適用「兒童及少年性剝削防制條例」處理？", "opts": [["A", "業者仲介16歲的高中生到酒店坐檯陪酒"], ["B", "便利商店販賣香菸給17歲的高中生"], ["C", "雇主要求15歲的童工晚上10點加班"], ["D", "父母體罰10歲的兒童"]], "ans": "A", "exp": "利用兒少坐檯陪酒或從事涉及色情的伴遊、伴唱、伴舞等，屬於性剝削類型之一。(B)違反兒少福利與權益保障法、(C)違反勞動基準法、(D)涉及民法親權與體罰問題。"}, {"stem": "阿宏在網路上無正當理由持有一名國中女生的私密影像，並未散布給他人。依現行法律，他的行為：", "opts": [["A", "完全不違法，因為沒有散布出去"], ["B", "只需接受行政罰鍰，不會有刑事責任"], ["C", "仍可能觸犯兒少性剝削防制條例而受刑罰"], ["D", "只有拍攝者違法，持有者不必負責"]], "ans": "C", "exp": "依修法後的規定，「無故持有」或付費觀覽兒少性影像者，最重可處7年以下有期徒刑並得併科罰金，並非只有拍攝或散布者才違法。"}, {"stem": "當你發現同學疑似遭受性剝削時，可以立即撥打下列哪一支專線求助？", "opts": [["A", "165反詐騙專線"], ["B", "113保護專線"], ["C", "119消防專線"], ["D", "1999市民專線"]], "ans": "B", "exp": "113是保護專線，處理家暴、性侵害及兒少保護等案件；發現兒少疑似遭受性剝削時可撥打113或尋求警察協助。"}, {"stem": "政府為處理性影像外流的諮詢申訴、強制網路平臺下架被害人性影像，特別成立下列哪一個機構？", "opts": [["A", "少年輔導委員會"], ["B", "中途學校"], ["C", "少年矯正學校"], ["D", "性影像處理中心"]], "ans": "D", "exp": "「性影像處理中心」專責處理性影像外流的諮詢與申訴、主動巡查下架相關內容，並建立數位鑑識資料庫以利偵查。"}, {"stem": "依「勞動基準法」規定，雇主原則上不得僱用未滿幾歲的人從事工作？", "opts": [["A", "15歲"], ["B", "16歲"], ["C", "12歲"], ["D", "18歲"]], "ans": "A", "exp": "勞動基準法規定雇主原則上不 , ["B", "因未成年而完全不必負任何責任"], ["C", "送少年矯正學校服刑10年"], ["D", "由少年法院法官依個別情形處以保護處分"]], "ans": "D", "exp": "14歲以上未滿18歲且犯罪情節輕微（如竊盜罪、普通傷害罪）者，屬少年保護事件，由少年法院法官依個別情形處以保護處分，並非完全不必負責。"}, {"stem": "下列何者「不」屬於少年事件處理法所規定的「保護處分」？", "opts": [["A", "訓誡"], ["B", "有期徒刑"], ["C", "保護管束"], ["D", "感化教育"]], "ans": "B", "exp": "保護處分包括訓誡、假日生活輔導、保護管束、安置輔導、感化教育五種。有期徒刑屬於刑罰，是少年刑事案件經審理後才可能處以的處分。"}, {"stem": "少年法院法官告知少年應守法及將來應遵守的事項，並得命其立悔過書，同時提醒法定代理人應盡管教責任。這是哪一種保護處分？", "opts": [["A", "訓誡"], ["B", "保護管束"], ["C", "安置輔導"], ["D", "感化教育"]], "ans": "A", "exp": "訓誡是由法官告知少年應遵守的事項並得命其立悔過書，是保護處分中最輕微的一種。"}, {"stem": "當少年的法定代理人不適合繼續教養時，藉由兒童之家、少年學苑等機構的專業協助，讓少年完成學業或學習一技之長。這屬於下列何種保護處分？", "opts": [["A", "訓誡"], ["B", "假日生活輔導"], ["C", "安置輔導"], ["D", "感化教育"]], "ans": "C", "exp": "安置輔導是在法定代理人不適合繼續教養時，由兒童之家、少年學苑等福利或教養機構提供專業協助的處分。"}, {"stem": "下列關於「感化教育」的敘述，何者正確？", "opts": [["A", "由檢察官在看守所執行"], ["B", "屬於刑罰的一種，等同有期徒刑"], ["C", "只在假日執行，平日仍可正常上學"], ["D", "由少年矯正學校執行隔離式的過渡性教育措施，屬最後手段"]], "ans": "D", "exp": "感化教育由少年矯正學校執行，是隔離式的過渡性教育措施，屬於保護處分中最嚴厲者，具「最後手段性」，但本質仍是教育而非刑罰。"}, {"stem": "在假日對少年施以品德教育、輔導其學業或作業，並得命其勞動服務。這是哪一種保護處分？", "opts": [["A", "訓誡"], ["B", "假日生活輔導"], ["C", "保護管束"], ["D", "安置輔導"]], "ans": "B", "exp": "假日生活輔導是利用假日對少年施以品德教育、輔導學業，並得命其從事勞動服務的保護處分。"}, {"stem": "依少年事件處理法，符合下列哪一組條件的少年，才會以「少年刑事案件」移送檢察官偵查、起訴？", "opts": [["A", "14歲以上未滿18歲，且觸犯最輕本刑5年以上有期徒刑之罪"], ["B", "12歲以上未滿14歲，且觸犯最輕本刑3年以上有期徒刑之罪"], ["C", "12歲以上未滿18歲，只要有犯罪行為即可"], ["D", "未滿12歲，但犯罪情節重大"]], "ans": "A", "exp": "少年刑事案件的要件為「14歲以上未滿18歲」且「觸犯最輕本刑5年以上有期徒刑之罪」（或犯罪情節重大經法院認以刑罰為適當者），如殺人罪、強盜罪、擄人勒贖罪。"}, {"stem": "下列哪一個罪名，最可能使14歲以上未滿18歲的少年被移送檢察官偵查起訴？", "opts": [["A", "普通傷害罪"], ["B", "竊盜罪"], ["C", "強盜罪"], ["D", "公然侮辱罪"]], "ans": "C", "exp": "強盜罪、殺人罪、擄人勒贖罪等屬於最輕本刑5年以上有期徒刑的重罪，會以少年刑事案件處理；普通傷害罪、竊盜罪則屬情節輕微，以少年保護事件處理。"}, {"stem": "少年刑事案件在移送檢察官偵查、起訴後，由下列何者進行審理與判決？", "opts": [["A", "由少年輔導委員會裁定"], ["B", "由少年法院（庭）審理後處以刑罰"], ["C", "由行政機關逕行裁罰"], ["D", "由學校校務會議決議"]], "ans": "B", "exp": "少年刑事案件經檢察官偵查起訴後，仍由少年法院（庭）審理判決並處以刑罰，這與一般成年人的刑事案件由普通法院審理不同。"}, {"stem": "網路上有詐騙集團宣稱「未成年當車手不會被判刑」，藉此吸收青少年加入。依課本內容判斷，這種說法為何是錯誤的？", "opts": [["A", "只要未滿18歲，法律一律不予追究"], ["B", "未成年人所有犯罪都會被判處無期徒刑"], ["C", "未成年人一律移送檢察官起訴"], ["D", "未成年並非免責，仍可能受保護處分，情節重大者甚至負刑事責任"]], "ans": "D", "exp": "未滿14歲雖不以刑罰處罰，但仍可能受保護處分甚至感化教育；14歲以上未滿18歲若觸犯詐欺等罪，仍須負刑事責任，只是依法得減輕其刑，並非不必負責。"}, {"stem": "法院在審理少年事件時，採取「審理不公開」原則，其主要目的為何？", "opts": [["A", "方便法官快速結案"], ["B", "減少法院的行政支出"], ["C", "保護少年的隱私與尊嚴，避免曝光影響其成長"], ["D", "避免被害人到庭作證"]], "ans": "C", "exp": "少年事件採審理不公開原則，法庭也常採圓桌協商方式進行，目的在保護少年隱私與尊嚴，讓少年能在較溫和的氛圍下表達意見。"}, {"stem": "媒體在報導少年觸法案件時，依少年事件處理法應遵守下列哪一項規定？", "opts": [["A", "須依法保護少年的個人資料及照片"], ["B", "應完整公布少年的姓名與就讀學校"], ["C", "必須刊登少年的照片以警惕社會"], ["D", "可自由決定是否揭露少年身分"]], "ans": "A", "exp": "基於保護少年的精神，媒體報導少年事件時必須依法保護少年的個人資料及照片，不得揭露足以識別身分的資訊。"}, {"stem": "少年事件的紀錄在一定情況下應予以「塗銷」，其主要理由為何？", "opts": [["A", "減少法院檔案的保管成本"], ["B", "避免犯罪標籤影響少年前途，給予改過自新的機會"], ["C", "讓少年可以再犯而不被追究"], ["D", "保障被害人的求償權利"]], "ans": "B", "exp": "紀錄塗銷制度的目的是避免「犯罪標籤」跟隨少年一輩子而影響升學就業，給予其改過自新的機會，例如少年刑事案件執行完畢一定年限後，相關機關應塗銷紀錄。"}, {"stem": "比較「兒童權利公約」與我國「兒童及少年福利與權益保障法」對兒童的定義，下列敘述何者正確？", "opts": [["A", "兩者都是指未滿12歲者"], ["B", "兩者都是指未滿18歲者"], ["C", "公約指未滿12歲，我國法律指未滿18歲"], ["D", "公約指未滿18歲，我國法律指未滿12歲"]], "ans": "D", "exp": "兒童權利公約所稱兒童為未滿18歲者；我國兒童及少年福利與權益保障法則將未滿12歲者定義為兒童、12歲以上未滿18歲者為少年。兩者定義不同，須特別分辨。"}, {"stem": "下列關於各項兒少相關法律適用對象的配對，何者正確？", "opts": [["A", "少年事件處理法—12歲以上未滿18歲者"], ["B", "勞動基準法所稱童工—12歲以上未滿15歲者"], ["C", "兒少性剝削防制條例—未滿12歲者"], ["D", "兒少福利與權益保障法所稱少年—14歲以上未滿20歲者"]], "ans": "A", "exp": "少年事件處理法的少年為12歲以上未滿18歲；童工為15歲以上未滿16歲；性剝削防制條例保護未滿18歲的兒少；兒少福利法所稱少年為12歲以上未滿18歲。故只有(A)正確。"}, {"stem": "有人主張：「保護兒少的法律限制兒少不能抽菸、不能打工、不能看限制級影片，根本是剝奪兒少的自由。」依課本觀點，下列回應何者最適當？", "opts": [["A", "這些法律確實剝奪兒少權益，應盡速廢除"], ["B", "這些法律只是為了方便政府管理社會秩序"], ["C", "這些法律不是限制或剝奪兒少權益，而是針對身心尚未成熟的兒少提供更完善的照顧"], ["D", "這些法律的目的在於加重處罰違規的兒少"]], "ans": "C", "exp": "課本明確指出，這些法律並非限制或剝奪兒少的權益，而是因為兒少身心尚未成熟，需要更完善的照顧與保護，以落實保障兒少的精神、實現兒少最佳利益。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

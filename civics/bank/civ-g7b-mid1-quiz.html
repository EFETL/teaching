<script>
const QS=[{"stem": "小禾從小學會用餐前要洗手、在公車上要讓座、上課要舉手發言。課本把這種「個人學習各種知識、技能與規範，表現出符合社會期待的合宜行為」的過程稱為什麼？", "opts": [["A", "社會變遷"], ["B", "社會福利"], ["C", "社會化"], ["D", "社會規範"]], "ans": "C", "exp": "社會化是指個人學習知識、技能與規範，表現出符合社會期待之合宜行為的過程。人不能離群獨居，必須透過社會化融入社會生活。"}, {"stem": "下列關於「社會化」的敘述，何者最正確？", "opts": [["A", "社會化是終身持續進行的過程，不會在某個年齡結束"], ["B", "社會化只在幼兒時期進行，長大成人後就停止"], ["C", "社會化是由政府強制規定人民必須接受的訓練"], ["D", "社會化只能透過學校的正式課程才能完成"]], "ans": "A", "exp": "人在一生中不斷接觸新的群體與環境，必須持續學習新的知識、技能與規範，因此社會化是終身的歷程，而非只發生在童年，也不限於學校一種途徑。"}, {"stem": "課本提到社會化的主要途徑包括家庭、學校、同儕團體與傳播媒體。其中「個人最早接觸的社會組織，家人的言行舉止與生活習慣對個人產生潛移默化的影響，是建立人格的重要途徑」，指的是哪一項？", "opts": [["A", "學校"], ["B", "同儕團體"], ["C", "傳播媒體"], ["D", "家庭"]], "ans": "D", "exp": "家庭是個人最早接觸的社會組織，家人的言行舉止與生活習慣對個人具有潛移默化的影響，是建立人格最重要的途徑。"}, {"stem": "「小美因為班上同學都在做資源回收，自己也跟著養成隨手分類的習慣。」這最能說明哪一種社會化途徑的影響力？", "opts": [["A", "家庭"], ["B", "同儕團體"], ["C", "傳播媒體"], ["D", "政府機關"]], "ans": "B", "exp": "同儕之間因年齡、生活經驗相近，容易形成認同感，因而彼此影響言行舉止。小美受班上同學影響而改變行為，屬於同儕團體的社會化作用。"}, {"stem": "課本提到某一社會化途徑「透過有系統的課程，讓個人學習社會期許的行為準則與價值規範，同時協助個人發展潛能，培養適應生活的能力」。這指的是下列何者？", "opts": [["A", "學校"], ["B", "家庭"], ["C", "同儕團體"], ["D", "傳播媒體"]], "ans": "A", "exp": "學校透過有系統、有計畫的課程，教導學生知識與價值規範，並協助其發展潛能、培養適應社會生活的能力。"}, {"stem": "阿賢每天看新聞台報導海洋汙染的專題，漸漸養成減塑、自備環保杯的習慣。這屬於下列哪一種社會化途徑？", "opts": [["A", "家庭"], ["B", "學校"], ["C", "傳播媒體"], ["D", "同儕團體"]], "ans": "C", "exp": "電視、報紙、網路等傳播媒體提供各種資訊，會在無形中影響個人的價值觀與行為，屬於重要的社會化途徑。"}, {"stem": "下列哪一個例子「不屬於」社會化的表現？", "opts": [["A", "小華跟著媽媽學會用餐時不可大聲喧嘩"], ["B", "小明打噴嚏時反射性地閉上眼睛"], ["C", "小玉在學校學會排隊等候的規矩"], ["D", "小安受朋友影響開始關心動物保育議題"]], "ans": "B", "exp": "打噴嚏閉眼是與生俱來的生理反射，不需要透過學習；其餘三項都是經由家庭、學校或同儕「學習」而來的行為，才屬於社會化。"}, {"stem": "課本強調「人不能離群獨居」，因此必須透過社會化融入社會生活。這句話最主要說明的是：", "opts": [["A", "個人的能力必然勝過群體的力量"], ["B", "政府應該限制人民的自由以維持秩序"], ["C", "每個人都應該完全放棄自己的想法"], ["D", "個人必須學習社會的規範才能與他人共同生活"]], "ans": "D", "exp": "人是群居的，必須學會社會共同的知識、技能與規範，才能被群體接納並順利與他人互動，這正是社會化的意義。"}, {"stem": "下列關於社會化四種途徑的配對，何者「錯誤」？", "opts": [["A", "傳播媒體──個人最早接觸、對人格影響最深的社會組織"], ["B", "家庭──家人言行舉止具潛移默化的影響"], ["C", "學校──透過系統課程學習社會期許的行為準則"], ["D", "同儕團體──年齡與生活經驗相近，容易形成認同感"]], "ans": "A", "exp": "「個人最早接觸、對人格影響最深的社會組織」是家庭，不是傳播媒體。傳播媒體是透過資訊在無形中影響個人價值觀。"}, {"stem": "課本將「與眾人權益有關的事務，如規畫公共設施、擬定規範制度」稱為什麼？", "opts": [["A", "私人事務"], ["B", "社會福利"], ["C", "公共事務"], ["D", "社會規範"]], "ans": "C", "exp": "公共事務是指與眾人權益有關的事務，例如公共設施的規畫、規範制度的擬定等，因為涉及群體成員的利益分配與權利保障。"}, {"stem": "下列何者屬於「公共事務」？", "opts": [["A", "阿明決定今晚要吃牛肉麵還是水餃"], ["B", "小芳挑選自己房間窗簾的顏色"], ["C", "大雄把自家陽臺的盆栽移到向陽處"], ["D", "社區住戶討論中庭盆栽該如何規畫擺置"]], "ans": "D", "exp": "自家陽臺盆栽如何擺放屬於私人事務；社區中庭盆栽的規畫涉及全體社區居民的生活，屬於公共事務。判斷關鍵在於是否「涉及眾人權益」。"}, {"stem": "判斷一件事情是「公共事務」還是「私人事務」，最主要的依據是下列何者？", "opts": [["A", "花費金額的多寡"], ["B", "是否涉及眾人的權益"], ["C", "參與人數是否超過十人"], ["D", "是否由政府出面主辦"]], "ans": "B", "exp": "公共事務的核心特徵是「涉及與眾人有關的權益」，與花費多寡、人數多少或是否由政府主辦無必然關係。"}, {"stem": "課本指出，如果社會成員對公共事務漠不關心，最可能造成下列哪一種結果？", "opts": [["A", "可能讓少數人決定公共事務的發展方向，且因缺乏監督使資源分配不公"], ["B", "政府會因此自動提高服務品質，讓決策更符合眾人需求"], ["C", "決策速度變慢，但決策品質必定會提升"], ["D", "公共事務會自動消失，社會不再需要制度"]], "ans": "A", "exp": "成員若漠不關心，公共事務可能由少數人決定，也可能因缺乏監督而影響成員權益，或使資源分配不公，這正是課本強調應主動參與的理由。"}, {"stem": "課本提到「參與公共事務並非強加於社會成員的負擔，而是對社會成員的保障」。這句話的意思最接近下列何者？", "opts": [["A", "參與公共事務是法律規定的義務，不參加會被處罰"], ["B", "只有政治人物才需要參與公共事務"], ["C", "參與公共事務能維護自身權益，也讓決策貼近成員需求"], ["D", "參與公共事務只是形式，不會影響決策結果"]], "ans": "C", "exp": "積極關心與了解公共事務，不僅可以維護自身權益，也能讓決策者做決定時兼顧與貼近成員的需求，因此是保障而非負擔。"}, {"stem": "社區住戶要求管理委員會公布施工進度與經費資料。這項行動最主要發揮了下列哪一種功能？", "opts": [["A", "增加社區的施工經費"], ["B", "進行監督以避免弊端"], ["C", "減少住戶的管理費負擔"], ["D", "取代管委會行使決策權"]], "ans": "B", "exp": "要求公布進度與經費，屬於成員對公共事務的監督，可防止少數人操弄或發生弊端，是參與公共事務的重要方式。"}, {"stem": "下列哪一項「不是」課本所說「積極參與公共事務」的好處？", "opts": [["A", "維護群體成員的權益"], ["B", "讓決策貼近群體成員的需求"], ["C", "進行監督以防止少數人操弄"], ["D", "保證每個人的意見都會被完全採納"]], "ans": "D", "exp": "公共事務需要透過討論與溝通形成共識，不可能每個人的意見都被完全採納；(A)(B)(C) 才是課本列出的參與效益。"}, {"stem": "在公聽會上，大家對停車場的設計提出不同看法，最後主辦單位表示「感謝各位出席和發言，讓設計更符合使用需求」。這個例子最能說明參與公共事務的哪一項價值？", "opts": [["A", "可以避免政府花費任何經費"], ["B", "可以讓少數人快速做出決定"], ["C", "可以讓決策更貼近成員的實際需求"], ["D", "可以取代法律的規範功能"]], "ans": "C", "exp": "成員發言表達需求後，決策者能兼顧並貼近成員需求，使公共政策更符合實際使用情形，這是參與公共事務的重要效益。"}, {"stem": "課本指出「國民」是指下列何者？", "opts": [["A", "具備一國國籍的人民"], ["B", "年滿20歲並具有選舉權的人"], ["C", "在一國境內居住超過五年的外國人"], ["D", "已完成國民教育的所有居民"]], "ans": "A", "exp": "國民是指具備一國國籍的人民。我國憲法規定「具有中華民國國籍者為中華民國國民」，與年齡、居住年限或學歷無關。"}, {"stem": "「以父母親的國籍為準，出生時父或母具該國國籍，即為該國國民。」這是取得國籍的哪一種原則？", "opts": [["A", "屬地主義"], ["B", "屬人主義"], ["C", "歸化"], ["D", "收養"]], "ans": "B", "exp": "屬人主義又稱血統主義，以父母的國籍為判斷依據；屬地主義（出生地主義）則以出生地為準。我國國籍法採屬人主義為主、屬地主義為輔。"}, {"stem": "有關我國國籍取得原則的敘述，下列何者正確？", "opts": [["A", "完全採屬地主義，凡在我國出生者一律取得我國國籍"], ["B", "完全採屬人主義，不承認任何其他取得方式"], ["C", "以屬地主義為主、屬人主義為輔"], ["D", "以屬人主義為主、屬地主義為輔"]], "ans": "D", "exp": "我國國籍法採取「屬人主義為主，屬地主義為輔」，並另有「歸化」作為出生以外取得國籍的方式。"}, {"stem": "來自土耳其的藝人吳鳳，經由申請程序取得我國國籍，成為中華民國國民。他取得國籍的方式屬於下列何者？", "opts": [["A", "屬人主義"], ["B", "屬地主義"], ["C", "歸化"], ["D", "收養未成年子女"]], "ans": "C", "exp": "歸化是指因出生以外的原因（如婚姻、收養、長期居留、投資等），透過申請並經政府核可而取得該國國籍。"}, {"stem": "下列關於「廣義公民」與「狹義公民」的敘述，何者正確？", "opts": [["A", "廣義公民指民主國家的全體國民；狹義公民指具備法定資格能行使參政權的國民"], ["B", "廣義公民指年滿18歲者；狹義公民指年滿20歲者"], ["C", "廣義公民指在國內居住者；狹義公民指在國外居住者"], ["D", "廣義公民與狹義公民的範圍完全相同，只是稱呼不同"]], "ans": "A", "exp": "廣義的公民是民主國家中的全體國民；狹義的公民則指具備法定資格、能行使參政權的國民，範圍較小。"}, {"stem": "依課本內容，我國國民年滿幾歲有選舉、罷免權？", "opts": [["A", "年滿16歲"], ["B", "年滿17歲"], ["C", "年滿18歲"], ["D", "年滿20歲"]], "ans": "D", "exp": "依據憲法規定，中華民國國民年滿20歲有依法選舉之權，亦有罷免權；公民投票權則依公民投票法為年滿18歲。"}, {"stem": "依課本內容，下列哪一項權利，我國國民年滿18歲即可行使？", "opts": [["A", "選舉權"], ["B", "公民投票權"], ["C", "罷免權"], ["D", "以上皆須年滿20歲"]], "ans": "B", "exp": "依公民投票法，國民年滿18歲有公民投票權，可落實創制、複決權；選舉、罷免權依憲法為年滿20歲。"}, {"stem": "小豪今年17歲，是本國籍國中生。依課本內容判斷，下列何者是他「目前可以做」的？", "opts": [["A", "投票選出里長"], ["B", "參加公民投票"], ["C", "對校園安全問題向學校表達意見"], ["D", "連署罷免地方民意代表"]], "ans": "C", "exp": "社會成員對公共事務都有表達意見的權利；但若要透過選舉、罷免或公民投票參與，則須具備狹義公民身分（符合法定年齡等資格）。"}, {"stem": "「社會成員都能表達意見，但只有具備狹義公民身分者才能投票。」這句話最主要說明下列何者？", "opts": [["A", "身分不同會影響可參與公共事務的方式與範圍"], ["B", "只有公民才需要關心公共事務"], ["C", "表達意見的權利只屬於成年人"], ["D", "投票是唯一有效的社會參與方式"]], "ans": "A", "exp": "社會中的成員因身分不同，可參與的公共事務也有差異；人人均可關心與表達意見，但行使參政權須具備法定資格。"}, {"stem": "在臺工作的外籍移工阿蒂，與我國國民相比，下列敘述何者正 m": "一個國家的人民能否自由參與各類志願結社，最常被用來判斷下列何者？", "opts": [["A", "該國的經濟是否富裕"], ["B", "該國是否民主自由、人民的結社權利是否受到保障"], ["C", "該國的人口是否眾多"], ["D", "該國的國土面積是否遼闊"]], "ans": "B", "exp": "志願結社是人民自由意志的展現，人民能否自由結社，是衡量一個國家民主化、自由化程度的重要指標，與經濟、人口、面積無關。"}, {"stem": "我國自民國76年（1987年）解除戒嚴後，各類民間團體的數量大幅成長。這個現象最能說明下列何者？", "opts": [["A", "政府開始全面接管所有的民間團體"], ["B", "人民不再需要參與公共事務"], ["C", "民間團體的營利能力大幅提升"], ["D", "社會走向民主化與自由化，志願結社蓬勃發展"]], "ans": "D", "exp": "解嚴後人民的結社自由獲得更充分的保障，志願結社蓬勃發展，成為當代臺灣多元社會的特徵，也是民主化、自由化的表現。"}, {"stem": "志願結社的「志願性」是指下列何者？", "opts": [["A", "團體必須無償提供服務，不得收取任何費用"], ["B", "團體的運作方向必須聽從政府安排"], ["C", "成員是基於自由意願加入或組成該團體"], ["D", "團體所有成員都必須擔任志工"]], "ans": "C", "exp": "志願性強調成員基於自由意願加入或組成，與家庭、親屬等非基於個人意願而加入的非志願團體不同。(A)混淆非營利性，(B)與自主性相反。"}, {"stem": "阿美因為關心身心障礙者的處境，主動報名加入伊甸社會福利基金會服務。這最能展現志願結社的哪一項特徵？", "opts": [["A", "志願性"], ["B", "非營利性"], ["C", "組織性"], ["D", "民間性"]], "ans": "A", "exp": "「主動報名加入」顯示成員基於自由意願參與，屬於志願性。若題目強調不以賺錢為目的則為非營利性、強調內部分工則為組織性、強調非政府組織則為民間性。"}, {"stem": "中華民國消費者文教基金會會公布市售食品的檢驗結果，但只有政府才能對違法業者開罰。這最能說明志願結社具有下列何種特徵？", "opts": [["A", "志願性"], ["B", "組織性"], ["C", "非營利性"], ["D", "民間性"]], "ans": "D", "exp": "志願結社屬於非官方的民間組織，不是政府的一部分，因此缺乏公權力，不能像政府一樣裁罰違法者，這就是「民間性」。"}, {"stem": "弘道老人福利基金會設有秘書處、企劃部門、服務部門等單位，各單位任務明確、各司其職。這展現志願結社的哪一項特徵？", "opts": [["A", "志願性"], ["B", "組織性"], ["C", "自主性"], ["D", "民間性"]], "ans": "B", "exp": "為了實現團體目標並提升工作效率，志願結社會成立正式的組織架構、分配成員工作與任務、明定規範進行專業分工，這就是組織性。"}, {"stem": "台灣兒童暨家庭扶助基金會舉辦義賣，所得全數用於弱勢家庭學童的助學金，不分配給成員。這最符合志願結社的哪一項特徵？", "opts": [["A", "非營利性"], ["B", "志願性"], ["C", "組織性"], ["D", "民間性"]], "ans": "A", "exp": "非營利性是指團體不以賺錢為目的，自行籌措經費，即使產生盈餘，也僅能使用在公益目標上，不能分配給成員。"}, {"stem": "喜憨兒社會福利基金會可以自行決定要推動哪些心智障礙者的教育與照顧工作，運作過程不受政府支配。這展現志願結社的哪一項特徵？", "opts": [["A", "民間性"], ["B", "非營利性"], ["C", "自主性"], ["D", "志願性"]], "ans": "C", "exp": "自主性是指在符合法規的前提下，團體可自主決定工作目標與內容，運作過程不受政府支配，能主動探究各類議題。"}, {"stem": "關於志願結社「非營利性」的敘述，下列何者正確？", "opts": [["A", "志願結社完全不能有任何金錢收入"], ["B", "即使義賣產生盈餘，也只能用在達成公益目標上，不能分配給成員"], ["C", "所需經費一律由政府編列預算全額支付"], ["D", "只要團體有任何盈餘，就一定違反非營利性"]], "ans": "B", "exp": "志願結社需自籌經費，可收取會費、募款或舉辦義賣，因此可以有收入，也可能產生盈餘；關鍵在於盈餘不得分配給成員，只能用於達成組織的公益目標。"}, {"stem": "關於志願結社的經費來源，下列何者「最不」符合課本所述？", "opts": [["A", "民眾的小額捐款"], ["B", "企業的贊助"], ["C", "收取會費或舉辦義賣所得"], ["D", "由政府全額補助，並由政府指定經費用途"]], "ans": "D", "exp": "志願結社須自行籌措經費，多來自民眾捐款、企業贊助、會費或義賣。若經費全由政府提供並由政府指定用途，將違反其民間性與自主性。"}, {"stem": "志願結社為什麼要建立正式的組織架構並進行專業分工？", "opts": [["A", "為了取得政府授予的公權力"], ["B", "為了把利潤平均分配給每位成員"], ["C", "為了實現團體目標並提升工作效率"], ["D", "為了方便接受政府的指揮與監督"]], "ans": "C", "exp": "組織性的目的在於實現團體目標、提升工作效率，因此成立組織架構、分配工作任務並明定規範進行專業分工。"}, {"stem": "社區巡守隊的成員都是主動加入的居民；對違規者不具強制力；內部分工明確；不以賺錢為目的；巡守時間由隊員自行安排。下列「特徵配對」何者**錯誤**？", "opts": [["A", "對違規者不具強制力 → 組織性"], ["B", "成員主動加入 → 志願性"], ["C", "不以賺錢為目的 → 非營利性"], ["D", "巡守時間自行安排 → 自主性"]], "ans": "A", "exp": "「對違規者不具強制力」代表缺乏公權力，應對應「民間性」而非組織性；組織性應以「內部分工明確」來判斷。"}, {"stem": "下列哪一個團體，最不符合「志願結社」的定義？", "opts": [["A", "荒野保護協會"], ["B", "喜憨兒社會福利基金會"], ["C", "學校的吉他社"], ["D", "縣市政府的環境保護局"]], "ans": "D", "exp": "環境保護局是政府機關，具有公權力、經費由政府編列，不符合志願結社的志願性、民間性與自主性；其餘三者皆為人民自由意願組成的民間團體。"}, {"stem": "某民間協會表示：「我們要辦什麼活動、服務哪些對象、如何募款，都由本會理監事會依章程自行決定。」這最能看出該協會具有下列何種特徵？", "opts": [["A", "非營利性"], ["B", "自主性"], ["C", "組織性"], ["D", "志願性"]], "ans": "B", "exp": "題幹強調「自行決定」工作目標與運作方式、不受外力支配，屬於自主性。若強調不分配盈餘則為非營利性、強調成員自由加入則為志願性。"}, {"stem": "志願結社與一般公司企業，最主要的差別在於下列何者？", "opts": [["A", "志願結社不以營利為目的，盈餘不能分配給成員"], ["B", "志願結社完全不需要任何組織與分工"], ["C", "志願結社的成員都是被強制加入的"], ["D", "志願結社具有公權力，可以強制他人服從"]], "ans": "A", "exp": "兩者都是民間組織、都有組織分工、成員也都可自由加入，最關鍵的差異在於營利與否：公司以營利、分配利潤為目的，志願結社的盈餘僅能用於公益目標。"}, {"stem": "志願結社與政府機關，最主要的差別在於下列何者？", "opts": [["A", "志願結社的成員人數一定比政府機關多"], ["B", "志願結社擁有的經費一定比政府機關充足"], ["C", "志願結社屬於民間組織，缺乏公權力，不能強制人民服從"], ["D", "志願結社不必遵守國家的法律規定"]], "ans": "C", "exp": "志願結社具民間性，並非政府組織的一部分，缺乏公權力；但它仍必須在符合法規的前提下運作，並非不受法律規範。"}, {"stem": "世界展望會在辦理「飢餓三十」大型活動前，會先劃分文宣、募款、場地、志工管理等小組，各組負責不同任務。這種作法主要是為了下列何者？", "opts": [["A", "增加每位成員的個人收入"], ["B", "取得政府授權的公權力"], ["C", "使團體可以不受法律規範"], ["D", "透過制度化的分工提升運作效率"]], "ans": "D", "exp": "這是志願結社「組織性」的表現：建立組織架構、進行制度化分工，以實現團體目標並提升工作效率。"}, {"stem": "民國81年一場幼稚園火燒車意外後，一群民眾自主成立靖娟兒童安全文教基金會，集結各界資源推動兒童交通安全教育。這最能說明志願結社的哪一項影響？", "opts": [["A", "取代政府執行公權力"], ["B", "集結群體的力量，共同實現公益理想"], ["C", "增加參與成員的個人收入"], ["D", "減少人民參與公共事務的機會"]], "ans": "B", "exp": "個人的金錢、力量有限，必須透過志願結社集結更多資源與人力，才能實現公益或為弱勢群體爭取權益，這就是「集結群體的力量」。"}, {"stem": "志願結社透過長期穩定的互動與扶持，形成凝聚力，鼓勵成員積極參與公共事務；對外也宣導理念，吸引更多民眾關注與支持。這說明志願結社能發揮下列何種影響？", "opts": [["A", "集結群體的力量"], ["B", "監督及影響政府施政"], ["C", "提供人民參與公共事務的管道"], ["D", "增加政府的稅收收入"]], "ans": "C", "exp": "題幹同時描述「對內凝聚成員、鼓勵參與」與「對外宣導理念、吸引支持」，正是課本所述「提供參與的管道」這項影響。"}, {"stem": "「行人零死亡推動聯盟」在凱達格蘭大道舉行「還路於民大遊行」，呼籲政府正視交通改革、儘速提出解決方法。這最能展現志願結社的哪一項影響？", "opts": [["A", "監督及影響政府的施政"], ["B", "滿足成員的情感需求"], ["C", "增加團體的營業收入"], ["D", "代替政府直接制定法律"]], "ans": "A", "exp": "針對公共議題向政府提出建議與評價、督促政府改善，屬於「監督及影響政府施政」。民間團體不能自行制定法律，只能促成政府修法。"}, {"stem": "志願結社之所以「較能」有效監督政府施政，主要原因為何？", "opts": [["A", "因為它擁有比政府更大的公權力"], ["B", "因為它在經費與人員運用上不受政府支配，能獨立提出建議與評價"], ["C", "因為它的主要成員都是政府官員"], ["D", "因為法律規定政府必須完全聽從民間團體的意見"]], "ans": "B", "exp": "志願結社在經費、人員運用上不受政府支配（自主性、民間性），因此能較客觀、主動地針對公共議題提出建議與批評，發揮監督功能。"}, {"stem": "柯媽媽在車禍中失去愛子後，成立中華民國車禍受難者救援協會，長期奔走，最後成功催生《強制汽車責任保險法》。這個案例最能說明下列何者？", "opts": [["A", "民間團體可以直接制定並公布法律"], ["B", "個人力量已足夠改變社會，不需要組織團體"], ["C", "志願結社成立的主要目的是為了營利"], ["D", "志願結社能影響政府施政，促成保障人民權益的制度"]], "ans": "D", "exp": "民間團體無法自行立法，但可透過倡議與監督促使政府制定政策法律，這正是志願結社「影響與監督政府施政」的具體成果。"}, {"stem": "下列何者「不是」課本所述志願結社對公共生活的影響？", "opts": [["A", "代替政府行使公權力，直接處罰違法的人"], ["B", "集結群體的力量"], ["C", "提供人民參與公共事務的管道"], ["D", "監督及影響政府施政"]], "ans": "A", "exp": "志願結社具民間性、缺乏公權力，不能取代政府執行裁罰。(B)(C)(D)才是課本歸納的三項影響。"}, {"stem": "綠色和平組織長期以連署、遊說、發布研究報告等方式向政府與企業施壓，最後促成歐洲議會通過反毀林法案。下列敘述何者最恰當？", "opts": [["A", "該組織屬於政府機關，所以才能推動法案"], ["B", "該組織成立的目的是為了賺取更多利潤"], ["C", "該組織具有公權力，可以強制企業配合"], ["D", "該組織展現民間團體監督與影響政策的力量"]], "ans": "D", "exp": "綠色和平是非政府的民間環保組織，不具公權力，也不以營利為目的；它透過倡議與施壓影響政府與企業，屬於監督及影響政府施政的表現。"}, {"stem": "課本所稱的「志願服務」，其意義最接近下列何者？", "opts": [["A", "政府強制人民必須從事的義務勞動"], ["B", "以領取高額報酬為主要目的的兼職工作"], ["C", "民眾自願以知識、勞力、時間、技術貢獻社會，不以獲取報酬為目的"], ["D", "學校規定學生每學期必須完成的課業作業"]], "ans": "C", "exp": "志願服務是民眾自願貢獻知識、勞力、時間、技術等，不以獲取報酬為目的，用以提高公共事務效能、增進社會公益的服務。"}, {"stem": "阿賢利用週末時間到創世社會福利基金會擔任志工，協助募集發票。關於這項行為，下列敘述何者最恰當？", "opts": [["A", "必須具備專業證照的人才可以擔任志工"], ["B", "這是國中生參與公共事務、培養公民能力的方式之一"], ["C", "志工服務的目的是為了獲取高額報酬"], ["D", "只有成年人才能從事志願服務，國中生並不適合"]], "ans": "B", "exp": "課本鼓勵國中階段的學生透過參與校內團體活動或利用課餘時間參加校外團體從事志願服務，藉此培養參與公共事務的能力。"}, {"stem": "國中生若想參與公共事務、累積社會參與的經驗，下列作法何者「最不適當」？", "opts": [["A", "參加學校社團並協助辦理服務性活動"], ["B", "利用課餘時間到社會福利團體擔任志工"], ["C", "參與淨灘、淨山等環保團體舉辦的活動"], ["D", "加入以恐嚇同學、收取保護費為目的的組織"]], "ans": "D", "exp": "以犯罪為宗旨的組織會侵害他人權利、危害社會治安，不受結社自由保障，並會受《組織犯罪防制條例》制裁，絕非參與公共事務的正當方式。"}, {"stem": "「愛狗一族」是溫暖國中一群熱愛校狗的學生自發性組成的社團，設有清潔組、照護組、義賣組與宣傳組，義賣自製明信片的所得全數捐給流浪狗之家。下列敘述何者**錯誤**？", "opts": [["A", "由義賣所得全數捐出，可看出該社團具有公權力"], ["B", "由學生自發性組成，可看出其志願性"], ["C", "由設有清潔組、照護組等分工，可看出其組織性"], ["D", "由義賣所得不分給成員，可看出其非營利性"]], "ans": "A", "exp": "義賣所得全數捐出所反映的是「非營利性」，與公權力無關；學生社團屬於民間團體，本來就不具公權力。"}, {"stem": "承上題，下列敘述何者最符合「結社自由」的概念？", "opts": [["A", "「愛狗一族」由校內教師指定特定學生組成"], ["B", "「愛狗一族」由一群熱愛校狗的學生依自由意願自發性組成"], ["C", "校方可以任意限制「愛狗一族」的所有活動"], ["D", "結社自由只適用於成年公民，未成年學生並不適用"]], "ans": "B", "exp": "結社自由的核心是「依自由意願」組成或參加團體。被指定加入不符合志願性；未成年人同樣享有結社自由；校方也不能無理由地任意限制學生社團。"}, {"stem": "某基金會以協助戒藥癮更生人重返社會為目標，設立實習餐廳與烘焙坊培訓其技能，並對外宣導理念，吸引更多民眾關注與支持。這最能說明志願結社的哪些作用？\n（甲）集結群體的資源與人力　（乙）提供民眾參與公共事務的管道　（丙）代替政府行使公權力　（丁）為成員賺取並分配利潤", "opts": [["A", "甲丙"], ["B", "乙丁"], ["C", "甲乙"], ["D", "丙丁"]], "ans": "C", "exp": "該基金會集結資源與人力協助弱勢（甲），並對外宣導理念吸引民眾關注支持（乙）。志願結社不具公權力（丙錯），也不以營利、分配利潤為目的（丁錯）。"}, {"stem": "下列有關「非志願團體」與「志願結社」的比較，何者正確？", "opts": [["A", "家庭屬於非志願團體，環境保護協會屬於志願結社"], ["B", "兩者的成員都是依個人自由意願加入"], ["C", "志願結社依血緣關係組成，非志願團體依共同興趣組成"], ["D", "只有非志願團體才受到憲法結社自由的保障"]], "ans": "A", "exp": "家庭因血緣、婚姻關係而形成，並非個人自由選擇，屬於非志願團體；環保協會則由人民依自由意願組成，屬於志願結社，並受結社自由保障。"}, {"stem": "綜合本課內容，下列有關志願結社的敘述何者最正確？", "opts": [["A", "志願結社既然是民間團體，就不必遵守國家的法律"], ["B", "志願結社的最終目的是為成員賺取更多利潤"], ["C", "人民熱衷參與志願結社，會削弱民主政治的發展"], ["D", "志願結社是人民參與公共事務的重要管道，也是民主社會的重要基礎"]], "ans": "D", "exp": "志願結社須在符合法規的前提下運作（A錯）、不以營利為目的（B錯）；人民踴躍結社正是民主化、自由化的指標，能強化而非削弱民主（C錯）。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

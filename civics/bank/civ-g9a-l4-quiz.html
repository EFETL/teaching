<script>
const QS=[{"stem": "現代社會中，多數人不會為了吃一份蛋餅就自己養雞生蛋、種小麥磨麵粉，而是直接向早餐店購買。這種現象最主要是因為下列何者？", "opts": [["A", "政府法律禁止民眾自行生產食品"], ["B", "自行生產所需付出的機會成本較高"], ["C", "自己製作的食物一定比店家不衛生"], ["D", "市場上的產品價格永遠低於生產成本"]], "ans": "B", "exp": "課本指出，若想以自給自足的方式滿足生活所需，不僅費時費力，成本與品質也不見得比得上專業店家，機會成本相對較高，所以人們選擇透過交易取得。"}, {"stem": "「一日之所需，百工斯為備」這句話最能說明下列何種概念？", "opts": [["A", "資源具有稀少性，所以人必須做選擇"], ["B", "廠商之間以不斷降價的方式彼此競爭"], ["C", "人們的生活所需，須仰賴眾人的分工與交易才能滿足"], ["D", "政府應該全面管制物價以保障消費者"]], "ans": "C", "exp": "這句話意指一天生活所需，要靠各行各業共同準備，正是分工與交易的最佳寫照。"}, {"stem": "關於「市場」的敘述，下列何者正確？", "opts": [["A", "市場是買賣雙方進行交易的地方，不一定要有實體店面"], ["B", "市場一定要有實體的建築物才能成立"], ["C", "只有政府設立的場所才能稱為市場"], ["D", "網路購物因為買賣雙方看不到對方，所以不算市場交易"]], "ans": "A", "exp": "市場是買賣雙方交易的地方，可分為有形市場（有實體買賣場所）與無形市場（透過電話、網路進行）。"}, {"stem": "下列何者屬於「無形市場」的交易？", "opts": [["A", "到住家附近的便利商店買飲料"], ["B", "在傳統市場向攤販購買蔬菜"], ["C", "到百貨公司專櫃試穿並購買鞋子"], ["D", "用手機App在網路商店下單購買球鞋"]], "ans": "D", "exp": "無形市場沒有實體店面，多半透過電話、網路等方式進行交易，網路商店即為典型例子；(A)(B)(C) 皆有實體買賣場所，屬有形市場。"}, {"stem": "消費者與生產者為什麼願意進行交易？下列敘述何者最適當？", "opts": [["A", "因為政府規定人民不得自行生產任何物品"], ["B", "因為透過專業分工再交易，雙方都能以較低的成本滿足需求"], ["C", "因為生產者可藉此把成本完全轉嫁給消費者而獲得暴利"], ["D", "因為消費者擁有的資源無限，可以任意購買"]], "ans": "B", "exp": "人們的時間與金錢有限，自行生產所有產品的機會成本太高，因此專業從事某項工作獲得報酬後，再到市場購買所需，形成互利的市場交易。"}, {"stem": "小潔想送餅乾給好友。她發現自己做要花4小時、只能做出少量餅乾，還會剩下食材、設備也閒置；而餅乾店師傅同樣花4小時可做出大量餅乾，流程熟練、品質較高。由此最能推論出下列何者？", "opts": [["A", "讓專業者生產，再透過交易取得，往往比自給自足划算"], ["B", "自己動手做的產品成本一定比較低"], ["C", "餅乾店師傅生產餅乾的機會成本比小潔高"], ["D", "小潔應該投資更多設備來擴大生產規模"]], "ans": "A", "exp": "專業者因產量大、流程熟練，可降低每單位的生產成本並提升品質，故向專業者購買（交易）比自製更划算。"}, {"stem": "阿明說：「我家的早餐都是媽媽在家煮的，所以我家完全不必依靠交易。」這句話的錯誤在於下列何者？", "opts": [["A", "在家煮早餐完全不能滿足生活需求"], ["B", "自給自足的機會成本一定比較低"], ["C", "在家烹調所使用的食材，多半仍是事先向市場買來的"], ["D", "只有到餐廳吃飯才算是滿足生活需求"]], "ans": "C", "exp": "課本明確指出，即使在家吃早餐，材料通常也是事先從店家買來的，因此仍然離不開市場交易。"}, {"stem": "下列關於「自給自足」的敘述，何者正確？", "opts": [["A", "自給自足能使個人的生產效率達到最高"], ["B", "現代社會中的人大多仍採自給自足的方式生活"], ["C", "自給自足可以完全避免機會成本的產生"], ["D", "若想以自給自足滿足全部生活所需，往往須付出較高的成本"]], "ans": "D", "exp": "自給自足要花費大量時間與體力，且技術能力不足，成本高、品質也不穩定，故現代人多改採分工與交易。"}, {"stem": "課本所談的「分工」，其意義最符合下列何者？", "opts": [["A", "個人、公司、地區或國家各自負責自己所擅長的生產工作"], ["B", "政府依照人民的學歷高低分配每個人的工作"], ["C", "每個人都要學會生產所有的生活必需品"], ["D", "廠商彼此約定共同調高產品的價格"]], "ans": "A", "exp": "分工是指個人、公司、地區或國家各自負責自己擅長的生產工作，並非由政府強制分配，也不是廠商間的聯合行為。"}, {"stem": "分工能提升生產效率，其原因「不」包括下列何者？", "opts": [["A", "專心從事同一項工作，可增加熟練程度"], ["B", "可以擴大生產的規模，降低平均生產成本"], ["C", "可以使生產者完全不必負擔任何生產成本"], ["D", "有助於提升產品的產量與品質"]], "ans": "C", "exp": "分工可提高熟練度、擴大規模、提升產量與品質，但生產仍需投入資源，不可能完全沒有成本。"}, {"stem": "下列何者最能說明「專業化生產」的效果？", "opts": [["A", "工廠不斷增加生產項目，什麼產品都自己做"], ["B", "農夫同時學習烘焙、種麥與開貨車"], ["C", "每個人專門生產自己機會成本較高的產品"], ["D", "麵包師傅專心做麵包、農夫專心種麥，兩者再進行交易"]], "ans": "D", "exp": "專業化是各自從事機會成本較低、自己擅長的工作，再透過交易互通有無；(C) 敘述恰好相反。"}, {"stem": "個人在分工與專業化生產之後，還能獲得下列何種好處？", "opts": [["A", "從此完全不需要再與他人交易"], ["B", "節省下來的時間可以從事其他活動，提升生活品質"], ["C", "產品的品質必然下降，但數量會增加"], ["D", "可以完全避免市場上的競爭"]], "ans": "B", "exp": "分工後不必事事親為，可多出許多時間從事其他活動，增進生活品質；但仍需透過交易才能取得他人生產的產品。"}, {"stem": "某公司僱用會計、工程師、業務、行銷等不同專長的人才，各自負責不同的工作。這種做法最主要的目的是下列何者？", "opts": [["A", "增加公司必須負擔的固定成本"], ["B", "減少員工彼此之間的競爭關係"], ["C", "讓每個人發揮專長，以達到最佳生產效能"], ["D", "避免公司必須進行任何市場交易"]], "ans": "C", "exp": "企業內部分工的用意，是讓具備不同專長的人才各司其職，發揮最佳生產效能，這正是專業分工的展現。"}, {"stem": "服飾店老闆願意以1,000元賣出一件衣服，Andy也願意以1,000元購買。關於這筆「自願交易」，下列敘述何者正確？", "opts": [["A", "對Andy而言這件衣服值1,000元，對老闆而言成本不超過1,000元，雙方都獲利"], ["B", "一定是消費者吃虧、生產者獲利"], ["C", "這個成交價格是由政府直接規定的"], ["D", "自願交易只對生產者有利，對消費者毫無好處"]], "ans": "A", "exp": "買賣雙方各自衡量成本與利益後共同接受同一價格，代表交易對雙方而言都比不交易好，因此自願交易是互利的。"}, {"stem": "下列哪一種情況「最不」屬於分工的表現？", "opts": [["A", "一間工廠專門生產褲子，另一間工廠專門生產衣服"], ["B", "越南專門生產成衣出口，臺灣專門生產電子零組件"], ["C", "公司裡有人負責研發、有人負責行銷"], ["D", "一個人利用假日把家裡的水電、木工、油漆全部自己修好"]], "ans": "D", "exp": "(D) 是樣樣自己來的自給自足，與分工（各自負責擅長工作）的概念相反。"}, {"stem": "朱老闆每天工作8小時，可以生產2件褲子或1件衣服；王阿姨同樣工作8小時，可以生產1件褲子或2件衣服。若兩人要進行分工，下列安排何者最適當？", "opts": [["A", "朱老闆做衣服，王阿姨做褲子"], ["B", "朱老闆做褲子，王阿姨做衣服"], ["C", "兩人都專門做褲子"], ["D", "兩人都專門做衣服"]], "ans": "B", "exp": "朱老闆做褲子的產量較多、機會成本較低；王阿姨做衣服的產量較多、機會成本較低，故應各自生產擅長且機會成本較低的產品。"}, {"stem": "承上題，朱老闆生產「1件褲子」的機會成本是多少？", "opts": [["A", "2件衣服"], ["B", "1件衣服"], ["C", "2件褲子"], ["D", "0.5件衣服"]], "ans": "D", "exp": "朱老闆一天可做2件褲子或1件衣服，生產2件褲子需放棄1件衣服，故1件褲子的機會成本為 1÷2＝0.5件衣服。"}, {"stem": "承第16題，王阿姨生產「1件衣服」的機會成本是多少？", "opts": [["A", "0.5件褲子"], ["B", "1件褲子"], ["C", "2件褲子"], ["D", "2件衣服"]], "ans": "A", "exp": "王阿姨一天可做1件褲子或2件衣服，生產2件衣服須放棄1件褲子，故1件衣服的機會成本為 1÷2＝0.5件褲子。"}, {"stem": "承第16題，若兩人不分工，各花1天做衣服、1天做褲子，2天總產量為褲子3件、衣服3件。若改為各自專門生產2天，總產量會變成多少？", "opts": [["A", "褲子2件、衣服2件"], ["B", "褲子3件、衣服3件"], ["C", "褲子4件、衣服4件"], ["D", "褲子6件、衣服1件"]], "ans": "C", "exp": "朱老闆專做褲子2天為 2×2＝4件；王阿姨專做衣服2天為 2×2＝4件，總產量為褲子4件、衣服4件，皆多於分工前的3件。"}, {"stem": "承上題的計算結果，最能得到下列何項結論？", "opts": [["A", "分工後總產量減少，所以不應該分工"], ["B", "專業化生產的利益大於自給自足，分工後再交易對雙方都有利"], ["C", "分工只對原本產量較多的一方有利"], ["D", "分工必然會使產品的品質下降"]], "ans": "B", "exp": "分工後褲子與衣服的總產量都增加，代表專業化生產所帶來的利益大過自給自足，因此分工再交易可互蒙其利。"}, {"stem": "A工廠一天工作8小時可製作100件衣服或50件褲子；B工廠一天工作8小時可製作50件衣服或100件褲子。下列判斷何者正確？", "opts": [["A", "A工廠應該專門製作褲子"], ["B", "B工廠製作衣服的機會成本較A工廠低"], ["C", "A工廠專做衣服、B工廠專做褲子，可使總產量提高"], ["D", "兩間工廠都應該衣服與褲子各做一半"]], "ans": "C", "exp": "A工廠做衣服產量多、機會成本低；B工廠做褲子產量多、機會成本低。各自專業化生產可使兩項產品的總產量都增加。"}, {"stem": "承上題，A工廠生產「1件褲子」的機會成本是幾件衣服？", "opts": [["A", "2件"], ["B", "1件"], ["C", "0.5件"], ["D", "4件"]], "ans": "A", "exp": "A工廠同樣時間可做100件衣服或50件褲子，生產50件褲子須放棄100件衣服，故1件褲子的機會成本為 100÷50＝2件衣服。"}, {"stem": "下表為小南與Andy每小時可製作的份數：小南可做炒飯6份或炒麵2份；Andy可做炒飯4份或炒麵4份。若兩人要分工，最有效率的安排是下列何者？", "opts": [["A", "小南專做炒麵，Andy專做炒飯"], ["B", "兩人都專門做炒飯"], ["C", "兩人都專門做炒麵"], ["D", "小南專做炒飯，Andy專做炒麵"]], "ans": "D", "exp": "小南做1份炒飯的機會成本為 2÷6＝1/3份炒麵，Andy為 4÷4＝1份炒麵，小南炒飯機會成本較低；反之Andy做炒麵的機會成本較低，故如此分工。"}, {"stem": "承上題，小南生產「1份炒麵」的機會成本是多少份炒飯？", "opts": [["A", "1份"], ["B", "3份"], ["C", "1/3份"], ["D", "6份"]], "ans": "B", "exp": "小南每小時可做炒飯6份或炒麵2份，做2份炒麵須放棄6份炒飯，故1份炒麵的機會成本為 6÷2＝3份炒飯。"}, {"stem": "甲國以一單位資源可生產8噸稻米或2輛汽車；乙國以一單位資源可生產4噸稻米或4輛汽車。依機會成本判斷，兩國應如何進行專業化生產？", "opts": [["A", "甲國生產稻米，乙國生產汽車"], ["B", "甲國生產汽車，乙國生產稻米"], ["C", "兩國都應該生產稻米"], ["D", "兩國都應該生產汽車"]], "ans": "A", "exp": "甲國1噸稻米的機會成本為 2÷8＝0.25輛汽車，乙國為 4÷4＝1輛，甲國生產稻米機會成本較低；汽車方面乙國機會成本較低，故甲國專產稻米、乙國專產汽車。"}, {"stem": "承上題，甲國生產「1輛汽車」的機會成本是多少？", "opts": [["A", "0.25噸稻米"], ["B", "2噸稻米"], ["C", "4噸稻米"], ["D", "8噸稻米"]], "ans": "C", "exp": "甲國同樣資源可生產8噸稻米或2輛汽車，生產2輛汽車須放棄8噸稻米，故1輛汽車的機會成本為 8÷2＝4噸稻米。"}, {"stem": "在判斷「誰該生產什麼」時，除了比較產量（生產力）之外，課本還特別強調用下列何種概念來判斷？", "opts": [["A", "產品在市場上的售價高低"], ["B", "生產該產品時所須放棄的機會成本高低"], ["C", "生產者的年齡與性別"], ["D", "政府所提供的補助金額多寡"]], "ans": "B", "exp": "課本先從「生產力」觀察誰的產量較多，再進一步以「機會成本」判斷誰生產某項產品比較划算，機會成本較低者應專門生產該產品。"}, {"stem": "大雄和小夫都會修電腦與寫程式。大雄一天可修好6臺電腦或寫完2個程式；小夫一天可修好2臺電腦或寫完2個程式。下列敘述何者正確？", "opts": [["A", "大雄應該專門寫程式"], ["B", "小夫修電腦的機會成本比大雄低"], ["C", "兩人各做一半的工作最有效率"], ["D", "大雄專門修電腦、小夫專門寫程式，兩人的總產出較多"]], "ans": "D", "exp": "大雄修1臺電腦的機會成本為 2÷6＝1/3個程式，小夫為 2÷2＝1個程式；大雄寫1個程式須放棄3臺電腦，小夫只須放棄1臺。故大雄專修電腦、小夫專寫程式。"}, {"stem": "「一個國家應該出口自己生產機會成本較低的商品，進口生產機會成本較高的商品。」關於這句話，下列敘述何者正確？", "opts": [["A", "說明各國應專業生產具相對優勢的產品，再透過貿易各取所需"], ["B", "表示每個國家都應該只出口而不進口"], ["C", "表示機會成本較高的商品應該加強生產"], ["D", "表示國際貿易對進行貿易的雙方都不利"]], "ans": "A", "exp": "各國專門生產機會成本較低（具相對優勢）的產品，再透過國際貿易交換，可以較低成本各取所需、互蒙其利。"}, {"stem": "某國生產晶片的機會成本低於其他國家，生產小麥的機會成本則高於其他國家。依課本所述，該國最可能的貿易選擇是下列何者？", "opts": [["A", "出口小麥、進口晶片"], ["B", "晶片與小麥都出口"], ["C", "出口晶片、進口小麥"], ["D", "晶片與小麥都不進行貿易"]], "ans": "C", "exp": "各國會出口具生產優勢（機會成本較低、價格較低）的產品，進口不具生產優勢的產品，故該國應出口晶片、進口小麥。"}, {"stem": "下列關於「國際貿易」的敘述，何者正確？", "opts": [["A", "只有商品可以進行國際貿易，服務則不可以"], ["B", "國際貿易只對出口國有利，對進口國毫無好處"], ["C", "國際貿易的成本完全不包含跨越國界的運輸費用"], ["D", "國際貿易是不同國家的原料、商品或服務跨越國境進行交易"]], "ans": "D", "exp": "國際貿易的標的包含原料、商品與服務；除生產成本外還須負擔跨國運輸等成本，且基於自願的交易對買賣雙方都有利。"}, {"stem": "「進口」是指下列何者？", "opts": [["A", "把本國生產的商品賣到國外，藉此賺取貿易收入"], ["B", "向其他國家買進商品或服務，本國的資金因而流向他國"], ["C", "政府對外國商品課徵關稅的行為"], ["D", "廠商在國內不同縣市之間運送貨物"]], "ans": "B", "exp": "進口是向其他國家買進財貨或勞務，須支付貿易支出，資金由本國流向他國；(A) 為出口的定義。"}, {"stem": "某國廠商將產品出口到他國，除了生產成本外還須負擔跨國運輸等費用。該廠商仍願意出口，最可能的原因是下列何者？", "opts": [["A", "即使加上運輸等成本，出口之後仍然有利可圖"], ["B", "政府強制規定廠商一定要出口"], ["C", "出口商品完全不需要支付任何成本"], ["D", "這項商品在國內完全賣不出去"]], "ans": "A", "exp": "課本指出，廠商若願意將商品出口到其他國家，代表把運輸等成本一併算入後，在這筆貿易中仍有利可圖。"}, {"stem": "某跨國企業從自然資源豐富的國家購買原料，在科技人才較多的國家進行研發，再到勞工眾多的國家大量製造。這種現象稱為下列何者？", "opts": [["A", "進口替代"], ["B", "非價格競爭"], ["C", "國際分工"], ["D", "自給自足"]], "ans": "C", "exp": "企業運用各地最有利的生產條件，把不同階段的生產活動分散到各國，即為國際分工，也是國際貿易發展的基礎。"}, {"stem": "跨國企業將生產活動分散到世界各地，最主要的目的是下列何者？", "opts": [["A", "增加各國政府的稅收收入"], ["B", "運用各地最有利的生產條件，以降低成本、追求更多利潤"], ["C", "讓每個國家都能回到自給自足的狀態"], ["D", "避免產品在國際市場上流通"]], "ans": "B", "exp": "跨國企業布局全球分工，是為了利用各地的生產優勢降低生產成本，創造更大的利潤。"}, {"stem": "當越南生產成衣的機會成本低於臺灣時，最可能出現下列何種情況？", "opts": [["A", "越南向臺灣進口成衣，使臺灣成衣的價格更低"], ["B", "兩國成衣的價格必然完全相同"], ["C", "臺灣出口成衣到越南可以獲利"], ["D", "越南成衣價格低於臺灣，越南出口成衣至臺灣有利可圖"]], "ans": "D", "exp": "機會成本較低會反映為較低的價格，越南成衣價格低於臺灣，出口到臺灣可提高銷貨收入；臺灣則因價格較高而進口成衣。"}, {"stem": "我國廠商能夠打入國際電動車供應鏈，主要是因為我國在電子零組件的生產上具有相對優勢。這個例子最能說明下列何者？", "opts": [["A", "各國專業生產自己具優勢的產品，再透過國際貿易互蒙其利"], ["B", "政府補助是決定國際貿易成敗的唯一關鍵"], ["C", "電動車產業完全不需要國際分工"], ["D", "我國盛產汽車製造所需的各種天然原料"]], "ans": "A", "exp": "我國在電子零組件具生產優勢，因此能在國際分工體系中承接電動車零組件的生產，透過貿易讓各國各取所需。"}, {"stem": "現代國際貿易日益興盛，下列何者是重要的推動因素？", "opts": [["A", "各國陸續恢復自給自足的生活方式"], ["B", "山川地形的阻隔使跨國運輸成本大幅提高"], ["C", "交通與運輸技術進步，大幅降低跨國交易的成本"], ["D", "各國普遍加強管制，全面禁止商品進出口"]], "ans": "C", "exp": "過去受山川地形阻隔，貿易成本過高；現今運輸系統發達，降低了國際貿易成本，使商品在世界各地流通成為普遍現象。"}, {"stem": "我國於西元2002年加入下列哪一個組織之後，逐步解除貿易管制、開放外國商品進口？", "opts": [["A", "聯合國（UN）"], ["B", "世界貿易組織（WTO）"], ["C", "世界衛生組織（WHO）"], ["D", "亞太經濟合作會議（APEC）"]], "ans": "B", "exp": "我國早期為保護本國產業而管制外國商品，2002年加入世界貿易組織（WTO）後便逐步解除貿易管制、開放進口。"}, {"stem": "隨著國際分工日益盛行，也可能帶來下列何種問題？", "opts": [["A", "世界各國之間的貧富差距日益縮小"], ["B", "跨國企業的生產完全不會影響當地環境"], ["C", "提供勞動與原料的開發中國家獲得大部分利潤"], ["D", "掌握資金與技術的先進國家獲取多數利潤，全球貧富差距擴大"]], "ans": "D", "exp": "國際分工下，先進國家掌握資金與技術而取得大部分利潤，開發中國家僅獲少量利益，並可能伴隨跨國汙染、破壞環境、剝削勞工等問題。"}, {"stem": "臺灣開放外國米進口後，對本國消費者而言最直接的影響是下列何者？", "opts": [["A", "只能購買國產米，選擇變得更少"], ["B", "米的價格一定會大幅上漲"], ["C", "可以用較低的價格買到米，而且選擇更加多樣"], ["D", "消費者完全不會受到任何影響"]], "ans": "C", "exp": "進口米價格低於國產米，消費者除了能以較低價格購買外，還多了不同產地的選擇，是開放進口對消費者的主要利益。"}, {"stem": "臺灣開放外國米進口後，對本國稻農最可能造成的衝擊是下列何者？", "opts": [["A", "國產米價格高於進口米而銷售不利，甚至可能不敷成本而放棄生產"], ["B", "國產米的售價一定會跟著提高"], ["C", "稻農的生產成本會自動下降"], ["D", "政府必定會禁止進口米在市場上銷售"]], "ans": "A", "exp": "臺灣耕地有限、難以大量生產降低單位成本，國產米價格高於進口米而不利競爭；若降價又可能不敷成本，只好放棄生產或轉型。"}, {"stem": "彰化社頭鄉的織襪業在開放中國、東南亞襪子進口後大受衝擊，許多工廠關廠或將生產線移往國外。這個案例最能說明開放進口的何種影響？", "opts": [["A", "對本國的消費者相當不利"], ["B", "會使進口國的產品價格普遍上漲"], ["C", "會使本國生產者的獲利大幅增加"], ["D", "本國生產者面臨價格競爭壓力，並可能影響在地就業機會"]], "ans": "D", "exp": "進口品價格較低，本國廠商銷售受影響，可能關廠或外移，連帶衝擊本國勞工的工作機會，這是開放進口對生產者的弊端。"}, {"stem": "承上題，社頭織襪業者後來開發客製化、機能型襪子，並結合文創與觀光體驗活動。這種因應方式最接近下列何者？", "opts": [["A", "以低於成本的價格進行削價競爭"], ["B", "以非價格競爭的方式進行產業轉型與升級"], ["C", "要求政府全面禁止外國襪子進口"], ["D", "停止生產，並將全部資金轉投入房地產"]], "ans": "B", "exp": "研發創新、加入本土元素、發展文創與體驗活動，都不是靠降價取勝，而是以產品差異化吸引消費者，屬於非價格競爭。"}, {"stem": "下列何者屬於本國廠商面對進口品競爭時可採取的「非價格競爭」策略？", "opts": [["A", "研發新款式、塑造品牌形象、提升售後服務品質"], ["B", "大幅降低售價，直到價格低於生產成本"], ["C", "遊說政府全面禁止所有外國商品進口"], ["D", "減少原料用量以壓低產品品質"]], "ans": "A", "exp": "非價格競爭是以價格以外的方式提升競爭力，例如研發新產品、提升服務品質、塑造品牌形象、採用新生產技術、結合文創活動等。"}, {"stem": "面對開放進口，政府為減少對本國產業的衝擊，較適當的做法是下列何者？", "opts": [["A", "直接發放現金給所有消費者"], ["B", "禁止本國廠商將商品出口到國外"], ["C", "健全法規以確保公平競爭，並協助廠商轉型、提升品質與服務"], ["D", "規定本國商品一律不得調整價格"]], "ans": "C", "exp": "政府可健全法規確保公平競爭，協助廠商轉型、提升產品品質與服務，並積極擴展國際市場協助出口，以提高本國產業競爭力。"}, {"stem": "政府要求進口食品必須清楚標示產地，並建立更完善的相關法規。這樣的做法主要是為了下列何者？", "opts": [["A", "提高本國廠商產品的售價"], ["B", "保障消費者的權益與食品安全"], ["C", "減少本國商品的出口數量"], ["D", "增加進口商所能獲得的利潤"]], "ans": "B", "exp": "當消費者對進口商品有安全疑慮時，政府應做好把關，要求清楚標示並建立周全法規，以確保消費者權益。"}, {"stem": "關於開放外國產品進口的利與弊，下列敘述何者最完整正確？", "opts": [["A", "只對消費者有利，對本國生產者也完全有利"], ["B", "只對本國生產者有利，對消費者不利"], ["C", "對消費者與生產者都完全不利"], ["D", "消費者可買到較便宜、多樣的產品，但本國生產者面臨競爭壓力，可能造成失業問題"]], "ans": "D", "exp": "國際貿易讓各國以較低成本各取所需，消費者受惠；但本國生產者面臨價格競爭，須留意失業與所得分配不均的問題。"}, {"stem": "臺南後壁「無米樂」社區在我國加入WTO後，稻作禁不起進口農產的低價競爭而被迫休耕；後來社區發展農村生活體驗、以冠軍米行銷割稻飯，並開設民宿、設計文創商品。這個轉型的意義最接近下列何者？", "opts": [["A", "生產者面對進口競爭時，可透過轉型創造新的競爭優勢"], ["B", "生產者應完全放棄農業並移居他國"], ["C", "政府應該禁止一切農產品進口"], ["D", "消費者從此再也無法買到任何稻米"]], "ans": "A", "exp": "無米樂社區將農業結合觀光與文創，開創新的收入來源，說明本國生產者可藉由轉型與升級來因應開放進口的衝擊。"}, {"stem": "長途跨國運送商品容易造成大量的碳排放。這提醒我們在享受國際貿易帶來的便宜與多樣商品時，也應注意下列何者？", "opts": [["A", "應該立即完全停止所有的國際貿易"], ["B", "國際貿易可能對環境造成負擔，須一併思考永續發展的問題"], ["C", "碳排放的多寡與國際貿易毫無關聯"], ["D", "進口商品一定比本國生產的商品更環保"]], "ans": "B", "exp": "國際貿易長途運送貨物會產生大量碳排放、汙染環境並加重溫室效應，這是享受貿易利益時必須一併思考的代價。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

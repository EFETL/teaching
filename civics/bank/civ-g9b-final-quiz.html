<script>
const QS=[{"stem": "課本提到，國與國之間的商品、技術、資金、文化、人口、資訊等呈現跨國界流動，使國際往來日益密切。這樣的發展過程稱為什麼？", "opts": [["A", "都市化"], ["B", "工業化"], ["C", "全球化"], ["D", "民主化"]], "ans": "C", "exp": "全球化是指商品、技術、資金、文化、人口、資訊等跨越國界流動，使各國往來日益密切、逐漸融為一體的發展過程。"}, {"stem": "「全球化」一詞大約始於何時？", "opts": [["A", "二十世紀後半葉"], ["B", "十五世紀大航海時代"], ["C", "十八世紀工業革命初期"], ["D", "二十一世紀網際網路普及後"]], "ans": "A", "exp": "課本開宗明義指出「全球化」一詞始於二十世紀後半葉，其過程促進了國與國之間的相互連結。"}, {"stem": "下列何者「不是」課本所列促成全球化發展的主要因素？", "opts": [["A", "國際貿易"], ["B", "人口老化"], ["C", "交通運輸"], ["D", "資訊科技"]], "ans": "B", "exp": "課本列舉的全球化成因為國際貿易、交通運輸、資訊科技及傳播媒體。人口老化屬於人口結構議題，不是全球化的成因。"}, {"stem": "小明在臺灣的超市買到紐西蘭進口的奇異果。這個現象最能直接說明全球化的哪兩項成因？", "opts": [["A", "資訊科技與傳播媒體"], ["B", "傳播媒體與政治合作"], ["C", "資訊科技與國際貿易"], ["D", "國際貿易與交通運輸"]], "ans": "D", "exp": "課本以奇異果為例，說明是國際貿易與交通運輸的發展，使經濟活動超越國與國的界限。"}, {"stem": "小華在家透過視訊軟體和遠在美國的表哥聊天，還同步收看NBA球賽。這最能說明全球化中的哪些因素縮短了時空距離？", "opts": [["A", "資訊科技與傳播媒體"], ["B", "國際貿易與交通運輸"], ["C", "國際組織與國際規範"], ["D", "跨國企業與國際分工"]], "ans": "A", "exp": "課本指出，能和遠方的人溝通、居家觀看國外球賽，是資訊科技與傳播媒體發達，促使時空距離縮短的結果。"}, {"stem": "課本用哪一個詞來形容全球化下「各國逐漸融為一體、無國界」的狀態？", "opts": [["A", "世界工廠"], ["B", "國際社會"], ["C", "地球村"], ["D", "聯合國"]], "ans": "C", "exp": "全球化使地域阻隔漸漸消失，各國彷彿住在同一個村落，形成「地球村」。"}, {"stem": "「某一國家發生的事件，往往會產生跨越國界的影響。」這種現象課本用哪一句話形容最貼切？", "opts": [["A", "各自為政"], ["B", "牽一髮而動全身"], ["C", "各人自掃門前雪"], ["D", "井水不犯河水"]], "ans": "B", "exp": "全球化形成相互依存、「牽一髮而動全身」的全球關連現象。"}, {"stem": "關於全球化的敘述，下列何者「錯誤」？", "opts": [["A", "使國與國之間相互依存的程度提高"], ["B", "地域阻隔對經濟、文化、政治活動的限制漸漸消失"], ["C", "是一個多面向且交互影響的發展過程"], ["D", "只影響經濟活動，與文化、政治無關"]], "ans": "D", "exp": "全球化是多面向的過程，課本明確從經濟、政治、文化三個面向討論，並非只影響經濟。"}, {"stem": "課本主要從哪三個面向來觀察生活中的全球化？", "opts": [["A", "教育、醫療、環境"], ["B", "商品、資金、人口"], ["C", "經濟、政治、文化"], ["D", "科技、法律、宗教"]], "ans": "C", "exp": "課本以人們較常討論的經濟全球化、政治全球化、文化全球化三個面向來說明全球化的過程。"}, {"stem": "「經濟活動跨越國界的全球現象」是下列何者的定義？", "opts": [["A", "經濟全球化"], ["B", "政治全球化"], ["C", "文化全球化"], ["D", "全球在地化"]], "ans": "A", "exp": "經濟全球化是指經濟活動跨越國界的全球現象，各國企業透過跨國分工、投資與技術轉移促成跨國貿易蓬勃發展。"}, {"stem": "課本以智慧型手機的生產為例說明經濟全球化。手機由多國企業分別負責設計、零組件與組裝，最能呈現下列哪一概念？", "opts": [["A", "文化位階"], ["B", "國際分工與全球供應鏈"], ["C", "公平貿易認證"], ["D", "政治全球化"]], "ans": "B", "exp": "智慧型手機的全球供應鏈由許多國家的企業共同合作形成，是跨國分工（國際分工）最典型的例子。"}, {"stem": "Nike、麥當勞、蘋果等企業業務遍及世界各地，商品與服務行銷全球。這類企業稱為什麼？", "opts": [["A", "國營企業"], ["B", "非政府組織"], ["C", "國際組織"], ["D", "跨國企業"]], "ans": "D", "exp": "業務跨越國界、遍及世界各地的企業稱為跨國企業，是經濟全球化最具代表性的推手。"}, {"stem": "下列哪一項「最不屬於」經濟全球化的表現？", "opts": [["A", "各國政府為減碳共同簽署氣候協議"], ["B", "我國廠商到東南亞設廠雇用當地勞工"], ["C", "外國資金購買我國股票與基金"], ["D", "跨國企業把技術移轉給海外分公司"]], "ans": "A", "exp": "各國政府成立國際組織、共同制訂政策以處理全球性問題，屬於政治全球化；其餘三項皆為經濟活動的跨國流動。"}, {"stem": "「各國政府為因應全球性問題，成立國際組織、共同制訂政策，各國內政也逐漸受到全球性規範約束。」這是指？", "opts": [["A", "經濟全球化"], ["B", "文化全球化"], ["C", "政治全球化"], ["D", "在地全球化"]], "ans": "C", "exp": "政治全球化強調各國以合作方式處理單一國家無法應對的議題，並使各國內政受全球性規範約束。"}, {"stem": "西元2015年聯合國195個成員國於氣候高峰會達成協議，共同致力減少碳排放以遏阻全球暖化。這個例子最能說明？", "opts": [["A", "強勢文化主導弱勢文化"], ["B", "跨國企業擴大貧富差距"], ["C", "交通運輸縮短時空距離"], ["D", "各國透過國際組織合作處理全球性問題"]], "ans": "D", "exp": "全球暖化非單一國家所能解決，需各國透過國際組織合作制訂政策，屬於政治全球化的典型例證。"}, {"stem": "各國之所以傾向以「合作」方式處理全球議題，最主要的原因是什麼？", "opts": [["A", "各國政府都想放棄主權"], ["B", "議題日益複雜，非單一國家所能應對"], ["C", "國際組織可以強制各國服從"], ["D", "合作可以完全消除國家之間的競爭"]], "ans": "B", "exp": "課本指出全球快速發展，各國需要處理的議題日益複雜，非單一國家所能應對，故逐漸傾向合作。"}, {"stem": "「文化跨越國界在全球流通的現象」是指下列何者？", "opts": [["A", "文化全球化"], ["B", "政治全球化"], ["C", "經濟全球化"], ["D", "文化位階化"]], "ans": "A", "exp": "文化全球化是指文化跨越國界在全球流通，使不同文化接觸日趨頻繁。"}, {"stem": "下列何者「不是」課本所述文化全球化可能產生的結果？", "opts": [["A", "因文化差異而產生文化衝突"], ["B", "相互截長補短，促成文化創新"], ["C", "各國文化完全消失、只剩一種語言"], ["D", "社會呈現文化多元並存的新風貌"]], "ans": "C", "exp": "文化全球化可能帶來衝突、創新與多元並存，雖有文化單一化的疑慮，但課本並未主張所有文化完全消失、只剩一種語言。"}, {"stem": "課本指出，在文化全球化過程中，往往是誰主導了進程並影響弱勢文化的發展？", "opts": [["A", "開發中國家的傳統文化"], ["B", "挾豐厚資源優勢的強勢文化"], ["C", "少數民族的地方語言"], ["D", "國際非政府組織"]], "ans": "B", "exp": "強勢文化挾豐厚資源優勢，往往主導文化全球化進程，影響弱勢文化的發展。"}, {"stem": "課本以美國好萊塢電影風靡全球為例，指出這可能造成什麼影響？", "opts": [["A", "使各國電影票房同步成長"], ["B", "促使各國政府提高關稅"], ["C", "使美國本土文化逐漸消失"], ["D", "改變他國民眾的生活習慣與價值觀，產生文化認同危機"]], "ans": "D", " em": "有些人認為國際移工的普及帶來負面影響，其主要理由是什麼？", "opts": [["A", "移工會使當地物價下跌"], ["B", "移工不願意學習當地語言"], ["C", "移工使各國勞動力嚴重過剩"], ["D", "移工常在他國遭遇文化歧視與衝突，人性尊嚴未受保護"]], "ans": "D", "exp": "課本指出移工雖能填補各國勞動力缺口，但常遭遇文化歧視與衝突，人性尊嚴未能受到保護。"}, {"stem": "穆斯林女性移工因戶外工作須戴頭巾、不吃豬肉，被雇主認為配合度低而引起爭執。這最能說明什麼？", "opts": [["A", "移工的工作能力普遍不佳"], ["B", "文化差異未被理解時，容易產生文化衝突"], ["C", "宗教信仰應該完全被禁止"], ["D", "政治全球化帶來的國際規範"]], "ans": "B", "exp": "頭巾與飲食戒律是宗教文化的一部分，雇主未理解其文化差異因而產生爭執，屬於典型的文化衝突。"}, {"stem": "近年臺灣開設許多清真餐廳，使國人品嘗異國料理，也讓穆斯林文化廣為民眾所知。這說明國際移工的哪一項正面影響？", "opts": [["A", "增添不同文化群體相互認識的契機"], ["B", "直接消除了各國的貧富差距"], ["C", "使我國不再需要引進外籍勞動力"], ["D", "讓臺灣的傳統飲食文化完全消失"]], "ans": "A", "exp": "移工在各國流轉能增添不同文化群體相互認識的契機，使人們懂得尊重包容彼此的文化差異。"}, {"stem": "面對國際移工的困境，下列何者「不是」課本提到各國政府採取的改善方式？", "opts": [["A", "透過立法維護移工權益"], ["B", "舉辦文化交流活動"], ["C", "限制移工在公共場所使用母語"], ["D", "增加學校多元文化課程時數"]], "ans": "C", "exp": "課本列舉立法保障、文化交流活動、生活適應輔導課程與增加多元文化課程時數等作法，目的是消弭刻板印象，而非限制移工使用母語。"}, {"stem": "西元2020年臺北市政府首度舉辦「菲律賓面具嘉年華」，引領市民與各國移工感受多元文化之美。此活動最主要的目的是什麼？", "opts": [["A", "增加政府稅收"], ["B", "促進文化交流，消弭對不同文化的刻板印象"], ["C", "鼓勵移工盡快返回母國"], ["D", "推廣我國商品外銷菲律賓"]], "ans": "B", "exp": "舉辦文化交流活動是為了消弭人們對不同文化的刻板印象，改善移工所面臨的困境。"}, {"stem": "日本動漫（如鬼滅之刃）風靡全球，各大串流平臺爭相取得播映權並推出周邊商品。這個現象同時展現了哪兩種全球化面向？", "opts": [["A", "政治全球化與經濟全球化"], ["B", "政治全球化與文化全球化"], ["C", "只有文化全球化"], ["D", "文化全球化與經濟全球化"]], "ans": "D", "exp": "動漫作品跨國流通屬文化全球化；串流平臺爭奪商機、周邊商品行銷全球則屬經濟全球化，兩者交互影響。"}, {"stem": "新冠肺炎疫情期間，人們無法外出仍能在家透過網路觀看各國動畫影集。這最能說明全球化的什麼影響？", "opts": [["A", "使國際貿易完全停止"], ["B", "使各國文化走向完全一致"], ["C", "資訊科技與傳播媒體消弭時空限制，改變休閒生活型態"], ["D", "使跨國企業全面退出海外市場"]], "ans": "C", "exp": "資訊科技與傳播媒體的進步消弭了時空環境限制，人們居家亦可透過網路滿足休閒娛樂需求，豐富了休閒生活型態。"}, {"stem": "臺灣鳳梨酥使用法國奶油、日本麵粉、紐西蘭起司粉製作，並結合臺式大餅內餡與西式酥餅皮。關於此例的敘述，下列何者最正確？", "opts": [["A", "同時呈現國際貿易帶來的食材流通與中西文化交流"], ["B", "表示臺灣傳統點心已完全被西方取代"], ["C", "說明政治全球化使各國統一食品標準"], ["D", "顯示我國已停止生產本土農產品"]], "ans": "A", "exp": "進口食材反映交通運輸與國際貿易發達（經濟面），中西合璧的作法則反映文化交流（文化面），兩者兼具。"}, {"stem": "跨國速食企業麥當勞進入法國後，改用綠色標誌、強調食材來自法國，並推出羊乳乾酪三明治等在地菜單。這種作法最適合稱為什麼？", "opts": [["A", "文化衝突"], ["B", "全球在地化"], ["C", "不公平貿易"], ["D", "政治全球化"]], "ans": "B", "exp": "跨國企業在全球拓展時，配合當地文化與口味調整產品與形象，稱為全球在地化（在地化），有助降低文化排斥、獲得當地認同。"}, {"stem": "「貢寮國際海洋音樂祭」參考國外音樂文化，創造屬於我國的流行音樂盛會。此作法的意義最接近下列何者？", "opts": [["A", "拒絕一切外來文化以保存傳統"], ["B", "讓本土文化完全被強勢文化取代"], ["C", "藉由國際組織約束他國文化輸出"], ["D", "將外來文化特色融入本土文化，形成在地特色"]], "ans": "D", "exp": "面對強勢文化衝擊，許多國家會將外來文化的特色融入本土文化中，貢寮國際海洋音樂祭即為此類「全球在地化」的例子。"}, {"stem": "有人指出跨國企業為降低成本，在薪資低廉的國家設立血汗工廠、雇用童工，並造成當地環境汙染。這段敘述凸顯全球化的哪些負面影響？", "opts": [["A", "文化單一化與文化認同危機"], ["B", "疾病跨國傳播與防疫困難"], ["C", "勞工權益受剝削與環境汙染"], ["D", "國際組織過度干預各國內政"]], "ans": "C", "exp": "血汗工廠與童工屬於勞動人權遭剝削的問題，染劑與農藥則造成環境汙染，二者都是經濟全球化被忽略的負面效應。"}, {"stem": "課本以「水能載舟，亦能覆舟」總結全球化。下列何者最符合課本期望公民採取的態度？", "opts": [["A", "覺察全球化的影響存在差異，各國應攜手共同面對衍生問題"], ["B", "全面反對全球化，恢復封閉的鎖國政策"], ["C", "完全接受全球化，不必檢討任何負面影響"], ["D", "把全球化的問題交給跨國企業自行解決"]], "ans": "A", "exp": "全球化利弊並存，課本主張人們應覺察其影響存在差異，各國願意共同面對全球化衍生的複雜問題，未來發展才值得期待。"}, {"stem": "隨著全球化的發展，許多議題成為國與國之間必須共同面對與承擔的責任。下列何者最能說明「任何國家都不能置身於國際社會之外」的理由？", "opts": [["A", "各國的主權範圍已經完全消失，國家不再是國際社會的成員"], ["B", "許多議題的影響會跨越國界，單一國家無法獨力解決"], ["C", "國際組織已經取代各國政府，直接管理各國內政事務"], ["D", "世界各國的政治制度已經統一，不需要再彼此協商"]], "ans": "B", "exp": "全球化使疾病、環境汙染、犯罪等問題跨越國界，任何國家都無法單獨處理，因此必須積極參與國際社會、透過各種互動方式共同解決。國家主權並未消失，國際組織也不能管轄各國內政。"}, {"stem": "國際社會的主要組成成員為何？", "opts": [["A", "只有跨國企業"], ["B", "只有國際組織"], ["C", "主要由國家組成，個人、國際組織與跨國企業也具有影響力"], ["D", "只有聯合國的會員國，非會員國不算國際社會成員"]], "ans": "C", "exp": "課本指出國際社會主要由國家組成，但在全球化下，個人、國際組織、跨國企業等也對國際社會具有一定的影響力，並非只有單一類型成員。"}, {"stem": "我國前衛生福利部部長與美國衛生部部長於西元2020年共同簽署「醫衛合作瞭解備忘錄」，強化雙邊醫療衛生合作。這屬於國際社會互動方式中的哪一種？", "opts": [["A", "國際合作"], ["B", "國際援助"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "A", "exp": "國際合作是指國與國之間為共同利益與目標，透過結盟或簽訂條約、協議等方式，進行資金、人才、技術等跨國合作。簽署醫衛合作備忘錄正是典型的國際合作。"}, {"stem": "我國選手在東京奧運會中奪得男子羽球雙打金牌，各國選手在賽場上公平競爭、彼此加油。這種互動方式最接近下列何者？", "opts": [["A", "國際援助"], ["B", "國際合作"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "D", "exp": "國際交流是指透過政府或民間團體的力量，進行經濟貿易、學術文化、藝術表演、體育競賽等跨國活動，藉此增進彼此情誼與了解。奧運屬於體育競賽的跨國交流。"}, {"stem": "財團法人國際合作發展基金會（國合會）派駐帛琉的技術團，透過「園藝推廣計畫」協助當地人民建立健康飲食觀念。這屬於哪一種國際互動方式？", "opts": [["A", "國際交流"], ["B", "國際衝突"], ["C", "國際援助"], ["D", "軍事同盟"]], "ans": "C", "exp": "國際援助是基於尊重人權與人道關懷的精神，對受災或低度開發國家給予人道賑災或經濟、技術等跨國援助。國合會派技術團協助帛琉屬於技術援助。"}, {"stem": "下列關於「國際衝突」的敘述，何者正確？", "opts": [["A", "可能因族群、宗教、政治、領土、資源等因素而產生"], ["B", "只會因為經濟因素而產生，與宗教、族群無關"], ["C", "一旦發生就必然導致戰爭，沒有其他解決方式"], ["D", "只發生在低度開發國家之間，已開發國家不會發生"]], "ans": "A", "exp": "國際間可能因族群、宗教、政治、領土、資源等多種因素產生衝突。衝突不必然導致戰爭，也可透過外交談判、經濟制裁或國際組織調解等非暴力方式處理。"}, {"stem": "課本提到「戰爭的結果通常只會替戰勝的一方帶來短暫的好處」，其主要用意是要說明什麼？", "opts": [["A", "戰爭是解決國際衝突最有效率的方式"], ["B", "只要能取得勝利，發動戰爭就值得"], ["C", "國際衝突無法避免，各國應積極擴充軍備"], ["D", "戰爭犧牲大量生命與資源，應採非暴力方式解決衝突"]], "ans": "D", "exp": "課本強調戰爭會犧牲大量無辜生命與耗損資源，對整體人類社會的影響是負面且長久的，因此應採取非暴力方式（如國際組織調解、達成停火協議）來消弭衝突、維護和平。"}, {"stem": "敘利亞內戰在美、俄及聯合國代表的調停下，交戰雙方簽下停火協議。這個例子最能說明下列哪一個概念？", "opts": [["A", "國際衝突只能靠武力解決"], ["B", "國際組織有助於調解衝突、維護和平"], ["C", "聯合國可以直接統治發生內戰的國家"], ["D", "國際援助是解決衝突的唯一方法"]], "ans": "B", "exp": "透過國際組織進行調解，可讓交戰雙方達成停火協議，說明國際組織是消弭衝突、維護國際和平的重要管道。"}, {"stem": "國際組織通常是如何組成的？", "opts": [["A", "由參與成員透過條約或協議的方式所組成"], ["B", "由聯合國祕書長直接指派各國加入"], ["C", "由全世界人民直接投票選舉產生"], ["D", "由跨國企業出資購買席次而成立"]], "ans": "A", "exp": "國際組織是由參與成員依所締結的條約或協議方式組成，用以處理國際事務或實現共同目標，並非由個人投票或企業出資決定。"}, {"stem": "下列何者「不是」課本所述參與國際組織的重要性？", "opts": [["A", "建立解決國際糾紛的溝通協調管道與互信基礎"], ["B", "加強國與國之間的交流與合作關係"], ["C", "使各會員國放棄主權，接受組織的統一領導"], ["D", "共同關注全球議題、維護國際安全與和平"]], "ans": "C", "exp": "參與國際組織的目的在於加強交流合作、建立互信、共同處理全球議題與維護和平，並不要求會員國放棄主權；國際組織也無權統一領導各國。"}, {"stem": "依「成員性質」區分，國際組織可分為哪兩大類？", "opts": [["A", "全球性國際組織與區域性國際組織"], ["B", "營利性國際組織與非營利性國際組織"], ["C", "已開發國家組織與開發中國家組織"], ["D", "政府間國際組織與國際非政府組織"]], "ans": "D", "exp": "依成員性質分為「政府間國際組織」（由主權國家透過條約或公約成立，具官方性質）與「國際非政府組織」（由民間人士組成的非營利、志願性組織，不具官方身分）。全球性與區域性則是依「議題範圍」區分。"}, {"stem": "下列關於「政府間國際組織」的敘述，何者正確？", "opts": [["A", "由民間人士自願組成，不具官方身分"], ["B", "由各主權國家透過簽訂條約或國際公約而成立，具官方性質"], ["C", "主要目的是為股東賺取利潤"], ["D", "任何個人只要繳交會費即可成為會員"]], "ans": "B", "exp": "政府間國際組織由各主權國家透過簽訂條約或通過具法律約束力的國際公約而成立，具有官方性質，其成員限主權國家，個人無法加入。"}, {"stem": "下列組織中，何者屬於「國際非政府組織」？", "opts": [["A", "聯合國"], ["B", "世界貿易組織"], ["C", "無國界醫生"], ["D", "亞太經濟合作會議"]], "ans": "C", "exp": "無國界醫生是由民間發起、全球性且獨立的國際醫療人道救援組織，屬於國際非政府組織。聯合國、世界貿易組織、亞太經濟合作會議皆屬政府間國際組織。"}, {"stem": "下列哪一組全部都屬於「政府間國際組織」？", "opts": [["A", "聯合國、世界貿易組織、世界衛生組織"], ["B", "綠色和平組織、無國界醫生、聯合國"], ["C", "台灣世界展望會、台灣路竹會、歐洲聯盟"], ["D", "國際特赦組織、東南亞國協、舊鞋救命協會"]], "ans": "A", "exp": "聯合國、世界貿易組織、世界衛生組織皆由主權國家組成，屬政府間國際組織。綠色和平、無國界醫生、國際特赦組織、台灣世界展望會、台灣路竹會、舊鞋救命協會皆為非政府組織。"}, {"stem": "下列哪一個國際組織屬於「區域性」國際組織？", "opts": [["A", "聯合國"], ["B", "歐洲聯盟"], ["C", "世界衛生組織"], ["D", "世界貿易組織"]], "ans": "B", "exp": "歐洲聯盟成立是為加強歐洲各國的經貿整合與團結合作，成員限於特定區域，屬區域性國際組織。聯合國、世界衛生組織、世界貿易組織則屬全球性國際組織。"}, {"stem": "各國政府面臨「全球普遍性議題」時，通常會透過下列何種組織來因應？", "opts": [["A", "區域性國際組織，如東南亞國協"], ["B", "只由本國政府單獨處理即可"], ["C", "只透過跨國企業處理"], ["D", "全球性國際組織，如聯合國、世界貿易組織"]], "ans": "D", "exp": "課本指出，面臨全球普遍性議題時會透過全球性國際組織（聯合國、世界貿易組織、世界衛生組織等）；面臨區域性議題時才透過區域性國際組織（歐盟、APEC、東協等）。"}, {"stem": "世界貿易組織（WTO）成立的主要目的為何？", "opts": [["A", "創造自由公平的貿易環境，降低會員國間的貿易障礙"], ["B", "統一各會員國的貨幣與稅制"], ["C", "派遣醫療團到戰亂地區進行義診"], ["D", "負責調停各國之間的軍事衝突"]], "ans": "A", "exp": "世界貿易組織是全球最重要的國際經濟組織之一，其成立是為了創造自由公平的貿易環境、確保會員國間的自由貿易並降低貿易障礙。醫療救援與軍事調停不是其職責。"}, {"stem": "非洲辛巴威因乾旱導致玉米收成大減，超過百萬民眾需要糧食援助，最可能由下列哪一個組織提供食物幫助民眾度過饑荒？", "opts": [["A", "世界貿易組織"], ["B", "亞太經濟合作會議"], ["C", "聯合國糧食及農業組織"], ["D", "國際奧林匹克委員會"]], "ans": "C", "exp": "聯合國糧食及農業組織負責糧食與農業相關事務，提供糧食援助以協助民眾度過饑荒。其餘三者分別處理貿易、區域經濟合作與體育賽事。"}, {"stem": "聯合國兒童基金會的主要工作內容為何？", "opts": [["A", "降低各國關稅、促進自由貿易"], ["B", "保障兒童的生存與發展"], ["C", "消滅地雷的製作與使用"], ["D", "舉辦國際體育競賽"]], "ans": "B", "exp": "聯合國兒童基金會是聯合國體系下的機構，致力於保障兒童的生存和發展。降低關稅為WTO職責、消滅地雷為國際反地雷組織的訴求。"}, {"stem": "課本提到「許多議題的處理，除了透過政府的國際組織，有時候也必須透過民間發起非政府的國際組織來彌補其不足」，其原因「不」包括下列何者？", "opts": [["A", "不同國家對各類全球議題的重視程度不一"], ["B", "各國會有個別國家利益的考量"], ["C", "政府間國際組織的參與成員必須為主權國家"], ["D", "政府間國際組織的成員國數目過少，無法運作"]], "ans": "D", "exp": "課本列舉的原因是各國重視程度不一、國家利益考量，以及參與成員必須為主權國家的限制，因此需要非政府組織彌補不足；並非因為成員數目太少而無法運作。"}, {"stem": "「無國界醫生」組織的主要工作為何？", "opts": [["A", "制定國際貿易規則"], ["B", "監督各國的選舉是否公平"], ["C", "對遭受戰爭肆虐、缺乏醫療資源地區的民眾提供基本醫療協助"], ["D", "協助各國政府訓練軍隊"]], "ans": "C", "exp": " 國際交流中的體育競賽"], ["B", "國際衝突的調解"], ["C", "基於人道關懷的國際援助"], ["D", "以貿易利益為目的的國際合作"]], "ans": "C", "exp": "派遣國際搜救隊前往受災國協助救援，是基於人權與人道關懷精神所進行的災難援助，屬國際援助的典型例子。"}, {"stem": "西元2022年俄羅斯進攻烏克蘭，造成數十萬人傷亡、百萬人逃離家園，也衝擊全球經濟。下列敘述何者最為適當？", "opts": [["A", "顯示國際衝突若以戰爭處理，影響是負面且長久的"], ["B", "顯示戰爭是解決領土爭議最理想的手段"], ["C", "顯示國際衝突不會影響其他國家"], ["D", "顯示國際組織應鼓勵各國以武力解決紛爭"]], "ans": "A", "exp": "俄烏戰爭造成大量傷亡與難民，並衝擊全球經濟市場，印證課本所言戰爭對整體人類社會的影響是負面且長久的，各國應以非暴力方式化解衝突。"}, {"stem": "當國際間發生衝突時，下列何者「不是」課本所提到的和平解決方式？", "opts": [["A", "外交談判"], ["B", "經濟制裁"], ["C", "透過國際組織調解，達成停火協議"], ["D", "出動軍隊發動戰爭"]], "ans": "D", "exp": "外交談判、經濟制裁與國際組織調解屬於非暴力的處理方式；發動戰爭則是暴力手段，會造成人員傷亡與國際社會的重大衝擊，並非和平解決之道。"}, {"stem": "我國警政署與多位外國警政首長共同討論防治跨境毒品犯罪問題。此類跨國打擊犯罪的行動屬於下列何者？", "opts": [["A", "國際援助"], ["B", "國際合作"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "B", "exp": "各國共同調查與打擊跨境恐怖活動、人口販賣、走私軍火、毒品等犯罪，是為了共同目標所進行的資金、技術與人才合作，屬於國際合作。"}, {"stem": "阿慧整理筆記時寫下：「①1949年兩岸分治　②1971年中華人民共和國取代我國進入聯合國　③1981年簽訂洛桑協議　④1991年以中華臺北名義加入APEC　⑤2002年以臺澎金馬個別關稅領域加入WTO」。下列推論何者最為正確？", "opts": [["A", "我國在國際參與受阻後，改以務實彈性的名稱與方式爭取參與空間"], ["B", "我國自1971年後便完全放棄參與所有國際組織"], ["C", "上述事件顯示我國已恢復以主權國家身分參與國際社會"], ["D", "上述事件與兩岸關係無關，純粹是經濟因素造成"]], "ans": "A", "exp": "這些事件顯示：兩岸關係與「一個中國」原則使我國無法以國名參與國際社會，但政府並未放棄，而是調整參與名稱與方式（中華臺北、臺澎金馬個別關稅領域、奧會模式）務實爭取國際空間。"}, {"stem": "身為國中生，下列哪一種作法最符合課本所強調的「以實際行動參與國際社會」？", "opts": [["A", "認為國際議題與自己無關，等長大再說"], ["B", "只關心國內新聞，避免接觸外國資訊"], ["C", "關注氣候變遷等全球議題，參與相關連署或社團，並落實環保行動"], ["D", "主張以武力回應國際上的不公平待遇"]], "ans": "C", "exp": "課本鼓勵學生培養世界公民素養：關注國際議題（如氣候變遷、性別平等、童工問題）、參加相關社團或連署、擔任親善大使或國際志工，以實際行動參與國際社會。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

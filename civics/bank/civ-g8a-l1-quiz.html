<script>
const QS=[{"stem": "關於「現代國家」的概念，下列敘述何者最正確？", "opts": [["A", "只要一群人生活在同一塊土地上，就可以稱為現代國家"], ["B", "現代國家自人類出現時就已存在，形式從未改變"], ["C", "現代國家是一群人在特定領土內組織政府、經營共同生活並擁有主權的政治性團體"], ["D", "部落與封建國家在組成要素上與現代國家完全相同"]], "ans": "C", "exp": "課本定義現代國家為「一群人在特定領土內組織政府、擁有主權的政治性團體」。現代國家是近代才形成的概念，與古代部落、封建國家不同。"}, {"stem": "小明整理筆記，寫下「現代國家的組成要素」。下列哪一組才是完整且正確的？", "opts": [["A", "人民、領土、政府、憲法"], ["B", "人民、領土、政府、主權"], ["C", "人民、領土、軍隊、主權"], ["D", "人民、國旗、政府、主權"]], "ans": "B", "exp": "三版課本一致指出，現代國家的組成要素為人民、領土、政府、主權四項，缺一不可。憲法、軍隊、國旗都不是國家的「組成要素」。"}, {"stem": "關於國家的形成過程，下列敘述何者最適當？", "opts": [["A", "人類為解決生存問題而群居，逐漸發展出部落、部落聯盟等政治組織，現代國家的概念則是近代才形成"], ["B", "國家是先有主權，才慢慢出現人民與領土"], ["C", "古代的部落聯盟因為有統治者，所以就是現代國家"], ["D", "國家的出現與人類的群居生活完全無關"]], "ans": "A", "exp": "課本指出人類以群居生活為主，為解決生存問題而組成部落、部落聯盟、封建國家等政治組織，這些組織雖可能自稱國家，但與近代才形成的「現代國家」概念不同。"}, {"stem": "阿德的父親原為外國人，經過歸化程序取得中華民國國籍。就國家組成要素而言，阿德的父親屬於下列何者？", "opts": [["A", "主權，因為他能參與國家決策"], ["B", "政府，因為他要接受政府管理"], ["C", "領土，因為他居住在我國境內"], ["D", "人民，因為他具有我國國籍"]], "ans": "D", "exp": "人民是構成國家的成員，凡具有一國國籍者即為該國國民。取得國籍的方式除了出生，也包括外國人經歸化程序取得，這都屬於「人民」這項要素。"}, {"stem": "下列關於「領土」的敘述，何者正確？", "opts": [["A", "領土只包括陸地，海洋與天空不算在內"], ["B", "領土是一國政府統治權所及的地理區域，包括領陸、領海與領空"], ["C", "領土面積愈大的國家，主權才愈完整"], ["D", "一國只能在自己的領陸上行使權力，領海與領空屬於全世界共有"]], "ans": "B", "exp": "三版課本一致說明，領土是一國統治權所能支配（所及）的地理區域，範圍包括領陸、領海與領空，是人民共同生活的基礎。領土大小與主權是否完整無關。"}, {"stem": "關於國家組成要素中的「政府」，下列敘述何者正確？", "opts": [["A", "政府就是國家，兩者完全相同"], ["B", "政府只負責制定法律，不負責執行"], ["C", "我國只有中央政府，沒有地方政府"], ["D", "政府是國家統治機關的總稱，負責處理國家公共事務"]], "ans": "D", "exp": "政府是國家統治機關的總稱，透過制定與執行法令、政策來處理國家公共事務，並可分為中央政府與各級地方政府分層負責。政府只是國家四要素之一，不等於國家。"}, {"stem": "「政府可以自行決定並執行國家的各項政策，不必聽命於任何外國。」這句話中「決定與執行政策」的部分，最能說明主權的何種特性？", "opts": [["A", "持續性"], ["B", "對外的獨立性"], ["C", "對內的最高性"], ["D", "政府的統治權"]], "ans": "C", "exp": "主權對內具有「最高性」，指國家能自行決定與執行政策，是國內最高的權力；對外則具「獨立性」，不受他國干涉。題幹強調「自行決定並執行政策」，屬於對內最高性。"}, {"stem": "我國與友邦簽署教育合作備忘錄，雙方以對等地位締約。此一情形最能展現主權的何種特性？", "opts": [["A", "對外的獨立性"], ["B", "對內的最高性"], ["C", "領土的完整性"], ["D", "政府的持續性"]], "ans": "A", "exp": "主權對外具有獨立性，不受任何國家或國際組織干涉，並能與他國建立「平等」的外交關係。以對等地位簽署條約或備忘錄，正是主權獨立性的展現。"}, {"stem": "太平洋島國吐瓦魯的領土由數個島礁組成，近年因海平面上升，可能成為第一個被海水淹沒的國家。若吐瓦魯的陸地完全消失，依課本對國家組成的說明，最主要會產生什麼問題？", "opts": [["A", "因為缺少「領土」這項要素，將難以繼續被視為一個國家"], ["B", "只要人民還在，其他三項要素都不重要"], ["C", "只要政府仍持續運作，國家要素就不受影響"], ["D", "領土並非國家組成要素，所以毫無影響"]], "ans": "A", "exp": "國家的四項組成要素缺一不可。領土是人民共同生活的基礎，也是統治權行使的範圍，一旦領土消失，國家便缺少了必要要素。"}, {"stem": "就「範圍」而言，國家與政府的關係為何？", "opts": [["A", "政府的範圍較廣，「政府」的概念包含「國家」"], ["B", "兩者範圍完全相同，可以互相替換使用"], ["C", "國家的範圍較廣，政府只是國家的要素之一，「國家」的概念包含「政府」"], ["D", "兩者互不相關，各自獨立存在"]], "ans": "C", "exp": "課本從範圍、權力、持續性三方面比較國家與政府。就範圍而言，國家是涵蓋人民、領土、政府、主權的整體概念，政府僅是其中一項要素，故國家包含政府。"}, {"stem": "下列關於國家與政府在「權力」上的區別，何者正確？", "opts": [["A", "國家擁有統治權，政府擁有主權"], ["B", "國家與政府都擁有主權，只是行使方式不同"], ["C", "政府的統治權與國家的主權彼此互相對立"], ["D", "國家擁有主權，政府擁有統治權，國家主權藉由政府行使統治權而得以彰顯"]], "ans": "D", "exp": "三版課本一致指出：國家擁有主權，政府擁有統治權；政府以公權力執行政策，使國家主權得以彰顯。主權屬於國家，不屬於政府。"}, {"stem": "有關國家與政府在「持續性」上的差異，下列敘述何者正確？", "opts": [["A", "政府是永久存在的，國家則經常改變"], ["B", "國家是永久且持續發展的整體，政府則較為短暫且可能因選舉或革命而更替"], ["C", "國家與政府都會因為選舉而消滅"], ["D", "兩者都不會改變，具有相同的穩定性"]], "ans": "B", "exp": "國家是長久存在、具持續性與穩定性的政治實體；政府則會隨制度變遷或政權轉移（如選舉、革命）而改變、被取代。"}, {"stem": "西元2024年英國由選舉獲勝的政黨組成新政府。依課本觀點，此事最可能造成下列何種結果？", "opts": [["A", "英國因政府更替而滅亡"], ["B", "英國的主權將移轉給該政黨所有"], ["C", "英國的領土範圍會隨新政府重新劃定"], ["D", "英國仍然存在，其國際地位也不受影響"]], "ans": "D", "exp": "國家具有持續性，政府則可能因選舉而更替。政府更替不代表國家滅亡，也不影響該國的國際地位，主權仍屬於國家與全體國民。"}, {"stem": "政府編列預算採購國防裝備、加強國軍訓練。這最符合國家存在的何項目的？", "opts": [["A", "保衛國家安全"], ["B", "發展社會福利"], ["C", "維持社會秩序"], ["D", "保障基本人權"]], "ans": "A", "exp": "課本列舉國家存在的目的包括保衛國家安全、維持社會秩序、保障基本人權、發展社會福利等。建立軍隊、推動國防與外交，是為維護領土完整與主權獨立，屬保衛國家安全。"}, {"stem": "政府設立日照中心照顧長者，並提供復康巴士服務行動不便者。這最符合國家存在的何項目的？", "opts": [["A", "保衛國家安全"], ["B", "發展社會福利"], ["C", "維持社會秩序"], ["D", "伸張司法正義"]], "ans": "B", "exp": "日照中心、復康巴士屬於照顧特定弱勢族群、提升生活品質的社會福利措施，對應「發展社會福利」的國家目的。"}, {"stem": "國家建立警察系統，除暴安良，使人民能安居樂業。這最符合國家存在的何項目的？", "opts": [["A", "保障基本人權"], ["B", "促進經濟發展"], ["C", "維持社會秩序"], ["D", "保存文化傳統"]], "ans": "C", "exp": "警察維護治安、除暴安良，主要功能是使社會生活安定有序，對應「維持社會秩序」。"}, {"stem": "國家制定法律，保障婦女在公共場所哺育母乳的權利；並成立多語服務平臺，協助新住民克服語言障礙。這兩項作為主要展現國家的何項目的？", "opts": [["A", "保衛國家安全"], ["B", "維持社會秩序"], ["C", "保障基本人權"], ["D", "保存文化傳統"]], "ans": "C", "exp": "保障哺乳權、協助新住民取得資訊與服務，都是使人民權利不受侵害並獲得平等對待，屬於保障基本人權。"}, {"stem": "依課本說明，現代民主國家中，國家存在的「最大目的」為何？", "opts": [["A", "制訂推動適當政策，謀求人民的生活福祉"], ["B", "擴張領土面積，成為世界大國"], ["C", "讓執政黨能長期掌握政權"], ["D", "累積國家財富，使政府擁有最多資源"]], "ans": "A", "exp": "課本明白指出，現代民主國家強調人民是國家的主體，國家應制訂推動適當政策，謀求人民的生活福祉，此為國家存在的最大目的。"}, {"stem": "下列何者最能說明「民主政治」的意義？", "opts": [["A", "由少數具專業能力的菁英決定所有公共政策"], ["B", "由軍隊維持秩序並掌握政權，人民只需服從"], ["C", "由政府決定人民能享有哪些權利，人民不得質疑"], ["D", "國家主權屬於全體人民，人民透過公平選舉賦予政府合法統治權"]], "ans": "D", "exp": "民主政治即「人民當家作主」，國家主權屬於國民全體，人民透過公平的定期選舉授權政府，政府施政須滿足人民需求，符合「主權在民」的精神。"}, {"stem": "依課本說明，民主政治的運作具有哪四項特色？", "opts": [["A", "民意政治、人治政治、政黨政治、責任政治"], ["B", "民意政治、法治政治、政黨政治、責任政治"], ["C", "民意政治、法治政治、專制政治、責任政治"], ["D", "菁英政治、法治政治、政黨政治、責任政治"]], "ans": "B", "exp": "三版課本一致列出民主政治的四大特色：民意政治、法治政治、政黨政治、責任政治。「人治」與「專制」正是民主政治所要避免的。"}, {"stem": "關於「民意政治」，下列敘述何者最正確？", "opts": [["A", "政府只要有多數民意支持，就可以不遵守法律"], ["B", "政府施政須以民意為依歸，制訂政策前應提供人民表達意見的機會"], ["C", "民意政治是指政府官員自行判斷人民想要什麼，不必詢問人民"], ["D", "民意政治是指人民必須無條件服從政府的政策"]], "ans": "B", "exp": "基於「主權在民」的理念，政府施政須以民意為依歸，政策制訂前應透過各種管道讓人民表達意見，確認多數民意所向並作為施政依據。"}, {"stem": "政府在規畫重大交通改革政策前，邀請民意代表、學者專家與社會大眾舉行座談會蒐集意見。這種蒐集民意的管道稱為什麼？", "opts": [["A", "公民投票"], ["B", "民意調查"], ["C", "公聽會"], ["D", "政黨輪替"]], "ans": "C", "exp": "公聽會是政府規畫重大政策時，邀請民意代表、學者專家、相關人員或社會大眾進行座談，以廣為蒐集意見作為決策參考的管道。"}, {"stem": "「政府必須依法行政，不得違法濫權而侵害人民的權利。」這句話最能說明民主政治的何項特色？", "opts": [["A", "法治政治"], ["B", "民意政治"], ["C", "政黨政治"], ["D", "責任政治"]], "ans": "A", "exp": "法治政治強調政府的組成與施政都須受法律規範，政府必須依法行政，以防止濫權、保障人民權利。"}, {"stem": "依課本對「法治政治」的說明，下列敘述何者正確？", "opts": [["A", "法律只用來約束人民，政府不受法律限制"], ["B", "法律由政府首長依個人意志隨時制定與修改"], ["C", "法律只約束政府，人民可以不必守法"], ["D", "法律由民意代表依法定程序制定，政府與人民都有遵守的義務"]], "ans": "D", "exp": "民主國家的法律是由民意代表依法定程序制定，政府必須依法行政，人民也應守法，共同維護社會秩序，兩者皆受法律約束。"}, {"stem": "下列關於「政黨」的敘述，何者最正確？", "opts": [["A", "政黨是由政府設立、負責執行政策的機關"], ["B", "民主國家通常只允許一個政黨存在"], ["C", "政黨的主要工作是替 舉授予執政者統治權，使政府權力具有正當性"]], "ans": "D", "exp": "民主國家的主權屬於國民全體，政府權力須經人民授權才具正當性。人民透過定期選舉賦予執政者組織政府與處理公共事務的權力，主權仍屬於全體人民。"}, {"stem": "下列何者最能表現「主權在民」的精神？", "opts": [["A", "人民以投票選出總統、副總統與民意代表，並可依法罷免不適任者"], ["B", "政府官員依自己的專業判斷決定所有政策，不必詢問人民"], ["C", "由軍隊決定國家領導人的人選"], ["D", "由執政黨自行決定下一任總統由誰擔任"]], "ans": "A", "exp": "主權在民指國家主權屬於全體人民。人民透過選舉授權執政者、必要時以罷免撤回授權，最能落實主權在民。"}, {"stem": "位於加勒比海的波多黎各為美國屬地，當地民眾雖擁有美國公民身分，可選舉當地行政首長與議會代表，但無權投票選舉美國總統，也不能申請美國政府的社會福利補助。下列何者可說明波多黎各人並未享有美國公民的完整權利？", "opts": [["A", "可以申請美國的社福補助"], ["B", "無權投票選舉美國總統"], ["C", "能選舉當地的行政首長"], ["D", "領土與美國本土的距離遙遠"]], "ans": "B", "exp": "波多黎各人擁有美國公民身分，卻無權選舉美國總統、也無法申請社福補助，可見其公民權利並不完整；能選舉當地首長與議會代表反而是其享有的權利，距離遠近則與權利完整與否無關。（康軒版補充案例）"}, {"stem": "民國113年1月，諾魯宣布與我國斷交，我國邦交國再減一國。就國家組成要素而言，邦交國與我國斷交主要涉及下列何項要素？", "opts": [["A", "人民"], ["B", "主權"], ["C", "領土"], ["D", "政府"]], "ans": "B", "exp": "主權對外具有獨立性，能與他國建立平等的外交關係。邦交國與我國斷交，表示其拒絕承認我國的主權，因此與「主權」這項要素最相關。（康軒版補充案例）"}, {"stem": "依康軒版課本對「政府」的說明，下列敘述何者正確？", "opts": [["A", "狹義的政府專指行政機關，廣義的政府則包括行政、立法、司法等機關"], ["B", "狹義的政府包括行政、立法、司法機關，廣義的政府只指行政機關"], ["C", "政府只有廣義一種用法，沒有狹義的說法"], ["D", "政府一詞專指地方政府，不包括中央政府"]], "ans": "A", "exp": "政府是國家統治機關的總稱；狹義專指行政機關，廣義則包括行政、立法、司法等機關，負責處理國家公共事務。（康軒版補充內容）"}, {"stem": "關於我國政府的層級，下列敘述何者正確？", "opts": [["A", "我國只有中央政府，沒有地方政府"], ["B", "地方政府擁有主權，中央政府只有統治權"], ["C", "中央政府與地方政府互不相干，各自獨立為國家"], ["D", "政府可分為中央政府與各級地方政府，分層負責制訂和執行法令及政策"]], "ans": "D", "exp": "一國的政府可分為中央政府與各級地方政府，分層負責制訂與執行法令及政策。主權屬於國家，各級政府行使的是統治權。"}, {"stem": "小美的媽媽原為外國籍，來臺結婚多年後經歸化程序取得中華民國身分證。關於此事，下列敘述何者最適當？", "opts": [["A", "她因此成為我國的「領土」要素之一"], ["B", "她雖有身分證，但仍不算我國國民"], ["C", "她已成為我國國民，可享有國家賦予的權利並負擔義務"], ["D", "取得國籍只能靠出生，歸化並非取得國籍的途徑"]], "ans": "C", "exp": "國籍取得途徑除出生外，也包括外國人經歸化程序取得。擁有一國國籍者即為該國國民，能享有國家賦予的權利，並須負擔義務。（南一版補充內容）"}, {"stem": "依南一版課本說明，「公權力」是指下列何者？", "opts": [["A", "人民監督政府是否違法的權利"], ["B", "政黨提名候選人參與選舉的權力"], ["C", "民意代表在議會質詢官員的權利"], ["D", "政府為維持社會秩序或增進公共利益所使用的權力"]], "ans": "D", "exp": "公權力是政府為維持社會秩序或增進公共利益所使用的權力。政府以公權力執行政策，使國家主權得以彰顯。（南一版補充內容）"}, {"stem": "課本指出民主政治雖然並非完美，卻成為現代國家發展的趨勢，主要理由為何？", "opts": [["A", "民主政治能讓執政黨長期穩定執政，不必改選"], ["B", "民主政治可以讓政府不受法律限制，施政效率最高"], ["C", "民主政治體現人人平等與尊重人權，並能透過選舉和平轉移政權"], ["D", "民主政治能保證國家不會發生任何社會問題"]], "ans": "C", "exp": "課本指出民主政治雖非萬能，但能實現人人平等與尊重人權，且定期選舉可和平轉移政權，避免國家因政權移轉而陷入動盪，因此成為現代國家發展的趨勢。"}, {"stem": "翰林版課本以緬甸為例：該國雖曾在軍方允許下舉行選舉，但軍方之後再度發動政變，引發內亂。相對地，若一國能順利完成政黨輪替，通常代表什麼意義？", "opts": [["A", "該國的主權因此發生改變"], ["B", "該國能和平轉移政府權力，代表民主制度較為健全成熟"], ["C", "該國人民因此失去結社自由"], ["D", "該國政黨受到軍方所控制"]], "ans": "B", "exp": "政黨輪替是不同政黨接替執政的情形。在民主國家，能和平轉移政權被視為民主制度健全的象徵；緬甸則因軍隊干政，即使舉辦選舉，政權也未必能和平轉移。（翰林版補充案例）"}, {"stem": "依翰林版課本說明，我國自1996年首次總統直選以來，共出現過幾次政黨輪替？", "opts": [["A", "三次，分別在西元2000年、2008年與2016年"], ["B", "一次，發生在西元2000年"], ["C", "兩次，分別在西元2008年與2016年"], ["D", "四次，每次總統大選都會政黨輪替"]], "ans": "A", "exp": "課本指出我國總統民選自1996年開始，共出現三次政黨輪替：2000年、2008年與2016年，每次都以和平方式完成政權轉移。（翰林版補充內容）"}, {"stem": "依翰林版課本說明，國家「最主要」的功能為何？", "opts": [["A", "保護人民的安全，透過組織軍隊、拓展外交，避免外來侵略"], ["B", "促進文化交流，讓國家在國際上更有名氣"], ["C", "舉辦各項體育賽事，增進人民的娛樂生活"], ["D", "增加政府稅收，讓國庫愈來愈充實"]], "ans": "A", "exp": "翰林版指出國家最主要的功能為保護人民的安全，透過組織軍隊、拓展外交以保國衛民；此外還普遍具有維護秩序、保障人權、發展經濟、促進文化、實施福利等功能。（翰林版補充內容）"}, {"stem": "甲、乙兩國因邊界線的劃定爭議不斷，多年來仍無法達成共識。此一爭議主要涉及國家的何項組成要素？", "opts": [["A", "人民"], ["B", "領土"], ["C", "政府"], ["D", "主權"]], "ans": "B", "exp": "邊界線的劃定，關係到一國統治權所及的地理區域範圍，因此與「領土」這項要素最直接相關。"}, {"stem": "某國通過修法，縮短外國民眾歸化取得該國國籍所需的年限。此一措施與國家的何項組成要素最相關？", "opts": [["A", "主權"], ["B", "領土"], ["C", "人民"], ["D", "政府"]], "ans": "C", "exp": "國籍是判斷「國民」身分的依據，取得國籍者即成為該國人民。修改歸化取得國籍的規定，直接影響國家「人民」這項要素。"}, {"stem": "阿宏在報告中寫下四句關於國家與政府的比較，其中何者正確？", "opts": [["A", "政府的概念包含國家"], ["B", "政府擁有主權，國家擁有統治權"], ["C", "國家會隨選舉更替，政府則永久存在"], ["D", "國家由人民、領土、政府、主權組成，政府僅為其中一項要素"]], "ans": "D", "exp": "國家包含政府（範圍）、國家有主權而政府有統治權（權力）、國家具持續性而政府會更替（持續性）。只有 (D) 完全符合課本說明。"}, {"stem": "下列哪一個情境「不」屬於民主政治四項特色的表現？", "opts": [["A", "政府在政策定案前舉辦民意調查蒐集人民意見"], ["B", "官員違法失職後依法接受處罰"], ["C", "國家領導人依個人喜好任意修改法律以鞏固權力"], ["D", "兩個以上政黨透過選舉公平競爭執政權"]], "ans": "C", "exp": "(A) 為民意政治、(B) 為責任政治（法律責任）、(D) 為政黨政治。(C) 統治者意志凌駕法律之上，屬於「人治」，正是民主政治與法治政治所要避免的情形。"}, {"stem": "小雅整理本課重點，下列哪一項敘述最符合課本內容？", "opts": [["A", "國家與政府是同一件事，可以互相取代"], ["B", "國家因人民需求而產生，藉由政府運作保障人民權益並提供服務，民主政治則是較符合現代社會潮流的制度"], ["C", "只要領土面積夠大，就一定能成為主權獨立的國家"], ["D", "民主政治的四項特色中，人民只需遵守法律，不必表達意見"]], "ans": "B", "exp": "課本開宗明義指出：國家因應人民的需求而產生，並藉由政府運作以落實保障人民權益、提供服務的目的；經時代演變，民主政治仍是較符合現代社會潮流的政治制度。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

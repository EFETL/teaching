<script>
const QS=[{"stem": "關於「社會福利」的意義，下列敘述何者最正確？", "opts": [["A", "由民間慈善團體自行募款救濟窮人的行為"], ["B", "政府對犯罪者施以處罰，以維持社會秩序的制度"], ["C", "政府整合國家與民間的資源，推動滿足民眾生活基本需求的措施"], ["D", "企業為提高員工向心力而發放的年終獎金與福利金"]], "ans": "C", "exp": "課本定義社會福利是「政府整合國家與民間的資源，推動滿足民眾生活基本需求的措施」。它由國家主導、整合民間力量，而非單純的民間慈善或企業員工福利。"}, {"stem": "社會福利又被稱為下列何者？", "opts": [["A", "社會安全制度"], ["B", "社會規範制度"], ["C", "志願結社制度"], ["D", "多元文化制度"]], "ans": "A", "exp": "社會福利又稱為「社會安全制度」（翰林、南一版即以「社會安全」為課名），強調由社會全體共同承擔風險、保障每個人生存的基本權利。"}, {"stem": "現代社會福利（社會安全）制度最早的起源，與下列何者關係最密切？", "opts": [["A", "美國獨立戰爭後民主政治的推展"], ["B", "第二次世界大戰後聯合國的成立"], ["C", "中國古代政府設置的義倉制度"], ["D", "歐洲宗教組織對貧民的施捨與救濟"]], "ans": "D", "exp": "課本指出社會福利最早是在歐洲由宗教組織施捨與救濟貧民，宗教團體與富人以提供物資的方式協助貧病殘疾者，這是社會安全思維的源頭。"}, {"stem": "工業革命後，促使政府必須承擔更多社會福利責任的主要原因為何？", "opts": [["A", "各國人口大量減少，勞動力嚴重不足"], ["B", "雇主壓榨勞工，失業、貧窮與職業災害等問題日益嚴重"], ["C", "宗教團體被政府全面禁止從事救濟活動"], ["D", "民眾所得普遍提高，不再需要民間行善"]], "ans": "B", "exp": "18世紀工業革命後，經濟快速發展的同時也帶來職業災害、勞資對立、貧富差距擴大等問題，弱勢群體處境更加困難，於是政府開始承擔起更多責任。"}, {"stem": "關於社會福利（社會安全）發展的演變，下列敘述何者正確？", "opts": [["A", "早期著重扶助弱勢，現代則更積極提升全民的生活福祉"], ["B", "早期由政府全面負責，現代改由宗教團體負責"], ["C", "早期已涵蓋全民，現代則限縮到只照顧低收入戶"], ["D", "早期與現代都只提供現金給付，不提供任何服務"]], "ans": "A", "exp": "課本說明早期的社會安全在扶助弱勢，現代的社會安全則更積極提升全民生活福祉，服務對象由少數弱勢擴大到全體國民。"}, {"stem": "課文提到「一個人若連基本生活都無法維持，就難以保有人性尊嚴」，其理由最主要為何？", "opts": [["A", "基本生活無虞的人才有資格參與選舉投票"], ["B", "沒有工作的人在法律上不受任何權利保障"], ["C", "缺乏基本生活保障時，個人將失去追求理想生活的選擇自由"], ["D", "貧窮的人比較容易觸犯法律而受到刑罰制裁"]], "ans": "C", "exp": "人性尊嚴的核心是「擁有選擇的自由」。當疾病、失業、天災等因素使人無法維持基本生存條件，便會妨礙個人追求理想生活的選擇自由，侵害人性尊嚴。"}, {"stem": "「每個人均為社會的一員，皆享有社會安全的權利。」這段話出自下列何者？", "opts": [["A", "中華民國憲法"], ["B", "世界人權宣言"], ["C", "社會救助法"], ["D", "全民健康保險法"]], "ans": "B", "exp": "這是《世界人權宣言》的宣示，強調人生而自由平等，每個人的基本生活都應受到保障，是社會安全制度的重要精神來源。"}, {"stem": "關於我國推動社會福利的法制基礎，下列敘述何者正確？", "opts": [["A", "社會福利屬於地方自治事項，中央政府不得介入"], ["B", "我國並未以法律規範社會福利，全憑政府施政決定"], ["C", "社會福利僅規定於刑法之中，違反者將受處罰"], ["D", "憲法將社會安全列為基本國策之一"]], "ans": "D", "exp": "我國憲法明文將社會安全列為基本國策之一，政府並依此制定社會福利基本法等法律，有系統地提供各項給付與服務。"}, {"stem": "我國於民國112年開始施行、將社會福利制度區分為七大項目的法律為下列何者？", "opts": [["A", "社會福利基本法"], ["B", "社會秩序維護法"], ["C", "志願服務法"], ["D", "消費者保護法"]], "ans": "A", "exp": "政府於民國112年開始實施《社會福利基本法》，依該法將我國社會福利制度分為社會保險、社會津貼、社會救助、福利服務、醫療保健、國民就業、社會住宅等七大項目。"}, {"stem": "關於「社會保險」的特色，下列敘述何者最正確？", "opts": [["A", "民眾可自由決定要不要投保，屬於任意性的保險"], ["B", "全部保險費由政府支付，民眾完全不必負擔"], ["C", "依法強制投保，被保險人有繳納保險費的義務"], ["D", "只有低收入戶才可以參加，一般民眾不得投保"]], "ans": "C", "exp": "社會保險是依法實施的強制性保險，被保險人有繳納保費的義務，政府也負擔部分費用，藉此將風險轉由社會共同分攤。"}, {"stem": "全民健康保險在我國社會福利制度中屬於下列哪一項？", "opts": [["A", "社會津貼"], ["B", "社會保險"], ["C", "社會救助"], ["D", "福利服務"]], "ans": "B", "exp": "全民健康保險是強制納保、須繳納保費、發生疾病事故時提供醫療給付的制度，屬於社會保險。"}, {"stem": "關於國民年金保險，下列敘述何者正確？", "opts": [["A", "只有公教人員與軍人才可以參加"], ["B", "屬於社會救助，不必繳納任何保險費"], ["C", "只保障已經退休的65歲以上老人"], ["D", "將未參加勞保等職業保險的國民納入保險"]], "ans": "D", "exp": "國民年金保險的納保對象為年滿25歲、未滿65歲且未參加任何職業保險的國民，使我國社會保險涵蓋的對象更完善。"}, {"stem": "政府依職業別辦理各種保險，下列何者「不」屬於依職業辦理的保險？", "opts": [["A", "勞工保險"], ["B", "農民健康保險"], ["C", "全民健康保險"], ["D", "軍人保險"]], "ans": "C", "exp": "勞保、農保、公教人員保險、軍人保險都是依職業別辦理的職業保險；全民健康保險則是以全體國民為對象的健康保險，並非依職業辦理。"}, {"stem": "下列何者是「社會救助」主要協助的對象？", "opts": [["A", "低收入戶及遭受急難、災害而生活陷入困境的國民"], ["B", "所有年滿25歲、未滿65歲的國民"], ["C", "想要轉換工作而參加職業訓練的上班族"], ["D", "全體有繳納健保費的被保險人"]], "ans": "A", "exp": "社會救助針對低收入戶、中低收入戶，以及遭受急難、災害或處於不利處境的國民，提供救助及緊急照顧，並協助其自立。"}, {"stem": "關於「社會津貼」的敘述，下列何者正確？", "opts": [["A", "必須先繳納保險費，發生事故後才能請領"], ["B", "針對有特殊需求且符合資格者，給予定期或一次性的現金給付"], ["C", "只提供服務與照顧，不會發放任何金錢"], ["D", "僅限低收入戶申請，一般家庭一律不得請領"]], "ans": "B", "exp": "社會津貼通常屬於普及性質，針對有特殊需求且符合資格的國民給予現金給付，以減輕家庭經濟負擔、彌補社會保險的不足，不需事先繳納保費。"}, {"stem": "政府為因應少子化而發放的生育津貼、育兒津貼，屬於下列哪一項社會福利？", "opts": [["A", "社會津貼"], ["B", "社會保險"], ["C", "醫療保健"], ["D", "社會住宅"]], "ans": "A", "exp": "生育津貼、育兒津貼是對符合資格者發放的現金給付，用以減輕家庭養育子女的經濟負擔，屬於社會津貼。"}, {"stem": "關於「社會保險」與「社會救助」的比較，下列敘述何者正確？", "opts": [["A", "兩者都必須先繳納保險費才能獲得給付"], ["B", "兩者都只針對低收入戶提供協助"], ["C", "社會保險由民間團體辦理，社會救助由政府辦理"], ["D", "社會保險須先繳保費再依事故給付，社會救助則不必繳費而依資格審查提供協助"]], "ans": "D", "exp": "這是本課最重要的辨別重點。社會保險採「先繳保費、再給付」，對象是全體被保險人；社會救助不需繳費，經資格審查後對經濟弱勢或遭逢急難者提供協助。"}, {"stem": "花蓮發生大地震後，政府對災民發放慰問金並協助災區重建。此措施屬於下列何者？", "opts": [["A", "社會保險"], ["B", "社會津貼"], ["C", "社會救助"], ["D", "國民就業"]], "ans": "C", "exp": "對遭受災害的國民提供生活補助與緊急照顧，屬於社會救助中的「災害救助」，並非需先繳保費的社會保險。"}, {"stem": "關於「福利服務」的敘述，下列何者最正確？", "opts": [["A", "以強制納保的方式分攤全民的生活風險"], ["B", "針對兒童、老人、身心障礙者等有照顧或服務需求者，提供適切的服務措施"], ["C", "專門興建只租不賣的住宅提供弱勢民眾承租"], ["D", "對失業者提供職業訓練與就業媒合"]], "ans": "B", "exp": "福利服務是針對不同群體（兒童、老人、身心障礙者等）的需求提供資源與協助，以家庭為中心、社區為基礎，就近提供服務。(A)為社會保險、(C)為社會住宅、(D)為國民就業。"}, {"stem": "各縣市政府提供身心障礙者「復康巴士」到宅接送服務，最符合下列哪一項社會福利？", "opts": [["A", "社會保險"], ["B", "社會住宅"], ["C", "醫療保健"], ["D", "福利服務"]], "ans": "D", "exp": "復康巴士是針對身心障礙者這個特定群體提供的生活照顧與服務措施，滿足其交通需求、提升生活品質與尊嚴，屬於福利服務。"}, {"stem": "下列何者屬於「醫療保健」這項社會福利的主要內容？", "opts": [["A", "健全衛生醫療照護體系，保障國民就醫權益，縮短國民健康差距"], ["B", "對低收入戶發放生活扶助金"], ["C", "提供房租補助減輕租屋負擔"], ["D", "對失業勞工提供職業訓練"]], "ans": "A", "exp": "醫療保健的重點在健全醫療照護體系、提升健康照護品質、保障全體國民的就醫權益，並縮短因經濟與環境劣勢造成的健康資源差距。"}, {"stem": "行政院推動「優化偏鄉醫療精進計畫」，完善山地與離島地區的醫療照護網絡。此舉最主要的目的為何？", "opts": [["A", "增加偏鄉地區的就業機會"], ["B", "提高偏鄉居民參加職業保險的比率"], ["C", "消弭城鄉之間健康照護資源的不平等"], ["D", "鼓勵偏鄉民眾多生育以改善少子化"]], "ans": "C", "exp": "該計畫屬於醫療保健，目的在完善偏遠地區醫療網絡，縮短城鄉健康照護差距，使全體國民都能獲得完善的健康照護。"}, {"stem": "下列何者屬於「國民就業」這項社會福利的內容？", "opts": [["A", "發放老年津貼給年長者"], ["B", "提供低收入戶醫療補助"], ["C", "補助民眾裝設樓梯升降椅"], ["D", "提供就業服務、職業訓練，並保障職業安全衛生與勞動權益"]], "ans": "D", "exp": "國民就業是政府提供就業服務與職業訓練使勞工能充分就業，並投入職業安全衛生工作以避免職業災害，保障勞動權益。"}, {"stem": "臺中市政府勞工局辦理「專業坐月子服務人才培訓班」，提升勞工的職場技能。此措施屬於下列何者？", "opts": [["A", "社會救助"], ["B", "國民就業"], ["C", "社會津貼"], ["D", "醫療保健"]], "ans": "B", "exp": "辦理職業訓練、提升勞工就業技能，是國民就業這項社會福利的典型措施，目的在使勞工能順利且充分就業。"}, {"stem": "關於政府興建的「社會住宅」，下列敘述何者正確？", "opts": [["A", "以低價出售給所有想要購屋的民眾"], ["B", "只提供給公教人員與軍人居住"], ["C", "採只租不賣的方式，以弱勢民眾為優先承租對象"], ["D", "由民間建商興建後自由訂價出租"]], "ans": "C", "exp": "社會住宅只租不賣、租金較低，以經濟或其他因素而居於弱勢處境的民眾為優先承租對象，目的在落實居住正義。"}, {"stem": "政府提供房租補助、租屋協助給有居住需求的弱勢家庭，最主要是為了實現下列何種理念？", "opts": [["A", "居住正義"], ["B", "言論自由"], ["C", "政黨政治"], ["D", "多元文化"]], "ans": "A", "exp": "提供宜居住宅、房租補助或津貼、租屋協助，是為了保障國民的居住權益、實現居住正義，讓人民不必買房也能滿足居住需求。"}, {"stem": "我國推動社會福利的經費主要來自下列何者？", "opts": [["A", "政府發行彩券的全部盈餘"], ["B", "民眾繳納的稅收與社會保險的保費"], ["C", "外國政府提供的無償援助"], ["D", "公務人員自願捐出的薪水"]], "ans": "B", "exp": "課本明白指出，社會福利的經費主要來自稅收與社會保險的保費，因此民眾誠實納稅與繳納保費，是社會福利順利運作的基礎。"}, {"stem": "歐洲各國大多具有完善的社會福利制度，因此這些國家通常出現下列何種情形？", "opts": [["A", "政府完全不必編列社會福利預算"], ["B", "民眾不必繳納任何稅金"], ["C", "社會福利完全由宗教團體負責"], ["D", "需要龐大稅收支應，租稅負擔率相對較高"]], "ans": "D", "exp": "完善的社會福利需要龐大財政支持，因此歐洲（尤其北歐）國家的租稅負擔率相對較高，正是「享受多少權利，就要承擔多少責任」的體現。"}, {"stem": "治療罕見疾病的藥物昂貴又不一定適用健保給付，因此罕見疾病基金會為患者募款、籌措醫療與生活費用。這個例子最能說明下列何者？", "opts": [["A", "民間力量可以彌補現行社會福利的不足"], ["B", "政府應完全退出社會福利的推動"], ["C", "社會保險的保費應該全部由患者負擔"], ["D", "罕見疾病患者不需要任何社會福利協助"]], "ans": "A", "exp": "當社會福利措施無法顧及所有弱勢群體的需求，或民眾不符合申請資格時，民間力量的投入正可以彌補其不足，共構福利社會。"}, {"stem": "身為國民，下列何種作為最能善盡個人對社會福利的責任？", "opts": [["A", "盡量都不看醫生以節省健保支出"], ["B", "誠實納稅並按時繳納社會保險保費"], ["C", "拒絕領取任何政府提供的補助"], ["D", "要求政府取消所有社會福利措施"]], "ans": "B", "exp": "社會福利經費主要來自稅收與保費，民眾誠實納稅、按時繳納保費，才能讓制度順利運作並發揮功能，這是個人最基本的責任。"}, {"stem": "下列何種行為最符合「建立正確使用社會福利資源」的觀念？", "opts": [["A", "為了方便就醫而到多家醫院重複領藥"], ["B", "要求醫師做非必要的檢查以「用回本」"], ["C", "以不實資料申請低收入戶補助"], ["D", "依實際需要就醫，避免浪費醫療與健保資源"]], "ans": "D", "exp": "社會福利資源有限，民眾應避免以違法或不當手段取得資格，也不應重複就醫取藥或要求不必要的檢查，才能讓資源分配給真正需要的人。"}, {"stem": "健保署統計顯示，民國112年有人1年就醫高達859次，大約1天跑2趟醫院。此現象最可能造成下列何種問題？", "opts": [["A", "提升全體國民的健康水準"], ["B", "使健保保費不斷降低"], ["C", "造成醫療與健保資源的浪費"], ["D", "提高醫療院所的服務品質"]], "ans": "C", "exp": "過度且非必要的就醫會消耗有限的醫療與健保資源，使真正需要的人難以獲得適切照護，是社會福利資源被浪費的典型例子。"}, {"stem": "我國貧窮率在西元2021年僅為1.3%，遠低於日本的15.6%與德國的16%。課文指出此數據背後隱含的問題為何？", "opts": [["A", "低收入戶審查門檻嚴格，使貧窮率被低估"], ["B", "我國國民所得已經超越日本與德國"], ["C", "我國社會福利支出為全世界最高"], ["D", "我國人口太少，統計上不具意義"]], "ans": "A", "exp": "我國以取得低收入戶資格者為貧窮人口，但審查門檻嚴格（例如假定民眾有基本工資收入），使貧窮率被低估，可能有數百萬貧窮人口被排除在補助之外。"}, {"stem": "單親媽媽美玉因身體癱瘓、行動不便而無法工作，卻因被認定「有工作能力」而無法通過低收入戶審查。針對這種情況，政府最適當的改善方向為何？", "opts": [["A", "制定新的職業保險，強制美玉投保"], ["B", "大量增加社會住宅的興建數量"], ["C", "嚴格執行工廠的勞動安全檢查"], ["D", "檢討並放寬社會救助的資格審查門檻"]], "ans": "D", "exp": "問題核心在於社會救助（低收入戶）審查門檻過高，使真正貧窮的民眾無法獲得補助，因此最直接的改善方式是修法降低申請資格門檻。"}, {"stem": "新北市等縣市與四大超商合作的「幸福保衛站」，為18歲以下遇到困難的學生提供餐點，採「救急不救窮」原則。此計畫最能說明下列何者？", "opts": [["A", "社會福利完全可以由超商業者獨力完成"], ["B", "社會保險應該擴大納保對象至全體學生"], ["C", "政府與民間合作，可以更即時滿足弱勢者的基本需求"], ["D", "學生的基本生活需求不屬於社會福利的範圍"]], "ans": "C", "exp": "幸福保衛站由地方政府結合民間超商與善款推動，是政府與民間通力合作、共同建構社會安全網的例子，能即時協助陷入困境的弱勢學生。"}, {"stem": "芒草心慈善協會設置專門安置女性無家者的收容所「潭馨園」，最主要的目標是協助她們找到穩定的工作，並能在外獨立租屋。此目標與下列哪兩項社會福利最有關？", "opts": [["A", "社會保險與醫療保健"], ["B", "社會住宅與國民就業"], ["C", "社會津貼與社會保險"], ["D", "醫療保健與社會津貼"]], "ans": "B", "exp": "「找到穩定工作」對應國民就業，「在外獨立租屋、不再無家可歸」對應社會住宅（居住權益的保障）。"}, {"stem": "政府推動強制投保的社會保險，最主要的精神為何？", "opts": [["A", "藉由社會互助，將個人的生活風險轉由社會共同分攤"], ["B", "讓收入愈高的人享有愈好的醫療品質"], ["C", "使政府可以增加稅收以平衡財政"], ["D", "讓民眾自行承擔所有生活上的風險"]], "ans": "A", "exp": "社會保險的核心精神是「社會互助、共同承擔風險」，透過全民繳費與政府補助，把個人可能面對的生、老、病、死、傷、殘、失業等風險由社會共同分攤。"}, {"stem": "全民健康保險不論國民繳交的健保費高低，均給予相同程度的健康照護。此設計最能展現下列何種精神？", "opts": [["A", "使用者付費，多繳費者多得到照顧"], ["B", "依社會地位高低分配醫療資源"], ["C", "自助與互助，保障全民平等的就醫權益"], ["D", "鼓勵民眾盡量多繳保費以換取更佳醫療"]], "ans": "C", "exp": "全民健保基於自助與互助精神規畫，保險對象不因身分或保費多寡而有不同醫療品質，使弱勢族群同樣享有平等的醫療資源。"}, {"stem": "關於「社會津貼」與「社會救助」的比較，下列敘述何者正確？", "opts": [["A", "兩者都必須先繳納保費才能請領"], ["B", "兩者都只以現金給付，不提供任何服務"], ["C", "社會津貼只給低收入戶，社會救助則人人可領"], ["D", "社會津貼較具普及性，社會救助則針對經濟弱勢與遭逢急難者"]], "ans": "D", "exp": "社會津貼屬普及性質，只要符合特定身分或需求（如生育、育兒、老年、身心障礙）即可請領；社會救助則以經濟弱勢或遭受急難、災害者為對象，需經資格審查。兩者皆不必先繳保費。"}, {"stem": "許多公寓沒有設置電梯，使行動不便的身障者或年長者外出不易，政府因此補助裝設樓梯升降椅。此措施最主要的目的為何？", "opts": [["A", "提高老舊公寓的房屋價格"], ["B", "滿足特定群體的需求，提升其生活品質與尊嚴"], ["C", "增加建築業者的工作機會"], ["D", "強制所有公寓都必須改建為電梯大樓"]], "ans": "B", "exp": "針對身心障礙者與年長者的行動需求提供協助，屬於福利服務的範疇，目的在滿足不同群體的需求，使其享有公平與尊嚴的生活。"}, {"stem": "教育部補助各縣市學校採購身心障礙學生交通車。此措施最主要保障下列何者？", "opts": [["A", "學校教師的勞動權益"], ["B", "學生家庭的居住權益"], ["C", "身心障礙學生的就學權益"], ["D", "交通運輸業者的營業利益"]], "ans": "C", "exp": "補助身心障礙學生交通車，是針對身心障礙這個特定群體提供的服務措施，目的在保障其就學權益，使其能與他人一樣接受教育。"}, {"stem": "面對高齡人口快速增加，下列哪一項政府措施屬於「福利服務」的範疇？", "opts": [["A", "為社區長者辦理共餐服務"], ["B", "發給退休勞工老年年金給付"], ["C", "提供長者免費健康檢查"], ["D", "興建樂齡社會住宅"]], "ans": "A", "exp": "共餐服務屬生活照顧面向，是針對長者需求就近提供的服務措施，屬福利服務。(B)屬社會保險給付、(C)屬醫療保健、(D)屬社會住宅。"}, {"stem": "為了因應少子化問題、減輕家長養育子女的經濟負擔，政府最可能採取下列何種措施？", "opts": [["A", "提高國民年金保險的投保年齡"], ["B", "提供育兒津貼與托育補助"], ["C", "加強辦理身心障礙者家務服務"], ["D", "擴大興建只租不賣的社會住宅"]], "ans": "B", "exp": "育兒津貼、生育津貼與托育補助都是以現金或費用補助方式減輕家長養育子女的負擔，是政府因應少子化最直接的社會津貼措施。"}, {"stem": "政府推動「脫貧自立計畫」，其中讓受助者以勞動換取收入的「以工代賑」，屬於下列哪一項社會福利？", "opts": [["A", "社會保險"], ["B", "社會津貼"], ["C", "醫療保健"], ["D", "社會救助"]], "ans": "D", "exp": "脫貧自立計畫與以工代賑，是政府為扶助經濟弱勢者維持基本生活並協助其自立、脫離對救助依賴的做法，屬於社會救助。"}, {"stem": "我國社會救助的內容主要包含下列何者？", "opts": [["A", "生活扶助、醫療補助、急難救助及災害救助"], ["B", "生育津貼、育兒津貼及老年津貼"], ["C", "全民健保、勞工保險及國民年金保險"], ["D", "職業訓練、就業媒合及職業安全衛生"]], "ans": "A", "exp": "社會救助的四大內容為生活扶助、醫療補助、急難救助及災害救助。(B)為社會津貼、(C)為社會保險、(D)為國民就業。"}, {"stem": "課文指出，僅依賴個人或民間團體行善，難以促成社會的公平正義。其主要理由為何？", "opts": [["A", "民間團體的行善行為都違反法律規定"], ["B", "政府禁止民間團體從事任何救助工作"], ["C", "行善是一種選擇而非責任義務，不易長久維持且力量有限"], ["D", "民間團體擁有的資源遠比政府還要多"]], "ans": "C", "exp": "行善必須行善者「願意」且「能夠」提供資源，屬於個人選擇而非義務，因此不易長期持續、力量也有限，必須由國家運用公權力建立制度才能普遍保障人民。"}, {"stem": "既然國家能運用公權力調度資源，為何仍需要民間團體參與社會福利？", "opts": [["A", "因為政府依法不得直接提供任何福利服務"], ["B", "因為民間團體熟悉在地情況，較能即時發現並協助周遭居民的需求"], ["C", "因為民間團體可以完全取代政府的社會福利責任"], ["D", "因為政府希望藉此大幅減少稅收"]], "ans": "B", "exp": "國家的經費與資源有限，而個人與民間團體基於對生活環境的熟悉，較能在第一時間知曉在地需求並提供即時協助，因此雙方需相互合作、共構福利社會。"}, {"stem": "政府運用國家資源建立「社會安全網」，其最主要的功能為何？", "opts": [["A", "監控國民的日常生活與消費行為"], ["B", "限制民眾自由遷徙與選擇職業"], ["C", "使國家的財政收入極大化"], ["D", "提供基本的生活保障，使每個人都能擁有選擇的自由"]], "ans": "D", "exp": "政府針對人民基本生活的各種需要，運用國家資源建立社會安全網，提供基本生活保障，讓每個人擁有選擇的自由，以實現具有人性尊嚴的生活。"}, {"stem": "下列哪一組「措施」與「所屬社會福利項目」的搭配是正確的？", "opts": [["A", "發放低收入戶生活扶助金——社會津貼"], ["B", "政府辦理免費流感疫苗接種——社會住宅"], ["C", "成立就業服務站並提供職業訓練——國民就業"], ["D", "民眾參加全民健康保險——社會救助"]], "ans": "C", "exp": "(A)生活扶助屬社會救助；(B)疫苗接種屬醫療保健；(D)全民健保屬社會保險；只有(C)搭配正確。"}, {"stem": "綜合本課內容，國家推動社會福利最根本的目的為何？", "opts": [["A", "保障國民的基本生活，維護人性尊嚴與選擇自由"], ["B", "增加政府的稅收以擴充國防武力"], ["C", "使民眾長期依賴補助而不必努力工作"], ["D", "由政府完全取代家庭與民間團體的所有功能"]], "ans": "A", "exp": "推動社會福利、保障個人基本生活是現代國家的重要責任，其根本目的在於讓每個人都能享有平等且有尊嚴的生活，保有追求理想生活的選擇自由。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "電視劇中的皇帝想處置大臣，可以直接下令執行；我國政府要限制人民出外旅行，卻必須經過法定程序。造成這種差別的關鍵因素是什麼？", "opts": [["A", "兩國的經濟發展程度不同"], ["B", "兩國的人口規模差距太大"], ["C", "統治者與法律之間的關係不同"], ["D", "兩國的國土面積大小不同"]], "ans": "C", "exp": "課本以「統治者與法律的關係」作為區分人治與法治的判準：人治是統治者凌駕於法律之上，法治則是統治者同樣受法律約束。"}, {"stem": "在人治的社會中，法律存在的主要目的是什麼？", "opts": [["A", "鞏固統治者的權力"], ["B", "保障人民的基本權利"], ["C", "限制政府機關的權力"], ["D", "促進各機關相互制衡"]], "ans": "A", "exp": "人治社會中統治者依自己的意思制定或修改法律，目的在鞏固自身權力，法律只是控制人民的工具。"}, {"stem": "依照課本對法治社會的說明，法律應該由誰來制定？", "opts": [["A", "由統治者本人依其意志制定"], ["B", "由行政機關首長逕行公布"], ["C", "由司法機關的法官共同決定"], ["D", "由人民選出的代表依程序制定"]], "ans": "D", "exp": "法治的核心之一是「人民選出的代表依法定程序制定或修改法律」，使法律具有民意基礎並能保障人民權利。"}, {"stem": "「法律的規定會隨著統治者的想法而任意改變，人民往往無所適從。」這句話描述的是哪一種社會？", "opts": [["A", "法治社會"], ["B", "人治社會"], ["C", "有限政府"], ["D", "分權社會"]], "ans": "B", "exp": "法律朝令夕改、標準隨統治者好惡而變動，是人治社會的典型特徵；法治社會的法律則具有明確且穩定的標準。"}, {"stem": "關於法治社會中「法律對統治者的影響」，下列敘述何者正確？", "opts": [["A", "統治者與人民同樣受到法律的約束"], ["B", "統治者可自行決定是否遵守法律"], ["C", "統治者站在法律之上不受約束"], ["D", "統治者可隨時修法使自己免責"]], "ans": "A", "exp": "法治是指法律同時約束統治者與人民，成為雙方共同遵守的最高規範，這正是它與人治最大的分野。"}, {"stem": "大華到農場打工，農場主人可以依當天的心情決定上班時間，也可以臨時取消午休。這種情況比較接近下列何者？", "opts": [["A", "法治，因為農場訂有明確的規則"], ["B", "法治，因為主人本來就有管理權"], ["C", "人治，因為勞動法令沒有相關規定"], ["D", "人治，因為主人的意思就等於規則"]], "ans": "D", "exp": "判斷人治或法治要看「規則由誰定、是否穩定、定規則者是否受拘束」。農場主人可依個人好惡任意變動規則且自己不受拘束，屬於人治。"}, {"stem": "如果由民選的立法者修法，取消統治者連任次數的限制，為什麼仍不算落實法治？", "opts": [["A", "因為修法的程序完全不合法定要件"], ["B", "因為修法的目的在鞏固統治者權力，而非保障人民權利"], ["C", "因為立法者並不是由人民選出來的"], ["D", "因為連任次數本來就不可以用法律規定"]], "ans": "B", "exp": "法治不只看「有沒有依程序修法」，更要看法律的目的。若修法只是為統治者擴權，法律就淪為鞏固權力的工具，實質仍是人治。"}, {"stem": "下列何者最能表現「依法行政」的精神？", "opts": [["A", "總統依個人判斷宣布全國戒嚴"], ["B", "公務員依上級的口頭指示辦事"], ["C", "警察執行酒駕臨檢須依法定程序進行"], ["D", "統治者為國家安全可暫時不受法律拘束"]], "ans": "C", "exp": "依法行政是指政府的作為必須有法律依據並依法定程序進行；臨檢雖是公權力的展現，程序仍受法律約束。"}, {"stem": "有人主張：「只要統治者夠聰明又有道德，國家其實不需要法律。」從法治的觀點來看，最適當的反駁是什麼？", "opts": [["A", "權力若不受法律限制，仍可能腐化並侵害人民權利"], ["B", "聰明的統治者一定會制定出更多的法律"], ["C", "道德的標準比法律的標準更容易衡量"], ["D", "統治者的道德可以交由法院加以審查"]], "ans": "A", "exp": "呼應艾克頓爵士「絕對的權力使人絕對腐化」的提醒：法治依靠制度而非個人品德，才能穩定保障人民權利。"}, {"stem": "在「人治與法治比較表」中，關於「法律執行標準」一欄，屬於法治的內容是下列何者？", "opts": [["A", "隨統治者的好惡而不斷變動"], ["B", "標準明確，統治者須依法而治"], ["C", "由行政首長逐案自行認定"], ["D", "依社會輿論的多寡隨時調整"]], "ans": "B", "exp": "法治社會的法律執行標準明確一致，人民可以預期法律的效果；標準隨統治者而變則是人治的特徵。"}, {"stem": "英國大憲章（Magna Carta）最重要的中心思想是下列何者？", "opts": [["A", "主權在民，國家權力屬於全體國民"], ["B", "政府權力應分為行政、立法、司法三種"], ["C", "國家應該建立政黨政治的運作方式"], ["D", "法律之前人人平等，國王也必須守法"]], "ans": "D", "exp": "大憲章要求國王必須遵守法律、不得任意徵稅，開啟「法律之前人人平等」的思想，使法律不再只是國王統治人民的工具。"}, {"stem": "洛克主張「政府應與人民訂立契約」，這項主張最主要的用意是什麼？", "opts": [["A", "擴大政府可以管理的事務範圍"], ["B", "使政府取得不受質疑的絕對權力"], ["C", "限制政府自身的權力，避免侵害人民"], ["D", "廢除國王世襲繼承的傳統制度"]], "ans": "C", "exp": "洛克受大憲章影響提出人人平等的概念，主張政府與人民訂約以限制政府權力，這個想法後來被孟德斯鳩繼承而形成分權制衡。"}, {"stem": "依課本定義，「權力」指的是下列何者？", "opts": [["A", "法律所保護、人民享有的生活利益"], ["B", "一種強制與支配的力量，行使後會使他人受到影響"], ["C", "人民向國家請求特定給付的資格"], ["D", "免於受到他人任意侵害的保障"]], "ans": "B", "exp": "權力是強制與支配的力量，握有權力的一方行使後會影響他人；權利則是法律保護人民享有的利益。"}, {"stem": "下列何者屬於「權利」的行使？", "opts": [["A", "警察在路口取締違規停車"], ["B", "政府對違法的業者處以罰鍰"], ["C", "立法院經協商完成修法程序"], ["D", "農民依災損向國家請求補助"]], "ans": "D", "exp": "向國家請求特定利益（如災害補助）是人民行使權利；前三者都是政府機關行使公權力。"}, {"stem": "「警察未持搜索票要求進入住宅，屋主予以拒絕。」屋主的行為屬於下列何者？", "opts": [["A", "權利的行使"], ["B", "權力的行使"], ["C", "公權力的行使"], ["D", "義務的履行"]], "ans": "A", "exp": "人民有拒絕警察未依法定程序搜索的權利，這是法律保障人民住所不受非法侵入的具體展現。"}, {"stem": "關於民主國家中「權力」與「權利」的關聯，下列敘述何者最適當？", "opts": [["A", "人民享有的權利是統治者恩賜的結果"], ["B", "政府的權力越大，人民權利越有保障"], ["C", "人民透過選舉賦予政府權力，期望政府以公權力保障人民權利"], ["D", "權力屬於政府、權利屬於人民，兩者互不相干"]], "ans": "C", "exp": "民主國家中人民以選舉「賦予權力」，政府則以公權力「保障權利」，兩者是授權與被授權的循環關係。"}, {"stem": "若政府濫用公權力而侵害人民權利，依課本說明，人民可以用下列何種方式收回賦予政府的權力？", "opts": [["A", "向法院提起訴願請求救濟"], ["B", "向立法院提出書面請願"], ["C", "集體拒絕繳納各項稅捐"], ["D", "行使罷免權使其去職"]], "ans": "D", "exp": "課本指出人民可用罷免等方式，使不適任的公職人員去職，並收回原本賦予政府的權力。"}, {"stem": "「有人在公開場合辱罵他人、損害其名譽，政府依法加以處罰。」這個例子最適合說明下列何者？", "opts": [["A", "整段敘述只涉及人民權利的行使"], ["B", "政府行使權力以保障人民的權利"], ["C", "整段敘述只涉及政府權力的行使"], ["D", "人民行使權力來限制政府的權利"]], "ans": "B", "exp": "政府依法處罰屬於行使公權力，其目的在維護受害者的名譽權，正好呈現「以權力保障權利」的關係。"}, {"stem": "「老師替踴躍發言的同學加平常成績」與「學生舉手向老師發問」，兩者依序分別屬於下列何者？", "opts": [["A", "權利、權力"], ["B", "權利、權利"], ["C", "權力、權利"], ["D", "權力、權力"]], "ans": "C", "exp": "老師握有評分的支配力量，屬於權力；學生發問則是受保障、可主張的學習利益，屬於權利。"}, {"stem": "下列何者最適合用來說明「公權力」？", "opts": [["A", "政府依法處罰違法人民的強制力量"], ["B", "人民向政府提出請願的資格"], ["C", "人民在網路上發表言論的自由"], ["D", "人民參加投票選出代表的資格"]], "ans": "A", "exp": "公權力是政府所擁有、具強制與支配性質的權力；後三者都屬於人民的權利。"}, {"stem": "英國學者艾克頓爵士說：「權力使人腐化；絕對的權力使人絕對腐化。」這句話最能支持下列哪一項主張？", "opts": [["A", "應擴大行政權以提升施政效率"], ["B", "統治者應該具備高尚的品德"], ["C", "政府應由多數黨完全獨攬決策"], ["D", "政府權力應該分立並相互制衡"]], "ans": "D", "exp": "這句名言指出權力集中必然帶來濫用，因此民主國家以分權制衡的制度設計來防止濫權，而非仰賴統治者自律。"}, {"stem": "民主國家建構政府體制時所採用的「分權制衡」原則，包含哪兩個部分？", "opts": [["A", "立法與行政"], ["B", "民主與法治"], ["C", "權力分立與相互制衡"], ["D", "憲法與行政命令"]], "ans": "C", "exp": "分權制衡包含「權力分立」（權力分散給不同機關獨立行使）與「相互制衡」（各權力彼此監督牽制）兩個層面。"}, {"stem": "關於「權力分立」的核心作法，下列敘述何者正確？", "opts": [["A", "把所有國家權力集中由國會行使"], ["B", "將權力分別交由不同機關獨立行使"], ["C", "由統治者一人統籌指揮所有事務"], ["D", "由人民直接行使全部的國家權力"]], "ans": "B", "exp": "權力分立是把不同功能的權力分散交由不同機關獨立行使，以避免權力過度集中而造成濫權。"}, {"stem": "下列何者最符合「有限政府」的意義？", "opts": [["A", "政府的權力、職能與規模受憲法及法律明文規範，並受社會監督約束"], ["B", "政府的組織規模必須維持在非常小的程度"], ["C", "政府只能處理有限的幾項行政事務"], ["D", "政府官員的任期都受到嚴格的年限限制"]], "ans": "A", "exp": "有限政府強調政府在權力、職能與規模上都受憲法與法律規範，並接受人民與社會的監督約束。"}, {"stem": "民主國家要建立「有限政府」，最主要的依據是下列何者？", "opts": [["A", "各機關發布的行政命令"], ["B", "各政黨自訂的黨綱黨章"], ["C", "國家的憲法"], ["D", "國際間簽訂的條約"]], "ans": "C", "exp": "民主國家透過制定憲法，規範政府的組織、權力與運作方式，以分權制衡建構權力受限的有限政府。"}, {"stem": "「行政機關要推動政策，必須有立法機關制定的法律作為依據或授權。」這個設計最能展現下列何者？", "opts": [["A", "權力分立"], ["B", "相互制衡"], ["C", "地方自治"], ["D", "依法審判"]], "ans": "B", "exp": "行政須以立法通過的法律為依據，是立法權對行政權的牽制，屬於相互制衡的展現。"}, {"stem": "南韓總統宣布全國戒嚴後，國會在六小時內表決解除戒嚴，其後憲法法庭判決彈劾成立，總統隨即免職。這起事件最能說明下列何者？", "opts": [["A", "南韓政府的權力確實受到約束與制衡"], ["B", "南韓人民可以直接投票罷免總統"], ["C", "南韓是採行五權分立的國家"], ["D", "總統宣布戒嚴體現了政黨政治精神"]], "ans": "A", "exp": "立法機關（國會）與司法機關（憲法法庭）都對總統發揮監督功能，且過程依憲法規定進行，正是分權制衡與法治的體現。"}, {"stem": "一個國家雖然制定了憲法，卻不一定就是民主國家。判斷的關鍵在於下列何者？", "opts": [["A", "憲法的條文數量是否足夠多"], ["B", "是否採用成文憲法的形式"], ["C", "國家是否設有國會組織"], ["D", "政府權力是否真正受到分立制衡與人民監督"]], "ans": "D", "exp": "課本以「一個國家擁有憲法就會走向民主嗎」發問，答案在於憲法所建立的分權制衡是否真正運作、政府是否成為受監督的有限政府。"}, {"stem": "關於憲法在權力分立中所扮演的角色，下列敘述何者最適當？", "opts": [["A", "憲法主要只規定人民應盡的義務"], ["B", "憲法規範政府的組織、權力與運作方式"], ["C", "憲法是由行政機關自行訂定的規則"], ["D", "憲法的效力低於立法院制定的法律"]], "ans": "B", "exp": "法治國家會把政府權力與運作模式規範在憲法中，我國憲法即明定中央政府體制採五權分立。"}, {"stem": "我國廣義的法律包含憲法、法律與命令，其位階由高到低的排列應為下列何者？", "opts": [["A", "憲法、法律、命令"], ["B", "法律、憲法、命令"], ["C", "命令、法律、憲法"], ["D", "憲法、命令、法律"]], "ans": "A", "exp": "法律位階愈高效力愈強，順序為憲法、法律、命令；位階低者牴觸位階高者即為無效。"}, {"stem": "過去民法規定父母對未成年子女的意思不一致時「由父行使之」，因與憲法男女平等的意旨不符而被宣告失效。這凸顯憲法的哪一項特性？", "opts": [["A", "固定性"], ["B", "原則性"], ["C", "最高性"], ["D", "強制性"]], "ans": "C", "exp": "憲法位階最高、效力最強，法律或命令若牴觸憲法即屬無效，這就是憲法的最高性。"}, {"stem": "憲法之所以被稱為「人民權利的保障書」，最主要的原因是什麼？", "opts": [["A", "憲法明定人民負有納稅的義務"], ["B", "憲法必須由總統正式公布施行"], ["C", "憲法詳細規定各政府機關的名稱"], ["D", "憲法明文保障人民的基本權利，人民可據以防止政府侵害"]], "ans": "D", "exp": "多數民主國家把人民權利寫入憲法以提高保障效力，人民既可消極防止政府侵害，也可積極向國家請求。"}, {"stem": "憲法是國家的根本大法，修正程序較一般法律困難繁複。這反映憲法的哪一項特性？", "opts": [["A", "固定性"], ["B", "最高性"], ["C", "原則性"], ["D", "可變性"]], "ans": "A", "exp": "為維持國家政治局勢穩定，憲法不宜頻繁變動，因此修憲程序特別嚴格，此即憲法的固定性。"}, {"stem": "在我國，若法律或命令有牴觸憲法的疑慮，應由下列哪一個機關審理判決？", "opts": [["A", "立法院"], ["B", "監察院"], ["C", "憲法法庭"], ["D", "行政院"]], "ans": "C", "exp": "由憲法法庭審理違憲爭議並作成判決，經判決違憲者必須廢除或修正，以確保憲法的最高性。"}, {"stem": "主張「三權分立」的學者是下列何者？", "opts": [["A", "洛克"], ["B", "孟德斯鳩"], ["C", "艾克頓"], ["D", "孫中山"]], "ans": "B", "exp": "法國學者孟德斯鳩提出三權分立，主張將政府權力分為行政、立法、司法三權，彼此制衡。"}, {"stem": "在三權分立的架構中，立法機關（國會）的主要職責為何？", "opts": [["A", "負責執行國家的各項政策"], ["B", "依據法律獨立進行審判"], ["C", "專責監督公務人員的操守"], ["D", "制定法律、審查政府預算並監督行政機關"]], "ans": "D", "exp": "立法權的內涵包括制定法律、審查政府預算與監督行政機關；執行政策屬行政權，獨立審判屬司法權。"}, {"stem": "三權分立特別強調司法機關應「超出黨派之外、依法獨立行使職權」，最主要的理由是什麼？", "opts": [["A", "司法人員不需要具備專業能力"], ["B", "司法權的地位高於行政與立法權"], ["C", "行政與立法的制衡常涉及政黨立場，需要中立者依法裁判"], ["D", "司法機關可以直接制定法律規範"]], "ans": "C", "exp": "行政權與立法權相互制衡時難免涉及政黨立場與利害得失，因此需要超出黨派、依法獨立審判的司法權來解決紛爭。"}, {"stem": "孟德斯鳩主張「要防止濫用權力，就必須以權力約束權力」。這句話最貼近下列哪一種想法？", "opts": [["A", "用制度讓權力彼此牽制，而不是依賴掌權者自律"], ["B", "應由道德最高尚的人掌握全部國家權力"], ["C", "政府權力越集中，施政的效率就越高"], ["D", "國家事務應全部交由人民直接決定"]], "ans": "A", "exp": "以權力約束權力就是制度性的制衡設計，強調靠結構安排而非個人品德來防止濫權。"}, {"stem": "民主國家採行三權分立，最主要的目的是下列何者？", "opts": [["A", "提高政府決策與執行的效率"], ["B", "增加政府部門的公務人員名額"], ["C", "擴大國會對國家事務的權力"], ["D", "避免權力過度集中而侵害人民權利"]], "ans": "D", "exp": "分權的根本目的在防止專權、保障人民權利；效率提升並非分權制衡的主要考量。"}, {"stem": "假設某國由統治者一人同時掌握制定法律、執行政策與審判案件的權力，最可能出現下列何種結果？", "opts": [["A", "形成權力受限的有限政府"], ["B", "權力集中而容易濫權，人民權利難以獲得保障"], ["C", "各機關之間可以充分相互制衡"], ["D", "政府施政能完全做到依法行政"]], "ans": "B", "exp": "立法、行政、司法集於一身即無從制衡，統治者的意志就等於法律，屬於人治，人民權利極易受到侵害。"}, {"stem": "「若行政機關的行為違法或不當而損害人民權益，人民可依法向司法機關尋求協助。」這項制度設計反映的是下列何者？", "opts": [["A", "司法權對行政權的制衡"], ["B", "立法權對行政權的制衡"], ["C", "行政權對司法權的制衡"], ["D", "考試權對行政權的制衡"]], "ans": "A", "exp": "人民循司法途徑救濟，使司法機關得以審查行政行為是否合法，屬於司法權對行政權的制衡。"}, {"stem": "關於「權力分立」與「相互制衡」的關係，下列敘述何者最適當？", "opts": [["A", "兩者的意義完全相同，可以互相取代"], ["B", "只要做到權力分立，就一定不會發生濫權"], ["C", "先以分立使權力不集中，再透過制衡彼此監督牽制"], ["D", "必須先有制衡，之後才可能出現權力分立"]], "ans": "C", "exp": "分立是把權力拆開交由不同機關行使，制衡則是讓這些機關彼此監督牽制，兩者相輔相成才能防止濫權。"}, {"stem": "我國採行的「五權分立」學說是由下列何人提出？", "opts": [["A", "孟德斯鳩"], ["B", "洛克"], ["C", "艾克頓"], ["D", "孫中山"]], "ans": "D", "exp": "我國採用孫中山提出的五權分立，是結合三權分立體制再加以調整而成的獨特中央政府體制。"}, {"stem": "在五權分立的設計中，考試權是從下列哪一權獨立出來的？", "opts": [["A", "立法權"], ["B", "行政權"], ["C", "司法權"], ["D", "監察權"]], "ans": "B", "exp": "行政部門既有用人之權又有決定資格之權，容易濫用私人，因此把考試權自行政權中獨立出來。"}, {"stem": "把監察權從立法權中獨立出來，主要是為了避免下列何種弊端？", "opts": [["A", "行政機關濫用私人"], ["B", "司法審判有失公正"], ["C", "國會權力過大而形成專制"], ["D", "國家考試發生舞弊"]], "ans": "C", "exp": "監察權自立法權分出，目的在杜絕國會權力過大所造成的專制流弊。"}, {"stem": "把考試權從行政權中獨立出來，主要是為了避免下列何種問題？", "opts": [["A", "行政機關濫用私人、任用私人"], ["B", "國會的權力變得過於龐大"], ["C", "司法審判受到政黨力量影響"], ["D", "地方政府的權力不斷坐大"]], "ans": "A", "exp": "考試權獨立可公正地為國舉才，防止行政首長依私人關係任用人員。"}, {"stem": "關於五權分立與三權分立的關係，下列敘述何者最適當？", "opts": [["A", "五權分立完全否定了三權分立的價值"], ["B", "五權分立是在三權分立的基礎上，再分出考試權與監察權"], ["C", "五權分立是把三種權力合併成五種名稱"], ["D", "五權分立不需要以憲法作為規範依據"]], "ans": "B", "exp": "五權分立結合三權分立的體制，再自行政權分出考試權、自立法權分出監察權，並由我國憲法明定。"}, {"stem": "小康提問：「如果廢除考試院和監察院，改成三權會怎麼樣？」依課本的分權原理判斷，下列說明何者正確？", "opts": [["A", "監察權會回歸到司法權"], ["B", "行政權將同時擁有司法權"], ["C", "立法權將取得行政權"], ["D", "考試權回歸行政權、監察權回歸立法權"]], "ans": "D", "exp": "考試權原本自行政權分出、監察權原本自立法權分出，若廢除兩院，這兩項權力自然回歸原來所屬的行政權與立法權。"}, {"stem": "針對「廢考監」的討論，宇廷提到考試院發表聲明，請民眾正視其貫徹憲法公開徵選國家人才的功能。這段話最能凸顯下列何者？", "opts": [["A", "考試權獨立行使有防止用人不公的價值"], ["B", "民意調查顯示多數民眾支持廢除兩院"], ["C", "廢除兩院之後就無法落實有限政府"], ["D", "改採三權分立必然造成行政效率降低"]], "ans": "A", "exp": "此說法強調考試權獨立能公開公正地為國舉才，正是當初把考試權自行政權分出的理由。"}, {"stem": "若從「為什麼要分立」的原理層次來看，我國採行五權分立最根本的用意是什麼？", "opts": [["A", "讓政府部門數量增加以創造更多職位"], ["B", "使中央政府與地方政府得以分工合作"], ["C", "分散政府權力以防止濫權，進而保障人民權利"], ["D", "加快各項政策推動與執行的速度"]], "ans": "C", "exp": "無論三權或五權，分立的根本用意都是避免權力過度集中造成濫權，最終目的在保障人民的權利。"}, {"stem": "我國中央政府的組織如何形成、職權如何行使，主要規範於下列哪些法規之中？", "opts": [["A", "民法與刑法"], ["B", "地方制度法與公民投票法"], ["C", "中華民國憲法與憲法增修條文"], ["D", "行政程序法與立法院職權行使法"]], "ans": "C", "exp": "課本開宗明義指出，我國依五權分立的精神，將中央政府的組織與職權明確規範於「憲法」及「憲法增修條文」中，另有相關法規補充。民法、刑法規範的是私人權利義務與犯罪處罰，並非政府組織的依據。"}, {"stem": "關於我國中央政府的組成，下列敘述何者正確？", "opts": [["A", "由總統與行政、立法、司法、考試、監察五院組成"], ["B", "由總統與行政、立法、司法三院組成"], ["C", "由行政院統轄其餘四院，形成金字塔式組織"], ["D", "由立法院與行政院共同組成，其餘機關屬地方政府"]], "ans": "A", "exp": "我國中央政府採「一府五院」的架構，由總統（總統府）與行政院、立法院、司法院、考試院、監察院共同組成，這是我國有別於多數民主國家「三權分立」的特色。五院彼此獨立、互相制衡，並非由行政院統轄。"}, {"stem": "我國憲法規定法官為終身職；憲法增修條文也規定，司法院提出的年度司法概算，行政院不得刪減，僅得加註意見後編入中央政府總預算案。這些設計最主要的目的為何？", "opts": [["A", "讓司法院的預算不必經立法院審查"], ["B", "讓法官可以自行決定自己的薪資待遇"], ["C", "使司法院成為地位最高的行政機關"], ["D", "維持司法權的獨立，避免受到其他權力干涉"]], "ans": "D", "exp": "司法權必須公正裁判，若行政院能任意刪減司法預算、或法官職位隨時可被撤換，司法就容易受到干涉。因此以「法官終身職」與「司法概算不得刪減」來保障司法獨立，人民的權利受公權力侵害時才能獲得真正的保護。司法概算仍須送立法院審議，故 (A) 錯誤。"}, {"stem": "關於我國總統的產生方式與任期，下列敘述何者正確？", "opts": [["A", "由立法委員互選產生，任期四年"], ["B", "由人民直接選舉產生，任期四年，連選得連任一次"], ["C", "由人民直接選舉產生，任期六年，得無限次連任"], ["D", "由行政院院長提請立法院同意後任命"]], "ans": "B", "exp": "總統為國家元首，由人民直接選舉產生，任期四年，「連選得連任一次」，也就是最多連續擔任兩任八年。立法委員雖也是任期四年，但「連選得連任」沒有次數限制，兩者要分清楚。"}, {"stem": "「對外代表中華民國、統率全國陸海空三軍」，這是我國哪一個職位所具備的身分與職權？", "opts": [["A", "總統"], ["B", "行政院院長"], ["C", "國防部部長"], ["D", "立法院院長"]], "ans": "A", "exp": "總統是國家元首，對外代表中華民國，並以「三軍統帥」的身分統率全國陸海空軍。國防部部長只是行政院轄下部會首長，須聽從指揮並向立法院負責，並非三軍統帥。"}, {"stem": "下列何者「不屬於」總統的職權？", "opts": [["A", "依法公布法律、發布命令"], ["B", "決定國家安全大政方針"], ["C", "提名司法院大法官"], ["D", "審查中央政府總預算"]], "ans": "D", "exp": "審查中央政府總預算是「立法院」代表人民監督政府經費的重要職權，並非總統的權力。總統的重要職權包括統率三軍、公布法律、發布命令與緊急命令、行使人事任命與提名權、決定國家安全大政方針等。"}, {"stem": "當國家遭遇緊急危難或財政經濟上重大變故時，總統要發布緊急命令，依課本所述須先經過下列何種程序？", "opts": [["A", "經立法院三讀通過"], ["B", "經行政院會議之決議"], ["C", "經憲法法庭裁判許可"], ["D", "經監察院調查同意"]], "ans": "B", "exp": "緊急命令的流程是：國家遭遇緊急危難或財政經濟重大變故 → 經行政院會議決議 → 總統發布緊急命令 → 十日內提交立法院追認。行政院會議的決議是發布前的必要程序，立法院則是在發布「之後」進行追認。"}, {"stem": "總統發布緊急命令後，須於十日內提交立法院追認。若立法院不予追認，該緊急命令的效力如何？", "opts": [["A", "由總統再發布一次即可繼續生效"], ["B", "交由憲法法庭裁決是否有效"], ["C", "立即失效"], ["D", "仍然有效，但須修改部分內容"]], "ans": "C", "exp": "依緊急命令流程圖，十日內提交立法院追認通過者，緊急命令有效；未獲追認者，緊急命令「立即失效」。這是防止總統藉緊急狀態擴權的重要設計。"}, {"stem": "總統所發布的緊急命令必須送請立法院追認，這項設計最能表現下列何種精神？", "opts": [["A", "以立法權制衡行政權，防止行政權在緊急狀態下濫用"], ["B", "總統必須向監察院負責"], ["C", "立法院可以代替總統決定國家安全大政方針"], ["D", "緊急狀態下政府的權力不受任何限制"]], "ans": "A", "exp": "緊急狀態下權力容易高度集中於行政部門，若沒有制衡機制，就可能導致濫權。由具民意基礎的立法院進行追認，等於是用立法權替人民把關，維持行政權與立法權的平衡。"}, {"stem": "依憲法規定，我國的「最高行政機關」是下列何者？", "opts": [["A", "總統府"], ["B", "國家安全會議"], ["C", "行政院"], ["D", "內政部"]], "ans": "C", "exp": "行政院是我國最高行政機關，負責依法規劃與執行政策、法律，並督導所屬機關施政。總統雖然也行使部分行政權，但總統府並非「最高行政機關」；內政部只是行政院下轄的部會之一。"}, {"stem": "關於行政院院長的產生方式，下列敘述何者正確？", "opts": [["A", "由人民直接選舉產生"], ["B", "由總統直接任命"], ["C", "由總統提名，經立法院同意後任命"], ["D", "由立法委員互選產生"]], "ans": "B", "exp": "行政院院長由總統「直接任命」，不需要經過立法院同意，這一點常與司法院、考試院、監察院的正副院長（須總統提名、立法院同意）混淆，要特別留意。"}, {"stem": "民國114年，體育署升格為「運動部」，成為行政院轄下的部會之一。依課本所述，運動部部長是如何產生的？", "opts": [["A", "由總統直接任命"], ["B", "由立法委員投票選出"], ["C", "由考試院考試及格後派任"], ["D", "由行政院院長提請總統任命"]], "ans": "D", "exp": "行政院的副院長及各部會首長，都是由行政院院長「提請總統任命」。運動部部長屬於部會首長，自然適用此規定。至於運動部的成立需要制定組織法，則由立法院審議三讀通過。"}, {"stem": "「政府推行免費英語自主檢測系統」、「規劃行人優先區並限制車速」、「發放各項生活補助」，這些工作最主要屬於下列何者的職權？", "opts": [["A", "立法院——制定與修改法律"], ["B", "監察院——糾正不當施政"], ["C", "行政院——規劃與執行全國性政策"], ["D", "考試院——選拔任用優秀人才"]], "ans": "C", "exp": "行政權是指組織與管理內政、外交、教育、交通等各方面行政事務的權力。題目所述都是「規劃並執行具體政策」的行為，屬於行政院及其所屬部會的職權範圍。"}, {"stem": "某項釋憲案中，「內政部」與「考選部」都表示了意見。這兩個機關分別隸屬於下列哪一個院？", "opts": [["A", "內政部：行政院；考選部：考試院"], ["B", "內政部：行政院；考選部：司法院"], ["C", "內政部：考試院；考選部：監察院"], ["D", "內政部：立法院；考選部：行政院"]], "ans": "A", "exp": "內政部是行政院十五部之一，掌理內政事務；考選部則是考試院下設的機關，掌理公務人員考試與專門職業及技術人員考試。名稱相近的部會要對應到正確的院。"}, {"stem": "依憲法規定，行政院必須向下列哪一個機關負責，並接受其監督？", "opts": [["A", "總統府"], ["B", "監察院"], ["C", "司法院"], ["D", "立法院"]], "ans": "D", "exp": "行政院依法對「立法院」負責。具體表現為：行政院須向立法院提出施政方針及施政報告，行政院院長及各部會首長須接受立法委員質詢，行政院編列的預算也須經立法院審查通過。"}, {"stem": "關於立法委員的產生方式與任期，下列敘述何者正確？", "opts": [["A", "由總統提名，經人民投票同意後任命"], ["B", "由人民選舉產生，任期四年，連選得連任"], ["C", "由人民選舉產生，任期六年，連選得連任一次"], ["D", "由行政院院長提請總統任命"]], "ans": "B", "exp": "立法委員是中央民意代表，由人民選舉投票產生，任期四年，「連選得連任」且無連任次數的限制，這與總統「連選得連任一次」不同。"}, {"stem": "立法院院長、副院長是如何產生的？", "opts": [["A", "由立法委員互選產生"], ["B", "由總統直接任命"], ["C", "由總統提名，經立法委員同意後任命"], ["D", "由人民直接選舉產生"]], "ans": "A", "exp": "立法院院長、副院長由立法委員「互選」產生。這與行政院院長（總統直接任命）、司法院／考試院／監察院正副院長（總統提名、立法院同意）都不同，是常見的比較題型。"}, {"stem": "下列何者「不是」立法院的職權？", "opts": [["A", "制定法律"], ["B", "審查中央政府總預算"], ["C", "審判各種訴訟案件"], ["D", "質詢行政院官員"]], "ans": "C", "exp": "審判各種訴訟案件屬於司法院所設各級法院的職權，是司法權而非立法權。立法院的職權包括制定法律、審查總預算、質詢政府官員、行使人事同意權、提出不信任案與各項提案權等。"}, {"stem": "司法院、考試院、監察院的重要人員由總統提名後，還必須經立法院同意才能任命。這項設計的主要意義為何？", "opts": [["A", "讓總統可以藉此控制這三院的運作"], ["B", "使非民選產生的官員仍須經由具民意基礎的機關把關"], ["C", "讓立法院可以直接任命這三院的官員"], ["D", "避免這三院提出違反憲法的法律案"]], "ans": "B", "exp": "三院的重要人員並非透過考試或選舉產生，若僅由總統一人決定，容易產生濫用私人的疑慮。透過具有民意基礎的立法院行使同意權加以把關，正是「以立法權制衡行政權」的展現。"}, {"stem": "依課本所述，立法院提出「憲法修正案」與「領土變更案」後，必須再經過下列何種程序才能通過？", "opts": [["A", "由憲法法庭裁判是否合憲"], ["B", "由總統公布後即刻生效"], ["C", "由監察院進行審查"], ["D", "交由選舉人投票複決"]], "ans": "D", "exp": "憲法修正案與領土變更案都由立法院提出，但因事關重大，必須再交由「選舉人投票複決」通過，直接由人民作最後決定，展現主權在民的精神。也因為門檻高，修憲並不容易。"}, {"stem": "立法院提出的「總統、副總統罷免案」與「總統、副總統彈劾案」，兩者後續的決議方式有何差別？", "opts": [["A", "罷免案交憲法法庭審理，彈劾案交選舉人投票"], ["B", "兩者都交由選舉人投票決定"], ["C", "罷免案交由選舉人投票罷免，彈劾案交由憲法法庭審理"], ["D", "兩者都交由大法官組成的憲法法庭審理"]], "ans": "C", "exp": "依立法院各項提案權與決議方式：罷免案由選舉人投票罷免（政治責任，由人民決定去留）；彈劾案則交由大法官組成的憲法法庭審理（法律責任，由司法權判斷）。兩者容易混淆，須分辨清楚。"}, {"stem": "我國最高司法機關為何？其院長、副院長與大法官如何產生？", "opts": [["A", "司法院；由總統提名，經立法院同意後任命"], ["B", "最高法院；由總統直接任命"], ["C", "司法院；由人民直接選舉產生"], ["D", "憲法法庭；由立法委員互選產生"]], "ans": "A", "exp": "司法院是我國最高司法機關，院長、副院長與大法官皆由總統提名，經立法院同意後任命。最高法院是各級法院中的終審法院，憲法法庭則是由大法官組成的審理機制，兩者都不是「最高司法機關」。"}, {"stem": "下列關於司法院所屬機關與其職權的配對，何者正確？", "opts": [["A", "各級法院——解釋憲法"], ["B", "憲法法庭——懲戒違法失職的公務人員"], ["C", "懲戒法院——審理政黨違憲的解散案"], ["D", "各級法院——審判各種訴訟案件"]], "ans": "D", "exp": "司法院的三大職權可分為：審判權（各級法院審判各種訴訟案件）、懲戒權（懲戒法院掌理公務人員懲戒）、解釋權（憲法法庭解釋憲法、統一解釋法律及命令、審理總統副總統彈劾案與政黨違憲解散案）。"}, {"stem": "全國公務人員違法失職時，其「懲戒」事務由下列哪一個機關掌理？", "opts": [["A", "監察院"], ["B", "司法院懲戒法院"], ["C", "考試院銓敘部"], ["D", "行政院人事行政總處"]], "ans": "B", "exp": "監察院負責「提出彈劾」，是追究責任的發動者；真正的「議處、懲戒」則交由司法院所設的懲戒法院依法審判。彈劾與懲戒分屬不同機關，正是分權制衡的展現。"}, {"stem": "下列何者「不屬於」大法官組成之憲法法庭的職權？", "opts": [["A", "解釋憲法"], ["B", "統一解釋法律及命令"], ["C", "審理一般民眾之間的財產糾紛"], ["D", "審理政黨違憲的解散案件"]], "ans": "C", "exp": "一般民眾之間的民事財產糾紛，由各級法院依訴訟程序審判，不屬於憲法法庭。憲法法庭處理的是憲法層次的重大爭議：解釋憲法、統一解釋法律及命令、審理總統副總統彈劾案、審理政黨違憲解散案等。"}, {"stem": "民國113年，立法院通過立法院職權行使法部分條文修正案，部分立法委員認為其內容違反權力分立原則而聲請審查。依現行制度，此案應由下列何者審理並作成裁判？", "opts": [["A", "大法官組成的憲法法庭"], ["B", "最高法院刑事庭"], ["C", "監察院彈劾審查會"], ["D", "行政院法規委員會"]], "ans": "A", "exp": "法律是否違反憲法，屬於憲法爭議，由司法院大法官組成的憲法法庭審查並以裁判方式宣告。該案經審查後認為部分內容違反權力分立原則，因而裁判違憲。"}, {"stem": "憲法訴訟法施行後，過去以「大法官會議」議決的釋憲方式，已改為下列何種方式進行？", "opts": [["A", "由立法院院會表決通過"], ["B", "由憲法法庭以裁判方式進行，且參與的大法官須公開其立場"], ["C", "由總統召開國是會議共同決定"], ["D", "由監察院調查後作成決定"]], "ans": "B", "exp": "舊制以「大法官會議」議決，過程中只記錄出席大法官的名字，看不出每位大法官的立場；憲法訴訟法改採「憲法法庭」裁判方式，並要求參與的大法官必須公開立場，以達公開透明並落實司法權的本質。"}, {"stem": "憲法訴訟法將立法委員提案聲請釋憲的門檻，由原本的三分之一降為四分之一，其主要目的為何？", "opts": [["A", "提高釋憲案通過的難度"], ["B", "讓行政院更容易聲請釋憲"], ["C", "使大法官能夠主動提出釋憲案"], ["D", "保障席次較少政黨聲請釋憲的權益"]], "ans": "D", "exp": "門檻降低後，席次較少的政黨也有機會湊足人數提案釋憲，使少數意見有管道進入憲法審查程序，是保障少數的設計。要注意「提案門檻」的降低，與「通過門檻」的規定是兩回事。"}, {"stem": "我國最高考試機關為考試院，其院長、副院長與考試委員的產生方式為何？", "opts": [["A", "由總統提名，經立法院同意後任命"], ["B", "由人民直接選舉產生"], ["C", "由行政院院長提請總統任命"], ["D", "由考試及格的公務人員互選產生"]], "ans": "A", "exp": "考試院院長、副院長與考試委員，和司法院、監察院的重要人員一樣，都是由總統提名、經立法院同意後任命，藉由立法院的人事同意權加以制衡。"}, {"stem": "小華的姊姊想報考公務人員高等考試，也想了解會計師等專門職業考試的資訊。她應該關注下列哪一個機關辦理的考試？", "opts": [["A", "監察院審計部"], ["B", "行政院人事行政總處"], ["C", "考試院考選部"], ["D", "司法院懲戒法院"]], "ans": "C", "exp": "考試院下設考選部，掌理公務人員考試以及專門職業及技術人員（如會計師、律師）考試。透過公開的國家考試選才，可以避免政府機關用人時濫用私人。"}, {"stem": "公務人員的銓敘、撫卹與退休等事項，由下列哪一個機關掌理？", "opts": [["A", "考選部"], ["B", "內政部"], ["C", "審計部"], ["D", "銓敘部"]], "ans": "D", "exp": "考試院下設兩大機關：考選部掌理各類國家考試；銓敘部則掌理公務人員的銓敘（審查、審定資格條件與等級俸給）、撫卹、退休與任免等事宜。"}, {"stem": "依孫文的主張，我國之所以將「考試權」從行政權中獨立出來、另設考試院，最主要的理由為何？", "opts": [["A", "避免立法機關形成國會專制"], ["B", "避免行政機關用人時濫用私人"], ["C", "避免司法機關的審判受到干涉"], ["D", "避免監察院的權力過於龐大"]], "ans": "B", "exp": "孫文認為，三權分立下行政機關掌有考試權，容易任用私人；立法機關掌有監察權，則會造成國會專制。因此主張把考試權與監察權獨立出來，設考試院與監察院，形成我國的五權分立體制。選項 (A) 是「監察權」獨立出來的理由。"}, {"stem": "我國最高監察機關為監察院。下列人員中，何者「不是」由總統提名、經立法院同意後任命？", "opts": [["A", "監察院院長"], ["B", "監察委員"], ["C", "監察院所屬的一般公務人員"], ["D", "審計長"]], "ans": "C", "exp": "監察院院長、副院長、監察委員與審計長皆由總統提名、經立法院同意後任命。至於各院內的一般公務人員，須經考試院舉辦的國家考試及格後才能任用，兩者產生方式完全不同。"}, {"stem": "監察院對「違法失職的公務人員」提出彈劾案並通過後，應移送下列何機關審理議處？", "opts": [["A", "司法院懲戒法院"], ["B", "大法官組成的憲法法庭"], ["C", "立法院"], ["D", "行政院"]], "ans": "A", "exp": "一般公務人員的彈劾案由監察院提出，交由司法院懲戒法院審理議處；總統、副總統的彈劾案則是由立法院提出，交由憲法法庭審理。提案機關與審理機關都不同，要分清楚。"}, {"stem": "某項道路工程規劃不當，屢遭民眾投訴。監察院認為該行政機關施政不當，要求其檢討改善。監察院此時提出的是下列何者？", "opts": [["A", "彈劾案"], ["B", "糾正案"], ["C", "不信任案"], ["D", "覆議案"]], "ans": "B", "exp": "監察院的三項權力中，彈劾與糾舉是對「人」（公務人員），糾正則是對「事」，針對行政院及其所屬機關的不當施政提出，要求改善。不信任案是立法院對行政院院長提出，覆議則由行政院提出，兩者都與監察院無關。"}, {"stem": "監察院提出「糾舉案」後，案件成立的受理機關為下列何者？", "opts": [["A", "大法官組成的憲法法庭"], ["B", "立法院"], ["C", "司法院懲戒法院"], ["D", "被糾舉人的主管或上級長官"]], "ans": "D", "exp": "依監察院各項職權比較：彈劾案的受理機關為司法院懲戒法院；糾舉案的受理機關為被糾舉人的主管或上級長官；糾正案則向行政院或有關部會提出。三者受理機關各不相同。"}, {"stem": "下列何者「不屬於」監察院彈劾、糾舉的對象？", "opts": [["A", "總統、副總統與民意代表"], ["B", "中央政府機關的公務人員"], ["C", "地方政府機關的公務人員"], ["D", "行政院各部會的職員"]], "ans": "A", "exp": "監察院彈劾、糾舉的對象是中央及地方的公務人員，但「不包含總統、副總統及民意代表」。因為總統、副總統與民意代表都由人民選舉產生，其責任應由人民或立法院（提出彈劾案）來追究，落實主權在民的精神。"}, {"stem": "政府各機關年度決算的審核工作，由下列哪一個單位負責？", "opts": [["A", "立法院預算中心"], ["B", "行政院主計總處"], ["C", "監察院審計部"], ["D", "考試院銓敘部"]], "ans": "C", "exp": "預算由行政院編列、立法院審查；年度結束後行政院編製總決算，送交監察院所屬的審計部行使審計權、審核決算。監察權的核心之一就是監督政府經費的運用。"}, {"stem": "行政院認為立法院決議通過的法律案窒礙難行時，得經下列何者核可後，移請立法院覆議？", "opts": [["A", "立法院院長"], ["B", "總統"], ["C", "憲法法庭"], ["D", "監察院"]], "ans": "B", "exp": "覆議的流程是：立法院通過法案送行政院執行 → 行政院認為窒礙難行 → 呈請總統核可 → 移請立法院覆議。總統的核可是提出覆議前的必要程序。"}, {"stem": "下列何者「不是」行政院可以提出覆議的標的？", "opts": [["A", "法律案"], ["B", "預算案"], ["C", "條約案"], ["D", "總統、副總統彈劾案"]], "ans": "D", "exp": "行政院負責執行立法院決議的「法律案、預算案、條約案」，若認為窒礙難行才得提出覆議。總統、副總統彈劾案是立法院提出後交由憲法法庭審理，與行政院執行政策無關，自然不是覆議的標的。"}, {"stem": "立法院對行政院提出的覆議案進行表決，結果決議維持原案。此時行政院院長應如何處理？", "opts": [["A", "提出辭職以示負責"], ["B", "呈請總統解散立法院"], ["C", "接受該決議"], ["D", "再向立法院提出一次覆議"]], "ans": "C", "exp": "覆議時如經立法院決議維持原案，行政院院長「應接受該決議」，也就是必須依原案執行。行政院院長辭職與呈請總統解散立法院，是「不信任案通過」後的效果，不可混淆。"}, {"stem": "若立法院對行政院移請的覆議案逾期未議決，會產生下列何種結果？", "opts": [["A", "原決議失效"], ["B", "原決議自動維持並須立即執行"], ["C", "行政院院長應立即提出辭職"], ["D", "交由憲法法庭裁決應否執行"]], "ans": "A", "exp": "覆議時如經決議維持原案，行政院院長應接受；若遭否決或逾期未議決，則「原決議失效」，行政院便不必執行該案。這是讓行政權得以對抗立法權的一項制衡工具。"}, {"stem": "立法院對行政院的整體施政表現非常不滿意時，得對行政院院長提出下列何種提案？", "opts": [["A", "彈劾案"], ["B", "糾正案"], ["C", "覆議案"], ["D", "不信任案"]], "ans": "D", "exp": "不信任案是立法院對行政院院長提出的重要制衡手段。彈劾、糾正是監察院的職權，覆議則是行政院針對立法院決議所提出，方向剛好相反。"}, {"stem": "不信任案經立法院通過後，行政院院長依法應如何處理？", "opts": [["A", "僅須到立法院提出檢討報告即可"], ["B", "應提出辭職，並得同時呈請總統解散立法院"], ["C", "應交由憲法法庭審理該案是否違憲"], ["D", "應請監察院對自己進行調查"]], "ans": "B", "exp": "不信任案通過後，行政院院長應提出辭職以示負責，並「得同時呈請總統解散立法院」，立法委員須重新改選。這項設計可避免立法院濫用不信任案，因為解散後立委也要面對選民的重新檢驗。"}, {"stem": "若立法院提出的不信任案表決未獲通過，依規定會產生下列何種效果？", "opts": [["A", "一年內不得對同一位行政院院長再提不信任案"], ["B", "立法院須立即解散並重新改選"], ["C", "行政院院長仍須提出辭職"], ["D", "總統須立即重新任命行政院院長"]], "ans": "A", "exp": "不信任案若未通過，一年內不得對「同一位」行政院院長再次提出，目的是避免立法院反覆提案、癱瘓行政運作，維持政局的穩定。"}, {"stem": "行政院院長及各部會首長到立法院接受立法委員的詢問，並負有答復的義務。這項制度稱為什麼？", "opts": [["A", "覆議"], ["B", "彈劾"], ["C", "質詢"], ["D", "糾正"]], "ans": "C", "exp": "立法委員在開會時，有向行政院院長及各部會首長「質詢」之權，被質詢人有答復的義務。這是立法院代表人民監督行政機關最直接的方式之一。"}, {"stem": "「立法院代表人民監督政府，因此行政院有向立法院提出施政方針及施政報告之責。」這段話最能說明下列何種關係？", "opts": [["A", "立法院必須向行政院負責"], ["B", "行政院必須向立法院負責"], ["C", "行政院與立法院互不隸屬，也互不監督"], ["D", "總統必須向立法院負責，並接受立委質詢"]], "ans": "B", "exp": "行政院依法對立法院負責，具體表現在提出施政方針與施政報告、接受質詢、預算須經審查等。總統則不對立法院負責，也不是質詢的對象（總統僅定期至立法院進行國情報告）。"}, {"stem": "關於中央政府預算與決算的流程，下列排列何者正確？\n甲、立法院審查預算　乙、行政院編列預算　丙、監察院審計部審核決算　丁、各機關執行預算", "opts": [["A", "甲→乙→丁→丙"], ["B", "乙→丙→甲→丁"], ["C", "丁→乙→甲→丙"], ["D", "乙→甲→丁→丙"]], "ans": "D", "exp": "正確順序為：行政院編列預算 → 立法院審查預算 → 各機關執行預算 → 年度終了做成決算 → 監察院審計部審核決算 → 再送審核報告審議。行政、立法、監察三權在經費上分工把關。"}, {"stem": "各院的預算都必須經立法院審查通過後才能動用，這項規定最能展現下列何種意義？", "opts": [["A", "以立法權監督各機關的經費運用"], ["B", "立法院可以直接指揮各院的日常施政"], ["C", "各院都必須向監察院負責"], ["D", "行政院可以自行決定其他各院的預算多寡"]], "ans": "A", "exp": "立法院掌握「錢袋子」，透過審查預算監督各機關經費是否合理運用，是立法權制衡其他權力的重要方式。但審查預算不等於可以指揮各院施政，各院在職權範圍內仍保持獨立。"}, {"stem": "五院內的公務人員須先經考試院的考試才能任用；若違法失職，則由監察院提出彈劾，再交由司法院懲戒法院議處。這樣的安排最能說明下列何者？", "opts": [["A", "考試院可以直接懲戒違法失職的公務人員"], ["B", "監察院同時擁有彈劾權與審判權"], ["C", "中央政府各院之間既分工合作又相互制衡"], ["D", "公務人員完全不受任何機關的監督"]], "ans": "C", "exp": "選才由考試院、追究責任由監察院、最終議處由司法院，同一件事拆給三個機關分別掌理，既避免任何一院獨大，又能達到澄清吏治的效果，正是五權分立、分權制衡精神的具體展現。"}];

const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

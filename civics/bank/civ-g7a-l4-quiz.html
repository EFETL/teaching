<script>
const QS=[{"stem": "下列哪一項活動，「不」屬於課本所說的「家務勞動」？", "opts": [["A", "媽媽為全家人料理三餐"], ["B", "哥哥負責倒垃圾、清掃客廳"], ["C", "爸爸每天檢查妹妹的聯絡簿並指導功課"], ["D", "姊姊到便利商店打工賺取零用錢"]], "ans": "D", "exp": "家務勞動是指為維持生活品質、讓家庭成員身心獲得照料以及培育下一代所做的一切努力，包含料理三餐、清掃家庭、教育子女、照顧長輩等。到店家打工屬於家庭以外的受僱工作，不是家務勞動。"}, {"stem": "課本指出，過去家務勞動大多由女性承擔，其最主要的原因是什麼？", "opts": [["A", "女性天生比男性更擅長做家事"], ["B", "傳統社會性別刻板印象的影響"], ["C", "民法明文規定家務應由妻子負責"], ["D", "女性的工作時數普遍比男性短"]], "ans": "B", "exp": "家務分工不均並非天生能力差異，而是長期「男主外、女主內」的社會性別刻板印象所造成。民法從未規定家務由女性負責，反而規定夫妻互為日常家務代理人。"}, {"stem": "新聞報導：「許多職業婦女白天上班、晚上還要煮飯洗衣照顧小孩，蠟燭兩頭燒。」這段話最能反映下列何種現象？", "opts": [["A", "家庭的經濟功能被企業取代"], ["B", "女性受教育權遭到剝奪"], ["C", "家務分工不均使女性難以兼顧職場與家庭"], ["D", "政府未提供任何長期照顧服務"]], "ans": "C", "exp": "「蠟燭兩頭燒」形容職業婦女同時承擔職場工作與家務勞動的雙重負擔，正是家務分工不均的具體表現，也可能因此阻礙其人際交往與工作升遷。"}, {"stem": "「男主外、女主內」的傳統思維，對「男性」可能造成下列何種不利影響？", "opts": [["A", "承擔較大的經濟壓力，減少陪伴家人的時間"], ["B", "無法依法繼承父母的遺產"], ["C", "在校園中容易遭受霸凌"], ["D", "失去對未成年子女的親權"]], "ans": "A", "exp": "課本指出，社會性別期待使男性必須投入更多時間與精神取得經濟資源，因而少了陪伴子女、配偶與父母的時間，容易造成男性對家庭的貢獻被忽略，並與家人產生疏離感。"}, {"stem": "近年來我國男性參與家務勞動的比率逐漸增加，這種轉變最直接的意義是什麼？", "opts": [["A", "代表女性完全退出職場"], ["B", "代表家庭功能已被政府取代"], ["C", "家庭成員能兼顧個人發展與家庭生活，有助落實家庭平權"], ["D", "代表家務勞動已全面商品化"]], "ans": "C", "exp": "家庭成員共同分擔家務，不僅支持家庭健全運作，也讓女性有更多機會參與職場與社會活動，使每個成員都能兼顧家庭生活與個人發展，這正是家庭平權的核心。"}, {"stem": "依課本引用衛福部民國108年的調查，有配偶的女性平均每天家務勞動的時間，大約是男性的多少倍？", "opts": [["A", "相同"], ["B", "將近3倍"], ["C", "將近10倍"], ["D", "女性比男性少一半"]], "ans": "B", "exp": "課本引用的調查顯示，有配偶的女性平均每天家務勞動時間將近是男性的3倍，說明家務分工不均的現象仍然存在。"}, {"stem": "小美到市場買菜、繳水電費時，都是以自己的名義處理家中日常事務，先生事後也承認有效。這符合民法中的哪一項規定？", "opts": [["A", "夫妻互為日常家務代理人"], ["B", "夫妻財產制須由法院決定"], ["C", "妻子須以丈夫的住所為住所"], ["D", "夫妻的親權由父親優先行使"]], "ans": "A", "exp": "民法規定夫妻於日常家務互為代理人，因此一方處理買菜、繳費等日常家務時，效力可及於他方，這是保障配偶雙方權利的規定。"}, {"stem": "依民法規定，家庭生活費用原則上應如何負擔？", "opts": [["A", "一律由丈夫全額負擔"], ["B", "一律由收入較高者負擔全部"], ["C", "由父母雙方的長輩共同負擔"], ["D", "由夫妻依其經濟能力共同分擔"]], "ans": "D", "exp": "民法規定夫妻雙方依經濟能力共同分擔家庭生活費用，並享有相等的經濟自主權，不再是由丈夫單方面負擔，體現家庭平權精神。"}, {"stem": "阿華婚後辭去工作，全職負責家務。依民法規定，關於他的經濟權利，下列敘述何者正確？", "opts": [["A", "因為沒有外出賺錢，完全不能動用家庭收入"], ["B", "可以有部分自由使用家庭收入的權利"], ["C", "必須經由法院裁定才能使用家庭收入"], ["D", "只能使用配偶所給的零用錢，不受法律保障"]], "ans": "B", "exp": "民法為確保擔任全職家務者的經濟自主權，明文規定從事家務勞動者也可以有部分自由使用家庭收入的權利，肯定家務勞動的價值。"}, {"stem": "小豪的父母對於他該就讀哪一所高中意見不一致，僵持不下。依民法規定，最後應以下列何者作為決定的最重要考量？", "opts": [["A", "由祖父母出面裁決"], ["B", "一律以父親的意見為準"], ["C", "尊重子女意願，依子女的最佳利益決定"], ["D", "由父母抽籤決定"]], "ans": "C", "exp": "現行民法規定，父母對未成年子女行使親權意見不一致時，應尊重子女的意願，以「子女的最佳利益」作為決定的標準，必要時可請求法院依子女最佳利益決定。"}, {"stem": "下列關於「親權」的敘述，何者正確？", "opts": [["A", "指父母對未成年子女具有保護及教養的權利與義務"], ["B", "指子女有權要求父母無限度給予金錢"], ["C", "指祖父母對孫子女的探視權利"], ["D", "指成年子女對父母財產的處分權"]], "ans": "A", "exp": "親權是父母對於未成年子女所具有的保護及教養的權利與義務，既是權利也是義務，並非父母可以任意支配子女的權力。"}, {"stem": "如果父母濫用親權，對子女施以嚴重不當管教，依法可能產生什麼結果？", "opts": [["A", "只會被罰錢，不影響親權"], ["B", "子女必須先滿20歲才能提出任何主張"], ["C", "政府會強制父母離婚"], ["D", "法院可依民法宣告停止父母行使親權"]], "ans": "D", "exp": "民法規定父母若濫用親權或有家庭暴力行為，法院可以宣告停止（限制或禁止）其親權的行使，以保護未成年子女。"}, {"stem": "阿凱從小遭父親遺棄，由祖母扶養長大。阿凱成年後，父親要求他負擔扶養費。依民法規定，阿凱可以怎麼做？", "opts": [["A", "只能全額扶養，法律無例外規定"], ["B", "可舉證後請求法院減輕或免除扶養義務"], ["C", "必須先繼承遺產才可主張免除"], ["D", "可直接對父親提出家庭暴力告訴以抵銷扶養費"]], "ans": "B", "exp": "民法規定子女如有被父母家暴或遺棄等情形，可以請求法院減輕或免除扶養義務，避免形成「養不教卻要奉養」的不公平結果。"}, {"stem": "阿嬤過世後留下遺產，她有一個兒子和兩個女兒。依現行民法規定，下列敘述何者正確？", "opts": [["A", "兒子可分得全部遺產，女兒只能分得象徵性金額"], ["B", "出嫁的女兒喪失繼承權"], ["C", "子女不分性別都有平等繼承遺產的權利"], ["D", "只有與父母同住者才有繼承權"]], "ans": "C", "exp": "現行民法規定手足間不分性別都有平等繼承遺產的權利，已破除傳統「傳子不傳女」的做法，落實家庭中的性別平等。"}, {"stem": "下列哪一種情形，依民法規定經舉證後將「不得繼承」父母的遺產？", "opts": [["A", "子女對父母惡意不扶養或有虐待行為"], ["B", "子女婚後與配偶同住，未與父母同住"], ["C", "子女在國外工作，較少返家探視"], ["D", "子女是收養而來的養子女"]], "ans": "A", "exp": "民法規定子女對父母若有惡意不扶養或重大虐待等行為，經舉證屬實後，將不得繼承遺產。養子女屬於法定血親，仍有繼承權；未同住或在外工作並不影響繼承。"}, {"stem": "比較我國民法修法前後有關「妻子姓氏」的規定，下列何者正確？", "opts": [["A", "修法前後都規定妻須冠夫姓"], ["B", "修法前後都規定夫須冠妻姓"], ["C", "修法後改由戶政機關指定夫妻的姓氏"], ["D", "修法前規定妻冠夫姓，現行法則規定夫妻各保有其姓氏"]], "ans": "D", "exp": "舊民法規定「妻冠夫姓」，現行民法已修正為夫妻各保有其本姓，這是民法朝向家庭平權修正的重要例證之一。"}, {"stem": "關於夫妻「住所」的規定，我國民法的修正方向為何？", "opts": [["A", "改由男方父母指定"], ["B", "改由戶政事務所抽籤決定"], ["C", "由原本「妻以夫之住所為住所」，改為由雙方平等協議婚姻住所"], ["D", "一律以妻的娘家為住所"]], "ans": "C", "exp": "舊法規定妻以夫之住所為住所，現行民法已修正為夫妻應平等協議其婚姻住所，體現配偶雙方地位平等。"}, {"stem": "現行民法對於「夫妻財產」的規定，下列敘述何者正確？", "opts": [["A", "一律由丈夫管理"], ["B", "由夫妻共同選擇採取何種夫妻財產制"], ["C", "財產必須全部登記在妻子名下"], ["D", "婚後所有財產一律歸國家保管"]], "ans": "B", "exp": "舊民法規定夫妻財產由夫管理，現行法已修正為由夫妻共同選擇採取何種夫妻財產制，且夫妻可以各自管理或使用其財產，不受他人干涉。"}, {"stem": "依現行民法規定，子女的姓氏應如何決定？", "opts": [["A", "父母應以書面約定從父姓或母姓，未約定或約定不成者由戶政事務所抽籤決定"], ["B", "一律從父姓，不得變更"], ["C", "一律從母姓，以保障女性權益"], ["D", "由子女滿18歲後自行決定，未成年前不得登記姓氏"]], "ans": "A", "exp": "民法規定父母於子女出生登記前，應以書面約定子女從父姓或母姓；未約定或約定不成者，於戶政事務所抽籤決定，改變過去一律從父姓的做法。"}, {"stem": "小志任職滿6個月，想在兒子滿3歲前申請育嬰留職停薪。他所依據的法律是下列何者？", "opts": [["A", "家庭暴力防治法"], ["B", "民法親屬編"], ["C", "性別平等工作法"], ["D", "原住民族基本法"]], "ans": "C", "exp": "依性別平等工作法規定，不分性別，勞工任職滿6個月後，每生育1名子女，於子女滿3歲前可申請育嬰留職停薪，最長2年。"}, {"stem": "關於我國「育嬰留職停薪」的規定，下列敘述何者正確？", "opts": [["A", "只有女性勞工可以申請"], ["B", "必須任職滿10年才能申請"], ["C", "子女滿6歲前都可以申請，且無年限"], ["D", "不分性別皆可申請，每生育1名子女最長可達2年"]], "ans": "D", "exp": "育嬰留職停薪不分性別皆可申請，任職滿6個月的勞工，每生育1名子女、於子女滿3歲前，可有長達2年的育嬰留職停薪，男性同樣適用。"}, {"stem": "為了讓父母在育嬰留職停薪期間能安心撫育子女，政府提供「育嬰留職停薪津貼」。此津貼的法源與最長給付期間為何？", "opts": [["A", "民法；最長2年"], ["B", "就業保險法；最長6個月"], ["C", "性騷擾防治法；最長3年"], ["D", "家庭暴力防治法；最長1年"]], "ans": "B", "exp": "依就業保險法規定，為使父母在育嬰留職停薪期間得以安心撫育子女，提供最長6個月的育嬰留職停薪津貼，與性別平等工作法所規範的「請假權利」是不同的法律。"}, {"stem": "下列關於「生育率」的敘述，何者正確？", "opts": [["A", "指平均每位婦女一生中所生育的子女數"], ["B", "指每年出生的男嬰與女嬰比例"], ["C", "指65歲以上人口占總人口的比率"], ["D", "指每年結婚的對數"]], "ans": "A", "exp": "生育率是指平均每位婦女一生中所生育的子女數。我國生育率逐年降低，形成嚴重的少子化問題。"}, {"stem": "下列哪一項「不」屬於政府因應少子化所推動的措施？", "opts": [["A", "制定公共托育政策"], ["B", "發放生育給付"], ["C", "提供育兒津貼"], ["D", "設置老人日托中心"]], "ans": "D", "exp": "老人日托中心是因應高齡社會、協助家庭發揮照顧長者功能的措施。公共托育、生育給付、育嬰留職停薪津貼、育兒津貼才是因應少子化、鼓勵生養的政策。"}, {"stem": "依聯合國的定義，當一個國家65歲以上老年人口占總人口的比率達到多少時，稱為「高齡社會」？", "opts": [["A", "7%"], ["B", "10%"], ["C", "14%"], ["D", "20%"]], "ans": "C", "exp": "依聯合國定義，65歲以上人口占總人口7%為「高齡化社會」、14%為「高齡社會」、20%為「超高齡社會」。"}, {"stem": "某國統計顯示，65歲以上人口已占總人口的21%。依聯合國定義，該國屬於下列何者？", "opts": [["A", "高齡化社會"], [     b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

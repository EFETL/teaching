<script>
const QS=[{"stem": "關於「團體」的定義，下列敘述何者最正確？", "opts": [["A", "必須由五人以上組成才能稱為團體"], ["B", "由兩人以上組成，成員間彼此互動，並具有共同目標"], ["C", "成員之間不需要有任何互動，只要人數夠多即可"], ["D", "一定要向政府登記立案，才能算是團體"]], "ans": "B", "exp": "課本定義團體是由兩人以上所組成，成員間彼此互動、具有共同目標，並形成一定程度的認同感。人數、登記與否都不是判斷標準。"}, {"stem": "下列何者「不是」課本所提到人們參加團體的主要目的？", "opts": [["A", "滿足情感需求"], ["B", "實現目標理想"], ["C", "賺取豐厚的個人利潤"], ["D", "保障成員的權益"]], "ans": "C", "exp": "課本列舉參加團體的目的包括滿足情感需求、實現目標理想、保障成員權益。以賺錢營利為主要目的者屬於公司企業，不是課本所指的參與團體目的。"}, {"stem": "阿翔加入學校排球隊後結識許多志同道合的朋友，覺得自己是球隊不可缺少的一分子。這最能說明參加團體可達成下列何種目的？", "opts": [["A", "滿足情感需求，獲得歸屬感"], ["B", "保障勞工的工作權益"], ["C", "監督政府的施政方向"], ["D", "為團體賺取營運經費"]], "ans": "A", "exp": "在團體中結交朋友、拓展人際關係並產生「我是其中一分子」的感受，正是滿足情感需求、獲得歸屬感的表現。"}, {"stem": "課本所說的「歸屬感」，其意涵最接近下列何者？", "opts": [["A", "對外宣傳團體理念，吸引民眾支持"], ["B", "團體內部依專業能力進行分工"], ["C", "政府依法行使管理公共事務的權力"], ["D", "在團體中被接納、關懷與支持，覺得自己和團體密不可分"]], "ans": "D", "exp": "歸屬感是指每個人在團體裡希望被接納、關懷或支持，有了這種感覺就會覺得自己是團體的一分子。(A)(B)是志願結社的運作方式，(C)是公權力。"}, {"stem": "勞工加入工會，透過集體力量與資方協商談判，平衡勞資地位不平等的現象。這主要展現參加團體的哪一種目的？", "opts": [["A", "滿足情感需求"], ["B", "增加公司的營業利潤"], ["C", "保障成員的權益"], ["D", "取代政府行使公權力"]], "ans": "C", "exp": "個人力量有限，集結眾人力量才能更有效地爭取權益。勞工加入工會與資方協商，正是為了保障成員（勞工）的權益。"}, {"stem": "關於「工會」的敘述，下列何者正確？", "opts": [["A", "由從事同類工作或同一企業內的勞工所組成，可與資方協商談判"], ["B", "由企業主（資方）組成，用來管理員工的紀律"], ["C", "屬於政府機關的一部分，具有公權力"], ["D", "主要目的是替股東賺取更多利潤"]], "ans": "A", "exp": "工會是由從事同類工作或同一企業內的勞工（勞方）所組成的團體，透過與資方協商、談判等方式保障勞工權益、改善勞工生活。工會是民間團體，不具公權力，也不以營利為目的。"}, {"stem": "社區居民為了守護自己的家園，成立「社區守望相助隊」，隊員自願報名、定期輪流巡邏。下列敘述何者最恰當？", "opts": [["A", "守望相助隊具有公權力，可以直接逮捕並處罰違規者"], ["B", "因為與治安有關，所以屬於政府組織的一部分"], ["C", "社區居民都被強制編入，屬於非志願團體"], ["D", "既能改善社區環境與安全，也能凝聚居民的情感"]], "ans": "D", "exp": "社區守望相助隊由居民自願組成，兼具「實現共同目標（改善社區安全）」與「滿足情感需求（凝聚居民情感）」兩種功能。它是民間團體，不具公權力，也非強制加入。"}, {"stem": "下列哪一個團體，通常「不是」個人依自由意願加入的？", "opts": [["A", "荒野保護協會"], ["B", "因血緣關係而組成的家庭"], ["C", "學校的熱舞社"], ["D", "伊甸社會福利基金會"]], "ans": "B", "exp": "家庭是基於血緣或婚姻關係自然形成，並非個人自由選擇加入，屬於「非志願團體」；其餘三者都是人民依自由意願組成或參加的志願結社。"}, {"stem": "課本所稱的「志願結社」，其意義最接近下列何者？", "opts": [["A", "人民依自由意願組成或參與、並持續運作的團體"], ["B", "由政府依法設立、負責管理公共事務的機關"], ["C", "以追求最大利潤為目標而設立的公司行號"], ["D", "因血緣或婚姻關係自然形成的團體"]], "ans": "A", "exp": "志願結社是人民依自由意願組成或參與、持續運作的團體。(B)是政府機關，(C)是營利企業，(D)是非志願團體，都與志願結社不同。"}, {"stem": "下列何者最能說明「志願結社」對個人的重要意義？", "opts": [["A", "是政府用來管理人民的重要工具"], ["B", "是個人取得政治權力的唯一途徑"], ["C", "是個人融入社會生活、參與公共事務的重要途徑"], ["D", "是個人累積個人財富的主要方式"]], "ans": "C", "exp": "課本指出志願結社是個人融入社會生活及參與公共事務的重要途徑。它不是政府的管理工具，也不是為了取得權力或累積財富。"}, {"stem": "我國憲法規定：「人民有集會及結社之自由。」這項規定的主要意義為何？", "opts": [["A", "人民成立任何團體都完全不受法律限制"], ["B", "政府可以指定人民必須加入哪些團體"], ["C", "只有年滿十八歲的成年人才可以組成團體"], ["D", "保障人民組成及參與團體的權利"]], "ans": "D", "exp": "憲法保障結社自由，目的在於保障人民組成、參與團體的權利。但這項自由並非毫無界限，若危害國家安全或侵害他人權利仍會受法律限制。"}, {"stem": "《世界人權宣言》規定：「人人有權享有和平集會和結社的自由。不得迫使任何人隸屬於某一團體。」由後半句可知，結社自由還包含下列何種意涵？", "opts": [["A", "人民至少必須加入一個團體"], ["B", "人民也有「不加入」某個團體的自由"], ["C", "政府可以強制解散所有的民間團體"], ["D", "團體成員一旦加入就不得退出"]], "ans": "B", "exp": "「不得迫使任何人隸屬於某一團體」代表加入與否都出於自由意願，因此結社自由既包含「加入的自由」，也包含「不加入的自由」。"}, {"stem": "下列關於「集會自由」與「結社自由」的比較，何者正確？", "opts": [["A", "兩者都未受到我國憲法的保障"], ["B", "集會是指成立團體，結社是指舉辦活動"], ["C", "民眾舉辦路跑活動屬於集會自由，成立路跑團體屬於結社自由"], ["D", "集會受法律規範，結社則完全不受任何法律規範"]], "ans": "C", "exp": "集會指在公共場所或公眾得出入的場所舉行會議、演說或其他聚眾活動；結社則是組成團體。兩者都受憲法保障，也都可能受法律的合理限制。"}, {"stem": "「於公共場所或公眾得出入的場所舉行會議、演說或其他聚眾活動」，這是課本對下列哪一個名詞的說明？", "opts": [["A", "集會"], ["B", "結社"], ["C", "公權力"], ["D", "志願服務"]], "ans": "A", "exp": "這是課本對「集會」的定義。結社是組成團體；公權力是政府依法管理公共事務的權力；志願服務是自願貢獻時間心力而不求報酬的服務。"}, {"stem": "「政府依據法律規定，行使管理公共事務的權力」，指的是下列何者？", "opts": [["A", "結社自由"], ["B", "公權力"], ["C", "歸屬感"], ["D", "非營利性"]], "ans": "B", "exp": "這是課本對「公權力」的定義。志願結社屬於民間組織，缺乏公權力，因此不能像政府一樣強制人民或開罰。"}, {"stem": "政府制定《組織犯罪防制條例》，制裁以犯罪為成立宗旨的幫派組織。這項作法最能說明下列何者？", "opts": [["A", "我國憲法其實並未保障人民的結社自由"], ["B", "政府可以任意解散任何不喜歡的民間團體"], ["C", "所有民間團體的運作都必須受到政府支配"], ["D", "結社自由並非毫無界限，危害國家安全或侵害他人權利的團體須受法律限制"]], "ans": "D", "exp": "憲法保障結社自由，但若團體侵犯他人權利或危害國家安全、社會秩序，仍須受法律限制，《組織犯罪防制條例》即是為杜絕幫派組織而制定。"}, {"stem": "下列哪一個團體的成立，最不可能受到「結社自由」的保障？", "opts": [["A", "以詐騙他人財物為共同目的而組成的集團"], ["B", "關心校園流浪動物的學生社團"], ["C", "由同行勞工組成的職業工會"], ["D", "推動生態保育的環境保護協會"]], "ans": "A", "exp": "詐騙集團以犯罪為宗旨，侵害他人權利、破壞社會秩序，依《組織犯罪防制條例》會受到禁止與處罰，不在結社自由的保障範圍。"}, {"stem": "關於結社自由的保障與限制，下列敘述何者最正確？", "opts": [["A", "只要人民願意，成立任何團體政府都不得干涉"], ["B", "政府只要不認同某團體的主張，就可以命令它解散"], ["C", "憲法保障結社自由，但團體若危害國家安全或侵害他人權利，仍須受法律限制"], ["D", "我國僅以法律保障結社自由，憲法中並未提及"]], "ans": "C", "exp": "結社自由受憲法保障，但屬於有界限的自由；政府亦不得因不認同團體主張就任意解散，必須依法律規定處理。"}, {"stem": "一個國家的人民能否自由參與各類志願結社，最常被用來判斷下列何者？", "opts": [["A", "該國的經濟是否富裕"], ["B", "該國是否民主自由、人民的結社權利是否受到保障"], ["C", "該國的人口是否眾多"], ["D", "該國的國土面積是否遼闊"]], "ans": "B", "exp": "志願結社是人民自由意志的展現，人民能否自由結社，是衡量一個國家民主化、自由化程度的重要指標，與經濟、人口、面積無關。"}, {"stem": "我國自民國76年（1987年）解除戒嚴後，各類民間團體的數量大幅成長。這個現象最能說明下列何者？", "opts": [["A", "政府開始全面接管所有的民間團體"], ["B", "人民不再需要參與公共事務"], ["C", "民間團體的營利能力大幅提升"], ["D", "社會走向民主化與自由化，志願結社蓬勃發展"]], "ans": "D", "exp": "解嚴後人民的結社自由獲得更充分的保障，志願結社蓬勃發展，成為當代臺灣多元社會的特徵，也是民主化、自由化的表現。"}, {"stem": "志願結社的「志願性」是指下列何者？", "opts": [["A", "團體必須無償提供服務，不得收取任何費用"], ["B", "團體的運作方向必須聽從政府安排"], ["C", "成員是基於自由意願加入或組成該團體"], ["D", "團體所有成員都必須擔任志工"]], "ans": "C", "exp": "志願性強調成員基於自由意願加入或組成，與家庭、親屬等非基於個人意願而加入的非志願團體不同。(A)混淆非營利性，(B)與自主性相反。"}, {"stem": "阿美因為關心身心障礙者的處境，主動報名加入伊甸社會福利基金會服務。這最能展現志願結社的哪一項特徵？", "opts": [["A", "志願性"], ["B", "非營利性"], ["C", "組織性"], ["D", "民間性"]], "ans": "A", "exp": "「主動報名加入」顯示成員基於自由意願參與，屬於志願性。若題目強調不以賺錢為目的則為非營利性、強調內部分工則為組織性、強調非政府組織則為民間性。"}, {"stem": "中華民國消費者文教基金會會公布市售食品的檢驗結果，但只有政府才能對違法業者開罰。這最能說明志願結社具有下列何種特徵？", "opts": [["A", "志願性"], ["B", "組織性"], ["C", "非營利性"], ["D", "民間性"]], "ans": "D", "exp": "志願結社屬於非官方的民間組織，不是政府的一部分，因此缺乏公權力，不能像政府一樣裁罰違法者，這就是「民間性」。"}, {"stem": "弘道老人福利基金會設有秘書處、企劃部門、服務部門等單位，各單位任務明確、各司其職。這展現志願結社的哪一項特徵？", "opts": [["A", "志願性"], ["B", "組織性"], ["C", "自主性"], ["D", "民間性"]], "ans": "B", "exp": "為了實現團體目標並提升工作效率，志願結社會成立正式的組織架構、分配成員工作與任務、明定規範進行專業分工，這就是組織性。"}, {"stem": "台灣兒童暨家庭扶助基金會舉辦義賣，所得全數用於弱勢家庭學童的助學金，不分配給成員。這最符合志願結社的哪一項特徵？", "opts": [["A", "非營利性"], ["B", "志願性"], ["C", "組織性"], ["D", "民間性"]], "ans": "A", "exp": "非營利性是指團體不以賺錢為目的，自行籌措經費，即使產生盈餘，也僅能使用在公益目標上，不能分配給成員。"}, {"stem": "喜憨兒社會福利基金會可以自行決定要推動哪些心智障礙者的教育與照顧工作，運作過程不受政府支配。這展現志願結社的哪一項特徵？", "opts": [["A", "民間性"], ["B", "非營利性"], ["C", "自主性"], ["D", "志願性"]], "ans": "C", "exp": "自主性是指在符合法規的前提下，團體可自主決定工作目標與內容，運作過程不受政府支配，能主動探究各類議題。"}, {"stem": "關於志願結社「非營利性」的敘述，下列何者正確？", "opts": [["A", "志願結社完全不能有任何金錢收入"], ["B", "即使義賣產生盈餘，也只能用在達成公益目標上，不能分配給成員"], ["C", "所需經費一律由政府編列預算全額支付"], ["D", "只要團體有任何盈餘，就一定違反非營利性"]], "ans": "B", "exp": "志願結社需自籌經費，可收取會費、募款或舉辦義賣，因此可以有收入，也可能產生盈餘；關鍵在於盈餘不得分配給成員，只能用於達成組織的公益目標。"}, {"stem": "關於志願結社的經費來源，下列何者「最不」符合課本所述？", "opts": [["A", "民眾的小額捐款"], ["B", "企業的贊助"], ["C", "收取會費或舉辦義賣所得"], ["D", "由政府全額補助，並由政府指定經費用途"]], "ans": "D", "exp": "志願結社須自行籌措經費，多來自民眾捐款、企業贊助、會費或義賣。若經費全由政府提供並由政府指定用途，將違反其民間性與自主性。"}, {"stem": "志願結社為什麼要建立正式的組織架構並進行專業分工？", "opts": [["A", "為了取得政府授予的公權力"], ["B", "為了把利潤平均分配給每位成員"], ["C", "為了實現團體目標並提升工作效率"], ["D", "為了方便接受政府的指揮與監督"]], "ans": "C", "exp": "組織性的目的在於實現團體目標、提升工作效率，因此成立組織架構、分配工作任務並明定規範進行專業分工。"}, {"stem": "社區巡守隊的成員都是主動加入的居民；對違規者不具強制力；內部分工明確；不以賺錢為目的；巡守時間由隊員自行安排。下列「特徵配對」何者**錯誤**？", "opts": [["A", "對違規者不具強制力 → 組織性"], ["B", "成員主動加入 → 志願性"], ["C", "不以賺錢為目的 → 非營利性"], ["D", "巡守時間自行安排 → 自主性"]], "ans": "A", "exp": "「對違規者不具強制力」代表缺乏公權力，應對應「民間性」而非組織性；組織性應以「內部分工明確」來判斷。"}, {"stem": "下列哪一個團體，最不符合「志願結社」的定義？", "opts": [["A", "荒野保護協會"], ["B", "喜憨兒社會福利基金會"], ["C", "學校的吉他社"], ["D", "縣市政府的環境保護局"]], "ans": "D", "exp": "環境保護局是政府機關，具有公權力、經費由政府編列，不符合志願結社的志願性、民間性與自主性；其餘三者皆為人民自由意願組成的民間團體。"}, {"stem": "某民間協會表示：「我們要辦什麼活動、服務哪些對象、如何募款，都由本會理監事會依章程自行決定。」這最能看出該協會具有下列何種特徵？", "opts": [["A", "非營利性"], ["B", "自主性"], ["C", "組織性"], ["D", "志願性"]], "ans": "B", "exp": "題幹強調「自行決定」工作目標與運作方式、不受外力支配，屬於自主性。若強調不分配盈餘則為非營利性、強調成員自由加入則為志願性。"}, {"stem": "志願結社與一般公司企業，最主要的差別在於下列何者？", "opts": [["A", "志願結社不以營利為目的，盈餘不能分配給成員"], ["B", "志願結社完全不需要任何組織與分工"], ["C", "志願結社的成員都是被強制加入的"], ["D", "志願結社具有公權力，可以強制他人服從"]], "ans": "A", "exp": "兩者都是民間組織、都有組織分工、成員也都可自由加入，最關鍵的差異在於營利與否：公司以營利、分配利潤為目的，志願結社的盈餘僅能用於公益目標。"}, {"stem": "志願結社與政府機關，最主要的差別在於下列何者？", "opts": [["A", "志願結社的成員人數一定比政府機關多"], ["B", "志願結社擁有的經費一定比政府機關充足"], ["C", "志願結社屬於民間組織，缺乏公權力，不能強制人民服從"], ["D", "志願結社不必遵守國家的法律規定"]], "ans": "C", "exp": "志願結社具民間性，並非政府組織的一部分，缺乏公權力；但它仍必須在符合法規的前提下運作，並非不受法律規範。"}, {"stem": "世界展望會在辦理「飢餓三十」大型活動前，會先劃分文宣、募款、場地、志工管理等小組，各組負責不同任務。這種作法主要是為了下列何者？", "opts": [["A", "增加每位成員的個人收入"], ["B", "取得政府授權的公權力"], ["C", "使團體可以不受法律規範"], ["D", "透過制度化的分工提升運作效率"]], "ans": "D", "exp": "這是志願結社「組織性」的表現：建立組織架構、進行制度化分工，以實現團體目標並提升工作效率。"}, {"stem": "民國81年一場幼稚園火燒車意外後，一群民眾自主成立靖娟兒童安全文教基金會，集結各界資源推動兒童交通安全教育。這最能說明志願結社的哪一項影響？", "opts": [["A", "取代政府執行公權力"], ["B", "集結群體的力量，共同實現公益理想"], ["C", "增加參與成員的個人收入"], ["D", "減少人民參與公共事務的機會"]], "ans": "B", "exp": "個人的金錢、力量有限，必須透過志願結社集結更多資源與人力，才能實現公益或為弱勢群體爭取權益，這就是「集結群體的力量」。"}, {"stem": "志願結社透過長期穩定的互動與扶持，形成凝聚力，鼓勵成員積極參與公共事務；對外也宣導理念，吸引更多民眾關注與支持。這說明志願結社能發揮下列何種影響？", "opts": [["A", "集結群體的力量"], ["B", "監督及影響政府施政"], ["C", "提供人民參與公共事務的管道"], ["D", "增加政府的稅收收入"]], "ans": "C", "exp": "題幹同時描述「對內凝聚成員、鼓勵參與」與「對外宣導理念、吸引支持」，正是課本所述「提供參與的管道」這項影響。"}, {"stem": "「行人零死亡推動聯盟」在凱達格蘭大道舉行「還路於民大遊行」，呼籲政府正視交通改革、儘速提出解決方法。這最能展現志願結社的哪一項影響？", "opts": [["A", "監督及影響政府的施政"], ["B", "滿足成員的情感需求"], ["C", "增加團體的營業收入"], ["D", "代替政府直接制定法律"]], "ans": "A", "exp": "針對公共議題向政府提出建議與評價、督促政府改善，屬於「監督及影響政府施政」。民間團體不能自行制定法律，只能促成政府修法。"}, {"stem": "志願結社之所以「較能」有效監督政府施政，主要原因為何？", "opts": [["A", "因為它擁有比政府更大的公權力"], ["B", "因為它在經費與人員運用上不受政府支配，能獨立提出建議與評價"], ["C", "因為它的主要成員都是政府官員"], ["D", "因為法律規定政府必須完全聽從民間團體的意見"]], "ans": "B", "exp": "志願結社在經費、人員運用上不受政府支配（自主性、民間性），因此能較客觀、主動地針對公共議題提出建議與批評，發揮監督功能。"}, {"stem": "柯媽媽在車禍中失去愛子後，成立中華民國車禍受難者救援協會，長期奔走，最後成功催生《強制汽車責任保險法》。這個案例最能說明下列何者？", "opts": [["A", "民間團體可以直接制定並公布法律"], ["B", "個人力量已足夠改變社會，不需要組織團體"], ["C", "志願結社成立的主要目的是為了營利"], ["D", "志願結社能影響政府施政，促成保障人民權益的制度"]], "ans": "D", "exp": "民間團體無法自行立法，但可透過倡議與監督促使政府制定政策法律，這正是志願結社「影響與監督政府施政」的具體成果。"}, {"stem": "下列何者「不是」課本所述志願結社對公共生活的影響？", "opts": [["A", "代替政府行使公權力，直接處罰違法的人"], ["B", "集結群體的力量"], ["C", "提供人民參與公共事務的管道"], ["D", "監督及影響政府施政"]], "ans": "A", "exp": "志願結社具民間性、缺乏公權力，不能取代政府執行裁罰。(B)(C)(D)才是課本歸納的三項影響。"}, {"stem": "綠色和平組織長期以連署、遊說、發布研究報告等方式向政府與企業施壓，最後促成歐洲議會通過反毀林法案。下列敘述何者最恰當？", "opts": [["A", "該組織屬於政府機關，所以才能推動法案"], ["B", "該組織成立的目的是為了賺取更多利潤"], ["C", "該組織具有公權力，可以強制企業配合"], ["D", "該組織展現民間團體監督與影響政策的力量"]], "ans": "D", "exp": "綠色和平是非政府的民間環保組織，不具公權力，也不以營利為目的；它透過倡議與施壓影響政府與企業，屬於監督及影響政府施政的表現。"}, {"stem": "課本所稱的「志願服務」，其意義最接近下列何者？", "opts": [["A", "政府強制人民必須從事的義務勞動"], ["B", "以領取高額報酬為主要目的的兼職工作"], ["C", "民眾自願以知識、勞力、時間、技術貢獻社會，不以獲取報酬為目的"], ["D", "學校規定學生每學期必須完成的課業作業"]], "ans": "C", "exp": "志願服務是民眾自願貢獻知識、勞力、時間、技術等，不以獲取報酬為目的，用以提高公共事務效能、增進社會公益的服務。"}, {"stem": "阿賢利用週末時間到創世社會福利基金會擔任志工，協助募集發票。關於這項行為，下列敘述何者最恰當？", "opts": [["A", "必須具備專業證照的人才可以擔任志工"], ["B", "這是國中生參與公共事務、培養公民能力的方式之一"], ["C", "志工服務的目的是為了獲取高額報酬"], ["D", "只有成年人才能從事志願服務，國中生並不適合"]], "ans": "B", "exp": "課本鼓勵國中階段的學生透過參與校內團體活動或利用課餘時間參加校外團體從事志願服務，藉此培養參與公共事務的能力。"}, {"stem": "國中生若想參與公共事務、累積社會參與的經驗，下列作法何者「最不適當」？", "opts": [["A", "參加學校社團並協助辦理服務性活動"], ["B", "利用課餘時間到社會福利團體擔任志工"], ["C", "參與淨灘、淨山等環保團體舉辦的活動"], ["D", "加入以恐嚇同學、收取保護費為目的的組織"]], "ans": "D", "exp": "以犯罪為宗旨的組織會侵害他人權利、危害社會治安，不受結社自由保障，並會受《組織犯罪防制條例》制裁，絕非參與公共事務的正當方式。"}, {"stem": "「愛狗一族」是溫暖國中一群熱愛校狗的學生自發性組成的社團，設有清潔組、照護組、義賣組與宣傳組，義賣自製明信片的所得全數捐給流浪狗之家。下列敘述何者**錯誤**？", "opts": [["A", "由義賣所得全數捐出，可看出該社團具有公權力"], ["B", "由學生自發性組成，可看出其志願性"], ["C", "由設有清潔組、照護組等分工，可看出其組織性"], ["D", "由義賣所得不分給成員，可看出其非營利性"]], "ans": "A", "exp": "義賣所得全數捐出所反映的是「非營利性」，與公權力無關；學生社團屬於民間團體，本來就不具公權力。"}, {"stem": "承上題，下列敘述何者最符合「結社自由」的概念？", "opts": [["A", "「愛狗一族」由校內教師指定特定學生組成"], ["B", "「愛狗一族」由一群熱愛校狗的學生依自由意願自發性組成"], ["C", "校方可以任意限制「愛狗一族」的所有活動"], ["D", "結社自由只適用於成年公民，未成年學生並不適用"]], "ans": "B", "exp": "結社自由的核心是「依自由意願」組成或參加團體。被指定加入不符合志願性；未成年人同樣享有結社自由；校方也不能無理由地任意限制學生社團。"}, {"stem": "某基金會以協助戒藥癮更生人重返社會為目標，設立實習餐廳與烘焙坊培訓其技能，並對外宣導理念，吸引更多民眾關注與支持。這最能說明志願結社的哪些作用？\n（甲）集結群體的資源與人力　（乙）提供民眾參與公共事務的管道　（丙）代替政府行使公權力　（丁）為成員賺取並分配利潤", "opts": [["A", "甲丙"], ["B", "乙丁"], ["C", "甲乙"], ["D", "丙丁"]], "ans": "C", "exp": "該基金會集結資源與人力協助弱勢（甲），並對外宣導理念吸引民眾關注支持（乙）。志願結社不具公權力（丙錯），也不以營利、分配利潤為目的（丁錯）。"}, {"stem": "下列有關「非志願團體」與「志願結社」的比較，何者正確？", "opts": [["A", "家庭屬於非志願團體，環境保護協會屬於志願結社"], ["B", "兩者的成員都是依個人自由意願加入"], ["C", "志願結社依血緣關係組成，非志願團體依共同興趣組成"], ["D", "只有非志願團體才受到憲法結社自由的保障"]], "ans": "A", "exp": "家庭因血緣、婚姻關係而形成，並非個人自由選擇，屬於非志願團體；環保協會則由人民依自由意願組成，屬於志願結社，並受結社自由保障。"}, {"stem": "綜合本課內容，下列有關志願結社的敘述何者最正確？", "opts": [["A", "志願結社既然是民間團體，就不必遵守國家的法律"], ["B", "志願結社的最終目的是為成員賺取更多利潤"], ["C", "人民熱衷參與志願結社，會削弱民主政治的發展"], ["D", "志願結社是人民參與公共事務的重要管道，也是民主社會的重要基礎"]], "ans": "D", "exp": "志願結社須在符合法規的前提下運作（A錯）、不以營利為目的（B錯）；人民踴躍結社正是民主化、自由化的指標，能強化而非削弱民主（C錯）。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

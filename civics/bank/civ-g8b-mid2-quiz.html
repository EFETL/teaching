<script>
const QS=[{"stem": "關於「違法行為」與「犯罪行為」兩者的關係，下列敘述何者正確？", "opts": [["A", "違法行為一定是犯罪行為"], ["B", "犯罪行為不一定是違法行為"], ["C", "犯罪行為一定是違法行為，但違法行為不一定是犯罪行為"], ["D", "兩者所指的範圍完全相同，可以互相取代"]], "ans": "C", "exp": "違法是指違反任何法律規定的行為；犯罪則是指已經觸犯「刑法」規定的行為。刑法只是眾多法律中的一種，所以犯罪必定違法，但違法未必構成犯罪。"}, {"stem": "我國「刑法」主要規範的內容為下列何者？", "opts": [["A", "何種行為構成犯罪，以及犯罪之後應受何種刑罰"], ["B", "私人之間買賣、租賃等權利義務關係"], ["C", "行政機關行使職權時應遵守的程序"], ["D", "國家機關的組織與人民的基本權利"]], "ans": "A", "exp": "刑法是規範「什麼行為構成犯罪」以及「犯罪後要如何處罰」的法律。(B) 是民法，(C) 是行政法，(D) 是憲法。"}, {"stem": "下列哪一個人的行為最可能構成「犯罪行為」？", "opts": [["A", "小美在公園亂丟垃圾"], ["B", "阿豪騎機車時邊看手機"], ["C", "大雄上班趕時間而闖紅燈"], ["D", "小張趁店家不注意，偷走架上的商品"]], "ans": "D", "exp": "(A)(B)(C) 都是違反環保或交通法規的違法行為，會被開罰單，但未觸犯刑法；(D) 偷竊觸犯刑法的竊盜罪，屬於犯罪行為。"}, {"stem": "阿明將家中的垃圾隨意丟棄在公園草地上，被清潔隊員舉發。關於阿明行為的法律判斷，下列何者最正確？", "opts": [["A", "觸犯刑法，必須負起刑事責任"], ["B", "屬於違法行為，但並未構成犯罪"], ["C", "既不違法，也不構成犯罪"], ["D", "屬於犯罪行為，應處以有期徒刑"]], "ans": "B", "exp": "亂丟垃圾違反廢棄物清理法，屬於違法行為，會被處以罰鍰，但刑法並未將此行為列為犯罪，因此不構成犯罪行為，也不必負刑事責任。"}, {"stem": "國家為什麼要用比較嚴厲的方式（刑罰）來處罰犯罪行為？下列理由何者最恰當？", "opts": [["A", "因為犯罪行為會侵害他人生命財產、破壞社會秩序或危害國家安全"], ["B", "因為犯罪行為只會損害犯罪者自己的利益"], ["C", "因為民事賠償的金額往往太低，不敷成本"], ["D", "因為國家需要藉此增加國庫的收入"]], "ans": "A", "exp": "課本指出，犯罪行為會侵害他人的生命財產、破壞社會秩序或國家安全，危害較大，因此國家必須採取較嚴厲的方式處罰，以保護個人、社會與國家的利益。"}, {"stem": "大方積欠阿玉新臺幣100萬元遲遲不還。關於此事的法律性質，下列判斷何者正確？", "opts": [["A", "屬於刑事案件，大方須負刑事責任並入監服刑"], ["B", "屬於犯罪行為，大方應被處以拘役"], ["C", "屬於民事案件，大方須負民事的清償責任"], ["D", "屬於行政違規，大方應被處以罰鍰"]], "ans": "C", "exp": "欠錢不還是私人之間的債權債務問題，屬於民法規範的民事案件；刑法並未把「單純欠錢不還」列為犯罪，因此不必負刑事責任。"}, {"stem": "我國刑法第一條規定：「行為之處罰，以行為時之法律有明文規定者為限。」這條規定所展現的是下列哪一項原則？", "opts": [["A", "無罪推定原則"], ["B", "罪刑法定原則"], ["C", "依法行政原則"], ["D", "契約自由原則"]], "ans": "B", "exp": "「行為之處罰，以行為時之法律有明文規定者為限」正是罪刑法定原則的條文依據，也是刑法最重要的精神。"}, {"stem": "罪刑法定原則最主要的目的為何？", "opts": [["A", "加重所有犯罪者的刑度，以收嚇阻之效"], ["B", "讓法官可以完全依自由心證判決案件"], ["C", "提高警察機關的破案率"], ["D", "防止國家任意陷人民入罪，藉以保障人權"]], "ans": "D", "exp": "罪刑法定原則的核心在於限制國家的刑罰權，避免國家濫用權力隨意處罰人民，達到保障人權的目的。"}, {"stem": "我國原本對酒後駕車只依道路交通管理處罰條例開罰單，直到立法院修法將酒駕納入刑法的公共危險罪後，酒駕才成為犯罪行為。這個過程最能說明下列何項概念？", "opts": [["A", "罪刑法定原則"], ["B", "刑罰的矯正目的"], ["C", "責任能力的區分標準"], ["D", "沒收具有獨立性"]], "ans": "A", "exp": "修法「之前」刑法沒有明文規定，酒駕就不構成犯罪；修法「之後」有了明文規定，酒駕才成為犯罪行為。這正是罪刑法定原則的具體實例。"}, {"stem": "政府修法規定，拍攝兒少性影像者最高可處10年有期徒刑。若某人是在「修法前」拍攝，依罪刑法定原則判斷，下列敘述何者正確？", "opts": [["A", "可以直接依新法從重處罰"], ["B", "可以依新法處罰，但應減輕其刑"], ["C", "不能依新法處罰，因為行為當時法律尚無此規定"], ["D", "由法官視情節自行決定是否適用新法"]], "ans": "C", "exp": "罪刑法定原則要求「以行為時之法律有明文規定者為限」。行為當時新法尚未施行，就不能用後來制定的法律回頭處罰他。"}, {"stem": "小美未經同意就登入同學的社群帳號偷看聊天紀錄。丹丹說：「小美做的時候根本不知道刑法有處罰這種行為，所以不算犯罪。」關於丹丹的說法，下列評論何者正確？", "opts": [["A", "正確，因為「不知者無罪」是刑法的基本原則"], ["B", "正確，這正好符合罪刑法定原則的精神"], ["C", "錯誤，因為刑法只處罰過失而不處罰故意"], ["D", "錯誤，罪刑法定看的是「行為時法律有無明文規定」，而不是行為人是否知情"]], "ans": "D", "exp": "罪刑法定原則判斷的標準是行為當時法律有沒有明文規定，與行為人主觀上知不知道法律無關。刑法早在民國108年就明定無故入侵他人電腦設備要處罰，小美的行為已經構成犯罪。"}, {"stem": "除了限制國家權力之外，罪刑法定原則對一般人民還有下列何種功能？", "opts": [["A", "保證犯罪者一定不會被判刑"], ["B", "讓人民事先了解哪些行為會受刑罰制裁，以減少犯罪的發生"], ["C", "使國家可以任意擴張處罰的範圍"], ["D", "讓被害人可以自行對加害人施以私刑"]], "ans": "B", "exp": "課本指出，罪刑法定原則除了防止國家任意陷人民入罪，也能讓人民明確知道哪些行為會受到刑罰制裁，進而減少犯罪行為的發生。"}, {"stem": "關於「私刑」的敘述，下列何者正確？", "opts": [["A", "私刑是法律所允許的正義實現方式"], ["B", "私刑屬於我國刑罰種類中的從刑"], ["C", "私刑是未經刑事訴訟程序、私自懲罰他人的行為，法律並不允許"], ["D", "私刑比司法審判更能做出公正客觀的判斷"]], "ans": "C", "exp": "私刑指未經法定程序、私自以懲罰為名侵害他人權利的行為。每個人對「應有的懲罰」想像不一，以暴制暴反而造成更大傷害並妨礙公權力行使，因此法律不允許私刑。"}, {"stem": "「刑罰應讓犯罪者得到應有的處罰，以撫平被害人及其家屬所受的傷害。」這段話所描述的刑罰目的為何？", "opts": [["A", "懲罰犯罪"], ["B", "嚇阻犯罪"], ["C", "矯正犯罪"], ["D", "補償犯罪"]], "ans": "A", "exp": "讓犯罪者受到應有制裁、伸張正義並撫平被害人傷痛，屬於刑罰「懲罰犯罪」的目的。"}, {"stem": "機場、港口等地設有「販毒、運毒最重可處死刑」的告示牌。此種作法最符合刑罰的哪一項目的？", "opts": [["A", "懲罰犯罪"], ["B", "矯正犯罪"], ["C", "沒收犯罪所得"], ["D", "嚇阻犯罪"]], "ans": "D", "exp": "藉由公告嚴厲刑責使民眾心生畏懼、不敢以身試法，屬於嚇阻（預防）犯罪的目的。"}, {"stem": "彰化監獄成立「儒林烘焙坊」，讓表現良好的受刑人學習製作蛋黃酥並販售。這項作法最能展現刑罰的哪一項目的？", "opts": [["A", "懲罰犯罪"], ["B", "矯正犯罪"], ["C", "嚇阻犯罪"], ["D", "沒收犯罪所得"]], "ans": "B", "exp": "透過教化與技藝訓練，使受刑人習得一技之長、改過向善並順利重返社會，屬於刑罰「矯正犯罪」的目的。"}, {"stem": "課本提到：「除非其他法律不能有效防制不法行為，才會動用刑罰。」這句話的意思是下列何者？", "opts": [["A", "刑罰可以完全取代民法與行政法"], ["B", "國家應把刑罰當成解決犯罪問題的萬靈丹"], ["C", "刑罰是最後且最不得已的制裁手段，必須謹慎行使"], ["D", "只要出現社會問題，國家就應盡量增訂刑罰"]], "ans": "C", "exp": "刑罰是所有法律中最嚴厲的制裁手段，會剝奪人民的生命、自由或財產，因此必須謹慎、節制地使用，是最後手段。"}, {"stem": "關於「告訴乃論」與「非告訴乃論」之罪，下列敘述何者正確？", "opts": [["A", "不論是告訴乃論或非告訴乃論之罪，被害人都可以向檢察官提出告訴"], ["B", "告訴乃論之罪的案件由被害人自行審判並決定刑度"], ["C", "非告訴乃論之罪，被害人可以隨時撤回告訴"], ["D", "告訴乃論之罪，檢察官一律不得提起公訴"]], "ans": "A", "exp": "兩類犯罪的被害人都可以向檢察官提出告訴，由檢察官決定是否提起公訴；兩者的關鍵差別在於「被害人能不能撤回告訴」。"}, {"stem": "依我國刑法規定，下列哪一組全部都屬於「主刑」？", "opts": [["A", "死刑、無期徒刑、有期徒刑、拘役、褫奪公權"], ["B", "死刑、無期徒刑、有期徒刑、拘役、罰金"], ["C", "死刑、無期徒刑、罰金、罰鍰、沒收"], ["D", "有期徒刑、拘役、罰金、褫奪公權、沒收"]], "ans": "B", "exp": "主刑共五種：死刑、無期徒刑、有期徒刑、拘役、罰金。褫奪公權是從刑，罰鍰是行政罰，沒收則具獨立法律效果，皆不屬主刑。"}, {"stem": "下列何者屬於我國刑法規定的「從刑」？", "opts": [["A", "罰金"], ["B", "拘役"], ["C", "沒收"], ["D", "褫奪公權"]], "ans": "D", "exp": "我國刑法規定的從刑為褫奪公權。罰金與拘役都是主刑；沒收自刑法修訂後具獨立法律效果，可單獨宣告，不屬於從刑。"}, {"stem": "主刑與從刑最主要的差別為下列何者？", "opts": [["A", "主刑可以單獨科處，從刑必須附隨於主刑而不能單獨科處"], ["B", "主刑的刑度一定比從刑輕"], ["C", "主刑由法官宣告，從刑由檢察官宣告"], ["D", "主刑一律剝奪財產，從刑一律剝奪自由"]], "ans": "A", "exp": "主刑是可以單獨科處的刑罰；從刑則附隨於主刑，不能單獨科處，這是兩者最關鍵的區分標準。"}, {"stem": "下列哪一種主刑是以「剝奪生命」作為制裁內容？", "opts": [["A", "無期徒刑"], ["B", "有期徒刑"], ["C", "死刑"], ["D", "褫奪公權"]], "ans": "C", "exp": "死刑剝奪的是生命；無期徒刑與有期徒刑剝奪的是人身自由；褫奪公權剝奪的是擔任公職的資格。"}, {"stem": "「罰金」這項主刑主要剝奪犯罪者的何種權益？", "opts": [["A", "生命"], ["B", "人身自由"], ["C", "參政的資格"], ["D", "財產"]], "ans": "D", "exp": "罰金是命犯罪者繳納一定金錢的主刑，剝奪的是財產。"}, {"stem": "「褫奪公權」所剝奪的是下列何者？", "opts": [["A", "犯罪者的人身自由"], ["B", "犯罪者擔任公務員及公職候選人的資格"], ["C", "犯罪者的全部財產"], ["D", "犯罪者的言論自由"]], "ans": "B", "exp": "褫奪公權剝奪的是個人成為公職候選人及公務員的資格，也就是部分參政權，並非剝奪自由或財產。"}, {"stem": "關於主刑中的「拘役」，下列敘述何者正確？", "opts": [["A", "是短期剝奪人身自由的刑罰，期限原則上不超過60日，必要時得加至120日"], ["B", "是長期剝奪人身自由的刑罰，最短也要1年以上"], ["C", "是剝奪財產的刑罰，須繳納一定金額"], ["D", "屬於從刑，不可以單獨科處"]], "ans": "A", "exp": "拘役是短期剝奪犯罪行為人自由的主刑，須經法院判決才可施行，期限原則上不超過60日，必要時得加至120日。"}, {"stem": "下列刑罰中，何者「不是」主刑？", "opts": [["A", "拘役"], ["B", "罰金"], ["C", "無期徒刑"], ["D", "褫奪公權"]], "ans": "D", "exp": "主刑包括死刑、無期徒刑、有期徒刑、拘役、罰金五種；褫奪公權是從刑，必須附隨主刑科處。"}, {"stem": "法官判決某被告「有期徒刑3年，褫奪公權2年」。關於這兩項刑罰的性質，下列判斷何者正確？", 公所的調解委員會聲請調解"], ["D", "向法院提起民事訴訟，請法官判決"]], "ans": "A", "exp": "買賣契約糾紛屬於民事紛爭，國家公權力原則上不主動介入，警察也無權判定民事賠償責任。民事紛爭的解決途徑是和解、調解與民事訴訟。"}, {"stem": "關於「訴訟外和解」的敘述，下列何者正確？", "opts": [["A", "必須在法官面前進行才能成立"], ["B", "成立後與法院確定判決具有相同效力"], ["C", "一方反悔時，另一方可直接聲請法院強制執行"], ["D", "只具民法上的契約效力，不具強制執行力"]], "ans": "D", "exp": "訴訟外和解（私下和解）是當事人私下訂立的和解契約，程序最簡便，但僅有民法上的契約效力；若一方反悔，另一方仍須另行提起民事訴訟，不能直接聲請強制執行。"}, {"stem": "阿明與鄰居因車禍賠償問題已經打起官司，兩人在開庭時於法官面前達成協議並終止訴訟。這種方式屬於下列何者？", "opts": [["A", "訴訟外和解"], ["B", "訴訟上和解"], ["C", "調解"], ["D", "仲裁"]], "ans": "B", "exp": "針對已經進入訴訟的民事案件，當事人在法官面前達成和解而終止訴訟，稱為訴訟上和解，其效力等同法院確定判決，具強制執行力。"}, {"stem": "下列關於「訴訟上和解」與「訴訟外和解」的比較，何者正確？", "opts": [["A", "訴訟上和解須先提起訴訟，較訴訟外和解費時費事"], ["B", "訴訟外和解的效力等同法院確定判決"], ["C", "兩者都必須經過法院核定才會生效"], ["D", "訴訟上和解不成立時，當事人不得再提起訴訟"]], "ans": "A", "exp": "訴訟上和解必須先進入訴訟程序，才能在法官面前和解，因此比私下進行的訴訟外和解費事費時；但其效力等同確定判決。訴訟外和解則簡便省時，卻只有契約效力。"}, {"stem": "依鄉鎮市調解條例規定，我國的調解委員會設置於下列何處？", "opts": [["A", "各地方法院內"], ["B", "各地檢察署內"], ["C", "各鄉、鎮、市、區公所"], ["D", "各縣市警察局內"]], "ans": "C", "exp": "依鄉鎮市調解條例，各鄉、鎮、市、區公所均設有調解委員會，由地方上有名望並熟悉法律的公正人士擔任調解委員，為民眾免費調解。"}, {"stem": "關於調解委員的敘述，下列何者正確？", "opts": [["A", "由地方法院法官兼任，具法官身分"], ["B", "由地方上有名望且熟悉法律的公正人士擔任"], ["C", "由檢察官指派的司法警察擔任"], ["D", "由當事人各自委任的律師互相推選"]], "ans": "B", "exp": "調解委員是地方上有名望、熟諳法律的熱心公正人士，擔任居間協調的第三人，並非法官、檢察官或當事人的律師。"}, {"stem": "調解成立後，調解書必須經過下列何種程序，才會取得與法院確定判決相同的效力？", "opts": [["A", "送交檢察署備查"], ["B", "送交鄉鎮市公所公告"], ["C", "由雙方當事人到警察局登記"], ["D", "送交法院核定"]], "ans": "D", "exp": "調解成立時，調解委員會應作成調解書，送交法院核定；經法院核定後，其效力等同法院確定判決，具強制執行力，當事人就該事件原則上不得再提起訴訟。"}, {"stem": "「調解」與「訴訟外和解」最主要的差別在於下列何者？", "opts": [["A", "調解有公正第三人居間協調，訴訟外和解則由當事人自行協商"], ["B", "調解必須付費，訴訟外和解則免費"], ["C", "調解只能處理刑事案件，訴訟外和解只能處理民事案件"], ["D", "調解由法官主持，訴訟外和解由檢察官主持"]], "ans": "A", "exp": "兩者最大差異在於是否有第三人介入：調解由調解委員擔任公正第三人居間協調，且調解書經法院核定後具強制執行力；訴訟外和解則是當事人私下協商訂約，僅具契約效力。調解免費，兩者也都不由法官或檢察官主持。"}, {"stem": "小華想解決車禍賠償糾紛，他希望「不必花錢、程序簡單，而且結果可以聲請強制執行」。最符合他需求的途徑是下列何者？", "opts": [["A", "訴訟外和解"], ["B", "向調解委員會聲請調解"], ["C", "直接提起民事訴訟"], ["D", "向警察機關提出告發"]], "ans": "B", "exp": "調解的優點正是程序簡便、省時且免費，調解書經法院核定後與確定判決同效力，可聲請強制執行。訴訟外和解免費但無強制執行力；民事訴訟則要繳裁判費且耗時。"}, {"stem": "下列關於民事訴訟的敘述，何者正確？", "opts": [["A", "由檢察官代表國家向法院提起"], ["B", "由法官主動介入調查、蒐集證據"], ["C", "警察發現糾紛後應主動移送法院審理"], ["D", "須由權利受侵害的當事人主動提起，法院才會審理"]], "ans": "D", "exp": "民事訴訟採「不告不理」，必須由權利受損的一方主動擔任原告向法院起訴，法院才會開始審理；檢察官提起的是刑事公訴，與民事訴訟無關。"}, {"stem": "民事訴訟進行時，法官的角色為何？", "opts": [["A", "主動蒐集雙方證據，替弱勢一方舉證"], ["B", "指揮警察前往現場調查案情"], ["C", "依雙方提出的證據、主張與辯論內容作出判決"], ["D", "代表國家追訴違法行為並要求賠償"]], "ans": "C", "exp": "民事訴訟中法官擔任中立的裁判者，原則上不主動介入調查與蒐證，而是依雙方當事人提出的證據、主張及辯論內容，公正審理後依法判決。"}, {"stem": "課本把民事訴訟視為解決民事紛爭的「最後手段」，主要原因為何？", "opts": [["A", "需繳裁判費或律師費，且程序冗長、費時費力"], ["B", "判決結果對雙方當事人都沒有拘束力"], ["C", "判決結果不具有強制執行力"], ["D", "提起訴訟後就不能再委任律師"]], "ans": "A", "exp": "民事訴訟並非免費，當事人須負擔裁判費或律師費，程序又相當冗長，花錢又費時費力，因此通常被視為最後手段；但其判決具強制執行力，也可委任律師。"}, {"stem": "民事訴訟中，「提起訴訟的一方，即權利受損的人」稱為什麼？", "opts": [["A", "告訴人"], ["B", "原告"], ["C", "檢察官"], ["D", "自訴人"]], "ans": "B", "exp": "民事訴訟中主動提起訴訟的一方稱為原告，被起訴的一方（損害他人權利者）稱為被告。告訴人、自訴人是刑事案件中的稱呼。"}, {"stem": "在民事法庭中，負責製作開庭筆錄的人員是誰？", "opts": [["A", "通譯"], ["B", "律師"], ["C", "書記官"], ["D", "法警"]], "ans": "C", "exp": "民事法庭席位中，書記官負責製作筆錄，通譯負責翻譯，律師接受當事人委託為其辯護，法官依法獨立審判。"}, {"stem": "債主向法院聲請，請求國家以公權力強制欠債的人履行債務，這個程序稱為什麼？", "opts": [["A", "假處分"], ["B", "上訴"], ["C", "不起訴處分"], ["D", "強制執行"]], "ans": "D", "exp": "強制執行是指債權人向法院提出聲請，透過國家公權力強制債務人履行義務。訴訟上和解、經核定的調解書與確定判決都可作為強制執行的依據。"}, {"stem": "依課本流程圖，當「調解不成立」時，當事人接下來可以怎麼做？", "opts": [["A", "該事件從此不得再爭執"], ["B", "仍可自行向法院提起民事訴訟"], ["C", "必須由調解委員代為起訴"], ["D", "必須改由檢察官提起公訴"]], "ans": "B", "exp": "調解不成立並不影響當事人的訴訟權，只是多了一個救濟管道；當事人仍可自行向法院提起民事訴訟。反之，調解成立並經法院核定後，原則上就不得再就該事件起訴。"}, {"stem": "依刑事訴訟法，追訴及處罰犯罪的過程稱為刑事訴訟，其正確順序為何？", "opts": [["A", "偵查→起訴→審判→執行"], ["B", "起訴→偵查→執行→審判"], ["C", "偵查→審判→起訴→執行"], ["D", "告訴→調解→審判→執行"]], "ans": "A", "exp": "刑事訴訟分為偵查、起訴、審判、執行四個階段：檢察官偵查蒐證後決定是否起訴，法院受理起訴後進行審判，判決確定後再由檢察官指揮執行。"}, {"stem": "下列關於「偵查」的敘述，何者正確？", "opts": [["A", "偵查程序應全程公開，以昭公信"], ["B", "偵查的主導者是法官，警察負責審理"], ["C", "偵查是調查有無犯罪事實、蒐集刑事證據的法律程序"], ["D", "只有被害人提出告訴，檢察官才可以開始偵查"]], "ans": "C", "exp": "偵查是調查有無犯罪事實、蒐集案件證據的法律程序，採偵查不公開原則。除了告訴之外，告發、自首或檢察官因其他情事知有犯罪嫌疑時，都可以開始偵查。"}, {"stem": "檢察官偵辦案件時，不對外公開偵辦過程中取得的資料，這是遵守下列何種原則？", "opts": [["A", "無罪推定原則"], ["B", "罪刑法定原則"], ["C", "不告不理原則"], ["D", "偵查不公開原則"]], "ans": "D", "exp": "偵查不公開是為了保障當事人名譽與隱私、避免影響證據保全與審判公正。無罪推定是指未經審判確定有罪前推定為無罪，兩者概念不同。"}, {"stem": "「被害人或其親屬向檢警報案，表達要追究犯罪者刑事責任的意思」，這稱為什麼？", "opts": [["A", "告發"], ["B", "告訴"], ["C", "自首"], ["D", "自訴"]], "ans": "B", "exp": "告訴的主體是被害人或其親屬，且必須有請求追訴之意。告發的主體是任何知悉犯罪的人，不須有請求追訴之意；自首則是犯罪者主動承認。"}, {"stem": "路人小明目擊有人在街頭鬥毆，立刻打電話向警察報案。小明的行為屬於下列何者？", "opts": [["A", "告發"], ["B", "告訴"], ["C", "自首"], ["D", "自訴"]], "ans": "A", "exp": "任何人知悉有犯罪嫌疑時，均可向檢警報案，不須有請求追訴之意，這稱為「告發」。小明不是被害人，因此不是告訴。"}, {"stem": "關於「自首」的敘述，下列何者正確？", "opts": [["A", "被害人親自向法院提出訴訟"], ["B", "任何人向警察檢舉他人的犯罪行為"], ["C", "犯罪者被警方逮捕後在偵訊中認罪"], ["D", "犯罪者在犯罪事實未被發覺前，主動承認犯行"]], "ans": "D", "exp": "自首是指犯罪行為人在犯罪事實尚未被發覺前，主動向警察機關或檢察官承認自己的犯罪事實。若已被查獲後才認罪，就不算自首。"}, {"stem": "依課本所述，警察機關隸屬於下列哪個機關？", "opts": [["A", "司法院"], ["B", "行政院法務部"], ["C", "行政院內政部"], ["D", "各地方法院"]], "ans": "C", "exp": "警察隸屬行政院內政部，檢察官（檢察署）隸屬行政院法務部，法官（法院）隸屬司法院。這是三者職權比較的常考重點。"}, {"stem": "檢察署隸屬於下列何者？", "opts": [["A", "行政院法務部"], ["B", "司法院"], ["C", "內政部警政署"], ["D", "立法院"]], "ans": "A", "exp": "檢察署隸屬行政院法務部，與隸屬司法院的各級法院同屬廣義的司法體系，但主管機關不同，兩者之間也沒有上下隸屬關係。"}, {"stem": "下列關於警察職權的敘述，何者正確？", "opts": [["A", "警察有權決定是否起訴犯罪嫌疑人"], ["B", "警察受理告訴、告發後須向檢察官呈報"], ["C", "警察可以對犯罪嫌疑人作出有罪判決"], ["D", "為求破案效率，警察詢問時得使用強制手段"]], "ans": "B", "exp": "依刑事訴訟法，偵查權屬於檢察官，警察受理民眾的告訴、告發或自首後須向檢察官呈報，並受檢察官指揮協助蒐證；警察無起訴權、無審判權，且不可非法詢問。"}, {"stem": "犯罪嫌疑人被警察詢問時，警察依法必須告知他享有的權利，例如下列何者？", "opts": [["A", "可以要求警察銷毀不利的證據"], ["B", "可以要求由被害人放棄追訴"], ["C", "可以保持緘默，不必違背自己的意思陳述"], ["D", "可以要求檢察官作出不起訴處分"]], "ans": "C", "exp": "為保障人權，警察在協助偵查時不可非法詢問，並應告知嫌疑人依法擁有的權利，例如保持緘默的權利。"}, {"stem": "檢察官偵查終結後，認為罪證不足，應作出下列何種處分？", "opts": [["A", "提起自訴"], ["B", "諭知無罪判決"], ["C", "直接聲請強制執行"], ["D", "不起訴處分"]], "ans": "D", "exp": "檢察官偵查後若認為證據足以證明有犯罪嫌疑，就代表國家擔任原告提起公訴；若罪證不足，則作出不起訴處分。「判決無罪」是法官的職權，檢察官不能為之。"}, {"stem": "下列關於「公訴」與「自訴」的比較，何者正確？", "opts": [["A", "公訴由被害人自行提出，自訴由檢察官提出"], ["B", "自訴的被害人必須委任律師為代理人才能提起"], ["C", "公訴與自訴都必須先經過調解委員會調解"], ["D", "自訴案件由警察擔任法庭上的原告"]], "ans": "B", "exp": "公訴是由檢察官代表國家提起；自訴則是被害人不透過檢察官，自行委任律師直接向法院起訴——法律規定必須委任律師，以免民眾誤解法律、浪費司法資源。"}, {"stem": "「法官收到公訴或自訴後才能進行審判，法院不能審判未經起訴的案件。」這句話說明了下列何種精神？", "opts": [["A", "不告不理"], ["B", "一事不再理"], ["C", "罪刑法定"], ["D", "偵查不公開"]], "ans": "A", "exp": "「沒有起訴就沒有審判」即不告不理原則。法官不會主動追訴犯罪，必須有檢察官提起公訴或被害人提起自訴，審判程序才會啟動。"}, {"stem": "刑事訴訟法規定：「被告未經審判證明有罪確定前，推定其為無罪。」這是何種原則？", "opts": [["A", "罪刑法定原則"], ["B", "不告不理原則"], ["C", "無罪推定原則"], ["D", "偵查不公開原則"]], "ans": "C", "exp": "這就是無罪推定原則。即使被告被警察逮捕或被檢察官起訴，只要法院尚未判決確定，都不能認定他有罪，目的在保障人權、避免未審先判。"}, {"stem": "某社會案件見報後，網友紛紛留言「這種人一定有罪，直接關起來」。這樣的言論最違背下列何種原則？", "opts": [["A", "罪刑法定原則"], ["B", "一事不再理原則"], ["C", "偵查不公開原則"], ["D", "無罪推定原則"]], "ans": "D", "exp": "在法院判決確定前就認定嫌疑人有罪，屬於「未審先判」，違反無罪推定原則，也會嚴重侵害當事人的名譽、隱私與人性尊嚴。"}, {"stem": "關於法官在刑事審判中的職權，下列敘述何者正確？", "opts": [["A", "必須超出黨派、依法獨立審判，沒有證據不得認定犯罪事實"], ["B", "為求發現真實，可以在無證據時依經驗法則認定被告有罪"], ["C", "應聽從檢察官的指揮進行審理"], ["D", "判決確定後，須親自到監獄執行判決"]], "ans": "A", "exp": "法官依法獨立審判、不受外力干涉，必須超出黨派，依據事實與證據判決，沒有證據就不得認定犯罪事實。判決確定後的執行則由檢察官指揮。"}, {"stem": "刑事案件經法官判決確定後，由誰負責指揮執行判決？", "opts": [["A", "法官"], ["B", "檢察官"], ["C", "警察局長"], ["D", "被害人委任的律師"]], "ans": "B", "exp": "判決確定後，案件會移到檢察署，由檢察官指揮執行該判決。這是刑事訴訟四階段中的「執行」階段。"}, {"stem": "檢察官在偵查期間若要搜索犯罪嫌疑人的住處，原則上必須先取得什麼？", "opts": [["A", "被害人的書面同意"], ["B", "警察局長核發的公文"], ["C", "調解委員會的同意書"], ["D", "法院核發的搜索票"]], "ans": "D", "exp": "為避免偵查權濫用、保障人民居住自由，檢察官偵查中要搜索，原則上須經法院核定並取得搜索票才能進行，這是權力分立與制衡的展現。"}, {"stem": "在刑事法庭上，檢察官與被告的關係為何？", "opts": [["A", "檢察官居於審判者的地位，可以指揮被告"], ["B", "檢察官是被告的法定代理人"], ["C", "檢察官擔任原告，與被告處於平等地位"], ["D", "檢察官須聽從法官指示訊問被告"]], "ans": "C", "exp": "檢察官提起公訴後，在法庭上代表國家擔任原告，與被告處於平等的訴訟地位，由法官居中審判，這是「當事人對等」的設計。"}, {"stem": "下列何者屬於「告訴乃論之罪」？", "opts": [["A", "公然侮辱罪"], ["B", "竊盜罪"], ["C", "殺人罪"], ["D", "詐欺罪"]], "ans": "A", "exp": "公然侮辱罪、誹謗罪、過失傷害罪等屬於告訴乃論之罪，須由被害人提出告訴，國家才會追究；竊盜、詐欺、殺人則屬非告訴乃論之罪。"}, {"stem": "關於「非告訴乃論之罪」的敘述，下列何者正確？", "opts": [["A", "被害人撤回告訴後，檢察官即應停止追訴"], ["B", "不論被害人有無提出告訴，國家皆須主動追究"], ["C", "一定要先經過調解委員會調解才能起訴"], ["D", "只能由被害人自訴，檢察官不得提起公訴"]], "ans": "B", "exp": "非告訴乃論之罪，即使被害人沒有提出告訴，檢察官依職權仍應追訴；被害人也不能撤回告訴。告訴乃論之罪才由被害人決定是否追訴、可否撤告。"}, {"stem": "拾荒婦人誤拿他人機車上的衛生紙，事後雖賠償失主並達成和解，仍被依竊盜罪起訴。這個案例說明了什麼？", "opts": [["A", "和解書未經法院核定，所以完全無效"], ["B", "竊盜罪屬告訴乃論，被害人不得撤告"], ["C", "竊盜罪屬非告訴乃論，不因雙方和解而免除刑事責任"], ["D", "檢察官必須尊重和解結果，作出不起訴處分"]], "ans": "C", "exp": "竊盜罪是非告訴乃論之罪，國家有追訴的義務。雙方就民事賠償達成和解，只能解決民事部分（法官量刑時或可作為犯後態度的考量），無法免除刑事責任。"}, {"stem": "阿豪在網路上留言辱罵同學，構成公然侮辱罪。關於這個案件的救濟途徑，下列敘述何者正確？", "opts": [["A", "只能透過訴訟解決，不得調解"], ["B", "只能由檢察官提起公訴，被害人不能撤告"], ["C", "因屬刑事案件，警察可逕行判定賠償金額"], ["D", "屬告訴乃論之罪，雙方可先向調解委員會聲請調解"]], "ans": "D", "exp": "告訴乃論的刑事案件（如公然侮辱）可以透過調解委員會調解，調解不成再以訴訟解決；被害人也可撤回告訴。非告訴乃論之罪則原則上只能循訴訟途徑。"}, {"stem": "課本提到「調解委員會可以調解的案件範圍」，下列敘述何者正確？", "opts": [["A", "只能調解民事案件"], ["B", "可調解民事案件與告訴乃論的刑事案件"], ["C", "可調解所有民事與刑事案件"], ["D", "只能調解非告訴乃論的刑事案件"]], "ans": "B", "exp": "調解委員擔任公正第三人，可居間協調民事案件，以及告訴乃論的刑事案件。非告訴乃論之罪涉及國家刑罰權，不能以調解取代追訴。"}, {"stem": "比較民事訴訟與刑事訴訟，下列敘述何者正確？", "opts": [["A", "民事訴訟由當事人主動提起；刑事訴訟原則上由檢察官代表國家提起公訴"], ["B", "民事訴訟與刑事訴訟都由檢察官擔任原告"], ["C", "民事訴訟的目的在追究刑責，刑事訴訟在請求損害賠償"], ["D", "兩者的判決都由檢察官作成"]], "ans": "A", "exp": "民事訴訟在解決私人間的權利義務糾紛，須由受害者主動擔任原告起訴；刑事訴訟在追訴犯罪、發動國家刑罰權，原則上由檢察官提起公訴（例外是被害人自訴）。判決一律由法官作成。"}, {"stem": "阿文酒駕撞傷阿哲，阿哲受傷住院兩個月無法工作。依課本所述，阿哲可以怎麼做？", "opts": [["A", "只能提起刑事訴訟，醫藥費由國家代為賠償"], ["B", "只能提起民事訴訟，酒駕的刑責一併由民事法官判決"], ["C", "可對阿文提出刑事告訴追究刑責，另循民事途徑請求損害賠償"], ["D", "因同一事件不得重複處理，只能擇一放棄"]], "ans": "C", "exp": "很多案件同時涉及刑事責任與民事責任。被害人可透過刑事訴訟讓加害人負刑責，同時以和解、調解或民事訴訟等方式主張損害賠償，兩者並行不悖。"}, {"stem": "在模擬刑事法庭中，某人說：「根據偵查所得到的證據，被告犯罪事實明確。」這句台詞最可能出自誰之口？", "opts": [["A", "法官"], ["B", "證人"], ["C", "被告的辯護律師"], ["D", "檢察官"]], "ans": "D", "exp": "這是代表國家擔任原告、提出偵查所得證據指控被告的檢察官台詞。法官會說「辯論終結，擇日宣判」，律師會說「盡力為委託人辯護」，證人則陳述親身見聞。"}, {"stem": "模擬法庭中，有人說：「我在現場目擊了當時的情況。」這個角色是誰？", "opts": [["A", "證人"], ["B", "被告"], ["C", "告訴人"], ["D", "書記官"]], "ans": "A", "exp": "陳述自己親身見聞的案發經過者為證人。告訴人是提出告訴的被害人，被告是被追訴的一方，書記官負責製作筆錄。"}, {"stem": "我國實施國民法官制度，主要目的為何？", "opts": [["A", "減少法官人力不足，加快結案速度"], ["B", "讓非法律專業的國民參與審判，使司法更透明、提升人民對司法的信任"], ["C", "由國民法官取代職業法官，全面改由人民審判"], ["D", "讓被害人親自參與判決，決定加害人的刑度"]], "ans": "B", "exp": "調查顯示不少民眾認為判決不公正，因此民國109年立法院三讀通過國民法官法，讓非法律專業的國民加入審判、參與聽訟問案與判決形成，使司法審判更透明，提升人民對司法的信任。"}, {"stem": "下列何者「不是」擔任國民法官的基本資格？", "opts": [["A", "年滿23歲"], ["B", "具有中華民國國籍"], ["C", "在該地方法院管轄區內連續居住滿4個月以上"], ["D", "須具備法律相關系所的學歷"]], "ans": "D", "exp": "國民法官的三項基本資格為：年滿23歲、具中華民國國籍、在地方法院管轄區內連續居住滿4個月以上。制度設計正是要讓「非法律專業」的國民參與，因此不需法律學歷。"}, {"stem": "關於國民法官適用的案件與組成，下列敘述何者正確？", "opts": [["A", "所有刑事案件的第一審都要有國民參與審判"], ["B", "由12名國民法官組成，職業法官不參與評議"], ["C", "適用最輕本刑10年以上有期徒刑之罪及故意犯罪致死的公訴案件"], ["D", "僅適用於高等法院的第二審程序"]], "ans": "C", "exp": "國民法官法規定，最輕本刑為有期徒刑10年以上之罪，以及故意犯罪因而發生死亡結果的公訴案件，第一審地方法院應行國民參與審判，由6名國民法官與3名職業法官共同審理。"}, {"stem": "依國民法官法，被告是否有罪如何決定？", "opts": [["A", "須包含國民法官與法官雙方意見在內達三分之二以上同意"], ["B", "由3位職業法官單獨決定，國民法官只能旁聽"], ["C", "只要6位國民法官全體同意即可，不需法官同意"], ["D", "須全體9人一致同意才能判決有罪"]], "ans": "A", "exp": "有罪判決須由包含國民法官及職業法官雙方意見在內、達三分之二以上（9人中6票以上）同意，且雙方都必須有同意票；若未達此比例，應諭知無罪或作有利於被告的認定。"}, {"stem": "小美擔任詐騙集團車手當場被捕，她賠償被害人並取得對方諒解，被害人表示不提告，但警方仍依法將她移送法辦，最後被法院判處罰金。下列敘述何者正確？", "opts": [["A", "警方違法辦案，被害人不提告就不能追訴"], ["B", "詐欺屬非告訴乃論之罪，即使和解國家仍須追訴"], ["C", "和解書經法院核定後，刑責即可完全免除"], ["D", "此案的原告是被害人，故被害人可隨時撤回"]], "ans": "B", "exp": "詐欺罪屬非告訴乃論之罪，不論被害人是否提出或撤回告訴，國家都必須主動追訴。雙方的和解只能處理民事賠償部分，無法免除刑事責任；刑事案件的原告是代表國家的檢察官。"}];

  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "廠商之所以要和其他廠商競爭，最主要的目的是什麼？", "opts": [["A", "吸引消費者購買產品，增加銷貨收入以提高利潤"], ["B", "減少市場上產品的種類"], ["C", "幫助政府增加稅收"], ["D", "降低消費者可以選擇的機會"]], "ans": "A", "exp": "課本指出廠商為了增加銷貨收入以提高利潤，必須與其他廠商競爭，吸引消費者購買其產品。"}, {"stem": "下列關於「價格競爭」的敘述，何者最正確？", "opts": [["A", "廠商透過研發新產品來吸引消費者"], ["B", "廠商刻意提高售價以塑造高級形象"], ["C", "廠商透過降價，讓消費者花較少的錢卻能得到相同的滿足"], ["D", "廠商要求政府補助以降低成本"]], "ans": "C", "exp": "價格競爭是指廠商以降價方式讓消費者覺得撿到便宜，用較少的錢得到相同滿足，進而增加銷售量。"}, {"stem": "下列哪一項行銷做法屬於「價格競爭」？", "opts": [["A", "餐廳增建兒童遊戲區吸引親子客"], ["B", "飲料店推出「第二杯半價」的優惠"], ["C", "手機業者發表新一代旗艦機種"], ["D", "業者邀請當紅明星代言廣告"]], "ans": "B", "exp": "打折、第二件半價、買一送一都是直接調整價格來吸引買氣，屬於價格競爭；其餘三項是靠服務、創新或形象取勝的非價格競爭。"}, {"stem": "非價格競爭之下，即使產品價格不是最低、甚至比別家更高，消費者仍願意購買，最主要是因為廠商做了什麼？", "opts": [["A", "政府規定消費者必須購買該產品"], ["B", "市場上廠商家數太少，消費者無從選擇"], ["C", "消費者根本不在意價格的高低"], ["D", "透過創新、改良產品或提升服務品質，提供更好、更有特色的產品或服務"]], "ans": "D", "exp": "非價格競爭是靠創新、品質、特色與客製化服務創造價值，所以價格較高消費者仍願意買單。"}, {"stem": "下列何者「不」屬於非價格競爭的做法？", "opts": [["A", "全館商品一律結帳打八折"], ["B", "推出限量的聯名獨家商品"], ["C", "提供客製化的專屬服務"], ["D", "改良產品包裝並提升品質"]], "ans": "A", "exp": "打折是直接調整價格，屬於價格競爭；其餘三項都是不靠降價、改以特色與品質取勝的非價格競爭。"}, {"stem": "南一課本提到，非價格競爭又可以稱為下列何者？", "opts": [["A", "削價競爭"], ["B", "惡性競爭"], ["C", "價值競爭"], ["D", "不公平競爭"]], "ans": "C", "exp": "非價格競爭著重為商品創造附加價值，因此又稱為「價值競爭」。"}, {"stem": "超商增設代收款項、到店取貨寄貨、影印文件與代售票券等功能，這屬於哪一種競爭方式？", "opts": [["A", "價格競爭"], ["B", "不公平競爭"], ["C", "廠商的聯合行為"], ["D", "非價格競爭"]], "ans": "D", "exp": "超商並未調整商品售價，而是以更多元完善的服務吸引顧客上門，屬於非價格競爭。"}, {"stem": "手搖飲店推出「集點兌換周邊商品」與「線上會員累積點數」，這類做法最主要的目的是什麼？", "opts": [["A", "降低原料的生產成本"], ["B", "增加消費者對品牌的忠誠度"], ["C", "減少店內販售的產品種類"], ["D", "配合政府法令的強制規定"]], "ans": "B", "exp": "課本將集點、會員累積點數列為非價格競爭手法，目的是提高消費者的忠誠度，促使其重複消費。"}, {"stem": "課本探究活動指出：餐廳提供飲料免費續杯，顧客喝愈多杯，等於每杯的價格愈便宜。依此推論，免費續杯屬於哪一種競爭方式？", "opts": [["A", "價格競爭"], ["B", "非價格競爭"], ["C", "不公平競爭"], ["D", "聯合哄抬價格"]], "ans": "A", "exp": "免費續杯使每杯飲料的平均價格下降，等同於變相降價，因此課本將其歸類為價格競爭。"}, {"stem": "廠商長期採取削價競爭，最可能造成下列哪一種結果？", "opts": [["A", "廠商的利潤必然長期不斷增加"], ["B", "消費者一定可以永遠享受低價與好品質"], ["C", "政府的稅收一定會大幅提高"], ["D", "產品或服務品質下降，廠商甚至無利可圖而退出市場"]], "ans": "D", "exp": "課本提醒削價競爭短期看似有利消費者，長期卻可能使品質下降、廠商無利可圖甚至退出市場。"}, {"stem": "為什麼都市街頭到處都是各種品牌的手搖飲料店，市場競爭程度很高？", "opts": [["A", "政府規定每條街必須開設一定家數的飲料店"], ["B", "開店的技術與設備門檻不高、進入市場成本較低，因此廠商家數眾多"], ["C", "飲料的原料必須完全仰賴進口"], ["D", "消費者對飲料的需求非常少"]], "ans": "B", "exp": "進入市場的門檻與成本低，新廠商容易加入，廠商家數多，市場競爭程度自然提高。"}, {"stem": "我國汽機車用油市場的競爭程度偏低，最主要的原因是什麼？", "opts": [["A", "石油仰賴進口且煉油設備投資金額龐大，進入市場門檻非常高"], ["B", "政府明文禁止民營廠商經營油品"], ["C", "消費者對油品幾乎沒有需求"], ["D", "各家油品的品質差異過大"]], "ans": "A", "exp": "進入門檻高使新廠商不易加入，市場上只有少數幾家業者，競爭程度因而降低。"}, {"stem": "市場上提供某項產品的廠商家數愈多，通常會出現下列哪一種情形？", "opts": [["A", "消費者可以選擇的機會愈少"], ["B", "產品價格必然愈來愈高"], ["C", "競爭愈激烈，產品種類、價格與品質更多元，消費者選擇與比較的機會較多"], ["D", "個別廠商愈有能力決定價格"]], "ans": "C", "exp": "廠商家數多代表競爭程度高，消費者有較多選擇與比較機會，通常對消費者較有利。"}, {"stem": "如果市場上只有一家或少數幾家廠商生產某項產品，對消費者最直接的影響是什麼？", "opts": [["A", "消費者可以自行決定商品的售價"], ["B", "產品的價格、品質與數量多由少數廠商決定，消費者缺乏選擇與比較的機會"], ["C", "市場上的產品種類必然更加多元"], ["D", "廠商一定會提供更完善的服務"]], "ans": "B", "exp": "競爭程度低時，少數廠商較有決定價格的能力，消費者只能被動接受其提供的價格與品質。"}, {"stem": "電影院內販賣部的爆米花價格通常比外面貴很多，最主要的原因是什麼？", "opts": [["A", "爆米花的製作成本特別高昂"], ["B", "政府規定爆米花必須高價販售"], ["C", "消費者其實不喜歡吃爆米花"], ["D", "影城內通常只有一家販賣部，競爭程度低，較有決定價格的能力"]], "ans": "D", "exp": "場內缺乏其他業者競爭，消費者沒有比較的機會，業者因而握有較強的定價能力。"}, {"stem": "我國兩家煉油業者所訂的油品價格差異不大，這個現象最能說明下列何者？", "opts": [["A", "兩家廠商簽約約定價格必須完全相同"], ["B", "石油市場的競爭程度非常高"], ["C", "市場廠商家數少、競爭程度低，消費者的選擇也較少"], ["D", "油價完全由政府直接訂定"]], "ans": "C", "exp": "課本以油品市場說明競爭程度低的情形：家數少、選擇少、價格差異小。"}, {"stem": "南一課本比較都市與偏遠地區的電影院，下列推論何者最合理？", "opts": [["A", "都市電影院數量多、競爭激烈，消費者可以選擇的機會較多"], ["B", "兩地消費者能選擇的機會完全相同"], ["C", "偏遠地區消費者的選擇機會較多"], ["D", "都市電影院票價一定比偏鄉貴"]], "ans": "A", "exp": "廠商家數多寡決定競爭程度，都市電影院多，業者常推出優惠方案，消費者選擇較多。"}, {"stem": "判斷一個市場競爭程度的高低，課本主要是依據下列哪一項？", "opts": [["A", "該項產品價格的高低"], ["B", "政府從該產業收到的稅金多寡"], ["C", "購買該產品的消費者年齡分布"], ["D", "提供該項產品的廠商家數多寡"]], "ans": "D", "exp": "三個版本的課本都以「廠商家數多寡」對應「競爭程度高低」來說明市場競爭。"}, {"stem": "廠商之間進行良性、公平的競爭，對消費者與社會會帶來下列何種正面影響？", "opts": [["A", "消費者只能被動接受高價與低品質"], ["B", "消費者能買到物美價廉的產品、享有更 function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

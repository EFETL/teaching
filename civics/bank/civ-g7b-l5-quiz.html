<script>
const QS=[{"stem": "下列哪一項最符合課本對「社會變遷」的定義？", "opts": [["A", "個人為適應團體生活而改變自己的行為習慣"], ["B", "人類社會在器物、制度、理念等層次不斷改變的過程"], ["C", "政府為解決社會問題所推動的各項福利政策"], ["D", "人口由鄉村移往都市所造成的人口分布改變"]], "ans": "B", "exp": "社會變遷是指人類社會各個面向（包含器物、制度、理念等層次）不斷改變的過程，例如教學方式從板書變成數位化教學、從重男輕女轉為強調性別平等。(A) 是個人的社會化；(C)(D) 只是社會變遷的其中一種表現或成因，範圍太窄。"}, {"stem": "小明整理課堂筆記，把「智慧型手機、電動機車、電子白板」歸為同一類。這一類屬於社會變遷的哪一個層次？", "opts": [["A", "理念層次"], ["B", "制度層次"], ["C", "器物層次"], ["D", "環境層次"]], "ans": "C", "exp": "人類創造的各種器具、文物與技術屬於器物層次。手機、機車、電子白板都是具體的工具與技術產品。"}, {"stem": "下列何者屬於社會變遷中的「制度」層次？", "opts": [["A", "政府修法禁止行車中操作手機"], ["B", "廠商研發出續航力更長的電池"], ["C", "民眾逐漸接受性別平等的價值觀"], ["D", "學校添購電子白板等數位設備"]], "ans": "A", "exp": "典章制度、風俗習慣及法律等屬於制度層次，修法屬之。(B)(D) 是器物層次；(C) 是理念層次。"}, {"stem": "下列哪一個例子屬於社會變遷的「理念」層次改變？", "opts": [["A", "車站將人工剪票改為機器自動驗票"], ["B", "立法院三讀通過保障移工權益的法案"], ["C", "政府在人行道上鋪設導盲磚"], ["D", "社會大眾逐漸揚棄重男輕女的想法"]], "ans": "D", "exp": "內心的價值觀與想法屬於理念層次。(A)(C) 屬器物層次，(B) 屬制度層次。"}, {"stem": "課本指出，隨著科技發展，各種工具與技術推陳出新，加速了社會變遷。其中哪一個層次的變化最為明顯？", "opts": [["A", "制度"], ["B", "器物"], ["C", "理念"], ["D", "風俗"]], "ans": "B", "exp": "科技發展直接帶來工具與技術的推陳出新，因此在社會變遷的三個層次中，以器物的變化最為明顯、也最容易被察覺。"}, {"stem": "智慧型手機普及後，有些駕駛在行車時操作手機而危害交通安全，政府因此修法禁止此類行為。這個例子最能說明什麼？", "opts": [["A", "器物的變遷需要制度的配合，才不會造成失序"], ["B", "制度的變遷必須依賴器物的發明才能落實"], ["C", "理念的改變是社會變遷中唯一重要的力量"], ["D", "科技發展必然帶來社會秩序的全面崩壞"]], "ans": "A", "exp": "手機（器物）普及帶來新的失序現象，必須靠修法（制度）來規範，說明器物層次的變遷需要制度或理念配合，才不會造成失序。"}, {"stem": "承上題，課本認為要「根本」解決行車使用手機的問題，除了修法之外，最重要的是什麼？", "opts": [["A", "全面禁止民眾購買智慧型手機"], ["B", "研發可以自動偵測駕駛行為的車輛"], ["C", "民眾秉持正確觀念使用手機，也就是理念的改變"], ["D", "不斷加重罰鍰金額使違規者不敢再犯"]], "ans": "C", "exp": "課本明白指出，法律只能規範外在行為，民眾若能秉持正確的觀念（理念層次）使用手機，才是根本的解決之道。"}, {"stem": "低排碳量的電動機車有助於實現環保理念。這個例子說明社會變遷中：", "opts": [["A", "器物層次的變化一定領先制度與理念"], ["B", "理念層次的改變完全不受器物影響"], ["C", "制度層次的變遷會阻礙器物的發明"], ["D", "制度或理念的變遷，有時需要器物的發明才能落實"]], "ans": "D", "exp": "環保是理念，但要真正做到減碳，仍須依靠電動機車這類器物的發明。這說明理念（或制度）的變遷有時需要器物配合才能落實。"}, {"stem": "關於社會變遷中器物、制度、理念三個層次的關係，下列敘述何者正確？", "opts": [["A", "三者會相互影響，必須兼顧均衡發展"], ["B", "三者各自獨立，彼此不會互相牽動"], ["C", "三者變遷的速度完全相同，不會失衡"], ["D", "器物層次最不重要，可以忽略不計"]], "ans": "A", "exp": "課本強調三個層次的變動會相互影響，若無法彼此兼顧、平衡發展，可能造成社會失序的現象。"}, {"stem": "課本指出，判斷不公平現象是否存在，一般可以由哪四個角度來看？", "opts": [["A", "自由、平等、博愛、人權"], ["B", "責任承擔、貢獻肯定、利益分配、需求滿足"], ["C", "生產、分配、交換、消費"], ["D", "器物、制度、理念、環境"]], "ans": "B", "exp": "課本列出判斷不公平的四個角度：責任承擔是否適當、貢獻是否受到肯定、利益是否合理分配、需求是否獲得滿足。"}, {"stem": "調查顯示，女性負責家庭中照顧工作的比率不僅高於男性，投入的時間也多於男性。這種現象屬於哪一種不公平？", "opts": [["A", "貢獻肯定的不公平"], ["B", "利益分配的不公平"], ["C", "需求滿足的不公平"], ["D", "責任承擔的不公平"]], "ans": "D", "exp": "女性走入職場後仍承擔較多的家庭照顧工作，是「責任」分配上的失衡，屬於責任承擔的不公平。"}, {"stem": "漁船工作工時長、危險性高，國人上船意願低落，政府因而開放國際漁工彌補勞動力不足，但他們的付出並未獲得應有的肯定與尊重。這屬於哪一種不公平？", "opts": [["A", "責任承擔的不公平"], ["B", "需求滿足的不公平"], ["C", "貢獻肯定的不公平"], ["D", "利益分配的不公平"]], "ans": "C", "exp": "國際漁工實際上補足了我國漁業的勞動力，對產業有貢獻，但這份貢獻未被社會與法規肯定，屬於貢獻肯定的不公平。"}, {"stem": "課本提到，相對於雇主而言，國際漁工的薪資明顯偏低。這種情形屬於下列何種不公平？", "opts": [["A", "責任承擔的不公平"], ["B", "利益分配的不公平"], ["C", "貢獻肯定的不公平"], ["D", "需求滿足的不公平"]], "ans": "B", "exp": "薪資是勞動所得的分配結果。漁工付出勞力卻只拿到微薄薪資，雇主取得大部分利益，屬於利益分配的不公平。要注意同一事件可能同時涉及多種不公平面向。"}, {"stem": "許多人行道上設置變電箱、電線杆等設施，使人行道寬度大幅縮減，妨礙行人通行，對身心障礙者更造成危險。這最直接反映哪一種不公平？", "opts": [["A", "需求滿足的不公平"], ["B", "責任承擔的不公平"], ["C", "貢獻肯定的不公平"], ["D", "利益分配的不公平"]], "ans": "A", "exp": "公共設施的設置忽略身心障礙者實際所需，使其未獲得可滿足其需求的適當資源，屬於需求滿足的不公平。"}, {"stem": "當資方未分配給勞方合理的薪資，而將多數利益納為己有時，最直接呈現哪一種不公平？長期下來會造成什麼結果？", "opts": [["A", "需求滿足的不公平；使勞工缺乏工作意願"], ["B", "責任承擔的不公平；使資方投資意願下降"], ["C", "利益分配的不公平；不利於縮短貧富差距"], ["D", "貢獻肯定的不公平；使物價快速上漲"]], "ans": "C", "exp": "勞資雙方分配不均屬於利益分配的不公平；長期分配不均會使財富持續向資方集中，不利於縮短貧富差距。"}, {"stem": "「我國受僱人員報酬及營業盈餘占國家總經濟生產的比重圖」顯示，受僱人員報酬所占比重逐漸下降。這張圖最適合用來說明下列何者？", "opts": [["A", "我國經濟成長已經完全停滯"], ["B", "勞工的每週工作時數逐年增加"], ["C", "政府稅收不足以推動社會福利"], ["D", "勞方相對於資方所能享受到的經濟成長利益減少"]], "ans": "D", "exp": "受僱人員報酬占比下降、營業盈餘占比相對上升，代表經濟成長的果實較多流向資方，勞方分到的比例減少，呈現利益分配的不公平。"}, {"stem": "統計顯示，我國年所得最高 20% 家庭與最低 20% 家庭的所得差距倍數長期居高不下。這項數據最能反映下列何者？", "opts": [["A", "我國失業率持續攀升"], ["B", "我國貧富差距的問題未見改善"], ["C", "我國人口老化速度加快"], ["D", "我國物價上漲幅度過大"]], "ans": "B", "exp": "高低所得組的差距倍數，是衡量貧富差距最常用的指標；倍數居高不下代表貧富差距問題並未改善。"}, {"stem": "依課本所述，「公平正義」的內涵包含哪兩個部分？", "opts": [["A", "確保每個人得到均等的機會，並在此前提下讓弱勢者得到更多照顧"], ["B", "讓所有人分配到完全相同數量的資源，不因能力與需求而有差異"], ["C", "保障強者的努力成果，弱者應自行承擔失敗的後果"], ["D", "由政府統一分配所有社會資源，取消個人的自由選擇"]], "ans": "A", "exp": "公平正義有兩層：先確保「機會均等」，再在此前提下對弱勢者提供「更多照顧」。它不等於齊頭式的平均分配。"}, {"stem": "我國實施義務教育，保障每位國民的受教權，讓來自不同家庭背景的孩子都擁有均等的入學與學習機會。這最符合公平正義的哪一項內涵？", "opts": [["A", "讓弱勢者得到更多照顧"], ["B", "社會資源完全平均分配"], ["C", "保障個人財產不受侵犯"], ["D", "每個人得到均等的機會"]], "ans": "D", "exp": "義務教育不分家庭背景一律保障受教權，是讓每個人都能公平取得教育機會，屬於「機會均等」這一層。"}, {"stem": "國家運用徵收的稅金發展社會福利政策，提供弱勢者各項生活照顧。這體現公平正義的哪一項內涵？", "opts": [["A", "每個人得到均等的機會"], ["B", "使所有人的所得完全相同"], ["C", "在機會均等的前提下，讓弱勢者得到更多照顧"], ["D", "依個人納稅金額多寡分配福利"]], "ans": "C", "exp": "把稅金用於照顧地位或資源相對弱勢的人，是在機會均等的基礎上再給予額外的照顧與利益。"}, {"stem": "法律規定，雇主對求職人或所僱用的員工，不得以種族、性別、年齡、五官、身心障礙等理由予以歧視。這項規定最主要是為了保障什麼？", "opts": [["A", "國民的就業機會平等"], ["B", "弱勢者可以領到更多的補助金"], ["C", "雇主自由挑選員工的權利"], ["D", "勞工加入工會的結社自由"]], "ans": "A", "exp": "禁止就業歧視的目的，是讓每個人不因先天或無關能力的特質而被排除，屬於保障「機會均等」的制度設計。"}, {"stem": "政府宣布將公務人員履歷表中的照片欄位刪除。這項作法最主要的用意是：", "opts": [["A", "節省列印履歷表的成本"], ["B", "避免因外貌而產生就業歧視，落實機會均等"], ["C", "讓政府完全不知道應徵者的任何個人資料"], ["D", "使弱勢者可以優先獲得錄取"]], "ans": "B", "exp": "照片會揭露五官、外貌等與工作能力無關的資訊，容易造成就業歧視。刪除照片欄位是為了讓評選回歸能力，落實機會均等。"}, {"stem": "依身心障礙者權益保障法規定，達到法定規模的民營事業機構必須進用一定比例的身心障礙者。這項規定最符合下列何種精神？", "opts": [["A", "讓所有國民的工作機會完全平均分配"], ["B", "由政府直接僱用全國所有身心障礙者"], ["C", "要求企業放棄追求合理利潤"], ["D", "在機會均等的基礎上，給予弱勢者更多照顧"]], "ans": "D", "exp": "定額進用制度是為身心障礙者「額外」保留就業機會，屬於公平正義中「讓弱勢者得到更多照顧」的展現。"}, {"stem": "某公司徵才啟事註明「歡迎身心障礙者應徵」，並說明公司依法規模須僱用一定比例的身障者。對此，下列判斷何者最適當？", "opts": [["A", "這是明顯的就業歧視，因為它排除了非身心障礙者"], ["B", "這違反機會均等原則，應該立即撤下啟事"], ["C", "這是依法對弱勢者提供更多照顧，並非就業歧視"], ["D", "這屬於社會變遷中器物層次的改變"]], "ans": "C", "exp": "就業歧視指的是「不利」的差別待遇。依法為身障者保留名額是給予弱勢者更多照顧，屬於落實公平正義，並非歧視。"}, {"stem": "作家林立青創辦友洗社創公司，聘僱無家者從事高壓清洗等工作，讓無家者習得一技之長，也能藉此賺取所得。根據此內容判斷，下列敘述何者正確？", "opts": [["A", "友洗社創公司是由無家者共同出資成立的企業"], ["B", "友洗社創公司以提供工作機會的方式協助無家者自立"], ["C", "政府補助是該公司唯一且主要的收入來源"], ["D", "至今尚未有任何無家者因此脫離街頭生活"]], "ans": "}, {"stem": "學者羅爾斯認為，設計社會制度的人應該站在「無知之幕」後面，也就是不知道自己將來會處於什麼樣的社會地位。他這樣主張的用意最可能是：", "opts": [["A", "屏除偏見與私心，避免做出不公平的判斷"], ["B", "讓制度設計者可以隨心所欲分配資源"], ["C", "使弱勢者永遠無法參與制度的設計"], ["D", "強調制度設計應完全交由多數人表決決定"]], "ans": "A", "exp": "若不知道自己會是強者還是弱者，設計者就會傾向設計出對任何處境都不至於太糟的制度，藉此排除偏見與私心，接近真正的公平。"}, {"stem": "媽媽切蛋糕時給壽星妹妹最小的一塊，理由是「妳食量小，吃不完還不是我在吃」，哥哥卻覺得不公平。這個生活情境最適合用來討論下列何者？", "opts": [["A", "社會變遷中器物層次的改變"], ["B", "社會規範如何約束個人行為"], ["C", "政府社會保險制度的設計原則"], ["D", "資源分配是否符合公平的判斷標準"]], "ans": "D", "exp": "切蛋糕反映的正是「依需求分」「依身分分」「平均分」等不同的分配標準，說明公平與否會因立場與判斷角度不同而有不同答案。"}, {"stem": "下列四位求職者的遭遇，何者「不」屬於就業歧視？", "opts": [["A", "因為是原住民、膚色與他人不同而被拒絕錄取"], ["B", "因為雙腳行動不便而被雇主拒絕錄取"], ["C", "因為完全沒有相關工作經驗，起薪比有經驗者略低"], ["D", "因為已婚有小孩、無法配合加班而被拒絕錄取"]], "ans": "C", "exp": "工作經驗屬於受僱者能力的一部分，依能力給予不同待遇並非歧視。(A) 族群、(B) 身心障礙、(D) 婚姻與家庭狀況，都與工作能力無關，屬於就業歧視。"}, {"stem": "身心障礙者權益保障法規定，公共停車場應保留一定比例的停車位，作為行動不便的身心障礙者專用。這項規定的主要精神是：", "opts": [["A", "依身障者的實際需求提供資源，落實對弱勢者的更多照顧"], ["B", "限制一般民眾使用公共停車場的權利"], ["C", "讓身心障礙者負擔較多的社會責任"], ["D", "增加政府停車費收入的來源"]], "ans": "A", "exp": "保留專用車位是針對身障者的移動需求提供額外資源，屬於在機會均等前提下給予弱勢者更多照顧。"}, {"stem": "小華主張：「公平就是每個人都拿到一模一樣的東西。」依課本對公平正義的說明，下列回應何者最適當？", "opts": [["A", "小華完全正確，資源必須齊頭式的平均分配"], ["B", "除了確保機會均等，還要對弱勢者提供更多照顧，才是公平正義"], ["C", "公平正義只需保障強者的努力成果即可"], ["D", "公平正義是政府的事，與資源如何分配無關"]], "ans": "B", "exp": "公平正義並非齊頭式平等。若人人拿到完全相同的資源，原本處境不利者仍難以翻身，因此必須在機會均等之上再對弱勢者提供額外照顧。"}, {"stem": "關於社會變遷與不公平處境的關係，下列敘述何者最正確？", "opts": [["A", "社會變遷必然使所有不公平現象自動消失"], ["B", "社會變遷只會讓不公平現象更加惡化"], ["C", "社會變遷與不公平處境之間完全沒有關聯"], ["D", "社會變遷可能改善，也可能惡化某些群體的不公平處境"]], "ans": "D", "exp": "課本指出社會變遷具有雙面性：例如性別平等觀念普及改善了女性處境（改善），但科技與產業變化也可能使某些勞工或族群更加不利（惡化）。"}, {"stem": "下列「現象—不公平類型」的配對，何者正確？", "opts": [["A", "女性負擔較多家庭照顧工作—貢獻肯定的不公平"], ["B", "公共設施未考量身障者需求—利益分配的不公平"], ["C", "勞方未分配到合理的薪資—利益分配的不公平"], ["D", "國際移工的付出未受尊重—責任承擔的不公平"]], "ans": "C", "exp": "正確配對應為：女性照顧責任過重→責任承擔；公共設施忽略身障需求→需求滿足；勞方薪資不合理→利益分配；移工付出未受肯定→貢獻肯定。"}, {"stem": "課本提到，社會變遷帶來的不公平處境，「可能不是當事人憑一己之力就能夠擺脫」。這句話的主要用意是：", "opts": [["A", "說明改善不公平需要外界的協助與制度性的支持"], ["B", "說明弱勢者不必為自己的處境做任何努力"], ["C", "說明不公平現象根本無法改善，不必費心"], ["D", "說明只有個人努力才是唯一的解決辦法"]], "ans": "A", "exp": "不公平往往源於結構性因素（如出身背景、產業變化、制度設計），單靠個人努力難以突破，因此需要個人、團體與政府共同投入協助。"}, {"stem": "要促進社會變遷中的公平正義，依課本所述，需要哪些力量相互配合與努力？", "opts": [["A", "只需要政府立法規範即可"], ["B", "個人、團體及政府三者相互配合與努力"], ["C", "只需要企業願意提高員工薪資即可"], ["D", "只需要弱勢者自我努力向上即可"]], "ans": "B", "exp": "課本明確指出，要促進社會變遷中的公平正義，有賴個人、團體及政府的相互配合與努力，才能真正落實。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

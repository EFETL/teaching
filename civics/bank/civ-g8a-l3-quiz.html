<script>
const QS=[{"stem": "電視劇中的皇帝想處置大臣，可以直接下令執行；我國政府要限制人民出外旅行，卻必須經過法定程序。造成這種差別的關鍵因素是什麼？", "opts": [["A", "兩國的經濟發展程度不同"], ["B", "兩國的人口規模差距太大"], ["C", "統治者與法律之間的關係不同"], ["D", "兩國的國土面積大小不同"]], "ans": "C", "exp": "課本以「統治者與法律的關係」作為區分人治與法治的判準：人治是統治者凌駕於法律之上，法治則是統治者同樣受法律約束。"}, {"stem": "在人治的社會中，法律存在的主要目的是什麼？", "opts": [["A", "鞏固統治者的權力"], ["B", "保障人民的基本權利"], ["C", "限制政府機關的權力"], ["D", "促進各機關相互制衡"]], "ans": "A", "exp": "人治社會中統治者依自己的意思制定或修改法律，目的在鞏固自身權力，法律只是控制人民的工具。"}, {"stem": "依照課本對法治社會的說明，法律應該由誰來制定？", "opts": [["A", "由統治者本人依其意志制定"], ["B", "由行政機關首長逕行公布"], ["C", "由司法機關的法官共同決定"], ["D", "由人民選出的代表依程序制定"]], "ans": "D", "exp": "法治的核心之一是「人民選出的代表依法定程序制定或修改法律」，使法律具有民意基礎並能保障人民權利。"}, {"stem": "「法律的規定會隨著統治者的想法而任意改變，人民往往無所適從。」這句話描述的是哪一種社會？", "opts": [["A", "法治社會"], ["B", "人治社會"], ["C", "有限政府"], ["D", "分權社會"]], "ans": "B", "exp": "法律朝令夕改、標準隨統治者好惡而變動，是人治社會的典型特徵；法治社會的法律則具有明確且穩定的標準。"}, {"stem": "關於法治社會中「法律對統治者的影響」，下列敘述何者正確？", "opts": [["A", "統治者與人民同樣受到法律的約束"], ["B", "統治者可自行決定是否遵守法律"], ["C", "統治者站在法律之上不受約束"], ["D", "統治者可隨時修法使自己免責"]], "ans": "A", "exp": "法治是指法律同時約束統治者與人民，成為雙方共同遵守的最高規範，這正是它與人治最大的分野。"}, {"stem": "大華到農場打工，農場主人可以依當天的心情決定上班時間，也可以臨時取消午休。這種情況比較接近下列何者？", "opts": [["A", "法治，因為農場訂有明確的規則"], ["B", "法治，因為主人本來就有管理權"], ["C", "人治，因為勞動法令沒有相關規定"], ["D", "人治，因為主人的意思就等於規則"]], "ans": "D", "exp": "判斷人治或法治要看「規則由誰定、是否穩定、定規則者是否受拘束」。農場主人可依個人好惡任意變動規則且自己不受拘束，屬於人治。"}, {"stem": "如果由民選的立法者修法，取消統治者連任次數的限制，為什麼仍不算落實法治？", "opts": [["A", "因為修法的程序完全不合法定要件"], ["B", "因為修法的目的在鞏固統治者權力，而非保障人民權利"], ["C", "因為立法者並不是由人民選出來的"], ["D", "因為連任次數本來就不可以用法律規定"]], "ans": "B", "exp": "法治不只看「有沒有依程序修法」，更要看法律的目的。若修法只是為統治者擴權，法律就淪為鞏固權力的工具，實質仍是人治。"}, {"stem": "下列何者最能表現「依法行政」的精神？", "opts": [["A", "總統依個人判斷宣布全國戒嚴"], ["B", "公務員依上級的口頭指示辦事"], ["C", "警察執行酒駕臨檢須依法定程序進行"], ["D", "統治者為國家安全可暫時不受法律拘束"]], "ans": "C", "exp": "依法行政是指政府的作為必須有法律依據並依法定程序進行；臨檢雖是公權力的展現，程序仍受法律約束。"}, {"stem": "有人主張：「只要統治者夠聰明又有道德，國家其實不需要法律。」從法治的觀點來看，最適當的反駁是什麼？", "opts": [["A", "權力若不受法律限制，仍可能腐化並侵害人民權利"], ["B", "聰明的統治者一定會制定出更多的法律"], ["C", "道德的標準比法律的標準更容易衡量"], ["D", "統治者的道德可以交由法院加以審查"]], "ans": "A", "exp": "呼應艾克頓爵士「絕對的權力使人絕對腐化」的提醒：法治依靠制度而非個人品德，才能穩定保障人民權利。"}, {"stem": "在「人治與法治比較表」中，關於「法律執行標準」一欄，屬於法治的內容是下列何者？", "opts": [["A", "隨統治者的好惡而不斷變動"], ["B", "標準明確，統治者須依法而治"], ["C", "由行政首長逐案自行認定"], ["D", "依社會輿論的多寡隨時調整"]], "ans": "B", "exp": "法治社會的法律執行標準明確一致，人民可以預期法律的效果；標準隨統治者而變則是人治的特徵。"}, {"stem": "英國大憲章（Magna Carta）最重要的中心思想是下列何者？", "opts": [["A", "主權在民，國家權力屬於全體國民"], ["B", "政府權力應分為行政、立法、司法三種"], ["C", "國家應該建立政黨政治的運作方式"], ["D", "法律之前人人平等，國王也必須守法"]], "ans": "D", "exp": "大憲章要求國王必須遵守法律、不得任意徵稅，開啟「法律之前人人平等」的思想，使法律不再只是國王統治人民的工具。"}, {"stem": "洛克主張「政府應與人民訂立契約」，這項主張最主要的用意是什麼？", "opts": [["A", "擴大政府可以管理的事務範圍"], ["B", "使政府取得不受質疑的絕對權力"], ["C", "限制政府自身的權力，避免侵害人民"], ["D", "廢除國王世襲繼承的傳統制度"]], "ans": "C", "exp": "洛克受大憲章影響提出人人平等的概念，主張政府與人民訂約以限制政府權力，這個想法後來被孟德斯鳩繼承而形成分權制衡。"}, {"stem": "依課本定義，「權力」指的是下列何者？", "opts": [["A", "法律所保護、人民享有的生活利益"], ["B", "一種強制與支配的力量，行使後會使他人受到影響"], ["C", "人民向國家請求特定給付的資格"], ["D", "免於受到他人任意侵害的保障"]], "ans": "B", "exp": "權力是強制與支配的力量，握有權力的一方行使後會影響他人；權利則是法律保護人民享有的利益。"}, {"stem": "下列何者屬於「權利」的行使？", "opts": [["A", "警察在路口取締違規停車"], ["B", "政府對違法的業者處以罰鍰"], ["C", "立法院經協商完成修法程序"], ["D", "農民依災損向國家請求補助"]], "ans": "D", "exp": "向國家請求特定利益（如災害補助）是人民行使權利；前三者都是政府機關行使公權力。"}, {"stem": "「警察未持搜索票要求進入住宅，屋主予以拒絕。」屋主的行為屬於下列何者？", "opts": [["A", "權利的行使"], ["B", "權力的行使"], ["C", "公權力的行使"], ["D", "義務的履行"]], "ans": "A", "exp": "人民有拒絕警察未依法定程序搜索的權利，這是法律保障人民住所不受非法侵入的具體展現。"}, {"stem": "關於民主國家中「權力」與「權利」的關聯，下列敘述何者最適當？", "opts": [["A", "人民享有的權利是統治者恩賜的結果"], ["B", "政府的權力越大，人民權利越有保障"], ["C", "人民透過選舉賦予政府權力，期望政府以公權力保障人民權利"], ["D", "權力屬於政府、權利屬於人民，兩者互不相干"]], "ans": "C", "exp": "民主國家中人民以選舉「賦予權力」，政府則以公權力「保障權利」，兩者是授權與被授權的循環關係。"}, {"stem": "若政府濫用公權力而侵害人民權利，依課本說明，人民可以用下列何種方式收回賦予政府的權力？", "opts": [["A", "向法院提起訴願請求救濟"], ["B", "向立法院提出書面請願"], ["C", "集體拒絕繳納各項稅捐"], ["D", "行使罷免權使其去職"]], "ans": "D", "exp": "課本指出人民可用罷免等方式，使不適任的公職人員去職，並收回原本賦予政府的權力。"}, {"stem": "「有人在公開場合辱罵他人、損害其名譽，政府依法加以處罰。」這個例子最適合說明下列何者？", "opts": [["A", "整段敘述只涉及人民權利的行使"], ["B", "政府行使權力以保障人民的權利"], ["C", "整段敘述只涉及政府權力的行使"], ["D", "人民行使權力來限制政府的權利"]], "ans": "B", "exp": "政府依法處罰屬於行使公權力，其目的在維護受害者的名譽權，正好呈現「以權力保障權利」的關係。"}, {"stem": "「老師替踴躍發言的同學加平常成績」與「學生舉手向老師發問」，兩者依序分別屬於下列何者？", "opts": [["A", "權利、權力"], ["B", "權利、權利"], ["C", "權力、權利"], ["D", "權力、權力"]], "ans": "C", "exp": "老師握有評分的支配力量，屬於權力；學生發問則是受保障、可主張的學習利益，屬於權利。"}, {"stem": "下列何者最適合用來說明「公權力」？", "opts": [["A", "政府依法處罰違法人民的強制力量"], ["B", "人民向政府提出請願的資格"], ["C", "人民在網路上發表言論的自由"], ["D", "人民參加投票選出代表的資格"]], "ans": "A", "exp": "公權力是政府所擁有、具強制與支配性質的權力；後三者都屬於人民的權利。"}, {"stem": "英國學者艾克頓爵士說：「權力使人腐化；絕對的權力使人絕對腐化。」這句話最能支持下列哪一項主張？", "opts": [["A", "應擴大行政權以提升施政效率"], ["B", "統治者應該具備高尚的品德"], ["C", "政府應由多數黨完全獨攬決策"], ["D", "政府權力應該分立並相互制衡"]], "ans": "D", "exp": "這句名言指出權力集中必然帶來濫用，因此民主國家以分權制衡的制度設計來防止濫權，而非仰賴統治者自律。"}, {"stem": "民主國家建構政府體制時所採用的「分權制衡」原則，包含哪兩個部分？", "opts": [["A", "立法與行政"], ["B", "民主與法治"], ["C", "權力分立與相互制衡"], ["D", "憲法與行政命令"]], "ans": "C", "exp": "分權制衡包含「權力分立」（權力分散給不同機關獨立行使）與「相互制衡」（各權力彼此監督牽制）兩個層面。"}, {"stem": "關於「權力分立」的核心作法，下列敘述何者正確？", "opts": [["A", "把所有國家權力集中由國會行使"], ["B", "將權力分別交由不同機關獨立行使"], ["C", "由統治者一人統籌指揮所有事務"], ["D", "由人民直接行使全部的國家權力"]], "ans": "B", "exp": "權力分立是把不同功能的權力分散交由不同機關獨立行使，以避免權力過度集中而造成濫權。"}, {"stem": "下列何者最符合「有限政府」的意義？", "opts": [["A", "政府的權力、職能與規模受憲法及法律明文規範，並受社會監督約束"], ["B", "政府的組織規模必須維持在非常小的程度"], ["C", "政府只能處理有限的幾項行政事務"], ["D", "政府官員的任期都受到嚴格的年限限制"]], "ans": "A", "exp": "有限政府強調政府在權力、職能與規模上都受憲法與法律規範，並接受人民與社會的監督約束。"}, {"stem": "民主國家要建立「有限政府」，最主要的依據是下列何者？", "opts": [["A", "各機關發布的行政命令"], ["B", "各政黨自訂的黨綱黨章"], ["C", "國家的憲法"], ["D", "國際間簽訂的條約"]], "ans": "C", "exp": "民主國家透過制定憲法，規範政府的組織、權力與運作方式，以分權制衡建構權力受限的有限政府。"}, {"stem": "「行政機關要推動政策，必須有立法機關制定的法律作為依據或授權。」這個設計最能展現下列何者？", "opts": [["A", "權力分立"], ["B", "相互制衡"], ["C", "地方自治"], ["D", "依法審判"]], "ans": "B", "exp": "行政須以立法通過的法律為依據，是立法權對行政權的牽制，屬於相互制衡的展現。"}, {"stem": "南韓總統宣布全國戒嚴後，國會在六小時內表決解除戒嚴，其後憲法法庭判決彈劾成立，總統隨即免職。這起事件最能說明下列何者？", "opts": [["A", "南韓政府的權力確實受到約束與制衡"], ["B", "南韓人民可以直接投票罷免總統"], ["C", "南韓是採行五權分立的國家"], ["D", "總統宣布戒嚴體現了政黨政治精神"]], "ans": "A", "exp": "立法機關（國會）與司法機關（憲法法庭）都對總統發揮監督功能，且過程依憲法規定進行，正是分權制衡與法治的體現。"}, {"stem": "一個國家雖然制定了憲法，卻不一定就是民主國家。判斷的關鍵在於下列何者？", "opts": [["A", "憲法的條文數量是否足夠多"], ["B", "是否採用成文憲法的形式"], ["C", "國家是否設有國會組織"], ["D", "政府權力是否真正受到分立制衡與人民監督"]], "ans": "D", "exp": "課本以「一個國家擁有憲法就會走向民主嗎」發問，答案在於憲法所建立的分權制衡是否真正運作、政府是否成為受監督的有限政府。"}, {"stem": "關於憲法在權力分立中所扮演的角色，下列敘述何者最適當？", "opts": [["A", "憲法主要只規定人民應盡的義務"], ["B", "憲法規範政府的組織、權力與運作方式"], ["C", "憲法是由行政機關自行訂定的規則"], ["D", "憲法的效力低於立法院制定的法律"]], "ans": "B", "exp": "法治國家會把政府權力與運作模式規範在憲法中，我國憲法即明定中央政府體制採五權分立。"}, {"stem": "我國廣義的法律包含憲法、法律與命令，其位階由高到低的排列應為下列何者？", "opts": [["A", "憲法、法律、命令"], ["B", "法律、憲法、命令"], ["C", "命令、法律、憲法"], ["D", "憲法、命令、法律"]], "ans": "A", "exp": "法律位階愈高效力愈強，順序為憲法、法律、命令；位階低者牴觸位階高者即為無效。"}, {"stem": "過去民法規定父母對未成年子女的意思不一致時「由父行使之」，因與憲法男女平等的意旨不符而被宣告失效。這凸顯憲法的哪一項特性？", "opts": [["A", "固定性"], ["B", "原則性"], ["C", "最高性"], ["D", "強制性"]], "ans": "C", "exp": "憲法位階最高、效力最強，法律或命令若牴觸憲法即屬無效，這就是憲法的最高性。"}, {"stem": "憲法之所以被稱為「人民權利的保障書」，最主要的原因是什麼？", "opts": [["A", "憲法明定人民負有納稅的義務"], ["B", "憲法必須由總統正式公布施行"], ["C", "憲法詳細規定各政府機關的名稱"], ["D", "憲法明文保障人民的基本權利，人民可據以防止政府侵害"]], "ans": "D", "exp": "多數民主國家把人民權利寫入憲法以提高保障效力，人民既可消極防止政府侵害，也可積極向國家請求。"}, {"stem": "憲法是國家的根本大法，修正程序較一般法律困難繁複。這反映憲法的哪一項特性？", "opts": [["A", "固定性"], ["B", "最高性"], ["C", "原則性"], ["D", "可變性"]], "ans": "A", "exp": "為維持國家政治局勢穩定，憲法不宜頻繁變動，因此修憲程序特別嚴格，此即憲法的固定性。"}, {"stem": "在我國，若法律或命令有牴觸憲法的疑慮，應由下列哪一個機關審理判決？", "opts": [["A", "立法院"], ["B", "監察院"], ["C", "憲法法庭"], ["D", "行政院"]], "ans": "C", "exp": "由憲法法庭審理違憲爭議並作成判決，經判決違憲者必須廢除或修正，以確保憲法的最高性。"}, {"stem": "主張「三權分立」的學者是下列何者？", "opts": [["A", "洛克"], ["B", "孟德斯鳩"], ["C", "艾克頓"], ["D", "孫中山"]], "ans": "B", "exp": "法國學者孟德斯鳩提出三權分立，主張將政府權力分為行政、立法、司法三權，彼此制衡。"}, {"stem": "在三權分立的架構中，立法機關（國會）的主要職責為何？", "opts": [["A", "負責執行國家的各項政策"], ["B", "依據法律獨立進行審判"], ["C", "專責監督公務人員的操守"], ["D", "制定法律、審查政府預算並監督行政機關"]], "ans": "D", "exp": "立法權的內涵包括制定法律、審查政府預算與監督行政機關；執行政策屬行政權，獨立審判屬司法權。"}, {"stem": "三權分立特別強調司法機關應「超出黨派之外、依法獨立行使職權」，最主要的理由是什麼？", "opts": [["A", "司法人員不需要具備專業能力"], ["B", "司法權的地位高於行政與立法權"], ["C", "行政與立法的制衡常涉及政黨立場，需要中立者依法裁判"], ["D", "司法機關可以直接制定法律規範"]], "ans": "C", "exp": "行政權與立法權相互制衡時難免涉及政黨立場與利害得失，因此需要超出黨派、依法獨立審判的司法權來解決紛爭。"}, {"stem": "孟德斯鳩主張「要防止濫用權力，就必須以權力約束權力」。這句話最貼近下列哪一種想法？", "opts": [["A", "用制度讓權力彼此牽制，而不是依賴掌權者自律"], ["B", "應由道德最高尚的人掌握全部國家權力"], ["C", "政府權力越集中，施政的效率就越高"], ["D", "國家事務應全部交由人民直接決定"]], "ans": "A", "exp": "以權力約束權力就是制度性的制衡設計，強調靠結構安排而非個人品德來防止濫權。"}, {"stem": "民主國家採行三權分立，最主要的目的是下列何者？", "opts": [["A", "提高政府決策與執行的效率"], ["B", "增加政府部門的公務人員名額"], ["C", "擴大國會對國家事務的權力"], ["D", "避免權力過度集中而侵害人民權利"]], "ans": "D", "exp": "分權的根本目的在防止專權、保障人民權利；效率提升並非分權制衡的主要考量。"}, {"stem": "假設某國由統治者一人同時掌握制定法律、執行政策與審判案件的權力，最可能出現下列何種結果？", "opts": [["A", "形成權力受限的有限政府"], ["B", "權力集中而容易濫權，人民權利難以獲得保障"], ["C", "各機關之間可以充分相互制衡"], ["D", "政府施政能完全做到依法行政"]], "ans": "B", "exp": "立法、行政、司法集於一身即無從制衡，統治者的意志就等於法律，屬於人治，人民權利極易受到侵害。"}, {"stem": "「若行政機關的行為違法或不當而損害人民權益，人民可依法向司法機關尋求協助。」這項制度設計反映的是下列何者？", "opts": [["A", "司法權對行政權的制衡"], ["B", "立法權對行政權的制衡"], ["C", "行政權對司法權的制衡"], ["D", "考試權對行政權的制衡"]], "ans": "A", "exp": "人民循司法途徑救濟，使司法機關得以審查行政行為是否合法，屬於司法權對行政權的制衡。"}, {"stem": "關於「權力分立」與「相互制衡」的關係，下列敘述何者最適當？", "opts": [["A", "兩者的意義完全相同，可以互相取代"], ["B", "只要做到權力分立，就一定不會發生濫權"], ["C", "先以分立使權力不集中，再透過制衡彼此監督牽制"], ["D", "必須先有制衡，之後才可能出現權力分立"]], "ans": "C", "exp": "分立是把權力拆開交由不同機關行使，制衡則是讓這些機關彼此監督牽制，兩者相輔相成才能防止濫權。"}, {"stem": "我國採行的「五權分立」學說是由下列何人提出？", "opts": [["A", "孟德斯鳩"], ["B", "洛克"], ["C", "艾克頓"], ["D", "孫中山"]], "ans": "D", "exp": "我國採用孫中山提出的五權分立，是結合三權分立體制再加以調整而成的獨特中央政府體制。"}, {"stem": "在五權分立的設計中，考試權是從下列哪一權獨立出來的？", "opts": [["A", "立法權"], ["B", "行政權"], ["C", "司法權"], ["D", "監察權"]], "ans": "B", "exp": "行政部門既有用人之權又有決定資格之權，容易濫用私人，因此把考試權自行政權中獨立出來。"}, {"stem": "把監察權從立法權中獨立出來，主要是為了避免下列何種弊端？", "opts": [["A", "行政機關濫用私人"], ["B", "司法審判有失公正"], ["C", "國會權力過大而形成專制"], ["D", "國家考試發生舞弊"]], "ans": "C", "exp": "監察權自立法權分出，目的在杜絕國會權力過大所造成的專制流弊。"}, {"stem": "把考試權從行政權中獨立出來，主要是為了避免下列何種問題？", "opts": [["A", "行政機關濫用私人、任用私人"], ["B", "國會的權力變得過於龐大"], ["C", "司法審判受到政黨力量影響"], ["D", "地方政府的權力不斷坐大"]], "ans": "A", "exp": "考試權獨立可公正地為國舉才，防止行政首長依私人關係任用人員。"}, {"stem": "關於五權分立與三權分立的關係，下列敘述何者最適當？", "opts": [["A", "五權分立完全否定了三權分立的價值"], ["B", "五權分立是在三權分立的基礎上，再分出考試權與監察權"], ["C", "五權分立是把三種權力合併成五種名稱"], ["D", "五權分立不需要以憲法作為規範依據"]], "ans": "B", "exp": "五權分立結合三權分立的體制，再自行政權分出考試權、自立法權分出監察權，並由我國憲法明定。"}, {"stem": "小康提問：「如果廢除考試院和監察院，改成三權會怎麼樣？」依課本的分權原理判斷，下列說明何者正確？", "opts": [["A", "監察權會回歸到司法權"], ["B", "行政權將同時擁有司法權"], ["C", "立法權將取得行政權"], ["D", "考試權回歸行政權、監察權回歸立法權"]], "ans": "D", "exp": "考試權原本自行政權分出、監察權原本自立法權分出，若廢除兩院，這兩項權力自然回歸原來所屬的行政權與立法權。"}, {"stem": "針對「廢考監」的討論，宇廷提到考試院發表聲明，請民眾正視其貫徹憲法公開徵選國家人才的功能。這段話最能凸顯下列何者？", "opts": [["A", "考試權獨立行使有防止用人不公的價值"], ["B", "民意調查顯示多數民眾支持廢除兩院"], ["C", "廢除兩院之後就無法落實有限政府"], ["D", "改採三權分立必然造成行政效率降低"]], "ans": "A", "exp": "此說法強調考試權獨立能公開公正地為國舉才，正是當初把考試權自行政權分出的理由。"}, {"stem": "若從「為什麼要分立」的原理層次來看，我國採行五權分立最根本的用意是什麼？", "opts": [["A", "讓政府部門數量增加以創造更多職位"], ["B", "使中央政府與地方政府得以分工合作"], ["C", "分散政府權力以防止濫權，進而保障人民權利"], ["D", "加快各項政策推動與執行的速度"]], "ans": "C", "exp": "無論三權或五權，分立的根本用意都是避免權力過度集中造成濫權，最終目的在保障人民的權利。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

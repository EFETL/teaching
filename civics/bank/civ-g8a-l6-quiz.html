<script>
const QS=[{"stem": "小華的爸爸每天收看政論節目，媽媽參加了社區公聽會，姐姐則在網路上投書評論政府的能源政策。上述行為在公民課本中被統稱為什麼？", "opts": [["A", "公共意見"], ["B", "政治參與"], ["C", "政黨政治"], ["D", "直接民主"]], "ans": "B", "exp": "政治參與是指人民以各種途徑，試圖影響政府人事及公共政策的行動。關心時事、參加公聽會、投書媒體、參與政黨活動、參與選舉及公投等都屬於政治參與的方式。"}, {"stem": "課本提到：「若人民對公共事務漠不關心、缺乏民主素養」，最可能造成下列何種結果？", "opts": [["A", "政府施政會更加謹慎並傾聽民意"], ["B", "公共意見會更容易凝聚成共識"], ["C", "政治權力被少數人掌握，政府因缺乏監督而效能不彰"], ["D", "選舉的投票率會大幅上升"]], "ans": "C", "exp": "課本指出，人民積極參與時政府會更謹慎、傾聽民意；反之若人民政治冷漠，政治權力容易被少數人掌握，政府缺乏監督而效能不彰。"}, {"stem": "下列哪一項「不」屬於課本所介紹的政治參與方式？", "opts": [["A", "週末到百貨公司採買換季衣物"], ["B", "參加反對開發案的示威遊行"], ["C", "打電話call in到政論節目表達意見"], ["D", "加入政黨並協助候選人助選"]], "ans": "A", "exp": "政治參與必須是「試圖影響政府人事或公共政策」的行動。單純的購物消費屬於個人經濟生活，與影響政府決策無關，不算政治參與。"}, {"stem": "在眾多政治參與的途徑中，課本認為「最普遍且最重要」的方式是下列何者？", "opts": [["A", "參加集會遊行"], ["B", "投書媒體"], ["C", "加入利益團體"], ["D", "投票"]], "ans": "D", "exp": "三個版本課本一致指出，投票是民主國家最常見、最普遍且最重要的政治參與方式，因為投票結果最能直接、明確地表達民意。"}, {"stem": "投票依對象不同可分為「對人的投票」與「對事的投票」。下列配對何者正確？", "opts": [["A", "罷免市長／對事的投票"], ["B", "決定是否同意某項政策／對事的投票"], ["C", "選舉立法委員／對事的投票"], ["D", "公民投票／對人的投票"]], "ans": "B", "exp": "對人的投票是選舉、罷免行政首長或民意代表；對事的投票則是針對法律或政策所進行的公民投票。決定是否同意某項政策屬於對事的投票。"}, {"stem": "某市市長當選後施政不符人民期待，選民依法將他解職。這種投票方式最能落實下列何種精神？", "opts": [["A", "責任政治，讓不適任的公職人員必須對人民負責"], ["B", "直接民主，由人民直接制定法律"], ["C", "權力分立，避免行政權過度集中"], ["D", "依法行政，政府施政必須有法律依據"]], "ans": "A", "exp": "這是「罷免」。人民可以用選票罷免不適任的公職人員，代表公職人員必須為施政成果對人民負責，落實責任政治與主權在民的精神。"}, {"stem": "我國為了落實憲法所保障的創制權與複決權，制定了下列哪一部法律？", "opts": [["A", "公職人員選舉罷免法"], ["B", "總統副總統選舉罷免法"], ["C", "公民投票法"], ["D", "集會遊行法"]], "ans": "C", "exp": "我國制定公民投票法，使人民能直接參與全國性或地方性公共政策的決策與法案的制定，藉此落實憲法保障的創制權與複決權。"}, {"stem": "下列關於「創制權」的敘述，何者正確？", "opts": [["A", "人民針對立法院已通過的法律表示同意或反對"], ["B", "人民投票決定是否解除公職人員的職務"], ["C", "人民投票選出行政首長與民意代表"], ["D", "人民主動提出立法原則或制定政策"]], "ans": "D", "exp": "創制權是指人民「主動」提出立法原則或制定政策的權利；針對既有法律或政策表示同意與否則是複決權。"}, {"stem": "某次全國性公投的題目為：「你是否同意政府應全面禁止進口含萊克多巴胺的豬肉產品？」人民對此案投票，主要行使的是哪一項權利？", "opts": [["A", "複決權"], ["B", "創制權"], ["C", "選舉權"], ["D", "罷免權"]], "ans": "A", "exp": "針對已存在的政策或法案表達同意或反對，屬於複決權的行使。若是人民主動提出新的立法原則，才屬於創制權。"}, {"stem": "公民投票讓人民能直接決定重大政策，這最能展現下列哪一種民主形式？", "opts": [["A", "代議民主"], ["B", "直接民主"], ["C", "責任政治"], ["D", "政黨政治"]], "ans": "B", "exp": "由人民自己直接針對法案或政策作成決定，不透過民意代表代為決定，屬於直接民主的展現；選舉民意代表替人民決策則屬代議民主。"}, {"stem": "我國立法委員採「單一選區兩票制」選出。其中「單一選區」的意思是什麼？", "opts": [["A", "全國只劃分為一個選舉區"], ["B", "每位選民只能投一張選票"], ["C", "每一個選舉區只選出一位區域立法委員"], ["D", "每個政黨在同一選區只能提名一位候選人"]], "ans": "C", "exp": "「單一選區」指每一個選舉區僅選出一名區域立法委員，也就是得票最高的一人當選。"}, {"stem": "在「單一選區兩票制」中，選民手上的兩張選票分別是投給誰？", "opts": [["A", "一票選總統，一票選立委"], ["B", "一票選區域立委，一票選鄉鎮市長"], ["C", "一票選中央民代，一票選地方民代"], ["D", "一票選人（區域候選人），一票選黨（政黨）"]], "ans": "D", "exp": "兩票制是指每位選民有兩張票，一票投給選區的候選人（選人），另一票投給政黨（選黨），政黨票用於分配全國不分區立委席次。"}, {"stem": "依課本說明，政黨票的得票率必須超過多少，該政黨才能依比例分配全國不分區立委席次？", "opts": [["A", "5%"], ["B", "10%"], ["C", "15%"], ["D", "25%"]], "ans": "A", "exp": "康軒、南一、翰林三版課本皆指出，政黨票得票率超過5%的政黨，才能依照得票比例分配全國不分區立法委員席次，此為政黨門檻。"}, {"stem": "依翰林版課本說明，我國立法委員的總席次為多少席？", "opts": [["A", "73席"], ["B", "113席"], ["C", "225席"], ["D", "34席"]], "ans": "B", "exp": "我國立法委員共113席，採單一選區兩票制產生，包含區域立委、原住民立委與全國不分區立委。"}, {"stem": "「不論男女、貧富、宗教信仰或黨派為何，只要符合法定資格，人人都享有投票權。」這是哪一項公平投票原則？", "opts": [["A", "平等原則"], ["B", "直接原則"], ["C", "普通原則"], ["D", "無記名原則"]], "ans": "C", "exp": "普通原則強調凡符合法定資格者，不分性別、宗教、種族、階級、黨派、財產、學歷，人人皆有投票權，重點在「投票權的普及」。"}, {"stem": "「一人一票，票票等值」所指的是下列哪一項投票原則？", "opts": [["A", "普通原則"], ["B", "直接原則"], ["C", "無記名原則"], ["D", "平等原則"]], "ans": "D", "exp": "平等原則是指每位人民的選票都具有同等價值與效力，也就是「一人一票，票票等值」。"}, {"stem": "我國總統由全體公民直接投票選出，而不是由民意代表代為選舉。這最符合下列哪一項投票原則？", "opts": [["A", "直接原則"], ["B", "平等原則"], ["C", "普通原則"], ["D", "無記名原則"]], "ans": "A", "exp": "直接原則是指由人民直接選出行政首長或民意代表，不需透過他人代表行使投票權，最能彰顯主權在民的精神。"}, {"stem": "投票時必須使用投票所提供的專用戳章圈選，不得在選票上簽名、蓋私章或作記號。這項規定是為了落實哪一項原則？", "opts": [["A", "普通原則"], ["B", "無記名原則"], ["C", "平等原則"], ["D", "直接原則"]], "ans": "B", "exp": "無記名原則又稱「祕密投票原則」，為保障個人隱私與自由意志，選票上不得留下可辨識身分的記號，以免選民受到威脅利誘。"}, {"stem": "阿明在投票所圈選完畢後，故意高舉選票給旁人觀看。他的行為主要違反了哪一項投票原則？", "opts": [["A", "普通原則"], ["B", "平等原則"], ["C", "無記名原則"], ["D", "直接原則"]], "ans": "C", "exp": "「亮票」會讓他人得知圈選內容，可能影響選民的自由意志與安全，違反無記名（祕密投票）原則，依法可處罰鍰。課本也提醒投票時應將選票對折後再投入票匭。"}, {"stem": "電影「女權天使」描述20世紀初美國婦女為爭取「女性也能投票」而奮鬥，最終促成憲法修正案通過。她們爭取的是哪一項投票原則的落實？", "opts": [["A", "普通原則"], ["B", "平等原則"], ["C", "直接原則"], ["D", "無記名原則"]], "ans": "A", "exp": "當時女性被排除於投票權之外，是以「性別」限制投票資格，違反普通原則。爭取女性投票權即是爭取普通原則的落實。"}, {"stem": "日治時期臺灣總督府首次舉辦選舉，規定須「年滿25歲的男性、且年繳5圓以上稅金者」才能投票。此規定最明顯違反哪一項投票原則？", "opts": [["A", "平等原則"], ["B", "直接原則"], ["C", "無記名原則"], ["D", "普通原則"]], "ans": "D", "exp": "以性別與納稅金額（財產）作為投票資格的限制，使部分人民根本無法取得投票權，違反「符合法定資格者不分性別、財產人人皆有投票權」的普通原則。"}, {"stem": "小美當天有事無法前往投票所，於是請哥哥代替她圈選投票。這種做法違反了哪一項原則？", "opts": [["A", "普通原則"], ["B", "直接原則"], ["C", "平等原則"], ["D", "無記名原則"]], "ans": "B", "exp": "直接原則要求選民必須親自投票，不可透過他人代表行使投票權，因此不得委託他人代投。"}, {"stem": "假設某國規定「大學畢業者一人有兩票，其餘國民一人一票」，此規定牴觸了下列哪一項原則？", "opts": [["A", "普通原則"], ["B", "直接原則"], ["C", "平等原則"], ["D", "無記名原則"]], "ans": "C", "exp": "讓部分人的選票價值高於他人，違反「一人一票、票票等值」的平等原則。（若是完全不給某些人投票權，才屬於違反普通原則。）"}, {"stem": "依我國憲法規定，中華民國國民年滿幾歲，即享有依法選舉之權？", "opts": [["A", "20歲"], ["B", "18歲"], ["C", "23歲"], ["D", "16歲"]], "ans": "A", "exp": "憲法規定「中華民國國民年滿20歲者，有依法選舉之權」，因此我國選舉權（投票權）的年齡門檻為20歲。"}, {"stem": "阿豪想要登記參選鄉民代表，依法他至少必須年滿幾歲？", "opts": [["A", "18歲"], ["B", "20歲"], ["C", "21歲"], ["D", "23歲"]], "ans": "D", "exp": "依公職人員選舉罷免法，被選舉權（參選資格）的一般年齡為年滿23歲，並須具中華民國國籍、在選舉區設籍達一定期間。"}, {"stem": "依公民投票法規定，中華民國國民年滿幾歲即享有公民投票權？", "opts": [["A", "16歲"], ["B", "18歲"], ["C", "20歲"], ["D", "23歲"]], "ans": "B", "exp": "公民投票法規定年滿18歲的中華民國國民即有公民投票權。公投年齡於民國107年由20歲下修為18歲，低於選舉權的20歲。"}, {"stem": "依康軒版課本的年齡示意圖，「我要加入政黨」的最低年齡是幾歲？", "opts": [["A", "14歲"], ["B", "15歲"], ["C", "16歲"], ["D", "18歲"]], "ans": "C", "exp": "課本以「滿16歲加入政黨、滿18歲參與公投、滿20歲選舉、滿23歲擔任候選人從政」呈現公民參政年齡的階梯，加入政黨為16歲。"}, {"stem": "阿凱今年剛滿19歲，具有中華民國國籍且長期設籍於居住地。下列關於他權利的敘述，何者正確？", "opts": [["A", "他可以參加公民投票，但不能投票選舉縣長"], ["B", "他可以投票選舉縣長，但不能參加公民投票"], ["C", "他可以登記參選縣議員"], ["D", "他既不能公投也不能加入政黨"]], "ans": "A", "exp": "19歲已滿18歲，享有公民投票權；但未滿20歲，尚無選舉權，不能投票選縣長；參選公職須滿23歲；加入政黨滿16歲即可，故(D)亦錯。"}, {"stem": "關於   });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

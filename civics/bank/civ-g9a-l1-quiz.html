<script>
const QS=[{"stem": "經濟學所說的「資源具有稀少性」，最正確的意義是下列何者？", "opts": [["A", "資源的總數量非常稀少，全世界都快用完了"], ["B", "資源只能有一種用途，不能挪作他用"], ["C", "相對於人們無窮的欲望，資源無法完全滿足"], ["D", "資源必須由政府統一分配才不會浪費"]], "ans": "C", "exp": "稀少性是「相對」的概念，不是指資源總量的多寡，而是相對於人類無窮的欲望而言，資源永遠不足以完全滿足，因此必須做選擇。"}, {"stem": "小美的舅舅是身價數十億的富翁，卻仍常抱怨「錢不夠用」，因為他既想買遊艇，又想買私人飛機。關於這個現象的分析，何者最恰當？", "opts": [["A", "舅舅的財富總量龐大，金錢對他而言已不具稀少性"], ["B", "稀少性是相對概念，舅舅的欲望超過其金錢，金錢對他仍具稀少性"], ["C", "稀少性只會出現在窮人身上，富人不受影響"], ["D", "舅舅資源充足，因此不必面臨任何選擇"]], "ans": "B", "exp": "稀少性比較的是「資源」與「欲望」的相對關係。只要欲望大於可用資源，該資源就具有稀少性，與絕對數量多寡無關。"}, {"stem": "下列何者最符合「自由財」的定義？", "opts": [["A", "空氣汙染嚴重地區所販售的清淨空氣"], ["B", "便利商店貨架上的瓶裝礦泉水"], ["C", "學校每天供應的營養午餐"], ["D", "在野外自然照射在身上的陽光"]], "ans": "D", "exp": "自由財是不具稀少性、不必付出代價即可取得的資源，如陽光、（一般情況下的）空氣。(A)(B)(C) 都必須付出代價，屬於經濟財。"}, {"stem": "課本提到「自由財與經濟財的區分並非絕對」，下列何者是最適切的例證？", "opts": [["A", "工業汙染使乾淨空氣必須付出代價才能享有，空氣由自由財轉為經濟財"], ["B", "自由財一旦被認定，就永遠不會改變"], ["C", "經濟財只要價格下跌，就會自動變成自由財"], ["D", "兩者是依照資源的絕對數量多寡來區分"]], "ans": "A", "exp": "空氣原本不必付代價即可取得（自由財），但在工業汙染嚴重的地區，「乾淨的空氣」必須花錢購買設備才能享有，就成了經濟財。價格下跌仍須付費，不會變成自由財。"}, {"stem": "課本說人們「必須」做選擇，同時也「可以」做選擇。這兩句話的原因分別為何？", "opts": [["A", "「必須」是因資源有多種用途；「可以」是因資源具稀少性"], ["B", "「必須」是因欲望有限；「可以」是因資源無限"], ["C", "「必須」是因資源具稀少性；「可以」是因資源具多種用途"], ["D", "「必須」是因誘因存在；「可以」是因機會成本為零"]], "ans": "C", "exp": "資源不足以滿足所有欲望，所以「不得不」取捨（必須選擇）；同一份資源又能派上多種用場，所以「有得挑」（可以選擇）。"}, {"stem": "下課十分鐘，阿翔可以去打球、可以趴著補眠、也可以去逛合作社。這個例子最能說明下列何種概念？", "opts": [["A", "資源具有多種用途，所以人們「可以」做選擇"], ["B", "時間這項資源並不具有稀少性"], ["C", "選擇打球的機會成本為零"], ["D", "人們的欲望其實是有限的"]], "ans": "A", "exp": "同樣是「下課十分鐘」這項時間資源，卻能用在打球、補眠、逛合作社等不同用途上，正是「資源具有多種用途」的展現，因此人們得以選擇。"}, {"stem": "小豪家每個月生活費固定，若增加補習費支出，就得縮減全家旅遊的預算。這個情形最能說明下列何者？", "opts": [["A", "家庭的資源是無限的"], ["B", "教育支出的重要性一定高於旅遊"], ["C", "家庭的機會成本無法衡量"], ["D", "資源具有稀少性，因此必須權衡取捨"]], "ans": "D", "exp": "生活費固定代表資源有限，補習費與旅遊費彼此排擠，多用在一邊就得少用在另一邊，這正是稀少性造成的取捨。"}, {"stem": "關於公民課本所說的「資源」，下列敘述何者正確？", "opts": [["A", "只有金錢才能算是資源"], ["B", "凡是能用來滿足欲望的有形或無形之物都是資源，時間、人力也包含在內"], ["C", "只有看得見、摸得到的有形物品才算資源"], ["D", "資源必須是能在市場上買賣的商品"]], "ans": "B", "exp": "課本定義資源為「可用於滿足欲望所需的有形或無形之物」，包括食物、水、金錢、人力、時間等，並不限於金錢或有形物品。"}, {"stem": "俗語說「魚與熊掌不可兼得」、「天下沒有白吃的午餐」，這兩句話共同傳達的經濟概念是什麼？", "opts": [["A", "任何選擇都必須付出代價，也就是機會成本"], ["B", "資源可以無限制地重複使用"], ["C", "誘因一定要用金錢的方式呈現"], ["D", "理性的人可以不必做選擇"]], "ans": "A", "exp": "兩句俗語都在說明「有得必有失」，選了一項就得放棄另一項，被放棄的代價就是機會成本。"}, {"stem": "小柔的手機記憶體容量有限，因此她只能下載自己最喜歡的兩款遊戲。這個情境最直接反映下列何種概念？", "opts": [["A", "自由財"], ["B", "負向誘因"], ["C", "資源的稀少性"], ["D", "隱藏成本"]], "ans": "C", "exp": "記憶體容量（資源）無法滿足小柔想下載所有遊戲的欲望，屬於典型的稀少性問題，因此必須做選擇。"}, {"stem": "經濟學對於「人」的基本假設是下列何者？", "opts": [["A", "人的行為是隨機的，無法預測"], ["B", "人是理性的，會權衡利益與代價，把資源用在價值最高的用途上"], ["C", "人一定會選擇價格最高的商品，因為品質較好"], ["D", "人在做選擇時不會考慮機會成本"]], "ans": "B", "exp": "經濟學假設人會理性思考、計較得失，在資源有限下把資源用於能產生最高價值的用途，也就是選擇機會成本最低者。"}, {"stem": "行政院表示將補助全國中小學裝設冷氣，但有民意代表擔心會排擠營養午餐、獎助學金等其他補助款。這則新聞最能說明下列何者？", "opts": [["A", "政府所擁有的資源是無限的"], ["B", "政府編列預算時不必做選擇"], ["C", "裝設冷氣這項政策沒有機會成本"], ["D", "政府預算有限，施政本身就是一種有機會成本的選擇"]], "ans": "D", "exp": "政府的預算同樣具有稀少性，把錢用在冷氣上就無法同時用在營養午餐或獎助學金，被排擠掉的項目價值即為此政策的機會成本。"}, {"stem": "關於「機會成本」的定義，下列敘述何者正確？", "opts": [["A", "所有被放棄選項的價值總和"], ["B", "所選擇項目本身的標價"], ["C", "在被放棄的其他用途中，「價值最高」者"], ["D", "做完選擇後實際花掉的金錢數目"]], "ans": "C", "exp": "機會成本是「將資源用於某一用途時，所放棄的其他用途中價值最高者」，不是加總，也不是所選項目本身的價格。"}, {"stem": "當一個人同時面臨三個以上的選項時，關於機會成本的計算，下列何者正確？", "opts": [["A", "仍然只計算被放棄選項中價值最高的那一個，不是全部加總"], ["B", "要把所有被放棄選項的價值全部相加"], ["C", "要取所有被放棄選項價值的平均數"], ["D", "選項愈多，機會成本會愈接近零"]], "ans": "A", "exp": "因為資源只能擇一使用，真正被排擠掉的只有「價值最高的那一個」放棄項，所以不論選項有幾個，機會成本都只算最高者。"}, {"stem": "依照經濟學的理性選擇原則，人們通常會選擇下列何者？", "opts": [["A", "機會成本最高的選項"], ["B", "標價最高的選項"], ["C", "隨機挑選，不必計算"], ["D", "機會成本最低的選項"]], "ans": "D", "exp": "機會成本代表選擇所付出的代價，代價愈低對自己愈有利，因此理性的人會選擇機會成本最低者，即為「最佳選擇」。"}, {"stem": "媽媽答應送小軒價值 300 元的生日禮物。小軒對「買球衣」的滿足程度是 90 單位，對「買小說」的滿足程度是 80 單位，兩者只能擇一。小軒的最佳選擇及其機會成本為何？", "opts": [["A", "選買小說；機會成本為 80 單位"], ["B", "選買球衣；機會成本為 80 單位"], ["C", "選買小說；機會成本為 90 單位"], ["D", "選買球衣；機會成本為 90 單位"]], "ans": "B", "exp": "選球衣要放棄小說的 80 單位（機會成本 80）；選小說要放棄球衣的 90 單位（機會成本 90）。買球衣的機會成本較低，故為最佳選擇。"}, {"stem": "承上題，如果小軒最後選擇買小說，他的機會成本是什麼？", "opts": [["A", "放棄買球衣所帶來的滿足程度 90 單位"], ["B", "放棄買小說所帶來的滿足程度 80 單位"], ["C", "媽媽給的 300 元"], ["D", "90 加 80 共 170 單位"]], "ans": "A", "exp": "機會成本是「被放棄」的那一項的價值。選小說就放棄球衣，因此機會成本是球衣的 90 單位滿足程度，不是自己所選項目的價值。"}, {"stem": "阿餘週六下午 2 點～5 點有三個免費活動可以參加，喜好程度分別為：聽演唱會 90 單位、去溜冰 80 單位、看畫展 70 單位。若他選擇聽演唱會，機會成本是多少？", "opts": [["A", "70 單位"], ["B", "150 單位"], ["C", "80 單位"], ["D", "240 單位"]], "ans": "C", "exp": "放棄的選項是溜冰（80）與畫展（70），機會成本取價值最高者，也就是溜冰的 80 單位，不能把 80 與 70 相加。"}, {"stem": "承上題，阿餘的最佳選擇為何？理由是什麼？", "opts": [["A", "去溜冰，因為溜冰的機會成本是 90 單位"], ["B", "聽演唱會，因為它的機會成本在三個選項中最低"], ["C", "看畫展，因為畫展的喜好程度最低"], ["D", "三者的機會成本相同，任選一項皆可"]], "ans": "B", "exp": "選演唱會的機會成本為 80；選溜冰或看畫展時，被放棄的最高價值都是演唱會的 90。演唱會的機會成本最低，所以是最佳選擇。"}, {"stem": "阿神有兩個工讀機會：速食店時薪 190 元、大賣場時薪 220 元。在其他條件都相同、單以時薪衡量的情形下，他選擇到大賣場工讀的機會成本是多少？", "opts": [["A", "220 元"], ["B", "410 元"], ["C", "30 元"], ["D", "190 元"]], "ans": "D", "exp": "選大賣場就放棄了速食店的 190 元時薪，因此機會成本為 190 元。機會成本算的是「放棄的那一個」，不是自己得到的 220 元，也不是兩者相加或相減。"}, {"stem": "承上題，隔天阿神又多了一個加油站的工讀機會，時薪 200 元。此時他若仍擔任大賣場工讀生，機會成本變成多少？", "opts": [["A", "200 元"], ["B", "190 元"], ["C", "390 元"], ["D", "220 元"]], "ans": "A", "exp": "現在被放棄的是速食店（190 元）與加油站（200 元），取價值最高者，故機會成本由原本的 190 元提高為 200 元。"}, {"stem": "承上題，加入加油站這個新選項後，阿神的最佳選擇與機會成本會如何變化？", "opts": [["A", "改選加油站，且機會成本下降"], ["B", "改選速食店，且機會成本上升"], ["C", "仍選大賣場，但機會成本由 190 元提高為 200 元"], ["D", "仍選大賣場，且機會成本完全不變"]], "ans": "C", "exp": "大賣場時薪 220 元仍是最高，選它的機會成本 200 元也仍低於選其他兩項（皆為 220 元）。所以最佳選擇不變，但因為多了一個更好的放棄選項，機會成本上升了。"}, {"stem": "小南的表姊寒假想打工，有兩個機會：早餐店時薪 200 元、書局時薪 176 元。若只以時薪作為衡量標準，她選擇早餐店的機會成本是多少？", "opts": [["A", "200 元"], ["B", "24 元"], ["C", "376 元"], ["D", "176 元"]], "ans": "D", "exp": "選早餐店就放棄了書局的 176 元時薪，機會成本即為 176 元。由於它低於選書局的機會成本（200 元），因此早餐店是最佳選擇。"}, {"stem": "榮恩有 3 小時空閒，可以看小說（滿足程度 70 單位）或騎單車（滿足程度 85 單位）。他的最佳選擇及機會成本為何？", "opts": [["A", "看小說；機會成本 85 單位"], ["B", "騎單車；機會成本 70 單位"], ["C", "看小說；機會成本 70 單位"], ["D", "騎單車；機會成本 85 單位"]], "ans": "B", "exp": "選騎單車放棄小說的 70 單位，選看小說則放棄單車的 85 單位。騎單車機會成本較低，是最佳選擇。此例也說明機會成本不一定用金錢衡量，也可用滿足或喜好程度。"}, {"stem": "Andy 一家在預算相同的兩間房屋中做選擇：南南大廈室內空間大但通勤久，喜好程度 90 單位；One 大廈通勤近但空間小，喜好程度 75 單位。若他們選擇南南大廈，機會成本為何？", "opts": [["A", "放棄 One 大廈的喜好程度 75 單位"], ["B", "放棄南南大廈的喜好程度 90 單位"], ["C", "兩者喜好程度相差的 15 單位"], ["D", "兩者喜好程度相加的 165 單位"]], "ans": "A", "exp": "機會成本是被放棄選項的價值，即 One 大廈的 75 單位。因為 75 小於選 One 大廈時要放棄的 90 單位，所以選南南大廈是機會成本較低的最佳選擇。"}, {"stem": "小華有 200 元，只能買一樣東西：漫畫（滿足 60 單位）、手搖飲套餐（滿足 75 單位）、電影票（滿足 80 單位）。若小華是理性的，他做完選擇後的機會成本是多少？", "opts": [["A", "60 單位"], ["B", "135 單位"], ["C", "75 單位"], ["D", "215 單位"]], "ans": "C", "exp": "理性選擇會挑滿足程度最高的電影票（80）；被放棄的是漫畫 60 與手搖飲 75，取價值最高者，機會成本為 75 單位。"}, {"stem": "當一項資源只有兩種用途、必須擇一時，關於機會成本的敘述何者正確？", "opts": [["A", "兩個選項的機會成本一定會相同"], ["B", "選甲的機會成本是乙的價值，選乙的機會成本是甲的價值"], ["C", "機會成本等於甲、乙兩者價值的總和"], ["D", "價值較高的那個選項，機會成本一定也比較高"]], "ans": "B", "exp": "只有兩個選項時，選了其中一個就等於放棄另一個，因此機會成本正好是另一項的價值。價值較高者被選中時，機會成本反而較低。"}, {"stem": "小葳週日原本可以打工賺 600 元，但她請假去看電影，電影票 300 元、爆米花 100 元。若不考慮其他因素，她選擇看電影的機會成本是多少？", "opts": [["A", "600 元"], ["B", "300 元"], ["C", "400 元"], ["D", "1000 元"]], "ans": "D", "exp": "機會成本＝外顯成本＋隱藏成本。外顯成本是實際花掉的電影票 300 元加爆米花 100 元共 400 元；隱藏成本是因請假而少賺的 600 元薪資，合計 1000 元。"}, {"stem": "承上題，在小葳的機會成本中，屬於「隱藏成本」的是下列何者？", "opts": [["A", "電影票 300 元"], ["B", "爆米花 100 元"], ["C", "因請假而少賺的打工薪資 600 元"], ["D", "電影院提供的冷氣"]], "ans": "C", "exp": "隱藏成本是「因為做了這個選擇而喪失的其他價值」，並非實際掏錢付出。少賺的薪資沒有實際支付，卻確實損失了，屬於隱藏成本；票價與爆米花則是外顯成本。"}, {"stem": "關於「機會成本＝外顯成本＋隱藏成本」的敘述，下列何者正確？", "opts": [["A", "外顯成本是實際付出的代價，隱藏成本是因選擇而喪失的其他價值"], ["B", "外顯成本是喪失的價值，隱藏成本是實際付出的金錢"], ["C", "計算機會成本時只要算外顯成本就好"], ["D", "隱藏成本因為看不見，所以不必納入考量"]], "ans": "A", "exp": "外顯成本是看得見、實際支付的金錢；隱藏成本是因選擇而放棄的其他價值（如少賺的薪資、失去的時間）。兩者相加才是完整的機會成本。"}, {"stem": "某家店開幕，排隊 2 小時就可以免費領取早餐。小明認為「反正是免費的，所以完全沒有機會成本」。下列對小明的反駁何者最恰當？", "opts": [["A", "這份早餐其實還是要另外收費"], ["B", "排隊的人愈多，機會成本就會愈低"], ["C", "免費贈送的商品屬於自由財，本來就沒有代價"], ["D", "排隊的 2 小時本來可以用在其他用途上，那些被放棄的價值就是機會成本"]], "ans": "D", "exp": "「天下沒有白吃的午餐」。即使金錢上免費，仍付出了 2 小時的時間資源，這段時間原可打工、讀書或休息，被放棄的最高價值即為機會成本。"}, {"stem": "Google 提供搜尋、地圖、信箱等免費服務，使用者不必付費。從機會成本的角度看，下列敘述何者最正確？", "opts": [["A", "使用者完全沒有付出任何代價"], ["B", "使用者付出了自己的行為數據等個人資訊，並須接受廣告投放"], ["C", "使用者付出的成本只有連網的網路費"], ["D", "這些服務屬於自由財，本來就不必付代價"]], "ans": "B", "exp": "表面上金錢免費，但使用者的搜尋紀錄、位置、使用行為等資料被蒐集運用，並須忍受廣告投放，這些就是使用免費服務所付出的隱藏代價。"}, {"stem": "露西看中一套衣服：百貨公司售價 3600 元且可立即取貨；網購平臺售價 3400 元但須等 3 天。露西非常想馬上就拿到衣服。對露西而言，下列敘述何者正確？", "opts": [["A", "選百貨公司的機會成本較低，因為她認為立刻取貨的價值大於省下的 200 元"], ["B", "選網購平臺的機會成本較低，因為金額比較便宜"], ["C", "兩種方式的機會成本一定相同"], ["D", "機會成本只能用金錢衡量，所以她應該選網購"]], "ans": "A", "exp": "機會成本要以「當事人自己的價值評估」來衡量。露西重視立刻取貨，代表立即取貨的價值高於 200 元價差，因此對她而言在百貨公司買的機會成本較低。"}, {"stem": "承上題，露西的家人只在意能不能買得便宜，並不介意等待。下列敘述何者正確？", "opts": [["A", "家人也應該選百貨公司，才與露西一致"], ["B", "家人選網購平臺的機會成本比較高"], ["C", "家人會選網購平臺，因為對他們而言省下 200 元的價值高於立刻取貨"], ["D", "同一家人的最佳選擇必然相同"]], "ans": "C", "exp": "家人重視價格而非時效，放棄「立刻取貨」對他們損失較小，所以選網購的機會成本較低。同一情境下，因偏好不同，機會成本與最佳選擇也可能不同。"}, {"stem": "面對完全相同的兩個選項，甲和乙卻做出不一樣的選擇。造成兩人機會成本不同的最主要原因是什麼？", "opts": [["A", "商品標示的價格對兩人並不相同"], ["B", "兩人可用的資源數量必定不同"], ["C", "政府對兩人的法律規定不同"], ["D", "每個人的需求與喜好不同，對各選項的價值評估也不同"]], "ans": "D", "exp": "機會成本取決於「放棄項目對當事人的價值」，而價值來自個人的偏好與需求。偏好不同，同一選項的價值評估就不同，機會成本與最終選擇自然有差異。"}, {"stem": "阿丞趕著上學快遲到了，路口卻是紅燈。他仍然停下來等綠燈。若以機會成本解釋他的行為，下列何者最恰當？", "opts": [["A", "因為闖紅燈的機會成本比較低"], ["B", "因為遵守號誌的機會成本較低，闖紅燈要承擔危險與罰鍰"], ["C", "兩種行為的機會成本完全相同"], ["D", "交通規則屬於法律問題，與機會成本無關"]], "ans": "B", "exp": "闖紅燈雖能省下等待時間，卻要冒著車禍受傷與被開罰單的風險，代價（機會成本）遠高於停等所損失的一點時間，因此理性的人會選擇守法。"}, {"stem": "課本強調「機會成本並不是所有被放棄選項價值的加總」，其理由是下列何者？", "opts": [["A", "因為一個人一次可以同時做很多個選擇"], ["B", "因為被放棄的選項對當事人來說都沒有價值"], ["C", "因為即使選項再多，實際上也只能擇一，真正被排擠掉的只有價值最高的那一個"], ["D", "因為把數字加總起來會太大，計算上不方便"]], "ans": "C", "exp": "資源只能用在一個用途上，就算放棄了三、四項，這些項目彼此之間本來也無法同時擁有。真正因此喪失的最高價值只有一個，所以取「價值最高者」而非加總。"}, {"stem": "小杰的週末下午有三種用法：去當家教可賺 500 元；去看球賽，他認為這場球賽對自己的價值相當於 400 元；在家睡覺，價值相當於 150 元。若小杰理性選擇當家教，他的機會成本是多少？", "opts": [["A", "400 元"], ["B", "550 元"], ["C", "150 元"], ["D", "500 元"]], "ans": "A", "exp": "被放棄的是球賽（400）與睡覺（150），取價值最高者 400 元為機會成本。500 元是他所獲得的利益，不是成本；把 400 與 150 相加也是常見的錯誤。"}, {"stem": "關於「誘因」的定義，下列敘述何者正確？", "opts": [["A", "誘因就是商品在市場上的標示價格"], ["B", "誘因是誘發或抑制特定行為的報酬或懲罰，對選擇具有引導作用"], ["C", "誘因是政府每年編列的預算總額"], ["D", "誘因是指資源稀少的程度高低"]], "ans": "B", "exp": "誘因能誘使人們改變行為，可能是鼓勵性的報酬，也可能是抑制性的懲罰，會改變各選項的利益與機會成本，進而影響人們的選擇。"}, {"stem": "環保署規定，消費者自備環保杯購買飲料時，店家至少須提供 5 元的價差優惠。這項措施屬於下列何種誘因？", "opts": [["A", "負向、非金錢誘因"], ["B", "負向、金錢誘因"], ["C", "正向、非金錢誘因"], ["D", "正向、金錢誘因"]], "ans": "D", "exp": "目的是「鼓勵」民眾自備環保杯，屬於正向誘因；採取的方式是折抵 5 元現金，屬於金錢誘因。"}, {"stem": "政府修法將汽車酒駕初犯罰鍰提高為 3～12 萬元，並新增同車年滿 18 歲乘客的連坐罰鍰。這項措施屬於下列何種誘因？", "opts": [["A", "負向、金錢誘因"], ["B", "正向、金錢誘因"], ["C", "負向、非金錢誘因"], ["D", "正向、非金錢誘因"]], "ans": "A", "exp": "提高懲罰以「抑制」酒駕行為，屬於負向誘因；懲罰的方式是罰鍰（金錢），屬於金錢誘因。"}, {"stem": "老師規定「主動回答問題可加平時成績」、「上課吵鬧則給予違規記點」。這兩項措施分別屬於何種誘因？", "opts": [["A", "正向金錢誘因／負向金錢誘因"], ["B", "負向非金錢誘因／正向非金錢誘因"], ["C", "正向非金錢誘因／負向非金錢誘因"], ["D", "正向非金錢誘因／負向金錢誘因"]], "ans": "C", "exp": "加平時成績是鼓勵（正向），記違規點是抑制（負向）；兩者都不是以金錢作為報酬或懲罰，故皆屬非金錢誘因。"}, {"stem": "爸爸告訴小宇：「如果沒有寫完功課，這週的零用錢就減少 100 元。」這項規定屬於下列何種誘因？", "opts": [["A", "正向、金錢誘因"], ["B", "負向、金錢誘因"], ["C", "負向、非金錢誘因"], ["D", "正向、非金錢誘因"]], "ans": "B", "exp": "目的是抑制「不寫功課」的行為，屬於負向誘因；且採取降低金錢報酬的方式，因此是負向的金錢誘因。"}, {"stem": "關於「正向誘因」，下列敘述何者正確？", "opts": [["A", "正向誘因一定要用金錢的方式才能實施"], ["B", "正向誘因就是對人施以懲罰"], ["C", "正向誘因是指降低報酬或提高懲罰"], ["D", "正向誘因是提高報酬或減少懲罰，用來鼓勵特定行為"]], "ans": "D", "exp": "正向誘因的目的在「鼓勵」，做法是提高報酬或減少懲罰；反之，降低報酬或提高懲罰以抑制行為則是負向誘因。正向誘因也可以是獎狀、榮譽等非金錢形式。"}, {"stem": "超商推出「集點兌換公仔」促銷活動。喜歡公仔的小婷天天去消費，但不感興趣的阿凱完全不受影響。造成兩人反應不同的原因為何？", "opts": [["A", "這個誘因設計錯誤，對所有人都無效"], ["B", "公仔的製作品質不佳，缺乏吸引力"], ["C", "每個人的需求與好惡不同，同一誘因帶來的利益與所須承擔的機會成本也不同"], ["D", "因為只有金錢誘因才會產生效果"]], "ans": "C", "exp": "對小婷而言集點的利益大於多消費的代價；對阿凱而言集點沒有價值，為湊點數而多花錢的機會成本太高。因此了解人們的需求與偏好，才能讓誘因發揮效果。"}, {"stem": "關於「誘因」與「機會成本」兩者的關係，下列敘述何者最正確？", "opts": [["A", "誘因出現會改變各選項的利益或損害，使機會成本產生變化，進而影響人們的選擇"], ["B", "誘因和機會成本是兩個毫無關聯的概念"], ["C", "只要有誘因出現，機會成本一定會變成零"], ["D", "機會成本只會受到商品價格影響，與誘因無關"]], "ans": "A", "exp": "誘因（獎勵或懲罰）會改變各選項的價值，連帶使放棄某選項的代價改變，機會成本因此變動，最終可能改變人們的最佳選擇。"}, {"stem": "為了進一步減少酒駕，有人建議政府「公開酒駕累犯的姓名」。這項建議屬於下列何種誘因？", "opts": [["A", "正向、金錢誘因"], ["B", "正向、非金錢誘因"], ["C", "負向、金錢誘因"], ["D", "負向、非金錢誘因"]], "ans": "D", "exp": "公開姓名是以名譽受損作為懲罰，目的在抑制酒駕行為（負向），且不涉及金錢的給予或剝奪（非金錢誘因）。"}, {"stem": "近年盛行「酒後代駕」服務：車主喝酒後由代駕司機開車，連人帶車送回家。對車主而言，選擇酒後代駕的誘因，下列敘述何者最正確？", "opts": [["A", "屬於負向誘因，因為必須另外付一筆費用"], ["B", "可避免酒駕罰鍰與肇事風險，也不必隔天回原地取車，屬於正向誘因"], ["C", "這與機會成本的計算完全無關"], ["D", "這是政府的強制規定，車主沒有選擇權"]], "ans": "B", "exp": "代駕帶來的好處（免罰鍰、免肇事風險、免隔天回原地取車的麻煩）鼓勵車主採取此行為，屬於正向誘因；車主會比較代駕費用與酒駕可能付出的代價後做出選擇。"}, {"stem": "在其他條件不變的情況下，某手搖飲料店的珍珠奶茶從一杯 45 元調漲為 60 元。消費者的購買數量最可能如何變化？", "opts": [["A", "減少，因為價格上漲時消費者會少買"], ["B", "增加，因為漲價代表品質提升"], ["C", "完全不變，因為飲料是必需品"], ["D", "先大幅增加，之後才逐漸減少"]], "ans": "A", "exp": "在其他條件不變下，商品價格上漲，消費者會減少購買數量；價格下跌則會增加購買數量。價格是影響消費者選擇最重要的因素之一。"}, {"stem": "阿明聽說下週油價將要調漲，於是今天先把機車油箱加滿。阿明的消費行為主要受到下列哪一項因素影響？", "opts": [["A", "個人偏好"], ["B", "收入多寡"], ["C", "預期心理"], ["D", "商品目前的價格"]], "ans": "C", "exp": "除了商品本身的價格外，個人偏好、收入多寡與預期心理也會影響消費。阿明是因為「預期未來會漲價」而提前消費，屬於預期心理的作用。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

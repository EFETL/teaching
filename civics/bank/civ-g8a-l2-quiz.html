<script>
const QS=[{"stem": "課本指出，公共意見是指一群民眾在某段時間內公開表達的集體意見。這些意見所針對的對象，最主要是下列何者？", "opts": [["A", "個人對偶像藝人的喜好排名"], ["B", "公共事務、政府政策或政治人物等議題"], ["C", "家族內部的財產分配爭議"], ["D", "同學之間私下討論的座位安排"]], "ans": "B", "exp": "公共意見的核心在於「公共」，必須是針對公共事務、政府政策或政治人物等公眾關切的議題；純屬個人喜好或私人事務，無法形成公共意見。"}, {"stem": "「公共意見」在課本中還有兩個常見的別稱，下列何者正確？", "opts": [["A", "公權力與公信力"], ["B", "公投與複決"], ["C", "民意與輿論"], ["D", "民主與法治"]], "ans": "C", "exp": "公共意見是人民對公共議題經由自由公開討論所匯集成的集體想法，因此又稱為「民意」或「輿論」。"}, {"stem": "「政府的施政必須以民意為依歸」，這句話最能呈現民主政治四大特色中的哪一項？", "opts": [["A", "民意政治"], ["B", "責任政治"], ["C", "法治政治"], ["D", "政黨政治"]], "ans": "A", "exp": "民意政治強調政府的權力來自人民授權，施政須以民意為依歸；責任政治強調負責下臺、法治政治強調依法行事、政黨政治強調政黨公平競爭。"}, {"stem": "小禾對學校營養午餐的品質很不滿意，但她只把想法寫在自己的日記裡，從未告訴任何人。依課本的說明，小禾的想法還不能算是公共意見，最主要的原因為何？", "opts": [["A", "營養午餐不屬於公共事務"], ["B", "小禾還是國中生沒有投票權"], ["C", "只有一個人的意見不算意見"], ["D", "意見未公開表達與討論，無法匯集成集體想法"]], "ans": "D", "exp": "公共意見必須「公開」，經由公開表達與自由討論才能彼此激盪、匯集成集體意見；藏在心裡或日記中的想法無法被討論與匯集。"}, {"stem": "課本以「縮短在校時間」為例說明公共意見的形成。下列形成過程的排列，何者最符合課本敘述？\n甲、政府召開公聽會進行對話討論並擬定政策\n乙、民眾在「公共政策網路參與平臺」提議\n丙、媒體報導國高中生在校時間偏長引發討論\n丁、經過反覆討論，附議人數達到成案門檻", "opts": [["A", "乙丙丁甲"], ["B", "丙甲乙丁"], ["C", "丙乙丁甲"], ["D", "乙丁丙甲"]], "ans": "C", "exp": "課本的流程是：媒體報導引發民眾關注討論（丙）→ 民眾上網提議（乙）→ 反覆討論、附議達門檻成案（丁）→ 政府召開公聽會並擬定政策（甲）。"}, {"stem": "在民主國家中，政府面對公共意見應有的作為，下列敘述何者最恰當？", "opts": [["A", "主動探求公共意見，並保障民眾自由公開討論的機會"], ["B", "為維持政局穩定，應限制民眾公開討論爭議性議題"], ["C", "政策一經公告即不得再受民意影響，以維護政府威信"], ["D", "只需傾聽支持政府立場者的意見，反對意見可以忽略"]], "ans": "A", "exp": "民主政府除了主動探求民意，更應保障民眾自由公開討論以形成公共意見的機會，並以此作為施政依據；限制討論或只聽單方意見都違反民主精神。"}, {"stem": "課本提醒我們，如果人民對班級幹部選舉、社區公園規劃這類公共事務漠不關心，最可能造成下列何種結果？", "opts": [["A", "政府會因此更謹慎地保障人民權益"], ["B", "公共事務會自動朝最理想的方向發展"], ["C", "政黨與利益團體將失去存在的必要"], ["D", "政府無從得知人民想法，人民權益可能受損"]], "ans": "D", "exp": "公共事務與生活息息相關，若人民漠不關心，政府便無法了解人民的想法，形成的政策未必符合需求，自身權益反而可能受到損害。"}, {"stem": "下列何者「不」屬於課本所列，民眾在民主國家中表達公共意見的常見管道？", "opts": [["A", "依法申請並參與集會遊行"], ["B", "拒繳稅捐並毀損公物以示抗議"], ["C", "接受民意調查表達自己的看法"], ["D", "出席政府舉辦的公聽會發言"]], "ans": "B", "exp": "課本所列管道包括媒體、集會遊行、公聽會、民意調查、公眾人物、利益團體與政黨等，皆屬合法理性的方式；拒繳稅捐、毀損公物已屬違法行為，不是表達公共意見的正當管道。"}, {"stem": "依課本的定義，「利益團體」是指下列何者？", "opts": [["A", "由政府依法設立，負責執行政策的行政機關"], ["B", "以取得執政權、組織政府為主要目標的政治組織"], ["C", "具有共同理想或利益的人們，為達成特定目標而組成的團體"], ["D", "專門進行民意調查並發布結果的商業公司"]], "ans": "C", "exp": "利益團體是具有共同理想或利益的人們，為了達成特定目標而組成的團體，例如台灣環境保護聯盟。"}, {"stem": "比較「利益團體」與「政黨」在關注議題上的差異，下列敘述何者正確？", "opts": [["A", "利益團體多聚焦與團體目標相關的特定議題，政黨則關注多面向議題"], ["B", "利益團體關注多面向議題，政黨只關注選舉相關議題"], ["C", "兩者皆只關注環境保護議題，差別在於規模大小"], ["D", "兩者皆不關心公共議題，只在意內部成員的私人利益"]], "ans": "A", "exp": "利益團體針對與自身目標相關的特定議題（如環保、勞工權益）發聲；政黨則須對多面向的公共議題提出主張，以爭取執政機會。"}, {"stem": "課本指出，當民眾透過利益團體或政黨表達意見時，往往比個人單獨發聲更能發揮影響力，其主要原因為何？", "opts": [["A", "這兩者可以直接代替政府制定法律"], ["B", "這兩者的意見一定比個人意見正確"], ["C", "法律規定政府必須優先採納團體意見"], ["D", "這兩者本身即代表某些群體，能匯集較大的聲量"]], "ans": "D", "exp": "利益團體與政黨本身就代表某些群體，透過它們表達意見等於集結眾人力量，因此更能發揮公共意見的影響力。"}, {"stem": "某環保團體舉辦記者會與連署活動，成功讓「山坡地設置太陽光電設施」成為社會熱烈討論的話題。此例最能說明利益團體的何種作用？", "opts": [["A", "代替政府執行環境保護政策"], ["B", "主動引導公共意見的形成"], ["C", "取代立法院制定相關法律"], ["D", "阻止其他民眾表達不同意見"]], "ans": "B", "exp": "利益團體或政黨會針對特定議題採取行動，引發民眾關注與討論，主動引導公共意見的形成。"}, {"stem": "政府為了有效傾聽民意，設置「公共政策網路參與平臺」，讓民眾在政策形成、執行與評估階段提出意見。此一機制最主要的意義為何？", "opts": [["A", "建立全民參與公共事務的常設網路管道"], ["B", "取代選舉，成為人民更換政府的方式"], ["C", "讓政府可以掌握每位發言民眾的個人資料"], ["D", "使政府不必再舉辦公聽會與民意調查"]], "ans": "A", "exp": "該平臺是政府運用網路工具建立的常設參與管道，讓民眾在政策各階段都能表達意見，並非取代選舉或其他管道。"}, {"stem": "政府在制定學校午餐相關專法前，邀請家長、營養師、學者與業者到場發表意見並互相討論。此種蒐集民意的方式最可能是下列何者？", "opts": [["A", "公民投票"], ["B", "集會遊行"], ["C", "公聽會"], ["D", "民意調查"]], "ans": "C", "exp": "公聽會是政府在研擬政策或法案時，邀集民眾與專家學者到場對話討論、蒐集意見的正式管道。"}, {"stem": "民調機構打電話詢問：「請問您對交通安全的滿意度，若以1到10評分，滿分為10，您會給幾分？」此種探求民意的方式為何？", "opts": [["A", "公聽會"], ["B", "民意調查"], ["C", "公民投票"], ["D", "媒體投書"]], "ans": "B", "exp": "以問卷或電話訪問方式蒐集民眾對特定議題的看法並加以統計，即為民意調查；民眾接受民意調查也是表達公共意見的方式之一。"}, {"stem": "翰林版課本提到，人民常以「媒體投書」表達公共意見。下列對媒體投書的敘述何者最正確？", "opts": [["A", "投書內容具有法律強制力，政府必須照辦"], ["B", "只有民意代表才有資格向媒體投書"], ["C", "投書後政府必須在七天內書面回覆"], ["D", "民眾向媒體發表意見以尋求關注，期待問題獲得解決"]], "ans": "D", "exp": "媒體投書是民眾向媒體發表自己的看法，藉此引起社會關注、促使問題被重視與解決，並不具法律強制力。"}, {"stem": "下列哪一組全部都是課本所提到「民眾表達公共意見」的方式？", "opts": [["A", "依法納稅、服兵役、接受國民教育"], ["B", "逮捕嫌犯、審判案件、執行判決"], ["C", "遊行抗議、座談會、透過民意代表反映"], ["D", "編列預算、發布行政命令、任命官員"]], "ans": "C", "exp": "(A)是人民的義務、(B)是司法機關職權、(D)是政府的施政作為；只有(C)全部屬於人民表達公共意見的管道。"}, {"stem": "國中生雖然沒有投票權，但仍可參與公共事務。下列何者是課本鼓勵國中生表達公共意見的合適做法？", "opts": [["A", "在班會上針對班級公共事務討論並提案"], ["B", "冒用成年人身分參加公民投票"], ["C", "未經查證就在群組轉傳聳動訊息"], ["D", "以蹺課罷課方式強迫學校接受訴求"]], "ans": "A", "exp": "學生自治（如開班會）是國中生參與校園公共事務最常見的方式；其餘選項或違法、或不理性，皆非適當管道。"}, {"stem": "課本指出，公共意見與「政治參與」關係密切。下列敘述何者最能說明兩者的關聯？", "opts": [["A", "只有具備投票權的成年人才算政治參與"], ["B", "人民參與公共事務、表達公共意見以影響政府決策，即屬政治參與"], ["C", "政治參與只能透過政黨進行，個人無從參與"], ["D", "公共意見形成後就與政治參與再無關聯"]], "ans": "B", "exp": "政治參與是指人民關心政治事務而進行的各種活動，目的在把公共意見表達給政府、進而影響政府決策，投票只是其中最普遍的一種。"}, {"stem": "有民眾以激烈甚至暴力方式表達訴求，與警方對峙、與立場相左的團體叫囂。課本對此提醒我們什麼？", "opts": [["A", "意見愈激烈愈能代表多數民意"], ["B", "政府應立即禁止所有集會遊行"], ["C", "只要目的正當，手段可以不擇"], ["D", "表達意見仍須保持理性和平，透過溝通尋求最大共識"]], "ans": "D", "exp": "課本強調表達意見的過程中應維持理性與和平的態度，透過不斷溝通累積共識；激烈或暴力手段反而不利民主運作。"}, {"stem": "「環保、經濟、教育、交通等各種議題，只要受到民眾關注與討論，就能形成公共意見。」這段話說明公共意見的何種特性？", "opts": [["A", "議題性"], ["B", "複雜性"], ["C", "影響性"], ["D", "不穩定性"]], "ans": "A", "exp": "議題性指公共事務種類繁多，凡是受到民眾關注與討論的議題都可能形成公共意見。"}, {"stem": "對於免費營養午餐政策，有人支持、有人反對，而支持者之間對於經費來源也有不同主張。這最能顯示公共意見的何種特性？", "opts": [["A", "議題性"], ["B", "影響性"], ["C", "複雜性"], ["D", "不穩定性"]], "ans": "C", "exp": "公共意見內容通常較為複雜，不僅有支持與反對兩方，支持者之間或反對者之間也可能有不同看法，因此複雜性又稱為「差異性」。"}, {"stem": "在民眾要求改善交通安全的壓力下，政府自民國112年6月起實施交通新制，對違規記點採嚴格處理並放寬民眾可檢舉的項目。此例最能凸顯公共意見的何種特性？", "opts": [["A", "議題性"], ["B", "複雜性"], ["C", "不穩定性"], ["D", "影響性"]], "ans": "D", "exp": "影響性指公共意見會影響政治人物或政黨的主張、政策的研擬，甚至改變政府的施政方向。"}, {"stem": "俗語說「民意如流水」，這句話最貼近公共意見的哪一項特性？", "opts": [["A", "議題性"], ["B", "不穩定性"], ["C", "複雜性"], ["D", "公開性"]], "ans": "B", "exp": "公共意見形成後並非穩定不變，民眾的支持與否會因時空環境不同而改變，故稱為不穩定性（變動性）。"}, {"stem": "法律修正後規定駕駛人須禮讓行人先行，實施一段時間後因尖峰時段嚴重塞車，原本支持行人路權優先的民意開始出現鬆動。此現象屬於公共意見的何種特性？", "opts": [["A", "不穩定性"], ["B", "議題性"], ["C", "影響性"], ["D", "複雜性"]], "ans": "A", "exp": "時空變化、環境影響甚至單一事件的發生，都可能使原本的公共意見產生轉變，此即不穩定性（變動性）。"}, {"stem": "翰林版課本特別強調公共意見必須具備「公開性」。下列何者最符合此一特性的意涵？", "opts": [["A", "政府必須公開所有國防與外交機密"], ["B", "民意調查的結果必須刊登在報紙頭版"], ["C", "表達意見者必須公開自己的姓名與住址"], ["D", "議題須為公眾關切且能公開討論，才能匯整成集體意見"]], "ans": "D", "exp": "公開性指議題本身是公眾關切的，且人民能公開討論、彼此交換看法，才可能匯集成公共意見。"}, {"stem": "大型重機團體舉辦爭取開放重機行駛國道的遊行，卻引發其他用路人強烈反對。此現象與下列哪一敘述所呈現的公共意見特性相同？", "opts": [["A", "政府修法加重不禮讓行人的罰則"], ["B", "民眾對於是否興建焚化爐分為正反兩派並各持理由"], ["C", "山坡地開發成為許多民眾關注討論的議題"], ["D", "公聽會後民眾對速限規定的立場明顯轉變"]], "ans": "B", "exp": "題幹凸顯「同一議題有支持也有反對」的複雜性（差異性），(B)同屬複雜性；(A)為影響性、(C)為議題性、(D)為不穩定性。"}, {"stem": "課本提到，職業駕駛團體與路權團體針對民眾檢舉違規項目各自提出不同主張，最後立法院將原草案開放檢舉的10個項目修正為5個項目。下列敘述何者正確？", "opts": [["A", "立法院完全照交通部草案通過，未做任何更動"], ["B", "路權團體主張應大幅限縮民眾可檢舉的違規項目"], ["C", "政府因考量各團體意見而修法，展現公共意見的影響性"], ["D", "此例顯示利益團體完全無法影響政府政策"]], "ans": "C", "exp": "立法院是在考量各團體意見後才將10項改為5項，正好說明公共意見（尤其是利益團體的意見）對政府政策的影響性；路權團體主張政府應改善道路設計而非放任違規。"}, {"stem": "下列關於公共意見特性的配對，何者「錯誤」？", "opts": [["A", "議題性——民眾的立場會隨時空環境而改變"], ["B", "複雜性——同一議題常同時有支持者與反對者"], ["C", "影響性——公共意見可能促使政府修改法規"], ["D", "公開性——議題須為公眾關切並能公開討論"]], "ans": "A", "exp": "「立場隨時空環境改變」是不穩定性，不是議題性；議題性指公共事務種類繁多，受到關注與討論者即可形成公共意見。"}, {"stem": "小禾的爸爸在社群網站發表對流浪動物收容政策的看法，引起大量網友關注與討論，最後促成動物保護法修正案通過。關於此例，下列敘述何者「錯誤」？", "opts": [["A", "網路社群是現代民眾表達公共意見的重要管道"], ["B", "此例呈現公共意見能影響政府施政的影響性"], ["C", "個人意見不必經過公開討論即可直接成為公共意見"], ["D", "媒體在公共意見的表達與匯集上扮演重要角色"]], "ans": "C", "exp": "公共意見必須經過公開表達與反覆討論才能匯集成集體意見，個人單一的想法並不等於公共意見。"}, {"stem": "翰林版課本指出媒體在民主社會中的功能，下列何者「不」屬於媒體應發揮的功能？", "opts": [["A", "報導事實，提供民眾所需的資訊"], ["B", "依照政府指示決定哪些新聞可以播出"], ["C", "針對公共議題深入探討，協助人民監督政府"], ["D", "發揮新聞自由，維護民眾「知的權利」"]], "ans": "B", "exp": "媒體應獨立於政府之外，發揮新聞自由、維護知的權利並監督施政；若由政府決定新聞內容，媒體即淪為宣傳工具，違反民主原則。"}, {"stem": "「閱聽人」一詞在課本中的意思為何？", "opts": [["A", "專門經營媒體的企業主"], ["B", "在媒體工作的記者與編輯"], ["C", "政府中負責監理媒體的官員"], ["D", "讀者、聽眾與觀眾的總稱"]], "ans": "D", "exp": "閱聽人指接收媒體訊息的讀者、聽眾與觀眾的總稱，是媒體識讀能力主要的培養對象。"}, {"stem": "隨著資訊科技發達，閱聽人不再只是被動接收訊息。下列何者最能說明此一改變？", "opts": [["A", "民眾可運用自媒體分享時事、製播內容，主動形成議題"], ["B", "民眾必須先取得政府核發的執照才能發言"], ["C", "傳統報紙與電視已完全被法律禁止經營"], ["D", "所有網路訊息皆已經過媒體專業查證"]], "ans": "A", "exp": "自媒體與社群媒體讓民眾能主動分享、製播內容並形成議題，進而匯集成公共意見，呈現民主社會的多元面貌。"}, {"stem": "課本提到媒體「可能存在的現象」。下列哪一項最符合「報導未必反映事實」？", "opts": [["A", "電視臺在報導中強調某族群的負面形象"], ["B", "兩家報社對同一政策的頭條標題立場迥異"], ["C", "媒體為搶快與獨家而未查證，做出錯誤報導"], ["D", "談話節目只邀請支持某政黨的來賓發言"]], "ans": "C", "exp": "為求快速、獨家或衝高收視率與點閱率而未善盡查證之責，導致報導與事實出現落差甚至製造假新聞，即屬「報導未必反映事實」。"}, {"stem": "某新聞臺報導鐵路工會罷工事件時，只大量播出旅客受困抱怨的畫面，完全不提工會的訴求內容。此現象最符合下列何者？", "opts": [["A", "報導未必反映事實"], ["B", "內容隱含偏見或歧視"], ["C", "媒體善盡監督政府之責"], ["D", "報導有特定的立場"]], "ans": "D", "exp": "媒體因特定立場或商業考量，透過議題設定或內容選擇刻意「帶風向」，使閱聽人只接收到單方面訊息，即屬報導有特定立場。"}, {"stem": "某報導在標題中以誇大的猜測連結特定宗教與暴力事件，使讀者對該宗教信徒產生負面印象。此最符合媒體可能存在的何種現象？", "opts": [["A", "報導未必反映事實"], ["B", "內容隱含偏見或歧視"], ["C", "報導有特定的立場"], ["D", "媒體發揮監督功能"]], "ans": "B", "exp": "媒體在報導中不自覺加入主觀想法，強化閱聽人對性別、族群或階級的刻板印象、偏見與歧視，即屬此類現象。"}, {"stem": "一則新聞寫道：「本次颱風造成三縣市共12人受傷，記者認為政府的防災措施明顯不足。」依課本「辨識訊息是事實或意見」的觀點，下列判斷何者正確？", "opts": [["A", "前段是事實，後段是意見"], ["B", "前段是意見，後段是事實"], ["C", "兩段皆為事實"], ["D", "兩段皆為意見"]], "ans": "A", "exp": "事實是客觀可以驗證的內容（受傷人數），意見則加入了個人的主觀判斷（「防災措施明顯不足」）。"}, {"stem": "閱聽人若懷疑媒體報導與事實不符或意見偏頗，依課本建議可採取的做法為何？", "opts": [["A", "立即在網路上大量轉傳該則報導"], ["B", "自行到電視臺前抗議並阻止其播出"], ["C", "查閱民間團體的事實查核報告，或向國家通訊傳播委員會申訴"], ["D", "直接向法院提起訴訟要求撤換該名記者"]], "ans": "C", "exp": "課本建議閱聽人主動思辨與查證，可利用民間團體的事實查核平臺，或向國家通訊傳播委員會（NCC）提出申訴。"}, {"stem": "關於國家通訊傳播委員會（NCC）在媒體管理上的角色，下列敘述何者最正確？", "opts": [["A", "負責事前審查所有新聞稿，通過後才准刊登"], ["B", "有權指定媒體每日必須報導的議題"], ["C", "直接經營全國的電視臺與廣播電臺"], ["D", "在不影響新聞自由前提下，可要求媒體善盡查證義務並依法裁罰"]], "ans": "D", "exp": "NCC並非事前審查機關；它是在不妨礙新聞自由的前提下，對未善盡事實查證義務而損害公共利益或公共秩序的媒體依法予以裁罰。"}, {"stem": "課本提到閱聽人「使用媒體表達意見」的媒體識讀能力，下列何者最符合此項能力的展現？", "opts": [["A", "只收看與自己立場相同的頻道"], ["B", "發現報導有誤時要求媒體更正，或自製訊息與他人分享"], ["C", "看到聳動標題立刻轉傳給所有群組"], ["D", "對所有媒體訊息一律拒絕接收"]], "ans": "B", "exp": "閱聽人不只被動接收資訊，也能主動發表意見：報導有誤或有失公允時可要求更正，也可自行製作訊息透過媒體與他人分享。"}, {"stem": "翰林版課本提醒：「如果閱聽人只選擇與自己立場一致的媒體，將限制對事件的認識。」據此，閱聽人最應培養下列何種能力？", "opts": [["A", "只相信官方發布的訊息"], ["B", "完全不接觸任何社群媒體"], ["C", "大量閱讀、接觸不同媒體，從不同角度解讀訊息"], ["D", "以按讚與轉發數的多寡判斷訊息真假"]], "ans": "C", "exp": "課本強調應接觸多元媒體、從不同角度解讀訊息，培養反思批判與多元思考的能力，避免資料過於單一而產生偏頗。"}, {"stem": "網路流傳一則訊息：「某超商便當的防腐劑含量等同20包泡麵」，民眾大量轉傳後證實為假訊息。此事件最能提醒我們什麼？", "opts": [["A", "接收訊息應先查證再轉傳，以免被假訊息誤導而做出錯誤判斷"], ["B", "所有網路上的食品資訊都不可以相信"], ["C", "民眾不應在網路上討論任何公共議題"], ["D", "政府應全面禁止民眾使用社群媒體"]], "ans": "A", "exp": "課本以此例說明假訊息的危害，強調閱聽人應主動思辨與查證，而非全盤否定網路或禁止公開討論。"}, {"stem": "破解假訊息的訣竅中提到要「注意訊息的來源及發布者，若是沒看過的媒體就要多加確認」。此做法主要在檢視訊息的何種面向？", "opts": [["A", "時效性"], ["B", "涵蓋性"], ["C", "客觀性"], ["D", "權威性"]], "ans": "D", "exp": "確認訊息來源與發布者是否可信，屬於檢視訊息「權威性」的做法。"}, {"stem": "「檢查訊息是否客觀而能被證實，若只有匿名專家背書卻拿不出證據，就有可能是假訊息。」此一檢查重點屬於下列何者？", "opts": [["A", "時效性"], ["B", "客觀性"], ["C", "權威性"], ["D", "涵蓋性"]], "ans": "B", "exp": "檢視內容是否客觀、可被驗證，屬於「客觀性」的查核；匿名專家背書又提不出證據，即為可疑的假訊息特徵。"}, {"stem": "小禾看到一則訊息標題非常聳動，但點進去卻發現內文與標題根本對不上。依破解假訊息的訣竅，她此時運用的是哪一項檢查重點？", "opts": [["A", "看看標題，注意標題與內容是否一致"], ["B", "檢視時間，確認訊息是否及時更新"], ["C", "確認排版，注意有無拼寫錯誤"], ["D", "確認來源，查詢發布者的身分"]], "ans": "A", "exp": "標題過於聳動且與內容不符，是假訊息的常見特徵，屬於「看看標題」的檢查重點。"}, {"stem": "下列何者最符合課本所稱「媒體識讀」能力的內涵？", "opts": [["A", "熟練操作各種影音剪輯軟體的技術"], ["B", "記住每一家媒體的創辦人與經營者姓名"], ["C", "能解讀媒體訊息如何建構、分析媒體是否有特定立場，並主動獲取或發表訊息"], ["D", "能背誦新聞報導的完整內容並複述給他人"]], "ans": "C", "exp": "媒體識讀是指閱聽人能認識與解讀媒體訊息如何被建構，分析、評估甚至批判媒體是否有特定立場，並主動從媒體獲取或發表訊息。"}, {"stem": "民眾普遍具備媒體識讀能力，最可能產生下列何種正面效果？", "opts": [["A", "媒體將不再需要記者採訪新聞"], ["B", "有助督促媒體遵守職業倫理，提供公正客觀的訊息"], ["C", "政府得以名正言順地審查所有媒體內容"], ["D", "假訊息將自動全面消失，無須任何查證"]], "ans": "B", "exp": "閱聽人具備媒體識讀能力可督促媒體自律、遵守職業倫理；媒體提供公正客觀的訊息，既維護民眾知的權利，也能善盡監督政府的角色。"}, {"stem": "無國界記者組織每年公布「新聞自由指數」，評定標準包含政府是否對媒體施行審查制度、媒體在社會體系中的獨立程度等。依此標準，下列何種情形最「有利」於新聞自由？", "opts": [["A", "媒體在新聞節目中夾帶產品行銷"], ["B", "媒體因政治立場不同而選擇性報導部分事實"], ["C", "政府以「危害國家安全」為名逮捕新聞工作者"], ["D", "媒體在報導中同時呈現正反兩面的意見"]], "ans": "D", "exp": "呈現正反意見代表媒體獨立且力求公正，有助提升民眾信任並促進新聞自由；(A)(B)損害媒體專業與客觀性，(C)則是政府直接壓制新聞自由。"}, {"stem": "比較各版本課本對「公共意見」的編排，下列敘述何者正確？", "opts": [["A", "康軒與南一編在八年級上學期，翰林則編在七年級下學期"], ["B", "三個版本都編在九年級下學期"], ["C", "只有翰林版提到公共意見，其他版本完全未提及"], ["D", "三個版本都把公共意見與國際組織合併為同一課"]], "ans": "A", "exp": "康軒編為八上第2課「民主國家中的公共意見」，南一編在八上第6課「公共意見與政治參與」，翰林則將「公共意見」編在七下第4課，三版核心概念大致相同。"}, {"stem": "綜合本課內容，下列關於「公共意見與民主政治」的敘述何者最恰當？", "opts": [["A", "公共意見一旦形成，政府必須無條件立即照辦"], ["B", "媒體報導必然客觀中立，可完全信賴而不必查證"], ["C", "公共意見是政府施政的重要依據，人民應理性表達並具備媒體識讀能力"], ["D", "公共意見只能由利益團體與政黨提出，一般民眾無從參與"]], "ans": "C", "exp": "民主國家施政須以民意為依歸，人民應透過多元管道理性表達意見；同時因媒體可能存在不實或偏頗的報導，閱聽人更需具備媒體識讀能力，才能形成健康的公共意見。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

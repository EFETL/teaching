<script>
const QS=[{"stem": "我國憲法規定人民有受國民教育的權利與義務。依此判斷，國中生每天到學校上課這件事，性質為何？", "opts": [["A", "只是一種義務，並不是權利"], ["B", "只是一種權利，並不是義務"], ["C", "既是權利，同時也是義務"], ["D", "既不是權利，也不是義務"]], "ans": "C", "exp": "憲法明定人民有受國民教育的「權利」與「義務」，所以就學同時具備兩種性質，不能只擇一。"}, {"stem": "課本提到「學生是學習的主體」，因此教師的教學安排與學校舉辦的各項活動，都應該優先考量學生的哪一項權利？", "opts": [["A", "受教權"], ["B", "財產權"], ["C", "隱私權"], ["D", "選舉權"]], "ans": "A", "exp": "學生是學習的主體，教師教學與學校活動都應考量學生的受教權，不可任意剝奪學生上課學習的機會。"}, {"stem": "上課時，小宇不斷在座位上大聲喧鬧、走動，使得鄰座同學完全無法專心聽講。小宇的行為主要侵害了同學的哪一項權利？", "opts": [["A", "身體自主權"], ["B", "財產權"], ["C", "名譽權"], ["D", "學習權"]], "ans": "D", "exp": "學生之間有責任尊重彼此的學習權，避免干擾其他人的學習；喧鬧使他人無法聽課，侵害的是同學的學習權。"}, {"stem": "阿明把遙控玩具車帶到學校，上課時操作它到處亂跑，嚴重妨害教學進行。依課本所述，老師的正確處理方式為何？", "opts": [["A", "當場沒收後直接丟棄銷毀"], ["B", "暫時代為保管，並盡快通知家長領回"], ["C", "移送警察機關依法處理"], ["D", "沒收後歸學校所有，充作教學器材"]], "ans": "B", "exp": "學生攜帶到校的物品若足以妨害教學或干擾學習，教師依法可「暫時代為保管」，並盡快通知家長領回，而非永久沒收。"}, {"stem": "依課本內容，教師原則上不得任意沒收學生的物品，但下列哪一類物品是例外？", "opts": [["A", "上課時把玩的手機"], ["B", "課本下偷看的漫畫書"], ["C", "下課交換的遊戲卡片"], ["D", "法定的違禁品"]], "ans": "D", "exp": "課本明白指出，除「法定違禁品」外不得任意沒收，以免侵害學生的財產權益。其餘物品只能暫時代為保管。"}, {"stem": "小華未經同意就拿走同學放在抽屜裡的計算機使用，用完才歸還。小華的行為主要侵犯了同學哪一方面的權利？", "opts": [["A", "財產方面"], ["B", "學習方面"], ["C", "身體自主方面"], ["D", "名譽方面"]], "ans": "A", "exp": "每個人都有自由使用自己物品的權利，學生之間應避免未經同意擅自使用他人財物，這屬於財產方面的權利。"}, {"stem": "依課本，「國家應保障學生不受身心的侵害」是哪一部法律的規定？", "opts": [["A", "民法"], ["B", "教育基本法"], ["C", "兒童權利公約"], ["D", "性別平等工作法"]], "ans": "B", "exp": "教育基本法規定國家應保障學生不受身心的侵害，這是學生身體自主方面權利的重要法律依據。"}, {"stem": "「每個人都有管理自己身心的權利及能力，沒有經過本人同意，任何人都不能任意碰觸。」這段話說明的是學生哪一方面的權利？", "opts": [["A", "學習方面"], ["B", "財產方面"], ["C", "身體自主方面"], ["D", "名譽方面"]], "ans": "C", "exp": "身體自主權指的就是每個人是自己身心的主人，有權管理與保護自己的身心，未經同意他人不得侵犯。"}, {"stem": "關於「校園霸凌」，下列敘述何者正確？", "opts": [["A", "即使出於開玩笑的動機，仍可能造成同學一輩子不可抹滅的傷害"], ["B", "只要不動手打人，就一定不算霸凌"], ["C", "只發生在校內，網路上的行為不算"], ["D", "只要事後道歉，受害者的權利就沒有受損"]], "ans": "A", "exp": "課本強調學生之間不能因為開玩笑等理由做出校園霸凌行為，以免造成同學一輩子不可抹滅的傷害；霸凌也包含言語、關係、網路等非肢體形式。"}, {"stem": "下課時間，小傑趁同學不在，任意翻動同學的書包和置物櫃察看內容。他的行為侵犯了同學的哪一項權利？", "opts": [["A", "學習權"], ["B", "受教權"], ["C", "身體自主權"], ["D", "隱私權"]], "ans": "D", "exp": "課本提到不宜任意翻動他人的書包、置物櫃，否則就是侵犯個人隱私。"}, {"stem": "小美在班級群組張貼文章，公開嘲諷同學的外貌與家庭。此行為主要侵害同學的哪一項權利？", "opts": [["A", "財產權"], ["B", "名譽權"], ["C", "受教權"], ["D", "身體自主權"]], "ans": "B", "exp": "任何人皆不能在任何情境或場合做出辱罵等傷害他人名譽的行為；網路言論是公開的，撰文者必須為自己的言論負責。"}, {"stem": "小凱認為學校對他的懲處程序不當，導致自己的權益受損。依課本，他可以依法向下列哪一個單位提出申訴？", "opts": [["A", "校務會議"], ["B", "性別平等教育委員會"], ["C", "學生申訴評議委員會"], ["D", "家長會"]], "ans": "C", "exp": "學生權益若因學校不當懲處或決議而受損，可依法向「學生申訴評議委員會」提出申訴，以維護自身權益。"}, {"stem": "下列同學的行為，何者「不」屬於校園霸凌？", "opts": [["A", "長期在網路上散布同學的不實謠言"], ["B", "每天聯合全班孤立、不理睬某位同學"], ["C", "反覆用綽號嘲笑同學的身體特徵"], ["D", "體育課練球時不小心撞到同學造成擦傷"]], "ans": "D", "exp": "霸凌是「故意且持續（重複）」的身心傷害行為。體育課的意外碰撞並非故意且持續，因此不構成霸凌。"}, {"stem": "依課本對校園霸凌的說明，下列何者是判斷霸凌最關鍵的要素？", "opts": [["A", "同儕之間故意且持續（重複）的身體或心理傷害行為"], ["B", "一定要造成明顯的外傷才算"], ["C", "一定要有兩人以上共同實施才算"], ["D", "一定要發生在校園圍牆之內才算"]], "ans": "A", "exp": "課本定義霸凌為同儕之間「故意且持續」的身體或心理傷害行為，使受害者的身體、隱私、名譽等權利受損，與是否有外傷、人數或地點無關。"}, {"stem": "課本引用的調查指出，臺灣有 47% 的兒少曾涉入網路霸凌事件，而且最常發生在哪些場域？", "opts": [["A", "學校的走廊與樓梯間"], ["B", "線上遊戲與社交平臺"], ["C", "補習班與安親班"], ["D", "學校的營養午餐時間"]], "ans": "B", "exp": "該調查顯示網路霸凌最常發生在線上遊戲與社交平臺，提醒學生在網路上也要尊重他人權利。"}, {"stem": "若發現同學遭受校園霸凌，除了告訴師長與家長外，還可以撥打教育部設置的防制校園霸凌專線。該專線號碼為何？", "opts": [["A", "110"], ["B", "113"], ["C", "1953"], ["D", "1999"]], "ans": "C", "exp": "教育部防制校園霸凌專線為 1953，是學生遇到霸凌時可以求助的管道之一。"}, {"stem": "疫情嚴重時，教育部宣布改為線上學習，學校也提供線上學習平臺（如因材網）供學生使用。這項政策主要是為了保障學生的哪一項權利？", "opts": [["A", "學習權與受教權"], ["B", "財產權"], ["C", "隱私權"], ["D", "身體自主權"]], "ans": "A", "exp": "「停課不停學」的用意在於即使無法到校，仍能保障學生繼續學習的機會，屬於學習權與受教權的保障。"}, {"stem": "依課本說明，臺灣中小學生若要帶手機或平板到校，應遵守的規定為何？", "opts": [["A", "完全禁止攜帶，一經發現即永久沒收"], ["B", "可以自由攜帶並隨時使用，學校不得干涉"], ["C", "只要不影響上課，不需任何程序即可使用"], ["D", "必須事先提出申請，並依照規定使用"]], "ans": "D", "exp": "課本指出中小學生帶手機或平板到校必須事先提出申請，並依照規定使用，兼顧學生財產權與全班的學習權。"}, {"stem": "「兒童有表達意見與參與的權利」，這項規定出自下列何者？", "opts": [["A", "中華民國憲法"], ["B", "教育基本法"], ["C", "聯合國兒童權利公約"], ["D", "世界人權宣言"]], "ans": "C", "exp": "課本在討論學生參與校園公共事務時，明確引用聯合國「兒童權利公約」，指出兒童有表達意見與參與的權利。"}, {"stem": "依課本定義，「校園公共事務」是指下列何者？", "opts": [["A", "只有校長與主任才能決定的行政事務"], ["B", "與學校每個人有關且需要處理的事務"], ["C", "只跟老師教學有關、與學生無關的事務"], ["D", "學生私人之間的金錢往來與交友問題"]], "ans": "B", "exp": "校園公共事務通常是指與學校每個人有關、且需要共同處理的事務，如制服樣式、飲水機擺放地點等。"}, {"stem": "下列哪一項最適合被歸類為「校園公共事務」？", "opts": [["A", "小明日記本裡寫的心事"], ["B", "導師家中客廳的裝潢風格"], ["C", "同學互相贈送的生日禮物"], ["D", "學校飲水機的擺放地點"]], "ans": "D", "exp": "公共事務須與學校每個人有關且需要處理，飲水機擺放地點影響全校師生使用；其餘三者皆屬個人私事。"}, {"stem": "七年三班要修改班規中關於「值日生輪值方式」的規定。依課本說明，這項事務應由誰參與決定？", "opts": [["A", "只有七年三班的學生"], ["B", "全校所有班級的學生"], ["C", "全校的教職員工"], ["D", "全校學生家長"]], "ans": "A", "exp": "班規屬於班級事務，只有該班學生才能參與決定，決定後也僅適用該班共同遵守。"}, {"stem": "某校要重新票選下學期營養午餐的菜色。依課本說明，這項事務適合由誰參與討論形成共識？", "opts": [["A", "只有班聯會幹部"], ["B", "只有各班班長"], ["C", "全校學生"], ["D", "只有校長與總務主任"]], "ans": "C", "exp": "學校營養午餐的菜色與全校師生共同相關，因此全校學生都可以參與討論來形成共識。"}, {"stem": "為什麼「班規」只由該班學生決定，「營養午餐菜色」卻可由全校學生參與討論？最主要的原因是？", "opts": [["A", "因為班規比較不重要，可以隨便決定"], ["B", "因為公共事務涉及的對象與適用範圍不同"], ["C", "因為只有午餐才需要花錢，班規不用"], ["D", "因為法律規定所有事情都必須全校投票"]], "ans": "B", "exp": "課本指出公共事務因涉及的對象及適用範圍不同，可以參與決定的人也會不同，這是判斷「誰可以參與」的關鍵。"}, {"stem": "依康軒課本，學生要有效處理校園公共事務，其歷程的正確順序為何？", "opts": [["A", "釐清公共事務範圍 → 深入了解事務內容 → 藉由學生自治形成決定"], ["B", "藉由學生自治形成決定 → 釐清公共事務範圍 → 深入了解事務內容"], ["C", "深入了解事務內容 → 藉由學生自治形成決定 → 釐清公共事務範圍"], ["D", "釐清公共事務範圍 → 藉由學生自治形成決定 → 深入了解事務內容"]], "ans": "A", "exp": "課本的處理歷程為：先釐清學生可以參與哪些公共事務，其次深入了解該事務的相關資訊，最後再藉由學生自治形成處理的共識。"}, {"stem": "小組想推動「改善校園廁所異味」的提案，正處於「深入了解公共事務內容」的階段。下列何者最符合這個階段應做的事？", "opts": [["A", "直接舉手表決要不要改建廁所"], ["B", "立刻向校長遞交陳情書要求撥款"], ["C", "先在班會通過決議再說"], ["D", "訪談清潔人員並對全校做問卷調查"]], "ans": "D", "exp": "深入了解階段應透過各種管道蒐集資料，例如尋求專業人士建議、以問卷調查或訪談了解相關成員想法，之後才進入形成決定的階段。"}, {"stem": "在蒐集公共事務相關資料時，課本強調應該獲得下列何者，才能做出較合適的決定？", "opts": [["A", "只蒐集支持自己立場的資料"], ["B", "正反面意見的完整資訊"], ["C", "只採納老師一個人的看法"], ["D", "只參考網路上點閱率最高的說法"]], "ans": "B", "exp": "課本指出應透過問卷、訪談或專業建議等過程，獲得「正反面意見的完整資訊」，避免偏聽單一立場。"}, {"stem": "依課本，實施「學生自治」的先決條件為何？", "opts": [["A", "必須先取得全體家長書面同意"], ["B", "必須先經過縣市政府核准"], ["C", "必須遵守學校規定與社會規範（政府法令）"], ["D", "必須由校長親自擔任主席"]], "ans": "C", "exp": "學生自治不是完全不受限制，其先決條件是必須遵守學校規定與社會規範（政府法令），才能在合法範圍內運作。"}, {"stem": "下列何者最符合課本對「學生自治」的定義？", "opts": [["A", "由學校行政人員代替學生決定所有事務"], ["B", "由家長會決定學生在校的一切活動"], ["C", "學生可以不受任何規範自由行動"], ["D", "由學生參與管理與學生有關的公共事務"]], "ans": "D", "exp": "學生自治是指由學生參與管理與學生有關的公共事務，例如班級生活公約的制定、班服的討論等。"}, {"stem": "關於「學生自治的實施步驟」，下列順序何者正確？", "opts": [["A", "成立自治組織 → 訂定自治規範 → 推展各項自治活動"], ["B", "訂定自治規範 → 成立自治組織 → 推展各項自治活動"], ["C", "推展各項自治活動 → 成立自治組織 → 訂定自治規範"], ["D", "成立自治組織 → 推展各項自治活動 → 訂定自治規範"]], "ans": "A", "exp": "課本圖示的三步驟為：1. 成立自治組織（如班會、班聯會、學生社團）2. 訂定自治規範（如班級公約、社團組織章程）3. 推展各項自治活動（如討論班服、舉辦班級郊遊）。"}, {"stem": "下列何者屬於學生自治步驟中的「成立自治組織」？", "opts": [["A", "制定班級公約"], ["B", "訂定社團組織章程"], ["C", "成立班聯會"], ["D", "舉辦班級郊遊活動"]], "ans": "C", "exp": "班會、班聯會、學生社團屬於「自治組織」；班級公約與社團章程屬於「自治規範」；郊遊、討論班服則屬於「自治活動」。"}, {"stem": "下列何者屬於學生自治步驟中的「訂定自治規範」？", "opts": [["A", "選出班長與各股股長"], ["B", "制定班級生活公約"], ["C", "舉辦班級同樂會"], ["D", "成立熱音社"]], "ans": "B", "exp": "班級公約、社團組織章程都是學生自己訂定、用來共同遵守的自治規範。"}, {"stem": "班會討論班服樣式時，班長提醒：「贊成人數少的意見也要讓他說完，不能忽略。」這句話體現了會議討論的哪一項原則？", "opts": [["A", "多數尊重少數"], ["B", "少數服從多數"], ["C", "先提名先表決"], ["D", "一事不再議"]], "ans": "A", "exp": "課本指出「少數的意見不應被忽略」即為「多數尊重少數」；而「決議結果每個人都有遵守的責任」則是「少數服從多數」。"}, {"stem": "班會表決通過班遊地點後，投反對票的小玉仍然依決議一同前往。這種做法最符合下列哪一項原則？", "opts": [["A", "多數尊重少數"], ["B", "權宜問題優先"], ["C", "秩序問題優先"], ["D", "少數服從多數"]], "ans": "D", "exp": "決議的結果每個人都有遵守的責任，即使原本持反對意見，也應遵守多數決的決議，這就是少數服從多數。"}, {"stem": "依課本，若班會討論時完全忽略少數同學的意見，最可能造成什麼後果？", "opts": [["A", "提高決議的合法性，讓決議更有效力"], ["B", "少數同學心生不滿而衍生衝突，影響共識凝聚"], ["C", "使會議程序更完整，符合會議規範"], ["D", "讓班級決議自動失效，必須重新開會"]], "ans": "B", "exp": "課本指出少數意見若被忽略，可能導致其不滿而衍生衝突，進而影響共識的凝聚，形成公共事務處理的阻力。"}, {"stem": "關於「多數決」，下列敘述何者正確？", "opts": [["A", "多數決可以決定所有事情，沒有任何限制"], ["B", "多數決只能用在選舉，不能用在其他議題"], ["C", "不可以用多數決限制或剝奪少數人的基本權利"], ["D", "多數決必須全體一致同意才算通過"]], "ans": "C", "exp": "多數決是民主社會最常採行的表決方式，但並非所有事物都適合多數決；尤其不能用多數決限制或剝奪少數人的基本權利。"}, {"stem": "關於班會中「主席」的職責，下列敘述何者正確？", "opts": [["A", "應率先發表自己的立場，帶領同學表決"], ["B", "可以直接決定議案通過與否，不必表決 原住民族」正名為「山胞」"], ["B", "將「山胞」（山地同胞）正名為「原住民族」"], ["C", "將「原住民族」正名為「平地同胞」"], ["D", "將「山地同胞」正名為「少數民族」"]], "ans": "B", "exp": "政府回應原住民族的訴求，將具有歧視意涵的「山胞（山地同胞）」正名為「原住民族」。"}, {"stem": "政府為專責處理與原住民族權益相關的事務，設立了下列哪一個機關？", "opts": [["A", "內政部民政司"], ["B", "文化部"], ["C", "原住民族委員會"], ["D", "客家委員會"]], "ans": "C", "exp": "行政院為統合原住民族政策、保障原住民族權益而設原住民族委員會，也是部落核定的主管機關。"}, {"stem": "依原住民族基本法，政府或私人若欲使用原住民族的資源，應該怎麼做？", "opts": [["A", "必須與原住民族或部落諮商"], ["B", "只需向鄉鎮市公所報備即可"], ["C", "可自行使用，無須任何程序"], ["D", "只要取得任何一位族人口頭同意即可"]], "ans": "A", "exp": "原住民族基本法確認原住民族的自治權，因此不論政府或私人欲使用原住民族的資源，都必須與原住民族或部落諮商。"}, {"stem": "為保障我國各固有族群的語言，確保面臨傳承危機的原住民族語言得以保存與復興，政府制定了下列哪一部法律？", "opts": [["A", "原住民族基本法"], ["B", "野生動物保育法"], ["C", "公寓大廈管理條例"], ["D", "國家語言發展法"]], "ans": "D", "exp": "國家語言發展法明定保障我國各固有族群的語言，使面臨傳承危機的原住民族語言得以保存與復興。"}, {"stem": "課本所介紹的司馬庫斯部落位於何處？屬於哪一族？", "opts": [["A", "花蓮縣光復鄉，阿美族"], ["B", "臺東縣海端鄉，布農族"], ["C", "新竹縣尖石鄉，泰雅族"], ["D", "屏東縣三地門鄉，排灣族"]], "ans": "C", "exp": "司馬庫斯位於新竹縣尖石鄉，是雪山山脈的泰雅族深山部落，以「巨木群」聞名。"}, {"stem": "司馬庫斯部落自民國80年對外公布「巨木群」後，帶來觀光收益，但隨之而來的問題是什麼？", "opts": [["A", "部落人口迅速減少至完全無人居住"], ["B", "各方勢力介入，部落內部出現利益分配的衝突"], ["C", "政府強制廢除部落會議"], ["D", "族人被迫改說其他族群的語言"]], "ans": "B", "exp": "課本指出遊客到來帶來觀光收益的同時，各方勢力介入與部落內部利益分配的衝突也隨之而來。"}, {"stem": "為了避免部落分裂，司馬庫斯族人經過多年討論後確立了下列何種發展方向？", "opts": [["A", "將土地全部出售給財團開發"], ["B", "全面禁止任何遊客進入部落"], ["C", "由政府接管部落的所有事務"], ["D", "「土地部落共有共管」，由族人共同經營部落的觀光事業"]], "ans": "D", "exp": "族人花了多年討論化解歧見，最終確定「土地部落共有共管」的方向，並成立勞動合作社共同經營觀光。"}, {"stem": "關於司馬庫斯部落勞動合作社（Tnunan）的運作方式，下列敘述何者正確？", "opts": [["A", "部落所得收入全數歸入基金，負擔工作的成年人領取月薪，部落並提供族人各項生活福利"], ["B", "收入依照各家族擁有的土地面積比例分配"], ["C", "只有部落領袖一人可以領取薪水"], ["D", "所有收入必須全數上繳中央政府統籌運用"]], "ans": "A", "exp": "課本說明部落所得收入全數歸入基金，每位負擔工作的成年人月薪一萬元，部落並提供族人各項生活福利。"}, {"stem": "司馬庫斯成立「泰雅爾學校」，自編文化繪本、日記和語言繪本，其主要目的為何？", "opts": [["A", "增加部落的觀光門票收入"], ["B", "取代國民教育的正規學制"], ["C", "讓年輕人留在部落學習，並傳承泰雅民族知識與文化"], ["D", "訓練族人成為專業的觀光導遊"]], "ans": "C", "exp": "課本指出成立泰雅爾學校是希望年輕人留在部落學習並傳承泰雅民族知識，讓學習命脈根留部落。"}, {"stem": "許多族人以傳統文化為基礎推動「部落營造」，其最主要的目的為何？", "opts": [["A", "將部落全面改建為現代化的都市住宅區"], ["B", "發掘部落特色、恢復部落生機，營造族人願意回鄉居住的環境，以解決人口外流"], ["C", "讓部落脫離國家法律的管轄"], ["D", "禁止部落與外界有任何往來與交流"]], "ans": "B", "exp": "部落營造是以原住民族傳統文化為基礎，發掘部落特色、恢復部落生機，讓外移的族人願意回鄉，解決人口外流與部落沒落的問題。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "我國中央政府的組織如何形成、職權如何行使，主要規範於下列哪些法規之中？", "opts": [["A", "民法與刑法"], ["B", "地方制度法與公民投票法"], ["C", "中華民國憲法與憲法增修條文"], ["D", "行政程序法與立法院職權行使法"]], "ans": "C", "exp": "課本開宗明義指出，我國依五權分立的精神，將中央政府的組織與職權明確規範於「憲法」及「憲法增修條文」中，另有相關法規補充。民法、刑法規範的是私人權利義務與犯罪處罰，並非政府組織的依據。"}, {"stem": "關於我國中央政府的組成，下列敘述何者正確？", "opts": [["A", "由總統與行政、立法、司法、考試、監察五院組成"], ["B", "由總統與行政、立法、司法三院組成"], ["C", "由行政院統轄其餘四院，形成金字塔式組織"], ["D", "由立法院與行政院共同組成，其餘機關屬地方政府"]], "ans": "A", "exp": "我國中央政府採「一府五院」的架構，由總統（總統府）與行政院、立法院、司法院、考試院、監察院共同組成，這是我國有別於多數民主國家「三權分立」的特色。五院彼此獨立、互相制衡，並非由行政院統轄。"}, {"stem": "我國憲法規定法官為終身職；憲法增修條文也規定，司法院提出的年度司法概算，行政院不得刪減，僅得加註意見後編入中央政府總預算案。這些設計最主要的目的為何？", "opts": [["A", "讓司法院的預算不必經立法院審查"], ["B", "讓法官可以自行決定自己的薪資待遇"], ["C", "使司法院成為地位最高的行政機關"], ["D", "維持司法權的獨立，避免受到其他權力干涉"]], "ans": "D", "exp": "司法權必須公正裁判，若行政院能任意刪減司法預算、或法官職位隨時可被撤換，司法就容易受到干涉。因此以「法官終身職」與「司法概算不得刪減」來保障司法獨立，人民的權利受公權力侵害時才能獲得真正的保護。司法概算仍須送立法院審議，故 (A) 錯誤。"}, {"stem": "關於我國總統的產生方式與任期，下列敘述何者正確？", "opts": [["A", "由立法委員互選產生，任期四年"], ["B", "由人民直接選舉產生，任期四年，連選得連任一次"], ["C", "由人民直接選舉產生，任期六年，得無限次連任"], ["D", "由行政院院長提請立法院同意後任命"]], "ans": "B", "exp": "總統為國家元首，由人民直接選舉產生，任期四年，「連選得連任一次」，也就是最多連續擔任兩任八年。立法委員雖也是任期四年，但「連選得連任」沒有次數限制，兩者要分清楚。"}, {"stem": "「對外代表中華民國、統率全國陸海空三軍」，這是我國哪一個職位所具備的身分與職權？", "opts": [["A", "總統"], ["B", "行政院院長"], ["C", "國防部部長"], ["D", "立法院院長"]], "ans": "A", "exp": "總統是國家元首，對外代表中華民國，並以「三軍統帥」的身分統率全國陸海空軍。國防部部長只是行政院轄下部會首長，須聽從指揮並向立法院負責，並非三軍統帥。"}, {"stem": "下列何者「不屬於」總統的職權？", "opts": [["A", "依法公布法律、發布命令"], ["B", "決定國家安全大政方針"], ["C", "提名司法院大法官"], ["D", "審查中央政府總預算"]], "ans": "D", "exp": "審查中央政府總預算是「立法院」代表人民監督政府經費的重要職權，並非總統的權力。總統的重要職權包括統率三軍、公布法律、發布命令與緊急命令、行使人事任命與提名權、決定國家安全大政方針等。"}, {"stem": "當國家遭遇緊急危難或財政經濟上重大變故時，總統要發布緊急命令，依課本所述須先經過下列何種程序？", "opts": [["A", "經立法院三讀通過"], ["B", "經行政院會議之決議"], ["C", "經憲法法庭裁判許可"], ["D", "經監察院調查同意"]], "ans": "B", "exp": "緊急命令的流程是：國家遭遇緊急危難或財政經濟重大變故 → 經行政院會議決議 → 總統發布緊急命令 → 十日內提交立法院追認。行政院會議的決議是發布前的必要程序，立法院則是在發布「之後」進行追認。"}, {"stem": "總統發布緊急命令後，須於十日內提交立法院追認。若立法院不予追認，該緊急命令的效力如何？", "opts": [["A", "由總統再發布一次即可繼續生效"], ["B", "交由憲法法庭裁決是否有效"], ["C", "立即失效"], ["D", "仍然有效，但須修改部分內容"]], "ans": "C", "exp": "依緊急命令流程圖，十日內提交立法院追認通過者，緊急命令有效；未獲追認者，緊急命令「立即失效」。這是防止總統藉緊急狀態擴權的重要設計。"}, {"stem": "總統所發布的緊急命令必須送請立法院追認，這項設計最能表現下列何種精神？", "opts": [["A", "以立法權制衡行政權，防止行政權在緊急狀態下濫用"], ["B", "總統必須向監察院負責"], ["C", "立法院可以代替總統決定國家安全大政方針"], ["D", "緊急狀態下政府的權力不受任何限制"]], "ans": "A", "exp": "緊急狀態下權力容易高度集中於行政部門，若沒有制衡機制，就可能導致濫權。由具民意基礎的立法院進行追認，等於是用立法權替人民把關，維持行政權與立法權的平衡。"}, {"stem": "依憲法規定，我國的「最高行政機關」是下列何者？", "opts": [["A", "總統府"], ["B", "國家安全會議"], ["C", "行政院"], ["D", "內政部"]], "ans": "C", "exp": "行政院是我國最高行政機關，負責依法規劃與執行政策、法律，並督導所屬機關施政。總統雖然也行使部分行政權，但總統府並非「最高行政機關」；內政部只是行政院下轄的部會之一。"}, {"stem": "關於行政院院長的產生方式，下列敘述何者正確？", "opts": [["A", "由人民直接選舉產生"], ["B", "由總統直接任命"], ["C", "由總統提名，經立法院同意後任命"], ["D", "由立法委員互選產生"]], "ans": "B", "exp": "行政院院長由總統「直接任命」，不需要經過立法院同意，這一點常與司法院、考試院、監察院的正副院長（須總統提名、立法院同意）混淆，要特別留意。"}, {"stem": "民國114年，體育署升格為「運動部」，成為行政院轄下的部會之一。依課本所述，運動部部長是如何產生的？", "opts": [["A", "由總統直接任命"], ["B", "由立法委員投票選出"], ["C", "由考試院考試及格後派任"], ["D", "由行政院院長提請總統任命"]], "ans": "D", "exp": "行政院的副院長及各部會首長，都是由行政院院長「提請總統任命」。運動部部長屬於部會首長，自然適用此規定。至於運動部的成立需要制定組織法，則由立法院審議三讀通過。"}, {"stem": "「政府推行免費英語自主檢測系統」、「規劃行人優先區並限制車速」、「發放各項生活補助」，這些工作最主要屬於下列何者的職權？", "opts": [["A", "立法院——制定與修改法律"], ["B", "監察院——糾正不當施政"], ["C", "行政院——規劃與執行全國性政策"], ["D", "考試院——選拔任用優秀人才"]], "ans": "C", "exp": "行政權是指組織與管理內政、外交、教育、交通等各方面行政事務的權力。題目所述都是「規劃並執行具體政策」的行為，屬於行政院及其所屬部會的職權範圍。"}, {"stem": "某項釋憲案中，「內政部」與「考選部」都表示了意見。這兩個機關分別隸屬於下列哪一個院？", "opts": [["A", "內政部：行政院；考選部：考試院"], ["B", "內政部：行政院；考選部：司法院"], ["C", "內政部：考試院；考選部：監察院"], ["D", "內政部：立法院；考選部：行政院"]], "ans": "A", "exp": "內政部是行政院十五部之一，掌理內政事務；考選部則是考試院下設的機關，掌理公務人員考試與專門職業及技術人員考試。名稱相近的部會要對應到正確的院。"}, {"stem": "依憲法規定，行政院必須向下列哪一個機關負責，並接受其監督？", "opts": [["A", "總統府"], ["B", "監察院"], ["C", "司法院"], ["D", "立法院"]], "ans": "D", "exp": "行政院依法對「立法院」負責。具體表現為：行政院須向立法院提出施政方針及施政報告，行政院院長及各部會首長須接受立法委員質詢，行政院編列的預算也須經立法院審查通過。"}, {"stem": "關於立法委員的產生方式與任期，下列敘述何者正確？", "opts": [["A", "由總統提名，經人民投票同意後任命"], ["B", "由人民選舉產生，任期四年，連選得連任"], ["C", "由人民選舉產生，任期六年，連選得連任一次"], ["D", "由行政院院長提請總統任命"]], "ans": "B", "exp": "立法委員是中央民意代表，由人民選舉投票產生，任期四年，「連選得連任」且無連任次數的限制，這與總統「連選得連任一次」不同。"}, {"stem": "立法院院長、副院長是如何產生的？", "opts": [["A", "由立法委員互選產生"], ["B", "由總統直接任命"], ["C", "由總統提名，經立法委員同意後任命"], ["D", "由人民直接選舉產生"]], "ans": "A", "exp": "立法院院長、副院長由立法委員「互選」產生。這與行政院院長（總統直接任命）、司法院／考試院／監察院正副院長（總統提名、立法院同意）都不同，是常見的比較題型。"}, {"stem": "下列何者「不是」立法院的職權？", "opts": [["A", "制定法律"], ["B", "審查中央政府總預算"], ["C", "審判各種訴訟案件"], ["D", "質詢行政院官員"]], "ans": "C", "exp": "審判各種訴訟案件屬於司法院所設各級法院的職權，是司法權而非立法權。立法院的職權包括制定法律、審查總預算、質詢政府官員、行使人事同意權、提出不信任案與各項提案權等。"}, {"stem": "司法院、考試院、監察院的重要人員由總統提名後，還必須經立法院同意才能任命。這項設計的主要意義為何？", "opts": [["A", "讓總統可以藉此控制這三院的運作"], ["B", "使非民選產生的官員仍須經由具民意基礎的機關把關"], ["C", "讓立法院可以直接任命這三院的官員"], ["D", "避免這三院提出違反憲法的法律案"]], "ans": "B", "exp": "三院的重要人員並非透過考試或選舉產生，若僅由總統一人決定，容易產生濫用私人的疑慮。透過具有民意基礎的立法院行使同意權加以把關，正是「以立法權制衡行政權」的展現。"}, {"stem": "依課本所述，立法院提出「憲法修正案」與「領土變更案」後，必須再經過下列何種程序才能通過？", "opts": [["A", "由憲法法庭裁判是否合憲"], ["B", "由總統公布後即刻生效"], ["C", "由監察院進行審查"], ["D", "交由選舉人投票複決"]], "ans": "D", "exp": "憲法修正案與領土變更案都由立法院提出，但因事關重大，必須再交由「選舉人投票複決」通過，直接由人民作最後決定，展現主權在民的精神。也因為門檻高，修憲並不容易。"}, {"stem": "立法院提出的「總統、副總統罷免案」與「總統、副總統彈劾案」，兩者後續的決議方式有何差別？", "opts": [["A", "罷免案交憲法法庭審理，彈劾案交選舉人投票"], ["B", "兩者都交由選舉人投票決定"], ["C", "罷免案交由選舉人投票罷免，彈劾案交由憲法法庭審理"], ["D", "兩者都交由大法官組成的憲法法庭審理"]], "ans": "C", "exp": "依立法院各項提案權與決議方式：罷免案由選舉人投票罷免（政治責任，由人民決定去留）；彈劾案則交由大法官組成的憲法法庭審理（法律責任，由司法權判斷）。兩者容易混淆，須分辨清楚。"}, {"stem": "我國最高司法機關為何？其院長、副院長與大法官如何產生？", "opts": [["A", "司法院；由總統提名，經立法院同意後任命"], ["B", "最高法院；由總統直接任命"], ["C", "司法院；由人民直接選舉產生"], ["D", "憲法法庭；由立法委員互選產生"]], "ans": "A", "exp": "司法院是我國最高司法機關，院長、副院長與大法官皆由總統提名，經立法院同意後任命。最高法院是各級法院中的終審法院，憲法法庭則是由大法官組成的審理機制，兩者都不是「最高司法機關」。"}, {"stem": "下列關於司法院所屬機關與其職權的配對，何者正確？", "opts": [["A", "各級法院——解釋憲法"], ["B", "憲法法庭——懲戒違法失職的公務人員"], ["C", "懲戒法院——審理政黨違憲的解散案"], ["D", "各級法院——審判各種訴訟案件"]], "ans": "D", "exp": "司法院的三大職權可分為：審判權（各級法院審判各種訴訟案件）、懲戒權（懲戒法院掌理公務人員懲戒）、解釋權（憲法法庭解釋憲法、統一解釋法律及命令、審理總統副總統彈劾案與政黨違憲解散案）。"}, {"stem": "全國公務人員違法失職時，其「懲戒」事務由下列哪一個機關掌理？", "opts": [["A", "監察院"], ["B", "司法院懲戒法院"], ["C", "考試院銓敘部"], ["D", "行政院人事行政總處"]], "ans": "B", "exp": "監察院負責「提出彈劾」，是追究責任的發動者；真正的「議處、懲戒」則交由司法院所設的懲戒法院依法審判。彈劾與懲戒分屬不同機關，正是分權制衡的展現。"}, {"stem": "下列何者「不屬於」大法官組成之憲法法庭的職權？", "opts": [["A", "解釋憲法"], ["B", "統一解釋法律及命令"], ["C", "審理一般民眾之間的財產糾紛"], ["D", "審理政黨違憲的解散案件"]], "ans": "C", "exp": "一般民眾之間的民事財產糾紛，由各級法院依訴訟程序審判，不屬於憲法法庭。憲法法庭處理的是憲法層次的重大爭議：解釋憲法、統一解釋法律及命令、審理總統副總統彈劾案、審理政黨違憲解散案等。"}, {"stem": "民國113年，立法院通過立法院職權行使法部分條文修正案，部分立法委員認為其內容違反權力分立原則而聲請審查。依現行制度，此案應由下列何者審理並作成裁判？", "opts": [["A", "大法官組成的憲法法庭"], ["B", "最高法院刑事庭"], ["C", "監察院彈劾審查會"], ["D", "行政院法規委員會"]], "ans": "A", "exp": "法律是否違反憲法，屬於憲法爭議，由司法院大法官組成的憲法法庭審查並以裁判方式宣告。該案經審查後認為部分內容違反權力分立原則，因而裁判違憲。"}, {"stem": "憲法訴訟法施行後，過去以「大法官會議」議決的釋憲方式，已改為下列何種方式進行？", "opts": [["A", "由立法院院會表決通過"], ["B", "由憲法法庭以裁判方式進行，且參與的大法官須公開其立場"], ["C", "由總統召開國是會議共同決定"], ["D", "由監察院調查後作成決定"]], "ans": "B", "exp": "舊制以「大法官會議」議決，過程中只記錄出席大法官的名字，看不出每位大法官的立場；憲法訴訟法改採「憲法法庭」裁判方式，並要求參與的大法官必須公開立場，以達公開透明並落實司法權的本質。"}, {"stem": "憲法訴訟法將立法委員提案聲請釋憲的門檻，由原本的三分之一降為四分之一，其主要目的為何？", "opts": [["A", "提高釋憲案通過的難度"], ["B", "讓行政院更容易聲請釋憲"], ["C", "使大法官能夠主動提出釋憲案"], ["D", "保障席次較少政黨聲請釋憲的權益"]], "ans": "D", "exp": "門檻降低後，席次較少的政黨也有機會湊足人數提案釋憲，使少數意見有管道進入憲法審查程序，是保障少數的設計。要注意「提案門檻」的降低，與「通過門檻」的規定是兩回事。"}, {"stem": "我國最高考試機關為考試院，其院長、副院長與考試委員的產生方式為何？", "opts": [["A", "由總統提名，經立法院同意後任命"], ["B", "由人民直接選舉產生"], ["C", "由行政院院長提請總統任命"], ["D", "由考試及格的公務人員互選產生"]], "ans": "A", "exp": "考試院院長、副院長與考試委員，和司法院、監察院的重要人員一樣，都是由總統提名、經立法院同意後任命，藉由立法院的人事同意權加以制衡。"}, {"stem": "小華的姊姊想報考公務人員高等考試，也想了解會計師等專門職業考試的資訊。她應該關注下列哪一個機關辦理的考試？", "opts": [["A", "監察院審計部"], ["B", "行政院人事行政總處"], ["C", "考試院考選部"], ["D", "司法院懲戒法院"]], "ans": "C", "exp": "考試院下設考選部，掌理公務人員考試以及專門職業及技術人員（如會計師、律師）考試。透過公開的國家考試選才，可以避免政府機關用人時濫用私人。"}, {"stem": "公務人員的銓敘、撫卹與退休等事項，由下列哪一個機關掌理？", "opts": [["A", "考選部"], ["B", "內政部"], ["C", "審計部"], ["D", "銓敘部"]], "ans": "D", "exp": "考試院下設兩大機關：考選部掌理各類國家考試；銓敘部則掌理公務人員的銓敘（審查、審定資格條件與等級俸給）、撫卹、退休與任免等事宜。"}, {"stem": "依孫文的主張，我國之所以將「考試權」從行政權中獨立出來、另設考試院，最主要的理由為何？", "opts": [["A", "避免立法機關形成國會專制"], ["B", "避免行政機關用人時濫用私人"], ["C", "避免司法機關的審判受到干涉"], ["D", "避免監察院的權力過於龐大"]], "ans": "B", "exp": "孫文認為，三權分立下行政機關掌有考試權，容易任用私人；立法機關掌有監察權，則會造成國會專制。因此主張把考試權與監察權獨立出來，設考試院與監察院，形成我國的五權分立體制。選項 (A) 是「監察權」獨立出來的理由。"}, {"stem": "我國最高監察機關為監察院。下列人員中，何者「不是」由總統提名、經立法院同意後任命？", "opts": [["A", "監察院院長"], ["B", "監察委員"], ["C", "監察院所屬的一般公務人員"], ["D", "審計長"]], "ans": "C", "exp": "監察院院長、副院長、監察委員與審計長皆由總統提名、經立法院同意後任命。至於各院內的一般公務人員，須經考試院舉辦的國家考試及格後才能任用，兩者產生方式完全不同。"}, {"stem": "監察院對「違法失職的公務人員」提出彈劾案並通過後，應移送下列何機關審理議處？", "opts": [["A", "司法院懲戒法院"], ["B", "大法官組成的憲法法庭"], ["C", "立法院"], ["D", "行政院"]], "ans": "A", "exp": "一般公務人員的彈劾案由監察院提出，交由司法院懲戒法院審理議處；總統、副總統的彈劾案則是由立法院提出，交由憲法法庭審理。提案機關與審理機關都不同，要分清楚。"}, {"stem": "某項道路工程規劃不當，屢遭民眾投訴。監察院認為該行政機關施政不當，要求其檢討改善。監察院此時提出的是下列何者？", "opts": [["A", "彈劾案"], ["B", "糾正案"], ["C", "不信任案"], ["D", "覆議案"]], "ans": "B", "exp": "監察院的三項權力中，彈劾與糾舉是對「人」（公務人員），糾正則是對「事」，針對行政院及其所屬機關的不當施政提出，要求改善。不信任案是立法院對行政院院長提出，覆議則由行政院提出，兩者都與監察院無關。"}, {"stem": "監察院提出「糾舉案」後，案件成立的受理機關為下列何者？", "opts": [["A", "大法官組成的憲法法庭"], ["B", "立法院"], ["C", "司法院懲戒法院"], ["D", "被糾舉人的主管或上級長官"]], "ans": "D", "exp": "依監察院各項職權比較：彈劾案的受理機關為司法院懲戒法院；糾舉案的受理機關為被糾舉人的主管或上級長官；糾正案則向行政院或有關部會提出。三者受理機關各不相同。"}, {"stem": "下列何者「不屬於」監察院彈劾、糾舉的對象？", "opts": [["A", "總統、副總統與民意代表"], ["B", "中央政府機關的公務人員"], ["C", "地方政府機關的公務人員"], ["D", "行政院各部會的職員"]], "ans": "A", "exp": "監察院彈劾、糾舉的對象是中央及地方的公務人員，但「不包含總統、副總統及民意代表」。因為總統、副總統與民意代表都由人民選舉產生，其責任應由人民或立法院（提出彈劾案）來追究，落實主權在民的精神。"}, {"stem": "政府各機關年度決算的審核工作，由下列哪一個單位負責？", "opts": [["A", "立法院預算中心"], ["B", "行政院主計總處"], ["C", "監察院審計部"], ["D", "考試院銓敘部"]], "ans": "C", "exp": "預算由行政院編列、立法院審查；年度結束後行政院編製總決算，送交監察院所屬的審計部行使審計權、審核決算。監察權的核心之一就是監督政府經費的運用。"}, {"stem": "行政院認為立法院決議通過的法律案窒礙難行時，得經下列何者核可後，移請立法院覆議？", "opts": [["A", "立法院院長"], ["B", "總統"], ["C", "憲法法庭"], ["D", "監察院"]], "ans": "B", "exp": "覆議的流程是：立法院通過法案送行政院執行 → 行政院認為窒礙難行 → 呈請總統核可 → 移請立法院覆議。總統的核可是提出覆議前的必要程序。"}, {"stem": "下列何者「不是」行政院可以提出覆議的標的？", "opts": [["A", "法律案"], ["B", "預算案"], ["C", "條約案"], ["D", "總統、副總統彈劾案"]], "ans": "D", "exp": "行政院負責執行立法院決議的「法律案、預算案、條約案」，若認為窒礙難行才得提出覆議。總統、副總統彈劾案是立法院提出後交由憲法法庭審理，與行政院執行政策無關，自然不是覆議的標的。"}, {"stem": "立法院對行政院提出的覆議案進行表決，結果決議維持原案。此時行政院院長應如何處理？", "opts": [["A", "提出辭職以示負責"], ["B", "呈請總統解散立法院"], ["C", "接受該決議"], ["D", "再向立法院提出一次覆議"]], "ans": "C", "exp": "覆議時如經立法院決議維持原案，行政院院長「應接受該決議」，也就是必須依原案執行。行政院院長辭職與呈請總統解散立法院，是「不信任案通過」後的效果，不可混淆。"}, {"stem": "若立法院對行政院移請的覆議案逾期未議決，會產生下列何種結果？", "opts": [["A", "原決議失效"], ["B", "原決議自動維持並須立即執行"], ["C", "行政院院長應立即提出辭職"], ["D", "交由憲法法庭裁決應否執行"]], "ans": "A", "exp": "覆議時如經決議維持原案，行政院院長應接受；若遭否決或逾期未議決，則「原決議失效」，行政院便不必執行該案。這是讓行政權得以對抗立法權的一項制衡工具。"}, {"stem": "立法院對行政院的整體施政表現非常不滿意時，得對行政院院長提出下列何種提案？", "opts": [["A", "彈劾案"], ["B", "糾正案"], ["C", "覆議案"], ["D", "不信任案"]], "ans": "D", "exp": "不信任案是立法院對行政院院長提出的重要制衡手段。彈劾、糾正是監察院的職權，覆議則是行政院針對立法院決議所提出，方向剛好相反。"}, {"stem": "不信任案經立法院通過後，行政院院長依法應如何處理？", "opts": [["A", "僅須到立法院提出檢討報告即可"], ["B", "應提出辭職，並得同時呈請總統解散立法院"], ["C", "應交由憲法法庭審理該案是否違憲"], ["D", "應請監察院對自己進行調查"]], "ans": "B", "exp": "不信任案通過後，行政院院長應提出辭職以示負責，並「得同時呈請總統解散立法院」，立法委員須重新改選。這項設計可避免立法院濫用不信任案，因為解散後立委也要面對選民的重新檢驗。"}, {"stem": "若立法院提出的不信任案表決未獲通過，依規定會產生下列何種效果？", "opts": [["A", "一年內不得對同一位行政院院長再提不信任案"], ["B", "立法院須立即解散並重新改選"], ["C", "行政院院長仍須提出辭職"], ["D", "總統須立即重新任命行政院院長"]], "ans": "A", "exp": "不信任案若未通過，一年內不得對「同一位」行政院院長再次提出，目的是避免立法院反覆提案、癱瘓行政運作，維持政局的穩定。"}, {"stem": "行政院院長及各部會首長到立法院接受立法委員的詢問，並負有答復的義務。這項制度稱為什麼？", "opts": [["A", "覆議"], ["B", "彈劾"], ["C", "質詢"], ["D", "糾正"]], "ans": "C", "exp": "立法委員在開會時，有向行政院院長及各部會首長「質詢」之權，被質詢人有答復的義務。這是立法院代表人民監督行政機關最直接的方式之一。"}, {"stem": "「立法院代表人民監督政府，因此行政院有向立法院提出施政方針及施政報告之責。」這段話最能說明下列何種關係？", "opts": [["A", "立法院必須向行政院負責"], ["B", "行政院必須向立法院負責"], ["C", "行政院與立法院互不隸屬，也互不監督"], ["D", "總統必須向立法院負責，並接受立委質詢"]], "ans": "B", "exp": "行政院依法對立法院負責，具體表現在提出施政方針與施政報告、接受質詢、預算須經審查等。總統則不對立法院負責，也不是質詢的對象（總統僅定期至立法院進行國情報告）。"}, {"stem": "關於中央政府預算與決算的流程，下列排列何者正確？\n甲、立法院審查預算　乙、行政院編列預算　丙、監察院審計部審核決算　丁、各機關執行預算", "opts": [["A", "甲→乙→丁→丙"], ["B", "乙→丙→甲→丁"], ["C", "丁→乙→甲→丙"], ["D", "乙→甲→丁→丙"]], "ans": "D", "exp": "正確順序為：行政院編列預算 → 立法院審查預算 → 各機關執行預算 → 年度終了做成決算 → 監察院審計部審核決算 → 再送審核報告審議。行政、立法、監察三權在經費上分工把關。"}, {"stem": "各院的預算都必須經立法院審查通過後才能動用，這項規定最能展現下列何種意義？", "opts": [["A", "以立法權監督各機關的經費運用"], ["B", "立法院可以直接指揮各院的日常施政"], ["C", "各院都必須向監察院負責"], ["D", "行政院可以自行決定其他各院的預算多寡"]], "ans": "A", "exp": "立法院掌握「錢袋子」，透過審查預算監督各機關經費是否合理運用，是立法權制衡其他權力的重要方式。但審查預算不等於可以指揮各院施政，各院在職權範圍內仍保持獨立。"}, {"stem": "五院內的公務人員須先經考試院的考試才能任用；若違法失職，則由監察院提出彈劾，再交由司法院懲戒法院議處。這樣的安排最能說明下列何者？", "opts": [["A", "考試院可以直接懲戒違法失職的公務人員"], ["B", "監察院同時擁有彈劾權與審判權"], ["C", "中央政府各院之間既分工合作又相互制衡"], ["D", "公務人員完全不受任何機關的監督"]], "ans": "C", "exp": "選才由考試院、追究責任由監察院、最終議處由司法院，同一件事拆給三個機關分別掌理，既避免任何一院獨大，又能達到澄清吏治的效果，正是五權分立、分權制衡精神的具體展現。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "關於「行政法」的敘述，下列何者正確？", "opts": [["A", "行政法是一部由立法院制定、名稱就叫「行政法」的單一法典"], ["B", "行政法泛指一切規範國家行政機關如何行使職權及運作的法令總稱"], ["C", "行政法只規範公務員的品德操守，與一般人民的生活無關"], ["D", "行政法的效力位階高於憲法"]], "ans": "B", "exp": "課本明確指出，行政法「並非一部單獨的法典」，而是泛指一切規範國家行政機關如何行使職權及運作的法令總稱，例如戶籍法、國民教育法、全民健康保險法等都屬於行政法。"}, {"stem": "下列法律中，何者「不屬於」行政法的範疇？", "opts": [["A", "全民健康保險法"], ["B", "道路交通管理處罰條例"], ["C", "國民教育法"], ["D", "民法"]], "ans": "D", "exp": "行政法規範的是「國家行政機關」如何行使職權，以及國家與人民之間的關係；民法規範的則是人民與人民之間的私人關係（如契約、侵權行為），並不屬於行政法。"}, {"stem": "課本提到「行政法是憲法的具體化」、「行政法是活生生的憲法」，這兩句話最主要在說明什麼？", "opts": [["A", "憲法的規定較為抽象、只作原則性規範，必須靠行政法把人民的權利義務與機關職權具體落實"], ["B", "行政法可以隨時修改憲法的內容"], ["C", "憲法必須經過行政法承認之後才會發生效力"], ["D", "有了行政法之後，國家就不再需要憲法"]], "ans": "A", "exp": "憲法只作原則性規定、內容抽象，必須透過行政法明確規範人民的權利義務與行政機關的職權運作，才能把憲法對人權的保障真正落實在生活中。"}, {"stem": "我國憲法第61條規定「行政院之組織，以法律定之」，因此國家制定了《行政院組織法》。這個例子最能說明下列何種概念？", "opts": [["A", "憲法具有最高性，任何法律不得牴觸"], ["B", "行政權與立法權必須互相制衡"], ["C", "行政法將憲法的抽象規定加以具體落實"], ["D", "地方政府可以自行決定組織架構"]], "ans": "C", "exp": "憲法只寫「以法律定之」，並未規定行政院究竟有哪些部會，必須由《行政院組織法》這部行政法把它規定清楚，正是「行政法具體落實憲法抽象規定」的典型例子。"}, {"stem": "小禾出生後，爸媽帶著她到戶政事務所辦理出生登記。這項辦理的法律依據，以及該法律所屬的範疇為何？", "opts": [["A", "民法／私法"], ["B", "戶籍法／行政法"], ["C", "刑法／刑事法"], ["D", "憲法／私法"]], "ans": "B", "exp": "辦理出生登記依據的是戶籍法等戶政法規，屬於規範行政機關（戶政事務所）職權運作的行政法。"}, {"stem": "關於行政法與人民生活關係的敘述，下列何者最適當？", "opts": [["A", "從出生登記、接受國民教育、參加全民健保到申請長期照顧，人的一生各種生活面向都受行政法規範"], ["B", "行政法只有在人民犯罪被起訴時才會適用"], ["C", "行政法只規範成年人，未成年人完全不受行政法規範"], ["D", "行政法只用來處理人民與人民之間的私人糾紛"]], "ans": "A", "exp": "課本以「一個人從出生到死亡」為主軸說明：嬰兒出生依戶政法規登記、國民依健保法規投保、6歲以上兒童依教育法規就學、年長者依長照法規申請照顧，可見行政法與生活息息相關。"}, {"stem": "小美搭捷運時肚子餓想吃點心，哥哥提醒她：「大眾捷運法規定車廂內不能飲食喔！」這項規定的性質屬於下列何者？", "opts": [["A", "民法上人民之間的契約約定"], ["B", "刑法上的犯罪構成要件"], ["C", "憲法明文列舉的人民義務"], ["D", "行政法對人民行為的規範"]], "ans": "D", "exp": "大眾捷運法是規範大眾運輸行政管理的法律，屬於行政法；違反車廂內禁止飲食的規定，將由主管機關處以罰鍰，屬於行政責任而非刑事責任。"}, {"stem": "下列哪一項「不是」行政法所規範的內容？", "opts": [["A", "行政院設有哪些部會的組織架構"], ["B", "行政機關核發駕駛執照的條件與程序"], ["C", "夫妻離婚後剩餘財產應如何分配"], ["D", "國民應接受國民義務教育的年齡"]], "ans": "C", "exp": "(A)(B)(D) 分別由行政院組織法、道路交通安全規則、國民教育法等行政法規範；夫妻離婚後的財產分配屬於民法親屬編的私人關係，不是行政法的範疇。"}, {"stem": "所謂「依法行政」，其最主要的意思是什麼？", "opts": [["A", "行政機關行使職權必須有法律授權，且不得牴觸現有法律"], ["B", "人民必須無條件服從行政機關的一切命令"], ["C", "行政機關可以依需要自行制定憲法"], ["D", "立法院立法時必須完全聽從行政院的意見"]], "ans": "A", "exp": "依法行政是指行政機關在行使職權時必須有法律的依據與授權，而且不得違反現有法律規範，目的在防止政府濫權、侵害人民權利。"}, {"stem": "課本說明「政府必須依法行政」，其最主要的理由為何？", "opts": [["A", "因為行政機關的公務員普遍不夠專業"], ["B", "因為行政機關的作為對人民權利影響重大，若施政或執法不當就可能侵害人民權利"], ["C", "因為人民有依法納稅的義務"], ["D", "因為行政機關與立法機關必須互相監督"]], "ans": "B", "exp": "課本指出「由於行政機關的作為對人民權利影響重大，若施政或執法不當，就可能會侵害人民權利。因此，行政機關必須依法行政才能確實保障人民的權益」。"}, {"stem": "道路交通管理處罰條例對紅線違規停車訂有一定的罰鍰金額範圍，警察執法開單時不可以超過這個範圍。這樣的設計最能展現下列何種原則？", "opts": [["A", "罪刑法定原則"], ["B", "無罪推定原則"], ["C", "契約自由原則"], ["D", "依法行政原則"]], "ans": "D", "exp": "法律事先訂好罰鍰的上下限，警察只能在此範圍內裁罰，正是為了避免行政機關恣意處罰、不當侵犯人民財產權，這就是依法行政的具體展現。"}, {"stem": "如果行政機關行使公權力時完全不受法律約束，最可能造成下列何種結果？", "opts": [["A", "人民的權利可以獲得更完整的保障"], ["B", "行政效率大幅降低，人民無法辦理任何事務"], ["C", "行政機關容易出現濫權，侵害人民權利"], ["D", "憲法會自動失去效力"]], "ans": "C", "exp": "課本指出，如果政府行使權力缺乏有效約束，容易出現濫權、侵害人民權利的情形，因此國家才要制定行政法要求行政機關依法行政。"}, {"stem": "下列哪一項作法「不符合」依法行政原則？", "opts": [["A", "警察依社會秩序維護法，對深夜製造噪音妨害安寧者處以罰鍰"], ["B", "衛生局人員覺得某餐廳「看起來不太衛生」，未依任何法規逕行命令其停業"], ["C", "監理機關依規定，核發給通過機車駕照考試者機車駕照"], ["D", "學校依國民教育法通知學區內年滿6歲的兒童辦理入學"]], "ans": "B", "exp": "依法行政要求行政機關的作為必須有法律依據。(B) 僅憑承辦人員主觀感覺就作出停業處分，沒有法律授權與具體事實依據，違反依法行政原則。"}, {"stem": "我國憲法規定人民有服兵役的義務，但服役的年限、資格等細節則由兵役法加以規定。這個例子說明了什麼？", "opts": [["A", "憲法只作原則性規定，必須由行政法具體規範，才能落實對人民權利的保障"], ["B", "兵役法的效力高於憲法"], ["C", "服兵役屬於民法上的義務"], ["D", "憲法的規定可以被行政法完全排除"]], "ans": "A", "exp": "憲法對人民義務只作原則性宣示，內容抽象；必須透過兵役法這類行政法把年限、資格等規定清楚，人民的權利義務才明確，這就是「行政法是憲法的具體化」。"}, {"stem": "關於「行政管制」的敘述，下列何者最正確？", "opts": [["A", "是人民之間互相約定共同遵守的生活規則"], ["B", "是法院對犯罪者所作成的有罪判決"], ["C", "行政機關為維護社會秩序、增進公共利益，依法要求或限制人民從事某種行為"], ["D", "是人民針對政府違法行為向國家提出的救濟"]], "ans": "C", "exp": "行政管制是行政機關基於增進公共利益或維護社會秩序，運用公權力要求或限制人民從事某種行為，並制訂各種行政規定，例如設置交通號誌、公告垃圾車收運時間等。"}, {"stem": "行政管制雖然會限制部分人民的權利，但課本認為它同時具有什麼作用？", "opts": [["A", "大幅增加政府的稅收"], ["B", "減輕法院審理案件的負擔"], ["C", "使行政機關能擁有不受限制的權力"], ["D", "保障更多人的權利不受侵害"]], "ans": "D", "exp": "課本強調「行政管制雖然會限制部分人民權利，但同時也保障更多人的權利不受侵害」，例如禁止在危險溪流戲水，限制了少數人的行動自由，卻保障了公共安全。"}, {"stem": "下列何者屬於「行政管制」？", "opts": [["A", "颱風來襲時，政府禁止民眾前往海邊沙灘"], ["B", "法院判決竊盜者有期徒刑6個月"], ["C", "房東與房客簽訂房屋租賃契約"], ["D", "立法院三讀通過菸害防制法修正案"]], "ans": "A", "exp": "政府為防止危害發生、維護民眾生命安全，事前限制人民前往危險區域，屬於典型的行政管制。(B) 是刑罰，(C) 是民事契約，(D) 是立法行為。"}, {"stem": "建築法規禁止人民擅自額外加蓋建物。這項規定的性質與主要目的為何？", "opts": [["A", "屬於行政救濟／使人民能向政府請求賠償"], ["B", "屬於行政管制／避免影響居住的公共安全"], ["C", "屬於行政處分／對特定人民直接發生法律效果"], ["D", "屬於刑罰／處罰違反建築法的犯罪人"]], "ans": "B", "exp": "建築管制是行政機關為維護公共安全，事前普遍限制人民興建行為的行政管制。若某屋主真的違法加蓋，政府後續發出的「拆除通知單」才是針對特定人的行政處分。"}, {"stem": "政府在沒有實體人行道的路段，設置「標線型人行道」專供行人通行。此一作為的性質與目的為何？", "opts": [["A", "屬於行政罰，用來處罰不守規矩的駕駛人"], ["B", "屬於行政救濟，補償行人所受到的損失"], ["C", "屬於行政管制，維護行人安全與道路使用權"], ["D", "屬於民事契約，政府與行人約定通行方式"]], "ans": "C", "exp": "劃設標線型人行道是政府為維護行人安全與道路使用權，事前規範用路人行為的交通管制措施，屬於行政管制。"}, {"stem": "關於「行政管制」與「行政處分」的比較，下列敘述何者正確？", "opts": [["A", "兩者都是由法院所作成"], ["B", "行政管制針對特定人，行政處分針對不特定多數人"], ["C", "行政處分一定對人民不利，行政管制一定對人民有利"], ["D", "行政管制普遍性地要求或限制人民行為，行政處分則是針對具體事件、對特定人民直接發生法律效果"]], "ans": "D", "exp": "行政管制（如設置紅綠燈、公告禁止事項）是對一般人普遍適用的規範；行政處分（如對某位闖紅燈者開單）則是針對具體事件、對特定人民發生法律效果。兩者都由行政機關作成，且行政處分有有利與不利兩種。"}, {"stem": "下列關於「行政處分」的敘述，何者正確？", "opts": [["A", "是行政機關針對具體事件所做的決定，對特定人民直接發生法律效果的行為"], ["B", "只能由法院作成，行政機關無權作成"], ["C", "內容一定是對人民不利的處罰"], ["D", "效力及於全國人民，一體適用"]], "ans": "A", "exp": "課本定義：行政處分是指行政機關針對具體事件所做的決定，而對特定人民直接發生法律效果的行為，內容可能對人民有利，也可能不利。"}, {"stem": "下列何者屬於「對人民有利」的行政處分？", "opts": [["A", "政府對違建屋主發出限期拆除通知單"], ["B", "警察對闖紅燈的駕駛人開立罰單"], ["C", "學校頒發畢業證書給符合畢業資格的學生"], ["D", "衛生局命令衛生不合格的餐飲廠商停止供餐"]], "ans": "C", "exp": "學校頒發畢業證書，是行政機關（學校）針對特定學生所做的決定，授予其學歷證明，屬於對人民有利的行政處分。其餘三者皆為不利處分。"}, {"stem": "下列何者屬於「對人民不利」的行政處分？", "opts": [["A", "監理機關核發機車駕駛執照給通過考試者"], ["B", "秀英在服飾攤位改賣食品與申請項目不符，政府撤銷其營業許可"], ["C", "政府依規定發放育兒津貼給申請的家庭"], ["D", "政府核發醫師資格證書與執業執照"]], "ans": "B", "exp": "撤銷營業許可使人民喪失原本享有的權利，屬於不利處分。(A)(C)(D) 都是授予人民利益或資格的有利處分。"}, {"stem": "小義通過考試申請後，政府發給他醫師資格證書與執業執照；威力違規停車阻礙通行，警察將他的車拖吊。關於這兩件事的敘述，下列何者最正確？", "opts": [["A", "兩者都是行政管制"], ["B", "前者是行政處分，後者是刑罰"], ["C", "前者是行政罰，後者是行政處分"], ["D", "兩者都是行政處分，前者為有利處分、後者為不利處分"]], "ans": "D", "exp": "兩者都是行政機關針對具體事件、對特定人民作成並直接發生法律效果的決定，所以都是行政處分；差別在於一個給予利益、一個造成不利益。"}, {"stem": "當人民違反行政法規定，行政機關對其施以行政罰時，人民所要負擔的責任稱為什麼？", "opts": [["A", "行政責任"], ["B", "刑事責任"], ["C", "民事責任"], ["D", "政治責任"]], "ans": "A", "exp": "課本指出，人民違反行政法規定時，政府可對人民施以行政罰，要求負擔相關的「行政責任」，包括罰鍰、拘留、吊銷證照、停止營業、勒令歇業等。"}, {"stem": "下列何者「不屬於」行政罰？", "opts": [["A", "罰鍰"], ["B", "有期徒刑"], ["C", "吊銷證照"], ["D", "勒令歇業"]], "ans": "B", "exp": "行政罰的種類包括罰鍰、拘留、吊銷證照、停止營業、勒令歇業、強制拆除、公布姓名等；有期徒刑是刑法規定的刑罰，須由法院判決，不是行政罰。"}, {"stem": "關於「行政罰」與「行政處分」兩者的關係，下列敘述何者正確？", "opts": [["A", "兩者性質完全無關，不會同時出現"], ["B", "行政處分是行政罰的其中一種"], ["C", "行政罰是一種對人民不利的行政處分"], ["D", "行政罰由法院作成，行政處分由行政機關作成"]], "ans": "C", "exp": "行政處分包含有利與不利兩類；當行政機關因人民違反行政法規而加以裁罰時，就是作成不利處分，也就是行政罰。因此行政罰屬於行政處分的一種。"}, {"stem": "關於「罰鍰」與「罰金」的比較，下列敘述何者正確？", "opts": [["A", "罰鍰處罰的是違反行政法規的行為，罰金處罰的是違反刑法的行為"], ["B", "罰鍰由法院判決科處，罰金由行政機關逕行裁處"], ["C", "兩者都會使當事人留下刑事紀錄"], ["D", "兩者都屬於刑罰的一種"]], "ans": "A", "exp": "罰鍰是違反行政法規所受的財產處罰，由行政機關依行政法規科處；罰金則是刑法規定的刑罰，須由法院判決。兩者名稱相似但性質完全不同，是段考常見的陷阱題。"}, {"stem": "小南在人行道上騎腳踏車被警察開單處以罰鍰，他很擔心自己會因此留下刑事紀錄。下列判斷何者正確？", "opts": [["A", "會，因為被警察處罰就等於觸犯刑法"], ["B", "會，因為罰鍰與罰金的性質完全相同"], ["C", "不會，因為罰鍰金額太小，不需要記錄"], ["D", "不會，因為罰鍰是違反行政法規所負的行政責任，並不是刑罰"]], "ans": "D", "exp": "罰鍰屬於行政罰，人民負的是行政責任，不會留下刑事紀錄；只有經法院判決確定的刑罰（如罰金、拘役、有期徒刑）才會留下刑事紀錄。"}, {"stem": "關於「拘留」與「拘役」的比較，下列敘述何者正確？", "opts": [["A", "兩者都是刑罰，只是拘束期間長短不同"], ["B", "兩者都會拘束人身自由，但拘留是行政罰、拘役是刑罰"], ["C", "拘留由法院判決，拘役由警察機關自行決定"], ["D", "拘留是財產上的處罰，拘役是人身自由的處罰"]], "ans": "B", "exp": "拘留與拘役的相同點是「都是對人身自由的拘束」；不同點在於拘留是針對違反行政法者的行政罰，由行政機關依法處分，拘役則是刑法規定、由法院判決的刑罰。"}, {"stem": "依課本所述，違反行政法規而受到「拘留」處分的人，會被留置在何處？", "opts": [["A", "監獄"], ["B", "看守所"], ["C", "警察機關的拘留室"], ["D", "少年觀護所"]], "ans": "C", "exp": "課本說明：拘留是針對違反行政法者，將其留置在警察機關拘留室的一種處罰，與刑法中的拘役須入監執行不同。"}, {"stem": "某娛樂場所噪音超過分貝上限，主管機關依噪音管制法按次處以罰鍰，限期未改善者得連續處罰至符合標準為止。此種處罰的性質為何？", "opts": [["A", "行政罰"], ["B", "刑罰"], ["C", "民事損害賠償"], ["D", "公務員懲戒處分"]], "ans": "A", "exp": "噪音管制法屬於行政法，主管機關依該法對違反管制標準者處以罰鍰，是行政機關對人民所作的不利處分，屬於行政罰。"}, {"stem": "菸害防制法規定，任何人不得供應菸品給未滿20歲的人，違反者最高可處新臺幣25萬元的罰鍰。關於這項規定，下列敘述何者正確？", "opts": [["A", "這是刑法上的規定，違反的業者會被判處有期徒刑"], ["B", "這是民法上的規定，業者負的是契約責任"], ["C", "業者若違反，須負刑事責任並留下前科紀錄"], ["D", "這是行政法上的規定，違反者須負行政責任"]], "ans": "D", "exp": "菸害防制法是為保護民眾健康而制定的行政法規，違規販售者由主管機關（如衛生局）處以罰鍰，屬於行政罰，業者負的是行政責任。"}, {"stem": "文化創意產業發展法規定：將藝文表演票券以超過票面金額販售者，按票券張數處以票面金額10至50倍的罰鍰；若以虛偽資料或其他不正當方式，利用電腦設備購買票券取得訂票憑證，則處3年以下有期徒刑，得併科罰金。依此判斷，小林自行設計電腦程式大量搶購演唱會門票，再高價轉售牟利，須負何種法律責任？", "opts": [["A", "只須負擔行政責任"], ["B", "須同時負擔行政責任與刑事責任"], ["C", "只須負擔民事責任"], ["D", "不須負擔任何法律責任"]], "ans": "B", "exp": "小林「以電腦程式不正當方式購票」的部分依法可處有期徒刑或罰金，屬刑事責任；「超過票面金額轉售」的部分則被處以罰鍰，屬行政責任。同一連串行為可能同時產生多種法律責任。"}, {"stem": "關於「行政罰」與「刑罰」的比較，下列敘述何者正確？", "opts": [["A", "行政罰由法院科處，刑罰由行政機關科處"], ["B", "行政罰只能處罰公務員，刑罰只能處罰一般人民"], ["C", "行政罰由行政機關依行政法規科處，刑罰由法院依刑法判決"], ["D", "行政罰的處罰種類只有罰鍰一種"]], "ans": "C", "exp": "這是本課最重要的比較：行政罰處罰違反行政法規的行為，由行政機關科處，種類有罰鍰、拘留、吊銷證照等；刑罰處罰犯罪行為，須由法院依刑法判決，種類有死刑、無期徒刑、有期徒刑、拘役、罰金等。"}, {"stem": "政府修法規定，飼主未依規定為家貓辦理寵物登記並植入晶片者，可處新臺幣3,000元以上15,000元以下罰鍰，屆期未改善者得按次處罰。飼主若違反此規定，將遭受何種處罰？", "opts": [["A", "行政處罰"], ["B", "刑事處罰"], ["C", "民事賠償"], ["D", "公務員懲戒"]], "ans": "A", "exp": "寵物登記的規定屬於行政法規，未依規定辦理由主管機關處以罰鍰，屬於行政處罰（行政罰），不會有刑事紀錄。"}, {"stem": "關於「行政救濟」的意義，下列敘述何者最適當？", "opts": [["A", "是政府對經濟弱勢者提供的社會救助措施"], ["B", "人民的權益因行政機關違法或不當的行政行為而受侵害時，向國家機關尋求救濟的制度"], ["C", "是行政機關對犯罪者進行偵查與處罰的程序"], ["D", "是人民之間發生私人糾紛時所進行的調解程序"]], "ans": "B", "exp": "課本定義：如果人民的權益因行政機關「違法或不當」的行政行為而受到侵害，可依法向國家機關尋求救濟，這就是行政救濟。"}, {"stem": "依課本所述，行政救濟的管道原則上包括哪兩種？", "opts": [["A", "調解與仲裁"], ["B", "告訴與自訴"], ["C", "上訴與抗告"], ["D", "訴願與行政訴訟"]], "ans": "D", "exp": "行政救濟的兩大管道為「訴願」（向行政機關提起）與「行政訴訟」（向行政法院提起），且原則上須先訴願、不服再提行政訴訟。"}, {"stem": "關於「訴願」的敘述，下列何者正確？", "opts": [["A", "應向行政法院提起，由法官開庭審理"], ["B", "由檢察官代表國家向法院提起"], ["C", "向訴願管轄機關提起，請求撤銷或變更原處分，是透過行政機關更正違法或不當的行政行為"], ["D", "只有公務員才有資格提起"]], "ans": "C", "exp": "訴願是人民認為行政機關的行政處分違法或不當致權利受損時，向訴願管轄機關提起，請求撤銷或變更原處分；其特色是「透過行政機關自我更正」。"}, {"stem": "關於「行政訴訟」的敘述，下列何者正確？", "opts": [["A", "向行政法院提起，是透過司法機關更正違法或不當的行政行為"], ["B", "向原處分機關的上級機關提起，由該機關重新審查"], ["C", "由各機關的訴願審議委員會負責審理"], ["D", "屬於刑事訴訟程序的一種"]], "ans": "A", "exp": "行政訴訟是當事人不服訴願決定時，向「行政法院」提起，請求作成有利人民的判決；相對於訴願是行政機關自我更正，行政訴訟是透過司法機關來更正。"}, {"stem": "阿玉收到某行政機關的處分後認為該處分違法，想尋求行政救濟。依課本所述，正確的救濟順序為何？", "opts": [["A", "先提起行政訴訟，若不服判決再提起訴願"], ["B", "先向訴願管轄機關提起訴願，若不服訴願決定，再向行政法院提起行政訴訟"], ["C", "先向地方法院提起民事訴訟，若不服再提起訴願"], ["D", "直接聲請大法官解釋憲法，不必經過任何程序"]], "ans": "B", "exp": "行政救濟的原則順序是「訴願 → 行政訴訟」：先請行政機關自我更正（訴願），不服訴願結果才向司法機關（行政法院）提起行政訴訟。這是本課最常考的重點。"}, {"stem": "關於「訴願管轄機關」，下列敘述何者正確？", "opts": [["A", "一律為行政法院"], ["B", "一律為作成處分的原處分機關本身"], ["C", "一律為最高行政機關行政院"], ["D", "原則上為原處分機關的上級機關；若原處分機關沒有上級機關，則以原處分機關為訴願管轄機關"]], "ans": "D", "exp": "課本說明：訴願管轄機關為原處分機關的上級機關；如果沒有上級機關，則為原處分機關。原則上各機關都會設置訴願審議委員會處理訴願事件。"}, {"stem": "小明不服宜蘭縣羅東鎮公所所作成的行政處分，想提起訴願。他應該向下列何者提起？", "opts": [["A", "羅東鎮公所"], ["B", "行政院"], ["C", "高等行政法院"], ["D", "宜蘭縣政府"]], "ans": "D", "exp": "訴願管轄機關原則上是原處分機關的「上級機關」。羅東鎮公所的上級機關是宜蘭縣政府，因此應向宜蘭縣政府提起訴願。"}, {"stem": "若人民不服「行政院」所作成的行政處分而想提起訴願，依課本所述應向下列何者提起？", "opts": [["A", "行政院，因為行政院沒有上級機關，以原處分機關為訴願管轄機關"], ["B", "總統府"], ["C", "立法院"], ["D", "監察院"]], "ans": "A", "exp": "訴願管轄機關原則上是上級機關，但行政院已是最高行政機關、沒有上級機關，因此依規定以原處分機關（行政院）自己作為訴願管轄機關。"}, {"stem": "原則上，各行政機關會設置下列何種單位來處理訴願事件？", "opts": [["A", "鄉鎮市調解委員會"], ["B", "訴願審議委員會"], ["C", "人事評議委員會"], ["D", "檢察審查會"]], "ans": "B", "exp": "課本指出，原則上各機關都會設置「訴願審議委員會」來處理訴願事件，以審查原處分是否違法或不當。"}, {"stem": "訴願管轄機關受理人民提起的訴願後，可能作成的決定為何？", "opts": [["A", "只能維持原處分，不能變更"], ["B", "只能對原處分機關的公務員判處刑罰"], ["C", "可能撤銷或變更原處分，也可能維持原處分"], ["D", "只能命令原處分機關支付金錢賠償"]], "ans": "C", "exp": "訴願的目的是請求撤銷或變更原處分；訴願管轄機關審議後，若認為原處分違法或不當，可撤銷或變更，若認為原處分並無不當，則維持原處分，此時人民才可再提起行政訴訟。"}, {"stem": "阿玉被大學退學，提起申訴又被學校駁回，因此向教育部提起訴願。若教育部作成的訴願決定她仍然不服，接下來她可以怎麼做？", "opts": [["A", "向教育部再提起一次訴願"], ["B", "向地方法院提起民事訴訟請求賠償"], ["C", "向檢察官對學校提出告訴"], ["D", "向行政法院提起行政訴訟"]], "ans": "D", "exp": "依行政救濟途徑，人民不服訴願決定時，可向行政法院提起行政訴訟，請求法院作成有利於人民的判決，這是行政救濟的第二階段。"}, {"stem": "課本指出，行政救濟制度存在的意義主要為何？", "opts": [["A", "使行政機關能更快速有效地處罰違規人民"], ["B", "對權利受侵害的人民依法給予保護，保障人民權益並落實依法行政原則，使國家權力運作不流於主觀與恣意"], ["C", "減少法院所受理的案件數量，節省司法資源"], ["D", "讓行政機關在執行職務時可以不受法律拘束"]], "ans": "B", "exp": "課本明白指出，行政救濟的意義在於對權利受到侵害的人民依法給予保護，使國家的權力運作不致流於主觀與恣意，以保障人民權益及落實依法行政原則。"}, {"stem": "阿強無照駕駛汽車，途中又不慎撞傷路人。依課本所述，他可能須負擔哪些法律責任？", "opts": [["A", "無照駕駛須負道路交通管理處罰條例的行政責任、撞傷人須負刑法過失傷害的刑事責任及民法侵權行為的民事責任"], ["B", "只須負擔行政責任，繳完罰鍰即可"], ["C", "只須負擔刑事責任，由法院判刑即可"], ["D", "只須負擔民事責任，賠償醫藥費即可"]], "ans": "A", "exp": "在實際生活中，一個違法行為可能同時產生多種法律責任：無照駕駛違反行政法規（罰鍰）；撞傷他人則構成刑法過失傷害（刑事責任），並須依民法負損害賠償（民事責任）。"}, {"stem": "下列四個案例與其法律責任性質的配對，何者正確？\n甲：小志騎機車闖紅燈被警察開罰單／乙：小宏偷走超商飲料被法院判刑／丙：小美畢業時學校頒發畢業證書／丁：小莉摔壞別人的手機須賠償", "opts": [["A", "甲—須負刑事責任，會留下前科"], ["B", "乙—須負行政責任，由警察機關裁罰"], ["C", "丙—屬於對人民有利的行政處分"], ["D", "丁—須負行政責任，由行政機關處以罰鍰"]], "ans": "C", "exp": "甲是行政責任（罰鍰）；乙是刑事責任（法院判刑）；丙是學校對特定學生作成、授予學歷的有利行政處分；丁是民法侵權行為的民事賠償責任。故僅 (C) 正確。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

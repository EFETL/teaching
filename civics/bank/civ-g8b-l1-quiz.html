<script>
const QS=[{"stem": "法律和道德、風俗習慣同樣都是社會規範，但法律有一項其他規範所沒有的特色。這項特色是什麼？", "opts": [["A", "法律的內容永遠不會修改"], ["B", "法律只規範政府，不規範人民"], ["C", "法律具有國家的強制力，違反時會受到制裁"], ["D", "法律必須全體國民投票同意才能適用"]], "ans": "C", "exp": "課本指出「法律是具有強制力的社會規範」。道德與風俗違反時多半只受輿論譴責，法律則由國家以公權力強制實施。"}, {"stem": "在我國，由立法院通過、並經總統公布的法律，屬於下列何者？", "opts": [["A", "狹義的法律"], ["B", "廣義的法律"], ["C", "命令"], ["D", "自治規章"]], "ans": "A", "exp": "課本區分廣義與狹義：狹義的法律專指立法院通過、總統公布者；廣義的法律則包含憲法、法律與命令三者。"}, {"stem": "下列哪一組合，才是課本所說的「廣義的法律」？", "opts": [["A", "憲法、道德、命令"], ["B", "法律、命令、校規"], ["C", "憲法、法律、風俗習慣"], ["D", "憲法、法律、命令"]], "ans": "D", "exp": "廣義的法律包含憲法、法律、命令三者，三者位階與效力並不相同。道德、風俗、校規並非廣義法律。"}, {"stem": "關於憲法、法律與命令三者的關係，下列敘述何者正確？", "opts": [["A", "三者位階相同，效力也一樣"], ["B", "位階低者若牴觸位階高者，則牴觸的部分無效"], ["C", "位階高者必須配合位階低者修正"], ["D", "命令的效力高於法律，因為命令較具體"]], "ans": "B", "exp": "課本明示「位階低者牴觸位階高者則無效」。位階由高至低為憲法、法律、命令。"}, {"stem": "我國憲法被稱為「國家根本大法」，其內容主要規範什麼？", "opts": [["A", "人民的權利與義務，以及政府的組織與職權"], ["B", "買賣契約的成立要件"], ["C", "各級學校的招生名額"], ["D", "各種犯罪的刑度輕重"]], "ans": "A", "exp": "憲法作為根本大法，主要規定人民權利義務及政府組織職權等重要事項；契約、招生、刑度屬於法律或命令的層次。"}, {"stem": "我國現行憲法的內容，包括下列哪兩部分？", "opts": [["A", "憲法本文與國民教育法"], ["B", "憲法本文與司法判決"], ["C", "憲法增修條文與行政命令"], ["D", "憲法本文與憲法增修條文"]], "ans": "D", "exp": "課本說明我國憲法包括「憲法本文」與「憲法增修條文」兩部分，兩者都屬於憲法位階。"}, {"stem": "「任何法律與命令若牴觸憲法，即為無效。」這句話說明憲法具有下列哪一項特性？", "opts": [["A", "原則性"], ["B", "最高性"], ["C", "固定性"], ["D", "具體性"]], "ans": "B", "exp": "最高性指憲法是最高的法律規範，位階最高，其他法令都不得與它牴觸。"}, {"stem": "我國憲法的條文相當簡明扼要，只針對政府組織與人民權利義務等重要事項作規定。這反映憲法的哪一項特性？", "opts": [["A", "最高性"], ["B", "固定性"], ["C", "原則性"], ["D", "強制性"]], "ans": "C", "exp": "原則性指憲法只就重要事項作原則、扼要的規範，細節則留給法律與命令去補充落實。"}, {"stem": "憲法的制定與修改程序，比一般法律繁複許多。這項特性又可稱為「穩定性」，它是指下列何者？", "opts": [["A", "固定性"], ["B", "最高性"], ["C", "原則性"], ["D", "公開性"]], "ans": "A", "exp": "固定性（穩定性）指憲法的制定與修改程序比普通法律更為繁複，目的是避免憲法被輕易更動。"}, {"stem": "依課本所述，我國憲法本文最初是由下列哪一個機關制定？", "opts": [["A", "立法院"], ["B", "制憲國民大會"], ["C", "總統府"], ["D", "憲法法庭"]], "ans": "B", "exp": "憲法由制憲國民大會制定；現行修憲則由立法院提案、選舉人複決，最後由總統公布。"}, {"stem": "依我國現行修憲程序，立法院提出憲法修正案並公告半年後，須由誰做出最後決定？", "opts": [["A", "由總統直接決定是否公布"], ["B", "由憲法法庭判決是否通過"], ["C", "由行政院院會決議"], ["D", "由選舉人投票複決"]], "ans": "D", "exp": "修憲案經立法院決議提出、公告半年後，須交由選舉人（公民）投票複決，通過後才由總統公布。"}, {"stem": "關於「法律」（狹義）的制定與公布，下列敘述何者正確？", "opts": [["A", "由行政院制定，行政院長公布"], ["B", "由憲法法庭制定，總統公布"], ["C", "由立法院制定與修改，總統公布"], ["D", "由選舉人複決通過後生效"]], "ans": "C", "exp": "狹義法律的制定、修改權在立法院（經三讀通過），再由總統公布。選舉人複決是修憲程序，不是立法程序。"}, {"stem": "「命令」多半是哪個機關依據法律的授權所訂定？", "opts": [["A", "立法院"], ["B", "行政機關"], ["C", "法院"], ["D", "制憲國民大會"]], "ans": "B", "exp": "命令由行政機關基於法律授權訂定並發布，用來補充並落實法律的相關規定。"}, {"stem": "下列哪一組名稱，屬於課本所說「法律」層級常見的名稱？", "opts": [["A", "法、律、條例、通則"], ["B", "規程、規則、細則、辦法"], ["C", "標準、準則、綱要、辦法"], ["D", "本文、增修條文"]], "ans": "A", "exp": "法律的名稱有法、律、條例、通則；規程、規則、細則、辦法、綱要、標準、準則則是命令的名稱。"}, {"stem": "小禾在網路上查到一份法規叫做「國民教育法施行細則」。依名稱判斷，它屬於下列哪一種位階？", "opts": [["A", "憲法"], ["B", "法律"], ["C", "命令"], ["D", "憲法增修條文"]], "ans": "C", "exp": "名稱中含「細則」者屬命令，由行政機關訂定，用來補充落實「國民教育法」這部法律。"}, {"stem": "若將憲法、法律、命令依「位階與效力」由高至低排列，正確順序為何？", "opts": [["A", "命令→法律→憲法"], ["B", "法律→憲法→命令"], ["C", "憲法→命令→法律"], ["D", "憲法→法律→命令"]], "ans": "D", "exp": "位階高低為憲法最高、法律次之、命令最低；愈往下愈具體，效力則愈弱。"}, {"stem": "課本以受國民教育為例說明位階關係：憲法第21條規定人民有受國民教育的權利與義務，據此制定「國民教育法」規定6至15歲國民應受國民教育，再訂定「國民教育法施行細則」規定入學年齡的計算方式。這個例子最能說明下列何者？", "opts": [["A", "法律依憲法而制定，命令則用來補充並落實法律規定"], ["B", "命令的效力高於法律，因此規定得比較細"], ["C", "憲法必須依照法律的內容來修改"], ["D", "三者由不同人民團體各自制定，互不相關"]], "ans": "A", "exp": "這正是位階金字塔的典型例子：憲法作原則性規定，法律具體實現憲法內涵，命令再補充落實法律。"}, {"stem": "「6歲至15歲的國民，應受國民教育。」這條規定出自國民教育法。它屬於下列哪一位階？", "opts": [["A", "憲法"], ["B", "法律"], ["C", "命令"], ["D", "校規"]], "ans": "B", "exp": "「國民教育法」名稱為「法」，是立法院通過、總統公布的狹義法律。"}, {"stem": "某部行政機關訂定的辦法，其內容與立法院制定的法律規定相互衝突。依法律位階原則，結果應是如何？", "opts": [["A", "該法律應配合辦法修正"], ["B", "兩者都繼續有效，由人民自行選擇適用"], ["C", "該辦法牴觸法律的部分無效"], ["D", "應由行政院決定哪一個有效"]], "ans": "C", "exp": "命令不得牴觸憲法與法律，牴觸者無效；位階低者永遠必須讓位給位階高者。"}, {"stem": "當一部法律有牴觸憲法的疑慮時，依課本所述，應由下列哪一個機關判斷是否違憲？", "opts": [["A", "立法院"], ["B", "監察院"], ["C", "行政院"], ["D", "憲法法庭"]], "ans": "D", "exp": "憲法法庭掌理解釋憲法、統一解釋法律及命令，由它判決法律或命令是否違憲，以確保憲法的最高性。"}, {"stem": "某一法律被憲法法庭判決違憲後，依課本所述，接下來應如何處理？", "opts": [["A", "繼續適用，直到下次修憲時一併處理"], ["B", "必須盡快修正或立即廢止，以免侵害人民權利"], ["C", "改由行政機關以命令的形式重新發布"], ["D", "交由全體選舉人投票決定是否保留"]], "ans": "B", "exp": "課本明白指出，經判決違憲的法律與命令必須盡快修正或立即廢止，避免繼續侵害人民權利。"}, {"stem": "依課本的修憲程序圖，下列順序何者正確？", "opts": [["A", "立法委員提議→立法院決議提出憲法修正案→公告半年→選舉人投票複決→總統公布"], ["B", "總統提案→立法院三讀通過→總統公布"], ["C", "行政院提案→憲法法庭審查→公告半年→總統公布"], ["D", "選舉人連署→制憲國民大會表決→總統公布"]], "ans": "A", "exp": "修憲須經立委提議、立法院決議提出修正案、公告半年、選舉人複決，通過後才由總統公布，程序遠比立法繁複。"}, {"stem": "我國憲法修正案要交付選舉人複決時，須達到下列哪一項門檻才算通過？", "opts": [["A", "出席投票人數過半數同意"], ["B", "立法委員三分之二同意"], ["C", "有效同意票超過投票人數的半數"], ["D", "有效同意票超過選舉人總額的半數"]], "ans": "D", "exp": "依憲法增修條文，修憲複決須「有效同意票超過選舉人總額之半數」才通過，門檻極高，展現憲法的固定性。"}, {"stem": "憲法修正案經立法院決議提出後，依規定須先「公告」多久，才能交付選舉人複決？", "opts": [["A", "一個月"], ["B", "三個月"], ["C", "半年"], ["D", "一年"]], "ans": "C", "exp": "修憲案須公告半年，讓社會有充分時間討論後，再舉行複決投票。"}, {"stem": "民國111年，立法院通過「18歲公民權修憲案」並交付公民複決，最後結果為何？", "opts": [["A", "因有效同意票未達選舉人總額的半數而不通過"], ["B", "因立法院未三讀通過而作廢"], ["C", "順利通過，選舉權年齡已下修至18歲"], ["D", "因憲法法庭判決違憲而失效"]], "ans": "A", "exp": "這是我國史上第一次憲法修正案的公民複決，結果有效同意票未達選舉人總額的一半，因此不通過，選舉權年齡仍維持20歲。"}, {"stem": "修憲案要通過如此高的門檻，而一般法律只要立法院三讀通過、總統公布即可。這樣的差異最能凸顯憲法的哪一項特性？", "opts": [["A", "最高性"], ["B", "固定性"], ["C", "原則性"], ["D", "具體性"]], "ans": "B", "exp": "憲法修改程序比普通法律繁複許多，正是固定性（穩定性）的表現，目的在維持憲政秩序的穩定。"}, {"stem": "憲法常被稱為「人民權利的保障書」，主要理由為何？", "opts": [["A", "憲法條文最多，規定最詳細"], ["B", "憲法由人民親自撰寫並簽名"], ["C", "民主國家把人民的基本權利規定在憲法中，遭非法侵害時可請求救濟"], ["D", "憲法規定人民不必負擔任何義務"]], "ans": "C", "exp": "課本指出民主國家將人民的權利明定於憲法，當基本權利受政府或他人非法侵害時，人民可依法請求救濟，故稱人民權利的保障書。"}, {"stem": "我國憲法第7條規定：「中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。」這保障的是下列哪一項權利？", "opts": [["A", "自由權"], ["B", "受益權"], ["C", "參政權"], ["D", "平等權"]], "ans": "D", "exp": "憲法第7條是平等權的核心條文，指人民享有同等的權利、負擔相同的義務，國家不可任意差別對待。"}, {"stem": "考場規則原則上一視同仁，但視障考生依法可申請特殊考場並延長作答時間。這樣的做法應如何理解？", "opts": [["A", "違反平等權，因為考生待遇不同"], ["B", "屬於合理的差別待遇，是為保障處境不利群體"], ["C", "屬於自由權的行使"], ["D", "屬於參政權的範圍"]], "ans": "B", "exp": "平等不等於齊頭式的相同對待。政府為保障處境不利的群體，可依法給予 "請願權"], ["D", "罷免權"]], "ans": "C", "exp": "請願是人民針對公共政策或自身權益向政府提出建議或希望，尚未涉及具體行政處分的爭執。"}, {"stem": "阿明認為自己被開的亂丟垃圾罰單有問題，想要求行政機關撤銷這張罰單。他應行使下列哪一項權利？", "opts": [["A", "請願權"], ["B", "罷免權"], ["C", "創制權"], ["D", "訴願權"]], "ans": "D", "exp": "訴願是人民要求撤銷或變更行政機關「違法或不當的處分」，罰單即屬行政處分。"}, {"stem": "下列關於「訴訟權」的敘述，何者正確？", "opts": [["A", "人民權益受不法侵害時，請求法院依法裁判以保護自己權益"], ["B", "人民向行政機關提出改善公共政策的建議"], ["C", "人民對候選人投下同意或不同意票"], ["D", "人民針對法律案提出創制"]], "ans": "A", "exp": "訴訟是向法院請求依法裁判；向政府建議是請願，投票屬參政權。"}, {"stem": "下列哪一個情境，最適合以「訴訟」的方式處理？", "opts": [["A", "希望市政府在社區增設公車站牌"], ["B", "遭人詐騙金錢，想請法院判決對方返還"], ["C", "認為違規停車的罰單開錯，想請原機關撤銷"], ["D", "想連署提案要求修改憲法"]], "ans": "B", "exp": "權益遭不法侵害、需要法院依法裁判者屬訴訟；(A)為請願、(C)為訴願、(D)屬修憲程序。"}, {"stem": "依我國憲法規定，「受國民教育」具有什麼特別之處？", "opts": [["A", "只是人民的義務，不是權利"], ["B", "只是人民的權利，不是義務"], ["C", "既是人民的權利，也是人民的義務"], ["D", "由家長自由決定是否讓子女受教育"]], "ans": "C", "exp": "憲法第21條規定人民有受國民教育之權利與義務，因此國民教育法規定6至15歲國民應受國民教育。"}, {"stem": "下列哪一組合，全部都屬於憲法保障的「參政權」？", "opts": [["A", "生存權、工作權、財產權"], ["B", "言論、講學、著作、出版"], ["C", "請願、訴願、訴訟"], ["D", "選舉、罷免、創制、複決、應考試、服公職"]], "ans": "D", "exp": "參政權是人民參與政治的權利，包含選舉、罷免、創制、複決，以及應考試與服公職。"}, {"stem": "關於參政權中「對人」與「對事」的區分，下列敘述何者正確？", "opts": [["A", "選舉、創制對人；罷免、複決對事"], ["B", "選舉、罷免對人；創制、複決對事"], ["C", "四者都是對人"], ["D", "四者都是對事"]], "ans": "B", "exp": "選舉是選出人、罷免是罷掉人，故為對人；創制與複決針對法案或政策，故為對事。"}, {"stem": "小華通過國家考試後成為公務人員。她所行使與享有的，屬於參政權中的哪兩項？", "opts": [["A", "應考試、服公職"], ["B", "選舉、罷免"], ["C", "創制、複決"], ["D", "請願、訴願"]], "ans": "A", "exp": "應考試指經由國家考試取得資格，服公職指擔任公職人員，兩者同屬參政權。"}, {"stem": "我國憲法第22條規定：「凡人民之其他自由及權利，不妨害社會秩序公共利益者，均受憲法之保障。」這條規定最重要的意義是什麼？", "opts": [["A", "表示憲法只保障條文明列的權利"], ["B", "表示人民的權利可以完全不受限制"], ["C", "表示憲法保障的權利只能靠修憲才能增加"], ["D", "表示基本權利的內涵可因應時代需求不斷擴充"]], "ans": "D", "exp": "第22條是概括保障條款，使隱私權、健康照護權、多元文化權、環境權等新興權利也能受憲法保障。"}, {"stem": "居民主張政府開發案破壞當地生態，要求維護良好的生活環境。他們主張的「環境權」在課本中屬於哪一類？", "opts": [["A", "參政權"], ["B", "平等權"], ["C", "其他基本權利"], ["D", "自由權中的居住自由"]], "ans": "C", "exp": "隱私權、健康照護權、多元文化權、環境權等，是依憲法第22條而受保障的其他基本權利。"}, {"stem": "小禾看到某公司招募彩妝師時限制身高、又排除男性應徵。依課本內容判斷，下列說法何者最正確？", "opts": [["A", "該條件涉及不合理的差別待遇，違反憲法保障的平等權，性別平等工作法也禁止雇主因性別而差別對待"], ["B", "企業徵才屬私人行為，完全不受任何法律規範"], ["C", "只要公司願意，可自行決定所有應徵條件，法律無從介入"], ["D", "這屬於侵害參政權，應向憲法法庭提出罷免"]], "ans": "A", "exp": "憲法第7條保障平等權，性別平等工作法進一步規定雇主招募員工不得因性別而有差別待遇，這正是以法律落實憲法精神。"}, {"stem": "綜合本課內容，下列敘述何者正確？", "opts": [["A", "命令由立法院訂定，效力高於法律"], ["B", "憲法具最高性、原則性與固定性，法律與命令都不得牴觸憲法"], ["C", "憲法條文詳盡具體，因此不需要法律再加以落實"], ["D", "人民的基本權利只能由行政機關以命令加以保障"]], "ans": "B", "exp": "憲法位階最高且只作原則性規範，須由法律具體實現、命令補充落實；法律與命令牴觸憲法者無效，由憲法法庭判決。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

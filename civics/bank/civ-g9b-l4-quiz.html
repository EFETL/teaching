<script>
const QS=[{"stem": "隨著全球化的發展，許多議題成為國與國之間必須共同面對與承擔的責任。下列何者最能說明「任何國家都不能置身於國際社會之外」的理由？", "opts": [["A", "各國的主權範圍已經完全消失，國家不再是國際社會的成員"], ["B", "許多議題的影響會跨越國界，單一國家無法獨力解決"], ["C", "國際組織已經取代各國政府，直接管理各國內政事務"], ["D", "世界各國的政治制度已經統一，不需要再彼此協商"]], "ans": "B", "exp": "全球化使疾病、環境汙染、犯罪等問題跨越國界，任何國家都無法單獨處理，因此必須積極參與國際社會、透過各種互動方式共同解決。國家主權並未消失，國際組織也不能管轄各國內政。"}, {"stem": "國際社會的主要組成成員為何？", "opts": [["A", "只有跨國企業"], ["B", "只有國際組織"], ["C", "主要由國家組成，個人、國際組織與跨國企業也具有影響力"], ["D", "只有聯合國的會員國，非會員國不算國際社會成員"]], "ans": "C", "exp": "課本指出國際社會主要由國家組成，但在全球化下，個人、國際組織、跨國企業等也對國際社會具有一定的影響力，並非只有單一類型成員。"}, {"stem": "我國前衛生福利部部長與美國衛生部部長於西元2020年共同簽署「醫衛合作瞭解備忘錄」，強化雙邊醫療衛生合作。這屬於國際社會互動方式中的哪一種？", "opts": [["A", "國際合作"], ["B", "國際援助"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "A", "exp": "國際合作是指國與國之間為共同利益與目標，透過結盟或簽訂條約、協議等方式，進行資金、人才、技術等跨國合作。簽署醫衛合作備忘錄正是典型的國際合作。"}, {"stem": "我國選手在東京奧運會中奪得男子羽球雙打金牌，各國選手在賽場上公平競爭、彼此加油。這種互動方式最接近下列何者？", "opts": [["A", "國際援助"], ["B", "國際合作"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "D", "exp": "國際交流是指透過政府或民間團體的力量，進行經濟貿易、學術文化、藝術表演、體育競賽等跨國活動，藉此增進彼此情誼與了解。奧運屬於體育競賽的跨國交流。"}, {"stem": "財團法人國際合作發展基金會（國合會）派駐帛琉的技術團，透過「園藝推廣計畫」協助當地人民建立健康飲食觀念。這屬於哪一種國際互動方式？", "opts": [["A", "國際交流"], ["B", "國際衝突"], ["C", "國際援助"], ["D", "軍事同盟"]], "ans": "C", "exp": "國際援助是基於尊重人權與人道關懷的精神，對受災或低度開發國家給予人道賑災或經濟、技術等跨國援助。國合會派技術團協助帛琉屬於技術援助。"}, {"stem": "下列關於「國際衝突」的敘述，何者正確？", "opts": [["A", "可能因族群、宗教、政治、領土、資源等因素而產生"], ["B", "只會因為經濟因素而產生，與宗教、族群無關"], ["C", "一旦發生就必然導致戰爭，沒有其他解決方式"], ["D", "只發生在低度開發國家之間，已開發國家不會發生"]], "ans": "A", "exp": "國際間可能因族群、宗教、政治、領土、資源等多種因素產生衝突。衝突不必然導致戰爭，也可透過外交談判、經濟制裁或國際組織調解等非暴力方式處理。"}, {"stem": "課本提到「戰爭的結果通常只會替戰勝的一方帶來短暫的好處」，其主要用意是要說明什麼？", "opts": [["A", "戰爭是解決國際衝突最有效率的方式"], ["B", "只要能取得勝利，發動戰爭就值得"], ["C", "國際衝突無法避免，各國應積極擴充軍備"], ["D", "戰爭犧牲大量生命與資源，應採非暴力方式解決衝突"]], "ans": "D", "exp": "課本強調戰爭會犧牲大量無辜生命與耗損資源，對整體人類社會的影響是負面且長久的，因此應採取非暴力方式（如國際組織調解、達成停火協議）來消弭衝突、維護和平。"}, {"stem": "敘利亞內戰在美、俄及聯合國代表的調停下，交戰雙方簽下停火協議。這個例子最能說明下列哪一個概念？", "opts": [["A", "國際衝突只能靠武力解決"], ["B", "國際組織有助於調解衝突、維護和平"], ["C", "聯合國可以直接統治發生內戰的國家"], ["D", "國際援助是解決衝突的唯一方法"]], "ans": "B", "exp": "透過國際組織進行調解，可讓交戰雙方達成停火協議，說明國際組織是消弭衝突、維護國際和平的重要管道。"}, {"stem": "國際組織通常是如何組成的？", "opts": [["A", "由參與成員透過條約或協議的方式所組成"], ["B", "由聯合國祕書長直接指派各國加入"], ["C", "由全世界人民直接投票選舉產生"], ["D", "由跨國企業出資購買席次而成立"]], "ans": "A", "exp": "國際組織是由參與成員依所締結的條約或協議方式組成，用以處理國際事務或實現共同目標，並非由個人投票或企業出資決定。"}, {"stem": "下列何者「不是」課本所述參與國際組織的重要性？", "opts": [["A", "建立解決國際糾紛的溝通協調管道與互信基礎"], ["B", "加強國與國之間的交流與合作關係"], ["C", "使各會員國放棄主權，接受組織的統一領導"], ["D", "共同關注全球議題、維護國際安全與和平"]], "ans": "C", "exp": "參與國際組織的目的在於加強交流合作、建立互信、共同處理全球議題與維護和平，並不要求會員國放棄主權；國際組織也無權統一領導各國。"}, {"stem": "依「成員性質」區分，國際組織可分為哪兩大類？", "opts": [["A", "全球性國際組織與區域性國際組織"], ["B", "營利性國際組織與非營利性國際組織"], ["C", "已開發國家組織與開發中國家組織"], ["D", "政府間國際組織與國際非政府組織"]], "ans": "D", "exp": "依成員性質分為「政府間國際組織」（由主權國家透過條約或公約成立，具官方性質）與「國際非政府組織」（由民間人士組成的非營利、志願性組織，不具官方身分）。全球性與區域性則是依「議題範圍」區分。"}, {"stem": "下列關於「政府間國際組織」的敘述，何者正確？", "opts": [["A", "由民間人士自願組成，不具官方身分"], ["B", "由各主權國家透過簽訂條約或國際公約而成立，具官方性質"], ["C", "主要目的是為股東賺取利潤"], ["D", "任何個人只要繳交會費即可成為會員"]], "ans": "B", "exp": "政府間國際組織由各主權國家透過簽訂條約或通過具法律約束力的國際公約而成立，具有官方性質，其成員限主權國家，個人無法加入。"}, {"stem": "下列組織中，何者屬於「國際非政府組織」？", "opts": [["A", "聯合國"], ["B", "世界貿易組織"], ["C", "無國界醫生"], ["D", "亞太經濟合作會議"]], "ans": "C", "exp": "無國界醫生是由民間發起、全球性且獨立的國際醫療人道救援組織，屬於國際非政府組織。聯合國、世界貿易組織、亞太經濟合作會議皆屬政府間國際組織。"}, {"stem": "下列哪一組全部都屬於「政府間國際組織」？", "opts": [["A", "聯合國、世界貿易組織、世界衛生組織"], ["B", "綠色和平組織、無國界醫生、聯合國"], ["C", "台灣世界展望會、台灣路竹會、歐洲聯盟"], ["D", "國際特赦組織、東南亞國協、舊鞋救命協會"]], "ans": "A", "exp": "聯合國、世界貿易組織、世界衛生組織皆由主權國家組成，屬政府間國際組織。綠色和平、無國界醫生、國際特赦組織、台灣世界展望會、台灣路竹會、舊鞋救命協會皆為非政府組織。"}, {"stem": "下列哪一個國際組織屬於「區域性」國際組織？", "opts": [["A", "聯合國"], ["B", "歐洲聯盟"], ["C", "世界衛生組織"], ["D", "世界貿易組織"]], "ans": "B", "exp": "歐洲聯盟成立是為加強歐洲各國的經貿整合與團結合作，成員限於特定區域，屬區域性國際組織。聯合國、世界衛生組織、世界貿易組織則屬全球性國際組織。"}, {"stem": "各國政府面臨「全球普遍性議題」時，通常會透過下列何種組織來因應？", "opts": [["A", "區域性國際組織，如東南亞國協"], ["B", "只由本國政府單獨處理即可"], ["C", "只透過跨國企業處理"], ["D", "全球性國際組織，如聯合國、世界貿易組織"]], "ans": "D", "exp": "課本指出，面臨全球普遍性議題時會透過全球性國際組織（聯合國、世界貿易組織、世界衛生組織等）；面臨區域性議題時才透過區域性國際組織（歐盟、APEC、東協等）。"}, {"stem": "世界貿易組織（WTO）成立的主要目的為何？", "opts": [["A", "創造自由公平的貿易環境，降低會員國間的貿易障礙"], ["B", "統一各會員國的貨幣與稅制"], ["C", "派遣醫療團到戰亂地區進行義診"], ["D", "負責調停各國之間的軍事衝突"]], "ans": "A", "exp": "世界貿易組織是全球最重要的國際經濟組織之一，其成立是為了創造自由公平的貿易環境、確保會員國間的自由貿易並降低貿易障礙。醫療救援與軍事調停不是其職責。"}, {"stem": "非洲辛巴威因乾旱導致玉米收成大減，超過百萬民眾需要糧食援助，最可能由下列哪一個組織提供食物幫助民眾度過饑荒？", "opts": [["A", "世界貿易組織"], ["B", "亞太經濟合作會議"], ["C", "聯合國糧食及農業組織"], ["D", "國際奧林匹克委員會"]], "ans": "C", "exp": "聯合國糧食及農業組織負責糧食與農業相關事務，提供糧食援助以協助民眾度過饑荒。其餘三者分別處理貿易、區域經濟合作與體育賽事。"}, {"stem": "聯合國兒童基金會的主要工作內容為何？", "opts": [["A", "降低各國關稅、促進自由貿易"], ["B", "保障兒童的生存與發展"], ["C", "消滅地雷的製作與使用"], ["D", "舉辦國際體育競賽"]], "ans": "B", "exp": "聯合國兒童基金會是聯合國體系下的機構，致力於保障兒童的生存和發展。降低關稅為WTO職責、消滅地雷為國際反地雷組織的訴求。"}, {"stem": "課本提到「許多議題的處理，除了透過政府的國際組織，有時候也必須透過民間發起非政府的國際組織來彌補其不足」，其原因「不」包括下列何者？", "opts": [["A", "不同國家對各類全球議題的重視程度不一"], ["B", "各國會有個別國家利益的考量"], ["C", "政府間國際組織的參與成員必須為主權國家"], ["D", "政府間國際組織的成員國數目過少，無法運作"]], "ans": "D", "exp": "課本列舉的原因是各國重視程度不一、國家利益考量，以及參與成員必須為主權國家的限制，因此需要非政府組織彌補不足；並非因為成員數目太少而無法運作。"}, {"stem": "「無國界醫生」組織的主要工作為何？", "opts": [["A", "制定國際貿易規則"], ["B", "監督各國的選舉是否公平"], ["C", "對遭受戰爭肆虐、缺乏醫療資源地區的民眾提供基本醫療協助"], ["D", "協助各國政府訓練軍隊"]], "ans": "C", "exp": "無國界醫生是全球最大的醫療救援組織之一，提供緊急醫療援助給飽受戰亂摧殘或窮困的國家人民，屬於國際非政府組織。"}, {"stem": "小禾在淨灘時發現許多來自國外的塑膠垃圾，後來得知有一個組織正集結世界各地志同道合的人共同關心塑膠垃圾問題。這個組織最可能是下列何者？", "opts": [["A", "綠色和平組織"], ["B", "世界貿易組織"], ["C", "亞太經濟合作會議"], ["D", "聯合國安全理事會"]], "ans": "A", "exp": "綠色和平組織（Greenpeace）是關注環境保育議題的國際非政府組織，集結各地民眾共同關心塑膠垃圾等環境問題。其餘為政府間組織，且主要處理貿易、經濟與安全事務。"}, {"stem": "課本提到垃圾汙染「不是單一國家的問題」，這最能說明下列哪一項概念？", "opts": [["A", "環境問題只需由撿到垃圾的國家自行處理"], ["B", "只有政府間國際組織才能處理環境問題"], ["C", "環境保育與國際參與毫無關聯"], ["D", "全球性議題需要跨國合作與民間力量共同面對"]], "ans": "D", "exp": "海洋垃圾會隨洋流跨越國界，並非單一國家所能解決，必須透過跨國合作、加入國際組織與民間團體行動共同面對，這正是參與國際社會的意義。"}, {"stem": "我國國際參與受到限制的關鍵歷史轉折是下列何者？", "opts": [["A", "西元1949年我國政府遷臺"], ["B", "西元1971年中華人民共和國取代我國進入聯合國"], ["C", "西元1991年我國加入亞太經濟合作會議"], ["D", "西元2002年我國加入世界貿易組織"]], "ans": "B", "exp": "西元1971年中華人民共和國取代我國進入聯合國，並在國際上主張「一個中國」原則，使我國無法以主權國家名義參與國際社會、邦交國數量一路下滑。"}, {"stem": "中華人民共和國所主張的「一個中國」原則，其內容為何 （如非洲烏干達）義診與提供醫療援助，屬於民間力量的人道援助行動，深獲國際社會肯定。"}, {"stem": "「舊鞋救命協會」運送二手鞋到非洲、鑿井供應乾淨水源、教導有機農業幫助偏鄉自立。此類作法的核心精神最接近下列何者？", "opts": [["A", "基於人道關懷提供援助，並協助當地自立"], ["B", "藉由販售商品獲取最大利潤"], ["C", "以軍事力量介入他國內政"], ["D", "促使受助國成為我國的邦交國才提供協助"]], "ans": "A", "exp": "這類非政府組織基於人權與人道關懷精神提供援助，並透過鑿井、教導農牧技術等方式協助當地居民長期自立，而非以營利或政治交換為目的。"}, {"stem": "日本發生311強震時，我國賑災捐款居世界之冠。這件事最能說明下列何者？", "opts": [["A", "我國已經成為聯合國的會員國"], ["B", "國際援助只能由政府執行"], ["C", "我國以實質貢獻與分享的方式為國際社會盡心力"], ["D", "賑災捐款屬於國際貿易的一環"]], "ans": "C", "exp": "課本強調我國參與國際社會不只爭取活動空間，更追求在國際上有實質貢獻。捐款賑災、捐贈防疫物資、舊鞋救命等都是以貢獻與分享參與國際社會的表現。"}, {"stem": "國際特赦組織所推動的「寫信馬拉松」活動，讓學生藉由寫信聲援國際上人權受侵害的人們。此活動最能培養學生的何種素養？", "opts": [["A", "提升個人在國內選舉中的投票率"], ["B", "世界公民的素養，關注國際議題並以行動參與"], ["C", "增加個人的商業投資報酬"], ["D", "學習如何以武力捍衛國家主權"]], "ans": "B", "exp": "課本指出身為地球村的一員，應從小培養世界公民素養，多關注國際議題並以實際行動參與，寫信馬拉松即是學生層級的具體國際參與行動。"}, {"stem": "西元2022年初，170多國代表於聯合國環境大會中簽訂「全球塑膠公約」，共同減少塑膠使用與生產。這個例子屬於哪一種國際互動方式？", "opts": [["A", "國際衝突"], ["B", "國際援助"], ["C", "國際交流"], ["D", "國際合作"]], "ans": "D", "exp": "各國透過簽訂條約、公約的方式共同解決塑膠汙染問題，屬於國際合作。國際合作的特徵是為共同利益與目標而結盟或締約。"}, {"stem": "西元2023年土耳其發生強烈地震，我國政府派遣搜救隊前往協助救災。這屬於下列何者？", "opts": [["A", "國際交流中的體育競賽"], ["B", "國際衝突的調解"], ["C", "基於人道關懷的國際援助"], ["D", "以貿易利益為目的的國際合作"]], "ans": "C", "exp": "派遣國際搜救隊前往受災國協助救援，是基於人權與人道關懷精神所進行的災難援助，屬國際援助的典型例子。"}, {"stem": "西元2022年俄羅斯進攻烏克蘭，造成數十萬人傷亡、百萬人逃離家園，也衝擊全球經濟。下列敘述何者最為適當？", "opts": [["A", "顯示國際衝突若以戰爭處理，影響是負面且長久的"], ["B", "顯示戰爭是解決領土爭議最理想的手段"], ["C", "顯示國際衝突不會影響其他國家"], ["D", "顯示國際組織應鼓勵各國以武力解決紛爭"]], "ans": "A", "exp": "俄烏戰爭造成大量傷亡與難民，並衝擊全球經濟市場，印證課本所言戰爭對整體人類社會的影響是負面且長久的，各國應以非暴力方式化解衝突。"}, {"stem": "當國際間發生衝突時，下列何者「不是」課本所提到的和平解決方式？", "opts": [["A", "外交談判"], ["B", "經濟制裁"], ["C", "透過國際組織調解，達成停火協議"], ["D", "出動軍隊發動戰爭"]], "ans": "D", "exp": "外交談判、經濟制裁與國際組織調解屬於非暴力的處理方式；發動戰爭則是暴力手段，會造成人員傷亡與國際社會的重大衝擊，並非和平解決之道。"}, {"stem": "我國警政署與多位外國警政首長共同討論防治跨境毒品犯罪問題。此類跨國打擊犯罪的行動屬於下列何者？", "opts": [["A", "國際援助"], ["B", "國際合作"], ["C", "國際衝突"], ["D", "國際交流"]], "ans": "B", "exp": "各國共同調查與打擊跨境恐怖活動、人口販賣、走私軍火、毒品等犯罪，是為了共同目標所進行的資金、技術與人才合作，屬於國際合作。"}, {"stem": "阿慧整理筆記時寫下：「①1949年兩岸分治　②1971年中華人民共和國取代我國進入聯合國　③1981年簽訂洛桑協議　④1991年以中華臺北名義加入APEC　⑤2002年以臺澎金馬個別關稅領域加入WTO」。下列推論何者最為正確？", "opts": [["A", "我國在國際參與受阻後，改以務實彈性的名稱與方式爭取參與空間"], ["B", "我國自1971年後便完全放棄參與所有國際組織"], ["C", "上述事件顯示我國已恢復以主權國家身分參與國際社會"], ["D", "上述事件與兩岸關係無關，純粹是經濟因素造成"]], "ans": "A", "exp": "這些事件顯示：兩岸關係與「一個中國」原則使我國無法以國名參與國際社會，但政府並未放棄，而是調整參與名稱與方式（中華臺北、臺澎金馬個別關稅領域、奧會模式）務實爭取國際空間。"}, {"stem": "身為國中生，下列哪一種作法最符合課本所強調的「以實際行動參與國際社會」？", "opts": [["A", "認為國際議題與自己無關，等長大再說"], ["B", "只關心國內新聞，避免接觸外國資訊"], ["C", "關注氣候變遷等全球議題，參與相關連署或社團，並落實環保行動"], ["D", "主張以武力回應國際上的不公平待遇"]], "ans": "C", "exp": "課本鼓勵學生培養世界公民素養：關注國際議題（如氣候變遷、性別平等、童工問題）、參加相關社團或連署、擔任親善大使或國際志工，以實際行動參與國際社會。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

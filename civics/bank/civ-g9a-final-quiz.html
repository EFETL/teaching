<script>
const QS=[{"stem": "漁夫想用自己捕到的魚，向獵人交換一張鹿皮，但獵人剛好不喜歡吃魚，交易因此無法完成。這個例子最能說明以物易物的哪一項限制？", "opts": [["A", "交換的物品容易腐壞而不易保存"], ["B", "缺乏衡量物品價值的公平標準"], ["C", "不容易找到剛好願意交換的對象"], ["D", "交換的物品無法細分、不能找零"]], "ans": "C", "exp": "以物易物必須「雙方剛好互相需要對方的東西」才能成交。獵人不想要魚，交易就談不成，屬於「難以找到適合交換對象」的限制。"}, {"stem": "漁夫和獵人都同意交換，但雙方為了「到底要用幾條魚才能換到一張鹿皮」爭論不休。這反映以物易物的哪一項缺點？", "opts": [["A", "缺乏衡量物品價值的公平標準"], ["B", "找不到願意交換的對象"], ["C", "物品體積龐大不方便攜帶"], ["D", "交易對象可能不守信用"]], "ans": "A", "exp": "以物易物時沒有共同的計價單位，魚與鹿皮的價值比例無從客觀認定，只能靠雙方喊價，缺乏公平的衡量標準。這正是後來貨幣「價值衡量」功能要解決的問題。"}, {"stem": "加拿大青年凱爾以一枚紅迴紋針在網路上刊登廣告，先後換到鉛筆、門把、爐具、雪上摩托車……歷經多次交換，花了整整一年才如願換到一棟房子。這個故事最能凸顯以物易物的什麼特色？", "opts": [["A", "交換的物品一定會愈換愈值錢"], ["B", "網路使以物易物成為現代主要的交易方式"], ["C", "以物易物完全不需要付出任何交易成本"], ["D", "必須反覆尋找交換對象，交易過程耗時費力"]], "ans": "D", "exp": "凱爾能成功是特例，重點在於他必須不斷尋找下一位願意交換的人，花了一年才達成目的，正說明以物易物「曠日廢時、耗時費力」的限制。"}, {"stem": "人們為了改善以物易物的種種不便，最先採取的做法是什麼？", "opts": [["A", "由政府立法強制規定每項物品的價格"], ["B", "尋找交易雙方都能接受的物品作為交易媒介"], ["C", "直接由中央銀行發行紙鈔與硬幣"], ["D", "成立外匯市場供人們買賣外幣"]], "ans": "B", "exp": "交易媒介的出現是為了改善以物易物的困難。人們先找出如貝殼、茶葉、金銀等「大家都願意接受」的物品當媒介，之後才進一步演變出由政府發行的紙鈔與硬幣。"}, {"stem": "早期人類曾使用貝殼、茶葉、白銀、黃金作為交易媒介，這類媒介本身也具有商品價值，因此被稱為什麼？", "opts": [["A", "商品貨幣"], ["B", "法定貨幣"], ["C", "電子貨幣"], ["D", "塑膠貨幣"]], "ans": "A", "exp": "商品貨幣是指「既可以當商品使用、也可以當貨幣使用」的物品，本身具有一定價值，因此人們願意接受。"}, {"stem": "貝殼、黃金等商品貨幣後來逐漸被硬幣與紙鈔取代，主要原因為何？", "opts": [["A", "政府立法禁止民間持有黃金與白銀"], ["B", "商品貨幣本身完全沒有價值"], ["C", "數量不敷使用，且攜帶與保存都不方便"], ["D", "商品貨幣完全無法用來清償債務"]], "ans": "C", "exp": "隨著經濟規模擴大，交易數量大增，商品貨幣的存量遠遠不足；加上大量搬運黃金白銀既笨重又難保存，因此發展出由政府發行、便於攜帶的硬幣與紙鈔。"}, {"stem": "關於「法定貨幣」的敘述，下列何者正確？", "opts": [["A", "因為本身具有商品價值，所以大家願意接受"], ["B", "由政府發行，並以法令強制規定其具有一定的價值"], ["C", "由國內各家商業銀行自行印製發行"], ["D", "價值由買賣雙方在每次交易時自行議定"]], "ans": "B", "exp": "法定貨幣是政府憑藉國家的權威與信用發行紙幣、硬幣，並以法令賦予其價值，作為社會共同接受的交易媒介。它的價值來自法令保障，而非材質本身。"}, {"stem": "在我國，法定貨幣「新臺幣」是由下列哪一個機關負責發行？", "opts": [["A", "行政院"], ["B", "財政部"], ["C", "臺灣銀行"], ["D", "中央銀行"]], "ans": "D", "exp": "我國的新臺幣由中央銀行發行。中央銀行同時負責穩定金融、健全銀行業務、保管黃金與管理外匯市場等任務。"}, {"stem": "中央銀行常被稱為「銀行中的銀行」，下列敘述何者最能說明這個稱呼的意義？", "opts": [["A", "中央銀行的往來對象僅限政府與金融機構，一般民眾不能到中央銀行存款或借款"], ["B", "中央銀行是我國規模最大的商業銀行，分行遍布全國"], ["C", "中央銀行的主要業務是為民眾核發信用卡"], ["D", "中央銀行負責徵收各縣市的地方稅"]], "ans": "A", "exp": "中央銀行與一般銀行最大的不同在於服務對象：民眾不能在中央銀行辦理存放款業務，它往來的對象只有政府機關與各金融機構，因此被稱為「銀行中的銀行」。"}, {"stem": "下列哪一項屬於中央銀行的主要職責？", "opts": [["A", "為民眾審核並核發信用卡的信用額度"], ["B", "管理外匯市場、維持幣值與金融的穩定"], ["C", "決定市場上各項商品的價格"], ["D", "審理民眾積欠卡債所引發的訴訟"]], "ans": "B", "exp": "中央銀行的任務包括發行新臺幣、穩定金融、健全銀行業務、保管黃金與管理外匯市場。核發信用卡是商業銀行的業務，商品訂價由市場決定，審判則屬法院職權。"}, {"stem": "我國曾有社區自行發行「社區貨幣」，希望促進社區成員互助，但大多數居民仍習慣使用新臺幣付款，社區貨幣運作數年後便宣布暫停。這顯示社區貨幣缺乏貨幣的哪一項特性？", "opts": [["A", "價值儲存"], ["B", "債務清償"], ["C", "價值衡量"], ["D", "普遍接受性"]], "ans": "D", "exp": "一項物品要成為貨幣，最重要的前提是買賣雙方都願意接受它，也就是「普遍接受性」。社區貨幣因為多數居民不使用，缺乏普遍接受性而失敗。"}, {"stem": "辛巴威曾發行面額極高的鈔票，但幣值卻極低，民眾買一點東西就得帶著一大疊鈔票出門，生活大受影響。這個例子說明貨幣必須具備下列哪一項特性？", "opts": [["A", "普遍接受性"], ["B", "可以細分找零"], ["C", "價值穩定性"], ["D", "材質堅固耐用"]], "ans": "C", "exp": "貨幣的價值如果劇烈波動，人們接受它的意願就會降低，交易也難以進行。辛巴威的例子正是幣值不穩定的極端後果，說明貨幣必須具備「價值穩定性」。"}, {"stem": "除了物價漲跌之外，影響一國貨幣價值的另一個主要原因是什麼？", "opts": [["A", "貨幣的發行量；發行量超過市場流通所需時，物價會上漲、幣值下跌"], ["B", "貨幣的材質；改用金屬鑄幣一定會使幣值上升"], ["C", "中央銀行行員的人數多寡"], ["D", "鈔票印刷的顏色與圖案設計"]], "ans": "A", "exp": "課本指出，影響貨幣價值的主因除了物價，就是貨幣發行量。當發行量超過市場流通所需，錢變多而商品沒有變多，物價就會上漲，同樣金額能買到的東西變少，代表幣值下降。"}, {"stem": "一國貨幣的價值是用什麼方式來衡量的？", "opts": [["A", "以印製鈔票所花費的成本來決定"], ["B", "以相同金額的貨幣所能購買的產品數量來決定"], ["C", "以中央銀行的資本額大小來決定"], ["D", "以鈔票面額數字的大小來決定"]], "ans": "B", "exp": "貨幣的價值就是它的購買力。能買到的東西變多代表升值，變少代表貶值。面額大小或印製成本都不能代表幣值高低。"}, {"stem": "阿強每個月打工收入固定為10,000元。去年這筆錢可以買到100個便當，今年卻只能買到80個。下列判斷何者正確？", "opts": [["A", "貨幣升值，阿強的購買力提高"], ["B", "便當的品質一定比去年好"], ["C", "貨幣貶值，阿強的購買力下降"], ["D", "阿強的收入金額比去年減少了"]], "ans": "C", "exp": "收入金額沒變，但同樣的10,000元能買到的便當變少，代表貨幣所能購買的產品數量減少，也就是貨幣貶值、購買力下降。"}, {"stem": "當人們用相同金額的貨幣，所能購買的產品數量比以前「增加」時，代表下列何種情形？", "opts": [["A", "貨幣貶值"], ["B", "物價普遍上漲"], ["C", "中央銀行大量增加貨幣發行量"], ["D", "貨幣升值"]], "ans": "D", "exp": "同樣的錢買得到更多東西，表示貨幣的購買力提高，即貨幣升值；此時通常伴隨物價下跌，而非上漲。"}, {"stem": "貨幣具有交易媒介、價值衡量、價值儲存與債務清償等功能。其中被視為貨幣「最主要」的功能是下列何者？", "opts": [["A", "價值儲存"], ["B", "交易媒介"], ["C", "債務清償"], ["D", "價值衡量"]], "ans": "B", "exp": "發明貨幣的主要目的就是促進交易。以貨幣作為買賣行為的支付工具，讓雙方不必事事以物易物就能達成交易，這是貨幣最主要的功能。"}, {"stem": "小美走進書店，看到每一本書都標示著價格，因此能夠比較不同書籍價值的高低。這展現貨幣的哪一項功能？", "opts": [["A", "價值衡量"], ["B", "交易媒介"], ["C", "價值儲存"], ["D", "債務清償"]], "ans": "A", "exp": "貨幣作為共同的計價單位，使各種財貨與勞務都能以一致的標準表示價值，方便人們比較，這就是「價值衡量」功能。"}, {"stem": "王奶奶把每月省下的錢存進銀行，準備將來生病時支付醫療費用。這主要展現貨幣的哪一項功能？", "opts": [["A", "交易媒介"], ["B", "價值衡量"], ["C", "價值儲存"], ["D", "債務清償"]], "ans": "C", "exp": "以貨幣的形式把財富保存下來，不會像食物或物品那樣隨時間腐壞折損，日後仍可用來交換商品與勞務，這是貨幣的「價值儲存」（價值儲藏）功能。"}, {"stem": "李先生每個月以現金繳納房屋貸款，逐步還清當初向銀行借的款項。這主要展現貨幣的哪一項功能？", "opts": [["A", "價值衡量"], ["B", "交易媒介"], ["C", "價值儲存"], ["D", "債務清償"]], "ans": "D", "exp": "貨幣可以作為計算及清償債務的工具，債務契約通常以貨幣記載金額，日後也以貨幣償還，這就是「債務清償」功能。"}, {"stem": "阿華拿1,000元到超市買了一箱牛奶，店員收下鈔票、交付商品，交易順利完成。就貨幣功能而言，這1,000元在此發揮的是什麼功能？", "opts": [["A", "價值儲存"], ["B", "交易媒介"], ["C", "債務清償"], ["D", "普遍接受性"]], "ans": "B", "exp": "錢在此扮演「一手交錢、一手交貨」的支付工具角色，使買賣得以完成，屬於交易媒介功能。要注意「普遍接受性」是貨幣的**特性**而非**功能**，必須加以區辨。"}, {"stem": "小婷把打工賺來的薪水存進帳戶，計畫兩年後用來買一輛機車。這筆存款所發揮的貨幣功能，與下列何者相同？", "opts": [["A", "爺爺把退休金存起來，準備日後翻修老家"], ["B", "媽媽用現金在市場買了一把青菜"], ["C", "小明比較兩款手機的標價後決定買便宜的那款"], ["D", "爸爸按月以現金償還向親戚借的10萬元"]], "ans": "A", "exp": "題幹是把財富以貨幣形式保存供未來使用，屬於「價值儲存」。(A) 同樣是存錢供將來使用；(B) 為交易媒介、(C) 為價值衡量、(D) 為債務清償。"}, {"stem": "小陳向朋友借了5萬元，雙方訂立契約，約定一年後以新臺幣5萬元加計利息歸還。契約中以貨幣記載金額並作為日後清償的計算標準，這展現貨幣的哪一項功能？", "opts": [["A", "交易媒介"], ["B", "價值衡量"], ["C", "價值儲存"], ["D", "債務清償"]], "ans": "D", "exp": "現今各項債務契約多以貨幣記載，貨幣可以作為延遲支付的標準，也是未來清償債務時的計算與支付工具，屬於債務清償功能。"}, {"stem": "政府發行的振興消費券規定必須在期限內使用完畢，逾期即作廢，因此不能算是貨幣。就貨幣功能而言，它最欠缺的是下列何者？", "opts": [["A", "交易媒介"], ["B", "價值衡量"], ["C", "價值儲存"], ["D", "債務清償"]], "ans": "C", "exp": "振興券可以拿來買東西（具有交易媒介的作用），但因有使用期限、無法長期保存價值，缺乏價值儲存的功能；加上它並非中央銀行發行的法定貨幣，性質較接近禮券。"}, {"stem": "關於貨幣的功能與特性，下列敘述何者正確？", "opts": [["A", "貨幣作為共同的計價單位，使各種財貨與勞務有一致的衡量標準"], ["B", "價值儲存功能是指人們必須把貨幣拿去投資股票才能保值"], ["C", "交易媒介功能是指貨幣可以用來計算並清償債務"], ["D", "貨幣一旦由政府發行，其價值就永遠不會變動"]], "ans": "A", "exp": "(B) 價值儲存是指以貨幣形式保存財富供日後使用，與是否投資無關；(C) 清償債務屬於債務清償功能；(D) 貨幣價值會隨物價與發行量而變動，因此才需要中央銀行維持幣值穩定。"}, {"stem": "悠遊卡、一卡通等儲值卡的使用方式，屬於下列何者？", "opts": [["A", "先消費，後付款"], ["B", "先儲值，後消費"], ["C", "由發卡銀行先行代墊款項"], ["D", "消費後完全不必再以貨幣支付"]], "ans": "B", "exp": "儲值卡是一種「預付」制度，消費者必須先把現金存入卡片中，才能持卡消費，多用於小額支付或搭乘大眾運輸工具。"}, {"stem": "小明持悠遊卡準備搭捷運，卻因卡片餘額不足而無法進站。這最能說明儲值卡的什麼特性？", "opts": [["A", "車資會由發卡銀行先代墊，日後再向小明請款"], ["B", "儲值卡具備完整的貨幣功能"], ["C", "卡片內必須先存有足夠金額才能完成交易"], ["D", "儲值卡可以無限制透支使用"]], "ans": "C", "exp": "儲值卡是「先儲值、後消費」，當卡內沒有儲值金或餘額不足時就無法交易，這正是它與信用卡最關鍵的差別。"}, {"stem": "關於信用卡的性質，下列敘述何者正確？", "opts": [["A", "使用前必須先將現金儲值到卡片中"], ["B", "信用卡是我國的法定貨幣之一"], ["C", "由中央銀行統一核發給全體國民"], ["D", "由發卡銀行先代墊消費款項，持卡人再於約定期限內償還"]], "ans": "D", "exp": "信用卡不必預存金額，持卡人刷卡時由發卡銀行先代為支付款項，之後持卡人再依約定期限清償，具有延遲支付（先消費後付款）的功能。"}, {"stem": "從持卡人刷卡消費，到帳單繳款完成之前，持卡人與發卡銀行之間處於什麼狀態？", "opts": [["A", "持卡人屬於欠債未還的狀態，待付款完成才還清欠款"], ["B", "持卡人已完成清償，不再負擔任何債務"], ["C", "發卡銀行成為持卡人的債務人"], ["D", "由店家承擔全部的付款責任"]], "ans": "A", "exp": "刷卡時由銀行先代墊款項，等於持卡人向銀行借錢消費，因此在繳清帳單之前，持卡人一直處於負債狀態。"}, {"stem": "儲值卡與信用卡最關鍵的差異是下列何者？", "opts": [["A", "儲值卡是塑膠材質，信用卡是紙製材質"], ["B", "儲值卡由銀行發行，信用卡由政府發行"], ["C", "儲值卡須先存入金額才能使用，信用卡則不須先存入"], ["D", "儲值卡可以用來清償債務，信用卡則不行"]], "ans": "C", "exp": "兩者都是不必攜帶現金的「塑膠貨幣」，最大差別在付款順序：儲值卡「先儲值、後消費」，信用卡「先消費、後付款」。兩者都不是政府發行，也都不具完整的貨幣功能。"}, {"stem": "新聞報導指出，部分年輕人因刷卡消費超出自身還款能力，長期積欠卡債而淪為「卡奴」。這種現象最主要與信用卡的哪一項特性有關？", "opts": [["A", "信用卡必須先儲值才能使用"], ["B", "信用卡具有「先消費後付款」的延遲支付功能"], ["C", "信用卡是中央銀行發行的法定貨幣"], ["D", "信用卡消費之後完全不必償還"]], "ans": "B", "exp": "因為刷卡當下不必立刻拿出現金，容易讓人低估自己的支出而過度消費；到了繳款期限若無力清償，就會累積債務淪為卡奴。因此簽訂信用卡合約前，應先確認自己具備還款能力。"}, {"stem": "持卡人收到信用卡帳單後，若未能在期限內全額繳清，最可能面臨下列何種後果？", "opts": [["A", "發卡銀行會自動免除其剩餘債務"], ["B", "由政府編列預算代為償還"], ["C", "可以無限期延後付款，且不必支付任何費用"], ["D", "累積債務，並被發卡銀行收取高額的循環利息"]], "ans": "D", "exp": "未全額繳清的部分不僅成為債務，發卡銀行還會收取高額利息（循環利息），使欠款愈滾愈多，這也是卡債問題難以脫身的原因。"}, {"stem": "銀行在核發信用卡時，會依據申請人的什麼條件來決定其信用額度？", "opts": [["A", "申請人的身高與體重"], ["B", "申請人居住的縣市"], ["C", "申請人的財務狀況與信用紀錄"], ["D", "申請人所使用的手機品牌"]], "ans": "C", "exp": "發卡銀行會評估每個人的財務狀況與過往信用紀錄，核給一定的信用額度。信用紀錄良好的人較容易取得較高的額度與較優惠的貸款條件。"}, {"stem": "關於儲值卡、信用卡與行動支付，下列敘述何者正確？", "opts": [["A", "三者都不具備完整的貨幣功能，最終仍須以貨幣支付款項"], ["B", "三者都是中央銀行發行的法定貨幣"], ["C", "使用這些工具消費後，就不必再以貨幣清償款項"], ["D", "三者都必須先將現金儲值進去才能使用"]], "ans": "A", "exp": "這些新型態支付工具只是「改變支付的方式」，讓交易更便利，本身並不具備完整的貨幣功能，最後仍必須以法定貨幣結清款項。信用卡與行動支付都不需要先儲值。"}, {"stem": "關於「行動支付」的敘述，下列何者最為正確？", "opts": [["A", "指用現金向行動攤販購物的方式"], ["B", "將手機等行動裝置作為支付工具（例如作為信用卡載具），以掃描或感應方式完成付款"], ["C", "指銀行行員到府收取款項的服務"], ["D", "是中央銀行發行的電子形式法定貨幣"]], "ans": "B", "exp": "行動支付是把實體支付工具與行動裝置結合，透過掃描或感應 QR Code 完成付款。它背後仍連結信用卡或帳戶，最終還是以貨幣支付，並非新的法定貨幣。使用時要小心行動裝置遺失或中毒造成個資外洩。"}, {"stem": "關於「電子支付」（如 LINE Pay、街口支付、悠遊付等），下列敘述何者正確？", "opts": [["A", "必須由中央銀行親自經營才能開辦"], ["B", "完全沒有任何政府機關負責管理"], ["C", "只能用於購買國外進口的商品"], ["D", "須經金融監督管理委員會許可，且擁有獨立帳戶可供交易或轉帳"]], "ans": "D", "exp": "電子支付是經金管會許可，以網路或電子支付平臺為中介的支付方式，具有獨立帳戶，可用來交易或轉帳。其主管機關是金管會，而非中央銀行。"}, {"stem": "下列哪一項是安全使用新型態支付工具的正確做法？", "opts": [["A", "取消手機或電腦上「自動登入」與「記住密碼」的設定"], ["B", "看到店家的 QR Code 就直接掃描，以免錯過優惠"], ["C", "收到「密碼失效、請立即更新」的簡訊時，馬上點擊連結更新"], ["D", "更換手機時直接轉賣，不必刪除原有的支付資料"]], "ans": "A", "exp": "專家建議取消自動登入與記住密碼，以免手機遺失或借人時密碼遭竊。QR Code 與短連結可能藏有病毒或木馬，要求變更密碼的簡訊多為詐騙，應先向相關單位確認；換手機也務必刪除資料。"}, {"stem": "阿凱打算換一支新手機，也順便更換手機門號。就個資與支付安全而言，他應該怎麼做？", "opts": [["A", "舊手機不必處理，資料放久了會自動消失"], ["B", "換門號後銀行會自動更新資料，不必主動通知"], ["C", "舊手機資料應刪除並恢復原廠設定，換門號也要向銀行註銷及更新行動支付相關資料"], ["D", "只要手機沒有遺失，就完全不會有個資外洩的風險"]], "ans": "C", "exp": "手機裡存有大量支付相關個資，換機時必須清除資料並恢復原廠設定；更換門號後也要主動向銀行辦理註銷與更新，避免驗證簡訊被他人接收而造成盜刷或個資外洩。"}, {"stem": "小華未經同意，拿走同學的信用卡刷卡購物。依課本所述，他的行為可能觸犯刑法的哪一項罪名？", "opts": [["A", "妨害電腦使用罪"], ["B", "詐欺罪"], ["C", "背信罪"], ["D", "竊盜罪"]], "ans": "D", "exp": "盜用他人的信用卡或儲值卡消費會觸犯刑法的竊盜罪，須負刑事責任；若是自己偽造卡片來消費，則構成詐欺罪，兩者要分清楚。"}, {"stem": "阿德自行偽造信用卡到商店消費，成功騙過店家取得商品。他的行為會觸犯刑法的哪一項罪名？", "opts": [["A", "竊盜罪"], ["B", "詐欺罪"], ["C", "妨害電腦使用罪"], ["D", "屬於民事糾紛，不必負刑事責任"]], "ans": "B", "exp": "使用偽造的信用卡或儲值卡消費，是以詐術使店家陷於錯誤而交付財物，觸犯刑法的詐欺罪，須負刑事責任。"}, {"stem": "小林積欠大筆信用卡卡債無力償還，銀行有權向法院請求強制其償還欠款。就法律責任的類型而言，小林所負的是下列何者？", "opts": [["A", "刑事責任"], ["B", "行政責任"], ["C", "民事責任"], ["D", "完全不必負任何責任"]], "ans": "C", "exp": "單純積欠卡債屬於私人之間的債務糾紛，是民法上的債務不履行，須負民事責任；只有偽造或盜用卡片等行為，才會另外構成刑事責任。"}, {"stem": "課本所稱的「外匯」，是指下列何者？", "opts": [["A", "作為國際支付工具的外國貨幣"], ["B", "中央銀行為紀念節日而發行的紀念幣"], ["C", "國內各銀行之間互相轉帳的工具"], ["D", "政府為振興經濟而發行的消費券"]], "ans": "A", "exp": "各國有各自的貨幣，從事國際貿易時必須使用對方能接受的貨幣，這些作為國際支付工具的外國貨幣就稱為外匯，其中國際間最常使用的是美金。"}, {"stem": "「匯率」指的是下列何者？", "opts": [["A", "一國物價在一年內上漲的比率"], ["B", "兩國貨幣互相兌換的比率"], ["C", "銀行放款時所收取的利息比率"], ["D", "進出口貨物所要繳納的關稅稅率"]], "ans": "B", "exp": "匯率是一國貨幣與他國貨幣交換的比率。例如美元兌新臺幣匯率為1:30，表示1美元可兌換30元新臺幣。大多數國家的匯率由外匯市場的供給與需求決定。"}, {"stem": "下列哪一種人最可能到銀行「購買」外幣？", "opts": [["A", "來臺灣觀光、想把美元換成新臺幣花用的日本旅客"], ["B", "把成衣賣到美國、收到大筆美元貨款的臺灣出口商"], ["C", "來臺就學、需要把外幣換成新臺幣繳學費的留學生"], ["D", "準備從日本進口汽車零件、須以日圓付款的進口商"]], "ans": "D", "exp": "進口商必須用外幣支付國外貨款，因此會買外幣；出國旅遊、留學或到國外投資的人也會買外幣。相對的，出口商與來臺觀光、就學的外國人則是賣外幣。"}, {"stem": "下列哪一種人最可能到銀行「賣出」外幣？", "opts": [["A", "將工具機外銷到美國、收到美元貨款的臺灣出口商"], ["B", "準備全家到日本旅遊的臺灣民眾"], ["C", "從紐西蘭進口水果到臺灣販售的進口商"], ["D", "打算到美國留學、要繳交學費的臺灣學生"]], "ans": "A", "exp": "出口商賺得的外幣不能直接在國內使用，必須到銀行兌換成新臺幣，屬於賣出外幣；(B)(C)(D) 都需要取得外幣，屬於買入外幣的一方。買賣外幣須透過政府指定辦理外匯業務的銀行。"}, {"stem": "若美元兌新臺幣的匯率由1:30變成1:32，代表下列何種情形？", "opts": [["A", "新臺幣升值，美元貶值"], ["B", "新臺幣與美元的價值都沒有改變"], ["C", "新臺幣貶值，美元升值"], ["D", "新臺幣升值，美元也同時升值"]], "ans": "C", "exp": "原本30元新臺幣就能換到1美元，現在要32元才能換到，代表新臺幣變得比較「不值錢」，即新臺幣貶值、美元升值。判讀口訣：換1美元要付出的新臺幣變多＝新臺幣貶值。"}, {"stem": "美元兌新臺幣的匯率由1:31變為1:29。這項變動對下列何者最為有利？", "opts": [["A", "把工具機賣到美國、賺取美元貨款的臺灣出口商"], ["B", "從美國進口牛肉到臺灣販售的進口商"], ["C", "剛從美國打工回臺、想把美元換成新臺幣的人"], ["D", "已把商品報價給美國客戶、準備出貨的臺灣製造廠"]], "ans": "B", "exp": "換1美元只要29元新臺幣，比原來的31元少，代表新臺幣升值。新臺幣升值時，用較少的新臺幣就能買到同樣的外幣，進口成本下降，因此有利進口、不利出口。"}, {"stem": "當新臺幣對美元「貶值」時，下列敘述何者正確？", "opts": [["A", "有利我國進口，不利我國出口"], ["B", "對我國的進口與出口都同樣有利"], ["C", "出國旅遊的臺灣民眾會覺得比以前划算"], ["D", "有利我國出口，不利我國進口"]], "ans": "D", "exp": "新臺幣貶值代表「臺灣錢變小」：外國人用同樣的外幣可買到更多臺灣商品，國外訂單增加，有利出口；但我國向國外買東西要付出更多新臺幣，進口成本上升，出國旅遊也變貴。"}, {"stem": "我國進口商從美國進口一輛在當地售價 US$20,000 的汽車。若當時匯率為1美元兌33元新臺幣，換算成新臺幣的價格為多少？", "opts": [["A", "660,000元"], ["B", "600,000元"], ["C", "630,000元"], ["D", "690,000元"]], "ans": "A", "exp": "20,000 × 33 = 660,000（元）。若匯率變成1:30，同一輛車只需 20,000 × 30 = 600,000元，可見新臺幣升值會使進口成本下降。"}, {"stem": "我國出口一臺在臺灣售價 NT$33,000 的筆記型電腦到美國。若匯率由1:33變成1:30，該筆電在美國的售價會如何變化？", "opts": [["A", "由 US$1,000 降為 US$900，有利我國出口"], ["B", "由 US$1,000 升為 US$1,100，較不利我國出口"], ["C", "由 US$1,100 降為 US$1,000，有利我國出口"], ["D", "售價維持不變，對出口沒有影響"]], "ans": "B", "exp": "33,000 ÷ 33 = US$1,000；33,000 ÷ 30 = US$1,100。匯率由33降到30代表新臺幣升值，我國商品換算成美元後變貴，在美國市場的價格競爭力下降，因此不利出口。"}, {"stem": "課本指出，「勞動」是指人們運用自己的心力或體力，創造出能滿足自己或他人需求的事物。根據此定義，下列敘述何者最正確？", "opts": [["A", "只有領取薪水的工作才能稱為勞動"], ["B", "勞動可以增進個人、家庭或社會的福祉"], ["C", "勞動必須在工廠或辦公室中進行才算數"], ["D", "勞動只包含體力的付出，不包含心力的付出"]], "ans": "B", "exp": "勞動是運用心力或體力創造出滿足自己或他人需求的事物，目的在增進個人、家庭或社會的福祉。心力與體力的付出都算勞動，也不限定場所，更不限於有酬的工作。"}, {"stem": "小美到便利商店打工，每月領取薪資。她所從事的勞動又可稱為下列何者？", "opts": [["A", "無酬勞動"], ["B", "非市場勞動"], ["C", "市場勞動"], ["D", "志願勞動"]], "ans": "C", "exp": "人們在市場中提供勞動以換取工資、佣金、獎金等實質報酬，稱為「有酬勞動」，又稱「市場勞動」。小美領取薪資，屬於市場勞動。"}, {"stem": "下列何者屬於「有酬勞動（市場勞動）」？", "opts": [["A", "賢哲擔任專職居家服務員，領取月薪照顧失能老人"], ["B", "小華在家幫媽媽洗碗、拖地"], ["C", "阿明利用假日到海邊擔任淨灘志工"], ["D", "佳佳照顧生病的奶奶，未收取任何費用"]], "ans": "A", "exp": "判斷是否為市場勞動的關鍵在於「有沒有獲得實質報酬」。賢哲受僱擔任居家服務員並領取月薪，屬於市場勞動；(B)(D) 為家務勞動，(C) 為志工服務，都屬無酬勞動。"}, {"stem": "關於「無酬勞動」的敘述，下列何者正確？", "opts": [["A", "因為沒有報酬，所以對社會沒有任何貢獻"], ["B", "無酬勞動又稱為市場勞動"], ["C", "其價值可以清楚地用市場價格標示出來"], ["D", "其價值不容易以市場價格衡量，貢獻常被忽略"]], "ans": "D", "exp": "無酬勞動又稱「非市場勞動」，雖然同樣具有價值，但因為價值不容易以市場上的價格標示，對社會生活的重要性與貢獻反而常被忽略。"}, {"stem": "環保志工利用假日到海邊淨灘，雖然沒有領到任何酬勞，卻讓環境變得更好。這個例子最能說明下列何者？", "opts": [["A", "志工服務屬於市場勞動的一種"], ["B", "沒有報酬的付出就不能稱為勞動"], ["C", "無酬勞動同樣能創造價值，讓社會生活更多元"], ["D", "志工必須先向政府申請登記才算勞動"]], "ans": "C", "exp": "從事志工服務雖然不能獲得實質報酬，但可讓社會生活更多元，說明無酬勞動一樣具有價值，值得肯定。"}, {"stem": "下列何者「不是」市場勞動對個人或社會的重要性？", "opts": [["A", "使家庭成員的生活起居獲得照料，讓家庭得以正常運作"], ["B", "獲取收入，提供家庭經濟來源"], ["C", "增進消費能力，支付家庭生活開銷"], ["D", "實踐個人的理想與抱負"]], "ans": "A", "exp": "(A) 描述的是「家務勞動」的功能，屬於無酬勞動。(B)(C)(D) 才是市場勞動對個人的重要性。"}, {"stem": "若一個社會的勞動力充足、失業人口少，最可能產生下列何種結果？", "opts": [["A", "政府必須大量發放失業給付"], ["B", "家務勞動將完全被市場勞動取代"], ["C", "企業因人力過剩而紛紛倒閉"], ["D", "人力資源充分發揮，提升國家的生產力與競爭力"]], "ans": "D", "exp": "課本指出，勞動力充足或失業人口少，能使人力資源充分發揮，有助於提升國家生產力與競爭力、促進經濟發展，甚至減少嚴重的社會問題。"}, {"stem": "自己開店當老闆的阿東，每天忙進忙出並從中獲取利潤。關於阿東的勞動，下列判斷何者正確？", "opts": [["A", "因為沒有領薪水，所以屬於無酬勞動"], ["B", "屬於市場勞動，因為他從勞動中獲得了實質報酬"], ["C", "屬於家務勞動，因為店是自己開的"], ["D", "屬於志願服務，因為沒有人僱用他"]], "ans": "B", "exp": "市場勞動包括雇主與受僱者所提供的勞動。自己當老闆可獲取利潤，同樣是從勞動中取得實質報酬，屬於有酬的市場勞動。"}, {"stem": "課本提到，料理三餐、清掃家裡、養育子女等家務勞動，能讓家人專心投入工作。這最能說明家務勞動與市場勞動之間是什麼關係？", "opts": [["A", "互相競爭、彼此排斥"], ["B", "完全無關、各自獨立"], ["C", "相輔相成、彼此互補"], ["D", "家務勞動的價值一定高於市場勞動"]], "ans": "C", "exp": "家務勞動提供家庭成員生理與心理的照顧，使勞動者能專心投入工作，維持市場勞動的穩定運作，兩者相輔相成、同等重要。"}, {"stem": "王家因為長輩需要照顧，於是聘請居家服務員到家中協助照料，並支付費用。這種現象稱為下列何者？", "opts": [["A", "家務勞動市場化"], ["B", "勞資爭議"], ["C", "就業歧視"], ["D", "零工經濟"]], "ans": "A", "exp": "原本由家人無償承擔的家務工作，改由付費僱人完成，使做家事變成市場勞動，這種現象稱為「家務勞動市場化」。"}, {"stem": "下列何者「最不」屬於「家務勞動市場化」的例子？", "opts": [["A", "委託長期照護中心協助照顧失能老人"], ["B", "僱用外籍看護照顧行動不便的爺爺"], ["C", "請清潔公司到家中打掃環境"], ["D", "全家人利用週末一起動手大掃除"]], "ans": "D", "exp": "(A)(B)(C) 都是把家務工作交由他人有償提供，屬於家務勞動市場化。(D) 家人自己動手且未支付報酬，仍屬無酬的家務勞動。"}, {"stem": "「只要是在家裡從事家務勞動，就一定是無酬勞動。」這句話是否正確？", "opts": [["A", "正確，只要在家中做事就一定沒有報酬"], ["B", "不正確，若受僱於人到他人家中打掃或照顧幼兒並領取報酬，即屬市場勞動"], ["C", "正確，因為家裡並不是職場"], ["D", "不正確，因為家務工作根本不能算是勞動"]], "ans": "B", "exp": "判斷關鍵在於「有無獲得實質報酬」，而非工作地點。受僱於人在他人家中從事清掃、照顧幼兒或老人並獲取報酬，屬於市場勞動。"}, {"stem": "下列何者是造成「家務勞動市場化」現象日益普遍的主要原因？", "opts": [["A", "國人平均壽命延長、家庭結構改變，使照護需求增加"], ["B", "政府立法禁止家庭成員自行做家事"], ["C", "家務勞動已被法律列為違法行為"], ["D", "家務勞動對家庭的價值已完全消失"]], "ans": "A", "exp": "隨著國人平均壽命延長、家庭結構改變，愈來愈多家庭將家務與照護工作委託他人，協助家庭照護的產業因而興起。"}, {"stem": "依課本定義，「勞動力」包括下列哪些人？", "opts": [["A", "只包括就業者"], ["B", "只包括失業者"], ["C", "包括就業者與失業者"], ["D", "包括全國所有的人民"]], "ans": "C", "exp": "勞動力包括就業者與失業者兩類，兩者的共同點是都具有工作能力與工作意願，且都有在找尋工作。"}, {"stem": "下列何者最符合課本對「就業者」的定義？", "opts": [["A", "12歲的小學生每天幫忙做家事"], ["B", "20歲的阿凱有工作能力與意願，求職後順利受僱於便利商店"], ["C", "30歲的阿德有工作能力，但完全不想工作，也沒有找工作"], ["D", "70歲的爺爺退休後在家含飴弄孫"]], "ans": "B", "exp": "就業者是指15歲以上有工作能力與工作意願，且有找尋工作並能找到工作的人。(C) 缺乏工作意願、未找工作，(A)(D) 也不符合條件。"}, {"stem": "阿豪具備工作能力與工作意願，這兩個月不斷投遞履歷、四處求職，卻仍未找到工作。依課本定義，阿豪屬於下列何者？", "opts": [["A", "就業者"], ["B", "雇主"], ["C", "志工"], ["D", "失業者"]], "ans": "D", "exp": "失業者是指有工作能力與工作意願，且有找尋工作，卻找不到工作的人。阿豪符合此定義，且他仍屬於「勞動力」的一部分。"}, {"stem": "依課本說明，「就業者」除了要有工作能力與工作意願、有找尋工作並能找到工作之外，還須符合下列哪項條件？", "opts": [["A", "年滿15歲以上"], ["B", "年滿18歲以上"], ["C", "年滿20歲以上"], ["D", "沒有任何年齡限制"]], "ans": "A", "exp": "課本定義就業者是指「15歲以上」有工作能力與工作意願，且有找尋工作並能找到工作的人。"}, {"stem": "在勞動市場中，關於勞動力的供給與需求，下列敘述何者正確？", "opts": [["A", "雇主是勞動力的提供者，勞工是勞動力的需求者"], ["B", "雇主與勞工都是勞動力的需求者"], ["C", "雇主是勞動力的需求者，勞工是勞動力的提供者"], ["D", "政府是勞動市場上唯一的勞動力需求者"]], "ans": "C", "exp": "勞動市場中，老闆（雇主）僱用人力，是勞動力的需求者；勞工提供智能或體力，是勞動力的提供者（供給者）。"}, {"stem": "受僱者在選擇工作時，除了薪資待遇之外，通常還會考量下列哪些條件？", "opts": [["A", "只考量老闆的長相與個性"], ["B", "工作環境、工作時間、穩定度、學習機會與升遷管道"], ["C", "公司距離火車站遠近是唯一的考量"], ["D", "只需考量公司在社會上的知名度"]], "ans": "B", "exp": "受僱者為了讓自己的付出獲得最好的報酬，選擇工作時除薪資待遇外，還會考量工作環境、工作時間、工作穩定度、學習機會及升遷管道等條件。"}, {"stem": "雇主從事生產的主要目的是獲取利潤，因此在僱用員工時，最主要的考量是下列何者？", "opts": [["A", "員工的家庭背景是否顯赫"], ["B", "員工的宗教信仰是否與自己相同"], ["C", "員工是否與自己來自同一個故鄉"], ["D", "員工的專業能力與工作態度，希望能帶來最大效益"]], "ans": "D", "exp": "員工薪資是生產成本之一，雇主會考量受僱者的專業能力與工作態度，希望其能為公司創造最大效益。以與工作能力無關的因素作為條件，反而可能構成就業歧視。"}, {"stem": "課本指出勞資雙方常處於「權力不對等」的狀態，其主要原因為何？", "opts": [["A", "雇主握有薪資發放與聘僱決定的權力，常單方面決定工作時數與場所"], ["B", "勞工的人數遠遠少於雇主的人數"], ["C", "法律明文規定雇主的地位高於勞工"], ["D", "勞工依法不需要與雇主簽訂勞動契約"]], "ans": "A", "exp": "勞資雙方在法律地位上平等，但因雇主握有薪資發放權與聘僱決定權，常單方面決定工作時數、場所及在職進修等事項，使勞工在契約關係中處於相對弱勢。"}, {"stem": "關於「勞動契約」的敘述，下列何者正確？", "opts": [["A", "只要勞雇雙方都同意，內容就可以低於勞動基準法的標準"], ["B", "契約內容雖可自由約定，但勞動基本權益不得低於勞動基準法的最低標準"], ["C", "勞動契約只需要雇主單方面簽名即可生效"], ["D", "勞動契約一律由政府代替勞工與雇主簽訂"]], "ans": "B", "exp": "勞動基準法規定的是勞動條件的「最低標準」。勞動契約內容雖可自由約定，但不得低於該法標準，以保障勞工權益。"}, {"stem": "某公司徵才廣告註明「限男性、未婚、35歲以下」。這種以與工作能力無關的因素作為僱用條件的行為，稱為下列何者？", "opts": [["A", "勞資爭議"], ["B", "職業災害"], ["C", "家務勞動市場化"], ["D", "就業歧視"]], "ans": "D", "exp": "雇主如果以族群、性別、年齡、婚姻或身心障礙等與工作能力無關的因素，作為招募、升遷、訓練、福利或解僱的條件，就構成就業歧視。"}, {"stem": "下列何種情形最可能構成「就業歧視」？", "opts": [[" {"stem": "「勞動尊嚴」由國際勞工組織（ILO）於西元1999年提出，並被聯合國永續發展目標第8項納入。依課本說明，獲得勞動尊嚴的基礎為何？", "opts": [["A", "雇主個人的善意與同情"], ["B", "勞工在同一家公司的年資長短"], ["C", "合理的報酬"], ["D", "企業規模的大小"]], "ans": "C", "exp": "聯合國永續發展目標第8項「勞動尊嚴和經濟增長」指出，合理的報酬是獲得勞動尊嚴的基礎，勞動者應能透過工作賺取收入並享有工作尊嚴。"}, {"stem": "雇主以合理的待遇與員工福利留住優秀人才、凝聚員工向心力，並在經營時遵循法律與道德規範、善盡社會責任。這種表現稱為下列何者？", "opts": [["A", "企業倫理"], ["B", "工作倫理"], ["C", "就業歧視"], ["D", "勞資爭議"]], "ans": "A", "exp": "企業倫理是指業者經營企業時遵循法律與道德規範、善盡社會責任；「工作倫理」則是指個人從事職業活動時應遵守的行為規範，主體是勞動者本人，兩者不可混淆。"}, {"stem": "除了政府立法保障之外，下列何者也有助於改善勞資之間權力不對等的關係？", "opts": [["A", "勞工放棄爭取自身權益，全部聽從雇主安排"], ["B", "在教育中加強勞動知能的學習，提升民眾的勞動意識"], ["C", "政府完全不介入勞資關係，一切交由市場自行決定"], ["D", "廢除勞動基準法，讓勞雇雙方自由議定所有勞動條件"]], "ans": "B", "exp": "課本指出，除了改善法律外，還可在教育中加強勞動知能的學習、提升民眾的勞動意識，勞工也可採取組織團體抗爭、遊行或訴諸輿論等方式爭取權益。若放任市場或廢除勞基法，只會使權力不對等更加嚴重。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

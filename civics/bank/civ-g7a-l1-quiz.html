<script>
const QS=[{"stem": "課本指出，「人性尊嚴」是指每個人都是怎樣的存在？", "opts": [["A", "必須服從多數人決定的團體成員"], ["B", "獨立自主、具有存在意義與價值的個體"], ["C", "可以被國家依需要任意支配的資源"], ["D", "依附於家庭而沒有自我的附屬品"]], "ans": "B", "exp": "人性尊嚴是指每個人都是獨立自主的個體，具有存在的意義與價值，不應被當成他人的工具，可以選擇自己想要的生活方式和人生方向，並受到平等的尊重。"}, {"stem": "下列何者最明顯違反「人不應被當成他人的工具」這項人性尊嚴的精神？", "opts": [["A", "老師請小明幫忙搬作業簿，事後向他道謝"], ["B", "媽媽提醒小華天冷要多加一件外套"], ["C", "老闆威脅員工假日必須無償加班，否則就開除"], ["D", "同學邀請阿美一起參加園遊會擺攤"]], "ans": "C", "exp": "用開除來威脅員工無償勞動，等於把員工當成獲利的工具，忽視其獨立自主的價值，最違反人性尊嚴。其餘選項都是一般互助或關心，且當事人保有選擇的自由。"}, {"stem": "阿凱很喜歡動漫，週末和同好舉辦角色扮裝活動來展現自我。依課本的人性尊嚴概念，旁人應有的態度是什麼？", "opts": [["A", "尊重他的選擇，因為每個人都能選擇自己想要的生活方式"], ["B", "勸他改掉這種怪異嗜好，以免影響課業"], ["C", "公開嘲笑他，讓他知道多數人的想法"], ["D", "向學校檢舉禁止他參加，以維護校譽"]], "ans": "A", "exp": "課本以「喜歡動漫的人可以舉辦角色扮裝活動，展現自我」為例，說明人性尊嚴包含選擇自己生活方式的自由，並受到平等的尊重，不會受到歧視或不公平的對待。"}, {"stem": "關於「人權」的意義，下列敘述何者正確？", "opts": [["A", "人權是政府恩賜給人民的特權，政府可隨時收回"], ["B", "只有年滿十八歲的成年人才享有人權"], ["C", "人權必須靠繳稅或考試才能取得"], ["D", "人權是人與生俱來、應該享有的各項權利"]], "ans": "D", "exp": "人權是人與生俱來應該享有的各項權利，不是政府施捨的，也不需要任何條件才能取得，更不因年齡而喪失。"}, {"stem": "下列何者屬於課本所舉出的人權內涵？", "opts": [["A", "考試一定要及格的權利"], ["B", "自由、平等與生存權"], ["C", "想要什麼就能得到什麼的權利"], ["D", "可以任意干涉他人生活的權利"]], "ans": "B", "exp": "課本指出人權包括自由、平等、生存權等。人權是生而為人應享有的基本權利，不等於「所有欲望都要被滿足」，更不包含侵害他人的權利。"}, {"stem": "課本強調人權應受到「普遍性保障」，其意思是什麼？", "opts": [["A", "不因國籍、種族、宗教、階級、語言、性別等因素而有所不同"], ["B", "只保障本國國民，外國人一律不適用"], ["C", "只保障人數較多的族群，少數族群另訂較低標準"], ["D", "依照個人財產的多寡決定保障程度"]], "ans": "A", "exp": "普遍性保障是指人權屬於每一個人，不因國籍、種族、宗教、階級、語言、性別等因素而有所不同，且不容許非法侵犯。"}, {"stem": "下列哪一個作法最符合「人權應受普遍性保障」的精神？", "opts": [["A", "學校規定只有男生可以參加籃球校隊"], ["B", "餐廳張貼公告拒絕外籍移工入內用餐"], ["C", "公司規定信仰某宗教的員工不得升遷"], ["D", "醫院不分國籍與種族，一律提供緊急救護"]], "ans": "D", "exp": "(D) 不因國籍、種族而有差別待遇，符合普遍性保障。(A)(B)(C) 分別因性別、國籍、宗教而有差別待遇，都違反人權的普遍性。"}, {"stem": "課本認為「人性尊嚴」與「人權」兩者的關係為何？", "opts": [["A", "兩者互相衝突，保障人權就必須犧牲人性尊嚴"], ["B", "人性尊嚴是具體的權利清單，人權則是抽象的理念"], ["C", "保障人權才能維護人性尊嚴"], ["D", "兩者分屬不同領域，彼此並沒有關聯"]], "ans": "C", "exp": "課本明確指出「對照人性尊嚴來看，保障人權才能維護人性尊嚴」，保障人權是維護人性尊嚴的具體作為。"}, {"stem": "比較「人性尊嚴」與「人權」的性質，下列敘述何者正確？", "opts": [["A", "人性尊嚴較具體，人權較抽象"], ["B", "人性尊嚴較抽象，人權則可以具體條列"], ["C", "兩者都很抽象，完全無法條列出來"], ["D", "兩者都很具體，都可以用數字精確計算"]], "ans": "B", "exp": "人性尊嚴強調對個人的尊重，是比較抽象的概念；人權則可以具體條列，例如生命、自由、平等、受教育等權利。"}, {"stem": "為什麼課本說「要維護人性尊嚴，可以從落實人權保障著手」？", "opts": [["A", "因為人性尊嚴較抽象，必須透過具體的人權保障才能體現"], ["B", "因為人權比人性尊嚴更重要，人性尊嚴可以放棄"], ["C", "因為人性尊嚴是法律用語，人權則不是"], ["D", "因為保障人權可以替政府節省大筆經費"]], "ans": "A", "exp": "人性尊嚴是抽象概念，人權則是具體可條列的權利；唯有落實一項一項的人權保障，抽象的人性尊嚴才能真正被實現。"}, {"stem": "促使國際社會開始重視「人權應受普遍性保障」的關鍵歷史事件是下列何者？", "opts": [["A", "工業革命造成大量勞工失業"], ["B", "大航海時代的海上貿易競爭"], ["C", "網際網路與社群媒體的普及"], ["D", "第二次世界大戰期間，德國納粹大規模殺害猶太人"]], "ans": "D", "exp": "課本指出二次大戰期間德國納粹殺害大量猶太人，慘痛的歷史經驗使世界各國體認到，唯有讓每個人的人權都受到同等保障，才能確保人類的尊嚴、自由與和平。"}, {"stem": "依課本內容，第二次世界大戰期間德國納粹殺害的猶太人數，約為多少？", "opts": [["A", "近六萬人"], ["B", "近六十萬人"], ["C", "近六百萬人"], ["D", "近六千萬人"]], "ans": "C", "exp": "課本記載「二次大戰期間，德國納粹殺害近六百萬猶太人」，這是人類歷史上人權遭受嚴重侵害的代表事件。"}, {"stem": "《世界人權宣言》是由哪一個組織、在何時通過的？", "opts": [["A", "聯合國於西元1948年通過"], ["B", "聯合國於西元1989年通過"], ["C", "國際紅十字會於西元1945年通過"], ["D", "世界衛生組織於西元1948年通過"]], "ans": "A", "exp": "二戰後各國思考如何維護人性尊嚴與世界和平，聯合國於西元1948年通過《世界人權宣言》，成為重要的人權法典。（西元1989年通過的是《兒童權利公約》）"}, {"stem": "《世界人權宣言》第1條的內容為何？", "opts": [["A", "人人有權享有生命、自由和人身安全"], ["B", "人人生而自由，在尊嚴和權利上一律平等"], ["C", "人人有思想、良心和宗教自由的權利"], ["D", "人人有接受免費義務教育的權利"]], "ans": "B", "exp": "《世界人權宣言》第1條宣示「人人生而自由，在尊嚴和權利上一律平等」，強調自由與平等是與生俱來的。(A) 為第3條，(C) 為第18條。"}, {"stem": "《世界人權宣言》第3條所保障的內容是下列何者？", "opts": [["A", "人人生而自由，在尊嚴和權利上一律平等"], ["B", "人人有思想、良心和宗教自由的權利"], ["C", "人人有選擇職業與工作的權利"], ["D", "人人有權享有生命、自由和人身安全"]], "ans": "D", "exp": "《世界人權宣言》第3條為「人人有權享有生命、自由和人身安全」，屬於最基本的生存與人身安全保障。"}, {"stem": "《世界人權宣言》第18條所保障的是下列哪一項自由？", "opts": [["A", "財產與交易的自由"], ["B", "遷徙與居住的自由"], ["C", "思想、良心和宗教自由"], ["D", "集會結社的自由"]], "ans": "C", "exp": "《世界人權宣言》第18條規定「人人有思想、良心和宗教自由的權利」，保障個人內在信念不受他人或政府干涉。"}, {"stem": "關於《世界人權宣言》的地位，下列敘述何者最正確？", "opts": [["A", "它具有強制執行力，違反的國家會立刻被聯合國出兵制裁"], ["B", "它是第一部獲得國際社會重視的人權文件，成為各國努力實踐的標準"], ["C", "它只適用於歐洲地區的國家，亞洲國家不受影響"], ["D", "它的內容主要在規範國與國之間的貿易往來規則"]], "ans": "B", let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

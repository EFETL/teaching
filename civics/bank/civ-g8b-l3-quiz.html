<script>
const QS=[{"stem": "關於「違法行為」與「犯罪行為」兩者的關係，下列敘述何者正確？", "opts": [["A", "違法行為一定是犯罪行為"], ["B", "犯罪行為不一定是違法行為"], ["C", "犯罪行為一定是違法行為，但違法行為不一定是犯罪行為"], ["D", "兩者所指的範圍完全相同，可以互相取代"]], "ans": "C", "exp": "違法是指違反任何法律規定的行為；犯罪則是指已經觸犯「刑法」規定的行為。刑法只是眾多法律中的一種，所以犯罪必定違法，但違法未必構成犯罪。"}, {"stem": "我國「刑法」主要規範的內容為下列何者？", "opts": [["A", "何種行為構成犯罪，以及犯罪之後應受何種刑罰"], ["B", "私人之間買賣、租賃等權利義務關係"], ["C", "行政機關行使職權時應遵守的程序"], ["D", "國家機關的組織與人民的基本權利"]], "ans": "A", "exp": "刑法是規範「什麼行為構成犯罪」以及「犯罪後要如何處罰」的法律。(B) 是民法，(C) 是行政法，(D) 是憲法。"}, {"stem": "下列哪一個人的行為最可能構成「犯罪行為」？", "opts": [["A", "小美在公園亂丟垃圾"], ["B", "阿豪騎機車時邊看手機"], ["C", "大雄上班趕時間而闖紅燈"], ["D", "小張趁店家不注意，偷走架上的商品"]], "ans": "D", "exp": "(A)(B)(C) 都是違反環保或交通法規的違法行為，會被開罰單，但未觸犯刑法；(D) 偷竊觸犯刑法的竊盜罪，屬於犯罪行為。"}, {"stem": "阿明將家中的垃圾隨意丟棄在公園草地上，被清潔隊員舉發。關於阿明行為的法律判斷，下列何者最正確？", "opts": [["A", "觸犯刑法，必須負起刑事責任"], ["B", "屬於違法行為，但並未構成犯罪"], ["C", "既不違法，也不構成犯罪"], ["D", "屬於犯罪行為，應處以有期徒刑"]], "ans": "B", "exp": "亂丟垃圾違反廢棄物清理法，屬於違法行為，會被處以罰鍰，但刑法並未將此行為列為犯罪，因此不構成犯罪行為，也不必負刑事責任。"}, {"stem": "國家為什麼要用比較嚴厲的方式（刑罰）來處罰犯罪行為？下列理由何者最恰當？", "opts": [["A", "因為犯罪行為會侵害他人生命財產、破壞社會秩序或危害國家安全"], ["B", "因為犯罪行為只會損害犯罪者自己的利益"], ["C", "因為民事賠償的金額往往太低，不敷成本"], ["D", "因為國家需要藉此增加國庫的收入"]], "ans": "A", "exp": "課本指出，犯罪行為會侵害他人的生命財產、破壞社會秩序或國家安全，危害較大，因此國家必須採取較嚴厲的方式處罰，以保護個人、社會與國家的利益。"}, {"stem": "大方積欠阿玉新臺幣100萬元遲遲不還。關於此事的法律性質，下列判斷何者正確？", "opts": [["A", "屬於刑事案件，大方須負刑事責任並入監服刑"], ["B", "屬於犯罪行為，大方應被處以拘役"], ["C", "屬於民事案件，大方須負民事的清償責任"], ["D", "屬於行政違規，大方應被處以罰鍰"]], "ans": "C", "exp": "欠錢不還是私人之間的債權債務問題，屬於民法規範的民事案件；刑法並未把「單純欠錢不還」列為犯罪，因此不必負刑事責任。"}, {"stem": "我國刑法第一條規定：「行為之處罰，以行為時之法律有明文規定者為限。」這條規定所展現的是下列哪一項原則？", "opts": [["A", "無罪推定原則"], ["B", "罪刑法定原則"], ["C", "依法行政原則"], ["D", "契約自由原則"]], "ans": "B", "exp": "「行為之處罰，以行為時之法律有明文規定者為限」正是罪刑法定原則的條文依據，也是刑法最重要的精神。"}, {"stem": "罪刑法定原則最主要的目的為何？", "opts": [["A", "加重所有犯罪者的刑度，以收嚇阻之效"], ["B", "讓法官可以完全依自由心證判決案件"], ["C", "提高警察機關的破案率"], ["D", "防止國家任意陷人民入罪，藉以保障人權"]], "ans": "D", "exp": "罪刑法定原則的核心在於限制國家的刑罰權，避免國家濫用權力隨意處罰人民，達到保障人權的目的。"}, {"stem": "我國原本對酒後駕車只依道路交通管理處罰條例開罰單，直到立法院修法將酒駕納入刑法的公共危險罪後，酒駕才成為犯罪行為。這個過程最能說明下列何項概念？", "opts": [["A", "罪刑法定原則"], ["B", "刑罰的矯正目的"], ["C", "責任能力的區分標準"], ["D", "沒收具有獨立性"]], "ans": "A", "exp": "修法「之前」刑法沒有明文規定，酒駕就不構成犯罪；修法「之後」有了明文規定，酒駕才成為犯罪行為。這正是罪刑法定原則的具體實例。"}, {"stem": "政府修法規定，拍攝兒少性影像者最高可處10年有期徒刑。若某人是在「修法前」拍攝，依罪刑法定原則判斷，下列敘述何者正確？", "opts": [["A", "可以直接依新法從重處罰"], ["B", "可以依新法處罰，但應減輕其刑"], ["C", "不能依新法處罰，因為行為當時法律尚無此規定"], ["D", "由法官視情節自行決定是否適用新法"]], "ans": "C", "exp": "罪刑法定原則要求「以行為時之法律有明文規定者為限」。行為當時新法尚未施行，就不能用後來制定的法律回頭處罰他。"}, {"stem": "小美未經同意就登入同學的社群帳號偷看聊天紀錄。丹丹說：「小美做的時候根本不知道刑法有處罰這種行為，所以不算犯罪。」關於丹丹的說法，下列評論何者正確？", "opts": [["A", "正確，因為「不知者無罪」是刑法的基本原則"], ["B", "正確，這正好符合罪刑法定原則的精神"], ["C", "錯誤，因為刑法只處罰過失而不處罰故意"], ["D", "錯誤，罪刑法定看的是「行為時法律有無明文規定」，而不是行為人是否知情"]], "ans": "D", "exp": "罪刑法定原則判斷的標準是行為當時法律有沒有明文規定，與行為人主觀上知不知道法律無關。刑法早在民國108年就明定無故入侵他人電腦設備要處罰，小美的行為已經構成犯罪。"}, {"stem": "除了限制國家權力之外，罪刑法定原則對一般人民還有下列何種功能？", "opts": [["A", "保證犯罪者一定不會被判刑"], ["B", "讓人民事先了解哪些行為會受刑罰制裁，以減少犯罪的發生"], ["C", "使國家可以任意擴張處罰的範圍"], ["D", "讓被害人可以自行對加害人施以私刑"]], "ans": "B", "exp": "課本指出，罪刑法定原則除了防止國家任意陷人民入罪，也能讓人民明確知道哪些行為會受到刑罰制裁，進而減少犯罪行為的發生。"}, {"stem": "關於「私刑」的敘述，下列何者正確？", "opts": [["A", "私刑是法律所允許的正義實現方式"], ["B", "私刑屬於我國刑罰種類中的從刑"], ["C", "私刑是未經刑事訴訟程序、私自懲罰他人的行為，法律並不允許"], ["D", "私刑比司法審判更能做出公正客觀的判斷"]], "ans": "C", "exp": "私刑指未經法定程序、私自以懲罰為名侵害他人權利的行為。每個人對「應有的懲罰」想像不一，以暴制暴反而造成更大傷害並妨礙公權力行使，因此法律不允許私刑。"}, {"stem": "「刑罰應讓犯罪者得到應有的處罰，以撫平被害人及其家屬所受的傷害。」這段話所描述的刑罰目的為何？", "opts": [["A", "懲罰犯罪"], ["B", "嚇阻犯罪"], ["C", "矯正犯罪"], ["D", "補償犯罪"]], "ans": "A", "exp": "讓犯罪者受到應有制裁、伸張正義並撫平被害人傷痛，屬於刑罰「懲罰犯罪」的目的。"}, {"stem": "機場、港口等地設有「販毒、運毒最重可處死刑」的告示牌。此種作法最符合刑罰的哪一項目的？", "opts": [["A", "懲罰犯罪"], ["B", "矯正犯罪"], ["C", "沒收犯罪所得"], ["D", "嚇阻犯罪"]], "ans": "D", "exp": "藉由公告嚴厲刑責使民眾心生畏懼、不敢以身試法，屬於嚇阻（預防）犯罪的目的。"}, {"stem": "彰化監獄成立「儒林烘焙坊」，讓表現良好的受刑人學習製作蛋黃酥並販售。這項作法最能展現刑罰的哪一項目的？", "opts": [["A", "懲罰犯罪"], ["B", "矯正犯罪"], ["C", "嚇阻犯罪"], ["D", "沒收犯罪所得"]], "ans": "B", "exp": "透過教化與技藝訓練，使受刑人習得一技之長、改過向善並順利重返社會，屬於刑罰「矯正犯罪」的目的。"}, {"stem": "課本提到：「除非其他法律不能有效防制不法行為，才會動用刑罰。」這句話的意思是下列何者？", "opts": [["A", "刑罰可以完全取代民法與行政法"], ["B", "國家應把刑罰當成解決犯罪問題的萬靈丹"], ["C", "刑罰是最後且最不得已的制裁手段，必須謹慎行使"], ["D", "只要出現社會問題，國家就應盡量增訂刑罰"]], "ans": "C", "exp": "刑罰是所有法律中最嚴厲的制裁手段，會剝奪人民的生命、自由或財產，因此必須謹慎、節制地使用，是最後手段。"}, {"stem": "關於「告訴乃論」與「非告訴乃論」之罪，下列敘述何者正確？", "opts": [["A", "不論是告訴乃論或非告訴乃論之罪，被害人都可以向檢察官提出告訴"], ["B", "告訴乃論之罪的案件由被害人自行審判並決定刑度"], ["C", "非告訴乃論之罪，被害人可以隨時撤回告訴"], ["D", "告訴乃論之罪，檢察官一律不得提起公訴"]], "ans": "A", "exp": "兩類犯罪的被害人都可以向檢察官提出告訴，由檢察官決定是否提起公訴；兩者的關鍵差別在於「被害人能不能撤回告訴」。"}, {"stem": "依我國刑法規定，下列哪一組全部都屬於「主刑」？", "opts": [["A", "死刑、無期徒刑、有期徒刑、拘役、褫奪公權"], ["B", "死刑、無期徒刑、有期徒刑、拘役、罰金"], ["C", "死刑、無期徒刑、罰金、罰鍰、沒收"], ["D", "有期徒刑、拘役、罰金、褫奪公權、沒收"]], "ans": "B", "exp": "主刑共五種：死刑、無期徒刑、有期徒刑、拘役、罰金。褫奪公權是從刑，罰鍰是行政罰，沒收則具獨立法律效果，皆不屬主刑。"}, {"stem": "下列何者屬於我國刑法規定的「從刑」？", "opts": [["A", "罰金"], ["B", "拘役"], ["C", "沒收"], ["D", "褫奪公權"]], "ans": "D", "exp": "我國刑法規定的從刑為褫奪公權。罰金與拘役都是主刑；沒收自刑法修訂後具獨立法律效果，可單獨宣告，不屬於從刑。"}, {"stem": "主刑與從刑最主要的差別為下列何者？", "opts": [["A", "主刑可以單獨科處，從刑必須附隨於主刑而不能單獨科處"], ["B", "主刑的刑度一定比從刑輕"], ["C", "主刑由法官宣告，從刑由檢察官宣告"], ["D", "主刑一律剝奪財產，從刑一律剝奪自由"]], "ans": "A", "exp": "主刑是可以單獨科處的刑罰；從刑則附隨於主刑，不能單獨科處，這是兩者最關鍵的區分標準。"}, {"stem": "下列哪一種主刑是以「剝奪生命」作為制裁內容？", "opts": [["A", "無期徒刑"], ["B", "有期徒刑"], ["C", "死刑"], ["D", "褫奪公權"]], "ans": "C", "exp": "死刑剝奪的是生命；無期徒刑與有期徒刑剝奪的是人身自由；褫奪公權剝奪的是擔任公職的資格。"}, {"stem": "「罰金」這項主刑主要剝奪犯罪者的何種權益？", "opts": [["A", "生命"], ["B", "人身自由"], ["C", "參政的資格"], ["D", "財產"]], "ans": "D", "exp": "罰金是命犯罪者繳納一定金錢的主刑，剝奪的是財產。"}, {"stem": "「褫奪公權」所剝奪的是下列何者？", "opts": [["A", "犯罪者的人身自由"], ["B", "犯罪者擔任公務員及公職候選人的資格"], ["C", "犯罪者的全部財產"], ["D", "犯罪者的言論自由"]], "ans": "B", "exp": "褫奪公權剝奪的是個人成為公職候選人及公務員的資格，也就是部分參政權，並非剝奪自由或財產。"}, {"stem": "關於主刑中的「拘役」，下列敘述何者正確？", "opts": [["A", "是短期剝奪人身自由的刑罰，期限原則上不超過60日，必要時得加至120日"], ["B", "是長期剝奪人身自由的刑罰，最短也要1年以上"], ["C", "是剝奪財產的刑罰，須繳納一定金額"], ["D", "屬於從刑，不可以單獨科處"]], "ans": "A", "exp": "拘役是短期剝奪犯罪行為人自由的主刑，須經法院判決才可施行，期限原則上不超過60日，必要時得加至120日。"}, {"stem": "下列刑罰中，何者「不是」主刑？", "opts": [["A", "拘役"], ["B", "罰金"], ["C", "無期徒刑"], ["D", "褫奪公權"]], "ans": "D", "exp": "主刑包括死刑、無期徒刑、有期徒刑、拘役、罰金五種；褫奪公權是從刑，必須附隨主刑科處。"}, {"stem": "法官判決某被告「有期徒刑3年，褫奪公權2年」。關於這兩項刑罰的性質，下列判斷何者正確？", const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "下列關於「社會規範」意義的敘述，何者最為正確？", "opts": [["A", "由每個人依自己的喜好所訂定的行為習慣"], ["B", "社會成員受文化制約，共同認可並遵守的行為準則"], ["C", "只有國家立法機關才能制定的強制性條文"], ["D", "僅存在於現代工商業社會的新興產物"]], "ans": "B", "exp": "課本指出，社會成員的行為受到文化的制約，形成人們在日常生活中與他人接觸、交流和行動的依據，即為社會規範。它是共同認可與遵守的行為準則，不是個人喜好，也不限於法律。"}, {"stem": "社會之所以需要建立社會規範，最主要的理由是什麼？", "opts": [["A", "為了讓政府方便向人民收取稅金"], ["B", "為了讓每個社會成員的想法完全一致"], ["C", "為了減少人際衝突與紛爭，維持社會秩序與和諧"], ["D", "為了全面限制人民所享有的一切自由"]], "ans": "C", "exp": "人與人互動頻繁，想法與價值觀不同，難免產生衝突。社會規範讓人們知道什麼可以做、什麼不該做，有助於避免紛爭、穩定秩序，並非為了統一思想或限制所有自由。"}, {"stem": "課本提到「交通規則能避免行車糾紛的發生，改善交通混亂的問題」，這最能說明社會規範具有下列何種作用？", "opts": [["A", "增加國家的稅收收入"], ["B", "消除各地區之間的文化差異"], ["C", "使全體人民的思想趨於統一"], ["D", "避免紛爭並協助解決衝突"]], "ans": "D", "exp": "社會規範讓成員在互動與溝通時明白行為界線，有助於避免紛爭或解決衝突，交通規則正是典型例子。"}, {"stem": "課本以「尊敬師長、孝順父母」為例，說明社會規範能協助個人建立符合社會期待的價值觀與行為模式。這顯示社會規範有助於下列何者？", "opts": [["A", "個人融入社會生活"], ["B", "個人快速累積財富"], ["C", "國家增加總人口數"], ["D", "減少國際貿易的障礙"]], "ans": "A", "exp": "課本明白指出，社會規範有助於個人融入社會生活，建立符合社會期待的價值觀及行為模式。"}, {"stem": "關於「文化」與「社會規範」兩者的關係，下列敘述何者最為正確？", "opts": [["A", "兩者各自獨立，彼此毫無關聯"], ["B", "社會規範決定文化，文化不會反過來影響規範"], ["C", "文化影響社會規範的形成方式與種類，規範又約束並指導該文化中的人們"], ["D", "只有法律屬於文化的一部分，其餘規範與文化無關"]], "ans": "C", "exp": "課本說明文化會影響社會規範的形成方式與種類，而形成的社會規範又對該文化中的人們具有約束及指導作用，兩者密不可分。"}, {"stem": "假設一個社會完全沒有任何社會規範，最可能出現下列何種情況？", "opts": [["A", "人們的互動變得更有效率"], ["B", "國家的財政收入大幅提高"], ["C", "各族群間的文化差異完全消失"], ["D", "人們無所適從，衝突與糾紛不斷增加"]], "ans": "D", "exp": "缺乏共同遵循的準則，人們對彼此的行為無從預期，也無從約束傷害他人的行為，衝突與糾紛必然增加。"}, {"stem": "在臺灣，搭車排隊自政府推行後逐漸成為大家共同遵守的行為。這個例子最能說明社會規範的什麼特性？", "opts": [["A", "一旦形成之後就永遠不會改變"], ["B", "只能藉由政府的強制力才能推行"], ["C", "僅存在於學校教育的場域之中"], ["D", "可在長期互動中逐漸形成，使社會更有秩序"]], "ans": "D", "exp": "排隊是長期累積、逐漸被大眾接受的社會規範，屬於相沿成習的行為準則，能讓社會更加和諧有秩序。"}, {"stem": "「紅燈停、綠燈行」被世界各國多數人共同遵循，其最主要的功能是下列何者？", "opts": [["A", "展現各國文化之間的差異性"], ["B", "減少交通的混亂與事故發生"], ["C", "帶動汽車產業的銷售量成長"], ["D", "培養用路人的宗教情操"]], "ans": "B", "exp": "紅綠燈規則屬於維持秩序的社會規範，其目的在於減少交通混亂與事故，保障用路人安全。"}, {"stem": "「一個社會中經長久累積、相沿成習、約定俗成的慣例」，指的是下列哪一種社會規範？", "opts": [["A", "法律"], ["B", "宗教信仰"], ["C", "倫理道德"], ["D", "風俗習慣"]], "ans": "D", "exp": "風俗習慣是社會中經長時間累積的生活經驗，形成相沿成習、約定俗成的慣例，包括年節習俗與生命禮俗。"}, {"stem": "中華文化重視追本溯源、慎終追遠，因而發展出清明節掃墓的行為。此屬於下列哪一種社會規範？", "opts": [["A", "風俗習慣"], ["B", "法律規定"], ["C", "宗教戒律"], ["D", "正式規範"]], "ans": "A", "exp": "清明掃墓是長期累積、相沿成習的慣例，屬於風俗習慣，違反並不會受到國家公權力制裁。"}, {"stem": "依課本說明，人類生活中「最早發展出來」的社會規範形式是下列何者？", "opts": [["A", "倫理道德"], ["B", "宗教信仰"], ["C", "法律"], ["D", "風俗習慣"]], "ans": "D", "exp": "課本指出風俗習慣是人類生活中最早發展出來的社會規範形式，也最容易隨時代或與其他文化接觸而變動。"}, {"stem": "泰雅族與賽德克族傳統上只有精於狩獵的男子與善於織布的女子才能「文面」，此舉既是榮譽象徵也是族系識別。這屬於下列何者？", "opts": [["A", "宗教戒律"], ["B", "國家法律"], ["C", "風俗習慣"], ["D", "正式規範"]], "ans": "C", "exp": "文面是族群長期累積、相沿成習的慣例，屬於風俗習慣；此習俗也隨社會變遷與外來文化接觸而逐漸消失。"}, {"stem": "「人與人相處的應對進退之道，以及判斷是非善惡的標準」，是指下列哪一種社會規範？", "opts": [["A", "倫理道德"], ["B", "風俗習慣"], ["C", "宗教信仰"], ["D", "法律"]], "ans": "A", "exp": "倫理指人與人相處的關係與應對進退之道，道德則是判斷是非善惡的標準，兩者合稱倫理道德。"}, {"stem": "下列何者「不」屬於傳統社會所稱的「五倫」內容？", "opts": [["A", "父子有親"], ["B", "君臣有義"], ["C", "師生有敬"], ["D", "長幼有序"]], "ans": "C", "exp": "五倫為父子有親、君臣有義、夫婦有別、長幼有序、朋友有信，並不包含「師生有敬」。"}, {"stem": "現代社會所強調的「第六倫」，其規範的重點是下列何者？", "opts": [["A", "父母與子女之間的親情關係"], ["B", "個人與社會大眾（陌生群眾）之間的關係"], ["C", "夫妻之間相處的分工關係"], ["D", "君主與臣子之間的統治關係"]], "ans": "B", "exp": "隨著公領域擴大，倫理範疇擴及群己關係，即「第六倫」，又稱「公德」或「群己倫理」，著重個人與社會大眾的關係。"}, {"stem": "校園園遊會鼓勵大家自備餐具、減少使用一次性餐具，這是下列哪一種倫理觀念的實踐？", "opts": [["A", "家庭倫理"], ["B", "君臣倫理"], ["C", "科技倫理"], ["D", "環境倫理"]], "ans": "D", "exp": "環境倫理規範人與自然環境的互動，強調顧及生態保育，自備餐具以減少垃圾即為典型實踐。"}, {"stem": "中國傳統民間信仰認為「舉頭三尺有神明」，因此人們不敢做壞事。這主要是哪一種社會規範發揮作用？", "opts": [["A", "法律"], ["B", "宗教信仰"], ["C", "風俗習慣"], ["D", "倫理道德"]], "ans": "B", "exp": "宗教信仰透過超自然力量或戒律來約束信徒行為，「舉頭三尺有神明」即以對超自然力量的敬畏來約束人的行為。"}, {"stem": "印度教徒不食用牛肉，伊斯蘭教徒則禁食豬肉。此現象最能說明下列何者？", "opts": [["A", "宗教信仰會透過教義與戒律影響信徒的日常生活"], ["B", "國家法律明文禁止人民食用特定肉類"], ["C", "這兩種宗教的教義都缺乏勸人為善的內容"], ["D", "飲食習慣的形成與文化背景完全無關"]], "ans": "A", "exp": "宗教以經典、教義與戒律約束信徒的日常行為，飲食禁忌即為明顯例證，這與國家法律無關。"}, {"stem": "課本提到佛教、基督教與伊斯蘭教等宗教的教義均在勸人為善。因此宗教信仰對社會具有下列何種作用？", "opts": [["A", "完全取代法律所具有的強制力"], ["B", "徹底消滅社會上的所有衝突"], ["C", "穩定社會秩序並安定人心"], ["D", "使國家不再需要制定任何法律"]], "ans": "C", "exp": "各宗教多主張獎善懲惡、教人為善，因此具有穩定社會與安定人心的作用，但無法取代法律的強制力。"}, {"stem": "「由國家（立法機關）經由一定程序制定，明確規定人民及政府應遵守的事項，並以公權力為後盾強制執行」，這是指下列何種社會規範？", "opts": [["A", "風俗習慣"], ["B", "倫理道德"], ["C", "宗教戒律"], ["D", "法律"]], "ans": "D", "exp": "法律由國家依一定程序制定，以公權力為後盾並強制執行，是四種社會規範中唯一具有強制力者。"}, {"stem": "酒後駕車的人會被警察依法處罰。此事例最能顯示法律具有下列何種特性？", "opts": [["A", "只能依靠個人良心自動遵守"], ["B", "性質上屬於非正式的社會規範"], ["C", "各縣市的認定標準完全不同"], ["D", "由國家以公權力進行強制制裁"]], "ans": "D", "exp": "違反法律會受到強制性制裁，警察依法處罰酒駕正是國家行使公權力的表現。"}, {"stem": "清潔隊以神明形象製作警語看板，希望提醒民眾不要亂丟垃圾。這是借用下列哪一種社會規範的力量？", "opts": [["A", "法律"], ["B", "倫理道德"], ["C", "風俗習慣"], ["D", "宗教信仰"]], "ans": "D", "exp": "以神明形象提醒民眾，是運用人們對超自然力量的敬畏心理，屬於宗教信仰的約束力量。"}, {"stem": "下列哪一組所列項目「全部」屬於非正式規範？", "opts": [["A", "法律、命令、行政規則"], ["B", "風俗習慣、倫理道德、宗教信仰"], ["C", "風俗習慣、法律、宗教信仰"], ["D", "倫理道德、法律、行政命令"]], "ans": "B", "exp": "風俗習慣、倫理道德、宗教信仰由社會長時間累積形成，違反時不受國家公權力制裁，故稱非正式規範；法律則為正式規範。"}, {"stem": "正式規範與非正式規範最主要的差別在於下列何者？", "opts": [["A", "是否具有國家公權力所賦予的強制力"], ["B", "是否為社會上多數人所知悉"], ["C", "是否曾被書寫成明確的文字"], ["D", "是否需要由學校來加以教導"]], "ans": "A", "exp": "課本以「是否具有強制力」作為區分標準：法律違反時由國家以公權力制裁，其餘規範則否。"}, {"stem": "一般而言，違反非正式規範時，通常會受到下列何種後果？", "opts": [["A", "被法院依法判處刑罰"], ["B", "被警察開立罰單處以罰鍰"], ["C", "受到良心譴責與輿論批評"], ["D", "被國家剝奪其國民身分"]], "ans": "C", "exp": "非正式規範不具強制力，違反時可能受良心譴責與輿論批評，但不會受到國家公權力的制裁。"}, {"stem": "課本將法律稱為「正式規範」，最主要的理由是下列何者？", "opts": [["A", "因為法律是人類最早出現的社會規範"], ["B", "因為法律由國家依一定程序制定且具強制力"], ["C", "因為法律可以直接規範人民的內在思想"], ["D", "因為法律的內容完全不受其他規範影響"]], "ans": "B", "exp": "法律經國家一定程序制定，用以約束外在行為，違反時以公權力制裁，故稱正式規範。法律無法規範內在思想，且其制定會受其他規範影響。"}, {"stem": "課本指出，國家通常只針對「社會最低限度的行為準則」制定法律。其主要原因為何？", "opts": [["A", "因為立法機關的立法委員人數不足"], ["B", "因為每個人對是非善惡認知不同，且法律無法涵蓋生活各層面"], ["C", "因為法律本身並不具有任何強制力"], ["D", "因為倫理道德的強制力遠高於法律"]], "ans": "B", "exp": "每個人對是非善惡標準不一，法律也不可能對社會生活各方面一一立法，因此僅就最低限度的行為準則加以規定。"}, {"stem": "「法律僅能約束人的外在行為，無法規範內在思想。」根據此敘述，最適當的推論是下列何者？", "opts": [["A", "維持社會秩序仍須各種社會規範相互輔助與配合"], ["B", "法律既然有此限制，就應該全面加以廢除"], ["C", "社會秩序僅靠法律 QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

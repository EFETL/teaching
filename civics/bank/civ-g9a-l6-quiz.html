<script>
const QS=[{"stem": "課本指出，「勞動」是指人們運用自己的心力或體力，創造出能滿足自己或他人需求的事物。根據此定義，下列敘述何者最正確？", "opts": [["A", "只有領取薪水的工作才能稱為勞動"], ["B", "勞動可以增進個人、家庭或社會的福祉"], ["C", "勞動必須在工廠或辦公室中進行才算數"], ["D", "勞動只包含體力的付出，不包含心力的付出"]], "ans": "B", "exp": "勞動是運用心力或體力創造出滿足自己或他人需求的事物，目的在增進個人、家庭或社會的福祉。心力與體力的付出都算勞動，也不限定場所，更不限於有酬的工作。"}, {"stem": "小美到便利商店打工，每月領取薪資。她所從事的勞動又可稱為下列何者？", "opts": [["A", "無酬勞動"], ["B", "非市場勞動"], ["C", "市場勞動"], ["D", "志願勞動"]], "ans": "C", "exp": "人們在市場中提供勞動以換取工資、佣金、獎金等實質報酬，稱為「有酬勞動」，又稱「市場勞動」。小美領取薪資，屬於市場勞動。"}, {"stem": "下列何者屬於「有酬勞動（市場勞動）」？", "opts": [["A", "賢哲擔任專職居家服務員，領取月薪照顧失能老人"], ["B", "小華在家幫媽媽洗碗、拖地"], ["C", "阿明利用假日到海邊擔任淨灘志工"], ["D", "佳佳照顧生病的奶奶，未收取任何費用"]], "ans": "A", "exp": "判斷是否為市場勞動的關鍵在於「有沒有獲得實質報酬」。賢哲受僱擔任居家服務員並領取月薪，屬於市場勞動；(B)(D) 為家務勞動，(C) 為志工服務，都屬無酬勞動。"}, {"stem": "關於「無酬勞動」的敘述，下列何者正確？", "opts": [["A", "因為沒有報酬，所以對社會沒有任何貢獻"], ["B", "無酬勞動又稱為市場勞動"], ["C", "其價值可以清楚地用市場價格標示出來"], ["D", "其價值不容易以市場價格衡量，貢獻常被忽略"]], "ans": "D", "exp": "無酬勞動又稱「非市場勞動」，雖然同樣具有價值，但因為價值不容易以市場上的價格標示，對社會生活的重要性與貢獻反而常被忽略。"}, {"stem": "環保志工利用假日到海邊淨灘，雖然沒有領到任何酬勞，卻讓環境變得更好。這個例子最能說明下列何者？", "opts": [["A", "志工服務屬於市場勞動的一種"], ["B", "沒有報酬的付出就不能稱為勞動"], ["C", "無酬勞動同樣能創造價值，讓社會生活更多元"], ["D", "志工必須先向政府申請登記才算勞動"]], "ans": "C", "exp": "從事志工服務雖然不能獲得實質報酬，但可讓社會生活更多元，說明無酬勞動一樣具有價值，值得肯定。"}, {"stem": "下列何者「不是」市場勞動對個人或社會的重要性？", "opts": [["A", "使家庭成員的生活起居獲得照料，讓家庭得以正常運作"], ["B", "獲取收入，提供家庭經濟來源"], ["C", "增進消費能力，支付家庭生活開銷"], ["D", "實踐個人的理想與抱負"]], "ans": "A", "exp": "(A) 描述的是「家務勞動」的功能，屬於無酬勞動。(B)(C)(D) 才是市場勞動對個人的重要性。"}, {"stem": "若一個社會的勞動力充足、失業人口少，最可能產生下列何種結果？", "opts": [["A", "政府必須大量發放失業給付"], ["B", "家務勞動將完全被市場勞動取代"], ["C", "企業因人力過剩而紛紛倒閉"], ["D", "人力資源充分發揮，提升國家的生產力與競爭力"]], "ans": "D", "exp": "課本指出，勞動力充足或失業人口少，能使人力資源充分發揮，有助於提升國家生產力與競爭力、促進經濟發展，甚至減少嚴重的社會問題。"}, {"stem": "自己開店當老闆的阿東，每天忙進忙出並從中獲取利潤。關於阿東的勞動，下列判斷何者正確？", "opts": [["A", "因為沒有領薪水，所以屬於無酬勞動"], ["B", "屬於市場勞動，因為他從勞動中獲得了實質報酬"], ["C", "屬於家務勞動，因為店是自己開的"], ["D", "屬於志願服務，因為沒有人僱用他"]], "ans": "B", "exp": "市場勞動包括雇主與受僱者所提供的勞動。自己當老闆可獲取利潤，同樣是從勞動中取得實質報酬，屬於有酬的市場勞動。"}, {"stem": "課本提到，料理三餐、清掃家裡、養育子女等家務勞動，能讓家人專心投入工作。這最能說明家務勞動與市場勞動之間是什麼關係？", "opts": [["A", "互相競爭、彼此排斥"], ["B", "完全無關、各自獨立"], ["C", "相輔相成、彼此互補"], ["D", "家務勞動的價值一定高於市場勞動"]], "ans": "C", "exp": "家務勞動提供家庭成員生理與心理的照顧，使勞動者能專心投入工作，維持市場勞動的穩定運作，兩者相輔相成、同等重要。"}, {"stem": "王家因為長輩需要照顧，於是聘請居家服務員到家中協助照料，並支付費用。這種現象稱為下列何者？", "opts": [["A", "家務勞動市場化"], ["B", "勞資爭議"], ["C", "就業歧視"], ["D", "零工經濟"]], "ans": "A", "exp": "原本由家人無償承擔的家務工作，改由付費僱人完成，使做家事變成市場勞動，這種現象稱為「家務勞動市場化」。"}, {"stem": "下列何者「最不」屬於「家務勞動市場化」的例子？", "opts": [["A", "委託長期照護中心協助照顧失能老人"], ["B", "僱用外籍看護照顧行動不便的爺爺"], ["C", "請清潔公司到家中打掃環境"], ["D", "全家人利用週末一起動手大掃除"]], "ans": "D", "exp": "(A)(B)(C) 都是把家務工作交由他人有償提供，屬於家務勞動市場化。(D) 家人自己動手且未支付報酬，仍屬無酬的家務勞動。"}, {"stem": "「只要是在家裡從事家務勞動，就一定是無酬勞動。」這句話是否正確？", "opts": [["A", "正確，只要在家中做事就一定沒有報酬"], ["B", "不正確，若受僱於人到他人家中打掃或照顧幼兒並領取報酬，即屬市場勞動"], ["C", "正確，因為家裡並不是職場"], ["D", "不正確，因為家務工作根本不能算是勞動"]], "ans": "B", "exp": "判斷關鍵在於「有無獲得實質報酬」，而非工作地點。受僱於人在他人家中從事清掃、照顧幼兒或老人並獲取報酬，屬於市場勞動。"}, {"stem": "下列何者是造成「家務勞動市場化」現象日益普遍的主要原因？", "opts": [["A", "國人平均壽命延長、家庭結構改變，使照護需求增加"], ["B", "政府立法禁止家庭成員自行做家事"], ["C", "家務勞動已被法律列為違法行為"], ["D", "家務勞動對家庭的價值已完全消失"]], "ans": "A", "exp": "隨著國人平均壽命延長、家庭結構改變，愈來愈多家庭將家務與照護工作委託他人，協助家庭照護的產業因而興起。"}, {"stem": "依課本定義，「勞動力」包括下列哪些人？", "opts": [["A", "只包括就業者"], ["B", "只包括失業者"], ["C", "包括就業者與失業者"], ["D", "包括全國所有的人民"]], "ans": "C", "exp": "勞動力包括就業者與失業者兩類，兩者的共同點是都具有工作能力與工作意願，且都有在找尋工作。"}, {"stem": "下列何者最符合課本對「就業者」的定義？", "opts": [["A", "12歲的小學生每天幫忙做家事"], ["B", "20歲的阿凱有工作能力與意願，求職後順利受僱於便利商店"], ["C", "30歲的阿德有工作能力，但完全不想工作，也沒有找工作"], ["D", "70歲的爺爺退休後在家含飴弄孫"]], "ans": "B", "exp": "就業者是指15歲以上有工作能力與工作意願，且有找尋工作並能找到工作的人。(C) 缺乏工作意願、未找工作，(A)(D) 也不符合條件。"}, {"stem": "阿豪具備工作能力與工作意願，這兩個月不斷投遞履歷、四處求職，卻仍未找到工作。依課本定義，阿豪屬於下列何者？", "opts": [["A", "就業者"], ["B", "雇主"], ["C", "志工"], ["D", "失業者"]], "ans": "D", "exp": "失業者是指有工作能力與工作意願，且有找尋工作，卻找不到工作的人。阿豪符合此定義，且他仍屬於「勞動力」的一部分。"}, {"stem": "依課本說明，「就業者」除了要有工作能力與工作意願、有找尋工作並能找到工作之外，還須符合下列哪項條件？", "opts": [["A", "年滿15歲以上"], ["B", "年滿18歲以上"], ["C", "年滿20歲以上"], ["D", "沒有任何年齡限制"]], "ans": "A", "exp": "課本定義就業者是指「15歲以上」有工作能力與工作意願，且有找尋工作並能找到工作的人。"}, {"stem": "在勞動市場中，關於勞動力的供給與需求，下列敘述何者正確？", "opts": [["A", "雇主是勞動力的提供者，勞工是勞動力的需求者"], ["B", "雇主與勞工都是勞動力的需求者"], ["C", "雇主是勞動力的需求者，勞工是勞動力的提供者"], ["D", "政府是勞動市場上唯一的勞動力需求者"]], "ans": "C", "exp": "勞動市場中，老闆（雇主）僱用人力，是勞動力的需求者；勞工提供智能或體力，是勞動力的提供者（供給者）。"}, {"stem": "受僱者在選擇工作時，除了薪資待遇之外，通常還會考量下列哪些條件？", "opts": [["A", "只考量老闆的長相與個性"], ["B", "工作環境、工作時間、穩定度、學習機會與升遷管道"], ["C", "公司距離火車站遠近是唯一的考量"], ["D", "只需考量公司在社會上的知名度"]], "ans": "B", "exp": "受僱者為了讓自己的付出獲得最好的報酬，選擇工作時除薪資待遇外，還會考量工作環境、工作時間、工作穩定度、學習機會及升遷管道等條件。"}, {"stem": "雇主從事生產的主要目的是獲取利潤，因此在僱用員工時，最主要的考量是下列何者？", "opts": [["A", "員工的家庭背景是否顯赫"], ["B", "員工的宗教信仰是否與自己相同"], ["C", "員工是否與自己來自同一個故鄉"], ["D", "員工的專業能力與工作態度，希望能帶來最大效益"]], "ans": "D", "exp": "員工薪資是生產成本之一，雇主會考量受僱者的專業能力與工作態度，希望其能為公司創造最大效益。以與工作能力無關的因素作為條件，反而可能構成就業歧視。"}, {"stem": "課本指出勞資雙方常處於「權力不對等」的狀態，其主要原因為何？", "opts": [["A", "雇主握有薪資發放與聘僱決定的權力，常單方面決定工作時數與場所"], ["B", "勞工的人數遠遠少於雇主的人數"], ["C", "法律明文規定雇主的地位高於勞工"], ["D", "勞工依法不需要與雇主簽訂勞動契約"]], "ans": "A", "exp": "勞資雙方在法律地位上平等，但因雇主握有薪資發放權與聘僱決定權，常單方面決定工作時數、場所及在職進修等事項，使勞工在契約關係中處於相對弱勢。"}, {"stem": "關於「勞動契約」的敘述，下列何者正確？", "opts": [["A", "只要勞雇雙方都同意，內容就可以低於勞動基準法的標準"], ["B", "契約內容雖可自由約定，但勞動基本權益不得低於勞動基準法的最低標準"], ["C", "勞動契約只需要雇主單方面簽名即可生效"], ["D", "勞動契約一律由政府代替勞工與雇主簽訂"]], "ans": "B", "exp": "勞動基準法規定的是勞動條件的「最低標準」。勞動契約內容雖可自由約定，但不得低於該法標準，以保障勞工權益。"}, {"stem": "某公司徵才廣告註明「限男性、未婚、35歲以下」。這種以與工作能力無關的因素作為僱用條件的行為，稱為下列何者？", "opts": [["A", "勞資爭議"], ["B", "職業災害"], ["C", "家務勞動市場化"], ["D", "就業歧視"]], "ans": "D", "exp": "雇主如果以族群、性別、年齡、婚姻或身心障礙等與工作能力無關的因素，作為招募、升遷、訓練、福利或解僱的條件，就構成就業歧視。"}, {"stem": "下列何種情形最可能構成「就業歧視」？", "opts": [["A", "應徵工程師時，要求應徵者具備相關專業證照"], ["B", "應徵廚師時，實際測試應徵者的廚藝"], ["C", "因為應徵者是原住民族而拒絕錄用"], ["D", "依照員工的績效表現決定年終獎金多寡"]], "ans": "C", "exp": "就業歧視的判斷關鍵在於是否以「與工作能力無關」的因素作為條件。族群身分與工作能力無關，(A)(B)(D) 則都與工作能力或表現直接相關。"}, {"stem": "我國憲法明文規定「人民之工作權，應予保障」。此規定最主要的意義為何？", "opts": [["A", "保障工作權是國家的責任，政府應立法落實勞動權益"], ["B", "人民可任意挑選想做的工作，雇主一律不得拒絕"], ["C", "政府必須提供每個國民完全相同的薪水"], ["D", "雇主在任何情況下都不得解僱員工"]], "ans": "A", "exp": "憲法保障人民工作權，是政府制定勞動基準法等勞動法規的依據，代表保障勞動權益是國家的責任，而不是保證每個人都能得到想要的工作或相同薪資。"}, {"stem": "我國制定「勞動基準法」最主要的目的為何？", "opts": [["A", "保障雇主能獲得最大的利潤"], ["B", "規定勞動條件的最低標準，保障勞工的基本權益"], ["C", "規定勞工必須到政府指定的公司上班"], ["D", "限制人民從事勞動的自由"]], "ans": "B", "exp": "勞動基準法是為保障勞工基本權益而制定，明確規範工資、工作時間、休假、童工、職業災害補償及退休等重要事項，作為勞動條件的最低標準。"}, {"stem": "下列何者「不屬於」勞動基準法明確規範的事項？", "opts": [["A", "工資"], ["B", "工作時間與休假"], ["C", "商品在市場上的售價"], ["D", "職業災害補償與退休"]], "ans": "C", "exp": "勞動基準法規範的是勞動條件，包括工資、工作時間、休假、童工、職業災害補償及退休等；商品售價由市場供需決定，不在該法規範範圍。"}, {"stem": "勞動基準法規定「工資由勞雇雙方議定，但不得低於基本工資」。政府訂立基本工資的主要目的為何？", "opts": [["A", "讓雇主可以任意壓低人事成本"], ["B", "使全國所有勞工的薪資完全相同"], ["C", "避免勞工過度加班而影響健康"], ["D", "保障弱勢勞工擁有維持基本生活所需的購買力"]], "ans": "D", "exp": "訂立基本工資的主要目的，在於保障弱勢勞工能維持基本生活所必需的購買力，而不是讓薪資齊頭平等。"}, {"stem": "餐廳老闆對前來應徵的工讀生說：「時薪就照基本工資打八折計算，你要做就做。」關於此項規定，下列判斷何者正確？", "opts": [["A", "違法，因為勞動基準法規定工資不得低於基本工資"], ["B", "合法，因為雙方已經議定並且同意"], ["C", "合法，因為工讀生不適用勞動基準法"], ["D", "違法，但只要工讀生簽名同意即可生效"]], "ans": "A", "exp": "勞動基準法第21條規定，工資由勞雇雙方議定，但不得低於基本工資。低於基本工資的約定即使勞工同意也違法無效，工讀生同樣受該法保障。"}, {"stem": "某倉儲公司規定：「作業員每天連續工作8小時，中間一律不得休息。」依勞動基準法判斷，此規定的問題為何？", "opts": [["A", "合法，因為每日工時並未超過8小時"], ["B", "合法，因為休息與否可由雇主自行決定"], ["C", "違法，因勞工繼續工作4小時，至少應有30分鐘的休息時間"], ["D", "違法，因為勞工每天最多只能工作4小時"]], "ans": "C", "exp": "勞動基準法第35條規定，勞工繼續工作4小時，至少應有30分鐘的休息時間。該公司禁止休息的規定已違反此項最低標準。"}, {"stem": "依勞動基準法規定，所謂「童工」是指幾歲的工作者？", "opts": [["A", "未滿15歲者"], ["B", "年滿15歲未滿16歲者"], ["C", "年滿16歲未滿18歲者"], ["D", "年滿18歲未滿20歲者"]], "ans": "B", "exp": "依勞動基準法，年滿15歲未滿16歲的受僱工作者為「童工」，法律對其工作性質與工作時間都設有特別保護規定。"}, {"stem": "15歲的小華想利用暑假打工。依勞動基準法對童工的保護規定，下列敘述何者正確？", "opts": [["A", "童工可以從事任何工作，只要家長同意即可"], ["B", "童工可以配合雇主需要於深夜時段工作"], ["C", "童工完全不受勞動基準法的保障"], ["D", "童工不得於晚上8點至隔日早上6點的時間內工作"]], "ans": "D", "exp": "勞動基準法保護童工，規定童工不得從事危險性或有害性工作，也不得於晚上8點至翌日早上6點之間工作，以保障其身心健康與就學權益。"}, {"stem": "15歲的小華在路邊看到一則徵人廣告：「施工工地搬運建材，工作時間晚上9點至凌晨2點，時薪從優。」依勞動基準法判斷，下列敘述何者最適當？", "opts": [["A", "不可以，工地工作具危險性，且工作時間也違反童工的規定"], ["B", "可以，只要薪水高於基本工資就沒有問題"], ["C", "可以，只要小華的體力足以負荷即可"], ["D", "不可以，因為法律規定未滿20歲一律不得打工"]], "ans": "A", "exp": "童工不得從事危險性工作，施工工地具相當危險；且該工作時段落在晚上8點至隔日早上6點之間，兩項都違反勞動基準法對童工的保護規定。並非未滿20歲一律不得打工。"}, {"stem": "政府要求雇主必須維護工作環境的安全與衛生，其最主要的目的為何？", "opts": [["A", "增加雇主的營業成本以抑制企業擴張"], ["B", "防範勞工發生職業災害"], ["C", "提高企業所生產商品的售價"], ["D", "減少勞工每年可以請的休假天數"]], "ans": "B", "exp": "政府立法要求雇主維護工作環境的安全衛生，目的在防範勞工發生職業災害，保障勞工的生命與健康。"}, {"stem": "勞動部人員前往工地進行勞動檢查，針對違規項目依法開罰。此舉最主要的意義為何？", "opts": [["A", "表示政府對所有企業都抱持不信任的態度"], ["B", "表示勞動契約的內容可以不必遵守"], ["C", "政府以公權力介入處罰違法雇主，督促資方重視勞動權益"], ["D", "表示勞工從此不必再爭取自身的權益"]], "ans": "C", "exp": "若雇主違反勞動法規，政府會以公權力介入處罰，藉此督促資方重視勞動權益，這正是立法保障公平市場勞動參與的具體作法。"}, {"stem": "近年我國通過「勞工職業災害保險及保護法」，其主要作用為何？", "opts": [["A", "規定勞工每月的最低薪資額度"], ["B", "規定勞工強制退休的年齡"], ["C", "保障失業勞工一定期間的基本生活"], ["D", "強化勞工職業災害保護，使勞工享有更安全健康的勞動環境"]], "ans": "D", "exp": "該法的立法目的在強化勞工職業災害的保險與保護，讓勞工在更安全、健康的環境中工作。(A)(B) 屬勞動基準法範疇，(C) 屬就業保險法範疇。"}, {"stem": "阿宏與公司因加班費的計算方式發生爭執，雙方僵持不下。依課本內容，他可以透過下列何種管道尋求解決？", "opts": [["A", "直接向法院申請宣告公司破產"], ["B", "向各公所或工作所在地的勞工主管機關聲請調解"], ["C", "只能自行與老闆私下協商，別無其他管道"], ["D", "向消費者保護官提出消費申訴"]], "ans": "B", "exp": "發生勞資爭議時，勞工除可向各公所聲請調解外，也可選擇向工作所在地的勞工主管機關聲請調解。消費爭議才找消保官。"}, {"stem": "勞資爭議透過「調解」方式處理，對勞工而言最主要的意義為何？", "opts": [["A", "協助解決勞資雙方的爭議，使勞工權益得以救濟"], ["B", "可以確保雇主一定會被判處刑罰"], ["C", "可以讓勞工免除一切工作上的義務"], ["D", "可以讓勞工立刻領取到失業給付"]], "ans": "A", "exp": "調解是勞資爭議的處理管道之一，協助勞資雙方化解爭議，使勞工受損的權益能獲得救濟，而非用來科處刑罰或發給失業給付。"}, {"stem": "我國制定「就業保險法」的主要目的為何？", "opts": [["A", "規範工資、工時與休假的最低標準"], ["B", "保障雇主免於承受營業上的損失"], ["C", "提升勞工就業技能、促進就業，並保障勞工失業一定期間的基本生活"], ["D", "保障消費者在購物時的相關權益"]], "ans": "C", "exp": "就業保險法的立法目的在提升勞工就業技能、促進就業，並保障勞工失業一定期間的基本生活；(A) 是勞動基準法的功能。"}, {"stem": "關於「失業給付」的敘述，下列何者正確？", "opts": [["A", "只要離職，任何人都一定可以領取"], ["B", "自願離職者可以領取比較長的時間"], ["C", "只要沒找到工作就可以無限期持續請領"], ["D", "因非自願離職且符合資格者，一般可請領最長6個月"]], "ans": "D", "exp": "就業保險法規定，失業者因「非自願離職」且符合資格者，一般可請領最長6個月的失業給付，並非人人可領，也非無限期。"}, {"stem": "阿德最近失業了，正在尋找新工作。關於他可以獲得的協助，下列敘述何者「錯誤」？", "opts": [["A", "可到各地就業服務站尋求就業諮詢協助"], ["B", "政府會直接指派一份工作給他，雇主不得拒絕"], ["C", "可以參加政府所提供的各種職業訓練"], ["D", "符合就業保險法規定者，可以申請失業給付"]], "ans": "B", "exp": "政府提供的是就業資訊、就業諮詢、職業訓練與失業給付等協助，並不會強制指派工作給失業者，雇主仍保有聘僱的決定權。"}, {"stem": "政府提供職業訓練與職業訓練生活津貼，最主要的目的為何？", "opts": [["A", "提升勞工的就業技能，幫助其重返職場、充分就業"], ["B", "讓失業勞工可以永遠不必再工作"], ["C", "直接增加企業雇主的營業利潤"], ["D", "減少國家整體的勞動力人數"]], "ans": "A", "exp": "依就業保險法，政府提供職業訓練，目的在提升勞工的就業技能，使勞工能充分就業，並在受訓期間以生活津貼維持基本生活。"}, {"stem": "下列關於「勞動基準法」與「就業保險法」的比較，何者正確？", "opts": [["A", "兩者都是規範商品市場價格的法律"], ["B", "勞動基準法規定失業給付，就業保險法規定基本工資"], ["C", "兩者的立法目的都只在保障雇主的權益"], ["D", "勞動基準法規範勞動條件的最低標準；就業保險法保障失業者一定期間的基本生活"]], "ans": "D", "exp": "勞動基準法規範工資、工時、休假、童工、職災補償與退休等勞動條件；就業保險法則以促進就業、提供職業訓練與失業給付為主，兩者分工不同。"}, {"stem": "我國需要引進國際移工，最主要的原因為何？", "opts": [["A", "國際移工的技術一定比本國勞工優良"], ["B", "政府希望藉此減少本國人的就業機會"], ["C", "我國長期勞動力不足，需要移工填補人力缺口"], ["D", "法律強制規定每家企業都必須僱用移工"]], "ans": "C", "exp": "課本指出我國長期以來勞動力不足，需要移工填補人力缺口；在國際分工下，因薪資較低，國際移工逐漸成為工廠作業與家庭照顧工作的主力。"}, {"stem": "關於我國國際移工的勞動處境，下列敘述何者正確？", "opts": [["A", "從事家庭幫傭的移工無法享有勞動基準法的保障"], ["B", "移工享有的勞動權益與本國勞工完全相同"], ["C", "移工的薪資水準普遍高於本國勞工"], ["D", "我國對移工權益的法律保障目前已相當完備"]], "ans": "A", "exp": "課本指出，我國對國際移工權益保障的法律相對不足，從事家庭幫傭的移工無法享有勞動基準法的保障，也常缺乏適當休息時間與合理薪資。"}, {"stem": "民國108年南方澳跨港大橋斷裂，罹難者多為漁業移工。此事件使社會開始重視下列何種問題？", "opts": [["A", "臺灣觀光產業的未來發展方向"], ["B", "移工的勞動條件與職場安全問題"], ["C", "漁獲在市場上的價格漲跌"], ["D", "跨港大橋通行費的收取方式"]], "ans": "B", "exp": "部分漁業移工因雇主成本與管理考量，下班後仍須以漁船為家，安全與衛生堪慮。南方澳斷橋事件後，社會開始關注移工的勞動條件與職場安全，相關單位也承諾提供陸地安置。"}, {"stem": "在「零工經濟」下，透過網路平臺接案的清潔工或外送員，最可能面臨下列何種問題？", "opts": [["A", "工作時間完全被雇主控制，毫無彈性可言"], ["B", "收入十分穩定且福利制度完善"], ["C", "一定能獲得比正職員工更高的薪資"], ["D", "難以享有全職員工的保障與福利，須自行負擔勞健保、職災保險與退休金等成本"]], "ans": "D", "exp": "零工經濟工作者雖然時間較彈性，但平臺與雇主的角色差異，使其無法享有全職員工的保障與福利，還須自行支付原本由雇主負擔的勞健保、職災保險與退休金，且收入不穩定。"}, {"stem": "「勞動尊嚴」由國際勞工組織（ILO）於西元1999年提出，並被聯合國永續發展目標第8項納入。依課本說明，獲得勞動尊嚴的基礎為何？", "opts": [["A", "雇主個人的善意與同情"], ["B", "勞工在同一家公司的年資長短"], ["C", "合理的報酬"], ["D", "企業規模的大小"]], "ans": "C", "exp": "聯合國永續發展目標第8項「勞動尊嚴和經濟增長」指出，合理的報酬是獲得勞動尊嚴的基礎，勞動者應能透過工作賺取收入並享有工作尊嚴。"}, {"stem": "雇主以合理的待遇與員工福利留住優秀人才、凝聚員工向心力，並在經營時遵循法律與道德規範、善盡社會責任。這種表現稱為下列何者？", "opts": [["A", "企業倫理"], ["B", "工作倫理"], ["C", "就業歧視"], ["D", "勞資爭議"]], "ans": "A", "exp": "企業倫理是指業者經營企業時遵循法律與道德規範、善盡社會責任；「工作倫理」則是指個人從事職業活動時應遵守的行為規範，主體是勞動者本人，兩者不可混淆。"}, {"stem": "除了政府立法保障之外，下列何者也有助於改善勞資之間權力不對等的關係？", "opts": [["A", "勞工放棄爭取自身權益，全部聽從雇主安排"], ["B", "在教育中加強勞動知能的學習，提升民眾的勞動意識"], ["C", "政府完全不介入勞資關係，一切交由市場自行決定"], ["D", "廢除勞動基準法，讓勞雇雙方自由議定所有勞動條件"]], "ans": "B", "exp": "課本指出，除了改善法律外，還可在教育中加強勞動知能的學習、提升民眾的勞動意識，勞工也可採取組織團體抗爭、遊行或訴諸輿論等方式爭取權益。若放任市場或廢除勞基法，只會使權力不對等更加嚴重。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

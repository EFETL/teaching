<script>
const QS=[{"stem": "日常生活中，人們的借錢、購物、租屋等往來，主要由哪一部法律來規範私人之間的權利義務關係？", "opts": [["A", "刑法"], ["B", "民法"], ["C", "行政法"], ["D", "憲法"]], "ans": "B", "exp": "民法是規定私人間權利義務關係的法律，包含身分關係與財產關係。刑法處罰犯罪、行政法規範政府行使行政權、憲法是國家根本大法，都不是規範私人往來的法律。"}, {"stem": "民法所規範的內容可分為「身分關係」與「財產關係」，下列何者屬於身分關係？", "opts": [["A", "向便利商店購買飲料"], ["B", "向朋友借用腳踏車"], ["C", "父母與子女之間的親屬關係"], ["D", "向房東承租套房"]], "ans": "C", "exp": "身分關係指結婚、離婚、親屬、繼承等人與人之間身分上的權利義務；購買、借用、租賃則屬於財產關係。"}, {"stem": "小禾整理了一份清單：「向同學借錢、到早餐店買豆漿、向房東租房子」。這些行為在民法上共同屬於下列何者？", "opts": [["A", "財產關係"], ["B", "身分關係"], ["C", "繼承關係"], ["D", "親屬關係"]], "ans": "A", "exp": "借貸、買賣、租賃都涉及金錢與物品的往來，屬於民法上的財產關係，會產生債權與債務。"}, {"stem": "依民法規定，「契約」的正確定義是下列何者？", "opts": [["A", "由政府單位審核通過的書面文件"], ["B", "一方單獨表示願意付出的承諾"], ["C", "經過法院公證才生效的協議"], ["D", "雙方當事人基於意思表示一致而成立的法律行為"]], "ans": "D", "exp": "契約是雙方當事人對於身分或財產關係，基於意思表示一致而成立的法律行為，不必然要有書面、公證或政府審核。"}, {"stem": "同學向小禾借款100元，雙方成立借貸契約。這段「債」的關係在什麼情況下會消滅？", "opts": [["A", "同學依約把100元還給小禾之後"], ["B", "小禾把借據撕掉之後"], ["C", "同學向小禾道歉之後"], ["D", "兩人不再是同班同學之後"]], "ans": "A", "exp": "契約成立後產生債權與債務關係，債務人依約清償債務（還錢）後，「債」的關係即消滅。"}, {"stem": "在借貸契約中，出借人（借錢給別人的一方）享有的權利是下列何者？", "opts": [["A", "取得租金"], ["B", "取得還款"], ["C", "取得商品"], ["D", "取得價金"]], "ans": "B", "exp": "借貸契約中，出借人的義務是出借金錢、權利是取得還款；借用人的權利是取得借款、義務是償還借款。取得租金屬租賃、取得價金屬買賣。"}, {"stem": "關於一般契約的成立，下列敘述何者正確？", "opts": [["A", "一定要有兩位以上證人在場才能成立"], ["B", "一定要寫成書面契約才能成立"], ["C", "只要雙方意思表示一致即可成立，不需特別形式"], ["D", "一定要到政府機關登記後才能成立"]], "ans": "C", "exp": "民法規定一般契約只要當事人彼此意思表示一致就可成立，並不需要特別形式；若所有契約都必須用書面，反而造成生活上的不便。"}, {"stem": "小禾在早餐店對老闆說：「豆漿一杯。」老闆回答：「好，20元。」小禾說：「好，我要一杯！」此時買賣契約的效力為何？", "opts": [["A", "已經成立，口頭承諾即可生效"], ["B", "尚未成立，要付錢後才成立"], ["C", "尚未成立，要簽名或蓋章才成立"], ["D", "無效，因為沒有書面契約"]], "ans": "A", "exp": "買早餐屬於一般契約，雙方口頭表示一致契約即成立，不需書面，也不以交付金錢為成立要件。"}, {"stem": "當雙方決定簽訂書面契約時，關於「簽名」與「蓋章」的效力，下列敘述何者正確？", "opts": [["A", "簽名的效力大於蓋章"], ["B", "兩者具有同等效力"], ["C", "蓋章的效力大於簽名"], ["D", "必須簽名並蓋章，缺一不可"]], "ans": "B", "exp": "民法規定簽訂書面契約時，簽名或蓋章皆具有同等效力，不必兩者都做。"}, {"stem": "一般契約不需要書面就能成立，但許多人仍會選擇簽訂書面契約，最主要的理由是下列何者？", "opts": [["A", "書面契約可以讓契約金額變得更高"], ["B", "書面契約可以免除雙方的義務"], ["C", "書面契約可以讓未成年人自行訂約"], ["D", "日後若發生爭議，可作為舉證的依據"]], "ans": "D", "exp": "口說無憑，簽訂書面契約是為了避免日後爭議時舉證困難，可作為解決紛爭的證明依據，並不會改變契約本身的權利義務內容。"}, {"stem": "下列哪一種契約依民法規定，必須具備書面契約並且完成登記，才會發生效力？", "opts": [["A", "向同學借500元"], ["B", "到超商購買文具"], ["C", "房屋所有權移轉"], ["D", "向鄰居借用梯子"]], "ans": "C", "exp": "結婚、離婚、房屋（不動產）所有權移轉等契約，民法規定須以書面為之並完成登記才有效；其餘一般借貸、買賣不需特定形式。"}, {"stem": "依我國民法規定，兩人要成立有效的婚姻關係，必須符合下列何項要件？", "opts": [["A", "公開宴客並邀請親友見證即可"], ["B", "簽訂書面結婚書約、有兩位證人簽名或蓋章，並由雙方親自到戶政機關登記"], ["C", "只要雙方口頭同意結婚即可"], ["D", "由雙方父母代為到法院辦理登記即可"]], "ans": "B", "exp": "課本明確指出：結婚須有書面結婚書約、書約上有兩位證人簽名或蓋章，且新郎新娘雙方親自到戶政機關登記，婚姻才有效。僅有宴客並不生效力。"}, {"stem": "小禾的叔叔買了房子，簽訂買賣契約後，還必須到哪一個機關辦理房屋所有權移轉登記？", "opts": [["A", "地政事務所"], ["B", "戶政事務所"], ["C", "警察局"], ["D", "法院"]], "ans": "A", "exp": "房屋（不動產）所有權移轉登記由地政機關（地政事務所）辦理；戶政機關辦理的是結婚、出生等身分登記。"}, {"stem": "民法規定某些契約必須完成登記才生效，這樣規定的主要用意，除了提醒當事人慎重行事之外，還包括下列何者？", "opts": [["A", "增加政府的稅收來源"], ["B", "減少當事人簽約的時間"], ["C", "讓政府可以決定契約的內容"], ["D", "將資訊公開明示，讓當事人或不知情的第三者能查詢，以保障他人權益"]], "ans": "D", "exp": "登記具有「公示」作用，把契約結果公開於社會，避免不知情的第三人因資訊落差而權益受損。"}, {"stem": "訂定契約的雙方不欺騙、守承諾，這項被視為民法「最高指導原則」的是下列何者？", "opts": [["A", "契約自由原則"], ["B", "消滅時效"], ["C", "誠實信用原則"], ["D", "禁止權利濫用"]], "ans": "C", "exp": "誠實信用原則要求當事人行使權利、履行義務時誠實不欺，是民法（乃至其他法律）的最高指導原則。"}, {"stem": "屋主明知自己的房子曾發生非自然死亡事件（凶宅），卻在賣屋時刻意隱瞞屋況，向買方保證「房子屋況很好」。此舉違反民法的哪一項原則？", "opts": [["A", "誠實信用原則"], ["B", "契約自由原則"], ["C", "禁止權利濫用"], ["D", "消滅時效"]], "ans": "A", "exp": "隱瞞重要屋況屬於欺瞞行為，違反誠實信用原則，此種情況下契約可能不具法律效力。"}, {"stem": "下列關於「契約自由原則」的敘述，何者最為正確？", "opts": [["A", "契約內容完全不受任何限制"], ["B", "當事人可自行決定是否訂約、與誰訂約及訂約的內容與方式"], ["C", "只要契約已成立，任何一方都可以隨時反悔"], ["D", "未成年人也可以完全自由地訂定任何契約"]], "ans": "B", "exp": "契約自由原則基於尊重個人自由意思，讓當事人自行決定訂約與否、對象、內容與方式；但仍受法律與公序良俗限制，未成年人也另受行為能力規定的限制。"}, {"stem": "小明想與人簽訂一份「代為販賣違禁品」的契約。依民法規定，這份契約的效力為何？", "opts": [["A", "有效，因為雙方意思表示一致"], ["B", "有效，因為契約自由不受限制"], ["C", "有效，但要先向政府登記"], ["D", "無效，因為契約內容違反法律規定"]], "ans": "D", "exp": "契約自由並非毫無限制，契約內容不得違反法律規定、公共秩序或善良風俗，否則契約無效。"}, {"stem": "阿川在自家店門口的騎樓堆放大量貨物，阻礙行人通行，還說：「我在自己店門口堆東西是我的權利。」他的行為違反民法的哪一項原則？", "opts": [["A", "誠實信用原則"], ["B", "契約自由原則"], ["C", "禁止權利濫用"], ["D", "消滅時效"]], "ans": "C", "exp": "騎樓土地雖屬私人所有，但行使權利不得濫用而違反公共利益或損害他人權益，阻礙通行屬於權利濫用，應予禁止。"}, {"stem": "民法規定「消滅時效」，其意義為下列何者？", "opts": [["A", "權利人若超過一定時間不行使權利，權利會喪失或受到限制"], ["B", "契約簽訂滿一定時間後自動變成書面契約"], ["C", "未成年人滿一定年齡後自動取得完全行為能力"], ["D", "契約金額經過一定時間後會自動增加"]], "ans": "A", "exp": "消滅時效是指權利人在一定期間內不行使權利，該權利即喪失或受到限制，目的在使法律關係早日確定。"}, {"stem": "「法律不保障在權利上睡著的人」這句話，最能說明民法的哪一項規定？", "opts": [["A", "誠實信用原則"], ["B", "消滅時效"], ["C", "契約自由原則"], ["D", "禁止權利濫用"]], "ans": "B", "exp": "這句話正是消滅時效的精神：長期不主張自己的權利，權利就可能喪失或受限。"}, {"stem": "小妍借錢給小蓁後，一直到15年後才向小蓁追討。依民法消滅時效的規定，最可能出現下列何種結果？", "opts": [["A", "小蓁必須連本帶利加倍償還"], ["B", "小妍可以請求法院強制小蓁立刻還錢"], ["C", "契約自動轉為書面契約繼續有效"], ["D", "小蓁可以主張時效已過而拒絕還錢"]], "ans": "D", "exp": "一般而言借款請求返還的時效為15年，超過時效未行使權利，債務人可主張拒絕給付，這就是「法律不保障在權利上睡著的人」。"}, {"stem": "民法上所稱的「行為能力」，是指下列何者？", "opts": [["A", "一個人賺取金錢的能力"], ["B", "一個人負擔刑事責任的能力"], ["C", "一個人能獨立行使有效法律行為的能力"], ["D", "一個人參與選舉投票的能力"]], "ans": "C", "exp": "行為能力是指能否獨立從事在法律上有效的行為（如自己訂定契約），與經濟能力、刑事責任能力或參政權都不同。"}, {"stem": "民法主要依據哪些條件，將人的行為能力區分為三種？", "opts": [["A", "年齡以及精神、心智狀態"], ["B", "學歷以及工作經驗"], ["C", "財產多寡以及收入高低"], ["D", "性別以及居住地區"]], "ans": "A", "exp": "民法依「年齡」與「精神、心智狀態」把行為能力人分為無行為能力人、限制行為能力人、完全行為能力人三類。"}, {"stem": "今年6歲、就讀幼兒園大班的小安，在民法上屬於下列何種行為能力人？", "opts": [["A", "完全行為能力人"], ["B", "無行為能力人"], ["C", "限制行為能力人"], ["D", "受監護宣告人"]], "ans": "B", "exp": "未滿7歲的未成年人屬於無行為能力人，其法律行為無效，須由法定代理人代為行使。"}, {"stem": "小安（5歲）自己拿零用錢到玩具店買了一台500元的遙控車。依民法規定，這個買賣行為的效力為何？", "opts": [["A", "有效，因為屬於日常生活所必需"], ["B", "有效，因為雙方意思表示一致"], ["C", "效力未定，須經父母事後承認"], ["D", "無效，須由法定代理人代為行使才有效力"]], "ans": "D", "exp": "未滿7歲為無行為能力人，其法律行為一律「無效」，不是「效力未定」，必須由法定代理人代為行使才會產生效力。故店員會說「要請你爸媽來買才可以喔」。"}, {"stem": "一位因精神障礙而無法辨識自己意思、經法院作出監護宣告的成年人，在民法上屬於下列何者？", "opts": [["A", "完全行為能力人"], ["B", "限制行為能力人"], ["C", "無行為能力人"], ["D", "視情況由當事人自行選擇"]], "ans": "C", "exp": "受監護宣告的人與未滿7歲者同樣屬於無行為能力人，其法律行為無效，須由法定代理人代為行使。"}, {"stem": "依民法規定，「監護宣告」是由下列哪一個機關作出？", "opts": [["A", "法院"], ["B", "戶政事務所"], ["C", "地政事務所"], ["D", "衛生福利部"]], "ans": "A", "exp": "因精神障礙或其他心智缺陷而無法辨識其意思者，須由特定人向法院聲請，並由法院作出監護宣告。"}, {"stem": "今年14歲、就讀八年級的小南，在民法上屬於下列何種行為能力人？", "opts": [["A", "無行為能力人"], ["B", "限制行為能力人"], ["C", "完全行為能力人"], ["D", "受監護宣告人"]], "ans": "B", "exp": "7歲以上未滿18歲的未成年人屬於限制行為能力人，國中生大多屬於此類。"}, {"stem": "依民法規定，「限制行為能力人」的年齡範圍為下列何者？", "opts": [["A", "未滿7歲"], ["B", "7歲以上未滿16歲"], ["C", "12歲以上未滿18歲"], ["D", "7歲以上未滿18歲"]], "ans": "D", "exp": "行為能力的兩個年齡分界是7歲與18歲：未滿7歲為無行為能力人，7歲以上未滿18歲為限制行為能力人，年滿18歲為完全行為能力人。"}, {"stem": "限制行為能力人所做的法律行為，原則上必須符合下列何種條件才具有法律效力？", "opts": [["A", "須由法定代理人完全代為行使"], ["B", "須經過法院裁定同意"], ["C", "須經法定代理人事前允許或事後承認"], ["D", "只要當事人自己同意即可"]], "ans": "C", "exp": "限制行為能力人已有部分判斷能力，其行為「原則上」須經法定代理人事前允許或事後承認才有效，並非像無行為能力人那樣一律由法定代理人代為行使。"}, {"stem": "雖然限制行為能力人的行為原則上須經法定代理人同意，但有兩種例外情形不必取得同意也具效力，這兩種情形是下列何者？", "opts": [["A", "單純獲得法律上利益，以及依其年齡及身分、日常生活所必需的行為"], ["B", "金額在1000元以下，以及在學校內完成的行為"], ["C", "有同學陪同，以及事先通知導師的行為"], ["D", "使用自己打工所得，以及在網路上完成的行為"]], "ans": "A", "exp": "民法第77條的例外有二：純獲法律上利益（如領獎學金、接受贈禮），以及依其年齡及身分、日常生活所必需者（如買文具、搭公車）。"}, {"stem": "國二的小華獲得學校頒發的獎學金5000元，也收下了阿姨送的生日禮物。這些行為的效力為何？", "opts": [["A", "無效，因為小華是未成年人"], ["B", "有效，因為屬於單純獲得法律上利益"], ["C", "無效，須由法定代理人代為領取"], ["D", "效力未定，須父母事後承認"]], "ans": "B", "exp": "領獎學金、接受贈禮屬於「純獲法律上利益」的行為，限制行為能力人不必取得法定代理人同意，仍具法律效力。"}, {"stem": "國中生小康用零用錢到文具店買了一支筆，又刷了學生卡搭公車上學。媽媽事後主張「未成年交易無效」要求退貨。下列判斷何者正確？", "opts": [["A", "可以主張無效，因為小康未滿18歲"], ["B", "可以主張無效，因為小康沒有經過媽媽同意"], ["C", "可以主張無效，因為小康是無行為能力人"], ["D", "不可以主張無效，因為屬於依其年齡及身分、日常生活所必需的行為"]], "ans": "D", "exp": "買文具、搭公車符合國中生年齡與身分、屬日常生活所必需，不必取得法定代理人同意即具法律效力，家長不能事後主張無效。"}, {"stem": "16歲的小禾想在外租屋，自行前往找房東簽約。依民法規定，房東最正確的處理方式為下列何者？", "opts": [["A", "直接讓小禾簽約，因為租屋是日常生活所必需"], ["B", "拒絕出租，因為未成年人一律不得承租房屋"], ["C", "要求小禾提出父母的同意書，或請父母陪同簽約"], ["D", "讓小禾簽約，但租金要提高作為保障"]], "ans": "C", "exp": "16歲屬限制行為能力人，租屋契約金額較高、非日常生活所必需，須經法定代理人（父母）事前允許或事後承認才有效。"}, {"stem": "15歲的小美未經父母同意，自行向3C用品店訂購一台價值3萬元的筆記型電腦，並向店家強調「我有能力支付3萬元」。依民法規定，下列判斷何者最正確？", "opts": [["A", "契約效力未定，若父母不承認即無效，家長可要求退貨退款"], ["B", "契約有效，因為小美有能力支付價金"], ["C", "契約有效，因為3C用品屬於日常生活必需品"], ["D", "契約無效，因為小美是無行為能力人"]], "ans": "A", "exp": "15歲為限制行為能力人；高價3C用品在實務上多不被認定為日常生活必需品，也非純獲利益，故須法定代理人允許或承認，父母不同意時契約不生效力。小美本人有無支付能力並不影響判斷。"}, {"stem": "依民法規定，未成年子女的「法定代理人」通常是下列何者？", "opts": [["A", "學校的導師"], ["B", "父母"], ["C", "里長"], ["D", "法院指定的檢察官"]], "ans": "B", "exp": "民法規定父母為其未成年子女的法定代理人，負責代為或同意其法律行為。"}, {"stem": "年滿18歲且未受監護宣告的人，在民法上屬於下列何者？", "opts": [["A", "完全行為能力人"], ["B", "限制行為能力人"], ["C", "無行為能力人"], ["D", "須視是否已就業而定"]], "ans": "A", "exp": "年滿18歲的成年人且精神狀態健全者，屬完全行為能力人，其法律行為具完全效力。"}, {"stem": "22歲的艾莎自行與房東簽訂租屋契約。此契約的效力為何？", "opts": [["A", "無效，須父母陪同才有效"], ["B", "效力未定，須父母事後承認"], ["C", "有效，艾莎為完全行為能力人可獨立訂約"], ["D", "無效，租屋契約一律須經法院公證"]], "ans": "C", "exp": "22歲已成年，屬完全行為能力人，可獨立從事有效的法律行為，自行簽訂租屋契約完全有效。"}, {"stem": "關於「完全行為能力人」的敘述，下列何者正確？", "opts": [["A", "其法律行為須經配偶同意才有效"], ["B", "其法律行為一律無效"], ["C", "其法律行為須由法定代理人代為行使"], ["D", "可獨立從事有效的法律行為，並自行承擔契約上的權利義務"]], "ans": "D", "exp": "完全行為能力人的行為在法律上具完全效力，可自行訂約並須履行契約義務，若不履行則須負相應的法律責任。"}, {"stem": "關於民法上行為能力的年齡分界，下列敘述何者完全正確？", "opts": [["A", "未滿7歲為無行為能力人；7歲以上未滿18歲為限制行為能力人；年滿18歲為完全行為能力人"], ["B", "未滿7歲為限制行為能力人；7歲以上未滿20歲為無行為能力人；年滿20歲為完全行為能力人"], ["C", "未滿12歲為無行為能力人；12歲以上未滿18歲為限制行為能力人；年滿18歲為完全行為能力人"], ["D", "未滿7歲為無行為能力人；7歲以上未滿20歲為限制行為能力人；年滿20歲為完全行為能力人"]], "ans": "A", "exp": "我國民法成年年齡已修正為18歲。行為能力的兩條界線是7歲與18歲，須牢記：未滿7歲（無效）、7歲以上未滿18歲（須法定代理人允許或承認）、年滿18歲（完全有效）。"}, {"stem": "民法對未成年人及受監護宣告者的法律行為加以限制，最主要的用意為下列何者？", "opts": [["A", "減少政府處理民事案件的負擔"], ["B", "避免未成年人取得任何財產"], ["C", "保護判斷能力或社會經驗不足者的權益"], ["D", "讓商家可以自由決定要不要交易"]], "ans": "C", "exp": "未成年人與受監護宣告者因判斷能力或社會經驗不足，民法限制其法律行為，是為了保護他們的權益，避免因判斷失誤而受到不利影響。"}, {"stem": "依民法規定，下列何者屬於「侵權行為」的定義？", "opts": [["A", "未依約定的時間交付商品"], ["B", "未在時效內請求返還借款"], ["C", "未簽訂書面契約即進行交易"], ["D", "因故意或過失，不法侵害他人的財物、身體健康等權益"]], "ans": "D", "exp": "侵權行為指因故意或過失損害他人財物、傷害他人身體健康等，須負損害賠償責任；（A）屬債務不履行，（B）涉及消滅時效，（C）不影響一般契約成立。"}, {"stem": "油漆工人在工作時不小心踢倒油漆桶，弄髒了鄰居的牆面。就民法而言，這位工人的心態應屬下列何者？", "opts": [["A", "故意"], ["B", "過失"], ["C", "正當防衛"], ["D", "緊急避難"]], "ans": "B", "exp": "過失是指行為人應注意、能注意卻未注意，在疏忽情況下使意外結果發生；若是明知並有意使結果發生（如故意在牆上塗鴉），則屬故意。"}, {"stem": "民法規定侵權行為人須負「損害賠償責任」，其主要用意為下列何者？", "opts": [["A", "彌補被害人所受的損失"], ["B", "懲罰加害人使其得到報應"], ["C", "增加國家的財政收入"], ["D", "剝奪加害人的行為能力"]], "ans": "A", "exp": "損害賠償的目的不在懲罰加害人（懲罰是刑法的功能），而在填補被害人的損失，使其回復原有狀態。"}, {"stem": "依民法規定，損害賠償的方式應優先採取下列何者？", "opts": [["A", "以金錢賠償為原則，例外才回復原狀"], ["B", "由被害人自行選擇是否要求道歉"], ["C", "以回復原狀為原則，無法回復原狀時才以金錢賠償替代"], ["D", "一律由法院決定加害人應服勞役的時數"]], "ans": "C", "exp": "損害賠償以「回復原狀」為原則，若無法回復原狀，才以金錢賠償替代。"}, {"stem": "阿明打球時不慎打破鄰居的玻璃窗。依民法損害賠償的原則，他最應優先採取的做法為下列何者？", "opts": [["A", "等鄰居向法院起訴後再處理"], ["B", "直接付一筆錢給鄰居，不必修復"], ["C", "向鄰居道歉即可，不須負任何責任"], ["D", "負責把玻璃窗修復，回復成原來的樣子"]], "ans": "D", "exp": "損害賠償以回復原狀為原則，玻璃窗可以修復，因此應先修復；若損害無法回復原狀時，才改以金錢賠償。"}, {"stem": "契約訂定後，若當事人一方未履行契約內容，這在民法上稱為下列何者？", "opts": [["A", "權利濫用"], ["B", "侵權行為"], ["C", "消滅時效"], ["D", "債務不履行"]], "ans": "D", "exp": "契約成立後未依約履行義務即為「債務不履行」，與因故意過失侵害他人權益的「侵權行為」不同。"}, {"stem": "小華向網路賣家下單並付款後，賣家遲遲不依約定出貨。賣家的行為屬於下列何者？", "opts": [["A", "權利濫用"], ["B", "侵權行為"], ["C", "債務不履行"], ["D", "契約自始無效"]], "ans": "C", "exp": "買賣契約成立後，賣方不依約定交貨或買方不依約定付款，都屬於債務不履行。"}, {"stem": "當一方發生債務不履行時，權利受損的另一方依民法規定可以主張下列何種救濟？", "opts": [["A", "要求對方入獄服刑"], ["B", "要求解除契約、減少價金或請求損害賠償"], ["C", "要求撤銷對方的行為能力"], ["D", "自行取走對方等值的財物抵債"]], "ans": "B", "exp": "債務不履行時，權利受損的一方可以要求解除契約、減少價金或請求損害賠償。入獄服刑屬刑事責任，自行取走他人財物則可能另構成違法行為。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

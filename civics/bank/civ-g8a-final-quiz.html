<script>
const QS=[{"stem": "「地方上的人民依法選舉並組織地方政府，自行管理地方上的公共事務。」這段話是在說明下列何者的意義？", "opts": [["A", "權力分立"], ["B", "主權在民"], ["C", "地方自治"], ["D", "均權制度"]], "ans": "C", "exp": "課本對「地方自治」的定義即為：地方上的人民依法選出地方行政首長與民意代表，組成地方政府，自行管理地方上的公共事務。"}, {"stem": "下列何者「不是」推行地方自治的重要性？", "opts": [["A", "使政治事務能夠分層負責"], ["B", "使中央政府得以獨攬全國一切事務"], ["C", "讓政府規畫的政策更貼近地方人民的生活需求"], ["D", "提供地方人民參與公共事務的機會，培養民主觀念與責任"]], "ans": "B", "exp": "地方自治的用意正是把部分事務下放給地方，讓政治事務分層負責，而不是讓中央獨攬全部事務。"}, {"stem": "颱風來襲時，是否停班停課是由各縣市首長宣布，而不是由中央統一決定，最主要的理由為何？", "opts": [["A", "中央政府沒有處理天然災害的任何權力"], ["B", "停班停課屬於司法權的範圍"], ["C", "憲法明文規定災害防救是地方的專屬立法權"], ["D", "各地降雨量、風力與受災程度不同，交由地方因地制宜較符合實際需要"]], "ans": "D", "exp": "中央負責制定全國一致的標準與作業辦法，地方則依轄區降水量、風力等危害程度，因地制宜決定是否停班停課。"}, {"stem": "我國中央與地方的權限劃分採「均權制度」，此一原則主要規定於下列何者？", "opts": [["A", "中華民國憲法"], ["B", "地方制度法"], ["C", "財政收支劃分法"], ["D", "行政院組織法"]], "ans": "A", "exp": "課本指出「依據我國憲法規定，中央與地方的權限劃分採均權制度」。地方制度法規範的則是地方自治團體的組成與自治事項。"}, {"stem": "依均權制度的精神，下列何項事務最應由中央政府統籌辦理？", "opts": [["A", "某市的垃圾清運路線安排"], ["B", "某縣學校營養午餐的收費標準"], ["C", "國防與外交事務"], ["D", "某市文化園區的展覽活動"]], "ans": "C", "exp": "具有「全國一致性質」的事務，如國防、外交與司法制度，應由中央政府統籌辦理；其餘三者都具有因地制宜的性質。"}, {"stem": "依均權制度，下列何者最屬於「因地制宜」而由地方政府負責的事務？", "opts": [["A", "制定全國一致的司法制度"], ["B", "依轄區風雨程度決定是否發布停班停課"], ["C", "與他國簽訂條約"], ["D", "統籌全國國防兵力的配置"]], "ans": "B", "exp": "天然災害宣布停班停課、公共衛生、都市計畫等，都是因地制宜性質的事務，由地方政府負責。"}, {"stem": "若中央政府與地方政府對某事務的權限歸屬發生爭議，依憲法規定應交由下列何機關解決？", "opts": [["A", "司法院"], ["B", "行政院"], ["C", "監察院"], ["D", "立法院"]], "ans": "D", "exp": "憲法規定，中央與地方權限劃分若發生爭議，交由立法院解決。"}, {"stem": "「中央政府主管全國事務，地方政府主管地方事務」，這樣的分權方式屬於下列何者？", "opts": [["A", "垂直分權"], ["B", "水平分權"], ["C", "五權分立"], ["D", "主權在民"]], "ans": "A", "exp": "垂直分權是指政府權力因層級不同而分屬中央與地方；水平分權則是同一層級政府內部的分權。"}, {"stem": "「中央政府採五權分立的制度，地方政府則分為行政權與立法權。」這種分權方式屬於下列何者？", "opts": [["A", "垂直分權"], ["B", "水平分權"], ["C", "均權制度"], ["D", "中央集權"]], "ans": "B", "exp": "水平分權指同一層級政府把權力分配給不同部門，使彼此相互制衡；中央的五權分立與地方的行政、立法分立都屬之。"}, {"stem": "我國地方自治團體的種類與地方政府的組成，主要規定於下列哪一部法律？", "opts": [["A", "憲法增修條文"], ["B", "公民投票法"], ["C", "地方制度法"], ["D", "財政收支劃分法"]], "ans": "C", "exp": "中央政府依憲法及憲法增修條文組成；地方政府（地方自治團體）則依「地方制度法」設立與運作。"}, {"stem": "依地方制度法規定，下列何者「不是」地方自治團體？", "opts": [["A", "臺灣省政府"], ["B", "新竹市"], ["C", "臺中市和平區"], ["D", "彰化縣田中鎮"]], "ans": "A", "exp": "民國86年修憲後省已「虛級化」，成為行政院的派出機關，不再是地方自治團體。新竹市為與縣同級的市、和平區為直轄市山地原住民區、田中鎮為縣所管轄的鎮，皆屬地方自治團體。"}, {"stem": "民國86年修憲後將「省」虛級化，現在省的地位為何？", "opts": [["A", "仍是地方自治團體，並設有省議會"], ["B", "已全部升格改制為直轄市"], ["C", "改隸屬於立法院，負責監督地方"], ["D", "成為行政院的派出機關，不再是地方自治團體"]], "ans": "D", "exp": "省政府因與中央政府的行政範圍高度重疊，為提高政府效能而虛級化，現為行政院的派出機關。"}, {"stem": "我國目前設有幾個「直轄市山地原住民區」？", "opts": [["A", "3個"], ["B", "6個"], ["C", "13個"], ["D", "22個"]], "ans": "B", "exp": "全國共有6個直轄市山地原住民區，分別由原臺北縣烏來鄉、桃園縣復興鄉、臺中縣和平鄉，以及高雄縣那瑪夏鄉、桃源鄉、茂林鄉改制而來。"}, {"stem": "關於我國目前的行政區劃分，下列敘述何者正確？", "opts": [["A", "4個直轄市、18個縣市"], ["B", "5個直轄市、17個縣市"], ["C", "6個直轄市、13個縣及3個與縣同級的市"], ["D", "6個直轄市、16個縣，且無與縣同級的市"]], "ans": "C", "exp": "我國共22個行政區：6個直轄市（臺北、新北、桃園、臺中、臺南、高雄）、13個縣，以及基隆市、新竹市、嘉義市3個與縣同級的市。"}, {"stem": "下列哪一組全部都是「與縣同級的市」？", "opts": [["A", "基隆市、新竹市、嘉義市"], ["B", "臺北市、新北市、桃園市"], ["C", "板橋區、豐原區、鳳山區"], ["D", "彰化市、屏東市、竹北市"]], "ans": "A", "exp": "(B) 為直轄市；(C) 為直轄市轄下的區；(D) 為縣所管轄、與鄉鎮同級的縣轄市。"}, {"stem": "下列何者「不是」我國進行地方政府合併與改制的主要原因？", "opts": [["A", "整合行政資源"], ["B", "均衡區域發展"], ["C", "改善地方政府的行政效率與財政收入"], ["D", "減少人民選舉地方行政首長的機會"]], "ans": "D", "exp": "改制升格的目的在整合資源、均衡區域發展、提升行政效率與財政收入，並非為了剝奪人民的選舉權。"}, {"stem": "臺中縣、臺中市合併改制為臺中市後，原本由臺中縣管轄的「豐原市」變成下列何者？", "opts": [["A", "獨立的直轄市"], ["B", "仍為縣轄市，繼續選舉市長"], ["C", "臺中市豐原區，區長由市長任免"], ["D", "直轄市山地原住民區，可選舉區長"]], "ans": "C", "exp": "縣市合併改制為直轄市後，原本的鄉、鎮、縣轄市一律改制為「區」；區不是地方自治團體，區長由市長依法任免。"}, {"stem": "下列何者屬於「地方行政機關」？", "opts": [["A", "臺南市議會"], ["B", "屏東縣里港鄉公所"], ["C", "苗栗縣議會"], ["D", "連江縣議會"]], "ans": "B", "exp": "地方行政機關包括直轄市政府、縣（市）政府、鄉（鎮、縣轄市）公所與直轄市山地原住民區公所；各級議會則屬地方立法機關。"}, {"stem": "下列何者屬於「地方立法機關」？", "opts": [["A", "高雄市那瑪夏區民代表會"], ["B", "新北市政府"], ["C", "花蓮縣吉安鄉公所"], ["D", "嘉義市政府"]], "ans": "A", "exp": "地方立法機關包括直轄市議會、縣（市）議會、鄉（鎮、縣轄市）民代表會與直轄市山地原住民區民代表會。"}, {"stem": "關於地方行政機關的職權，下列敘述何者錯誤？", "opts": [["A", "處理地方自治事務"], ["B", "執行上級政府委辦的事項"], ["C", "監督下級政府機關"], ["D", "議決地方自治條例與預算"]], "ans": "D", "exp": "議決自治條例與預算是地方「立法機關」的職權；行政機關負責的是編列預算與執行政策。"}, {"stem": "關於地方立法機關的職權，下列何者正確？", "opts": [["A", "任免地方行政首長"], ["B", "直接執行地方自治事務與建設工程"], ["C", "議決地方自治條例與預算，並質詢、監督行政機關施政"], ["D", "審判違法失職的地方公務員"]], "ans": "C", "exp": "地方民意代表由人民選出，負責反映民意、議決自治條例與預算，並質詢監督地方行政機關的施政。"}, {"stem": "教育部委請各地方政府辦理國中教育會考，這屬於地方行政機關的何種工作？", "opts": [["A", "執行上級政府的委辦事項"], ["B", "議決地方自治條例"], ["C", "行使地方立法權"], ["D", "行使司法審判權"]], "ans": "A", "exp": "地方行政機關除處理自治事務外，還須執行上級政府依法委託辦理的事項，稱為「委辦事項」。"}, {"stem": "某縣議會審查縣政府送來的工程預算，認為編列不合理而加以刪減。這最能展現地方政府的何種運作原則？", "opts": [["A", "中央集權"], ["B", "立法機關對行政機關的監督制衡"], ["C", "司法獨立"], ["D", "均權制度"]], "ans": "B", "exp": "預算由地方行政機關編列，再由地方立法機關議決，形成水平分權下行政與立法相互制衡的關係。"}, {"stem": "地方政府實施地方自治時，所擁有的政府權力包括下列何者？", "opts": [["A", "行政權、立法權、司法權"], ["B", "行政權、考試權"], ["C", "立法權、監察權"], ["D", "行政權與立法權"]], "ans": "D", "exp": "地方自治僅包含行政權與立法權，其餘三權仍屬於中央政府。"}, {"stem": "承上題，下列哪一組權力仍專屬於中央政府，地方政府並不具備？", "opts": [["A", "司法權、考試權、監察權"], ["B", "行政權、立法權"], ["C", "立法權、司法權"], ["D", "考試權、行政權"]], "ans": "A", "exp": "中央政府採五權分立，其中司法權、考試權與監察權不下放給地方，地方政府只有行政與立法兩權。"}, {"stem": "「由地方立法機關通過、地方行政機關公布，且僅適用於該地方行政區的自治法規」，稱為下列何者？", "opts": [["A", "命令"], ["B", "憲法增修條文"], ["C", "自治條例"], ["D", "法律"]], "ans": "C", "exp": "狹義的「法律」須由立法院通過、總統公布；地方立法機關通過、地方行政機關公布的規範則稱為自治條例。"}, {"stem": "關於自治條例的敘述，下列何者正確？", "opts": [["A", "通過後可適用於全國各行政區"], ["B", "由中央政府制定後交由地方公布"], ["C", "效力高於中央政府所制定的法律"], ["D", "不得牴觸憲法及中央法令，且僅適用於該地方行政區"]], "ans": "D", "exp": "自治條例有地域限制，只適用於該地方行政區，且位階低於憲法與中央的法律、命令，不得牴觸。"}, {"stem": "「苗栗縣石虎保育自治條例」是下列何者行使職權的成果？", "opts": [["A", "立法院三讀通過後由總統公布"], ["B", "苗栗縣議會議決通過，由苗栗縣政府公布"], ["C", "內政部依職權發布的行政命令"], ["D", "苗栗縣民代表會議決通過"]], "ans": "B", "exp": "縣的立法機關是縣議會（縣並沒有「縣民代表會」），自治條例由縣議會議決通過、縣政府公布。"}, {"stem": "各縣市學校營養午餐的收費標準與食材可以有所不同，這最能說明地方自治的何種特色？", "opts": [["A", "地方須完全遵守中央訂定的統一標準"], ["B", "地方法規可以牴觸中央法令"], ["C", "因地制宜，能貼近在地需求並較快回應民意"], ["D", "地方政府擁有司法審判的權力"]], "ans": "C", "exp": "營養午餐的收費與食材屬因地制宜性質，由各縣市政府自行決定，展現地方自治具有彈性、貼近民眾需求的特色。"}, {"stem": "下列 ], ["B", "中央政府可以任意撤換人民選出的地方行政首長"], ["C", "地方政府只需推動自治事項，不必配合中央的政策"], ["D", "地方政府需要中央的統籌規畫與資源挹注，中央的政策也需地方協力推動"]], "ans": "D", "exp": "中央與地方是分權且合作的關係：地方需要中央的資源與統籌規畫，中央政策也要靠地方協力推行，兩者相互配合才能有效提供公共服務。"}, {"stem": "小明的家鄉是彰化縣田中鎮，則直接管理他家鄉公共事務的行政機關與立法機關分別為何？", "opts": [["A", "彰化縣政府、彰化縣議會"], ["B", "田中鎮公所、田中鎮民代表會"], ["C", "彰化縣政府、田中鎮民代表會"], ["D", "田中鎮公所、彰化縣議會"]], "ans": "B", "exp": "鎮與鄉、縣轄市同級，其行政機關為鎮公所、立法機關為鎮民代表會；彰化縣政府與縣議會則是上一級的地方政府。"}, {"stem": "下列有關「地方自治」的敘述，何者錯誤？", "opts": [["A", "地方行政首長由該地人民依法選舉產生"], ["B", "地方民意代表由該地人民依法選舉產生"], ["C", "地方立法機關可制定與中央法律相牴觸的自治條例"], ["D", "地方自治團體對轄區內部分公共事務享有自治權限"]], "ans": "C", "exp": "自治條例不得牴觸憲法及中央政府頒布的法律與命令，否則無效。"}, {"stem": "綜合本課內容，下列關於我國地方政府的敘述，何者正確？", "opts": [["A", "中央與地方採均權制度，地方自治團體依地方制度法設立，並由行政、立法兩機關相互制衡"], ["B", "地方政府比照中央採五權分立，另設有地方司法院與地方監察院"], ["C", "直轄市所轄的每一個區都可以選舉自己的區長與區民代表"], ["D", "省是我國層級最高的地方自治團體，統轄各縣市政府"]], "ans": "A", "exp": "(B) 地方只有行政權與立法權；(C) 只有6個直轄市山地原住民區可民選區長與區民代表，一般的區區長由市長任免；(D) 省已虛級化，是行政院的派出機關，不再是地方自治團體。"}, {"stem": "小華的爸爸每天收看政論節目，媽媽參加了社區公聽會，姐姐則在網路上投書評論政府的能源政策。上述行為在公民課本中被統稱為什麼？", "opts": [["A", "公共意見"], ["B", "政治參與"], ["C", "政黨政治"], ["D", "直接民主"]], "ans": "B", "exp": "政治參與是指人民以各種途徑，試圖影響政府人事及公共政策的行動。關心時事、參加公聽會、投書媒體、參與政黨活動、參與選舉及公投等都屬於政治參與的方式。"}, {"stem": "課本提到：「若人民對公共事務漠不關心、缺乏民主素養」，最可能造成下列何種結果？", "opts": [["A", "政府施政會更加謹慎並傾聽民意"], ["B", "公共意見會更容易凝聚成共識"], ["C", "政治權力被少數人掌握，政府因缺乏監督而效能不彰"], ["D", "選舉的投票率會大幅上升"]], "ans": "C", "exp": "課本指出，人民積極參與時政府會更謹慎、傾聽民意；反之若人民政治冷漠，政治權力容易被少數人掌握，政府缺乏監督而效能不彰。"}, {"stem": "下列哪一項「不」屬於課本所介紹的政治參與方式？", "opts": [["A", "週末到百貨公司採買換季衣物"], ["B", "參加反對開發案的示威遊行"], ["C", "打電話call in到政論節目表達意見"], ["D", "加入政黨並協助候選人助選"]], "ans": "A", "exp": "政治參與必須是「試圖影響政府人事或公共政策」的行動。單純的購物消費屬於個人經濟生活，與影響政府決策無關，不算政治參與。"}, {"stem": "在眾多政治參與的途徑中，課本認為「最普遍且最重要」的方式是下列何者？", "opts": [["A", "參加集會遊行"], ["B", "投書媒體"], ["C", "加入利益團體"], ["D", "投票"]], "ans": "D", "exp": "三個版本課本一致指出，投票是民主國家最常見、最普遍且最重要的政治參與方式，因為投票結果最能直接、明確地表達民意。"}, {"stem": "投票依對象不同可分為「對人的投票」與「對事的投票」。下列配對何者正確？", "opts": [["A", "罷免市長／對事的投票"], ["B", "決定是否同意某項政策／對事的投票"], ["C", "選舉立法委員／對事的投票"], ["D", "公民投票／對人的投票"]], "ans": "B", "exp": "對人的投票是選舉、罷免行政首長或民意代表；對事的投票則是針對法律或政策所進行的公民投票。決定是否同意某項政策屬於對事的投票。"}, {"stem": "某市市長當選後施政不符人民期待，選民依法將他解職。這種投票方式最能落實下列何種精神？", "opts": [["A", "責任政治，讓不適任的公職人員必須對人民負責"], ["B", "直接民主，由人民直接制定法律"], ["C", "權力分立，避免行政權過度集中"], ["D", "依法行政，政府施政必須有法律依據"]], "ans": "A", "exp": "這是「罷免」。人民可以用選票罷免不適任的公職人員，代表公職人員必須為施政成果對人民負責，落實責任政治與主權在民的精神。"}, {"stem": "我國為了落實憲法所保障的創制權與複決權，制定了下列哪一部法律？", "opts": [["A", "公職人員選舉罷免法"], ["B", "總統副總統選舉罷免法"], ["C", "公民投票法"], ["D", "集會遊行法"]], "ans": "C", "exp": "我國制定公民投票法，使人民能直接參與全國性或地方性公共政策的決策與法案的制定，藉此落實憲法保障的創制權與複決權。"}, {"stem": "下列關於「創制權」的敘述，何者正確？", "opts": [["A", "人民針對立法院已通過的法律表示同意或反對"], ["B", "人民投票決定是否解除公職人員的職務"], ["C", "人民投票選出行政首長與民意代表"], ["D", "人民主動提出立法原則或制定政策"]], "ans": "D", "exp": "創制權是指人民「主動」提出立法原則或制定政策的權利；針對既有法律或政策表示同意與否則是複決權。"}, {"stem": "某次全國性公投的題目為：「你是否同意政府應全面禁止進口含萊克多巴胺的豬肉產品？」人民對此案投票，主要行使的是哪一項權利？", "opts": [["A", "複決權"], ["B", "創制權"], ["C", "選舉權"], ["D", "罷免權"]], "ans": "A", "exp": "針對已存在的政策或法案表達同意或反對，屬於複決權的行使。若是人民主動提出新的立法原則，才屬於創制權。"}, {"stem": "公民投票讓人民能直接決定重大政策，這最能展現下列哪一種民主形式？", "opts": [["A", "代議民主"], ["B", "直接民主"], ["C", "責任政治"], ["D", "政黨政治"]], "ans": "B", "exp": "由人民自己直接針對法案或政策作成決定，不透過民意代表代為決定，屬於直接民主的展現；選舉民意代表替人民決策則屬代議民主。"}, {"stem": "我國立法委員採「單一選區兩票制」選出。其中「單一選區」的意思是什麼？", "opts": [["A", "全國只劃分為一個選舉區"], ["B", "每位選民只能投一張選票"], ["C", "每一個選舉區只選出一位區域立法委員"], ["D", "每個政黨在同一選區只能提名一位候選人"]], "ans": "C", "exp": "「單一選區」指每一個選舉區僅選出一名區域立法委員，也就是得票最高的一人當選。"}, {"stem": "在「單一選區兩票制」中，選民手上的兩張選票分別是投給誰？", "opts": [["A", "一票選總統，一票選立委"], ["B", "一票選區域立委，一票選鄉鎮市長"], ["C", "一票選中央民代，一票選地方民代"], ["D", "一票選人（區域候選人），一票選黨（政黨）"]], "ans": "D", "exp": "兩票制是指每位選民有兩張票，一票投給選區的候選人（選人），另一票投給政黨（選黨），政黨票用於分配全國不分區立委席次。"}, {"stem": "依課本說明，政黨票的得票率必須超過多少，該政黨才能依比例分配全國不分區立委席次？", "opts": [["A", "5%"], ["B", "10%"], ["C", "15%"], ["D", "25%"]], "ans": "A", "exp": "康軒、南一、翰林三版課本皆指出，政黨票得票率超過5%的政黨，才能依照得票比例分配全國不分區立法委員席次，此為政黨門檻。"}, {"stem": "依翰林版課本說明，我國立法委員的總席次為多少席？", "opts": [["A", "73席"], ["B", "113席"], ["C", "225席"], ["D", "34席"]], "ans": "B", "exp": " 進入投票所，或必須關機。此規定與下列哪一項投票原則關係最密切？", "opts": [["A", "普通原則"], ["B", "無記名原則"], ["C", "直接原則"], ["D", "平等原則"]], "ans": "B", "exp": "禁止在投票所使用手機，是為了防止選民拍攝選票（亮票）而洩漏圈選內容，以保障祕密投票，屬無記名原則的落實。"}, {"stem": "阿翔在投票時圈錯候選人，一氣之下把選票撕毀。依翰林版課本介紹的規定，他可能面臨什麼後果？", "opts": [["A", "選務人員應立即補發一張新選票"], ["B", "沒有任何法律責任，只是該票作廢"], ["C", "可能被處新臺幣5千元以上、5萬元以下罰鍰"], ["D", "可處新臺幣10萬元以上、200萬元以下罰鍰"]], "ans": "C", "exp": "故意撕毀選舉票，或將選舉票以外的物品投入票匭，可處新臺幣5千元以上、5萬元以下罰鍰；而且選票一經領取即不得更換重領。"}, {"stem": "依課本介紹，下列哪一種行為在「投票日當天」是被禁止的？", "opts": [["A", "在社群平臺公開張貼候選人政見、分享助選大頭貼"], ["B", "在家中與家人討論投票的心得"], ["C", "到投開票所排隊等待投票"], ["D", "投票日前閱讀選舉公報了解候選人政見"]], "ans": "A", "exp": "投票日當天在Facebook、Instagram、LINE等平臺從事任何涉及競選或助選的行為（張貼政見、換大頭貼、發表評價等），可處10萬元以上、200萬元以下罰鍰；私下討論或閱讀公報則不受此限。"}, {"stem": "立法院參考「不得使6歲以下兒童獨處」的規定修法，讓選舉人可以帶6歲以下兒童進入投票所。此項修法的主要用意為何？", "opts": [["A", "讓兒童提早學習圈選候選人"], ["B", "增加投票所的人數與熱鬧氣氛"], ["C", "便於工作人員清點選民人數"], ["D", "營造友善的投票環境，兼顧兒童照顧與選民的投票權"]], "ans": "D", "exp": "修法是為了讓需照顧幼兒的選民不必因無人看顧小孩而放棄投票，同時符合兒童及少年福利與權益保障法的規定，營造友善投票環境。"}, {"stem": "政府設置檢舉賄選專線並提供高額檢舉獎金，其主要目的為何？", "opts": [["A", "增加政府的財政收入"], ["B", "防止金錢干擾選舉，保障選舉的公平性"], ["C", "提高候選人的知名度"], ["D", "減少中央選舉委員會的行政工作量"]], "ans": "B", "exp": "賄選是以金錢或利益影響選民的自由意志，破壞選舉公平。政府鼓勵民眾檢舉賄選，是為了淨化選風、確保投票結果真實反映民意。"}, {"stem": "翰林版課本介紹北韓的「最高人民會議」代議員選舉：每一選區只有一位執政黨認可的候選人，選票放進票箱就代表贊成，投反對票者可能被送進勞改營。下列敘述何者最正確？", "opts": [["A", "北韓選舉符合平等原則，因為每人都只有一票"], ["B", "北韓選舉符合普通原則，因為17歲就能投票"], ["C", "北韓選舉並不公平，因為選民無法依自由意志選擇，也無法保障投票祕密"], ["D", "北韓投票率接近100%，代表其民主程度高於我國"]], "ans": "C", "exp": "民主選舉的核心在於選民能有真正的選擇並依自由意志投票。北韓只有單一候選人、投反對票會遭到報復、無故不投票會被調查，違反自由與祕密投票的精神，屬於形式上的假民主。"}, {"stem": "民國110年新竹市舉行投票，由市民決定是否訂定相關法規以解決廢汙水問題。這屬於下列何者？", "opts": [["A", "地方性公民投票"], ["B", "全國性公民投票"], ["C", "地方公職人員選舉"], ["D", "地方首長罷免案"]], "ans": "A", "exp": "公民投票依範圍可分為全國性與地方性。針對單一縣市內的地方自治事項（如新竹市廢汙水問題）所辦理的公投，屬於地方性公民投票。"}, {"stem": "課本建議選民在投票前應如何做出決定？", "opts": [["A", "依照候選人的抽籤號碼決定"], ["B", "依照親友的指示投票即可"], ["C", "選擇宣傳品發送最多、造勢場面最盛大的候選人"], ["D", "審慎考量候選人的政見、能力、操守及所屬政黨的理念與政績"]], "ans": "D", "exp": "課本強調選民應根據候選人的政見、能力、操守與表現，以及其所屬政黨的主張與作為做判斷，並拒絕賄選及不當競選手段，才能選賢與能。"}, {"stem": "小安是國中生，尚未達到投票年齡。下列關於她參與公共事務的敘述，何者最恰當？", "opts": [["A", "未滿18歲完全不能參與政治，應等成年後再說"], ["B", "可以透過學生自治、網路發表意見、參與連署或關心公共議題等方式參與"], ["C", "只能等到年滿23歲登記參選後才算政治參與"], ["D", "國中生只要好好讀書，不需要培養民主素養"]], "ans": "B", "exp": "政治參與並非只有投票，也不是成年人的專利。課本以高中生自辦「模擬公投」為例，說明青少年可透過學生自治（如班會）、網路討論、連署、關心公共議題等多元管道參與，及早培養民主素養與公民責任感。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

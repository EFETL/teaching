<script>
const QS=[{"stem": "課本提到，國與國之間的商品、技術、資金、文化、人口、資訊等呈現跨國界流動，使國際往來日益密切。這樣的發展過程稱為什麼？", "opts": [["A", "都市化"], ["B", "工業化"], ["C", "全球化"], ["D", "民主化"]], "ans": "C", "exp": "全球化是指商品、技術、資金、文化、人口、資訊等跨越國界流動，使各國往來日益密切、逐漸融為一體的發展過程。"}, {"stem": "「全球化」一詞大約始於何時？", "opts": [["A", "二十世紀後半葉"], ["B", "十五世紀大航海時代"], ["C", "十八世紀工業革命初期"], ["D", "二十一世紀網際網路普及後"]], "ans": "A", "exp": "課本開宗明義指出「全球化」一詞始於二十世紀後半葉，其過程促進了國與國之間的相互連結。"}, {"stem": "下列何者「不是」課本所列促成全球化發展的主要因素？", "opts": [["A", "國際貿易"], ["B", "人口老化"], ["C", "交通運輸"], ["D", "資訊科技"]], "ans": "B", "exp": "課本列舉的全球化成因為國際貿易、交通運輸、資訊科技及傳播媒體。人口老化屬於人口結構議題，不是全球化的成因。"}, {"stem": "小明在臺灣的超市買到紐西蘭進口的奇異果。這個現象最能直接說明全球化的哪兩項成因？", "opts": [["A", "資訊科技與傳播媒體"], ["B", "傳播媒體與政治合作"], ["C", "資訊科技與國際貿易"], ["D", "國際貿易與交通運輸"]], "ans": "D", "exp": "課本以奇異果為例，說明是國際貿易與交通運輸的發展，使經濟活動超越國與國的界限。"}, {"stem": "小華在家透過視訊軟體和遠在美國的表哥聊天，還同步收看NBA球賽。這最能說明全球化中的哪些因素縮短了時空距離？", "opts": [["A", "資訊科技與傳播媒體"], ["B", "國際貿易與交通運輸"], ["C", "國際組織與國際規範"], ["D", "跨國企業與國際分工"]], "ans": "A", "exp": "課本指出，能和遠方的人溝通、居家觀看國外球賽，是資訊科技與傳播媒體發達，促使時空距離縮短的結果。"}, {"stem": "課本用哪一個詞來形容全球化下「各國逐漸融為一體、無國界」的狀態？", "opts": [["A", "世界工廠"], ["B", "國際社會"], ["C", "地球村"], ["D", "聯合國"]], "ans": "C", "exp": "全球化使地域阻隔漸漸消失，各國彷彿住在同一個村落，形成「地球村」。"}, {"stem": "「某一國家發生的事件，往往會產生跨越國界的影響。」這種現象課本用哪一句話形容最貼切？", "opts": [["A", "各自為政"], ["B", "牽一髮而動全身"], ["C", "各人自掃門前雪"], ["D", "井水不犯河水"]], "ans": "B", "exp": "全球化形成相互依存、「牽一髮而動全身」的全球關連現象。"}, {"stem": "關於全球化的敘述，下列何者「錯誤」？", "opts": [["A", "使國與國之間相互依存的程度提高"], ["B", "地域阻隔對經濟、文化、政治活動的限制漸漸消失"], ["C", "是一個多面向且交互影響的發展過程"], ["D", "只影響經濟活動，與文化、政治無關"]], "ans": "D", "exp": "全球化是多面向的過程，課本明確從經濟、政治、文化三個面向討論，並非只影響經濟。"}, {"stem": "課本主要從哪三個面向來觀察生活中的全球化？", "opts": [["A", "教育、醫療、環境"], ["B", "商品、資金、人口"], ["C", "經濟、政治、文化"], ["D", "科技、法律、宗教"]], "ans": "C", "exp": "課本以人們較常討論的經濟全球化、政治全球化、文化全球化三個面向來說明全球化的過程。"}, {"stem": "「經濟活動跨越國界的全球現象」是下列何者的定義？", "opts": [["A", "經濟全球化"], ["B", "政治全球化"], ["C", "文化全球化"], ["D", "全球在地化"]], "ans": "A", "exp": "經濟全球化是指經濟活動跨越國界的全球現象，各國企業透過跨國分工、投資與技術轉移促成跨國貿易蓬勃發展。"}, {"stem": "課本以智慧型手機的生產為例說明經濟全球化。手機由多國企業分別負責設計、零組件與組裝，最能呈現下列哪一概念？", "opts": [["A", "文化位階"], ["B", "國際分工與全球供應鏈"], ["C", "公平貿易認證"], ["D", "政治全球化"]], "ans": "B", "exp": "智慧型手機的全球供應鏈由許多國家的企業共同合作形成，是跨國分工（國際分工）最典型的例子。"}, {"stem": "Nike、麥當勞、蘋果等企業業務遍及世界各地，商品與服務行銷全球。這類企業稱為什麼？", "opts": [["A", "國營企業"], ["B", "非政府組織"], ["C", "國際組織"], ["D", "跨國企業"]], "ans": "D", "exp": "業務跨越國界、遍及世界各地的企業稱為跨國企業，是經濟全球化最具代表性的推手。"}, {"stem": "下列哪一項「最不屬於」經濟全球化的表現？", "opts": [["A", "各國政府為減碳共同簽署氣候協議"], ["B", "我國廠商到東南亞設廠雇用當地勞工"], ["C", "外國資金購買我國股票與基金"], ["D", "跨國企業把技術移轉給海外分公司"]], "ans": "A", "exp": "各國政府成立國際組織、共同制訂政策以處理全球性問題，屬於政治全球化；其餘三項皆為經濟活動的跨國流動。"}, {"stem": "「各國政府為因應全球性問題，成立國際組織、共同制訂政策，各國內政也逐漸受到全球性規範約束。」這是指？", "opts": [["A", "經濟全球化"], ["B", "文化全球化"], ["C", "政治全球化"], ["D", "在地全球化"]], "ans": "C", "exp": "政治全球化強調各國以合作方式處理單一國家無法應對的議題，並使各國內政受全球性規範約束。"}, {"stem": "西元2015年聯合國195個成員國於氣候高峰會達成協議，共同致力減少碳排放以遏阻全球暖化。這個例子最能說明？", "opts": [["A", "強勢文化主導弱勢文化"], ["B", "跨國企業擴大貧富差距"], ["C", "交通運輸縮短時空距離"], ["D", "各國透過國際組織合作處理全球性問題"]], "ans": "D", "exp": "全球暖化非單一國家所能解決，需各國透過國際組織合作制訂政策，屬於政治全球化的典型例證。"}, {"stem": "各國之所以傾向以「合作」方式處理全球議題，最主要的原因是什麼？", "opts": [["A", "各國政府都想放棄主權"], ["B", "議題日益複雜，非單一國家所能應對"], ["C", "國際組織可以強制各國服從"], ["D", "合作可以完全消除國家之間的競爭"]], "ans": "B", "exp": "課本指出全球快速發展，各國需要處理的議題日益複雜，非單一國家所能應對，故逐漸傾向合作。"}, {"stem": "「文化跨越國界在全球流通的現象」是指下列何者？", "opts": [["A", "文化全球化"], ["B", "政治全球化"], ["C", "經濟全球化"], ["D", "文化位階化"]], "ans": "A", "exp": "文化全球化是指文化跨越國界在全球流通，使不同文化接觸日趨頻繁。"}, {"stem": "下列何者「不是」課本所述文化全球化可能產生的結果？", "opts": [["A", "因文化差異而產生文化衝突"], ["B", "相互截長補短，促成文化創新"], ["C", "各國文化完全消失、只剩一種語言"], ["D", "社會呈現文化多元並存的新風貌"]], "ans": "C", "exp": "文化全球化可能帶來衝突、創新與多元並存，雖有文化單一化的疑慮，但課本並未主張所有文化完全消失、只剩一種語言。"}, {"stem": "課本指出，在文化全球化過程中，往往是誰主導了進程並影響弱勢文化的發展？", "opts": [["A", "開發中國家的傳統文化"], ["B", "挾豐厚資源優勢的強勢文化"], ["C", "少數民族的地方語言"], ["D", "國際非政府組織"]], "ans": "B", "exp": "強勢文化挾豐厚資源優勢，往往主導文化全球化進程，影響弱勢文化的發展。"}, {"stem": "課本以美國好萊塢電影風靡全球為例，指出這可能造成什麼影響？", "opts": [["A", "使各國電影票房同步成長"], ["B", "促使各國政府提高關稅"], ["C", "使美國本土文化逐漸消失"], ["D", "改變他國民眾的生活習慣與價值觀，產生文化認同危機"]], "ans": "D", " let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

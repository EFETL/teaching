<script>
const QS=[{"stem": "課本引用「科技始終來自於人性」這句話。關於科技發展的主要目的，下列敘述何者最為正確？", "opts": [["A", "為了完全取代人類的所有勞動工作"], ["B", "為了改善人類生活，使生活更加便利舒適"], ["C", "為了讓國家能夠壟斷國際貿易市場"], ["D", "為了限制人民自由以維護社會秩序"]], "ans": "B", "exp": "科技發展的主要目的是改善人類生活，但同時也隱藏著風險和隱憂，因此我們必須學習如何善用科技、持善去惡。"}, {"stem": "下列何者最符合課本對「資訊科技」的定義？", "opts": [["A", "專門用來設計交通工具引擎的機械技術"], ["B", "以基因改造提升農作物產量的生物技術"], ["C", "透過電腦網路和電信傳輸等資訊系統，迅速傳遞、蒐集、儲存圖文影音與訊息的技術"], ["D", "利用核能發電供應家庭用電的能源技術"]], "ans": "C", "exp": "資訊科技是指透過電腦網路與電信傳輸等資訊系統，快速傳遞、蒐集、儲存圖文影音與訊息的技術，是現代科技中影響最顯著的一項。"}, {"stem": "下列何者屬於資訊科技發展帶來的「正面」影響？", "opts": [["A", "民眾可以藉由網路平臺參與公共事務"], ["B", "網路詐騙案件層出不窮"], ["C", "個人醫療紀錄遭到他人變賣"], ["D", "假訊息流竄造成民眾錯誤判斷"]], "ans": "A", "exp": "網路使資訊快速傳播、打破國界限制、加速電子商務往來，也讓人民能透過網路平臺參與公共事務，屬於正面影響；(B)(C)(D) 都是資訊科技的隱憂。"}, {"stem": "網路上流傳「某食品含有致癌物」的貼文，許多民眾未經查證就大量轉傳，事後證實為假消息。這最能說明資訊科技的何項隱憂？", "opts": [["A", "網路犯罪層出不窮"], ["B", "資訊公開侵犯隱私"], ["C", "智慧財產難以保障"], ["D", "資訊內容真偽難辨"]], "ans": "D", "exp": "網路普及加速訊息傳遞，但民眾不易辨別訊息真偽，可能造成錯誤判斷，這正是「資訊內容真偽難辨」的隱憂。"}, {"stem": "某企業將蒐集到的顧客醫療紀錄與財務資料轉賣給廣告商牟利。這最能反映資訊科技的何項隱憂？", "opts": [["A", "資訊內容真偽難辨"], ["B", "資訊公開侵犯隱私"], ["C", "科技發展造成大量失業"], ["D", "網路使用打破國界限制"]], "ans": "B", "exp": "個人醫療紀錄、財務資訊等資料若遭他人濫用或變賣，對民眾的隱私與財產將構成威脅，屬於「資訊公開侵犯隱私」的隱憂。"}, {"stem": "阿明架設假的購物網站，騙取民眾匯款後隨即關閉網站。此行為最符合資訊科技的何項隱憂？", "opts": [["A", "網路犯罪層出不窮"], ["B", "資訊內容真偽難辨"], ["C", "資訊公開侵犯隱私"], ["D", "著作財產權遭到侵害"]], "ans": "A", "exp": "利用電腦網路進行犯罪，如網路詐騙、電腦駭客等，已成為嚴重的社會問題，屬於「網路犯罪層出不窮」。"}, {"stem": "小華未經同意，破解同學電腦的密碼並登入查看私人檔案。依課本說明，此行為最可能觸犯下列何者？", "opts": [["A", "著作權法的重製罪"], ["B", "商標法的仿冒罪"], ["C", "刑法的妨害電腦使用罪"], ["D", "專利法的侵害專利罪"]], "ans": "C", "exp": "課本明白指出，若無故駭入他人電腦，會觸犯刑法的「妨害電腦使用罪」。"}, {"stem": "小玲把班上同學的身分證字號、住家電話張貼在公開的網路社團。此行為最可能違反下列哪一部法律？", "opts": [["A", "著作權法"], ["B", "專利法"], ["C", "商標法"], ["D", "個人資料保護法"]], "ans": "D", "exp": "洩漏他人隱私資料會違反個人資料保護法；身分證字號、電話等屬於足以辨別個人的個人資料。"}, {"stem": "面對跨國網路犯罪頻傳，課本提到我國政府積極推動參與下列哪一個組織，希望透過國際合作打擊網路犯罪？", "opts": [["A", "世界貿易組織"], ["B", "國際刑警組織"], ["C", "世界衛生組織"], ["D", "世界智慧財產組織"]], "ans": "B", "exp": "跨國犯罪集團藉由網路犯罪，導致國家安全、企業運作與民眾財產受害，臺灣希望參與國際刑警組織，透過國際合作打擊網路犯罪。"}, {"stem": "關於「資訊倫理」的實踐，下列做法何者最為適當？", "opts": [["A", "在網路上發言尊重他人，並對自己的言論負責"], ["B", "看到聳動的訊息立刻轉傳，讓更多人知道"], ["C", "為了報復同學，把對方的私人照片公開分享"], ["D", "使用免費軟體時，順手破解其付費功能"]], "ans": "A", "exp": "個人應遵守資訊倫理規範，尊重他人並對自己的言論負責；轉傳未查證訊息、散布他人私密照片、破解軟體都違反資訊倫理甚至違法。"}, {"stem": "下列何者最符合「數位足跡」（Digital Footprint）的意義？", "opts": [["A", "政府為了防疫而記錄民眾的健康狀況"], ["B", "電腦系統自動備份的作業系統檔案"], ["C", "我們在網路上從事的所有活動或行為所留下的痕跡，如搜尋過的關鍵字、分享過的照片、看過的影片"], ["D", "網路業者為使用者設定的專屬帳號與密碼"]], "ans": "C", "exp": "數位足跡就是我們在網路上活動所留下的痕跡，包括搜尋關鍵字、分享的照片、影音平臺看過的影片等。"}, {"stem": "上班族小雯對美妝有興趣，常上網瀏覽新品，最近她發現社群網站不斷跳出美妝品牌廣告。雖然她從未主動留下個資，社群網站卻已掌握她的興趣與搜尋模式。這個現象主要凸顯何種爭議？", "opts": [["A", "科技發展威脅國家安全的維護"], ["B", "智慧財產權因科技發展而受限"], ["C", "國家利益與個人利益間的衝突"], ["D", "科技發展對於個人隱私的侵犯"]], "ans": "D", "exp": "數位足跡可讓企業追蹤個人的興趣及慣用搜尋模式，若被不當利用就會衍生個資隱私爭議，屬於科技發展對個人隱私的侵犯。"}, {"stem": "下列何種做法最有助於減少留下數位足跡、避免個資外洩？", "opts": [["A", "線上遊戲或線上購物結束後確實登出，並定期清除 cookie、掃毒"], ["B", "一律使用社群網站帳號快速註冊其他網站與遊戲"], ["C", "在所有網站都使用同一組簡單好記的密碼"], ["D", "隨手點擊網頁跳出的廣告以了解最新商品"]], "ans": "A", "exp": "課本的檢核建議包括：使用完畢確實登出、定期清除 cookie 與掃毒、避免用社群帳號註冊其他網站，才能減少數位足跡與個資外洩風險。"}, {"stem": "下列關於「智慧財產」的敘述，何者最為正確？", "opts": [["A", "是指創作者所擁有的土地、房屋等不動產"], ["B", "是創作者花費心力與智慧，透過構思、創作、發明等過程而產生價值的無形產物"], ["C", "是政府為鼓勵創作而發給創作者的獎金"], ["D", "是任何人只要腦中想到就能主張擁有的想法"]], "ans": "B", "exp": "智慧財產是經由構思、創作、發明等過程產生價值的「無形」產物，具有原創性與經濟價值，不是土地房屋等有形財產。"}, {"stem": "課本指出「智慧財產權」是指下列何者？", "opts": [["A", "人民依法對自己土地所享有的支配權利"], ["B", "消費者購買商品後所享有的退換貨權利"], ["C", "人類精神活動的成果且能產生經濟上的價值，而受到法律保護的權利"], ["D", "政府對於國家重要產業所享有的專賣權利"]], "ans": "C", "exp": "智慧財產權的定義是「人類精神活動的成果且能產生經濟上的價值，而受到法律保護的權利」。"}, {"stem": "國家立法保障智慧財產權，最主要的目的為何？", "opts": [["A", "增加政府的稅收來源"], ["B", "限制外國商品進入本國市場"], ["C", "讓創作者能永久獨占其創作，不受任何限制"], ["D", "讓創作者可自行利用其智慧財產獲取報酬，以激勵創作意願"]], "ans": "D", "exp": "保障智慧財產權是為了讓創作者能利用其創作成果獲取報酬，鼓勵更多人投入創作，並防止抄襲仿冒扼殺創作意願。"}, {"stem": "下列哪一部法律的立法目的是「保障著作人著作權益，調和社會公共利益，促進國家文化發展」？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "個人資料保護法"]], "ans": "A", "exp": "著作權法的立法目的即為保障著作人權益、調和社會公共利益、促進國家文化發展。"}, {"stem": "某部法律的目的是「保障商標權及消費者利益，維護市場公平競爭，促進企業正常發展」。該法律應為下列何者？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "個人資料保護法"]], "ans": "B", "exp": "商標法保障商標權及消費者利益，維護市場公平競爭，促進企業正常發展。"}, {"stem": "「鼓勵、保護、利用發明、新型及設計創作，以促進產業發展」是下列哪一部法律的立法目的？", "opts": [["A", "著作權法"], ["B", "商標法"], ["C", "專利法"], ["D", "民法"]], "ans": "C", "exp": "專利法的立法目的在鼓勵、保護、利用發明、新型及設計創作，以促進產業發展。"}, {"stem": "關於智慧財產權的取得方式，下列敘述何者正確？", "opts": [["A", "著作權必須經過申請審查核准後才能取得"], ["B", "商標權於商品製造完成時即自動取得"], ["C", "專利權經註冊登記後立即取得，不需審查"], ["D", "著作權於創作完成時即享有，專利權則須經申請審查核准後才取得"]], "ans": "D", "exp": "三種權利的取得方式不同：著作權「創作完成即享有」、商標權「經註冊取得」、專利權「申請審查核准後取得」。這是段考常考的辨別重點。"}, {"stem": "陳老闆設計了一個獨特圖案，想作為自家飲料店的招牌標誌並專用。依課本說明，他應如何取得該圖案的商標權？", "opts": [["A", "向主管機關申請註冊，經核准後取得"], ["B", "設計完成時即自動取得，不必辦理任何手續"], ["C", "只要先在店門口懸掛使用滿一年即可取得"], ["D", "向法院提起訴訟，由法官判決取得"]], "ans": "A", "exp": "商標權必須「經註冊取得」，與著作權「創作完成即享有」不同。"}, {"stem": "小天自己作詞作曲寫了一首歌，並錄製成音檔。這首歌屬於下列哪一種智慧財產權的保障範圍？", "opts": [["A", "商標權"], ["B", "專利權"], ["C", "著作權"], ["D", "營業秘密權"]], "ans": "C", "exp": "著作權法保障文學、科學、藝術或其他學術範圍的創作，音樂創作屬於著作權保障的範圍，且創作完成即享有。"}, {"stem": "某公司研發出「可自動偵測空氣品質並調整風速的電風扇」，具有產業利用價值，想申請法律保護。應依下列哪一部法律申請？", "opts": [["A", "著作權法"], ["B", "專利法"], ["C", "商標法"], ["D", "個人資料保護法"]], "ans": "B", "exp": "具有產業利用價值的發明與重要研究成果，可依專利法申請專利權。"}, {"stem": "知名超商的招牌標誌可以用來區別自己與他人的商品或服務。這屬於下列何者的保障範圍？", "opts": [["A", "專利權"], ["B", "著作權"], ["C", "著作人格權"], ["D", "商標權"]], "ans": "D", "exp": "商標是可用來區別自己與他人商品或服務的標誌，受商標法保障。"}, {"stem": "下列有關智慧財產權類型的配對，何者完全正確？", "opts": [["A", "小說創作—著作權；手機新技術—專利權；企業標誌—商標權"], ["B", "小說創作—商標權；手機新技術—著作權；企業標誌—專利權"], ["C", "小說創作—專利權；手機新技術—商標權；企業標誌—著作權"], ["D", "小說創作—著作權；手機新技術—商標權；企業標誌—專利權"]], "ans": "A", "exp": "文學藝術創作歸著作權、具產業利用價值的技術發明歸專利權、辨識商品服務來源的標誌歸商標權，三者要能清楚辨別。"}, {"stem": "某公司設計的商標與知名品牌太過近似，使消費者有混淆誤認之虞。依課本說明，此商標會有何結果？", "opts": [["A", "仍可註冊，但須支付原品牌權利金"], ["B", "無法註冊取得商標權"], ["C", "可以註冊，但保護期限縮短為十年"], ["D", "應改依專利法申請保護"]], "ans": "B", "exp": "太過近似的商標，使消費者有混淆誤認之虞者，無法註冊商標，以維護市場公平競爭與消費者利益。"}, {"stem": "一家廠商在設計新產品時，想使用他人已取得的專利技術。正確的做法為何？", "opts": [["A", "exp": "假訊息強調「故意」虛構或扭曲並意圖影響他人認知；謠言自古即有，只是網路使其大量產製；且經設計的假訊息往往傳得比真訊息更快。"}, {"stem": "閱聽人發現報導不實而要求媒體刊登更正啟事，屬於媒體接近使用權中的哪一項？", "opts": [["A", "使用權"], ["B", "著作權"], ["C", "更正權"], ["D", "隱私權"]], "ans": "C", "exp": "接近權包含「更正權」（訂正不實報導）與「答辯權」（回應不公平說法）；自行產製內容供媒體刊播則屬「使用權」。"}, {"stem": "社區居民不滿主流媒體長期忽略河川汙染問題，於是自行撰寫報導向報社投稿，揭露這件事。這屬於媒體接近使用權中的哪一項？", "opts": [["A", "更正權"], ["B", "使用權"], ["C", "答辯權"], ["D", "隱私權"]], "ans": "B", "exp": "使用權是指閱聽人能自行撰寫內容或製作節目提供媒體刊登、播放的權利，把自己的聲音送進媒體。"}, {"stem": "關於「媒體接近使用權」，下列敘述何者「錯誤」？", "opts": [["A", "閱聽人可要求媒體更正錯誤或不公允的報導"], ["B", "閱聽人可自行產製優良內容並透過媒體與他人分享"], ["C", "行使此權利有助於閱聽人從被動接收者成為主動參與者"], ["D", "閱聽人可以要求媒體只報導對自己有利的新聞"]], "ans": "D", "exp": "媒體接近使用權是為了矯正錯誤、平衡意見並讓多元聲音被聽見，不是讓任何人操控媒體只報導對自己有利的內容。"}, {"stem": "閱聽人以「疑、想、查、問、戳」查核資訊正確性，避免假新聞瘋傳造成恐慌。這是以何種方式監督媒體？", "opts": [["A", "政府監督"], ["B", "利益團體監督"], ["C", "公民監督"], ["D", "媒體自我監督"]], "ans": "C", "exp": "閱聽人（一般民眾）自主查證、檢舉、要求更正，屬於「公民監督」；由媒體業者自訂規範約束自己才是媒體自律。"}, {"stem": "在社群網路上發表言論時，下列哪一項行為最可能觸犯刑法妨害名譽罪，並須負民事賠償責任？", "opts": [["A", "在留言區以不實內容辱罵、造謠攻擊特定他人"], ["B", "針對政府政策提出具體且有依據的批評"], ["C", "分享事實查核中心的查核報告"], ["D", "在平臺上附議自己認同的公共政策提案"]], "ans": "A", "exp": "在網路上辱罵他人或散布不實內容損害他人名譽，可能構成刑法妨害名譽罪，並須負民事損害賠償責任。"}, {"stem": "手機遊戲要求玩家授權使用 GPS 定位、相機與儲存空間，玩家等於同意將個人資料回傳給遊戲公司。這種情形最直接衍生下列何種問題？", "opts": [["A", "網路詐騙集團一定會被繩之以法"], ["B", "資訊內容真偽難以辨別"], ["C", "媒體置入性行銷更加普及"], ["D", "個人資料外洩，隱私權受到侵犯"]], "ans": "D", "exp": "大量個資回傳形成資安隱憂，一旦外洩將危及個人隱私與財產，因此我國制定個人資料保護法加以規範。"}, {"stem": "下列何者最符合「具備媒體識讀能力的現代公民」應有的表現？", "opts": [["A", "看到聳動標題立刻轉傳，讓更多人及早知道"], ["B", "只接收單一媒體的訊息，避免被不同說法混淆"], ["C", "接觸多元媒體並相互比對，查證後再決定是否分享，發言時避免歧視與侵犯他人權益"], ["D", "認為所有網路訊息都是假的，完全不參與公共討論"]], "ans": "C", "exp": "媒體識讀強調保持懷疑態度、多元來源比對、主動查證，並為自己的言論負責，這既是保護自己也是保護別人。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

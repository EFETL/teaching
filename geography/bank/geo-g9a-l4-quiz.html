<script>
const QS=[{"stem": "中美洲包括哪三個部分？", "opts": [["A", "墨西哥高原、中美地峽、西印度群島"], ["B", "巴西高原、亞馬孫盆地、安地斯山脈"], ["C", "拉布拉他平原、巴塔哥尼亞高原、安地斯山脈"], ["D", "圭亞那高地、奧利諾科平原、亞馬孫盆地"]], "ans": "A", "exp": "課本指出中美洲包括墨西哥高原、中美地峽和西印度群島三大部分，墨西哥高原西側位於環太平洋火山地震帶，多火山地震。"}, {"stem": "西印度群島中面積最大的島嶼是？", "opts": [["A", "牙買加島"], ["B", "古巴島"], ["C", "海地島"], ["D", "波多黎各島"]], "ans": "B", "exp": "西印度群島散布在加勒比海上，最大的島為古巴島，另外還有許多珊瑚礁島吸引遊客前往攬勝。"}, {"stem": "中美洲西側位於哪個地震帶，因此多火山地震？", "opts": [["A", "阿爾卑斯喜馬拉雅造山帶"], ["B", "大西洋中洋脊"], ["C", "環太平洋火山地震帶"], ["D", "東非大裂谷"]], "ans": "C", "exp": "中美洲的墨西哥高原西側位於環太平洋火山地震帶，故多火山地震（如墨西哥地震）。"}, {"stem": "南美洲西側由板塊擠壓形成的狹長山脈是？", "opts": [["A", "洛磯山脈"], ["B", "阿爾卑斯山脈"], ["C", "烏拉山脈"], ["D", "安地斯山脈"]], "ans": "D", "exp": "南美洲西部有安地斯山脈南北縱貫，是板塊推擠形成的狹長山脈，也是陸地上最長的山脈之一，受板塊擠壓影響地殼不穩定。"}, {"stem": "南美洲東半部的地形主要為？", "opts": [["A", "高原、盆地與沖積平原交錯分布"], ["B", "高山與峽灣"], ["C", "沙漠與丘陵"], ["D", "大範圍的冰河地形"]], "ans": "A", "exp": "南美洲地形東、西差異大，東側為高原、盆地與沖積平原交錯分布，其中包含亞馬孫盆地與巴西高原。"}, {"stem": "世界流量最大、流域面積最廣的河流是？", "opts": [["A", "尼羅河"], ["B", "亞馬孫河"], ["C", "長江"], ["D", "密西西比河"]], "ans": "B", "exp": "流貫亞馬孫盆地的亞馬孫河，是世界流量最大、流域面積最廣的河川。"}, {"stem": "巴拿馬運河位於下列何處？", "opts": [["A", "墨西哥高原"], ["B", "安地斯山脈北端"], ["C", "中美地峽最狹窄處"], ["D", "亞馬孫盆地"]], "ans": "C", "exp": "巴拿馬運河位於中美地峽最狹窄處，連接太平洋與大西洋，全長82公里。"}, {"stem": "關於巴拿馬運河，下列敘述何者正確？", "opts": [["A", "是世界最長的運河"], ["B", "只能單向通行"], ["C", "由巴拿馬人設計建造完成"], ["D", "是世上唯一連接太平洋與大西洋兩個大洋的運河"]], "ans": "D", "exp": "巴拿馬運河是世上唯一連接兩個大洋（太平洋與大西洋）的運河，具有重要的海運價值。"}, {"stem": "巴拿馬運河最早由哪一國開始興建，後來由哪一國接手完工？", "opts": [["A", "法國開始，美國接手"], ["B", "英國開始，法國接手"], ["C", "西班牙開始，英國接手"], ["D", "美國開始，法國接手"]], "ans": "A", "exp": "1881年法國人開始興建巴拿馬運河，1904年由美國接手，1914年完工，直到1999年美國才將管轄權交還給巴拿馬政府。"}, {"stem": "巴拿馬運河設計成階梯式（水閘式）通行方式，最主要的考量因素為何？", "opts": [["A", "加快船隻航行速度"], ["B", "克服運河兩端地形高度差的限制"], ["C", "便於徵收通行費用"], ["D", "防止海盜入侵"]], "ans": "B", "exp": "由於中美地峽海拔高度高於兩側海洋，船隻無法直接爬坡，運河設計成階梯式，注水使相鄰兩階水位一致後，船隻才能逐階通過，克服地形限制。"}, {"stem": "亞馬孫盆地全年高溫多雨，屬於下列哪種氣候類型？", "opts": [["A", "熱帶莽原氣候"], ["B", "溫帶海洋性氣候"], ["C", "熱帶雨林氣候"], ["D", "熱帶沙漠氣候"]], "ans": "C", "exp": "熱帶雨林氣候主要分布於亞馬孫盆地，全年高溫多雨，植物高低成層分布、樹冠茂密。"}, {"stem": "巴西高原「夏雨冬乾、乾溼季分明」的氣候類型是？", "opts": [["A", "溫帶地中海型氣候"], ["B", "高地氣候"], ["C", "溫帶海洋性氣候"], ["D", "熱帶莽原氣候"]], "ans": "D", "exp": "熱帶莽原氣候主要分布於巴西高原，雖緯度低但因位居高地氣溫不炎熱，夏雨冬乾，草原隨乾溼季呈現枯榮景觀。"}, {"stem": "墨西哥北部、智利北部及祕魯沿海一帶，因受副熱帶高壓籠罩及涼流影響，形成乾燥少雨的？", "opts": [["A", "熱帶沙漠氣候"], ["B", "溫帶地中海型氣候"], ["C", "溫帶海洋性氣候"], ["D", "高地氣候"]], "ans": "A", "exp": "南、北回歸線附近陸地西岸，受副熱帶高壓籠罩和涼流影響，屬乾燥少雨、年溫差小的熱帶沙漠氣候，主要分布於墨西哥北部、智利北部及祕魯。"}, {"stem": "智利中部「夏乾冬雨」、適合栽種柑橘與葡萄等耐旱作物的氣候類型為？", "opts": [["A", "熱帶莽原氣候"], ["B", "溫帶地中海型氣候"], ["C", "溫帶海洋性氣候"], ["D", "熱帶雨林氣候"]], "ans": "B", "exp": "溫帶地中海型氣候分布於智利中部，因風帶季移形成夏乾冬雨，生長季缺水，多種植柑橘、葡萄等耐旱作物。"}, {"stem": "智利南部終年受西風吹拂、全年有雨，屬於？", "opts": [["A", "溫帶地中海型氣候"], ["B", "熱帶莽原氣候"], ["C", "溫帶海洋性氣候"], ["D", "溫帶沙漠氣候"]], "ans": "C", "exp": "溫帶海洋性氣候分布於智利南部，受西風影響全年有雨，溫和多雨。"}, {"stem": "墨西哥高原及安地斯山區，因氣溫隨海拔高度垂直變化而形成的氣候類型稱為？", "opts": [["A", "溫帶大陸性氣候"], ["B", "熱帶莽原氣候"], ["C", "極地氣候"], ["D", "高地氣候"]], "ans": "D", "exp": "高地氣候分布於墨西哥高原及安地斯山區，溫度隨高度垂直變化，植被景觀差異大。"}, {"stem": "阿根廷南部的巴塔哥尼亞高原，因山脈阻擋西風、加上寒流經過，形成乾燥少雨、年溫差大的？", "opts": [["A", "溫帶沙漠氣候"], ["B", "熱帶沙漠氣候"], ["C", "溫帶地中海型氣候"], ["D", "副極地氣候"]], "ans": "A", "exp": "巴塔哥尼亞高原因山脈阻擋西風及寒流經過，形成乾燥少雨、年溫差大的溫帶沙漠氣候。"}, {"stem": "巴西東南部與阿根廷沿海一帶，受東南信風與巴西暖流影響，夏季降水較多，利於農業發展的氣候類型是？", "opts": [["A", "溫帶海洋性氣候"], ["B", "夏雨型暖溫帶氣候"], ["C", "熱帶莽原氣候"], ["D", "溫帶地中海型氣候"]], "ans": "B", "exp": "夏雨型暖溫帶氣候主要分布在巴西東南部與阿根廷沿海，受東南信風和巴西暖流影響，夏季降水較多，利於農業發展。"}, {"stem": "安地斯山區的農牧活動隨海拔高度呈現何種變化？", "opts": [["A", "完全不受高度影響"], ["B", "只能在山腳從事農業，山區完全無法利用"], ["C", "隨高度垂直變化，由熱帶到溫帶作物皆可種植，高處放牧駱馬與羊駝"], ["D", "只適合發展工業"]], "ans": "C", "exp": "安地斯山脈的農、牧活動隨高度爬升呈垂直變化，從熱帶到溫帶作物皆可種植，高山草原或貧瘠地區則放牧駱馬和羊駝。"}, {"stem": "關於中南美洲氣候類型分布的敘述，下列何者正確？", "opts": [["A", "全區皆屬熱帶氣候，沒有其他氣候類型"], ["B", "以溫帶氣候分布最廣"], ["C", "各地氣候完全沒有規律可循"], ["D", "熱帶氣候分布最廣，且氣候類型於赤道兩側大致對稱分布"]], "ans": "D", "exp": "中南美洲陸地大部分位於南、北回歸線之間，以熱帶氣候分布最廣，且氣候類型於赤道兩側對稱分布。"}, {"stem": "南美洲安地斯山區的原住民族，曾以今日祕魯庫斯科為中心建立哪個強大的古文明帝國？", "opts": [["A", "印加帝國"], ["B", "馬雅文明"], ["C", "阿茲提克文明"], ["D", "腓尼基文明"]], "ans": "A", "exp": "印加帝國主要位於安地斯山區，曾以今日祕魯的庫斯科為中心，建立強大的印加帝國；馬雅、阿茲提克文明則主要分布於中美洲。"}, {"stem": "印加帝國馬丘比丘的梯田主要以石塊堆砌，具有下列哪一項功能？", "opts": [["A", "觀賞用途"], ["B", "水土保持"], ["C", "防禦敵人入侵"], ["D", "儲存雨水發電"]], "ans": "B", "exp": "祕魯印加帝國馬丘比丘梯田，是用石塊堆砌而成，具有水土保持的功能。"}, {"stem": "16世紀後，統治中南美洲大部分地區，並將西班牙語帶入此區的殖民國家是？", "opts": [["A", "英國"], ["B", "荷蘭"], ["C", "西班牙"], ["D", "法國"]], "ans": "C", "exp": "16世紀中期西班牙統治大部分中南美洲，引進天主教與西班牙語，成為本區主要通用語言。"}, {"stem": "巴西在殖民時期受哪一國統治，因此以葡萄牙語為官方語言？", "opts": [["A", "西班牙"], ["B", "義大利"], ["C", "英國"], ["D", "葡萄牙"]], "ans": "D", "exp": "葡萄牙占領巴西，因此巴西以葡萄牙語為官方語言，是中南美洲唯一講葡萄牙語的國家。"}, {"stem": "中南美洲被稱為世界上信奉哪種宗教人口比例最高的一洲？", "opts": [["A", "天主教"], ["B", "伊斯蘭教"], ["C", "佛教"], ["D", "印度教"]], "ans": "A", "exp": "16世紀後歐洲文化移植，尤其天主教信仰深入民間，中南美洲是世界天主教徒最多的洲。"}, {"stem": "今日中南美洲居民中的非裔黑人，其祖先主要是透過何種方式來到此地？", "opts": [["A", "自願移民尋找新天地"], ["B", "殖民者從非洲運入以供勞役使用"], ["C", "原本就居住在此地"], ["D", "因戰爭逃難而來"]], "ans": "B", "exp": "16世紀西班牙人與葡萄牙人殖民統治期間，為了墾殖需要，白人統治者從非洲運入大量黑人供勞役使用，形成今日中南美洲多元族群組成。"}, {"stem": "融合印第安傳統與天主教信仰、以絢爛多彩形式表達慎終追遠情感的墨西哥民俗節慶是？", "opts": [["A", "森巴嘉年華"], ["B", "復活節遊行"], ["C", "亡靈節"], ["D", "感恩節"]], "ans": "C", "exp": "墨西哥亡靈節融合了印第安傳統與天主教信仰，以絢爛、多彩的形式表達慎終追遠的感情，已被聯合國列入文化遺產。"}, {"stem": "源自非洲黑奴舞蹈，傳入巴西後融合葡萄牙、印第安風格，形成熱情奔放舞步，成為巴西最具代表性的舞蹈是？", "opts": [["A", "探戈"], ["B", "佛朗明哥舞"], ["C", "騷莎舞"], ["D", "森巴舞"]], "ans": "D", "exp": "森巴舞根源於非洲，經由被販賣至巴西的黑人奴隸帶入，融合葡萄牙、印第安等文化風格，成為巴西的招牌舞蹈，也是森巴嘉年華的重要表演。"}, {"stem": "居住在中南美洲熱帶雨林區的原住民族，傳統上主要以何種方式進行農業，並以何種作物為主食？", "opts": [["A", "游耕、以玉米為主食"], ["B", "定耕、以小麥為主食"], ["C", "梯田、以水稻為主食"], ["D", "灌溉、以大豆為主食"]], "ans": "A", "exp": "居住在熱帶雨林區的原住民族，傳統上以游耕為主，常以玉米等作物為主食。"}, {"stem": "安地斯山區的印加人因平原面積有限，開闢什麼設施來增加耕地，種植玉米與根莖類作物？", "opts": [["A", "灌溉渠道"], ["B", "梯田"], ["C", "溫室"], ["D", "水庫"]], "ans": "B", "exp": "印加人居住在2,000～3,000多公尺的涼爽山間谷地，因平原有限，開闢梯田增加耕地，種植玉米和根莖類作物，例如馬鈴薯、番薯等。"}, {"stem": "16世紀後歐洲人在中南美洲發展的「殖民地式經濟」，其主要特徵為何？", "opts": [["A", "大力發展高科技產業"], ["B", "完全自給自足、不對外貿易"], ["C", "以農、礦原料外銷為主，未能奠定工業發展基礎"], ["D", "以觀光旅遊業為經濟主體"]], "ans": "C", "e 豆，多數產地與下列哪個地區的雨林開發有密切關係？", "opts": [["A", "巴西亞馬孫雨林"], ["B", "東南亞雨林"], ["C", "中非剛果雨林"], ["D", "印尼雨林"]], "ans": "A", "exp": "根據綠色和平組織指出，美國多家知名速食連鎖企業使用的肉品及飼養牲畜所需的大豆，多數產地來自巴西的亞馬孫雨林地區，隨著肉品需求增加，雨林遭破壞的問題日漸惡化。"}, {"stem": "關於「亞馬孫雨林的開發與保育」議題，下列敘述何者最為適切？", "opts": [["A", "保育雨林與經濟發展兩者毫無關係，不必一併考量"], ["B", "開發雨林對經濟發展有幫助，但也會破壞生態環境，如何在兩者間取得平衡、邁向永續發展，是各界持續關注的重要議題"], ["C", "開發雨林完全不具備任何經濟效益"], ["D", "雨林開發與否只由巴西一國決定，其他國家不必關心"]], "ans": "B", "exp": "在雨林區開發農牧礦業能帶來經濟產值，也能幫助當地貧困農民脫離貧窮，但同時會破壞生態、影響全球氣候調節功能，如何兼顧經濟發展與雨林保育、達到永續發展目標，是重要的探究課題。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "中國地形複雜多樣，若依地形種類粗分，大致可分為哪五大類型？", "opts": [["A", "山地、高原、丘陵、沙漠、綠洲"], ["B", "高原、盆地、平原、沙漠、草原"], ["C", "山地、丘陵、平原、盆地、沙漠"], ["D", "山地、高原、盆地、平原、丘陵"]], "ans": "D", "exp": "課本指出中國幅員遼闊，地質結構複雜且受板塊擠壓影響，地形大致可分為山地、高原、盆地、平原、丘陵五大類型。"}, {"stem": "中國的山地與高原約占國土總面積的多少比例？", "opts": [["A", "約 30%"], ["B", "約 59～60%"], ["C", "約 75%"], ["D", "約 90%"]], "ans": "B", "exp": "三版本課本皆提到山地和高原約占中國總面積的 59～60%，是「山多平原少」特徵的主要依據。"}, {"stem": "由於山地、高原面積廣大，平原相對狹小，中國的地形整體常被形容為下列何者？", "opts": [["A", "平原遼闊、地勢平坦"], ["B", "丘陵起伏、盆地眾多"], ["C", "山多平原少"], ["D", "沙漠廣布、綠洲稀少"]], "ans": "C", "exp": "山地與高原占比高達近六成，因此中國地形整體呈現「山多平原少」的特徵。"}, {"stem": "中國的地勢大致呈現下列何種分布？", "opts": [["A", "南高北低"], ["B", "東高西低"], ["C", "中央高、四周低"], ["D", "西高東低"]], "ans": "D", "exp": "課本明確指出中國地勢大致西高東低，並依海拔高度分成三級階梯。"}, {"stem": "中國許多大河（如黃河、長江）的主要流向是由西向東，其最主要的原因為何？", "opts": [["A", "受季風風向影響"], ["B", "地勢西高東低"], ["C", "受海岸線走向影響"], ["D", "受緯度高低影響"]], "ans": "B", "exp": "因為地勢西高東低，河水由高處往低處流，故中國主要河川多由西向東流入太平洋。"}, {"stem": "關於中國河川上、下游的特徵，下列敘述何者正確？", "opts": [["A", "上游水流湍急、多富水力資源；下游流勢平緩、利於水運"], ["B", "上游流勢平緩、利於水運；下游水流湍急、富水力資源"], ["C", "上、下游流速皆平緩，皆不利於水力開發"], ["D", "上、下游流速皆湍急，皆不利於航運"]], "ans": "A", "exp": "西高東低的地勢，使河川上游因地勢陡峭水流湍急，蘊藏豐富水力；下游地勢平坦、流勢平緩，河面寬廣，有利水路運輸發展。"}, {"stem": "中國的地勢可分為三級階梯，這種分類主要是依據下列何種指標？", "opts": [["A", "緯度高低"], ["B", "平均海拔高度"], ["C", "年降水量多寡"], ["D", "距海遠近"]], "ans": "B", "exp": "課本說明中國地勢依照平均海拔高度與地形種類，由西向東大致分成三級階梯。"}, {"stem": "中國地勢最高的一級階梯，以下列哪一種地形為主？", "opts": [["A", "山地、高原"], ["B", "平原、丘陵"], ["C", "盆地、沙漠"], ["D", "草原、綠洲"]], "ans": "A", "exp": "最高一級階梯以青藏高原及喜馬拉雅山等山地、高原為主體，是三大階梯中海拔最高者。"}, {"stem": "中國最高一級階梯（以青藏高原為主）的平均海拔高度約為多少？", "opts": [["A", "約 500 公尺以下"], ["B", "約 1,000～2,000 公尺"], ["C", "約 4,000 公尺以上"], ["D", "約 8,000 公尺以上"]], "ans": "C", "exp": "課本指出最高階梯（青藏高原一帶）平均高度約 4,000 公尺以上，有「世界屋脊」之稱。"}, {"stem": "中國三級階梯中，居於中間（次高）的一級，主要由哪些地形構成？", "opts": [["A", "高原與盆地"], ["B", "平原與丘陵"], ["C", "山地與沙漠"], ["D", "三角洲與草原"]], "ans": "A", "exp": "次高階梯（中階梯）以內蒙古高原、黃土高原等高原，以及準噶爾盆地、塔里木盆地、四川盆地等盆地分布為主。"}, {"stem": "中國次高階梯（中階梯）的平均海拔高度大致落在下列哪一個範圍？", "opts": [["A", "約 1,000～2,000 公尺"], ["B", "約 4,000 公尺以上"], ["C", "約 100 公尺以下"], ["D", "約 5,000～6,000 公尺"]], "ans": "A", "exp": "課本指出次高階梯地勢降到 2,000 公尺以下、約 1,000 多公尺左右，是高原與盆地的主要分布區。"}, {"stem": "中國三級階梯中，地勢最低的一級以下列哪一種地形組合為主？", "opts": [["A", "高原與盆地"], ["B", "平原與丘陵"], ["C", "山地與高原"], ["D", "沙漠與綠洲"]], "ans": "B", "exp": "最低階梯位於中國東側，主要為河川沖積出的平原與交錯分布的丘陵，是人口稠密、農業發達的精華區。"}, {"stem": "中國地勢最低一級階梯，平均高度大致在多少以下？", "opts": [["A", "4,000 公尺"], ["B", "2,000 公尺"], ["C", "1,500 公尺"], ["D", "1,000 公尺"]], "ans": "D", "exp": "課本指出最低階梯平均高度約在 1,000 公尺以下，以平原與丘陵為主。"}, {"stem": "青藏高原因地勢陡峻、平均海拔高居世界高原之冠，因此被稱為什麼？", "opts": [["A", "天府之國"], ["B", "世界屋脊"], ["C", "世界糧倉"], ["D", "亞洲之心"]], "ans": "B", "exp": "青藏高原地勢陡峻，是世界平均高度最高的高原，因此有「世界屋脊」之稱。"}, {"stem": "關於喜馬拉雅山的敘述，下列何者正確？", "opts": [["A", "位於四川盆地北側"], ["B", "是中國面積最大的沙漠所在地"], ["C", "是世界最高的山脈，也是亞洲許多大河的源頭"], ["D", "屬於中國地勢最低的一級階梯"]], "ans": "C", "exp": "喜馬拉雅山位於青藏高原西南側，是世界最高的山脈，也是亞洲許多大河的發源地，有「大地之母」之譽。"}, {"stem": "中國面積最大的盆地，其內大部分為哪一座沙漠所占據？", "opts": [["A", "塔克拉瑪干沙漠"], ["B", "撒哈拉沙漠"], ["C", "戈壁沙漠"], ["D", "納米比沙漠"]], "ans": "A", "exp": "塔里木盆地是中國面積最大的盆地，盆地內大部分為塔克拉瑪干沙漠所占據，邊緣因高山融雪形成綠洲。"}, {"stem": "黃土高原因黃土質地鬆散，容易發生下列哪一種現象？", "opts": [["A", "表面千溝萬壑、地表破碎，且使黃河含沙量增高"], ["B", "地表終年積雪、冰河地形發達"], ["C", "地勢平坦，完全不受河流侵蝕"], ["D", "因降水過多而形成廣大湖泊"]], "ans": "A", "exp": "黃土質地鬆散、易受流水侵蝕，使黃土高原表面千溝萬壑、地表破碎，也造成黃河挾帶大量泥沙、含沙量高。"}, {"stem": "關於內蒙古高原的景觀特徵，下列敘述何者正確？", "opts": [["A", "終年溼潤多雨，森林茂密"], ["B", "地勢平坦遼闊，乾燥少雨，多為沙漠與草原景觀"], ["C", "為中國人口最密集、產業最發達的地區"], ["D", "是中國面積最大的沖積平原"]], "ans": "B", "exp": "內蒙古高原地勢平坦遼闊，因深居內陸、距海遙遠，氣候乾燥少雨，多呈現沙漠與草原景觀。"}, {"stem": "四川盆地因地勢封閉、農業發達、物產豐饒，自古以來有什麼稱號？", "opts": [["A", "世界屋脊"], ["B", "中國糧倉"], ["C", "天府之國"], ["D", "東方明珠"]], "ans": "C", "exp": "四川盆地地勢封閉、進出不易，古代須沿河修築棧道，盆地內農業發達、常闢梯田，因而有「天府之國」之稱。"}, {"stem": "新疆境內、位於準噶爾盆地與塔里木盆地一帶的地形，主要分布在中國三級階梯中的哪一級？", "opts": [["A", "最高階梯"], ["B", "最低階梯"], ["C", "沿海階梯"], ["D", "次高（中）階梯"]], "ans": "D", "exp": "準噶爾盆地與塔里木盆地皆位於次高（中）階梯，與內蒙古高原、黃土高原、四川盆地同屬此階梯的代表地形。"}, {"stem": "關於東北平原的敘述，下列何者正確？", "opts": [["A", "是中國面積最大的沙漠"], ["B", "是中國面積最大的平原，土地肥沃，為重要糧倉"], ["C", "屬於中國地勢最高的一級階梯"], ["D", "是中國唯一的高地氣候分布區"]], "ans": "B", "exp": "東北平原是中國面積最大的平原，土地肥沃，是重要的糧食供應地之一。"}, {"stem": "長江中下游平原因地勢平坦、水源匯聚，形成下列何種特色？", "opts": [["A", "氣候嚴寒、人煙稀少"], ["B", "地形崎嶇、以畜牧業為主"], ["C", "沙漠廣布、乾燥少雨"], ["D", "人口密集、經濟發達的精華區"]], "ans": "D", "exp": "長江中下游平原地勢平坦、水源匯聚，加上湖泊廣布、農業發達，是人口密集與經濟發達的精華區。"}, {"stem": "長江三角洲的形成方式與地理位置特徵，下列敘述何者正確？", "opts": [["A", "為長江河口的沖積平原，是中國人口與產業的精華區之一"], ["B", "位於青藏高原西南側，地勢高聳"], ["C", "是中國面積最大的內陸盆地"], ["D", "屬於乾燥氣候區，全年少雨"]], "ans": "A", "exp": "長江三角洲是長江河口因泥沙沖積而成的平原，地勢低平、水運便利，是中國人口與產業高度集中的精華區。"}, {"stem": "中國東南沿海的丘陵地區（如兩廣丘陵、東南丘陵），因山多平原少，居民常見的土地利用方式為何？", "opts": [["A", "大規模放牧牛羊"], ["B", "開闢油田"], ["C", "興建大型湖泊水庫"], ["D", "沿坡地開闢梯田以增加耕地"]], "ans": "D", "exp": "東南丘陵、兩廣丘陵地區地勢崎嶇、平原有限，居民為增加可耕地，常沿坡地開闢梯田。"}, {"stem": "福建西南一帶（浙閩丘陵地區）因應丘陵地形而發展出的特殊民居建築為何？", "opts": [["A", "蒙古包"], ["B", "干欄式建築"], ["C", "土樓"], ["D", "窰洞"]], "ans": "C", "exp": "課本提到浙閩丘陵圖中的土樓主要分布於福建西南一帶，是當地居民因應丘陵環境而發展出的防禦性建築。"}, {"stem": "橫斷山脈的走向與地形特色為何？", "opts": [["A", "東西走向，地勢平緩"], ["B", "呈南北走向，山勢陡直，山脈間平行排列"], ["C", "呈環形分布，中央為盆地"], ["D", "屬於三角洲地形"]], "ans": "B", "exp": "橫斷山脈山勢陡直，呈南北走向且山脈間平行排列，發源於青藏高原的部分河川會經橫斷山脈流至中南半島。"}, {"stem": "黃河之所以得名，與下列哪一項地形特徵最直接相關？", "opts": [["A", "流經黃土高原，河水含沙量高、顏色偏黃"], ["B", "發源於黃色的沙漠地帶"], ["C", "河口有大片黃色沙灘"], ["D", "沿岸種植大量油菜花"]], "ans": "A", "exp": "黃河流經黃土高原時，因黃土質地鬆散、易受侵蝕，挾帶大量泥沙，使河水顏色偏黃、混濁，因而得名。"}, {"stem": "就氣候類型而言，中國國土雖涵蓋熱帶到溫帶，但大部分地區位於哪一個氣候區？", "opts": [["A", "熱帶氣候區"], ["B", "極地氣候區"], ["C", "地中海型氣候區"], ["D", "溫帶氣候區"]], "ans": "D", "exp": "課本指出中國南北緯度跨越範圍大，涵蓋熱帶至溫帶，但大部分地區位於溫帶氣候區，氣候普遍溫和溼潤、四季分明。"}, {"stem": "中國各地氣候差異顯著，主要受下列哪一組因素共同影響？", "opts": [["A", "只受緯度影響"], ["B", "只受距海遠近影響"], ["C", "只受地形高低影響"], ["D", "緯度、季風、距海遠近與地形等因素"]], "ans": "D", "exp": "課本說明中國氣候主要受到緯度、季風、距海遠近與地形等多重因素交互影響，因而各地氣候差異顯著。"}, {"stem": "中國國土的緯度跨越範圍，大致從下列哪一氣候帶橫跨到哪一氣候帶？", "opts": [["A", "從寒帶跨越到溫帶"], ["B", "全境皆屬熱帶"], ["C", "從熱帶跨越到溫帶"], ["D", "全境皆屬寒帶"]], "ans": "C", "exp": "課本提到中國南北緯度跨越範圍大，涵蓋熱帶至溫帶，是造成境內氣候多樣的重要原因。"}, {"stem": "中國夏季的氣溫分布，大致呈現下列哪一種特徵？", "opt  "太平洋與印度洋形成低氣壓，暖溼氣流由海洋吹向陸地"], ["B", "蒙古一帶形成高氣壓，乾冷氣流由陸地吹向海洋"], ["C", "只影響中國西北內陸地區"], ["D", "使中國各地全年維持乾燥少雨"]], "ans": "A", "exp": "夏季太陽直射北半球，歐亞大陸增溫快、形成低氣壓區，暖溼氣流由太平洋、印度洋吹向陸地，形成富含水氣的夏季季風，帶來豐沛降水。"}, {"stem": "中國年降水量的空間分布，大致呈現下列何種趨勢？", "opts": [["A", "由西北向東南遞減"], ["B", "全國各地降水量大致相同"], ["C", "由東南向西北遞減"], ["D", "由北向南遞減"]], "ans": "C", "exp": "在季風、距海遠近與地形交互影響下，中國年降水量由東南向西北遞減，整體呈現「東溼西乾」的空間分布特徵。"}, {"stem": "造成中國年降水量呈現「東溼西乾」空間分布的原因，主要與下列哪些因素有關？", "opts": [["A", "只與緯度有關"], ["B", "只與土壤性質有關"], ["C", "只與河流長度有關"], ["D", "季風、距海遠近與地形的交互影響"]], "ans": "D", "exp": "課本指出中國各地年降水量的空間差異，是受到季風、距海遠近與地形等因素交互影響所致，西北內陸因距海遙遠、季風水氣難以到達而特別乾燥。"}, {"stem": "中國的年降水量 750 毫米等雨量線，大致與下列哪一條分界線重疊？", "opts": [["A", "秦嶺、淮河一線"], ["B", "長江三角洲邊界"], ["C", "塔里木盆地邊界"], ["D", "東北平原邊界"]], "ans": "A", "exp": "課本指出年降水量 750 毫米等雨量線，大致與秦嶺、淮河一線重疊，此線以南多水稻、以北多小麥。"}, {"stem": "中國的三大氣候類型（季風氣候、乾燥氣候、高地氣候），主要是依據哪些指標劃分？", "opts": [["A", "只依據行政區劃分"], ["B", "氣溫高低、年降水量多寡、地勢高度"], ["C", "只依據海拔高度"], ["D", "只依據人口密度"]], "ans": "B", "exp": "課本說明中國各地氣候依氣溫高低、年降水量多寡、地勢高度等差異，可分為季風氣候、乾燥氣候與高地氣候三大類型。"}, {"stem": "中國東半部地區，因受夏季季風影響顯著、降水較豐，屬於下列哪一種氣候類型？", "opts": [["A", "季風氣候"], ["B", "乾燥氣候"], ["C", "高地氣候"], ["D", "極地氣候"]], "ans": "A", "exp": "中國東半部受季風影響顯著，氣候溫和溼潤、夏雨冬乾，年降水量較多，適合農作物生長，屬於季風氣候。"}, {"stem": "季風氣候依緯度高低的不同，可再細分為下列哪一組氣候類型？", "opts": [["A", "溫帶沙漠氣候、溫帶草原氣候"], ["B", "高地氣候、乾燥氣候"], ["C", "熱帶季風氣候、副熱帶季風氣候、溫帶季風氣候"], ["D", "地中海型氣候、溫帶海洋性氣候"]], "ans": "C", "exp": "課本指出季風氣候依緯度高低，可分為熱帶季風氣候、副熱帶季風氣候與溫帶季風氣候三種。"}, {"stem": "中國西北內陸地區（如新疆、內蒙古一帶），因夏季季風不易到達、全年乾燥少雨，屬於下列哪一種氣候類型？", "opts": [["A", "季風氣候"], ["B", "乾燥氣候"], ["C", "高地氣候"], ["D", "熱帶雨林氣候"]], "ans": "B", "exp": "中國西北部地區距海遙遠、夏季季風難以深入，年降水量少、日夜溫差與年溫差皆大，屬於乾燥氣候，以畜牧業為主。"}, {"stem": "乾燥氣候依年降水量多寡的不同，可再細分為下列哪一組氣候類型？", "opts": [["A", "熱帶季風氣候、副熱帶季風氣候"], ["B", "高地氣候、季風氣候"], ["C", "溫帶海洋性氣候、地中海型氣候"], ["D", "溫帶草原氣候、溫帶沙漠氣候"]], "ans": "D", "exp": "課本指出乾燥氣候依年降水量多寡，可分為降水稍多、有草原景觀的溫帶草原氣候，以及降水更少、幾乎為荒漠的溫帶沙漠氣候。"}, {"stem": "青藏高原及西部高山地區，因地勢高聳、氣候與植被隨高度呈垂直變化，且日溫差大、年溫差相對較小，屬於下列哪一種氣候類型？", "opts": [["A", "溫帶季風氣候"], ["B", "溫帶沙漠氣候"], ["C", "高地氣候"], ["D", "副熱帶季風氣候"]], "ans": "C", "exp": "青藏高原與西部高山地區地勢高聳，氣候嚴寒、終年積雪、風勢強勁，氣候與植被隨高度呈垂直變化，日溫差大而年溫差小，屬於高地氣候。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

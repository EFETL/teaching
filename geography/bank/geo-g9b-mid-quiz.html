<script>
const QS=[{"stem": "十七世紀初，「大員」這個地名最初是指今日的哪一個地區？", "opts": [["A", "澎湖群島一帶"], ["B", "今臺南市安平區一帶的沙洲"], ["C", "今臺北盆地一帶"], ["D", "臺灣全島"]], "ans": "B", "exp": "課文提到十七世紀初大員是指今臺南市安平區一帶，當時安平是一片海岸外的沙洲，與臺灣本島以台江內海相隔，並非一開始就指全島。"}, {"stem": "十七世紀荷蘭人占領臺灣後，在地圖上將今臺南安平一帶標示為下列何者？", "opts": [["A", "Tayovan（大員）"], ["B", "Formosa（全島稱呼）"], ["C", "Takao（打狗）"], ["D", "Kelang（雞籠）"]], "ans": "A", "exp": "荷蘭人進占安平一帶後，在地圖上標示「Tayovan」，這是「大員」音譯的由來，當時所指範圍還只是沿海的一座沙洲。"}, {"stem": "「大員」、「台員」、「大灣」、「臺灣」等不同寫法會同時出現，最主要的原因是什麼？", "opts": [["A", "分屬不同政權各自命名"], ["B", "讀音相近，但後人書寫習慣不同而出現不同漢字"], ["C", "隨行政區改制而依序改名"], ["D", "因原住民族遷徙而分別改名"]], "ans": "B", "exp": "這些名稱都是源自平埔族「Tavoan」（交會之地）一詞的音譯，由於後人各自有不同的發音習慣與書寫方式，因而出現大員、台員、臺灣等不同寫法。"}, {"stem": "西方水手所稱呼的「福爾摩沙」（Ilha Formosa）意思為何？", "opts": [["A", "交會之地"], ["B", "溫暖之島"], ["C", "美麗之島"], ["D", "高山之島"]], "ans": "C", "exp": "「Ilha Formosa」為葡萄牙語，意為「美麗之島」，是早期西方水手航經臺灣時所給的稱呼。"}, {"stem": "平埔族人原以「Tavoan」稱呼安平一帶，這個詞的原始意義為何？", "opts": [["A", "交會之地"], ["B", "美麗之島"], ["C", "溫泉之地"], ["D", "沙洲之地"]], "ans": "A", "exp": "早期居住在安平一帶的平埔族人以「Tavoan」稱呼本地，意義為「交會之地」，後來成為大員、臺灣等名稱的語源。"}, {"stem": "西元1684年臺灣納入清帝國版圖後，「臺灣」這個名稱扮演了什麼樣的新角色？", "opts": [["A", "僅為地理名詞，不作為行政區使用"], ["B", "專指澎湖群島的行政區名"], ["C", "同時作為全島稱呼，也作為行政區名稱，如臺灣府、臺灣縣"], ["D", "改稱為福爾摩沙府"]], "ans": "C", "exp": "臺灣納入清帝國版圖後，「臺灣」不僅是全島名稱，也被官方用來作為行政區的名稱，如臺灣府、臺灣縣等。"}, {"stem": "光緒13年（1887年）臺灣建省後，「臺灣省」這個行政區名所涵蓋的範圍為何？", "opts": [["A", "僅今臺南一帶"], ["B", "涵蓋臺灣全島與澎湖群島"], ["C", "僅臺灣北部地區"], ["D", "僅安平港區"]], "ans": "B", "exp": "光緒13年臺灣建省，「臺灣省」這個行政區名即涵蓋臺灣全島與澎湖群島，顯示「臺灣」所指涉的空間範圍隨時代擴大。"}, {"stem": "從「臺灣」名稱所涉及範圍的演變過程，我們可以得到下列哪一項正確的認識？", "opts": [["A", "地名的範圍只會不斷擴大，不會縮小"], ["B", "地名一旦訂定即永久不變"], ["C", "地名的變化與行政區劃完全無關"], ["D", "同一個地名，在不同的時代，可能指涉不同的空間範圍"]], "ans": "D", "exp": "課文指出透過對臺灣地名的解析，可以了解同一個地方在不同時代可能使用不同地名，同一個地名在不同時代也可能指涉不同的地方。"}, {"stem": "「彰化」縣名的由來，與下列何者最直接相關？", "opts": [["A", "沿用當地原住民族社名"], ["B", "依相對方位命名"], ["C", "清帝國平定朱一貴事件後設縣，取「彰顯皇朝教化」之意"], ["D", "紀念地方仕紳捐地建城"]], "ans": "C", "exp": "清帝國平定朱一貴事件後，為強化對臺統治，在舊名「半線」之地設置彰化縣，具有「彰顯皇朝教化」的意涵。"}, {"stem": "「嘉義」這個縣名的由來，與下列哪一個歷史事件最相關？", "opts": [["A", "當地氣候溫暖四季如春"], ["B", "縣治位居全臺中心的方位"], ["C", "沿用原住民族社名"], ["D", "林爽文事件中，皇帝嘉許諸羅縣民協助平亂有功，故改名"]], "ans": "D", "exp": "林爽文事件中，當地民眾協助官兵平定叛亂有功，清帝國為嘉許民眾忠義精神，將「諸羅」改為「嘉義」。"}, {"stem": "下列哪一組「依方位命名」的行政區名稱說明正確？", "opts": [["A", "屏東——因位於半屏山以東而得名"], ["B", "宜蘭——簡化自原住民族「噶瑪蘭族」之名"], ["C", "新竹——取自原住民族「竹塹社」"], ["D", "南投——取自原住民族「南投社」"]], "ans": "A", "exp": "屏東因位於半屏山以東而得名，屬於依方位命名的類型；宜蘭、新竹、南投則分別屬於取自原住民族名稱的類型，並非依方位命名。"}, {"stem": "「桃園」這個地名的由來，與下列何者最相關？", "opts": [["A", "紀念歷史上的桃園三結義"], ["B", "移民入墾後當地桃樹遍布，舊稱「桃仔園」"], ["C", "因位居全臺中心的方位"], ["D", "源自原住民族社名"]], "ans": "B", "exp": "桃園因當年移民入墾後桃樹遍布而名為「桃仔園」，屬於與自然環境相關的行政區命名類型。"}, {"stem": "「雲林」這個地名的由來，主要與下列何者有關？", "opts": [["A", "當地多雲南籍移民"], ["B", "紀念清代治臺官員"], ["C", "舊縣治位在山林附近，入夜後常霧氣濃厚"], ["D", "位於雲林山脈山腳下"]], "ans": "C", "exp": "雲林因舊縣治位在山林附近，入夜後常霧氣濃厚而得名，屬於與自然環境相關的行政區命名類型。"}, {"stem": "花蓮舊稱「洄瀾」，其由來與下列何者最相關？", "opts": [["A", "花蓮溪溪水在出海口與海浪衝擊，呈現迴旋狀巨浪"], ["B", "當地盛產花卉"], ["C", "紀念日治時期的移民村"], ["D", "位居臺灣東部的方位"]], "ans": "A", "exp": "早期漢人移民看到花蓮溪溪水在出海口與海浪衝擊呈現迴旋狀巨浪，故稱當地為「洄瀾」，後演變為花蓮。"}, {"stem": "下列哪一個縣市名稱是取自原住民族的社名？", "opts": [["A", "臺南"], ["B", "屏東"], ["C", "基隆——取自原住民族雞籠社的社名"], ["D", "花蓮"]], "ans": "C", "exp": "基隆取自原住民族雞籠社的社名；臺南、屏東、花蓮則分別屬於沿用聚落名稱、依方位命名、與自然環境相關的類型。"}, {"stem": "「新竹」、「苗栗」兩地地名的由來，與下列何者最相關？", "opts": [["A", "皆依相對方位命名"], ["B", "分別源自原住民族「竹塹社」與「猫裏社」"], ["C", "皆為日治時期新創的地名"], ["D", "分別因盛產竹子與栗子而得名"]], "ans": "B", "exp": "課文指出新竹與苗栗源自於竹塹社和猫裏社，屬於取自原住民族名稱的行政區命名類型。"}, {"stem": "「宜蘭」這個地名的由來，與下列何者最相關？", "opts": [["A", "因當地氣候宜人"], ["B", "紀念清代治臺官員"], ["C", "因位於臺灣東北方"], ["D", "簡化自原住民族「噶瑪蘭族」之名"]], "ans": "D", "exp": "宜蘭是簡化自原住民族「噶瑪蘭族」之名而來，屬於取自原住民族名稱的行政區命名類型。"}, {"stem": "日治時期臺灣總督府調整行政區地名時，下列哪一項是常見的做法？", "opts": [["A", "一律恢復使用原住民族語地名"], ["B", "廢除所有舊地名，改以編號稱呼"], ["C", "將早年常見的三字地名簡化為兩字，例如「坪林尾」改為「坪林」"], ["D", "一律改為依方位命名"]], "ans": "C", "exp": "日治時期臺灣總督府推動地方行政區劃調整，同時修改行政區地名，將早年常見的三個字地名簡化為兩個字，如「坪林尾」改為「坪林」。"}, {"stem": "「艋舺」（Bangkah）改為「萬華」（Banka），這樣的地名演變方式屬於下列何者？", "opts": [["A", "因政治意識型態而改名"], ["B", "依語音的近似性，改成與日語發音相近的漢字"], ["C", "因避免與其他行政區名重複而改名"], ["D", "因原住民族正名運動而改名"]], "ans": "B", "exp": "日治時期根據語音的近似性，將舊有地名改成與日語發音相近的漢字，「艋舺」（Bakah）改為「萬華」（Banka）即為一例。"}, {"stem": "「打貓」（Táⁿ-niau）改為「民雄」（Tamio），這樣的地名演變方式與下列何者相同？", "opts": [["A", "因紀念歷史人物而改名"], ["B", "因當地盛產貓型石雕而得名"], ["C", "因數個聚落合併重組而成"], ["D", "依語音的近似性，改成與日語發音相近的漢字"]], "ans": "D", "exp": "「打貓」改為「民雄」與「艋舺」改為「萬華」相同，都是依語音近似性，將舊地名改成與日語發音相近的漢字。"}, {"stem": "「打狗」改為「高雄」，主要發生於下列哪一個時期？", "opts": [["A", "清帝國時期"], ["B", "荷蘭統治時期"], ["C", "日治時期"], ["D", "民國時期"]], "ans": "C", "exp": "日治時期臺灣總督府改用日本式地名，例如「打狗」改為「高雄」，即屬此類調整。"}, {"stem": "彰化縣「伸港鄉」原名「新港」，後來改名的原因為何？", "opts": [["A", "因日治時期政策強制改名"], ["B", "因與嘉義縣新港鄉同名，故改名"], ["C", "因當地新建港口設施"], ["D", "因紀念地方仕紳"]], "ans": "B", "exp": "彰化縣伸港鄉原名新港，因與嘉義縣新港鄉同名，故改為伸港，屬於「避免與其他行政區名重複而改名」的類型。"}, {"stem": "屏東縣「南州鄉」原名「溪州」，其改名原因與下列何者相同？", "opts": [["A", "紀念歷史人物"], ["B", "因政治意識型態調整"], ["C", "因語音近似日語漢字而改名"], ["D", "因與彰化縣「溪州鄉」同名而改名"]], "ans": "D", "exp": "屏東縣南州鄉原名溪州，因與彰化縣溪州鄉同名，故改為南州，與伸港鄉的改名原因相同，皆屬避免行政區名重複。"}, {"stem": "臺南市「龍崎區」地名的由來，屬於下列哪一種行政區名演變類型？", "opts": [["A", "沿用昔日單一聚落的名稱"], ["B", "由「龍船」、「崎頂」兩個主要聚落各取首字合成"], ["C", "依方位新創的地名"], ["D", "具政治意識型態意涵的命名"]], "ans": "B", "exp": "臺南市龍崎區在日治時期行政區調整時，以「龍船」、「崎頂」兩個主要聚落，各取首字合成「龍崎」。"}, {"stem": "新北市「中和區」地名的由來，與臺南市「龍崎區」屬於相同的哪一種命名類型？", "opts": [["A", "原地名雅化"], ["B", "依方位新創"], ["C", "由數個聚落名稱合併、重組而成，例如中坑與漳和各取一字"], ["D", "沿用原住民族社名"]], "ans": "C", "exp": "新北市中和區是由中坑和漳和兩個主要聚落，各取一字重組而成的行政區名，與龍崎區皆屬「由數個聚落名稱合併、重組而成」的類型。"}, {"stem": "高雄市「苓雅區」舊名「苓仔寮」，其地名演變方式屬於下列何者？", "opts": [["A", "由兩個聚落合併重組而成"], ["B", "依方位命名"], ["C", "因政治意識型態而改名"], ["D", "原地名「苓仔寮」雅化為「苓雅寮」後設區"]], "ans": "D", "exp": "「苓」為捕魚用的流刺網，該地名意指漁民晒網修補魚網的草寮，後來雅化為「苓雅寮」，設行政區時命名為苓雅區。"}, {"stem": "宜蘭縣「冬山鄉」舊名「冬瓜山」，後簡化為「冬山」，其最初命名的依據為何？", "opts": [["A", "當地盛產冬瓜"], ["B", "當地山形綿延如冬瓜，形成明顯地標而得名"], ["C", "紀念清代治臺官員"], ["D", "因方位居冬季風口而得名"]], "ans": "B", "exp": "宜蘭縣冬山鄉舊名為冬瓜山，乃因當地山形綿延如冬瓜，形成明顯地標而得名，後來簡化為冬山。"}, {"stem": "桃園市「復興區」、臺中市「和平區」、南投縣「信義鄉」等山地行政區的名稱，具有下列哪一種特色？", "opts": [["A", "沿用原住民族語直接音譯而來"], ["B", "依相對方位命名"], ["C", "因紀念地方特產而命名"], ["D", "被政府賦予政治意識或道德教化的含義"]], "an 洲"], ["D", "高山稜線"]], "ans": "A", "exp": "「崁」意指陡峭崖坡，通常分布於台地的邊緣，崁的上、下方平地也可能出現崁頂、崁腳等地名。"}, {"stem": "「牛墟」這個地名，反映當地早年具有下列哪一種功能？", "opts": [["A", "放牧牛群的草原"], ["B", "供奉牛神的廟宇"], ["C", "交易牛隻的場所"], ["D", "屠宰牛隻的作坊"]], "ans": "C", "exp": "臺灣多樣化的環境孕育了豐富的動植物，交易牛隻的地方稱為「牛墟」，反映早年當地與牛隻買賣有關的產業活動。"}, {"stem": "全臺各地散布著眾多帶有「鹿」字的地名，這個現象最可能反映下列何者？", "opts": [["A", "昔日臺灣梅花鹿群分布廣泛"], ["B", "當地居民多以「鹿」為姓"], ["C", "日治時期政策刻意命名"], ["D", "紀念鹿港的開發歷史"]], "ans": "A", "exp": "現今梅花鹿數量非常稀少，但透過散布全臺的「鹿」地名，可推測昔日鹿群分布廣泛，反映早年臺灣的生態景觀。"}, {"stem": "課文提到「沙鹿」、「初鹿」等地名的例子，主要是要說明下列哪一個重要觀念？", "opts": [["A", "所有含「鹿」字的地名都與梅花鹿有關"], ["B", "地名中包含動物的名稱，由來不見得與該動物有關"], ["C", "這些地名皆為日治時期新創的地名"], ["D", "這些地名與農業生產完全無關"]], "ans": "B", "exp": "課文指出「沙鹿」來自原住民族語，「初鹿」則是原住民族語轉寫成日語漢字，說明地名雖含動物名稱，由來不一定與該動物有關。"}, {"stem": "早期來臺的閩南人習慣以「厝」稱呼房舍（如陳厝、張厝），客家人則習慣使用下列哪一個字？", "opts": [["A", "屋"], ["B", "寮"], ["C", "坑"], ["D", "崙"]], "ans": "A", "exp": "閩南人習慣使用「厝」，故有陳厝、張厝等地名；客家人習慣使用「屋」，則有黃屋、宋屋等地名，反映不同族群的語言文化差異。"}, {"stem": "含有「屋」字的聚落地名，主要集中分布於下列哪一個區域？", "opts": [["A", "臺北盆地"], ["B", "花東縱谷"], ["C", "桃、竹、苗等客家族群較集中地區"], ["D", "恆春半島"]], "ans": "C", "exp": "「屋」多分布於客家族群較集中的桃、竹、苗地區，此外「崠」、「窩」等地形用字也具客家特色，同樣多集中在此區域。"}, {"stem": "屏東縣「潮州」這個地名的由來，與下列何者最相關？", "opts": [["A", "因當地潮汐現象特別明顯"], ["B", "移民多來自中國廣東潮州，直接移植原鄉地名"], ["C", "紀念清代治臺官員"], ["D", "因語音近似日語漢字而改名"]], "ans": "B", "exp": "當移民進入一地拓墾時，有時會直接移植原鄉地名，屏東縣的潮州即是一例，反映移民多來自中國廣東潮州府。"}, {"stem": "移墾聚落居民為了防禦與防風，會在聚落周圍環植刺竹，因而出現下列哪一種常見地名？", "opts": [["A", "竹圍"], ["B", "竹崎"], ["C", "竹塹"], ["D", "竹林"]], "ans": "A", "exp": "移墾聚落居民為了防禦和防風，會在聚落周圍環植刺竹，於是出現稱作「竹圍」的地名，如嘉義縣義竹（舊名二竹圍）。"}, {"stem": "高雄市「鹽埕區」這個地名的由來，與下列哪一項生產事業最相關？", "opts": [["A", "陶瓷製作業"], ["B", "造紙業"], ["C", "早年的製鹽業"], ["D", "木材加工業"]], "ans": "C", "exp": "農業社會中天然資源或作物的加工場所常成為地名的命名依據，「鹽埕」這個地名即與製鹽業有關，如高雄市鹽埕區。"}, {"stem": "澎湖縣「馬公市」地名的由來，與下列何者最相關？", "opts": [["A", "當地馬匹養殖業興盛"], ["B", "紀念鄭成功部將"], ["C", "位居澎湖群島的地理中心"], ["D", "當地天后宮（媽祖宮）為信仰中心，簡稱「媽宮」演變而來"]], "ans": "D", "exp": "澎湖縣馬公市的天后宮俗稱媽祖宮，簡稱「媽宮」，是馬公地名的由來，屬於與民間信仰有關的地名類型。"}, {"stem": "新北市「烏來」這個地名的由來，與下列何者最相關？", "opts": [["A", "泰雅族語「Ulay」意指溫泉，因族人發現南勢溪溪水很燙而得名"], ["B", "紀念清代治臺官員"], ["C", "因當地盛產烏梅"], ["D", "因語音近似日語漢字而改名"]], "ans": "A", "exp": "新北市的烏來，其地名起源與泰雅族語的「溫泉」有關，族人發現南勢溪溪水很燙，將當地命名為「Ulay」，漢字「烏來」即其音譯。"}, {"stem": "「池上米」地名商標爭議中，鄉公所最後向智慧財產局申請的結果為何？", "opts": [["A", "因法令規定地名加上商品不得申請一般商標，僅能申請產地證明標章"], ["B", "順利註冊為專屬商標，禁止其他地區使用「池上」字樣"], ["C", "遭智慧財產局全數駁回，未取得任何保障"], ["D", "直接由鄉公所授權特定糧商收取權利金"]], "ans": "A", "exp": "池上鄉公所申請商標過程中，糧商提出異議，主張池上米已為同業慣用之詞，最後因法令規定無法以地名加上商品申請商標，僅能申請產地證明標章。"}, {"stem": "課文提到高雄美濃的紙傘、南投埔里的手工造紙等擁有地方特產的鄉鎮，普遍面臨下列哪一項困境？", "opts": [["A", "因政府強制拆除舊聚落而流失文化"], ["B", "因地名與其他行政區重複而無法申請商標"], ["C", "面臨人口外移、勞動力老化、產業消失的問題"], ["D", "因地方特產過於知名，導致觀光客過多而擾民"]], "ans": "C", "exp": "許多擁有地方特產的鄉鎮，因相對遠離都市地區，面臨人口外移、勞動力老化、產業消失的問題與困境，如高雄美濃的紙傘、南投埔里的手工造紙等，這也是臺灣地方創生所要面對的重要課題。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

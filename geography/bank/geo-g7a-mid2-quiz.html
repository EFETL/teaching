<script>
const QS=[{"stem": "塑造地表地形的力量可分為「內營力」與「外營力」，下列何者「不屬於」外營力的作用方式？", "opts": [["A", "侵蝕"], ["B", "搬運"], ["C", "堆積"], ["D", "地殼變動"]], "ans": "D", "exp": "外營力是指來自地球外部（如風、水）的力量，透過侵蝕、搬運、堆積等作用改變地表；地殼變動（如板塊運動）屬於內營力的作用，並非外營力。"}, {"stem": "下列哪一項屬於「外營力」所造成的地形現象？", "opts": [["A", "板塊擠壓形成褶曲山脈"], ["B", "火山噴發形成新的山體"], ["C", "河流搬運泥沙在出山口堆積成沖積扇"], ["D", "地震造成地表斷裂"]], "ans": "C", "exp": "河流將泥沙由山區搬運至山麓堆積形成沖積扇，是水流侵蝕、搬運、堆積的外營力作用；其餘三者皆與板塊運動、火山、地震等內營力有關。"}, {"stem": "臺灣的地形具有「山地廣大、地勢高聳、坡面陡峭、地質破碎」等特徵，這些特徵顯示臺灣地形屬於下列何種地形？", "opts": [["A", "老年地形"], ["B", "年輕地形"], ["C", "沖積地形"], ["D", "風化地形"]], "ans": "B", "exp": "由於臺灣位於板塊擠壓帶，地層隆起的時間相對較短，山地地勢高聳、坡度陡峭、地質破碎，屬於「年輕地形」的特徵。"}, {"stem": "臺灣島上會出現數列大致呈南北走向的新褶曲山脈，主要與下列何者關係最密切？", "opts": [["A", "風力長期侵蝕"], ["B", "河流長期堆積"], ["C", "板塊推擠使海底沉積物隆起"], ["D", "海水長期侵蝕海岸"]], "ans": "C", "exp": "臺灣位於歐亞板塊與菲律賓海板塊的接觸帶，兩板塊互相推擠，使原本在海底的沉積物隆起，形成數列大致呈南北走向的新褶曲山脈。"}, {"stem": "依全球地形分類，地形一般可分為山地、高原、丘陵、台地、平原、盆地六種類型，臺灣島上「沒有」下列哪一種地形？", "opts": [["A", "台地"], ["B", "高原"], ["C", "丘陵"], ["D", "盆地"]], "ans": "B", "exp": "全球地形雖有六大類型，但臺灣因面積與地質條件，並沒有高原地形，只有規模與高度較小的台地地形。"}, {"stem": "下列關於「陽明山小油坑」與「莫拉克颱風後荖濃溪沖積扇」兩種地景成因的敘述，何者正確？", "opts": [["A", "兩者皆為內營力所形成"], ["B", "兩者皆為外營力所形成"], ["C", "小油坑為內營力、沖積扇為外營力"], ["D", "小油坑為外營力、沖積扇為內營力"]], "ans": "C", "exp": "小油坑的地熱噴氣現象來自地球內部的火山活動，屬於內營力；沖積扇則是河水將泥沙由山區搬運到出山口堆積而成，屬於外營力的作用。"}, {"stem": "臺灣位於下列哪兩個板塊的接觸帶（交界帶）？", "opts": [["A", "太平洋板塊與印度板塊"], ["B", "歐亞板塊與菲律賓海板塊"], ["C", "北美板塊與太平洋板塊"], ["D", "印度板塊與非洲板塊"]], "ans": "B", "exp": "臺灣位於歐亞板塊與菲律賓海板塊的接觸（交界）帶，受兩板塊互相擠壓的影響，形塑出臺灣特殊的地形樣貌。"}, {"stem": "由於臺灣位於板塊交界帶，長期受到板塊擠壓的影響，下列哪一項「不是」板塊擠壓帶來的結果？", "opts": [["A", "山脈大致呈南北走向"], ["B", "地勢高聳、坡度陡峭"], ["C", "地震、火山活動頻繁"], ["D", "平原面積廣大且地勢平坦"]], "ans": "D", "exp": "板塊擠壓使臺灣山脈隆起、地勢陡峭且多地震火山，反而造成臺灣「山多平原少」，平原面積相對狹小，並非板塊擠壓的直接結果。"}, {"stem": "依地勢高低起伏的程度，下列對「山地」的定義，何者正確？", "opts": [["A", "海拔超過1000公尺、地表崎嶇起伏的地形"], ["B", "海拔低於1000公尺、起伏較小的地形"], ["C", "地勢高而平坦、海拔低於1000公尺的地形"], ["D", "四周被丘陵、山地圍繞的盆狀地形"]], "ans": "A", "exp": "山地是指海拔超過1000公尺、高度與坡度變化大、地表崎嶇起伏的地形，是臺灣五大地形中面積最廣大的一種。"}, {"stem": "臺灣的五大山脈中，範圍最大的是下列哪一條？", "opts": [["A", "雪山山脈"], ["B", "阿里山山脈"], ["C", "中央山脈"], ["D", "海岸山脈"]], "ans": "C", "exp": "臺灣的五大山脈包括中央山脈、雪山山脈、玉山山脈、阿里山山脈與海岸山脈，其中以中央山脈範圍最大，並有「臺灣島脊梁」之稱。"}, {"stem": "臺灣海拔最高的山峰「玉山」，屬於下列哪一條山脈？", "opts": [["A", "中央山脈"], ["B", "阿里山山脈"], ["C", "雪山山脈"], ["D", "玉山山脈"]], "ans": "D", "exp": "玉山主峰海拔約3952公尺，是臺灣最高峰，屬於玉山山脈的主峰，而非範圍最大的中央山脈。"}, {"stem": "中央山脈除了是臺灣範圍最大的山脈外，也常被稱為「臺灣島的脊梁」，這是因為中央山脈還具有下列哪一項重要角色？", "opts": [["A", "臺灣主要的農業生產區"], ["B", "臺灣大多數河川的分水嶺"], ["C", "臺灣人口最密集的地區"], ["D", "臺灣面積最大的平原所在地"]], "ans": "B", "exp": "中央山脈縱貫臺灣南北，是大多數河川的發源地與分水嶺，河川分別向東、西兩側流出，因此有「臺灣島脊梁」之稱。"}, {"stem": "下列對「丘陵」的敘述，何者正確？", "opts": [["A", "海拔超過1000公尺，主要分布在臺灣東部沿海"], ["B", "是臺灣人口密度最高的地形區"], ["C", "地勢平坦，四周被山地與台地圍繞"], ["D", "海拔低於1000公尺，主要分布在山地的外緣"]], "ans": "D", "exp": "丘陵是海拔低於1000公尺、起伏較小的地形，主要分布在山地的外緣，例如新竹丘陵、苗栗丘陵。"}, {"stem": "臺灣的丘陵地形由於起伏較小、坡度較緩，常被開闢作為下列哪一種土地利用？", "opts": [["A", "大規模的重工業區"], ["B", "高樓密集的商業區"], ["C", "茶園、果園等農業用地"], ["D", "大型國際機場用地"]], "ans": "C", "exp": "丘陵地勢起伏較小，適合開闢為農田，常見種植茶樹、果樹、水稻等，例如新竹丘陵、苗栗丘陵，日月潭周邊丘陵更是知名紅茶產區。"}, {"stem": "下列對「盆地」的敘述，何者正確？", "opts": [["A", "四周被丘陵、山地（或台地）圍繞，底部地勢平坦"], ["B", "海拔超過1000公尺，地表崎嶇起伏"], ["C", "地勢高而平坦，主要分布在山地外緣"], ["D", "為臺灣面積最廣大的地形類型"]], "ans": "A", "exp": "盆地是四周被丘陵、山地（或台地）圍繞、中間底部地勢平坦低窪的地形，由於地勢平坦且有屏障保護，常成為人口密集的居住地。"}, {"stem": "臺北盆地是全臺人口密度最高的地區，其主要原因與下列何者最相關？", "opts": [["A", "臺北盆地海拔極高，氣候涼爽宜人"], ["B", "臺北盆地是臺灣面積最大的平原"], ["C", "臺北盆地四周沒有任何地形屏障"], ["D", "臺北盆地底部地勢平坦，適合居住與各項建設"]], "ans": "D", "exp": "盆地底部地勢平坦，土地利用限制少，適合人類居住與都市發展，臺北盆地因此發展為政治、經濟中心，也是全臺人口密度最高的地區。"}, {"stem": "臺中盆地的地形位置描述，下列何者最正確？", "opts": [["A", "西側為大肚台地、八卦台地，南、北側為丘陵，東側為山地"], ["B", "四周皆為平原環繞，沒有任何山地或台地"], ["C", "位於臺灣東部沿海，緊鄰太平洋"], ["D", "是臺灣面積最大、海拔最高的盆地"]], "ans": "A", "exp": "臺中盆地西側有大肚台地、八卦台地，南、北兩側有丘陵，東側則為山地，四周地形將盆地圍繞其中，屬於典型的盆地地形。"}, {"stem": "下列對「台地」的敘述，何者正確？", "opts": [["A", "地勢高而平坦，但海拔低於1000公尺"], ["B", "海拔超過1000公尺，地形崎嶇陡峭"], ["C", "四周被山地、丘陵圍繞，底部低平"], ["D", "是臺灣農業生產面積最廣大的地形"]], "ans": "A", "exp": "台地是地勢高而平坦、但海拔低於1000公尺的地形，主要分布在盆地、平原或丘陵的接觸帶，例如林口台地、桃園台地、大肚台地、八卦台地。"}, {"stem": "臺灣許多台地（如桃園台地）的形成，與下列哪一過程關係最密切？", "opts": [["A", "古代河川沖積扇歷經地層抬升與河川切割而成"], ["B", "火山長期噴發熔岩堆積而成"], ["C", "海水長期侵蝕海岸而成"], ["D", "風力長期堆積沙丘而成"]], "ans": "A", "exp": "許多台地原本是古代河川的沖積扇，後來因地層抬升，加上河川的切割作用，逐漸形成頂部平坦、邊緣陡峭的台地地形。"}, {"stem": "桃園台地上分布著許多「埤塘」，這種特殊的水利設施主要與下列哪一項原因有關？", "opts": [["A", "台地地勢低窪，容易淹水，需築堤防洪"], ["B", "台地地層抬升後河川水源減少，居民開闢埤塘蓄水灌溉"], ["C", "台地為觀光需求而人工挖掘的景觀池"], ["D", "台地地下水過於豐沛，需開埤塘分洪"]], "ans": "B", "exp": "桃園台地過去為古河川沖積扇，因板塊運動使地層抬升，河川水源受到影響而減少，先民便開闢許多埤塘蓄水，以提供農田灌溉之用。"}, {"stem": "臺灣面積最廣大的平原是下列何者？", "opts": [["A", "蘭陽平原"], ["B", "屏東平原"], ["C", "嘉南平原"], ["D", "花東縱谷平原"]], "ans": "C", "exp": "臺灣西部從臺中以南有連綿成片的平原，其中以嘉南平原（嘉義、臺南一帶）面積最為廣大，是臺灣主要的農業生產地帶之一。"}, {"stem": "平原之所以能成為臺灣主要的農業生產區與人口密集區，最主要的原因是下列何者？", "opts": [["A", "平原地勢低而平坦，多由河川沖積而成，土地利用限制少"], ["B", "平原海拔最高，氣候最為涼爽"], ["C", "平原四周被高山圍繞，交通最不便利"], ["D", "平原是臺灣唯一沒有地震發生的地形區"]], "ans": "A", "exp": "平原地勢低平、多為河川沖積而成，加上水源豐富、土地利用所受限制最少，因此較早成為人類開發之地，也發展為主要的農業生產區與人口密集區。"}, {"stem": "關於臺灣五大地形的東西分布差異，下列敘述何者正確？", "opts": [["A", "東部多山地，西部平原、丘陵、台地較多"], ["B", "東部多平原，西部多高山"], ["C", "東西部地形分布完全相同，沒有差異"], ["D", "南部多山地，北部完全沒有山地"]], "ans": "A", "exp": "臺灣地形的分布具有顯著的東西差異：東部多山地，西部則平原、丘陵與台地較多，盆地則分布於山地、丘陵與台地之間。"}, {"stem": "臺灣的盆地地形主要分布在下列哪些地形之間？", "opts": [["A", "海岸與海洋之間"], ["B", "河口與外海之間"], ["C", "兩座高山山頂之間"], ["D", "山地、丘陵與台地之間"]], "ans": "D", "exp": "盆地是四周被丘陵、山地（或台地）圍繞的地形，因此臺灣的盆地大多分布於山地、丘陵與台地之間，如臺北盆地、臺中盆地、埔里盆地。"}, {"stem": "臺灣島形狀狹長，南北長約394公里，東西最大寬度約144公里，這種狹長的形狀與下列何者關係最密切？", "opts": [["A", "板塊擠壓方向使島嶼向南北向延展"], ["B", "河川長期沖刷海岸造成"], ["C", "火山活動使島嶼向東西擴張"], ["D", "人為填海造陸所形成"]], "ans": "A", "exp": "由於歐亞板塊與菲律賓海板塊主要沿西北—東南方向擠壓，長期推擠使臺灣島往南北向發展，因而形成南北狹長的島嶼形狀。"}, {"stem": "下列關於臺灣地形分布比例的敘述，何者最符合課本內容？", "opts": [["A", "山地與丘陵所占面積比例較大，山多平原少"], ["B", "平原面積占全臺總面積一半以上"], ["C", "盆地是臺灣面積比例最大的地形"], ["D", "台地面積遠大於山地面積"]], "ans": "A", "exp": "臺灣受板塊擠壓隆起，山地與丘陵所占面積比例較大，呈現「山多平原少」的特徵，平原與盆地雖面積較小，卻是主要的生活空間。"}, {"stem": "臺灣之所以地震、火山活動頻繁，主要的地理位置因素為何？", "opts": [["A", "位於板塊交界帶，板塊擠壓推擠所致"], ["B", "位於赤道正下方，受赤道無風帶影響"], ["C", "位於大陸內部，遠離海洋"], ["D", "位於極地地區，受冰河作用影響"]], "ans": "A", "exp": "臺灣位於歐亞板塊與菲律賓海板塊的接觸帶，板塊持續推擠，內營力作用旺盛，因此地震與火山活動十分頻繁。"}, {"stem": "在臺灣五大地形中，面積比例最大的地形類型是下列何者？", "opts": [["A", "平原"], ["B", "盆地"], ["C", "山地"], ["D", "台地"]], "ans": "C", "exp": "受板塊擠壓隆起影響，臺灣山地面積廣大，是五大地形中面積比例最大的一種，也因此形成「山多平原少」的地形特色。"}, {"stem": "海岸山脈主要分布在臺灣的哪一個方位？", "opts": [["A", "西部沿海"], ["B", "東部沿海"], ["C", "北部沿海"], ["D", "澎湖群島一帶"]], "ans": "B", "exp": "海岸山脈是臺灣五大山脈之一，分布於臺灣東部沿海地帶，與中央山脈之間夾著花東縱谷平原。"}, {"stem": "下列何者「不是」臺灣的五大山脈之一？", "opts": [["A", "中央山脈"], ["B", "雪山山脈"], ["C", "玉山山脈"], ["D", "太魯閣山脈"]], "ans": "D", "exp": "臺灣的五大山脈為中央山脈、雪山山脈、玉山山脈、阿里山山脈與海岸山脈，並沒有「太魯閣山脈」這個名稱；太魯閣峽谷是位於中央山脈東側的著名景觀。"}, {"stem": "在地圖上，將地表海拔高度相同的各點連接成的閉合曲線，稱為下列何者？", "opts": [["A", "分層設色線"], ["B", "地形剖面線"], ["C", "等高線"], ["D", "經緯線"]], "ans": "C", "exp": "等高線是將地表上海拔高度相同的各點連接而成的閉合曲線，利用等高線分布來表現地表高低起伏的地圖，稱為等高線地形圖。"}, {"stem": "透過等高線地形圖，我們最「不容易」直接判讀出下列哪一項資訊？", "opts": [["A", "一地的海拔高度"], ["B", "一地的坡度陡緩"], ["C", "一地的相對高度"], ["D", "一地當月的降雨量"]], "ans": "D", "exp": "等高線地形圖可用來判讀地表形態、海拔高度、相對高度及坡度等資訊，但無法呈現降雨量等氣候資料，須配合氣候圖等其他資料才能得知。"}, {"stem": "將等高線地形圖中不同高度範圍的區域，分別畫上不同顏色，以表現地表高度分布與變化的地圖，稱為下列何者？", "opts": [["A", "分層設色圖"], ["B", "地形剖面圖"], ["C", "航空照片"], ["D", "衛星影像圖"]], "ans": "A", "exp": "分層設色圖是在等高線地形圖的基礎上，將不同高度範圍的區域分別畫上不同顏色，藉此更直觀地呈現地表高度的分布與變化。"}, {"stem": "若想具體呈現某地區「沿著一條直線」的地表高低起伏情形，最適合採用下列哪一種地形表現方式？", "opts": [["A", "分層設色圖"], ["B", "地形剖面圖"], ["C", "航空照片"], ["D", "衛星影像圖"]], "ans": "B", "exp": "地形剖面圖是在等高線地形圖上畫一條剖面線，將此直線所經各地的高度連結而成的曲線，能具體呈現該地沿線的地面高低起伏。"}, {"stem": "下列關於「海拔高度」與「相對高度」的敘述，何者正確？", "opts": [["A", "海拔高度是兩地點之間的高度差，相對高度是與海平面的高度差"], ["B", "海拔高度與相對高度意義完全相同"], ["C", "海拔高度是一地與海平面的高度差，相對高度是兩地點之間的高度差"], ["D", "相對高度一定大於海拔高度"]], "ans": "C", "exp": "海拔高度（又稱絕對高度）是一地與海平面之間的高度差；相對高度則是兩地點之間的高度差，兩者意義並不相同。"}, {"stem": "近年來利用衛星影像與航空照片，最主要可幫助我們達成下列哪一項目的？", "opts": [["A", "預測未來十年的人口成長數字"], ["B", "快速且準確掌握土地利用變化與災害發生情形"], ["C", "直接測量出地表岩石的年齡"], ["D", "取代所有的等高線地形圖，不再需要判讀等高線"]], "ans": "B", "exp": "衛星影像與航空照片能快速、準確地取得地面即時影像，常用於了解土地利用的變化，以及災害（如山崩、土石流）發生的情形與影響。"}, {"stem": "在同一張等高線地形圖上，若某處的等高線分布較為「密集」，代表該處的地形具有下列哪一項特徵？", "opts": [["A", "坡度較為  "課本指出由於缺乏規範，臺灣海岸地區的生態環境屢遭破壞，廣大沙灘常被風浪侵蝕消失，海岸景觀也被消波塊、離岸堤等人工設施取代，改變了原本的自然海岸樣貌。"}, {"stem": "課本提到「海洋漁業資源的過度和不當捕撈」，最直接會造成下列哪一項影響？", "opts": [["A", "提升沿海漁民的長期收入"], ["B", "使珊瑚礁海岸面積擴大"], ["C", "嚴重破壞海域的自然生態，威脅沿海漁民的生計"], ["D", "讓經濟海域範圍自動縮小"]], "ans": "C", "exp": "過度和不當的捕撈會嚴重破壞海域的自然生態，長期下來反而對仰賴海洋資源維生的沿海漁民之生計構成威脅。"}, {"stem": "眾多離島上的特殊地景與島民文化，對臺灣而言最主要具有下列哪一項價值？", "opts": [["A", "擴大領土面積用於農業生產"], ["B", "提供興建大型工業區的用地"], ["C", "作為重要的觀光資源"], ["D", "降低臺灣整體的海岸線長度"]], "ans": "C", "exp": "課本舉例澎湖群島的柱狀玄武岩、蘭嶼雅美族的拼板舟與飛魚祭等，說明離島的特殊地景和島民文化，是臺灣重要的觀光資源。"}, {"stem": "臺灣沿海居民「插架養蚵」的活動，最主要是利用了海岸的下列哪一項特性？", "opts": [["A", "沙岸潟湖風浪較小、適合養殖"], ["B", "岩岸海水深、適合建深水港"], ["C", "斷層海岸地形陡峭、適合觀景"], ["D", "珊瑚礁海岸水質清澈、適合潛水"]], "ans": "A", "exp": "潟湖因有沙洲屏障，風浪較小，是沿海居民插架養蚵、發展養殖漁業的良好場所，屬於沙岸常見的土地利用方式。"}, {"stem": "下列關於「沙岸」與「岩岸」海底地形深淺的比較，何者正確？", "opts": [["A", "沙岸海水較深，岩岸海水較淺"], ["B", "兩者海水深度完全相同"], ["C", "沙岸海水較淺，岩岸海水較深"], ["D", "沙岸與岩岸都沒有明顯的深淺差異"]], "ans": "C", "exp": "沙岸因堆積作用旺盛、海底平坦，海水通常較淺；岩岸則因山地直接逼近海洋，海底地形陡峭，海水通常較深。"}, {"stem": "若某段海岸「多天然良港，利於漁業與航運發展」，這段海岸最可能屬於下列哪一種類型？", "opts": [["A", "沙岸"], ["B", "沖積平原海岸"], ["C", "沙洲海岸"], ["D", "岩岸"]], "ans": "D", "exp": "岩岸因海水較深、多岬角與灣澳，灣澳處受岬角屏障、風浪較小，適合發展為天然良港，有利於漁業與航運。"}, {"stem": "小宇騎自行車行經海岸時，看到「海岸線平直、沿途多見魚塭與蚵架」的景觀，他最可能是行經臺灣哪一段海岸？", "opts": [["A", "北部岬灣海岸"], ["B", "西部沙岸"], ["C", "東部斷層海岸"], ["D", "南部珊瑚礁海岸"]], "ans": "B", "exp": "海岸線平直、多魚塭與蚵架，正是西部沙岸因堆積作用旺盛、地勢平坦而發展出的養殖漁業景觀特徵。"}, {"stem": "妍依在某處海岸看到「崎嶇凹凸的岩塊，且當地以潛水、賞珊瑚聞名」，她最可能位於下列何處？", "opts": [["A", "新北市瑞芳區岬灣海岸"], ["B", "屏東縣恆春鎮墾丁一帶"], ["C", "花蓮縣清水斷崖"], ["D", "台南市北門潟湖"]], "ans": "B", "exp": "墾丁一帶屬珊瑚礁海岸，地表崎嶇凹凸、岩塊造型奇特，且海水清澈溫暖，是著名的潛水與賞珊瑚勝地。"}, {"stem": "某離島「地質構造與臺灣本島相似或相連，是由陸地下沉、低谷沒入海中所形成」，這座離島最可能屬於下列哪一類型？", "opts": [["A", "火山島"], ["B", "珊瑚礁島"], ["C", "沖積島"], ["D", "大陸島"]], "ans": "D", "exp": "題目描述的成因（陸地下沉、低谷沒入海中，地質與大陸相連）正是大陸島的形成方式，如金門、馬祖列嶼即屬此類。"}, {"stem": "依課本內容，關於臺灣海岸與海域的綜合敘述，下列何者正確？", "opts": [["A", "臺灣四面臨海，海岸與鄰近海域都屬於國土的一部分，且各段海岸因地質、地形不同而發展出不同的利用方式"], ["B", "臺灣北、西、南、東四段海岸的類型與利用方式大致相同，沒有明顯差異"], ["C", "臺灣的離島全部都屬於同一種成因類型"], ["D", "臺灣的經濟海域範圍與其他國家完全沒有重疊"]], "ans": "A", "exp": "課本開宗明義指出，臺灣四面臨海，海岸與鄰近海域都屬於國土的一部分，也是許多人賴以為生的地方；由於各地地質、地形與海水深度不同，北、西、南、東各段海岸類型與利用方式也大不相同，離島成因與部分國家經濟海域也存在重疊與差異。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

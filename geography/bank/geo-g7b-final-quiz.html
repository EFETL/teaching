<script>
const QS=[{"stem": "地理學上所稱的「聚落」，是指下列何者？", "opts": [["A", "只包括都市地區的商業區"], ["B", "人們共同居住、生活與工作的地方"], ["C", "專指人口密度低於鄉村的地區"], ["D", "只存在於交通便利的平原地區"]], "ans": "B", "exp": "聚落是指人們共同居住、生活與工作的地方，依性質大致可分為鄉村聚落與都市聚落兩種類型。"}, {"stem": "聚落依性質大致可分為哪兩種類型？", "opts": [["A", "農村與漁村"], ["B", "傳統聚落與現代聚落"], ["C", "沿海聚落與內陸聚落"], ["D", "鄉村聚落與都市聚落"]], "ans": "D", "exp": "課文說明聚落大致可分成鄉村和都市兩種類型，都市聚落通常由鄉村聚落發展而成。"}, {"stem": "關於都市聚落的形成，下列敘述何者正確？", "opts": [["A", "都市聚落通常由鄉村聚落發展而成"], ["B", "都市聚落與鄉村聚落彼此毫無關聯"], ["C", "都市聚落一定比鄉村聚落先出現"], ["D", "都市聚落只能建立在沿海地區"]], "ans": "A", "exp": "課文明白指出「都市聚落通常由鄉村聚落發展而成」。"}, {"stem": "鄉村聚落的居民主要從事下列哪一級產業活動？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "第四級產業"]], "ans": "C", "exp": "鄉村聚落居民主要從事第一級產業活動(如農、林、漁、牧)，人口通常較少、密度較低。"}, {"stem": "都市聚落的居民職業與人口特徵，下列敘述何者正確？", "opts": [["A", "以第一級產業為主，人口密度低"], ["B", "以第二、三級產業為主，人口密度高"], ["C", "以第一級產業為主，人口密度高"], ["D", "各級產業比例均等，人口密度低"]], "ans": "B", "exp": "都市聚落居民職業以第二、三級產業(工業、服務業)為主，人口通常較多，人口密度較高。"}, {"stem": "一般而言，鄉村聚落與都市聚落相比，下列何者正確？", "opts": [["A", "鄉村人口密度高於都市"], ["B", "兩者人口密度通常相同"], ["C", "都市第一級產業人口比例較高"], ["D", "都市人口密度通常高於鄉村"]], "ans": "D", "exp": "都市聚落人口通常較多、人口密度較高；鄉村聚落人口較少、密度較低。"}, {"stem": "下列哪一種地理條件的地方，較容易帶動二、三級產業發展，進而形成都市？", "opts": [["A", "資源匱乏、交通不便的山區"], ["B", "人煙罕至的高山地帶"], ["C", "資源豐富、交通便利的地方"], ["D", "氣候乾燥、缺乏水源的地區"]], "ans": "C", "exp": "資源豐富、交通便利等地理位置重要的地方，較易帶動二、三級產業發展，使人口不斷增加，形成都市。"}, {"stem": "關於鄉村與都市之間的關係，下列敘述何者正確？", "opts": [["A", "鄉村與都市機能不同，分工合作、相輔相成"], ["B", "鄉村與都市機能完全相同，彼此互不往來"], ["C", "都市只從鄉村獲取利益，未曾提供任何服務"], ["D", "鄉村完全不需要都市提供的任何服務"]], "ans": "A", "exp": "鄉村提供都市糧食、勞力、原料與休閒場所；都市則提供鄉村流行文化、新知、醫療、金融服務與就業機會，兩者分工合作、相輔相成。"}, {"stem": "人口由鄉村向都市集中的過程，稱為下列何者？", "opts": [["A", "都會化"], ["B", "郊區化"], ["C", "工業化"], ["D", "都市化"]], "ans": "D", "exp": "都市地區經濟繁榮、就業機會多，吸引鄉村人口移入，這種人口由鄉村向都市集中的過程稱為都市化。"}, {"stem": "「都市化程度」的計算公式為下列何者？", "opts": [["A", "都市人口數 ÷ 都市土地面積 × 100%"], ["B", "一國(地)住在都市人口數 ÷ 一國(地)人口總數 × 100%"], ["C", "都市數量 ÷ 鄉村數量 × 100%"], ["D", "都市面積 ÷ 全國面積 × 100%"]], "ans": "B", "exp": "都市化程度＝一國(地)住在都市人口數 ÷ 一國(地)人口總數 × 100%，用以了解都市人口占總人口比例的高低。"}, {"stem": "一般而言，經濟發展程度較高的國家，其都市化程度通常如何？", "opts": [["A", "都市化程度也較高"], ["B", "都市化程度較低"], ["C", "與經濟發展程度無關"], ["D", "都市化程度會隨機變動"]], "ans": "A", "exp": "課文指出，經濟發展程度較高的國家，都市化程度也較高。"}, {"stem": "臺灣自民國62年以來，都市化程度大約呈現下列哪一種變化趨勢？", "opts": [["A", "從80％下降到54％左右"], ["B", "一直維持在54％左右，幾乎沒有變化"], ["C", "從54％提高到80％左右"], ["D", "從20％提高到54％左右"]], "ans": "C", "exp": "臺灣從民國62年以來，都市化程度已從54％提高到80％左右，顯示都市人口比例持續上升。"}, {"stem": "下列何者「不是」都市吸引鄉村人口移入的主要原因？", "opts": [["A", "消費水準高、資訊傳播速度快"], ["B", "就業機會多"], ["C", "醫療、教育與文化機能較佳"], ["D", "人口密度較低、土地取得容易"]], "ans": "D", "exp": "都市通常人口密度較高、土地取得不易，吸引人口移入的主因是經濟繁榮、就業機會多、資訊發達及較佳的醫療教育文化機能，而非人口密度低。"}, {"stem": "都市內部人口逐漸向都市周邊遷移，產生「郊區化」現象，其主要原因為何？", "opts": [["A", "都市地區完全禁止人口居住"], ["B", "鄉村地區工作機會大幅增加"], ["C", "人口成長與都市內部交通系統改善"], ["D", "都市土地全面劃為農業用地"]], "ans": "C", "exp": "由於人口成長與都市內部交通系統的改善，都市內過於擁擠的人口逐漸向都市周邊遷移，產生郊區化現象。"}, {"stem": "都市範圍不斷擴張，與周圍都市間分界日趨模糊，形成占地廣、人口數量可觀的區域，稱為下列何者？", "opts": [["A", "衛星都市"], ["B", "都會區"], ["C", "特別行政區"], ["D", "經濟特區"]], "ans": "B", "exp": "隨著都市居民與產業活動向外延伸，都市範圍不斷擴張，與周圍都市分界模糊，常形成占地廣、人口眾多的都會區，如臺北都會區。"}, {"stem": "下列何者「不屬於」課文所述都市大量人口快速擁入常導致的問題？", "opts": [["A", "農業生產大幅增加"], ["B", "地價上漲、房價飆升"], ["C", "交通擁擠"], ["D", "環境品質惡化"]], "ans": "A", "exp": "都市因大量人口快速擁入，常導致地價上漲、房價飆升、交通擁擠、環境品質惡化等問題，而非農業生產增加(農業並非都市的主要產業)。"}, {"stem": "都市發展過程中，老舊市中心可能出現舊屋閒置、倒塌毀壞的情況，此時可透過下列何種方式改善？", "opts": [["A", "遷移全部人口至鄉村"], ["B", "完全拆除都市，另建新都市"], ["C", "都市更新"], ["D", "限制都市對外交通"]], "ans": "C", "exp": "透過都市更新可以改善環境與美化市容，達到提升居住品質與促進土地再開發利用的目的。"}, {"stem": "課文提及臺北市萬華區的哪一處，是都市更新的成功案例？", "opts": [["A", "大稻埕"], ["B", "剝皮寮"], ["C", "西門町"], ["D", "龍山寺"]], "ans": "B", "exp": "課文提及臺北市萬華區的剝皮寮是都市更新的成功案例，透過更新改善環境、美化市容。"}, {"stem": "都市更新的主要目的，下列敘述何者最恰當？", "opts": [["A", "只為了增加都市人口數量"], ["B", "只為了拆除所有舊建築"], ["C", "只為了發展第一級產業"], ["D", "提升居住品質並促進土地再開發利用"]], "ans": "D", "exp": "都市更新可以改善環境與美化市容，達到提升居住品質與促進土地再開發利用的目的。"}, {"stem": "都市問題(如房價飆升、交通擁擠)的產生，主要與下列何者關係最密切？", "opts": [["A", "大量人口快速擁入都市"], ["B", "都市完全禁止工商業發展"], ["C", "都市人口持續外移到鄉村"], ["D", "鄉村人口密度過高"]], "ans": "A", "exp": "都市由於大量人口的快速擁入，常導致地價上漲、房價飆升、交通擁擠、環境品質惡化等問題。"}, {"stem": "課文所稱的「交通」，包括下列哪兩種方式？", "opts": [["A", "陸運與海運"], ["B", "通訊與運輸"], ["C", "公路與鐵路"], ["D", "客運與貨運"]], "ans": "B", "exp": "交通包括通訊與運輸兩種方式，通訊指訊息的傳遞，運輸則包括客、貨的運送。"}, {"stem": "依課文所述，運輸可分為陸運、空運、水運及下列何者？", "opts": [["A", "管線運輸"], ["B", "人力運輸"], ["C", "動物運輸"], ["D", "磁浮運輸"]], "ans": "A", "exp": "運輸包括客、貨的運送，可分為陸運、空運、水運及管線運輸，如油管、水管、天然氣管及電線等。"}, {"stem": "下列何者「不屬於」課文所舉的管線運輸範例？", "opts": [["A", "油管"], ["B", "水管"], ["C", "天然氣管"], ["D", "高速公路"]], "ans": "D", "exp": "管線運輸的例子包括油管、水管、天然氣管及電線等，高速公路屬於陸運中的公路系統，並非管線運輸。"}, {"stem": "臺灣早期通訊方式以下列何者為主？", "opts": [["A", "網際網路"], ["B", "通訊衛星"], ["C", "郵政系統"], ["D", "大眾傳播"]], "ans": "C", "exp": "臺灣早期通訊以郵政系統為主，隨著通訊技術革新，才逐漸發展出電話電信、通訊衛星、網際網路等方式。"}, {"stem": "下列何者「不是」課文所提及的通訊工具？", "opts": [["A", "高速鐵路"], ["B", "郵政"], ["C", "電話電信"], ["D", "網際網路"]], "ans": "A", "exp": "課文提及的通訊工具包含郵政、電話電信、通訊衛星、網際網路與大眾傳播；高速鐵路屬於運輸(陸運)系統，並非通訊工具。"}, {"stem": "由於電信與網際網路的日漸普及，對人們生活造成下列何種影響？", "opts": [["A", "訊息傳遞速度變得更慢"], ["B", "人們之間的互動完全停止"], ["C", "大量訊息可跨越時空阻隔、迅速交流"], ["D", "通訊完全回歸傳統郵政系統"]], "ans": "C", "exp": "電信與網際網路的普及，使大量訊息可以跨越時空阻隔，在全球各地迅速交流，也改變了人們的行為與互動模式。"}, {"stem": "臺灣密集分布於平原地區、山間也多有聯繫的道路系統，主要屬於下列何者？", "opts": [["A", "高速鐵路"], ["B", "公路(國道與省道)"], ["C", "環島鐵路"], ["D", "管線運輸"]], "ans": "B", "exp": "臺灣有便利的公路運輸，如國道與省道等，密集分布於平原地區，山間也多有公路聯繫。"}, {"stem": "臺北到高雄間的高速鐵路，對臺灣南北往來產生下列何種主要影響？", "opts": [["A", "使南北往來完全停止"], ["B", "大幅提高長途運費"], ["C", "只服務貨運，不載客"], ["D", "縮短南北旅運時間"]], "ans": "D", "exp": "鐵路除了環島鐵路網外，運行於臺北到高雄間的高速鐵路，更縮短了南北旅運時間，達成西部一日生活圈願景。"}, {"stem": "目前臺灣境外航空主要依賴下列哪三座機場？", "opts": [["A", "臺中、臺南、屏東"], ["B", "花蓮、臺東、澎湖"], ["C", "桃園、高雄、臺北"], ["D", "基隆、宜蘭、新竹"]], "ans": "C", "exp": "目前臺灣境外航空主要依賴桃園、高雄、臺北三座機場；國內航空則以聯絡東部和離島地區為主。"}, {"stem": "臺灣的國內航空主要功能為何？", "opts": [["A", "取代所有的公路運輸"], ["B", "專門運送國際貨物"], ["C", "只服務桃園與高雄之間"], ["D", "聯絡東部和離島地區"]], "ans": "D", "exp": "課文指出，臺灣國內航空以聯絡東部和離島地區為主，彌補當地陸運不便之處。"}, {"stem": "臺灣的水運以海運為主，而非河運，主要原因為何？", "opts": [["A", "臺灣河流湍急、流量變化大，無河運之利"], ["B", "臺灣完全沒有  "高科技製造"], ["D", "稻米種植"]], "ans": "A", "exp": "課本指出南部沿海一帶居民闢建魚塭，養殖魚蝦貝類，養殖漁業發達。"}, {"stem": "澎湖縣因風多雨少，農業發展條件不佳，其主要產業為何？", "opts": [["A", "稻米與花卉"], ["B", "漁業與觀光業"], ["C", "重工業與造船"], ["D", "高科技產業"]], "ans": "B", "exp": "澎湖縣因風多雨少，農業發展條件不佳，漁業、觀光業成為主要產業。"}, {"stem": "東部區域經濟發展比其他區域遲緩的主要原因為何？", "opts": [["A", "缺乏天然資源"], ["B", "人口過度密集"], ["C", "受山地阻隔，形勢封閉，交通不便"], ["D", "氣候過於乾燥"]], "ans": "C", "exp": "東部區域受山地阻隔，形勢封閉，交通進出不便，經濟發展比其他區域遲緩。"}, {"stem": "東部區域雖然經濟發展較慢，但下列何者成為其發展第一級產業活動和觀光業的基礎？", "opts": [["A", "便利的交通路網"], ["B", "密集的工業區"], ["C", "豐富的礦產資源"], ["D", "較好的環境品質"]], "ans": "D", "exp": "課本指出東部「較好的環境品質成為發展第一級產業活動和觀光業的基礎」。"}, {"stem": "下列何者不是東部區域近年用來吸引遊客的活動？", "opts": [["A", "六輕工業區開放參觀"], ["B", "太魯閣峽谷音樂節"], ["C", "原住民聯合豐年祭"], ["D", "金針花季"]], "ans": "A", "exp": "課本提到東部近年結合自然景觀、族群文化、特產與觀光，舉辦太魯閣峽谷音樂節、原住民聯合豐年祭、金針花季等活動；六輕工業區位於雲林縣，屬中部區域的石化工業設施，與東部觀光無關。"}, {"stem": "金馬地區過去被定位為軍事戰略據點，主要因為其地理位置為何？", "opts": [["A", "深入太平洋"], ["B", "靠近中國福建沿海"], ["C", "位於臺灣海峽中心"], ["D", "緊鄰蘭陽平原"]], "ans": "B", "exp": "金馬地區靠近中國福建沿海，過去被定位為軍事戰略據點，經濟發展受限。"}, {"stem": "金馬地區解除戰地政務並設立小三通對口碼頭後，居民轉以下列何種產業為主？", "opts": [["A", "農業"], ["B", "重工業"], ["C", "服務業"], ["D", "遠洋漁業"]], "ans": "C", "exp": "解除戰地政務，設立與中國小三通的對口碼頭後，金馬地區經濟發展腳步加快，居民轉以服務業為主。"}, {"stem": "小三通是指政府自民國幾年起，開放金門、馬祖與澎湖與中國進行小規模通商、通航、通郵？", "opts": [["A", "民國76年"], ["B", "民國94年"], ["C", "民國107年"], ["D", "民國90年"]], "ans": "D", "exp": "課本註明小三通是指自民國90年起，政府陸續開放金門、馬祖與澎湖等地區與中國進行小規模的通商、通航與通郵。"}, {"stem": "金馬地區成為獨具特色觀光資源的原因，主要與下列何者有關？", "opts": [["A", "起伏地形與岩岸迷人海景"], ["B", "廣闊平原與稻米產區"], ["C", "高科技產業聚落"], ["D", "國際機場交通樞紐"]], "ans": "A", "exp": "金馬地區起伏的地形與岩岸迷人海景，成為獨具特色的觀光資源，加上農特產、特色建築與戰地遺跡吸引遊客。"}, {"stem": "下列何者不屬於金門地區具代表性的特產？", "opts": [["A", "貢糖"], ["B", "雙心石滬"], ["C", "高粱酒"], ["D", "風獅爺"]], "ans": "B", "exp": "貢糖、高粱酒、風獅爺為金門著名特產；雙心石滬是澎湖縣七美鄉利用玄武岩與珊瑚礁構築的傳統漁業設施，並非金門特產。"}, {"stem": "馬祖地區的北海坑道，原本作為下列何種用途？", "opts": [["A", "灌溉水利設施"], ["B", "漁業養殖場"], ["C", "軍事戰備水道"], ["D", "觀光纜車軌道"]], "ans": "C", "exp": "馬祖地區的北海坑道原為軍事戰備水道，現已轉型發展觀光，遊客可體驗坑道內划船的樂趣。"}, {"stem": "臺灣各區域經過長期發展後，出現 ], "ans": "B", "exp": "全國國土計畫劃分城鄉發展地區、農業發展地區、國土保育地區和海洋資源地區等四大功能分區。"}, {"stem": "下列哪一項功能分區，是為了維護農業生長環境及確保糧食安全而劃定？", "opts": [["A", "國土保育地區"], ["B", "海洋資源地區"], ["C", "農業發展地區"], ["D", "城鄉發展地區"]], "ans": "C", "exp": "為維護農業生長環境及確保糧食安全，劃定農業發展地區。"}, {"stem": "為維持海域狀態，避免影響海域生態環境而劃定的分區稱為？", "opts": [["A", "城鄉發展地區"], ["B", "國土保育地區"], ["C", "農業發展地區"], ["D", "海洋資源地區"]], "ans": "D", "exp": "為維持海域狀態，避免影響海域生態環境，劃定海洋資源地區。"}, {"stem": "政府公告「原住民族特定區域計畫」，其主要目的為何？", "opts": [["A", "保障原住民族傳統文化與既有土地使用權益"], ["B", "發展重工業"], ["C", "擴大都市範圍"], ["D", "促進兩岸小三通"]], "ans": "A", "exp": "「原住民族特定區域計畫」保障原住民族傳統文化與既有土地使用權益，以彰顯社會公平正義。"}, {"stem": "國土保育地區的劃定原則為何？", "opts": [["A", "全面開放觀光開發"], ["B", "以保育及保安為原則，禁止或限制其他使用"], ["C", "優先發展工業"], ["D", "鼓勵農地變更為建地"]], "ans": "B", "exp": "國土保育地區以保育及保安為原則，並禁止或限制其他使用方式。"}, {"stem": "課本中提及縣政府劃設「富山禁漁區」的主要目的為何？", "opts": [["A", "促進當地觀光業發展"], ["B", "限制原住民從事漁業"], ["C", "保護生態，避免過度捕撈造成破壞"], ["D", "配合美麗灣渡假村開發"]], "ans": "C", "exp": "因不肖人士在沿海過度捕撈造成生態破壞，當地政府劃設部分海岸地帶為「富山禁漁區」以保護生態。"}, {"stem": "「美麗灣渡假村」開發案引發爭議，主要原因為何？", "opts": [["A", "政府拒絕核發建照"], ["B", "當地居民全數贊成開發"], ["C", "渡假村位於國土保育地區"], ["D", "開發過程迴避環境影響評估程序"]], "ans": "D", "exp": "反對開發案的公民團體認為，開發前須依法進行環境影響評估，但美麗灣渡假村開發案卻迴避了環境影響評估程序，因而引發爭議。"}, {"stem": "「平均每戶可支配所得」的定義為何？", "opts": [["A", "總所得扣掉無法自由調整的支出"], ["B", "總所得加上政府補助"], ["C", "家庭總資產減去負債"], ["D", "每人每月薪資總和"]], "ans": "A", "exp": "課本定義「平均每戶可支配所得」為總所得扣掉無法自由調整的支出，是常用來比較區域經濟差異的指標。"}, {"stem": "桃園市周邊推動的「桃園航空城」規畫案，目標是發展成結合下列哪些功能的新市鎮？", "opts": [["A", "農業與畜牧"], ["B", "物流、住宅與工業活動"], ["C", "軍事與國防"], ["D", "漁業與養殖"]], "ans": "B", "exp": "課本指出臺灣桃園國際機場周邊正在推動桃園航空城規畫案，目標是成為結合物流、住宅與工業活動的新市鎮。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

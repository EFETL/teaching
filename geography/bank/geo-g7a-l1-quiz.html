<script>
const QS=[{"stem": "小安跟同學說：「我家在全聯福利中心的北方約100公尺處。」這是哪一種位置表示方式？", "opts": [["A", "相對位置"], ["B", "絕對位置"], ["C", "經緯度座標"], ["D", "網格座標"]], "ans": "A", "exp": "相對位置是以某個明顯易辨識的地標（此處為全聯福利中心）為基準，描述目標物與該基準點的方位和距離關係，屬於相對位置的表示方式。"}, {"stem": "下列何者屬於「絕對位置」的表示方式？", "opts": [["A", "「我家在學校對面」"], ["B", "「郵局在便利商店的東邊」"], ["C", "「公園在車站附近」"], ["D", "教室座位「第三排第二列」"]], "ans": "D", "exp": "絕對位置是利用一組座標系統（如橫座標與縱座標）來表現目標物的所在，「第三排第二列」正是以縱、橫兩個座標值來標示位置，屬於絕對位置。"}, {"stem": "關於「相對位置」與「絕對位置」的敘述，下列何者正確？", "opts": [["A", "相對位置一定比絕對位置精確"], ["B", "絕對位置需要藉由座標系統（如經緯線、網格）來表示"], ["C", "相對位置不需要任何參考基準"], ["D", "絕對位置只能用於教室座位的描述"]], "ans": "B", "exp": "絕對位置的表示方式必須藉由座標系統（例如地圖上的經緯線、網格座標）來標定目標物的所在，而相對位置則是以明顯地標為基準來描述方位與距離，兩者性質不同。"}, {"stem": "某地圖上以橫列（A、B、C…）與縱行（1、2、3…）交織的網格來標示某色塊位於「（B，2）」，這樣的表示方式屬於下列何者？", "opts": [["A", "相對位置"], ["B", "方向標"], ["C", "絕對位置"], ["D", "比例尺"]], "ans": "C", "exp": "利用網格座標（橫列與縱行的交叉點）來標示目標物所在，屬於一種座標系統，因此是絕對位置的表示方式。"}, {"stem": "小宇說：「妍依在我的東南方，莉莎在我的東北方。」這句話是以下列何者為基準來描述位置？", "opts": [["A", "經緯度座標"], ["B", "小宇自己"], ["C", "地圖的方向標"], ["D", "教室的座位表"]], "ans": "B", "exp": "這是以小宇自身所在位置為參考基準，描述其他人相對於他的方位關係，屬於相對位置的表示方式，會因參考基準不同而改變描述內容。"}, {"stem": "下列哪一種說法「最不精確」，容易因為對方不熟悉當地環境而無法判讀正確位置？", "opts": [["A", "「北緯25度、東經121度」"], ["B", "「地圖座標（C，4）」"], ["C", "「郵局在7-11的旁邊」"], ["D", "「第二排第三列的座位」"]], "ans": "C", "exp": "以明顯地標（如便利商店）為基準的相對位置描述，會因對方是否認識該地標而影響判讀的準確性；若對方不熟悉當地環境，就難以掌握確切位置。座標系統（經緯度、網格）則是絕對且精確的表示方式。"}, {"stem": "全球經緯度座標系統是由下列何者組成的假想網格，用以表示絕對位置？", "opts": [["A", "方向標與圖例"], ["B", "比例尺與圖名"], ["C", "大比例尺與小比例尺地圖"], ["D", "南、北向的經線與東、西向的緯線"]], "ans": "D", "exp": "全球經緯度座標系統是由南北向的經線與東西向的緯線交織而成的假想網格，可用來精確標示地表上任一地點的絕對位置。"}, {"stem": "地圖主要包含哪些基本要素？", "opts": [["A", "圖名、比例尺、方向標、圖例"], ["B", "圖名、人口數、面積、經緯度"], ["C", "比例尺、氣候帶、行政區、河流"], ["D", "方向標、圖例、緯度、地名索引"]], "ans": "A", "exp": "一幅完整的地圖通常包含圖名（說明地圖主要內容）、比例尺（圖上距離與實際距離的比例）、方向標（標示方向）、圖例（以符號代表地形地物）等四個基本要素。"}, {"stem": "地圖上「利用符號代表地形、地物」的要素稱為什麼？", "opts": [["A", "圖名"], ["B", "方向標"], ["C", "比例尺"], ["D", "圖例"]], "ans": "D", "exp": "圖例是利用各種符號來代表地圖上的地形、地物（例如河流、道路、學校等），讀圖時需先參照圖例才能正確判讀地圖內容。"}, {"stem": "若一張地圖上沒有畫出方向標，依照慣例，通常以地圖的哪個方向代表北方？", "opts": [["A", "地圖下方"], ["B", "地圖左方"], ["C", "地圖上方"], ["D", "地圖右方"]], "ans": "C", "exp": "方向標是用來標示地圖方向的指標；若地圖上沒有繪製方向標，依照一般繪圖慣例，通常以地圖的上方代表北方。"}, {"stem": "下列關於「地圖種類」的敘述，何者正確？", "opts": [["A", "所有地圖的比例尺都必須相同"], ["B", "電子地圖無法顯示即時路況"], ["C", "傳統紙本地圖與電子地圖都是常見的地圖呈現方式"], ["D", "地圖只能呈現地形資訊，無法呈現路線規劃"]], "ans": "C", "exp": "地圖的呈現方式相當多元，傳統以紙本呈現的地圖，以及結合全球衛星定位系統（GPS）的電子地圖，都是生活中常見的地圖種類，各有其特色與用途。"}, {"stem": "相較於傳統紙本地圖，電子地圖具有下列哪一項優勢？", "opts": [["A", "圖例符號比較少"], ["B", "資料更新迅速、可提供即時路況與路線規劃"], ["C", "一定沒有比例尺"], ["D", "無法在手機或平板上使用"]], "ans": "B", "exp": "電子地圖（如 Google 地圖）具有查詢方便、資料更新迅速的特點，還能結合 GPS 提供導航、即時路況與路線規劃等功能，是現代生活中相當實用的工具。"}, {"stem": "小美用手機的地圖 App 查詢自己目前所在的位置，App 會顯示一個代表她所在地的藍點，並可查看其座標資訊。這種定位方式主要應用了下列何種系統？", "opts": [["A", "全球衛星定位系統（GPS）"], ["B", "傳統紙本地圖"], ["C", "比例尺換算系統"], ["D", "圖例辨識系統"]], "ans": "A", "exp": "手機、平板等電子地圖能顯示使用者目前位置，主要是透過全球衛星定位系統（Global Positioning System, GPS）進行定位，屬於絕對位置的一種呈現方式。"}, {"stem": "某公車路線圖上顯示的距離，常常與實際搭車行駛的距離不完全相符，其主要原因與下列何者最有關？", "opts": [["A", "這種地圖為了方便閱讀，會簡化路線並非依實際比例繪製"], ["B", "公車路線圖沒有方向標"], ["C", "公車路線圖一定沒有圖例"], ["D", "公車不會依照固定路線行駛"]], "ans": "A", "exp": "如公車、捷運路線圖之類的主題地圖，通常為了讓乘客容易辨識站點順序與轉乘關係，會簡化繪製而非嚴格依照實際比例尺呈現，因此圖上距離與實際距離常有落差。"}, {"stem": "下列何者「不是」地圖的基本要素？", "opts": [["A", "圖名"], ["B", "圖例"], ["C", "方向標"], ["D", "行政區人口統計表"]], "ans": "D", "exp": "圖名、圖例、方向標與比例尺才是地圖的四大基本要素；行政區人口統計表屬於地圖以外附加的統計資料，並非地圖本身的構成要素。"}, {"stem": "「比例尺」指的是下列何者？", "opts": [["A", "圖上距離與地表實際距離的長度比例"], ["B", "地圖上符號所代表的意義"], ["C", "地圖上標示方向的指標"], ["D", "地圖所使用的顏色種類"]], "ans": "A", "exp": "比例尺是圖上距離與地表實際距離的長度比例，通常可用文字、數字或圖示（直線）等方式來表示。"}, {"stem": "某地圖比例尺標示為「1：15,000」，這代表地圖上的1公分等於實際地表的多少距離？", "opts": [["A", "150公尺"], ["B", "15公尺"], ["C", "1,500公尺"], ["D", "15,000公尺"]], "ans": "A", "exp": "比例尺1：15,000表示圖上1公分代表實際距離15,000公分，換算後15,000公分＝150公尺，因此圖上1公分等於實際距離150公尺。"}, {"stem": "某地圖比例尺的文字表示法為「一萬分之一」，其對應的數字表示法應為下列何者？", "opts": [["A", "1：100"], ["B", "1：1,000"], ["C", "1：10,000"], ["D", "1：100,000"]], "ans": "C", "exp": "「一萬分之一」即代表圖上1單位長度等於實際地表10,000（一萬）倍的長度，換算成數字表示法即為1：10,000。"}, {"stem": "比例尺的表示方法中，若地圖經過影印機放大或縮小，仍能維持正確比例關係的是下列哪一種？", "opts": [["A", "數字表示法（如1：10,000）"], ["B", "圖示表示法（直線比例尺）"], ["C", "文字表示法（如一萬分之一）"], ["D", "三種表示法都不受影響"]], "ans": "B", "exp": "地圖影印放大或縮小時，圖上的所有內容（包含直線比例尺圖示）會同步等比例放大或縮小，因此圖示表示法仍能正確表示比例關係；但數字與文字表示法所標示的數值並不會跟著改變，因而會產生錯誤的比例關係。"}, {"stem": "下列關於「大比例尺地圖」與「小比例尺地圖」的敘述，何者正確？", "opts": [["A", "大比例尺地圖涵蓋範圍較大，內容較簡略"], ["B", "小比例尺地圖涵蓋範圍較小，內容較詳盡"], ["C", "大、小比例尺地圖的詳細程度完全相同"], ["D", "大比例尺地圖涵蓋範圍較小，內容較詳盡"]], "ans": "D", "exp": "在相同大小的圖幅內，比例尺數值較大者為大比例尺地圖，其實際涵蓋範圍較小、內容較詳盡（如臺南市行政區域圖）；比例尺數值較小者為小比例尺地圖，涵蓋範圍較大、內容較簡略（如臺灣行政區域圖）。"}, {"stem": "若要規劃「從高鐵左營站到大港橋」的詳細街道路線，應該選用下列哪一種地圖較為恰當？", "opts": [["A", "涵蓋全球的世界地圖"], ["B", "涵蓋範圍大、內容簡略的小比例尺地圖"], ["C", "涵蓋範圍小、內容詳盡的大比例尺地圖"], ["D", "只標示國界的政治地圖"]], "ans": "C", "exp": "若要查看某段街道間的詳細交通路線，需要內容較詳盡、涵蓋範圍較小的大比例尺地圖，才能清楚呈現街道與地標等細節資訊。"}, {"stem": "在地圖甲、乙圖幅大小相同、但比例尺不同的情況下，用直尺量測兩地間的圖上距離後，還須搭配下列何者才能推算出實際距離？", "opts": [["A", "圖例"], ["B", "圖名"], ["C", "方向標"], ["D", "比例尺"]], "ans": "D", "exp": "利用地圖的比例尺，可以將量測到的圖上距離換算成兩地間的實際距離，這是比例尺的重要應用之一。"}, {"stem": "某張地圖圖幅大小與另一張相同，但實際涵蓋範圍較大、內容較簡略，這張地圖的比例尺數值相較於另一張地圖應該如何？", "opts": [["A", "數值較大"], ["B", "數值較小"], ["C", "數值相同"], ["D", "無法比較"]], "ans": "B", "exp": "相同圖幅大小的地圖中，實際涵蓋範圍越大、內容越簡略者，代表其比例尺數值越小（即為小比例尺地圖）；反之，涵蓋範圍小、內容詳盡者比例尺數值較大。"}, {"stem": "下列何者是東、西、南、北四大基本方位之外，再加入而形成的「八方位」？", "opts": [["A", "上、下、左、右"], ["B", "前、後、左、右"], ["C", "東北、西北、東南、西南"], ["D", "高、低、遠、近"]], "ans": "C", "exp": "四大基本方位為東、西、南、北，若再加上東北、西北、東南、西南四個方位，即形成八方位；若進一步細分，還可再分為十六方位。"}, {"stem": "若某教室座位圖中，小睿坐在講桌的南方、布布坐在小睿的東方，則布布相對於講桌的位置最可能是下列何者？", "opts": [["A", "講桌的正東方"], ["B", "講桌的東南方"], ["C", "講桌的正北方"], ["D", "講桌的西南方"]], "ans": "B", "exp": "小睿在講桌南方，布布又在小睿的東方，兩相對位置疊加後，布布相對於講桌大致位於東南方向。"}, {"stem": "在方位的表達習慣上，若地圖或指北針的箭頭朝上，且該箭頭代表北方，則地圖下方應代表下列何者？", "opts": [["A", "東方"], ["B", "西方"], ["C", "南方"], ["D", "北方"]], "ans": "C", "exp": "依照方向標的判讀原則，指標箭頭所指方向即為北方；當北方在上方時，依方位順序，正對面（下方）即為南方。"}, {"stem": "「十六方位」是在「八方位」的基礎上，如何進一步細分而成？", "opts": [["A", "在每兩個方位之間再加入一個新方位"], ["B", "只細分東、西方向"], ["C", "只細分南、北方向"], ["D", "完全捨棄原本的八方位重新命名"]], "ans": "A", "exp": "方位可依需要越分越細，由四方位（東西南北）加入東北、西北、東南、西南成為八方位；再於每兩個相鄰方位之間加入新的方位名稱（如北北東），即可細分為十六方位，以更精確地描述方向。"}, {"stem": "某張地圖上沒有繪製方向標，此時除了以「上方為北方」的慣例判斷方向外，還可以利用下列何種資訊來輔助判斷地圖的方向？", "opts": [["A", "圖例的顏色"], ["B", "比例尺的數字"], ["C", "圖名的字體大小"], ["D", "經緯度"]], "ans": "D", "exp": "除了以地圖上方代表北方的慣例外，經線指示南北方向、緯線指示東西方向，因此也可以藉由圖上的經緯度資訊來輔助判斷地圖的方向。"}, {"stem": "地球依著一條假想的軸自轉，這條軸稱為什麼？", "opts": [["A", "赤道"], ["B", "本初經線"], ["C", "回歸線"], ["D", "地軸"]], "ans": "D", "exp": "地軸是一條通過南、北兩極、貫穿地心的假想直線，地球即依此軸進行自轉。"}, {"stem": "連接南、北兩極點的地球表面半圓弧線，稱為下列何者？", "opts": [["A", "緯線"], ["B", "經線"], ["C", "赤道"], ["D", "回歸線"]], "ans": "B", "exp": "經線（又稱子午線）是連接南、北兩極點的半圓弧線，所有經線長度都相等，且呈南北走向。"}, {"stem": "下列關於「經線」特性的敘述，何者正確？", "opts": [["A", "每條經線長度都不相同"], ["B", "經線彼此相交於赤道上"], ["C", "經線呈南北走向，且每條經線長度都相等"], ["D", "經線是與地軸垂直的圓圈"]], "ans": "C", "exp": "經線呈南北走向，相交於南、北兩極點，且因為都是連接兩極的半圓弧線，所以每條經線的長度都相等。"}, {"stem": "國際上以通過哪一個地點的經線作為0度經線（本初經線）的基準？", "opts": [["A", "美國華盛頓"], ["B", "英國倫敦格林威治天文臺"], ["C", "法國巴黎鐵塔"], ["D", "中國北京故宮"]], "ans": "B", "exp": "1884年，國際上同意將通過英國倫敦格林威治天文臺的經線定為0度經線，即本初經線（或稱本初子午線），作為劃分東、西經度的基準。"}, {"stem": "以本初經線為基準，東、西經度各可劃分到幾度？", "opts": [["A", "各90度"], ["B", "各180度"], ["C", "各270度"], ["D", "各360度"]], "ans": "B", "exp": "以本初經線（0度）為界，向東稱為東經，向西稱為西經，東、西經度各可劃分到180度，且東經180度與西經180度其實是同一條經線。"}, {"stem": "地表上與南、北兩極點距離相等的各點連成的假想圓圈，稱為下列何者？", "opts": [["A", "經線"], ["B", "本初經線"], ["C", "赤道"], ["D", "極圈"]], "ans": "C", "exp": "赤道是地表上與南、北兩極點距離相等的各點所連成的假想圓圈，是最長的一條緯線，將地球平分為南、北兩半球。"}, {"stem": "下列關於「緯線」特性的敘述，何者正確？", "opts": [["A", "緯線呈南北走向"], ["B", "每條緯線的長度都相同"], ["C", "緯線是與地軸垂直、彼此平行的圓圈，長度由赤道向兩極逐漸縮短"], ["D", "緯線相交於南、北兩極點"]], "ans": "C", "exp": "緯線是與地軸垂直、在地表上切畫出來且彼此平行的圓圈，其中赤道最長，緯度愈高、緯線愈短，最後在南、北兩極點縮成一點。"}, {"stem": "南、北緯度各可劃分到幾度？", "opts": [["A", "各90度"], ["B", "各180度"], ["C", "各270度"], ["D", "各360度"]], "ans": "A", "exp": "以赤道（0度緯線）為界，向北稱為北緯，向南稱為南緯，南、北緯度各可劃分到90度，北極點、南極點即分別為北緯90度與南緯90度。"}, {"stem": "某地點以座標表示為「北緯25度、東經121度」，其中「東經」與「北緯」的英文代號依習慣通常分別以哪兩個字母表示？", "opts": [["A", "N、E"], ["B", "S、W"], ["C", "E、N"], ["D", "W、S"]], "ans": "A", "exp": "習慣上以英文字母N代表北緯（North）、S代表南緯（South）、E代表東經（East）、W代表西經（West），因此「東經121度、北緯25度」可標示為（121°E，25°N）。"}, {"stem": "下列關於經線與緯線的比較，何者正確？", "opts": [["A", "經線彼此平行，緯線相交於兩極"], ["B", "經線相交於南、北兩極點，緯線彼此平行且與地軸垂直"], ["C", "經線與緯線都是長度相等的圓圈"], ["D", "經線與緯線都沒有0度的基準線"]], "ans": "B", "exp": "經線呈南北走向，相交於南、北兩極點，每條長度相等；緯線呈東西走向，與地軸垂直、彼此平行，長度由赤道向兩極遞減。經線以本初經線為0度基準，緯線以赤道為0度基準。"}, {"stem": "利用經線與緯線交織而成的網格，可以作為地表定位的座標系統，這種座標系統主要是用來表示下列何者？", "opts": [["A", "地圖的比例尺"], ["B", "地圖的方向標"], ["C", "地圖的圖例"], ["D", "目標物的絕對位置"]], "ans": "D", "exp": "經緯線交織而成的網格可作為地表定位的座標，只要標示出經度與緯度，就能明確表示地表上任一地點的絕對位置。"}, {"stem": "若某地點的座標為（東經30度，北緯45度），依照英文代號的標示習慣，下列何者書寫正確？", "opts": [["A", "（30°N，45°E）"], ["B", "（45°E，30°N）"], ["C", "（45°N，30°E）"], ["D", "（30°E，45°N）"]], "ans": "D", "exp": "東經30度以「30°E」表示，北緯45度以「45°N」表示，因此座標應寫成（30°E，45°N），須留意經、緯度須各自搭配正確的英文代號（E／W與N／S）。"}, {"stem": "小明在地圖上看到某地座標為（0°，0°），這代表該地點位於下列何處的交叉點？", "opts": [["A", "本初經線與赤道"], ["B", "南極點與北極點"], ["C", "東經180度與南、北回歸線"], ["D", "極圈與本初經線"]], "ans": "A", "exp": "經度0度即為本初經線，緯度0度即為赤道，因此座標（0°，0°）代表本初經線與赤道的交叉點，此點位於幾內亞灣（大西洋）附近。"}, {"stem": "下列何者「不是」全球經緯度座標系統可以提供的功能？", "opts": [["A", "標示地表任一地點的絕對位置"], ["B", "作為劃分時區的依據"], ["C", "作為劃分氣候帶的依據"], ["D", "直接顯示某地當天的天氣狀況"]], "ans": "D", "exp": "經緯度座標系統可用來表示地表任一地點的絕對位置，也是劃分時區（依經度）與氣候帶（依緯度）的重要依據，但無法直接顯示某地當下的天氣狀況，天氣仍須透過氣象觀測取得。"}, {"stem": "某地圖上以英文字母（A、B、C…）標示橫列、數字（1、2、3…）標示縱行，此種網格座標系統與經緯線座標系統的相同之處為何？", "opts": [["A", "兩者都是用來表示絕對位置的座標系統"], ["B", "兩者都只能用於室內空間"], ["C", "兩者都可以直接判斷氣候"], ["D", "兩者的座標範圍都是0到90度"]], "ans": "A", "exp": "不論是地圖上簡單的網格座標（列與行），或是全球通用的經緯線座標系統，兩者性質相同，都是利用一組座標系統來表示目標物所在的絕對位置。"}, {"stem": "地球自轉一周360度需要24小時，若將全球劃分為24個時區，則每一個時區大約跨經度幾度？", "opts": [["A", "15度"], ["B", "10度"], ["C", "20度"], ["D", "24度"]], "ans": "A", "exp": "地球自轉一周360度、費時24小時，360除以24等於15，因此國際上將每15度經度劃分為一個時區，全球共分為24個時區，相鄰時區的時間大約相差1小時。"}, {"stem": "目前作為全球時間表達基準的「國際標準時間」，是以下列何處的時間為準？", "opts": [["A", "美國紐約"], ["B", "英國格林威治（GMT）"], ["C", "日本東京"], ["D", "中國北京"]], "ans": "B", "exp": "國際上以英國倫敦格林威治所在時區的時間，即格林威治時間（Greenwich Mean Time, GMT），作為全球一致的國際標準時間，其他地區的時間皆以此為基準來換算。"}, {"stem": "臺北位於東經約120度，屬於格林威治標準時間（GMT）以東的第八個時區，因此臺北時間比倫敦時間快幾小時？", "opts": [["A", "快4小時"], ["B", "快8小時"], ["C", "快12小時"], ["D", "慢8小時"]], "ans": "B", "exp": "臺北所在的中央經線約在東經120度，屬於格林威治時間以東的第8個時區（120÷15＝8），由於地球由西向東自轉、東半球時間較早，因此臺北比倫敦快8個小時（GMT+8）。"}, {"stem": "計算兩地時差時，若甲地位於乙地的東邊，依照「東加西減」的原則，甲地的時間相對於乙地應該如何計算？", "opts": [["A", "甲地時間 ＝ 乙地時間 － 時差"], ["B", "甲地時間與乙地時間無法比較"], ["C", "甲、乙兩地時間必定相同"], ["D", "甲地時間 ＝ 乙地時間 ＋ 時差"]], "ans": "D", "exp": "由於地球由西向東自轉，位於東邊的地區會較早迎接新的一天，因此計算時差時採用「東加西減」的原則：東邊地區的時間要加上時差，西邊地區的時間則要減去時差。"}, {"stem": "當倫敦（GMT）為上午0時（凌晨）時，臺北（GMT+8）此時應為幾點？", "opts": [["A", "上午0時"], ["B", "上午4時"], ["C", "上午8時"], ["D", "下午4時"]], "ans": "C", "exp": "臺北比倫敦快8小時，當倫敦為凌晨0時，依「東加西減、臺北加8小時」計算，臺北時間即為上午8時。"}, {"stem": "除了本初經線之外，國際換日線大約沿著哪一條經線劃定（並依實際國界略作彎曲）？", "opts": [["A", "東經0度"], ["B", "東經90度"], ["C", "東經180度／西經180度"], ["D", "東經120度"]], "ans": "C", "exp": "國際換日線大致沿著東經180度（也就是西經180度，兩者其實是同一條經線）劃定，是計算日期變更的重要基準，實際劃定時會依國界或行政區略作彎曲調整，以避免將同一國家劃分成不同日期。"}, {"stem": "由於地軸傾斜約23.5度，太陽直射地表的位置會在下列何處之間來回移動，進而形成四季變化？", "opts": [["A", "南、北回歸線之間"], ["B", "南、北極圈之間"], ["C", "東經、西經180度之間"], ["D", "本初經線與赤道之間"]], "ans": "A", "exp": "因為地軸傾斜約23.5度，太陽直射地表的範圍會在南、北回歸線（緯度23.5度）之間隨季節來回移動，使南、北半球的日照角度產生變化，進而形成四季變化，且南、北半球的季節恰好相反。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

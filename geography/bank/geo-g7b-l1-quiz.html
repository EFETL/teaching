<script>
const QS=[{"stem": "課本提到「一地在某段時期人口數量的變動稱為人口成長」，下列何者最能說明課本為何強調人口是「動態」的變化過程？", "opts": [["A", "因為人口數量一旦確定就不會再改變"], ["B", "因為人口普查每十年才進行一次"], ["C", "因為一地隨時都有人出生與死亡，人口數量持續在變動"], ["D", "因為人口只會因為天災而減少"]], "ans": "C", "exp": "課本說明「一地的人口數量為一動態的變化過程，因為隨時都會有人出生和死亡」，故強調人口成長是持續變動的過程。"}, {"stem": "下列關於「自然增加」的敘述，何者正確？", "opts": [["A", "是指某地區在過去一年中，因出生與死亡所造成的人口數量變動"], ["B", "是指某地區因移入與移出所造成的人口數量變動"], ["C", "是指一地總人口除以土地面積所得的數值"], ["D", "是指一地人口從鄉村移往都市的現象"]], "ans": "A", "exp": "自然增加是指某地區在過去一年中，因出生與死亡所造成的人口數量變動，其變動比率稱為自然增加率。"}, {"stem": "某地今年出生人口數為8,000人，死亡人口數為9,500人，則該地今年的自然增加率為？", "opts": [["A", "正值，因為出生數大於死亡數"], ["B", "無法判斷，需搭配移入移出資料"], ["C", "為零，因為人口數不變"], ["D", "負值，因為死亡人口數多於出生人口數"]], "ans": "D", "exp": "課本說明「當死亡人口數多於出生人口數，自然增加率為負」，此題死亡數（9,500）大於出生數（8,000），故自然增加率為負值。"}, {"stem": "下列何者是「社會增加」的正確定義？", "opts": [["A", "因出生與死亡所造成的人口數量變動"], ["B", "某地區在過去一年中，因移入與移出所造成的人口數量變動"], ["C", "一地人口在山地與平地間的分布差異"], ["D", "一地在不同季節的人口流動總稱"]], "ans": "B", "exp": "社會增加是指某地區在過去一年中，因移入與移出所造成的人口數量變動，其變動比率稱為社會增加率。"}, {"stem": "某鄉鎮今年移入人口為1,200人，移出人口為2,000人，則該鄉鎮的社會增加率應為？", "opts": [["A", "正值"], ["B", "負值"], ["C", "零"], ["D", "無法計算"]], "ans": "B", "exp": "課本指出「當移出人口數多於移入人口數，社會增加率為負」，此題移出（2,000）多於移入（1,200），故社會增加率為負值。"}, {"stem": "課本在計算出生率、死亡率、移入率、移出率時，習慣採用「千分比」而非「百分比」表示，其主要原因為何？", "opts": [["A", "千分比計算比較簡單"], ["B", "政府規定一定要用千分比"], ["C", "百分比只能用於面積計算"], ["D", "因分母（總人口數）數值甚大，換算成百分比數值太小，故放大10倍以千分比表示較方便"]], "ans": "D", "exp": "課本註明：「因分母的人口總數數值甚大，導致計算所得的百分比數值太小，為方便表示，故習慣上採用可將數值放大10倍的千分比」。"}, {"stem": "一地的「人口成長」是下列哪兩者的綜合結果？", "opts": [["A", "自然增加與社會增加"], ["B", "出生率與死亡率"], ["C", "移入率與人口密度"], ["D", "都市化與工業化"]], "ans": "A", "exp": "課本說明「一地的人口成長是自然增加與社會增加的綜合結果，通常以人口總數和人口增加率的變化來表示」。"}, {"stem": "根據課本敘述，臺灣的人口長期以來大致呈正成長，但從民國幾年後開始出現人口增加率為負成長的現象？", "opts": [["A", "民國50年"], ["B", "民國70年"], ["C", "民國109年"], ["D", "民國120年"]], "ans": "C", "exp": "課本明確指出：「臺灣的人口長期以來都呈正成長，但自民國109年後，人口增加率開始出現負成長的現象」。"}, {"stem": "課本提到西元2020年臺灣出現了下列哪一項人口現象？", "opts": [["A", "出生率首次超過死亡率"], ["B", "移入人口首次超過移出人口"], ["C", "人口首次突破2,300萬人"], ["D", "死亡率高於出生率， 舊市區是臺灣人口密度較高的地區？", "opts": [["A", "花蓮、臺東、南投"], ["B", "宜蘭、基隆、嘉義"], ["C", "臺北、臺中、高雄"], ["D", "新竹、苗栗、雲林"]], "ans": "C", "exp": "課本舉例：「臺北及臺中、高雄的舊市區即為臺灣人口密度較高的地區」。"}, {"stem": "下列關於「人口密度」的定義，何者正確？", "opts": [["A", "通常是指每平方公里上居住的人口數，用來表現一地人口分布的疏密程度"], ["B", "是指一地每年出生的人口總數"], ["C", "是指一地移入人口與移出人口的差距"], ["D", "是指一地人口占全國人口的百分比"]], "ans": "A", "exp": "課本說明：「人口密度通常是指每平方公里上居住的人口數，可用來表現一地人口分布的疏密程度」。"}, {"stem": "甲地的土地面積為50平方公里，人口總數為250,000人，則甲地的人口密度約為每平方公里多少人？", "opts": [["A", "500人"], ["B", "2,500人"], ["C", "5,000人"], ["D", "25,000人"]], "ans": "C", "exp": "人口密度＝人口總數÷土地面積＝250,000人÷50平方公里＝5,000人/平方公里。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "西亞與北非的地理位置，最主要的特徵為何？", "opts": [["A", "深居內陸，四周高山環繞"], ["B", "位於赤道，終年高溫多雨"], ["C", "位於亞、歐、非三洲交界，自古為交通要地"], ["D", "為南、北美洲之間的橋梁"]], "ans": "C", "exp": "西亞與北非位於亞、歐、非三洲的交界處，自古即為東西方往來的交通要道。"}, {"stem": "蘇伊士運河的興建，主要功能為何？", "opts": [["A", "連接紅海與地中海，可縮短歐、亞、非之間的航運距離"], ["B", "灌溉尼羅河三角洲的農田"], ["C", "作為西亞與北非之間的鐵路運輸線"], ["D", "提供西亞石油輸出的唯一油管"]], "ans": "A", "exp": "蘇伊士運河是鑿穿亞、非兩洲之間的人工航道，連接紅海與地中海，可大幅縮短印度洋至大西洋間的航運時間。"}, {"stem": "紅海的形成，主要原因為何？", "opts": [["A", "火山噴發堆積而成"], ["B", "冰河侵蝕形成的峽灣"], ["C", "尼羅河改道後留下的舊河道"], ["D", "阿拉伯高原原與非洲大陸相連，後因斷層陷落形成紅海而分離"]], "ans": "D", "exp": "阿拉伯高原原本與非洲大陸相連，後因斷層陷落形成紅海，兩地才分離，僅剩北端狹窄陸地相連（即今蘇伊士運河一帶）。"}, {"stem": "西亞北部的安納托力亞高原、伊朗高原、阿富汗高原等新褶曲山地，其形成原因主要與下列何者有關？", "opts": [["A", "河流沖積作用"], ["B", "板塊擠壓抬升，地殼較不穩定"], ["C", "風力侵蝕堆積"], ["D", "冰河搬運堆積"]], "ans": "B", "exp": "西亞北部受板塊擠壓影響，形成一系列大致東西走向的新褶曲山脈，地殼較不穩定，故地震較多。"}, {"stem": "有關阿拉伯高原地形的敘述，何者正確？", "opts": [["A", "地質古老、地表久經侵蝕，地勢較平坦、少高山"], ["B", "多冰河地形，終年積雪"], ["C", "為一巨大的斷層盆地，低於海平面"], ["D", "全境為茂密的熱帶雨林覆蓋"]], "ans": "A", "exp": "阿拉伯高原地質古老、礦產豐富，因地表久經侵蝕，地勢相對平坦、山勢較低緩。"}, {"stem": "由底格里斯河與幼發拉底河沖積而成、土壤肥沃的平原，稱為？", "opts": [["A", "尼羅河三角洲"], ["B", "安納托力亞高原"], ["C", "美索不達米亞平原"], ["D", "剛果盆地"]], "ans": "C", "exp": "美索不達米亞平原位於西亞中部，由底格里斯河與幼發拉底河沖積而成，土壤肥沃、水源充足，為人口集中的精華區。"}, {"stem": "有關北非地形的敘述，何者正確？", "opts": [["A", "以熱帶雨林為主要地貌"], ["B", "全境地勢低窪，河川縱橫"], ["C", "主要由火山島嶼組成"], ["D", "撒哈拉沙漠幾乎涵蓋整個北非，是世界最大的熱帶沙漠"]], "ans": "D", "exp": "北非以撒哈拉沙漠為主，範圍幾乎包括整個北非，是世界上最大的熱帶沙漠。"}, {"stem": "尼羅河對北非古文明發展的重要性，主要在於？", "opts": [["A", "河水終年結冰，利於保存穀物"], ["B", "夏季定期氾濫，帶來豐沛水源與肥沃土壤，孕育出埃及古文明"], ["C", "河道深達千公尺，適合大型油輪航行"], ["D", "河水含鹽量高，適合曬鹽產業"]], "ans": "B", "exp": "尼羅河因夏季定期氾濫，為中、下游帶來豐沛水源與肥沃土壤，因而孕育出埃及古文明。"}, {"stem": "西元2023年，西亞的土耳其與北非的摩洛哥皆發生嚴重地震，兩地共同的自然環境背景為何？", "opts": [["A", "兩地皆位於熱帶雨林氣候區"], ["B", "兩地皆為海底火山噴發所致"], ["C", "兩地皆位於板塊交界處，地殼較不穩定"], ["D", "兩地皆因水庫蓄水而誘發地震"]], "ans": "C", "exp": "西亞與北非皆位於板塊交界處，受板塊擠壓影響，地殼較不穩定，是地震好發的地區之一。"}, {"stem": "西亞與北非大部分地區全年乾燥少雨，主要成因為何？", "opts": [["A", "終年受副熱帶高氣壓籠罩，空氣下沉增溫、溼度下降"], ["B", "距海遙遠，水氣無法到達"], ["C", " 化互動兼具挑戰與機會，例如清真認證食品在歐美出現、Modest Fashion登上西方伸展臺"], ["D", "伊斯蘭文化自古以來未曾與外界互動"]], "ans": "C", "exp": "在全球化下，伊斯蘭文化與西方文化的互動充滿挑戰與機會，如歐美出現清真認證餐廳、伊斯蘭風格建築，以及Modest Fashion風潮等，都反映出雙向的文化交流。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

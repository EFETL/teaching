<script>
const QS=[{"stem": "南亞印度半島的地形由北而南依序可分為哪三個部分？", "opts": [["A", "高原、山地、平原"], ["B", "平原、高原、山地"], ["C", "山地、平原、高原"], ["D", "高原、平原、山地"]], "ans": "C", "exp": "印度半島地形由北而南依序為北部的喜馬拉雅山（山地）、中部的印度大平原、南部的德干高原。"}, {"stem": "喜馬拉雅山是由哪兩個板塊擠壓推升而成的新褶曲山脈？", "opts": [["A", "歐亞板塊與印澳板塊"], ["B", "太平洋板塊與歐亞板塊"], ["C", "印澳板塊與非洲板塊"], ["D", "太平洋板塊與印澳板塊"]], "ans": "A", "exp": "喜馬拉雅山屬新褶曲山脈，是歐亞板塊受印澳板塊推擠抬升而形成，地質年輕、地勢高峻。"}, {"stem": "關於珠穆朗瑪峰的敘述，下列何者正確？", "opts": [["A", "位於印度與巴基斯坦邊境"], ["B", "屬於德干高原的一部分"], ["C", "海拔約5,000公尺"], ["D", "海拔超過8,000公尺，為世界第一高峰"]], "ans": "D", "exp": "珠穆朗瑪峰位於中國與尼泊爾邊境，海拔高度超過8,000公尺，是世界最高峰。"}, {"stem": "印度大平原主要是由哪兩條河流沖積而成？", "opts": [["A", "恆河與湄公河"], ["B", "印度河與恆河"], ["C", "印度河與布拉馬普特拉河"], ["D", "恆河與長江"]], "ans": "B", "exp": "發源自北方高山的印度河與恆河，沖積出中部廣闊、土壤肥沃的印度大平原。"}, {"stem": "關於德干高原的敘述，下列何者正確？", "opts": [["A", "屬於印澳板塊的古老陸塊，地質古老、表面平坦"], ["B", "由印度河與恆河沖積而成，土壤最為肥沃"], ["C", "是南亞地勢最高的地區，多新褶曲山脈"], ["D", "位於南亞最北端，鄰接喜馬拉雅山"]], "ans": "A", "exp": "德干高原東、西兩側緊鄰印度洋，屬於印澳板塊的古老陸塊，地質古老、表面平坦，煤鐵等礦產資源豐富。"}, {"stem": "南亞的塔爾沙漠主要分布在下列哪個區域？", "opts": [["A", "恆河下游三角洲"], ["B", "喜馬拉雅山區"], ["C", "印度河中、下游一帶"], ["D", "斯里蘭卡丘陵地區"]], "ans": "C", "exp": "印度河中、下游一帶因降水稀少，形成乾燥的塔爾沙漠。"}, {"stem": "南亞因北倚高山、三面臨海，形勢隔絕封閉，因此常被稱為什麼？", "opts": [["A", "島弧"], ["B", "次大陸"], ["C", "半島國"], ["D", "大洋洲"]], "ans": "B", "exp": "南亞北倚喜馬拉雅山脈，東、西、南三面臨印度洋，形勢封閉，因此有「次大陸」之稱。"}, {"stem": "下列何者不是南亞地區的國家？", "opts": [["A", "巴基斯坦"], ["B", "孟加拉"], ["C", "斯里蘭卡"], ["D", "泰國"]], "ans": "D", "exp": "泰國屬於東南亞地區；南亞主要包括印度、巴基斯坦、孟加拉、斯里蘭卡、不丹、尼泊爾及馬爾地夫等國。"}, {"stem": "馬爾地夫的地形景觀最主要的特色為何？", "opts": [["A", "珊瑚礁島，地勢低平"], ["B", "高山縱谷，地勢高峻"], ["C", "廣大沖積平原"], ["D", "古老陸塊高原"]], "ans": "A", "exp": "馬爾地夫位於印度洋上，由珊瑚礁島組成，地勢低平，美麗的海島景觀吸引許多觀光客。"}, {"stem": "印度北部與西部乾燥地帶常見一種名為「階梯水井」的傳統水利設施，其興建的主要目的為何？", "opts": [["A", "灌溉恆河三角洲的水稻田"], ["B", "攔截喜馬拉雅山的融雪"], ["C", "便於居民在乾燥地帶取得地下水資源"], ["D", "作為船隻往來印度洋的港口"]], "ans": "C", "exp": "階梯水井主要分布於印度北部與西部的乾燥地帶，居民藉由層層階梯步入地下取水，是因應當地水資源有限而發展出的傳統設施。"}, {"stem": "南亞地區低海拔地帶的氣候，主要屬於下列何種氣候類型？", "opts": [["A", "溫帶海洋性氣候"], ["B", "溫帶大陸性氣候"], ["C", "熱帶沙漠氣候"], ["D", "熱帶季風氣候"]], "ans": "D", "exp": "南亞緯度偏低，低海拔地區普遍受季風影響，氣候溫暖，多屬熱帶季風氣候。"}, {"stem": "南亞的熱帶季風氣候全年大致可分為哪三季？", "opts": [["A", "春、夏、秋"], ["B", "涼季、熱季、雨季"], ["C", "乾季、雨季、霧季"], ["D", "冬季、梅雨季、颱風季"]], "ans": "B", "exp": "南亞因季風影響明顯，全年可分為涼季、熱季、雨季三季。"}, {"stem": "南亞涼季（約11月至隔年2月）氣候涼爽乾燥的主要原因為何？", "opts": [["A", "喜馬拉雅山阻擋東北季風，使冷空氣不易南下"], ["B", "西南季風從印度洋帶來大量水氣"], ["C", "太陽直射，氣溫偏高"], ["D", "受颱風尾影響，降雨偏多"]], "ans": "A", "exp": "涼季時東北季風受喜馬拉雅山阻擋，南亞氣候涼爽乾燥，是一年中最舒適的季節。"}, {"stem": "南亞熱季（約3至5月）氣候特徵為何？", "opts": [["A", "降水最為豐沛"], ["B", "氣溫全年最低"], ["C", "東北季風盛行"], ["D", "屬季風轉換期，缺乏水氣，氣溫可能高達攝氏50度"]], "ans": "D", "exp": "熱季屬季風轉換期，缺乏水氣，加上太陽接近直射，有時溫度可達攝氏50度左右。"}, {"stem": "南亞雨季（約6至10月）降水旺盛的主要原因為何？", "opts": [["A", "東北季風從內陸帶來水氣"], ["B", "溫帶氣旋通過本區"], ["C", "西南季風從印度洋帶來大量水氣"], ["D", "高原地形阻擋所有水氣，降水集中於此"]], "ans": "C", "exp": "雨季時西南季風從印度洋帶來旺盛的水氣，是南亞主要的降水季節。"}, {"stem": "印度的乞拉朋吉有「世界雨極」之稱，這與下列何者關係最密切？", "opts": [["A", "位於德干高原背風處"], ["B", "位於季風迎風坡，加上山區地形抬升水氣"], ["C", "深居內陸，遠離海洋"], ["D", "終年受東北季風籠罩"]], "ans": "B", "exp": "乞拉朋吉位於季風迎風坡，加上山區地形有利水氣抬升成雨，因此年降水量特別豐沛，有「世界雨極」之稱。"}, {"stem": "印度大平原的年降水量分布，大致呈現下列何種趨勢？", "opts": [["A", "由東向西遞減"], ["B", "由西向東遞減"], ["C", "由南向北遞減"], ["D", "各地降水均勻，差異不大"]], "ans": "A", "exp": "印度大平原的降水量由東向西遞減，也影響各地聚落型態與農業景觀的差異。"}, {"stem": "關於德干高原的降水分布，下列敘述何者正確？", "opts": [["A", "高原內陸降水比沿海更豐沛"], ["B", "全區降水均勻一致"], ["C", "東側迎風坡降水最多"], ["D", "西部迎風的沿海地區較多雨，高原內陸則較少雨"]], "ans": "D", "exp": "德干高原西側沿海為西南季風迎風面，降水較多；高原內陸則因地形阻隔，降水相對較少。"}, {"stem": "南亞緯度雖然偏低，但整體氣候仍呈現「溫暖」而非酷熱，主要原因為何？", "opts": [["A", "終年受寒流影響"], ["B", "北方高山阻擋冬季寒冷的季風南下"], ["C", "四周環海，深受涼流調節"], ["D", "地勢平均海拔甚高"]], "ans": "B", "exp": "由於北方高山（喜馬拉雅山）阻擋冬季寒冷的東北季風南下，使南亞各地氣候溫暖，全年可分涼、熱、雨三季。"}, {"stem": "東亞、東北亞、東南亞及南亞雖然同屬季風氣候，但下列何者是它們最主要的差異？", "opts": [["A", "是否受地球自轉影響"], ["B", "是否位於北半球"], ["C", "溫度、降水量與風向隨緯度與地形而各有不同"], ["D", "完全沒有共同特徵，彼此氣候無關"]], "ans": "C", "exp": "這些地區雖同屬季風氣候，但因緯度、地形位置不同，溫度、降水與盛行風向都各有差異。"}, {"stem": "恆河下游三角洲地區氣候溼熱，最適合種植下列哪一組作物？", "opts": [["A", "水稻與黃麻"], ["B", "小麥與棉花"], ["C", "茶葉與甘蔗"], ["D", "玉米與燕麥"]], "ans": "A", "exp": "恆河下游三角洲氣候溼熱多雨，自古以來盛產稻米與黃麻等作物。"}, {"stem": "印度大平原中、西部因降水量較東部減少，農作物主要以下列何者為主？", "opts": [["A", "水稻"], ["B", "黃麻"], ["C", "茶葉"], ["D", "小麥"]], "ans": "D", "exp": "印度大平原中、西部降水量減少，農作物改以較耐旱的小麥為主。"}, {"stem": "德干高原西北部成為南亞重要棉花產地，主要與下列哪些條件有關？", "opts": [["A", "全年多雨、地勢低窪"], ["B", "土壤肥沃，加上高溫少雨的氣候"], ["C", "鄰近恆河，灌溉方便"], ["D", "終年溫涼、雲霧繚繞"]], "ans": "B", "exp": "德干高原西北部土壤肥沃，加上高溫、少雨的氣候條件，適合棉花生長，是南亞重要的棉花產地。"}, {"stem": "下列哪一組地區是南亞著名的茶葉產區？", "opts": [["A", "印度大平原中部、塔爾沙漠"], ["B", "德干高原內陸、印度河流域"], ["C", "喜馬拉雅山山麓丘陵、斯里蘭卡丘陵地"], ["D", "馬爾地夫珊瑚礁島"]], "ans": "C", "exp": "多雨的喜馬拉雅山山麓區與斯里蘭卡的丘陵地區氣候溼潤，是世界重要的茶葉生產地。"}, {"stem": "黃麻是南亞重要的經濟作物，主要可製成下列何種產品？", "opts": [["A", "麻布袋、地毯等天然纖維製品"], ["B", "電子零組件"], ["C", "藥用植物萃取物"], ["D", "建築用鋼材"]], "ans": "A", "exp": "黃麻適合生長在多雨氣候，是重要的天然纖維，可製成麻布袋、地毯等物品。"}, {"stem": "南亞各地農作物種類差異甚大，主要是受下列哪些因素影響？", "opts": [["A", "政府統一規劃分配"], ["B", "宗教信仰的規定"], ["C", "各地降水量與地形條件不同，因地制宜發展農業"], ["D", "完全取決於人口多寡"]], "ans": "C", "exp": "南亞各地依降水量與地形條件的不同，種植適合當地環境的農作物，展現因地制宜的農業發展特色。"}, {"stem": "印度與下列哪一個南亞國家皆是世界著名的產茶國與茶葉出口國？", "opts": [["A", "巴基斯坦"], ["B", "孟加拉"], ["C", "馬爾地夫"], ["D", "斯里蘭卡"]], "ans": "D", "exp": "印度與斯里蘭卡都是世界著名的產茶國與茶葉出口國。"}, {"stem": "南亞地區信仰人口最多的宗教是下列何者？", "opts": [["A", "伊斯蘭教"], ["B", "印度教"], ["C", "佛教"], ["D", "錫克教"]], "ans": "B", "exp": "南亞最多人信仰的宗教是印度教，其次為伊斯蘭教。"}, {"stem": "南亞地區中，巴基斯坦與孟加拉主要信仰下列哪一種宗教？", "opts": [["A", "伊斯蘭教"], ["B", "印度教"], ["C", "佛教"], ["D", "基督教"]], "ans": "A", "exp": "巴基斯坦與孟加拉大多信仰伊斯蘭教，與印度以印度教為主形成明顯區隔。"}, {"stem": "南亞地區中，下列哪兩個國家的民眾大多信仰佛教？", "opts": [["A", "印度、巴基斯坦"], ["B", "孟加拉、印度"], ["C", "巴基斯坦、孟加拉"], ["D", "不丹、斯里蘭卡"]], "ans": "D", "exp": "佛教與印度教同為南亞古老宗教，不丹與斯里蘭卡的民眾大多信仰佛教。"}, {"stem": "恆河在印度教信仰中具有什麼樣的意義？", "opts": [["A", "恆河被視為不潔之地，教徒禁止靠近"], ["B", "恆河只具有農業灌溉功能，無宗教意義"], ["C", "恆河是印度教中的聖河，教徒常至河畔沐浴、祈禱"], ["D", "恆河是伊斯蘭教的聖地"]], "ans": "C", "exp": "恆河是印度教中的聖河，許多教徒會在恆河畔沐浴、祈禱，具有重要的宗教意義。"}, {"stem": "在印度教信仰中，牛具有神聖的地位，因此下列敘述何者正確？", "opts": [["A", "牛是印度教節慶中主要的食用牲畜"], ["B", "牛被視為神明的坐騎，信徒不可食用牛肉"], ["C", "牛只在特定季節才受到保護"], ["D", "牛在南亞各宗教中皆無特殊地位"]], "ans": "B", " stem": "南亞人口眾多、勞力充足的特色，對其經濟發展帶來下列何種影響？", "opts": [["A", "完全無助於招商引資"], ["B", "導致跨國企業避免在此設廠"], ["C", "吸引許多跨國企業以低廉勞力成本在此設廠生產"], ["D", "使南亞各國經濟完全依賴農業"]], "ans": "C", "exp": "南亞人口眾多，勞力充足且相對低廉，吸引許多跨國企業前來設廠，發展成衣、紡織等勞力密集產業。"}, {"stem": "印度城市邦加羅爾因資訊與科技產業高度聚集，因此被稱為什麼？", "opts": [["A", "印度威尼斯"], ["B", "南亞香港"], ["C", "世界雨極"], ["D", "印度矽谷"]], "ans": "D", "exp": "邦加羅爾因服務美國企業而興起，資訊與科技產業聚集，因此有「印度矽谷」之稱。"}, {"stem": "邦加羅爾能與美國矽谷形成「無縫接軌」的合作模式，主要與下列何者關係最密切？", "opts": [["A", "兩地位於同一時區，作息完全相同"], ["B", "兩地時差將近半天，可接力進行資訊產業的生產工作"], ["C", "邦加羅爾氣候與矽谷相同"], ["D", "兩地皆位於海岸線上，方便海運"]], "ans": "B", "exp": "邦加羅爾與美國矽谷的地理位置時差將近半天，矽谷廠商下班後可將工作傳至邦加羅爾接力完成，提升生產效率與競爭力。"}, {"stem": "印度能發展成為世界重要的海外客服中心與軟體設計中心，下列哪一項並非主要原因？", "opts": [["A", "印度全年降水量居世界之冠"], ["B", "英語為官方語言之一，溝通無障礙"], ["C", "政府推行理工教育政策，培養大量技術人才"], ["D", "工資相對低廉，吸引歐美企業釋出業務"]], "ans": "A", "exp": "印度發展資訊服務業的主因包括英語溝通無礙、理工人才充沛、工資低廉等，與降水量高低並無直接關係，本題應選「非主要原因」的選項。"}, {"stem": "孟加拉能成為全球重要的紡織品、成衣出口國，最主要的原因為何？", "opts": [["A", "境內油田密布，可自產化學纖維原料"], ["B", "政府課徵極高的關稅保護本地市場"], ["C", "廉價勞力充足"], ["D", "位處內陸，運輸成本低廉"]], "ans": "C", "exp": "孟加拉由於廉價勞力充足，成為全球重要的紡織品出口國，吸引跨國成衣加工業前來設廠。"}, {"stem": "「寶萊塢」是指南亞哪一個國家蓬勃發展的產業？", "opts": [["A", "巴基斯坦的資訊軟體業"], ["B", "斯里蘭卡的觀光業"], ["C", "孟加拉的成衣業"], ["D", "印度的電影產業"]], "ans": "D", "exp": "寶萊塢是印度電影產業的代稱，印度電影產量豐富，是當地重要且發達的產業之一。"}, {"stem": "許多歐美企業將客服中心設置在印度，最主要的考量因素為何？", "opts": [["A", "印度氣候涼爽宜人，適合長期辦公"], ["B", "印度英語溝通無障礙，且工資相對低廉"], ["C", "印度距離歐美市場最近"], ["D", "印度政府提供免費辦公場地給所有外商"]], "ans": "B", "exp": "印度以英語為官方語言之一，加上工資相對低廉，因此吸引歐美企業前來設立客服中心，發展成海外服務業重鎮。"}, {"stem": "印度第二級產業（工業）的就業人口比例相對偏低，可能與下列哪一項原因關係最密切？", "opts": [["A", "基礎建設不足，電力、自來水等供應有限"], ["B", "印度完全沒有工業原料"], ["C", "印度人口過少，缺乏勞動力"], ["D", "政府嚴格禁止設立工廠"]], "ans": "A", "exp": "印度部分地區基礎建設不足，電力與自來水供應有限，交通等硬體設施跟不上發展速度，影響第二級產業的擴展。"}, {"stem": "斯里蘭卡、巴基斯坦等國因位居東亞與西亞、歐洲之間的海、陸運中繼位置，成為中國積極拉攏的合作對象，這指的是下列哪一項倡議？", "opts": [["A", "印太戰略"], ["B", "東協經濟共同體"], ["C", "一帶一路"], ["D", "北美自由貿易協定"]], "ans": "C", "exp": "斯里蘭卡、巴基斯坦等國由於位居海、陸運中繼位置，成為中國推動「一帶一路」積極拉攏的對象；印度則另一方面參與美國主導的「印太戰略」。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "「一地短時間內的大氣狀況及其變化」稱為下列何者？", "opts": [["A", "氣候"], ["B", "氣候圖"], ["C", "天氣"], ["D", "氣壓"]], "ans": "C", "exp": "天氣是指一地短時間內的大氣狀況及其變化，如「晴時多雲偶陣雨」；氣候才是長時間的大氣平均狀態。"}, {"stem": "「冬暖夏涼」、「四季如春」這類說法，是用來描述一個地方的什麼？", "opts": [["A", "天氣"], ["B", "氣候"], ["C", "氣壓"], ["D", "風向"]], "ans": "B", "exp": "氣候是指一地長時間的大氣平均狀態，「冬暖夏涼」、「四季如春」即為描述氣候特徵的用語。"}, {"stem": "下列敘述何者屬於「天氣」而非「氣候」的描述？", "opts": [["A", "恆春四季如春"], ["B", "今天午後有雷陣雨"], ["C", "臺灣南部夏雨冬乾"], ["D", "北部全年有雨"]], "ans": "B", "exp": "天氣描述短時間內的大氣狀況變化；其餘選項都是以長期平均資料歸納出的氣候特徵。"}, {"stem": "分析一地的氣候特徵時，最常使用下列哪一種資料？", "opts": [["A", "月均溫、年均溫、年降水量等長時間平均數據"], ["B", "單日的降雨量"], ["C", "單次颱風的侵襲路徑"], ["D", "當日的紫外線指數"]], "ans": "A", "exp": "氣候特徵多以月均溫、年均溫、年降水量等長時間的平均數據作為分析指標。"}, {"stem": "中央氣象署繪製地面天氣圖，主要依據下列何種資料？", "opts": [["A", "各地氣象測站蒐集的氣象資料"], ["B", "農民曆記載"], ["C", "網路社群討論"], ["D", "歷史文獻紀錄"]], "ans": "A", "exp": "中央氣象署藉由臺灣及周圍各地氣象測站蒐集的氣象資料，繪製成地面天氣圖，供預報人員研判天氣。"}, {"stem": "測量大氣的溫度時，常用的單位為下列何者？", "opts": [["A", "百帕"], ["B", "毫米"], ["C", "公尺/秒"], ["D", "攝氏度"]], "ans": "D", "exp": "氣溫指大氣的溫度，常以攝氏（℃）為單位。"}, {"stem": "關於氣溫變化的敘述，下列何者正確？", "opts": [["A", "高度增加，氣溫隨之上升"], ["B", "高度與氣溫變化無關"], ["C", "高度增加，氣溫隨之遞減"], ["D", "緯度與氣溫變化無關"]], "ans": "C", "exp": "氣溫除了隨季節變化改變，也會因緯度或高度增加而遞減。"}, {"stem": "測量降水量時，常用的單位為下列何者？", "opts": [["A", "毫米"], ["B", "攝氏度"], ["C", "百帕"], ["D", "公尺/秒"]], "ans": "A", "exp": "降水包含雨、雪、冰雹等型態，以毫米（mm）為單位。"}, {"stem": "下列哪一種降水類型的特徵為「雨時短、雨區小、強度大」，常見於夏日午後？", "opts": [["A", "地形雨"], ["B", "鋒面雨"], ["C", "對流雨"], ["D", "梅雨"]], "ans": "C", "exp": "對流雨如午後雷陣雨，是因日照強烈、氣流對流旺盛所致，特徵為雨時短、雨區小、強度大；鋒面雨（如梅雨）則雨時長、雨區大。"}, {"stem": "潮溼氣流遇到山地，沿地勢上升、水氣凝結而降下的雨，稱為下列何者？", "opts": [["A", "對流雨"], ["B", "地形雨"], ["C", "鋒面雨"], ["D", "颱風雨"]], "ans": "B", "exp": "潮溼氣流遇山地沿地勢上升，氣溫降低使水氣凝結致雨，稱為地形雨，主要降於山地迎風坡，背風坡則乾燥少雨。"}, {"stem": "冷、暖氣團相遇，暖空氣沿交界面爬升凝結所形成的降水，稱為下列何者？梅雨即為典型代表。", "opts": [["A", "地形雨"], ["B", "對流雨"], ["C", "鋒面雨"], ["D", "焚風雨"]], "ans": "C", "exp": "冷暖性質不同的氣團相遇形成鋒面，暖空氣沿鋒面上升凝結致雨，稱為鋒面雨，如梅雨，特性為雨時長、雨區大。"}, {"stem": "「單位地表面積所承受的空氣重量」稱為下列何者？", "opts": [["A", "氣溫"], ["B", "氣壓"], ["C", "降水量"], ["D", "風速"]], "ans": "B", "exp": "氣壓是指單位地表面積所承受的空氣重量。"}, {"stem": "氣壓常用的觀測單位為下列何者？", "opts": [["A", "百帕"], ["B", "攝氏度"], ["C", "毫米"], ["D", "公尺/秒"]], "ans": "A", "exp": "氣壓以百帕（hPa）為單位。"}, {"stem": "登山者在高海拔地區可能出現頭痛、頭暈等「高山症」症狀，這與下列何種現象最相關？", "opts": [["A", "海拔愈高，氣壓愈低，空氣愈稀薄"], ["B", "海拔愈高，氣壓愈高"], ["C", "海拔與氣壓無關"], ["D", "高山地區降水量特別多"]], "ans": "A", "exp": "海拔高度愈高，空氣愈稀薄，氣壓也愈低，這正是高山症發生的主要原因之一。"}, {"stem": "一地氣溫較高時，空氣受熱膨脹上升，容易形成下列何種現象？", "opts": [["A", "高氣壓"], ["B", "寒流"], ["C", "梅雨"], ["D", "低氣壓"]], "ans": "D", "exp": "氣溫愈高，空氣受熱膨脹上升，形成低氣壓；氣溫愈低，空氣則收縮下沉，形成高氣壓。"}, {"stem": "「風」的形成，主要是因為下列何種原因？", "opts": [["A", "兩地氣溫相同"], ["B", "地球公轉"], ["C", "太陽黑子活動"], ["D", "兩地氣壓不同，空氣由高壓處流向低壓處"]], "ans": "D", "exp": "風是空氣的水平流動，當兩地氣壓不同，空氣便會由氣壓較高處流向氣壓較低處。"}, {"stem": "兩地間氣壓差愈大，下列敘述何者正確？", "opts": [["A", "風速愈強"], ["B", "風速愈弱"], ["C", "氣溫愈高"], ["D", "降水愈少"]], "ans": "A", "exp": "兩地間氣壓差愈大，風速愈強。"}, {"stem": "氣象學上所稱的「風向」，是指下列何者？", "opts": [["A", "風吹去的方向"], ["B", "風的來向"], ["C", "風速的快慢"], ["D", "氣壓的高低"]], "ans": "B", "exp": "風向指風的來向，如從西方吹過來的風，即稱為西風，而非風吹去的方向。"}, {"stem": "地面天氣圖中，同一條線上各點氣壓數值相同的線，稱為下列何者？", "opts": [["A", "等溫線"], ["B", "等雨量線"], ["C", "等壓線"], ["D", "經線"]], "ans": "C", "exp": "等壓線是將地表上氣壓值相同的各點連線而成，可作為研判天氣的依據。"}, {"stem": "地面天氣圖上的「高氣壓中心」，通常代表下列哪一種天氣狀況？", "opts": [["A", "空氣穩定、晴朗的好天氣"], ["B", "多為陰天甚至有雷雨"], ["C", "強烈颱風即將形成"], ["D", "必定會降雪"]], "ans": "A", "exp": "高氣壓中心的空氣穩定，是晴朗的好天氣；低氣壓中心才多為陰天或雨天，甚至有雷雨出現。"}, {"stem": "冷氣團勢力較強，將鋒面往暖氣團方向推動，這種鋒面稱為下列何者？", "opts": [["A", "暖鋒"], ["B", "滯留鋒"], ["C", "颱風"], ["D", "冷鋒"]], "ans": "D", "exp": "冷鋒是冷氣團勢力較強，將交界面往暖氣團方向推動所形成的鋒面。"}, {"stem": "冷、暖氣團勢力相當，鋒面無法往單一方向移動，只能在原地徘徊或停留，這種鋒面稱為下列何者？", "opts": [["A", "冷鋒"], ["B", "滯留鋒"], ["C", "暖鋒"], ["D", "熱帶性低氣壓"]], "ans": "B", "exp": "滯留鋒是冷暖氣團勢力相當所形成的鋒面，每年5、6月造成梅雨的鋒面即屬於滯留鋒。"}, {"stem": "地面天氣圖上以特殊符號標示的強烈低氣壓中心，代表下列哪一種天氣系統？", "opts": [["A", "寒流"], ["B", "梅雨鋒面"], ["C", "颱風"], ["D", "焚風"]], "ans": "C", "exp": "颱風是強烈的低氣壓中心，在地面天氣圖上以特殊符號標示。"}, {"stem": "一年中最暖月月均溫減去最冷月月均溫的差值，稱為下列何者？", "opts": [["A", "年均溫"], ["B", "月均溫"], ["C", "年降水量"], ["D", "年溫差"]], "ans": "D", "exp": "年溫差是最暖月月均溫減去最冷月月均溫的差值。"}, {"stem": "一年十二個月月均溫的平均值，稱為下列何者？", "opts": [["A", "年溫差"], ["B", "月降水量"], ["C", "年降水量"], ["D", "年均溫"]], "ans": "D", "exp": "年均溫是一年十二個月月均溫的平均值。"}, {"stem": "在臺灣，通常月均溫最高的「最暖月」出現在幾月？", "opts": [["A", "1月"], ["B", "4月"], ["C", "7月"], ["D", "10月"]], "ans": "C", "exp": "臺灣的最暖月通常出現在7月，此時月均溫全年最高。"}, {"stem": "在臺灣，通常月均溫最低的「最冷月」出現在幾月？", "opts": [["A", "4月"], ["B", "7月"], ["C", "1月"], ["D", "10月"]], "ans": "C", "exp": "臺灣的最冷月通常出現在1月，此時月均溫全年最低。"}, {"stem": "繪製氣候圖時，一年中各月的月均溫資料通常以下列哪一種圖形呈現？", "opts": [["A", "柱狀圖"], ["B", "折線圖（連成氣溫曲線）"], ["C", "圓餅圖"], ["D", "雷達圖"]], "ans": "B", "exp": "繪製氣候圖時，會將各月月均溫點出後相連，畫出全年氣溫變化曲線。"}, {"stem": "承上題，氣候圖中各月的降水量資料，通常以下列哪一種圖形呈現？", "opts": [["A", "折線圖"], ["B", "柱狀圖"], ["C", "圓餅圖"], ["D", "散布圖"]], "ans": "B", "exp": "氣候圖中，各月降水量通常繪製成柱狀圖，方便與氣溫曲線對照判讀。"}, {"stem": "觀察臺灣七月與一月等溫線圖，下列敘述何者正確？", "opts": [["A", "冬季南北氣溫差異很小"], ["B", "夏季北部遠比南部炎熱"], ["C", "山區氣溫始終高於平地"], ["D", "夏季全臺平地普遍高溫，南北氣溫差異小"]], "ans": "D", "exp": "臺灣夏季全臺平地皆高溫，南北氣溫差異小；冬季時因緯度影響，南北氣溫差異才較為明顯。"}, {"stem": "關於臺灣冬季氣溫南北差異的敘述，下列何者正確？", "opts": [["A", "北部較南部溫暖"], ["B", "南北氣溫完全相同"], ["C", "山區冬季比平地溫暖"], ["D", "南部因緯度較低，冬季氣溫較北部溫暖"]], "ans": "D", "exp": "南部因緯度較低，冬季時氣溫較北部溫暖，故臺灣冬季南北氣溫差異較夏季明顯。"}, {"stem": "關於臺灣山地與平地氣溫的比較，下列敘述何者正確？", "opts": [["A", "山地氣溫恆常高於平地"], ["B", "山地與平地氣溫無明顯差異"], ["C", "山地地勢較高，氣溫低於平地"], ["D", "山地僅夏季氣溫較低"]], "ans": "C", "exp": "山區地勢較高，氣溫低於平地，冬季時部分高山水氣充足還可能見到降雪，如玉山。"}, {"stem": "嘉義市與玉山緯度相近，但兩地年均溫卻相差超過10℃，造成此差異的主要原因為下列何者？", "opts": [["A", "兩地距海遠近不同"], ["B", "兩地降水量不同"], ["C", "兩地地形（海拔高度）不同"], ["D", "兩地盛行風向不同"]], "ans": "C", "exp": "玉山海拔高達3千多公尺，嘉義市則位於平原，氣溫隨高度增加而遞減，因此雖緯度相近，年均溫卻相差懸殊。"}, {"stem": "臺北七月月均溫可能高於高雄，這與下列何種地形特徵最為相關？", "opts": [["A", "臺北緯度比高雄低"], ["B", "臺北位於高海拔山區"], ["C", "臺北全年吹西南季風"], ["D", "臺北位於盆地地形，熱氣不易擴散"]], "ans": "D", "exp": "臺北盆地地形使熱氣容易累積而不易散去，可能造成夏季氣溫偏高，甚至高於緯度較低的高雄。"}, {"stem": "關於臺灣南部降水特徵的敘述，下列何者正確？", "opts": [["A", "全年降水量平均分布"], ["B", "夏雨冬乾，降水集中夏季"], ["C", "冬季降水量最多"], ["D", "全年幾乎不降雨"]], "ans": "B", "exp": "臺灣南部受夏季西南季風影響，降水集中夏季，形成夏雨冬乾的特徵。"}, {"stem": "關於臺灣北部降水特徵的敘述，下列何者正確？", "opts": [["A", "降水集中夏季，冬季乾燥"], ["B", "全年幾乎不下雨"], ["C", "僅秋季降雨"], ["D", "受東北季風影響，各月降水較平均、冬季亦有雨"]], "ans": "D", "exp": "臺灣北部因冬季受東北季風影響，各月降水較為平均，連冬季也潮溼多雨。"}, {"stem": "造成臺灣南部「夏雨冬乾」、北部「全年有雨」現象的主要原因為下列何者？", "opts": [["A", "緯度差異"], ["B", "河川長短不同"], ["C", "人口分布不同"], ["D", "夏季西南季風、冬季東北季風的影響"]], "ans": "D", "exp": "臺灣夏季盛行西南季風，冬季則吹東北季風，受盛行風帶來雨水的影響，形成南部降水集中夏季、北部各月降水較平均的現象。"}, {"stem": "關於臺灣山地與平地降水量的比較，下列敘述何者正確？", "opts": [["A", "山地多地形雨，降水量多於平地"], ["B", "山地降水量少於平地"], ["C", "山地與平地降水量相同"], ["D", "山地僅冬季才有降水"]], "ans": "A", "exp": "山區多地形雨，降水量較多，尤以臺灣東北部山區，年降水量居全臺之冠。"}, {"stem": "臺灣哪個地區因地勢低平，是全臺年降水量較少的地區之一？", "opts": [["A", "東北部山區"], ["B", "中央山脈"], ["C", "西南部平原及澎湖群島"], ["D", "東部沿海山區"]], "ans": "C", "exp": "臺灣西南部平原及澎湖群島因地勢低平，是全臺降水量較少的地區。"}, {"stem": "下列何者「不是」影響臺灣氣候的主要因素？", "opts": [["A", "緯度"], ["B", "地形"], ["C", "人口密度"], ["D", "季風"]], "ans": "C", "exp": "影響臺灣氣候的主要因素有緯度、地形、季風三項，人口密度並非直接影響氣候的因素。"}, {"stem": "恆春位於臺灣最南端，冬季氣溫仍相對溫暖，主要與下列何項因素有關？", "opts": [["A", "位於北回歸線以南，緯度較低"], ["B", "地形阻擋東北季風"], ["C", "全年吹西南季風"], ["D", "位於高山地區"]], "ans": "A", "exp": "恆春位於北回歸線以南，緯度較低，冬季氣溫仍偏高，年溫差也因此較小。"}, {"stem": "恆春著名的「落山風」，主要是下列哪一種季風翻越中央山脈後所形成？", "opts": [["A", "夏季西南季風"], ["B", "梅雨鋒面"], ["C", "冬季東北季風"], ["D", "颱風外圍環流"]], "ans": "C", "exp": "冬季東北季風翻越中央山脈後，在恆春形成強勁的落山風，也是當地洋蔥品質優良的原因之一。"}, {"stem": "臺灣傳統建築「騎樓」的興建，主要反映當地具有下列哪一種氣候特色？", "opts": [["A", "氣候炎熱、雨日較長"], ["B", "全年乾燥少雨"], ["C", "冬季嚴寒多雪"], ["D", "年溫差極大"]], "ans": "A", "exp": "騎樓具有避風雨、防日晒、通風等功能，主要分布在氣候炎熱、雨日較長的地區，如臺灣、中國南部、東南亞及印度。"}, {"stem": "冬季時，亞洲北部的冷氣團南下，造成氣溫顯著驟降的現象，稱為下列何者？", "opts": [["A", "寒流"], ["B", "梅雨"], ["C", "颱風"], ["D", "焚風"]], "ans": "A", "exp": "冬季時亞洲北部的冷氣團南下，造成氣溫驟降，當降溫達一定程度時，稱為寒流。"}, {"stem": "寒流來襲時的低溫，最可能直接造成下列哪一種氣象災害？", "opts": [["A", "旱災"], ["B", "寒害（農漁業受損）"], ["C", "水災"], ["D", "土石流"]], "ans": "B", "exp": "寒流的低溫會影響健康，並使農、漁業受損，若低溫造成災害，稱為寒害。"}, {"stem": "臺灣容易發生乾旱現象的地區與時期，下列敘述何者正確？", "opts": [["A", "東北部、夏季"], ["B", "西南部、冬季至隔年春季梅雨來臨前"], ["C", "中央山脈、全年"], ["D", "東部沿海、秋季"]], "ans": "B", "exp": "臺灣西南部每年冬季至隔年春季（梅雨來臨前）降水稀少，特別容易發生乾旱現象。"}, {"stem": "臺灣夏季容易發生水災，其原因「不」包含下列何者？", "opts": [["A", "梅雨鋒面滯留"], ["B", "寒流南下"], ["C", "夏季午後雷陣雨"], ["D", "夏、秋颱風侵襲"]], "ans": "B", "exp": "寒流南下是造成寒害的原因，而非水災；水災多因梅雨鋒面滯留、夏季午後雷陣雨及夏、秋颱風帶來的強降水所致。"}, {"stem": "每年5、6月間，臺灣常出現連續多日陰雨綿綿的天氣現象，稱為下列何者？", "opts": [["A", "梅雨"], ["B", "焚風"], ["C", "寒害"], ["D", "落山風"]], "ans": "A", "exp": "每年5、6月間鋒面滯留形成的陰雨天氣現象，稱為梅雨，屬於鋒面雨的一種，雨時長、雨區大。"}, {"stem": "颱風侵襲期間，測站觀測到的氣壓變化，下列敘述何者正確？", "opts": [["A", "颱風是強烈的低氣壓系統，中心接近時氣壓會下降"], ["B", "颱風中心接近時氣壓持續上升"], ["C", "颱風對氣壓沒有影響"], ["D", "颱風只影響風向，不影響氣壓"]], "ans": "A", "exp": "颱風是強烈的低氣壓中心，隨著颱風中心逐漸接近測站，當地氣壓會持續下降，直到颱風離開後才回升。"}, {"stem": "「氣象災害」的定義為何？", "opts": [["A", "只要下雨就算氣象災害"], ["B", "只有颱風才算氣象災害"], ["C", "只有寒流才算氣象災害"], ["D", "天氣現象造成生命、財產損失時，才稱為氣象災害"]], "ans": "D", "exp": "天氣現象若造成生命、財產上的損失時，就是氣象災害，臺灣常見的氣象災害包括颱風、豪大雨引起的水災、寒害及旱災。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "美洲依文化差異可分為「盎格魯美洲」與「拉丁美洲」，兩者最主要的區分依據是什麼？", "opts": [["A", "氣候類型不同"], ["B", "受歐洲殖民母國影響的語言與文化不同（英語文化／拉丁文化）"], ["C", "地形高低起伏不同"], ["D", "人口數量多寡不同"]], "ans": "B", "exp": "北美洲的美國、加拿大因語言、文化受英國影響大，稱為「盎格魯美洲」；中南美洲昔日被西班牙、葡萄牙殖民，語言、文化受拉丁文化影響，稱為「拉丁美洲」，兩者的區分主要依語言文化而非地形氣候。"}, {"stem": "中美洲與南美洲的分界，一般是以下列何者為界？", "opts": [["A", "墨西哥"], ["B", "加勒比海"], ["C", "洛磯山脈"], ["D", "巴拿馬"]], "ans": "D", "exp": "中南美洲又以巴拿馬為界，再細分為中美洲與南美洲。"}, {"stem": "北美洲因語言、文化受英國影響大，因此又被稱為？", "opts": [["A", "盎格魯美洲"], ["B", "拉丁美洲"], ["C", "新大陸"], ["D", "美利堅合眾國"]], "ans": "A", "exp": "北美洲指以英語為主要語言的美國、加拿大，因文化受英國影響大，故稱為「盎格魯美洲」。"}, {"stem": "北美洲三大地形區中，位於西部、地勢高聳的山脈是？", "opts": [["A", "阿帕拉契山脈"], ["B", "拉布拉多高原"], ["C", "洛磯山脈"], ["D", "大分水嶺山脈"]], "ans": "C", "exp": "北美洲大致可分為西部高山（洛磯山脈）、中部平原（北美大平原）、東部高原丘陵三大地形區。"}, {"stem": "洛磯山脈地勢高聳、火山地震頻繁，主要是受到下列哪兩個板塊擠壓的影響？", "opts": [["A", "歐亞板塊與北美板塊"], ["B", "南美板塊與加勒比板塊"], ["C", "太平洋板塊與北美板塊"], ["D", "印度板塊與歐亞板塊"]], "ans": "C", "exp": "洛磯山脈西側沿海位於太平洋板塊與北美板塊擠壓帶，屬環太平洋火山地震帶的一部分，火山、地震活動頻繁。"}, {"stem": "北美大平原北部因受冰河侵蝕，地形上的顯著特徵是？", "opts": [["A", "多冰蝕湖"], ["B", "多峽灣"], ["C", "多沙丘"], ["D", "多火山口湖"]], "ans": "A", "exp": "北美大平原北部曾受冰河作用影響，土壤貧瘠、地表較崎嶇，且多冰蝕湖，如美、加邊境的五大湖。"}, {"stem": "五大湖是美國與下列哪一國的邊境湖泊？", "opts": [["A", "墨西哥"], ["B", "古巴"], ["C", "巴哈馬"], ["D", "加拿大"]], "ans": "D", "exp": "北美大平原北部多冰蝕湖，其中五大湖即位於美國與加拿大的邊境。"}, {"stem": "北美大平原南部因哪一條河流沖積而成，土壤肥沃、是重要的農業區？", "opts": [["A", "科羅拉多河"], ["B", "密西西比河"], ["C", "聖羅倫斯河"], ["D", "育空河"]], "ans": "B", "exp": "北美大平原南部為密西西比河沖積而成的平原，土壤肥沃，是重要的農業帶。"}, {"stem": "北美洲東部高原丘陵區的主體地形，除了拉布拉多高原外，還包括下列何者？", "opts": [["A", "洛磯山脈"], ["B", "喀斯開山脈"], ["C", "內華達山脈"], ["D", "阿帕拉契山脈"]], "ans": "D", "exp": "東部高原丘陵區北起拉布拉多高原，南部則以阿帕拉契山脈為主體。"}, {"stem": "北美洲東部高原丘陵區雖然礦產豐富，但地勢較西部低緩許多，主要原因是？", "opts": [["A", "位於板塊張裂帶，地層下陷"], ["B", "地質古老，經長時間侵蝕"], ["C", "長期受冰河覆蓋尚未抬升"], ["D", "人為大量開採而剷平"]], "ans": "B", "exp": "東部高原丘陵區屬古老陸塊，礦產豐富，但因地質古老、經長年侵蝕，山勢已不高、地勢平緩。"}, {"stem": "舉世聞名的科羅拉多大峽谷，是由下列哪一條河流歷經萬年切割而成？", "opts": [["A", "密西西比河"], ["B", "哥倫比亞河"], ["C", "科羅拉多河"], ["D", "格蘭河"]], "ans": "C", "exp": "科羅拉多大峽谷是科羅拉多河耗費萬年切割出的著名景觀，位於洛磯山脈南段附近。"}, {"stem": "北美洲各地氣候差異大，主要受緯度、地形、風向、洋流及下列何者影響？", "opts": [["A", "距海遠近"], ["B", "人口密度"], ["C", "農業型態"], ["D", "政治制度"]], "ans": "A", "exp": "北美洲氣候主要受緯度、地形、風向、洋流、距海遠近等自然因素影響，呈現多樣的氣候變化。"}, {"stem": "北美洲西部洛磯山區因地勢高聳，形成何種氣候類型？", "opts": [["A", "高地氣候"], ["B", "溫帶大陸性氣候"], ["C", "溫帶地中海型氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "洛磯山區因地勢高，氣溫較低，屬於高地氣候。"}, {"stem": "北緯40至60度的北美洲西岸地區，終年受西風與下列哪一暖流影響，形成溫帶海洋性氣候？", "opts": [["A", "墨西哥灣流"], ["B", "黑潮"], ["C", "阿拉斯加暖流"], ["D", "巴西暖流"]], "ans": "C", "exp": "北緯40～60度的西岸地區終年受西風與阿拉斯加暖流影響，全年有雨，形成溫帶海洋性氣候。"}, {"stem": "北美洲的溫帶海洋性氣候僅分布在狹長的西岸地帶，不像歐洲深入內陸，主要原因是？", "opts": [["A", "北美洲緯度較低"], ["B", "北美洲山脈多南北走向，阻擋西風水氣深入內陸"], ["C", "北美洲面積較小"], ["D", "北美洲沿岸沒有暖流經過"]], "ans": "B", "exp": "北美洲山脈南北走向且鄰近西岸，阻擋西風帶來的水氣往內陸擴散，因此海洋性氣候僅分布在狹長的沿海地帶，與歐洲山脈東西走向、平原廣布的情形不同。"}, {"stem": "北美洲西岸北緯30至40度地區，夏季受副熱帶高壓籠罩、冬季受西風影響，降水呈現夏乾冬雨，屬於？", "opts": [["A", "溫帶大陸性氣候"], ["B", "溫帶沙漠氣候"], ["C", "夏雨型暖溫帶氣候"], ["D", "溫帶地中海型氣候"]], "ans": "D", "exp": "北緯30～40度的太平洋沿岸，受副熱帶高壓與西風影響，降水特徵為夏乾冬雨，屬溫帶地中海型氣候。"}, {"stem": "北美洲西南部內陸因冬季山脈阻擋西風水氣，降水稀少，形成？", "opts": [["A", "溫帶地中海型氣候"], ["B", "高地氣候"], ["C", "溫帶沙漠氣候"], ["D", "寒帶氣候"]], "ans": "C", "exp": "美國西南部內陸因位於西風背風側，山脈阻擋水氣，降水量稀少，形成溫帶沙漠氣候。"}, {"stem": "洛磯山脈以東的北美大平原及其以東地區，因陸地廣大平坦、冷暖氣流可長驅直入，年溫差大，屬於？", "opts": [["A", "溫帶海洋性氣候"], ["B", "溫帶地中海型氣候"], ["C", "高地氣候"], ["D", "溫帶大陸性氣候"]], "ans": "D", "exp": "北緯40度以北的北美大平原及其以東地區，陸地廣大且地形平坦，冬季寒冷氣流及夏季暖溼氣流可長驅直入，氣溫變化劇烈、年溫差大，屬溫帶大陸性氣候。"}, {"stem": "北美洲東南部沿海地區因緯度較低、受暖流及夏季信風影響，氣候溫暖潮溼，夏秋常有颶風，屬於？", "opts": [["A", "夏雨型暖溫帶氣候"], ["B", "溫帶大陸性氣候"], ["C", "溫帶地中海型氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "東南部及沿海一帶因緯度較低，受海洋水氣與暖流影響，氣候暖溼，夏、秋季節常有颶風侵襲，屬夏雨型暖溫帶氣候。"}, {"stem": "加拿大中、北部及美國阿拉斯加因緯度高，冬季酷寒、冬夏溫差大，屬於？", "opts": [["A", "高地氣候"], ["B", "寒帶氣候"], ["C", "溫帶大陸性氣候"], ["D", "溫帶海洋性氣候"]], "ans": "B", "exp": "加拿大中、北部地區及美國阿拉斯加緯度較高，氣候嚴寒，冬夏溫差大，屬寒帶氣候。"}, {"stem": "北美洲東岸出現寒帶氣候的緯度會比西岸低，主要原因是？", "opts": [["A", "東岸地勢較高"], ["B", "東岸沿岸為寒流、西岸沿岸為暖流，使東岸同緯度較寒冷"], ["C", "東岸距海較遠"], ["D", "東岸多地形雨"]], "ans": "B", "exp": "西岸沿岸有暖流經過，東岸沿岸則為寒流，洋流性質使東岸較西岸同緯度地區更寒冷，因此寒帶氣候在東岸出現的緯度比西岸低。"}, {"stem": "北美洲的溫帶大陸性氣候區（北美大平原一帶）因年降水量較少、年溫差大，當地常見的耐寒耐旱作物是？", "opts": [["A", "小麥、玉米、棉花"], ["B", "水稻、甘蔗"], ["C", "葡萄、橄欖"], ["D", "咖啡、可可"]], "ans": "A", "exp": "溫帶大陸性氣候區年降水量較少、年溫差大，當地以種植耐寒、耐旱的小麥、玉米、棉花最為常見，形成小麥帶、玉米帶等專業化農作帶。"}, {"stem": "北美洲西側受太平洋板塊推擠，地殼較不穩定，地震較多的地區除阿拉斯加州外，還包括？", "opts": [["A", "德克薩斯州"], ["B", "佛羅里達州"], ["C", "加利福尼亞州"], ["D", "伊利諾州"]], "ans": "C", "exp": "北美洲西側受太平洋板塊推擠，地殼較不穩定，阿拉斯加州及加利福尼亞州是美國地震較多的地區。"}, {"stem": "北美洲山脈多為南北走向，冬季時冷高壓長驅直入，容易造成的天氣災害是？", "opts": [["A", "颶風"], ["B", "乾旱"], ["C", "龍捲風"], ["D", "暴風雪"]], "ans": "D", "exp": "北美洲山脈多南北走向，冬季冷高壓可長驅直入，氣溫驟降且經常伴隨暴風雪。"}, {"stem": "北美大平原在春、夏季節交替時，因冷暖氣團交會，容易形成的天氣災害是？", "opts": [["A", "暴風雪"], ["B", "颶風"], ["C", "森林大火"], ["D", "龍捲風"]], "ans": "D", "exp": "春、夏季節交替時冷、暖氣團在北美大平原交會，容易形成龍捲風。"}, {"stem": "北美洲夏、秋兩季常侵襲東南沿海及墨西哥灣沿岸的天氣災害，主要來自？", "opts": [["A", "太平洋的颱風"], ["B", "北極海的寒潮"], ["C", "加勒比海的颶風"], ["D", "印度洋的季風"]], "ans": "C", "exp": "北美洲夏、秋兩季常有來自加勒比海的颶風侵襲東南沿海及墨西哥灣沿岸一帶。"}, {"stem": "北美洲西部地區夏季常發生的天氣災害是？", "opts": [["A", "颶風"], ["B", "乾旱與森林火災"], ["C", "暴風雪"], ["D", "龍捲風"]], "ans": "B", "exp": "北美洲西部地區夏季常發生乾旱現象，連日高溫及乾燥，容易引起森林火災。"}, {"stem": "北美洲的原住民族主要為印第安人與分布於北極海沿岸的？", "opts": [["A", "因紐特人"], ["B", "印加人"], ["C", "馬雅人"], ["D", "阿茲提克人"]], "ans": "A", "exp": "北美洲的原住民族以印第安人及分布於北極海沿岸的因紐特人為主。"}, {"stem": "16世紀起大量移民北美洲、開墾土地從事農耕，來源以英、法兩國為主的移民族群是？", "opts": [["A", "歐洲移民"], ["B", "非洲移民"], ["C", "亞洲移民"], ["D", "拉丁美洲移民"]], "ans": "A", "exp": "自16世紀起，大量歐洲移民（以英、法兩國為主）陸續遷入北美洲開墾土地、從事農耕，改變了北美的族群組成與產業活動。"}, {"stem": "早期因開墾需要而被大量引進北美洲的非洲勞工，其身分主要屬於？", "opts": [["A", "技術移民"], ["B", "奴隸"], ["C", "投資移民"], ["D", "留學生"]], "ans": "B", "exp": "因開墾土地的勞力需求，早期北美洲大量引進非洲勞工，這些勞工當時多以奴隸身分被引進。"}, {"stem": "亞裔移民在19世紀中葉大量移入北美洲西岸，主要與下列何種建設有關？", "opts": [["A", "高速公路建設"], ["B", "水力發電建設"], ["C", "國家公園開發"], ["D", "鐵路工程建設"]], "ans": "D", "exp": "亞裔移民在19世紀中葉達到高峰，主要分布於北美洲西海岸，與當時的鐵路工程建設有關。"}, {"stem": "美國西南部之所以有不少西班牙裔移民，主要是因為當地歷史上曾被哪一國殖民？", "opts": [["A", "法國"], ["B", "英國"], ["C", "西班牙"],   }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){

  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;

  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>

<script>
const QS=[{"stem": "從十五世紀起，歐洲人開始入侵漠南非洲，最初主要從事下列何種活動？", "opts": [["A", "奴隸買賣"], ["B", "開採石油"], ["C", "發展觀光業"], ["D", "推廣公平貿易"]], "ans": "A", "exp": "課本提到「從十五世紀開始，歐洲人相繼入侵漠南非洲，從事奴隸買賣活動，隨後更展開長期的殖民統治」。"}, {"stem": "歐洲列強殖民非洲時，多依據何種方式劃定勢力範圍，導致獨立後族群衝突頻傳？", "opts": [["A", "依高山峻嶺"], ["B", "依經緯線"], ["C", "依河流分布"], ["D", "依語言分布"]], "ans": "B", "exp": "歐洲列強彼此協議劃定勢力範圍時多依經緯線劃分，並未考慮當地族群的傳統領域，導致獨立後同一族群分布在不同國家，或同一國家內有相互敵對的族群。"}, {"stem": "下列關於盧安達內戰的敘述，何者正確？", "opts": [["A", "是因為石油資源分配不均"], ["B", "圖西族人口多但貧窮"], ["C", "胡圖族與圖西族均屬班圖人，體格、語言差異不大"], ["D", "內戰因法國殖民政策引起"]], "ans": "C", "exp": "盧安達人口主要由胡圖族與圖西族組成，兩者皆屬班圖人，體格、語言和文化差異不大，是德國、比利時的殖民政策埋下衝突種子，而非法國。"}, {"stem": "盧安達內戰中，殖民時期德國與比利時選擇哪個族群作為統治階級，種下日後衝突的種子？", "opts": [["A", "胡圖族"], ["B", "祖魯族"], ["C", "班圖族"], ["D", "圖西族"]], "ans": "D", "exp": "德國和比利時先後殖民時，選擇人口較少但較富有的圖西族作為統治階級，造成日後胡圖族掌權後對圖西族的報復。"}, {"stem": "盧安達獨立後掌握政權的是哪一族群，並對另一族群展開報復？", "opts": [["A", "胡圖族"], ["B", "圖西族"], ["C", "祖魯族"], ["D", "布須曼族"]], "ans": "A", "exp": "獨立後人口數較多的胡圖族掌握了盧安達政權，開始對圖西族報復，西元1990年圖西族進行顛覆政府活動，胡圖族則展開鎮壓與大規模屠殺。"}, {"stem": "南非慶伯利城市邊緣著名的礦坑，主要開採何種礦產？", "opts": [["A", "黃金"], ["B", "鑽石"], ["C", "石油"], ["D", "銅礦"]], "ans": "B", "exp": "課本提到南非慶伯利城市邊緣的鑽石礦坑，曾挖掘出大量鑽石，是南非重要的礦產出口項目之一。"}, {"stem": "幾內亞灣沿岸蘊藏豐富的何種礦產資源？", "opts": [["A", "鑽石"], ["B", "黃金"], ["C", "石油"], ["D", "鐵礦"]], "ans": "C", "exp": "課本提到「幾內亞灣沿岸蘊藏著大量石油資源」，圖中並展示加彭的石油鑽井平臺。"}, {"stem": "下列何者是南非重要的出口礦產？", "opts": [["A", "煤與天然氣"], ["B", "鋁與錫"], ["C", "銀與鉑金"], ["D", "黃金與鑽石"]], "ans": "D", "exp": "課本提到殖民者利用當地廉價勞力開採礦產，例如在南非開採黃金與鑽石，這是南非重要的礦產外銷項目。"}, {"stem": "波札那仰賴哪種礦產的開採和出口，使其人均GDP在漠南非洲各國中名列前茅，但愛滋病盛行率仍居高不下？", "opts": [["A", "鑽石"], ["B", "黃金"], ["C", "石油"], ["D", "銅礦"]], "ans": "A", "exp": "波札那仰賴鑽石開採和出口，2024年人均GDP在漠南非洲各國中排名第4位，但愛滋病盛行率至今仍居高不下，顯示經濟發展並非擺脫疾病問題的唯一條件。"}, {"stem": "漠南非洲礦產資源豐富的主要原因為何？", "opts": [["A", "火山活動頻繁形成新礦脈"], ["B", "地質古老，蘊藏豐富多樣的礦產資源"], ["C", "板塊擠壓造山運動旺盛"], ["D", "冰河作用侵蝕出露礦層"]], "ans": "B", "exp": "課本說明漠南非洲「地質古老，蘊藏豐富多樣的礦產資源」，因此採礦業是本區重要的產業活動之一。"}, {"stem": "「殖民地式經濟」的主要意涵為何？", "opts": [["A", "殖民者投入資金培養當地人才"], ["B", "當地政府主導產業並均分利潤"], ["C", "殖民者掠奪殖民地農礦資源、以廉價勞力開採，利潤多歸殖民者"], ["D", "以當地傳統自給自足經濟為主"]], "ans": "C", "exp": "課本定義「殖民地式經濟」為殖民者掠奪殖民地農、礦資源的經濟模式，以廉價勞力開採礦產、發展熱帶栽培業，實際耕種或開採者收入有限。"}, {"stem": "歐洲殖民者在非洲西部大量發展下列何種經濟作物？", "opts": [["A", "小麥"], ["B", "茶葉"], ["C", "大豆"], ["D", "可可"]], "ans": "D", "exp": "課本提到殖民者在非洲西部大量種植可可等經濟作物，全球有70%以上的可可生產於非洲西部。"}, {"stem": "「熱帶栽培業」是指下列何種農業型態？", "opts": [["A", "在熱帶地區以企業化方式大規模種植經濟作物的集約式農業"], ["B", "遊牧民族逐水草而居的粗放畜牧"], ["C", "山地原住民的輪耕燒墾"], ["D", "灌溉密集的水稻栽培"]], "ans": "A", "exp": "課本明確定義：「熱帶栽培業是在熱帶地區以企業化的方式，大規模種植經濟作物的集約式農業活動」。"}, {"stem": "迦納農人主要收成何種經濟作物？", "opts": [["A", "咖啡"], ["B", "可可"], ["C", "棉花"], ["D", "花生"]], "ans": "B", "exp": "課本圖說提到「迦納的農人收成可可」，迦納也是西元1993年成立瓜帕可可農民合作社推動公平貿易的國家。"}, {"stem": "烏干達農人主要收成何種作物？", "opts": [["A", "可可"], ["B", "茶葉"], ["C", "咖啡"], ["D", "甘蔗"]], "ans": "C", "exp": "課本圖說提到「烏干達的農人收成咖啡果」，顯示咖啡也是烏干達重要的經濟作物。"}, {"stem": "衣索比亞是非洲最大的哪種作物生產國？", "opts": [["A", "可可"], ["B", "棉花"], ["C", "香蕉"], ["D", "咖啡"]], "ans": "D", "exp": "課本提到「衣索比亞是非洲最大的咖啡生產國」，政府並替其著名咖啡豆的產地申請商標，以提高品牌知名度和價格。"}, {"stem": "衣索比亞政府為改善農民生活，替該國咖啡豆採取何種策略？", "opts": [["A", "替咖啡豆申請商標，提高品牌知名度與價格"], ["B", "降低出口關稅"], ["C", "全面國有化咖啡產業"], ["D", "禁止外資進入咖啡產業"]], "ans": "A", "exp": "課本提到衣索比亞政府替該國著名咖啡豆的產地在美國申請商標，藉此提高品牌知名度和咖啡豆價格，同時吸引外資設廠。"}, {"stem": "依可可觀測網（Cocoa Barometer）西元2015年資料，消費者購買一塊巧克力所付出的金額中，可可農僅能獲得約多少比例？", "opts": [["A", "60%"], ["B", "6%"], ["C", "26%"], ["D", "40%"]], "ans": "B", "exp": "課本提到根據可可觀測網於西元2015年的資料顯示，可可農只能得到巧克力售價分配金額的6%，凸顯利潤分配的不公平。"}, {"stem": "可可貿易的利潤多為何者所占有？", "opts": [["A", "當地政府"], ["B", "農民合作社"], ["C", "大企業"], ["D", "消費者"]], "ans": "C", "exp": "課本說明受早期殖民地式經濟框架影響，可可生產的利潤多為大企業所占有，農民的實際收入非常微薄。"}, {"stem": "巧克力製造國多為已開發國家（如荷蘭、德國、美國），可可豆生產國多為開發中國家（如象牙海岸、迦納、奈及利亞），這種現象隱含的意義為何？", "opts": [["A", "巧克力製造需要高溫氣候"], ["B", "開發中國家較擅長巧克力加工技術"], ["C", "已開發國家氣候較適合種植可可"], ["D", "已開發國家掌控加工與利潤，開發中國家僅提供原料"]], "ans": "D", "exp": "這正呼應「殖民地式經濟」與「不公平貿易」的概念：開發中國家生產低價原料，已開發國家從事加工並掌握主要利潤。"}, {"stem": "西元1993年，迦納可可農民在西方貿易商協助下組成哪一個公平貿易合作社？", "opts": [["A", "瓜帕可可農民合作社"], ["B", "無國界醫生組織"], ["C", "非洲大陸自由貿易區"], ["D", "國際公平貿易組織"]], "ans": "A", "exp": "課本提到西元1993年，迦納可可農民組成瓜帕可可（Kuapa Kokoo）農民合作社，用公平貿易模式銷售可可豆，因運作透明而吸引大量鄉鎮與農民加入。"}, {"stem": "公平貿易制度的主要目的為何？", "opts": [["A", "降低農民收購價格以刺激消費"], ["B", "保障農民合理收購價格，減少市場價格波動傷害"], ["C", "鼓勵農民改種糧食作物取代經濟作物"], ["D", "由跨國企業直接經營農場"]], "ans": "B", "exp": "公平貿易試圖以保障價格向農民收購作物，讓農民得以維持生計、永續經營農場，並確保以對環境友善的方式耕種。"}, {"stem": "依課文內容，象牙海岸出現大規模林木砍伐現象，最可能與下列何者有關？", "opts": [["A", "政府嚴格保護森林政策"], ["B", "當地缺乏勞動力"], ["C", "可可豆國際市場價格波動、農場收入不穩定"], ["D", "可可需求下降導致農民轉種樹木"]], "ans": "C", "exp": "課本描述農場主人坦言因可可豆國際市場價格波動不定，農場年收入不穩定，加上缺乏電力與機械設備，促使他僱用童工並擴大栽培面積，衍生林地開發問題。"}, {"stem": "為改善漠南非洲可可農場僱用童工等問題，下列何種措施最有助益？", "opts": [["A", "強化邊境管制防止童工入境"], ["B", "簽署自由貿易協定降低關稅"], ["C", "改善交通運輸降低人口移動成本"], ["D", "透過公平貿易提升經濟發展與生活水準"]], "ans": "D", "exp": "課本指出透過公平貿易的手段，提升農民的經濟發展與生活水準，才能減少農場對童工的依賴，這是最直接對症下藥的做法。"}, {"stem": "漠南非洲人口成長快速的原因，下列敘述何者正確？", "opts": [["A", "死亡率因醫療資源改善而下降，出生率因缺乏避孕知識仍偏高"], ["B", "死亡率與出生率同時上升"], ["C", "出生率下降但死亡率上升"], ["D", "移入人口大量增加"]], "ans": "A", "exp": "課本說明漠南非洲人口快速成長的兩大原因：其一為國際醫療資源使死亡率顯著下降；其二為農礦業發展需大量勞動力，加上缺乏避孕知識，使出生率持續偏高。"}, {"stem": "漠南非洲各國普遍面臨何種勞動力困境，使產業升級陷入困境？", "opts": [["A", "勞動力不足"], ["B", "充足卻低素質的勞動力"], ["C", "高素質但數量稀少的勞動力"], ["D", "勞動力大量外移"]], "ans": "B", "exp": "課本提到「充足卻低素質的勞動力，使非洲產業升級陷入困境」，這是漠南非洲經濟發展的重要限制之一。"}, {"stem": "下列關於漠南非洲經濟發展現況的敘述，何者正確？", "opts": [["A", "大多國家工業高度發展"], ["B", "出口高價工業產品換取廉價原料"], ["C", "過度依賴單一經濟作物或礦產出口"], ["D", "對外貿易高度多元化"]], "ans": "C", "exp": "課本指出漠南非洲許多國家基礎設施不足、工業發展受限，經濟上過度依賴單一經濟作物或礦產為主要收入來源，並以低價農礦原料換取昂貴工業產品。"}, {"stem": "西元2023年全球前10名人均GDP最低的國家，主要集中在下列哪個區域？", "opts": [["A", "東南亞"], ["B", "中南美洲"], ["C", "中東地區"], ["D", "漠南非洲"]], "ans": "D", "exp": "課本提到西元2023年全球前10名人均GDP最低的國家均位於漠南非洲，反映當地居民生活普遍窮困。"}, {"stem": "漠南非洲居民長期營養不良、免疫力低下，容易感染下列何種傳染病？", "opts": [["A", "肺結核、痢疾"], ["B", "流行性感冒"], ["C", "狂犬病"], ["D", "登革熱"]], "ans": "A", "exp": "課本指出貧窮、戰亂、饑荒導致生活品質每況愈下，長期營養不良使免疫力低下，讓漠南非洲居民飽受肺結核、痢疾等傳染病之苦。"}, {"stem": "依課本內容，漠南非洲愛滋病患者人數超過多少萬人，形成嚴重的社會問題？", "opts": [["A", "500萬"], ["B", "2000萬"], ["C", "1000 AD）於2021年底公布的數據：非洲內部貿易額僅占非洲對外出口總額的14%，顯示非洲內部貿易比例偏低。"}, {"stem": "綜合本課內容，下列哪一項最能反映漠南非洲擺脫貧窮的長期發展方向？", "opts": [["A", "持續仰賴單一農礦原料出口不做改變"], ["B", "兼顧產業升級、公平貿易、基礎建設與區域合作等多元策略"], ["C", "完全依賴國際捐款維持生活"], ["D", "限制人口成長為唯一解方"]], "ans": "B", "exp": "綜合課本內容，漠南非洲各國正透過促進產業發展、強化基礎設施、推動公平貿易、爭取國際援助以及區域自由貿易協定等多元策略，逐步改善經濟與生活環境，並非單靠某一項措施。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

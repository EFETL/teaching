<script>
const QS=[{"stem": "美洲依文化差異可分為「盎格魯美洲」與「拉丁美洲」，兩者最主要的區分依據是什麼？", "opts": [["A", "氣候類型不同"], ["B", "受歐洲殖民母國影響的語言與文化不同（英語文化／拉丁文化）"], ["C", "地形高低起伏不同"], ["D", "人口數量多寡不同"]], "ans": "B", "exp": "北美洲的美國、加拿大因語言、文化受英國影響大，稱為「盎格魯美洲」；中南美洲昔日被西班牙、葡萄牙殖民，語言、文化受拉丁文化影響，稱為「拉丁美洲」，兩者的區分主要依語言文化而非地形氣候。"}, {"stem": "中美洲與南美洲的分界，一般是以下列何者為界？", "opts": [["A", "墨西哥"], ["B", "加勒比海"], ["C", "洛磯山脈"], ["D", "巴拿馬"]], "ans": "D", "exp": "中南美洲又以巴拿馬為界，再細分為中美洲與南美洲。"}, {"stem": "北美洲因語言、文化受英國影響大，因此又被稱為？", "opts": [["A", "盎格魯美洲"], ["B", "拉丁美洲"], ["C", "新大陸"], ["D", "美利堅合眾國"]], "ans": "A", "exp": "北美洲指以英語為主要語言的美國、加拿大，因文化受英國影響大，故稱為「盎格魯美洲」。"}, {"stem": "北美洲三大地形區中，位於西部、地勢高聳的山脈是？", "opts": [["A", "阿帕拉契山脈"], ["B", "拉布拉多高原"], ["C", "洛磯山脈"], ["D", "大分水嶺山脈"]], "ans": "C", "exp": "北美洲大致可分為西部高山（洛磯山脈）、中部平原（北美大平原）、東部高原丘陵三大地形區。"}, {"stem": "洛磯山脈地勢高聳、火山地震頻繁，主要是受到下列哪兩個板塊擠壓的影響？", "opts": [["A", "歐亞板塊與北美板塊"], ["B", "南美板塊與加勒比板塊"], ["C", "太平洋板塊與北美板塊"], ["D", "印度板塊與歐亞板塊"]], "ans": "C", "exp": "洛磯山脈西側沿海位於太平洋板塊與北美板塊擠壓帶，屬環太平洋火山地震帶的一部分，火山、地震活動頻繁。"}, {"stem": "北美大平原北部因受冰河侵蝕，地形上的顯著特徵是？", "opts": [["A", "多冰蝕湖"], ["B", "多峽灣"], ["C", "多沙丘"], ["D", "多火山口湖"]], "ans": "A", "exp": "北美大平原北部曾受冰河作用影響，土壤貧瘠、地表較崎嶇，且多冰蝕湖，如美、加邊境的五大湖。"}, {"stem": "五大湖是美國與下列哪一國的邊境湖泊？", "opts": [["A", "墨西哥"], ["B", "古巴"], ["C", "巴哈馬"], ["D", "加拿大"]], "ans": "D", "exp": "北美大平原北部多冰蝕湖，其中五大湖即位於美國與加拿大的邊境。"}, {"stem": "北美大平原南部因哪一條河流沖積而成，土壤肥沃、是重要的農業區？", "opts": [["A", "科羅拉多河"], ["B", "密西西比河"], ["C", "聖羅倫斯河"], ["D", "育空河"]], "ans": "B", "exp": "北美大平原南部為密西西比河沖積而成的平原，土壤肥沃，是重要的農業帶。"}, {"stem": "北美洲東部高原丘陵區的主體地形，除了拉布拉多高原外，還包括下列何者？", "opts": [["A", "洛磯山脈"], ["B", "喀斯開山脈"], ["C", "內華達山脈"], ["D", "阿帕拉契山脈"]], "ans": "D", "exp": "東部高原丘陵區北起拉布拉多高原，南部則以阿帕拉契山脈為主體。"}, {"stem": "北美洲東部高原丘陵區雖然礦產豐富，但地勢較西部低緩許多，主要原因是？", "opts": [["A", "位於板塊張裂帶，地層下陷"], ["B", "地質古老，經長時間侵蝕"], ["C", "長期受冰河覆蓋尚未抬升"], ["D", "人為大量開採而剷平"]], "ans": "B", "exp": "東部高原丘陵區屬古老陸塊，礦產豐富，但因地質古老、經長年侵蝕，山勢已不高、地勢平緩。"}, {"stem": "舉世聞名的科羅拉多大峽谷，是由下列哪一條河流歷經萬年切割而成？", "opts": [["A", "密西西比河"], ["B", "哥倫比亞河"], ["C", "科羅拉多河"], ["D", "格蘭河"]], "ans": "C", "exp": "科羅拉多大峽谷是科羅拉多河耗費萬年切割出的著名景觀，位於洛磯山脈南段附近。"}, {"stem": "北美洲各地氣候差異大，主要受緯度、地形、風向、洋流及下列何者影響？", "opts": [["A", "距海遠近"], ["B", "人口密度"], ["C", "農業型態"], ["D", "政治制度"]], "ans": "A", "exp": "北美洲氣候主要受緯度、地形、風向、洋流、距海遠近等自然因素影響，呈現多樣的氣候變化。"}, {"stem": "北美洲西部洛磯山區因地勢高聳，形成何種氣候類型？", "opts": [["A", "高地氣候"], ["B", "溫帶大陸性氣候"], ["C", "溫帶地中海型氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "洛磯山區因地勢高，氣溫較低，屬於高地氣候。"}, {"stem": "北緯40至60度的北美洲西岸地區，終年受西風與下列哪一暖流影響，形成溫帶海洋性氣候？", "opts": [["A", "墨西哥灣流"], ["B", "黑潮"], ["C", "阿拉斯加暖流"], ["D", "巴西暖流"]], "ans": "C", "exp": "北緯40～60度的西岸地區終年受西風與阿拉斯加暖流影響，全年有雨，形成溫帶海洋性氣候。"}, {"stem": "北美洲的溫帶海洋性氣候僅分布在狹長的西岸地帶，不像歐洲深入內陸，主要原因是？", "opts": [["A", "北美洲緯度較低"], ["B", "北美洲山脈多南北走向，阻擋西風水氣深入內陸"], ["C", "北美洲面積較小"], ["D", "北美洲沿岸沒有暖流經過"]], "ans": "B", "exp": "北美洲山脈南北走向且鄰近西岸，阻擋西風帶來的水氣往內陸擴散，因此海洋性氣候僅分布在狹長的沿海地帶，與歐洲山脈東西走向、平原廣布的情形不同。"}, {"stem": "北美洲西岸北緯30至40度地區，夏季受副熱帶高壓籠罩、冬季受西風影響，降水呈現夏乾冬雨，屬於？", "opts": [["A", "溫帶大陸性氣候"], ["B", "溫帶沙漠氣候"], ["C", "夏雨型暖溫帶氣候"], ["D", "溫帶地中海型氣候"]], "ans": "D", "exp": "北緯30～40度的太平洋沿岸，受副熱帶高壓與西風影響，降水特徵為夏乾冬雨，屬溫帶地中海型氣候。"}, {"stem": "北美洲西南部內陸因冬季山脈阻擋西風水氣，降水稀少，形成？", "opts": [["A", "溫帶地中海型氣候"], ["B", "高地氣候"], ["C", "溫帶沙漠氣候"], ["D", "寒帶氣候"]], "ans": "C", "exp": "美國西南部內陸因位於西風背風側，山脈阻擋水氣，降水量稀少，形成溫帶沙漠氣候。"}, {"stem": "洛磯山脈以東的北美大平原及其以東地區，因陸地廣大平坦、冷暖氣流可長驅直入，年溫差大，屬於？", "opts": [["A", "溫帶海洋性氣候"], ["B", "溫帶地中海型氣候"], ["C", "高地氣候"], ["D", "溫帶大陸性氣候"]], "ans": "D", "exp": "北緯40度以北的北美大平原及其以東地區，陸地廣大且地形平坦，冬季寒冷氣流及夏季暖溼氣流可長驅直入，氣溫變化劇烈、年溫差大，屬溫帶大陸性氣候。"}, {"stem": "北美洲東南部沿海地區因緯度較低、受暖流及夏季信風影響，氣候溫暖潮溼，夏秋常有颶風，屬於？", "opts": [["A", "夏雨型暖溫帶氣候"], ["B", "溫帶大陸性氣候"], ["C", "溫帶地中海型氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "東南部及沿海一帶因緯度較低，受海洋水氣與暖流影響，氣候暖溼，夏、秋季節常有颶風侵襲，屬夏雨型暖溫帶氣候。"}, {"stem": "加拿大中、北部及美國阿拉斯加因緯度高，冬季酷寒、冬夏溫差大，屬於？", "opts": [["A", "高地氣候"], ["B", "寒帶氣候"], ["C", "溫帶大陸性氣候"], ["D", "溫帶海洋性氣候"]], "ans": "B", "exp": "加拿大中、北部地區及美國阿拉斯加緯度較高，氣候嚴寒，冬夏溫差大，屬寒帶氣候。"}, {"stem": "北美洲東岸出現寒帶氣候的緯度會比西岸低，主要原因是？", "opts": [["A", "東岸地勢較高"], ["B", "東岸沿岸為寒流、西岸沿岸為暖流，使東岸同緯度較寒冷"], ["C", "東岸距海較遠"], ["D", "東岸多地形雨"]], "ans": 惠，吸引大量外資設立加工出口區？", "opts": [["A", "歐洲聯盟"], ["B", "美墨加協定（USMCA）"], ["C", "東南亞國協"], ["D", "南方共同市場"]], "ans": "B", "exp": "墨西哥為美墨加協定（USMCA）成員，因工資低廉、關稅減免等優惠條件，吸引以美國為首的外資在邊界一帶設立許多加工出口區。"}, {"stem": "目前墨西哥最主要的工業產品與出口品為？", "opts": [["A", "咖啡與香蕉"], ["B", "紡織品與成衣"], ["C", "電子產品與汽車"], ["D", "木材與紙漿"]], "ans": "C", "exp": "電子產品與汽車已成為墨西哥最主要的工業與出口品，這與加工出口區的設立及外資投入密切相關。"}, {"stem": "巴西近年致力發展再生能源，將甘蔗（蔗糖）提煉成何種燃料，以取代部分原油進口需求？", "opts": [["A", "氫氣"], ["B", "天然氣"], ["C", "汽油"], ["D", "乙醇"]], "ans": "D", "exp": "巴西近年致力發展再生能源工業，將蔗糖提煉為乙醇作為汽車燃料使用，藉此取代對原油大量進口的需求。"}, {"stem": "中南美洲城鄉發展差異大的原因之一，與殖民時期修築的港口及鐵路主要用途有關，下列敘述何者正確？", "opts": [["A", "港口鐵路主要用於運輸農礦產品出口，導致鄉村其他基礎建設不足"], ["B", "港口鐵路平均分布於全國各地，城鄉發展並無差異"], ["C", "殖民者重視鄉村建設勝過都市"], ["D", "港口鐵路主要用於觀光旅遊"]], "ans": "A", "exp": "昔日殖民者主要修築港口及鐵路以運輸農礦產品，造成鄉村地區基礎建設不足，城鄉發展差異因而擴大。"}, {"stem": "中南美洲大都市邊緣常見的貧民窟，其形成的主要原因是？", "opts": [["A", "政府刻意規劃的低價住宅區"], ["B", "鄉村人口因貧窮遷往都市，卻無法立即就業"], ["C", "都市房價過於便宜"], ["D", "外國移民大量湧入"]], "ans": "B", "exp": "因土地掌握在大地主手中，鄉村地區普遍貧窮，人口為了就業由鄉村移動到都市，部分人口無法立即就業，便在都市邊緣居住形成貧民窟。"}, {"stem": "中南美洲人口分布集中在低緯度高地及沿海地區，下列哪個城市屬於因高地氣候涼爽而發展的高地都市？", "opts": [["A", "里約熱內盧"], ["B", "布宜諾斯艾利斯"], ["C", "墨西哥市"], ["D", "哈瓦那"]], "ans": "C", "exp": "低緯地區因潮溼悶熱，人口多集中於涼爽的高地或山間盆地，如墨西哥市、拉巴斯等；里約熱內盧、布宜諾斯艾利斯則屬於沿海港埠型都市。"}, {"stem": "巴西為了平衡區域發展、縮小城鄉差距，曾將首都從沿海的里約熱內盧遷往哪座內陸城市？", "opts": [["A", "聖保羅"], ["B", "薩爾瓦多"], ["C", "貝倫"], ["D", "巴西利亞"]], "ans": "D", "exp": "為縮小城鄉差距、平衡區域發展，巴西將首都遷移至內陸的巴西利亞。"}, {"stem": "亞馬孫盆地的熱帶雨林約占全球熱帶雨林總面積的多少比例，其中又約有多少比例位於巴西境內？", "opts": [["A", "占全球一半以上；巴西境內約60%"], ["B", "占全球不到十分之一；巴西境內約10%"], ["C", "占全球四分之一；巴西境內約30%"], ["D", "占全球三分之一；巴西境內約90%"]], "ans": "A", "exp": "南美洲的亞馬孫盆地是世界最大的熱帶雨林區，占全球熱帶雨林總面積的一半以上，其中約60%在巴西境內。"}, {"stem": "熱帶雨林被稱為「地球之肺」，主要是因為它具有下列哪一項功能？", "opts": [["A", "儲存大量地下水資源"], ["B", "提供大量氧氣、有助於調節氣候"], ["C", "能阻擋颱風侵襲"], ["D", "可產生大量水力發電"]], "ans": "B", "exp": "熱帶雨林被稱為「地球之肺」，提供氧氣以供生物生存，孕育豐富生態，也具有水土保持和氣候調節的功能。"}, {"stem": "1960年代以來，亞馬孫雨林面積大量縮小，其主要原因是？", "opts": [["A", "氣候變遷導致雨林自然枯萎"], ["B", "火山爆發燒毀大片森林"], ["C", "人口激增使土地需求增加，大片森林為發展農、林、牧、礦業而遭砍伐"], ["D", "病蟲害大量蔓延"]], "ans": "C", "exp": "1960年代以來，由於人口激增，對土地的需求增加，為了發展農、林、牧、礦業，大片森林遭到砍伐，使熱帶雨林面積縮小。"}, {"stem": "大規模砍伐熱帶雨林，主要透過下列哪一種機制加劇全球暖化？", "opts": [["A", "森林減少使地表反射的陽光增加"], ["B", "砍伐雨林會直接產生大量甲烷氣體"], ["C", "雨林消失會使地球自轉速度變慢"], ["D", "森林減少使光合作用能吸收的二氧化碳量降低，導致大氣中二氧化碳增加"]], "ans": "D", "exp": "森林面積減少，會減少光合作用所吸收的二氧化碳與製造的氧氣，使大氣中二氧化碳增加，加劇溫室效應與全球暖化。"}, {"stem": "「雨林聯盟」（Rainforest Alliance）是什麼性質的組織，其主要作法為何？", "opts": [["A", "1980年代成立的世界性非政府組織，透過傳統農業技術與市場認證機制防止雨林濫墾"], ["B", "由各國政府組成的軍事聯盟，以武力保護雨林"], ["C", "聯合國轄下負責維和的專責部隊"], ["D", "專門收購雨林土地以開發觀光的企業聯盟"]], "ans": "A", "exp": "「雨林聯盟」是1980年代開始發展的世界性非政府組織，推動以傳統農業技術防止雨林濫墾開發，並透過市場合格認證機制推動綠色消費來保護雨林。"}, {"stem": "消費者選購具有「雨林聯盟認證標章」的商品（如雨林咖啡），主要是透過下列何種方式來保護雨林？", "opts": [["A", "直接捐款給當地政府造林"], ["B", "綠色消費，選擇對環境友善、保障農民權益的產品"], ["C", "拒絕購買任何中南美洲生產的商品"], ["D", "要求政府關閉所有雨林中的農場"]], "ans": "B", "exp": "雨林咖啡種植在雨林大樹的樹蔭下，不需大量砍伐雨林即可種植；透過購買雨林聯盟認證商品的綠色消費行為，可間接降低雨林生態破壞、改善當地居民生活。"}, {"stem": "西元2019年8月，巴西亞馬孫雨林發生大量火災，根據報導與研究員的說法，這場大火主要應歸咎於？", "opts": [["A", "純粹是自然乾季造成的天災，與人為因素無關"], ["B", "外國環保團體蓄意縱火所致"], ["C", "人禍，火災的發生與森林開發（焚林）面積增加有關"], ["D", "野生動物活動所引發"]], "ans": "C", "exp": "報導指出2019年8月亞馬孫雨林火災次數比前一年同期增加八成以上，研究員表示無論故意或偶然，起火都是人為造成的，與森林開發面積增加有關，屬於人禍。"}, {"stem": "巴西農夫盧卡斯原本在聖保羅州種植咖啡，後來決定搬遷到亞馬孫雨林改種大豆，其主要考量因素為何？", "opts": [["A", "政府強制規定不可再種植咖啡"], ["B", "聖保羅州的咖啡樹已經全部枯死"], ["C", "大豆比咖啡更耐旱、適應力更強"], ["D", "大豆的種植成本較低，且國際市場收購價格多高於生產成本，收益較穩定"]], "ans": "D", "exp": "咖啡的國際市場價格有些年份會低於生產成本，而大豆的市場價格則多高於生產成本，因此盧卡斯決定改種大豆以獲得較穩定的收入。"}, {"stem": "根據課本內容，部分美式速食連鎖企業所使用的肉品，以及飼養牲畜所需的大豆，多數產地與下列哪個地區的雨林開發有密切關係？", "opts": [["A", "巴西亞馬孫雨林"], ["B", "東南亞雨林"], ["C", "中非剛果雨林"], ["D", "印尼雨林"]], "ans": "A", "exp": "根據綠色和平組織指出，美國多家知名速食連鎖企業使用的肉品及飼養牲畜所需的大豆，多數產地來自巴西的亞馬孫雨林地區，隨著肉品需求增加，雨林遭破壞的問題日漸惡化。"}, {"stem": "關於「亞馬孫雨林的開發與保育」議題，下列敘述何者最為適切？", "opts": [["A", "保育雨林與經濟發展兩者毫無關係，不必一併考量"], ["B", "開發雨林對經濟發展有幫助，但也會破壞生態環境，如何在兩者間取得平衡、邁向永續發展，是各界持續關注的重要議題"], ["C", "開發雨林完全不具備任何經濟效益"], ["D", "雨林開發與否只由巴西一國決定，其他國家不必關心"]], "ans": "B", "exp": "在雨林區開發農牧礦業能帶來經濟產值，也能幫助當地貧困農民脫離貧窮，但同時會破壞生態、影響全球氣候調節功能，如何兼顧經濟發展與雨林保育、達到永續發展目標，是重要的探究課題。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

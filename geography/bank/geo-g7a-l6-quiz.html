<script>
const QS=[{"stem": "下列關於「水循環」的敘述，何者正確？", "opts": [["A", "水循環只發生在海洋與大氣之間，與陸地無關"], ["B", "水循環的能量來源主要是地球內部的地熱"], ["C", "地表的水經蒸發、蒸散後化為水氣，再經凝結、降水回到地表，是水循環的過程"], ["D", "降落到地面的水全部會流入海洋，不會滲入地下"]], "ans": "C", "exp": "地球上的水藉由太陽熱能產生蒸發（與植物的蒸散）作用，轉換成水氣進入大氣層，再經凝結與降水回到地表，部分成為地表逕流、部分入滲成為地下水，最終流入海洋，這個周而復始的過程稱為水循環，能量來源是太陽而非地熱。"}, {"stem": "「蒸發」與「蒸散」兩者最主要的差別是什麼？", "opts": [["A", "蒸發與蒸散指的是同一種現象，只是用詞不同"], ["B", "蒸發指地表水（如海洋、河川、湖泊）直接由液態轉為氣態；蒸散則是植物根部吸收的水分經葉片氣孔散逸到大氣中"], ["C", "蒸發是液態變氣態，蒸散是氣態變液態"], ["D", "蒸發只發生在陸地，蒸散只發生在海洋"]], "ans": "B", "exp": "蒸發是地表水（海洋、河川、湖泊等）吸收熱量後由液態轉為氣態進入大氣；蒸散則是植物吸收土壤中的水分後，經由葉片氣孔向大氣擴散，兩者合稱「蒸發散」，是水循環中水氣的主要來源。"}, {"stem": "大氣中的水氣上升到高空遇冷，由氣態轉變為液態小水滴（或固態冰晶）而形成雲，這個過程稱為什麼？", "opts": [["A", "入滲"], ["B", "凝結"], ["C", "逕流"], ["D", "降水"]], "ans": "B", "exp": "水氣上升到高空後因溫度降低而凝結，形成雲中的小水滴或冰晶，這個由氣態變成液態（或固態）的過程稱為凝結；水滴聚集到一定程度後落下才稱為降水。"}, {"stem": "雨、雪、冰雹等大氣中凝結的水分落到地表的現象，稱為下列何者？", "opts": [["A", "降水"], ["B", "入滲"], ["C", "地表逕流"], ["D", "地下逕流"]], "ans": "A", "exp": "大氣中凝結的水氣以雨、雪、冰雹等形式降落到地表，稱為降水，是水循環中水氣回到地表最主要的方式。"}, {"stem": "降落到地面的雨水，有一部分會沿著地表及渠道流動，最後匯入河川、湖泊或海洋，這個現象稱為什麼？", "opts": [["A", "地表逕流"], ["B", "蒸散"], ["C", "入滲"], ["D", "分水嶺"]], "ans": "A", "exp": "降至地面的水沿著地表或渠道流動的現象稱為地表逕流，是河川、湖泊主要的水源之一；而滲入土壤內部的水則屬於入滲的過程。"}, {"stem": "雨水或地表水受重力作用，由地面滲入土壤層，並向下滲透到更深處的過程，稱為下列何者？", "opts": [["A", "蒸發"], ["B", "逕流"], ["C", "凝結"], ["D", "入滲"]], "ans": "D", "exp": "降至地面的水由土壤表面滲入土壤內部，並持續向下滲透的過程稱為入滲，入滲的水分部分成為土壤水，部分持續下滲補注地下水層。"}, {"stem": "關於「地下水」的敘述，下列何者正確？", "opts": [["A", "地下水完全無法被人類利用"], ["B", "地下水只存在於高山地區，平原地區沒有地下水"], ["C", "地下水是指降水入滲後，儲存在地下水層中的水，供水量較地表水穩定"], ["D", "地下水是指仍停留在大氣層中尚未降落的水氣"]], "ans": "C", "exp": "降水入滲後，部分滲入地下、儲存在地下水層中，即為地下水。地下水雖不易取得，但具有普遍性、供水量穩定的特性，是重要的水資源，經常用於農業灌溉與養殖漁業。"}, {"stem": "水循環中，入滲及地下逕流之後的水，最終大多會流向何處？", "opts": [["A", "最終注入海洋，並持續參與水循環"], ["B", "全部被植物根部吸收利用"], ["C", "永遠留在土壤中，不會再移動"], ["D", "直接蒸發回到大氣層，不會有其他去向"]], "ans": "A", "exp": "無論是地表逕流或入滲成為地下水，最終大多會流向河川、湖泊，再注入海洋，並經蒸發、蒸散再度進入大氣層，形成周而復始、生生不息的水循環。"}, {"stem": "河流的主流與若干支流共同構成的河流系統，稱為下列何者？", "opts": [["A", "流域"], ["B", "集水區"], ["C", "水系"], ["D", "分水嶺"]], "ans": "C", "exp": "許多小支流匯聚成大支流，大支流再逐步匯集成主流，主流與支流共同組成的河流系統，稱為水系。"}, {"stem": "「河道上某一點的上游區域，其降水皆會匯集流向此點」，這樣的區域稱為什麼？", "opts": [["A", "分水嶺"], ["B", "集水區"], ["C", "荒溪型河川"], ["D", "流域"]], "ans": "B", "exp": "河道上某一點所流過的河水，其來源分布的範圍，稱為該點的集水區；集水區內降下的雨水，最終都會匯集流向這一點。"}, {"stem": "若某條河川的河口為終點，則該河口以上的整個集水區範圍，稱為什麼？", "opts": [["A", "該水系的分水嶺"], ["B", "該水系的攔河堰"], ["C", "該水系的流域"], ["D", "該水系的荒溪"]], "ans": "C", "exp": "集水區是指河道上「某一點」的上游匯水範圍；若此點恰好是河川的出海口（終點），則此處的集水區即為整個水系的流域，也就是該河川所有支流匯集的最大範圍。"}, {"stem": "兩個相鄰集水區（或流域）之間的分界線，通常沿著山脊連線，這條分界線稱為什麼？", "opts": [["A", "地表逕流"], ["B", "分水嶺"], ["C", "水系"], ["D", "集水區"]], "ans": "B", "exp": "山脊的連線常成為相鄰流域或集水區的分界線，稱為分水嶺；降在分水嶺兩側的雨水，會分別流入不同的集水區或流域。"}, {"stem": "某工廠在河川上游甲地排放廢水，下游沿岸有A、B、C三個聚落，若只考慮河川匯流方向，下列判斷何者最合理？", "opts": [["A", "位於甲地下游、且屬於同一集水區內的聚落，最有可能受到甲地廢水汙染的影響"], ["B", "距離甲地越遠的聚落受到的影響一定越大"], ["C", "只要不在同一縣市，就不會受到甲地廢水的影響"], ["D", "廢水只會往上游擴散，不會影響下游"]], "ans": "A", "exp": "集水區內的水會匯流向下游，因此位於汙染源下游、且屬於同一集水區（同一水系）內的聚落，才會受到廢水汙染的直接影響；是否受影響與行政區劃無關，而與集水區、水系的匯流關係有關。"}, {"stem": "臺灣河川的主要分水嶺是下列哪一個地形？", "opts": [["A", "中央山脈"], ["B", "雪山山脈"], ["C", "阿里山山脈"], ["D", "玉山山脈"]], "ans": "A", "exp": "南北縱走的中央山脈是臺灣主要的分水嶺，將臺灣的河川區分為東側水系與西側水系，造成臺灣河川「東西分流」的特色。"}, {"stem": "臺灣河川因中央山脈南北縱走而形成「東西分流」的現象，這對河川長度造成什麼樣的影響？", "opts": [["A", "因為中央山脈位置偏西，所以東部河川普遍較西部河川長"], ["B", "東部與西部河川長度完全相同"], ["C", "東西分流與河川長度沒有任何關係"], ["D", "因為中央山脈位置偏東，所以西部河川普遍較東部河川長"]], "ans": "D", "exp": "由於中央山脈的位置偏東，使得西側的集水區範圍較大，因此臺灣西部河川普遍比東部河川長；東部河川則因分水嶺離海較近而顯得更為短小。"}, {"stem": "臺灣河川普遍具有「坡陡、流急」的特色，其主要成因為何？", "opts": [["A", "臺灣河川主要分布在平原地區，沒有山區"], ["B", "臺灣地勢平坦，河川流速緩慢"], ["C", "臺灣的降水量在世界各國中偏低"], ["D", "臺灣山脈地勢高而險峻，上游集水區地形陡峭，河川在短距離內高度落差變化大"]], "ans": "D", "exp": "臺灣多山且地勢高聳陡峭，河川上游多位於山區，集水區地形陡峭，使河川在很短的距離內就出現很大的高度落差，因而形成坡陡流急、水流湍急的特色。"}, {"stem": "臺灣中南部河川「乾季、雨季流量變化極大」，這一類河川通常被稱為什麼？", "opts": [["A", "荒溪型河川"], ["B", "地下河川"], ["C", "感潮河川"], ["D", "網流河川"]], "ans": "A", "exp": "臺灣中南部因降雨季節分布不均，雨季河水暴漲、乾季河床可能乾涸，河川流量差異極大，這類流量變化劇烈的河川稱為「荒溪型河川」，主要分布在中南部地區。"}, {"stem": "相較於中南部，臺灣「北部」河川的流量特性較接近下列何者？", "opts": [["A", "北部與中南部河川流量特性完全相同"], ["B", "北部四季有雨，河川流量相對較穩定"], ["C", "北部河川一年中有大半時間乾涸見底"], ["D", "北部乾季長達半年以上，河川流量極不穩定"]], "ans": "B", "exp": "臺灣北部因四季都有降雨（東北季風、梅雨、颱風等），河川流量相對穩定；中南部則因乾、雨季分明，流量變化大，形成荒溪型河川，兩者形成明顯對比。"}, {"stem": "臺灣河川普遍「輸砂量（含沙量）偏高」，下列何者是造成此現象最主要的原因？", "opts": [["A", "臺灣河川流速緩慢，泥沙容易沉積"], ["B", "臺灣的水庫都設在河川下游，攔阻不了泥沙"], ["C", "臺灣地質脆弱，加上地勢陡峭、河川流速快、沖刷力強，暴雨容易將大量砂石沖入河川"], ["D", "臺灣河川的長度是世界上最長的"]], "ans": "C", "exp": "臺灣地質脆弱、加上山區坡度陡峭、河川流速快，每逢暴雨便容易將大量砂石沖刷入河，因此臺灣河川的輸砂量（含沙量）普遍偏高，也提高了潔淨水資源的取用成本。"}, {"stem": "「濁水溪」之所以得名，與臺灣河川的哪一項特徵關係最密切？", "opts": [["A", "河川輸砂量高、水色混濁"], ["B", "河川普遍短小"], ["C", "河川東西分流"], ["D", "河川流量終年穩定"]], "ans": "A", "exp": "濁水溪因河水搬運大量泥沙，導致水色長期混濁而得名，正好反映了臺灣河川地質脆弱、坡陡流急、輸砂量偏高的特徵。"}, {"stem": "下列何者「不是」臺灣河川普遍具有的特徵？", "opts": [["A", "河川東西分流、普遍短小"], ["B", "坡陡流急"], ["C", "中南部乾雨季流量變化大"], ["D", "河川終年水量豐沛穩定，泥沙含量極低"]], "ans": "D", "exp": "臺灣河川的共同特徵是東西分流、短小、坡陡流急、輸砂量高，且中南部流量變化大（荒溪型河川），並不具有「終年水量豐沛穩定、泥沙含量極低」的特性，此為錯誤敘述。"}, {"stem": "造成臺灣河川普遍「短小」的主要原因是下列何者？", "opts": [["A", "臺灣河川的下游都建有攔河堰"], ["B", "臺灣島面積狹小，加上中央山脈南北縱走使河川東西分流"], ["C", "臺灣河川的輸砂量偏低"], ["D", "臺灣的年降水量在世界各國中偏低"]], "ans": "B", "exp": "臺灣島本身面積有限，再加上南北縱走的中央山脈為主要分水嶺，使河川呈東西分流，各水系集水區範圍受限，因此臺灣河川普遍短小。"}, {"stem": "臺灣「淡水河」水系主要分布於下列哪一個區域？", "opts": [["A", "東部"], ["B", "南部"], ["C", "北部"], ["D", "中部"]], "ans": "C", "exp": "淡水河為北部主要河川，流域涵蓋大臺北地區，是供應大臺北地區生活用水的重要來源，上游興建有翡翠水庫。"}, {"stem": "有關「濁水溪」的敘述，下列何者正確？", "opts": [["A", "濁水溪是臺灣流域面積最大的河川"], ["B", "濁水溪的水色終年清澈見底"], ["C", "濁水溪主要分布在臺灣南部"], ["D", "濁水溪是臺灣長度最長的河川，上游地勢起伏落差大、水力資源豐富"]], "ans": "D", "exp": "濁水溪是臺灣長度最長的河川，其上游地勢起伏落差大，蘊含豐富的水力資源；因輸砂量大、水色混濁而得名，中游建有集集攔河堰供應彰化、雲林地區用水。"}, {"stem": "有關「高屏溪」的敘述，下列何者正確？", "opts": [["A", "高屏溪主要分布在臺灣北部"], ["B", "高屏溪流域內沒有任何水庫"], ["C", "高屏溪是臺灣長度最長的河川"], ["D", "高屏溪流域範圍最廣，是高雄、屏東地區農業與民生用水的主要來源"]], "ans": "D", "exp": "高屏溪是南部主要河川，流域面積在臺灣河川中範圍最廣，長度僅次於濁水溪，為高雄、屏東地區農業、民生用水的主要來源。"}, {"stem": "依南北位置排列，下列哪一組「河川與分布區域」的配對最為正確？", "opts": [["A", "淡水河—南部；濁水溪—中部；高屏溪—北部"], ["B", "淡水河—中部；濁水溪—北部；高屏溪—南部"], ["C", "淡水河—北部；濁水溪—中部；高屏溪—南部"], ["D", "淡水河—北部；濁水溪—南部；高屏溪—中部"]], "ans" let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

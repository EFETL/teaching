<script>
const QS=[{"stem": "「漠南非洲」一詞主要是以哪一項自然地理界線，作為劃分北非與漠南非洲的依據？", "opts": [["A", "赤道"], ["B", "東非大裂谷"], ["C", "撒哈拉沙漠"], ["D", "剛果盆地"]], "ans": "C", "exp": "撒哈拉沙漠將非洲大陸分隔為南北兩區，習慣將沙漠以南稱為漠南非洲，沙漠以北為北非，兩區在種族、宗教等文化面向差異甚大。"}, {"stem": "關於漠南非洲的地理位置，下列敘述何者正確？", "opts": [["A", "赤道橫貫本區中部"], ["B", "位於撒哈拉沙漠以北"], ["C", "東臨大西洋、西濱印度洋"], ["D", "全區皆位於南半球"]], "ans": "A", "exp": "赤道橫貫非洲大陸中部，是漠南非洲氣候與植物帶呈南北對稱分布的主要原因；本區實際上是東臨印度洋、西濱大西洋，且範圍橫跨南、北半球。"}, {"stem": "漠南非洲雖多為古老陸塊，但蘊藏哪一類天然資源特別豐富，是本區重要的自然資源？", "opts": [["A", "石油與天然氣"], ["B", "煤與鐵礦"], ["C", "磷礦與硫磺"], ["D", "黃金與鑽石等礦產"]], "ans": "D", "exp": "漠南非洲地質古老，蘊藏豐富的黃金、鑽石等礦產資源，是本區重要的自然資源之一。"}, {"stem": "漠南非洲的地形以下列何者為主體？", "opts": [["A", "平原"], ["B", "高原"], ["C", "山地"], ["D", "丘陵"]], "ans": "B", "exp": "漠南非洲為一地質古老的高原型大陸，地形以高原為主體。"}, {"stem": "漠南非洲高原直逼海崖，因此海岸地形具有下列哪一項特徵？", "opts": [["A", "陡峭平直，少有天然港灣"], ["B", "多曲折海灣，港灣密布"], ["C", "沙洲發達，適合養殖"], ["D", "峽灣深入內陸"]], "ans": "A", "exp": "漠南非洲高原直逼海崖，海岸陡峭平直，少有天然港灣，昔日對外交通因此較不方便。"}, {"stem": "漠南非洲高原西半部分布著多處大盆地，下列何者「不屬於」此區的盆地？", "opts": [["A", "撒哈拉盆地"], ["B", "剛果盆地"], ["C", "衣索比亞高原"], ["D", "喀拉哈里盆地"]], "ans": "C", "exp": "高原西半部有多處大盆地，如撒哈拉盆地、剛果盆地、喀拉哈里盆地等；衣索比亞高原則是東非的高地地形，並非盆地。"}, {"stem": "東非大裂谷的形成，主要與下列何種作用力有關？", "opts": [["A", "河流侵蝕"], ["B", "板塊張裂拉伸使地殼斷裂下陷"], ["C", "冰河侵蝕"], ["D", "珊瑚礁堆積"]], "ans": "B", "exp": "東非大裂谷因板塊運動的張裂拉伸作用，使地殼斷裂下陷，形成狹長的凹陷地帶，稱為地塹。"}, {"stem": "漠南非洲何處為地震最頻繁、強度最強烈的地區？", "opts": [["A", "剛果盆地"], ["B", "幾內亞灣沿岸"], ["C", "喀拉哈里盆地"], ["D", "東非大裂谷一帶"]], "ans": "D", "exp": "東非大裂谷一帶因位於板塊交界處，地殼活動劇烈，是漠南非洲地震最頻繁、最強烈的地區。"}, {"stem": "關於吉力馬札羅山的敘述，下列何者正確？", "opts": [["A", "位於西非沿海地區"], ["B", "是一座活躍的活火山，經常噴發"], ["C", "為非洲第一高峰，山頂終年積雪"], ["D", "位於剛果盆地中央"]], "ans": "C", "exp": "吉力馬札羅山位於赤道附近，為非洲第一高峰，山頂常年有積雪，西元1987年被列入世界遺產。"}, {"stem": "剛果盆地為何會出現落差達兩百多公尺的瀑布急湍，導致通航困難？", "opts": [["A", "古代大湖西南方被切穿，切穿處上下落差大"], ["B", "盆地地勢平坦，河道彎曲"], ["C", "位於高地氣候區，降雨量過大"], ["D", "板塊擠壓造成褶皺山地"]], "ans": "A", "exp": "剛果盆地古代曾為大湖，西南方被切穿後湖水外洩才露出成盆地，因切穿處上下落差達兩百多公尺，形成瀑布急湍，通航困難。"}, {"stem": "漠南非洲的平原分布有何特色？", "opts": [["A", "面積廣大且連續分布"], ["B", "完全不存在平原地形"], ["C", "主要分布於東非大裂谷內"], ["D", "面積狹小且零星分布，以尼日河、剛果河沿岸及幾內亞灣沿海較重要"]], "ans": "D", "exp": "漠南非洲的平原面積狹小且零星分布，其中以尼日河、剛果河的沿岸及幾內亞灣的沿海平原較為重要，是人口聚集的精華區。"}, {"stem": "沿著東非大裂谷分布著許多火山與湖泊，這樣的景觀主要與下列何者有關？", "opts": [["A", "珊瑚礁的堆積作用"], ["B", "斷層陷落與熔岩堆積作用"], ["C", "冰河退縮作用"], ["D", "河流沖積作用"]], "ans": "B", "exp": "東非大裂谷沿線因斷層陷落形成低窪地形，加上熔岩堆積形成的高原與山地，因此沿裂谷帶分布許多火山和湖泊，如吉力馬札羅山、馬拉威湖。"}, {"stem": "漠南非洲的氣候帶與天然植物帶大致呈現何種分布特色？", "opts": [["A", "以赤道為中心，南北對稱分布"], ["B", "由東向西呈環狀分布"], ["C", "由沿海向內陸呈同心圓分布"], ["D", "完全不規則分布"]], "ans": "A", "exp": "由於赤道橫貫非洲大陸中部，漠南非洲的氣候類型以赤道為中心，向南北兩側隨緯度增加而變化，呈現南北對稱分布。"}, {"stem": "熱帶雨林氣候主要分布於漠南非洲何處？其氣候特徵為何？", "opts": [["A", "南、北回歸線附近；全年少雨"], ["B", "東南沿海；夏雨冬乾"], ["C", "西南沿海；夏乾冬雨"], ["D", "赤道兩側；全年高溫多雨，年溫差小"]], "ans": "D", "exp": "熱帶雨林氣候主要分布在赤道兩側，全年高溫，年溫差小，降水量豐沛且全年有雨，樹種繁雜，野生動物眾多。"}, {"stem": "熱帶莽原氣候的降水特徵為何？", "opts": [["A", "全年多雨且無乾季"], ["B", "冬雨夏乾"], ["C", "夏雨冬乾，乾溼分明"], ["D", "全年皆乾燥少雨"]], "ans": "C", "exp": "熱帶莽原氣候主要分布於熱帶雨林氣候南北兩側，夏雨冬乾，乾溼分明，天然植被以疏林與草原為主。"}, {"stem": "下列何者「不是」分布於漠南非洲的熱帶沙漠？", "opts": [["A", "撒哈拉沙漠"], ["B", "塔克拉瑪干沙漠"], ["C", "喀拉哈里沙漠"], ["D", "納米比沙漠"]], "ans": "B", "exp": "撒哈拉沙漠、喀拉哈里沙漠、納米比沙漠皆位於漠南非洲；塔克拉瑪干沙漠則位於中國新疆，不屬於本區。"}, {"stem": "漠南非洲南、北回歸線附近形成熱帶沙漠氣候，主要原因為何？", "opts": [["A", "終年受赤道低氣壓籠罩"], ["B", "受東北季風影響"], ["C", "受寒流直接侵襲海岸"], ["D", "終年受副熱帶高氣壓籠罩，乾燥少雨"]], "ans": "D", "exp": "莽原區往南、北至回歸線兩側，因受副熱帶高氣壓籠罩，形成全年少雨、植被稀少的熱帶沙漠氣候。"}, {"stem": "納米比沙漠雖然位於海邊，卻依然十分乾燥少雨，主要與下列何者有關？", "opts": [["A", "沿海有涼流流經，空氣穩定不易對流降水"], ["B", "沿海有暖流流經，水氣蒸散快"], ["C", "地勢過高，水氣難以到達"], ["D", "終年受季風直接吹拂"]], "ans": "A", "exp": "納米比沙漠雖位於海邊，但因沿海有涼流經過，使空氣穩定、不易產生對流降水，因此形成乾燥的沙漠氣候。"}, {"stem": "東非高原地區雖然地處低緯度，氣候卻涼爽宜人，屬於何種氣候類型？", "opts": [["A", "溫帶地中海型氣候"], ["B", "高地氣候"], ["C", "熱帶莽原氣候"], ["D", "副極地氣候"]], "ans": "B", "exp": "東非大裂谷一帶因地勢較高，氣候涼爽，形成高地氣候。"}, {"stem": "漠南非洲西南岸（如南非開普敦一帶）屬於溫帶地中海型氣候，其降水特徵為何？", "opts": [["A", "全年有雨"], ["B", "夏雨冬乾"], ["C", "夏乾冬雨"], ["D", "全年乾燥"]], "ans": "C", "exp": "溫帶地中海型氣候主要分布在漠南非洲西南岸，夏季受副熱帶高氣壓籠罩，氣候乾燥炎熱；冬季則有西風帶來降水，形成夏乾冬雨的特色。"}, {"stem": "漠南非洲東南隅的夏雨型暖溫帶氣候，其夏季降水較多的原因為何？", "opts": [["A", "受東南信風帶來水氣"], ["B", "受赤道低壓籠罩"], ["C", "受西風帶影響"], ["D", "受涼流影響"]], "ans": "A", "exp": "夏雨型暖溫帶氣候主要分布在漠南非洲東南側，夏熱冬暖，因東南信風帶來水氣，夏季降水較多。"}, {"stem": "關於洋流對沿海氣候的影響，下列敘述何者正確？", "opts": [["A", "涼流經過的沿海地區通常較為溫暖多雨"], ["B", "洋流對氣候完全沒有影響"], ["C", "暖流會使沿海地區變得乾燥少雨"], ["D", "暖流經過的沿海地區通常較為溫暖溼潤"]], "ans": "D", "exp": "沿海地區若有暖流流經，通常較為溫暖溼潤；附近海域如有涼流或寒流流經，氣候則顯得較乾燥或寒冷。"}, {"stem": "剛果河流量豐富且穩定，主要與下列何種氣候特徵有關？", "opts": [["A", "夏雨冬乾"], ["B", "全年高溫多雨"], ["C", "冬雨夏乾"], ["D", "終年少雨"]], "ans": "B", "exp": "剛果河流經赤道附近的熱帶雨林氣候區，該區全年高溫多雨，使剛果河流量豐富而穩定。"}, {"stem": "衣索比亞高原、東非高原等地區之所以成為漠南非洲人口聚居的區域，主要原因為何？", "opts": [["A", "礦產資源特別豐富"], ["B", "沿海交通便利"], ["C", "氣候較為涼爽宜人"], ["D", "土壤特別貧瘠"]], "ans": "C", "exp": "衣索比亞高原、東非高原等地區因地勢較高，氣候較為涼爽，成為人口聚居的區域；另尼日河沿岸則因水源豐富，人口也相對密集。"}, {"stem": "漠南非洲居民因應自然環境差異，發展出多樣的傳統維生活動，其中「採集與狩獵」主要零星分布於下列哪些氣候地區？", "opts": [["A", "溫帶地中海型氣候與高地氣候"], ["B", "熱帶莽原氣候與夏雨型暖溫帶氣候"], ["C", "副極地氣候與寒帶氣候"], ["D", "熱帶雨林與乾燥氣候地區"]], "ans": "D", "exp": "採集與狩獵零星分布於熱帶雨林與乾燥氣候地區，因熱帶雨林食物來源豐富，乾燥地區居民則需仰賴採集狩獵維生。"}, {"stem": "生活在剛果盆地雨林中，男人外出捕獵、女人採摘野果與樹根維生的族群，最可能是下列何者？", "opts": [["A", "匹美人"], ["B", "馬賽人"], ["C", "布希曼人"], ["D", "馬拉加西人"]], "ans": "A", "exp": "匹美人生活在雨林中，以採集與狩獵維生，男人負責外出捕獵，女人則負責採摘野果和樹根。"}, {"stem": "喀拉哈里沙漠的布希曼人主要以下列何種方式維生？", "opts": [["A", "游牧"], ["B", "游耕"], ["C", "採集、狩獵"], ["D", "商業性農業"]], "ans": "C", "exp": "喀拉哈里沙漠的布希曼人以採集、狩獵維生，並經常隨季節遷徙居住地，是漠南非洲乾燥氣候地區的代表性族群。"}, {"stem": "「游耕」的維生方式主要分布於下列哪些氣候區？", "opts": [["A", "溫帶地中海型氣候區"], ["B", "熱帶雨林和莽原氣候區"], ["C", "熱帶沙漠氣候區"], ["D", "高地氣候區"]], "ans": "B", "exp": "游耕多分布於熱帶雨林和莽原氣候區，居民先焚林整地，利用灰燼提供養分耕種，待地力耗盡後再遷移至新耕地。"}, {"stem": "游耕的耕作方式中，農民焚燒林木後才耕種，主要目的為何？", "opts": [["A", "灰燼可作為土壤養分，利於作物生長"], ["B", "驅趕野生動物"], ["C", "增加土地面積"], ["D", "便於興建道路"]], "ans": "A", "exp": "游耕的居民會先焚燒草木整地，草木焚燒後的灰燼可成為土壤的養分，有助於作物生長；待土壤養分不足時，才遷移另闢新耕地。"}, {"stem": "以逐水草而居、牛隻頭數作為財富與地位象徵的維生方式，是下列何者的生活寫照？", "opts": [["A", "剛果盆地的匹美人"], ["B", "開普敦的葡萄農"], ["C", "廷布克圖的商人"], ["D", "莽原邊緣的游牧民族（如馬賽人）"]], "ans": "D", "exp": "游牧主要分布在莽原氣候與乾燥氣候的過渡區，居民逐水草而居，牛隻頭數是其財富與地位的象徵，馬賽人即為代表性族群。"}, {"stem": "游牧維生方式主要分 於印度的寶萊塢，每年為奈及利亞的GDP貢獻可觀收入並創造大量就業機會。"}, {"stem": "非洲大陸自由貿易協定（AfCFTA）成立的主要目的為何？", "opts": [["A", "提高非洲對外貿易關稅"], ["B", "限制非洲國家進口原物料"], ["C", "鼓勵各國以物易物取代貨幣交易"], ["D", "降低區域內關稅，促進非洲內部經濟活動與貿易"]], "ans": "D", "exp": "課本說明非洲大陸自由貿易協定的成立初衷，是透過協定內關稅減免、降低進出口限制，促進非洲內部的經濟活動，解決過度依賴其他洲國家的問題。"}, {"stem": "依課本資料，非洲大陸自由貿易協定成立前，非洲內部貿易額占非洲對外出口總額的比例約為多少？", "opts": [["A", "14%"], ["B", "40%"], ["C", "50%以上"], ["D", "70%"]], "ans": "A", "exp": "課本引用聯合國貿易暨發展會議（UNCTAD）於2021年底公布的數據：非洲內部貿易額僅占非洲對外出口總額的14%，顯示非洲內部貿易比例偏低。"}, {"stem": "綜合本課內容，下列哪一項最能反映漠南非洲擺脫貧窮的長期發展方向？", "opts": [["A", "持續仰賴單一農礦原料出口不做改變"], ["B", "兼顧產業升級、公平貿易、基礎建設與區域合作等多元策略"], ["C", "完全依賴國際捐款維持生活"], ["D", "限制人口成長為唯一解方"]], "ans": "B", "exp": "綜合課本內容，漠南非洲各國正透過促進產業發展、強化基礎設施、推動公平貿易、爭取國際援助以及區域自由貿易協定等多元策略，逐步改善經濟與生活環境，並非單靠某一項措施。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "歐洲西側濱臨下列哪一個大洋？", "opts": [["A", "大西洋"], ["B", "太平洋"], ["C", "印度洋"], ["D", "北極海"]], "ans": "A", "exp": "課本提到歐洲「西濱大西洋」，是歐洲三面環海中最主要的一面。"}, {"stem": "歐洲與亞洲的分界，主要以下列哪兩座山脈為界？", "opts": [["A", "阿爾卑斯山、喀爾巴阡山"], ["B", "本寧山、庇里牛斯山"], ["C", "烏拉爾山、高加索山"], ["D", "斯堪地那維亞山脈、亞平寧山脈"]], "ans": "C", "exp": "課本指出歐洲「東以烏拉爾山和高加索山與亞洲為界」，這兩座山脈是歐、亞兩洲傳統的地理分界線。"}, {"stem": "歐洲南隔哪一個海與非洲相望？", "opts": [["A", "黑海"], ["B", "地中海"], ["C", "波羅的海"], ["D", "北海"]], "ans": "B", "exp": "課本說明歐洲「南隔地中海與非洲相望」，地中海是歐、非兩洲之間的天然分界水域。"}, {"stem": "歐洲的自然環境常被形容為「像一個巨型半島伸入海洋」，最主要的理由是下列何者？", "opts": [["A", "歐洲人口分布非常平均"], ["B", "歐洲全境皆為高原地形"], ["C", "歐洲位於赤道附近"], ["D", "歐洲三面環海、海岸線曲折，多半島與島嶼"]], "ans": "D", "exp": "歐洲位於歐亞大陸西側，三面被大西洋、地中海等海域環繞，加上境內多半島、島嶼，因此常被形容為伸入海洋的大半島。"}, {"stem": "歐洲海岸線曲折、多半島與海灣的地形特色，對下列哪一項活動的發展最為有利？", "opts": [["A", "沙漠農業的推廣"], ["B", "航運與貿易的發展"], ["C", "高山滑雪產業"], ["D", "大規模畜牧業"]], "ans": "B", "exp": "課本說明海洋與陸地交錯分布、海灣深入內陸且海岸線綿長，有利於航運與貿易的發展，這也是歐洲自古以來對外貿易發達的重要原因。"}, {"stem": "課本提到歐洲是世界上唯一沒有下列哪一種氣候類型的洲別？", "opts": [["A", "沙漠氣候"], ["B", "溫帶氣候"], ["C", "高地氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "由於歐洲主要山脈多為東西走向，不會阻擋海洋水氣深入內陸，加上多半島、海灣，使歐洲成為世界上唯一沒有沙漠氣候分布的一洲。"}, {"stem": "下列關於歐洲整體地理位置的敘述，何者正確？", "opts": [["A", "歐洲全境位於北極圈以內"], ["B", "歐洲與非洲之間沒有任何海域相隔"], ["C", "歐洲東側與美洲相鄰"], ["D", "歐洲位於歐亞大陸的西北部（西側）"]], "ans": "D", "exp": "歐洲位於歐亞大陸的西北部（西側），西臨大西洋、南隔地中海與非洲相望、東以烏拉爾山、高加索山與亞洲為界。"}, {"stem": "下列何者不是歐洲地形破碎、多半島與島嶼所帶來的影響？", "opts": [["A", "海岸線綿長曲折"], ["B", "港灣眾多，利於航運"], ["C", "內陸地區完全無法發展農業"], ["D", "南、北兩端地形較為破碎"]], "ans": "C", "exp": "歐洲雖然南、北兩端因半島與島嶼眾多而地形破碎，但阿爾卑斯山以北仍有廣大平原可發展農業，並非「內陸完全無法發展農業」，此為錯誤敘述。"}, {"stem": "課本將歐洲地形大致分成三大部分，下列何者不屬於這三大部分之一？", "opts": [["A", "東部的西伯利亞高原"], ["B", "阿爾卑斯山及其以南地區"], ["C", "阿爾卑斯山以北的平原地區"], ["D", "北部的斯堪地那維亞半島"]], "ans": "A", "exp": "西伯利亞屬於俄羅斯地形範圍，非本課「歐洲(一)」所講述的三大地形分區（阿爾卑斯山以南、以北平原、北部斯堪地那維亞半島）。"}, {"stem": "阿爾卑斯山及其以南地區，地形呈現山勢高聳、地形崎嶇、海岸線曲折的主要原因為何？", "opts": [["A", "長期受風力侵蝕"], ["B", "火山長期噴發堆積"], ["C", "冰河大規模覆蓋"], ["D", "板塊擠壓作用"]], "ans": "D", "exp": "課本說明阿爾卑斯山及其以南地區因板塊擠壓，山勢高聳、地形崎嶇、海岸線曲折，並形成多處谷灣地形。"}, {"stem": "阿爾卑斯山以北的地區，地形與土地利用有何特色？", "opts": [["A", "地勢陡峭，多深峽谷"], ["B", "大部分為熱帶沙漠"], ["C", "地勢向北緩慢傾斜，平原廣大，為歐洲精華區"], ["D", "終年被冰河覆蓋，無法居住"]], "ans": "C", "exp": "阿爾卑斯山以北地勢和緩向北傾斜，形成廣大平原，土壤肥沃、氣候溫和，是歐洲人口與農業的精華地區。"}, {"stem": "北部的斯堪地那維亞半島因緯度較高，受到下列何種作用影響，使冰蝕地形發達？", "opts": [["A", "風力侵蝕"], ["B", "冰河侵蝕"], ["C", "河流沖刷"], ["D", "海水侵蝕"]], "ans": "B", "exp": "斯堪地那維亞半島緯度高、氣候寒冷，山地南北縱貫，長期受冰河侵蝕影響，因此冰蝕地形（如峽灣、冰蝕湖等）十分發達。"}, {"stem": "下列對「冰河」的敘述，何者正確？", "opts": [["A", "冰河是由火山噴發後的岩漿冷卻而成"], ["B", "冰河只出現在赤道附近的高山"], ["C", "冰河的移動與地心引力完全無關"], ["D", "冰河是高緯或高山地區的積雪長年不融，逐漸壓密成冰後，因重力向下移動而成"]], "ans": "D", "exp": "課本說明高緯度或高山地區積雪長年不融，深厚積雪逐漸被壓密成冰，這些冰體因本身重量或坡度影響而向下或向外流動，形成冰河。"}, {"stem": "冰河侵蝕形成的「U型谷」，在阿爾卑斯山區常扮演下列何種角色？", "opts": [["A", "成為南北往來的天然交通孔道"], ["B", "完全阻隔南北交通"], ["C", "是歐洲最主要的沙漠地帶"], ["D", "是歐洲降水量最少的地區"]], "ans": "A", "exp": "冰河消融後，寬平的U型谷常成為阿爾卑斯山區南北往來的天然交通孔道，例如瑞士境內的U型谷即可供鐵路穿越使用。"}, {"stem": "「峽灣」地形的形成過程，下列敘述何者正確？", "opts": [["A", "沙漠地區因風力侵蝕而成的谷地"], ["B", "U型谷延伸至海邊，冰河消退、海水侵入後所形成的狹長海灣"], ["C", "火山口積水而成的湖泊"], ["D", "河流出海口泥沙淤積而成的三角洲"]], "ans": "B", "exp": "當U型谷延伸至海邊，隨著冰河消退、海水侵入，便形成深入陸地的狹長海灣，稱為峽灣，是北歐挪威沿海常見的地形。"}, {"stem": "「谷灣」地形主要的形成原因為下列何者？", "opts": [["A", "冰河侵蝕挖鑿窪地後積水而成"], ["B", "板塊張裂形成的大裂谷"], ["C", "沿海丘陵谷地因海平面上升，低平河谷被海水淹沒而成"], ["D", "火山熔岩堆積而成的高原"]], "ans": "C", "exp": "課本以希臘沿海地區為例，說明丘陵延伸至海岸，受海平面上升影響，沿海谷地被海水淹沒而形成谷灣，曲折的海岸線有利於港灣發展。"}, {"stem": "「冰蝕湖」是如何形成的？", "opts": [["A", "冰河在坡度較緩處挖鑿窪地，冰河消融後積水而成"], ["B", "河川改道後留下的舊河道積水而成"], ["C", "地層斷裂陷落後長期積水而成"], ["D", "人工開鑿水庫蓄水而成"]], "ans": "A", "exp": "冰河在坡度較緩的地方移動時，會在冰蝕平原上挖鑿出許多大小不一的窪地，冰河消融後，這些窪地因積水而形成冰蝕湖。"}, {"stem": "阿爾卑斯山脈大致呈東西走向，這樣的走向對歐洲氣候造成下列何種影響？", "opts": [["A", "完全阻擋海洋水氣進入歐洲內陸"], ["B", "使歐洲全境呈現熱帶氣候"], ["C", "造成歐洲東部終年乾旱如沙漠"], ["D", "不會阻擋海洋水氣，有助水氣深入內陸"]], "ans": "D", "exp": "由於歐洲主要山脈（如阿爾卑斯山）多為東西走向，不會像南北向山脈那樣阻擋盛行西風帶來的海洋水氣，使水氣得以深入內陸，讓歐洲成為溫帶氣候廣布、沒有沙漠氣候的一洲。"}, {"stem": "歐洲海岸線特別綿長曲折，最主要的原因為下列何者？", "opts": [["A", "地震活動頻繁"], ["B", "全年降雨量極低"], ["C", "境內多半島、海灣與島嶼"], ["D", "河流均為筆直流向"]], "ans": "C", "exp": "歐洲南、北兩部因多半島及島嶼，地形較為破碎，海洋與陸地交錯分布，因而形成綿長曲折的海岸線。"}, {"stem": "若由南到北觀察歐洲的地形分布，下列排列順序何者正確？", "opts": [["A", "北部冰河地形 → 中部平原 → 南部高聳山地"], ["B", "南部高聳山地 → 中部廣大平原 → 北部冰河地形"], ["C", "南部平原 → 中部沙漠 → 北部高原"], ["D", "南部冰蝕地形 → 中部沙漠 → 北部高山"]], "ans": "B", "exp": "課本描述歐洲地形由南到北依序為：阿爾卑斯山及其以南（山勢高聳崎嶇）→ 阿爾卑斯山以北的廣大平原（歐洲精華區）→ 北部斯堪地那維亞半島（冰河地形發達）。"}, {"stem": "課本形容歐洲的氣候大致呈現下列何種特徵？", "opts": [["A", "南冷北熱、東溼西乾"], ["B", "全年高溫多雨"], ["C", "全年寒冷乾燥"], ["D", "南熱北冷、西溼東乾"]], "ans": "D", "exp": "課本指出歐洲氣候大致「南熱北冷、西溼東乾」，緯度、地形、西風、洋流與距海遠近皆是造成此差異的重要因素。"}, {"stem": "溫帶地中海型氣候的降水特徵為下列何者？", "opts": [["A", "全年多雨"], ["B", "夏乾冬雨"], ["C", "夏雨冬乾"], ["D", "全年乾燥無雨"]], "ans": "B", "exp": "地中海沿岸地區夏季受副熱帶高氣壓籠罩，乾燥少雨；冬季則進入西風帶範圍，盛行西風帶來海洋水氣，形成「夏乾冬雨」的氣候特徵。"}, {"stem": "溫帶海洋性氣候主要分布於歐洲的哪些區域？", "opts": [["A", "西歐與北歐（西部）"], ["B", "南歐與東歐"], ["C", "東歐與歐俄"], ["D", "僅分布於阿爾卑斯山區"]], "ans": "A", "exp": "溫帶海洋性氣候分布於西歐與北歐西部，終年受西風吹拂，加上北大西洋暖流帶來暖溼水氣，雨量分布較平均。"}, {"stem": "溫帶海洋性氣候「終年有雨、年溫差較小」的現象，主要與下列哪兩項因素有關？", "opts": [["A", "副熱帶高壓、沙漠氣流"], ["B", "東北季風、寒流"], ["C", "盛行西風、北大西洋暖流"], ["D", "地震活動、火山噴發"]], "ans": "C", "exp": "西歐、北歐西部終年受西風吹拂，加上北大西洋暖流帶來暖溼水氣，兩者共同作用，使當地全年有雨、氣候溫和、年溫差較小。"}, {"stem": "溫帶大陸性氣候主要分布於歐洲的哪個區域？", "opts": [["A", "南歐沿海地區"], ["B", "東歐、歐俄（深入內陸地區）"], ["C", "阿爾卑斯山區"], ["D", "北極圈以內"]], "ans": "B", "exp": "溫帶大陸性氣候主要分布於東歐、歐俄，由於位置向東深入內陸，受海洋影響減弱，形成獨特的氣候特徵。"}, {"stem": "關於溫帶大陸性氣候的特徵，下列敘述何者正確？", "opts": [["A", "年均溫向東逐漸升高、年降水量向東逐漸增加"], ["B", "全年降水平均分配，沒有明顯的雨季"], ["C", "冬季降水量遠高於夏季"], ["D", "年均溫向東逐漸降低、年溫差向東逐漸增加，降水以夏雨為主"]], "ans": "D", "exp": "由於愈向東深入內陸，受海洋調節的效果愈弱，因此年均溫逐漸降低、年溫差逐漸增大，並呈現以夏雨為主的降水特徵。"}, {"stem": "「高地氣候」在歐洲主要分布於下列何處？", "opts": [["A", "阿爾卑斯山區"], ["B", "東歐平原"], ["C", "地中海沿岸"], ["D", "北極海沿岸"]], "ans": "A", "exp": "高地氣候主要分布於地勢高聳的阿爾卑斯山區，氣候特徵會隨著海拔高度呈現垂直變化。"}, {"stem": "「寒帶氣候」主要分布於下列歐洲的哪個地區？", "opts": [["A", "地中海沿岸"], ["B", "西歐平原"], ["C", "北極圈附近"], ["D", "阿爾卑斯山南側"]], "ans": "C", "exp": "寒帶氣候分布於北極圈附近的高緯度地區，終年低溫，冬季尤其寒冷漫長。"}, {"stem": "盛行「西風」對歐洲氣候造成下列何種主要影響？", "opts": [["A", "使歐洲大部分地區終年乾燥"], ["B", "使歐洲全年高溫少雨"], ["C", "造成歐洲東部沙漠化"], ["D", "為歐洲帶來大量的海洋水氣，調節氣候溼度"]], "ans": "D", "exp": "盛行西風將大西 俄平原，是歐洲大平原的一部分；以東為亞洲的西伯利亞地區。"}, {"stem": "依課文，西伯利亞地區由西向東的地形分布依序為？", "opts": [["A", "山地、高原、平原"], ["B", "高原、平原、山地"], ["C", "平原、高原、山地"], ["D", "平原、山地、高原"]], "ans": "C", "exp": "課文指出，西伯利亞由西向東可分成西部平原、中部高原及東部山地三大地形區。"}, {"stem": "西伯利亞東部山地地勢高聳、多火山與地震，主要原因為何？", "opts": [["A", "受河流沖積作用"], ["B", "受風力侵蝕堆積"], ["C", "受板塊擠壓"], ["D", "受冰河長期侵蝕"]], "ans": "C", "exp": "課文說明，西伯利亞東部山地因板塊擠壓而形成，地勢高聳，多火山、地震，與烏拉爾山區古老穩定的地質狀況不同。"}, {"stem": "俄羅斯西側的歐俄平原，在地形上屬於下列哪一地形區的一部分？", "opts": [["A", "西伯利亞高原"], ["B", "歐洲大平原"], ["C", "巴爾幹半島"], ["D", "阿爾卑斯山系"]], "ans": "B", "exp": "課文指出，歐俄平原地勢低窪、多湖泊沼澤，屬於歐洲大平原的一部分，與西歐的平原地形相連。"}, {"stem": "依課文，俄羅斯大部分國土位於北緯50度以北，主要氣候類型為？", "opts": [["A", "地中海型氣候"], ["B", "寒帶氣候"], ["C", "溫帶海洋性氣候"], ["D", "熱帶氣候"]], "ans": "B", "exp": "課文指出，俄羅斯國土多半位於北緯50度以北，受緯度和地形影響，多為寒帶氣候，冬季漫長而嚴寒，冰雪封凍可長達半年以上。"}, {"stem": "俄羅斯境內的天然植被，除北部苔原外，主要以下列何種類型為主？", "opts": [["A", "落葉闊葉林"], ["B", "熱帶草原"], ["C", "熱帶雨林"], ["D", "針葉林"]], "ans": "D", "exp": "課文說明，受氣候寒冷影響，俄羅斯境內的天然植被多為廣闊的針葉林，如克拉斯諾雅一帶即以針葉林與伐木業聞名。"}, {"stem": "俄羅斯北部北極海沿岸地區，因氣候過於寒冷、樹木難以生長，僅有苔蘚類植物生長，形成下列何種景觀？", "opts": [["A", "針葉林"], ["B", "沙漠"], ["C", "莽原"], ["D", "苔原"]], "ans": "D", "exp": "課文指出，北極圈以北的高緯度地區氣候酷寒、長年積雪，部分冰雪在短暫夏季融化後，地面僅能生長苔蘚類植物，形成苔原景觀。"}, {"stem": "依課文，俄羅斯境內哪一地區以「全球觀測到年溫差最大」聞名，冬季嚴寒漫長？", "opts": [["A", "莫斯科"], ["B", "聖彼得堡"], ["C", "維科揚斯克（西伯利亞東部）"], ["D", "歐俄平原"]], "ans": "C", "exp": "課文指出，位於西伯利亞的維科揚斯克因緯度高、缺乏水氣調節，年溫差可達60度以上，是目前全球觀測到年溫差最大的地方，也曾測得零下67度的極端低溫。"}, {"stem": "依課文，俄羅斯降水量的分布規律為何？", "opts": [["A", "由西向東遞增"], ["B", "南北分布均勻"], ["C", "由西向東遞減"], ["D", "由北向南遞減"]], "ans": "C", "exp": "課文指出，俄羅斯距離大西洋越遠、降水越少，年降水量由西向東遞減，僅高加索山西側與西伯利亞東南側因分別受西風、夏季季風影響而降水較豐。"}, {"stem": "俄羅斯境內只有哪兩處地區因受海洋水氣影響，降水稍多、屬於溫帶氣候類型？", "opts": [["A", "北極海沿岸與中亞地區"], ["B", "西伯利亞中部與貝加爾湖"], ["C", "烏拉爾山區與高加索山區"], ["D", "歐俄平原西部及太平洋沿岸"]], "ans": "D", "exp": "課文指出，俄羅斯只有西部的歐俄平原及東部的太平洋沿岸，受海洋水氣影響，降水稍多，屬於溫帶氣候類型，其餘廣大內陸則為寒帶氣候。"}, {"stem": "依課文，俄羅斯人口的空間分布具有下列何種特色？", "opts": [["A", "集中於北極海沿岸地區"], ["B", "絕大部分集中在歐俄平原南部"], ["C", "集中於西伯利亞東部沿海"], ["D", "平均分布於全國各地"]], "ans": "B", "exp": "課文指出，俄羅斯人口的空間分布極端不均，絕大部分集中在歐俄平原南部，都市、產業與交通路線也多集中於此，廣大的西伯利亞則人煙稀少。"}, {"stem": "俄羅斯人口以下列哪一民族為主，且多信仰何種宗教？", "opts": [["A", "突厥民族、伊斯蘭教"], ["B", "拉丁民族、新教"], ["C", "日耳曼民族、天主教"], ["D", "斯拉夫民族、東正教"]], "ans": "D", "exp": "課文指出，俄羅斯人口大部分為斯拉夫民族，以信仰東正教為主，這也反映在莫斯科聖巴希爾主教座堂等傳統建築的宗教藝術風格上。"}, {"stem": "莫斯科聖巴希爾（聖瓦西里）主教座堂最具特色的建築風格為何？", "opts": [["A", "圓柱列拱式"], ["B", "玻璃帷幕式"], ["C", "尖塔哥德式"], ["D", "洋蔥式圓頂"]], "ans": "D", "exp": "課文指出，聖巴希爾主教座堂參考傳統拜占庭建築，以方形為基座、圓頂為上，具有洋蔥式圓頂的俄羅斯傳統建築特色，反映「天圓地方」的哲學思想。"}, {"stem": "俄羅斯興建長達九千餘公里的鐵路，主要目的為連結歐俄平原與下列哪一地區？", "opts": [["A", "太平洋地區"], ["B", "北極海沿岸"], ["C", "中亞地區"], ["D", "高加索地區"]], "ans": "A", "exp": "課文指出，為了連結歐俄平原與太平洋地區，俄羅斯興建長達九千餘公里的西伯利亞鐵路，以增強國內東、西兩地的連結，也帶動沿線人口分布。"}, {"stem": "下列哪一個南歐國家雖然土壤貧瘠、不利農業發展，卻因沿海港灣眾多而航運發達，並被視為西方文明與奧林匹克運動會的發源地？", "opts": [["A", "義大利"], ["B", "西班牙"], ["C", "希臘"], ["D", "葡萄牙"]], "ans": "C", "exp": "課文指出，希臘當地土壤貧瘠不利農業發展，但沿海港灣眾多，因此航運發達；此外，希臘是歐洲文明與奧林匹克運動會的發源地，境內有衛城等重要世界遺址，觀光業也是其重要的經濟支柱。"}, {"stem": "俄羅斯為了將石油輸往中國、日本等國，興建了下列哪一條長程油管？", "opts": [["A", "友誼油管"], ["B", "北溪油管"], ["C", "遠東油管"], ["D", "高加索油管"]], "ans": "C", "exp": "課文指出，俄羅斯除了將石油外銷到歐、美國家，也興建長達數千公里的「遠東油管」，以便將石油輸出到中國、日本等國。"}, {"stem": "依課文，俄羅斯經濟過度依賴礦產與能源出口，可能面臨下列何種隱憂？", "opts": [["A", "國家經濟容易受國際市場價格波動影響"], ["B", "匯率長期大幅升值"], ["C", "農業產量長期過剩"], ["D", "人口快速增加造成的糧食壓力"]], "ans": "A", "exp": "課文指出，礦產資源外銷雖為俄羅斯賺進大量外匯發展工業，然而仰賴礦產與能源出口，使國家經濟容易受到國際市場價格波動影響，成為經濟發展上的隱憂。"}, {"stem": "為降低對自然資源出口的過度依賴，近年俄羅斯採取下列何種作法？", "opts": [["A", "全面關閉礦區、停止能源外銷"], ["B", "停止與所有國家進行貿易往來"], ["C", "改善投資環境，以優惠政策吸引外國企業前往設廠"], ["D", "放棄開發西伯利亞地區的資源"]], "ans": "C", "exp": "課文指出，為了降低國家經濟對自然資源的依賴，俄羅斯大力改善國內投資環境，並以廣大市場及優惠政策吸引各國企業前往設廠，也積極與其他新興工業國家合作。"}, {"stem": "東歐國家在蘇聯解體後，運用下列哪一項優勢，逐漸轉型為承接國際代工與零組件生產的新興工業區（例如臺灣鴻海在捷克設廠）？", "opts": [["A", "低廉的工資與鄰近西歐市場的區位優勢"], ["B", "豐富的石油蘊藏"], ["C", "廣大的熱帶栽培業腹地"], ["D", "高度發展的金融服務業"]], "ans": "A", "exp": "課文指出，東歐在蘇聯時期實施計畫經濟、重視國防與重工業，忽略民生需求；蘇聯解體後，東歐運用工資低廉、鄰近西歐市場等區位優勢，轉型為代工及零組件生產的新興工業區，例如捷克即因此吸引臺灣鴻海科技集團等企業前往設廠。"}, {"stem": "依課文，下列哪一個西歐國家被稱為工業革命的發源地，首都也是世界重要的金融中心？", "opts": [["A", "英國"], ["B", "法國"], ["C", "德國"], ["D", "荷蘭"]], "ans": "A", "exp": "課文指出，英國是工業革命的發源地，昔日利用本寧山周圍的煤礦發展工業，現今首都倫敦為世界重要的金融中心。"}, {"stem": "荷蘭以填海造陸聞名，除了發達的酪農業外，還發展出哪一項高價值的產業？", "opts": [["A", "橄欖油產業"], ["B", "花卉園藝業（如鬱金香）"], ["C", "葡萄酒產業"], ["D", "精密鐘錶業"]], "ans": "B", "exp": "課文指出，荷蘭以填海造陸聞名，沿海地區飼養乳牛、酪農業發達，並發展高價值的花卉園藝業，如種植鬱金香，是荷蘭聞名國際的產業特色。"}, {"stem": "法國除了以葡萄酒與時尚產業聞名外，還有下列哪一項高科技產業世界知名？", "opts": [["A", "精密鐘錶業"], ["B", "航太工業與高速鐵路"], ["C", "煉鋁工業"], ["D", "汽車引擎製造"]], "ans": "B", "exp": "課文指出，法國工業發達，例如航太工業、捷運系統、高速鐵路等行銷到許多國家，此外時尚產業與旅遊業（如艾菲爾鐵塔）也在全球占有一席之地。"}, {"stem": "北歐國家普遍具有下列哪一項共同的社會經濟特色？", "opts": [["A", "稅賦極低、社會福利有限"], ["B", "社會福利制度完善，民眾納稅比重也相對較高"], ["C", "人口快速成長，青壯年負擔減輕"], ["D", "以熱帶栽培業為主要產業"]], "ans": "B", "exp": "課文指出，北歐國家因擁有豐富自然資源，經濟實力雄厚，社會福利極佳，民眾的納稅比重也相對較高；但近年人口老化也使青壯年負擔加重。"}, {"stem": "挪威能發展優良的漁業、航運業及鮭魚養殖，主要得益於下列哪一項地形特色？", "opts": [["A", "峽灣（冰河地形）"], ["B", "沖積扇平原"], ["C", "喀斯特地形"], ["D", "三角洲平原"]], "ans": "A", "exp": "課文指出，挪威利用峽灣形成的天然良港及港口冬季不結凍的優勢，發展漁業、航運業，並利用峽灣地形與低溫海水養殖鮭魚，為鮭魚主要出口大國。"}, {"stem": "瑞典著名的家具品牌IKEA，其產業發展與當地哪一項自然資源關係最密切？", "opts": [["A", "針葉林（森林資源）"], ["B", "地熱資源"], ["C", "石油資源"], ["D", "沿海漁業資源"]], "ans": "A", "exp": "課文指出，瑞典有豐富的鐵礦與針葉林資源，故林業、汽車、機械等產業發達，如IKEA（宜家家居）即以當地森林資源為基礎發展的家具品牌。"}, {"stem": "依課文，芬蘭因冰蝕湖廣布，享有下列哪一個別稱？", "opts": [["A", "森林王國"], ["B", "峽灣之國"], ["C", "極光之國"], ["D", "千湖國"]], "ans": "D", "exp": "課文指出，芬蘭因冰蝕湖廣布，有「千湖國」之稱，國內森林覆蓋率高，早期以林業為經濟發展基礎。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "秦嶺、淮河一線以南地區，因氣溫較高、降水豐富，農民多以種植下列何種作物為主？", "opts": [["A", "小麥"], ["B", "玉米"], ["C", "水稻"], ["D", "高粱"]], "ans": "C", "exp": "秦嶺、淮河以南氣溫高、降水豐沛，適合種植水稻；以北則氣候較乾冷，多種植小麥等耐旱作物，形成「南稻北麥」的農業分布特徵。"}, {"stem": "中國東半部與西半部相比，農牧業活動的空間分布，下列敘述何者正確？", "opts": [["A", "東農西牧"], ["B", "東牧西農"], ["C", "東西部皆以農業為主"], ["D", "東西部皆以畜牧為主"]], "ans": "A", "exp": "中國東半部氣候溼潤、耕地集中，以農業為主；西半部氣候乾燥、多高原沙漠，以畜牧業為主，形成「東農西牧」的分布特徵。"}, {"stem": "內蒙古高原東側的牧民，主要以下列哪種方式從事畜牧？", "opts": [["A", "山牧季移"], ["B", "逐水草而居的游牧生活"], ["C", "商業化大型畜牧場經營"], ["D", "在水草豐美的河岸放牧"]], "ans": "D", "exp": "內蒙古高原東側牧民在水草豐美的河岸放牧為生；乾燥少雨的新疆牧民則過著逐水草而居的游牧生活；青藏高原的畜牧採山牧季移方式進行。"}, {"stem": "新疆維吾爾自治區因氣候乾燥少雨，當地牧民主要採取下列哪種畜牧方式？", "opts": [["A", "河岸放牧"], ["B", "逐水草而居的游牧生活"], ["C", "山牧季移"], ["D", "企業化商業牧場"]], "ans": "B", "exp": "新疆氣候乾燥少雨，牧草分布不固定，牧民需隨水源與草場移動，過著逐水草而居的游牧生活。"}, {"stem": "青藏高原上的畜牧方式，主要採取下列何者？", "opts": [["A", "山牧季移"], ["B", "逐水草而居的游牧"], ["C", "河岸放牧"], ["D", "舍飼圈養"]], "ans": "A", "exp": "青藏高原地勢起伏大，牧民依季節將牲畜趕往高、低不同海拔的草場放牧，此種方式稱為山牧季移。"}, {"stem": "二十世紀中葉以後，中國積極推動農牧業的轉型與擴大生產規模，其最主要的原因為何？", "opts": [["A", "因應國際市場需求，大量出口農產品"], ["B", "響應全球環保潮流"], ["C", "人口暴增，糧食需求擴大"], ["D", "提升農產品的觀光價值"]], "ans": "C", "exp": "二十世紀中葉以後中國人口暴增，糧食需求隨之擴大，中國一方面增加糧食進口，一方面透過農牧業現代化轉型、擴大生產規模，以確保糧食供應穩定。"}, {"stem": "下列何者不屬於中國提升農業生產效率的作法？", "opts": [["A", "農業生產機械化"], ["B", "興修水利工程"], ["C", "普遍使用化肥"], ["D", "減少水利建設，改依賴自然降雨灌溉"]], "ans": "D", "exp": "中國近年透過機械化生產、興修水利工程、普遍使用化肥等方式提升農業生產效率；減少水利建設、依賴自然降雨並非提升效率的作法。"}, {"stem": "中國設立「全國性商品糧基地」的主要目的為何？", "opts": [["A", "提高農產品出口創匯"], ["B", "確保國內糧食供給的穩定"], ["C", "發展觀光休閒農業"], ["D", "減少農藥使用，推動有機農業"]], "ans": "B", "exp": "為滿足人口成長帶來的糧食需求，中國設立多個全國性商品糧基地，種植適合各地環境的糧食作物，以確保國內糧食供給穩定。"}, {"stem": "中國設立商品糧基地、集中生產糧食作物，可能產生下列哪項風險？", "opts": [["A", "農產品價格大幅上漲"], ["B", "農村人口大量外流"], ["C", "一旦遭遇水旱災害，容易發生全國性斷糧危機"], ["D", "造成大規模的農地重劃問題"]], "ans": "C", "exp": "集中生產糧食基地一旦遭遇水旱等天災，糧食產量可能大幅減少，進而影響全國的糧食供給，甚至引發全國性斷糧危機。"}, {"stem": "中國近年改善交通建設（運輸工具改良、道路建設完備），對農業造成下列哪項影響？", "opts": [["A", "使農產品能快速在產區與市場間流動，提高供應效率"], ["B", "使農民放棄農耕，轉而經商"], ["C", "造成農產品普遍滯銷"], ["D", "降低農產品的商品化程度"]], "ans": "A", "exp": "透過運輸工具改良與道路建設完備，農產品可以快速在產區與市場間流動，提高了糧食的供應效率。"}, {"stem": "下列哪一省級行政區因氣候乾燥、灌溉技術進步，棉花產量躍居全中國第一？", "opts": [["A", "內蒙古自治區"], ["B", "新疆維吾爾自治區"], ["C", "青海省"], ["D", "甘肅省"]], "ans": "B", "exp": "新疆維吾爾自治區氣候乾燥，日照充足，加上灌溉技術進步、機械化生產，棉花產量躍居全中國第一。"}, {"stem": "中國雖是農業生產大國，卻也是世界糧食進口大國之一，其主要原因最可能為下列何者？", "opts": [["A", "中國氣候完全不適合種植糧食作物"], ["B", "中國農業技術遠落後於其他國家"], ["C", "中國政府全面禁止農產品出口"], ["D", "人口眾多、糧食需求龐大，國內生產難以完全自給"]], "ans": "D", "exp": "中國人口眾多、糧食需求量龐大，即使國內農業生產規模不小，仍需大量進口糧食以滿足國內消費需求。"}, {"stem": "一國工業發展的兩項基本要素，最主要為下列何者？", "opts": [["A", "豐富的礦產與便利的交通"], ["B", "充足的勞動力與廉價土地"], ["C", "優惠的租稅與政治穩定"], ["D", "龐大的消費市場與充沛資金"]], "ans": "A", "exp": "豐富的礦產是一國工業發展的基礎，而近代的交通建設，則成為工業迅速發展的推動力，兩者是工業發展的重要要素。"}, {"stem": "中國的煤、鐵、石油等基礎礦產，主要集中分布於下列哪個區域？", "opts": [["A", "東南沿海"], ["B", "西南地區"], ["C", "北部地區"], ["D", "珠江流域"]], "ans": "C", "exp": "中國煤、鐵、石油等基礎礦產主要分布於北部地區，早期成為重工業的主要生產基地。"}, {"stem": "由於礦產多集中分布於北部，中國南部地區早期的工業類型，多以下列何者為主？", "opts": [["A", "鋼鐵、石化等重工業"], ["B", "紡織、農產加工等輕工業"], ["C", "高科技電子產業"], ["D", "汽車製造業"]], "ans": "B", "exp": "中國南部礦產較少，昔日以紡織、農產加工等輕工業為主；北部因礦產豐富，則以鋼鐵、石化等重工業為主。"}, {"stem": "近年中國工業發展所需的礦產原料數量激增、種類變多，國內產量已不敷使用，因此下列哪個區位逐漸成為設廠首選地區？", "opts": [["A", "礦產原料的產地"], ["B", "人口最密集的內陸城市"], ["C", "西部高原地區"], ["D", "水運便利的沿海及長江沿岸"]], "ans": "D", "exp": "由於中國工業發展所需礦產不敷使用，需大量仰賴國外進口，因此水運便利的沿海及長江沿岸，便成為近年設廠的首選地區。"}, {"stem": "有關中國鐵路、公路分布的敘述，下列何者正確？", "opts": [["A", "東半部工商業發達，鐵、公路分布較為密集"], ["B", "西半部因礦產豐富，交通建設反而較完善"], ["C", "中國全境交通建設密度大致平均"], ["D", "鐵路建設主要集中於西部大開發地區"]], "ans": "A", "exp": "中國工商業發達的東半部地區，鐵、公路分布較為密集；工商業發展較遲緩的西半部地區，路線分布則相對稀疏。"}, {"stem": "中國於西元1978年推動的經濟政策，其核心內容為何？", "opts": [["A", "對內開放，對外改革"], ["B", "對內改革，對外開放"], ["C", "全面推動國有化"], ["D", "完全鎖國，發展自給自足經濟"]], "ans": "B", "exp": "1978年中國推動「對內改革，對外開放」政策，放寬對外貿易的限制，使中國從封閉狀態，進入對外開放投資貿易的急速發展時期。"}, {"stem": "下列何者不是中國最早設立的五個經濟特區之一？", "opts": [["A", "深圳"], ["B", "廈門"], ["C", "汕頭"], ["D", "喀什"]], "ans": "D", "exp": "中國最早在東南沿海設立深圳、珠海、汕頭、廈門、海南五個經濟特區；喀什則是西元2010年才增設的第六個經濟特區，位於新疆。"}, {"stem": "中國東南沿海經濟特區得以吸引外資設廠的優勢條件，不包含下列何者？", "opts": [["A", "廉價的勞動成本"], ["B", "稅收等優惠政策"], ["C", "豐富的森林資源"], ["D", "便利的交通條件"]], "ans": "C", "exp": "經濟特區主要憑藉廉價勞動成本、優惠政策與便利的交通條件吸引外資設廠，森林資源並非其主要優勢條件。"}, {"stem": "中國於西元2010年在下列何處增設第六個經濟特區？", "opts": [["A", "海南"], ["B", "新疆喀什"], ["C", "東北遼寧"], ["D", "西藏拉薩"]], "ans": "B", "exp": "西元2010年5月，中國政府複製東南沿海經濟特區的成功經驗，於新疆喀什設立第六個經濟特區。"}, {"stem": "有關中國產業結構轉變的敘述，下列何者正確？", "opts": [["A", "第二、三級產業就業人口比例已逐漸超越第一級產業"], ["B", "第一級產業產值長期領先其他產業"], ["C", "中國至今仍以農業作為經濟成長的主要動力"], ["D", "第三級產業就業人口比例持續下降"]], "ans": "A", "exp": "隨著近代經濟發展，中國第二、三級產業的就業人口比例逐漸超越第一級產業，工業發展成為中國近代經濟成長的主要動力。"}, {"stem": "中國近年產業轉型的方向，主要是由下列何者轉變為何者？", "opts": [["A", "由技術密集型轉為勞力密集型"], ["B", "由重工業轉為農牧業"], ["C", "由勞力密集型工業轉為技術密集型高科技工業"], ["D", "由第三級產業轉為第一級產業"]], "ans": "C", "exp": "中國在工業化地區擴大的同時，也推動產業轉型，逐漸將發展重心從勞力密集型工業，轉移到技術密集型的高科技工業。"}, {"stem": "中國在石化、鋼鐵、電子、汽車等領域的生產規模已領先世界各國，因而獲得下列哪個稱號？", "opts": [["A", "世界市場"], ["B", "世界銀行"], ["C", "世界糧倉"], ["D", "世界工廠"]], "ans": "D", "exp": "中國製造的許多工業產品在全球市場占有重要地位，因此有「世界工廠」之稱。"}, {"stem": "環渤海經濟圈是中國政治與交通的核心，除了鋼鐵、石化等重工業外，也擁有先進的下列哪種產業？", "opts": [["A", "高科技產業"], ["B", "觀光旅遊業"], ["C", "傳統紡織業"], ["D", "遠洋漁業"]], "ans": "A", "exp": "環渤海經濟圈除了鋼鐵、石化等重工業外，受政策影響也擁有先進的高科技產業，是中國政治與交通的核心地帶。"}, {"stem": "北京近郊的中關村，因聚集許多高科技產業的研發部門，獲得下列哪個稱號？", "opts": [["A", "世界工廠"], ["B", "中國矽谷"], ["C", "東方明珠"], ["D", "亞洲華爾街"]], "ans": "B", "exp": "中關村因聚集大量高科技產業的研發部門，因而有「中國矽谷」之稱，是環渤海經濟圈內的重要科技聚落。"}, {"stem": "下列有關長三角經濟圈的敘述，何者正確？", "opts": [["A", "是中國最早改革開放的地區"], ["B", "以重工業為發展主力，鮮少發展高科技產業"], ["C", "都市化程度是三大經濟圈中最低者"], ["D", "工商業最發達，也是都市化程度最高的地區"]], "ans": "D", "exp": "長三角經濟圈是中國工商業最發達、都市化程度最高的地區，資訊流通快速、金融產業發達，已發展成電子、通訊、電腦等產業重鎮。"}, {"stem": "上海得以發展成為中國最主要金融中心的地理優勢，最主要是因為下列何者？", "opts": [["A", "鄰近香港、澳門，吸引大量外資"], ["B", "地處西部大開發的核心地帶"], ["C", "位處中國海岸線中點且為長江出海口，交通位置優越"], ["D", "為中國最早設立的經濟特區"]], "ans": "C", "exp": "上海位處中國海岸線中點與長江的出海口，交通位置優越、腹地廣大，因而都市快速發展，成為中國最主要的金融中心。"}, {"stem": "珠三角經濟圈之所以能成為中國最先進的新創產業中心，下列何者不是主要原因？", "opts": [["A", "中國最早改革開放的地區"], ["B", "中國傳統重工業的發展重心"], ["C", "長期的技術累積"], ["D", "香港、澳 原因最可能為下列何者？", "opts": [["A", "原料產地勞動力最為充足"], ["B", "原料產地交通最為便利"], ["C", "基礎礦產原料重量重，不易遠運"], ["D", "原料產地政府租稅優惠最多"]], "ans": "C", "exp": "近代工業發展所需的煤、鐵、石油等基礎礦產，因原料重量重、不易遠運，因此原料產地便成為中國早期重工業的主要生產基地。"}, {"stem": "「國內生產毛額（GDP）」一詞的意義為下列何者？", "opts": [["A", "一國或地區境內所有生產機構或單位，在一年中生產的產品價值和勞務所得"], ["B", "一國全年進出口貿易總額"], ["C", "一國政府全年稅收總額"], ["D", "一國人口總數與所得的乘積"]], "ans": "A", "exp": "GDP（Gross Domestic Product）指一國或地區境內所有生產機構或單位，在一年中生產的產品價值和勞務所得，常用來衡量一國的經濟發展程度。"}, {"stem": "下列有關中國經濟改革開放後發展歷程的敘述，何者最為正確？", "opts": [["A", "中國至今仍以第一級產業為經濟發展主力"], ["B", "中國先於東南沿海設經濟特區，再逐步擴大至沿海與長江沿岸都市，最後進入內陸重點地區"], ["C", "中國工業發展一開始就以技術密集型高科技產業為主"], ["D", "中國四大經濟區的發展策略完全相同，並無差異"]], "ans": "B", "exp": "中國自改革開放以來，最早在東南沿海設立經濟特區，再逐步開放沿海與長江沿岸城市發展工業，甚至進入內陸重點地區，是循序漸進擴大開放的發展歷程。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

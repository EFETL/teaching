<script>
const QS=[{"stem": "中國地形複雜多樣，若依地形種類粗分，大致可分為哪五大類型？", "opts": [["A", "山地、高原、丘陵、沙漠、綠洲"], ["B", "高原、盆地、平原、沙漠、草原"], ["C", "山地、丘陵、平原、盆地、沙漠"], ["D", "山地、高原、盆地、平原、丘陵"]], "ans": "D", "exp": "課本指出中國幅員遼闊，地質結構複雜且受板塊擠壓影響，地形大致可分為山地、高原、盆地、平原、丘陵五大類型。"}, {"stem": "中國的山地與高原約占國土總面積的多少比例？", "opts": [["A", "約 30%"], ["B", "約 59～60%"], ["C", "約 75%"], ["D", "約 90%"]], "ans": "B", "exp": "三版本課本皆提到山地和高原約占中國總面積的 59～60%，是「山多平原少」特徵的主要依據。"}, {"stem": "由於山地、高原面積廣大，平原相對狹小，中國的地形整體常被形容為下列何者？", "opts": [["A", "平原遼闊、地勢平坦"], ["B", "丘陵起伏、盆地眾多"], ["C", "山多平原少"], ["D", "沙漠廣布、綠洲稀少"]], "ans": "C", "exp": "山地與高原占比高達近六成，因此中國地形整體呈現「山多平原少」的特徵。"}, {"stem": "中國的地勢大致呈現下列何種分布？", "opts": [["A", "南高北低"], ["B", "東高西低"], ["C", "中央高、四周低"], ["D", "西高東低"]], "ans": "D", "exp": "課本明確指出中國地勢大致西高東低，並依海拔高度分成三級階梯。"}, {"stem": "中國許多大河（如黃河、長江）的主要流向是由西向東，其最主要的原因為何？", "opts": [["A", "受季風風向影響"], ["B", "地勢西高東低"], ["C", "受海岸線走向影響"], ["D", "受緯度高低影響"]], "ans": "B", "exp": "因為地勢西高東低，河水由高處往低處流，故中國主要河川多由西向東流入太平洋。"}, {"stem": "關於中國河川上、下游的特徵，下列敘述何者正確？", "opts": [["A", "上游水流湍急、多富水力資源；下游流勢平緩、利於水運"], ["B", "上游流勢平緩、利於水運；下游水流湍急、富水力資源"], ["C", "上、下游流速皆平緩，皆不利於水力開發"], ["D", "上、下游流速皆湍急，皆不利於航運"]], "ans": "A", "exp": "西高東低的地勢，使河川上游因地勢陡峭水流湍急，蘊藏豐富水力；下游地勢平坦、流勢平緩，河面寬廣，有利水路運輸發展。"}, {"stem": "中國的地勢可分為三級階梯，這種分類主要是依據下列何種指標？", "opts": [["A", "緯度高低"], ["B", "平均海拔高度"], ["C", "年降水量多寡"], ["D", "距海遠近"]], "ans": "B", "exp": "課本說明中國地勢依照平均海拔高度與地形種類，由西向東大致分成三級階梯。"}, {"stem": "中國地勢最高的一級階梯，以下列哪一種地形為主？", "opts": [["A", "山地、高原"], ["B", "平原、丘陵"], ["C", "盆地、沙漠"], ["D", "草原、綠洲"]], "ans": "A", "exp": "最高一級階梯以青藏高原及喜馬拉雅山等山地、高原為主體，是三大階梯中海拔最高者。"}, {"stem": "中國最高一級階梯（以青藏高原為主）的平均海拔高度約為多少？", "opts": [["A", "約 500 公尺以下"], ["B", "約 1,000～2,000 公尺"], ["C", "約 4,000 公尺以上"], ["D", "約 8,000 公尺以上"]], "ans": "C", "exp": "課本指出最高階梯（青藏高原一帶）平均高度約 4,000 公尺以上，有「世界屋脊」之稱。"}, {"stem": "中國三級階梯中，居於中間（次高）的一級，主要由哪些地形構成？", "opts": [["A", "高原與盆地"], ["B", "平原與丘陵"], ["C", "山地與沙漠"], ["D", "三角洲與草原"]], "ans": "A", "exp": "次高階梯（中階梯）以內蒙古高原、黃土高原等高原，以及準噶爾盆地、塔里木盆地、四川盆地等盆地分布為主。"}, {"stem": "中國次高階梯（中階梯）的平均海拔高度大致落在下列哪一個範圍？", "opts": [["A", "約 1,000～2,000 公尺"], ["B", "約 4,000 公尺以上"], ["C", "約 100 公尺以下"], ["D", "約 5,000～6,000 公尺"]], "ans": "A", "exp": "課本指出次高階梯地勢降到 2,000 公尺以下、約 1,000 多公尺左右，是高原與盆地的主要分布區。"}, {"stem": "中國三級階梯中，地勢最低的一級以下列哪一種地形組合為主？", "opts": [["A", "高原與盆地"], ["B", "平原與丘陵"], ["C", "山地與高原"], ["D", "沙漠與綠洲"]], "ans": "B", "exp": "最低階梯位於中國東側，主要為河川沖積出的平原與交錯分布的丘陵，是人口稠密、農業發達的精華區。"}, {"stem": "中國地勢最低一級階梯，平均高度大致在多少以下？", "opts": [["A", "4,000 公尺"], ["B", "2,000 公尺"], ["C", "1,500 公尺"], ["D", "1,000 公尺"]], "ans": "D", "exp": "課本指出最低階梯平均高度約在 1,000 公尺以下，以平原與丘陵為主。"}, {"stem": "青藏高原因地勢陡峻、平均海拔高居世界高原之冠，因此被稱為什麼？", "opts": [["A", "天府之國"], ["B", "世界屋脊"], ["C", "世界糧倉"], ["D", "亞洲之心"]], "ans": "B", "exp": "青藏高原地勢陡峻，是世界平均高度最高的高原，因此有「世界屋脊」之稱。"}, {"stem": "關於喜馬拉雅山的敘述，下列何者正確？", "opts": [["A", "位於四川盆地北側"], ["B", "是中國面積最大的沙漠所在地"], ["C", "是世界最高的山脈，也是亞洲許多大河的源頭"], ["D", "屬於中國地勢最低的一級階梯"]], "ans": "C", "exp": "喜馬拉雅山位於青藏高原西南側，是世界最高的山脈，也是亞洲許多大河的發源地，有「大地之母」之譽。"}, {"stem": "中國面積最大的盆地，其內大部分為哪一座沙漠所占據？", "opts": [["A", "塔克拉瑪干沙漠"], ["B", "撒哈拉沙漠"], ["C", "戈壁沙漠"], ["D", "納米比沙漠"]], "ans": "A", "exp": "塔里木盆地是中國面積最大的盆地，盆地內大部分為塔克拉瑪干沙漠所占據，邊緣因高山融雪形成綠洲。"}, {"stem": "黃土高原因黃土質地鬆散，容易發生下列哪一種現象？", "opts": [["A", "表面千溝萬壑、地表破碎，且使黃河含沙量增高"], ["B", "地表終年積雪、冰河地形發達"], ["C", "地勢平坦，完全不受河流侵蝕"], ["D", "因降水過多而形成廣大湖泊"]], "ans": "A", "exp": "黃土質地鬆散、易受流水侵蝕，使黃土高原表面千溝萬壑、地表破碎，也造成黃河挾帶大量泥沙、含沙量高。"}, {"stem": "關於內蒙古高原的景觀特徵，下列敘述何者正確？", "opts": [["A", "終年溼潤多雨，森林茂密"], ["B", "地勢平坦遼闊，乾燥少雨，多為沙漠與草原景觀"], ["C", "為中國人口最密集、產業最發達的地區"], ["D", "是中國面積最大的沖積平原"]], "ans": "B", "exp": "內蒙古高原地勢平坦遼闊，因深居內陸、距海遙遠，氣候乾燥少雨，多呈現沙漠與草原景觀。"}, {"stem": "四川盆地因地勢封閉、農業發達、物產豐饒，自古以來有什麼稱號？", "opts": [["A", "世界屋脊"], ["B", "中國糧倉"], ["C", "天府之國"], ["D", "東方明珠"]], "ans": "C", "exp": "四川盆地地勢封閉、進出不易，古代須沿河修築棧道，盆地內農業發達、常闢梯田，因而有「天府之國」之稱。"}, {"stem": "新疆境內、位於準噶爾盆地與塔里木盆地一帶的地形，主要分布在中國三級階梯中的哪一級？", "opts": [["A", "最高階梯"], ["B", "最低階梯"], ["C", "沿海階梯"], ["D", "次高（中）階梯"]], "ans": "D", "exp": "準噶爾盆地與塔里木盆地皆位於次高（中）階梯，與內蒙古高原、黃土高原、四川盆地同屬此階梯的代表地形。"}, {"stem": "關於東北平原的敘述，下列何者正確？", "opts": [["A", "是中國面積最大的沙漠 "D", "東西部人口分布更平均"]], "ans": "C", "exp": "老年人口比例持續增加，加上幼年人口比例下降，將導致勞動人口減少、社會福利支出增加，未來可能衝擊經濟發展。"}, {"stem": "中國新生兒性別比失衡（男多於女）的主要原因是？", "opts": [["A", "戰爭導致男性減少"], ["B", "一胎化政策加上重男輕女的傳統觀念"], ["C", "醫療資源不足"], ["D", "東西部遷移"]], "ans": "B", "exp": "隨著生育率下降，加上重男輕女的傳統觀念影響，一胎化政策實施後中國新生兒性別比明顯偏高，男多於女。"}, {"stem": "依康軒課本資料，中國新生兒「男多於女」的性別失衡現象，大約始於哪個年代之後？", "opts": [["A", "一九九○年代"], ["B", "一九五○年代"], ["C", "二○一○年代"], ["D", "一九七○年代"]], "ans": "A", "exp": "課本指出，隨著生育率下降與重男輕女觀念影響，一九九○年代以後，中國新生兒性別比男多於女的失衡現象，遠高於世界其他國家。"}, {"stem": "依翰林版課本資料，西元2024年中國新生兒性別比高達109，其意義為何？", "opts": [["A", "每100個男性對應109個女性"], ["B", "每109個家庭中有100個生男孩"], ["C", "每100個女性對應109個男性"], ["D", "男女比例已達平衡"]], "ans": "C", "exp": "性別比代表每100位女性所對應的男性人數，2024年中國新生兒性別比達109，即每100個女性對應109個男性，顯示幼年人口明顯男多於女。"}, {"stem": "為改善性別比失衡問題，中國政府採取的宣導對策為何？", "opts": [["A", "限制女性外出工作"], ["B", "提高男孩生育補助"], ["C", "推廣「生男生女一樣好」的性別平等觀念"], ["D", "禁止選擇性別生產"]], "ans": "C", "exp": "面對性別比失衡問題，中國政府透過標語與宣導，推廣「生男生女一樣好」的觀念，盼能改變民眾重男輕女的傳統想法。"}, {"stem": "為紓緩少子化與勞動人口不足的隱憂，中國政府大約於哪一年前後開放生育第二胎，逐步終結一胎化政策？", "opts": [["A", "2000年"], ["B", "2015年"], ["C", "1990年"], ["D", "2021年"]], "ans": "B", "exp": "南一、翰林版課本皆指出，中國於2015年開放「生育二胎」政策（康軒版則記載為2016年初全面開放），終結長期實施的一胎化政策。"}, {"stem": "中國政府於哪一年進一步實施「三孩政策」，並提供教育、住房、就業等補助以鼓勵生育？", "opts": [["A", "2021年"], ["B", "2015年"], ["C", "2010年"], ["D", "2023年"]], "ans": "A", "exp": "三版課本皆指出，中國於2021年開放生育第三胎（三孩政策），政府並提供相關補助以鼓勵人民生育，因應人口高齡化與勞動力減少的問題。"}, {"stem": "開放二胎、三孩政策實施後，課本對其成效的描述是？", "opts": [["A", "出生率立即大幅回升"], ["B", "完全解決了性別比失衡問題"], ["C", "使中國人口重返高速成長"], ["D", "短時間內成效尚不顯著，出生率仍持續下降"]], "ans": "D", "exp": "課本指出，雖然政府陸續調整生育政策，但短時間內成效尚不顯著，出生率下降的趨勢未能有效扭轉。"}, {"stem": "依課本最新資料，中國目前的自然增加率與人口總數呈現何種趨勢？", "opts": [["A", "自然增加率持續升高，人口快速增加"], ["B", "自然增加率不變，人口總數持平"], ["C", "自然增加率呈現負值，人口總數出現減少"], ["D", "自然增加率為零，人口維持穩定"]], "ans": "C", "exp": "課本指出，儘管政策不斷調整，中國目前自然增加率呈現負值，人口總數也出現減少的現象。"}, {"stem": "中國國內人口遷移中，人口大量集中移入的地區主要為？", "opts": [["A", "西部高原與盆地"], ["B", "東南沿海地區及大都市"], ["C", "東北森林地帶"], ["D", "內蒙古草原"]], "ans": "B", "exp": "中國國內人口因就業機會較多、薪資所得較高等拉 , "opts": [["A", "傳統重男輕女觀念根深蒂固"], ["B", "農業活動對男性勞力需求較高"], ["C", "女性受教育機會增加、進入都市工作比例提高"], ["D", "農村人口自然增加率為負值"]], "ans": "D", "exp": "課本指出農村性別比失衡加劇的原因包括傳統重男輕女觀念、農業對男性勞力的需求，以及女性因受教育機會增加而多進入都市工作，並未提及農村自然增加率為負值。"}, {"stem": "中國東南沿海地區在近代成為人口大量外移的主要推力，其原因為何？", "opts": [["A", "氣候寒冷不適人居"], ["B", "政府強制遷移人口"], ["C", "丘陵廣布、山多田少，人口增加難以謀生"], ["D", "少數民族比例過高"]], "ans": "C", "exp": "中國東南沿海地區因丘陵廣布、山多田少，隨著人口逐漸增加而形成人口外移的巨大推力，居民被迫向外遷移謀生。"}, {"stem": "早先中國東南沿海人口外移，主要遷往的地區為何？", "opts": [["A", "歐洲各國"], ["B", "東南亞與臺灣"], ["C", "中東地區"], ["D", "中南美洲"]], "ans": "B", "exp": "課本指出，早先中國東南沿海人口外移，以遷往鄰近的東南亞與臺灣人數最多。"}, {"stem": "十九世紀以後，大批中國華工遠赴美國、澳洲等地，主要從事何種工作？", "opts": [["A", "採礦、築路"], ["B", "經商、金融"], ["C", "捕魚、造船"], ["D", "種植茶葉、絲織"]], "ans": "A", "exp": "課本指出，十九世紀以後，數以百萬計的華工前往美國、澳洲等地，以採礦、築路等工作維生。"}, {"stem": "課本所述「文化擴散」的意涵為何？", "opts": [["A", "少數民族文化逐漸消失的過程"], ["B", "政府強制推行單一文化政策"], ["C", "都市文化取代鄉村文化的現象"], ["D", "移民將原鄉的生活方式與文化帶到移居地，進而擴散開來"]], "ans": "D", "exp": "移民在海外各地重建或複製原鄉的生活方式，將飲食、衣著、住宅、習俗、宗教信仰等文化帶到新居地，使原鄉文化擴散到世界各地，稱為文化擴散。"}, {"stem": "課本提到，清代來自福建安溪縣的移民，移居今新北市何地時，為凝聚同鄉情感而興建廟宇，並沿用原鄉的廟名，也成為當地地名的由來？", "opts": [["A", "板橋區"], ["B", "三峽區"], ["C", "泰山區"], ["D", "淡水區"]], "ans": "C", "exp": "清代福建安溪移民移居今新北市泰山區時，興建了頂泰山巖，沿用原鄉泰山巖的廟名，這也是今日泰山區地名的由來，展現移民的文化擴散。"}, {"stem": "課本提到的「牛車水」，是位於哪個國家、由早期華人移民聚居而形成的中國城？", "opts": [["A", "泰國"], ["B", "新加坡"], ["C", "馬來西亞"], ["D", "印尼"]], "ans": "B", "exp": "牛車水是新加坡著名的中國城，為早期華人移民的聚居地之一，現今仍保留許多傳統建築與特色美食，展現華人文化在海外的擴散與保存。"}, {"stem": "中國東南沿海哪兩省因人口大量向海外遷移，而被稱為著名的「僑鄉」？", "opts": [["A", "福建、廣東"], ["B", "浙江、江蘇"], ["C", "山東、河北"], ["D", "廣西、雲南"]], "ans": "A", "exp": "課本指出，中國東南沿海的福建、廣東一帶，因山多平原少、謀生不易，人民大量向海外遷移，是中國著名的「僑鄉」。"}, {"stem": "課本指出，中國東部與西部傳統維生方式（農業與畜牧）出現明顯差異，主要受下列何種因素影響？", "opts": [["A", "政府的產業政策"], ["B", "交通建設的多寡"], ["C", "民族組成的不同"], ["D", "降水量與地形條件的差異"]], "ans": "D", "exp": "東部近海地區降水較多、平原廣闊，農業發達；西部地區降水較少、多山地高原，除河谷綠洲可耕作外，傳統以畜牧維生，兩地的維生方式差異主要受自然環境（降水與地形）影響。"}, {"stem": "課本描述，中國新疆地區因氣候乾燥，牧民多採取何種傳統維生方式？", "opts": [["A", "定居式的商業畜牧"], ["B", "山牧季移"], ["C", "逐水草而居的游牧"], ["D", "大規模穀物農業"]], "ans": "C", "exp": "新疆乾燥地區的牧民為尋找水源和牧草，過著逐水草而居的游牧生活。"}, {"stem": "課本描述，青藏高原地區的牧民「春天上山放牧，秋天下山避冬」，這種順應季節變化移動放牧的方式稱為？", "opts": [["A", "逐水草游牧"], ["B", "山牧季移"], ["C", "定耕農業"], ["D", "輪耕休養"]], "ans": "B", "exp": "青藏高原地區的牧民會順應季節變化，春天上山放牧、秋天下山避冬，這種傳統維生方式稱為山牧季移。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

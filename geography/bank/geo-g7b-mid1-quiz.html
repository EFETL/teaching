<script>
const QS=[{"stem": "課本提到「一地在某段時期人口數量的變動稱為人口成長」，下列何者最能說明課本為何強調人口是「動態」的變化過程？", "opts": [["A", "因為人口數量一旦確定就不會再改變"], ["B", "因為人口普查每十年才進行一次"], ["C", "因為一地隨時都有人出生與死亡，人口數量持續在變動"], ["D", "因為人口只會因為天災而減少"]], "ans": "C", "exp": "課本說明「一地的人口數量為一動態的變化過程，因為隨時都會有人出生和死亡」，故強調人口成長是持續變動的過程。"}, {"stem": "下列關於「自然增加」的敘述，何者正確？", "opts": [["A", "是指某地區在過去一年中，因出生與死亡所造成的人口數量變動"], ["B", "是指某地區因移入與移出所造成的人口數量變動"], ["C", "是指一地總人口除以土地面積所得的數值"], ["D", "是指一地人口從鄉村移往都市的現象"]], "ans": "A", "exp": "自然增加是指某地區在過去一年中，因出生與死亡所造成的人口數量變動，其變動比率稱為自然增加率。"}, {"stem": "某地今年出生人口數為8,000人，死亡人口數為9,500人，則該地今年的自然增加率為？", "opts": [["A", "正值，因為出生數大於死亡數"], ["B", "無法判斷，需搭配移入移出資料"], ["C", "為零，因為人口數不變"], ["D", "負值，因為死亡人口數多於出生人口數"]], "ans": "D", "exp": "課本說明「當死亡人口數多於出生人口數，自然增加率為負」，此題死亡數（9,500）大於出生數（8,000），故自然增加率為負值。"}, {"stem": "下列何者是「社會增加」的正確定義？", "opts": [["A", "因出生與死亡所造成的人口數量變動"], ["B", "某地區在過去一年中，因移入與移出所造成的人口數量變動"], ["C", "一地人口在山地與平地間的分布差異"], ["D", "一地在不同季節的人口流動總稱"]], "ans": "B", "exp": "社會增加是指某地區在過去一年中，因移入與移出所造成的人口數量變動，其變動比率稱為社會增加率。"}, {"stem": "某鄉鎮今年移入人口為1,200人，移出人口為2,000人，則該鄉鎮的社會增加率應為？", "opts": [["A", "正值"], ["B", "負值"], ["C", "零"], ["D", "無法計算"]], "ans": "B", "exp": "課本指出「當移出人口數多於移入人口數，社會增加率為負」，此題移出（2,000）多於移入（1,200），故社會增加率為負值。"}, {"stem": "課本在計算出生率、死亡率、移入率、移出率時，習慣採用「千分比」而非「百分比」表示，其主要原因為何？", "opts": [["A", "千分比計算比較簡單"], ["B", "政府規定一定要用千分比"], ["C", "百分比只能用於面積計算"], ["D", "因分母（總人口數）數值甚大，換算成百分比數值太小，故放大10倍以千分比表示較方便"]], "ans": "D", "exp": "課本註明：「因分母的人口總數數值甚大，導致計算所得的百分比數值太小，為方便表示，故習慣上採用可將數值放大10倍的千分比」。"}, {"stem": "一地的「人口成長」是下列哪兩者的綜合結果？", "opts": [["A", "自然增加與社會增加"], ["B", "出生率與死亡率"], ["C", "移入率與人口密度"], ["D", "都市化與工業化"]], "ans": "A", "exp": "課本說明「一地的人口成長是自然增加與社會增加的綜合結果，通常以人口總數和人口增加率的變化來表示」。"}, {"stem": "根據課本敘述，臺灣的人口長期以來大致呈正成長，但從民國幾年後開始出現人口增加率為負成長的現象？", "opts": [["A", "民國50年"], ["B", "民國70年"], ["C", "民國109年"], ["D", "民國120年"]], "ans": "C", "exp": "課本明確指出：「臺灣的人口長期以來都呈正成長，但自民國109年後，人口增加率開始出現負成長的現象」。"}, {"stem": "課本提到西元2020年臺灣出現了下列哪一項人口現象？", "opts": [["A", "出生率首次超過死亡率"], ["B", "移入人口首次超過移出人口"], ["C", "人口首次突破2,300萬人"], ["D", "死亡率高於出生率， 舊市區是臺灣人口密度較高的地區？", "opts": [["A", "花蓮、臺東、南投"], ["B", "宜蘭、基隆、嘉義"], ["C", "臺北、臺中、高雄"], ["D", "新竹、苗栗、雲林"]], "ans": "C", "exp": "課本舉例：「臺北及臺中、高雄的舊市區即為臺灣人口密度較高的地區」。"}, {"stem": "下列關於「人口密度」的定義，何者正確？", "opts": [["A", "通常是指每平方公里上居住的人口數，用來表現一地人口分布的疏密程度"], ["B", "是指一地每年出生的人口總數"], ["C", "是指一地移入人口與移出人口的差距"], ["D", "是指一地人口占全國人口的百分比"]], "ans": "A", "exp": "課本說明：「人口密度通常是指每平方公里上居住的人口數，可用來表現一地人口分布的疏密程度」。"}, {"stem": "甲地的土地面積為50平方公里，人口總數為250,000人，則甲地的人口密度約為每平方公里多少人？", "opts": [["A", "500人"], ["B", "2,500人"], ["C", "5,000人"], ["D", "25,000人"]], "ans": "C", "exp": "人口密度＝人口總數÷土地面積＝250,000人÷50平方公里＝5,000人/平方公里。"}, {"stem": "地理學上所稱的「人口組成」，是指一地人口的各種特性所占的比例，下列何者「不屬於」人口組成探討的範疇？", "opts": [["A", "性別"], ["B", "年齡"], ["C", "教育程度"], ["D", "土地面積"]], "ans": "D", "exp": "人口組成包括年齡、性別、教育程度、職業、民族等人口特性，可反映一地社會、經濟特色與變遷；土地面積屬於自然地理範疇，不屬於人口組成的探討內容。"}, {"stem": "「性別比」的定義為何？", "opts": [["A", "每100位男性相對應的女性人數"], ["B", "每100位女性相對應的男性人數"], ["C", "男性人口除以總人口"], ["D", "女性人口除以男性人口再乘以100"]], "ans": "B", "exp": "性別比是指一地男性與女性人口的比例，習慣上以每100位女性相對應的男性人數表示。"}, {"stem": "臺灣傳統性別比長期大於100，主要原因為何？", "opts": [["A", "男性平均壽命較長"], ["B", "政府鼓勵生男孩"], ["C", "傳統重男輕女觀念影響"], ["D", "女性大量移民海外"]], "ans": "C", "exp": "臺灣受傳統重男輕女觀念影響，長期以來男性人口多於女性，使性別比大於100。"}, {"stem": "近年來臺灣性別比逐漸降至100以下，下列何者是造成此現象的原因？", "opts": [["A", "男性出生數大幅增加"], ["B", "政府實施一胎化政策"], ["C", "女性平均壽命縮短"], ["D", "男性死亡率高於女性、女性外籍配偶增加"]], "ans": "D", "exp": "課本指出，近幾年受男性死亡率高於女性、女性外籍配偶人數增加等因素影響，女性人口已稍多於男性，性別比降至100以下。"}, {"stem": "用來顯示一地人口年齡組成最常用的工具為何？", "opts": [["A", "折線圖"], ["B", "人口金字塔"], ["C", "雷達圖"], ["D", "圓餅圖"]], "ans": "B", "exp": "分析一地人口的年齡組成，最常用來顯示的工具即為人口金字塔，可藉此判斷並推估未來人口資源的變化。"}, {"stem": "繪製人口金字塔圖時，下列敘述何者正確？", "opts": [["A", "男左女右，每5歲為一組距，依各級距占總人口百分比繪製"], ["B", "男性繪於右側，女性繪於左側"], ["C", "每10歲為一組距"], ["D", "只需計算65歲以上人口"]], "ans": "A", "exp": "人口金字塔圖是將一地人口先分成男性與女性（男左女右），再各以每5歲為一組計算其占總人口的百分比例，依年齡由小到大疊畫而成。"}, {"stem": "某地區人口金字塔呈現底部寬、頂部窄的三角形，具有高出生率、高死亡率的特徵，此類型多出現於下列何種地區？", "opts": [["A", "已開發國家"], ["B", "經濟較落後的國家"], ["C", "高齡化社會的歐洲國家"], ["D", "生育率極低的東亞國家"]], "ans": "B", "exp": "高出生率、高死亡率、壯年人口比例低的人口金字塔類型，多出現於經濟較落後的國家。"}, {"stem": "某人口金字塔顯示低死亡率、但出生率正逐漸下降，壯年人口比例較高，此類型多出現於下列何處？", "opts": [["A", "開發中國家"], ["B", "已開發國家"], ["C", "戰爭頻繁地區"], ["D", "極度落後地區"]], "ans": "A", "exp": "低死亡率、出生率逐漸下降、壯年人口比例較高的類型，多出現於開發中的國家。"}, {"stem": "已開發國家的人口結構多屬於下列哪一種人口金字塔類型？", "opts": [["A", "高出生率、高死亡率"], ["B", "低死亡率、出生率逐漸下降"], ["C", "低出生率、低死亡率"], ["D", "出生率持續上升"]], "ans": "C", "exp": "低出生率、低死亡率的人口結構，多屬於已開發國家的人口金字塔類型。"}, {"stem": "若要判斷不同地區的「發展程度差異」，最適合比較下列何者？", "opts": [["A", "同一時期、不同地區的人口金字塔圖"], ["B", "同一地方、不同時期的人口金字塔圖"], ["C", "各地的降雨量分布圖"], ["D", "各地的行政區域圖"]], "ans": "A", "exp": "比較同一時期、不同地區的人口金字塔圖，可判斷這些地區的發展程度差異。"}, {"stem": "若想了解臺灣人口結構隨時間的變化，例如比較民國36年與民國112年的人口金字塔圖，此屬於下列何種比較方式？", "opts": [["A", "同一地方、不同時期的比較"], ["B", "同一時期、不同地區的比較"], ["C", "不同國家間的經濟比較"], ["D", "不同氣候區的人口比較"]], "ans": "A", "exp": "比較同一地方、不同時期的人口金字塔圖，可分析該地在不同時期的社會結構特徵，如比較臺灣民國36年與民國112年的人口金字塔圖。"}, {"stem": "「扶養比」是指下列何種比例關係？", "opts": [["A", "男性人口與女性人口的比例"], ["B", "壯年人口與被扶養的老年及幼年人口的比例"], ["C", "都市人口與鄉村人口的比例"], ["D", "出生人口與死亡人口的比例"]], "ans": "B", "exp": "扶養比是指具有生產力的壯年人口與被扶養的老年及幼年人口的比例。"}, {"stem": "關於扶養比的敘述，下列何者正確？", "opts": [["A", "扶養比愈低，代表老年人口比例愈高"], ["B", "扶養比與壯年人口比例無關"], ["C", "扶養比愈高，代表扶養負擔愈小"], ["D", "扶養比愈低，代表壯年人口比例愈高，扶養負擔愈小"]], "ans": "D", "exp": "課本指出扶養比愈低，代表壯年人口比例高，扶養負擔小；反之則代表壯年人口比例低，扶養負擔大。"}, {"stem": "根據學者研究，當一地扶養比低於50%時，代表下列何種現象？", "opts": [["A", "人口老化嚴重"], ["B", "勞動力充足，有利經濟發展"], ["C", "出生率過高"], ["D", "移工人數過多"]], "ans": "B", "exp": "學者研究指出，當一地扶養比低於50%，表示勞動力充足，有利經濟發展；一旦扶養比回升至50%以上，經濟發展的有利條件就會逐漸消失。"}, {"stem": "近年來臺灣的扶養比呈現何種變化趨勢？其主要原因為何？", "opts": [["A", "持續下降，因出生率提高"], ["B", "維持不變"], ["C", "持續上升，因出生率下降、平均壽命延長"], ["D", "大幅下降，因移工大量移入"]], "ans": "C", "exp": "課本指出，臺灣人口的出生率下降、平均壽命延長，因此扶養比開始上升，扶養負擔逐漸加重。"}, {"stem": "根據聯合國的標準，一國65歲以上老年人口比例超過多少，即進入「高齡化社會」？", "opts": [["A", "7%"], ["B", "5%"], ["C", "14%"], ["D", "20%"]], "ans": "A", "exp": "根據聯合國標準，一國老年人口比例超過7%即為高齡化社會；超過14%稱為高齡社會；超過20%則為超高齡社會。"}, {"stem": "一國老年人口比例超過14%時，稱為下列何者？", "opts": [["A", "高齡社會"], ["B", "高齡化社會"], ["C", "超高齡社會"], ["D", "少子化社會"]], "ans": "A", "exp": "老年人口比例超過14%稱為高齡社會；超過7%為高齡化社會；超過20%為超高齡社會。"}, {"stem": "一國老年人口比例一旦超過20%，即進入下列何種社會？", "opts": [["A", "高齡化社會"], ["B", "超高齡社會"], ["C", "高齡社會"], ["D", "開發中社會"]], "ans": "B", "exp": "老年人口比例超過20%即進入超高齡社會，是三個門檻中程度最深的階段。"}, {"stem": "臺灣的老年人口比例於民國幾年超過14%，正式進入高齡社會？", "opts": [["A", "民國81年"], ["B", "民國100年"], ["C", "民國107年"], ["D", "民國112年"]], "ans": "C", "exp": "課本指出，隨著醫療衛生進步、國民平均壽命延長，臺灣老年人口比例已於民國107年超過14%，正式進入高齡社會。"}, {"stem": "一般而言，人口老化程度與經濟發展程度有何關係？", "opts": [["A", "經濟愈發達，出生率愈高"], ["B", "經濟愈落後，老年人口比例愈高"], ["C", "兩者沒有任何關係"], ["D", "經濟愈發達，醫療衛生愈進步，老年人口比例愈高"]], "ans": "D", "exp": "課本指出，一國經濟愈發達，醫療衛生愈進步，平均壽命愈長，老年人口比例也就愈高。"}, {"stem": "關於臺灣近年生育率的敘述，下列何者正確？", "opts": [["A", "生育率持續上升，居全球之冠"], ["B", "生育率為全球最低之一，平均每位婦女一生生育數不到1人"], ["C", "生育率維持穩定不變"], ["D", "生育率雖低但仍高於已開發國家平均"]], "ans": "B", "exp": "課本指出臺灣平均每位婦女一生僅生育不到1人（約0.87人），是全球生育率最低的國家之一。"}, {"stem": "臺灣生育率長期偏低，可能對未來造成下列何種影響？", "opts": [["A", "扶養比持續下降"], ["B", "老年人口比例降低"], ["C", "人口金字塔呈現底部寬大的擴張型"], ["D", "勞動力減少，影響經濟發展"]], "ans": "D", "exp": "課本指出，臺灣生育率過低，連帶造成勞動力減少，將影響未來的經濟發展。"}, {"stem": "下列哪一項較可能是造成臺灣出生率持續下降的原因？", "opts": [["A", "社會生育觀念改變、養育負擔增加"], ["B", "醫療衛生環境改善"], ["C", "平均壽命縮短"], ["D", "死亡率上升"]], "ans": "A", "exp": "出生率下降主要與生育觀念改變、養育成本與負擔增加等社會因素較相關，醫療衛生環境改善則主要影響死亡率下降。"}, {"stem": "下列何者主要與「死亡率下降」較有直接關係？", "opts": [["A", "社會福利提高"], ["B", "女性教育程度提升"], ["C", "晚婚不婚風氣盛行"], ["D", "衛生環境改善"]], "ans": "D", "exp": "衛生環境改善使國民健康情形提升，與死亡率下降較有直接關係；社會福利提高則較會影響出生率。"}, {"stem": "面對少子化與高齡化的人口議題，政府可能採取下列哪一項對策？", "opts": [["A", "限制國際移工人數"], ["B", "取消所有社會福利"], ["C", "提高生育津貼、建構友善高齡照護環境"], ["D", "鼓勵人口大量外移"]], "ans": "C", "exp": "課本指出，政府為減輕人民養育子女負擔、提升生育率，以及建構友善的高齡環境，提出許多對策因應少子化與高齡化。"}, {"stem": "目前臺灣主要由哪些族群共同組成？", "opts": [["A", "只有漢人一種族群"], ["B", "原住民族、漢人、新住民"], ["C", "原住民族與外國觀光客"], ["D", "新住民與國際移工兩種"]], "ans": "B", "exp": "課本指出，臺灣是多個族群所共同居住的地方，主要的族群包括原住民族、漢人、新住民。"}, {"stem": "關於臺灣原住民族的敘述，下列何者正確？", "opts": [["A", "目前經行政院核定共16族，以花蓮縣與桃園市人口最多"], ["B", "是漢人來臺後才形成的族群"], ["C", "人口數已超過臺灣總人口的一半"], ["D", "全部集中居住於離島地區"]], "ans": "A", "exp": "原住民族是在漢人來臺之前，原本就居住於臺灣的族群，目前經行政院核定者共16族，以居住在花蓮縣與桃園市的人口最多。"}, {"stem": "根據民國112年底統計，臺灣原住民族人口數約為多少？", "opts": [["A", "約5萬多人"], ["B", "約200萬人"], ["C", "約500萬人"], ["D", "約58萬9千多人"]], "ans": "D", "exp": "課本指出，至民國112年底為止，臺灣原住民族的人口數約為58萬9千多人。"}, {"stem": "關於臺灣「漢人」族群的敘述，下列何者正確？", "opts": [["A", "是臺灣最早的原生族群"], ["B", "皆為近半世紀內才移入臺灣"], ["C", "全數集中在山地地區"], ["D", "由中國大陸移民拓墾及其後裔組成，人數遠超過原住民族"]], "ans": "D", "exp": "漢人是歷經數百年來由中國大陸遷移來臺的移民及其後裔，人數已遠遠超過原住民族，成為臺灣人數最多的族群。"}, {"stem": "「客家小炒」屬於哪一族群的傳統料理，其口味特色為何？", "opts": [["A", "原住民族；清淡爽口"], ["B", "新住民；酸辣開胃"], ["C", "客家人；重油、鹹、香"], ["D", "國際移工；甜膩"]], "ans": "C", "exp": "客家小炒是傳統客家菜肴之一，以五花肉、豆乾、魷魚等為食材，屬於又鹹又香的重口味料理。"}, {"stem": "「新住民」的定義為何？", "opts": [["A", "透過工作、通婚或依親取得中華民國國籍的移入人口"], ["B", "短期來臺觀光的外國人"], ["C", "從事勞務工作但未入籍的外籍勞工"], ["D", "臺灣派駐海外的僑民"]], "ans": "A", "exp": "課本指出，近半世紀以來，愈來愈多人透過工作、通婚或依親取得中華民國國籍，成為新住民。"}, {"stem": "目前臺灣新住民（外籍配偶）的來源，以下列哪些地區人數比例最高？", "opts": [["A", "歐洲、美洲"], ["B", "中東、非洲"], ["C", "中國、越南、印尼等地"], ["D", "大洋洲"]], "ans": "C", "exp": "課本指出，新住民以來自中國、越南、印尼等地的外籍配偶人數比例最高。"}, {"stem": "新住民來源以中國、越南、印尼等地人數比例最高，主要原因為何？", "opts": [["A", "距離遙遠但語言相通"], ["B", "該些地區經濟最發達"], ["C", "純屬偶然，無特定原因"], ["D", "位置鄰近、語言文化相近"]], "ans": "D", "exp": "課本指出，由於位置上的鄰近性及語言、文化相近，來自中國、越南、印尼等地的外籍配偶人數比例最高。"}, {"stem": "關於「國際移工」的敘述，下列何者正確？", "opts": [["A", "移工已入籍臺灣，列入新住民統計"], ["B", "移工並未入籍臺灣，不列入新住民統計"], ["C", "移工全部來自歐美國家"], ["D", "政府自民國112年才開始開放引進"]], "ans": "B", "exp": "課本明確指出，移工並未入籍臺灣，故不列入新住民的統計，與新住民概念不同。"}, {"stem": "臺灣自民國幾年起，政府開放引進國際移工從事各項勞務工作？", "opts": [["A", "71年"], ["B", "91年"], ["C", "81年"], ["D", "101年"]], "ans": "C", "exp": "課本指出，自民國81年以來，政府開放引進國際移工，從事各項勞務工作。"}, {"stem": "臺灣引進的國際移工，其來源國多為下列哪一類地區？", "opts": [["A", "已開發的歐美國家"], ["B", "高齡化嚴重的東亞國家"], ["C", "經濟發展程度相對較低、勞動力充沛的東南亞國家"], ["D", "人口稀少的大洋洲國家"]], "ans": "C", "exp": "課本指出，臺灣國際移工來源國多為經濟發展程度相對較低的東南亞國家，如越南、印尼、菲律賓、泰國等，這些國家勞動力充沛。"}, {"stem": "下列何者「不是」臺灣國際移工的主要來源國？", "opts": [["A", "越南"], ["B", "加拿大"], ["C", "印尼"], ["D", "菲律賓"]], "ans": "B", "exp": "課本提及臺灣國際移工主要來自越南、印尼、菲律賓、泰國等東南亞國家；加拿大屬於已開發國家，並非主要來源國。"}, {"stem": "桃園市大園清真寺是由哪些人集資興建而成？", "opts": [["A", "全數由政府出資興建"], ["B", "由客家人集資興建"], ["C", "由原住民族集資興建"], ["D", "信仰伊斯蘭教的臺灣人和印尼新住民集資興建"]], "ans": "D", "exp": "課本指出，位在桃園市的大園清真寺，是由信仰伊斯蘭教的臺灣人和印尼新住民集資興建而成。"}, {"stem": "被譽為「東方藝術殿堂」，正殿有三對石柱、雕工細緻的廟宇是？", "opts": [["A", "三峽祖師廟"], ["B", "大園清真寺"], ["C", "阿美族部落祭場"], ["D", "客家會館"]], "ans": "A", "exp": "課本指出，三峽祖師廟被譽為「東方藝術殿堂」，正殿的三對石柱，雕工細緻，屬於漢人的信仰建築。"}, {"stem": "對漢人而言，下列何者常作為居民活動中心？", "opts": [["A", "清真寺"], ["B", "部落祭場"], ["C", "村落廟宇"], ["D", "教堂"]], "ans": "C", "exp": "課本指出，漢人則以村落廟宇作為居民的活動中心，如三峽祖師廟。"}, {"stem": "鄒族重要祭典「mayasvi」（戰祭）的主要意涵為何？", "opts": [["A", "祈求戰神庇佑勇士、加強部落團結"], ["B", "慶祝豐收"], ["C", "紀念祖先渡海來臺"], ["D", "慶祝新居落成"]], "ans": "A", "exp": "課本指出，mayasvi是鄒族重要祭典之一，有著祈求戰神庇佑勇士與加強部落團結的深意。"}, {"stem": "花蓮縣吉安鄉野菜市場中，被視為阿美族最具代表性美食的是？", "opts": [["A", "客家小炒"], ["B", "越南河粉"], ["C", "十心菜"], ["D", "清真料理"]], "ans": "C", "exp": "課本指出，花蓮縣吉安鄉的野菜市場，販售各種野菜，其中「十心菜」為阿美族最具代表性的美食，「心」指的是植物的嫩莖，如檳榔心。"}, {"stem": "越南料理常使用下列哪些香料，使湯頭口味清爽順口？", "opts": [["A", "五花肉、豆乾"], ["B", "檳榔心"], ["C", "麻辣辣椒"], ["D", "檸檬、香茅、薄荷"]], "ans": "D", "exp": "課本提到，湯底加入檸檬、香茅、薄荷等香料的越南火鍋，味道清爽順口，這是東南亞飲食文化融入臺灣的例子。"}, {"stem": "臺灣大眾運輸工具內的廣播系統，通常包含下列哪些語言？", "opts": [["A", "國語、閩南語、客家語等多種語言"], ["B", "只有國語"], ["C", "只有英語"], ["D", "只有原住民族語"]], "ans": "A", "exp": "課本指出，為方便使用者，大眾運輸工具內的廣播系統，有國語、閩南語、客家語等多種語言。"}, {"stem": "高雄市政府將越南語和印尼語標示在指引說明上，這反映了下列何種現象？", "opts": [["A", "原住民族人口大幅成長"], ["B", "新住民與國際移工人數漸增"], ["C", "客家人口外移嚴重"], ["D", "出生率大幅提升"]], "ans": "B", "exp": "課本指出，因應新住民與國際移工人數漸增，許多地方也能看到越南、印尼等東南亞文字的標示說明，如高雄市政府的例子。"}, {"stem": "下列關於臺灣多元族群文化特色的敘述，何者最為適切？", "opts": [["A", "漢人、原住民族、新住民、國際移工的文化都能在臺灣展現，彼此相互尊重"], ["B", "各族群文化應徹底同化為單一文化"], ["C", "只有漢人文化值得保存"], ["D", "移工文化不屬於臺灣多元文化的一部分"]], "ans": "A", "exp": "課本指出，不論是漢人、原住民族，甚至是新住民和國際移工，其文化和特色都能在臺灣這片土地上獲得充分展現，並彼此相互尊重，這正是臺灣多元族群的文化特色。"}, {"stem": "若某國人口金字塔底部窄、頂部相對寬，顯示低出生率、低死亡率，這個國家最可能屬於下列何者？", "opts": [["A", "戰爭剛結束的國家"], ["B", "高出生率的開發中國家"], ["C", "已開發國家"], ["D", "大量移工移入的落後國家"]], "ans": "C", "exp": "低出生率、低死亡率的人口金字塔類型，多屬於已開發國家的人口結構特徵。"}, {"stem": "文中提及來自越南、印尼、菲律賓、泰國等東南亞國家的國際移工，這些國家的人口結構與臺灣相比，通常呈現下列何種特徵？", "opts": [["A", "出生率較低、人口老化較嚴重"], ["B", "勞動力充沛、人口結構較年輕"], ["C", "完全相同，無明顯差異"], ["D", "皆已進入超高齡社會"]], "ans": "B", "exp": "課本指出，這些勞力充沛的東南亞國家，其人口結構與臺灣有相當程度的差異，屬於勞動力充沛、人口結構較年輕的類型，因而大量移工移入臺灣工作。"}, {"stem": "若某地區女性人口為100萬人，男性人口為105萬人，則該地區的性別比約為多少？", "opts": [["A", "95"], ["B", "100"], ["C", "110"], ["D", "105"]], "ans": "D", "exp": "性別比＝（男性人口 ÷ 女性人口）×100 ＝（105萬 ÷ 100萬）×100 ＝105。"}, {"stem": "下列有關臺灣人口與族群現況的敘述，何者正確？", "opts": [["A", "臺灣扶養比持續下降，扶養負擔愈來愈輕"], ["B", "臺灣原住民族人口數已超越漢人成為第一大族群"], ["C", "臺灣已於民國107年進入高齡社會，且生育率為全球最低之一"], ["D", "國際移工皆已入籍成為新住民"]], "ans": "C", "exp": "課本指出臺灣老年人口比例已於民國107年超過14%，正式進入高齡社會；同時臺灣生育率極低，是全球生育率最低的國家之一。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "東北亞的範圍主要包括哪兩大地形區？", "opts": [["A", "中南半島與馬來群島"], ["B", "日本群島與朝鮮半島"], ["C", "蒙古高原與西伯利亞"], ["D", "華北平原與長江中下游平原"]], "ans": "B", "exp": "東北亞範圍包括日本群島與朝鮮半島，分別涵蓋日本、南韓（大韓民國）、北韓（朝鮮民主主義人民共和國）三個國家。"}, {"stem": "朝鮮半島因位置介於中國與日本之間，故有下列何種稱號？", "opts": [["A", "火藥庫"], ["B", "世界屋脊"], ["C", "十字路口"], ["D", "東亞陸橋"]], "ans": "D", "exp": "朝鮮半島位置介於中國與日本之間，因此有「東亞陸橋」之稱。"}, {"stem": "日本群島主要由下列哪四個大島及周邊數千個小島組成？", "opts": [["A", "北海道、本州、四國、九州"], ["B", "本州、沖繩、對馬、佐渡"], ["C", "北海道、本州、沖繩、四國"], ["D", "九州、四國、琉球、對馬"]], "ans": "A", "exp": "日本列島四面環海，主要由北海道、本州、四國、九州四個大島與周邊數千個小島所組成。"}, {"stem": "朝鮮半島北部主要與中國的哪座山脈接壤？", "opts": [["A", "崑崙山脈"], ["B", "太行山脈"], ["C", "長白山"], ["D", "秦嶺"]], "ans": "C", "exp": "朝鮮半島北與中國的長白山接壤，長白山天池亦為北韓與中國的界湖，並為鴨綠江、圖們江等河川的源頭。"}, {"stem": "東北亞在氣候分區上屬於下列何者的一部分？", "opts": [["A", "大陸性氣候區"], ["B", "季風亞洲"], ["C", "地中海型氣候區"], ["D", "熱帶莽原氣候區"]], "ans": "B", "exp": "東北亞屬於季風亞洲的一部分，氣候上受季風影響顯著，氣候溼潤多雨，降水多集中於夏季。"}, {"stem": "朝鮮半島南部隔著哪種地形與日本相望？", "opts": [["A", "山脈"], ["B", "高原"], ["C", "沙漠"], ["D", "海峽"]], "ans": "D", "exp": "朝鮮半島東、西、南三面環海，南隔海峽與日本相望。"}, {"stem": "日本群島西側緊鄰、且對其冬季氣候有重要影響的海域是？", "opts": [["A", "日本海"], ["B", "黃海"], ["C", "鄂霍次克海"], ["D", "南海"]], "ans": "A", "exp": "冬季時西北季風經過日本海帶來水氣，使本州島的日本海沿岸多雨雪，可知日本海對日本冬季氣候影響甚大。"}, {"stem": "朝鮮半島的「天池」是哪座山頂的火口湖，同時也是北韓與中國的界湖？", "opts": [["A", "富士山"], ["B", "太白山"], ["C", "長白山（白頭山）"], ["D", "蓋馬高原"]], "ans": "C", "exp": "長白山（韓稱白頭山）山頂的天池為北韓與中國的界湖，也是鴨綠江、圖們江等河川的源頭。"}, {"stem": "東北亞的地形整體而言具有下列何種特色？", "opts": [["A", "平原廣布，河川長且流量穩定"], ["B", "山多平原少，多港灣"], ["C", "沙漠廣布，缺乏河流"], ["D", "全境為低平原，無明顯山地"]], "ans": "B", "exp": "東北亞地形以山地為主，平原面積狹小，海岸線曲折，多港灣。"}, {"stem": "日本地形以山地為主，其主要成因與下列何者關係最密切？", "opts": [["A", "河流長期侵蝕"], ["B", "冰河刨蝕作用"], ["C", "風力侵蝕堆積"], ["D", "位處板塊交界帶"]], "ans": "D", "exp": "日本地處板塊交界帶，地殼不穩，受板塊擠壓影響，山地地形廣布。"}, {"stem": "日本因位處板塊交界帶，容易發生下列哪些自然現象？", "opts": [["A", "火山、地震與溫泉"], ["B", "沙塵暴與旱災"], ["C", "龍捲風與冰雹"], ["D", "洪水與土石流"]], "ans": "A", "exp": "日本地處板塊交界帶，地殼不穩，多火山、地震與溫泉。"}, {"stem": "日本的平原主要分布於下列何處？", "opts": [["A", "北海道北部"], ["B", "九州西岸"], ["C", "本州島東南沿海"], ["D", "四國中央山地"]], "ans": "C", "exp": "日本受板塊擠壓影響，山地地形廣布，平原則面積狹小，主要分布於本州島東南沿海。"}, {"stem": "日本因地形起伏大，河川普遍具有下列何種特色？", "opts": [["A", "河道寬廣，航運發達"], ["B", "河川短小流急，缺乏航運價值"], ["C", "流量穩定，四季皆可通航"], ["D", "多形成廣大三角洲平原"]], "ans": "B", "exp": "日本因地形起伏大，河川普遍短小，缺乏航運價值，但中、上游河床落差大，利於水力發電。"}, {"stem": "朝鮮半島的地形以下列何者為主？", "opts": [["A", "盆地與丘陵"], ["B", "沖積平原"], ["C", "沙漠與草原"], ["D", "高原與山地"]], "ans": "D", "exp": "朝鮮半島的地形多高原與山地。"}, {"stem": "朝鮮半島山脈大致呈特殊字型排列，其中地勢最高的地方是？", "opts": [["A", "蓋馬高原"], ["B", "太白山脈"], ["C", "長白山"], ["D", "金堤平原"]], "ans": "A", "exp": "朝鮮半島山脈上半部是蓋馬高原，為半島地勢最高的地方。"}, {"stem": "朝鮮半島地形的「脊梁」，位置偏在半島東部的山脈是？", "opts": [["A", "蓋馬高原"], ["B", "長白山脈"], ["C", "太白山脈"], ["D", "崑崙山脈"]], "ans": "C", "exp": "太白山脈為半島地形的脊梁，位置偏在半島東部。"}, {"stem": "朝鮮半島的平原主要分布於下列何處？", "opts": [["A", "東北沿海"], ["B", "西南沿海"], ["C", "北部高原"], ["D", "半島中央"]], "ans": "B", "exp": "朝鮮半島山脈位置偏東側，平原則多分布於半島西南沿海。"}, {"stem": "日本第一高峰、同時也是一座活火山的是？", "opts": [["A", "立山"], ["B", "白頭山"], ["C", "太白山"], ["D", "富士山"]], "ans": "D", "exp": "富士山海拔3776公尺，是日本第一高峰，也是一座活火山，為日本人的精神象徵。"}, {"stem": "日本、朝鮮半島與臺灣同樣位在下列哪個經常發生地震與火山活動的地帶？", "opts": [["A", "環太平洋火山地震帶"], ["B", "阿爾卑斯喜馬拉雅造山帶"], ["C", "大西洋中洋脊"], ["D", "印度洋海嶺"]], "ans": "A", "exp": "環太平洋火山地震帶是一個環繞太平洋沿岸且經常發生地震與火山活動的地區，日本、臺灣皆位在此地震帶上。"}, {"stem": "2011年在日本引發嚴重海嘯、造成重大災害的地震稱為？", "opts": [["A", "阪神大地震"], ["B", "關東大地震"], ["C", "東日本大地震"], ["D", "北海道大地震"]], "ans": "C", "exp": "2011年東日本大地震引發約10公尺高海嘯，海嘯深入陸地數公里，造成嚴重災害。"}, {"stem": "日本因山多平原少，農民在丘陵地開闢下列何種設施以增加耕地面積？", "opts": [["A", "灌溉渠道"], ["B", "梯田"], ["C", "堤防"], ["D", "水庫"]], "ans": "B", "exp": "日本土地資源有限，農民在丘陵地開闢梯田，種植水稻等作物以增加耕地面積。"}, {"stem": "東北亞因山多平原少，居民的分布型態大致呈現下列何種特色？", "opts": [["A", "平均分散於山地各處"], ["B", "集中於高原地帶"], ["C", "沿內陸河谷零星分布"], ["D", "集中於沿海狹小平原"]], "ans": "D", "exp": "東北亞山地地形廣布，平原狹小，人口多集中在沿海狹小的平原地帶。"}, {"stem": "東北亞大部分地區屬於下列哪種氣候類型？", "opts": [["A", "溫帶季風氣候"], ["B", "熱帶雨林氣候"], ["C", "溫帶地中海型氣候"], ["D", "副極地氣候"]], "ans": "A", "exp": "東北亞以溫帶季風氣候為主。"}, {"stem": "東北亞的氣候整體大致呈現下列何種特色？", "opts": [["A", "終年高溫多雨"], ["B", "終年寒冷少雨"], ["C", "夏熱冬寒、四季分明"], ["D", "乾濕季分明但溫差小"]], "ans": "C", "exp": "東北亞以溫帶季風氣候為主，大致呈現夏熱冬寒、四季分明的氣候特色。"}, {"stem": "東北亞夏季主要吹哪個方向的季風，帶來充沛水氣？", "opts": [["A", "西北季風"], ["B", "東南季風"], ["C", "東北季風"], ["D", "西南季風"]], "ans": "B", "exp": "夏季時，東南季風自南方溫暖海域帶來大量水氣，是主要的降水季節。"}, {"stem": "東北亞冬季主要受哪個方向的季風影響，使氣候寒冷？", "opts": [["A", "東南季風"], ["B", "東北季風"], ["C", "西南季風"], ["D", "西北季風"]], "ans": "D", "exp": "冬季時，受到來自亞洲大陸西北季風的影響，大部分地區氣候十分寒冷。"}, {"stem": "東北亞夏季降水充沛，除了東南季風外，還與下列哪些天氣系統有關？", "opts": [["A", "梅雨鋒面滯留與颱風侵襲"], ["B", "沙塵暴與焚風"], ["C", "寒潮與霜害"], ["D", "龍捲風與雷暴"]], "ans": "A", "exp": "夏季除東南季風外，梅雨鋒面滯留，且時有颱風侵襲，使降水量充沛。"}, {"stem": "日本群島南北氣候差異顯著，主要是因為下列何種原因？", "opts": [["A", "地形高低起伏"], ["B", "距海遠近不同"], ["C", "所跨緯度較大"], ["D", "洋流方向不定"]], "ans": "C", "exp": "日本地處中緯度，因所跨緯度較大，南北氣候差異顯著。"}, {"stem": "日本夏季氣候普遍暖溼，主要受東南季風及下列哪個洋流影響？", "opts": [["A", "親潮"], ["B", "黑潮"], ["C", "加州涼流"], ["D", "千島寒流"]], "ans": "B", "exp": "夏季時，受東南季風和黑潮（暖流）影響，日本各地氣候普遍暖溼。"}, {"stem": "本州島日本海沿岸冬季多雨雪，主要原因為？", "opts": [["A", "受黑潮暖流直接影響"], ["B", "地處低緯，水氣豐沛"], ["C", "受颱風侵襲頻繁"], ["D", "西北季風經過日本海帶來水氣"]], "ans": "D", "exp": "冬季時，西北季風經過日本海帶來水氣，使本州島日本海沿岸多雨雪。"}, {"stem": "與朝鮮半島相比，日本群島因四面環海，氣候受海洋調節較深，因此呈現下列何種特色？", "opts": [["A", "冬夏溫差較小，降水季節分布較均勻"], ["B", "冬夏溫差較大，降水集中夏季"], ["C", "全年幾乎不降雨"], ["D", "沒有明顯的季節變化"]], "ans": "A", "exp": "日本四面環海，氣候受海洋調節與季風影響較深，與中、韓等緯度相近地區相比，冬、夏溫差較小，降水季節分布也較平均。"}, {"stem": "朝鮮半島因與亞洲大陸相連，受大陸性影響較深，相較於日本群島呈現下列何種氣候特色？", "opts": [["A", "年降水量較多、年溫差較小"], ["B", "終年高溫多雨"], ["C", "年降水量較少、年溫差較大"], ["D", "完全沒有四季變化"]], "ans": "C", "exp": "朝鮮半島因與大陸接壤，年降水量較四面環海的日本少，年溫差也較日本大。"}, {"stem": "關於朝鮮半島南北氣候的差異，下列敘述何者正確？", "opts": [["A", "北部（北韓）緯度低、氣候溫暖，生長季長"], ["B", "北部（北韓）緯度高、地勢高，氣候寒冷，生長季短"], ["C", "南部（南韓）氣候比北部寒冷"], ["D", "南北氣候完全相同，沒有差異"]], "ans": "B", "exp": "朝鮮半島北部（北韓）因緯度高、地勢高，冬季較冷且長，生長季較短；南部（南韓）因緯度較低，較為暖溼，生長季較長。"}, {"stem": "日本的北海道與九州相比，下列敘述何者正確？", "opts": [["A", "九州緯度較高，冬季嚴寒"], ["B", "北海道緯度較低，較為暖溼"], ["C", "兩地氣候完全相同"], ["D", "北海道緯度較高，冬季較漫長寒冷；九州緯度較低，較暖溼"]], "ans": "D", "exp": "日本所跨緯度大，北海道緯度較高，冬季較漫長、寒冷且大雪紛飛；九州緯度較低，較為 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "根據課本內容，中國人口組成中，人數比例超過90%、居各民族之冠的是哪一個民族？", "opts": [["A", "回族"], ["B", "漢族"], ["C", "藏族"], ["D", "苗族"]], "ans": "B", "exp": "課本提到中國以漢族人數最多，超過90%以上，其餘各民族則稱為少數民族。"}, {"stem": "課本中，將中國境內漢族以外、人口比例較低的其他民族統稱為什麼？", "opts": [["A", "邊疆民族"], ["B", "地方族群"], ["C", "少數民族"], ["D", "特殊民族"]], "ans": "C", "exp": "除漢族外，其餘民族因人口比例較低，稱為少數民族；不同民族因居住環境差異而發展出各具特色的生活方式與文化。"}, {"stem": "中國人口分布出現「東密西疏」的現象，課本以哪兩個地點的連線做為東西部人口密度的分界？", "opts": [["A", "長江與黃河"], ["B", "秦嶺與淮河"], ["C", "黑河與騰衝"], ["D", "北京與拉薩"]], "ans": "C", "exp": "課本指出，中國大致以東北的黑河與西南的騰衝兩地連線為界，分成人口密度懸殊的東、西兩區。"}, {"stem": "依據課本資料，黑河—騰衝線以東的地區，土地面積雖僅占全國約43%，卻居住了全國約多少比例的人口？", "opts": [["A", "94%"], ["B", "80%"], ["C", "70%"], ["D", "60%"]], "ans": "A", "exp": "東半部因地形平坦、氣候溫暖溼潤、交通便利、產業發達，吸引大量人口聚集，雖僅占全國43%土地，卻居住了高達94%的人口。"}, {"stem": "黑河—騰衝線以西的地區深入內陸，氣候乾燥少雨，多山地、高原與盆地，雖擁有全國約多少比例的土地，人口卻只占全國6%？", "opts": [["A", "30%"], ["B", "40%"], ["C", "50%"], ["D", "57%"]], "ans": "D", "exp": "西半部居民多集中在河谷與綠洲，雖擁有57%的土地面積，人口卻僅占全國的6%，形成人口分布極不均衡的現象。"}, {"stem": "「某一地區能提供生物所需資源，並承受其廢棄物的能力」，這是課本對下列何者的定義？", "opts": [["A", "人口密度"], ["B", "環境負載力"], ["C", "自然增加率"], ["D", "扶養比"]], "ans": "B", "exp": "環境負載力指一地能提供生物所需資源及承受廢棄物的能力，通常環境負載力越高的地方，人口越密集。"}, {"stem": "課本提到，下列何種作法可以提高一地的環境負載力？", "opts": [["A", "農業技術進步，使農產量增加"], ["B", "減少對外交通建設"], ["C", "限制人口移入"], ["D", "降低糧食生產技術"]], "ans": "A", "exp": "科技的進步可以提升環境負載力，例如農業技術進步使農產增加，便能養活更多人口。"}, {"stem": "課本指出，中國人口在西元一九五○年代以前的成長趨勢是？", "opts": [["A", "快速增加"], ["B", "維持穩定不變"], ["C", "呈倍數成長"], ["D", "相對緩慢，甚至出現負成長"]], "ans": "D", "exp": "歷代以來中國人口增減多與政治局勢、糧食供應、醫療衛生有關，一九五○年代以前人口成長相對緩慢，甚至出現負成長。"}, {"stem": "根據課本，西元1950年中國人口總數約為多少？", "opts": [["A", "14億人"], ["B", "10億人"], ["C", "5.5億人"], ["D", "1.5億人"]], "ans": "C", "exp": "課本指出人口總數由西元1950年的5.5億人，到西元1980年已接近10億，成長將近一倍。"}, {"stem": "根據課本，西元1980年中國人口總數已接近多少？", "opts": [["A", "5億人"], ["B", "10億人"], ["C", "14億人"], ["D", "20億人"]], "ans": "B", "exp": "自1950年5.5億人成長至1980年已接近10億人，三十年間人口成長將近一倍。"}, {"stem": "課本指出，中國目前（近年）的人口總數已超過多少？", "opts": [["A", "14億人"], ["B", "10億人"], ["C", "20億人"], ["D", "8億人"]], "ans": "A", "exp": "課本明確指出，中國的人口總數已超過14億人，約占世界總人口的五分之一。"}, {"stem": "根據課本補充資料，西元1700年時中國人口約有多少？", "opts": [["A", "5億人"], ["B", "3億人"], ["C", "8千萬人"], ["D", "1.5億人"]], "ans": "D", "exp": "課本提到西元1700年中國約有1.5億人，三百餘年來人口成長將近十倍，目前已超過14億人。"}, {"stem": "依課本資料，中國人口在西元1700年至1794年間增加一倍，共需時多久？", "opts": [["A", "40年"], ["B", "60年"], ["C", "90年"], ["D", "120年"]], "ans": "C", "exp": "課本資料顯示，西元1700至1794年，人口增加一倍需時90年。"}, {"stem": "課本比較指出，西元1950年至1990年間，中國人口增加近一倍所需的時間為？", "opts": [["A", "90年"], ["B", "40年"], ["C", "150年"], ["D", "200年"]], "ans": "B", "exp": "相較於1700至1794年需90年才增加一倍，1950至1990年僅需40年即增加近一倍，顯示近代人口成長速度明顯加快。"}, {"stem": "中國政府於西元哪一年提出「一胎化政策」，規定一對夫妻只能生育一胎？", "opts": [["A", "1979年"], ["B", "1985年"], ["C", "1990年"], ["D", "2000年"]], "ans": "A", "exp": "三版課本皆指出，中國於西元1979年提出「一胎化政策」，以控制人口快速增加的速度。"}, {"stem": "「一胎化政策」的具體規定內容為何？", "opts": [["A", "鼓勵晚婚晚育"], ["B", "限制人口遷移"], ["C", "禁止跨區生育"], ["D", "規定一對夫妻只能生育一胎"]], "ans": "D", "exp": "一胎化政策規定一對夫妻只能生育一胎，以限制生育、控制人口的快速成長。"}, {"stem": "中國政府推行一胎化政策的主要目的是？", "opts": [["A", "提升人口素質"], ["B", "促進人口遷移"], ["C", "控制人口增加的速度與數量"], ["D", "平衡城鄉人口"]], "ans": "C", "exp": "為了控制人口增加的速度與數量、紓緩人口過多所造成的資源與環境壓力，中國自1970年代起逐步提出計畫生育政策，並於1979年正式實施一胎化政策。"}, {"stem": "一胎化政策雖有效減緩人口成長，卻也衍生出哪兩項主要的人口問題？", "opts": [["A", "糧食不足與交通壅塞"], ["B", "人口快速老化與性別結構失衡"], ["C", "都市化與工業污染"], ["D", "少數民族減少與方言消失"]], "ans": "B", "exp": "一胎化政策使幼年人口比例下降、老年人口比例上升，同時因重男輕女觀念導致新生兒男多於女，分別造成人口快速老化與性別結構失衡兩大問題。"}, {"stem": "依聯合國標準，一地老年人口比例超過多少，即邁入「高齡社會」？", "opts": [["A", "14%"], ["B", "7%"], ["C", "20%"], ["D", "10%"]], "ans": "A", "exp": "課本指出，中國老年人口比例已超過聯合國所訂的14%標準，邁入高齡社會。"}, {"stem": "依課本資料，中國約於西元哪一年，老年人口比例超過14%，邁入高齡社會？", "opts": [["A", "2000年"], ["B", "2010年"], ["C", "2015年"], ["D", "2023年"]], "ans": "D", "exp": "課本指出到了西元2023年，中國老年人口比例已超過聯合國所訂的14%標準，邁入高齡社會。"}, {"stem": "人口快速老化可能對中國帶來下列何種影響？", "opts": [["A", "出生率大幅提高"], ["B", "少數民族人口增加"], ["C", "勞動人口減少，經濟發展受衝擊"], ["D", "東西部人口分布更平均"]], "ans": "C", "exp": "老年人口比例持續增加，加上幼年人口比例下降，將導致勞動人口減少、社會福利支出增加，未來可能衝擊經濟發展。"}, {"stem": "中國新生兒性別比失衡（男多於女）的主要原因是？", "opts": [["A", "戰爭導致男性減少"], ["B", "一胎化政策加上重男輕女的傳統觀念"], ["C", "醫療資源不足"], ["D", "東西部遷移"]], "ans": "B", "exp": "隨著生育率下降，加上重男輕女的傳統觀念影響，一胎化政策實施後中國新生兒性別比明顯偏高，男多於女。"}, {"stem": "依康軒課本資料，中國新生兒「男多於女」的性別失衡現象，大約始於哪個年代之後？", "opts": [["A", "一九九○年代"], ["B", "一九五○年代"], ["C", "二○一○年代"], ["D", "一九七○年代"]], "ans": "A", "exp": "課本指出，隨著生育率下降與重男輕女觀念影響，一九九○年代以後，中國新生兒性別比男多於女的失衡現象，遠高於世界其他國家。"}, {"stem": "依翰林版課本資料，西元2024年中國新生兒性別比高達109，其意義為何？", "opts": [["A", "每100個男性對應109個女性"], ["B", "每109個家庭中有100個生男孩"], ["C", "每100個女性對應109個男性"], ["D", "男女比例已達平衡"]], "ans": "C", "exp": "性別比代表每100位女性所對應的男性人數，2024年中國新生兒性別比達109，即每100個女性對應109個男性，顯示幼年人口明顯男多於女。"}, {"stem": "為改善性別比失衡問題，中國政府採取的宣導對策為何？", "opts": [["A", "限制女性外出工作"], ["B", "提高男孩生育補助"], ["C", "推廣「生男生女一樣好」的性別平等觀念"], ["D", "禁止選擇性別生產"]], "ans": "C", "exp": "面對性別比失衡問題，中國政府透過標語與宣導，推廣「生男生女一樣好」的觀念，盼能改變民眾重男輕女的傳統想法。"}, {"stem": "為紓緩少子化與勞動人口不足的隱憂，中國政府大約於哪一年前後開放生育第二胎，逐步終結一胎化政策？", "opts": [["A", "2000年"], ["B", "2015年"], ["C", "1990年"], ["D", "2021年"]], "ans": "B", "exp": "南一、翰林版課本皆指出，中國於2015年開放「生育二胎」政策（康軒版則記載為2016年初全面開放），終結長期實施的一胎化政策。"}, {"stem": "中國政府於哪一年進一步實施「三孩政策」，並提供教育、住房、就業等補助以鼓勵生育？", "opts": [["A", "2021年"], ["B", "2015年"], ["C", "2010年"], ["D", "2023年"]], "ans": "A", "exp": "三版課本皆指出，中國於2021年開放生育第三胎（三孩政策），政府並提供相關補助以鼓勵人民生育，因應人口高齡化與勞動力減少的問題。"}, {"stem": "開放二胎、三孩政策實施後，課本對其成效的描述是？", "opts": [["A", "出生率立即大幅回升"], ["B", "完全解決了性別比失衡問題"], ["C", "使中國人口重返高速成長"], ["D", "短時間內成效尚不顯著，出生率仍持續下降"]], "ans": "D", "exp": "課本指出，雖然政府陸續調整生育政策，但短時間內成效尚不顯著，出生率下降的趨勢未能有效扭轉。"}, {"stem": "依課本最新資料，中國目前的自然增加率與人口總數呈現何種趨勢？", "opts": [["A", "自然增加率持續升高，人口快速增加"], ["B", "自然增加率不變，人口總數持平"], ["C", "自然增加率呈現負值，人口總數出現減少"], ["D", "自然增加率為零，人口維持穩定"]], "ans": "C", "exp": "課本指出，儘管政策不斷調整，中國目前自然增加率呈現負值，人口總數也出現減少的現象。"}, {"stem": "中國國內人口遷移中，人口大量集中移入的地區主要為？", "opts": [["A", "西部高原與盆地"], ["B", "東南沿海地區及大都市"], ["C", "東北森林地帶"], ["D", "內蒙古草原"]], "ans": "B", "exp": "中國國內人口因就業機會較多、薪資所得較高等拉力吸引，大量向東南沿海地區及大都市集中。"}, {"stem": "吸引中國人口大量向東南沿海與大都市移動的主要「拉力」為何？", "opts": [["A", "較多的就業機會與較高的薪資所得"], ["B", QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

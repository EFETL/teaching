<script>
const QS=[{"stem": "課本依照海岸「構成物質」的不同，將臺灣的海岸主要分為哪兩大類？", "opts": [["A", "東岸與西岸"], ["B", "沙岸與岩岸"], ["C", "高岸與低岸"], ["D", "內海岸與外海岸"]], "ans": "B", "exp": "海岸是海洋與陸地的交界地帶，依構成物質不同可分為沙岸（沙質）及岩岸（岩石質）兩大類，這是本章最基本的分類方式。"}, {"stem": "下列關於「沙岸」特徵的敘述，何者正確？", "opts": [["A", "海岸線曲折、海水較深"], ["B", "多岬角與灣澳，適合建深水港"], ["C", "由山地或丘陵直接與海洋相鄰而成"], ["D", "海岸線平直、海灘寬闊、海水較淺"]], "ans": "D", "exp": "沙岸是由海水、河流的堆積作用所形成，因堆積旺盛，具有海岸線平直、海灘寬闊、海底平坦且海水較淺的特點。"}, {"stem": "下列關於「岩岸」特徵的敘述，何者正確？", "opts": [["A", "海岸線平直、海水較淺"], ["B", "常見沙灘、沙洲與潟湖"], ["C", "多由河流堆積作用形成"], ["D", "山地或丘陵直接與海洋相鄰，海岸線曲折、海水較深"]], "ans": "D", "exp": "岩岸是山地或丘陵直接與海洋相鄰所形成，因山海交錯，具有海岸地形崎嶇、海岸線曲折、海水較深的特點，常見岬角與灣澳。"}, {"stem": "「沙洲」的形成方式，最適合用下列何者說明？", "opts": [["A", "珊瑚蟲遺骸長期堆疊後露出海面"], ["B", "火山噴發物堆積後露出海面"], ["C", "板塊擠壓使地層抬升形成的懸崖"], ["D", "波浪和海流攜帶泥沙，沿著海岸堆積而成的堤狀地形"]], "ans": "D", "exp": "沙洲是由波浪和海流攜帶泥沙、沿著海岸堆積所形成的堤狀地形，是沙岸常見的地形之一。"}, {"stem": "「潟湖」最貼切的定義是下列何者？", "opts": [["A", "沙洲與陸地之間、風浪較小的半封閉海域"], ["B", "深水灣澳中風浪最大的區域"], ["C", "位於岩岸的天然良港"], ["D", "珊瑚礁抬升後形成的內陸湖泊"]], "ans": "A", "exp": "潟湖是沙洲與陸地間圍成的半封閉海域，由於有沙洲的保護，潟湖內通常風浪較小，因此常成為養殖或晒鹽的良好地點。"}, {"stem": "岩岸地區的「岬角」與「灣澳」是如何形成的？", "opts": [["A", "河流堆積泥沙後突出海面成為岬角"], ["B", "山脈走向與海岸線接近垂直，軟岩被侵蝕成灣澳、硬岩凸出成岬角"], ["C", "珊瑚蟲附著在岩石上大量繁殖而成"], ["D", "火山熔岩冷卻凝固後自然形成的階梯狀地形"]], "ans": "B", "exp": "當海岸附近山脈走向與海岸線方向接近垂直、岩層軟硬交互排列時，經海浪長期侵蝕，軟岩容易被侵蝕成灣澳，硬岩則凸出成岬角，形成灣岬相間的海岸景觀。"}, {"stem": "臺灣的珊瑚礁海岸主要分布在南部，其形成最需要下列哪一項自然條件？", "opts": [["A", "河流帶來大量泥沙堆積"], ["B", "板塊擠壓造成懸崖峭壁"], ["C", "緯度較低、水質清澈溫暖，適合珊瑚生長"], ["D", "丘陵直接逼近海岸"]], "ans": "C", "exp": "南部海岸緯度較低、海水清澈溫暖，適合珊瑚生長，珊瑚蟲或貝類的遺骸堆疊、經地殼抬升後露出水面，形成珊瑚礁海岸。"}, {"stem": "墾丁國家公園所在的恆春半島，其海岸原本屬於哪一種類型，後來才因地處熱帶、水質清澈而發展出珊瑚礁地形？", "opts": [["A", "沙岸"], ["B", "岩岸"], ["C", "斷層海岸"], ["D", "潟湖海岸"]], "ans": "B", "exp": "課本說明恆春半島的海岸原屬於岩岸地形，但因地處熱帶、海水清澈溫暖，適合珊瑚生長，才逐漸發展出深具研究與觀光價值的珊瑚礁海岸。"}, {"stem": "臺灣北部海岸因丘陵緊鄰海岸，形成海岸線曲折、多岬角與灣澳的地形，一般稱為什麼海岸？", "opts": [["A", "斷層海岸"], ["B", "岬灣海岸"], ["C", "珊瑚礁海岸"], ["D", "沙岸"]], "ans": "B", "exp": "臺灣北部丘陵緊鄰海岸，形成岬角與灣澳相間的岬灣海岸，灣澳處受岬角屏障、海水較深，常成為天然良港。"}, {"stem": "下列哪一個港口最適合作為「北部岬灣海岸多天然良港」的例證？", "opts": [["A", "基隆港"], ["B", "台南安平港"], ["C", "東港"], ["D", "花蓮港"]], "ans": "A", "exp": "基隆港是天然的深水灣澳，現已成為臺灣北部的重要港口，正是北部岬灣海岸「灣澳深水、利於築港」特色的代表案例。"}, {"stem": "新北市野柳著名的「女王頭」地景，其成因與下列哪一項作用關係最密切？", "opts": [["A", "珊瑚礁抬升作用"], ["B", "火山噴發後熔岩冷卻"], ["C", "河流堆積作用"], ["D", "長期的風化與侵蝕作用"]], "ans": "D", "exp": "女王頭是岩岸受海風及海浪長期侵蝕、加上風化作用所形成的奇岩怪石景觀，經年累月下女王頭的「脖子」也因侵蝕而愈來愈細。"}, {"stem": "臺灣西部海岸因河流挾帶大量泥沙堆積，形成連綿的沙岸地形，沿海居民常利用潟湖從事下列哪些活動？", "opts": [["A", "登山健行與森林遊憩"], ["B", "養殖與晒鹽"], ["C", "深水港建設與貨櫃航運"], ["D", "攀岩與海蝕洞探勘"]], "ans": "B", "exp": "西部沙岸地勢平坦、海水較淺，風平浪靜的潟湖是沿海養殖或晒鹽的良好地點，蚵架、魚塭、鹽田因此廣布於此。"}, {"stem": "臺南市北門、七股一帶居民常見「插架養蚵」的生活方式，最主要是利用了西部海岸的哪一項地形？", "opts": [["A", "潟湖"], ["B", "灣澳"], ["C", "斷崖"], ["D", "珊瑚礁"]], "ans": "A", "exp": "西部沿海地區因海水平淺，居民利用潮汐漲退，在潟湖插架養蚵維生，這是沙岸潟湖典型的土地利用方式。"}, {"stem": "臺灣南部海岸的地表景觀多呈現崎嶇凹凸、岩塊造型奇特，這是受到下列何種地形的影響？", "opts": [["A", "沙洲堆積"], ["B", "火山熔岩覆蓋"], ["C", "斷層陡崖"], ["D", "珊瑚礁構成"]], "ans": "D", "exp": "南部海岸由珊瑚礁構成，地表因珊瑚礁的堆疊而崎嶇凹凸、岩塊造型奇特，墾丁國家公園即以此類地形著稱。"}, {"stem": "臺灣東部海岸位處板塊交界帶，最主要的地形特徵是下列何者？", "opts": [["A", "海岸線平直、海灘寬闊"], ["B", "多潟湖與沙洲"], ["C", "多岬角與灣澳"], ["D", "海岸線陡直、多懸崖峭壁"]], "ans": "D", "exp": "東部海岸位於板塊交界帶，高聳的山地直逼太平洋，因此具有海岸線陡直、多懸崖峭壁的特徵，除部分河口沖積平原外，多數地區不利開發。"}, {"stem": "花蓮縣秀林鄉著名的「清水斷崖」，最適合用來說明臺灣哪一段海岸的地形特色？", "opts": [["A", "北部岬灣海岸"], ["B", "西部沙岸"], ["C", "東部斷層海岸"], ["D", "南部珊瑚礁海岸"]], "ans": "C", "exp": "清水斷崖是典型的斷層海岸景觀，懸崖峭壁直逼太平洋，正是東部海岸「板塊擠壓、地勢陡直」特色的代表。"}, {"stem": "依聯合國海洋法公約，由領海基線向外延伸多少浬的海域範圍，可劃定為一國的領海？", "opts": [["A", "6 浬"], ["B", "50 浬"], ["C", "12 浬"], ["D", "200 浬"]], "ans": "C", "exp": "依聯合國海洋法公約，領海基線向外延伸12浬的範圍作為領海，屬於國土的一部分。"}, {"stem": "一個國家的「專屬經濟海域」，是指領海基線向外延伸多少浬範圍內的海域？", "opts": [["A", "200 浬"], ["B", "12 浬"], ["C", "50 浬"], ["D", "100 浬"]], "ans": "A", "exp": "領海基線向外延伸200浬間的海域，即為該國的專屬經濟海域，國家擁有漁業、礦產等資源開發利用與管理的權利。"}, {"stem": "「領海」與「專屬經濟海域」最主要的差異是下列何者？", "opts": [["A", "領海範圍比經濟海域大"], ["B", "經濟海域禁止任何國家的船隻通行"], ["C", "領海沒有主權，經濟海域才有主權"], ["D", "領海是國土的一部分，經濟海域則是資源開發利用與管理的權利範圍"]], "ans": "D", "exp": "領海是國土的延伸、屬於國家領土的一部分；經濟海域則是該國對其資源（如漁、礦）享有探勘、開發、管理與保育權利的海域範圍，兩   const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

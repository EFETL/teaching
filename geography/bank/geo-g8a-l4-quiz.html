<script>
const QS=[{"stem": "中國自1970年代末期開始推動的經濟政策，主要內容為對外開放、放寬對外貿易的限制，這個政策稱為什麼？", "opts": [["A", "一帶一路"], ["B", "西部大開發"], ["C", "經濟改革開放"], ["D", "南水北調"]], "ans": "C", "exp": "課本提到中國自1970年代末期（南一版指改革開放後）實施經濟改革開放政策，放寬對外貿易限制，是中國經濟起飛與世界工廠形成的起點。"}, {"stem": "早期外國企業紛紛選擇到中國設廠，或委由中國廠商代工生產，最主要的原因是什麼？", "opts": [["A", "中國擁有大量且低廉的勞力與優惠政策"], ["B", "中國的內需市場已經是世界第一"], ["C", "中國的高科技研發能力領先全球"], ["D", "中國的環保法規比其他國家嚴格"]], "ans": "A", "exp": "課本指出改革開放後，中國擁有大量且低廉的勞力和優惠政策等優勢，吸引許多外國企業到中國設廠或委託代工，逐漸使中國成為「世界工廠」。"}, {"stem": "中國早期以「世界工廠」崛起時，最先發展的產業類型屬於下列何者？", "opts": [["A", "精密半導體產業"], ["B", "金融服務業"], ["C", "生技製藥產業"], ["D", "勞力密集型產業（如成衣、玩具、製鞋）"]], "ans": "D", "exp": "課本說明早期發展以勞力密集為主的產業（如製鞋、成衣、玩具等），隨著投資者引進生產技術提升，才逐漸轉型生產較高技術的電子產品。"}, {"stem": "隨著生產技術提升，中國「世界工廠」的產業結構出現什麼樣的轉型？", "opts": [["A", "從農業轉型為觀光旅遊業"], ["B", "從服務業轉型為傳統手工業"], ["C", "從勞力密集產業轉型為電子等較高技術產業"], ["D", "從重工業轉型為漁業"]], "ans": "C", "exp": "課本提到隨著投資者引進生產技術的提升，中國逐漸從勞力密集產業轉型生產較高技術的電子產品，成為全球製造業的重心。"}, {"stem": "中國政府近年大力扶植本土廠商，將原本需要從國外進口的零件轉為在國內生產，使製造過程的上、中、下游串起一條完整的在地供應鏈，這種現象被稱為什麼？", "opts": [["A", "一帶一路"], ["B", "世界市場"], ["C", "紅色供應鏈"], ["D", "區域經濟夥伴協定"]], "ans": "C", "exp": "課本明確定義：中國政府扶植本土廠商，將原本仰賴國外進口的零件轉為國內生產，讓上、中、下游供應鏈完整在地化，稱為「紅色供應鏈」。"}, {"stem": "以手機製造為例，全球前五大智慧型手機品牌中有三個來自中國，這個現象最能說明下列何項事實？", "opts": [["A", "中國不僅具備製造能力，也具備創立品牌與行銷的能力"], ["B", "中國已經停止手機的代工生產"], ["C", "全球手機市場已被中國完全壟斷"], ["D", "中國的手機品牌只在國內銷售"]], "ans": "A", "exp": "課本說明中國手機品牌在全球出貨量排名名列前茅，顯示中國在電子產業不僅止於製造代工，也具備了創立品牌與國際行銷的能力，是世界工廠轉型的重要象徵。"}, {"stem": "近年中國電動汽車產業蓬勃發展，其全球總銷售量的表現為何？", "opts": [["A", "落後於歐洲各國"], ["B", "僅次於美國排名第二"], ["C", "尚未進入國際市場"], ["D", "已躍居全球首位"]], "ans": "D", "exp": "課本指出近年中國的電動汽車產業蓬勃發展，總銷售量已躍居全球首位，其中不乏許多中國本土品牌（如比亞迪）。"}, {"stem": "隨著中國製造實力增強、平均薪資逐年提高，全球各大企業紛紛前往中國設點搶攻市場，這反映出中國扮演了下列哪一種全球化角色？", "opts": [["A", "世界的糧倉"], ["B", "世界的能源出口國"], ["C", "世界的加工出口區"], ["D", "世界市場"]], "ans": "D", "exp": "課本指出隨著中國人民消費能力大幅提升，加上龐大的人口數，中國已逐漸從「世界工廠」蛻變為「世界市場」，成為全球重要的消費市場之一。"}, {"stem": "下列何者不是課本提到中國成為「世界市場」的具體現象？", "opts": [["A", "網路購物營業額屢創新高、電子商務系統發達"], ["B", "無現金支付（行動支付）普及程度名列世界前茅"], ["C", "國際知名品牌與連鎖企業紛紛進駐中國設點"], ["D", "中國的人均可耕地面積逐年提升"]], "ans": "D", "exp": "人均可耕地面積與農業發展有關，屬於農業轉型議題，並非「世界市場」的表現；「世界市場」強調的是消費能力提升、電商發達、行動支付普及、外國品牌進駐等現象。"}, {"stem": "臺灣的手搖飲料品牌大舉進軍中國市場、銷售業績快速成長，這個例子最能反映下列哪一項概念？", "opts": [["A", "中國的第一級產業產值超越第二級產業"], ["B", "臺灣與中國之間完全沒有經貿往來"], ["C", "中國政府禁止外國品牌進入"], ["D", "中國已成為世界主要的消費市場之一"]], "ans": "D", "exp": "課本提到臺灣知名茶飲品牌大舉進軍中國，銷售業績快速成長，正是中國消費市場龐大、吸引各國（含臺灣）品牌進駐的具體例證。"}, {"stem": "根據課本統計資料，中國的國際貿易總值與已開發國家相比，呈現下列哪種現象？", "opts": [["A", "貿易總值與人均GDP皆為世界第一"], ["B", "貿易總值遠低於已開發國家"], ["C", "人均GDP已經超越美國"], ["D", "貿易總值居世界第一，但人均GDP與先進國家仍有差距"]], "ans": "D", "exp": "課本圖表顯示，中國的國際貿易總值位居世界第一，但平均每人國內生產毛額（人均GDP）與美國等先進國家相比，仍有相當的差距。"}, {"stem": "根據課本統計圖，中國目前最主要的貿易夥伴地區為下列何者？", "opts": [["A", "中南美洲與非洲"], ["B", "北極圈周邊國家"], ["C", "大洋洲各島國"], ["D", "歐美和東南亞等地區"]], "ans": "D", "exp": "課本指出中國與世界各國的貿易互動密切，歐美和東南亞等地區是中國最主要的貿易夥伴。"}, {"stem": "2020年由中國與日本、南韓、澳洲、紐西蘭及東協國家共同簽署，成員國彼此享有關稅減免優惠的區域經濟協定，稱為什麼？", "opts": [["A", "南水北調計畫"], ["B", "一帶一路倡議"], ["C", "區域全面經濟夥伴協定（RCEP）"], ["D", "西部大開發政策"]], "ans": "C", "exp": "課本指出2020年中國與日本、南韓、澳洲、紐西蘭和東協國家簽署「區域全面經濟夥伴協定」（RCEP），成員國享有關稅減免，其GDP約占全球總產值的30%，使國際貿易更加便利。"}, {"stem": "自西元2018年起，中國與美國之間出現了什麼樣的經貿變化，進而影響了全球供應鏈？", "opts": [["A", "美國全面開放中國農產品免稅進口"], ["B", "中美簽署自由貿易協定，取消所有關稅"], ["C", "中美發生貿易爭端，美國限制關鍵技術與零組件輸入中國並提高關稅"], ["D", "中國宣布不再與美國進行任何貿易往來"]], "ans": "C", "exp": "課本說明自2018年起中國與美國發生貿易爭端，許多現代工業關鍵性技術與零組件被禁止進入中國，加上美國對部分中國產品課徵較高關稅，影響了中國與世界經濟發展的關係。"}, {"stem": "中美貿易爭端發生後，加上中國國內工資與地價提高、環保標準趨嚴等因素，許多外商採取了下列哪一項因應措施？", "opts": [["A", "擴大投資中國內陸地區的重工業"], ["B", "完全撤出全球市場，停止對外投資"], ["C", "將部分產線移出中國，轉往其他國家"], ["D", "要求中國政府調降基本工資"]], "ans": "C", "exp": "課本指出由於中美貿易爭端、工資與地價提高、政策改變（如環保標準變嚴格）等不利因素，許多外商為規避風險，將部分產線移出中國，改變了中國與世界經濟發展的關係。"}, {"stem": "中國經濟快速成長後，累積了龐大的資金，使其在世界對外投資中扮演的角色為何？", "opts": [["A", "完全依賴外資，不對外投資"], ["B", "僅將資金留在國內建設"], ["C", "成為世界主要的對外投資國之一，投資範圍遍及全球"], ["D", "僅對鄰近的日本、南韓進行投資"]], "ans": "C", "exp": "課本指出由於經濟快速成長，中國迅速累積對外投資的資金，成為世界主要的對外投資國之一，投資範圍遍及全球，其中又以亞洲為主要投資對象。"}, {"stem": "中國近年積極對外投資，其中最受注目、也是重要國家發展戰略的倡議稱為什麼？", "opts": [["A", "南   });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

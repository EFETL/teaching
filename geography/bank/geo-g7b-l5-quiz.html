<script>
const QS=[{"stem": "地理學上所稱的「聚落」，是指下列何者？", "opts": [["A", "只包括都市地區的商業區"], ["B", "人們共同居住、生活與工作的地方"], ["C", "專指人口密度低於鄉村的地區"], ["D", "只存在於交通便利的平原地區"]], "ans": "B", "exp": "聚落是指人們共同居住、生活與工作的地方，依性質大致可分為鄉村聚落與都市聚落兩種類型。"}, {"stem": "聚落依性質大致可分為哪兩種類型？", "opts": [["A", "農村與漁村"], ["B", "傳統聚落與現代聚落"], ["C", "沿海聚落與內陸聚落"], ["D", "鄉村聚落與都市聚落"]], "ans": "D", "exp": "課文說明聚落大致可分成鄉村和都市兩種類型，都市聚落通常由鄉村聚落發展而成。"}, {"stem": "關於都市聚落的形成，下列敘述何者正確？", "opts": [["A", "都市聚落通常由鄉村聚落發展而成"], ["B", "都市聚落與鄉村聚落彼此毫無關聯"], ["C", "都市聚落一定比鄉村聚落先出現"], ["D", "都市聚落只能建立在沿海地區"]], "ans": "A", "exp": "課文明白指出「都市聚落通常由鄉村聚落發展而成」。"}, {"stem": "鄉村聚落的居民主要從事下列哪一級產業活動？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "第四級產業"]], "ans": "C", "exp": "鄉村聚落居民主要從事第一級產業活動(如農、林、漁、牧)，人口通常較少、密度較低。"}, {"stem": "都市聚落的居民職業與人口特徵，下列敘述何者正確？", "opts": [["A", "以第一級產業為主，人口密度低"], ["B", "以第二、三級產業為主，人口密度高"], ["C", "以第一級產業為主，人口密度高"], ["D", "各級產業比例均等，人口密度低"]], "ans": "B", "exp": "都市聚落居民職業以第二、三級產業(工業、服務業)為主，人口通常較多，人口密度較高。"}, {"stem": "一般而言，鄉村聚落與都市聚落相比，下列何者正確？", "opts": [["A", "鄉村人口密度高於都市"], ["B", "兩者人口密度通常相同"], ["C", "都市第一級產業人口比例較高"], ["D", "都市人口密度通常高於鄉村"]], "ans": "D", "exp": "都市聚落人口通常較多、人口密度較高；鄉村聚落人口較少、密度較低。"}, {"stem": "下列哪一種地理條件的地方，較容易帶動二、三級產業發展，進而形成都市？", "opts": [["A", "資源匱乏、交通不便的山區"], ["B", "人煙罕至的高山地帶"], ["C", "資源豐富、交通便利的地方"], ["D", "氣候乾燥、缺乏水源的地區"]], "ans": "C", "exp": "資源豐富、交通便利等地理位置重要的地方，較易帶動二、三級產業發展，使人口不斷增加，形成都市。"}, {"stem": "關於鄉村與都市之間的關係，下列敘述何者正確？", "opts": [["A", "鄉村與都市機能不同，分工合作、相輔相成"], ["B", "鄉村與都市機能完全相同，彼此互不往來"], ["C", "都市只從鄉村獲取利益，未曾提供任何服務"], ["D", "鄉村完全不需要都市提供的任何服務"]], "ans": "A", "exp": "鄉村提供都市糧食、勞力、原料與休閒場所；都市則提供鄉村流行文化、新知、醫療、金融服務與就業機會，兩者分工合作、相輔相成。"}, {"stem": "人口由鄉村向都市集中的過程，稱為下列何者？", "opts": [["A", "都會化"], ["B", "郊區化"], ["C", "工業化"], ["D", "都市化"]], "ans": "D", "exp": "都市地區經濟繁榮、就業機會多，吸引鄉村人口移入，這種人口由鄉村向都市集中的過程稱為都市化。"}, {"stem": "「都市化程度」的計算公式為下列何者？", "opts": [["A", "都市人口數 ÷ 都市土地面積 × 100%"], ["B", "一國(地)住在都市人口數 ÷ 一國(地)人口總數 × 100%"], ["C", "都市數量 ÷ 鄉村數量 × 100%"], ["D", "都市面積 ÷ 全國面積 × 100%"]], "ans": "B", "exp": "都市化程度＝一國(地)住在都市人口數 ÷ 一國(地)人口總數 × 100%，用以了解都市人口占總人口比例的高低。"}, {"stem": "一般而言，經濟發展程度較高的國家，其都市化程度通常如何？", "opts": [["A", "都市化程度也較高"], ["B", "都市化程度較低"], ["C", "與經濟發展程度無關"], ["D", "都市化程度會隨機變動"]], "ans": "A", "exp": "課文指出，經濟發展程度較高的國家，都市化程度也較高。"}, {"stem": "臺灣自民國62年以來，都市化程度大約呈現下列哪一種變化趨勢？", "opts": [["A", "從80％下降到54％左右"], ["B", "一直維持在54％左右，幾乎沒有變化"], ["C", "從54％提高到80％左右"], ["D", "從20％提高到54％左右"]], "ans": "C", "exp": "臺灣從民國62年以來，都市化程度已從54％提高到80％左右，顯示都市人口比例持續上升。"}, {"stem": "下列何者「不是」都市吸引鄉村人口移入的主要原因？", "opts": [["A", "消費水準高、資訊傳播速度快"], ["B", "就業機會多"], ["C", "醫療、教育與文化機能較佳"], ["D", "人口密度較低、土地取得容易"]], "ans": "D", "exp": "都市通常人口密度較高、土地取得不易，吸引人口移入的主因是經濟繁榮、就業機會多、資訊發達及較佳的醫療教育文化機能，而非人口密度低。"}, {"stem": "都市內部人口逐漸向都市周邊遷移，產生「郊區化」現象，其主要原因為何？", "opts": [["A", "都市地區完全禁止人口居住"], ["B", "鄉村地區工作機會大幅增加"], ["C", "人口成長與都市內部交通系統改善"], ["D", "都市土地全面劃為農業用地"]], "ans": "C", "exp": "由於人口成長與都市內部交通系統的改善，都市內過於擁擠的人口逐漸向都市周邊遷移，產生郊區化現象。"}, {"stem": "都市範圍不斷擴張，與周圍都市間分界日趨模糊，形成占地廣、人口數量可觀的區域，稱為下列何者？", "opts": [["A", "衛星都市"], ["B", "都會區"], ["C", "特別行政區"], ["D", "經濟特區"]], "ans": "B", "exp": "隨著都市居民與產業活動向外延伸，都市範圍不斷擴張，與周圍都市分界模糊，常形成占地廣、人口眾多的都會區，如臺北都會區。"}, {"stem": "下列何者「不屬於」課文所述都市大量人口快速擁入常導致的問題？", "opts": [["A", "農業生產大幅增加"], ["B", "地價上漲、房價飆升"], ["C", "交通擁擠"], ["D", "環境品質惡化"]], "ans": "A", "exp": "都市因大量人口快速擁入，常導致地價上漲、房價飆升、交通擁擠、環境品質惡化等問題，而非農業生產增加(農業並非都市的主要產業)。"}, {"stem": "都市發展過程中，老舊市中心可能出現舊屋閒置、倒塌毀壞的情況，此時可透過下列何種方式改善？", "opts": [["A", "遷移全部人口至鄉村"], ["B", "完全拆除都市，另建新都市"], ["C", "都市更新"], ["D", "限制都市對外交通"]], "ans": "C", "exp": "透過都市更新可以改善環境與美化市容，達到提升居住品質與促進土地再開發利用的目的。"}, {"stem": "課文提及臺北市萬華區的哪一處，是都市更新的成功案例？", "opts": [["A", "大稻埕"], ["B", "剝皮寮"], ["C", "西門町"], ["D", "龍山寺"]], "ans": "B", "exp": "課文提及臺北市萬華區的剝皮寮是都市更新的成功案例，透過更新改善環境、美化市容。"}, {"stem": "都市更新的主要目的，下列敘述何者最恰當？", "opts": [["A", "只為了增加都市人口數量"], ["B", "只為了拆除所有舊建築"], ["C", "只為了發展第一級產業"], ["D", "提升居住品質並促進土地再開發利用"]], "ans": "D", "exp": "都市更新可以改善環境與美化市容，達到提升居住品質與促進土地再開發利用的目的。"}, {"stem": "都市問題(如房價飆升、交通擁擠)的產生，主要與下列何者關係最密切？", "opts": [["A", "大量人口快速擁入都市"], ["B", "都市完全禁止工商業發展"], ["C", "都市人口持續外移到鄉村"], ["D", "鄉村人口密度過高"]], "ans": "A", "exp": "都市由於大量人口的快速擁入，常導致地價上漲、房價飆升、交通擁擠、環境品質惡化等問題。"}, {"stem": "課文所稱的「交通」，包括下列哪兩種方式？", "opts": [["A", "陸運與海運"], ["B", "通訊與運輸"], ["C", "公路與鐵路"], ["D", "客運與貨運"]], "ans": "B", "exp": "交通包括通訊與運輸兩種方式，通訊指訊息的傳遞，運輸則包括客、貨的運送。"}, {"stem": "依課文所述，運輸可分為陸運、空運、水運及下列何者？", "opts": [["A", "管線運輸"], ["B", "人力運輸"], ["C", "動物運輸"], ["D", "磁浮運輸"]], "ans": "A", "exp": "運輸包括客、貨的運送，可分為陸運、空運、水運及管線運輸，如油管、水管、天然氣管及電線等。"}, {"stem": "下列何者「不屬於」課文所舉的管線運輸範例？", "opts": [["A", "油管"], ["B", "水管"], ["C", "天然氣管"], ["D", "高速公路"]], "ans": "D", "exp": "管線運輸的例子包括油管、水管、天然氣管及電線等，高速公路屬於陸運中的公路系統，並非管線運輸。"}, {"stem": "臺灣早期通訊方式以下列何者為主？", "opts": [["A", "網際網路"], ["B", "通訊衛星"], ["C", "郵政系統"], ["D", "大眾傳播"]], "ans": "C", "exp": "臺灣早期通訊以郵政系統為主，隨著通訊技術革新，才逐漸發展出電話電信、通訊衛星、網際網路等方式。"}, {"stem": "下列何者「不是」課文所提及的通訊工具？", "opts": [["A", "高速鐵路"], ["B", "郵政"], ["C", "電話電信"], ["D", "網際網路"]], "ans": "A", "exp": "課文提及的通訊工具包含郵政、電話電信、通訊衛星、網際網路與大眾傳播；高速鐵路屬於運輸(陸運)系統，並非通訊工具。"}, {"stem": "由於電信與網際網路的日漸普及，對人們生活造成下列何種影響？", "opts": [["A", "訊息傳遞速度變得更慢"], ["B", "人們之間的互動完全停止"], ["C", "大量訊息可跨越時空阻隔、迅速交流"], ["D", "通訊完全回歸傳統郵政系統"]], "ans": "C", "exp": "電信與網際網路的普及，使大量訊息可以跨越時空阻隔，在全球各地迅速交流，也改變了人們的行為與互動模式。"}, {"stem": "臺灣密集分布於平原地區、山間也多有聯繫的道路系統，主要屬於下列何者？", "opts": [["A", "高速鐵路"], ["B", "公路(國道與省道)"], ["C", "環島鐵路"], ["D", "管線運輸"]], "ans": "B", "exp": "臺灣有便利的公路運輸，如國道與省道等，密集分布於平原地區，山間也多有公路聯繫。"}, {"stem": "臺北到高雄間的高速鐵路，對臺灣南北往來產生下列何種主要影響？", "opts": [["A", "使南北往來完全停止"], ["B", "大幅提高長途運費"], ["C", "只服務貨運，不載客"], ["D", "縮短南北旅運時間"]], "ans": "D", "exp": "鐵路除了環島鐵路網外，運行於臺北到高雄間的高速鐵路，更縮短了南北旅運時間，達成西部一日生活圈願景。"}, {"stem": "目前臺灣境外航空主要依賴下列哪三座機場？", "opts": [["A", "臺中、臺南、屏東"], ["B", "花蓮、臺東、澎湖"], ["C", "桃園、高雄、臺北"], ["D", "基隆、宜蘭、新竹"]], "ans": "C", "exp": "目前臺灣境外航空主要依賴桃園、高雄、臺北三座機場；國內航空則以聯絡東部和離島地區為主。"}, {"stem": "臺灣的國內航空主要功能為何？", "opts": [["A", "取代所有的公路運輸"], ["B", "專門運送國際貨物"], ["C", "只服務桃園與高雄之間"], ["D", "聯絡東部和離島地區"]], "ans": "D", "exp": "課文指出，臺灣國內航空以聯絡東部和離島地區為主，彌補當地陸運不便之處。"}, {"stem": "臺灣的水運以海運為主，而非河運，主要原因為何？", "opts": [["A", "臺灣河流湍急、流量變化大，無河運之利"], ["B", "臺灣完全沒有 業區"], ["D", "鄉村聚落"]], "ans": "D", "exp": "馬耀的家鄉工商業就業機會不多，居民多從事漁業(第一級產業)，符合鄉村聚落的特徵。"}, {"stem": "與馬耀家鄉(都蘭部落)相比，課文提及的高雄市區一景，較可能呈現下列何種都市聚落特徵？", "opts": [["A", "人口密度較低"], ["B", "居民主要從事第一級產業"], ["C", "商業與工業活動較發達、人口較密集"], ["D", "完全沒有交通建設"]], "ans": "C", "exp": "都市聚落居民職業以第二、三級產業為主，人口通常較多、人口密度較高，高雄市區作為都市聚落即呈現此特徵。"}, {"stem": "依「臺灣島夜晚燈光圖」的判讀原則，人口密集、開發程度較高的都市地區，通常會呈現下列何種現象？", "opts": [["A", "夜間燈光較密集、可推論人口密度較高"], ["B", "夜間燈光較稀疏、工業人口較少"], ["C", "自然資源較豐富但幾乎沒有夜間燈光"], ["D", "建築物高度普遍較低、燈光稀疏"]], "ans": "A", "exp": "都市地區人口密集、經濟活動旺盛，夜間用電量大，因此在夜晚燈光圖上通常呈現燈光密集、明亮的區域，可反映當地人口密度較高。"}, {"stem": "課文案例中，馬耀與女友因工作分隔兩地，兩人可透過下列何種方式維繫感情，並非課文提及的方式？", "opts": [["A", "寫信"], ["B", "派專人騎馬送信"], ["C", "通訊軟體視訊"], ["D", "打電話"]], "ans": "B", "exp": "課文提及維繫感情的通訊方式包括寫信、打電話、寄email、通訊軟體視訊等現代通訊工具，「派專人騎馬送信」並非課文所述之現代通訊方式。"}, {"stem": "課文案例指出，從高雄車站、臺東車站開車到臺北車站，距離分別約356公里、332公里，兩地距離差異不大，但實際旅運時間卻顯著不同，其主要原因為何？", "opts": [["A", "高雄到臺北完全沒有任何道路建設"], ["B", "臺東到臺北的道路比高雄到臺北更寬敞"], ["C", "高雄至臺北間興建高速公路，臺東至臺北間主要仍為省道"], ["D", "兩地距離其實完全相同，是地圖測量錯誤"]], "ans": "C", "exp": "高雄與臺北間運輸需求量大，因此興建高速公路(國道)縮短旅運時間；臺東與臺北間運輸需求量較小，除國道5號外，主要仍為行車速限較低的省道，故雖距離相近，旅運時間卻明顯較長。"}, {"stem": "課文以高雄、臺東到臺北的案例說明，交通建設(如高速公路)的興建，主要取決於下列何者？", "opts": [["A", "兩地間的運輸需求量"], ["B", "該地區的海拔高度"], ["C", "該地區的人口總數必須低於十萬人"], ["D", "政府隨機抽籤決定"]], "ans": "A", "exp": "高雄是大都市，與臺北間運輸需求量大，因此興建高速公路；臺東與臺北間運輸需求量較小，故只建有速限較低的省道，顯示交通建設的興建與否，與兩地間的運輸需求量密切相關。"}, {"stem": "連接臺北南港與宜蘭蘇澳之間的高速公路，課文稱之為下列何者？", "opts": [["A", "國道1號"], ["B", "國道3號"], ["C", "省道台9線"], ["D", "國道5號"]], "ans": "D", "exp": "課文提及，臺北南港和宜蘭蘇澳間建有國道5號，是連接東部與北部的重要高速公路。"}, {"stem": "高速鐵路的興建，使臺灣達成下列哪一項願景？", "opts": [["A", "東部一日生活圈"], ["B", "西部一日生活圈"], ["C", "全島零時差生活圈"], ["D", "離島一日生活圈"]], "ans": "B", "exp": "高速鐵路縮短了臺灣北、中、南地區的行車時間，達成西部一日生活圈的願景。"}, {"stem": "課文以馬耀在都市謀生多年後，面臨「定居都市」或「回歸家鄉」的兩難為引言，探討的核心問題最接近下列何者？", "opts": [["A", "個人在鄉村與都市之間，如何權衡就業機會與生活環境的選擇"], ["B", "討論臺灣應該完全廢除都市"], ["C", "討論臺灣應該完全廢除鄉村"], ["D", "純粹介紹臺灣的地形特徵"]], "ans": "A", "exp": "課文透過馬耀的故事，引導學生思考鄉村與都市在機能、生活條件上的差異，以及個人在兩者間如何權衡選擇，呼應「聚落類型」單元的核心概念。"}, {"stem": "綜合本課內容，下列敘述何者最能正確描述臺灣聚落類型與交通網絡的關係？", "opts": [["A", "鄉村與都市機能完全相同，交通建設對兩者影響相同"], ["B", "交通便利與否，與聚落是否發展成都市完全無關"], ["C", "交通便利有助於帶動產業發展，進而促使鄉村聚落逐漸發展為都市聚落"], ["D", "臺灣所有的交通建設都不受兩地間運輸需求量影響"]], "ans": "C", "exp": "課文指出，資源豐富、交通便利等地理位置重要的地方，較易帶動二、三級產業發展，使人口增加，形成都市，顯示交通與聚落發展密切相關。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "北極地區主要是由哪些大洲共同圍繞而成的海域？", "opts": [["A", "歐洲、非洲、大洋洲"], ["B", "歐洲、亞洲、北美洲"], ["C", "亞洲、非洲、大洋洲"], ["D", "北美洲、南美洲、大洋洲"]], "ans": "B", "exp": "課本指出北極地區是歐、亞、北美三洲的北端，以及其所共同圍繞的海域（北極海）。"}, {"stem": "兩極地區因地軸傾斜，會出現下列哪一種特殊的自然現象？", "opts": [["A", "龍捲風"], ["B", "聖嬰現象"], ["C", "焚風"], ["D", "永晝與永夜"]], "ans": "D", "exp": "受地軸傾斜影響，極圈內夏半年會出現永晝現象，冬半年則出現永夜，並伴隨極光等特殊現象。"}, {"stem": "下列關於北極地區自然環境的敘述，何者正確？", "opts": [["A", "全年冰封，人口稀少，僅有少數原住民族從事採集、漁獵維生"], ["B", "為全世界人口最稠密的地區之一"], ["C", "因地處赤道，氣候終年炎熱"], ["D", "屬於熱帶莽原氣候，動植物種類豐富"]], "ans": "A", "exp": "北極地區因氣候嚴寒、生活適應不易，人口稀少，只有極少數原住民族在此以採集、漁獵維生。"}, {"stem": "傳統上居住在北極圈內、以就地取材方式建造冰屋居住的原住民族稱為什麼？", "opts": [["A", "印第安人"], ["B", "毛利人"], ["C", "因紐特人"], ["D", "馬拉加西人"]], "ans": "C", "exp": "課本提到居住於北極圈內的因紐特人，因氣候酷寒，傳統上以就地取材方式建造冰屋居住。"}, {"stem": "北極地區因蘊藏豐富的哪一項天然資源，而吸引周邊國家競相開採投資？", "opts": [["A", "森林與淡水"], ["B", "石油和天然氣"], ["C", "黃金與鑽石"], ["D", "磷蝦與漁業資源"]], "ans": "B", "exp": "北極地區蘊藏豐富的石油和天然氣資源，吸引美國、加拿大、俄羅斯及北歐五國等進行開採和投資。"}, {"stem": "下列何者不是北極地區戰略地位重要的原因？", "opts": [["A", "為南島語族遷徙的起點"], ["B", "蘊藏豐富油氣資源"], ["C", "為歐、亞、北美三洲間的航空捷徑"], ["D", "全球暖化融冰後出現新的船運航道"]], "ans": "A", "exp": "南島語族的遷徙與擴散和北極地區無關；北極地區戰略地位重要的原因在於豐富的油氣資源、航空捷徑與新興船運航道。"}, {"stem": "近年來因全球暖化使北極部分海域融冰，進而可能通行的北極新航道，稱為什麼？", "opts": [["A", "蘇伊士運河"], ["B", "麻六甲海峽"], ["C", "巴拿馬運河"], ["D", "西北航道"]], "ans": "D", "exp": "全球暖化使北極部分地區融冰，打通了西北航道與東北航道，可縮短歐、亞、美三洲間的海運距離。"}, {"stem": "當北極的西北航道能夠常年通行時，最可能因此減少航運量的傳統海上交通樞紐是下列何者？", "opts": [["A", "蘇伊士運河"], ["B", "麻六甲海峽"], ["C", "巴拿馬運河"], ["D", "直布羅陀海峽"]], "ans": "C", "exp": "西北航道可縮短從北美洲東岸到亞洲東岸的航行距離，因此可能使原本需繞行的巴拿馬運河航運量減少。"}, {"stem": "南極地區的自然環境，其主體為下列何者？", "opts": [["A", "南極大陸（南極洲）"], ["B", "北極海"], ["C", "波羅的海"], ["D", "阿拉伯海"]], "ans": "A", "exp": "南極地區包括南極大陸與周邊海域，長年冰雪覆蓋。"}, {"stem": "南極地區之所以比北極地區更寒冷，主要是因為南極大陸的地形以下列何者為主體？", "opts": [["A", "平原"], ["B", "高原"], ["C", "盆地"], ["D", "谷地"]], "ans": "B", "exp": "南極大陸地形以高原為主體，加上陸地比海洋散熱快，使嚴寒程度更甚於北極，是全球最寒冷的地區。"}, {"stem": "下列關於南極地區主權的敘述，何者正確？", "opts": [["A", "屬於距離最近的阿根廷所有"], ["B", "由美國託管"], ["C", "由聯合國安理會五強共管"], ["D", "不屬於任何國家，僅供科學研究之用"]], "ans": "D", "exp": "南極本區主權不屬於任何國家，也無任何長期居住的居民，僅供各國科學家進行學術研究。"}, {"stem": "西元1959年由阿根廷、澳洲、日本、紐西蘭、美國等12國共同簽署的國際公約稱為？", "opts": [["A", "巴黎協定"], ["B", "京都議定書"], ["C", "南極條約"], ["D", "蒙特婁議定書"]], "ans": "C", "exp": "南極條約於西元1959年由阿根廷、澳洲、日本、紐西蘭、美國等12國共同簽署，確認南極屬於全世界人類共有。"}, {"stem": "根據南極條約的精神，下列敘述何者正確？", "opts": [["A", "允許簽署國在南極進行軍事演習"], ["B", "確認南極屬於全世界人類共有，不能在南極進行軍事活動"], ["C", "南極礦產資源由最先發現的國家優先開採"], ["D", "南極條約已於西元2000年失效"]], "ans": "B", "exp": "南極條約確認南極是屬於全世界人類共有，且不能在南極進行軍事活動，相關國家並擱置領土爭議。"}, {"stem": "南極地區吸引各國科學家前往合作進行學術研究的主要原因為何？", "opts": [["A", "獨特的生態系統，以及從未被探知的資源蘊藏和地理環境特性"], ["B", "為全世界人口最密集的地區"], ["C", "蘊藏大量觀光資源與渡假村"], ["D", "為國際軍事演習的熱點地區"]], "ans": "A", "exp": "南極地區獨特的生態系統，以及從未被探知的資源蘊藏和地理環境特性，吸引許多不同國家的科學家合作進行學術研究。"}, {"stem": "南極海域中，因具高經濟價值可作為保健食品，而被大量捕撈的生物是？", "opts": [["A", "鮭魚"], ["B", "鱈魚"], ["C", "海豹"], ["D", "磷蝦"]], "ans": "D", "exp": "課本圖說提到南極磷蝦因可作為保健食品，近年在南極地區被大量捕撈。"}, {"stem": "近年來，南極洲原本深埋冰雪下難以開採的資源，因冰河融化而逐漸受到國際間關注，這項資源主要是？", "opts": [["A", "天然氣"], ["B", "淡水"], ["C", "礦產"], ["D", "石油"]], "ans": "C", "exp": "課本提到近年受冰河融化影響，原來深埋冰雪下無法開採的礦產，成為國際間爭相探勘的對象。"}, {"stem": "下列何者是造成南極地區豐富漁業資源引發國際紛爭的原因？", "opts": [["A", "各國對捕撈與設置海洋保護區的立場不同"], ["B", "南極洲原住民與外來移民的衝突"], ["C", "各國對南極礦區開採權發生軍事對抗"], ["D", "南極條約明文規定禁止任何漁業活動"]], "ans": "A", "exp": "南極豐富的漁業資源，引起國際間捕撈與設置保護區的紛爭。"}, {"stem": "南極沿海冰棚消融，最直接改變了下列哪一種生物的棲地環境，導致其數量急遽下降？", "opts": [["A", "北極熊"], ["B", "企鵝"], ["C", "因紐特人"], ["D", "埃及斑蚊"]], "ans": "B", "exp": "課本圖說提到南極沿海冰棚消融，改變企鵝原本的棲地環境，使其數量急遽下降。"}, {"stem": "「氣候變遷」一詞，依課本定義是指下列何者？", "opts": [["A", "只限於人為因素造成的氣候變化"], ["B", "僅指全球氣溫持續上升的現象"], ["C", "地球氣候在經過一段時期觀察後所發現的變化，成因可能是自然的也可能是人為的"], ["D", "專指臭氧層破洞造成的紫外線增強現象"]], "ans": "C", "exp": "課本定義氣候變遷是指地球氣候在經過一段時期的觀察後，所發現的變化，造成這種變化的原因可能是自然的，也可能是人為的。"}, {"stem": "下列哪一種現象，最足以作為「氣候變遷」的具體表現？", "opts": [["A", "每天日出日落時間的變化"], ["B", "一天內氣溫的日夜溫差"], ["C", "四季更替的規律變化"], ["D", "乾旱、暴雨及異常高、低溫等現象愈趨頻繁"]], "ans": "D", "exp": "在全球範圍內，愈來愈頻繁出現的乾旱、暴雨及異常高、低溫等，都可視為氣候變遷所引起的異常現象。"}, {"stem": "自工業革命以後，人類活動使大氣中哪些氣體大量累積，強化了溫室效應？", "opts": [["A", "氧氣、氮氣"], ["B", "二氧化碳、甲烷"], ["C", "臭氧、氫氣"], ["D", "氦氣、氬氣"]], "ans": "B", "exp": "自工業革命以後，人類讓過多的二氧化碳、甲烷等溫室氣體累積在大氣中，強化了溫室效應，使溫度上升，導致全球暖化。"}, {"stem": "「溫室效應」是指下列哪一種現象？", "opts": [["A", "溫室氣體吸收輻射能量，使地表如同溫室般保持較暖的溫度"], ["B", "農業溫室栽培作物的效應"], ["C", "臭氧層破洞導致紫外線增強的效應"], ["D", "都市熱島效應造成都市溫度偏高的現象"]], "ans": "A", "exp": "大氣中的溫室氣體，就像一條厚厚的被子包住地球，吸收輻射能量，讓地表保持較暖的溫度，如同溫室一樣，因此稱為溫室效應。"}, {"stem": "下列何者不屬於課本所述會強化溫室效應、加速全球暖化的人為因素？", "opts": [["A", "工業發展大量排放溫室氣體"], ["B", "大量砍伐森林，減少能調節溫度的綠地面積"], ["C", "人造建物大面積覆蓋地表，使增溫速度加快"], ["D", "極圈內因地軸傾斜而產生永晝現象"]], "ans": "D", "exp": "永晝現象是地軸傾斜造成的自然現象，並非人為排放溫室氣體所致，與加速全球暖化的人為因素無關。"}, {"stem": "全球暖化下，北極地區的浮冰與南極地區的冰棚範圍逐漸縮小，最直接造成下列哪一種衝擊？", "opts": [["A", "全球農業產量大幅提升"], ["B", "全球人口大量遷往極區"], ["C", "極地生物數量急遽下降"], ["D", "全球降水量整體減少"]], "ans": "C", "exp": "極區與高山的冰融，造成極地生物數量急遽下降，是全球氣候變遷的重要衝擊之一。"}, {"stem": "高山地區因全球暖化，雪線有逐漸向山頂移動的趨勢，最可能導致下列哪一種問題？", "opts": [["A", "高山融雪量減少，使河川下游地區的乾旱問題愈趨嚴重"], ["B", "高山地區降雪量大幅增加"], ["C", "高山冰河擴張並覆蓋山腳平原"], ["D", "河川下游地區水患更加頻繁"]], "ans": "A", "exp": "高山雪線逐漸向山頂移動，高山融雪量減少，將導致河川下游地區的乾旱問題愈趨嚴重。"}, {"stem": "全球暖化使融冰進入海洋，海水總量增加、海平面上升，最直接威脅到下列哪些地區？", "opts": [["A", "高山地區與內陸沙漠"], ["B", "地勢低窪的島國，以及人口稠密的沿海地區"], ["C", "位於極圈內、有永晝永夜現象的地區"], ["D", "溫帶大陸性氣候地區"]], "ans": "B", "exp": "融冰進入海洋後使全球海水總量增加，海平面上升將使地勢低窪的島國，以及全球人口稠密的沿海地區，面臨被淹沒的危機。"}, {"stem": "大洋洲哪一個地勢低平的珊瑚礁島國，因全球暖化、海平面上升，已出現道路在漲潮時被淹沒的情形？", "opts": [["A", "紐西蘭"], ["B", "澳洲"], ["C", "吐瓦魯"], ["D", "巴布亞紐幾內亞"]], "ans": "C", "exp": "課本圖說提到大洋洲的吐瓦魯為珊瑚礁島國，地勢低平，因全球暖化、海平面上升，道路在海水漲潮時被淹沒。"}, {"stem": "全球暖化造成生態環境改變，課本舉例原本只分布在臺灣南部的哪一種病媒蚊，逐漸往中部地區擴散，增加登革熱感染的風險？", "opts": [["A", "家蚊"], ["B", "三斑家蚊"], ["C", "熱帶家蚊"], ["D", "埃及斑蚊"]], "ans": "D", "exp": "課本提到氣候變遷使原本只分布在臺灣南部的埃及斑蚊，逐漸往中部地區擴散，增加登革熱感染的風險。"}, {"stem": "課本提到，歐洲原本一、兩百年才會出現一次的熱浪，近年來已大幅縮短為大約多少年就會發生一次？", "opts": [["A", "1年"], ["B", "10年"], ["C", "50年"], ["D", "100年"]], "ans": "B", "exp": "課本提到歐洲原本100～300年會出現一次的熱浪，受全球暖化影響，已縮短為約10年就會發生一次。"}, {"stem": "下列哪一項不屬於課本所述全球氣候變遷帶來的衝擊？", "opts": [["A", "各國人口出生率普遍提高"], ["B", "極區與高山冰雪融化"], ["C", "海平面上升，威脅 "B", "呈現下降趨勢"], ["C", "沒有明顯變化"], ["D", "先減少後迅速恢復"]], "ans": "B", "exp": "課本圖表顯示近40年來，北極海海冰面積呈現下降趨勢，反映全球暖化對極區的影響。"}, {"stem": "因海水溫度上升，導致澳洲哪一著名海洋生態景觀出現珊瑚白化現象？", "opts": [["A", "大堡礁"], ["B", "尼羅河三角洲"], ["C", "亞馬孫雨林"], ["D", "撒哈拉沙漠"]], "ans": "A", "exp": "課本提到海水溫度上升，使得大堡礁珊瑚白化，是全球暖化對海洋生態衝擊的例子。"}, {"stem": "西元2020年，澳洲東南方發生的森林大火，造成約多少億隻野生動物死傷？", "opts": [["A", "3億隻"], ["B", "10億隻"], ["C", "100億隻"], ["D", "30億隻"]], "ans": "D", "exp": "課本提到西元2020年澳洲東南方的森林大火，殃及約30億隻野生動物。"}, {"stem": "西元2022年，歐洲發生百年大旱，導致哪一條河流水位過低，影響船隻通行？", "opts": [["A", "多瑙河"], ["B", "萊因河"], ["C", "塞納河"], ["D", "泰晤士河"]], "ans": "B", "exp": "課本提到西元2022年歐洲發生百年大旱災，導致萊因河水位過低，影響船隻通行。"}, {"stem": "依課本內容，澳洲森林大火較容易在哪一個季節發生，主要原因為何？", "opts": [["A", "冬季溫度持續下降，森林較為乾燥易燃"], ["B", "春季多雨潮溼，可燃物大量增多"], ["C", "夏季溫度持續上升，加上內陸氣候乾燥，更容易發生森林大火"], ["D", "秋季落葉堆積，缺乏降雨導致乾旱"]], "ans": "C", "exp": "夏季溫度持續上升，加上澳洲當地內陸氣候乾燥，因此更容易發生森林大火。"}, {"stem": "課本提到，京都議定書簽署的主要目的為何？", "opts": [["A", "劃定南極洲各國的勢力範圍"], ["B", "規範北極航道的通行權"], ["C", "保護南島語族的傳統領域"], ["D", "有效控制大氣中的溫室氣體總量，避免全球持續暖化"]], "ans": "D", "exp": "京都議定書提出碳排放對氣候造成的嚴重影響，希望有效控制大氣中的溫室氣體總量，避免全球持續暖化。"}, {"stem": "下列關於京都議定書與巴黎協定關係的敘述，何者正確？", "opts": [["A", "巴黎協定訂定更明確的減排目標，用以取代京都議定書"], ["B", "巴黎協定是京都議定書簽署前的草案"], ["C", "兩者內容完全相同，只是簽署地點不同"], ["D", "巴黎協定廢除了京都議定書所有規範，不再管制溫室氣體排放"]], "ans": "A", "exp": "巴黎協定為遏止全球暖化趨勢，訂定更明確的減排目標，以取代京都議定書，並於西元2020年開始實施。"}, {"stem": "面對氣候變遷這種跨國性、跨世代的議題，課本認為最重要的因應方式是下列何者？", "opts": [["A", "各國各自為政，互不干涉"], ["B", "僅由科學家研究即可，無須各國政府介入"], ["C", "透過國際合作與法律規範，共同減少溫室氣體排放"], ["D", "停止一切工業活動"]], "ans": "C", "exp": "氣候變遷的衝擊超越國界限制，為了減緩其影響，減少溫室氣體排放，各國透過簽署京都議定書、巴黎協定等國際規範，共同因應。"}, {"stem": "下列關於北極與南極自然環境的比較，何者正確？", "opts": [["A", "北極整體平均溫度比南極更低"], ["B", "南極主體為陸地（南極大陸），北極主體為海洋（北極海）"], ["C", "北極與南極都有原住民族長期居住"], ["D", "兩地都不會出現永晝、永夜現象"]], "ans": "B", "exp": "北極地區的主體是歐、亞、北美三洲共同圍繞的北極海；南極地區的主體則是南極大陸，且南極比北極更加寒冷。"}, {"stem": "下列敘述何者最能說明兩極地區在全球氣候變遷中的角色？", "opts": [["A", "兩極地區完全不受全球暖化影響"], ["B", "兩極地區是全球唯一沒有冰雪覆蓋的地區"], ["C", "兩極地區的暖化程度低於赤道地區"], ["D", "兩極地區因自然環境的特性，是直接面對全球暖化衝擊的第一線"]], "ans": "D", "exp": "課本開宗明義指出，兩極地區因為自然環境的因素，是直接面對著全球暖化險峻衝擊的第一線。"}, {"stem": "綜合本課內容，下列何者最能歸納兩極地區目前面臨的共同課題？", "opts": [["A", "全球暖化造成的冰融、生態衝擊，以及各國對資源與主權的爭奪"], ["B", "人口過度密集造成的都市化問題"], ["C", "高度工業化造成的空氣汙染問題"], ["D", "熱帶栽培業造成的雨林濫墾問題"]], "ans": "A", "exp": "兩極地區共同面臨全球暖化造成的冰融與生態衝擊，同時因豐富的資源與重要的戰略地位，成為各國競相爭奪與研究的地區。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "地理學中所稱的「廣義農業」，除了作物種植之外，還包括下列哪些項目？", "opts": [["A", "僅限於稻米與小麥的栽培"], ["B", "牲口飼養、水產捕撈與養殖"], ["C", "僅指使用機械化耕作的大規模農場"], ["D", "僅包含觀光休閒農業活動"]], "ans": "B", "exp": "廣義的農業包括作物種植、牲口飼養，以及水產捕撈與養殖等，是農民在土地上以勞力獲得生活物資的經濟活動。"}, {"stem": "關於臺灣傳統農業的敘述，下列何者正確？", "opts": [["A", "農民多依市場需求決定作物種類與耕作面積"], ["B", "農產品主要用於出口賺取外匯"], ["C", "大量仰賴契作與大型企業合作"], ["D", "農民普遍依照當地自然環境選擇適合的作物，以供應家用為主"]], "ans": "D", "exp": "傳統農業的產出多以供應農家日常生活所需為主，農民普遍依照當地的自然環境選擇適合的作物。"}, {"stem": "現代商業性農業與傳統農業最大的不同在於：", "opts": [["A", "現代農民經營農業的主要目的是將農作物送到市場販賣以獲取利潤"], ["B", "完全不受自然環境影響"], ["C", "只能種植單一作物"], ["D", "不再需要考慮氣候條件"]], "ans": "A", "exp": "現代農民經營農業的主要目的是將農作物送到市場販賣以獲取利潤，其農業經營除自然環境外，也需考量人力、設備、政策與市場供需。"}, {"stem": "許多農民在作物商品化後，僅集中種植一、兩種獲利最高的作物，這種現象稱為：", "opts": [["A", "區域專業化"], ["B", "農業企業化"], ["C", "作物單一化"], ["D", "地產地消"]], "ans": "C", "exp": "作物商品化後為提高獲利，多數農民會保留獲利最高的一、兩種作物，使作物逐漸單一化，此即作物單一化。"}, {"stem": "雲林縣西螺鎮的農民共同組成產銷班與合作社，發展成著名的蔬果專區，這是下列哪一種現代商業性農業特徵的展現？", "opts": [["A", "作物單一化"], ["B", "區域專業化"], ["C", "農業企業化"], ["D", "地產地消"]], "ans": "B", "exp": "為提高市場競爭力，同一地區的農民常共同組成產銷班與合作社，因而形成區域專業化，西螺鎮即為著名例子。"}, {"stem": "某大型企業以經營飼料工廠起家，跨足肉雞、肉豬飼養及肉品加工，並與許多畜牧業者簽訂契約提供飼料、收購肉品，這種現象屬於：", "opts": [["A", "作物單一化"], ["B", "區域專業化"], ["C", "全球化貿易"], ["D", "農業企業化"]], "ans": "D", "exp": "愈來愈多農民與相關企業簽訂契約，成為大型企業的合作夥伴，即為農業企業化的表現。"}, {"stem": "下列哪一種食物產銷型態，其食物里程最短、對環境影響最小？", "opts": [["A", "地方性產銷"], ["B", "全球性產銷"], ["C", "全國性產銷"], ["D", "契作產銷"]], "ans": "A", "exp": "地方性產銷指生產者直接在鄰近市場販售給消費者，此種型態跨越的空間範圍最小、食物里程最短，對環境影響最弱。"}, {"stem": "目前臺灣最常見的農產品產銷流程為何？", "opts": [["A", "生產者直接在產地市集販售給消費者"], ["B", "農產品全部直接出口至國外"], ["C", "生產者集中到當地集貨市場，商人收購後轉運至消費地批發市場，再由零售商賣給消費者"], ["D", "政府統一收購後平均分配給民眾"]], "ans": "C", "exp": "全國性產銷是目前臺灣最常見的產銷方式，生產者產出食物後集中到當地集貨市場，由商人收購再轉運到消費地批發市場，透過零售商賣給消費者。"}, {"stem": "關於臺灣農產品貿易的敘述，下列何者正確？", "opts": [["A", "出口以小麥、黃豆為主"], ["B", "出口以水產等漁產品最多，稻米等穀類次之"], ["C", "進口以稻米、水產品為主"], ["D", "臺灣完全不進口任何農產品"]], "ans": "B", "exp": "臺灣出口的農產品以魚類等水產最多，稻米等穀類次之；進口的農產品主要有小麥、玉米、黃豆、牛肉等。"}, {"stem": "「食物里程」是指：", "opts": [["A", "農產品的重量與運送車次的乘積"], ["B", "農民種植作物所耗費的天數"], ["C", "消費者購買食物所花費的金錢"], ["D", "產地到消費地的運送距離"]], "ans": "D", "exp": "食物里程是指產地到消費地的運送距離，食物里程愈長，消耗的能源愈多、碳排放量愈大，對環境的影響愈強。"}, {"stem": "臺灣街頭出現愈來愈多異國料理，加上東南亞移工與新住民人數增長帶來許多特色美食，這種現象稱為：", "opts": [["A", "飲食全球化"], ["B", "地產地消"], ["C", "慢食運動"], ["D", "食安五環"]], "ans": "A", "exp": "隨著生活型態轉變，消費者對異國食物接受度提高，加上新住民與移工帶來的美食，使飲食跨越國界成為常態，即飲食全球化。"}, {"stem": "現代食品加工方式日趨多元，其主要目的不包括下列何者？", "opts": [["A", "增添食物的美味與口感"], ["B", "減少產品體積、降低運輸成本"], ["C", "完全消除食品的營養價值"], ["D", "延長食物的保存期限"]], "ans": "C", "exp": "食品加工目的包括改變味道外觀、增添美味口感、延長保鮮期、降低運輸成本等，並非為了消除營養價值，故C為非目的的選項。"}, {"stem": "透過基因改造技術，可使農作物具有下列哪些特質？", "opts": [["A", "完全不需要陽光和水分"], ["B", "抗高溫、耐旱、抗蟲害、抗病"], ["C", "只能在溫帶地區種植"], ["D", "無法保存超過一天"]], "ans": "B", "exp": "透過基因改造，可以改變原有的生物特性，使作物具有抗高溫、耐旱、抗蟲害、抗病等特質，以確保足夠的糧食生產。"}, {"stem": "目前全球商業化栽種的基因改造作物，下列何者「不包含」在課本所提及的主要品項中？", "opts": [["A", "黃豆"], ["B", "玉米"], ["C", "棉花"], ["D", "稻米"]], "ans": "D", "exp": "課本提及常見的基因改造作物包括黃豆、玉米、棉花、油菜、甜菜根等，稻米並非課本所列的主要基改作物。"}, {"stem": "依臺灣現行法規，含有基改原料的食品應如何處理？", "opts": [["A", "應於包裝上標示，餐飲業者提供含基改原料的食品也應於菜單或掛牌告知"], ["B", "不須任何標示，因為對人體無害"], ["C", "完全禁止在市面上販售"], ["D", "只需口頭告知消費者即可"]], "ans": "A", "exp": "臺灣現行法規規定含有基改原料的食品應於包裝上標示，餐飲業者提供的食品若含有基改作物，也應於菜單或掛牌告知消費者。"}, {"stem": "關於基因改造作物的敘述，下列何者正確？", "opts": [["A", "科學界已證實基改作物對人體健康絕對有害"], ["B", "全球所有國家都禁止種植基改作物"], ["C", "目前科學界的共識是「無法證實其對健康有害」，但對其優劣評價仍未有定論"], ["D", "基改作物完全不會影響生態環境"]], "ans": "C", "exp": "目前科學界對基改作物的共識為「無法證實其對健康有害」，因此對基改作物的優劣評價仍未有定論。"}, {"stem": "關於臺灣對基因改造作物的規範，下列敘述何者正確？", "opts": [["A", "臺灣目前核准基改作物在國內大規模推廣種植"], ["B", "臺灣尚未核准任何基改作物在國內推廣種植，但開放部分經審查核可的基改作物進口"], ["C", "臺灣完全禁止進口任何基改作物或其加工品"], ["D", "臺灣鼓勵農民自行研發基改作物並外銷"]], "ans": "B", "exp": "臺灣目前尚未核准任何基因改造作物在國內推廣種植，但開放部分飼料用或食品用的基改作物，經審查核可後進口，例如黃豆、玉米、棉花、油菜及甜菜根。"}, {"stem": "「友善環境飲食」的核心精神是：", "opts": [["A", "只吃進口的高級食材"], ["B", "只重視食物的價格是否便宜"], ["C", "完全不考慮食物的碳足跡"], ["D", "選擇不論生產、製作及運銷過程皆對環境友善的食物"]], "ans": "D", "exp": "友善環境飲食是指消費者在選購食物時，能確保對環境永續的態度，選擇生產、製作及運銷過程皆對環境友善的食物。"}, {"stem": "「碳足跡」概念主要用來衡量：", "opts": [["A", "人類活動所製造出來的碳排放量總和對地球生態環境的影響"], ["B", "農產品的甜度與口感"], ["C", "農地面積的大小"], ["D", "農民的收入高低"]], "ans": "A", "exp": "碳足跡指各種人類活動所製造出來的碳排放量總和，此概念主要用來衡量人類活動對地球生態環境的影響。"}, {"stem": "消費者若想降低對食品加工的疑慮，可優先選擇下列何種飲食方式？", "opts": [["A", "多食用高度加工的即食食品"], ["B", "只購買進口冷凍食品"], ["C", "多食用原型食物，並選擇有機農業產出的食物"], ["D", "選擇加工程序愈複雜愈好的食品"]], "ans": "C", "exp": "消費者選擇天然或低度加工的原型食物，可以降低對食品加工的疑慮，其中透過有機農業產出的原型食物對環境更友善。"}, {"stem": "關於有機農業的做法，下列敘述何者正確？", "opts": [["A", "大量使用化學農藥以確保產量"], ["B", "農民避免使用農藥，改用套袋、生物防治等方式防治病蟲害，並以有機肥料取代化學肥料"], ["C", "完全不需要考慮病蟲害的防治"], ["D", "只能種植單一作物"]], "ans": "B", "exp": "選擇有機農業的農民會避免使用農藥，改用套袋、生物防治等方式減少病蟲危害，也會以有機肥料取代化學肥料。"}, {"stem": "臺灣自2002年加入世界貿易組織後，國外農產品進口量大幅增加，因而國內專業人士提出的因應概念是：", "opts": [["A", "全球化採購"], ["B", "基因改造"], ["C", "食安五環"], ["D", "地產地消"]], "ans": "D", "exp": "加入世界貿易組織後，國外農產品進口量大增，衝擊在地小農也拉長食物里程，因此國內專業人士提出「地產地消」概念，鼓勵消費者購買國內農產品。"}, {"stem": "消費者可透過掃描二維條碼（QR Code）查詢農產品在生產、加工、流通、銷售各階段的紀錄，這項制度稱為：", "opts": [["A", "生產履歷（產銷履歷）"], ["B", "食安五環"], ["C", "碳足跡標籤"], ["D", "慢食運動"]], "ans": "A", "exp": "「生產履歷」或稱「產銷履歷」，是各類農產品在生產、加工、流通、銷售各階段的紀錄，消費者可掃描QR Code查詢。"}, {"stem": "屏東科技大學鳥類生態研究室調查發現，黑鳶（老鷹）死亡的原因主要是：", "opts": [["A", "棲息地被工廠占用"], ["B", "感染禽流感病毒"], ["C", "誤食含劇毒農藥的鳥類屍體"], ["D", "誤食基因改造作物"]], "ans": "C", "exp": "部分農民為減少紅豆被鳥類食用，將農藥製成毒餌毒殺鳥類，這些鳥類屍體被老鷹撿食，因而導致老鷹中毒死亡。"}, {"stem": "課本提到，紅豆的「慣行農法」除了使用農藥防治蟲害外，還會噴灑何種藥劑以催熟紅豆？", "opts": [["A", "生長激素"], ["B", "落葉劑"], ["C", "除草劑"], ["D", "殺菌劑"]], "ans": "B", "exp": "慣行的紅豆種植方法除使用農藥防治蟲害外，還會在紅豆熟成前噴灑落葉劑以催熟紅豆。"}, {"stem": "老鷹紅豆的銷售難題最後是如何解決的？", "opts": [["A", "政府強制補貼農民"], ["B", "農民自行放棄種植紅豆"], ["C", "改為完全出口至國外市場"], ["D", "連鎖超市企業願意與農民契作，吸引更多農民加入並建立生產履歷"]], "ans": "D", "exp": "某連鎖超市企業看到老鷹紅豆相關報導，願意與農民契作，解決銷售難題，吸引更多農民參與並建立生產履歷，達到雙贏局面。"}, {"stem": "「糧食自給率」是指：", "opts": [["A", "國內自行生產的糧食占人民糧食總供給量的比例"], ["B", "農民種植糧食作物的總面積"], ["C", "政府對農業的補助金額"], ["D", "進口糧食占國家總預算的比例"]], "ans": "A", "exp": "糧食自給率是指國內自行生產的糧食占人民糧食總供給量的比例，是國家糧食安全的重要指標。"}, {"stem": "下列何者「不是」造成臺灣糧食自給率持續下降的原因？", "opts": [["A", "國人飲食習慣改變"], ["B", "政府推動稻田休耕政策"], ["C", "政府大幅提高稻米收購價格並鼓勵擴大種植"], ["D", "加入世界貿易組織的影響"]], " : "「有機農產品標章」代表的生產方式為：", "opts": [["A", "大量使用化學肥料以提高產量"], ["B", "完全依賴基因改造技術"], ["C", "僅限溫室栽培"], ["D", "全程不使用化學農藥，對環境友善"]], "ans": "D", "exp": "有機農產品標章代表全程不用化學農藥，是對環境友善的生產方式。"}, {"stem": "「三章一Q」是指鼓勵學校午餐選用哪些標章或追溯系統的生鮮食材？", "opts": [["A", "有機、產銷履歷、CAS台灣優良農產品標章，及臺灣農產品生產追溯QR Code"], ["B", "基改標示、進口認證、關稅憑證及檢疫證明"], ["C", "三種進口認證加上一組條碼"], ["D", "三種農藥檢驗合格證明加上一組序號"]], "ans": "A", "exp": "教育部及行政院農業部等單位鼓勵學校午餐選用有機、產銷履歷、台灣優良農產品CAS等標章，或具有臺灣農產品生產追溯QR Code，合稱「三章一Q」。"}, {"stem": "政府推動「校園食材登錄平臺」的主要目的是：", "opts": [["A", "提供學生線上訂購零食的平臺"], ["B", "統計學校營養午餐的總經費"], ["C", "將各級學校食材管理電子化，從餐桌串連到生產源頭，確保營養午餐食材安全"], ["D", "讓學生自行選購校外食材"]], "ans": "C", "exp": "「校園食材登錄平臺」將各級學校食材管理電子化，從餐桌串連到生產源頭，確保營養午餐食材的安全性。"}, {"stem": "聯合國宣布自2019年起，將每年的哪一天訂為「世界食品安全日」？", "opts": [["A", "3月15日"], ["B", "6月7日"], ["C", "10月16日"], ["D", "12月25日"]], "ans": "B", "exp": "聯合國宣布自2019年開始，每年6月7日為「世界食品安全日（World Food Safety Day）」。"}, {"stem": "下列何者「不是」食品供應鏈涵蓋的環節？", "opts": [["A", "栽種、生產、收穫"], ["B", "運輸、貯藏、製造"], ["C", "包裝、販賣"], ["D", "農地重劃與都市計畫審議"]], "ans": "D", "exp": "食品供應鏈是指從食品原料之栽種、生產、收穫、運輸、貯藏、製造、包裝、販賣，直到消費者食用的過程，不包含農地重劃或都市計畫審議。"}, {"stem": "民國71年桃園縣觀音鄉（今桃園市觀音區）發生的鎘米事件，其主要成因是：", "opts": [["A", "化工廠將含鎘廢水直接排入農田灌溉溝渠"], ["B", "農民過量使用農藥"], ["C", "農民誤用基因改造種子"], ["D", "進口稻米品質不佳"]], "ans": "A", "exp": "一家化工廠連續十幾年將含鎘廢水直接排入農田的灌溉溝渠，導致農民種出的稻米變成鎘米，青菜也含高量的鎘。"}, {"stem": "民國60、70年代政府倡導的「客廳即工廠」政策，與哪一項農地汙染問題的出現有密切關係？", "opts": [["A", "高山地區水土流失"], ["B", "基改作物入侵原生生態"], ["C", "小型五金工廠散布在農地間，含重金屬廢水汙染農地"], ["D", "農產品食物里程過長"]], "ans": "C", "exp": "「客廳即工廠」鼓勵家庭代工、擴大外銷，小型五金工廠零星散布在農地間，含重金屬的廢水導致農地嚴重汙染，與鎘米等重金屬汙染事件有關。"}, {"stem": "長期食用含鎘農作物，可能導致下列哪一種中毒症狀，俗稱「痛痛病」？", "opts": [["A", "皮膚過敏、掉髮"], ["B", "骨骼、關節變形，全身劇痛及腎功能衰竭"], ["C", "短暫性失憶"], ["D", "味覺喪失"]], "ans": "B", "exp": "消費者長期攝取含鎘農作物，累積的鎘使體內鈣質流失嚴重，造成骨骼、關節變形、全身劇痛及腎功能衰竭，俗稱「痛痛病」。"}, {"stem": "根據學者研究，每公頃高山高麗菜田平均一年造成的土壤流失量，與果樹及原始林相比為何？", "opts": [["A", "比果樹低3倍，比原始林低5倍"], ["B", "與果樹、原始林完全相同"], ["C", "只有果樹的一半"], ["D", "比果樹高3倍，比原始林高5倍"]], "ans": "D", "exp": "每公頃高麗菜田平均一年會造成15到16公噸土壤流失，比果樹高3倍，比原始林高5倍。"}, {"stem": "高山地區種植高麗菜、茶葉等淺根系植物，對環境可能造成的主要問題是：", "opts": [["A", "對水土保持及環境的破壞比想像中大，農藥肥料容易隨逕流汙染下游用水"], ["B", "提升水土保持能力"], ["C", "完全不會影響土壤品質"], ["D", "有助於增加森林覆蓋率"]], "ans": "A", "exp": "高山地區種植淺根系作物對水土保持及環境的破壞比想像中大，土壤中的農藥與肥料也隨著流入河川，影響下游都會區用水安全。"}, {"stem": "強調使用在地、當季食材，促進在地農業與畜牧業發展的飲食新思維，稱為：", "opts": [["A", "速食（Fast Food）"], ["B", "飲食全球化"], ["C", "慢食（Slow Food）"], ["D", "基因改造飲食"]], "ans": "C", "exp": "「慢食」提倡維持一地原有的飲食文化，使用在地、當季食材，促進在地農業及畜牧業發展，與強調快速供應的「速食」相對。"}, {"stem": "臺灣雖盛產葡萄卻仍大量進口國外葡萄，這種現象主要是因為：", "opts": [["A", "國產葡萄品質較差"], ["B", "南北半球季節相反，可藉由不同國家接力生產、全年供應"], ["C", "政府禁止販售國產葡萄"], ["D", "進口葡萄完全不需運輸成本"]], "ans": "B", "exp": "由於南北半球季節相反，可藉此由不同國家接力生產相同的農產品，各地收成時間不同，因此臺灣雖盛產葡萄，仍有可觀的進口量以全年供應市場需求。"}, {"stem": "身為消費者，下列哪一項做法最能落實食品安全與友善環境飲食的精神？", "opts": [["A", "只選擇進口且高度加工的即食食品"], ["B", "完全不理會食品包裝上的標示"], ["C", "大量囤積不需要的食物造成浪費"], ["D", "選購食品時認明認證標章，並多選用在地、當季食材，減少加工食品攝取"]], "ans": "D", "exp": "消費者可透過認明認證標章、多吃原型食物與在地當季食材、減少加工食品攝取及避免浪費，落實食品安全與友善環境飲食的精神。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

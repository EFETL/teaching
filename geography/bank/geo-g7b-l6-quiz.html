<script>
const QS=[{"stem": "政府在臺灣西部設立六個直轄市，稱為「六都」，其主要目的為何？", "opts": [["A", "便於行政管理"], ["B", "平衡東西部人口"], ["C", "發展重工業"], ["D", "促進兩岸交流"]], "ans": "A", "exp": "課本提到「為了行政管理上的需要，政府在西部地區設立了六個直轄市，俗稱『六都』」。"}, {"stem": "六都之所以能形成，主要與下列何者關係最密切？", "opts": [["A", "氣候與雨量"], ["B", "地形與開發早晚"], ["C", "礦產資源分布"], ["D", "國防戰略地位"]], "ans": "B", "exp": "課本指出「受到地形與開發早晚的影響，臺灣人口多分布在西部地區，因而形成許多大小都市」。"}, {"stem": "六都共同具有下列哪一項優勢，使其成為區域發展的重心？", "opts": [["A", "皆為國際機場所在地"], ["B", "皆有豐富的礦產資源"], ["C", "人口眾多、經濟實力較佳"], ["D", "皆為原住民族聚居地"]], "ans": "C", "exp": "六都擁有眾多人口與較佳的經濟實力，形成區域發展的優勢，並非每都都有國際機場或礦產資源。"}, {"stem": "下列何者為臺灣的政治、經濟與文化中心，並吸引大量國內外企業與人才進駐？", "opts": [["A", "新北市"], ["B", "臺中市"], ["C", "高雄市"], ["D", "臺北市"]], "ans": "D", "exp": "臺北市為臺灣的政治、經濟與文化中心，龐大的政治、經濟與交通優勢，創造大量就業機會，使其成為國際性的大都市。"}, {"stem": "新北市能成為全臺人口最多的都市，主要原因為何？", "opts": [["A", "鄰近臺北市，吸引人口移入"], ["B", "擁有國際機場"], ["C", "為文化古都"], ["D", "重工業發達"]], "ans": "A", "exp": "新北市原為臺北市的郊區，隨著臺北市的發展腳步，吸引眾多人口移入，成為全臺人口最多的都市。"}, {"stem": "桃園市因擁有下列何項建設，加上鄰近臺北都會區，使其人口快速增加？", "opts": [["A", "大煉鋼廠"], ["B", "臺灣規模最大的國際機場"], ["C", "科學園區"], ["D", "高速鐵路總站"]], "ans": "B", "exp": "桃園市毗鄰臺北都會區，擁有臺灣規模最大的國際機場，吸引許多資金投入，人口也不斷增加。"}, {"stem": "下列關於桃園市的敘述，何者正確？", "opts": [["A", "是臺灣文化古都"], ["B", "是臺灣重工業中心"], ["C", "是全臺灣東南亞國際移工人數最多的都市"], ["D", "是臺灣中小企業聚集地"]], "ans": "C", "exp": "隨著工業的發展，桃園市目前是全臺灣東南亞國際移工人數最多的都市。"}, {"stem": "臺中市的工業發展，主要奠基於下列哪些條件？", "opts": [["A", "石化工業區與造船廠"], ["B", "國際機場與科學園區"], ["C", "高粱酒與貢糖等特產"], ["D", "鐵公路交通與臺中港、工業區的設立"]], "ans": "D", "exp": "課本指出便利的鐵公路交通與臺中港、工業區的設立，厚植了臺中市工業發展的基礎。"}, {"stem": "臺中市目前已成為臺灣哪一項產業最重要的聚集地？", "opts": [["A", "中小企業與精密機械"], ["B", "高科技資訊產業"], ["C", "文化創意產業"], ["D", "遠洋漁業"]], "ans": "A", "exp": "臺中市目前已成為臺灣中小企業與精密機械最重要的聚集地。"}, {"stem": "臺南市有「臺灣文化古都」之稱，近年因下列何項建設，成為高科技製造業重鎮？", "opts": [["A", "桃園航空城"], ["B", "南部科學園區臺南園區"], ["C", "大肚山科技走廊"], ["D", "雲林離島式基礎工業區"]], "ans": "B", "exp": "臺南市曾為臺灣的政治、經濟中心，是文化古都；近年南部科學園區臺南園區的設立，使其成為高科技製造業的重鎮。"}, {"stem": "高雄市早期的都市意象與下列何者關係最密切？", "opts": [["A", "農業與漁業"], ["B", "觀光與文創"], ["C", "港口與軍事機能"], ["D", "教育與醫療"]], "ans": "C", "exp": "課本指出「高雄市早期的都市意象多與港口和軍事機能有關」。"}, {"stem": "高雄市目前積極轉型，以發展下列哪些產業為主要目標？", "opts": [["A", "重工業與軍事工業"], ["B", "農業與畜牧業"], ["C", "遠洋漁業"], ["D", "高科技、資訊與文創產業"]], "ans": "D", "exp": "高雄市早期以重工業為主，目前積極轉型，以發展高科技、資訊與文創產業為主要目標。"}, {"stem": "臺灣北部區域的地形以下列何者為主？", "opts": [["A", "丘陵與山地"], ["B", "平原廣闊"], ["C", "盆地與台地"], ["D", "沙洲與潟湖"]], "ans": "A", "exp": "課本指出「臺灣北部區域多丘陵與山地」。"}, {"stem": "蔣渭水高速公路通車後，對北部區域產生下列何種影響？", "opts": [["A", "使臺北港成為海運樞紐"], ["B", "使宜蘭和臺北間往來便利，觀光人潮增加"], ["C", "使新竹成為重工業中心"], ["D", "使基隆納入桃園都會區"]], "ans": "B", "exp": "山脈的阻隔原使蘭陽平原對外交通不便，蔣渭水高速公路通車後，宜蘭和臺北間往來便利，觀光人潮增加。"}, {"stem": "北部區域中，哪個港口是海運樞紐，港口沿岸與河谷一帶人口聚集？", "opts": [["A", "高雄港"], ["B", "臺中港"], ["C", "基隆港"], ["D", "蘇澳港"]], "ans": "C", "exp": "東北沿海的基隆港是北部區域的海運樞紐，港口沿岸與基隆河河谷一帶人口聚集。"}, {"stem": "新竹在設立哪些機構後，成為高科技產業重鎮？", "opts": [["A", "大煉鋼廠與造船廠"], ["B", "國際機場與航空城"], ["C", "六輕工業區"], ["D", "工業技術研究院及科學園區"]], "ans": "D", "exp": "雪山山脈西北側的丘陵、平原區，隨著新竹設立工業技術研究院及科學園區後，成為高科技產業的重鎮。"}, {"stem": "中部區域平原廣闊，其主要灌溉水源來自下列哪一條河流？", "opts": [["A", "濁水溪"], ["B", "淡水河"], ["C", "高屏溪"], ["D", "秀姑巒溪"]], "ans": "A", "exp": "課本指出「濁水溪由東往西流貫，帶來灌溉水源」，是臺灣最重要的稻米、花卉、蔬菜供應地。"}, {"stem": "中部區域被稱為臺灣最重要的哪些農產品供應地？", "opts": [["A", "熱帶水果"], ["B", "稻米、花卉、蔬菜"], ["C", "茶葉與高山蔬菜"], ["D", "石斑魚與虱目魚"]], "ans": "B", "exp": "中部區域平原廣闊，農業發達，是臺灣最重要的稻米、花卉、蔬菜供應地。"}, {"stem": "雲林縣為發展當地經濟，設立了下列哪一項建設？", "opts": [["A", "大肚山科技走廊"], ["B", "南部科學園區"], ["C", "雲林離島式基礎工業區"], ["D", "桃園航空城"]], "ans": "C", "exp": "課本提到「雲林縣為發展當地經濟，設立了雲林離島式基礎工業區」。"}, {"stem": "南投縣境內著名風景區與休閒農場眾多，主要發展下列哪一項產業？", "opts": [["A", "重工業"], ["B", "遠洋漁業"], ["C", "石化工業"], ["D", "觀光和休閒產業"]], "ans": "D", "exp": "中部近山丘陵地帶有豐富山林勝景，地方政府致力發展觀光和休閒產業，南投縣境內觀光資源眾多。"}, {"stem": "南部區域沿海一帶因沙洲羅列、潟湖遍布，居民多從事下列何種產業？", "opts": [["A", "養殖漁業"], ["B", "觀光旅遊"], ["C", "高科技製造"], ["D", "稻米種植"]], "ans": "A", "exp": "課本指出南部沿海一帶居民闢建魚塭，養殖魚蝦貝類，養殖漁業發達。"}, {"stem": "澎湖縣因風多雨少，農業發展條件不佳，其主要產業為何？", "opts": [["A", "稻米與花卉"], ["B", "漁業與觀光業"], ["C", "重工業與造船"], ["D", "高科技產業"]], "ans": "B", "exp": "澎湖縣因風多雨少，農業發展條件不佳，漁業、觀光業成為主要產業。"}, {"stem": "東部區域經濟發展比其他區域遲緩的主要原因為何？", "opts": [["A", "缺乏天然資源"], ["B", "人口過度密集"], ["C", "受山地阻隔，形勢封閉，交通不便"], ["D", "氣候過於乾燥"]], "ans": "C", "exp": "東部區域受山地阻隔，形勢封閉，交通進出不便，經濟發展比其他區域遲緩。"}, {"stem": "東部區域雖然經濟發展較慢，但下列何者成為其發展第一級產業活動和觀光業的基礎？", "opts": [["A", "便利的交通路網"], ["B", "密集的工業區"], ["C", "豐富的礦產資源"], ["D", "較好的環境品質"]], "ans": "D", "exp": "課本指出東部「較好的環境品質成為發展第一級產業活動和觀光業的基礎」。"}, {"stem": "下列何者不是東部區域近年用來吸引遊客的活動？", "opts": [["A", "六輕工業區開放參觀"], ["B", "太魯閣峽谷音樂節"], ["C", "原住民聯合豐年祭"], ["D", "金針花季"]], "ans": "A", "exp": "課本提到東部近年結合自然景觀、族群文化、特產與觀光，舉辦太魯閣峽谷音樂節、原住民聯合豐年祭、金針花季等活動；六輕工業區位於雲林縣，屬中部區域的石化工業設施，與東部觀光無關。"}, {"stem": "金馬地區過去被定位為軍事戰略據點，主要因為其地理位置為何？", "opts": [["A", "深入太平洋"], ["B", "靠近中國福建沿海"], ["C", "位於臺灣海峽中心"], ["D", "緊鄰蘭陽平原"]], "ans": "B", "exp": "金馬地區靠近中國福建沿海，過去被定位為軍事戰略據點，經濟發展受限。"}, {"stem": "金馬地區解除戰地政務並設立小三通對口碼頭後，居民轉以下列何種產業為主？", "opts": [["A", "農業"], ["B", "重工業"], ["C", "服務業"], ["D", "遠洋漁業"]], "ans": "C", "exp": "解除戰地政務，設立與中國小三通的對口碼頭後，金馬地區經濟發展腳步加快，居民轉以服務業為主。"}, {"stem": "小三通是指政府自民國幾年起，開放金門、馬祖與澎湖與中國進行小規模通商、通航、通郵？", "opts": [["A", "民國76年"], ["B", "民國94年"], ["C", "民國107年"], ["D", "民國90年"]], "ans": "D", "exp": "課本註明小三通是指自民國90年起，政府陸續開放金門、馬祖與澎湖等地區與中國進行小規模的通商、通航與通郵。"}, {"stem": "金馬地區成為獨具特色觀光資源的原因，主要與下列何者有關？", "opts": [["A", "起伏地形與岩岸迷人海景"], ["B", "廣闊平原與稻米產區"], ["C", "高科技產業聚落"], ["D", "國際機場交通樞紐"]], "ans": "A", "exp": "金馬地區起伏的地形與岩岸迷人海景，成為獨具特色的觀光資源，加上農特產、特色建築與戰地遺跡吸引遊客。"}, {"stem": "下列何者不屬於金門地區具代表性的特產？", "opts": [["A", "貢糖"], ["B", "雙心石滬"], ["C", "高粱酒"], ["D", "風獅爺"]], "ans": "B", "exp": "貢糖、高粱酒、風獅爺為金門著名特產；雙心石滬是澎湖縣七美鄉利用玄武岩與珊瑚礁構築的傳統漁業設施，並非金門特產。"}, {"stem": "馬祖地區的北海坑道，原本作為下列何種用途？", "opts": [["A", "灌溉水利設施"], ["B", "漁業養殖場"], ["C", "軍事戰備水道"], ["D", "觀光纜車軌道"]], "ans": "C", "exp": "馬祖地區的北海坑道原為軍事戰備水道，現已轉型發展觀光，遊客可體驗坑道內划船的樂趣。"}, {"stem": "臺灣各區域經過長期發展後，出現明顯空間差異的面向不包括下列何者？", "opts": [["A", "經濟"], ["B", "教育"], ["C", "醫療服務"], ["D", "語言"]], "ans": "D", "exp": "課本指出臺灣各區域在經濟、教育與醫療服務等面向出現明顯的空間差異，並未提及語言差異。"}, {"stem": "金馬地區雖然平均每戶可支配所得並不低，但仍有許多居民移居本島，主要考量為何？", "opts": [["A", "工作與兒童就學問題"], ["B", "氣候過於炎熱"], ["C", "缺乏觀光資源"], ["D", "土地價格過高"]], "ans": "A", "exp": "離島各項生活機能相對不足，許多居民考慮到工作與兒童就學問題，逐漸移居本島。"}, {"stem": "本島與離島的差異主要表現在下列哪一項？", "opts": [["A", "語言使用不同"], ["B", "生活機能與公共建設相對不足"], ["C", "宗教信仰不同"], ["D", "人口老化程度較低"]], "ans": "B", "exp": "課本指出離島的各項生活機能和本島比較相對不足，人口流失與交通不便，使離島經濟發展緩慢、公共建設相對落後。"}, {"stem": "臺灣東部與西部相比，下列敘述何者正確？", "opts": [["A", "東部開發較早"], ["B", "東部交通較西部便利"], ["C", "東部大專院校數、工商業家數、醫療院所家數較低"], ["D", "東部人口較西部密集"]], "ans": "C", "exp": "臺灣東部開發較西部晚，交通亦不如西部方便，故大專院校數、工商業家數、醫療院所家數均低於西部地區。"}, {"stem": "臺灣經歷工業化、都市化後，鄉村面臨的主要問題為何？", "opts": [["A", "工商業家數大幅超越都市"], ["B", "醫療資源過剩"], ["C", "房價高漲"], ["D", "人口外流，擴大城鄉發展差距"]], "ans": "D", "exp": "課本指出臺灣經歷工業化、都市化後，鄉村人口外流情形嚴重，擴大了城鄉發展差距。"}, {"stem": "全球化下低價農產品大量進入臺灣市場，對鄉村發展造成下列何種影響？", "opts": [["A", "壓抑在地農產價格，限制鄉村發展"], ["B", "提升農產品價格"], ["C", "增加農業就業人口"], ["D", "促進農地重劃"]], "ans": "A", "exp": "全球的低價農產品大量進入臺灣市場，壓抑在地農產價格，鄉村發展更受限制。"}, {"stem": "課本以苗栗縣與南投縣為例，說明這兩縣的平均每戶可支配所得與臺北市相比為何？", "opts": [["A", "明顯高於臺北市"], ["B", "明顯低於臺北市"], ["C", "與臺北市相當"], ["D", "無法比較"]], "ans": "B", "exp": "課本舉例指出苗栗縣與南投縣的平均每戶可支配所得明顯低於臺北市，工商業家數也普遍較少。"}, {"stem": "都會區生活雖然經濟發達、生活便利，卻可能面臨下列哪些問題？", "opts": [["A", "醫療資源不足"], ["B", "觀光資源匱乏"], ["C", "房價與物價高、交通擁擠、人際關係疏離"], ["D", "農業發展受限"]], "ans": "C", "exp": "課本指出都會區經濟發達、生活便利，卻出現房價與物價高、環境汙染、交通擁擠、人際關係疏離等問題。"}, {"stem": "鄉村、東部與離島地區雖然經濟成長緩慢，但具有下列何種優勢？", "opts": [["A", "工商業發達"], ["B", "交通便利"], ["C", "醫療資源充足"], ["D", "環境清幽、生活悠閒、人情味濃"]], "ans": "D", "exp": "鄉村、東部與離島地區雖環境清幽、生活悠閒、人情味濃，但經濟成長緩慢，公共設施相對不足。"}, {"stem": "政府於民國107年公告實施下列哪一項計畫，作為均衡區域發展的重要對策？", "opts": [["A", "全國國土計畫"], ["B", "十大建設計畫"], ["C", "六年國建計畫"], ["D", "前瞻基礎建設計畫"]], "ans": "A", "exp": "民國107年政府公告實施「全國國土計畫」，促進資源與產業合理配置，追求國家永續發展。"}, {"stem": "全國國土計畫將臺灣土地劃分為幾大功能分區？", "opts": [["A", "二大"], ["B", "四大"], ["C", "三大"], ["D", "五大"]], "ans": "B", "exp": "全國國土計畫劃分城鄉發展地區、農業發展地區、國土保育地區和海洋資源地區等四大功能分區。"}, {"stem": "下列哪一項功能分區，是為了維護農業生長環境及確保糧食安全而劃定？", "opts": [["A", "國土保育地區"], ["B", "海洋資源地區"], ["C", "農業發展地區"], ["D", "城鄉發展地區"]], "ans": "C", "exp": "為維護農業生長環境及確保糧食安全，劃定農業發展地區。"}, {"stem": "為維持海域狀態，避免影響海域生態環境而劃定的分區稱為？", "opts": [["A", "城鄉發展地區"], ["B", "國土保育地區"], ["C", "農業發展地區"], ["D", "海洋資源地區"]], "ans": "D", "exp": "為維持海域狀態，避免影響海域生態環境，劃定海洋資源地區。"}, {"stem": "政府公告「原住民族特定區域計畫」，其主要目的為何？", "opts": [["A", "保障原住民族傳統文化與既有土地使用權益"], ["B", "發展重工業"], ["C", "擴大都市範圍"], ["D", "促進兩岸小三通"]], "ans": "A", "exp": "「原住民族特定區域計畫」保障原住民族傳統文化與既有土地使用權益，以彰顯社會公平正義。"}, {"stem": "國土保育地區的劃定原則為何？", "opts": [["A", "全面開放觀光開發"], ["B", "以保育及保安為原則，禁止或限制其他使用"], ["C", "優先發展工業"], ["D", "鼓勵農地變更為建地"]], "ans": "B", "exp": "國土保育地區以保育及保安為原則，並禁止或限制其他使用方式。"}, {"stem": "課本中提及縣政府劃設「富山禁漁區」的主要目的為何？", "opts": [["A", "促進當地觀光業發展"], ["B", "限制原住民從事漁業"], ["C", "保護生態，避免過度捕撈造成破壞"], ["D", "配合美麗灣渡假村開發"]], "ans": "C", "exp": "因不肖人士在沿海過度捕撈造成生態破壞，當地政府劃設部分海岸地帶為「富山禁漁區」以保護生態。"}, {"stem": "「美麗灣渡假村」開發案引發爭議，主要原因為何？", "opts": [["A", "政府拒絕核發建照"], ["B", "當地居民全數贊成開發"], ["C", "渡假村位於國土保育地區"], ["D", "開發過程迴避環境影響評估程序"]], "ans": "D", "exp": "反對開發案的公民團體認為，開發前須依法進行環境影響評估，但美麗灣渡假村開發案卻迴避了環境影響評估程序，因而引發爭議。"}, {"stem": "「平均每戶可支配所得」的定義為何？", "opts": [["A", "總所得扣掉無法自由調整的支出"], ["B", "總所得加上政府補助"], ["C", "家庭總資產減去負債"], ["D", "每人每月薪資總和"]], "ans": "A", "exp": "課本定義「平均每戶可支配所得」為總所得扣掉無法自由調整的支出，是常用來比較區域經濟差異的指標。"}, {"stem": "桃園市周邊推動的「桃園航空城」規畫案，目標是發展成結合下列哪些功能的新市鎮？", "opts": [["A", "農業與畜牧"], ["B", "物流、住宅與工業活動"], ["C", "軍事與國防"], ["D", "漁業與養殖"]], "ans": "B", "exp": "課本指出臺灣桃園國際機場周邊正在推動桃園航空城規畫案，目標是成為結合物流、住宅與工業活動的新市鎮。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "歐洲西側濱臨下列哪一個大洋？", "opts": [["A", "大西洋"], ["B", "太平洋"], ["C", "印度洋"], ["D", "北極海"]], "ans": "A", "exp": "課本提到歐洲「西濱大西洋」，是歐洲三面環海中最主要的一面。"}, {"stem": "歐洲與亞洲的分界，主要以下列哪兩座山脈為界？", "opts": [["A", "阿爾卑斯山、喀爾巴阡山"], ["B", "本寧山、庇里牛斯山"], ["C", "烏拉爾山、高加索山"], ["D", "斯堪地那維亞山脈、亞平寧山脈"]], "ans": "C", "exp": "課本指出歐洲「東以烏拉爾山和高加索山與亞洲為界」，這兩座山脈是歐、亞兩洲傳統的地理分界線。"}, {"stem": "歐洲南隔哪一個海與非洲相望？", "opts": [["A", "黑海"], ["B", "地中海"], ["C", "波羅的海"], ["D", "北海"]], "ans": "B", "exp": "課本說明歐洲「南隔地中海與非洲相望」，地中海是歐、非兩洲之間的天然分界水域。"}, {"stem": "歐洲的自然環境常被形容為「像一個巨型半島伸入海洋」，最主要的理由是下列何者？", "opts": [["A", "歐洲人口分布非常平均"], ["B", "歐洲全境皆為高原地形"], ["C", "歐洲位於赤道附近"], ["D", "歐洲三面環海、海岸線曲折，多半島與島嶼"]], "ans": "D", "exp": "歐洲位於歐亞大陸西側，三面被大西洋、地中海等海域環繞，加上境內多半島、島嶼，因此常被形容為伸入海洋的大半島。"}, {"stem": "歐洲海岸線曲折、多半島與海灣的地形特色，對下列哪一項活動的發展最為有利？", "opts": [["A", "沙漠農業的推廣"], ["B", "航運與貿易的發展"], ["C", "高山滑雪產業"], ["D", "大規模畜牧業"]], "ans": "B", "exp": "課本說明海洋與陸地交錯分布、海灣深入內陸且海岸線綿長，有利於航運與貿易的發展，這也是歐洲自古以來對外貿易發達的重要原因。"}, {"stem": "課本提到歐洲是世界上唯一沒有下列哪一種氣候類型的洲別？", "opts": [["A", "沙漠氣候"], ["B", "溫帶氣候"], ["C", "高地氣候"], ["D", "寒帶氣候"]], "ans": "A", "exp": "由於歐洲主要山脈多為東西走向，不會阻擋海洋水氣深入內陸，加上多半島、海灣，使歐洲成為世界上唯一沒有沙漠氣候分布的一洲。"}, {"stem": "下列關於歐洲整體地理位置的敘述，何者正確？", "opts": [["A", "歐洲全境位於北極圈以內"], ["B", "歐洲與非洲之間沒有任何海域相隔"], ["C", "歐洲東側與美洲相鄰"], ["D", "歐洲位於歐亞大陸的西北部（西側）"]], "ans": "D", "exp": "歐洲位於歐亞大陸的西北部（西側），西臨大西洋、南隔地中海與非洲相望、東以烏拉爾山、高加索山與亞洲為界。"}, {"stem": "下列何者不是歐洲地形破碎、多半島與島嶼所帶來的影響？", "opts": [["A", "海岸線綿長曲折"], ["B", "港灣眾多，利於航運"], ["C", "內陸地區完全無法發展農業"], ["D", "南、北兩端地形較為破碎"]], "ans": "C", "exp": "歐洲雖然南、北兩端因半島與島嶼眾多而地形破碎，但阿爾卑斯山以北仍有廣大平原可發展農業，並非「內陸完全無法發展農業」，此為錯誤敘述。"}, {"stem": "課本將歐洲地形大致分成三大部分，下列何者不屬於這三大部分之一？", "opts": [["A", "東部的西伯利亞高原"], ["B", "阿爾卑斯山及其以南地區"], ["C", "阿爾卑斯山以北的平原地區"], ["D", "北部的斯堪地那維亞半島"]], "ans": "A", "exp": "西伯利亞屬於俄羅斯地形範圍，非本課「歐洲(一)」所講述的三大地形分區（阿爾卑斯山以南、以北平原、北部斯堪地那維亞半島）。"}, {"stem": "阿爾卑斯山及其以南地區，地形呈現山勢高聳、地形崎嶇、海岸線曲折的主要原因為何？", "opts": [["A", "長期受風力侵蝕"], ["B", "火山長期噴發堆積"], ["C", "冰河大規模覆蓋"], ["D", "板塊擠壓作用"]], "ans": "D", "exp": "課本說明阿爾卑斯山及其以南地區因板塊擠壓，山勢高聳、地形崎嶇、海岸線曲折，並形成多處谷灣地形。"}, {"stem": "阿爾卑斯山以北的地區，地形與土地利用有何特色？", "opts": [["A", "地勢陡峭，多深峽谷"], ["B", "大部分為熱帶沙漠"], ["C", "地勢向北緩慢傾斜，平原廣大，為歐洲精華區"], ["D", "終年被冰河覆蓋，無法居住"]], "ans": "C", "exp": "阿爾卑斯山以北地勢和緩向北傾斜，形成廣大平原，土壤肥沃、氣候溫和，是歐洲人口與農業的精華地區。"}, {"stem": "北部的斯堪地那維亞半島因緯度較高，受到下列何種作用影響，使冰蝕地形發達？", "opts": [["A", "風力侵蝕"], ["B", "冰河侵蝕"], ["C", "河流沖刷"], ["D", "海水侵蝕"]], "ans": "B", "exp": "斯堪地那維亞半島緯度高、氣候寒冷，山地南北縱貫，長期受冰河侵蝕影響，因此冰蝕地形（如峽灣、冰蝕湖等）十分發達。"}, {"stem": "下列對「冰河」的敘述，何者正確？", "opts": [["A", "冰河是由火山噴發後的岩漿冷卻而成"], ["B", "冰河只出現在赤道附近的高山"], ["C", "冰河的移動與地心引力完全無關"], ["D", "冰河是高緯或高山地區的積雪長年不融，逐漸壓密成冰後，因重力向下移動而成"]], "ans": "D", "exp": "課本說明高緯度或高山地區積雪長年不融，深厚積雪逐漸被壓密成冰，這些冰體因本身重量或坡度影響而向下或向外流動，形成冰河。"}, {"stem": "冰河侵蝕形成的「U型谷」，在阿爾卑斯山區常扮演下列何種角色？", "opts": [["A", "成為南北往來的天然交通孔道"], ["B", "完全阻隔南北交通"], ["C", "是歐洲最主要的沙漠地帶"], ["D", "是歐洲降水量最少的地區"]], "ans": "A", "exp": "冰河消融後，寬平的U型谷常成為阿爾卑斯山區南北往來的天然交通孔道，例如瑞士境內的U型谷即可供鐵路穿越使用。"}, {"stem": "「峽灣」地形的形成過程，下列敘述何者正確？", "opts": [["A", "沙漠地區因風力侵蝕而成的谷地"], ["B", "U型谷延伸至海邊，冰河消退、海水侵入後所形成的狹長海灣"], ["C", "火山口積水而成的湖泊"], ["D", "河流出海口泥沙淤積而成的三角洲"]], "ans": "B", "exp": "當U型谷延伸至海邊，隨著冰河消退、海水侵入，便形成深入陸地的狹長海灣，稱為峽灣，是北歐挪威沿海常見的地形。"}, {"stem": "「谷灣」地形主要的形成原因為下列何者？", "opts": [["A", "冰河侵蝕挖鑿窪地後積水而成"], ["B", "板塊張裂形成的大裂谷"], ["C", "沿海丘陵谷地因海平面上升，低平河谷被海水淹沒而成"], ["D", "火山熔岩堆積而成的高原"]], "ans": "C", "exp": "課本以希臘沿海地區為例，說明丘陵延伸至海岸，受海平面上升影響，沿海谷地被海水淹沒而形成谷灣，曲折的海岸線有利於港灣發展。"}, {"stem": "「冰蝕湖」是如何形成的？", "opts": [["A", "冰河在坡度較緩處挖鑿窪地，冰河消融後積水而成"], ["B", "河川改道後留下的舊河道積水而成"], ["C", "地層斷裂陷落後長期積水而成"], ["D", "人工開鑿水庫蓄水而成"]], "ans": "A", "exp": "冰河在坡度較緩的地方移動時，會在冰蝕平原上挖鑿出許多大小不一的窪地，冰河消融後，這些窪地因積水而形成冰蝕湖。"}, {"stem": "阿爾卑斯山脈大致呈東西走向，這樣的走向對歐洲氣候造成下列何種影響？", "opts": [["A", "完全阻擋海洋水氣進入歐洲內陸"], ["B", "使歐洲全境呈現熱帶氣候"], ["C", "造成歐洲東部終年乾旱如沙漠"], ["D", "不會阻擋海洋水氣，有助水氣深入內陸"]], "ans": "D", "exp": "由於歐洲主要山脈（如阿爾卑斯山）多為東西走向，不會像南北向山脈那樣阻擋盛行西風帶來的海洋水氣，使水氣得以深入內陸，讓歐洲成為溫帶氣候廣布、沒有沙漠氣候的一洲。"}, {"stem": "歐洲海岸線特別綿長曲折，最主要的原因為下列何者？", "opts": [["A", "地震活動頻繁"], ["B", "全年降雨量極低"], ["C", "境內多半島、海灣與島嶼"], ["D", "河流均為筆直流向"]], "ans": "C", "exp": "歐洲南、北兩部因多半島及島嶼，地形較為破碎，海洋與陸地交錯分布，因而形成綿長曲折的海岸線。"}, {"stem": "若由南到北觀察歐洲的地形分布，下列排列順序何者正確？", "opts": [["A", "北部冰河地形 → 中部平原 → 南部高聳山地"], ["B", "南部高聳山地 → 中部廣大平原 → 北部冰河地形"], ["C", "南部平原 → 中部沙漠 → 北部高原"], ["D", "南部冰蝕地形 → 中部沙漠 → 北部高山"]], "ans": "B", "exp": "課本描述歐洲地形由南到北依序為：阿爾卑斯山及其以南（山勢高聳崎嶇）→ 阿爾卑斯山以北的廣大平原（歐洲精華區）→ 北部斯堪地那維亞半島（冰河地形發達）。"}, {"stem": "課本形容歐洲的氣候大致呈現下列何種特徵？", "opts": [["A", "南冷北熱、東溼西乾"], ["B", "全年高溫多雨"], ["C", "全年寒冷乾燥"], ["D", "南熱北冷、西溼東乾"]], "ans": "D", "exp": "課本指出歐洲氣候大致「南熱北冷、西溼東乾」，緯度、地形、西風、洋流與距海遠近皆是造成此差異的重要因素。"}, {"stem": "溫帶地中海型氣候的降水特徵為下列何者？", "opts": [["A", "全年多雨"], ["B", "夏乾冬雨"], ["C", "夏雨冬乾"], ["D", "全年乾燥無雨"]], "ans": "B", "exp": "地中海沿岸地區夏季受副熱帶高氣壓籠罩，乾燥少雨；冬季則進入西風帶範圍，盛行西風帶來海洋水氣，形成「夏乾冬雨」的氣候特徵。"}, {"stem": "溫帶海洋性氣候主要分布於歐洲的哪些區域？", "opts": [["A", "西歐與北歐（西部）"], ["B", "南歐與東歐"], ["C", "東歐與歐俄"], ["D", "僅分布於阿爾卑斯山區"]], "ans": "A", "exp": "溫帶海洋性氣候分布於西歐與北歐西部，終年受西風吹拂，加上北大西洋暖流帶來暖溼水氣，雨量分布較平均。"}, {"stem": "溫帶海洋性氣候「終年有雨、年溫差較小」的現象，主要與下列哪兩項因素有關？", "opts": [["A", "副熱帶高壓、沙漠氣流"], ["B", "東北季風、寒流"], ["C", "盛行西風、北大西洋暖流"], ["D", "地震活動、火山噴發"]], "ans": "C", "exp": "西歐、北歐西部終年受西風吹拂，加上北大西洋暖流帶來暖溼水氣，兩者共同作用，使當地全年有雨、氣候溫和、年溫差較小。"}, {"stem": "溫帶大陸性氣候主要分布於歐洲的哪個區域？", "opts": [["A", "南歐沿海地區"], ["B", "東歐、歐俄（深入內陸地區）"], ["C", "阿爾卑斯山區"], ["D", "北極圈以內"]], "ans": "B", "exp": "溫帶大陸性氣候主要分布於東歐、歐俄，由於位置向東深入內陸，受海洋影響減弱，形成獨特的氣候特徵。"}, {"stem": "關於溫帶大陸性氣候的特徵，下列敘述何者正確？", "opts": [["A", "年均溫向東逐漸升高、年降水量向東逐漸增加"], ["B", "全年降水平均分配，沒有明顯的雨季"], ["C", "冬季降水量遠高於夏季"], ["D", "年均溫向東逐漸降低、年溫差向東逐漸增加，降水以夏雨為主"]], "ans": "D", "exp": "由於愈向東深入內陸，受海洋調節的效果愈弱，因此年均溫逐漸降低、年溫差逐漸增大，並呈現以夏雨為主的降水特徵。"}, {"stem": "「高地氣候」在歐洲主要分布於下列何處？", "opts": [["A", "阿爾卑斯山區"], ["B", "東歐平原"], ["C", "地中海沿岸"], ["D", "北極海沿岸"]], "ans": "A", "exp": "高地氣候主要分布於地勢高聳的阿爾卑斯山區，氣候特徵會隨著海拔高度呈現垂直變化。"}, {"stem": "「寒帶氣候」主要分布於下列歐洲的哪個地區？", "opts": [["A", "地中海沿岸"], ["B", "西歐平原"], ["C", "北極圈附近"], ["D", "阿爾卑斯山南側"]], "ans": "C", "exp": "寒帶氣候分布於北極圈附近的高緯度地區，終年低溫，冬季尤其寒冷漫長。"}, {"stem": "盛行「西風」對歐洲氣候造成下列何種主要影響？", "opts": [["A", "使歐洲大部分地區終年乾燥"], ["B", "使歐洲全年高溫少雨"], ["C", "造成歐洲東部沙漠化"], ["D", "為歐洲帶來大量的海洋水氣，調節氣候溼度"]], "ans": "D", "exp": "盛行西風將大西 ", "opts": [["A", "麥類、玉米、馬鈴薯"], ["B", "水稻、甘蔗、香蕉"], ["C", "咖啡、可可、橡膠"], ["D", "棉花、茶葉、菸草"]], "ans": "A", "exp": "課本說明歐洲農業發達、農產豐富，主要以種植麥類、玉米和馬鈴薯為主。"}, {"stem": "南歐地區因受溫帶地中海型氣候影響，傳統上發展的農業以種植下列哪些耐旱作物為主？", "opts": [["A", "水稻、蓮花"], ["B", "玉米、甘蔗"], ["C", "葡萄、橄欖"], ["D", "茶樹、桑樹"]], "ans": "C", "exp": "南歐受溫帶地中海型氣候影響，作物生長季與雨季不能配合，農業多須仰賴灌溉，傳統上以種植耐旱的葡萄、橄欖為主，即所謂的「地中海型農業」。"}, {"stem": "歐洲都市周圍的山地及沿海地區，常見下列哪種農業型態？", "opts": [["A", "游耕"], ["B", "酪農業或園藝農業"], ["C", "大規模單一經濟作物栽培"], ["D", "逐水草而居的游牧業"]], "ans": "B", "exp": "課本說明歐洲都市周圍的山地及沿海地區，多有酪農業或園藝農業的分布，供應都市對乳製品、蔬菜與花卉等的需求。"}, {"stem": "歐洲之所以能成為全球觀光旅遊勝地，主要與下列哪些條件有關？", "opts": [["A", "豐富的礦產資源"], ["B", "全年高溫多雨的氣候"], ["C", "廣大的沙漠地形"], ["D", "豐富的歷史、藝術文物與優美的自然景觀"]], "ans": "D", "exp": "課本提到歐洲擁有豐富的歷史、藝術文物與優美的自然景觀，讓歐洲成為全球觀光旅遊勝地，每年吸引大量觀光客，帶來可觀的收益。"}, {"stem": "課本提到，西歐國家近年引進哪個區域的勞動力，並且持續強化整體工業發展？", "opts": [["A", "東歐地區"], ["B", "北美洲"], ["C", "大洋洲"], ["D", "南歐地區"]], "ans": "A", "exp": "課本指出西歐國家近年引進東歐地區的勞動力，並有計畫地投資東歐地區，藉此持續強化歐洲整體的工業發展。"}, {"stem": "下列關於歐洲整體產業發展的敘述，何者正確？", "opts": [["A", "歐洲完全沒有農業活動"], ["B", "觀光業對歐洲經濟毫無貢獻"], ["C", "工業是歐洲經濟發展的主要驅動力，且以西歐工業發展程度較高"], ["D", "東歐工業發展程度遠高於西歐"]], "ans": "C", "exp": "課本指出工業是歐洲經濟發展的主要驅動力，其中又以西歐各國的工業發展程度較高，並持續投資東歐地區以強化整體發展。"}, {"stem": "下列哪一區被課本形容為「工商發達與科技進步」，是歐洲的經濟核心地帶？", "opts": [["A", "北歐"], ["B", "南歐"], ["C", "東歐"], ["D", "西歐"]], "ans": "D", "exp": "西歐擁有地形平坦、水運交通發達、礦產豐富等條件，加上早年海外殖民與貿易累積的資金，成為歐洲的經濟核心地帶。"}, {"stem": "下列哪一區被課本形容為「文化豐富與觀光業興盛」，包含伊比利、義大利與巴爾幹三大半島？", "opts": [["A", "北歐"], ["B", "南歐"], ["C", "東歐"], ["D", "西歐"]], "ans": "B", "exp": "南歐包括伊比利、義大利、巴爾幹三大半島，因緯度較低、氣候溫暖且陽光充足，加上豐富的歷史古蹟，成為著名的觀光度假勝地。"}, {"stem": "下列哪一區被課本形容為「善用環境與重視社會福利」，並以瑞典的汽車工業、挪威的漁業與航運業為代表？", "opts": [["A", "北歐"], ["B", "南歐"], ["C", "東歐"], ["D", "西歐"]], "ans": "A", "exp": "北歐國家擁有豐富的林、礦資源與發達的峽灣航運條件，社會福利制度完善，但也因此形成高額賦稅的特色，冰島更利用地熱發電發展溫室農業與煉鋁工業。"}, {"stem": "下列關於「東歐」區域發展的敘述，何者正確？", "opts": [["A", "東歐自古以來就是歐洲工業最發達的地區"], ["B", "東歐至今仍完全採行計畫經濟制度"], ["C", "東歐原本經濟發展較慢，一九九〇年代後才由計畫經濟轉為自由市場經濟"], ["D", "東歐地區完全沒有製造業發展"]], "ans": "C", "exp": "課本說明東歐原為歐洲經濟發展較慢、國民所得偏低的地區，一九九〇年代以後各國才紛紛由計畫經濟轉為自由市場經濟，近年來如波蘭已成為歐洲汽車生產重鎮之一。"}, {"stem": "英國因曾擁有眾多殖民地，而在課本中被稱為下列何種稱號？", "opts": [["A", "世界時尚之都"], ["B", "歐洲文明的搖籃"], ["C", "歐洲屋脊"], ["D", "日不落國"]], "ans": "D", "exp": "英國是工業革命的起源地，曾擁有眾多海外殖民地，因此有「日不落國」之稱；「世界時尚之都」是形容法國巴黎，「歐洲文明的搖籃」是形容希臘。"}, {"stem": "冰島雖然緯度偏高，卻能發展溫室農業與煉鋁工業，最主要是因為當地充分利用下列哪一項天然資源？", "opts": [["A", "石油"], ["B", "地熱"], ["C", "煤礦"], ["D", "天然氣"]], "ans": "B", "exp": "課本提到冰島利用地熱發電，發展溫室農業與煉鋁工業，著名的藍湖溫泉也是利用地熱加溫海水所形成的天然溫泉勝地。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "依照經濟活動的性質分類，直接取用自然資源，或是將自然資源加以培育利用的產業，稱為下列哪一項？", "opts": [["A", "第二級產業"], ["B", "第一級產業"], ["C", "第三級產業"], ["D", "服務業"]], "ans": "B", "exp": "第一級產業是指直接取用自然資源，或是將自然資源加以培育利用的產業，如農、林、漁、牧業等。"}, {"stem": "下列何者屬於「第二級產業」的活動？", "opts": [["A", "種植水稻"], ["B", "提供觀光導覽服務"], ["C", "銀行放款業務"], ["D", "紡織品加工製造"]], "ans": "D", "exp": "第二級產業是將各種原料再加工製造的產業，如紡織、汽車製造裝配業等，紡織品加工製造正屬此類。"}, {"stem": "下列何者屬於「第三級產業」？", "opts": [["A", "運輸業"], ["B", "林業"], ["C", "畜牧業"], ["D", "漁撈業"]], "ans": "A", "exp": "第三級產業提供各種商品買賣和服務，如商業、運輸業、金融業、觀光業等；林業、畜牧業、漁撈業皆屬第一級產業。"}, {"stem": "農、林、漁、牧業屬於下列哪一級產業？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "服務性產業"]], "ans": "C", "exp": "農、林、漁、牧業是直接取用或培育利用自然資源的產業，屬於第一級產業。"}, {"stem": "汽車製造裝配業屬於下列哪一級產業？", "opts": [["A", "第一級產業"], ["B", "第二級產業"], ["C", "第三級產業"], ["D", "以上皆非"]], "ans": "B", "exp": "汽車製造裝配業是將原料再加工製造的產業，屬於第二級產業。"}, {"stem": "下列產業中，何者最能代表提供「服務」性質，屬於第三級產業？", "opts": [["A", "種植蔬菜"], ["B", "養殖虱目魚"], ["C", "汽車裝配"], ["D", "金融業"]], "ans": "D", "exp": "金融業提供商品買賣以外的各種服務，屬於第三級產業；其餘選項皆屬第一、二級產業。"}, {"stem": "若一地區仍在農業社會，就業人口以第一級產業活動為主，代表該地區的經濟發展程度為何？", "opts": [["A", "較低"], ["B", "較高"], ["C", "已開發"], ["D", "無法判斷"]], "ans": "A", "exp": "課本提到：一地區若仍在農業社會，就業人口以第一級產業活動為主，則經濟發展程度較低。"}, {"stem": "若一地區第二、三級產業的就業人口愈多，代表該地區的經濟發展程度為何？", "opts": [["A", "經濟發展程度愈低"], ["B", "仍屬農業社會"], ["C", "經濟發展程度愈高"], ["D", "產業尚未轉型"]], "ans": "C", "exp": "課本提到：若第二、三級產業的就業人口愈多，表示經濟發展程度愈高。"}, {"stem": "臺灣大約在民國幾十年代中期以後，由農業社會轉型成以製造業為主的工業社會？", "opts": [["A", "五十年代"], ["B", "六十年代"], ["C", "八十年代"], ["D", "九十年代"]], "ans": "B", "exp": "課本指出：到民國六十年代中期以後，原本的農業社會已轉型成以製造業為主的工業社會。"}, {"stem": "臺灣的第三級產業大約從民國幾十年代中期以後，逐漸成為生產主力？", "opts": [["A", "五十年代"], ["B", "六十年代初"], ["C", "六十年代末"], ["D", "七十年代"]], "ans": "D", "exp": "課本指出：民國七十年代中期以後，第三級產業則逐漸成為臺灣的生產主力。"}, {"stem": "隨著社會的發展，臺灣第一級產業的就業人口比例和產值，呈現下列何種變化趨勢？", "opts": [["A", "皆逐漸下降"], ["B", "皆逐漸上升"], ["C", "就業人口上升但產值下降"], ["D", "沒有明顯變化"]], "ans": "A", "exp": "課本指出：臺灣第一級產業的就業人口比例和產值皆逐漸下降。"}, {"stem": "臺灣的農業經營普遍採取「集約耕作」，其主要原因為何？", "opts": [["A", "政府強制規定農民耕作方式"], ["B", "農民偏好傳統耕作方式"], ["C", "山多平原少、人口稠密，導致耕地普遍狹小"], ["D", "氣候因素導致耕地無法擴大"]], "ans": "C", "exp": "臺灣因山多平原少且人口稠密，導致每個農民所擁有的耕地普遍狹小，因此農業經營採取集約耕作，以提高單位面積的產量。"}, {"stem": "「在單位土地面積上投入大量的勞力、資本、肥料等，以提高收穫量」的農業經營方式，稱為下列何者？", "opts": [["A", "休閒農業"], ["B", "集約農業"], ["C", "有機農業"], ["D", "粗放農業"]], "ans": "B", "exp": "課本定義：在單位土地面積上投入大量的勞力、資本、肥料等，以提高收穫量的農業經營方式，稱為集約農業。"}, {"stem": "下列何者「不是」課本所提及會影響臺灣農業收成的天災？", "opts": [["A", "颱風"], ["B", "旱災"], ["C", "寒害"], ["D", "地震"]], "ans": "D", "exp": "課本提到常因颱風、豪大雨、旱災或寒害等天災而影響農業收成，並未提及地震。"}, {"stem": "臺灣的農政單位與農民長年致力於品種培育，且不斷精進栽培技術，這展現了臺灣農業的哪一項特色？", "opts": [["A", "農業技術先進"], ["B", "農業商品化"], ["C", "農村勞力老化"], ["D", "耕地狹小"]], "ans": "A", "exp": "課本指出：農業技術先進，臺灣的農政單位與農民長年致力於品種培育，且不斷精進栽培技術，為農業發展奠定良好基礎。"}, {"stem": "臺灣農家對作物種類的選擇，主要取決於下列何者？", "opts": [["A", "自家需要"], ["B", "傳統耕作習慣"], ["C", "市場需求"], ["D", "政府強制規定"]], "ans": "C", "exp": "課本指出：臺灣農家對作物種類的選擇主要取決於市場需求，而非耕作技術或自家需要，此即農業商品化的特色。"}, {"stem": "臺灣農業所得偏低，導致年輕勞力多外流至工商業部門，此現象反映了臺灣農業的哪一項問題？", "opts": [["A", "耕地狹小"], ["B", "農村勞力老化"], ["C", "農業技術落後"], ["D", "商品化程度低"]], "ans": "B", "exp": "課本指出：臺灣因農業所得偏低，年輕勞力多外流至工商業部門，使農村勞動力漸趨老化。"}, {"stem": "下列關於臺灣農業自然環境的敘述，何者正確？", "opts": [["A", "臺灣地形單一，不利農業多元發展"], ["B", "臺灣氣候乾燥少雨"], ["C", "天災對農業收成幾乎沒有影響"], ["D", "臺灣地形多樣、氣候溫暖多雨，適合農作物種植"]], "ans": "D", "exp": "課本指出：臺灣地形多樣、氣候溫暖多雨，適合農作物的種植，但也常因颱風、豪大雨、旱災或寒害等天災而影響農業收成。"}, {"stem": "隨著經濟成長和交通革新，臺灣農業的哪一項特色程度愈來愈高？", "opts": [["A", "商品化程度"], ["B", "自給自足程度"], ["C", "粗放經營程度"], ["D", "傳統化程度"]], "ans": "A", "exp": "課本指出：隨著快速的經濟成長和交通革新，商品化程度愈來愈高，這是農業商品化的特色。"}, {"stem": "課本以「臺灣不同耕地規模的農戶數百分比圖」，主要用來說明臺灣農業的哪一項特色？", "opts": [["A", "農業商品化"], ["B", "農村勞力老化"], ["C", "耕地狹小、集約耕作"], ["D", "農業技術先進"]], "ans": "C", "exp": "該圖呈現大多數農戶所擁有的耕地規模偏小，用以佐證臺灣「耕地狹小、集約耕作」的特色。"}, {"stem": "「臺灣的農業就業人口數與年齡比例圖」最適合用來說明下列哪一項農業特色？", "opts": [["A", "農業商品化"], ["B", "農村勞力老化"], ["C", "耕地狹小"], ["D", "農業技術先進"]], "ans": "B", "exp": "該圖呈現農業就業人口的年齡分布情形，用以說明農村勞力老化的現象。"}, {"stem": "下列何者「不是」課本所提及臺灣農業目前面臨的問題？", "opts": [["A", "農家耕地狹小，生產成本高"], ["B", "人民飲食習慣改變，稻米需求量減少"], ["C", "加入世界貿易組織後面臨進口農產品競爭"], ["D", "農產品外銷市場快速擴大"]], "ans": "D", "exp": "課本列出的問題為耕地狹小生產成本高、稻米需求減少、加入WTO後面臨外國農產品競爭，並未提及外銷市場快速擴大。"}, {"stem": "臺灣於西元哪一年加入世界貿易組織（WTO）？", "opts": [["A", "2002年"], ["B", "1995年"], ["C", "1987年"], ["D", "2010年"]], "ans": "A", "exp": "課本指出：世界貿易組織成立於西元1995年，臺灣於西元2002年加入。"}, {"stem": "世界貿易組織（WTO）成立的主要宗旨為何？", "opts": [["A", "提升各國糧食自給率"], ["B", "保護各國農業免受市場競爭"], ["C", "追求國際間自由貿易，降低關稅與非關稅貿易障礙"], ["D", "統一各國農產品價格"]], "ans": "C", "exp": "課本指出：WTO宗旨在追求國際間的自由貿易，降低會員間的關稅與非關稅的貿易障礙。"}, {"stem": "政府積極鼓勵農民轉型種植經濟價值較高的農產品，使蔬菜、水果、花卉的比例逐漸提升，這是下列哪一項農業轉型措施？", "opts": [["A", "休閒農業"], ["B", "精緻農業"], ["C", "有機農業"], ["D", "箱網養殖"]], "ans": "B", "exp": "課本指出：推動精緻農業，政府積極鼓勵農民轉型種植經濟價值較高的農產品。"}, {"stem": "將農業生產活動包裝成休閒體驗的型態，吸引消費者參與，以提高農民所得，這是下列哪一項農業轉型措施？", "opts": [["A", "精緻農業"], ["B", "有機農業"], ["C", "品牌行銷"], ["D", "休閒農業"]], "ans": "D", "exp": "課本指出：發展休閒農業，將農業生產活動包裝成休閒體驗的型態，吸引消費者參與，以提高農民所得。"}, {"stem": "「耕作過程中不使用農藥、化肥，以維護環境生態，並顧及消費者食的安全」，這是指下列何種農業？", "opts": [["A", "有機農業"], ["B", "精緻農業"], ["C", "休閒農業"], ["D", "集約農業"]], "ans": "A", "exp": "課本定義：有機農業是指在耕作過程中，不使用農藥、化肥，以維護環境生態，並顧及消費者食的安全。"}, {"stem": "政府與農民加強農產品的行銷與品牌經營，其主要目的為何？", "opts": [["A", "降低生產成本"], ["B", "減少稻米需求"], ["C", "提高市場知名度和消費者信賴，增加農民收益"], ["D", "因應加入WTO的關稅調整"]], "ans": "C", "exp": "課本指出：加強農產品的行銷、品牌經營，可提高市場知名度和消費者信賴，增加農民收益。"}, {"stem": "臺東縣池上鄉的水稻農業多元經營中，農民組成產銷班並加入產銷履歷驗證制度，其主要目的為何？", "opts": [["A", "增加稻米種植面積"], ["B", "讓消費者安心，也讓農業永續"], ["C", "降低稻米市場價格"], ["D", "減少農村人口外流"]], "ans": "B", "exp": "課本案例指出：農民組成產銷班，共同購買、運銷，並加入產銷履歷驗證制度，讓消費者安心，也讓農業永續。"}, {"stem": "「稻鴨共作」是在稻田間放養鴨群，其主要功用為何？", "opts": [["A", "使稻米產量倍增"], ["B", "提供觀光賣點"], ["C", "取代人工插秧"], ["D", "鴨群可吃害蟲、鴨糞可當肥料，兼顧農作與生態"]], "ans": "D", "exp": "課本指出：稻田間放養的鴨群可吃害蟲，鴨糞可當肥料；稻作不必施肥或噴灑農藥，農作與生態兼顧。"}, {"stem": "臺東縣池上鄉因廣告使農村景觀爆紅，進而推動在地觀光產業，這說明臺灣農業轉型中的哪一項作法？", "opts": [["A", "發展休閒農業"], ["B", "推廣有機農業"], ["C", "加入產銷履歷驗證制度"], ["D", "提高集約耕作程度"]], "ans": "A", "exp": "利用農村景觀吸引觀光人潮、發展觀光產業，屬於將農業生產活動包裝成休閒體驗型態的休閒農業。"}, {"stem": "臺灣近海漁類資源豐富，其主要原因為何？", "opts": [["A", "臺灣氣候溫暖多雨"], ["B", "臺灣四面環山"], ["C", "近海有大陸棚廣布，且有寒、暖洋流交會"], ["D", "臺灣人口稠密，漁業人力充足"]], "ans": "C", "exp": "課本指出：臺灣四面環海，近海又有大陸棚廣布，以及寒、暖洋流流經，故漁類資源豐富。"}, {"stem": "「水深在200公尺以內的海底陸地」，稱為下列何者？", "opts": [["A", "洋流"], ["B", "大陸棚"], ["C", "潮間帶"], ["D", "箱網"]], "ans": "B", "exp": "課本定義：大陸棚指水深在200公尺以內的海底陸地，因平淺且有豐富魚類資源，故為沿岸及近海漁業的主要作業場所。"}, {"stem": "臺灣附近海域的洋流中，冬季時大批烏魚會隨著哪一股洋流南下臺灣海峽？", "opts": [["A", "黑潮"], ["B", "親潮"], ["C", "灣流"], ["D", "中國沿岸流"]], "ans": "D", "exp": "課本指出：冬季時，大批烏魚隨著中國沿岸流南下臺灣海峽。"}, {"stem": "黑潮流經臺灣附近海域，使東部太平洋海域成為下列何種魚類的必經之路？", "opts": [["A", "洄游魚類"], ["B", "底棲魚類"], ["C", "深海魚類"], ["D", "淡水魚類"]], "ans": "A", "exp": "課本指出：黑潮流經，使東部太平洋海域成為洄游魚類必經之路。"}, {"stem": "臺灣的養殖漁業主要分布於下列哪一區域？", "opts": [["A", "東部沿海"], ["B", "北部沿海"], ["C", "西南部沿海"], ["D", "東北部沿海"]], "ans": "C", "exp": "課本指出：養殖漁業主要分布於西南部沿海，以魚塭養殖虱目魚、文蛤等魚貝類為主。"}, {"stem": "臺灣西南部沿海的魚塭，主要養殖下列哪些魚貝類？", "opts": [["A", "鮭魚、鱒魚"], ["B", "虱目魚、文蛤"], ["C", "鱸魚、石斑魚"], ["D", "鰻魚、鱉"]], "ans": "B", "exp": "課本指出：養殖漁業主要分布於西南部沿海，以魚塭養殖虱目魚、文蛤等魚貝類為主。"}, {"stem": "下列何者「不是」課本所提及臺灣漁業目前面臨的問題？", "opts": [["A", "不當捕撈"], ["B", "勞力不足"], ["C", "魚塭超抽地下水導致地層下陷"], ["D", "遠洋漁業產值逐年下滑至零"]], "ans": "D", "exp": "課本提及不當捕撈、勞力不足、部分地區魚塭超抽地下水導致地層下陷等問題，並未提及遠洋漁業產值下滑至零。"}, {"stem": "為提升漁業的價值與競爭力，政府積極推動休閒漁業，或鼓勵漁民轉型成下列何種養殖方式？", "opts": [["A", "箱網養殖"], ["B", "魚塭養殖"], ["C", "稻田養殖"], ["D", "陸上循環水養殖"]], "ans": "A", "exp": "課本指出：政府積極推動休閒漁業，或是鼓勵轉型成箱網養殖，提升漁業的價值與競爭力。"}, {"stem": "「在海上以網具圍成立體空間，並在其中飼養高經濟價值魚類」的養殖方式，稱為下列何者？", "opts": [["A", "魚塭養殖"], ["B", "潮間帶養殖"], ["C", "箱網養殖"], ["D", "陸上箱體養殖"]], "ans": "C", "exp": "課本指出：箱網養殖是在海上以網具圍成立體空間，並在其中飼養高經濟價值魚類，此種養殖方式主要集中在澎湖、屏東等縣。"}, {"stem": "彰化縣芳苑鄉發展牛車採蚵的觀光活動，是結合漁業與觀光，發展下列哪一種漁業？", "opts": [["A", "箱網養殖"], ["B", "休閒漁業"], ["C", "遠洋漁業"], ["D", "沿岸漁業"]], "ans": "B", "exp": "課本指出：彰化縣芳苑鄉有臺灣唯一的牛車採蚵文化，結合漁業與觀光，發展休閒漁業。"}, {"stem": "臺灣早期的畜牧活動多為農家副業，以小規模的欄牧方式，圈養下列哪些禽畜為主？", "opts": [["A", "乳牛、羊"], ["B", "鮭魚、鱒魚"], ["C", "蛋雞、肉牛"], ["D", "雞、豬"]], "ans": "D", "exp": "課本指出：臺灣早期的畜牧活動多為農家副業，以小規模的欄牧，圈養雞、豬等禽畜為主。"}, {"stem": "「農民種植牧草或飼料作物，飼養乳牛、羊，以供應居民鮮乳或乳製品」的畜牧方式，稱為下列何者？", "opts": [["A", "酪農業"], ["B", "欄牧業"], ["C", "精緻畜牧業"], ["D", "有機畜牧業"]], "ans": "A", "exp": "課本定義：酪農業是農民種植牧草或飼料作物，飼養乳牛、羊，以供應居民鮮乳或乳製品的畜牧方式。"}, {"stem": "臺灣的畜牧業普遍規模狹小、生產成本偏高，容易受到下列何者的衝擊？", "opts": [["A", "天災"], ["B", "稻米需求下降"], ["C", "進口畜產品市場競爭"], ["D", "農業技術落後"]], "ans": "C", "exp": "課本指出：臺灣的畜牧業普遍規模狹小，生產成本偏高，易受進口畜產品市場競爭的衝擊。"}, {"stem": "下列何者為課本提及曾威脅臺灣畜牧業發展的疫病？", "opts": [["A", "口蹄疫與狂犬病"], ["B", "禽流感與非洲豬瘟"], ["C", "SARS與新冠肺炎"], ["D", "瘋牛症與炭疽病"]], "ans": "B", "exp": "課本指出：流竄全球的疫病，如禽流感、非洲豬瘟等，也常威脅畜牧業的發展。"}, {"stem": "苗栗縣飛牛牧場原為乳牛養殖示範區，目前轉型結合下列何種方式經營？", "opts": [["A", "遠洋漁業"], ["B", "精緻農業"], ["C", "有機農業"], ["D", "生態教育與觀光休閒"]], "ans": "D", "exp": "課本指出：苗栗縣飛牛牧場原是乳牛養殖示範區，目前則結合生態教育經營觀光休閒農場，吸引遊客前來體驗。"}, {"stem": "「鮮乳坊」與酪農場合作，把關牛隻健康以確保鮮奶品質，此舉主要反映臺灣畜牧業轉型的哪個方向？", "opts": [["A", "為消費者提供安全的畜產品"], ["B", "發展遠洋漁業"], ["C", "推動精緻農業"], ["D", "加入世界貿易組織"]], "ans": "A", "exp": "課本指出：近年來，部分業者致力於為消費者提供安全的畜產品，如由獸醫師所創立的「鮮乳坊」，與酪農場合作把關牛隻健康。"}, {"stem": "阿甲的爺爺、奶奶是稻農，爸媽白天在工廠工作，姐姐未來想當服裝設計師。依產業分類，爺爺奶奶「種稻」的工作屬於下列哪一級產業？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "服務業"]], "ans": "C", "exp": "種植稻米屬於直接利用自然資源培育作物的農業活動，為第一級產業。"}, {"stem": "承上題，阿甲的媽媽在織襪廠工作，最可能屬於下列哪一級產業？", "opts": [["A", "第一級產業"], ["B", "第二級產業"], ["C", "第三級產業"], ["D", "無法判斷"]], "ans": "B", "exp": "織襪廠將紗線等原料加工製成襪子成品，屬於將原料再加工製造的第二級產業。"}, {"stem": "從稻穀經卡車運送至烘乾中心、加工包裝成米製品，到阿甲一家人至量販店購買商品的過程，說明臺灣的產業活動具有下列何種特性？", "opts": [["A", "僅涉及第一級產業"], ["B", "各級產業彼此獨立、互不相關"], ["C", "僅涉及第三級產業"], ["D", "各級產業間環環相扣、緊密關聯"]], "ans": "D", "exp": "從稻米生產（第一級產業）、加工包裝（第二級產業），到運送買賣（第三級產業），顯示各級產業間彼此關聯、環環相扣，共同構成完整的產業鏈。"}];

QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';

});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

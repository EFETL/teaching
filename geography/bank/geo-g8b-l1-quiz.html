<script>
const QS=[{"stem": "東南亞地理位置絕佳，自古以來是東西方海上貿易往來的重要孔道。東南亞主要由哪兩大部分組成？", "opts": [["A", "中南半島與南洋群島"], ["B", "阿拉伯半島與東印度群島"], ["C", "印度半島與菲律賓群島"], ["D", "中南半島與東印度洋"]], "ans": "A", "exp": "東南亞位於亞洲東南部，介於太平洋與印度洋之間，主要包含中南半島（大陸部分）與南洋群島（島嶼部分）兩大部分。"}, {"stem": "中南半島的山脈與河川主要延伸自中國的哪一地形區，因此山脈多呈南北走向？", "opts": [["A", "雲貴高原"], ["B", "橫斷山脈"], ["C", "黃土高原"], ["D", "四川盆地"]], "ans": "B", "exp": "中南半島的山地與河川多源自中國西南部的橫斷山脈延伸而來，故山脈、河谷多為南北走向。"}, {"stem": "湄公河發源於中國青海省，是東南亞流域最長的河流，下游依序流經下列哪一組國家後注入南海？", "opts": [["A", "印度、孟加拉、緬甸"], ["B", "泰國、馬來西亞、新加坡"], ["C", "緬甸、寮國、泰國、柬埔寨、越南"], ["D", "印尼、菲律賓、汶萊"]], "ans": "C", "exp": "湄公河上游在中國稱瀾滄江，進入中南半島後依序流經緬甸、寮國、泰國、柬埔寨、越南五國，下游沖積成廣大三角洲（如越南湄公河三角洲），是世界重要的稻米產地。"}, {"stem": "南洋群島因位處板塊交界帶，屬於下列哪一個火山地震帶的一部分，因此地形破碎、多火山地震？", "opts": [["A", "阿爾卑斯 喜馬拉雅山帶"], ["B", "大西洋中洋脊"], ["C", "東非大裂谷帶"], ["D", "環太平洋火山地震帶"]], "ans": "D", "exp": "南洋群島受板塊擠壓影響，屬於環太平洋火山地震帶的一部分，是全球火山活動最活躍的地區之一，地震、海嘯等天然災害頻繁。"}, {"stem": "近年印尼政府將首都從雅加達遷往努山塔拉，最主要是為了解決雅加達長期存在的哪些問題？", "opts": [["A", "缺乏港口難以發展貿易"], ["B", "缺乏天然資源"], ["C", "遠離赤道氣候寒冷"], ["D", "交通壅塞、地層下陷與水患等都市問題"]], "ans": "D", "exp": "雅加達因人口過度集中、開發過度，長年面臨交通壅塞、空氣汙染、地層下陷與水患等問題，印尼政府因此宣布遷都至人口較少、天然資源較豐富的努山塔拉。"}, {"stem": "東南亞大部分地區位於低緯度，因此氣候具有下列哪一項共同特徵？", "opts": [["A", "年溫差大，四季分明"], ["B", "冬季寒冷乾燥，夏季炎熱"], ["C", "終年高溫，年溫差較小"], ["D", "全年乾燥少雨"]], "ans": "C", "exp": "東南亞緯度較低，終年高溫，年溫差小，只有高山地區較為涼爽。"}, {"stem": "東印度群島因跨赤道兩側，日照強烈、對流旺盛，因此形成下列哪一種氣候類型？", "opts": [["A", "熱帶莽原氣候"], ["B", "熱帶雨林氣候"], ["C", "熱帶季風氣候"], ["D", "溫帶海洋性氣候"]], "ans": "B", "exp": "東印度群島跨赤道兩側，日照強烈、對流旺盛，全年高溫多雨，屬於熱帶雨林氣候，區域內雨林廣布、物種豐富。"}, {"stem": "中南半島和菲律賓群島的降水受季風影響，形成夏雨冬乾的特徵，這種氣候類型稱為？", "opts": [["A", "熱帶季風氣候"], ["B", "熱帶雨林氣候"], ["C", "溫帶大陸性氣候"], ["D", "熱帶沙漠氣候"]], "ans": "A", "exp": "中南半島與菲律賓群島降水時間受季風影響，夏雨冬乾，乾溼分明，屬於熱帶季風氣候；降水空間分布則受地形影響，迎風面較多雨。"}, {"stem": "菲律賓平均每年約有20個颱風侵襲，是全球受颱風侵襲最頻繁的國家之一。颱風對菲律賓的降水造成什麼影響？", "opts": [["A", "成為當地夏、秋兩季重要的降水來源之一"], ["B", "使菲律賓終年乾旱"], ["C", "使菲律賓氣候轉為溫帶"], ["D", "與降水分布無關"]], "ans": "A", "exp": "菲律賓群島除了受季風影響外，夏、秋兩季常有颱風侵襲，也是當地降水的重要來源之一。"}, {"stem": "東南亞部分地區山脈可阻擋季風，使降水呈現「迎風坡多雨、背風坡少雨」的現象，這種因地形抬升而形成的降雨稱為？", "opts": [["A", "對流雨"], ["B", "地形雨"], ["C", "鋒面雨"], ["D", "颱風雨"]], "ans": "B", "exp": "山脈阻擋盛行風向，使潮溼氣流沿山坡爬升冷卻致雨，稱為地形雨；因此東南亞迎風面地區降水普遍較背風面豐沛。"}, {"stem": "中南半島居民的宗教信仰深受下列哪一個文化區影響，因此普遍信奉佛教？", "opts": [["A", "阿拉伯文化"], ["B", "西方基督宗教文化"], ["C", "印度文化"], ["D", "中國儒家文化"]], "ans": "C", "exp": "中南半島各國歷史上深受印度文化影響，古代曾盛行印度教，近代則多信奉佛教。"}, {"stem": "柬埔寨著名的世界文化遺產「吳哥窟」，最初是由吳哥王朝結合下列哪一種信仰所興建，後來又融入佛教信仰元素？", "opts": [["A", "伊斯蘭教"], ["B", "天主教"], ["C", "猶太教"], ["D", "印度神話（印度教）"]], "ans": "D", "exp": "吳哥窟由吳哥王朝結合印度神話（印度教）興建，並在近代融入佛教信仰元素，現已列入世界文化遺產。"}, {"stem": "南洋群島的伊斯蘭教信仰，主要是13世紀以後由下列何者透過海上貿易活動傳入？", "opts": [["A", "西班牙傳教士"], ["B", "中國閩粵移民"], ["C", "英國商人"], ["D", "阿拉伯商人"]], "ans": "D", "exp": "南洋群島自古為東西方海上航路的必經之地，13世紀以後，阿拉伯商人藉由海上貿易活動將伊斯蘭教帶入本區，逐漸成為部分國家的主要宗教。"}, {"stem": "菲律賓北部居民大多信仰天主教，主要是受到下列哪一個國家早期殖民統治的影響？", "opts": [["A", "荷蘭"], ["B", "英國"], ["C", "西班牙"], ["D", "法國"]], "ans": "C", "exp": "十六世紀以後，菲律賓受西班牙殖民統治影響，居民大多信奉天主教；後又受美國殖民，因此英語也普及於當地。"}, {"stem": "菲律賓的官方語言之一為英語，這與該國曾被下列哪一個國家殖民統治有關？", "opts": [["A", "荷蘭"], ["B", "西班牙"], ["C", "葡萄牙"], ["D", "美國"]], "ans": "D", "exp": "菲律賓先後受西班牙與美國殖民統治，西班牙帶來天主教信仰，美國則使英語在當地普及。"}, {"stem": "印尼、馬來西亞等信仰伊斯蘭教的國家，特別重視依古蘭經規範處理、可供穆斯林食用的食品，這種食品稱為？", "opts": [["A", "素食"], ["B", "清真食品（Halal）"], ["C", "有機食品"], ["D", "港式料理"]], "ans": "B", "exp": "清真食品是指遵循古蘭經規範處理的食品，禁止使用血液、豬肉等，宰殺過程也須符合特定規範；印尼、馬來西亞等伊斯蘭教盛行的國家十分重視清真認證。"}, {"stem": "東南亞南洋群島雖以伊斯蘭教為主要宗教，但印尼的哪一座島嶼至今仍保留印度教信仰？", "opts": [["A", "峇里島"], ["B", "蘇門答臘島"], ["C", "爪哇島"], ["D", "婆羅洲"]], "ans": "A", "exp": "南洋群島昔日曾盛行印度教，如今僅存少數地區仍信仰，峇里島即為代表，島上仍可見許多印度教寺廟。"}, {"stem": "東南亞國家中，下列何者因鄰近中國、且中國移民歷史悠久，在語言、飲食等文化上受中華文化影響最深？", "opts": [["A", "泰國"], ["B", "越南"], ["C", "印尼"], ["D", "汶萊"]], "ans": "B", "exp": "中南半島居民與中國西南部的少數民族地理位置接近，加上中國閩、粵居民早期大量前往經商、居住，其中以越南受中華文化影響最為明顯。"}, {"stem": "下列關於東南亞飲食文化的敘述，何者正確？", "opts": [["A", "因氣候乾燥少雨，飲食以麵食為主"], ["B", "完全不受任何外來文化影響"], ["C", "因氣候溼熱適合種稻，多以稻米為主食，並常加入香料，口味偏酸辣"], ["D", "因鄰近北極圈，飲食清淡不辛辣"]], "ans": "C", "exp": "東南亞氣候溼熱，適合種植水稻，故多以稻米為主食；料理常加入當地盛產的香料調味，口味普遍偏酸辣，如越南河粉、泰式打拋料理等。"}, {"stem": "東南亞在殖民時期發展出的「熱帶栽培業」，其經營方式具有下列哪一項特徵？", "opts": [["A", "小農自給自足，不對外銷售"], ["B", "種植作物種類多樣、產量少"], ["C", "完全不需要大量勞力與資金投入"], ["D", "以企業化方式，大規模種植單一經濟作物，以出口為導向"]], "ans": "D", "exp": "熱帶栽培業是指在熱帶地區投入大量勞力與資金，以企業化方式大規模種植橡膠、油棕、咖啡等單一經濟作物的集約式農業，屬於商業化、出口導向的農業活動。"}, {"stem": "東南亞的馬尼拉、雅加達、新加坡等城市，早期因殖民者為運送農礦資源而發展成人口集中的都市，這類都市稱為？", "opts": [["A", "衛星都市"], ["B", "首要型都市"], ["C", "高原型都市"], ["D", "港埠型都市"]], "ans": "D", "exp": "殖民者為取得殖民地資源，強化港口建設，因而形成人口與運輸機能集中的港埠型都市，如菲律賓馬尼拉、印尼雅加達、新加坡等。"}, {"stem": "東南亞下列哪一項礦產資源的產量在世界名列前茅，印尼即為世界主要出口國之一？", "opts": [["A", "煤礦"], ["B", "鐵礦"], ["C", "錫礦"], ["D", "鋁礦"]], "ans": "C", "exp": "東南亞錫礦產量在世界名列前茅，印尼是世界主要的錫礦出口國，原有礦場逐漸耗竭後，礦工甚至轉向海上開採。"}, {"stem": "東南亞哪一個國家的石油與天然氣出口額占全國出口總額九成以上，是亞洲重要的能源出口國？", "opts": [["A", "新加坡"], ["B", "汶萊"], ["C", "寮國"], ["D", "柬埔寨"]], "ans": "B", "exp": "汶萊的油氣資源占全國出口額九成以上，曾建立「十億桶石油紀念碑」以紀念石油產量，是亞洲重要的能源出口國。"}, {"stem": "新加坡雖然國土面積狹小，卻能發展成亞洲重要的金融與航運中心，最主要的地理優勢為何？", "opts": [["A", "位於麻六甲海峽，是太平洋與印度洋間的航運樞紐"], ["B", "擁有豐富的石油蘊藏量"], ["C", "國土面積廣大，農業產值高"], ["D", "位於高緯度，氣候涼爽適合居住"]], "ans": "A", "exp": "新加坡地控麻六甲海峽，位居太平洋與印度洋之間的必經航運要道，發展成重要的航運與金融中心，全球約三成的石油運輸也需經過此海峽。"}, {"stem": "相較於東南亞其他國家仍以勞力密集製造業為主，新加坡的經濟型態已發展成以下列何者為主？", "opts": [["A", "服務業"], ["B", "熱帶栽培業"], ["C", "傳統漁業"], ["D", "初級農業"]], "ans": "A", "exp": "新加坡經濟發展程度較高、薪資也較高，擁有東南亞中最高的服務業就業人口比例，已轉型為服務業為主的經濟型態，達已開發國家程度。"}, {"stem": "東南亞哪兩個國家是世界重要的稻米生產與輸出國？", "opts": [["A", "新加坡與汶萊"], ["B", "泰國與越南"], ["C", "寮國與東帝汶"], ["D", "緬甸與汶萊"]], "ans": "B", "exp": "東南亞氣候高溫多雨，水稻為平原及河口三角洲地區的主要糧食作物，泰國、越南等國即為世界重要的稻米生產和輸出國。"}, {"stem": "東南亞近年吸引許多外國企業前來投資設廠，下列哪一項是主要優勢條件之一？", "opts": [["A", "人口稀少，土地取得容易"], ["B", "高緯度氣候涼爽"], ["C", "人口將近七億，且幼年與壯年人口比例高，勞力充沛而低廉"], ["D", "已開發國家眾多，技術先進"]], "ans": "C", "exp": "東南亞人口將近七億，幼年與壯年人口比例高，加上經濟發展較慢，具備眾多廉價勞力的優勢，是吸引外資投資設廠的重要條件。"}, {"stem": "近年許多外資企業將工廠從中國移往東南亞，下列哪些因素為主要原因？", "opts": [["A", "中國工資下降"], ["B", "東南亞氣候轉為溫帶"], ["C", "中國全面禁止外資設廠"], ["D", "中國工資上漲，加上中 美貿易戰的影響"]], "ans": "D", "exp": "隨著中國工資上漲，加上中 美貿易戰的影響，許多外資企業從中國移出，將工廠遷往東南亞，成為部分東南亞國家經濟成長的重要因素。"}, {"stem": "東南亞國家協 let done=0,right=0;

  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

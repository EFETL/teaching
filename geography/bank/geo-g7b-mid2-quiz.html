<script>
const QS=[{"stem": "依照經濟活動的性質分類，直接取用自然資源，或是將自然資源加以培育利用的產業，稱為下列哪一項？", "opts": [["A", "第二級產業"], ["B", "第一級產業"], ["C", "第三級產業"], ["D", "服務業"]], "ans": "B", "exp": "第一級產業是指直接取用自然資源，或是將自然資源加以培育利用的產業，如農、林、漁、牧業等。"}, {"stem": "下列何者屬於「第二級產業」的活動？", "opts": [["A", "種植水稻"], ["B", "提供觀光導覽服務"], ["C", "銀行放款業務"], ["D", "紡織品加工製造"]], "ans": "D", "exp": "第二級產業是將各種原料再加工製造的產業，如紡織、汽車製造裝配業等，紡織品加工製造正屬此類。"}, {"stem": "下列何者屬於「第三級產業」？", "opts": [["A", "運輸業"], ["B", "林業"], ["C", "畜牧業"], ["D", "漁撈業"]], "ans": "A", "exp": "第三級產業提供各種商品買賣和服務，如商業、運輸業、金融業、觀光業等；林業、畜牧業、漁撈業皆屬第一級產業。"}, {"stem": "農、林、漁、牧業屬於下列哪一級產業？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "服務性產業"]], "ans": "C", "exp": "農、林、漁、牧業是直接取用或培育利用自然資源的產業，屬於第一級產業。"}, {"stem": "汽車製造裝配業屬於下列哪一級產業？", "opts": [["A", "第一級產業"], ["B", "第二級產業"], ["C", "第三級產業"], ["D", "以上皆非"]], "ans": "B", "exp": "汽車製造裝配業是將原料再加工製造的產業，屬於第二級產業。"}, {"stem": "下列產業中，何者最能代表提供「服務」性質，屬於第三級產業？", "opts": [["A", "種植蔬菜"], ["B", "養殖虱目魚"], ["C", "汽車裝配"], ["D", "金融業"]], "ans": "D", "exp": "金融業提供商品買賣以外的各種服務，屬於第三級產業；其餘選項皆屬第一、二級產業。"}, {"stem": "若一地區仍在農業社會，就業人口以第一級產業活動為主，代表該地區的經濟發展程度為何？", "opts": [["A", "較低"], ["B", "較高"], ["C", "已開發"], ["D", "無法判斷"]], "ans": "A", "exp": "課本提到：一地區若仍在農業社會，就業人口以第一級產業活動為主，則經濟發展程度較低。"}, {"stem": "若一地區第二、三級產業的就業人口愈多，代表該地區的經濟發展程度為何？", "opts": [["A", "經濟發展程度愈低"], ["B", "仍屬農業社會"], ["C", "經濟發展程度愈高"], ["D", "產業尚未轉型"]], "ans": "C", "exp": "課本提到：若第二、三級產業的就業人口愈多，表示經濟發展程度愈高。"}, {"stem": "臺灣大約在民國幾十年代中期以後，由農業社會轉型成以製造業為主的工業社會？", "opts": [["A", "五十年代"], ["B", "六十年代"], ["C", "八十年代"], ["D", "九十年代"]], "ans": "B", "exp": "課本指出：到民國六十年代中期以後，原本的農業社會已轉型成以製造業為主的工業社會。"}, {"stem": "臺灣的第三級產業大約從民國幾十年代中期以後，逐漸成為生產主力？", "opts": [["A", "五十年代"], ["B", "六十年代初"], ["C", "六十年代末"], ["D", "七十年代"]], "ans": "D", "exp": "課本指出：民國七十年代中期以後，第三級產業則逐漸成為臺灣的生產主力。"}, {"stem": "隨著社會的發展，臺灣第一級產業的就業人口比例和產值，呈現下列何種變化趨勢？", "opts": [["A", "皆逐漸下降"], ["B", "皆逐漸上升"], ["C", "就業人口上升但產值下降"], ["D", "沒有明顯變化"]], "ans": "A", "exp": "課本指出：臺灣第一級產業的就業人口比例和產值皆逐漸下降。"}, {"stem": "臺灣的農業經營普遍採取「集約耕作」，其主要原因為何？", "opts": [["A", "政府強制規定農民耕作方式"], ["B", "農民偏好傳統耕作方式"], ["C", "山多平原少、人口稠密，導致耕地普遍狹小"], ["D", "氣候因素導致耕地無法擴大"]], "ans": "C", "exp": "臺灣因山多平原少且人口稠密，導致每個農民所擁有的耕地普遍狹小，因此農業經營採取集約耕作，以提高單位面積的產量。"}, {"stem": "「在單位土地面積上投入大量的勞力、資本、肥料等，以提高收穫量」的農業經營方式，稱為下列何者？", "opts": [["A", "休閒農業"], ["B", "集約農業"], ["C", "有機農業"], ["D", "粗放農業"]], "ans": "B", "exp": "課本定義：在單位土地面積上投入大量的勞力、資本、肥料等，以提高收穫量的農業經營方式，稱為集約農業。"}, {"stem": "下列何者「不是」課本所提及會影響臺灣農業收成的天災？", "opts": [["A", "颱風"], ["B", "旱災"], ["C", "寒害"], ["D", "地震"]], "ans": "D", "exp": "課本提到常因颱風、豪大雨、旱災或寒害等天災而影響農業收成，並未提及地震。"}, {"stem": "臺灣的農政單位與農民長年致力於品種培育，且不斷精進栽培技術，這展現了臺灣農業的哪一項特色？", "opts": [["A", "農業技術先進"], ["B", "農業商品化"], ["C", "農村勞力老化"], ["D", "耕地狹小"]], "ans": "A", "exp": "課本指出：農業技術先進，臺灣的農政單位與農民長年致力於品種培育，且不斷精進栽培技術，為農業發展奠定良好基礎。"}, {"stem": "臺灣農家對作物種類的選擇，主要取決於下列何者？", "opts": [["A", "自家需要"], ["B", "傳統耕作習慣"], ["C", "市場需求"], ["D", "政府強制規定"]], "ans": "C", "exp": "課本指出：臺灣農家對作物種類的選擇主要取決於市場需求，而非耕作技術或自家需要，此即農業商品化的特色。"}, {"stem": "臺灣農業所得偏低，導致年輕勞力多外流至工商業部門，此現象反映了臺灣農業的哪一項問題？", "opts": [["A", "耕地狹小"], ["B", "農村勞力老化"], ["C", "農業技術落後"], ["D", "商品化程度低"]], "ans": "B", "exp": "課本指出：臺灣因農業所得偏低，年輕勞力多外流至工商業部門，使農村勞動力漸趨老化。"}, {"stem": "下列關於臺灣農業自然環境的敘述，何者正確？", "opts": [["A", "臺灣地形單一，不利農業多元發展"], ["B", "臺灣氣候乾燥少雨"], ["C", "天災對農業收成幾乎沒有影響"], ["D", "臺灣地形多樣、氣候溫暖多雨，適合農作物種植"]], "ans": "D", "exp": "課本指出：臺灣地形多樣、氣候溫暖多雨，適合農作物的種植，但也常因颱風、豪大雨、旱災或寒害等天災而影響農業收成。"}, {"stem": "隨著經濟成長和交通革新，臺灣農業的哪一項特色程度愈來愈高？", "opts": [["A", "商品化程度"], ["B", "自給自足程度"], ["C", "粗放經營程度"], ["D", "傳統化程度"]], "ans": "A", "exp": "課本指出：隨著快速的經濟成長和交通革新，商品化程度愈來愈高，這是農業商品化的特色。"}, {"stem": "課本以「臺灣不同耕地規模的農戶數百分比圖」，主要用來說明臺灣農業的哪一項特色？", "opts": [["A", "農業商品化"], ["B", "農村勞力老化"], ["C", "耕地狹小、集約耕作"], ["D", "農業技術先進"]], "ans": "C", "exp": "該圖呈現大多數農戶所擁有的耕地規模偏小，用以佐證臺灣「耕地狹小、集約耕作」的特色。"}, {"stem": "「臺灣的農業就業人口數與年齡比例圖」最適合用來說明下列哪一項農業特色？", "opts": [["A", "農業商品化"], ["B", "農村勞力老化"], ["C", "耕地狹小"], ["D", "農業技術先進"]], "ans": "B", "exp": "該圖呈現農業就業人口的年齡分布情形，用以說明農村勞力老化的現象。"}, {"stem": "下列何者「不是」課本所提及臺灣農業目前面臨的問題？", "opts": [["A", "農家耕地狹小，生產成本高"], ["B", "人民飲食習慣改變，稻米需求量減少"], ["C", "加入世界貿易組織後面臨進口農產品競爭"], ["D", "農產品外銷市場快速擴大"]], "ans": "D", "exp": "課本列出的問題為耕地狹小生產成本高、稻米需求減少、加入WTO後面臨外國農產品競爭，並未提及外銷市場快速擴大。"}, {"stem": "臺灣於西元哪一年加入世界貿易組織（WTO）？", "opts": [["A", "2002年"], ["B", "1995年"], ["C", "1987年"], ["D", "2010年"]], "ans": "A", "exp": "課本指出：世界貿易組織成立於西元1995年，臺灣於西元2002年加入。"}, {"stem": "世界貿易組織（WTO）成立的主要宗旨為何？", "opts": [["A", "提升各國糧食自給率"], ["B", "保護各國農業免受市場競爭"], ["C", "追求國際間自由貿易，降低關稅與非關稅貿易障礙"], ["D", "統一各國農產品價格"]], "ans": "C", "exp": "課本指出：WTO宗旨在追求國際間的自由貿易，降低會員間的關稅與非關稅的貿易障礙。"}, {"stem": "政府積極鼓勵農民轉型種植經濟價值較高的農產品，使蔬菜、水果、花卉的比例逐漸提升，這是下列哪一項農業轉型措施？", "opts": [["A", "休閒農業"], ["B", "精緻農業"], ["C", "有機農業"], ["D", "箱網養殖"]], "ans": "B", "exp": "課本指出：推動精緻農業，政府積極鼓勵農民轉型種植經濟價值較高的農產品。"}, {"stem": "將農業生產活動包裝成休閒體驗的型態，吸引消費者參與，以提高農民所得，這是下列哪一項農業轉型措施？", "opts": [["A", "精緻農業"], ["B", "有機農業"], ["C", "品牌行銷"], ["D", "休閒農業"]], "ans": "D", "exp": "課本指出：發展休閒農業，將農業生產活動包裝成休閒體驗的型態，吸引消費者參與，以提高農民所得。"}, {"stem": "「耕作過程中不使用農藥、化肥，以維護環境生態，並顧及消費者食的安全」，這是指下列何種農業？", "opts": [["A", "有機農業"], ["B", "精緻農業"], ["C", "休閒農業"], ["D", "集約農業"]], "ans": "A", "exp": "課本定義：有機農業是指在耕作過程中，不使用農藥、化肥，以維護環境生態，並顧及消費者食的安全。"}, {"stem": "政府與農民加強農產品的行銷與品牌經營，其主要目的為何？", "opts": [["A", "降低生產成本"], ["B", "減少稻米需求"], ["C", "提高市場知名度和消費者信賴，增加農民收益"], ["D", "因應加入WTO的關稅調整"]], "ans": "C", "exp": "課本指出：加強農產品的行銷、品牌經營，可提高市場知名度和消費者信賴，增加農民收益。"}, {"stem": "臺東縣池上鄉的水稻農業多元經營中，農民組成產銷班並加入產銷履歷驗證制度，其主要目的為何？", "opts": [["A", "增加稻米種植面積"], ["B", "讓消費者安心，也讓農業永續"], ["C", "降低稻米市場價格"], ["D", "減少農村人口外流"]], "ans": "B", "exp": "課本案例指出：農民組成產銷班，共同購買、運銷，並加入產銷履歷驗證制度，讓消費者安心，也讓農業永續。"}, {"stem": "「稻鴨共作」是在稻田間放養鴨群，其主要功用為何？", "opts": [["A", "使稻米產量倍增"], ["B", "提供觀光賣點"], ["C", "取代人工插秧"], ["D", "鴨群可吃害蟲、鴨糞可當肥料，兼顧農作與生態"]], "ans": "D", "exp": "課本指出：稻田間放養的鴨群可吃害蟲，鴨糞可當肥料；稻作不必施肥或噴灑農藥，農作與生態兼顧。"}, {"stem": "臺東縣池上鄉因廣告使農村景觀爆紅，進而推動在地觀光產業，這說明臺灣農業轉型中的哪一項作法？", "opts": [["A", "發展休閒農業"], ["B", "推廣有機農業"], ["C", "加入產銷履歷驗證制度"], ["D", "提高集約耕作程度"]], "ans": "A", "exp": "利用農村景觀吸引觀光人潮、發展觀光產業，屬於將農業生產活動包裝成休閒體驗型態的休閒農業。"}, {"stem": "臺灣近海漁類資源豐富，其主要原因為何？", "opts": [["A", "臺灣氣候溫暖多雨"], ["B", "臺灣四面環山"], ["C", "近海有大陸棚廣布，且有寒、暖洋流交會"], ["D", "臺灣人口稠密，漁業人力充足"]], "ans": "C", "exp": "課本指出：臺灣四面環海，近海又有大陸棚廣布，以及寒、暖洋流流經，故漁類資源豐富。"}, {"stem": "「水深在200公尺以內的海底陸地」，稱為下列何者？", "opts": [["A", "洋流"], ["B", "大陸棚"], ["C", "潮間帶"], ["D", "箱網"]], "ans": "B", "exp": "課本定義：大陸棚指水深在200公尺以內的海底陸地，因平淺且有豐富魚類資源，故為沿岸及近海漁業的主要作業場所。"}, {"stem": "臺灣附近海域的洋流中，冬季時大批烏魚會隨著哪一股洋流南下臺灣海峽？", "opts": [["A", "黑潮"], ["B", "親潮"], ["C", "灣流"], ["D", "中國沿岸流"]], "ans": "D", "exp": "課本指出：冬季時，大批烏魚隨著中國沿岸流南下臺灣海峽。"}, {"stem": "黑潮流經臺灣附近海域，使東部太平洋海域成為下列何種魚類的必經之路？", "opts": [["A", "洄游魚類"], ["B", "底棲魚類"], ["C", "深海魚類"], ["D", "淡水魚類"]], "ans": "A", "exp": "課本指出：黑潮流經，使東部太平洋海域成為洄游魚類必經之路。"}, {"stem": "臺灣的養殖漁業主要分布於下列哪一區域？", "opts": [["A", "東部沿海"], ["B", "北部沿海"], ["C", "西南部沿海"], ["D", "東北部沿海"]], "ans": "C", "exp": "課本指出：養殖漁業主要分布於西南部沿海，以魚塭養殖虱目魚、文蛤等魚貝類為主。"}, {"stem": "臺灣西南部沿海的魚塭，主要養殖下列哪些魚貝類？", "opts": [["A", "鮭魚、鱒魚"], ["B", "虱目魚、文蛤"], ["C", "鱸魚、石斑魚"], ["D", "鰻魚、鱉"]], "ans": "B", "exp": "課本指出：養殖漁業主要分布於西南部沿海，以魚塭養殖虱目魚、文蛤等魚貝類為主。"}, {"stem": "下列何者「不是」課本所提及臺灣漁業目前面臨的問題？", "opts": [["A", "不當捕撈"], ["B", "勞力不足"], ["C", "魚塭超抽地下水導致地層下陷"], ["D", "遠洋漁業產值逐年下滑至零"]], "ans": "D", "exp": "課本提及不當捕撈、勞力不足、部分地區魚塭超抽地下水導致地層下陷等問題，並未提及遠洋漁業產值下滑至零。"}, {"stem": "為提升漁業的價值與競爭力，政府積極推動休閒漁業，或鼓勵漁民轉型成下列何種養殖方式？", "opts": [["A", "箱網養殖"], ["B", "魚塭養殖"], ["C", "稻田養殖"], ["D", "陸上循環水養殖"]], "ans": "A", "exp": "課本指出：政府積極推動休閒漁業，或是鼓勵轉型成箱網養殖，提升漁業的價值與競爭力。"}, {"stem": "「在海上以網具圍成立體空間，並在其中飼養高經濟價值魚類」的養殖方式，稱為下列何者？", "opts": [["A", "魚塭養殖"], ["B", "潮間帶養殖"], ["C", "箱網養殖"], ["D", "陸上箱體養殖"]], "ans": "C", "exp": "課本指出：箱網養殖是在海上以網具圍成立體空間，並在其中飼養高經濟價值魚類，此種養殖方式主要集中在澎湖、屏東等縣。"}, {"stem": "彰化縣芳苑鄉發展牛車採蚵的觀光活動，是結合漁業與觀光，發展下列哪一種漁業？", "opts": [["A", "箱網養殖"], ["B", "休閒漁業"], ["C", "遠洋漁業"], ["D", "沿岸漁業"]], "ans": "B", "exp": "課本指出：彰化縣芳苑鄉有臺灣唯一的牛車採蚵文化，結合漁業與觀光，發展休閒漁業。"}, {"stem": "臺灣早期的畜牧活動多為農家副業，以小規模的欄牧方式，圈養下列哪些禽畜為主？", "opts": [["A", "乳牛、羊"], ["B", "鮭魚、鱒魚"], ["C", "蛋雞、肉牛"], ["D", "雞、豬"]], "ans": "D", "exp": "課本指出：臺灣早期的畜牧活動多為農家副業，以小規模的欄牧，圈養雞、豬等禽畜為主。"}, {"stem": "「農民種植牧草或飼料作物，飼養乳牛、羊，以供應居民鮮乳或乳製品」的畜牧方式，稱為下列何者？", "opts": [["A", "酪農業"], ["B", "欄牧業"], ["C", "精緻畜牧業"], ["D", "有機畜牧業"]], "ans": "A", "exp": "課本定義：酪農業是農民種植牧草或飼料作物，飼養乳牛、羊，以供應居民鮮乳或乳製品的畜牧方式。"}, {"stem": "臺灣的畜牧業普遍規模狹小、生產成本偏高，容易受到下列何者的衝擊？", "opts": [["A", "天災"], ["B", "稻米需求下降"], ["C", "進口畜產品市場競爭"], ["D", "農業技術落後"]], "ans": "C", "exp": "課本指出：臺灣的畜牧業普遍規模狹小，生產成本偏高，易受進口畜產品市場競爭的衝擊。"}, {"stem": "下列何者為課本提及曾威脅臺灣畜牧業發展的疫病？", "opts": [["A", "口蹄疫與狂犬病"], ["B", "禽流感與非洲豬瘟"], ["C", "SARS與新冠肺炎"], ["D", "瘋牛症與炭疽病"]], "ans": "B", "exp": "課本指出：流竄全球的疫病，如禽流感、非洲豬瘟等，也常威脅畜牧業的發展。"}, {"stem": "苗栗縣飛牛牧場原為乳牛養殖示範區，目前轉型結合下列何種方式經營？", "opts": [["A", "遠洋漁業"], ["B", "精緻農業"], ["C", "有機農業"], ["D", "生態教育與觀光休閒"]], "ans": "D", "exp": "課本指出：苗栗縣飛牛牧場原是乳牛養殖示範區，目前則結合生態教育經營觀光休閒農場，吸引遊客前來體驗。"}, {"stem": "「鮮乳坊」與酪農場合作，把關牛隻健康以確保鮮奶品質，此舉主要反映臺灣畜牧業轉型的哪個方向？", "opts": [["A", "為消費者提供安全的畜產品"], ["B", "發展遠洋漁業"], ["C", "推動精緻農業"], ["D", "加入世界貿易組織"]], "ans": "A", "exp": "課本指出：近年來，部分業者致力於為消費者提供安全的畜產品，如由獸醫師所創立的「鮮乳坊」，與酪農場合作把關牛隻健康。"}, {"stem": "阿甲的爺爺、奶奶是稻農，爸媽白天在工廠工作，姐姐未來想當服裝設計師。依產業分類，爺爺奶奶「種稻」的工作屬於下列哪一級產業？", "opts": [["A", "第二級產業"], ["B", "第三級產業"], ["C", "第一級產業"], ["D", "服務業"]], "ans": "C", "exp": "種植稻米屬於直接利用自然資源培育作物的農業活動，為第一級產業。"}, {"stem": "承上題，阿甲的媽媽在織襪廠工作，最可能屬於下列哪一級產業？", "opts": [["A", "第一級產業"], ["B", "第二級產業"], ["C", "第三級產業"], ["D", "無法判斷"]], "ans": "B", "exp": "織襪廠將紗線等原料加工製成襪子成品，屬於將原料再加工製造的第二級產業。"}, {"stem": "從稻穀經卡車運送至烘乾中心、加工包裝成米製品，到阿甲一家人至量販店購買商品的過程，說明臺灣的產業活動具有下列何種特性？", "opts": [["A", "僅涉及第一級產業"], ["B", "各級產業彼此獨立、互不相關"], ["C", "僅涉及第三級產業"], ["D", "各級產業間環環相扣、緊密關聯"]], "ans": "D", "exp": "從稻米生產（第一級產業）、加工包裝（第二級產業），到運送買賣（第三級產業），顯示各級產業間彼此關聯、環環相扣，共同構成完整的產業鏈。"}, {"stem": "下列哪一項是「第二級產業」的正確定義？", "opts": [["A", "從事農林漁牧礦業等生產原始物料的產業"], ["B", "從事加工製造，將原料轉變為成品的產業"], ["C", "提供各種服務，如金融、教育、觀光的產業"], ["D", "專門從事進出口貿易的產業"]], "ans": "B", "exp": "第二級產業即工業，是從事加工製造的產業；(A)為第一級產業，(C)為第三級產業，(D)國際貿易屬於第三級產業的一環，皆非第二級產業的定義。"}, {"stem": "小明的舅舅在紡織廠工作，生產成衣以供應民生消費需求，這屬於下列哪一種工業類型？", "opts": [["A", "重工業"], ["B", "高科技工業"], ["C", "輕工業"], ["D", "服務業"]], "ans": "C", "exp": "紡織業產品多作為民生消費品，重量輕，且需投入大量勞力，符合輕工業的特徵。"}, {"stem": "中國鋼鐵公司的鋼鐵工業需投入大量資金與技術，工廠規模龐大，其產品多作為其他工業的原料或設備，這屬於下列哪一種工業類型？", "opts": [["A", "輕工業"], ["B", "重工業"], ["C", "高科技工業"], ["D", "農產加工業"]], "ans": "B", "exp": "重工業的產品多數作為其他工業的原料或設備，重量重、工廠規模較大，需要較多資金投入，如鋼鐵工業、機械工業。"}, {"stem": "下列哪一項工業最符合「高科技工業」的特徵？", "opts": [["A", "食品加工業"], ["B", "鋼鐵工業"], ["C", "資訊業"], ["D", "紡織業"]], "ans": "C", "exp": "高科技工業以知識為基礎，運用大量技術、資金於產品研發與創新，產品附加價值高，如資訊業、生物科技業。"}, {"stem": "比較輕工業、重工業與高科技工業，下列敘述何者正確？", "opts": [["A", "輕工業產品多為民生消費品，重量輕，且多需投入大量勞力"], ["B", "重工業產品多為民生消費品"], ["C", "高科技工業對資金與技術的需求最低"], ["D", "三種工業類型的分類依據是工廠所在地"]], "ans": "A", "exp": "工業分類的依據是「產品性質的差異」，而非工廠所在地；重工業產品多作為其他工業原料或設備，高科技工業需投入大量技術與資金，故(B)(C)(D)皆錯誤。"}, {"stem": "臺灣早期發展甘蔗製糖業時，糖廠大多設在嘉南平原等甘蔗產地附近，這是考量下列哪一項工業區位因素？", "opts": [["A", "市場導向"], ["B", "勞力導向"], ["C", "動力導向"], ["D", "原料導向"]], "ans": "D", "exp": "甘蔗易腐敗，且加工後會產生大量蔗渣、重量減輕，工廠多傾向靠近原料產地以節省運輸成本，屬於原料導向。"}, {"stem": "烘焙業者將麵包工廠設在都市附近，主要考量下列哪一項區位因素？", "opts": [["A", "市場導向"], ["B", "原料導向"], ["C", "勞力導向"], ["D", "政策導向"]], "ans": "A", "exp": "麵包等產品易腐、具時效性，工廠會選擇接近市場，方便產品快速送到消費地，屬於市場導向。"}, {"stem": "高雄港的石化公司將進口的石油直接在港區碼頭裝卸加工，這主要顯示工業設廠考量下列哪一項因素？", "opts": [["A", "原料導向"], ["B", "交通（運輸）導向"], ["C", "動力導向"], ["D", "勞力導向"]], "ans": "B", "exp": "臺灣的工業原料如笨重的煤、鐵、石油等多需自外國進口，故工廠多選擇在港口附近設廠，以節省運輸成本，屬於交通運輸導向。"}, {"stem": "臺灣的製鞋業早期外移到中國，近年來又移往越南、印尼等地，主要是為了追求下列哪一項區位條件？", "opts": [["A", "便宜的動力"], ["B", "便利的交通"], ["C", "充裕廉價的勞力"], ["D", "高素質的研發人才"]], "ans": "C", "exp": "製鞋業屬於需要大量勞力的產業，工廠多會選在可提供充裕廉價勞力的地方，故隨勞力成本上升而不斷外移。"}, {"stem": "新竹科學園區旁設有工業技術研究院，其主要功能與下列哪一項工業區位因素最相關？", "opts": [["A", "動力導向"], ["B", "原料導向"], ["C", "技術（人才）導向"], ["D", "市場導向"]], "ans": "C", "exp": "高科技產業重視知識創新的條件，鄰近大學或工業研究中心等擁有高技術人才的地點，是區位選擇時考量的重要因素。"}, {"stem": "冰島因擁有豐富且廉價的水力、地熱發電，吸引煉鋁業前來設廠，這是考量下列哪一項工業區位因素？", "opts": [["A", "原料導向"], ["B", "勞力導向"], ["C", "技術導向"], ["D", "動力導向"]], "ans": "D", "exp": "煉鋁業需消耗大量電力，工廠擇址會傾向能提供充沛且廉價動力的地點，冰島即因豐富且廉價的電力而發展煉鋁業。"}, {"stem": "政府設置工業區並提供優惠稅率、便宜土地租金以吸引廠商進駐，這屬於下列哪一項工業區位因素？", "opts": [["A", "市場導向"], ["B", "勞力導向"], ["C", "原料導向"], ["D", "政策（政府政策）導向"]], "ans": "D", "exp": "政府為促進工業發展會設置工業區，並以優惠稅率或便宜土地租金等條件吸引企業前來設廠，屬於政策導向。"}, {"stem": "位於臺北市、由政府規畫設置的南港軟體工業園區，最能說明下列哪一項現象？", "opts": [["A", "工業區位完全取決於原料產地"], ["B", "現代工業一定要鄰近港口"], ["C", "政府政策也是工業設廠的重要考量"], ["D", "高科技產業不需要人才"]], "ans": "C", "exp": "南港軟體工業園區由政府規畫設置，顯示政府政策（如工業區的設置）對工業設廠具有重要影響力。"}, {"stem": "關於工業區位因素的敘述，下列何者正確？", "opts": [["A", "現代工廠的區位選擇，常常不是單一因素所能決定"], ["B", "只要交通便利，任何工業都會設廠於此"], ["C", "工業區位因素自古至今從未改變"], ["D", "所有工業都必須設在原料產地附近"]], "ans": "A", "exp": "課文指出，現代工廠的區位選擇常常不是單一因素所能決定，而是綜合原料、市場、交通、勞力、技術、動力、政策等多重因素考量的結果。"}, {"stem": "隨著工業發展，現代工業增加了許多半成品加工與組裝工業，使得各種區位條件的重要性也隨之改變，這說明了下列何者？", "opts": [["A", "工業區位因素會隨時代不同而發生變化"], ["B", "工業區位只受氣候影響"], ["C", "原料導向永遠是最重要的因素"], ["D", "政府不會介入工業區位選擇"]], "ans": "A", "exp": "課文提到工業的發展歷史悠久，早期多為單純原料加工業，現代則增加許多半成品加工與組裝工業，各種區位條件的重要性也隨時代不同而改變。"}, {"stem": "臺灣工業發展初期，主要以農產加工業（如鳳梨罐頭工廠）以及低資金、低技術的輕工業（如紡織業）為主，這屬於臺灣工業發展歷程的哪一階段？", "opts": [["A", "十大建設時期"], ["B", "科學園區時期"], ["C", "加工出口區時期"], ["D", "戰後民生工業（最初）時期"]], "ans": "D", "exp": "依課文，臺灣工業發展最初階段主要為農產加工業，如鳳梨罐頭工廠，或低資金、低技術的輕工業，如紡織業，屬於發展歷程的起始階段。"}, {"stem": "政府成立加工出口區，利用臺灣充裕廉價的勞力，吸引外資和技術，發展輕工業並擴大出口（如電子裝配業），這是臺灣工業發展歷程中的哪一階段？", "opts": [["A", "十大建設時期"], ["B", "加工出口區時期"], ["C", "科學園區時期"], ["D", "戰後最初期"]], "ans": "B", "exp": "課文明確指出，成立加工出口區、利用廉價勞力吸引外資和技術、發展輕工業並擴大出口（如電子裝配業），是臺灣工業發展歷程的第二階段。"}, {"stem": "政府推動十大建設，建設港口、機場與高速公路，並發展鋼鐵、石化等重化工業，這主要屬於臺灣工業發展歷程的哪一階段？", "opts": [["A", "十大建設（重化工業）時期"], ["B", "加工出口區時期"], ["C", "產業升級（科學園區）時期"], ["D", "農產加工時期"]], "ans": "A", "exp": "課文指出，配合重大基礎建設計畫、推動十大建設，建設港口、機場與高速公路，並發展鋼鐵、石化等重化工業，是臺灣工業發展歷程的第三階段。"}, {"stem": "部分傳統勞力密集產業（如紡織、製鞋）因產業環境改變而外移至中國或東南亞，政府轉而推動產業升級，發展新竹科學園區的半導體產業，這屬於臺灣工業發展歷程的哪一階段？", "opts": [["A", "十大建設時期"], ["B", "產業升級（科學園區、高科技）時期"], ["C", "農產加工時期"], ["D", "加工出口區時期"]], "ans": "B", "exp": "課文指出，因產業環境改變，傳統勞力密集產業外移，政府推動產業升級、發展技術和資本密集的高科技工業（如新竹科學園區的半導體產業），為工業發展歷程的第四階段。"}, {"stem": "新竹科學園區的半導體產業之所以能蓬勃發展，最主要的原因是下列何者？", "opts": [["A", "鄰近甘蔗產地"], ["B", "擁有便宜的土地租金"], ["C", "鄰近港口便於進口原料"], ["D", "具有豐沛的高素質人力資源和完整的產業鏈"]], "ans": "D", "exp": "課文指出，新竹科學園區的半導體產業因具有豐沛的高素質人力資源和完整的產業鏈，使高科技產業蓬勃發展，順利帶動臺灣工業轉型與升級。"}, {"stem": "民國八十年代後，政府陸續設置南部和中部科學園區，其研發重點主要是下列何者？", "opts": [["A", "紡織與製鞋等輕工業"], ["B", "鋼鐵與石化等重化工業"], ["C", "農產加工"], ["D", "高附加價值的光電技術及生物科技產品"]], "ans": "D", "exp": "課文指出，民國八十年代後政府陸續設置南部和中部科學園區，以研發高附加價值的光電技術及生物科技產品。"}, {"stem": "為加速國內產業升級並符合國際趨勢與環境永續，臺灣目前工業發展的重點之一是下列何者？", "opts": [["A", "擴大興建加工出口區"], ["B", "推動低汙染的綠能產業及人工智慧等知識創新產業"], ["C", "全面停止發展重化工業"], ["D", "限制高科技產業繼續發展"]], "ans": "B", "exp": "課文指出，為加速國內產業升級且符合國際趨勢與環境永續，目前工業發展重點在持續推動各項知識創新產業，如低汙染的綠能產業及人工智慧。"}, {"stem": "苗栗縣竹南鎮設置離岸風力發電場，這項建設主要呼應了臺灣工業發展的哪一項現代趨勢？", "opts": [["A", "加工出口導向"], ["B", "十大建設"], ["C", "農產加工"], ["D", "能源轉型與環境永續，發展綠色能源產業"]], "ans": "D", "exp": "課文指出，為了實現能源轉型和環境永續的目標，臺灣正積極推動發展綠色能源產業，如風力、太陽能、地熱等再生能源，苗栗竹南的離岸風力發電場即為一例。"}, {"stem": "高雄市的安拓實業原本是傳統螺絲工廠，數年前轉型生產牙科矯正用骨釘和人工牙根等精密產品，這個案例主要說明了下列何者？", "opts": [["A", "傳統產業也能透過技術升級找到新出路"], ["B", "傳統產業一定會被市場淘汰"], ["C", "螺絲工廠不可能轉型成功"], ["D", "醫療器材業屬於第一級產業"]], "ans": "A", "exp": "課文以安拓實業為例，說明部分傳統產業力求技術升級或產業轉型，以找出產業的新出路。"}, {"stem": "曾經引領臺灣經濟起飛的加工出口區，在民國110年時已經更名為下列何者？", "opts": [["A", "十大建設特區"], ["B", "農產加工特區"], ["C", "自由貿易港區"], ["D", "科技產業園區"]], "ans": "D", "exp": "課文提到，曾經引領臺灣經濟起飛的加工出口區，在民國110年時已更名為「科技產業園區」，園區內廠商持續創新升級，發展高科技產業。"}, {"stem": "下列何者不屬於臺灣「第三級產業」的範疇？", "opts": [["A", "金融保險業"], ["B", "鋼鐵工業"], ["C", "觀光休閒業"], ["D", "教育服務業"]], "ans": "B", "exp": "鋼鐵工業屬於第二級產業（工業）；第三級產業又稱服務業，包括商業、金融保險、醫療、教育及觀光休閒等。"}, {"stem": "關於臺灣第三級產業（服務業）的敘述，下列何者正確？", "opts": [["A", "服務業產值占臺灣三級產業總產值不到一成"], ["B", "服務業幾乎沒有就業人口"], ["C", "服務業創造的產值與就業人口比重都超過六成"], ["D", "服務業對臺灣經濟成長沒有影響力"]], "ans": "C", "exp": "課文指出，服務業創造的產值占臺灣三級產業總產值比重超過六成，且擁有近六成的就業人口，對經濟成長與就業機會有舉足輕重的影響。"}, {"stem": "服務業對臺灣經濟的重要性，主要展現在下列哪兩方面？", "opts": [["A", "促進經濟成長與創造就業機會"], ["B", "提供工業原料與動力來源"], ["C", "降低對進口原料的依賴"], ["D", "增加農產品的產量"]], "ans": "A", "exp": "課文指出，服務業對於促進經濟成長與創造就業機會有舉足輕重的影響力。"}, {"stem": "下列哪一項產業屬於第三級產業？", "opts": [["A", "半導體晶圓製造"], ["B", "鋼鐵冶煉"], ["C", "甘蔗種植"], ["D", "醫療服務"]], "ans": "D", "exp": "醫療服務屬於服務業，即第三級產業；半導體晶圓製造與鋼鐵冶煉屬第二級產業，甘蔗種植屬第一級產業。"}, {"stem": "隨著臺灣產業結構轉變，服務業就業  ["B", "貿易活動完全停止"], ["C", "進出口總額歸零"], ["D", "貿易表現仍佳，並持續保持出超"]], "ans": "D", "exp": "課文指出，民國112年臺灣貿易總額龐大，雖受疫情衝擊使貿易額下降，但貿易表現仍佳，也持續保持出超。"}, {"stem": "「臺灣企業的活動範圍已遍及全球」，這句話主要在描述下列哪一項現象？", "opts": [["A", "臺灣企業只在國內經營，不對外投資"], ["B", "臺灣已關閉對外貿易的管道"], ["C", "受全球化及企業全球布局影響，臺灣與全球關連程度日漸深化"], ["D", "臺灣企業不再需要進出口貿易"]], "ans": "C", "exp": "課文指出，受全球化及企業全球布局的影響，臺灣企業的活動範圍已遍及全球，顯示臺灣與全球關連的程度日漸深化。"}, {"stem": "隨著中國、東南亞國家崛起，以及區域經濟組織的形成與合作，臺灣的國際貿易面臨下列哪一項情況？", "opts": [["A", "完全不受任何影響"], ["B", "面臨的競爭、挑戰和轉型調適壓力更大"], ["C", "貿易對象自動變得更分散"], ["D", "不再需要考慮貿易夥伴的選擇"]], "ans": "B", "exp": "課文指出，隨著中國、東南亞國家崛起，區域經濟組織的形成和合作也不斷開展，使臺灣面臨的競爭、挑戰和轉型調適壓力也更大。"}, {"stem": "「雞蛋不要擺在同一個籃子裡」這句俗話，用來提醒臺灣的國際貿易應注意下列哪一項隱憂？", "opts": [["A", "貿易對象過於集中，過度依賴少數國家，風險較大"], ["B", "出口總值必須小於進口總值"], ["C", "應該減少與任何國家的貿易往來"], ["D", "應該只依賴單一貿易夥伴以求穩定"]], "ans": "A", "exp": "課文以此俗話提醒，臺灣的國際貿易對象過於集中、過度依賴少數國家，風險較大，是值得注意的隱憂。"}, {"stem": "承上題，面對貿易對象過於集中的隱憂，臺灣可採取下列哪一項因應做法？", "opts": [["A", "停止一切對外貿易活動"], ["B", "只與單一國家維持貿易往來"], ["C", "想辦法分散貿易對象，以降低風險"], ["D", "減少所有進出口活動的規模"]], "ans": "C", "exp": "課文指出，臺灣的國際貿易對象過於集中，故必須想辦法分散貿易對象，以分散風險。"}, {"stem": "「東協」（東南亞國家協會）與「歐盟」（歐洲聯盟）在臺灣國際貿易議題中，最主要代表下列何種概念？", "opts": [["A", "由多個國家組成的區域經濟組織"], ["B", "單一國家的簡稱"], ["C", "臺灣的邦交國名單"], ["D", "世界貿易總量的計算單位"]], "ans": "A", "exp": "課文說明東協是東南亞國家協會的簡稱、歐盟為歐洲聯盟，兩者皆屬於由多國組成、進行區域經濟合作的組織。"}, {"stem": "依課文中紡織廠員工的訪談紀錄，臺灣紡織業最初（戰後初期）的發展，主要是靠下列哪些條件起步？", "opts": [["A", "日本人留下的紡織設備、政府遷臺帶來的生產資材，以及美國援助的棉花"], ["B", "中國大陸最新引進的自動化設備"], ["C", "政府設立的加工出口區"], ["D", "半導體產業提供的技術支援"]], "ans": "A", "exp": "訪談紀錄提到，紡織廠創廠老闆靠著日本人留下的紡織設備，以及隨中華民國政府遷臺帶來的生產資材、美國援助的棉花等發展紡織業，屬於戰後民生工業的起步階段。"}, {"stem": "依訪談紀錄，某位紡織廠員工描述自己住進高雄加工出口區旁的女工宿舍、分三班輪流上工、產品逐漸轉向外銷，這段經歷最能對應臺灣工業發展歷程的哪一階段？", "opts": [["A", "十大建設時期"], ["B", "科學園區時期"], ["C", "農產加工時期"], ["D", "加工出口區時期"]], "ans": "D", "exp": "訪談中描述的高雄加工出口區、女工三班制、產品轉向外銷等特徵，正對應臺灣工業發展歷程中「成立加工出口區、發展輕工業並擴大出口」的階段。"}, {"stem": "紡織業之所以常被稱為「夕陽產業」，依訪談紀錄所述，主要原因是下列何者？", "opts": [["A", "紡織品在國際市場上評價不佳"], ["B", "政府禁止紡織業產品出口"], ["C", "臺灣工資上漲使生產成本提高，競爭力隨之降低"], ["D", "紡織業完全不需要投入勞力"]], "ans": "C", "exp": "課文指出，紡織業為勞力密集的產業，但臺灣工資上漲，紡織業生產成本提高，競爭力降低，導致許多工廠難以繼續經營，故常被稱為夕陽產業。"}, {"stem": "依訪談紀錄，較晚近的紡織業者採取下列哪一項轉型策略以維持產業競爭力？", "opts": [["A", "將臺灣作為接單、研發中心，生產基地外移，並開發彈性機能布料、與高科技廠商異業合作"], ["B", "完全放棄紡織本業，轉行從事農業"], ["C", "只生產傳統棉布，不再研發創新"], ["D", "將所有生產基地遷回臺灣本島，擴大雇用人力"]], "ans": "A", "exp": "訪談紀錄提到，業者將臺灣作為接單、研發中心，生產基地分散到中國、東南亞和非洲等地，並開發彈性機能性布料，甚至與高科技廠商合作發展居家照護智慧衣等，展現轉型的多元策略。"}, {"stem": "依課文「服裝機能」案例，若要為長時間在高溫廚房備料、炒菜的廚師設計工作服，最適合選用下列哪些機能？", "opts": [["A", "吸溼排汗、抗紫外線"], ["B", "輕薄涼感、耐高溫阻燃"], ["C", "彈性纖維、奈米防髒"], ["D", "夜間反光、防潑水"]], "ans": "B", "exp": "課文提到，整天在高溫廚房備料、炒菜的廚師，因廚房溫度高且用火，適合選用輕薄涼感、耐高溫阻燃等機能的服裝織品。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

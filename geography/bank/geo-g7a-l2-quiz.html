<script>
const QS=[{"stem": "臺灣島的絕對位置大致介於下列哪個經緯度範圍之間？", "opts": [["A", "東經120度到122度，北緯22度到25度"], ["B", "東經110度到112度，北緯20度到23度"], ["C", "東經122度到124度，北緯25度到28度"], ["D", "東經115度到118度，北緯18度到20度"]], "ans": "A", "exp": "臺灣島大致位於東經120度到122度、北緯22度到25度之間，這是課本中臺灣絕對位置的標準敘述。"}, {"stem": "「絕對位置」與「相對位置」是描述地理位置的兩種方式。下列何者是用「絕對位置」來描述臺灣？", "opts": [["A", "臺灣位於中國的東南方"], ["B", "臺灣位於太平洋的西側"], ["C", "臺灣大致位於北緯22度到25度之間"], ["D", "臺灣位於亞洲大陸的東側"]], "ans": "C", "exp": "以經緯度數值表示的位置屬於絕對位置；以某地點為參考基準所描述的位置關係（如「在某國的哪個方位」）屬於相對位置。選項A、B、D都是以參考點描述，屬於相對位置。"}, {"stem": "從全球海陸分布來看，海洋與陸地的面積比例大致為何？", "opts": [["A", "陸地約占71%，海洋約占29%"], ["B", "海洋約占71%，陸地約占29%"], ["C", "陸地與海洋約各占50%"], ["D", "海洋約占90%，陸地約占10%"]], "ans": "B", "exp": "地球表面海洋約占71%，陸地約占29%，陸地與海洋面積比約為3：7，地球可說是個「水世界」。"}, {"stem": "地球上的陸地分為七大洲，海洋分為三大洋。臺灣位於下列哪一洲與哪一大洋之間？", "opts": [["A", "歐洲；大西洋"], ["B", "大洋洲；太平洋"], ["C", "非洲；印度洋"], ["D", "亞洲；太平洋"]], "ans": "D", "exp": "臺灣位於全球最大陸地「亞洲」（與歐洲相連合稱歐亞大陸）的東側，以及全球最大海洋「太平洋」的西側，正處於海陸交界地帶。"}, {"stem": "關於全球陸地分布的敘述，下列何者正確？", "opts": [["A", "陸地平均分布於南、北半球"], ["B", "陸地主要集中在南半球"], ["C", "陸地主要集中在北半球"], ["D", "陸地大多分布在赤道附近的低緯度"]], "ans": "C", "exp": "全球陸地分布並不平均，陸地主要集中在北半球，因此人類活動與人口也較集中於北半球。"}, {"stem": "從鄰國的相對位置來看，下列敘述何者正確？", "opts": [["A", "臺灣位於中國的東南方"], ["B", "臺灣位於菲律賓的南方"], ["C", "臺灣位於日本、南韓的東北方"], ["D", "臺灣位於越南的正東方"]], "ans": "A", "exp": "從相對位置來看，臺灣位於中國的東南方（隔臺灣海峽）、日本與南韓的西南方（隔東海）、菲律賓的北方（隔巴士海峽）、越南的東北方（隔南海）。"}, {"stem": "臺灣是由一系列西太平洋火山島嶼所組成的島弧的一部分，這個島弧由北而南依序經過阿留申群島、千島群島、日本群島、琉球群島、臺灣、菲律賓群島、印尼群島，這個島弧稱為什麼？", "opts": [["A", "西太平洋群島鏈"], ["B", "太平洋火環"], ["C", "南島語族島弧"], ["D", "東亞島弧"]], "ans": "D", "exp": "這一系列由北而南排列的西太平洋火山島嶼合稱「東亞島弧」，臺灣正位於此島弧的中段。"}, {"stem": "臺灣地處「最大陸地」與「最大海洋」的交界處，這種位置關係稱為下列何者？", "opts": [["A", "絕對位置"], ["B", "海陸位置"], ["C", "經濟位置"], ["D", "戰略位置"]], "ans": "B", "exp": "描述一地與海洋、陸地相對關係的位置稱為海陸位置。臺灣的海陸位置是位於亞洲大陸與太平洋的交界，因此具有重要的交通與生態意義。"}, {"stem": "臺灣的領土範圍，除了臺灣本島外，還包括下列哪一組島嶼？", "opts": [["A", "澎湖群島、金門列嶼、馬祖列嶼、釣魚臺列嶼、南沙群島太平島"], ["B", "澎湖群島、海南島、舟山群島"], ["C", "金門列嶼、馬祖列嶼、琉球群島"], ["D", "釣魚臺列嶼、對馬島、濟州島"]], "ans": "A", "exp": "臺灣地區的範圍除了臺灣本島，還 多個層面，都受到位置因素的深遠影響。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

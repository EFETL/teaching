<script>
const QS=[{"stem": "「漠南非洲」一詞主要是以哪一項自然地理界線，作為劃分北非與漠南非洲的依據？", "opts": [["A", "赤道"], ["B", "東非大裂谷"], ["C", "撒哈拉沙漠"], ["D", "剛果盆地"]], "ans": "C", "exp": "撒哈拉沙漠將非洲大陸分隔為南北兩區，習慣將沙漠以南稱為漠南非洲，沙漠以北為北非，兩區在種族、宗教等文化面向差異甚大。"}, {"stem": "關於漠南非洲的地理位置，下列敘述何者正確？", "opts": [["A", "赤道橫貫本區中部"], ["B", "位於撒哈拉沙漠以北"], ["C", "東臨大西洋、西濱印度洋"], ["D", "全區皆位於南半球"]], "ans": "A", "exp": "赤道橫貫非洲大陸中部，是漠南非洲氣候與植物帶呈南北對稱分布的主要原因；本區實際上是東臨印度洋、西濱大西洋，且範圍橫跨南、北半球。"}, {"stem": "漠南非洲雖多為古老陸塊，但蘊藏哪一類天然資源特別豐富，是本區重要的自然資源？", "opts": [["A", "石油與天然氣"], ["B", "煤與鐵礦"], ["C", "磷礦與硫磺"], ["D", "黃金與鑽石等礦產"]], "ans": "D", "exp": "漠南非洲地質古老，蘊藏豐富的黃金、鑽石等礦產資源，是本區重要的自然資源之一。"}, {"stem": "漠南非洲的地形以下列何者為主體？", "opts": [["A", "平原"], ["B", "高原"], ["C", "山地"], ["D", "丘陵"]], "ans": "B", "exp": "漠南非洲為一地質古老的高原型大陸，地形以高原為主體。"}, {"stem": "漠南非洲高原直逼海崖，因此海岸地形具有下列哪一項特徵？", "opts": [["A", "陡峭平直，少有天然港灣"], ["B", "多曲折海灣，港灣密布"], ["C", "沙洲發達，適合養殖"], ["D", "峽灣深入內陸"]], "ans": "A", "exp": "漠南非洲高原直逼海崖，海岸陡峭平直，少有天然港灣，昔日對外交通因此較不方便。"}, {"stem": "漠南非洲高原西半部分布著多處大盆地，下列何者「不屬於」此區的盆地？", "opts": [["A", "撒哈拉盆地"], ["B", "剛果盆地"], ["C", "衣索比亞高原"], ["D", "喀拉哈里盆地"]], "ans": "C", "exp": "高原西半部有多處大盆地，如撒哈拉盆地、剛果盆地、喀拉哈里盆地等；衣索比亞高原則是東非的高地地形，並非盆地。"}, {"stem": "東非大裂谷的形成，主要與下列何種作用力有關？", "opts": [["A", "河流侵蝕"], ["B", "板塊張裂拉伸使地殼斷裂下陷"], ["C", "冰河侵蝕"], ["D", "珊瑚礁堆積"]], "ans": "B", "exp": "東非大裂谷因板塊運動的張裂拉伸作用，使地殼斷裂下陷，形成狹長的凹陷地帶，稱為地塹。"}, {"stem": "漠南非洲何處為地震最頻繁、強度最強烈的地區？", "opts": [["A", "剛果盆地"], ["B", "幾內亞灣沿岸"], ["C", "喀拉哈里盆地"], ["D", "東非大裂谷一帶"]], "ans": "D", "exp": "東非大裂谷一帶因位於板塊交界處，地殼活動劇烈，是漠南非洲地震最頻繁、最強烈的地區。"}, {"stem": "關於吉力馬札羅山的敘述，下列何者正確？", "opts": [["A", "位於西非沿海地區"], ["B", "是一座活躍的活火山，經常噴發"], ["C", "為非洲第一高峰，山頂終年積雪"], ["D", "位於剛果盆地中央"]], "ans": "C", "exp": "吉力馬札羅山位於赤道附近，為非洲第一高峰，山頂常年有積雪，西元1987年被列入世界遺產。"}, {"stem": "剛果盆地為何會出現落差達兩百多公尺的瀑布急湍，導致通航困難？", "opts": [["A", "古代大湖西南方被切穿，切穿處上下落差大"], ["B", "盆地地勢平坦，河道彎曲"], ["C", "位於高地氣候區，降雨量過大"], ["D", "板塊擠壓造成褶皺山地"]], "ans": "A", "exp": "剛果盆地古代曾為大湖，西南方被切穿後湖水外洩才露出成盆地，因切穿處上下落差達兩百多公尺，形成瀑布急湍，通航困難。"}, {"stem": "漠南非洲的平原分布有何特色？", "opts": [["A", "面積廣大且連續分布"], ["B", "完全不存在平原地形"], ["C", "主要分布於東非大裂谷內"], ["D", "面積狹小且零星分布，以尼日河、剛果河沿岸及幾內亞灣沿海較重要"]], "ans": "D", "exp": "漠南非洲的平原面積狹小且零星分布，其中以尼日河、剛果河的沿岸及幾內亞灣的沿海平原較為重要，是人口聚集的精華區。"}, {"stem": "沿著東非大裂谷分布著許多火山與湖泊，這樣的景觀主要與下列何者有關？", "opts": [["A", "珊瑚礁的堆積作用"], ["B", "斷層陷落與熔岩堆積作用"], ["C", "冰河退縮作用"], ["D", "河流沖積作用"]], "ans": "B", "exp": "東非大裂谷沿線因斷層陷落形成低窪地形，加上熔岩堆積形成的高原與山地，因此沿裂谷帶分布許多火山和湖泊，如吉力馬札羅山、馬拉威湖。"}, {"stem": "漠南非洲的氣候帶與天然植物帶大致呈現何種分布特色？", "opts": [["A", "以赤道為中心，南北對稱分布"], ["B", "由東向西呈環狀分布"], ["C", "由沿海向內陸呈同心圓分布"], ["D", "完全不規則分布"]], "ans": "A", "exp": "由於赤道橫貫非洲大陸中部，漠南非洲的氣候類型以赤道為中心，向南北兩側隨緯度增加而變化，呈現南北對稱分布。"}, {"stem": "熱帶雨林氣候主要分布於漠南非洲何處？其氣候特徵為何？", "opts": [["A", "南、北回歸線附近；全年少雨"], ["B", "東南沿海；夏雨冬乾"], ["C", "西南沿海；夏乾冬雨"], ["D", "赤道兩側；全年高溫多雨，年溫差小"]], "ans": "D", "exp": "熱帶雨林氣候主要分布在赤道兩側，全年高溫，年溫差小，降水量豐沛且全年有雨，樹種繁雜，野生動物眾多。"}, {"stem": "熱帶莽原氣候的降水特徵為何？", "opts": [["A", "全年多雨且無乾季"], ["B", "冬雨夏乾"], ["C", "夏雨冬乾，乾溼分明"], ["D", "全年皆乾燥少雨"]], "ans": "C", "exp": "熱帶莽原氣候主要分布於熱帶雨林氣候南北兩側，夏雨冬乾，乾溼分明，天然植被以疏林與草原為主。"}, {"stem": "下列何者「不是」分布於漠南非洲的熱帶沙漠？", "opts": [["A", "撒哈拉沙漠"], ["B", "塔克拉瑪干沙漠"], ["C", "喀拉哈里沙漠"], ["D", "納米比沙漠"]], "ans": "B", "exp": "撒哈拉沙漠、喀拉哈里沙漠、納米比沙漠皆位於漠南非洲；塔克拉瑪干沙漠則位於中國新疆，不屬於本區。"}, {"stem": "漠南非洲南、北回歸線附近形成熱帶沙漠氣候，主要原因為何？", "opts": [["A", "終年受赤道低氣壓籠罩"], ["B", "受東北季風影響"], ["C", "受寒流直接侵襲海岸"], ["D", "終年受副熱帶高氣壓籠罩，乾燥少雨"]], "ans": "D", "exp": "莽原區往南、北至回歸線兩側，因受副熱帶高氣壓籠罩，形成全年少雨、植被稀少的熱帶沙漠氣候。"}, {"stem": "納米比沙漠雖然位於海邊，卻依然十分乾燥少雨，主要與下列何者有關？", "opts": [["A", "沿海有涼流流經，空氣穩定不易對流降水"], ["B", "沿海有暖流流經，水氣蒸散快"], ["C", "地勢過高，水氣難以到達"], ["D", "終年受季風直接吹拂"]], "ans": "A", "exp": "納米比沙漠雖位於海邊，但因沿海有涼流經過，使空氣穩定、不易產生對流降水，因此形成乾燥的沙漠氣候。"}, {"stem": "東非高原地區雖然地處低緯度，氣候卻涼爽宜人，屬於何種氣候類型？", "opts": [["A", "溫帶地中海型氣候"], ["B", "高地氣候"], ["C", "熱帶莽原氣候"], ["D", "副極地氣候"]], "ans": "B", "exp": "東非大裂谷一帶因地勢較高，氣候涼爽，形成高地氣候。"}, {"stem": "漠南非洲西南岸（如南非開普敦一帶）屬於溫帶地中海型氣候，其降水特徵為何？", "opts": [["A", "全年有雨"], ["B", "夏雨冬乾"], ["C", "夏乾冬雨"], ["D", "全年乾燥"]], "ans": "C", "exp": "溫帶地中海型氣候主要分布在漠南非洲西南岸，夏季受副熱帶高氣壓籠罩，氣候乾燥炎熱；冬季則有西風帶來降水，形成夏乾冬雨的特色。"}, {"stem": "漠南非洲東南隅的夏雨型暖溫帶氣候，其夏季降水較多的原因為何？", "opts": [["A", "受東南信風帶來水氣"], ["B", "受赤道低壓籠罩"], ["C", "受西風帶影響"], ["D", "受涼流影響"]], "ans": "A", "exp": "夏雨型暖溫帶氣候主要分布在漠南非洲東南側，夏熱冬暖，因東南信風帶來水氣，夏季降水較多。"}, {"stem": "關於洋流對沿海氣候的影響，下列敘述何者正確？", "opts": [["A", "涼流經過的沿海地區通常較為溫暖多雨"], ["B", "洋流對氣候完全沒有影響"], ["C", "暖流會使沿海地區變得乾燥少雨"], ["D", "暖流經過的沿海地區通常較為溫暖溼潤"]], "ans": "D", "exp": "沿海地區若有暖流流經，通常較為溫暖溼潤；附近海域如有涼流或寒流流經，氣候則顯得較乾燥或寒冷。"}, {"stem": "剛果河流量豐富且穩定，主要與下列何種氣候特徵有關？", "opts": [["A", "夏雨冬乾"], ["B", "全年高溫多雨"], ["C", "冬雨夏乾"], ["D", "終年少雨"]], "ans": "B", "exp": "剛果河流經赤道附近的熱帶雨林氣候區，該區全年高溫多雨，使剛果河流量豐富而穩定。"}, {"stem": "衣索比亞高原、東非高原等地區之所以成為漠南非洲人口聚居的區域，主要原因為何？", "opts": [["A", "礦產資源特別豐富"], ["B", "沿海交通便利"], ["C", "氣候較為涼爽宜人"], ["D", "土壤特別貧瘠"]], "ans": "C", "exp": "衣索比亞高原、東非高原等地區因地勢較高，氣候較為涼爽，成為人口聚居的區域；另尼日河沿岸則因水源豐富，人口也相對密集。"}, {"stem": "漠南非洲居民因應自然環境差異，發展出多樣的傳統維生活動，其中「採集與狩獵」主要零星分布於下列哪些氣候地區？", "opts": [["A", "溫帶地中海型氣候與高地氣候"], ["B", "熱帶莽原氣候與夏雨型暖溫帶氣候"], ["C", "副極地氣候與寒帶氣候"], ["D", "熱帶雨林與乾燥氣候地區"]], "ans": "D", "exp": "採集與狩獵零星分布於熱帶雨林與乾燥氣候地區，因熱帶雨林食物來源豐富，乾燥地區居民則需仰賴採集狩獵維生。"}, {"stem": "生活在剛果盆地雨林中，男人外出捕獵、女人採摘野果與樹根維生的族群，最可能是下列何者？", "opts": [["A", "匹美人"], ["B", "馬賽人"], ["C", "布希曼人"], ["D", "馬拉加西人"]], "ans": "A", "exp": "匹美人生活在雨林中，以採集與狩獵維生，男人負責外出捕獵，女人則負責採摘野果和樹根。"}, {"stem": "喀拉哈里沙漠的布希曼人主要以下列何種方式維生？", "opts": [["A", "游牧"], ["B", "游耕"], ["C", "採集、狩獵"], ["D", "商業性農業"]], "ans": "C", "exp": "喀拉哈里沙漠的布希曼人以採集、狩獵維生，並經常隨季節遷徙居住地，是漠南非洲乾燥氣候地區的代表性族群。"}, {"stem": "「游耕」的維生方式主要分布於下列哪些氣候區？", "opts": [["A", "溫帶地中海型氣候區"], ["B", "熱帶雨林和莽原氣候區"], ["C", "熱帶沙漠氣候區"], ["D", "高地氣候區"]], "ans": "B", "exp": "游耕多分布於熱帶雨林和莽原氣候區，居民先焚林整地，利用灰燼提供養分耕種，待地力耗盡後再遷移至新耕地。"}, {"stem": "游耕的耕作方式中，農民焚燒林木後才耕種，主要目的為何？", "opts": [["A", "灰燼可作為土壤養分，利於作物生長"], ["B", "驅趕野生動物"], ["C", "增加土地面積"], ["D", "便於興建道路"]], "ans": "A", "exp": "游耕的居民會先焚燒草木整地，草木焚燒後的灰燼可成為土壤的養分，有助於作物生長；待土壤養分不足時，才遷移另闢新耕地。"}, {"stem": "以逐水草而居、牛隻頭數作為財富與地位象徵的維生方式，是下列何者的生活寫照？", "opts": [["A", "剛果盆地的匹美人"], ["B", "開普敦的葡萄農"], ["C", "廷布克圖的商人"], ["D", "莽原邊緣的游牧民族（如馬賽人）"]], "ans": "D", "exp": "游牧主要分布在莽原氣候與乾燥氣候的過渡區，居民逐水草而居，牛隻頭數是其財富與地位的象徵，馬賽人即為代表性族群。"}, {"stem": "游牧維生方式主要分布於下列哪一氣候過渡帶？", "opts": [["A", "熱帶雨林與莽原氣候的過渡區"], ["B", "莽原氣候與乾燥氣候的過渡區"], ["C", "地中海型氣候與莽原氣候的過渡區"], ["D", "高地氣候與雨林氣候的過渡區"]], "ans": "B", "exp": "游牧主要分布在莽原氣候與乾燥氣候的過渡區，因降水較少且不穩定，居民多採逐水草而居的生活方式。"}, {"stem": "漠南非洲傳統維生方式（採集狩獵、游耕、游牧）的分布差異，主要反映出下列何種因素對人類活動的影響？", "opts": [["A", "宗教信仰"], ["B", "殖民母國政策"], ["C", "自然環境（氣候）條件"], ["D", "電影產業發展"]], "ans": "C", "exp": "漠南非洲居民因應自然環境（尤其是氣候）的差異，發展出採集狩獵、游耕、游牧等不同的傳統維生活動。"}, {"stem": "漠南非洲的人口以下列何種族群為主？", "opts": [["A", "阿拉伯人"], ["B", "歐裔白人"], ["C", "印度裔移民"], ["D", "黑人"]], "ans": "D", "exp": "漠南非洲的人口大部分為黑種人，僅南非有較多歐裔白人，馬達加斯加島上則有屬於南島語族的馬拉加西人。"}, {"stem": "馬達加斯加島上的馬拉加西人，在族群語言分類上屬於下列何者？", "opts": [["A", "南島語族"], ["B", "阿拉伯語族"], ["C", "印歐語族"], ["D", "班圖語族"]], "ans": "A", "exp": "馬達加斯加島上的馬拉加西人屬於南島語族，與非洲大陸上大多數黑人族群的語言系統不同。"}, {"stem": "南非共和國境內出現較多歐裔白人的主要原因為何？", "opts": [["A", "當地礦產特別豐富，吸引白人淘金"], ["B", "氣候溫和近似歐洲大陸，吸引歐洲移民"], ["C", "白人原本就是當地原住民"], ["D", "白人躲避戰亂而移入"]], "ans": "B", "exp": "南非氣候溫和，近似歐洲大陸，吸引大量白人移民，也引進歐洲的休閒文化（例如足球運動）。"}, {"stem": "漠南非洲原始信仰的核心觀念為何？", "opts": [["A", "崇拜單一的至上神"], ["B", "否定任何形式的宗教信仰"], ["C", "相信萬物有靈，崇拜自然與祖先，並將崇拜對象化為圖騰"], ["D", "僅崇拜祖先，不崇拜自然"]], "ans": "C", "exp": "漠南非洲原住民部落透過對祖先、自然萬物的敬畏崇拜，形成社會規範，並將崇拜對象化為圖騰，祭祀時的音樂與舞蹈也成為重要的文化資產。"}, {"stem": "伊斯蘭教傳入漠南非洲，主要是透過下列何種途徑？", "opts": [["A", "歐洲國家的武力殖民"], ["B", "聯合國的宗教推廣計畫"], ["C", "電影產業的文化輸出"], ["D", "穆斯林的移居與經商"]], "ans": "D", "exp": "伊斯蘭教隨著穆斯林的移居或經商，傳入漠南非洲的東部與西部；基督教則主要隨著西方殖民勢力深入各處。"}, {"stem": "基督宗教之所以普遍深入漠南非洲各處，主要與下列何者有關？", "opts": [["A", "西方殖民勢力的影響"], ["B", "穆斯林商人的傳教"], ["C", "馬拉加西人的遷徙"], ["D", "東非大裂谷的地形阻隔"]], "ans": "A", "exp": "基督教在西方殖民勢力的影響下，普遍深入漠南非洲各處，使當地文化更趨多元。"}, {"stem": "漠南非洲部落的面具雕刻與祭祀舞蹈等藝術文化，對外產生了下列何種影響？", "opts": [["A", "完全未對外界產生任何影響"], ["B", "僅侷限於本地部落內部流傳"], ["C", "影響了二十世紀歐洲畫家（如畢卡索）的繪畫風格，也影響了國際流行音樂與標準舞蹈"], ["D", "導致歐洲全面禁止非洲藝術品進口"]], "ans": "C", "exp": "漠南非洲的面具雕刻與宗教儀式舞蹈等藝術文化，影響了二十世紀歐洲畫家（如畢卡索）的繪畫風格，也影響了國際標準舞蹈與流行音樂的發展。"}, {"stem": "馬利廷布克圖著名的金格勒貝爾清真寺，其建築材料就地取材，主要使用下列何種材料建成？", "opts": [["A", "鋼筋混凝土"], ["B", "泥土、草莖和木材"], ["C", "大理石"], ["D", "玻璃帷幕"]], "ans": "B", "exp": "廷布克圖曾是伊斯蘭教的傳播中心，城內的金格勒貝爾清真寺就地取材，以泥土、草莖和木材建成，反映當地自然環境與宗教文化的結合。"}, {"stem": "漠南非洲許多國家獨立後，仍出現族群衝突頻繁的現象，其根本原因主要與下列何者有關？", "opts": [["A", "各族群語言完全相同，缺乏文化認同"], ["B", "獨立後各國拒絕發展工業"], ["C", "氣候變遷導致資源枯竭"], ["D", "歐洲列強殖民時期，未顧及當地族群分布，以經緯線等方式劃分疆界"]], "ans": "D", "exp": "歐洲列強殖民非洲時，劃分勢力範圍多未顧及當地族群的傳統領域，獨立後多沿用殖民時期疆界，造成一國由多族群組成，或同族群被分屬不同國家，因而埋下衝突的因子。"}, {"stem": "南非共和國過去實施的「種族隔離政策」，其主要內容為何？", "opts": [["A", "少數白人執政，限制黑人各項權利，並強迫黑人集中在條件較差的地區居住"], ["B", "白人與黑人享有完全平等的政治權利"], ["C", "禁止任何族群移民南非"], ["D", "廢除所有宗教信仰活動"]], "ans": "A", "exp": "南非共和國過去由少數白人執政，奉行種族隔離政策，限制黑人的各項權利，甚至強迫黑人集中在環境條件較差的地區居住。"}, {"stem": "南非首位黑人總統曼德拉，因何種貢獻獲得諾貝爾和平獎？", "opts": [["A", "發展核子武器嚇阻他國"], ["B", "長期推動多元族群融合，終止種族隔離政策"], ["C", "大量開採鑽石礦增加國家收入"], ["D", "建立奈萊塢電影產業"]], "ans": "B", "exp": "曼德拉在南非結束種族隔離、實現全民普選後成為首任黑人總統，因長期推動多元族群融合而獲得諾貝爾和平獎殊榮。"}, {"stem": "盧安達歷史上發生的重大種族衝突事件，主要是下列哪兩個族群之間的內戰與屠殺？", "opts": [["A", "馬賽人與布希曼人"], ["B", "匹美人與馬拉加西人"], ["C", "胡圖族與圖西族"], ["D", "索馬利人與衣索比亞人"]], "ans": "C", "exp": "盧安達的胡圖族與圖西族爭奪政權，導致該國爆發嚴重的內戰與種族屠殺，是非洲近代史上最大規模的種族屠殺事件之一。"}, {"stem": "索馬利人因殖民者畫分疆界時被分散至不同國家，導致下列何種後續問題？", "opts": [["A", "索馬利人因此完全消失"], ["B", "促成索馬利人統一建國且再無爭端"], ["C", "使該地區完全沒有族群問題"], ["D", "造成索馬利人分散於索馬利亞、衣索比亞等國，並引發領土主權爭議"]], "ans": "D", "exp": "歐洲多國曾強占並瓜分漠南非洲東側的非洲之角，導致索馬利人分散在不同國家，彼此間領土主權爭議不斷。"}, {"stem": "盧安達內戰結束後，該國採取了哪一項環境政策，使首都吉佳利被評為「非洲最乾淨都市」之一？", "opts": [["A", "禁止使用塑膠袋，並對違者處以罰金"], ["B", "大量開發沿海觀光資源"], ["C", "全面禁止農業活動"], ["D", "興建大型水力發電廠"]], "ans": "A", "exp": "盧安達內戰結束後，經濟快速成長，並積極推動禁止使用塑膠袋的政策，違者將被處以罰金，使首都吉佳利被評為「非洲最乾淨都市」與「非洲最安全都市」。"}, {"stem": "關於漠南非洲部分地名（如維多利亞湖、維多利亞瀑布）的由來，下列敘述何者最為合理？", "opts": [["A", "是當地原住民族語言的音譯"], ["B", "反映歐洲殖民文化的色彩，以殖民母國君主（英國女王）的名字命名"], ["C", "是依據當地動植物特色命名"], ["D", "是依據地形高度命名"]], "ans": "B", "exp": "漠南非洲許多國家多以原殖民母國的語言為官方語言，部分地名也反映殖民文化色彩，例如以英國女王名字命名的維多利亞湖、維多利亞瀑布等。"}, {"stem": "近年漠南非洲倡議的「公平貿易」，主要是為了解決咖啡、可可農場中的哪些社會問題？", "opts": [["A", "咖啡與可可產量過剩問題"], ["B", "農場主人繳稅過重問題"], ["C", "農民與農場主人所得過低、僱用童工等問題"], ["D", "咖啡與可可無法出口的問題"]], "ans": "C", "exp": "漠南非洲從事咖啡、可可農場工作的居民所得甚低，農場主人年收入也不高，部分農場僱用工資低廉的童工，因此有組織倡議建立公平貿易制度，以合理價格採購咖啡和可可，改善農民生活。"}, {"stem": "奈及利亞的「奈萊塢」電影產業，其電影題材多圍繞於下列哪些主題？", "opts": [["A", "太空科技與外星文明"], ["B", "歐洲貴族的宮廷生活"], ["C", "極地探險故事"], ["D", "窮人發財、民間傳說或政府貪汙腐敗等貼近當地生活的題材"]], "ans": "D", "exp": "奈萊塢的本土電影多以英語發音，題材多圍繞在窮人發財、民間傳說或政府貪汙腐敗等貼近當地社會生活的橋段，因此廣受漠南非洲市場歡迎。"}, {"stem": "奈及利亞的官方語言為英文，這與該國下列哪一項歷史背景最直接相關？", "opts": [["A", "曾被英國殖民"], ["B", "曾是法國殖民地"], ["C", "曾被荷蘭統治"], ["D", "與歐洲從未有任何接觸"]], "ans": "A", "exp": "漠南非洲許多國家多以原殖民母國的語言為官方語言，奈及利亞早期曾被英國殖民，因此該國的官方語言為英文。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "地理課本上所稱的「大洋洲」，主要是指下列哪個範圍？", "opts": [["A", "南美洲與加勒比海島嶼"], ["B", "太平洋上眾多島嶼及澳大利亞（澳洲）所形成的地區"], ["C", "印度洋沿岸的島嶼與大陸"], ["D", "大西洋中的火山群島"]], "ans": "B", "exp": "大洋洲是指太平洋眾多島嶼及澳大利亞（簡稱澳洲）所形成的地區。"}, {"stem": "大洋洲三大島群主要依據下列哪兩項地理界線劃分？", "opts": [["A", "北回歸線與本初子午線"], ["B", "赤道與國際換日線的實際位置"], ["C", "赤道與經度180度"], ["D", "南回歸線與180度經線"]], "ans": "C", "exp": "三大島群分布於南、北回歸線之間，大致以赤道和經度180度為界線劃分。"}, {"stem": "下列何者位於西太平洋、赤道以北，是大洋洲三大島群之一？", "opts": [["A", "密克羅尼西亞"], ["B", "美拉尼西亞"], ["C", "玻里尼西亞"], ["D", "加勒比海群島"]], "ans": "A", "exp": "密克羅尼西亞位於西太平洋、赤道以北。"}, {"stem": "大洋洲三大島群中，位於赤道以南的是下列何者？", "opts": [["A", "密克羅尼西亞"], ["B", "玻里尼西亞"], ["C", "復活節群島"], ["D", "美拉尼西亞"]], "ans": "D", "exp": "美拉尼西亞位於赤道以南；密克羅尼西亞則位於赤道以北。"}, {"stem": "位於東太平洋的大洋洲島群為下列何者？", "opts": [["A", "密克羅尼西亞"], ["B", "玻里尼西亞"], ["C", "美拉尼西亞"], ["D", "阿留申群島"]], "ans": "B", "exp": "玻里尼西亞位於東太平洋。"}, {"stem": "大洋洲的「高島」主要是由下列何種作用形成，且因能攔截水氣、土壤肥沃而適合農業發展？", "opts": [["A", "珊瑚礁堆積作用"], ["B", "河流沖積作用"], ["C", "火山噴發、熔岩與火山灰堆積作用"], ["D", "冰河侵蝕作用"]], "ans": "C", "exp": "高島由海底火山噴發後，熔岩及火山灰堆積而成，地勢較高、土壤肥沃可從事農耕，例如夏威夷群島。"}, {"stem": "大洋洲的「低島」主要由何種物質堆積而成，因此普遍缺乏淡水、土壤貧瘠，居民多以漁業維生？", "opts": [["A", "珊瑚礁"], ["B", "火山熔岩"], ["C", "冰磧物"], ["D", "沖積泥沙"]], "ans": "A", "exp": "低島由海底珊瑚礁堆積而成，地勢低平，淡水資源不足、土壤貧瘠，農業發展受限，例如吉里巴斯、帛琉。"}, {"stem": "夏威夷群島主要由火山島構成，屬於大洋洲哪一種島嶼類型？", "opts": [["A", "低島"], ["B", "大陸島"], ["C", "沖積島"], ["D", "高島"]], "ans": "D", "exp": "夏威夷群島由火山島構成，地勢較高、土壤肥沃，屬於「高島」。"}, {"stem": "帛琉的珊瑚礁島群，農業發展較受限制，居民傳統上多以下列何種產業維生？", "opts": [["A", "大規模畜牧業"], ["B", "漁業"], ["C", "商業性穀物栽培"], ["D", "採礦業"]], "ans": "B", "exp": "帛琉屬於珊瑚礁構成的低島，淡水與土壤條件不佳，居民多以漁業維生。"}, {"stem": "大洋洲各島嶼因與全球各大陸距離遙遠、貿易往來不便，傳統上多以下列哪種產業為主？", "opts": [["A", "外銷導向的重工業"], ["B", "大規模機械化農業"], ["C", "自給性的第一級產業"], ["D", "高科技資訊產業"]], "ans": "C", "exp": "大洋洲與全球各大陸距離遙遠，貿易往來不便，故傳統多以自給性的第一級產業為主。"}, {"stem": "21世紀以來，大洋洲各島嶼的觀光業逐漸取代傳統農漁業成為重要經濟來源，最主要的原因是下列何者？", "opts": [["A", "航空運輸日益便捷，吸引嚮往熱帶風情的觀光客"], ["B", "各國政府全面禁止漁業捕撈"], ["C", "島嶼面積大幅擴張"], ["D", "珊瑚礁大量消失使漁業無法發展"]], "ans": "A", "exp": "21世紀以來因航空運輸愈加便捷，帶來嚮往熱帶風情的觀光客，使觀光業收入超過傳統農、漁業，成為大洋洲的新財源。"}, {"stem": "大洋洲有國際換日線通過，造成鄰近島國時間、日期不一。下列哪一個南太平洋島國曾調整時區，以增進與紐西蘭、澳洲的貿易往來便利性？", "opts": [["A", "帛琉"], ["B", "吉里巴斯"], ["C", "大溪地"], ["D", "薩摩亞"]], "ans": "D", "exp": "薩摩亞原先因位處國際換日線東側，時間較鄰近的紐、澳晚一日，為強化貿易往來便利，調整時區後已與紐、澳同一日。"}, {"stem": "澳洲的地形由東向西大致依序為下列何者？", "opts": [["A", "大分水嶺→東南沿海平原→西部高原→中部平原"], ["B", "東南沿海平原→大分水嶺→中部平原→西部高原"], ["C", "西部高原→中部平原→大分水嶺→東南沿海平原"], ["D", "中部平原→西部高原→東南沿海平原→大分水嶺"]], "ans": "B", "exp": "澳洲以高原為主體，地形由東向西依序為東南沿海平原、大分水嶺、中部平原、西部高原。"}, {"stem": "有關澳洲「大分水嶺」的敘述，下列何者正確？", "opts": [["A", "為新褶曲山脈，地震活動頻繁"], ["B", "位於澳洲西部，阻擋西風水氣"], ["C", "為澳洲東部地形的重要分界，其東側迎東南信風，降水較多"], ["D", "是由珊瑚礁堆積而成的地形"]], "ans": "C", "exp": "大分水嶺以東位於東南信風迎風坡，加上沿海暖流影響，降水量較多，是澳洲人口與產業集中的精華區。"}, {"stem": "位於澳洲中部，因周圍岩層長期受侵蝕而留下的巨大岩塊，被當地原住民視為聖地，是下列何者？", "opts": [["A", "艾爾斯岩"], ["B", "大堡礁"], ["C", "大分水嶺"], ["D", "藍山"]], "ans": "A", "exp": "艾爾斯岩位於澳洲中部，因周圍岩層受侵蝕而留下巨大岩塊，被當地原住民族視為聖地。"}, {"stem": "位於澳洲東北海岸、被譽為全球最大熱帶珊瑚礁生態系的是下列何者？", "opts": [["A", "艾爾斯岩"], ["B", "藍山國家公園"], ["C", "辛普森沙漠"], ["D", "大堡礁"]], "ans": "D", "exp": "大堡礁位於澳洲東北海岸，是世界最大、最長的珊瑚礁群，也是全球最大的熱帶珊瑚礁生態系。"}, {"stem": "澳洲東南沿海平原降水較多、人口與產業集中，其主要原因是下列何者？", "opts": [["A", "位於背風側，且受副熱帶高壓籠罩"], ["B", "面迎東南信風，加上沿海暖流的影響"], ["C", "終年受西風吹拂，水氣豐沛"], ["D", "地處高原，地形雨發達"]], "ans": "B", "exp": "大分水嶺以東的沿海平原面迎東南信風，加上沿海暖流影響，降水量較多，屬夏雨型暖溫帶氣候。"}, {"stem": "澳洲大分水嶺以西的廣大地區，形成熱帶沙漠氣候的主要原因是下列何者？", "opts": [["A", "面迎東南信風，水氣豐沛"], ["B", "受沿岸涼流與地形雨影響"], ["C", "位於信風背風側，且受副熱帶高壓籠罩"], ["D", "深受西風及暖流交會影響"]], "ans": "C", "exp": "大分水嶺以西位於背風側，且受副熱帶高壓籠罩，形成廣闊的熱帶沙漠氣候區。"}, {"stem": "澳洲西南部冬季迎西風，形成夏乾冬雨的氣候類型，屬於下列何種氣候？", "opts": [["A", "溫帶地中海型氣候"], ["B", "熱帶莽原氣候"], ["C", "溫帶海洋性氣候"], ["D", "熱帶沙漠氣候"]], "ans": "A", "exp": "澳洲西南部冬迎西風，為夏乾冬雨的溫帶地中海型氣候。"}, {"stem": "澳洲北部夏雨冬乾，最可能屬於下列何種氣候類型？", "opts": [["A", "溫帶地中海型氣候"], ["B", "溫帶海洋性氣候"], ["C", "副極地氣候"], ["D", "熱帶莽原氣候"]], "ans": "D", "exp": "澳洲北部為夏雨冬乾的熱帶莽原氣候。"}, {"stem": "澳洲人口最多的都市雪梨，主要座落於下列哪個地形區？", "opts": [["A", "大分水嶺以西的高原"], ["B", "大分水嶺以東的沿海平原"], ["C", "中部平原"], ["D", "西部沙漠邊緣"]], "ans": "B", "exp": "雪梨位於大分水嶺以東的沿海平原，是澳洲人口最多的都市，著名地標為雪梨歌劇院。"}, {"stem": "澳洲南部都市墨爾本因終年受下列何種風向影響，氣候呈現溼潤的特徵？", "opts": [["A", "東南信風"], ["B", "東北季風"], ["C", "西風"], ["D", "焚風"]], "ans": "C", "exp": "墨爾本因終年西風吹拂，呈現溼潤的氣候，與大分水嶺以西的乾燥地區不同。"}, {"stem": "有關澳洲原住民族的敘述，下列何者正確？", "opts": [["A", "澳洲並非南島語族的分布地，原住民早在歐洲人到來之前即已居住於此"], ["B", "澳洲原住民屬於玻里尼西亞的南島語族"], ["C", "澳洲原住民與紐西蘭毛利人使用相同語系"], ["D", "澳洲原住民是19世紀由歐洲移民而來"]], "ans": "A", "exp": "澳洲並非南島語族的分布地，在歐洲人到來之前，即有原住民居住於此，其語言與南島語族不同，以採集和狩獵維生。"}, {"stem": "現代澳洲的人口組成以白人居多，這與下列何者有關？", "opts": [["A", "澳洲原本就是南島語族的發源地"], ["B", "大量玻里尼西亞移民遷入"], ["C", "中國移民長期屯墾"], ["D", "澳洲是由英國移民建立的國家"]], "ans": "D", "exp": "現代的澳洲是由英國移民建立的國家，故人口以白人居多，主要分布於大分水嶺東側及沿海平原。"}, {"stem": "有關澳洲農牧業的敘述，下列何者正確？", "opts": [["A", "農場規模狹小，屬於精耕細作的集約經營"], ["B", "農場規模廣大，多採粗放經營，小麥、羊毛、肉類及乳製品在全球占有重要地位"], ["C", "主要生產可可與咖啡等熱帶栽培作物"], ["D", "完全仰賴灌溉，不適合畜牧發展"]], "ans": "B", "exp": "澳洲農牧業興盛，農場規模廣大，多採粗放的經營型態，生產的小麥、羊毛、肉類及乳製品在全球占有重要地位。"}, {"stem": "澳洲地質古老、礦產豐富，是世界重要的資源出口大國，其中出口量最多的礦產是下列何者？", "opts": [["A", "銅礦"], ["B", "石油"], ["C", "鐵礦"], ["D", "天然氣"]], "ans": "C", "exp": "澳洲地質古老，礦產豐富，是世界重要的資源出口大國，其中又以鐵礦的出口量最多。"}, {"stem": "澳洲因長期與世界各大陸隔絕，演化出許多獨特物種，下列何者不屬於澳洲的特有生物？", "opts": [["A", "長頸鹿"], ["B", "袋鼠"], ["C", "無尾熊"], ["D", "鴨嘴獸"]], "ans": "A", "exp": "澳洲孤懸於海上，長期與世界各大陸隔絕，演化出袋鼠、無尾熊、鴨嘴獸等獨特物種；長頸鹿為非洲的特有生物，不屬於澳洲。"}, {"stem": "澳洲每年開放許多打工度假簽證，吸引世界各地青年到當地工作，主要原因是下列何者？", "opts": [["A", "澳洲人口過度密集，需要疏導人力"], ["B", "澳洲缺乏觀光資源，需要外國人開發"], ["C", "澳洲礦業已全面關閉，需轉型服務業"], ["D", "澳洲幅員廣大而人口總數不多，農牧礦業等高勞力產業缺工"]], "ans": "D", "exp": "澳洲因缺乏勞力，每年開放許多打工度假的簽證，吸引世界各地的青年到當地工作，以補足農、牧、礦等高勞力產業的人力需求。"}, {"stem": "澳洲南部部分地區氣候類似歐洲地中海地區，適合種植釀酒葡萄，此區澳洲葡萄酒產業曾一度位居全球第幾大葡萄酒出產國？", "opts": [["A", "第一大"], ["B", "第六大"], ["C", "第十大"], ["D", "第二十大"]], "ans": "B", "exp": "澳洲部分地區氣候條件類似地中海地區，適合種植釀酒葡萄，葡萄酒產業興盛，曾一度位居全球第六大葡萄酒出產國。"}, {"stem": "有關澳洲「地廣人稀」的敘述，下列何者正確？", "opts": [["A", "澳洲面積小但人口密度高"], ["B", "澳洲是世界人口密度最高的國家之一"], ["C", "澳洲是世界面積第6大的國家，人口密度卻是世界倒數幾名"], ["D", "澳洲人口平均分布於全國各地"]], "ans": "C", "exp": "澳洲是世界上面積第6大的國家，人口總數與臺灣相近，人口密度是世界倒數第3名，人口大多集中在東南沿海的幾個大都市。"}, {"stem": "有關紐西蘭南、北島地形的敘述，下列何  "D", "exp": "居住在不同自然環境下的南島語族，雖然發展出不同的文化形式，但在語言、衣著配飾、建築型態等方面，仍可發現許多相似的地方。"}, {"stem": "根據學者推測，最早一批南島語族約在距今5000年前，從下列何處遷移出去，並輾轉分散至太平洋及印度洋各地？", "opts": [["A", "澳洲"], ["B", "臺灣"], ["C", "紐西蘭"], ["D", "印尼"]], "ans": "B", "exp": "根據學者推測，最早一批南島語族可能在距今約5000年前從臺灣遷移出去，經過長時間輾轉遷徙，最後分散在廣闊的太平洋及印度洋中。"}, {"stem": "紐西蘭毛利人的語言中，「眼睛」發音為「mata」，這項發現最主要能用來佐證下列何者？", "opts": [["A", "毛利人是漢族的後裔"], ["B", "臺灣原住民語言源自英語系統"], ["C", "毛利語與部分臺灣原住民族語言在發音上有相近之處，顯示南島語族的關聯"], ["D", "毛利語與日語同屬一個語系"]], "ans": "C", "exp": "課本讓學生查詢臺灣原住民族語言線上辭典，比對「眼睛（mata）」等詞彙的發音，以驗證毛利語與臺灣原住民語言同屬南島語族的關聯性。"}, {"stem": "紐西蘭毛利人的集會所與花蓮縣光復鄉太巴塱阿美族的祖屋相比，下列敘述何者正確？", "opts": [["A", "兩者建材雖有不同，但斜屋頂、梁柱、門窗配置等形制相似度很高"], ["B", "兩者完全沒有任何相似之處"], ["C", "兩者建材完全相同，皆使用鋼筋水泥"], ["D", "毛利人集會所是模仿荷蘭建築而建"]], "ans": "A", "exp": "紐西蘭毛利人的集會所與太巴塱阿美族的祖屋，除了建材有所不同外，其他形制相似度很高，如斜屋頂及梁柱、門窗配置等。"}, {"stem": "有關太平洋「島鏈」戰略部署的敘述，下列何者正確？", "opts": [["A", "是南島語族為了貿易往來而劃設的傳統航路"], ["B", "由美國於1951年提出，目的在防止本土受攻擊並圍堵蘇聯及中國向外發展"], ["C", "是澳洲為了推廣觀光業所規劃的海上路線"], ["D", "由聯合國為劃分大洋洲三大島群而制定"]], "ans": "B", "exp": "美國於西元1951年提出島鏈概念，為防止美國本土受到攻擊並圍堵當時的蘇聯及中國向外發展，與太平洋上的結盟國家形成三大島鏈。"}, {"stem": "依據太平洋三大島鏈的戰略部署，臺灣位於下列何者？", "opts": [["A", "第二島鏈"], ["B", "第三島鏈"], ["C", "不屬於任何島鏈"], ["D", "第一島鏈"]], "ans": "D", "exp": "臺灣就位在第一島鏈上，具有重要的戰略地位。"}, {"stem": "亞太經濟合作會議（APEC）是由下列哪個國家於1989年提議召開，目的在促進亞太區域經濟成長？", "opts": [["A", "美國"], ["B", "中國"], ["C", "澳洲"], ["D", "日本"]], "ans": "C", "exp": "1989年，澳洲提議召開亞太經濟合作會議（APEC），期望帶動亞太區域經濟成長與發展，目前成員包含美、加、澳、紐、日、韓及臺灣等21國。"}, {"stem": "澳洲、紐西蘭、印度、加拿大、南非等國，因歷史上曾是同一個國家的殖民地，至今仍與該國維繫合作關係，這個國際組織稱為下列何者？", "opts": [["A", "大英國協"], ["B", "亞太經濟合作會議"], ["C", "藍色太平洋伙伴"], ["D", "東南亞國家協會"]], "ans": "A", "exp": "大英國協（Commonwealth of Nations）由英國昔日殖民地組成，第二次世界大戰後殖民地紛紛獨立，但仍與大英國協維繫關係，目前有澳洲、紐西蘭、印度、加拿大、南非等56個會員國。"}, {"stem": "為因應中國積極拉攏太平洋島國、試圖建立軍事據點，美、英、日、澳、紐等5國成立了下列哪個聯盟以強化與本區的合作？", "opts": [["A", "北大西洋公約組織"], ["B", "大英國協"], ["C", "亞太經濟合作會議"], ["D", "藍色太平洋伙伴（PBP）"]], "ans": "D", "exp": "近年來中國不斷強化與太平洋島國的往來，試圖在本區建立軍事據點，美、英、日、澳、紐等5國因此成立「藍色太平洋伙伴（PBP）」聯盟，希望提升與本區的經濟和外交合作，藉此與中國競爭。"}, {"stem": "近年中國積極在太平洋擴展勢力，透過與下列哪一個國家建交等方式，提升與大洋洲國家的關係？", "opts": [["A", "吐瓦魯"], ["B", "索羅門群島"], ["C", "帛琉"], ["D", "東加"]], "ans": "B", "exp": "近年來，中國積極在太平洋上擴展勢力，如透過與索羅門群島建交等方式，提升與大洋洲國家的關係，藉以削弱美、澳、紐等國在本區的影響力。"}, {"stem": "西元2020年起，中國因與澳洲的貿易爭端，開始禁止進口澳洲的煤炭，這場貿易衝突除了煤炭外，還波及下列哪些澳洲商品？", "opts": [["A", "石油與天然氣"], ["B", "稻米與茶葉"], ["C", "大麥、銅、糖、木材、葡萄酒、龍蝦等"], ["D", "汽車與電子產品"]], "ans": "C", "exp": "中國政府從西元2020年開始禁止澳洲煤炭進口，受到中國禁運的澳洲商品不止煤炭一項，還包括大麥、銅、糖、木材、葡萄酒、龍蝦等，反映出國與國之間的貿易衝突，經常是外交戰的延伸。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>段考闖關老師端</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#2b4c7e;--main-2:#3f6aa8;--accent:#f2a541;--accent-2:#e07a2f;--bg:#f6f4ef;--card:#fff;--ink:#23303f;--muted:#6b7686;--line:#e3e0d8;
  --ok:#2e9e6b;--ok-bg:#e3f5ec;--bad:#d9534f;--bad-bg:#fbe7e6;--hi:#fff4d6;--shadow:0 4px 18px rgba(30,45,70,.08)}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.7}
button,input,select{font-family:inherit;font-size:1rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,#1f3a63,#3f6aa8);color:#fff;padding:26px 0}
header h1{margin:0;font-size:1.6rem}
header p{margin:4px 0 0;opacity:.9}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin:20px 0}
h2{font-size:1.3rem;color:var(--main);margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
.btn{border:none;background:var(--main);color:#fff;padding:9px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:#eef1f6;color:var(--main)}
.btn.alt{background:var(--accent);color:#3b2600}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#f3f6fb;border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.8rem;color:var(--main)}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;white-space:nowrap}
.tbl tr.stu{cursor:pointer}
.tbl tr.stu:hover{background:#f7f9fc}
.sc{font-weight:900}
.sc.g{color:var(--ok)}.sc.m{color:var(--accent-2)}.sc.b{color:var(--bad)}
.detail td{background:#fbfaf7}
.att{border-left:4px solid var(--main-2);padding:6px 12px;margin:8px 0;background:#fff;border-radius:8px}
.wq{margin:6px 0 0 0;padding:0;list-style:none}
.wq li{padding:6px 0;border-top:1px dashed var(--line)}
.wq .my{color:var(--bad)}.wq .an{color:var(--ok);font-weight:700}
.rank{counter-reset:r}
.rk{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rk .n{font-size:1.4rem;font-weight:900;color:var(--accent-2);text-align:center}
.rk .who{color:var(--muted)}
.pill{display:inline-block;padding:0 10px;border-radius:99px;background:var(--hi);color:#8a5a00;font-weight:700;margin-right:6px}
.err{color:var(--bad);font-weight:700}
.scroll{overflow-x:auto}
@media(max-width:640px){.tbl .hide-s{display:none}.rk{grid-template-columns:36px 1fr}.rk .cnt{grid-column:2}}
</style>
</head>
<body>
<header><div class="wrap"><h1>📊 國二國文段考闖關｜老師端</h1><p>翰林 國二上 第一次段考：學生交卷的姓名、分數與錯題（開啟即自動讀取）</p></div></header>
<main class="wrap">
  <div class="card"><div class="row"><button class="btn" id="load">🔄 讀取最新成績</button></div>
    <p class="muted" id="msg" style="margin:10px 0 0">讀取中…</p></div>
  <div id="out"></div>
</main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbyr1JovSqvYEXjlLbTVoqhkAHTUbB0gDGz0UY_P30d77D6oJuYYTfxebbTadFZB46iO/exec';
const SUBJECT='chinese8-1';
const CLS='chinese8', KEY='c8-da3835048775';  /* 班級碼與檢視密鑰固定（須與試算表 classes 工作表一致） */
const UNIT={1:'第一課 田園之秋選',2:'第二課 古詩選',3:'第三課 下雨天，真好',4:'語文常識一 詞類',5:'自學一 世說新語選',6:'第十課 畫的哀傷',7:'修辭＋綜合',9:'總測驗'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let ROWS=[];

/* 讀取：先用 fetch（平板、手機較穩），失敗再改用 JSONP；兩種都有逾時，不會一直卡在「讀取中」 */
function jsonp(url,cb){
  const fn='t_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;
  const end=d=>{if(done)return;done=true;try{delete window[fn]}catch(e){}s.remove();cb(d)};
  window[fn]=end;s.onerror=()=>end(null);s.src=url+'&callback='+fn;
  document.body.appendChild(s);setTimeout(()=>end(null),15000);
}
function fetchRows(cls,key,cb){
  const url=`${ENDPOINT}?class=${encodeURIComponent(cls)}&key=${encodeURIComponent(key)}&subject=${SUBJECT}&t=${Date.now()}`;
  const ctl=window.AbortController?new AbortController():null,tm=setTimeout(()=>ctl&&ctl.abort(),15000);
  fetch(url,{cache:'no-store',signal:ctl&&ctl.signal}).then(r=>r.json()).then(d=>{clearTimeout(tm);cb(d)})
    .catch(()=>{clearTimeout(tm);jsonp(url,d=>cb(d||{ok:false,err:'連不上成績資料庫。請確認網路，或換用 Chrome／Safari 開啟後按「讀取最新成績」。'}))});
}
function parse(r){
  const ans=Array.isArray(r.ans)?r.ans:[];
  let meta={};const wrong=[];
  ans.forEach(a=>{
    if(a&&typeof a==='object'){if(a.meta)meta=a;else wrong.push(a);return}
    const t=String(a);
    if(t.startsWith('【交卷】')){const p=t.slice(4).split('｜');meta={unit:p[0],type:p[1]};return}
    const m=t.match(/^✗ 題目：(.*?)｜學生答：(.*?)｜正解：(.*?)(?:｜單元：(.*))?$/);
    if(m)wrong.push({q:m[1],my:m[2],a:m[3],u:m[4]});else wrong.push({q:t,my:'',a:''});
  });
  const code=Math.floor(r.round/10),type=r.round%10;
  return {date:new Date(r.date),name:String(r.name||''),code,type,
    unit:meta.unit||UNIT[code]||('單元'+code),kind:meta.type||(['段考模擬題','快問快答','分類挑戰','配對'][type]||'練習'),
    score:r.score,total:r.total,correct:r.correct,blank:r.blank,wrong};
}
$('#load').onclick=load;
function load(){
  $('#msg').textContent='讀取中…';
  fetchRows(CLS,KEY,d=>{
    if(!d||!d.ok){$('#msg').innerHTML=`<span class="err">❌ ${esc(d&&d.err||'讀取失敗')}</span>${d&&/班級碼|密鑰/.test(d.err||'')?'（試算表 classes 工作表需有一列：chinese8｜c8-da3835048775）':''}`;return}
    ROWS=d.rows.map(parse).sort((a,b)=>b.date-a.date);
    $('#msg').textContent=`✅ 共 ${ROWS.length} 筆交卷紀錄（更新時間 ${new Date().toLocaleTimeString()}）`;
    draw();
  });
}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function scls(s){return s>=85?'g':s>=60?'m':'b'}
function draw(){
  const units=[...new Set(ROWS.map(r=>r.unit))];
  $('#out').innerHTML=`
  <div class="card"><div class="row">
    <span>篩選：</span>
    <select id="fu"><option value="">全部單元</option>${units.map(u=>`<option>${esc(u)}</option>`).join('')}</select>
    <select id="fk"><option value="">全部題型</option><option>段考模擬題</option><option>快問快答</option><option>分類挑戰</option><option>配對</option></select>
    <select id="fd"><option value="">全部日期</option><option value="today">只看今天</option><option value="7">最近 7 天</option></select>
    <button class="btn ghost" id="rf">🔄 重新整理</button><button class="btn alt" id="csv">⬇️ 匯出 CSV</button>
  </div></div>
  <div id="body"></div>`;
  ['#fu','#fk','#fd'].forEach(s=>$(s).onchange=body);
  $('#rf').onclick=load;$('#csv').onclick=csv;
  body();
}
function filtered(){
  const u=$('#fu').value,k=$('#fk').value,dd=$('#fd').value,now=new Date();
  return ROWS.filter(r=>(!u||r.unit===u)&&(!k||r.kind===k)&&(!dd||(dd==='today'?r.date.toDateString()===now.toDateString():(now-r.date)<7*864e5)));
}
function body(){
  const rs=filtered();
  if(!rs.length){$('#body').innerHTML='<div class="card"><p class="muted">目前沒有符合條件的交卷紀錄。</p></div>';return}
  const byStu={};
  rs.forEach(r=>{const k=r.name;(byStu[k]=byStu[k]||{name:r.name,list:[]}).list.push(r)});
  const stus=Object.values(byStu).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  const avg=Math.round(rs.reduce((s,r)=>s+(+r.score||0),0)/rs.length);
  /* 錯題排行：同單元同題目合併 */
  const miss={};
  rs.forEach(r=>r.wrong.forEach(w=>{const unit=w.u?w.u:r.unit,k=unit+'||'+w.q;
    (miss[k]=miss[k]||{unit,q:w.q,a:w.a,who:new Set(),picks:{}}).who.add(r.name);
    miss[k].picks[w.my]=(miss[k].picks[w.my]||0)+1}));
  const rank=Object.values(miss).sort((a,b)=>b.who.size-a.who.size).slice(0,30);
  $('#body').innerHTML=`
  <div class="card"><div class="stats">
    <div class="stat"><b>${stus.length}</b>交卷人數</div><div class="stat"><b>${rs.length}</b>交卷次數</div>
    <div class="stat"><b>${avg}</b>平均分數</div><div class="stat"><b>${rs.filter(r=>r.score<60).length}</b>不及格次數</div></div></div>
  <div class="card"><h2>📋 每次交卷的錯題（最新在上）</h2>
    ${rs.map(r=>`<div class="att"><b style="font-size:1.1rem">${esc(r.name)}</b>　${esc(r.unit)}　<span class="pill">${esc(r.kind)}</span><span class="sc ${scls(r.score)}">${r.score} 分</span>
      <span class="muted">（答對 ${r.correct}/${r.total}${r.blank?`，空白 ${r.blank}`:''}）${fmt(r.date)}</span>
      ${r.wrong.length?`<ol class="wq" style="padding-left:1.4em;list-style:decimal">${r.wrong.map(w=>`<li>${w.u?`<span class="pill">${esc(w.u)}</span>`:''}${esc(w.q)}<br><span class="my">✗ 學生答：${esc(w.my)}</span>　<span class="an">✓ 正解：${esc(w.a)}</span></li>`).join('')}</ol>`:'<p class="muted" style="margin:6px 0 0">🏆 全對</p>'}</div>`).join('')}
  </div>
  <div class="card"><h2>👩‍🎓 學生名單（點一下看每次的錯題）</h2><div class="scroll"><table class="tbl">
    <tr><th>姓名</th><th>次數</th><th>最近一次</th><th>分數</th><th class="hide-s">平均</th></tr>
    ${stus.map((s,i)=>{const last=s.list[0],a=Math.round(s.list.reduce((x,r)=>x+(+r.score||0),0)/s.list.length);
      return `<tr class="stu" data-i="${i}"><td><b>${esc(s.name)}</b></td><td>${s.list.length}</td>
      <td>${esc(last.unit)}<br><span class="muted">${esc(last.kind)}｜${fmt(last.date)}</span></td>
      <td class="sc ${scls(last.score)}">${last.score}</td><td class="hide-s">${a}</td></tr>
      <tr class="detail" id="d${i}" style="display:none"><td colspan="5">${s.list.map(r=>`
        <div class="att"><b>${esc(r.unit)}</b>　<span class="pill">${esc(r.kind)}</span><span class="sc ${scls(r.score)}">${r.score} 分</span>
        <span class="muted">（${r.correct}/${r.total}${r.blank?`，空白 ${r.blank}`:''}）${fmt(r.date)}</span>
        ${r.wrong.length?`<ul class="wq">${r.wrong.map(w=>`<li>${w.u?`<span class="pill">${esc(w.u)}</span>`:''}${esc(w.q)}<br><span class="my">✗ ${esc(w.my)}</span>　<span class="an">✓ ${esc(w.a)}</span></li>`).join('')}</ul>`:'<p class="muted" style="margin:6px 0 0">🏆 全對</p>'}</div>`).join('')}</td></tr>`}).join('')}
  </table></div></div>
  <div class="card"><h2>🎯 最該重講的題目（錯的人最多）</h2>
    ${rank.length?rank.map((m,i)=>{const top=Object.entries(m.picks).sort((a,b)=>b[1]-a[1])[0];
      return `<div class="rk"><div class="n">${i+1}</div><div><span class="pill">${esc(m.unit)}</span>${esc(m.q)}<br>
      <span class="an" style="color:var(--ok);font-weight:700">✓ ${esc(m.a)}</span>　<span class="muted">最多人選：${esc(top[0])}（${top[1]} 人）</span><br>
      <span class="who">答錯：${[...m.who].map(esc).join('、')}</span></div><div class="cnt"><b style="font-size:1.4rem;color:var(--bad)">${m.who.size}</b> 人錯</div></div>`}).join(''):'<p class="muted">目前沒有錯題。</p>'}
  </div>`;
  document.querySelectorAll('tr.stu').forEach(tr=>tr.onclick=()=>{const d=$('#d'+tr.dataset.i);d.style.display=d.style.display==='none'?'':'none'});
}
function csv(){
  const rs=filtered(),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const lines=[['時間','姓名','單元','題型','分數','答對','總題數','空白','錯題（題目｜學生答案｜正解）'].map(q).join(',')];
  rs.forEach(r=>lines.push([r.date.toLocaleString(),r.name,r.unit,r.kind,r.score,r.correct,r.total,r.blank,
    r.wrong.map(w=>`${w.q}｜${w.my}｜${w.a}`).join('\n')].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`段考闖關成績_國二國文.csv`;a.click();
}
load();
</script>
<script>/* PEN */
/* ================= ✏️ 老師手寫（覆蓋整個畫面的畫筆層，支援手指、觸控筆壓力） ================= */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penLayer{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penLayer.on{display:block}
  #penLayer.board{background:#fff}
  #penLayer canvas{position:absolute;inset:0;width:100%;height:100%}
  #penBar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  #penBar.on{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,strokes=[],cur=null;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penLayer"><canvas id="penCv"></canvas></div>
    <div id="penBar">
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase">🧽 橡皮擦</button><button data-a="undo">↩️ 復原</button><button data-a="clear">🗑️ 清除</button>
      <button data-a="board">⬜ 白板</button><button data-a="close">✖ 關閉</button>
    </div>`);
  const L=document.getElementById('penLayer'),cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  function draw(s){if(s.pts.length===1)seg(s,s.pts[0],{...s.pts[0],x:s.pts[0].x+.01});for(let i=1;i<s.pts.length;i++)seg(s,s.pts[i-1],s.pts[i])}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);strokes.forEach(draw);ctx.globalCompositeOperation='source-over'}
  const pt=e=>({x:e.clientX,y:e.clientY,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5});
  L.addEventListener('pointerdown',e=>{e.preventDefault();L.setPointerCapture(e.pointerId);cur={color,size,erase,pts:[pt(e)]};strokes.push(cur);draw(cur)});
  L.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    evs.forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p)});ctx.globalCompositeOperation='source-over'});
  const up=()=>{cur=null};L.addEventListener('pointerup',up);L.addEventListener('pointercancel',up);
  function open(){L.classList.add('on');bar.classList.add('on');document.body.classList.add('pen-on');document.documentElement.style.overflow='hidden';fit()}
  function close(){L.classList.remove('on','board');bar.classList.remove('on');document.body.classList.remove('pen-on');document.documentElement.style.overflow='';
    bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  addEventListener('resize',()=>{if(L.classList.contains('on'))fit()});
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{strokes.pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{strokes=[];redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){this.classList.toggle('on',L.classList.toggle('board'))};
  bar.querySelector('[data-a="close"]').onclick=close;
})();
</script>
<script>/* NOBR */
/* ================= 注音不斷行：把「注音＋聲調」（連同前後「」）包成不換行的一塊 ================= */
(function(){
  const st=document.createElement('style');st.textContent='.zy{white-space:nowrap}';document.head.appendChild(st);
  const SYL='˙?[ㄅ-ㄩ]+[ˊˇˋ˙]?';
  const RE=new RegExp('[「『（(]?'+SYL+'(?:[ 　]'+SYL+')*[」』）)]?[，。、；：！？]?','g');
  const TEST=/[ㄅ-ㄩ]/;
  function wrap(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
      if(!TEST.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
      const p=n.parentNode;if(!p||p.closest&&p.closest('.zy,script,style,textarea,input'))return NodeFilter.FILTER_REJECT;

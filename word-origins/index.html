<!DOCTYPE html>
<html lang="zh-TW">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文來源故事 · 動畫學單字</title>
<style>
:root{--main:#3730a3;--accent:#f0b429;--bg:#eef0fb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1a1a1a;background:var(--bg);line-height:1.7;padding:0 0 60px;font-size:16px}
header{background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;padding:30px 20px 26px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.18)}
header h1{font-size:30px;margin-bottom:8px}
header p{font-size:18px;opacity:.95}
.back{display:inline-block;margin:16px auto 0;color:#3730a3;background:#fff;border:2px solid #cdd3ef;border-radius:20px;padding:6px 16px;font-size:16px;text-decoration:none}
.back:hover{background:#eef0ff}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px}
.intro{background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:22px;box-shadow:0 1px 6px rgba(0,0,0,.07);font-size:16px}
.intro b{color:var(--main)}

.section-title{font-size:20px;font-weight:800;color:#475569;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;border-top:2px solid #d1d9e0}

.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:28px}
.book{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.book:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.13)}
.book-header{padding:20px 18px 14px;color:#fff;background:linear-gradient(135deg,#3730a3,#6366f1)}
.book-header .vol{font-size:16px;font-weight:700;opacity:.85;letter-spacing:.5px;margin-bottom:4px}
.book-header h3{font-size:20px;font-weight:800;line-height:1.3}
.book-header .desc{font-size:16px;opacity:.85;margin-top:4px}
.book-lessons{padding:14px 18px 18px}
.book-lessons a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#1a1a1a;padding:9px 10px;border-radius:8px;transition:background .12s;font-size:16px}
.book-lessons a:hover{background:#f0f2fc}
.book-lessons a .lnum{flex-shrink:0;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:#3730a3}
.book-lessons a .ltitle{flex:1;line-height:1.35}
.book-lessons a .ltitle small{display:block;font-size:16px;color:#889;margin-top:1px}
.book-lessons a .arr{color:#b0b8c1;font-size:16px;flex-shrink:0}

footer{text-align:center;color:#789;font-size:16px;margin-top:30px}
@media(max-width:600px){.books{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🌌 英文來源故事</h1>
  <p>teaching.efetl.com / 英文來源故事</p>
  <a class="back" href="../">← 回主選單</a>
</header>
<div class="wrap">
  <div class="intro">用<b>神話與字源動畫</b>認識英文單字背後的故事——點翻卡看由來、玩配對遊戲加深記憶，比死背更容易記住。</div>

  <div class="section-title">🗓️ 星期與時間 — 動畫學單字</div>

  <div class="books">

    <!-- 一週的英文由來 -->
    <div class="book">
      <div class="book-header">
        <div class="vol">星期由來</div>
        <h3>一週的英文由來</h3>
        <div class="desc">Sunday–Saturday 動畫 ‧ 翻卡看神話 ‧ 配對遊戲</div>
      </div>
      <div class="book-lessons">
        <a href="days-of-the-week.html">
          <span class="lnum">7</span>
          <span class="ltitle">七天的秘密：英文星期由來<small>太陽、月亮、北歐神話如何變成 Sunday–Saturday ‧ 含記憶口訣與配對測驗</small></span>
          <span class="arr">▶</span>
        </a>
      </div>
    </div>

  </div>

  <footer>英文來源故事 ‧ teaching.efetl.com</footer>
</div>
</body>
</html>

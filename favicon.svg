<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景圓 -->
  <circle cx="32" cy="32" r="32" fill="#1f56e0"/>
  <!-- 書本（下方兩頁） -->
  <rect x="14" y="30" width="16" height="18" rx="2" fill="#fff" opacity="0.95"/>
  <rect x="34" y="30" width="16" height="18" rx="2" fill="#fff" opacity="0.85"/>
  <!-- 書脊 -->
  <rect x="30" y="30" width="4" height="18" fill="#ffce2e"/>
  <!-- 畢業帽帽頂 -->
  <polygon points="32,12 52,22 32,32 12,22" fill="#ffce2e"/>
  <!-- 帽頂中心 -->
  <circle cx="32" cy="22" r="3" fill="#1f56e0"/>
  <!-- 流蘇 -->
  <line x1="48" y1="22" x2="50" y2="30" stroke="#ffce2e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="31" r="2" fill="#ffce2e"/>

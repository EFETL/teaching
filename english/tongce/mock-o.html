<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}
</style>

  <div class="sticky">

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nFor most of human history, people exchanged goods directly through barter, trading items they had for things they needed. This system worked reasonably well in small communities, but it became increasingly difficult <span class=\"blk\">21</span> the variety of goods and services in a society grew, since not every trade involved two people who each wanted what the other had. Coins, <span class=\"blk\">22</span> were first minted in ancient Lydia around the seventh century BC, offered a solution by providing a standard unit of value that could be exchanged for almost anything. Over the following centuries, coins <span class=\"blk\">23</span> widely used across much of the ancient world, eventually being replaced in many places by paper money, which was lighter and easier to transport in large amounts. Today, electronic payments, <span class=\"blk\">24</span> people to make transactions without any physical money at all, have become increasingly common in many countries.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nIn the past decade, an increasing number of companies have allowed employees to work remotely, either part of the time or full time. Supporters argue that remote work can improve employees' quality of life <span class=\"blk\">25</span> reducing the time and money spent commuting. Critics, however, point out that remote work can make it harder for new employees to build relationships with colleagues, <span class=\"blk\">26</span> can be especially important during the early stages of a career. Some companies have responded by adopting a hybrid model, <span class=\"blk\">27</span> employees come into the office on certain days and work from home on others. Whether this balance proves sustainable in the long run <span class=\"blk\">28</span> still being studied by researchers.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice: Library Renovation</b><br><br>The main library will be closed for renovation from July 1 to July 15. During this time, books may be returned using the drop box located at the side entrance. Study rooms will not be available, but the campus computer lab will remain open for students who need a place to study.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Sam: Did you find your umbrella? You left it at my place last night. Jess: Oh no, I've been looking everywhere for it! Can I stop by later to grab it? Sam: Sure, I'll be home after 6. Jess: Perfect, see you then.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nIn recent years, a growing number of people have begun taking deliberate breaks from smartphones and other digital devices, a practice often referred to as a \"digital detox.\" Some choose to do this for a few hours each evening, while others set aside an entire weekend or even a week. Supporters of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations with friends and family. However, researchers note that the benefits of a digital detox may not last long after a person returns to their normal routine, since the habits and environments that led to heavy device use in the first place generally remain unchanged. For this reason, some experts suggest that instead of taking occasional breaks, people may benefit more from making small, lasting changes to how they use technology day to day, such as turning off non-essential notifications or keeping phones out of the bedroom.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nResearch suggests that people's natural sleep and wake preferences, often described as being a \"morning person\" or a \"night owl,\" are influenced significantly by genetics rather than simply being a matter of habit or willpower. Scientists have identified specific genes that affect the body's internal clock, helping to explain why some people naturally feel most alert early in the day while others do their best work late at night. This natural tendency, known as a person's chronotype, can shift over the course of a lifetime; many people who were night owls in their teenage years gradually become more like morning people as they get older. Researchers note that problems can arise when a person's chronotype does not match the schedule required by school or work, potentially leading to chronic sleep deprivation. As a result, some schools and workplaces have begun experimenting with more flexible start times to better accommodate different chronotypes.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nMaya noticed that many of her neighbors threw away household items, such as toasters and lamps, as soon as they stopped working, even when the problem was something simple that could be fixed. She decided to organize a \"repair café\" at the community center, where volunteers with basic repair skills would help people fix their broken items for free instead of throwing them away. At the first event, only a handful of people showed up, and Maya worried that no one was interested. However, word slowly spread through the neighborhood, and by the third event, the line of people waiting with broken items stretched out the door. Maya began keeping a record of which items were successfully repaired and which were too damaged to fix, and she used this information to figure out which tools and supplies the volunteers needed most. Eventually, several local hardware stores heard about the repair café and began donating spare parts and tools. Maya now holds the repair café once a month and is training a few regular volunteers to help her organize future events.</div>"};
const PTR = {"21": [{"en": "For most of human history, people exchanged goods directly through barter, trading items they had for things they needed.", "zh": "在人類歷史的大部分時間裡，人們直接以物易物來交換貨品，用自己擁有的東西換取所需的物品。", "sa": "【S】people 【V】exchanged 【O】goods 【M】through barter<br>📌 句型：分詞構句 trading...，補充說明交換的方式；trade A for B（以 A 換 B）。"}, {"en": "This system worked reasonably well in small communities, but it became increasingly difficult <b>as<\/b> the variety of goods and services in a society grew, since not every trade involved two people who each wanted what the other had.", "zh": "這種制度在小型社群中運作得還算不錯，但隨著社會中商品與服務的種類增加，它變得越來越困難，因為並非每筆交易都剛好涉及兩個各自想要對方東西的人。", "sa": "【S】it 【V】became 【C】increasingly difficult 【M】as 子句（隨著）、since 子句（原因）<br>📌 句型：as + S + V 表「隨著……」，常與比較變化（increasingly）搭配；what the other had 為名詞子句。"}, {"en": "Coins, <b>which<\/b> were first minted in ancient Lydia around the seventh century BC, offered a solution by providing a standard unit of value that could be exchanged for almost anything.", "zh": "硬幣大約在西元前七世紀於古代呂底亞首次被鑄造，它提供了一種解決方式：提供一個幾乎可以交換任何東西的標準價值單位。", "sa": "【S】Coins 【V】offered 【O】a solution 【M】by providing...<br>📌 句型：非限定關係子句 , which were first minted...,（補充說明 coins）；by + V-ing 表「藉由……」。"}, {"en": "Over the following centuries, coins <b>became<\/b> widely used across much of the ancient world, eventually being replaced in many places by paper money, which was lighter and easier to transport in large amounts.", "zh": "在接下來的幾個世紀裡，硬幣在古代世界的大部分地區被廣泛使用，最後在許多地方被紙幣取代，因為紙幣更輕，也更容易大量運送。", "sa": "【S】coins 【V】became 【C】widely used<br>📌 句型：被動分詞構句 being replaced by...（表結果）；which 引導非限定子句修飾 paper money；easier to + V。"}, {"en": "Today, electronic payments, <b>allowing<\/b> people to make transactions without any physical money at all, have become increasingly common in many countries.", "zh": "如今，電子支付讓人們完全不需要實體貨幣就能進行交易，在許多國家已變得越來越普遍。", "sa": "【S】electronic payments 【V】have become 【C】increasingly common<br>📌 句型：插入的分詞片語 allowing people to V（＝which allow...）；allow + O + to V（允許某人做某事）。"}], "25": [{"en": "In the past decade, an increasing number of companies have allowed employees to work remotely, either part of the time or full time.", "zh": "在過去十年中，越來越多公司允許員工遠端工作，不論是部分時間或全職。", "sa": "【S】an increasing number of companies 【V】have allowed 【O】employees 【C】to work remotely<br>📌 句型：an increasing number of + 複數名詞 + 複數動詞；allow + O + to V；either A or B。"}, {"en": "Supporters argue that remote work can improve employees' quality of life <b>by<\/b> reducing the time and money spent commuting.", "zh": "支持者認為，遠端工作能藉由減少花在通勤上的時間與金錢，來提升員工的生活品質。", "sa": "【S】Supporters 【V】argue 【O】that 子句（remote work can improve...）<br>📌 句型：by + V-ing 表方法；spend time/money (in) V-ing → the time and money spent commuting（過去分詞修飾）。"}, {"en": "Critics, however, point out that remote work can make it harder for new employees to build relationships with colleagues, <b>which<\/b> can be especially important during the early stages of a career.", "zh": "然而，批評者指出，遠端工作可能讓新進員工更難與同事建立關係，而這在職涯初期可能格外重要。", "sa": "【S】Critics 【V】point out 【O】that 子句<br>📌 句型：make it + adj. + for 人 + to V（虛受詞 it）；, which 引導非限定子句，補充說明前面的內容（與同事建立關係）。"}, {"en": "Some companies have responded by adopting a hybrid model, <b>where<\/b> employees come into the office on certain days and work from home on others.", "zh": "有些公司的因應方式是採用混合模式，也就是員工某幾天進辦公室、其他天在家工作。", "sa": "【S】Some companies 【V】have responded 【M】by adopting a hybrid model<br>📌 句型：關係副詞 where（＝in which）引導完整子句修飾 model；on certain days ... on others（others＝other days）。"}, {"en": "Whether this balance proves sustainable in the long run <b>is<\/b> still being studied by researchers.", "zh": "這種平衡長期來看是否能持續，研究人員仍在研究中。", "sa": "【S】Whether this balance proves sustainable in the long run 【V】is still being studied 【M】by researchers<br>📌 句型：Whether 名詞子句當主詞，視為單數；現在進行式被動 is being + p.p.。"}], "29": [{"en": "Notice: Library Renovation", "zh": "公告：圖書館整修", "sa": "標題，名詞片語，省略主詞動詞。"}, {"en": "The main library will be closed for renovation from July 1 to July 15.", "zh": "總圖書館將於 7 月 1 日至 7 月 15 日因整修而關閉。", "sa": "【S】The main library 【V】will be closed 【M】for renovation、from...to...<br>📌 句型：未來式被動 will be + p.p.；for + 名詞 表原因／目的。"}, {"en": "During this time, books may be returned using the drop box located at the side entrance.", "zh": "在此期間，可以使用位於側門的還書箱歸還書籍。", "sa": "【S】books 【V】may be returned 【M】using the drop box...<br>📌 句型：助動詞被動 may be + p.p.；located at... 為過去分詞片語修飾 the drop box。"}, {"en": "Study rooms will not be available, but the campus computer lab will remain open for students who need a place to study.", "zh": "自習室將不開放，但校園電腦教室會持續開放，供需要讀書地點的學生使用。", "sa": "【S】Study rooms 【V】will not be 【C】available ／【S】the campus computer lab 【V】will remain 【C】open<br>📌 句型：remain + adj.（保持……）；who need... 關係子句修飾 students。"}], "31": [{"en": "Text Messages", "zh": "簡訊", "sa": "標題，名詞片語。"}, {"en": "Sam: Did you find your umbrella? You left it at my place last night.", "zh": "Sam：你找到你的雨傘了嗎？你昨晚把它留在我家了。", "sa": "【S】You 【V】left 【O】it 【M】at my place last night<br>📌 句型：leave + 物 + 地點（把東西遺留在某處）；my place＝我家（口語）。"}, {"en": "Jess: Oh no, I've been looking everywhere for it! Can I stop by later to grab it?", "zh": "Jess：噢不，我一直到處在找它！我晚點可以順道過去拿嗎？", "sa": "【S】I 【V】have been looking for 【O】it 【M】everywhere<br>📌 句型：現在完成進行式表持續到現在的動作；stop by（順道拜訪）＋ to V 表目的。"}, {"en": "Sam: Sure, I'll be home after 6.", "zh": "Sam：當然，我 6 點以後會在家。", "sa": "【S】I 【V】will be 【C】home 【M】after 6<br>📌 句型：be home（在家），home 作副詞，不加 at。"}, {"en": "Jess: Perfect, see you then.", "zh": "Jess：太好了，到時見。", "sa": "口語省略句：(That's) perfect；(I'll) see you then。"}], "33": [{"en": "In recent years, a growing number of people have begun taking deliberate breaks from smartphones and other digital devices, a practice often referred to as a \"digital detox.\"", "zh": "近年來，越來越多人開始刻意暫停使用智慧型手機和其他數位裝置，這種做法常被稱為「數位排毒」。", "sa": "【S】a growing number of people 【V】have begun 【O】taking deliberate breaks<br>📌 句型：同位語 a practice (which is) often referred to as...；refer to A as B（把 A 稱為 B）。"}, {"en": "Some choose to do this for a few hours each evening, while others set aside an entire weekend or even a week.", "zh": "有些人選擇每天晚上做幾個小時，而另一些人則撥出整個週末，甚至一整週。", "sa": "【S】Some 【V】choose 【O】to do this ／【S】others 【V】set aside 【O】an entire weekend<br>📌 句型：Some..., while others...（有些……，而另一些……）；set aside（撥出、保留）。"}, {"en": "Supporters of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations with friends and family.", "zh": "數位排毒的支持者表示，他們感覺比較不焦慮、睡得更好，與親友交談時也更專注投入。", "sa": "【S】Supporters of digital detoxes 【V】report 【O】feeling..., sleeping..., and being...<br>📌 句型：report + V-ing；三個動名詞平行結構。"}, {"en": "However, researchers note that the benefits of a digital detox may not last long after a person returns to their normal routine, since the habits and environments that led to heavy device use in the first place generally remain unchanged.", "zh": "不過，研究人員指出，一個人回到日常作息後，數位排毒的好處可能不會持續太久，因為當初導致大量使用裝置的習慣和環境，通常都沒有改變。", "sa": "【S】researchers 【V】note 【O】that 子句（the benefits... may not last long）<br>📌 句型：since 引導原因子句；that led to... 關係子句修飾 the habits and environments；remain + adj.（unchanged）。"}, {"en": "For this reason, some experts suggest that instead of taking occasional breaks, people may benefit more from making small, lasting changes to how they use technology day to day, such as turning off non-essential notifications or keeping phones out of the bedroom.", "zh": "因此，有些專家建議，與其偶爾休息一下，人們若能對日常使用科技的方式做出小而持久的改變，可能會受益更多，例如關閉不必要的通知，或不把手機帶進臥室。", "sa": "【S】some experts 【V】suggest 【O】that 子句（people may benefit more from...）<br>📌 句型：instead of + V-ing（而不是……）；benefit from + V-ing；how they use... 為名詞子句當介系詞 to 的受詞。"}], "36": [{"en": "Research suggests that people's natural sleep and wake preferences, often described as being a \"morning person\" or a \"night owl,\" are influenced significantly by genetics rather than simply being a matter of habit or willpower.", "zh": "研究顯示，人們天生的睡眠與起床偏好，也就是常說的「晨型人」或「夜貓子」，在很大程度上受基因影響，而不只是習慣或意志力的問題。", "sa": "【S】Research 【V】suggests 【O】that 子句（preferences ... are influenced by genetics）<br>📌 句型：插入的分詞片語 often described as...；A rather than B（是 A 而非 B）；被動 are influenced by。"}, {"en": "Scientists have identified specific genes that affect the body's internal clock, helping to explain why some people naturally feel most alert early in the day while others do their best work late at night.", "zh": "科學家已找出會影響人體生理時鐘的特定基因，這有助於解釋為什麼有些人天生在一大早最清醒，而另一些人則在深夜表現最好。", "sa": "【S】Scientists 【V】have identified 【O】specific genes 【M】that affect...<br>📌 句型：分詞構句 helping to explain...（表結果）；why 引導名詞子句；some..., while others...。"}, {"en": "This natural tendency, known as a person's chronotype, can shift over the course of a lifetime; many people who were night owls in their teenage years gradually become more like morning people as they get older.", "zh": "這種天生的傾向稱為一個人的「時型」，它可能在一生中改變；許多青少年時期是夜貓子的人，隨著年紀增長會逐漸變得比較像晨型人。", "sa": "【S】This natural tendency 【V】can shift ／【S】many people 【V】become 【C】more like morning people<br>📌 句型：known as...（被稱為）過去分詞片語；who were... 修飾 people；as + S + V（隨著……）。"}, {"en": "Researchers note that problems can arise when a person's chronotype does not match the schedule required by school or work, potentially leading to chronic sleep deprivation.", "zh": "研究人員指出，當一個人的時型與學校或工作要求的作息不符時，就可能產生問題，進而可能導致長期睡眠不足。", "sa": "【S】Researchers 【V】note 【O】that 子句（problems can arise when...）<br>📌 句型：required by... 過去分詞修飾 schedule；分詞構句 leading to...（表結果）。"}, {"en": "As a result, some schools and workplaces have begun experimenting with more flexible start times to better accommodate different chronotypes.", "zh": "因此，有些學校和職場已開始嘗試採用更彈性的開始時間，以更能配合不同的時型。", "sa": "【S】some schools and workplaces 【V】have begun 【O】experimenting with...<br>📌 句型：experiment with（試驗、嘗試）；to + V 表目的。"}], "39": [{"en": "Maya noticed that many of her neighbors threw away household items, such as toasters and lamps, as soon as they stopped working, even when the problem was something simple that could be fixed.", "zh": "Maya 注意到，她的許多鄰居在烤麵包機、檯燈等家用品一壞掉就把它們丟掉，即使問題只是可以修好的小毛病。", "sa": "【S】Maya 【V】noticed 【O】that 子句（many of her neighbors threw away household items）<br>📌 句型：as soon as（一……就）；stop + V-ing（停止做）；even when（即使在……時）。"}, {"en": "She decided to organize a \"repair café\" at the community center, where volunteers with basic repair skills would help people fix their broken items for free instead of throwing them away.", "zh": "她決定在社區中心舉辦「修理咖啡館」，讓具備基本修理技能的志工免費幫大家修理壞掉的物品，而不是把它們丟掉。", "sa": "【S】She 【V】decided 【O】to organize a \"repair café\"<br>📌 句型：關係副詞 where 修飾 the community center；help + O + V（原形）；instead of + V-ing。"}, {"en": "At the first event, only a handful of people showed up, and Maya worried that no one was interested.", "zh": "第一次活動時只有少數幾個人出現，Maya 擔心沒有人有興趣。", "sa": "【S】only a handful of people 【V】showed up ／【S】Maya 【V】worried 【O】that 子句<br>📌 句型：a handful of（少數的）；show up（出現）。"}, {"en": "However, word slowly spread through the neighborhood, and by the third event, the line of people waiting with broken items stretched out the door.", "zh": "然而，消息慢慢在社區傳開，到了第三次活動，帶著壞掉物品排隊等候的人龍已經排到門外。", "sa": "【S】word 【V】spread ／【S】the line of people 【V】stretched 【M】out the door<br>📌 句型：word spreads（消息傳開，word 不加冠詞）；waiting with... 現在分詞修飾 people。"}, {"en": "Maya began keeping a record of which items were successfully repaired and which were too damaged to fix, and she used this information to figure out which tools and supplies the volunteers needed most.", "zh": "Maya 開始記錄哪些物品成功修好、哪些損壞太嚴重無法修理，並利用這些資訊找出志工最需要哪些工具和材料。", "sa": "【S】Maya 【V】began 【O】keeping a record of...／【S】she 【V】used 【O】this information<br>📌 句型：too + adj. + to V（太……而無法）；which 引導的名詞子句當受詞；figure out（弄清楚）。"}, {"en": "Eventually, several local hardware stores heard about the repair café and began donating spare parts and tools.", "zh": "最後，幾家當地的五金行聽說了這間修理咖啡館，並開始捐贈備用零件和工具。", "sa": "【S】several local hardware stores 【V】heard about... and began 【O】donating spare parts and tools<br>📌 句型：hear about（聽說）；begin + V-ing。"}, {"en": "Maya now holds the repair café once a month and is training a few regular volunteers to help her organize future events.", "zh": "Maya 現在每個月舉辦一次修理咖啡館，並正在培訓幾位固定的志工，幫助她籌辦未來的活動。", "sa": "【S】Maya 【V】holds 【O】the repair café ／ is training 【O】a few regular volunteers<br>📌 句型：train + O + to V；help + O + V（原形）。"}]};
const Q = [{"n": 1, "p": 0, "stem": "The factory will _____ production next month to meet rising demand.", "o": ["include", "involve", "increase", "invade"], "a": 2, "exp": "(C) increase（增加）✓ 工廠下個月將「增加」產量以應付日益增長的需求，\"increase production\" 為常見搭配。\n❌ (A) include = 包含，文意不通。\n❌ (B) involve = 涉及，文意不通。\n❌ (D) invade = 入侵，文意不通。", "zh": "工廠下個月將<b>增加<\/b>產量，以因應不斷上升的需求。", "sa": "【S】The factory 【V】will increase 【O】production 【M】next month、to meet rising demand<br>📌 句型：to + V 表目的；increase production（增加產量）為常見搭配。"}, {"n": 2, "p": 0, "stem": "The hikers got _____ in the fog and had to call for help.", "o": ["last", "list", "lust", "lost"], "a": 3, "exp": "(D) lost（迷路）✓ \"get lost\" 為固定用法，意為「迷路」，登山者在霧中「迷路」而必須求助。\n❌ (A) last = 最後的，文意不通。\n❌ (B) list = 清單，文意不通。\n❌ (C) lust = 渴望，文意不通。", "zh": "登山客在霧中<b>迷路<\/b>，不得不打電話求救。", "sa": "【S】The hikers 【V】got 【C】lost ／ had to call for help<br>📌 句型：get lost（迷路），get + p.p. 表狀態改變；call for help（求救）。"}, {"n": 3, "p": 0, "stem": "The committee decided to _____ the meeting until next week due to scheduling conflicts.", "o": ["propose", "postpone", "pursue", "protect"], "a": 1, "exp": "(B) postpone（延期）✓ 因排程衝突，委員會決定將會議「延期」至下週，\"postpone...until\" 為常見搭配。\n❌ (A) propose = 提議，文意不通。\n❌ (C) pursue = 追求，文意不通。\n❌ (D) protect = 保護，文意不通。", "zh": "由於時間安排有衝突，委員會決定將會議<b>延期<\/b>到下週。", "sa": "【S】The committee 【V】decided 【O】to postpone the meeting 【M】until next week、due to...<br>📌 句型：decide + to V；postpone + N + until...；due to + 名詞（由於）。"}, {"n": 4, "p": 0, "stem": "The new bridge will significantly _____ travel time between the two cities.", "o": ["produce", "induce", "deduce", "reduce"], "a": 3, "exp": "(D) reduce（減少）✓ 新橋將大幅「減少」兩城市間的交通時間，\"reduce travel time\" 為常見搭配。\n❌ (A) produce = 生產，文意不通。\n❌ (B) induce = 誘發，文意不通。\n❌ (C) deduce = 推論，文意不通。", "zh": "這座新橋將大幅<b>縮短<\/b>兩座城市之間的交通時間。", "sa": "【S】The new bridge 【V】will reduce 【O】travel time 【M】significantly、between the two cities<br>📌 句型：reduce travel time（減少交通時間）；between A and B。"}, {"n": 5, "p": 0, "stem": "The chef carefully _____ the ingredients before adding them to the pot.", "o": ["managed", "measured", "mentioned", "memorized"], "a": 1, "exp": "(B) measured（量測）✓ 主廚在將食材加入鍋中前先仔細「量測」食材分量，\"measure ingredients\" 為常見搭配。\n❌ (A) managed = 管理，文意不通。\n❌ (C) mentioned = 提及，文意不通。\n❌ (D) memorized = 記憶，文意不通。", "zh": "主廚把食材放進鍋子之前，先仔細<b>量<\/b>好分量。", "sa": "【S】The chef 【V】measured 【O】the ingredients 【M】carefully、before adding...<br>📌 句型：before + V-ing（主詞相同時可用介系詞＋動名詞）。"}, {"n": 6, "p": 0, "stem": "Despite the rain, the outdoor concert _____ as scheduled.", "o": ["prevented", "provided", "proceeded", "preceded"], "a": 2, "exp": "(C) proceeded（照常進行）✓ 儘管下雨，戶外音樂會仍「照常進行」，\"proceed as scheduled\" 為常見搭配。\n❌ (A) prevented = 阻止，文意不通。\n❌ (B) provided = 提供，文意不通。\n❌ (D) preceded = 在……之前發生，文意不通。", "zh": "儘管下雨，戶外音樂會仍按照原定時間<b>進行<\/b>。", "sa": "【S】the outdoor concert 【V】proceeded 【M】despite the rain、as scheduled<br>📌 句型：despite + 名詞（儘管）；as scheduled（按照預定）＝as (it was) scheduled。"}, {"n": 7, "p": 0, "stem": "The new employee quickly _____ to the fast-paced environment of the startup.", "o": ["adopted", "edited", "admitted", "adapted"], "a": 3, "exp": "(D) adapted（適應）✓ \"adapt to\" 表「適應於」，新進員工很快「適應」了這家新創公司快節奏的工作環境。\n❌ (A) adopted = 採用、收養，\"adopt to\" 不是常見搭配。\n❌ (B) edited = 編輯，文意不通。\n❌ (C) admitted = 承認，文意不通。", "zh": "這位新員工很快就<b>適應<\/b>了新創公司快節奏的環境。", "sa": "【S】The new employee 【V】adapted 【M】quickly、to the fast-paced environment...<br>📌 句型：adapt to + N（適應）；比較 adopt（採用、收養）。"}, {"n": 8, "p": 0, "stem": "The professor's lecture was so _____ that several students fell asleep.", "o": ["fascinating", "tedious", "brilliant", "inspiring"], "a": 1, "exp": "(B) tedious（冗長乏味的）✓ 教授的課如此「冗長乏味」，以致有幾位學生睡著了，前後文意呼應。\n❌ (A) fascinating = 迷人的，與「學生睡著」矛盾。\n❌ (C) brilliant = 出色的，與「學生睡著」矛盾。\n❌ (D) inspiring = 激勵人心的，與「學生睡著」矛盾。", "zh": "教授的課太<b>冗長乏味<\/b>了，以致有幾個學生睡著了。", "sa": "【S】The professor's lecture 【V】was 【C】so tedious 【M】that several students fell asleep<br>📌 句型：so + adj. + that + 子句（如此……以致於）；fall asleep（睡著）。"}, {"n": 9, "p": 0, "stem": "The committee's decision was <i>unanimous<\/i>, with every member voting the same way.", "o": ["divided", "split", "unified", "delayed"], "a": 2, "exp": "(C) unified（一致的、統一的）✓ *unanimous* 意為「一致同意的」，與 unified（意見一致的）意思相近，每位成員的投票結果相同。\n❌ (A) divided = 分裂的，意思相反。\n❌ (B) split = 分裂的，意思相反。\n❌ (D) delayed = 延遲的，語意不符。", "zh": "委員會的決定是<u>全體一致<\/u>的，每位成員的投票都相同。（unanimous ≒ <b>unified<\/b>）", "sa": "【S】The committee's decision 【V】was 【C】unanimous 【M】with every member voting the same way<br>📌 句型：with + O + V-ing（獨立分詞片語，表伴隨狀況）。"}, {"n": 10, "p": 0, "stem": "The athlete <i>recovered<\/i> quickly from the injury and returned to training within weeks.", "o": ["healed", "worsened", "suffered", "avoided"], "a": 0, "exp": "(A) healed（痊癒）✓ *recovered* 意為「康復、恢復」，與 healed（痊癒）同義，這位選手很快「痊癒」並在數週內重返訓練。\n❌ (B) worsened = 惡化，意思相反。\n❌ (C) suffered = 受苦，語意不符。\n❌ (D) avoided = 避免，語意不符。", "zh": "這位運動員很快就從傷勢中<u>康復<\/u>，並在幾週內重返訓練。（recovered ≒ <b>healed<\/b>）", "sa": "【S】The athlete 【V】recovered ... and returned 【M】quickly from the injury、to training within weeks<br>📌 句型：recover from（從……復原）；兩個動詞以 and 對等連接。"}, {"n": 11, "p": 1, "stem": "Customer: I'd like to renew this library book.<br>Librarian: _____<br>Customer: Oh, I didn't realize. I'll return it by then.", "o": ["I'm sorry, this book has already been renewed twice and can't be renewed again.", "We don't lend books here.", "The library is closed today.", "You can keep it as long as you like."], "a": 0, "exp": "(A) I'm sorry, this book has already been renewed twice and can't be renewed again. ✓ 館員告知此書已續借兩次無法再續借，顧客回應「我不知道，那我會在期限前還書」，文意連貫。\n❌ (B) 「我們這裡不借書」與顧客的續借請求矛盾。\n❌ (C) 「圖書館今天休館」與顧客接著回應的內容不連貫。\n❌ (D) 「你可以一直保留這本書」與顧客回應「我會準時還書」矛盾。", "zh": "顧客：我想續借這本圖書館的書。<br>館員：<b>很抱歉，這本書已經續借過兩次，無法再續借了。<\/b><br>顧客：喔，我不知道。我會在期限前還書。", "sa": "正解句：【S】this book 【V】has already been renewed 【M】twice<br>📌 句型：現在完成式被動 has been + p.p.；can't be renewed（助動詞被動）。<br>關鍵句：I'll return it by then.（by then＝在那之前），呼應「不能再續借」。"}, {"n": 12, "p": 1, "stem": "Customer: Do you sell paint rollers?<br>Clerk: _____<br>Customer: Great, I'll take two of those, please.", "o": ["We don't sell painting supplies.", "Yes, they're on aisle five, in three different sizes.", "Paint rollers are out of stock indefinitely.", "You'll need to order those online."], "a": 1, "exp": "(B) Yes, they're on aisle five, in three different sizes. ✓ 店員確認有販售並說明位置與尺寸，顧客回應「太好了，我要兩個」，文意連貫。\n❌ (A) 「我們不賣油漆用品」與顧客接著購買的動作矛盾。\n❌ (C) 「滾筒刷無限期缺貨」與顧客能購買矛盾。\n❌ (D) 「你需要線上訂購」與顧客當場購買的回應矛盾。", "zh": "顧客：你們有賣油漆滾筒刷嗎？<br>店員：<b>有的，在第五走道，有三種不同尺寸。<\/b><br>顧客：太好了，請給我兩個。", "sa": "正解句：【S】they 【V】are 【M】on aisle five, in three different sizes<br>📌 句型：Yes 直接回應 Do you...? 的 Yes/No 問句。<br>關鍵句：I'll take two of those.（take＝買下），表示店裡有賣。"}, {"n": 13, "p": 1, "stem": "Patient: Could I get a refill on my prescription?<br>Receptionist: _____<br>Patient: Sure, I can come by this afternoon.", "o": ["We don't handle prescriptions here.", "Your prescription has expired and needs a new appointment.", "I'll need to check with the doctor first, but it shouldn't take long.", "The pharmacy is closed permanently."], "a": 2, "exp": "(C) I'll need to check with the doctor first, but it shouldn't take long. ✓ 接待員表示需先和醫生確認，但不會花太久時間，病人回應「好，我下午可以過來」，文意連貫。\n❌ (A) 「我們這裡不處理處方」與病人詢問處方補充的情境矛盾。\n❌ (B) 「你的處方已過期，需要重新看診」與病人回應「下午過來」（暗示可直接領藥）不連貫。\n❌ (D) 「藥局永久歇業」與病人能於下午前來矛盾。", "zh": "病人：我可以續領處方藥嗎？<br>接待員：<b>我得先跟醫生確認，不過應該不會太久。<\/b><br>病人：好的，我今天下午可以過來。", "sa": "正解句：【S】I 【V】will need 【O】to check with the doctor ／【S】it 【V】shouldn't take 【O】long<br>📌 句型：check with + 人（向某人確認）；it takes + 時間。<br>關鍵句：come by（順道過來）。"}, {"n": 14, "p": 1, "stem": "Customer: Does this dish contain any nuts? I have an allergy.<br>Server: _____<br>Customer: Thanks, I appreciate you checking.", "o": ["I'm not sure, but let me ask the kitchen to be safe.", "Everything on our menu contains nuts.", "We don't take allergies seriously here.", "You should ask another restaurant."], "a": 0, "exp": "(A) I'm not sure, but let me ask the kitchen to be safe. ✓ 服務生表示不確定，但會去廚房確認以求安全，顧客回應「謝謝你幫我確認」，文意連貫。\n❌ (B) 「我們菜單上所有餐點都含堅果」未回應顧客「謝謝你確認」的反應。\n❌ (C) 「我們不重視過敏問題」與顧客「感謝確認」的正面回應矛盾。\n❌ (D) 「你應該去別的餐廳」與顧客感謝的回應不連貫。", "zh": "顧客：這道菜有含任何堅果嗎？我會過敏。<br>服務生：<b>我不確定，但為了安全起見，我去問一下廚房。<\/b><br>顧客：謝謝，感謝你幫我確認。", "sa": "正解句：let me ask the kitchen 【M】to be safe<br>📌 句型：let + O + V（原形）；to be safe（為了安全起見）。<br>關鍵句：I appreciate you checking.（appreciate + 人 + V-ing）。"}, {"n": 15, "p": 1, "stem": "Coworker A: The printer on the third floor isn't working again.<br>Coworker B: _____<br>Coworker A: Thanks, I'll let everyone know.", "o": ["That printer was removed last month.", "I'll put in a request to have it fixed today.", "We don't have a printer on this floor.", "You should buy a new printer yourself."], "a": 1, "exp": "(B) I'll put in a request to have it fixed today. ✓ B 表示會今天提出維修請求，A 回應「謝謝，我會告知大家」，文意連貫。\n❌ (A) 「那台印表機上個月已經被移除了」與 A 開頭說「印表機又故障了」矛盾（暗示印表機仍在）。\n❌ (C) 「我們這層樓沒有印表機」與 A 提到「三樓的印表機」矛盾。\n❌ (D) 「你應該自己買一台新印表機」與「我會告知大家」的團隊性回應不連貫。", "zh": "同事 A：三樓的印表機又故障了。<br>同事 B：<b>我今天會提出維修申請。<\/b><br>同事 A：謝謝，我會通知大家。", "sa": "正解句：【S】I 【V】will put in 【O】a request 【M】to have it fixed today<br>📌 句型：have + O + p.p.（使某物被……）；put in a request（提出申請）。<br>關鍵句：I'll let everyone know.（let + O + V）。"}, {"n": 16, "p": 1, "stem": "Customer: I'd like to book a round-trip flight to Osaka in August.<br>Agent: _____<br>Customer: The earlier one sounds better for me.", "o": ["We don't book international flights.", "Osaka is closed to tourists this year.", "You'll need a different agency for that.", "There are two options: a direct flight or one with a layover, which is cheaper."], "a": 3, "exp": "(D) There are two options: a direct flight or one with a layover, which is cheaper. ✓ 旅行社人員提出兩種選項，顧客回應「較早的那個對我比較好」，呼應前面提到的選項比較，文意連貫。\n❌ (A) 「我們不訂國際航班」與顧客接著做選擇的回應矛盾。\n❌ (B) 「大阪今年不對遊客開放」與顧客接著選擇航班的回應矛盾。\n❌ (C) 「你需要找別的旅行社」與顧客接著做選擇的回應矛盾。", "zh": "顧客：我想訂八月飛大阪的來回機票。<br>旅行社人員：<b>有兩個選擇：直飛班機，或是需要轉機、比較便宜的班機。<\/b><br>顧客：比較早的那班對我比較好。", "sa": "正解句：There are 【S】two options：a direct flight or one with a layover, 【M】which is cheaper<br>📌 句型：There + be + N；one 代替 a flight；which 引導非限定子句。<br>關鍵句：The earlier one sounds better（sound + adj.）。"}, {"n": 17, "p": 1, "stem": "Tenant A: I wanted to mention that the construction noise upstairs has been pretty loud lately.<br>Tenant B: _____<br>Tenant A: Thank you, that would help a lot.", "o": ["There's nothing we can do about that.", "I'll speak with the workers about limiting the noise to daytime hours.", "You should move to a different building.", "The construction will continue indefinitely with no changes."], "a": 1, "exp": "(B) I'll speak with the workers about limiting the noise to daytime hours. ✓ B（管理員）表示會與工人協調將施工噪音限制在白天，A 回應「謝謝，這會很有幫助」，文意連貫。\n❌ (A) 「我們對此無能為力」與 A 回應「謝謝，這會很有幫助」矛盾。\n❌ (C) 「你應該搬去別的大樓」與 A 表示感謝的回應不連貫。\n❌ (D) 「施工將無限期持續，不會有任何改變」與 A 回應「這會很有幫助」矛盾。", "zh": "房客 A：我想跟你說一下，最近樓上施工的噪音蠻大的。<br>房客 B：<b>我會跟工人談談，把噪音限制在白天時段。<\/b><br>房客 A：謝謝，那會很有幫助。", "sa": "正解句：【S】I 【V】will speak 【M】with the workers about limiting the noise to daytime hours<br>📌 句型：speak with + 人 + about + V-ing；limit A to B（把 A 限制在 B）。<br>關鍵句：that would help a lot（would 表委婉推測）。"}, {"n": 18, "p": 1, "stem": "Student A: Is it too late to sign up for the debate club?<br>Student B: _____<br>Student A: That's a relief. I'll go sign up now.", "o": ["Registration closed last week.", "The debate club was canceled this year.", "Sign-ups are open until Friday, so you still have time.", "You need a teacher's recommendation first."], "a": 2, "exp": "(C) Sign-ups are open until Friday, so you still have time. ✓ B 表示報名到星期五截止，仍有時間，A 回應「真是鬆了一口氣，我現在就去報名」，文意連貫。\n❌ (A) 「報名上週已經截止」與 A 回應「我現在就去報名」矛盾。\n❌ (B) 「辯論社今年取消了」與 A 接著去報名的動作矛盾。\n❌ (D) 「你需要老師的推薦信」未直接回應「是否還能報名」的問題，與 A「鬆了一口氣」的反應不連貫。", "zh": "學生 A：現在報名辯論社會不會太晚？<br>學生 B：<b>報名開放到星期五，所以你還有時間。<\/b><br>學生 A：真是鬆了一口氣，我現在就去報名。", "sa": "正解句：【S】Sign-ups 【V】are 【C】open 【M】until Friday ／ so you still have time<br>📌 句型：Is it too late to V?（太晚而不能……嗎）；so 表結果。<br>關鍵句：That's a relief.（真是鬆了一口氣）。"}, {"n": 19, "p": 1, "stem": "Customer: Can I order a custom cake for a birthday next Saturday?<br>Baker: _____<br>Customer: Perfect, I'll come by Thursday to pick a design.", "o": ["We don't make custom cakes.", "Saturday is too soon to place any order.", "Birthday cakes are not available this month.", "We need at least three days' notice for custom orders."], "a": 3, "exp": "(D) We need at least three days' notice for custom orders. ✓ 烘焙師表示客製訂單需至少三天前預訂，顧客回應「太好了，我星期四過來選設計」，符合下週六前三天以上的時間安排，文意連貫。\n❌ (A) 「我們不做客製蛋糕」與顧客接著安排訂購的回應矛盾。\n❌ (B) 「星期六太快了，無法接受任何訂單」與顧客接著能訂購的回應矛盾。\n❌ (C) 「這個月不供應生日蛋糕」與顧客接著訂購生日蛋糕的回應矛盾。", "zh": "顧客：我可以為下週六的生日訂一個客製蛋糕嗎？<br>烘焙師：<b>客製訂單我們至少需要三天前通知。<\/b><br>顧客：太好了，我星期四會過來挑選樣式。", "sa": "正解句：【S】We 【V】need 【O】at least three days' notice 【M】for custom orders<br>📌 句型：時間所有格 three days' notice（三天前的通知）；at least（至少）。<br>關鍵句：come by to pick a design（to V 表目的）。"}, {"n": 20, "p": 1, "stem": "Friend A: It looks like it might rain this weekend.<br>Friend B: _____<br>Friend A: Good idea, I'll check what's playing.", "o": ["Then we should definitely go hiking.", "Maybe we should plan something indoors, like a movie.", "Rain never affects our plans.", "Let's cancel everything and stay separate."], "a": 1, "exp": "(B) Maybe we should plan something indoors, like a movie. ✓ B 建議改為室內活動，例如看電影，A 回應「好主意，我去查一下有什麼電影」，文意連貫。\n❌ (A) 「那我們一定要去爬山」與下雨的預測及 A 接著查電影的回應矛盾。\n❌ (C) 「下雨從來不會影響我們的計畫」與 A 接著改變計畫（查電影）的回應矛盾。\n❌ (D) 「我們把所有計畫取消，各自分開吧」與 A 回應「好主意，我去查電影」（暗示仍會一起活動）矛盾。", "zh": "朋友 A：這個週末看起來可能會下雨。<br>朋友 B：<b>也許我們應該安排室內活動，像是看電影。<\/b><br>朋友 A：好主意，我來查查有什麼電影在上映。", "sa": "正解句：【S】we 【V】should plan 【O】something indoors 【M】like a movie<br>📌 句型：something + 形容詞／副詞後置修飾；It looks like + 子句（看起來好像）。<br>關鍵句：check what's playing（what 名詞子句；playing＝上映中）。"}, {"n": 21, "p": 2, "stem": "(21)", "o": ["as", "until", "unless", "although"], "a": 0, "exp": "(A) as ✓ 表示「隨著……（變化）」，\"as the variety...grew\"（隨著種類增加），與主要子句「變得越來越困難」程度相呼應。\n❌ (B) until = 直到，文意不合（並非「直到種類增加」才困難，而是「隨著」種類增加而困難）。\n❌ (C) unless = 除非，文意不合。\n❌ (D) although = 雖然，文意不合（前後句並非讓步關係）。", "zh": "<i>This system worked reasonably well in small communities, but it became increasingly difficult <b>as<\/b> the variety of goods and services in a society grew, since not every trade involved two people who each wanted what the other had.<\/i><br>這種制度在小型社群中運作得還算不錯，但隨著社會中商品與服務的種類增加，它變得越來越困難，因為並非每筆交易都剛好涉及兩個各自想要對方東西的人。", "sa": "【S】it 【V】became 【C】increasingly difficult 【M】as the variety ... grew<br>📌 句型：as + S + V（隨著……），常與 increasingly、more and more 等變化字眼搭配。<br>例：As he grew older, he became wiser."}, {"n": 22, "p": 2, "stem": "(22)", "o": ["who", "which", "whom", "whose"], "a": 1, "exp": "(B) which ✓ 非限定關係子句中指代「事物」（Coins）的主格關係代名詞。\n❌ (A) who／(C) whom 用於指「人」，coins 為事物，不可使用。\n❌ (D) whose 為所有格關係代名詞，後面須接名詞，\"whose were first minted\" 文法不通。", "zh": "<i>Coins, <b>which<\/b> were first minted in ancient Lydia around the seventh century BC, offered a solution by providing a standard unit of value that could be exchanged for almost anything.<\/i><br>硬幣大約在西元前七世紀於古代呂底亞首次被鑄造，它提供了一種解決方式：提供一個幾乎可以交換任何東西的標準價值單位。", "sa": "【S】Coins 【V】offered 【O】a solution<br>📌 句型：逗號後的非限定關係子句，先行詞為物（Coins）且缺主詞 → 用 which，不可用 that。<br>例：My bike, which was made in Taiwan, is very light."}, {"n": 23, "p": 2, "stem": "(23)", "o": ["become", "became", "becoming", "becomes"], "a": 1, "exp": "(B) became ✓ 過去式，與全文敘述歷史的過去時態一致。\n❌ (A) become 為原形動詞，不可單獨作主要動詞。\n❌ (C) becoming 為現在分詞，不可單獨作主要動詞。\n❌ (D) becomes 為現在式，與全文過去時態不一致。", "zh": "<i>Over the following centuries, coins <b>became<\/b> widely used across much of the ancient world, eventually being replaced in many places by paper money, which was lighter and easier to transport in large amounts.<\/i><br>在接下來的幾個世紀裡，硬幣在古代世界的大部分地區被廣泛使用，最後在許多地方被紙幣取代，因為紙幣更輕，也更容易大量運送。", "sa": "【S】coins 【V】became 【C】widely used<br>📌 句型：句子需要主要動詞，且敘述歷史 → 過去式 became；become + p.p.（變得被……）。<br>後半 eventually being replaced... 為被動分詞構句。"}, {"n": 24, "p": 2, "stem": "(24)", "o": ["allow", "allowed", "to allow", "allowing"], "a": 3, "exp": "(D) allowing ✓ 現在分詞構句，修飾 electronic payments，表示其「讓人們……」的功能。\n❌ (A) allow 為原形動詞，不可單獨作分詞構句。\n❌ (B) allowed 為過去分詞，表被動意義，但此處 electronic payments 是主動「讓」人們做某事，應用現在分詞。\n❌ (C) to allow 不定詞在此處不符合插入語的分詞構句結構。", "zh": "<i>Today, electronic payments, <b>allowing<\/b> people to make transactions without any physical money at all, have become increasingly common in many countries.<\/i><br>如今，電子支付讓人們完全不需要實體貨幣就能進行交易，在許多國家已變得越來越普遍。", "sa": "【S】electronic payments 【V】have become 【C】increasingly common<br>📌 句型：主要動詞已是 have become，插入部分用分詞片語 allowing...（＝which allow...），主動用 V-ing。<br>allow + O + to V。"}, {"n": 25, "p": 2, "stem": "(25)", "o": ["by", "for", "with", "at"], "a": 0, "exp": "(A) by ✓ \"by reducing\"（藉由減少），表達達成目的的方法／手段。\n❌ (B) for = 為了，\"for reducing\" 不是表達手段的常見搭配。\n❌ (C) with = 用，\"with reducing\" 文法不通。\n❌ (D) at = 在，\"at reducing\" 文法不通。", "zh": "<i>Supporters argue that remote work can improve employees' quality of life <b>by<\/b> reducing the time and money spent commuting.<\/i><br>支持者認為，遠端工作能藉由減少花在通勤上的時間與金錢，來提升員工的生活品質。", "sa": "【S】remote work 【V】can improve 【O】employees' quality of life 【M】by reducing...<br>📌 句型：by + V-ing（藉由……方法）。<br>例：You can save money by cooking at home."}, {"n": 26, "p": 2, "stem": "(26)", "o": ["who", "what", "which", "that"], "a": 2, "exp": "(C) which ✓ 非限定關係子句的主格關係代名詞，指代前面整個概念（建立同事關係）。\n❌ (A) who 用於指「人」，此處指代的是一件事而非人。\n❌ (B) what 本身已包含先行詞，不可用於有先行詞（前述概念）的關係子句。\n❌ (D) that 不可用於非限定（有逗號）關係子句。", "zh": "<i>Critics, however, point out that remote work can make it harder for new employees to build relationships with colleagues, <b>which<\/b> can be especially important during the early stages of a career.<\/i><br>然而，批評者指出，遠端工作可能讓新進員工更難與同事建立關係，而這在職涯初期可能格外重要。", "sa": "【S】remote work 【V】can make 【O】it 【C】harder 【M】for new employees to build relationships<br>📌 句型：make it + adj. + for 人 + to V；, which（非限定，前有逗號不可用 that）當主詞，補充說明前述內容。"}, {"n": 27, "p": 2, "stem": "(27)", "o": ["which", "where", "when", "why"], "a": 1, "exp": "(B) where ✓ 關係副詞，引導修飾 model 的完整子句，相當於 \"in which\"。\n❌ (A) which 為關係代名詞，後面須接缺少主詞或受詞的不完整句子，但 \"employees come into the office...\" 為完整句子，故不可用 which。\n❌ (C) when 用於修飾表示時間的名詞，model 非時間名詞。\n❌ (D) why 用於修飾表示原因的名詞（如 reason），model 非原因名詞。", "zh": "<i>Some companies have responded by adopting a hybrid model, <b>where<\/b> employees come into the office on certain days and work from home on others.<\/i><br>有些公司的因應方式是採用混合模式，也就是員工某幾天進辦公室、其他天在家工作。", "sa": "【S】Some companies 【V】have responded 【M】by adopting a hybrid model<br>📌 句型：關係副詞 where ＝ in which，後接完整子句（employees come...），修飾抽象地點／情況名詞 model。<br>例：This is a system where everyone has a voice."}, {"n": 28, "p": 2, "stem": "(28)", "o": ["is", "are", "was", "were"], "a": 0, "exp": "(A) is ✓ 與單數主詞（whether 名詞子句）及現在進行被動式 \"being studied\" 搭配。\n❌ (B) are 為複數動詞，與單數的 whether 子句主詞不一致。\n❌ (C) was／(D) were 為過去式，與全文討論現況（目前正在研究中）的現在時態不一致。", "zh": "<i>Whether this balance proves sustainable in the long run <b>is<\/b> still being studied by researchers.<\/i><br>這種平衡長期來看是否能持續，研究人員仍在研究中。", "sa": "【S】Whether this balance proves sustainable 【V】is still being studied<br>📌 句型：Whether 名詞子句當主詞 → 單數動詞 is；現在進行式被動 is being + p.p.。<br>例：Whether he will come is still unknown."}, {"n": 29, "p": 3, "stem": "Why will the library be closed?", "o": ["For renovation.", "For an event.", "Due to a fire.", "Due to a strike."], "a": 0, "exp": "(A) For renovation. ✓ 公告明確指出 \"The main library will be closed for renovation\"。\n❌ (B) 公告未提到任何活動。\n❌ (C) 公告未提到火災。\n❌ (D) 公告未提到罷工。", "zh": "題目：圖書館為什麼要關閉？<br>(A) 為了整修。<br>(B) 為了舉辦活動。<br>(C) 因為火災。<br>(D) 因為罷工。", "sa": "題目：【S】the library 【V】will be closed（Why 問原因）<br>依據句：The main library will be closed <b>for renovation<\/b> from July 1 to July 15.<br>📌 句型：for + 名詞 表原因；未來式被動 will be + p.p.。"}, {"n": 30, "p": 3, "stem": "Where can books be returned during the closure?", "o": ["At the front desk.", "At the campus computer lab.", "Through the drop box at the side entrance.", "Books cannot be returned."], "a": 2, "exp": "(C) Through the drop box at the side entrance. ✓ 公告明確指出 \"books may be returned using the drop box located at the side entrance\"。\n❌ (A) 公告未提到前台。\n❌ (B) 公告說明電腦教室是供學生「自習」之用，並非書籍歸還處。\n❌ (D) 公告明確說明書籍可以歸還。", "zh": "題目：閉館期間可以在哪裡還書？<br>(A) 在櫃台。<br>(B) 在校園電腦教室。<br>(C) 透過側門的還書箱。<br>(D) 書無法歸還。", "sa": "題目：【S】books 【V】can be returned（Where 問地點）<br>依據句：books may be returned using <b>the drop box located at the side entrance<\/b>.<br>📌 句型：located at... 過去分詞片語修飾 drop box。"}, {"n": 31, "p": 3, "stem": "Why does Jess want to stop by Sam's place?", "o": ["To borrow an umbrella.", "To return a book.", "To return Sam's key.", "To pick up her umbrella."], "a": 3, "exp": "(D) To pick up her umbrella. ✓ Sam 提到 Jess 把雨傘留在他家，Jess 回應 \"Can I stop by later to grab it?\"，表示想去拿回雨傘。\n❌ (A) 對話中是 Jess 要去「拿回」自己的傘，並非借傘。\n❌ (B) 對話未提到書。\n❌ (C) 對話未提到鑰匙。", "zh": "題目：Jess 為什麼想順道去 Sam 家？<br>(A) 去借一把雨傘。<br>(B) 去還一本書。<br>(C) 去還 Sam 的鑰匙。<br>(D) 去拿回她的雨傘。", "sa": "題目：【S】Jess 【V】want 【O】to stop by Sam's place<br>依據句：You left it at my place last night. ／ Can I stop by later to <b>grab it<\/b>?<br>📌 句型：to V 表目的；grab＝pick up（拿取）。"}, {"n": 32, "p": 3, "stem": "When will Sam be home?", "o": ["Before 6.", "After 6.", "All day.", "Tomorrow."], "a": 1, "exp": "(B) After 6. ✓ Sam 明確說 \"I'll be home after 6\"。\n❌ (A) 與原文「6 點之後」相反。\n❌ (C) 對話未說明「整天」都在家。\n❌ (D) 對話討論的是「稍後（今天）」，並非明天。", "zh": "題目：Sam 什麼時候會在家？<br>(A) 6 點以前。<br>(B) 6 點以後。<br>(C) 一整天。<br>(D) 明天。", "sa": "題目：【S】Sam 【V】will be 【C】home（When 問時間）<br>依據句：I'll be home <b>after 6<\/b>.<br>📌 句型：be home，home 為副詞。"}, {"n": 33, "p": 3, "stem": "What is a \"digital detox,\" according to the passage?", "o": ["A medical treatment for phone addiction.", "A new type of smartphone application.", "A deliberate break from smartphones and digital devices.", "A government regulation on technology use."], "a": 2, "exp": "(C) A deliberate break from smartphones and digital devices. ✓ 文中明確指出 \"taking deliberate breaks from smartphones and other digital devices, a practice often referred to as a 'digital detox'\"。\n❌ (A) 文章未提到醫療治療。\n❌ (B) 文章未提到應用程式。\n❌ (D) 文章未提到政府法規。", "zh": "題目：根據本文，什麼是「數位排毒」？<br>(A) 一種治療手機成癮的醫療方法。<br>(B) 一種新型的智慧型手機應用程式。<br>(C) 刻意暫停使用智慧型手機和數位裝置。<br>(D) 一項政府對科技使用的規定。", "sa": "題目：What is + 主詞？（問定義）<br>依據句：taking <b>deliberate breaks from smartphones and other digital devices<\/b>, a practice often referred to as a \"digital detox.\"<br>📌 句型：同位語說明；refer to A as B。"}, {"n": 34, "p": 3, "stem": "What do supporters of digital detoxes report?", "o": ["Feeling less anxious and sleeping better.", "Earning more money.", "Losing interest in their friends.", "Needing more digital devices."], "a": 0, "exp": "(A) Feeling less anxious and sleeping better. ✓ 文中指出 \"Supporters of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations\"。\n❌ (B) 文章未提到賺更多錢。\n❌ (C) 文章未提到對朋友失去興趣。\n❌ (D) 文章未提到需要更多數位裝置。", "zh": "題目：數位排毒的支持者表示有什麼感受？<br>(A) 感覺較不焦慮、睡得更好。<br>(B) 賺更多錢。<br>(C) 對朋友失去興趣。<br>(D) 需要更多數位裝置。", "sa": "題目：【S】supporters 【V】report 【O】what<br>依據句：Supporters of digital detoxes report <b>feeling less anxious, sleeping better<\/b>, and being more present...<br>📌 句型：report + V-ing，平行結構。"}, {"n": 35, "p": 3, "stem": "What do some experts suggest instead of occasional breaks?", "o": ["Avoiding technology completely.", "Taking even longer breaks.", "Buying newer devices.", "Making small, lasting changes to daily technology habits."], "a": 3, "exp": "(D) Making small, lasting changes to daily technology habits. ✓ 文末指出 \"people may benefit more from making small, lasting changes to how they use technology day to day\"。\n❌ (A) 文章未建議「完全避免」科技。\n❌ (B) 文章建議的是「持久的小改變」，並非「更長的休息」。\n❌ (C) 文章未建議購買新裝置。", "zh": "題目：有些專家建議用什麼取代偶爾的休息？<br>(A) 完全避免使用科技。<br>(B) 休息更長的時間。<br>(C) 購買更新的裝置。<br>(D) 對日常科技使用習慣做出小而持久的改變。", "sa": "題目：【S】some experts 【V】suggest 【O】what 【M】instead of occasional breaks<br>依據句：instead of taking occasional breaks, people may benefit more from <b>making small, lasting changes<\/b> to how they use technology day to day<br>📌 句型：instead of + V-ing；benefit from + V-ing。"}, {"n": 36, "p": 3, "stem": "What mainly determines whether someone is a \"morning person\" or a \"night owl,\" according to the passage?", "o": ["Genetics.", "Diet.", "Exercise habits.", "Caffeine consumption."], "a": 0, "exp": "(A) Genetics. ✓ 文中明確指出 \"are influenced significantly by genetics rather than simply being a matter of habit or willpower\"。\n❌ (B) 文章未提到飲食。\n❌ (C) 文章未提到運動習慣。\n❌ (D) 文章未提到咖啡因攝取。", "zh": "題目：根據本文，主要是什麼決定一個人是「晨型人」還是「夜貓子」？<br>(A) 基因。<br>(B) 飲食。<br>(C) 運動習慣。<br>(D) 咖啡因攝取量。", "sa": "題目：【S】What 【V】determines 【O】whether 子句<br>依據句：...are influenced significantly <b>by genetics<\/b> rather than simply being a matter of habit or willpower.<br>📌 句型：A rather than B（是 A 而不是 B）。"}, {"n": 37, "p": 3, "stem": "According to the passage, how can a person's chronotype change over time?", "o": ["It never changes.", "Morning people always become night owls.", "It changes randomly every day.", "Night owls often become more like morning people as they age."], "a": 3, "exp": "(D) Night owls often become more like morning people as they age. ✓ 文中指出 \"many people who were night owls in their teenage years gradually become more like morning people as they get older\"。\n❌ (A) 文章說明 chronotype「會」隨時間改變。\n❌ (B) 文章說明的方向是「夜貓子變得像晨型人」，並非相反。\n❌ (C) 文章說明的是隨年齡的漸進改變，並非「每天隨機改變」。", "zh": "題目：根據本文，一個人的時型如何隨時間改變？<br>(A) 它從不改變。<br>(B) 晨型人總是會變成夜貓子。<br>(C) 它每天隨機改變。<br>(D) 夜貓子隨著年紀增長，常會變得比較像晨型人。", "sa": "題目：how 問方式；【S】a person's chronotype 【V】can change<br>依據句：many people who were night owls in their teenage years <b>gradually become more like morning people as they get older<\/b>.<br>📌 句型：as + S + V（隨著……）。"}, {"n": 38, "p": 3, "stem": "What have some schools and workplaces begun experimenting with?", "o": ["Banning early classes entirely.", "Required naps during the day.", "More flexible start times.", "Eliminating weekends."], "a": 2, "exp": "(C) More flexible start times. ✓ 文末指出 \"some schools and workplaces have begun experimenting with more flexible start times to better accommodate different chronotypes\"。\n❌ (A) 文章未提到禁止早課。\n❌ (B) 文章未提到強制午睡。\n❌ (D) 文章未提到取消週末。", "zh": "題目：有些學校和職場已開始嘗試什麼？<br>(A) 完全取消早上的課。<br>(B) 白天強制午睡。<br>(C) 更彈性的開始時間。<br>(D) 取消週末。", "sa": "題目：【S】some schools and workplaces 【V】have begun experimenting with 【O】what<br>依據句：...have begun experimenting with <b>more flexible start times<\/b> to better accommodate different chronotypes.<br>📌 句型：experiment with；to V 表目的。"}, {"n": 39, "p": 3, "stem": "What did Maya notice about her neighbors?", "o": ["They repaired everything themselves.", "They had no broken items at home.", "They never bought new appliances.", "They threw away items that could be easily fixed."], "a": 3, "exp": "(D) They threw away items that could be easily fixed. ✓ 文章開頭指出 \"many of her neighbors threw away household items...even when the problem was something simple that could be fixed\"。\n❌ (A) 文章說明鄰居並非自己修理，而是直接丟棄。\n❌ (B) 與文章「鄰居丟棄壞掉的物品」（暗示家中有壞掉的物品）矛盾。\n❌ (C) 文章未提到鄰居「從不」購買新家電。", "zh": "題目：Maya 注意到她的鄰居有什麼情況？<br>(A) 他們什麼都自己修理。<br>(B) 他們家裡沒有壞掉的東西。<br>(C) 他們從不買新家電。<br>(D) 他們會把很容易修好的東西丟掉。", "sa": "題目：【S】Maya 【V】noticed 【O】what<br>依據句：many of her neighbors <b>threw away household items<\/b>... even when the problem was something simple that could be fixed.<br>📌 句型：even when（即使）；that could be fixed 關係子句修飾 something simple。"}, {"n": 40, "p": 3, "stem": "What happened at the first repair café event?", "o": ["Only a handful of people showed up.", "The event was canceled.", "The community center was closed.", "Hundreds of people attended immediately."], "a": 0, "exp": "(A) Only a handful of people showed up. ✓ 文中指出 \"At the first event, only a handful of people showed up, and Maya worried that no one was interested\"。\n❌ (B) 文章未說活動被取消。\n❌ (C) 文章未說社區中心關閉。\n❌ (D) 與文章「第一次只有少數人來」矛盾；文章說明是「到第三次活動」才出現排長龍的情況。", "zh": "題目：第一次修理咖啡館活動發生了什麼事？<br>(A) 只有少數幾個人出現。<br>(B) 活動被取消了。<br>(C) 社區中心關閉了。<br>(D) 立刻有數百人參加。", "sa": "題目：【S】What 【V】happened（What 當主詞）<br>依據句：At the first event, <b>only a handful of people showed up<\/b>.<br>📌 句型：a handful of（少數的）；show up（出現）。"}, {"n": 41, "p": 3, "stem": "Why did Maya keep a record of repaired and unrepaired items?", "o": ["To charge customers different prices.", "To report broken items to the city.", "To figure out which tools and supplies the volunteers needed most.", "To sell the broken items online."], "a": 2, "exp": "(C) To figure out which tools and supplies the volunteers needed most. ✓ 文中指出 \"she used this information to figure out which tools and supplies the volunteers needed most\"。\n❌ (A) 文章未提到向顧客收取不同費用。\n❌ (B) 文章未提到向市府回報故障物品。\n❌ (D) 文章未提到在網路上出售壞掉的物品。", "zh": "題目：Maya 為什麼要記錄修好和沒修好的物品？<br>(A) 為了向顧客收取不同價格。<br>(B) 為了向市政府回報壞掉的物品。<br>(C) 為了找出志工最需要哪些工具和材料。<br>(D) 為了在網路上賣掉壞掉的物品。", "sa": "題目：【S】Maya 【V】keep 【O】a record of...（Why 問目的）<br>依據句：she used this information <b>to figure out which tools and supplies the volunteers needed most<\/b>.<br>📌 句型：to V 表目的；which 引導名詞子句。"}, {"n": 42, "p": 3, "stem": "What did local hardware stores do after hearing about the repair café?", "o": ["They asked Maya to close the event.", "They opened a competing repair shop.", "They charged Maya for supplies.", "They donated spare parts and tools."], "a": 3, "exp": "(D) They donated spare parts and tools. ✓ 文末指出 \"several local hardware stores heard about the repair café and began donating spare parts and tools\"。\n❌ (A) 文章未提到要求 Maya 結束活動。\n❌ (B) 文章未提到開設競爭性的維修店。\n❌ (C) 文章未提到向 Maya 收取材料費用；五金行是「捐贈」零件與工具。", "zh": "題目：當地五金行聽說修理咖啡館之後做了什麼？<br>(A) 他們要求 Maya 停辦活動。<br>(B) 他們開了一家競爭的修理店。<br>(C) 他們向 Maya 收取材料費。<br>(D) 他們捐贈了備用零件和工具。", "sa": "題目：【S】local hardware stores 【V】do 【M】after hearing about...<br>依據句：several local hardware stores heard about the repair café and <b>began donating spare parts and tools<\/b>.<br>📌 句型：after + V-ing；begin + V-ing。"}];
const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "擁有開放的心態能幫助我們學習新事物並適應改變。<br><span class=\"blankline\">Having an o<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① mind can help us learn new things and a<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② to change.<\/span>", "ans": "① <b>open<\/b>　② <b>adapt<\/b>", "exp": "① open（開放的）：句中 \"an o___ mind\" 對應中文「開放的心態」，字首為 o，即 open。\n② adapt（適應）：\"a___ to change\" 對應中文「適應改變」，字首為 a，即 adapt（adapt to change）。", "zh": "擁有<b>開放<\/b>的心態能幫助我們學習新事物並<b>適應<\/b>改變。<br><i>Having an <b>open<\/b> mind can help us learn new things and <b>adapt<\/b> to change.<\/i>", "sa": "【S】Having an open mind 【V】can help 【O】us 【C】learn new things and adapt to change<br>📌 句型：動名詞片語當主詞（視為單數）；help + O + V（原形）；adapt to + N（適應）。"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>a popular trend / from home / has become / for many employees / working<\/i>", "ans": "Working from home has become a popular trend for many employees.", "exp": "\"Working from home\" 為動名詞片語作主詞，視為單數，動詞用 \"has become\"。\n\"a popular trend\" 為主詞補語。\n\"for many employees\" 為介系詞片語，置於句尾說明對象。", "zh": "在家工作已成為許多員工的熱門趨勢。", "sa": "【S】Working from home 【V】has become 【C】a popular trend 【M】for many employees<br>📌 句型：動名詞片語當主詞，動詞用單數 has；現在完成式表到目前為止的變化。<br>例：Learning English has become important for students."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>現在許多公司提供員工更彈性的上班時間。", "ans": "Many companies now offer employees more flexible working hours.", "exp": "「許多公司」譯為 \"many companies\"，作為句子主詞。\n「提供員工……」用 \"offer + 人 + 事物\"（offer employees...）的句型。\n「更彈性的上班時間」譯為 \"more flexible working hours\"，\"flexible\" 意為「彈性的」。", "zh": "題意：許多公司現在提供員工更有彈性的上班時間。", "sa": "【S】Many companies 【V】offer 【O】employees 【O】more flexible working hours 【M】now<br>📌 句型：offer + 人 + 物（＝offer + 物 + to + 人），授與動詞雙受詞。<br>例：The store offers customers free gifts."}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]+ptrHtml(String(q.n)); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){
if(window.AK)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;

  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});
return secs;
});</script>

  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>

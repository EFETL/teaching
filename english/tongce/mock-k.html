<title>統測英文模擬考卷 K</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>統測英文　<span style="opacity:.9">模擬考卷 K</span></h1>
    <p>科技校院四年制與專科學校二年制統一入學測驗　共同科目：英文（模擬）</p>
    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 42</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 K　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nIn the early days of postal delivery, letters <span class=\"blk\">21</span> carried by horse-riders who traveled long distances between towns, often facing difficult weather and rough roads. As railroads expanded across the country, mail began <span class=\"blk\">22</span> transported by train, which significantly reduced delivery times. By the time air mail services were introduced, a letter <span class=\"blk\">23</span> could take weeks to arrive could now reach its destination within a day or two. Today, although most communication happens electronically, postal services continue <span class=\"blk\">24</span> important roles such as delivering packages and official documents.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nScientists have long known that sleep plays an important role in learning, but research now suggests that sleep is especially important for <span class=\"blk\">25</span> information that has been learned during the day. During certain stages of sleep, the brain appears <span class=\"blk\">26</span> connections between neurons, a process that helps move information from short-term to long-term memory. Students <span class=\"blk\">27</span> stay up all night studying before an exam may actually perform worse than those who get a full night's sleep, even if the latter group studied for fewer hours overall. For this reason, many sleep researchers recommend that students prioritize sleep <span class=\"blk\">28</span> cramming in the days before an important test.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice</b><br><br>Beginning this month, our library will no longer charge late fees for overdue books. Materials that are more than 30 days overdue will simply be marked as lost, and the borrower will be charged the replacement cost of the item. We hope this change will encourage more people to use the library without fear of accumulating fines.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Sam: My car won't start this morning. Can you give me a ride to work? Alex: Sure, I can pick you up in 15 minutes. Sam: Thanks so much! I'll call a mechanic during lunch. Alex: No problem, see you soon.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nVertical farming, the practice of growing crops in stacked layers inside buildings rather than in open fields, has gained attention as a possible solution to challenges facing traditional agriculture. By controlling temperature, light, and water precisely, vertical farms can produce crops year-round regardless of outside weather conditions, and because the farms are often located close to cities, transportation costs and time can be greatly reduced. However, vertical farming also faces significant obstacles. The artificial lighting required to grow plants indoors consumes large amounts of electricity, and the initial cost of building a vertical farm can be far higher than that of a traditional farm. Additionally, vertical farms are currently best suited to growing leafy greens and herbs, while staple crops such as wheat and rice remain difficult to grow profitably indoors. Researchers continue to explore ways to make vertical farming more energy-efficient and affordable, in the hope that it could one day play a larger role in feeding growing urban populations.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nAs smartphones and social media have become an increasingly central part of daily life, a growing number of people have started practicing what is sometimes called a \"digital detox\" — a period of time during which a person deliberately avoids using digital devices. Some people choose to do this for just a few hours each day, while others take a complete break for an entire weekend or longer. Advocates of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations with friends and family. However, some researchers caution that completely avoiding technology may not be realistic or even necessary for most people, and that the real issue may not be technology itself but how it is used. Rather than eliminating screen time entirely, these researchers suggest that people focus on using technology more intentionally — for example, turning off notifications for non-essential apps or setting specific times to check email and social media, rather than checking constantly throughout the day.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nAfter moving to a new town, Mei noticed that many of her neighbors enjoyed gardening but often complained about the high cost of buying seeds and seedlings every spring. Mei, who had been saving seeds from her own garden for years, decided to set up a small table at the community center where neighbors could take a few seeds for free and, in return, were encouraged to save seeds from their own plants at the end of the growing season to share the following year. At first, only a few people participated, but as word spread, more neighbors began contributing seeds from a wider variety of vegetables, herbs, and flowers. The local librarian eventually offered Mei a small shelf inside the library itself, turning the project into an official \"seed library\" that anyone in town could borrow from. Mei now spends time each spring teaching workshops on seed-saving for beginners, hoping to help the seed library grow into a lasting resource for the community.</div>"};
const PTR = {"21": [{"en": "In the early days of postal delivery, letters <b>were<\/b> carried by horse-riders who traveled long distances between towns, often facing difficult weather and rough roads.", "zh": "在郵政遞送的早期，信件由騎馬的信差運送，他們在城鎮之間長途跋涉，常常要面對惡劣的天氣與崎嶇的道路。", "sa": "【S】letters 【V】were carried（過去式被動）【M】by horse-riders who…<br>📌 who 引導形容詞子句；often facing… 為分詞構句表伴隨狀況"}, {"en": "As railroads expanded across the country, mail began <b>to be transported<\/b> by train, which significantly reduced delivery times.", "zh": "隨著鐵路擴展到全國，郵件開始改由火車運送，大幅縮短了遞送時間。", "sa": "【M】As…（隨著）【S】mail 【V】began 【O】to be transported<br>📌 不定詞被動 to be + p.p.；, which 補充說明前面整件事"}, {"en": "By the time air mail services were introduced, a letter <b>that<\/b> could take weeks to arrive could now reach its destination within a day or two.", "zh": "等到航空郵件服務問世時，一封原本可能要好幾週才寄到的信，現在一兩天內就能送達目的地。", "sa": "【S】a letter (that…) 【V】could reach 【O】its destination<br>📌 by the time（到……時候）；take + 時間 + to V"}, {"en": "Today, although most communication happens electronically, postal services continue <b>to play<\/b> important roles such as delivering packages and official documents.", "zh": "如今，雖然大多數溝通都以電子方式進行，郵政服務仍持續扮演重要角色，例如遞送包裹和官方文件。", "sa": "【S】postal services 【V】continue 【O】to play important roles<br>📌 although 讓步子句；play a role（扮演角色）；such as（例如）"}], "25": [{"en": "Scientists have long known that sleep plays an important role in learning, but research now suggests that sleep is especially important for <b>consolidating<\/b> information that has been learned during the day.", "zh": "科學家早就知道睡眠在學習中扮演重要角色，但現在的研究顯示，睡眠對於鞏固白天所學的資訊尤其重要。", "sa": "【S】Scientists 【V】have long known 【O】that…, but 【S】research 【V】suggests 【O】that…<br>📌 介系詞 for + V-ing；that has been learned 修飾 information"}, {"en": "During certain stages of sleep, the brain appears <b>to strengthen<\/b> connections between neurons, a process that helps move information from short-term to long-term memory.", "zh": "在睡眠的某些階段，大腦似乎會強化神經元之間的連結，這個過程有助於把資訊從短期記憶移到長期記憶。", "sa": "【S】the brain 【V】appears 【C】to strengthen connections<br>📌 appear to V（似乎）；a process that… 為同位語說明前句"}, {"en": "Students <b>who<\/b> stay up all night studying before an exam may actually perform worse than those who get a full night's sleep, even if the latter group studied for fewer hours overall.", "zh": "考前熬夜讀書的學生，實際上表現可能比睡滿一整晚的學生還差，即使後者總共讀書的時數比較少。", "sa": "【S】Students (who…) 【V】may perform 【M】worse than those who…<br>📌 stay up + V-ing（熬夜做……）；even if（即使）"}, {"en": "For this reason, many sleep researchers recommend that students prioritize sleep <b>over<\/b> cramming in the days before an important test.", "zh": "因此，許多睡眠研究者建議，學生在重要考試前幾天應該把睡眠擺在臨時抱佛腳之前。", "sa": "【S】researchers 【V】recommend 【O】that students (should) prioritize sleep over cramming<br>📌 prioritize A over B；recommend that + S + (should) 原形V"}], "29": [{"en": "Notice", "zh": "公告", "sa": "標題，單一名詞"}, {"en": "Beginning this month, our library will no longer charge late fees for overdue books.", "zh": "從本月起，本館將不再對逾期書籍收取逾期罰款。", "sa": "【S】our library 【V】will no longer charge 【O】late fees<br>📌 Beginning + 時間（從……開始）；no longer（不再）"}, {"en": "Materials that are more than 30 days overdue will simply be marked as lost, and the borrower will be charged the replacement cost of the item.", "zh": "逾期超過 30 天的資料將直接被標記為遺失，借閱者須支付該物品的重置費用。", "sa": "【S】Materials (that…) 【V】will be marked 【C】as lost, and 【S】the borrower 【V】will be charged 【O】the replacement cost<br>📌 未來式被動 will be + p.p."}, {"en": "We hope this change will encourage more people to use the library without fear of accumulating fines.", "zh": "我們希望這項改變能鼓勵更多人使用圖書館，而不必擔心罰款越積越多。", "sa": "【S】We 【V】hope 【O】(that) this change will encourage more people to use the library<br>📌 encourage + 人 + to V；without + N／V-ing"}], "31": [{"en": "Text Messages", "zh": "手機簡訊", "sa": "標題，名詞片語"}, {"en": "Sam: My car won't start this morning.", "zh": "Sam：我的車今天早上發不動。", "sa": "【S】My car 【V】won't start<br>📌 won't 表「（東西）就是無法／不肯……」"}, {"en": "Can you give me a ride to work?", "zh": "你可以載我去上班嗎？", "sa": "【V】give 【O】me 【O】a ride<br>📌 give + 人 + a ride（載某人一程）"}, {"en": "Alex: Sure, I can pick you up in 15 minutes.", "zh": "Alex：當然，我 15 分鐘後可以去接你。", "sa": "【S】I 【V】can pick up 【O】you<br>📌 pick + 代名詞 + up（接某人）；in + 時間（……之後）"}, {"en": "Sam: Thanks so much!", "zh": "Sam：太感謝了！", "sa": "省略主詞的感謝用語"}, {"en": "I'll call a mechanic during lunch.", "zh": "我午餐時間會打電話給修車技師。", "sa": "【S】I 【V】'll call 【O】a mechanic 【M】during lunch"}, {"en": "Alex: No problem, see you soon.", "zh": "Alex：沒問題，待會見。", "sa": "口語慣用語，省略主詞"}], "33": [{"en": "Vertical farming, the practice of growing crops in stacked layers inside buildings rather than in open fields, has gained attention as a possible solution to challenges facing traditional agriculture.", "zh": "垂直農業是指在建築物內以層層堆疊的方式種植作物，而非在露天田地耕種；它作為解決傳統農業所面臨挑戰的可能方法，已經受到關注。", "sa": "【S】Vertical farming 【V】has gained 【O】attention 【M】as a possible solution…<br>📌 逗號間為同位語，解釋 vertical farming；facing… 為現在分詞後位修飾 challenges"}, {"en": "By controlling temperature, light, and water precisely, vertical farms can produce crops year-round regardless of outside weather conditions, and because the farms are often located close to cities, transportation costs and time can be greatly reduced.", "zh": "藉由精準控制溫度、光線和水分，垂直農場不論外面天氣如何都能全年生產作物；而且因為這些農場通常設在城市附近，運輸成本和時間都能大幅減少。", "sa": "【S】vertical farms 【V】can produce 【O】crops…, and 【S】costs and time 【V】can be reduced<br>📌 By + V-ing 表方法；regardless of（不論）；be located（位於）"}, {"en": "However, vertical farming also faces significant obstacles.", "zh": "然而，垂直農業也面臨重大的阻礙。", "sa": "【S】vertical farming 【V】faces 【O】significant obstacles<br>📌 However 表語氣轉折"}, {"en": "The artificial lighting required to grow plants indoors consumes large amounts of electricity, and the initial cost of building a vertical farm can be far higher than that of a traditional farm.", "zh": "在室內種植作物所需的人工照明會消耗大量電力，而且興建垂直農場的初期成本可能遠高於傳統農場。", "sa": "【S】The artificial lighting 【V】consumes 【O】electricity, and 【S】the initial cost 【V】can be 【C】far higher than that of…<br>📌 required… 為過去分詞後位修飾；that 代替 the initial cost 避免重複"}, {"en": "Additionally, vertical farms are currently best suited to growing leafy greens and herbs, while staple crops such as wheat and rice remain difficult to grow profitably indoors.", "zh": "此外，垂直農場目前最適合種植葉菜類和香草，而小麥和稻米等主糧作物要在室內有利潤地種植仍然很困難。", "sa": "【S】vertical farms 【V】are 【C】best suited to growing…, while 【S】staple crops 【V】remain 【C】difficult to grow<br>📌 be suited to + V-ing；while 表對比"}, {"en": "Researchers continue to explore ways to make vertical farming more energy-efficient and affordable, in the hope that it could one day play a larger role in feeding growing urban populations.", "zh": "研究人員持續探索讓垂直農業更節能、更負擔得起的方法，希望它有一天能在供應日益增加的都市人口糧食上扮演更重要的角色。", "sa": "【S】Researchers 【V】continue 【O】to explore ways to make vertical farming more…<br>📌 make + O + C（使……變得……）；in the hope that…（希望……）"}], "36": [{"en": "As smartphones and social media have become an increasingly central part of daily life, a growing number of people have started practicing what is sometimes called a \"digital detox\" — a period of time during which a person deliberately avoids using digital devices.", "zh": "隨著智慧型手機和社群媒體在日常生活中變得越來越重要，越來越多人開始實行所謂的「數位排毒」——也就是一段刻意不使用數位裝置的時間。", "sa": "【S】a growing number of people 【V】have started 【O】practicing what is called a \"digital detox\"<br>📌 what 引導名詞子句；during which 引導關係子句修飾 a period of time"}, {"en": "Some people choose to do this for just a few hours each day, while others take a complete break for an entire weekend or longer.", "zh": "有些人選擇每天只排毒幾個小時，有些人則完全休息一整個週末甚至更久。", "sa": "【S】Some people 【V】choose 【O】to do this…, while 【S】others 【V】take 【O】a complete break<br>📌 Some…, others…（有些……，有些……）"}, {"en": "Advocates of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations with friends and family.", "zh": "提倡數位排毒的人表示，他們比較不焦慮、睡得更好，與親友對話時也更專注投入。", "sa": "【S】Advocates 【V】report 【O】feeling…, sleeping…, and being…<br>📌 report + V-ing；三個動名詞對等並列"}, {"en": "However, some researchers caution that completely avoiding technology may not be realistic or even necessary for most people, and that the real issue may not be technology itself but how it is used.", "zh": "然而，有些研究者提醒，對大多數人來說，完全避開科技可能不切實際，甚至沒有必要；真正的問題或許不在科技本身，而在於如何使用它。", "sa": "【S】some researchers 【V】caution 【O】that… and that…<br>📌 兩個 that 子句並列作受詞；not A but B（不是 A 而是 B）"}, {"en": "Rather than eliminating screen time entirely, these researchers suggest that people focus on using technology more intentionally — for example, turning off notifications for non-essential apps or setting specific times to check email and social media, rather than checking constantly throughout the day.", "zh": "這些研究者建議，與其完全消除螢幕時間，不如更有意識地使用科技——例如關閉非必要應用程式的通知，或設定固定時間查看電子郵件和社群媒體，而不是一整天不停地查看。", "sa": "【S】these researchers 【V】suggest 【O】that people focus on using technology more intentionally<br>📌 rather than + V-ing（而不是）；focus on + V-ing"}], "39": [{"en": "After moving to a new town, Mei noticed that many of her neighbors enjoyed gardening but often complained about the high cost of buying seeds and seedlings every spring.", "zh": "搬到新城鎮後，Mei 注意到許多鄰居喜歡園藝，卻常抱怨每年春天購買種子和幼苗的花費很高。", "sa": "【S】Mei 【V】noticed 【O】that many of her neighbors enjoyed… but complained…<br>📌 After + V-ing（主詞相同時的簡化）；complain about"}, {"en": "Mei, who had been saving seeds from her own garden for years, decided to set up a small table at the community center where neighbors could take a few seeds for free and, in return, were encouraged to save seeds from their own plants at the end of the growing season to share the following year.", "zh": "Mei 多年來一直保存自家花園的種子，她決定在社區中心擺一張小桌子，讓鄰居可以免費拿幾顆種子；作為回報，鄰居們被鼓勵在生長季結束時保存自己植物的種子，隔年拿來分享。", "sa": "【S】Mei 【V】decided 【O】to set up a small table<br>📌 , who… 非限定子句（過去完成進行式）；where 引導關係子句修飾 the community center；be encouraged to V"}, {"en": "At first, only a few people participated, but as word spread, more neighbors began contributing seeds from a wider variety of vegetables, herbs, and flowers.", "zh": "起初只有少數人參加，但隨著消息傳開，越來越多鄰居開始貢獻各式各樣蔬菜、香草和花卉的種子。", "sa": "【S】only a few people 【V】participated, but 【S】more neighbors 【V】began 【O】contributing seeds<br>📌 as word spread（隨著消息傳開）；begin + V-ing"}, {"en": "The local librarian eventually offered Mei a small shelf inside the library itself, turning the project into an official \"seed library\" that anyone in town could borrow from.", "zh": "當地的圖書館員最後在圖書館裡提供 Mei 一個小架子，讓這個計畫變成鎮上任何人都能借用的正式「種子圖書館」。", "sa": "【S】The local librarian 【V】offered 【O】Mei 【O】a small shelf<br>📌 雙受詞 offer + 人 + 物；分詞構句 turning A into B 表結果"}, {"en": "Mei now spends time each spring teaching workshops on seed-saving for beginners, hoping to help the seed library grow into a lasting resource for the community.", "zh": "Mei 現在每年春天都會花時間為初學者開設保存種子的工作坊，希望幫助種子圖書館成為社區長久的資源。", "sa": "【S】Mei 【V】spends 【O】time 【M】teaching workshops…<br>📌 spend + 時間 + V-ing；hoping… 分詞構句表伴隨；help + O + 原形V"}]};
const Q = [{"n": 1, "p": 0, "stem": "The new policy aims to _____ traffic congestion in the downtown area during rush hour.", "o": ["reduce", "repair", "replace", "remove"], "a": 0, "exp": "✓ (A) reduce（減少）— 這項新政策旨在「減少」市中心尖峰時段的交通堵塞。\n❌ (B) repair = 修理，語意不符。\n❌ (C) replace = 取代，語意不符。\n❌ (D) remove = 移除，\"remove congestion\" 語意不通順，congestion 通常以 reduce 搭配。", "zh": "這項新政策旨在減少市中心區尖峰時段的交通壅塞。", "sa": "【S】The new policy 【V】aims 【O】to reduce traffic congestion 【M】in the downtown area during rush hour<br>📌 句型：aim to V（旨在／目的是要做……）<br>📌 搭配：reduce congestion（減少壅塞）<br>例：The plan aims to cut costs."}, {"n": 2, "p": 0, "stem": "She was _____ to find that her flight had been delayed by three hours.", "o": ["frustrated", "fascinated", "flattered", "forgiven"], "a": 0, "exp": "✓ (A) frustrated（感到沮喪、挫折的）— 她發現班機延誤三小時，感到「沮喪」。\n❌ (B) fascinated = 感到著迷的，語意不符。\n❌ (C) flattered = 感到受寵若驚的，語意不符。\n❌ (D) forgiven = 被原諒的，語意不符。", "zh": "她發現自己的班機延誤了三個小時，感到很沮喪。", "sa": "【S】She 【V】was 【C】frustrated 【M】to find that…<br>📌 句型：be + 情緒形容詞 + to V（因為……而感到……），to find 表原因<br>📌 that 子句作 find 的受詞；had been delayed 為過去完成被動式<br>例：He was happy to hear the news."}, {"n": 3, "p": 0, "stem": "The committee will _____ the proposal carefully before making a final decision.", "o": ["exhibit", "examine", "exclude", "exceed"], "a": 1, "exp": "✓ (B) examine（仔細檢視）— 委員會在做最終決定前會仔細「檢視」這項提案。\n❌ (A) exhibit = 展示，語意不符。\n❌ (C) exclude = 排除，語意不符。\n❌ (D) exceed = 超過，語意不符。", "zh": "委員會在做出最後決定之前，會仔細審查這項提案。", "sa": "【S】The committee 【V】will examine 【O】the proposal 【M】carefully／before making a final decision<br>📌 句型：before + V-ing（介系詞後接動名詞）<br>📌 搭配：make a decision（做決定）"}, {"n": 4, "p": 0, "stem": "Volunteers helped to _____ the riverbank by removing plastic waste and planting native trees.", "o": ["restore", "resign", "resist", "respond"], "a": 0, "exp": "✓ (A) restore（恢復、修復）— 志工們透過清除塑膠垃圾及種植原生樹種來「恢復」河岸的生態。\n❌ (B) resign = 辭職，語意不符。\n❌ (C) resist = 抵抗，語意不符。\n❌ (D) respond = 回應，語意不符。", "zh": "志工們藉由清除塑膠垃圾並種植原生樹種，幫忙恢復河岸的原貌。", "sa": "【S】Volunteers 【V】helped 【O】to restore the riverbank 【M】by removing … and planting …<br>📌 句型：help (to) V（幫忙做……，to 可省略）<br>📌 by + V-ing（藉由……方式），removing 與 planting 以 and 對等連接"}, {"n": 5, "p": 0, "stem": "The factory has implemented new safety measures to _____ the risk of accidents.", "o": ["maximize", "monitor", "minimize", "maintain"], "a": 2, "exp": "✓ (C) minimize（將……降到最低）— 工廠實施新的安全措施以「將」事故風險「降到最低」。\n❌ (A) maximize = 將……最大化，與「降低風險」的語意相反。\n❌ (B) monitor = 監控，語意與「降低風險」的目的不符。\n❌ (D) maintain = 維持，\"maintain the risk\" 語意不通順（不會想要「維持」風險）。", "zh": "這間工廠已實施新的安全措施，以將意外發生的風險降到最低。", "sa": "【S】The factory 【V】has implemented 【O】new safety measures 【M】to minimize the risk of accidents<br>📌 時態：現在完成式 has + p.p.（已經做了，影響到現在）<br>📌 不定詞 to V 表目的（為了……）"}, {"n": 6, "p": 0, "stem": "He felt a great sense of _____ when he finally paid off his student loans.", "o": ["relief", "regret", "refusal", "request"], "a": 0, "exp": "✓ (A) relief（鬆一口氣、寬慰）— 他終於還清學生貸款時感到極大的「寬慰」。\n❌ (B) regret = 後悔，語意不符（還清貸款應感到寬慰而非後悔）。\n❌ (C) refusal = 拒絕，語意不符。\n❌ (D) request = 請求，語意不符。", "zh": "當他終於還清學生貸款時，感到如釋重負。", "sa": "【S】He 【V】felt 【O】a great sense of relief 【M】when he finally paid off his student loans<br>📌 搭配：a sense of relief（鬆了一口氣的感覺）<br>📌 片語：pay off（還清債務）；when 引導時間副詞子句"}, {"n": 7, "p": 0, "stem": "The software update will _____ several bugs that users have reported.", "o": ["fit", "fold", "form", "fix"], "a": 3, "exp": "✓ (D) fix（修復）— 這次軟體更新將「修復」使用者回報的多個錯誤。\n❌ (A) fit = 符合、適合，語意不符。\n❌ (B) fold = 摺疊，語意不符。\n❌ (C) form = 形成，語意不符。", "zh": "這次軟體更新將修正使用者回報的幾個程式錯誤。", "sa": "【S】The software update 【V】will fix 【O】several bugs 【M】that users have reported<br>📌 關係代名詞 that 引導形容詞子句修飾 bugs，that 在子句中當 reported 的受詞（可省略）<br>例：the book (that) I bought"}, {"n": 8, "p": 0, "stem": "The company plans to _____ its operations into new international markets next year.", "o": ["expand", "expend", "expel", "expose"], "a": 0, "exp": "✓ (A) expand（擴展）— 該公司計畫明年將業務「擴展」到新的國際市場。\n❌ (B) expend = 花費（金錢、精力），用法與 \"operations into markets\" 不符。\n❌ (C) expel = 驅逐，語意不符。\n❌ (D) expose = 暴露，語意不符。", "zh": "這家公司計畫明年把業務拓展到新的國際市場。", "sa": "【S】The company 【V】plans 【O】to expand its operations 【M】into new international markets／next year<br>📌 句型：plan to V（計畫做……）<br>📌 搭配：expand A into B（把 A 擴展到 B）"}, {"n": 9, "p": 0, "stem": "The witness gave a <i>vivid<\/i> description of the accident, recalling every detail clearly.", "o": ["clear", "vague", "brief", "dull"], "a": 0, "exp": "✓ (A) clear（清楚的）— vivid（生動、鮮明的）在此語境中與 clear（清楚的）意義最接近，皆強調描述細節清晰。\n❌ (B) vague = 模糊的，語意相反。\n❌ (C) brief = 簡短的，與「回憶每個細節」的描述不符。\n❌ (D) dull = 乏味的，語意相反。", "zh": "目擊者對這起事故做了生動（清楚）的描述，清楚回想起每個細節。", "sa": "【S】The witness 【V】gave 【O】a vivid description of the accident 【M】recalling every detail clearly<br>📌 分詞構句：recalling… = and he/she recalled…（主詞相同，改用 V-ing 表伴隨動作）<br>📌 give a description of（描述……）"}, {"n": 10, "p": 0, "stem": "Due to the heavy rain, the organizers decided to <i>postpone<\/i> the outdoor concert until next weekend.", "o": ["announce", "continue", "delay", "cancel"], "a": 2, "exp": "✓ (C) delay（延後）— postpone（延後）與 delay 意義最接近。\n❌ (A) announce = 宣布，語意不符。\n❌ (B) continue = 繼續，語意不符（活動並未繼續舉行，而是延後）。\n❌ (D) cancel = 取消，與「延到下週末」（仍會舉行）的語意不符。", "zh": "由於大雨，主辦單位決定把戶外音樂會延期到下週末。", "sa": "【M】Due to the heavy rain 【S】the organizers 【V】decided 【O】to postpone the outdoor concert 【M】until next weekend<br>📌 due to + 名詞（由於……）<br>📌 句型：decide to V；postpone A until B（把 A 延到 B）"}, {"n": 11, "p": 1, "stem": "Customer: Do you have any gluten-free options?<br>Baker: _____<br>Customer: Great, I'll take two of those, please.", "o": ["We don't bake on Sundays.", "Yes, we have gluten-free muffins right over there.", "Gluten-free food is more expensive.", "I'm not sure what gluten is."], "a": 1, "exp": "✓ (B) Yes, we have gluten-free muffins right over there.— 麵包師回答有無麩質瑪芬，顧客回應「太好了，我要兩個」，前後呼應。\n❌ (A) 說「我們週日不營業」，與顧客回應「我要兩個」不連貫。\n❌ (C) 說「無麩質食品比較貴」，未直接回答是否有相關產品。\n❌ (D) 說「我不確定麩質是什麼」，麵包師不應對自己販售的產品成分一無所知，且與顧客回應不連貫。", "zh": "顧客：你們有無麩質的選擇嗎？<br>麵包師傅：有的，無麩質的瑪芬就在那邊。<br>顧客：太好了，請給我兩個。", "sa": "正解句：【S】we 【V】have 【O】gluten-free muffins 【M】right over there<br>📌 right over there：right 加強語氣，「就在那邊」<br>📌 回應句 I'll take two of those：take 在購物時 =「買、要」"}, {"n": 12, "p": 1, "stem": "Member: Is the pool open this evening?<br>Staff: _____<br>Member: That's earlier than I expected. Thanks for letting me know.", "o": ["The pool closes at 6 PM on weekdays.", "We don't have a pool here.", "The pool is open 24 hours.", "You need a special pass for the pool."], "a": 0, "exp": "✓ (A) The pool closes at 6 PM on weekdays.— 工作人員告知泳池平日6點關閉，會員回應「比我預期的早，謝謝你告訴我」，前後呼應（暗示泳池確實開放，但比期望的時間更早關閉）。\n❌ (B) 說「我們這裡沒有泳池」，與會員回應「比我預期的早」矛盾（若沒有泳池就無從討論時間早晚）。\n❌ (C) 說「泳池24小時開放」，與會員回應「比我預期的早」矛盾（24小時開放就不會「早」關閉）。\n❌ (D) 說「你需要特殊通行證」，與會員回應「比我預期的早，謝謝告知」不連貫（未提及時間）。", "zh": "會員：游泳池今天晚上有開嗎？<br>工作人員：游泳池平日下午 6 點關閉。<br>會員：比我預期的早。謝謝你告訴我。", "sa": "正解句：【S】The pool 【V】closes 【M】at 6 PM on weekdays<br>📌 現在簡單式表「固定時刻表、常態事實」<br>📌 回應句：That's earlier than I expected.（比較級 + than 子句）；Thanks for + V-ing"}, {"n": 13, "p": 1, "stem": "Employee: My computer keeps freezing whenever I open this program.<br>IT staff: _____<br>Employee: Okay, I'll try that and let you know if it happens again.", "o": ["That program was removed last week.", "Try restarting your computer first.", "You should buy a new computer.", "That's strange, it works fine for everyone else."], "a": 1, "exp": "✓ (B) Try restarting your computer first.— IT人員建議先重新啟動電腦，員工回應「好，我會試試看，如果再發生會再告知你」，前後呼應。\n❌ (A) 說「那個程式上週已經被移除了」，與員工描述「每次打開這個程式都會當機」矛盾（若已移除就無法打開）。\n❌ (C) 說「你應該買台新電腦」，與員工回應「我會試試看」（嘗試簡單方法）不連貫。\n❌ (D) 說「這很奇怪，其他人用都正常」，未提供員工可嘗試的解決方法，與「我會試試看」不連貫。", "zh": "員工：每次我打開這個程式，電腦就一直當機。<br>資訊人員：先試著把電腦重新開機。<br>員工：好，我試試看，如果又發生再告訴你。", "sa": "正解句：（祈使句，省略主詞 you）【V】Try 【O】restarting your computer 【M】first<br>📌 try + V-ing（試試看做……）vs. try to V（努力設法做……）<br>📌 keep + V-ing（一直……）；whenever 引導「每當」子句"}, {"n": 14, "p": 1, "stem": "Customer: I'd like to rent a car for the weekend.<br>Staff: _____<br>Customer: A compact car would be perfect.", "o": ["We're out of cars completely.", "What size vehicle are you looking for?", "You'll need an international license.", "The weekend rate is the same as weekdays."], "a": 1, "exp": "✓ (B) What size vehicle are you looking for?— 服務人員詢問顧客想要的車型大小，顧客回答「小型車就很適合」，前後呼應。\n❌ (A) 說「我們的車完全租光了」，與顧客回應「小型車就很適合」矛盾（若無車可租，顧客無法選擇車型）。\n❌ (C) 說「您需要國際駕照」，與顧客回應「小型車就很適合」不連貫。\n❌ (D) 說「週末租金與平日相同」，與顧客回應車型選擇不連貫。", "zh": "顧客：我想租一輛車過週末。<br>店員：您想找多大的車款？<br>顧客：小型車就很完美了。", "sa": "正解句：【O】What size vehicle 【S】are you 【V】looking for?<br>📌 What + 名詞 疑問句（什麼尺寸的車）<br>📌 look for（尋找），介系詞 for 留在句尾<br>📌 I'd like to V = I want to V（較客氣）"}, {"n": 15, "p": 1, "stem": "Friend A: Where should we eat tonight?<br>Friend B: _____<br>Friend A: That sounds perfect, I've been wanting to try that place.", "o": ["I'm not really hungry tonight.", "How about that new Italian restaurant downtown?", "We always eat at the same place.", "I already ate dinner."], "a": 1, "exp": "✓ (B) How about that new Italian restaurant downtown?— 朋友B提議去市中心新開的義大利餐廳，朋友A回應「聽起來太棒了，我一直想去那家店」，前後呼應。\n❌ (A) 說「我今晚不太餓」，與朋友A的熱情回應「聽起來太棒了」矛盾。\n❌ (C) 說「我們總是去同一家店」，與朋友A表示「一直想試試那家新店」不連貫。\n❌ (D) 說「我已經吃過晚餐了」，與討論「今晚要吃什麼」的話題矛盾。", "zh": "朋友 A：我們今晚要去哪裡吃？<br>朋友 B：市中心那間新開的義大利餐廳如何？<br>朋友 A：聽起來太棒了，我一直很想去那家店吃吃看。", "sa": "正解句：How about + 名詞／V-ing?（……如何？用來提議）<br>📌 回應句：I've been wanting to V（現在完成進行式，表「一直很想……」）<br>例：How about going to the movies?"}, {"n": 16, "p": 1, "stem": "Patient: I've been having trouble sleeping lately.<br>Doctor: _____<br>Patient: I usually go to bed around midnight and wake up at 6.", "o": ["That sounds like a great schedule.", "Can you tell me about your sleep schedule?", "You should see a dentist instead.", "Sleep isn't that important."], "a": 1, "exp": "✓ (B) Can you tell me about your sleep schedule?— 醫生詢問病人的睡眠時間表，病人回答自己的作息時間，前後呼應。\n❌ (A) 說「那聽起來是很棒的作息」，與病人主訴「睡眠有困難」矛盾，且病人尚未說明作息時就給出評價不合理。\n❌ (C) 說「你應該去看牙醫」，與「睡眠問題」的主題不連貫。\n❌ (D) 說「睡眠不是那麼重要」，與醫生應有的專業態度及病人接著描述作息的回應不連貫。", "zh": "病人：我最近一直睡不好。<br>醫生：可以跟我說說你的睡眠作息嗎？<br>病人：我通常大約午夜上床，6 點起床。", "sa": "正解句：Can you 【V】tell 【O】me（間接受詞）【M】about your sleep schedule?<br>📌 tell + 人 + about + 事（告訴某人關於某事）<br>📌 have trouble + V-ing（做……有困難），I've been having 為現在完成進行式"}, {"n": 17, "p": 1, "stem": "Student: Can I renew this book online?<br>Librarian: _____<br>Student: Perfect, I'll do that tonight.", "o": ["No, you must return it in person.", "That book has been removed from our collection.", "Yes, just log in to your account and click renew.", "Books cannot be renewed more than once."], "a": 2, "exp": "✓ (C) Yes, just log in to your account and click renew.— 圖書館員說明線上續借的方法，學生回應「太好了，我今晚就去做」，前後呼應。\n❌ (A) 說「不行，您必須親自到館歸還」，與學生回應「我今晚就去做」（暗示能在家完成）矛盾。\n❌ (B) 說「那本書已經從館藏中移除」，與學生詢問續借該書的情境矛盾。\n❌ (D) 說「書籍不能續借超過一次」，未直接回答「能否線上續借」的問題。", "zh": "學生：我可以在線上續借這本書嗎？<br>圖書館員：可以，只要登入你的帳號，然後點選「續借」。<br>學生：太好了，我今晚就來辦。", "sa": "正解句：（祈使句）just 【V】log in to 【O】your account and 【V】click 【O】renew<br>📌 兩個祈使動詞以 and 連接<br>📌 log in to（登入）；renew（續借、更新）"}, {"n": 18, "p": 1, "stem": "Coworker A: Do you think we'll finish the report by Friday?<br>Coworker B: _____<br>Coworker A: Okay, let's ask for an extra day then.", "o": ["We finished it yesterday.", "It's going to be tight, but possible.", "Friday isn't a real deadline.", "I think we need more time than that."], "a": 3, "exp": "✓ (D) I think we need more time than that.— 同事B表示需要更多時間，同事A回應「好，那我們申請延一天」，前後呼應。\n❌ (A) 說「我們昨天就完成了」，與A接著提議「申請延一天」矛盾（已完成則不需延期）。\n❌ (B) 說「會有點緊，但是有可能」，與A回應「那我們申請延一天」不連貫（若可能完成，通常不會立即提議延期）。\n❌ (C) 說「星期五又不是真正的期限」，與A接著討論申請延期的回應不連貫。", "zh": "同事 A：你覺得我們星期五前能完成報告嗎？<br>同事 B：我想我們需要比那更多的時間。<br>同事 A：好，那我們就請求多延一天吧。", "sa": "正解句：【S】I 【V】think （that）【S】we 【V】need 【O】more time than that<br>📌 think 後接省略 that 的名詞子句<br>📌 let's + V（我們來……吧）；by Friday 的 by 表「在……之前」"}, {"n": 19, "p": 1, "stem": "Customer: I'm looking for paint for my bedroom walls.<br>Clerk: _____<br>Customer: I'll go with the lighter shade then.", "o": ["We don't sell paint here.", "What color are you thinking of?", "Light colors make small rooms look bigger.", "Painting is a difficult job."], "a": 2, "exp": "✓ (C) Light colors make small rooms look bigger.— 店員提供關於淺色調的建議，顧客回應「那我就選淺色的」，前後呼應。\n❌ (A) 說「我們這裡不賣油漆」，與顧客詢問油漆的情境矛盾。\n❌ (B) 說「您想要什麼顏色？」，與顧客回應「那我就選淺色的」雖然語意上可接受，但問句並未提供任何具體建議讓顧客做出「那」（then）的決定；(C) 直接給出淺色的優點，更能引出顧客「那我就選淺色」的結論。\n❌ (D) 說「油漆是件困難的工作」，與顧客選擇顏色的話題不連貫。", "zh": "顧客：我想找臥室牆壁用的油漆。<br>店員：淺色會讓小房間看起來比較大。<br>顧客：那我就選淺一點的色調。", "sa": "正解句：【S】Light colors 【V】make 【O】small rooms 【C】look bigger<br>📌 使役動詞 make + O + 原形動詞（使……）<br>📌 go with（選擇、決定採用）<br>例：Music makes me feel relaxed."}, {"n": 20, "p": 1, "stem": "Passenger: Can I get a window seat?<br>Agent: _____<br>Passenger: That's fine, thank you.", "o": ["I'm afraid all window seats are taken, but I have an aisle seat available.", "Window seats cost extra on this flight.", "This flight is fully booked.", "You already have a window seat."], "a": 0, "exp": "✓ (A) I'm afraid all window seats are taken, but I have an aisle seat available.— 地勤人員表示靠窗座位已滿，但可提供走道座位，乘客回應「沒關係，謝謝」，表示接受替代方案，前後呼應。\n❌ (B) 說「靠窗座位需要加價」，與乘客回應「沒關係，謝謝」（未提及付費）不連貫。\n❌ (C) 說「這個航班已經滿座」，與地勤人員後續提供座位的可能性矛盾。\n❌ (D) 說「您已經有靠窗座位了」，與乘客詢問「能不能要靠窗座位」矛盾（暗示乘客原本沒有）。", "zh": "乘客：我可以要靠窗的座位嗎？<br>地勤人員：恐怕靠窗座位都已經被選走了，不過我還有走道座位。<br>乘客：沒關係，謝謝你。", "sa": "正解句：I'm afraid （that）【S】all window seats 【V】are taken, but 【S】I 【V】have 【O】an aisle seat 【M】available<br>📌 I'm afraid + 子句：委婉告知壞消息（恐怕……）<br>📌 be taken（被占用）；available 置於名詞後修飾"}, {"n": 21, "p": 2, "stem": "(21)", "o": ["were", "was", "are", "is"], "a": 0, "exp": "✓ (A) were（過去式被動，複數）— \"letters were carried by horse-riders\" 表示「信件被騎馬的人運送」，主詞 letters 為複數，且信件是被運送的對象，須用被動語態 be動詞 + 過去分詞，過去時態搭配複數主詞為 were。\n❌ (B) was = 過去式 be動詞單數形，與複數主詞 letters 不一致。\n❌ (C) are = 現在式，與全文描述「早期郵政」的過去時間不符。\n❌ (D) is = 現在式單數，與複數主詞及過去時間皆不符。", "zh": "<i>In the early days of postal delivery, letters <b>were<\/b> carried by horse-riders who traveled long distances between towns, often facing difficult weather and rough roads.<\/i><br>在郵政遞送的早期，信件是由騎馬的信差運送，他們往返於城鎮之間長途跋涉，常常面對惡劣的天氣和崎嶇的道路。", "sa": "【S】letters 【V】were carried 【M】by horse-riders who traveled…<br>📌 過去式被動語態：was/were + p.p.（主詞 letters 複數用 were）<br>📌 who 引導形容詞子句修飾 horse-riders；often facing… 為分詞構句表伴隨狀況"}, {"n": 22, "p": 2, "stem": "(22)", "o": ["transport", "transporting", "to be transported", "transported"], "a": 2, "exp": "✓ (C) to be transported（不定詞被動式）— \"mail began to be transported by train\" 表示「郵件開始被火車運送」，mail 是被運送的對象，begin 後接不定詞，且須用被動式表示「被運送」。\n❌ (A) transport = 主動原形，begin 後不可直接接原形動詞，且與被動語意不符。\n❌ (B) transporting = 主動現在分詞，與被動語意不符。\n❌ (D) transported = 過去分詞，begin 後須接不定詞或動名詞，不能直接接過去分詞。", "zh": "<i>As railroads expanded across the country, mail began <b>to be transported<\/b> by train, which significantly reduced delivery times.<\/i><br>隨著鐵路擴展到全國各地，郵件開始改由火車運送，這大幅縮短了遞送時間。", "sa": "【M】As railroads expanded… 【S】mail 【V】began 【O】to be transported by train<br>📌 不定詞被動式：to be + p.p.（begin to be done 開始被……）<br>📌 , which 引導非限定關係子句，補充說明前面整件事"}, {"n": 23, "p": 2, "stem": "(23)", "o": ["that", "who", "whom", "whose"], "a": 0, "exp": "✓ (A) that（關係代名詞，指事物，作主格）— \"a letter that could take weeks to arrive\" 中，that 代替先行詞 a letter（事物），在子句中作主詞，引導形容詞子句修飾 a letter。\n❌ (B) who = 用於指人，letter 為事物，不適用。\n❌ (C) whom = 用於指人且作受格，不適用。\n❌ (D) whose = 所有格關係代名詞，此處子句缺的是主詞而非所有格修飾語，不符。", "zh": "<i>By the time air mail services were introduced, a letter <b>that<\/b> could take weeks to arrive could now reach its destination within a day or two.<\/i><br>到了航空郵件服務問世時，一封過去可能要花好幾週才能寄達的信，現在一兩天內就能送到目的地。", "sa": "【S】a letter (that could take weeks to arrive) 【V】could reach 【O】its destination 【M】within a day or two<br>📌 關係代名詞 that 當主格，修飾 a letter（事物）<br>📌 by the time + 子句（到……的時候）；take + 時間 + to V（花多少時間做……）"}, {"n": 24, "p": 2, "stem": "(24)", "o": ["play", "to play", "played", "plays"], "a": 1, "exp": "✓ (B) to play（不定詞）— \"postal services continue to play important roles\" 表示「郵政服務持續扮演重要角色」，continue 後可接不定詞 to + 動詞原形，表示「持續做某事」。\n❌ (A) play = 動詞原形，continue 後不可直接接原形動詞。\n❌ (C) played = 過去式/過去分詞，continue 後不可直接接此形式。\n❌ (D) plays = 第三人稱單數現在式，continue 後不可直接接此形式。", "zh": "<i>Today, although most communication happens electronically, postal services continue <b>to play<\/b> important roles such as delivering packages and official documents.<\/i><br>如今，雖然大部分的溝通都透過電子方式進行，郵政服務仍持續扮演重要角色，例如遞送包裹和官方文件。", "sa": "【M】although… 【S】postal services 【V】continue 【O】to play important roles<br>📌 continue to V／V-ing（持續做……）<br>📌 play a role（扮演角色）；such as + 例子（例如）"}, {"n": 25, "p": 2, "stem": "(25)", "o": ["consolidate", "consolidating", "to consolidate", "consolidated"], "a": 1, "exp": "✓ (B) consolidating（動名詞）— \"important for consolidating information\" 中，介系詞 for 後須接動名詞，consolidate 表示「鞏固、強化」，\"consolidating information\" 表示「鞏固記憶資訊」。\n❌ (A) consolidate = 動詞原形，不可直接接在介系詞 for 之後。\n❌ (C) to consolidate = 不定詞，介系詞後不可接不定詞。\n❌ (D) consolidated = 過去分詞，不可直接接在介系詞 for 之後作為其受詞。", "zh": "<i>…research now suggests that sleep is especially important for <b>consolidating<\/b> information that has been learned during the day.<\/i><br>……但現在的研究顯示，睡眠對於鞏固白天所學到的資訊特別重要。", "sa": "【S】research 【V】suggests 【O】that sleep is especially important for consolidating information<br>📌 介系詞 for + 動名詞 V-ing<br>📌 that has been learned 為關係子句（現在完成被動）修飾 information"}, {"n": 26, "p": 2, "stem": "(26)", "o": ["to strengthen", "strengthening", "strengthen", "strengthened"], "a": 0, "exp": "✓ (A) to strengthen（不定詞）— \"the brain appears to strengthen connections between neurons\" 表示「大腦似乎會強化神經元之間的連結」，\"appear to V\" 為固定用法，表示「似乎……」。\n❌ (B) strengthening = 動名詞，\"appear\" 後不可直接接動名詞。\n❌ (C) strengthen = 動詞原形，\"appear\" 後不可直接接原形動詞，須用 to-V。\n❌ (D) strengthened = 過去式/過去分詞，\"appear\" 後不可直接接此形式。", "zh": "<i>During certain stages of sleep, the brain appears <b>to strengthen<\/b> connections between neurons, a process that helps move information from short-term to long-term memory.<\/i><br>在睡眠的某些階段，大腦似乎會強化神經元之間的連結，這個過程有助於把資訊從短期記憶轉移到長期記憶。", "sa": "【S】the brain 【V】appears 【C】to strengthen connections between neurons<br>📌 appear to V（似乎……）<br>📌 a process that… 為同位語，補充說明前面整件事；help (to) V 可省略 to"}, {"n": 27, "p": 2, "stem": "(27)", "o": ["who", "which", "whom", "whose"], "a": 0, "exp": "✓ (A) who（關係代名詞，指人，作主格）— \"Students who stay up all night studying\" 中，who 代替先行詞 Students（人），在子句中作主詞，引導形容詞子句修飾 Students。\n❌ (B) which = 用於指事物，Students 為人，不適用。\n❌ (C) whom = 用於作受格，但此處子句缺的是主詞，不適用。\n❌ (D) whose = 所有格關係代名詞，此處子句缺的是主詞而非所有格修飾語，不符。", "zh": "<i>Students <b>who<\/b> stay up all night studying before an exam may actually perform worse than those who get a full night's sleep, even if the latter group studied for fewer hours overall.<\/i><br>考試前熬夜念書的學生，實際上可能比一整晚睡飽的學生表現得更差，即使後者總共念書的時數較少。", "sa": "【S】Students (who stay up all night studying…) 【V】may perform 【M】worse than those who…<br>📌 who 當主格修飾 Students；stay up + V-ing（熬夜做……）<br>📌 those who（那些……的人）；even if（即使）；the latter（後者）"}, {"n": 28, "p": 2, "stem": "(28)", "o": ["over", "above", "below", "under"], "a": 0, "exp": "✓ (A) over（優先於……）— \"prioritize sleep over cramming\" 為固定用法 \"prioritize A over B\"，表示「將A看得比B更重要、優先考慮A」。\n❌ (B) above = 字面意思為「在……之上」，不構成 \"prioritize... above...\" 的慣用搭配。\n❌ (C) below = 在……之下，與「優先考慮睡眠」的語意相反。\n❌ (D) under = 在……之下，與「優先考慮睡眠」的語意相反。", "zh": "<i>For this reason, many sleep researchers recommend that students prioritize sleep <b>over<\/b> cramming in the days before an important test.<\/i><br>因此，許多睡眠研究者建議，在重要考試前幾天，學生應該把睡眠看得比臨時抱佛腳更優先。", "sa": "【S】many sleep researchers 【V】recommend 【O】that students (should) prioritize sleep over cramming<br>📌 prioritize A over B（把 A 優先於 B）<br>📌 recommend that + S + (should) 原形動詞（建議用法，should 可省略）"}, {"n": 29, "p": 3, "stem": "What change is the library making?", "o": ["Increasing late fees.", "Eliminating late fees for overdue books.", "Closing on weekends.", "Charging a fee to join the library."], "a": 1, "exp": "公告提到：「our library will no longer charge late fees for overdue books」\n(B) Eliminating late fees for overdue books. ✓ 為正解。\n❌ (A) 公告說的是「不再收取」逾期費，並非提高。\n❌ (C) 公告未提到週末閉館。\n❌ (D) 公告未提到入會費。", "zh": "題目：圖書館正在做出什麼改變？<br>(A) 提高逾期罰款。<br>(B) 取消逾期書籍的罰款。<br>(C) 週末閉館。<br>(D) 收取入館（加入會員）費用。", "sa": "問句：What change 【S】is the library 【V】making?（現在進行式表即將進行的安排）<br>依據句：【S】our library 【V】will no longer charge 【O】late fees 【M】for overdue books<br>📌 no longer（不再）；charge + 費用（收取費用）"}, {"n": 30, "p": 3, "stem": "What happens if an item is more than 30 days overdue?", "o": ["The borrower is banned from the library.", "The item is automatically renewed.", "The borrower is charged the replacement cost.", "The fine doubles every week."], "a": 2, "exp": "公告提到：「Materials that are more than 30 days overdue will simply be marked as lost, and the borrower will be charged the replacement cost of the item.」\n(C) The borrower is charged the replacement cost. ✓ 為正解。\n❌ (A) 公告未提到禁止借閱者使用圖書館。\n❌ (B) 公告說超過30天會被標記為遺失，並非自動續借。\n❌ (D) 公告說的是不再收取逾期費，與「罰款每週加倍」的描述矛盾。", "zh": "題目：如果一件資料逾期超過 30 天，會發生什麼事？<br>(A) 借閱者被禁止使用圖書館。<br>(B) 該資料會自動續借。<br>(C) 借閱者要支付該物品的重置費用。<br>(D) 罰款每週加倍。", "sa": "依據句：【S】Materials (that are more than 30 days overdue) 【V】will be marked 【C】as lost, and 【S】the borrower 【V】will be charged 【O】the replacement cost<br>📌 未來式被動：will be + p.p.<br>📌 charge + 人 + 費用 → 被動 人 + be charged + 費用"}, {"n": 31, "p": 3, "stem": "Why does Sam need a ride?", "o": ["His car won't start.", "He missed the bus.", "His license was suspended.", "He sold his car."], "a": 0, "exp": "Sam 說：「My car won't start this morning. Can you give me a ride to work?」\n(A) His car won't start. ✓ 為正解。\n❌ (B) 對話未提到錯過公車。\n❌ (C) 對話未提到駕照被吊銷。\n❌ (D) 對話未提到賣車；Sam後續還說要在午餐時間找技師處理車子。", "zh": "題目：Sam 為什麼需要搭便車？<br>(A) 他的車發不動。<br>(B) 他錯過了公車。<br>(C) 他的駕照被吊扣。<br>(D) 他把車賣了。", "sa": "依據句：【S】My car 【V】won't start 【M】this morning.<br>📌 won't 在此表「（東西）就是不肯／無法……」<br>📌 give + 人 + a ride（載某人一程）"}, {"n": 32, "p": 3, "stem": "What does Sam plan to do during lunch?", "o": ["Buy a new car.", "Call a mechanic.", "Pick up Alex.", "Take a nap."], "a": 1, "exp": "Sam 說：「I'll call a mechanic during lunch.」\n(B) Call a mechanic. ✓ 為正解。\n❌ (A) 對話未提到買新車。\n❌ (C) 是Alex要去接Sam，並非Sam去接Alex。\n❌ (D) 對話未提到午睡。", "zh": "題目：Sam 打算在午餐時間做什麼？<br>(A) 買一輛新車。<br>(B) 打電話給修車技師。<br>(C) 去接 Alex。<br>(D) 小睡一下。", "sa": "依據句：【S】I 【V】'll call 【O】a mechanic 【M】during lunch.<br>📌 will 表臨時決定要做的事<br>📌 during + 名詞（在……期間）"}, {"n": 33, "p": 3, "stem": "What is one advantage of vertical farming mentioned in the passage?", "o": ["It requires no electricity at all.", "Crops can be produced year-round regardless of weather.", "It is cheaper to build than traditional farms.", "It can grow all types of crops equally well."], "a": 1, "exp": "文中提到：「vertical farms can produce crops year-round regardless of outside weather conditions」\n(B) Crops can be produced year-round regardless of weather. ✓ 為正解。\n❌ (A) 文中說人工照明會消耗大量電力，並非完全不需電力。\n❌ (C) 文中說垂直農場的初期建造成本「遠高於」傳統農場，並非更便宜。\n❌ (D) 文中說垂直農場目前最適合種植葉菜類與香草，並非所有作物都能種植得一樣好。", "zh": "題目：文中提到垂直農業的一項優點是什麼？<br>(A) 它完全不需要用電。<br>(B) 不論天氣如何，全年都能生產作物。<br>(C) 它的興建成本比傳統農場便宜。<br>(D) 它能把所有種類的作物都種得一樣好。", "sa": "依據句：【S】vertical farms 【V】can produce 【O】crops 【M】year-round regardless of outside weather conditions<br>📌 regardless of + 名詞（不論……）<br>📌 By + V-ing（藉由……）放句首表方法"}, {"n": 34, "p": 3, "stem": "What challenge does vertical farming face, according to the passage?", "o": ["It uses too much land.", "The artificial lighting consumes large amounts of electricity.", "It cannot be located near cities.", "It produces lower-quality vegetables."], "a": 1, "exp": "文中提到：「The artificial lighting required to grow plants indoors consumes large amounts of electricity」\n(B) The artificial lighting consumes large amounts of electricity. ✓ 為正解。\n❌ (A) 文中未提到使用過多土地；事實上垂直農場的優勢之一就是節省土地空間。\n❌ (C) 文中說垂直農場通常「靠近城市」，並非無法設置在城市附近。\n❌ (D) 文中未提到蔬菜品質較低。", "zh": "題目：根據本文，垂直農業面臨什麼挑戰？<br>(A) 它使用太多土地。<br>(B) 人工照明消耗大量電力。<br>(C) 它無法設在城市附近。<br>(D) 它生產的蔬菜品質較差。", "sa": "依據句：【S】The artificial lighting (required to grow plants indoors) 【V】consumes 【O】large amounts of electricity<br>📌 過去分詞片語 required… 後位修飾 lighting（= which is required）<br>📌 according to（根據）"}, {"n": 35, "p": 3, "stem": "What types of crops are currently best suited to vertical farming?", "o": ["Wheat and rice.", "Fruit trees.", "Leafy greens and herbs.", "Root vegetables like potatoes."], "a": 2, "exp": "文中提到：「vertical farms are currently best suited to growing leafy greens and herbs」\n(C) Leafy greens and herbs. ✓ 為正解。\n❌ (A) 文中說小麥和稻米等主要糧食作物「難以」在室內獲利種植，並非最適合。\n❌ (B) 文中未提到果樹。\n❌ (D) 文中未提到根莖類蔬菜如馬鈴薯。", "zh": "題目：目前哪些類型的作物最適合垂直農業？<br>(A) 小麥和稻米。<br>(B) 果樹。<br>(C) 葉菜類和香草。<br>(D) 像馬鈴薯這樣的根莖類蔬菜。", "sa": "依據句：【S】vertical farms 【V】are 【C】currently best suited to growing leafy greens and herbs<br>📌 be suited to + N／V-ing（適合……），to 是介系詞<br>📌 while 表對比：staple crops… remain difficult to grow"}, {"n": 36, "p": 3, "stem": "What is a \"digital detox,\" according to the passage?", "o": ["A type of software that blocks websites.", "A period of deliberately avoiding digital devices.", "A new kind of smartphone.", "A class on how to use social media."], "a": 1, "exp": "文中提到：「a 'digital detox' — a period of time during which a person deliberately avoids using digital devices」\n(B) A period of deliberately avoiding digital devices. ✓ 為正解。\n❌ (A) 文中未提到封鎖網站的軟體。\n❌ (C) 文中未提到新型智慧型手機。\n❌ (D) 文中未提到關於如何使用社群媒體的課程。", "zh": "題目：根據本文，什麼是「數位排毒」？<br>(A) 一種封鎖網站的軟體。<br>(B) 一段刻意避免使用數位裝置的時間。<br>(C) 一種新型智慧型手機。<br>(D) 一堂教人如何使用社群媒體的課。", "sa": "依據句：a \"digital detox\" — a period of time 【M】during which a person deliberately avoids using digital devices<br>📌 破折號後為同位語，解釋 digital detox<br>📌 介系詞 + which（during which = 在這段時間內）；avoid + V-ing"}, {"n": 37, "p": 3, "stem": "What benefit do advocates of digital detoxes report?", "o": ["Earning more money.", "Feeling less anxious and sleeping better.", "Improving their typing speed.", "Receiving more notifications."], "a": 1, "exp": "文中提到：「Advocates of digital detoxes report feeling less anxious, sleeping better, and being more present in conversations」\n(B) Feeling less anxious and sleeping better. ✓ 為正解。\n❌ (A) 文中未提到賺更多錢。\n❌ (C) 文中未提到打字速度提升。\n❌ (D) 文中說數位排毒是「避免」使用數位裝置，與「收到更多通知」相反。", "zh": "題目：提倡數位排毒的人表示有什麼好處？<br>(A) 賺更多錢。<br>(B) 比較不焦慮、睡得比較好。<br>(C) 打字速度變快。<br>(D) 收到更多通知。", "sa": "依據句：【S】Advocates of digital detoxes 【V】report 【O】feeling less anxious, sleeping better, and being more present…<br>📌 report + V-ing（表示／說自己……）<br>📌 三個動名詞片語對等並列"}, {"n": 38, "p": 3, "stem": "What do some researchers suggest instead of eliminating screen time entirely?", "o": ["Buying a more expensive phone.", "Using technology more intentionally.", "Avoiding all social media permanently.", "Spending more time watching television."], "a": 1, "exp": "文中提到：「these researchers suggest that people focus on using technology more intentionally」\n(B) Using technology more intentionally. ✓ 為正解。\n❌ (A) 文中未提到購買更貴的手機。\n❌ (C) 文中說研究者認為完全避免科技「不一定現實或必要」，並非建議永久避免所有社群媒體。\n❌ (D) 文中未提到花更多時間看電視；事實上文中討論的是減少螢幕使用時間的方式。", "zh": "題目：有些研究者建議用什麼方式取代完全消除螢幕時間？<br>(A) 買一支更貴的手機。<br>(B) 更有意識（有目的）地使用科技。<br>(C) 永久避開所有社群媒體。<br>(D) 花更多時間看電視。", "sa": "依據句：【M】Rather than eliminating screen time entirely, 【S】these researchers 【V】suggest 【O】that people focus on using technology more intentionally<br>📌 rather than + V-ing（而不是……）<br>📌 focus on + V-ing（專注於……）"}, {"n": 39, "p": 3, "stem": "What problem did Mei's neighbors often complain about?", "o": ["The lack of parking near the community center.", "The high cost of buying seeds and seedlings every spring.", "The poor quality of soil in the area.", "The lack of gardening space in their yards."], "a": 1, "exp": "文中提到：「many of her neighbors enjoyed gardening but often complained about the high cost of buying seeds and seedlings every spring」\n(B) The high cost of buying seeds and seedlings every spring. ✓ 為正解。\n❌ (A) 文中未提到社區中心附近缺乏停車位。\n❌ (C) 文中未提到當地土壤品質不佳。\n❌ (D) 文中未提到鄰居家中缺乏園藝空間。", "zh": "題目：Mei 的鄰居常常抱怨什麼問題？<br>(A) 社區中心附近缺乏停車位。<br>(B) 每年春天購買種子和幼苗的高昂花費。<br>(C) 當地土壤品質不佳。<br>(D) 自家院子缺乏園藝空間。", "sa": "依據句：【S】many of her neighbors 【V】enjoyed 【O】gardening but often 【V】complained about 【O】the high cost of buying seeds and seedlings<br>📌 enjoy + V-ing；complain about + N（抱怨……）"}, {"n": 40, "p": 3, "stem": "What were participants encouraged to do at the end of the growing season?", "o": ["Sell their extra vegetables.", "Save seeds from their plants to share the following year.", "Return any unused seeds for a refund.", "Donate money to the community center."], "a": 1, "exp": "文中提到：「were encouraged to save seeds from their own plants at the end of the growing season to share the following year」\n(B) Save seeds from their plants to share the following year. ✓ 為正解。\n❌ (A) 文中未提到販售多餘蔬菜。\n❌ (C) 文中未提到退費機制。\n❌ (D) 文中未提到捐款給社區中心。", "zh": "題目：參與者被鼓勵在生長季結束時做什麼？<br>(A) 賣掉多餘的蔬菜。<br>(B) 從自己的植物收集種子，隔年拿來分享。<br>(C) 退回沒用到的種子以取得退款。<br>(D) 捐錢給社區中心。", "sa": "依據句：…【V】were encouraged 【C】to save seeds from their own plants… to share the following year<br>📌 encourage + 人 + to V → 被動 be encouraged to V（被鼓勵去……）<br>📌 to share 表目的"}, {"n": 41, "p": 3, "stem": "How did the seed library become official?", "o": ["The town government required it.", "The librarian offered Mei a shelf inside the library.", "Mei opened her own store.", "A national organization took over the project."], "a": 1, "exp": "文中提到：「The local librarian eventually offered Mei a small shelf inside the library itself, turning the project into an official 'seed library'」\n(B) The librarian offered Mei a shelf inside the library. ✓ 為正解。\n❌ (A) 文中未提到鎮政府要求設立種子庫。\n❌ (C) 文中未提到Mei開設自己的商店。\n❌ (D) 文中未提到全國性組織接管此計畫。", "zh": "題目：種子圖書館是怎麼成為正式機構的？<br>(A) 鎮公所要求設立。<br>(B) 圖書館員在館內提供 Mei 一個架子。<br>(C) Mei 開了自己的店。<br>(D) 一個全國性組織接手了這個計畫。", "sa": "依據句：【S】The local librarian 【V】offered 【O】Mei 【O】a small shelf…, turning the project into an official \"seed library\"<br>📌 offer + 人 + 物（雙受詞）<br>📌 分詞構句 turning A into B（把 A 變成 B）表結果"}, {"n": 42, "p": 3, "stem": "What does Mei do each spring now?", "o": ["She sells seeds for profit.", "She teaches workshops on seed-saving for beginners.", "She moves to a different town.", "She stops participating in the project."], "a": 1, "exp": "文中提到：「Mei now spends time each spring teaching workshops on seed-saving for beginners」\n(B) She teaches workshops on seed-saving for beginners. ✓ 為正解。\n❌ (A) 文中強調種子是「免費」分享，並未說Mei藉此營利。\n❌ (C) 文中未提到Mei搬到別的城鎮。\n❌ (D) 文中說Mei仍持續參與並推廣此計畫，並未停止。", "zh": "題目：Mei 現在每年春天會做什麼？<br>(A) 她賣種子賺錢。<br>(B) 她為初學者開設保存種子的工作坊。<br>(C) 她搬到另一個城鎮。<br>(D) 她不再參與這個計畫。", "sa": "依據句：【S】Mei 【V】now spends 【O】time 【M】each spring teaching workshops on seed-saving for beginners<br>📌 spend + 時間 + V-ing（花時間做……）<br>例：I spend an hour reading every day."}];
const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "為了維護公共安全，民眾不應該在公園裡放煙火。<br><span class=\"blankline\">To maintain public s<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① , people should not set off f<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>②works in the park.<\/span>", "ans": "① <b>safety<\/b>　② <b>fire<\/b>", "exp": "① safety（安全）— 依提示字首 s 及句意「為了維護公共安全」。\n② fire（火）— 依提示字首 f 及句意，與 works 組成 \"fireworks\"（煙火），對應「不應該在公園裡放煙火」。", "zh": "為了維護公共安全（safety），民眾不應該在公園裡放煙火（fireworks）。<br>參考：To maintain public <b>safety<\/b>, people should not set off <b>fire<\/b>works in the park.", "sa": "【M】To maintain public safety 【S】people 【V】should not set off 【O】fireworks 【M】in the park<br>📌 To V 放句首表目的（為了……）<br>📌 set off fireworks（放煙火）；should not + 原形V"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>known / for many years / this bakery / for its delicious bread / has been<\/i>", "ans": "This bakery has been known for its delicious bread for many years.", "exp": "句構：主詞 (This bakery) + has been known（現在完成被動式，表示「一直以來都以……著稱」）+ for its delicious bread（介系詞片語，表示「以其美味的麵包」）+ for many years（時間副詞，表示「多年來」）。", "zh": "這家麵包店多年來一直以美味的麵包聞名。", "sa": "【S】This bakery 【V】has been known 【M】for its delicious bread／for many years<br>📌 be known for（以……聞名）＋現在完成式 has been（表從過去持續到現在）<br>📌 for + 一段時間 與完成式連用<br>例：The town has been known for its tea for decades."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>如果你想要進步，就必須每天練習。", "ans": "If you want to improve, you must practice every day.", "exp": "重點結構：If you want to improve（條件子句，表示「如果你想要進步」）；you must practice every day（主要子句，must + 動詞原形，表示「必須每天練習」）。", "zh": "題意：如果你想要進步，就必須每天練習。", "sa": "【M】If you want to improve, 【S】you 【V】must practice 【M】every day<br>📌 If 條件子句（現在式）＋主要子句；want to V<br>📌 must + 原形動詞（必須）<br>📌 every day（每天，副詞）≠ everyday（日常的，形容詞）"}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]+ptrHtml(String(q.n)); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});

});</script>

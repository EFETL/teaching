<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}

.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}

details.ptr summary::-webkit-details-marker{display:none}

details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}

.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}
</style>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題<\/h3>\nTaiwan's indigenous peoples (原住民族) have a rich cultural heritage that includes unique languages, music, weaving, and traditional ceremonies. There are currently 16 officially <span class=\"blk\">21<\/span> indigenous groups in Taiwan, each with its own distinct traditions. In recent years, the government has made efforts to preserve and promote indigenous cultures. For example, indigenous languages are now <span class=\"blk\">22<\/span> in some schools as part of the regular curriculum. Festivals such as the Amis Harvest Festival (豐年祭) attract both local and international visitors every year, providing a <span class=\"blk\">23<\/span> for indigenous communities to showcase their traditions. However, many indigenous leaders note that economic challenges and urbanization continue to threaten their way of life. Young people often move to cities for work, making it harder to <span class=\"blk\">24<\/span> traditional practices from one generation to the next.<\/div>", "25": "<div class=\"passage\"><h3>第 25–28 題<\/h3>\nSleep is one of the most important factors in maintaining good health, yet many people worldwide do not get enough of it. Adults are generally recommended to get between seven and nine hours of sleep <span class=\"blk\">25<\/span>. Lack of sleep has been linked to a wide range of health problems, including heart disease, obesity, and weakened immunity. Research also shows that poor sleep affects memory and concentration. <span class=\"blk\">26<\/span>, teenagers are particularly vulnerable, as their developing brains require even more rest than adults. Unfortunately, the widespread use of smartphones and social media has made it harder for young people to fall asleep. The blue light emitted by screens <span class=\"blk\">27<\/span> the production of melatonin (褪黑激素), a hormone that helps regulate sleep. Experts recommend avoiding screens for at least one hour before bed and keeping a consistent sleep schedule <span class=\"blk\">28<\/span> one falls asleep more easily over time.<\/div>", "29": "<div class=\"passage\"><h3>第 29–30 題<\/h3>\n<i>Read the schedule below and answer the questions.<\/i><br><br>\n<b>Sunrise Fitness Studio &ndash; Weekly Class Schedule<\/b>\n<table style=\"width:100%;border-collapse:collapse;margin:10px 0;font-size:1rem;\">\n<tr style=\"background:#ffe9c9;\"><th style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Class<\/th><th style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Day<\/th><th style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Time<\/th><th style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Instructor<\/th><th style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Level<\/th><\/tr>\n<tr><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Yoga<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Mon / Fri<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">7:00&ndash;8:00 AM<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Ms. Lin<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Beginner<\/td><\/tr>\n<tr><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Pilates<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Tue / Thu<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">6:30&ndash;7:30 PM<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Mr. Chen<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Intermediate<\/td><\/tr>\n<tr><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Zumba<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Wed / Sat<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">10:00&ndash;11:00 AM<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Ms. Wang<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">All levels<\/td><\/tr>\n<tr><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Strength Training<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Mon / Fri<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">5:30&ndash;6:30 PM<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Mr. Lee<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Advanced<\/td><\/tr>\n<tr><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Swimming<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Sat / Sun<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">9:00&ndash;10:30 AM<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">Ms. Huang<\/td><td style=\"border:1px solid #ffd9a8;padding:5px 6px;\">All levels<\/td><\/tr>\n<\/table>\n<i>Note: All classes require registration at least 24 hours in advance. Classes with fewer than 5 registered participants will be cancelled.<\/i><\/div>", "31": "<div class=\"passage\"><h3>第 31–32 題<\/h3>\n<i>Read the following web post and answer the questions.<\/i>\n<div class=\"email-h\">TechHelp Community Forum&nbsp;&nbsp;|&nbsp;&nbsp;Thread: My new laptop won't connect to Wi-Fi &ndash; please help!&nbsp;&nbsp;|&nbsp;&nbsp;Posted by: user2468<\/div>\nHi everyone! I just bought a new laptop and for some reason it can't connect to my home Wi-Fi. It shows the network name, but every time I try to connect, it says &ldquo;Connection failed.&rdquo; My phone and tablet work fine on the same network. I've already tried restarting the laptop and the router. Not sure what else to do. Any advice?<br><br>\n<b>Reply from TechGuru99:<\/b><br>\nHi! Try forgetting the network on your laptop and then reconnecting fresh. If that doesn't work, check if your laptop's Wi-Fi driver needs an update. You can do this by going to Device Manager and looking for &ldquo;Network Adapters.&rdquo; Right-click and choose &ldquo;Update driver.&rdquo; Let us know how it goes!<br><br>\n<b>Reply from helper_tom:<\/b><br>\nAlso, make sure the date and time settings on your new laptop are correct. Incorrect time settings can sometimes prevent a successful connection.<\/div>", "33": "<div class=\"passage\"><h3>第 33–35 題<\/h3>\nCoffee is one of the most popular beverages in the world, and Taiwan has developed a rich coffee culture of its own. While many Taiwanese consumers still enjoy instant coffee or chain caf&eacute; drinks, a growing number of coffee lovers are turning to specialty coffee &mdash; high-quality beans that are carefully grown, processed, and brewed.<br><br>\nTaiwan even grows its own specialty coffee, primarily in mountainous regions such as Alishan (阿里山) and the Da-wu Mountain area (大武山). Taiwanese coffee farmers have won international recognition in recent years, with some beans earning top rankings at global competitions. The high altitude, misty climate, and rich soil of these regions create ideal growing conditions.<br><br>\nThe rise of specialty coffee in Taiwan has given birth to a new generation of skilled baristas. Coffee competitions such as the Taiwan Barista Championship draw attention from across Asia. Young professionals invest significant time learning about bean origins, extraction techniques, and flavor profiles.<br><br>\nHowever, specialty coffee remains more expensive than mass-market options, and some consumers find the culture intimidating. Supporters of the movement argue that once people try a well-prepared cup of specialty coffee, they quickly understand why it is worth the price.<\/div>", "36": "<div class=\"passage\"><h3>第 36–38 題<\/h3>\nAnimal-assisted therapy (AAT), also known as pet therapy, is a growing field in healthcare and mental health treatment. It involves trained animals &mdash; most commonly dogs &mdash; interacting with patients to help reduce stress, anxiety, and feelings of loneliness. Research has shown that spending time with animals can lower blood pressure, increase levels of the feel-good hormone oxytocin, and even reduce pain perception.<br><br>\nAAT is used in a wide range of settings, including hospitals, nursing homes, schools, and rehabilitation centers. For elderly patients with dementia (失智症), visits from therapy dogs have been found to improve mood and social engagement. In schools, reading programs that involve children reading aloud to dogs have helped students who struggle with reading gain confidence.<br><br>\nCritics of AAT raise concerns about hygiene and potential allergic reactions among patients. There is also debate about the stress that therapy work may place on the animals themselves. Ethical guidelines now require that therapy animals be regularly assessed for their health and well-being.<br><br>\nDespite these concerns, interest in AAT continues to grow. As more research supports its benefits, healthcare providers are increasingly incorporating animal-assisted programs into their treatment plans.<\/div>", "39": "<div class=\"passage\"><h3>第 39–42 題<\/h3>\nTaiwan's convenience stores have evolved far beyond simple shops selling snacks and drinks. Today, they serve as essential service centers that touch nearly every aspect of daily life. There are more than 12,000 convenience stores on the island &mdash; one of the highest densities in the world &mdash; and they are open 24 hours a day, seven days a week.<br><br>\nAt a Taiwan convenience store, customers can pay utility bills, pick up online purchases, print documents, apply for government certificates, and even buy high-speed rail tickets. Hot food counters serve everything from tea eggs to bento boxes, and some stores offer seating areas where people can eat, study, or hold informal meetings. Micro-ATMs and financial services are also commonly available.<br><br>\nDuring natural disasters such as typhoons, convenience stores play a critical role in the community. They often remain open when other businesses close, providing emergency supplies and a gathering point for those in need. After major floods or earthquakes, they have been among the first businesses to restore operations, distributing food and water to affected residents.<br><br>\nThe success of Taiwan's convenience store model has attracted international attention. Several Southeast Asian countries have adopted similar systems, inspired by Taiwan's example. Industry observers note that Taiwan's convenience stores succeed because they are deeply embedded in daily life and constantly adapting to meet changing consumer needs.<\/div>"};
const PTR = {"21": [{"en": "Taiwan's indigenous peoples (原住民族) have a rich cultural heritage that includes unique languages, music, weaving, and traditional ceremonies.", "zh": "台灣的原住民族擁有豐富的文化遺產，包括獨特的語言、音樂、編織和傳統祭儀。", "sa": "【S】Taiwan's indigenous peoples 【V】have 【O】a rich cultural heritage 【M】that includes…（關係子句）<br>📌 peoples 指「多個民族」，可加 s。"}, {"en": "There are currently 16 officially <b>recognized<\/b> indigenous groups in Taiwan, each with its own distinct traditions.", "zh": "台灣目前有 16 個官方認定的原住民族，各有其獨特的傳統。", "sa": "【V】There are 【S】16 officially recognized indigenous groups 【M】each with its own distinct traditions<br>📌 副詞 + p.p. 當形容詞；each with… 獨立片語。"}, {"en": "In recent years, the government has made efforts to preserve and promote indigenous cultures.", "zh": "近年來，政府努力保存並推廣原住民族文化。", "sa": "【M】In recent years 【S】the government 【V】has made 【O】efforts 【M】to preserve and promote indigenous cultures<br>📌 make efforts to V「努力……」；in recent years 常搭配現在完成式。"}, {"en": "For example, indigenous languages are now <b>taught<\/b> in some schools as part of the regular curriculum.", "zh": "例如，原住民族語言現在在一些學校中被當作正式課程的一部分來教授。", "sa": "【S】indigenous languages 【V】are now taught 【M】in some schools as part of the regular curriculum<br>📌 現在式被動 be + p.p.。"}, {"en": "Festivals such as the Amis Harvest Festival (豐年祭) attract both local and international visitors every year, providing a <b>platform<\/b> for indigenous communities to showcase their traditions.", "zh": "像阿美族豐年祭這樣的節慶每年都吸引國內外遊客，為原住民族社群提供了展現傳統的平台。", "sa": "【S】Festivals such as… 【V】attract 【O】both local and international visitors<br>【M】providing a platform for… to showcase…（分詞構句）"}, {"en": "However, many indigenous leaders note that economic challenges and urbanization continue to threaten their way of life.", "zh": "然而，許多原住民族領袖指出，經濟困境和都市化持續威脅著他們的生活方式。", "sa": "【S】many indigenous leaders 【V】note 【O】that economic challenges and urbanization continue to threaten their way of life<br>📌 note that…「指出……」；continue to V「持續……」。"}, {"en": "Young people often move to cities for work, making it harder to <b>pass on<\/b> traditional practices from one generation to the next.", "zh": "年輕人常為了工作搬到都市，使得傳統習俗更難一代一代傳承下去。", "sa": "【S】Young people 【V】often move 【M】to cities for work<br>【M】making it harder to pass on…（make it + adj. + to V）"}], "25": [{"en": "Sleep is one of the most important factors in maintaining good health, yet many people worldwide do not get enough of it.", "zh": "睡眠是維持健康最重要的因素之一，然而全世界有許多人睡眠不足。", "sa": "【S】Sleep 【V】is 【C】one of the most important factors in maintaining good health,<br>yet 【S】many people worldwide 【V】do not get 【O】enough of it<br>📌 yet 當連接詞「然而」；in + V-ing。"}, {"en": "Adults are generally recommended to get between seven and nine hours of sleep <b>per day<\/b>.", "zh": "一般建議成年人每天睡七到九個小時。", "sa": "【S】Adults 【V】are generally recommended 【C】to get between seven and nine hours of sleep 【M】per day<br>📌 be recommended to V。"}, {"en": "Lack of sleep has been linked to a wide range of health problems, including heart disease, obesity, and weakened immunity.", "zh": "睡眠不足被認為與許多健康問題有關，包括心臟病、肥胖和免疫力下降。", "sa": "【S】Lack of sleep 【V】has been linked 【M】to a wide range of health problems, including…<br>📌 be linked to「與……有關」；including 舉例。"}, {"en": "Research also shows that poor sleep affects memory and concentration.", "zh": "研究也顯示，睡眠品質不佳會影響記憶力和專注力。", "sa": "【S】Research 【V】also shows 【O】that poor sleep affects memory and concentration（名詞子句）"}, {"en": "<b>In addition<\/b>, teenagers are particularly vulnerable, as their developing brains require even more rest than adults.", "zh": "此外，青少年特別容易受影響，因為他們發育中的大腦比成人需要更多休息。", "sa": "【S】teenagers 【V】are 【C】particularly vulnerable 【M】as their developing brains require even more rest than adults<br>📌 as 表原因；even + 比較級。"}, {"en": "Unfortunately, the widespread use of smartphones and social media has made it harder for young people to fall asleep.", "zh": "不幸的是，智慧型手機和社群媒體的普及，讓年輕人更難入睡。", "sa": "【S】the widespread use of smartphones and social media 【V】has made 【O】it 【C】harder 【M】for young people to fall asleep<br>📌 make it + adj. + for 人 + to V；主詞核心 use 為單數。"}, {"en": "The blue light emitted by screens <b>suppresses<\/b> the production of melatonin (褪黑激素), a hormone that helps regulate sleep.", "zh": "螢幕發出的藍光會抑制褪黑激素的分泌，而褪黑激素是一種幫助調節睡眠的荷爾蒙。", "sa": "【S】The blue light emitted by screens 【V】suppresses 【O】the production of melatonin<br>【M】a hormone that helps regulate sleep（同位語）"}, {"en": "Experts recommend avoiding screens for at least one hour before bed and keeping a consistent sleep schedule <b>so that<\/b> one falls asleep more easily over time.", "zh": "專家建議睡前至少一小時避免使用螢幕，並維持規律的作息，這樣久而久之就能更容易入睡。", "sa": "【S】Experts 【V】recommend 【O】avoiding… and keeping…<br>【M】so that one falls asleep more easily over time<br>📌 recommend + V-ing；so that 表目的。"}], "29": [{"en": "Sunrise Fitness Studio – Weekly Class Schedule", "zh": "日出健身工作室——每週課表", "sa": "名詞片語標題，省略主詞動詞。"}, {"en": "Class / Day / Time / Instructor / Level", "zh": "課程／星期／時間／教練／程度", "sa": "表格欄位名稱，名詞條列。"}, {"en": "Yoga | Mon / Fri | 7:00–8:00 AM | Ms. Lin | Beginner", "zh": "瑜伽｜週一／週五｜上午 7:00–8:00｜林老師｜初級", "sa": "表格列，名詞片語條列。"}, {"en": "Pilates | Tue / Thu | 6:30–7:30 PM | Mr. Chen | Intermediate", "zh": "皮拉提斯｜週二／週四｜晚上 6:30–7:30｜陳老師｜中級", "sa": "表格列，名詞片語條列。"}, {"en": "Zumba | Wed / Sat | 10:00–11:00 AM | Ms. Wang | All levels", "zh": "尊巴舞｜週三／週六｜上午 10:00–11:00｜王老師｜各程度皆可", "sa": "表格列，名詞片語條列；All levels「所有程度」。"}, {"en": "Strength Training | Mon / Fri | 5:30–6:30 PM | Mr. Lee | Advanced", "zh": "肌力訓練｜週一／週五｜傍晚 5:30–6:30｜李老師｜高級", "sa": "表格列，名詞片語條列。"}, {"en": "Swimming | Sat / Sun | 9:00–10:30 AM | Ms. Huang | All levels", "zh": "游泳｜週六／週日｜上午 9:00–10:30｜黃老師｜各程度皆可", "sa": "表格列，名詞片語條列。"}, {"en": "Note: All classes require registration at least 24 hours in advance.", "zh": "注意：所有課程都需要至少提前 24 小時報名。", "sa": "【S】All classes 【V】require 【O】registration 【M】at least 24 hours in advance<br>📌 in advance「事先」；at least「至少」。"}, {"en": "Classes with fewer than 5 registered participants will be cancelled.", "zh": "報名人數少於 5 人的課程將會取消。", "sa": "【S】Classes 【M】with fewer than 5 registered participants 【V】will be cancelled<br>📌 未來式被動 will be + p.p.；fewer than 修飾可數名詞。"}], "31": [{"en": "TechHelp Community Forum | Thread: My new laptop won't connect to Wi-Fi – please help! | Posted by: user2468", "zh": "TechHelp 社群論壇｜討論串：我的新筆電連不上 Wi-Fi——請幫忙！｜發文者：user2468", "sa": "論壇表頭，名詞片語條列；won't = will not，此處表「怎樣都不肯／無法」。"}, {"en": "Hi everyone!", "zh": "大家好！", "sa": "問候語。"}, {"en": "I just bought a new laptop and for some reason it can't connect to my home Wi-Fi.", "zh": "我剛買了一台新筆電，但不知道為什麼它連不上我家的 Wi-Fi。", "sa": "【S】I 【V】just bought 【O】a new laptop and 【M】for some reason 【S】it 【V】can't connect 【M】to my home Wi-Fi<br>📌 for some reason「不知為何」。"}, {"en": "It shows the network name, but every time I try to connect, it says “Connection failed.”", "zh": "它有顯示網路名稱，但每次我嘗試連線時，它都顯示「連線失敗」。", "sa": "【S】It 【V】shows 【O】the network name, but 【M】every time I try to connect, 【S】it 【V】says 【O】“Connection failed.”<br>📌 every time + 子句「每當……」。"}, {"en": "My phone and tablet work fine on the same network.", "zh": "我的手機和平板在同一個網路上都運作正常。", "sa": "【S】My phone and tablet 【V】work 【M】fine on the same network<br>📌 work fine「運作正常」。"}, {"en": "I've already tried restarting the laptop and the router.", "zh": "我已經試過重新啟動筆電和路由器了。", "sa": "【S】I 【V】've already tried 【O】restarting the laptop and the router<br>📌 try + V-ing「試試看做……」（≠ try to V「努力去做」）。"}, {"en": "Not sure what else to do.", "zh": "不知道還能做什麼。", "sa": "省略主詞與 be 動詞：(I'm) not sure what else to do<br>📌 疑問詞 + to V 當受詞。"}, {"en": "Any advice?", "zh": "有什麼建議嗎？", "sa": "省略句：(Do you have) any advice?"}, {"en": "Reply from TechGuru99: Hi!", "zh": "TechGuru99 的回覆：嗨！", "sa": "回覆標題與問候語。"}, {"en": "Try forgetting the network on your laptop and then reconnecting fresh.", "zh": "試試看在筆電上「忘記」這個網路，然後重新連線。", "sa": "祈使句：【V】Try 【O】forgetting the network… and then reconnecting fresh<br>📌 try + V-ing；fresh 在此當副詞「重新地」。"}, {"en": "If that doesn't work, check if your laptop's Wi-Fi driver needs an update.", "zh": "如果那樣沒用，就檢查一下你筆電的 Wi-Fi 驅動程式是否需要更新。", "sa": "【M】If that doesn't work 【V】check 【O】if your laptop's Wi-Fi driver needs an update<br>📌 第一個 if 表條件「如果」，第二個 if = whether「是否」。"}, {"en": "You can do this by going to Device Manager and looking for “Network Adapters.”", "zh": "你可以到「裝置管理員」裡找「網路介面卡」來進行。", "sa": "【S】You 【V】can do 【O】this 【M】by going to Device Manager and looking for “Network Adapters”<br>📌 by + V-ing「藉由……」。"}, {"en": "Right-click and choose “Update driver.”", "zh": "按右鍵並選擇「更新驅動程式」。", "sa": "祈使句：【V】Right-click and 【V】choose 【O】“Update driver”"}, {"en": "Let us know how it goes!", "zh": "再告訴我們結果如何！", "sa": "【V】Let 【O】us 【C】know how it goes<br>📌 let + O + 原形動詞；how it goes「事情進展如何」。"}, {"en": "Reply from helper_tom: Also, make sure the date and time settings on your new laptop are correct.", "zh": "helper_tom 的回覆：另外，也要確認你新筆電上的日期和時間設定是正確的。", "sa": "祈使句：【V】make sure 【O】(that) the date and time settings… are correct<br>📌 make sure (that)…「確認……」。"}, {"en": "Incorrect time settings can sometimes prevent a successful connection.", "zh": "錯誤的時間設定有時會導致無法成功連線。", "sa": "【S】Incorrect time settings 【V】can sometimes prevent 【O】a successful connection<br>📌 prevent + N「阻止、妨礙……」。"}], "33": [{"en": "Coffee is one of the most popular beverages in the world, and Taiwan has developed a rich coffee culture of its own.", "zh": "咖啡是世界上最受歡迎的飲料之一，而台灣也發展出屬於自己的豐富咖啡文化。", "sa": "【S】Coffee 【V】is 【C】one of the most popular beverages…, and 【S】Taiwan 【V】has developed 【O】a rich coffee culture of its own<br>📌 of one's own「屬於自己的」。"}, {"en": "While many Taiwanese consumers still enjoy instant coffee or chain café drinks, a growing number of coffee lovers are turning to specialty coffee — high-quality beans that are carefully grown, processed, and brewed.", "zh": "雖然許多台灣消費者仍喜歡即溶咖啡或連鎖咖啡店的飲品，但越來越多咖啡愛好者轉向精品咖啡——也就是經過細心栽種、處理與沖煮的高品質咖啡豆。", "sa": "【M】While many Taiwanese consumers still enjoy… 【S】a growing number of coffee lovers 【V】are turning to 【O】specialty coffee<br>📌 while 表對比「雖然」；a growing number of + 複數名詞 + 複數動詞。"}, {"en": "Taiwan even grows its own specialty coffee, primarily in mountainous regions such as Alishan (阿里山) and the Da-wu Mountain area (大武山).", "zh": "台灣甚至種植自己的精品咖啡，主要產於阿里山和大武山等山區。", "sa": "【S】Taiwan 【V】even grows 【O】its own specialty coffee 【M】primarily in mountainous regions such as…"}, {"en": "Taiwanese coffee farmers have won international recognition in recent years, with some beans earning top rankings at global competitions.", "zh": "近年來，台灣咖啡農獲得國際肯定，部分咖啡豆在國際比賽中名列前茅。", "sa": "【S】Taiwanese coffee farmers 【V】have won 【O】international recognition<br>【M】with some beans earning top rankings…（with + O + V-ing 附帶狀況）"}, {"en": "The high altitude, misty climate, and rich soil of these regions create ideal growing conditions.", "zh": "這些地區的高海拔、多霧氣候和肥沃土壤，創造了理想的種植條件。", "sa": "【S】The high altitude, misty climate, and rich soil of these regions 【V】create 【O】ideal growing conditions"}, {"en": "The rise of specialty coffee in Taiwan has given birth to a new generation of skilled baristas.", "zh": "精品咖啡在台灣的興起，孕育出新一代技術純熟的咖啡師。", "sa": "【S】The rise of specialty coffee in Taiwan 【V】has given birth to 【O】a new generation of skilled baristas<br>📌 give birth to「產生、孕育」。"}, {"en": "Coffee competitions such as the Taiwan Barista Championship draw attention from across Asia.", "zh": "像台灣咖啡師大賽這類的咖啡比賽，吸引了全亞洲的關注。", "sa": "【S】Coffee competitions such as… 【V】draw 【O】attention 【M】from across Asia<br>📌 draw attention「吸引注意」。"}, {"en": "Young professionals invest significant time learning about bean origins, extraction techniques, and flavor profiles.", "zh": "年輕的專業人士投入大量時間學習咖啡豆產地、萃取技術和風味特徵。", "sa": "【S】Young professionals 【V】invest 【O】significant time 【M】learning about…<br>📌 invest／spend + 時間 + V-ing「花時間做……」。"}, {"en": "However, specialty coffee remains more expensive than mass-market options, and some consumers find the culture intimidating.", "zh": "然而，精品咖啡仍比大眾市場的選擇昂貴，而且有些消費者覺得這種文化讓人望而生畏。", "sa": "【S】specialty coffee 【V】remains 【C】more expensive than mass-market options, and 【S】some consumers 【V】find 【O】the culture 【C】intimidating<br>📌 find + O + adj."}, {"en": "Supporters of the movement argue that once people try a well-prepared cup of specialty coffee, they quickly understand why it is worth the price.", "zh": "這股風潮的支持者認為，人們一旦喝過一杯精心沖煮的精品咖啡，很快就會明白為什麼它值這個價錢。", "sa": "【S】Supporters of the movement 【V】argue 【O】that once people try…, they quickly understand why it is worth the price<br>📌 once「一旦」；be worth + N「值得……」。"}], "36": [{"en": "Animal-assisted therapy (AAT), also known as pet therapy, is a growing field in healthcare and mental health treatment.", "zh": "動物輔助治療（AAT），又稱寵物治療，是醫療照護和心理健康治療中一個日益成長的領域。", "sa": "【S】Animal-assisted therapy (AAT), 【M】also known as pet therapy, 【V】is 【C】a growing field…<br>📌 also known as「又稱為」（插入的分詞片語）。"}, {"en": "It involves trained animals — most commonly dogs — interacting with patients to help reduce stress, anxiety, and feelings of loneliness.", "zh": "它是讓受過訓練的動物——最常見的是狗——與病患互動，以幫助減輕壓力、焦慮和孤單感。", "sa": "【S】It 【V】involves 【O】trained animals 【C】interacting with patients 【M】to help reduce…<br>📌 involve + O + V-ing「涉及……做……」；help + 原形動詞。"}, {"en": "Research has shown that spending time with animals can lower blood pressure, increase levels of the feel-good hormone oxytocin, and even reduce pain perception.", "zh": "研究顯示，與動物相處可以降低血壓、提高讓人感覺愉快的荷爾蒙催產素的濃度，甚至減輕疼痛感。", "sa": "【S】Research 【V】has shown 【O】that spending time with animals can lower…, increase…, and even reduce…<br>📌 動名詞片語當子句主詞；三個並列動詞。"}, {"en": "AAT is used in a wide range of settings, including hospitals, nursing homes, schools, and rehabilitation centers.", "zh": "動物輔助治療被運用在許多場所，包括醫院、安養院、學校和復健中心。", "sa": "【S】AAT 【V】is used 【M】in a wide range of settings, including…<br>📌 a wide range of「各式各樣的」。"}, {"en": "For elderly patients with dementia (失智症), visits from therapy dogs have been found to improve mood and social engagement.", "zh": "對於患有失智症的年長病患，治療犬的探訪已被發現能改善情緒並提升社交參與。", "sa": "【M】For elderly patients with dementia 【S】visits from therapy dogs 【V】have been found 【C】to improve mood and social engagement<br>📌 be found to V「被發現會……」。"}, {"en": "In schools, reading programs that involve children reading aloud to dogs have helped students who struggle with reading gain confidence.", "zh": "在學校裡，讓孩子朗讀給狗聽的閱讀計畫，已幫助閱讀有困難的學生建立自信。", "sa": "【S】reading programs 【M】that involve children reading aloud to dogs 【V】have helped 【O】students who struggle with reading 【C】gain confidence<br>📌 help + O + 原形動詞；主詞核心 programs 為複數。"}, {"en": "Critics of AAT raise concerns about hygiene and potential allergic reactions among patients.", "zh": "批評動物輔助治療的人對衛生問題以及病患可能出現的過敏反應表示疑慮。", "sa": "【S】Critics of AAT 【V】raise 【O】concerns 【M】about hygiene and potential allergic reactions among patients<br>📌 raise concerns about「對……提出疑慮」。"}, {"en": "There is also debate about the stress that therapy work may place on the animals themselves.", "zh": "對於治療工作可能對動物本身造成的壓力，也有爭議。", "sa": "【V】There is 【S】also debate 【M】about the stress 【M】that therapy work may place on the animals themselves<br>📌 place stress on「對……造成壓力」；themselves 強調用法。"}, {"en": "Ethical guidelines now require that therapy animals be regularly assessed for their health and well-being.", "zh": "現在的倫理準則要求治療動物必須定期接受健康與福祉的評估。", "sa": "【S】Ethical guidelines 【V】now require 【O】that therapy animals (should) be regularly assessed…<br>📌 require that + S + (should) + 原形動詞（假設語氣）。"}, {"en": "Despite these concerns, interest in AAT continues to grow.", "zh": "儘管有這些疑慮，人們對動物輔助治療的興趣仍持續增加。", "sa": "【M】Despite these concerns 【S】interest in AAT 【V】continues to grow<br>📌 despite + N「儘管」。"}, {"en": "As more research supports its benefits, healthcare providers are increasingly incorporating animal-assisted programs into their treatment plans.", "zh": "隨著越來越多研究證實它的好處，醫療照護提供者越來越常把動物輔助計畫納入治療計畫中。", "sa": "【M】As more research supports its benefits 【S】healthcare providers 【V】are increasingly incorporating 【O】animal-assisted programs 【M】into their treatment plans<br>📌 incorporate A into B「把 A 納入 B」。"}], "39": [{"en": "Taiwan's convenience stores have evolved far beyond simple shops selling snacks and drinks.", "zh": "台灣的便利商店早已遠遠超越只賣零食和飲料的簡單商店。", "sa": "【S】Taiwan's convenience stores 【V】have evolved 【M】far beyond simple shops selling snacks and drinks<br>📌 selling… 為現在分詞片語修飾 shops。"}, {"en": "Today, they serve as essential service centers that touch nearly every aspect of daily life.", "zh": "如今，它們是幾乎涵蓋日常生活每個層面的重要服務中心。", "sa": "【S】they 【V】serve 【C】as essential service centers 【M】that touch nearly every aspect of daily life<br>📌 serve as「作為」。"}, {"en": "There are more than 12,000 convenience stores on the island — one of the highest densities in the world — and they are open 24 hours a day, seven days a week.", "zh": "全台有超過一萬兩千家便利商店——密度名列世界前茅——而且全年無休、24 小時營業。", "sa": "【V】There are 【S】more than 12,000 convenience stores 【M】on the island<br>and 【S】they 【V】are 【C】open 24 hours a day, seven days a week<br>📌 破折號插入補充說明。"}, {"en": "At a Taiwan convenience store, customers can pay utility bills, pick up online purchases, print documents, apply for government certificates, and even buy high-speed rail tickets.", "zh": "在台灣的便利商店，顧客可以繳水電費、領取網購商品、列印文件、申請政府證明文件，甚至購買高鐵車票。", "sa": "【S】customers 【V】can pay… pick up… print… apply for… and even buy…（五個並列動詞）<br>📌 apply for「申請」。"}, {"en": "Hot food counters serve everything from tea eggs to bento boxes, and some stores offer seating areas where people can eat, study, or hold informal meetings.", "zh": "熱食櫃提供從茶葉蛋到便當的各種食物，有些門市還設有座位區，讓人們可以用餐、讀書或進行非正式的會議。", "sa": "【S】Hot food counters 【V】serve 【O】everything from tea eggs to bento boxes, and 【S】some stores 【V】offer 【O】seating areas 【M】where people can…<br>📌 關係副詞 where 修飾 areas。"}, {"en": "Micro-ATMs and financial services are also commonly available.", "zh": "小型提款機和金融服務也很常見。", "sa": "【S】Micro-ATMs and financial services 【V】are 【C】also commonly available"}, {"en": "During natural disasters such as typhoons, convenience stores play a critical role in the community.", "zh": "在颱風等天然災害期間，便利商店在社區中扮演關鍵的角色。", "sa": "【M】During natural disasters such as typhoons 【S】convenience stores 【V】play 【O】a critical role 【M】in the community<br>📌 play a role in「在……扮演角色」。"}, {"en": "They often remain open when other businesses close, providing emergency supplies and a gathering point for those in need.", "zh": "它們常在其他商家關門時仍持續營業，為有需要的人提供緊急物資和聚集地點。", "sa": "【S】They 【V】often remain 【C】open 【M】when other businesses close<br>【M】providing emergency supplies and a gathering point for those in need（分詞構句）<br>📌 those in need「有需要的人」。"}, {"en": "After major floods or earthquakes, they have been among the first businesses to restore operations, distributing food and water to affected residents.", "zh": "在重大水災或地震過後，它們一直是最早恢復營業的商家之一，並把食物和水分送給受災居民。", "sa": "【S】they 【V】have been 【C】among the first businesses to restore operations<br>【M】distributing food and water to affected residents<br>📌 the first + N + to V「第一個做……的」；among「在……之中」。"}, {"en": "The success of Taiwan's convenience store model has attracted international attention.", "zh": "台灣便利商店模式的成功引起了國際的關注。", "sa": "【S】The success of Taiwan's convenience store model 【V】has attracted 【O】international attention"}, {"en": "Several Southeast Asian countries have adopted similar systems, inspired by Taiwan's example.", "zh": "幾個東南亞國家受到台灣的啟發，採用了類似的系統。", "sa": "【S】Several Southeast Asian countries 【V】have adopted 【O】similar systems<br>【M】inspired by Taiwan's example（過去分詞構句，表被動原因）"}, {"en": "Industry observers note that Taiwan's convenience stores succeed because they are deeply embedded in daily life and constantly adapting to meet changing consumer needs.", "zh": "業界觀察者指出，台灣便利商店之所以成功，是因為它們深深融入日常生活，並不斷調整以滿足消費者變化的需求。", "sa": "【S】Industry observers 【V】note 【O】that Taiwan's convenience stores succeed 【M】because they are deeply embedded in daily life and constantly adapting…<br>📌 be embedded in「深植於」；adapt to V「調整以……」。"}]};
const Q = [{"n": 1, "p": 0, "stem": "The hospital kept all patient records _____, so no one outside the medical team could access them.", "o": ["confidential", "expensive", "ordinary", "seasonal"], "a": 0, "exp": "✓ (A) confidential（機密的）— 醫院將所有病患紀錄保密，只有醫療團隊可以查閱，語意一致。\n❌ (B) expensive = 昂貴的，不修飾紀錄保存方式。\n❌ (C) ordinary = 普通的，語意相反。\n❌ (D) seasonal = 季節性的，不適用。", "zh": "醫院將所有病歷保密，所以醫療團隊以外的人都無法取得。", "sa": "【S】The hospital 【V】kept 【O】all patient records 【C】confidential<br>【M】so no one outside the medical team could access them<br>📌 句型：keep + O + adj.「使……保持……」<br>例：Keep the door open."}, {"n": 2, "p": 0, "stem": "The mountain trail was so _____ that only experienced hikers were advised to attempt it.", "o": ["comfortable", "cheerful", "steep", "polite"], "a": 2, "exp": "✓ (C) steep（陡峭的）— 山徑「陡峭」到只有有經驗的健行者才被建議嘗試，語意合理。\n❌ (A) comfortable = 舒適的，語意相反。\n❌ (B) cheerful = 愉快的，不修飾山徑。\n❌ (D) polite = 有禮貌的，不適用。", "zh": "這條山徑非常陡峭，所以只建議有經驗的登山客嘗試。", "sa": "【S】The mountain trail 【V】was 【C】so steep<br>【M】that only experienced hikers were advised to attempt it<br>📌 句型：so + adj. + that…「如此……以致於……」；be advised to V「被建議……」（被動）。"}, {"n": 3, "p": 0, "stem": "Local officials _____ a new park project that would provide green space for residents in the busy downtown area.", "o": ["approved", "avoided", "damaged", "regretted"], "a": 0, "exp": "✓ (A) approved（批准）— 地方官員「批准」了一項公園計畫，語意通順。\n❌ (B) avoided = 避免，語意不符（官員不會避免公園計畫）。\n❌ (C) damaged = 損壞，語意相反。\n❌ (D) regretted = 後悔，不符合語境。", "zh": "地方官員核准了一項新公園計畫，將為繁忙市中心的居民提供綠地。", "sa": "【S】Local officials 【V】approved 【O】a new park project<br>【M】that would provide green space for residents in the busy downtown area（關係子句）<br>📌 句型：provide + 物 + for + 人「為某人提供……」= provide 人 with 物。"}, {"n": 4, "p": 0, "stem": "The famous chef's cookbook became an instant bestseller, _____ thousands of home cooks to try new recipes.", "o": ["frightening", "inspiring", "missing", "wasting"], "a": 1, "exp": "✓ (B) inspiring（激勵；鼓舞）— 食譜書成為暢銷書，「激勵」數千位家庭廚師嘗試新食譜，分詞構句表結果，語意順暢。\n❌ (A) frightening = 嚇到，語意相反。\n❌ (C) missing = 錯過，語意不符。\n❌ (D) wasting = 浪費，語意不符。", "zh": "這位知名主廚的食譜書一推出就成為暢銷書，激勵了成千上萬的居家廚師嘗試新食譜。", "sa": "【S】The famous chef's cookbook 【V】became 【C】an instant bestseller<br>【M】inspiring thousands of home cooks to try new recipes（分詞構句表結果）<br>📌 句型：inspire + 人 + to V「激勵某人去……」。"}, {"n": 5, "p": 0, "stem": "The elderly woman could not _____ the stairs on her own, so a volunteer helped her up to the second floor.", "o": ["climb", "drop", "smile", "teach"], "a": 0, "exp": "✓ (A) climb（爬；攀登）— 老婦人無法獨自「爬」樓梯，志工幫助她到二樓，語意一致。\n❌ (B) drop = 掉落，語意不符。\n❌ (C) smile = 微笑，不適用。\n❌ (D) teach = 教，不適用。", "zh": "那位年長的婦人無法自己爬樓梯，所以一位志工扶她上二樓。", "sa": "【S】The elderly woman 【V】could not climb 【O】the stairs 【M】on her own<br>so 【S】a volunteer 【V】helped 【O】her 【M】up to the second floor<br>📌 句型：on one's own「獨自、靠自己」；so 連接表結果的對等子句。"}, {"n": 6, "p": 0, "stem": "The company's new product was so _____ that it sold out within hours of going on sale online.", "o": ["boring", "distant", "popular", "useless"], "a": 2, "exp": "✓ (C) popular（受歡迎的）— 產品在幾小時內售罄，表示非常「受歡迎」。\n❌ (A) boring = 無聊的，語意相反（無聊的產品不會售罄）。\n❌ (B) distant = 遙遠的，不修飾產品。\n❌ (D) useless = 無用的，語意相反。", "zh": "這家公司的新產品非常受歡迎，在網路開賣幾小時內就賣光了。", "sa": "【S】The company's new product 【V】was 【C】so popular<br>【M】that it sold out within hours of going on sale online<br>📌 句型：so + adj. + that…；sell out「售罄」；go on sale「開賣」。"}, {"n": 7, "p": 0, "stem": "After working at the same company for twenty years, she decided to _____ and start her own business.", "o": ["repeat", "hide", "resign", "arrive"], "a": 2, "exp": "✓ (C) resign（辭職）— 在同一家公司工作二十年後，她決定「辭職」並創業，語意合理。\n❌ (A) repeat = 重複，不符合語境。\n❌ (B) hide = 躲藏，語意不符。\n❌ (D) arrive = 到達，語意不符。", "zh": "在同一家公司工作二十年後，她決定辭職，自己創業。", "sa": "【M】After working at the same company for twenty years（介系詞 + V-ing）<br>【S】she 【V】decided 【O】to resign and start her own business<br>📌 句型：decide to V「決定……」；after + V-ing 時省略與主要子句相同的主詞。"}, {"n": 8, "p": 0, "stem": "The athlete's performance in the final race was _____, breaking both the national and world records at the same time.", "o": ["was described as", "was regarded as", "nothing but", "outstanding"], "a": 3, "exp": "✓ (D) outstanding（傑出的）— 同時打破國家和世界紀錄，表現「傑出」，語意完整。\n❌ (A) was described as = 被描述為（文法不完整，缺補語）。\n❌ (B) was regarded as = 被視為（後面應接名詞）。\n❌ (C) nothing but = 只不過，語意不符（nothing but 後接名詞）。", "zh": "這位運動員在決賽中的表現非常傑出，同時打破了全國紀錄和世界紀錄。", "sa": "【S】The athlete's performance in the final race 【V】was 【C】outstanding<br>【M】breaking both the national and world records at the same time（分詞構句）<br>📌 句型：be 動詞 + 形容詞補語；both A and B「A 和 B 兩者都」。"}, {"n": 9, "p": 0, "stem": "The company decided to <u>halt<\/u> production temporarily due to a shortage of raw materials.", "o": ["stop", "increase", "review", "announce"], "a": 0, "exp": "✓ (A) stop（停止）— halt（暫停、停止）與 stop 意義最接近。\n❌ (B) increase = 增加，語意相反。\n❌ (C) review = 審查，語意不符。\n❌ (D) announce = 宣布，語意不符。", "zh": "由於原料短缺，這家公司決定暫時停止生產。（halt ≈ stop 停止）", "sa": "【S】The company 【V】decided 【O】to halt production temporarily<br>【M】due to a shortage of raw materials<br>📌 句型：due to + N「由於……」；a shortage of + N「……的短缺」。"}, {"n": 10, "p": 0, "stem": "Many students find it hard to concentrate during long lectures because their attention tends to <u>drift<\/u>.", "o": ["focus", "improve", "relax", "wander"], "a": 3, "exp": "✓ (D) wander（游移；漫遊）— drift 在此表示「注意力飄移、散漫」，wander 意義最接近。\n❌ (A) focus = 集中，語意相反。\n❌ (B) improve = 改善，語意不符。\n❌ (C) relax = 放鬆，語意不符。", "zh": "許多學生覺得在冗長的講課中很難專心，因為他們的注意力容易飄走。（drift ≈ wander 漫遊、分散）", "sa": "【S】Many students 【V】find 【O】it 【C】hard to concentrate during long lectures<br>【M】because their attention tends to drift<br>📌 句型：find + it（虛受詞）+ adj. + to V「覺得做……很……」；tend to V「往往會……」。"}, {"n": 11, "p": 1, "stem": "Nurse: Good morning! How are you feeling today?<br>Patient: A little better, thank you. But my throat is still sore.<br>Nurse: _____<br>Patient: I took it at seven this morning.", "o": ["Have you eaten breakfast yet?", "When did you last take your medicine?", "What time did the doctor visit?", "Would you like some water?"], "a": 1, "exp": "✓ (B) When did you last take your medicine?（你上次服藥是什麼時候？）— 病患回答「今天早上七點吃的」，直接回應「上次服藥時間」的詢問。\n❌ (A)(C)(D) 不符合病患的回答內容。", "zh": "護理師：早安！您今天覺得怎麼樣？<br>病人：好一點了，謝謝。但我的喉嚨還是很痛。<br>護理師：<b>您上次吃藥是什麼時候？<\/b><br>病人：我今天早上七點吃的。", "sa": "空格句：When did 【S】you 【M】last 【V】take 【O】your medicine?<br>回應句：【S】I 【V】took 【O】it 【M】at seven this morning<br>📌 句型：take medicine「吃藥」（用 take 不用 eat）；When did…? 用過去式詢問過去時間。"}, {"n": 12, "p": 1, "stem": "Rick: I can't decide what to do this weekend.<br>Pam: _____<br>Rick: That sounds great! I haven't been to the beach in ages.<br>Pam: Perfect. I'll bring the sunscreen!", "o": ["Why don't you just stay home and rest?", "How about going to the beach together?", "Have you tried the new shopping mall?", "You should start exercising more."], "a": 1, "exp": "✓ (B) How about going to the beach together?（要不要一起去海邊？）— Rick 說「聽起來很棒！好久沒去海邊了」，直接回應去海邊的提議。\n❌ (A) 建議待在家，Rick 不會說「聽起來很棒！」。\n❌ (C)(D) 與 Rick 的回應不符。", "zh": "Rick：我無法決定這個週末要做什麼。<br>Pam：<b>要不要一起去海邊？<\/b><br>Rick：聽起來很棒！我好久沒去海邊了。<br>Pam：太好了。我會帶防曬乳！", "sa": "空格句：How about + V-ing → How about going to the beach together?<br>回應句：【S】I 【V】haven't been 【M】to the beach in ages<br>📌 句型：How about + V-ing?「……如何？」表提議；in ages「好久」，搭配現在完成式。"}, {"n": 13, "p": 1, "stem": "Tim: My computer crashed and I lost all my homework files.<br>Claire: That's terrible! _____<br>Tim: No, I didn't. I completely forgot.<br>Claire: Let that be a lesson — always back up your work!", "o": ["Did you save your work to the cloud?", "Can you borrow someone's computer?", "Which subject was the homework for?", "Did you tell your teacher already?"], "a": 0, "exp": "✓ (A) Did you save your work to the cloud?（你有把作業存到雲端嗎？）— Tim 說「沒有，完全忘了」，直接回應是否備份到雲端的詢問。\n❌ (B)(C)(D) 與 Tim 的否定回答不符合邏輯對應。", "zh": "Tim：我的電腦當機了，所有作業檔案都不見了。<br>Claire：太慘了！<b>你有把作業存到雲端嗎？<\/b><br>Tim：沒有，我完全忘了。<br>Claire：就當作是個教訓吧——一定要備份你的作業！", "sa": "空格句：Did 【S】you 【V】save 【O】your work 【M】to the cloud?<br>後句：Let 【O】that 【C】be a lesson（使役動詞 let + O + 原形動詞）<br>📌 句型：Did you…? → No, I didn't.；back up「備份」。"}, {"n": 14, "p": 1, "stem": "Receptionist: Good afternoon, Golden Star Hotel. How can I help you?<br>Caller: Hi, I'd like to make a reservation for two nights, please.<br>Receptionist: Of course. _____<br>Caller: We'll be checking in on July 10th.", "o": ["What is your phone number?", "How many guests will be staying?", "What are your check-in and check-out dates?", "Would you prefer a smoking or non-smoking room?"], "a": 2, "exp": "✓ (C) What are your check-in and check-out dates?（您的入住和退房日期是什麼？）— 來電者回答「7月10日入住」，直接回應詢問入退房日期的問題。\n❌ (A)(B)(D) 詢問方向不符合來電者的回答。", "zh": "接待人員：午安，金星飯店，請問有什麼需要服務的？<br>來電者：嗨，我想訂兩晚的房間。<br>接待人員：好的。<b>請問您的入住和退房日期是？<\/b><br>來電者：我們會在 7 月 10 日入住。", "sa": "空格句：What 【V】are 【S】your check-in and check-out dates?<br>前句：【S】I 【V】'd like to make 【O】a reservation 【M】for two nights<br>📌 句型：make a reservation「預訂」；will be V-ing（未來進行式）表預定的安排。"}, {"n": 15, "p": 1, "stem": "Julia: I heard that you got into the National University of the Arts!<br>Leo: Yes! I'm still in shock. I wasn't expecting it.<br>Julia: _____<br>Leo: Thank you so much. It hasn't really sunk in yet.", "o": ["That school is very hard to get into.", "What will you study there?", "Why didn't you apply earlier?", "You truly deserve it. Congratulations!"], "a": 3, "exp": "✓ (D) You truly deserve it. Congratulations!（你真的當之無愧。恭喜！）— Leo 說「非常感謝，還沒完全回過神來」，明顯是回應祝賀和讚美。\n❌ (A)(B)(C) 語氣消極或方向偏移，Leo 不會說「謝謝！還沒回過神」。", "zh": "Julia：我聽說你考上國立藝術大學了！<br>Leo：對！我到現在還很震驚。我沒料到會上。<br>Julia：<b>這是你應得的。恭喜！<\/b><br>Leo：非常謝謝你。我到現在還沒真的意會過來。", "sa": "空格句：【S】You 【V】truly deserve 【O】it<br>後句：【S】It 【V】hasn't really sunk in 【M】yet<br>📌 句型：deserve + N「應得……」；sink in「（事實）被理解、意會」；get into + 學校「考上」。"}, {"n": 16, "p": 1, "stem": "Henry: Coach, I've been practicing every day, but my swimming time isn't improving.<br>Coach: _____<br>Henry: I just swim back and forth as fast as I can.<br>Coach: That's the problem. You need to focus on your technique, not just speed.", "o": ["What kind of training are you doing?", "Have you tried swimming in a longer pool?", "Do you train with any other athletes?", "When do you usually practice?"], "a": 0, "exp": "✓ (A) What kind of training are you doing?（你在做什麼訓練？）— Henry 回答「只是盡快來回游」，直接說明訓練方式，回應教練詢問訓練類型的問題。\n❌ (B)(C)(D) 不符合 Henry 的回答內容。", "zh": "Henry：教練，我每天都在練習，但我的游泳成績一直沒有進步。<br>教練：<b>你都做哪一種訓練？<\/b><br>Henry：我就是盡全力來回游。<br>教練：問題就在這裡。你需要專注在技巧上，而不只是速度。", "sa": "空格句：What kind of training 【V】are 【S】you 【V】doing?<br>後句：【S】You 【V】need to focus 【M】on your technique, not just speed<br>📌 句型：have been V-ing（現在完成進行式）表持續到現在；as fast as I can「盡我所能地快」。"}, {"n": 17, "p": 1, "stem": "Helen: There's a charity run next Sunday. Want to sign up together?<br>James: A charity run? _____<br>Helen: All the money raised goes to support children's education in rural areas.<br>James: That's a wonderful cause. Count me in!", "o": ["Where does it start?", "How long is the race?", "What charity does it support?", "Is registration free?"], "a": 2, "exp": "✓ (C) What charity does it support?（支持什麼慈善機構？）— Helen 回答「所有籌得款項用於支持偏鄉兒童教育」，直接回應詢問支持對象的問題。\n❌ (A)(B)(D) 與 Helen 的回答不對應。", "zh": "Helen：下週日有一場慈善路跑。要一起報名嗎？<br>James：慈善路跑？<b>是支持哪個慈善團體？<\/b><br>Helen：所有募得的款項都會用來支持偏鄉兒童的教育。<br>James：真是很棒的目的。算我一份！", "sa": "空格句：What charity 【V】does 【S】it 【V】support?<br>回應句：【S】All the money raised（過去分詞修飾 money）【V】goes 【M】to support children's education in rural areas<br>📌 句型：sign up「報名」；Count me in!「算我一份！」"}, {"n": 18, "p": 1, "stem": "Student: Professor Wang, could I speak to you after class?<br>Professor: Sure. Is everything alright?<br>Student: I wanted to ask about the essay assignment. _____<br>Professor: Of course. Send me an email and we'll set up a time.", "o": ["Can I hand it in late?", "I'd like some feedback on my draft, if possible.", "How many pages does it need to be?", "When is the deadline exactly?"], "a": 1, "exp": "✓ (B) I'd like some feedback on my draft, if possible.（如果可以的話，我想請您給我的草稿一些意見。）— 教授說「當然，發郵件給我，我們約個時間」，回應需要約時間討論的情境，與提交草稿請求反饋一致。\n❌ (A)(C)(D) 是簡單的是非或資訊詢問，不需要教授說「約個時間」。", "zh": "學生：王教授，下課後我可以跟您談一下嗎？<br>教授：當然。一切都還好嗎？<br>學生：我想請教關於報告作業的事。<b>如果可以的話，我想請您對我的草稿給些意見。<\/b><br>教授：當然可以。寄電子郵件給我，我們再約時間。", "sa": "空格句：【S】I 【V】'd like 【O】some feedback 【M】on my draft, if possible<br>回應句：Send me an email and 【S】we 【V】'll set up 【O】a time<br>📌 句型：feedback on + N「對……的意見」；祈使句 + and + 子句「……，就……」。"}, {"n": 19, "p": 1, "stem": "Mia: The weather forecast says it'll rain all week.<br>Dan: _____<br>Mia: I was going to have an outdoor birthday party this Saturday!<br>Dan: Oh no. Maybe you should move it indoors just in case.", "o": ["That's perfect — I love rainy days.", "That's not too bad, is it?", "That's terrible timing! What did you have planned?", "Who cares about the weather anyway?"], "a": 2, "exp": "✓ (C) That's terrible timing! What did you have planned?（時機真糟！你有什麼計畫？）— Mia 回答「我原本要辦戶外生日派對」，回應的是詢問她的計畫的問題，而且 \"terrible timing\" 與下雨預報的壞消息呼應。\n❌ (A)(B)(D) 語氣不符合或不自然。", "zh": "Mia：氣象預報說整個星期都會下雨。<br>Dan：<b>時機真糟！你原本計畫要做什麼？<\/b><br>Mia：我這星期六本來要辦一場戶外生日派對！<br>Dan：喔不。也許你應該移到室內，以防萬一。", "sa": "空格句：What 【V】did 【S】you 【V】have planned?（have + O + p.p. 已安排好的事）<br>回應句：【S】I 【V】was going to have 【O】an outdoor birthday party<br>📌 句型：was going to V「本來打算……」（表未實現的計畫）；just in case「以防萬一」。"}, {"n": 20, "p": 1, "stem": "Amy: I just got back from the science exhibition at the museum.<br>Bob: How was it?<br>Amy: It was fantastic! They had interactive displays about space exploration.<br>Bob: _____<br>Amy: Yes! You'd absolutely love it. It's open until the end of the month.", "o": ["Was it crowded?", "Did you take any photos?", "That sounds amazing! Is it still running?", "Do they have anything about animals?"], "a": 2, "exp": "✓ (C) That sounds amazing! Is it still running?（聽起來太棒了！還在展出嗎？）— Amy 說「你一定會喜歡！展覽開到月底」，直接回應詢問是否還在展出的問題。\n❌ (A)(B)(D) 與 Amy 的回答（確認展覽時間）不對應。", "zh": "Amy：我剛從博物館的科學展回來。<br>Bob：怎麼樣？<br>Amy：太棒了！他們有關於太空探索的互動展示。<br>Bob：<b>聽起來好棒！展覽還在進行嗎？<\/b><br>Amy：還在！你一定會超愛的。展覽會開到這個月底。", "sa": "空格句：【S】That 【V】sounds 【C】amazing!／Is 【S】it 【M】still 【V】running?<br>📌 句型：sound + adj.「聽起來……」（連綴動詞）；run 在此指展覽「進行、展出」；until「直到……」。"}, {"n": 21, "p": 2, "stem": "(21)", "o": ["recognized", "denied", "invented", "forgotten"], "a": 0, "exp": "✓ (A) recognized（承認；認定）— \"officially recognized\" 是固定搭配，表示「官方正式認定」的原住民族群，語意正確。\n❌ (B) denied = 否認，語意相反。(C) invented = 發明，語意不符。(D) forgotten = 遺忘，語意不符。", "zh": "<i>There are currently 16 officially <b>recognized<\/b> indigenous groups in Taiwan, each with its own distinct traditions.<\/i><br>台灣目前有 16 個官方認定的原住民族，各有其獨特的傳統。", "sa": "【V】There are 【S】currently 16 officially recognized indigenous groups 【M】in Taiwan<br>【M】each with its own distinct traditions（獨立片語補充說明）<br>📌 句型：副詞 + 過去分詞當形容詞（officially recognized「被官方承認的」）；There + be + N 表「有……」。"}, {"n": 22, "p": 2, "stem": "(22)", "o": ["taught", "hidden", "removed", "sold"], "a": 0, "exp": "✓ (A) taught（教授）— 原住民語言現在在部分學校「被教授」，被動語態（be + pp），符合文法和語意。\n❌ (B) hidden = 被隱藏，語意相反。(C) removed = 被移除，語意相反。(D) sold = 被販賣，語意不符。", "zh": "<i>For example, indigenous languages are now <b>taught<\/b> in some schools as part of the regular curriculum.<\/i><br>例如，原住民族語言現在在一些學校中被當作正式課程的一部分來教授。", "sa": "【S】indigenous languages 【V】are now taught 【M】in some schools 【M】as part of the regular curriculum<br>📌 句型：現在式被動 be + p.p.（teach-taught-taught）；as part of「作為……的一部分」。"}, {"n": 23, "p": 2, "stem": "(23)", "o": ["problem", "platform", "punishment", "promise"], "a": 1, "exp": "✓ (B) platform（平台；舞台）— 節慶為原住民社群「提供了展示傳統的舞台」，語意自然。\n❌ (A) problem = 問題，語意相反。(C) punishment = 懲罰，語意不符。(D) promise = 承諾，語意不符。", "zh": "<i>Festivals such as the Amis Harvest Festival (豐年祭) attract both local and international visitors every year, providing a <b>platform<\/b> for indigenous communities to showcase their traditions.<\/i><br>像阿美族豐年祭這樣的節慶每年都吸引國內外遊客，為原住民族社群提供了展現傳統的平台。", "sa": "【S】Festivals such as the Amis Harvest Festival 【V】attract 【O】both local and international visitors 【M】every year<br>【M】providing a platform for indigenous communities to showcase their traditions（分詞構句）<br>📌 句型：a platform for + 人 + to V「讓某人……的平台」。"}, {"n": 24, "p": 2, "stem": "(24)", "o": ["pass on", "throw away", "break down", "look into"], "a": 0, "exp": "✓ (A) pass on（傳承；傳遞）— \"pass on...from one generation to the next\" 是固定搭配，表示「從一代傳給下一代」。\n❌ (B) throw away = 丟棄，語意相反。(C) break down = 分解；失敗，語意不符。(D) look into = 調查，語意不符。", "zh": "<i>Young people often move to cities for work, making it harder to <b>pass on<\/b> traditional practices from one generation to the next.<\/i><br>年輕人常為了工作搬到都市，使得傳統習俗更難一代一代傳承下去。", "sa": "【S】Young people 【V】often move 【M】to cities for work<br>【M】making it harder to pass on traditional practices from one generation to the next（分詞構句表結果）<br>📌 句型：make it + adj. + to V（虛受詞）；pass on「傳承」；from one generation to the next「代代相傳」。"}, {"n": 25, "p": 2, "stem": "(25)", "o": ["per day", "per class", "per meal", "per exercise"], "a": 0, "exp": "✓ (A) per day（每天）— 每天應睡七到九小時，per day 是最合理的時間單位。\n❌ (B) per class / (C) per meal / (D) per exercise 均不符合睡眠建議的語境。", "zh": "<i>Adults are generally recommended to get between seven and nine hours of sleep <b>per day<\/b>.<\/i><br>一般建議成年人每天睡七到九個小時。", "sa": "【S】Adults 【V】are generally recommended 【C】to get between seven and nine hours of sleep 【M】per day<br>📌 句型：be recommended to V「被建議……」；between A and B「介於 A 和 B 之間」；per day「每天」。"}, {"n": 26, "p": 2, "stem": "(26)", "o": ["As a result", "In addition", "On the contrary", "In other words"], "a": 1, "exp": "✓ (B) In addition（此外）— 前文說睡眠不足影響健康，後文補充說青少年特別脆弱，屬於補充說明關係。\n❌ (A) As a result = 因此（因果）。(C) On the contrary = 相反地（轉折）。(D) In other words = 換句話說（同義改述）。", "zh": "<i><b>In addition<\/b>, teenagers are particularly vulnerable, as their developing brains require even more rest than adults.<\/i><br>此外，青少年特別容易受影響，因為他們發育中的大腦比成人需要更多休息。", "sa": "【M】In addition（補充連接詞）【S】teenagers 【V】are 【C】particularly vulnerable<br>【M】as their developing brains require even more rest than adults（as 表原因）<br>📌 句型：even + 比較級「更加……」；developing 現在分詞當形容詞。"}, {"n": 27, "p": 2, "stem": "(27)", "o": ["increases", "replaces", "suppresses", "creates"], "a": 2, "exp": "✓ (C) suppresses（抑制）— 藍光「抑制」褪黑激素的產生，這是科學事實，且語意與後文「幫助調節睡眠的荷爾蒙」相符。\n❌ (A) increases = 增加，語意相反（藍光不增加褪黑激素）。(B) replaces = 取代。(D) creates = 創造，語意不符。", "zh": "<i>The blue light emitted by screens <b>suppresses<\/b> the production of melatonin (褪黑激素), a hormone that helps regulate sleep.<\/i><br>螢幕發出的藍光會抑制褪黑激素的分泌，而褪黑激素是一種幫助調節睡眠的荷爾蒙。", "sa": "【S】The blue light 【M】emitted by screens（過去分詞片語修飾 light）【V】suppresses 【O】the production of melatonin<br>【M】a hormone that helps regulate sleep（同位語 + 關係子句）<br>📌 句型：主詞核心是 light（單數），動詞用 suppresses；help + 原形動詞。"}, {"n": 28, "p": 2, "stem": "(28)", "o": ["unless", "so that", "although", "until"], "a": 1, "exp": "✓ (B) so that（以便；使得）— 保持固定的睡眠時間表「以便」隨著時間更容易入睡，表目的結果。\n❌ (A) unless = 除非（條件否定）。(C) although = 雖然（讓步）。(D) until = 直到（時間）。", "zh": "<i>Experts recommend avoiding screens for at least one hour before bed and keeping a consistent sleep schedule <b>so that<\/b> one falls asleep more easily over time.<\/i><br>專家建議睡前至少一小時避免使用螢幕，並維持規律的作息，這樣久而久之就能更容易入睡。", "sa": "【S】Experts 【V】recommend 【O】avoiding screens… and keeping a consistent sleep schedule<br>【M】so that one falls asleep more easily over time（表目的）<br>📌 句型：recommend + V-ing「建議做……」；so that + 子句「以便……」。"}, {"n": 29, "p": 3, "stem": "A student who is a complete beginner wants to exercise on Wednesday morning. Which class should she join?", "o": ["Yoga", "Pilates", "Zumba", "Strength Training"], "a": 2, "exp": "✓ (C) Zumba — Zumba 標示「所有程度（All levels）」，且週三上午 10:00–11:00 有課，最適合完全初學者。\n❌ (A) Yoga 雖是初級，但只在週一、週五上課。(B) Pilates 在週二、週四晚上，且為中階。(D) Strength Training 在週一、週五晚上，且為進階。", "zh": "題目：一位完全沒有基礎的學員想在星期三早上運動。她應該參加哪一堂課？<br>(A) 瑜伽<br>(B) 皮拉提斯<br>(C) 尊巴舞<br>(D) 肌力訓練", "sa": "題目：【S】A student 【M】who is a complete beginner 【V】wants 【O】to exercise on Wednesday morning<br>依據：Zumba｜Wed / Sat｜10:00–11:00 AM｜All levels<br>📌 句型：who 引導關係子句修飾 student；表格題要同時比對「星期、時段、程度」三個條件。"}, {"n": 30, "p": 3, "stem": "According to the schedule, which of the following is true?", "o": ["Swimming classes are available from Monday to Friday.", "Zumba is taught by Mr. Lee on Wednesday and Saturday.", "A class may be cancelled if not enough people register.", "Pilates is open to people of all fitness levels."], "a": 2, "exp": "✓ (C) — 公告備注說明：報名人數少於 5 人的課程將取消。\n❌ (A) 游泳課在週六和週日，非週一至五。(B) Zumba 由 Ms. Wang 授課，非 Mr. Lee。(D) Pilates 為中階程度，非所有程度。", "zh": "題目：根據課表，下列何者正確？<br>(A) 游泳課星期一到星期五都有開。<br>(B) 尊巴舞由李老師在星期三和星期六教授。<br>(C) 報名人數不足的課程可能會被取消。<br>(D) 皮拉提斯適合所有體能程度的人。", "sa": "題目：According to the schedule, 【S】which of the following 【V】is 【C】true?<br>依據句：【S】Classes with fewer than 5 registered participants 【V】will be cancelled.<br>📌 句型：with + N 修飾名詞「有……的」；fewer than「少於」（可數名詞）。"}, {"n": 31, "p": 3, "stem": "What is the main problem described in the post?", "o": ["The user's phone cannot connect to the internet.", "The user's new laptop cannot connect to Wi-Fi.", "The home router keeps turning off unexpectedly.", "The user forgot the password for the Wi-Fi network."], "a": 1, "exp": "✓ (B) — 貼文標題和內文清楚說明：「剛買的新筆電無法連接家中 Wi-Fi，顯示網路名稱但連線失敗」。\n❌ (A) 文中提到手機和平板都正常連線。(C)(D) 文中未提及。", "zh": "題目：這篇貼文描述的主要問題是什麼？<br>(A) 使用者的手機無法連上網路。<br>(B) 使用者的新筆電無法連上 Wi-Fi。<br>(C) 家裡的路由器一直無預警關機。<br>(D) 使用者忘記了 Wi-Fi 網路的密碼。", "sa": "題目：【S】What 【V】is 【C】the main problem 【M】described in the post?（過去分詞片語修飾 problem）<br>依據句：【S】I 【V】just bought 【O】a new laptop and for some reason 【S】it 【V】can't connect 【M】to my home Wi-Fi<br>📌 句型：for some reason「不知為何」。"}, {"n": 32, "p": 3, "stem": "What does TechGuru99 suggest the user should check?", "o": ["Whether the laptop's antivirus software is up to date", "Whether the Wi-Fi password needs to be changed", "Whether the laptop's Wi-Fi driver needs an update", "Whether the router is compatible with new laptops"], "a": 2, "exp": "✓ (C) — TechGuru99 建議進入裝置管理員（Device Manager），找到「網路介面卡（Network Adapters）」，右鍵選擇「更新驅動程式（Update driver）」。\n❌ (A)(B)(D) 文中未提及。", "zh": "題目：TechGuru99 建議使用者檢查什麼？<br>(A) 筆電的防毒軟體是否為最新版本<br>(B) Wi-Fi 密碼是否需要更改<br>(C) 筆電的 Wi-Fi 驅動程式是否需要更新<br>(D) 路由器是否與新筆電相容", "sa": "題目：【O】What does 【S】TechGuru99 【V】suggest (that) the user should check?<br>依據句：check 【O】if your laptop's Wi-Fi driver needs an update<br>📌 句型：check if／whether + 子句「檢查是否……」；suggest (that) S (should) V。"}, {"n": 33, "p": 3, "stem": "What is the passage mainly about?", "o": ["How coffee is grown in the mountains of Taiwan", "The history of coffee consumption in Asia", "The development of specialty coffee culture in Taiwan", "Why Taiwanese consumers prefer instant coffee"], "a": 2, "exp": "✓ (C) — 文章介紹台灣咖啡文化的興起、本土咖啡豆生產、精品咖啡師培育等，整體主題為台灣精品咖啡文化的發展。\n❌ (A) 僅是文章部分內容，不是整體主題。(B)(D) 文章未討論此議題。", "zh": "題目：本文主要在談什麼？<br>(A) 台灣山區如何種植咖啡<br>(B) 亞洲喝咖啡的歷史<br>(C) 台灣精品咖啡文化的發展<br>(D) 為什麼台灣消費者偏好即溶咖啡", "sa": "題目：【S】What 【V】is 【S】the passage 【M】mainly about?<br>依據句：a growing number of coffee lovers are turning to specialty coffee／The rise of specialty coffee in Taiwan…<br>📌 句型：a growing number of + 複數名詞「越來越多的……」；turn to「轉向」。"}, {"n": 34, "p": 3, "stem": "Which of the following is mentioned as a reason why Alishan is good for growing coffee?", "o": ["It has a warm and sunny climate all year round.", "It has high altitude, mist, and fertile soil.", "It is close to major coffee-consuming cities.", "It uses the most advanced farming technology in Asia."], "a": 1, "exp": "✓ (B) — 文章第二段明確提到：高海拔、多霧氣候和肥沃土壤是阿里山等地種植咖啡的理想條件。\n❌ (A)(C)(D) 文中未提及。", "zh": "題目：下列何者被提到是阿里山適合種咖啡的原因？<br>(A) 它全年氣候溫暖晴朗。<br>(B) 它海拔高、多霧，而且土壤肥沃。<br>(C) 它靠近主要的咖啡消費城市。<br>(D) 它使用亞洲最先進的農業技術。", "sa": "題目：【S】Which of the following 【V】is mentioned 【C】as a reason why Alishan is good for growing coffee?<br>依據句：【S】The high altitude, misty climate, and rich soil of these regions 【V】create 【O】ideal growing conditions<br>📌 句型：a reason why + 子句「……的原因」；fertile ≈ rich（肥沃的）。"}, {"n": 35, "p": 3, "stem": "According to the passage, what is one challenge that specialty coffee faces?", "o": ["There are not enough trained baristas in Taiwan.", "Taiwanese farmers cannot compete in global contests.", "It is more costly and can seem difficult to underst  "stem": "What concern do critics raise about animal-assisted therapy?", "o": ["Animals are not intelligent enough for therapy work.", "Children may become too attached to therapy animals.", "Therapy work may be stressful for the animals involved.", "AAT is only effective for elderly patients."], "a": 2, "exp": "✓ (C) — 文章第三段提到批評者關切：治療工作可能對動物本身造成壓力。因此現在有倫理準則要求定期評估治療動物的健康和福祉。\n❌ (A)(B)(D) 文中未提及。", "zh": "題目：批評者對動物輔助治療提出了什麼疑慮？<br>(A) 動物不夠聰明，無法從事治療工作。<br>(B) 孩子可能會對治療動物過度依戀。<br>(C) 治療工作可能讓參與的動物感到壓力。<br>(D) 動物輔助治療只對年長病患有效。", "sa": "題目：【O】What concern do 【S】critics 【V】raise 【M】about animal-assisted therapy?<br>依據句：There is also debate about 【O】the stress that therapy work may place on the animals themselves<br>📌 句型：place／put stress on + N「對……造成壓力」；raise concerns「提出疑慮」。"}, {"n": 39, "p": 3, "stem": "What is the main purpose of this passage?", "o": ["To compare convenience stores in different Asian countries", "To explain the wide-ranging role of convenience stores in Taiwan", "To argue that convenience stores are replacing traditional shops", "To describe the history of the 7-Eleven brand in Taiwan"], "a": 1, "exp": "✓ (B) — 文章介紹台灣便利商店提供的多元服務（繳費、取包裹、列印、政府憑證、火車票等）以及在災難期間的社區角色，目的是解釋便利商店在台灣生活中的廣泛功能。\n❌ (A)(C)(D) 均非文章主旨。", "zh": "題目：本文的主要目的是什麼？<br>(A) 比較不同亞洲國家的便利商店<br>(B) 說明便利商店在台灣扮演的多元角色<br>(C) 主張便利商店正在取代傳統商店<br>(D) 描述 7-Eleven 品牌在台灣的歷史", "sa": "題目：【S】What 【V】is 【C】the main purpose of this passage?<br>依據句：Today, 【S】they 【V】serve 【C】as essential service centers that touch nearly every aspect of daily life<br>📌 句型：serve as「作為、充當」；目的題選項常以 To + V 開頭。"}, {"n": 40, "p": 3, "stem": "According to the passage, which of the following services is available at Taiwan's convenience stores?", "o": ["Dental appointments and medical check-ups", "Language courses and library services", "Payment of utility bills and pickup of online orders", "Passport renewals and visa applications"], "a": 2, "exp": "✓ (C) — 文章第二段明確提到：顧客可以在便利商店繳交水電費（utility bills）和領取網購包裹（pick up online purchases）。\n❌ (A)(B)(D) const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "這位年輕科學家因為在再生能源領域的傑出貢獻而獲得了獎學金。<br><span class=\"blankline\">The young scientist was awarded a s<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① for her outstanding c<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② in the field of renewable energy.<\/span>", "ans": "① <b>scholarship<\/b>　② <b>contribution<\/b>", "exp": "scholarship（n.）= 獎學金，字首 s；contribution（n.）= 貢獻，字首 c。<br>完整句：The young scientist was awarded a <b>scholarship<\/b> for her outstanding <b>contribution<\/b> in the field of renewable energy.（這位年輕科學家因在再生能源領域的傑出貢獻而獲得了獎學金。）", "zh": "這位年輕科學家因為在再生能源領域的傑出貢獻而獲得了獎學金。", "sa": "【S】The young scientist 【V】was awarded 【O】a scholarship<br>【M】for her outstanding contribution in the field of renewable energy<br>📌 句型：award + 人 + 物 → 被動 人 + be awarded + 物「某人獲頒……」；for + N 表原因「因為……」。"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>the doctor / every patient / with care and respect / advised / to treat others<\/i>", "ans": "The doctor advised every patient to treat others with care and respect.", "exp": "句型為 \"advise + 人 + to do\"：建議某人做某事。\"treat others with care and respect\" = 以關心和尊重對待他人。完整句：The doctor advised every patient to treat others with care and respect.", "zh": "醫生建議每一位病患以關心和尊重對待他人。", "sa": "【S】The doctor 【V】advised 【O】every patient 【C】to treat others with care and respect<br>📌 句型：advise + 人 + to V「建議某人做……」；treat + O + with care「細心對待……」。<br>例：My teacher advised me to read more books."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>隨著人口老化，社會需要更多的醫療資源來照顧老年人。", "ans": "As the population ages, society needs more medical resources to take care of the elderly.", "exp": "\"As the population ages\" = 隨著人口老化（as 引導時間/因果副詞子句）；\"medical resources\" = 醫療資源；\"the elderly\" = 老年人（集合名詞）。另可寫為：With an aging population, society needs more medical resources to care for older people.", "zh": "題意：隨著人口老化，社會需要更多的醫療資源來照顧老年人。", "sa": "【M】As the population ages（as 表「隨著」）<br>【S】society 【V】needs 【O】more medical const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]+ptrHtml(String(q.n)); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){

 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});
return secs;
});</script>

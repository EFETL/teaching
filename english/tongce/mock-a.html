<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">

<title>統測英文模擬考卷 A</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">

      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>

    </div>

  <div class="actions">

    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>

  <footer>統測英文模擬考卷 A　&middot;　全民補習班 線上教學</footer>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nTaiwan has become a world leader in the production of semiconductors (半導體). These tiny chips power almost everything from smartphones to electric cars. At the center of this success is TSMC (台積電), a company founded in 1987. Over the years, TSMC has developed the ability to manufacture chips with incredible precision, staying <span class=\"blk\">21</span> of global competitors. The company's advanced processes allow it to produce chips that are smaller and more powerful than ever before. Taiwan's strong performance in this field <span class=\"blk\">22</span> the country a key player in global supply chains. Governments around the world now see Taiwan's chip industry as <span class=\"blk\">23</span> to their own technology development. As demand for AI and high-performance computing grows, TSMC and its partners will likely <span class=\"blk\">24</span> their role in shaping the future of technology.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nRemote work, once seen as a temporary solution during the pandemic, has become a lasting part of modern work life. Many employees enjoy the <span class=\"blk\">25</span> to work from home or from anywhere they choose. Studies show that remote workers often feel more satisfied with their jobs and report higher levels of productivity. <span class=\"blk\">26</span>, not everyone benefits equally from this arrangement. Some workers struggle to stay focused without the structure of an office, while others feel lonely and disconnected from their team. To address these challenges, companies have introduced &ldquo;hybrid&rdquo; models, <span class=\"blk\">27</span> employees split their time between the office and home. This balance aims to offer the best of both worlds. As technology continues to improve, remote work tools such as video conferencing and cloud-based software will make collaboration even easier, <span class=\"blk\">28</span> the future of work truly flexible.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<i>Read the notice below and answer the questions.</i><br><br>\n<b>Greenfield Community Center</b><br>\n<b>Summer Volunteer Program &ndash; 2026</b><br><br>\nWe are looking for enthusiastic volunteers to help with our summer programs for children aged 6&ndash;12.<br><br>\n<b>Positions Available:</b><br>\n&bull; Reading Buddy (Mon &amp; Wed, 9:00&ndash;11:00 AM)<br>\n&bull; Arts &amp; Crafts Instructor (Tue &amp; Thu, 2:00&ndash;4:00 PM)<br>\n&bull; Sports Coach (Sat, 8:00 AM&ndash;12:00 PM)<br><br>\n<b>Requirements:</b><br>\n&bull; Age 16 or above<br>\n&bull; No prior experience required for Reading Buddy<br>\n&bull; Must have basic art skills for Arts &amp; Crafts<br>\n&bull; Relevant sports background preferred for Sports Coach<br><br>\n<b>How to Apply:</b><br>\nSubmit a short application form at the front desk or email us at volunteer@greenfieldcc.org by June 30, 2026.<br><br>\nAll accepted volunteers will receive a certificate of participation.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<i>Read the following email and answer the questions.</i>\n<div class=\"email-h\">From: manager@sunflowerhotel.com&nbsp;&nbsp;|&nbsp;&nbsp;To: guestservices@sunflowerhotel.com&nbsp;&nbsp;|&nbsp;&nbsp;Subject: Feedback from Room 308 &ndash; April 18, 2026</div>\nDear Team,<br><br>\nI'd like to share some feedback we received from a guest who stayed in Room 308 last Friday.<br><br>\nThe guest, Mr. Chen, praised the cleanliness of the room and the helpfulness of the check-in staff. He was especially pleased with the complimentary breakfast, saying it offered a great variety of fresh food. However, he mentioned that the air conditioning in the room was making a loud noise throughout the night, which disturbed his sleep. He also found the Wi-Fi connection in the room to be quite slow.<br><br>\nPlease ask maintenance to check Room 308's air conditioning unit as soon as possible. I would also like IT to look into the Wi-Fi coverage on the third floor.<br><br>\nLet's make sure these issues are resolved before the room is booked again.<br><br>\nBest regards,<br>Manager Lin</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nTaiwan's National Health Insurance (NHI) system is widely regarded as one of the best in the world. Launched in 1995, it covers more than 99% of Taiwan's population, providing access to hospitals, clinics, and pharmacies for a low co-payment fee. Before NHI was introduced, about 41% of residents had no health insurance at all, meaning many people avoided seeing a doctor due to cost.<br><br>\nToday, patients in Taiwan can visit almost any clinic or hospital of their choice without a referral. This flexibility is rare in many countries. For example, in some nations, patients must first see a general doctor before being referred to a specialist, which can take weeks or even months.<br><br>\nCritics of the system point out that the low co-payment model puts pressure on hospitals and clinics, which are sometimes overcrowded. Doctors also face heavy workloads. Despite these concerns, satisfaction with NHI remains high. Surveys consistently show that over 80% of Taiwanese people are happy with the system, and it has been studied by governments around the world as a model for universal healthcare.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nUrban farming is a growing trend in cities around the world. As more people move to urban areas, the idea of growing food in cities has gained popularity. Rooftop gardens, vertical farms, and community plots are now appearing in places like New York, Singapore, and Tokyo.<br><br>\nOne key benefit of urban farming is reducing the distance food travels from farm to table. When food is grown locally, it is fresher and requires less packaging. This also means fewer greenhouse gas emissions from transportation. In addition, urban farms can help cool down cities, which tend to be much warmer than surrounding areas due to the &ldquo;urban heat island&rdquo; effect.<br><br>\nHowever, urban farming also faces significant challenges. Space in cities is expensive and limited. Growing enough food to feed a large urban population is difficult, and the costs of setting up rooftop farms or vertical growing systems can be very high. Despite these obstacles, many cities are offering subsidies and policy support to encourage more urban farming projects.<br><br>\nExperts believe that while urban farming alone cannot solve food security challenges, it plays a valuable role as part of a broader strategy to make cities more sustainable and self-sufficient.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nThe concept of &ldquo;slow travel&rdquo; has been gaining traction among modern tourists who are tired of rushing through tourist attractions. Unlike traditional tourism, which often involves visiting as many landmarks as possible in a short time, slow travel encourages people to stay in one place longer and experience local life more deeply.<br><br>\nSlow travelers typically rent apartments instead of staying in hotels, visit local markets rather than tourist shops, and take public transportation instead of tour buses. They prefer to eat where locals eat and to learn a few words of the local language. In this way, they gain a richer understanding of the culture and form more meaningful connections with the people they meet.<br><br>\nThe slow travel movement also benefits local communities. When tourists spend more time in one area, they tend to spend more money at local businesses instead of large international chains. This helps support the local economy and encourages the preservation of traditional crafts and cuisine.<br><br>\nCritics argue that slow travel is a privilege available only to those with enough time and money to stay abroad for extended periods. Indeed, not everyone can take a month-long vacation. However, the principles of slow travel can be applied even on shorter trips &mdash; by choosing to explore fewer places more deeply rather than rushing through a long list of must-see spots.</div>"};
const PTR = {"21": [{"en": "Taiwan has become a world leader in the production of semiconductors (半導體).", "zh": "台灣已成為半導體生產的世界領導者。", "sa": "【S】Taiwan 【V】has become 【C】a world leader 【M】in the production of semiconductors<br>📌 現在完成式表至今的結果；become + 名詞補語。"}, {"en": "These tiny chips power almost everything from smartphones to electric cars.", "zh": "這些微小的晶片為從智慧型手機到電動車的幾乎所有東西提供動力。", "sa": "【S】These tiny chips 【V】power 【O】almost everything 【M】from smartphones to electric cars<br>📌 power 在此當動詞「為……提供動力」；from A to B 表範圍。"}, {"en": "At the center of this success is TSMC (台積電), a company founded in 1987.", "zh": "這項成功的核心是台積電，一家成立於 1987 年的公司。", "sa": "【M】At the center of this success 【V】is 【S】TSMC, 【M】a company founded in 1987（同位語）<br>📌 地方副詞片語放句首形成倒裝：介系詞片語 + be + 主詞。"}, {"en": "Over the years, TSMC has developed the ability to manufacture chips with incredible precision, staying <b>ahead<\/b> of global competitors.", "zh": "多年來，台積電已發展出以驚人精準度製造晶片的能力，始終領先全球競爭對手。", "sa": "【S】TSMC 【V】has developed 【O】the ability to manufacture chips…<br>【M】staying ahead of global competitors（分詞構句）<br>📌 stay ahead of「保持領先」。"}, {"en": "The company's advanced processes allow it to produce chips that are smaller and more powerful than ever before.", "zh": "這家公司的先進製程讓它能生產出比以往更小、更強大的晶片。", "sa": "【S】The company's advanced processes 【V】allow 【O】it 【C】to produce chips 【M】that are smaller and more powerful than ever before<br>📌 allow + O + to V「使……能夠……」；比較級 + than ever before「比以往都……」。"}, {"en": "Taiwan's strong performance in this field <b>makes<\/b> the country a key player in global supply chains.", "zh": "台灣在這個領域的強勁表現，使它成為全球供應鏈中的關鍵角色。", "sa": "【S】Taiwan's strong performance 【V】makes 【O】the country 【C】a key player<br>📌 make + O + C（名詞）「使……成為……」。"}, {"en": "Governments around the world now see Taiwan's chip industry as <b>essential<\/b> to their own technology development.", "zh": "世界各國政府現在都把台灣的晶片產業視為對自身科技發展不可或缺的存在。", "sa": "【S】Governments around the world 【V】see 【O】Taiwan's chip industry 【C】as essential to…<br>📌 see A as B「把 A 視為 B」；essential to「對……不可或缺」。"}, {"en": "As demand for AI and high-performance computing grows, TSMC and its partners will likely <b>expand<\/b> their role in shaping the future of technology.", "zh": "隨著對人工智慧與高效能運算的需求成長，台積電和它的夥伴很可能會擴大他們在形塑科技未來上的角色。", "sa": "【M】As demand… grows 【S】TSMC and its partners 【V】will likely expand 【O】their role<br>📌 as 表「隨著」；role in + V-ing。"}], "25": [{"en": "Remote work, once seen as a temporary solution during the pandemic, has become a lasting part of modern work life.", "zh": "遠距工作曾被視為疫情期間的暫時解方，如今已成為現代工作生活中持久的一部分。", "sa": "【S】Remote work 【M】once seen as a temporary solution…（插入的分詞片語）【V】has become 【C】a lasting part of modern work life<br>📌 be seen as「被視為」，此處省略 which was。"}, {"en": "Many employees enjoy the <b>freedom<\/b> to work from home or from anywhere they choose.", "zh": "許多員工享受可以在家或在任何自己選擇的地方工作的自由。", "sa": "【S】Many employees 【V】enjoy 【O】the freedom 【M】to work from home…<br>📌 the freedom to V「做……的自由」。"}, {"en": "Studies show that remote workers often feel more satisfied with their jobs and report higher levels of productivity.", "zh": "研究顯示，遠距工作者通常對工作更滿意，並表示生產力更高。", "sa": "【S】Studies 【V】show 【O】that remote workers often feel more satisfied… and report higher levels of productivity（名詞子句）<br>📌 be satisfied with「對……滿意」。"}, {"en": "<b>However<\/b>, not everyone benefits equally from this arrangement.", "zh": "然而，並不是每個人都能從這種安排中同等受益。", "sa": "【S】not everyone 【V】benefits 【M】equally from this arrangement<br>📌 not everyone 部分否定；benefit from「從……受益」。"}, {"en": "Some workers struggle to stay focused without the structure of an office, while others feel lonely and disconnected from their team.", "zh": "有些員工在沒有辦公室規律的情況下難以保持專注，而另一些人則感到孤單、與團隊疏離。", "sa": "【S】Some workers 【V】struggle 【O】to stay focused…, 【M】while others feel lonely and disconnected…<br>📌 some…, while others…「有些……，而有些……」（while 表對比）；struggle to V「努力／難以……」。"}, {"en": "To address these challenges, companies have introduced “hybrid” models, <b>where<\/b> employees split their time between the office and home.", "zh": "為了因應這些挑戰，公司推出了「混合式」模式，讓員工把時間分配在辦公室和家裡。", "sa": "【M】To address these challenges 【S】companies 【V】have introduced 【O】“hybrid” models<br>【M】where employees split their time…（關係副詞子句）<br>📌 where = in which。"}, {"en": "This balance aims to offer the best of both worlds.", "zh": "這種平衡的目標是兼顧兩者的優點。", "sa": "【S】This balance 【V】aims 【O】to offer the best of both worlds<br>📌 aim to V「目的在於……」；the best of both worlds「兩全其美」。"}, {"en": "As technology continues to improve, remote work tools such as video conferencing and cloud-based software will make collaboration even easier, <b>making<\/b> the future of work truly flexible.", "zh": "隨著科技持續進步，視訊會議和雲端軟體等遠距工作工具將讓協作更加容易，使未來的工作型態真正具有彈性。", "sa": "【S】remote work tools 【V】will make 【O】collaboration 【C】even easier<br>【M】making the future of work truly flexible（分詞構句表結果）<br>📌 make + O + adj.。"}], "29": [{"en": "Greenfield Community Center — Summer Volunteer Program – 2026", "zh": "綠野社區中心——2026 年暑期志工計畫", "sa": "名詞片語標題，省略主詞動詞。"}, {"en": "We are looking for enthusiastic volunteers to help with our summer programs for children aged 6–12.", "zh": "我們正在招募熱心的志工，協助我們為 6 到 12 歲兒童舉辦的暑期活動。", "sa": "【S】We 【V】are looking for 【O】enthusiastic volunteers 【M】to help with our summer programs…<br>📌 look for「尋找」；children aged 6–12「6 到 12 歲的兒童」（aged 為分詞修飾）。"}, {"en": "Positions Available: Reading Buddy (Mon & Wed, 9:00–11:00 AM)", "zh": "可申請職位：閱讀小幫手（週一與週三，上午 9:00–11:00）", "sa": "名詞片語條列；available 後置修飾 positions。"}, {"en": "Arts & Crafts Instructor (Tue & Thu, 2:00–4:00 PM)", "zh": "美術勞作講師（週二與週四，下午 2:00–4:00）", "sa": "名詞片語條列，省略主詞動詞。"}, {"en": "Sports Coach (Sat, 8:00 AM–12:00 PM)", "zh": "運動教練（週六，上午 8:00–中午 12:00）", "sa": "名詞片語條列，省略主詞動詞。"}, {"en": "Requirements: Age 16 or above", "zh": "條件：年滿 16 歲以上", "sa": "名詞片語條列；or above「或以上」。"}, {"en": "No prior experience required for Reading Buddy", "zh": "閱讀小幫手不需要先備經驗", "sa": "省略 be 動詞：No prior experience (is) required…<br>📌 被動語態的省略寫法，常見於公告。"}, {"en": "Must have basic art skills for Arts & Crafts", "zh": "美術勞作講師必須具備基本美術技能", "sa": "省略主詞 (Applicants)：【V】must have 【O】basic art skills<br>📌 must + 原形動詞「必須」。"}, {"en": "Relevant sports background preferred for Sports Coach", "zh": "運動教練以具備相關運動背景者優先", "sa": "省略 be 動詞：Relevant sports background (is) preferred<br>📌 preferred「優先考慮」。"}, {"en": "How to Apply: Submit a short application form at the front desk or email us at volunteer@greenfieldcc.org by June 30, 2026.", "zh": "申請方式：請於 2026 年 6 月 30 日前到櫃台繳交簡短的申請表，或寄電子郵件到 volunteer@greenfieldcc.org。", "sa": "祈使句：【V】Submit 【O】a short application form… or 【V】email 【O】us…<br>📌 by + 時間「在……之前」；how to V「如何……」。"}, {"en": "All accepted volunteers will receive a certificate of participation.", "zh": "所有獲錄取的志工都會收到一張參與證書。", "sa": "【S】All accepted volunteers 【V】will receive 【O】a certificate of participation<br>📌 accepted 為過去分詞當形容詞「被錄取的」。"}], "31": [{"en": "From: manager@sunflowerhotel.com | To: guestservices@sunflowerhotel.com | Subject: Feedback from Room 308 – April 18, 2026", "zh": "寄件者：manager@sunflowerhotel.com｜收件者：guestservices@sunflowerhotel.com｜主旨：308 號房的意見回饋——2026 年 4 月 18 日", "sa": "Email 表頭，名詞片語條列。"}, {"en": "Dear Team,", "zh": "親愛的團隊：", "sa": "書信稱呼語。"}, {"en": "I'd like to share some feedback we received from a guest who stayed in Room 308 last Friday.", "zh": "我想分享一則我們從上週五入住 308 號房的一位房客那裡收到的意見回饋。", "sa": "【S】I 【V】'd like 【O】to share some feedback 【M】(that) we received from a guest 【M】who stayed in Room 308…<br>📌 would like to V「想要……」；兩層關係子句。"}, {"en": "The guest, Mr. Chen, praised the cleanliness of the room and the helpfulness of the check-in staff.", "zh": "這位房客陳先生稱讚了房間的整潔以及櫃台入住人員的熱心幫忙。", "sa": "【S】The guest, Mr. Chen（同位語）【V】praised 【O】the cleanliness of the room and the helpfulness of the check-in staff<br>📌 praise + N「稱讚……」。"}, {"en": "He was especially pleased with the complimentary breakfast, saying it offered a great variety of fresh food.", "zh": "他對免費早餐特別滿意，說早餐提供了種類豐富的新鮮食物。", "sa": "【S】He 【V】was 【C】especially pleased with the complimentary breakfast<br>【M】saying it offered…（分詞構句）<br>📌 be pleased with「對……滿意」；a variety of「各式各樣的」。"}, {"en": "However, he mentioned that the air conditioning in the room was making a loud noise throughout the night, which disturbed his sleep.", "zh": "不過，他提到房間的冷氣整晚發出很大的噪音，干擾了他的睡眠。", "sa": "【S】he 【V】mentioned 【O】that the air conditioning… was making a loud noise…<br>【M】which disturbed his sleep（非限定關代，指前面整件事）"}, {"en": "He also found the Wi-Fi connection in the room to be quite slow.", "zh": "他也覺得房間的 Wi-Fi 連線相當慢。", "sa": "【S】He 【V】found 【O】the Wi-Fi connection in the room 【C】to be quite slow<br>📌 find + O + (to be) + adj.「覺得……是……」。"}, {"en": "Please ask maintenance to check Room 308's air conditioning unit as soon as possible.", "zh": "請盡快請維修部門檢查 308 號房的冷氣機。", "sa": "祈使句：【V】ask 【O】maintenance 【C】to check Room 308's air conditioning unit<br>📌 ask + 人 + to V；as soon as possible「盡快」。"}, {"en": "I would also like IT to look into the Wi-Fi coverage on the third floor.", "zh": "我也希望資訊部門調查三樓的 Wi-Fi 訊號涵蓋範圍。", "sa": "【S】I 【V】would like 【O】IT 【C】to look into the Wi-Fi coverage…<br>📌 would like + 人 + to V「希望某人……」；look into「調查」。"}, {"en": "Let's make sure these issues are resolved before the room is booked again.", "zh": "讓我們確保這些問題在這間房再次被預訂之前都已解決。", "sa": "【V】Let's make sure 【O】(that) these issues are resolved 【M】before the room is booked again<br>📌 make sure (that)…「確保……」；兩個子句都是被動語態。"}, {"en": "Best regards, Manager Lin", "zh": "敬祝順心，林經理", "sa": "書信結尾敬語與署名。"}], "33": [{"en": "Taiwan's National Health Insurance (NHI) system is widely regarded as one of the best in the world.", "zh": "台灣的全民健康保險（健保）制度被廣泛認為是全世界最好的制度之一。", "sa": "【S】Taiwan's National Health Insurance system 【V】is widely regarded 【C】as one of the best in the world<br>📌 be regarded as「被視為」；one of the + 最高級。"}, {"en": "Launched in 1995, it covers more than 99% of Taiwan's population, providing access to hospitals, clinics, and pharmacies for a low co-payment fee.", "zh": "健保於 1995 年開辦，涵蓋超過 99% 的台灣人口，讓民眾只需支付低廉的部分負擔就能使用醫院、診所和藥局。", "sa": "【M】Launched in 1995（過去分詞構句）【S】it 【V】covers 【O】more than 99% of Taiwan's population<br>【M】providing access to…（現在分詞構句）<br>📌 access to + N「使用……的管道」。"}, {"en": "Before NHI was introduced, about 41% of residents had no health insurance at all, meaning many people avoided seeing a doctor due to cost.", "zh": "在健保實施之前，約有 41% 的居民完全沒有健康保險，這表示許多人因為費用而不去看醫生。", "sa": "【M】Before NHI was introduced 【S】about 41% of residents 【V】had 【O】no health insurance at all<br>【M】meaning many people avoided seeing a doctor…<br>📌 avoid + V-ing；no… at all「完全沒有」。"}, {"en": "Today, patients in Taiwan can visit almost any clinic or hospital of their choice without a referral.", "zh": "如今，台灣的病患幾乎可以不經轉診，到自己選擇的任何診所或醫院看病。", "sa": "【S】patients in Taiwan 【V】can visit 【O】almost any clinic or hospital of their choice 【M】without a referral<br>📌 of one's choice「自己選擇的」。"}, {"en": "This flexibility is rare in many countries.", "zh": "這種彈性在許多國家是很少見的。", "sa": "【S】This flexibility 【V】is 【C】rare 【M】in many countries"}, {"en": "For example, in some nations, patients must first see a general doctor before being referred to a specialist, which can take weeks or even months.", "zh": "例如，在某些國家，病患必須先看一般科醫師，才能被轉診給專科醫師，而這可能要花好幾週甚至好幾個月。", "sa": "【S】patients 【V】must first see 【O】a general doctor 【M】before being referred to a specialist<br>【M】which can take weeks or even months（非限定關代）<br>📌 before + being p.p.（動名詞被動）。"}, {"en": "Critics of the system point out that the low co-payment model puts pressure on hospitals and clinics, which are sometimes overcrowded.", "zh": "批評這個制度的人指出，低部分負擔的模式對醫院和診所造成壓力，使它們有時過度擁擠。", "sa": "【S】Critics of the system 【V】point out 【O】that the low co-payment model puts pressure on hospitals and clinics…<br>📌 point out that…「指出……」；put pressure on「對……施壓」。"}, {"en": "Doctors also face heavy workloads.", "zh": "醫師也面臨沉重的工作量。", "sa": "【S】Doctors 【V】also face 【O】heavy workloads"}, {"en": "Despite these concerns, satisfaction with NHI remains high.", "zh": "儘管有這些疑慮，民眾對健保的滿意度仍然很高。", "sa": "【M】Despite these concerns 【S】satisfaction with NHI 【V】remains 【C】high<br>📌 despite + N「儘管」；remain + adj.（連綴動詞）。"}, {"en": "Surveys consistently show that over 80% of Taiwanese people are happy with the system, and it has been studied by governments around the world as a model for universal healthcare.", "zh": "調查一致顯示，超過 80% 的台灣人對這個制度感到滿意，而且它已被世界各國政府當作全民醫療的典範來研究。", "sa": "【S】Surveys 【V】consistently show 【O】that over 80%… are happy with the system<br>and 【S】it 【V】has been studied 【M】by governments… as a model…<br>📌 現在完成式被動 has been + p.p.。"}], "36": [{"en": "Urban farming is a growing trend in cities around the world.", "zh": "都市農業是全球各城市中一股日益興起的趨勢。", "sa": "【S】Urban farming 【V】is 【C】a growing trend 【M】in cities around the world"}, {"en": "As more people move to urban areas, the idea of growing food in cities has gained popularity.", "zh": "隨著越來越多人搬到都市地區，在城市裡種植糧食的想法越來越受歡迎。", "sa": "【M】As more people move to urban areas 【S】the idea of growing food in cities 【V】has gained 【O】popularity<br>📌 as 表「隨著」；gain popularity「受歡迎」。"}, {"en": "Rooftop gardens, vertical farms, and community plots are now appearing in places like New York, Singapore, and Tokyo.", "zh": "屋頂花園、垂直農場和社區農地，如今正出現在紐約、新加坡和東京等地。", "sa": "【S】Rooftop gardens, vertical farms, and community plots 【V】are now appearing 【M】in places like…<br>📌 like = such as「例如」。"}, {"en": "One key benefit of urban farming is reducing the distance food travels from farm to table.", "zh": "都市農業的一個重要好處是縮短食物從農場到餐桌的運送距離。", "sa": "【S】One key benefit of urban farming 【V】is 【C】reducing the distance 【M】(that) food travels from farm to table<br>📌 動名詞當補語；the distance 後省略關代。"}, {"en": "When food is grown locally, it is fresher and requires less packaging.", "zh": "當食物在本地種植時，它會更新鮮，也需要較少的包裝。", "sa": "【M】When food is grown locally 【S】it 【V】is 【C】fresher and 【V】requires 【O】less packaging"}, {"en": "This also means fewer greenhouse gas emissions from transportation.", "zh": "這也意味著運輸所產生的溫室氣體排放更少。", "sa": "【S】This 【V】also means 【O】fewer greenhouse gas emissions from transportation"}, {"en": "In addition, urban farms can help cool down cities, which tend to be much warmer than surrounding areas due to the “urban heat island” effect.", "zh": "此外，都市農場可以幫助城市降溫，因為「都市熱島」效應，城市往往比周邊地區熱得多。", "sa": "【S】urban farms 【V】can help cool down 【O】cities, 【M】which tend to be much warmer than surrounding areas…<br>📌 help + 原形動詞；much + 比較級「……得多」。"}, {"en": "However, urban farming also faces significant challenges.", "zh": "然而，都市農業也面臨重大的挑戰。", "sa": "【S】urban farming 【V】also faces 【O】significant challenges"}, {"en": "Space in cities is expensive and limited.", "zh": "城市裡的空間既昂貴又有限。", "sa": "【S】Space in cities 【V】is 【C】expensive and limited"}, {"en": "Growing enough food to feed a large urban population is difficult, and the costs of setting up rooftop farms or vertical growing systems can be very high.", "zh": "要種出足夠養活大量都市人口的糧食很困難，而且設置屋頂農場或垂直種植系統的成本可能非常高。", "sa": "【S】Growing enough food to feed a large urban population（動名詞片語當主詞）【V】is 【C】difficult<br>and 【S】the costs of setting up… 【V】can be 【C】very high"}, {"en": "Despite these obstacles, many cities are offering subsidies and policy support to encourage more urban farming projects.", "zh": "儘管有這些阻礙，許多城市正提供補助和政策支持，以鼓勵更多都市農業計畫。", "sa": "【M】Despite these obstacles 【S】many cities 【V】are offering 【O】subsidies and policy support 【M】to encourage…（不定詞表目的）"}, {"en": "Experts believe that while urban farming alone cannot solve food security challenges, it plays a valuable role as part of a broader strategy to make cities more sustainable and self-sufficient.", "zh": "專家認為，雖然光靠都市農業無法解決糧食安全的挑戰，但它作為讓城市更永續、更自給自足的整體策略的一部分，扮演著寶貴的角色。", "sa": "【S】Experts 【V】believe 【O】that while urban farming alone cannot solve…, it plays a valuable role…<br>📌 while 表讓步「雖然」；make + O + adj.。"}], "39": [{"en": "The concept of “slow travel” has been gaining traction among modern tourists who are tired of rushing through tourist attractions.", "zh": "「慢旅行」的概念在厭倦匆忙趕景點的現代觀光客之間越來越受歡迎。", "sa": "【S】The concept of “slow travel” 【V】has been gaining 【O】traction 【M】among modern tourists who are tired of rushing…<br>📌 現在完成進行式；be tired of + V-ing「厭倦……」。"}, {"en": "Unlike traditional tourism, which often involves visiting as many landmarks as possible in a short time, slow travel encourages people to stay in one place longer and experience local life more deeply.", "zh": "傳統觀光常常是在短時間內造訪盡可能多的地標；慢旅行則不同，它鼓勵人們在一個地方停留更久，更深入地體驗當地生活。", "sa": "【M】Unlike traditional tourism, which… 【S】slow travel 【V】encourages 【O】people 【C】to stay… and experience…<br>📌 encourage + 人 + to V；as many + N + as possible「盡可能多的……」。"}, {"en": "Slow travelers typically rent apartments instead of staying in hotels, visit local markets rather than tourist shops, and take public transportation instead of tour buses.", "zh": "慢旅行者通常會租公寓而不是住飯店，逛當地市場而不是觀光商店，並搭乘大眾運輸而不是遊覽車。", "sa": "【S】Slow travelers 【V】rent… 【V】visit… and 【V】take…（三個並列動詞）<br>📌 instead of + V-ing／N、rather than「而不是……」。"}, {"en": "They prefer to eat where locals eat and to learn a few words of the local language.", "zh": "他們喜歡在當地人吃飯的地方用餐，也喜歡學幾句當地語言。", "sa": "【S】They 【V】prefer 【O】to eat where locals eat and to learn a few words…<br>📌 prefer to V「比較喜歡……」；where 引導地方副詞子句。"}, {"en": "In this way, they gain a richer understanding of the culture and form more meaningful connections with the people they meet.", "zh": "透過這種方式，他們對當地文化有更豐富的理解，並和所遇到的人建立更有意義的連結。", "sa": "【M】In this way 【S】they 【V】gain 【O】a richer understanding… and 【V】form 【O】more meaningful connections 【M】with the people (whom) they meet"}, {"en": "The slow travel movement also benefits local communities.", "zh": "慢旅行運動也讓當地社區受益。", "sa": "【S】The slow travel movement 【V】also benefits 【O】local communities"}, {"en": "When tourists spend more time in one area, they tend to spend more money at local businesses instead of large international chains.", "zh": "當觀光客在一個地區待得更久時，他們往往會在當地商家而非大型國際連鎖店花更多錢。", "sa": "【M】When tourists spend more time in one area 【S】they 【V】tend to spend 【O】more money 【M】at local businesses…<br>📌 tend to V「傾向於……」。"}, {"en": "This helps support the local economy and encourages the preservation of traditional crafts and cuisine.", "zh": "這有助於支撐當地經濟，並促進傳統工藝與飲食的保存。", "sa": "【S】This 【V】helps 【O】support the local economy and 【V】encourages 【O】the preservation of traditional crafts and cuisine"}, {"en": "Critics argue that slow travel is a privilege available only to those with enough time and money to stay abroad for extended periods.", "zh": "批評者認為，慢旅行是一種特權，只有那些有足夠時間和金錢長期待在國外的人才能享有。", "sa": "【S】Critics 【V】argue 【O】that slow travel is a privilege available only to those with…<br>📌 available to + 人；those with…「擁有……的人」。"}, {"en": "Indeed, not everyone can take a month-long vacation.", "zh": "的確，並不是每個人都能休一個月的長假。", "sa": "【S】not everyone 【V】can take 【O】a month-long vacation<br>📌 部分否定；month-long 為複合形容詞。"}, {"en": "However, the principles of slow travel can be applied even on shorter trips — by choosing to explore fewer places more deeply rather than rushing through a long list of must-see spots.", "zh": "然而，即使是較短的旅程也能運用慢旅行的原則——選擇更深入地探索較少的地方，而不是匆忙跑完一長串必去景點。", "sa": "【S】the principles of slow travel 【V】can be applied 【M】even on shorter trips<br>【M】by choosing to explore… rather than rushing through…<br>📌 助動詞被動 can be + p.p.；by + V-ing「藉由……」。"}]};
const Q = [{"n": 1, "p": 0, "stem": "The new library has a large _____ of books and e-books that students can borrow for free.", "o": ["collection", "mission", "shadow", "victory"], "a": 0, "exp": "✓ (A) collection（收藏；館藏）— 圖書館有大量的書籍館藏，符合句意。\n❌ (B) mission = 任務、使命，與圖書館的書籍無關。\n❌ (C) shadow = 陰影，不適用。\n❌ (D) victory = 勝利，不符合語境。", "zh": "新的圖書館有大量的書籍和電子書館藏，學生可以免費借閱。", "sa": "【S】The new library 【V】has 【O】a large collection of books and e-books<br>【M】that students can borrow for free（關係子句修飾 collection）<br>📌 句型：a large collection of + 複數名詞「大量收藏的……」；that 為受格關代，可省略。", "on": ["圖書館有大量的書籍館藏，符合句意。", "任務、使命，與圖書館的書籍無關。", "陰影，不適用。", "勝利，不符合語境。"], "oz": ["收藏；館藏", "任務；使命", "陰影；影子", "勝利"]}, {"n": 2, "p": 0, "stem": "After the typhoon, many roads were blocked, making it difficult for rescue teams to _____ the affected areas.", "o": ["decorate", "invite", "reach", "waste"], "a": 2, "exp": "✓ (C) reach（抵達）— 救援隊難以「抵達」受影響地區，語意通順。\n❌ (A) decorate = 裝飾，語意不符。\n❌ (B) invite = 邀請，不適用。\n❌ (D) waste = 浪費，語意不符。", "zh": "颱風過後，許多道路被阻斷，使得救援隊難以抵達受災地區。", "sa": "【M】After the typhoon 【S】many roads 【V】were blocked（過去式被動）<br>【M】making it difficult for rescue teams to reach the affected areas（分詞構句表結果）<br>📌 句型：make + it（虛受詞）+ adj. + for 人 + to V「使某人難以……」<br>例：The rain made it hard for us to drive.", "on": ["裝飾，語意不符。", "邀請，不適用。", "救援隊難以「抵達」受影響地區，語意通順。", "浪費，語意不符。"], "oz": ["裝飾；布置", "邀請", "到達；抵達", "浪費"]}, {"n": 3, "p": 0, "stem": "The doctor told him to avoid _____ foods, such as fried chicken and potato chips, because they were bad for his heart.", "o": ["active", "greasy", "humble", "sharp"], "a": 1, "exp": "✓ (B) greasy（油膩的）— 炸雞和洋芋片是「油膩」食物，與心臟健康的警示一致。\n❌ (A) active = 活躍的，不修飾食物。\n❌ (C) humble = 謙遜的，語意不符。\n❌ (D) sharp = 鋒利的，不適用。", "zh": "醫生告訴他要避免油膩的食物，例如炸雞和洋芋片，因為它們對他的心臟不好。", "sa": "【S】The doctor 【V】told 【O】him 【C】to avoid greasy foods<br>【M】because they were bad for his heart<br>📌 句型：tell + 人 + to V「叫某人做……」；avoid + N／V-ing「避免……」<br>such as… 舉例說明 greasy foods。", "on": ["活躍的，不修飾食物。", "炸雞和洋芋片是「油膩」食物，與心臟健康的警示一致。",  "【S】The scientist 【V】made 【O】a significant discovery<br>【M】that completely changed the way people understood the human brain（關係子句）<br>📌 句型：make a discovery「有所發現」；the way + 子句「……的方式」（the way 後省略 that／in which）。", "on": ["significant（重要的、重大的）與 major 意義最接近。", "愚蠢的，語意相反。", "私人的，語意不符。", "遙遠的，語意不符。"], "oz": ["重大的；主要的", "愚蠢的", "私人的", "遙遠的"]}, {"n": 10, "p": 0, "stem": "The government plans to <u>renovate<\/u> the old downtown area to attract more visitors and businesses.", "o": ["destroy", "rebuild", "observe", "announce"], "a": 1, "exp": "✓ (B) rebuild（重建、翻新）— renovate（翻新、整修）與 rebuild 最接近。\n❌ (A) destroy = 破壞，語意相反。\n❌ (C) observe = 觀察，語意不符。\n❌ (D) announce = 宣布，語意不符。", "zh": "政府計畫翻新舊市中心，以吸引更多遊客和企業進駐。（renovate ≈ rebuild 翻新、重建）", "sa": "【S】The government 【V】plans 【O】to renovate the old downtown area<br>【M】to attract more visitors and businesses（不定詞表目的）<br>📌 句型：plan to V「計畫……」；to V 放句尾表「為了……」。", "on": ["破壞，語意相反。", "renovate（翻新、整修）與 rebuild 最接近。", "觀察，語意不符。", "宣布，語意不符。"], "oz": ["摧毀；破壞", "重建；改建", "觀察；遵守", "宣布"]}, {"n": 11, "p": 1, "stem": "Amy: I haven't seen you for a long time! How have you been?<br>Ken: Pretty good, thanks. I just came back from a trip to Japan.<br>Amy: Really? _____<br>Ken: It was amazing! I visited Kyoto and tried lots of delicious food.", "o": ["When did you go?", "How was it?", "Did you like the weather?", "Who paid for the trip?"], "a": 1, "exp": "✓ (B) How was it?（怎麼樣？）— Ken 回答「很棒！去了京都、吃了很多美食」，符合詢問「旅程如何」的問題。\n❌ (A)(C)(D) 提問方向不符合 Ken 的回答內容。", "zh": "Amy：我好久沒看到你了！你最近好嗎？<br>Ken：還不錯，謝謝。我剛從日本旅行回來。<br>Amy：真的嗎？<b>旅程怎麼樣？<\/b><br>Ken：太棒了！我去了京都，還吃了很多美食。", "sa": "空格句：【S】it 【V】was 【C】how（疑問詞作補語）→ How was it?<br>回應句：【S】It 【V】was 【C】amazing!<br>📌 句型：How was + N?「……怎麼樣？」詢問感受或評價；I haven't seen you for a long time. 為現在完成式否定，表「好久不見」。", "on": ["提問方向不符合 Ken 的回答內容。", "Ken 回答「很棒！去了京都、吃了很多美食」，符合詢問「旅程如何」的問題。", "提問方向不符合 Ken 的回答內容。", "提問方向不符合 Ken 的回答內容。"], "oz": ["你什麼時候去的？", "玩得怎麼樣？", "你喜歡那裡的天氣嗎？", "旅費是誰出的？"]}, {"n": 12, "p": 1, "stem": "Customer: Excuse me, can I return thi _____<br>Son: I know, I know. I'll try to manage my time better next time.", "o": ["Math is my favorite subject, too.", "You should go to bed earlier.", "Did you pass the exam?", "What chapter are you studying?"], "a": 1, "exp": "✓ (B) You should go to bed earlier.（你應該早點睡。）— 兒子說「我知道，下次會好好管理時間」，回應的是被提醒/勸告的情境。\n❌ (A)(C)(D) 與兒子的回應不匹配。", "zh": "媽媽：你看起來好累。你昨晚睡得好嗎？<br>兒子：不太好。我為了準備數學考試熬夜到凌晨兩點。<br>媽媽：<b>你應該早點睡。<\/b><br>兒子：我知道、我知道。下次我會試著把時間管理得更好。", "sa": "空格句：【S】You 【V】should go 【M】to bed earlier<br>前句：【S】I 【V】stayed up 【M】until two in the morning studying for the math exam<br>📌 句型：should + V 表建議；stay up + V-ing「熬夜做……」；try to V「試著……」。", "on": ["與兒子的回應不匹配。", "兒子說「我知道，下次會好好管理時間」，回應的是被提醒/勸告的情境。", "與兒子的回應不匹配。", "與兒子的回應不匹配。"], "oz": ["數學也是我最喜歡的科目。", "你應該早點睡。", "你考試及格了嗎？", "你在讀哪一章？"]}, {"n": 15, "p": 1, "stem": "Grace: This restaurant has a two-hour wait. Should we go somewhere else?<br>Danny: _____<br>Grace: True, but I really want to try their signature dish.<br>Danny: All right, let's wait then. We can walk around the block in the meantime.", "o": ["That's fine. I'm not hungry anyway.", "We might as well go home.", "It seems like a waste of time.", "The food here must be terrible."], "a": 2, "exp": "✓ (C) It seems like a waste of time.（感覺很浪費時間。）— Grace 說「是啊，但我真的很想試試招牌菜」，用 \"True\" 承認對方說法有道理，符合 Danny 說「等很久感覺浪費時間」的語境。\n❌ (A) 說不餓，與後文 Grace 想吃招牌菜矛盾。\n❌ (B)(D) 語意不符。", "zh": "Grace：這家餐廳要等兩個小時。我們要不要去別的地方？<br>Danny：<b>感覺很浪費時間。<\/b><br>Grace：沒錯，但我真的很想吃他們的招牌菜。<br>Danny：好吧，那就等吧。這段時間我們可以在附近繞一繞。", "sa": "空格句：【S】It 【V】seems like 【O】a waste of time<br>後句：【S】We 【V】can walk around 【O】the block 【M】in the meantime<br>📌 句型：It seems like + N「看起來像……」；a waste of time「浪費時間」；in the meantime「在此期間」。", "on": ["說不餓，與後文 Grace 想吃招牌菜矛盾。", "語意不符。", "Grace 說「是啊，但我真的很想試試招牌菜」，用 \"True\" 承認對方說法有道理，符合 Danny 說「等很久感覺浪費時間」的語境。", "語意不符。"], "oz": ["沒關係，反正我也不餓。", "我們乾脆回家好了。", "這樣好像很浪費時間。", "這裡的食物一定很難吃。"]}, {"n": 16, "p": 1, "stem": "Boss: The client meeting has been moved to Thursday afternoon.<br>Emily: Oh no. _____<br>Boss: Can you reschedule it?<br>Emily: I'll try. I'll call and explain the situation.", "o": ["That's perfect for me.", "I already knew that.", "I have a doctor's appointment then.", "Thursday is my day off anyway."], "a": 2, "exp": "✓ (C) I have a doctor's appointment then.（我那時有看診預約。）— Emily 說「我試試看，打電話說明狀況」，表示有衝突需要重新安排，符合「那時有預約」的情境。\n❌ (A)(B) 語氣正面，不需要重新安排。\n❌ (D) 說那天是休假，上下文不一致。", "zh": "老闆：客戶會議改到星期四下午了。<br>Emily：糟了。<b>我那時候有看診預約。<\/b><br>老闆：你能改約嗎？<br>Emily：我試試看。我會打電話說明狀況。", "sa": "空格句：【S】I 【V】have 【O】a doctor's appointment 【M】then<br>前句：【S】The client meeting 【V】has been moved 【M】to Thursday afternoon（現在完成式被動）<br>📌 句型：has/have been + p.p.「已經被……」；reschedule「重新安排時間」。", "on": ["語氣正面，不需要重新安排。", "語氣正面，不需要重新安排。", "Emily 說「我試試看，打電話說明狀況」，表示有衝突需要重新安排，符合「那時有預約」的情境。", "說那天是休假，上下文不一致。"], "oz": ["那個時間對我來說剛好。", "我早就知道了。", "我那時候有醫生的預約。", "反正星期四我休假。"]}, {"n": 17, "p": 1, "stem": "Jake: Have you heard about the new recycling policy at school?<br>Cindy: Yes! They're banning single-use plastic bottles on campus.<br>Jake: _____<br>Cindy: That's a great point. We should all bring reusable bottles.", "o": ["Do you think it's effective?", "I wonder who made that decision.", "That's a good move for the environment.", "When does it start?"], "a": 2, "exp": "✓ (C) That's a good move for the environment.（這對環境來說是好的做法。）— Cindy 說「很好的觀點，我們都應帶可重複使用的水瓶」，與讚揚禁塑政策的說法一致。\n❌ (A) 詢問效果，Cindy 不會直接說「很好的觀點」。\n❌ (B)(D) 語意不符。", "zh": "Jake：你聽說學校新的回收政策了嗎？<br>Cindy：聽說了！學校要禁止在校園內使用一次性塑膠瓶。<br>Jake：<b>這對環境來說是個好措施。<\/b><br>Cindy：說得好。我們都應該自備可重複使用的水瓶。", "sa": "空格句：【S】That 【V】's 【C】a good move 【M】for the environment<br>前句：【S】They 【V】're banning 【O】single-use plastic bottles 【M】on campus<br>📌 句型：ban + N「禁止……」；現在進行式表即將實施的安排；a good move「好的做法」。", "on": ["詢問效果，Cindy 不會直接說「很好的觀點」。", "語意不符。", "Cindy 說「很好的觀點，我們都應帶可重複使用的水瓶」，與讚揚禁塑政策的說法一致。", "語意不符。"], "oz": ["你覺得有效嗎？", "不知道是誰做的決定。", "這對環境來說是個好措施。", "什麼時候開始實施？"]}, {"n": 18, "p": 1, "stem": "Brian: I heard you're moving to Tainan next month.<br>Sarah: Yes! I got a job offer there that I couldn't refuse.<br>Brian: _____<br>Sarah: Thanks! I'm excited but also a little nervous about starting over.", "o": ["Why didn't you try harder?", "Congratulations! That's great news.", "Are you sure about this decision?", "Tainan is not a very big city."], "a": 1, "exp": "✓ (B) Congratulations! That's great news.（恭喜！真是好消息。）— Sarah 說「謝謝！很興奮但也有點緊張」，明顯是回應祝賀。\n❌ (A)(C)(D) 語氣消極，與 Sarah 的回應不符。", "zh": "Brian：我聽說你下個月要搬到台南。<br>Sarah：對！我在那裡得到一份無法拒絕的工作機會。<br>Brian：<b>恭喜！真是好消息。<\/b><br>Sarah：謝謝！我很興奮，但對重新開始也有點緊張。", "sa": "空格句：【S】That 【V】's 【C】great news<br>前句：【S】I 【V】got 【O】a job offer there 【M】that I couldn't refuse（關係子句）<br>📌 句型：be nervous about + N／V-ing「對……感到緊張」；start over「重新開始」。", "on": ["語氣消極，與 Sarah 的回應不符。", "Sarah 說「謝謝！很興奮但也有點緊張」，明顯是回應祝賀。", "語氣消極，與 Sarah 的回應不符。", "語氣消極，與 Sarah 的回應不符。"], "oz": ["你為什麼不再努力一點？", "恭喜！真是好消息。", "你確定要這樣決定嗎？", "台南不是很大的城市。"]}, {"n": 19, "p": 1, "stem": "Kevin: I'm not sure what to order. Everything looks so good.<br>Waiter: Today's special is our grilled salmon with lemon butter sauce. _____<br>Kevin: That sounds delicious. I'll go with that.<br>Waiter: Excellent choice! Would you like soup or salad with that?", "o": ["It's been on the menu for years.", "It's one of our most popular dishes.", "You should order the steak instead.", "We're almost out of it, unfortunately."], "a": 1, "exp": "✓ (B) It's one of our most popular dishes.（這是我們最受歡迎的菜之一。）— 服務生推薦後補充說「這是熱門菜」，能讓客人更有信心點餐，Kevin 說「聽起來好吃，就點這個」符合邏輯。\n❌ (A) 說已經在菜單上很多年，不是說服顧客的好理由。\n❌ (C) 建議點牛排，與顧客的選擇矛盾。\n❌ (D) 說快賣完了，則服務生不會推薦。", "zh": "Kevin：我不知道要點什麼。每樣看起來都好好吃。<br>服務生：今日特餐是檸檬奶油醬烤鮭魚。<b>這是我們最受歡迎的菜色之一。<\/b><br>Kevin：聽起來很美味。我就點這個。<br>服務生：好選擇！請問要搭配湯還是沙拉？", "sa": "空格句：【S】It 【V】's 【C】one of our most popular dishes<br>📌 句型：one of the + 最高級 + 複數名詞「最……的……之一」<br>go with + N「選擇……」；Would you like A or B?「您想要 A 還是 B？」", "on": ["說已經在菜單上很多年，不是說服顧客的好理由。", "服務生推薦後補充說「這是熱門菜」，能讓客人更有信心點餐，Kevin 說「聽起來好吃，就點這個」符合邏輯。", "建議點牛排，與顧客的選擇矛盾。", "說快賣完了，則服務生不會推薦。"], "oz": ["這道菜已經在菜單上好多年了。", "這是我們最受歡迎的菜色之一。", "您應該改點牛排。", "很可惜，這道快賣完了。"]}, {"n": 20, "p": 1, "stem": "Lucy: Did you watch the documentary about ocean pollution last night?<br>Mark: Yes, it was eye-opening. I didn't realize how much plastic ends up in the sea.<br>Lucy: _____<br>Mark: Absolutely. We need to reduce plastic use and support ocean clean-up efforts.", "o": ["I prefer action movies to documentaries.", "The ocean is very beautiful and peaceful.", "It makes me want to do something about it.", "I don't think pollution is a serious problem."], "a": 2, "exp": "✓ (C) It makes me want to do something about it.（這讓我想為此做些事。）— Mark 說「我們需要減少塑膠使用、支持海洋清潔行動」，與 Lucy 說「想採取行動」的語氣一致，Mark 的回應用 \"Absolutely\" 強化。\n❌ (A)(B)(D) 語氣不符或語意不連貫。", "zh": "Lucy：你昨晚有看那部關於海洋污染的紀錄片嗎？<br>Mark：有，真是讓人大開眼界。我之前不知道有那麼多塑膠最後流入海中。<br>Lucy：<b>它讓我想為這件事做點什麼。<\/b><br>Mark：完全同意。我們需要減少使用塑膠，並支持淨海行動。", "sa": "空格句：【S】It 【V】makes 【O】me 【C】want to do something about it<br>📌 句型：make + O + 原形動詞（使役動詞）「使某人……」<br>例：The movie made me cry.<br>end up in + 地點「最後落到……」。", "on": ["語氣不符或語意不連貫。", "語氣不符或語意不連貫。", "Mark 說「我們需要減少塑膠使用、支持海洋清潔行動」，與 Lucy 說「想採取行動」的語氣一致，Mark 的回應用 \"Absolutely\" 強化。", "語氣不符或語意不連貫。"], "oz": ["比起紀錄片，我比較喜歡動作片。", "海洋非常美麗又寧靜。", "它讓我想為這件事做點什麼。", "我不認為汙染是嚴重的問題。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["ahead", "short", "apart", "behind"], "a": 0, "exp": "✓ (A) ahead（領先）— \"stay ahead of competitors\" 是固定搭配，表示「保持在競爭對手前面」。\n❌ (B) short of = 不足。(C) apart = 分開。(D) behind = 落後，語意相反。", "zh": "<i>Over the years, TSMC has developed the ability to manufacture chips with incredible precision, staying <b>ahead<\/b> of global competitors.<\/i><br>多年來，台積電已發展出以驚人精準度製造晶片的能力，始終領先全球競爭對手。", "sa": "【M】Over the years 【S】TSMC 【V】has developed 【O】the ability to manufacture chips with incredible precision<br>【M】staying ahead of global competitors（分詞構句，表附帶狀況）<br>📌 句型：stay ahead of + N「保持領先……」；the ability to V「做……的能力」；現在完成式表持續到現在的成果。", "on": ["\"stay ahead of competitors\" 是固定搭配，表示「保持在競爭對手前面」。", "of = 不足。", "分開。", "落後，語意相反。"], "oz": ["領先（stay ahead of）", "短缺；不足", "分開；相隔", "落後"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["make", "makes", "made", "making"], "a": 1, "exp": "✓ (B) makes（使……成為）— \"make + 受詞 + 補語\" 的第三人稱單數現在式，主詞為 \"performance\"（單數）。\n❌ (A) make = 原形，主詞單數需用 makes。(C) made = 過去式，時態不符。(D) making = 分詞，缺少謂語動詞。", "zh": "<i>Taiwan's strong performance in this field <b>makes<\/b> the country a key player in global supply chains.<\/i><br>台灣在這個領域的強勁表現，使它成為全球供應鏈中的關鍵角色。", "sa": "【S】Taiwan's strong performance in this field 【V】makes 【O】the country 【C】a key player in global supply chains<br>📌 句型：make + O + C（名詞補語）「使……成為……」；主詞核心 performance 為單數，動詞用 makes。", "on": ["原形，主詞單數需用 makes。", "\"make + 受詞 + 補語\" 的第三人稱單數現在式，主詞為 \"performance\"（單數）。", "過去式，時態不符。", "分詞，缺少謂語動詞。"], "oz": ["使得（原形）", "使得（第三人稱單數現在式）", "使得（過去式／過去分詞）", "使得（現在分詞／動名詞）"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["harmful", "optional", "essential", "ordinary"], "a": 2, "exp": "✓ (C) essential（不可或缺的）— 各國政府將台灣晶片業視為「對自身技術發展至關重要」的存在，符合語境。\n❌ (A) harmful = 有害的，語意相反。(B) optional = 可選的，語意相反。(D) ordinary = 普通的，不夠強調其重要性。", "zh": "<i>Governments around the world now see Taiwan's chip industry as <b>essential<\/b> to their own technology development.<\/i><br>世界各國政府現在都把台灣的晶片產業視為對自身科技發展不可或缺的存在。", "sa": "【S】Governments around the world 【V】now see 【O】Taiwan's chip industry 【C】as essential to their own technology development<br>📌 句型：see／regard A as B「把 A 視為 B」；be essential to + N「對……不可或缺」。", "on": ["有害的，語意相反。", "可選的，語意相反。", "各國政府將台灣晶片業視為「對自身技術發展至關重要」的存在，符合語境。", "普通的，不夠強調其重要性。"], "oz": ["有害的", "可選擇的；非必要的", "不可或缺的；必要的", "普通的"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["expand", "reduce", "ignore", "replace"], "a": 0, "exp": "✓ (A) expand（擴大）— 隨著 AI 需求增長，台積電等企業可能會「擴大」其角色，語意合理。\n❌ (B) reduce = 縮減，語意相反。(C) ignore = 忽視，不合邏輯。(D) replace = 取代，不符合語境。", "zh": "<i>As demand for AI and high-performance computing grows, TSMC and its partners will likely <b>expand<\/b> their role in shaping the future of technology.<\/i><br>隨著對人工智慧與高效能運算的需求成長，台積電和它的夥伴很可能會擴大他們在形塑科技未來上的角色。", "sa": "【M】As demand for AI and high-performance computing grows（as 表「隨著」）<br>【S】TSMC and its partners 【V】will likely expand 【O】their role 【M】in shaping the future of technology<br>📌 句型：as + 子句「隨著……」；play／have a role in + V-ing「在……中扮演角色」。", "on": ["隨著 AI 需求增長，台積電等企業可能會「擴大」其角色，語意合理。", "縮減，語意相反。", "忽視，不合邏輯。", "取代，不符合語境。"], "oz": ["擴大；擴展", "減少", "忽視", "取代"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["freedom", "failure", "pressure", "danger"], "a": 0, "exp": "✓ (A) freedom（自由）— 員工享有「從任何地方工作的自由」，搭配 \"freedom to do\" 是固定用法。\n❌ (B) failure = 失敗。(C) pressure = 壓力，語意相反。(D) danger = 危險，不符合語境。", "zh": "<i>Many employees enjoy the <b>freedom<\/b> to work from home or from anywhere they choose.<\/i><br>許多員工享受可以在家或在任何自己選擇的地方工作的自由。", "sa": "【S】Many employees 【V】enjoy 【O】the freedom 【M】to work from home or from anywhere they choose<br>📌 句型：the freedom to V「做……的自由」（不定詞修飾名詞）；anywhere (that) they choose 省略關代。", "on": ["員工享有「從任何地方工作的自由」，搭配 \"freedom to do\" 是固定用法。", "失敗。", "壓力，語意相反。", "危險，不符合語境。"], "oz": ["自由", "失敗", "壓力", "危險"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["Therefore", "Similarly", "However", "Besides"], "a": 2, "exp": "✓ (C) However（然而）— 前文說遠距工作者滿意度高，後文說不是每個人都能受益，明顯的轉折關係。\n❌ (A) Therefore = 因此（因果）。(B) Similarly = 相似地。(D) Besides = 此外（補充）。", "zh": "<i><b>However<\/b>, not everyone benefits equally from this arrangement.<\/i><br>然而，並不是每個人都能從這種安排中同等受益。", "sa": "【M】However（轉折副詞）【S】not everyone 【V】benefits 【M】equally from this arrangement<br>📌 句型：not everyone…「並非每個人都……」（部分否定）；benefit from + N「從……受益」。", "on": ["因此（因果）。", "相似地。", "前文說遠距工作者滿意度高，後文說不是每個人都能受益，明顯的轉折關係。", "此外（補充）。"], "oz": ["因此", "同樣地", "然而", "此外"]}, {"n": 27, "p": 2, "stem": "(27)", "o": ["which", "where", "what", "when"], "a": 1, "exp": "✓ (B) where（在此模式下）— 此處 where 引導關係子句，先行詞為 \"models\"（一種情境/安排），語法正確。\n❌ (A) which 引導限定子句，此處用 where 更自然。(C) what 不引導關係子句。(D) when 用於時間語境。", "zh": "<i>To address these challenges, companies have introduced “hybrid” models, <b>where<\/b> employees split their time between the office and home.<\/i><br>為了因應這些挑戰，公司推出了「混合式」模式，讓員工把時間分配在辦公室和家裡。" const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "研究人員花了多年時間才終於找到這種疾病的有效療法。<br><span class=\"blankline\">Researchers spent many years before finally finding an effective c<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① for the d<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② .<\/span>", "ans": "① <b>cure<\/b>　② <b>disease<\/b>", "exp": "cure（n.）= 療法、治癒方法，字首 c；disease（n.）= 疾病，字首 d。<br>完整句：Researchers spent many years before finally finding an effective <b>cure<\/b> for the <b>disease<\/b>.（研究人員花了多年時間，才終於找到這種疾病的有效療法。）", "zh": "研究人員花了多年時間，才終於找到這種疾病的有效療法。", "sa": "【S】Researchers 【V】spent 【O】many years 【M】before finally finding an effective cure for the disease<br>📌 句型：spend + 時間 + (in) V-ing「花時間做……」；a cure for + 疾病「……的療法」<br>before + V-ing：介系詞後接動名詞。"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>has been / the city's new / praised / international architects / transportation system / by<\/i>", "ans": "The city's new transportation system has been praised by international architects.", "exp": "句型為現在完成式被動語態：主詞 + has been + 過去分詞 + by + 行為者。\"praised by international architects\" = 受到國際建築師讚揚。", "zh": "這座城市的新交通系統受到國際建築師的讚揚。", "sa": "【S】The city's new transportation system 【V】has been praised 【M】by international architects<br>📌 句型：現在完成式被動 has/have been + p.p. + by + 行為者<br>例：The bridge has been repaired by the workers."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>保護環境是每一個公民的責任，而不只是政府的工作。", "ans": "Protecting the environment is every citizen's responsibility, not just the government's job.", "exp": "\"Protecting...\" 使用動名詞短語作主詞；\"not just the government's job\" = 而不只是政府的工作。另可寫為：It is every citizen's responsibility to protect the environment, not just the government's.", "zh": "題意：保護環境是每一位公民的責任，而不只是政府的工作。", "sa": "【S】Protecting the environment（動名詞片語當主詞，視為單數）【V】is 【C】every citizen's responsibility<br>【M】not just the government's job（補充對比）<br>📌 句型：V-ing 當主詞 + is…；也可寫成虛主詞 It is… to V。"}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();

<script>
/* ================= ✏️ 老師手寫 =================

(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}

  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}

  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;

  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}

  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';

  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];

  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);

  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}

  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};

  let tp=null;

  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

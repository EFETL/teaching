<title>統測英文模擬考卷 M</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}
</style>

    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nNight markets are an important part of Taiwanese culture. <span class=\"blk\">21</span> the hundreds of markets across the island, Shilin Night Market in Taipei is probably the best known. Visitors can try local snacks such as stinky tofu and oyster omelets, and play traditional games at low prices. The markets also offer a <span class=\"blk\">22</span> way for small business owners to start their own shops without spending much money on rent. In recent years, however, rising costs have made it hard for some stalls to survive, <span class=\"blk\">23</span> the number of visitors remains high. To attract more tourists, some city governments have worked with vendors <span class=\"blk\">24</span>.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nMany coffee shops in Taiwan now give customers a discount of NT$5 if they bring their own cups. The policy is meant to reduce plastic waste, but it <span class=\"blk\">25</span> only a small effect so far. A recent survey found that fewer than 10% of customers <span class=\"blk\">26</span> reusable cups regularly. Some people forget to carry them, <span class=\"blk\">27</span> others think that washing them is troublesome. Experts suggest that shops should offer a bigger discount <span class=\"blk\">28</span> more customers change their habits.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Hualien Youth Camp, July 14–16</b><br><table style=\"border-collapse:collapse;margin:8px 0;font-size:.95em\" border=\"1\" cellpadding=\"6\"><tr><th>Day</th><th>Time</th><th>Activity</th></tr><tr><td>July 14</td><td>9:00</td><td>Opening</td></tr><tr><td></td><td>10:00</td><td>Kayaking</td></tr><tr><td></td><td>14:00</td><td>Cooking class</td></tr><tr><td></td><td>19:00</td><td>Night walk</td></tr><tr><td>July 15</td><td>9:00</td><td>Hiking*</td></tr><tr><td></td><td>13:00</td><td>Free time</td></tr><tr><td></td><td>15:00</td><td>Art workshop</td></tr><tr><td>July 16</td><td>9:00</td><td>Beach cleanup</td></tr><tr><td></td><td>11:00</td><td>Closing</td></tr></table>*If it rains, hiking will be canceled and campers will visit a museum instead.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Teenagers' Weekly Screen Time (hours)</b><br><table style=\"border-collapse:collapse;margin:8px 0;font-size:.95em\" border=\"1\" cellpadding=\"6\"><tr><th>Year</th><th>2020</th><th>2021</th><th>2022</th><th>2023</th><th>2024</th></tr><tr><td>Hours</td><td>18</td><td>21</td><td>24</td><td>26</td><td>27</td></tr></table>Researchers say the rise has three main causes. First, online classes during the pandemic gave students more reasons to use computers. Second, short videos are designed to keep viewers watching for hours. Third, online games let friends play together even when they are far apart.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nConvenience stores are so common in Taiwan that it is hard to walk a few blocks without seeing one. The first modern convenience store opened in Taipei in 1980, selling mainly snacks, drinks, and daily goods. Within ten years, stores began to offer services such as bill payment, and by the 2000s customers could also pick up online orders and send packages. Today, many stores serve fresh coffee and hot meals, making them a popular place for breakfast. As the table shows, four chains control most of the market. Experts say the key to this success is convenience: stores are open 24 hours, located close to homes and offices, and offer a wide range of services under one roof. However, some critics worry that small, family-run grocery stores cannot compete with these large chains.<br><table style=\"border-collapse:collapse;margin:8px 0;font-size:.95em\" border=\"1\" cellpadding=\"6\"><tr><th>Chain</th><th>Number of stores</th></tr><tr><td>7-Eleven</td><td>6,800</td></tr><tr><td>FamilyMart</td><td>4,200</td></tr><tr><td>Hi-Life</td><td>1,400</td></tr><tr><td>OK Mart</td><td>900</td></tr></table></div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nMany teenagers struggle to wake up for early classes, and scientists say it is not simply laziness. During adolescence the body clock shifts, so teens naturally feel sleepy later at night and need to sleep later in the morning. Doctors recommend eight to ten hours of sleep for teenagers, yet a survey in Taiwan found that most high school students sleep fewer than seven hours on school days. Lack of sleep makes it hard to concentrate, weakens memory, and can even affect mood. To solve the problem, some schools in the United States moved their start time from 7:30 to 8:30 a.m. After the change, students were less likely to fall asleep in class, their grades improved slightly, and fewer students were late. However, critics point out that later start times may interfere with after-school sports and make it harder for parents with early jobs to drop off their children. As a result, many schools remain unwilling to change.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nTaiwan is often called the \"Kingdom of Bicycles.\" Although the island has no large natural resources, its bicycle industry has become one of the strongest in the world. The story began in the 1970s, when Taiwanese factories produced bikes for foreign brands. Because the work required precise skills, workers learned how to make strong, light frames. Over time, some companies stopped working only for others and started creating their own brands. They invested heavily in research, using new materials such as carbon fiber to reduce weight. In addition, close cooperation among parts suppliers in central Taiwan allowed manufacturers to solve problems quickly. By the 2010s, Taiwanese brands were selling high-end bikes in more than 100 countries. When the pandemic made cycling popular, demand jumped, and some factories had to ask customers to wait for months. Industry leaders now say the next step is electric bikes, which they believe will open the door to older riders and city commuters.</div>"};
const PTR = {"21": [{"en": "Night markets are an important part of Taiwanese culture.", "zh": "夜市是台灣文化中重要的一部分。", "sa": "【S】Night markets 【V】are 【C】an important part of Taiwanese culture.<br>📌 S + be + C；a part of「……的一部分」。"}, {"en": "<b>Of<\/b> the hundreds of markets across the island, Shilin Night Market in Taipei is probably the best known.", "zh": "在全島數百個夜市當中，台北的士林夜市大概是最有名的。", "sa": "【M】Of the hundreds of markets..., 【S】Shilin Night Market 【V】is 【C】the best known.<br>📌 Of + 範圍 + 最高級。"}, {"en": "Visitors can try local snacks such as stinky tofu and oyster omelets, and play traditional games at low prices.", "zh": "遊客可以用低廉的價格品嚐臭豆腐、蚵仔煎等在地小吃，並玩傳統遊戲。", "sa": "【S】Visitors 【V】can try 【O】local snacks... and 【V】play 【O】traditional games.<br>📌 助動詞 can 後接兩個並列原形動詞；such as 舉例。"}, {"en": "The markets also offer a <b>practical<\/b> way for small business owners to start their own shops without spending much money on rent.", "zh": "夜市也為小商家老闆提供了一個實際可行的方式，讓他們不必花很多錢在租金上就能開自己的店。", "sa": "【S】The markets 【V】offer 【O】a practical way for... to start...<br>📌 a way for 人 to V；spend 錢 on N。"}, {"en": "In recent years, however, rising costs have made it hard for some stalls to survive, <b>even though<\/b> the number of visitors remains high.", "zh": "然而近年來，成本上漲讓一些攤位難以生存，即使遊客人數仍然很多。", "sa": "【S】rising costs 【V】have made 【O】it 【C】hard for some stalls to survive.<br>📌 make it + adj. + for 人 + to V；even though 讓步子句。"}, {"en": "To attract more tourists, some city governments have worked with vendors <b>to improve hygiene and the environment<\/b>.", "zh": "為了吸引更多觀光客，一些市政府已和攤商合作，改善衛生與環境。", "sa": "【M】To attract more tourists, 【S】some city governments 【V】have worked with vendors.<br>📌 不定詞 to V 表目的；現在完成式。"}], "25": [{"en": "Many coffee shops in Taiwan now give customers a discount of NT$5 if they bring their own cups.", "zh": "台灣現在有許多咖啡店，只要顧客自備杯子就給五元折扣。", "sa": "【S】Many coffee shops 【V】give 【O】customers 【O】a discount of NT$5 + if 條件子句。<br>📌 give + 人 + 物（雙受詞）。"}, {"en": "The policy is meant to reduce plastic waste, but it <b>has had<\/b> only a small effect so far.", "zh": "這項政策的目的是減少塑膠垃圾，但到目前為止只產生了很小的效果。", "sa": "【S】it 【V】has had 【O】only a small effect 【M】so far.<br>📌 so far + 現在完成式；be meant to V「目的是……」。"}, {"en": "A recent survey found that fewer than 10% of customers <b>bring<\/b> reusable cups regularly.", "zh": "最近一項調查發現，經常自備環保杯的顧客不到一成。", "sa": "【S】A recent survey 【V】found 【O】that 子句。<br>📌 子句主詞 fewer than 10% of customers 為複數，動詞用 bring。"}, {"en": "Some people forget to carry them, <b>while<\/b> others think that washing them is troublesome.", "zh": "有些人忘了帶，而另一些人則認為清洗很麻煩。", "sa": "【S】Some people 【V】forget 【O】to carry them, while 【S】others 【V】think...<br>📌 Some..., while others... 表對比；動名詞作主詞。"}, {"en": "Experts suggest that shops should offer a bigger discount <b>so that<\/b> more customers change their habits.", "zh": "專家建議店家應該提供更大的折扣，好讓更多顧客改變習慣。", "sa": "【S】Experts 【V】suggest 【O】that shops should offer...<br>📌 suggest that + S + (should) V；so that 表目的。"}], "29": [{"en": "Hualien Youth Camp, July 14–16", "zh": "花蓮青年營，7 月 14 日至 16 日", "sa": "標題：名詞片語，省略主詞動詞。"}, {"en": "July 14: 9:00 Opening; 10:00 Kayaking; 14:00 Cooking class; 19:00 Night walk", "zh": "7 月 14 日：9:00 開幕；10:00 划獨木舟；14:00 烹飪課；19:00 夜間散步", "sa": "時刻表條列：時間 + 名詞片語，省略主詞動詞。"}, {"en": "July 15: 9:00 Hiking*; 13:00 Free time; 15:00 Art workshop", "zh": "7 月 15 日：9:00 登山健行*；13:00 自由活動；15:00 藝術工作坊", "sa": "時刻表條列：時間 + 名詞片語；* 表示另有附註。"}, {"en": "July 16: 9:00 Beach cleanup; 11:00 Closing", "zh": "7 月 16 日：9:00 淨灘；11:00 閉幕", "sa": "時刻表條列：時間 + 名詞片語。"}, {"en": "*If it rains, hiking will be canceled and campers will visit a museum instead.", "zh": "*如果下雨，登山健行將取消，露營者改為參觀博物館。", "sa": "If 條件子句 + 【S】hiking 【V】will be canceled and 【S】campers 【V】will visit 【O】a museum.<br>📌 If + 現在式, S + will V；未來被動 will be p.p.；instead「取而代之」。"}], "31": [{"en": "Teenagers' Weekly Screen Time (hours)", "zh": "青少年每週螢幕使用時間（小時）", "sa": "標題：名詞片語。"}, {"en": "2020: 18; 2021: 21; 2022: 24; 2023: 26; 2024: 27", "zh": "2020 年：18；2021 年：21；2022 年：24；2023 年：26；2024 年：27", "sa": "表格數據條列：年份 + 時數。"}, {"en": "Researchers say the rise has three main causes.", "zh": "研究人員表示，這項增加有三個主要原因。", "sa": "【S】Researchers 【V】say 【O】(that) the rise has three main causes.<br>📌 say 後的 that 可省略。"}, {"en": "First, online classes during the pandemic gave students more reasons to use computers.", "zh": "第一，疫情期間的線上課程讓學生有更多使用電腦的理由。", "sa": "【S】online classes 【V】gave 【O】students 【O】more reasons to use computers.<br>📌 give + 人 + 物；reason to V。"}, {"en": "Second, short videos are designed to keep viewers watching for hours.", "zh": "第二，短影音的設計就是要讓觀眾一看好幾個小時。", "sa": "【S】short videos 【V】are designed 【M】to keep viewers watching.<br>📌 keep + O + V-ing「使……持續……」；be designed to V。"}, {"en": "Third, online games let friends play together even when they are far apart.", "zh": "第三，線上遊戲讓朋友即使相隔遙遠也能一起玩。", "sa": "【S】online games 【V】let 【O】friends 【C】play together.<br>📌 使役動詞 let + O + 原形動詞；even when「即使在……時」。"}], "33": [{"en": "Convenience stores are so common in Taiwan that it is hard to walk a few blocks without seeing one.", "zh": "便利商店在台灣非常普遍，走幾個街區不看到一家都很難。", "sa": "【S】Convenience stores 【V】are 【C】so common... that it is hard to walk...<br>📌 so...that；it is + adj. + to V（虛主詞）；without + V-ing。"}, {"en": "The first modern convenience store opened in Taipei in 1980, selling mainly snacks, drinks, and daily goods.", "zh": "第一家現代便利商店於 1980 年在台北開幕，主要販售零食、飲料和日用品。", "sa": "【S】The first modern convenience store 【V】opened 【M】in Taipei in 1980, selling...<br>📌 分詞構句 selling... 補充說明（= and it sold...）。"}, {"en": "Within ten years, stores began to offer services such as bill payment, and by the 2000s customers could also pick up online orders and send packages.", "zh": "十年內，商店開始提供帳單代繳等服務；到了 2000 年代，顧客也能領取網購商品和寄送包裹。", "sa": "【S】stores 【V】began 【O】to offer services, and 【S】customers 【V】could pick up... and send...<br>📌 begin to V；by + 時間「到……時」。"}, {"en": "Today, many stores serve fresh coffee and hot meals, making them a popular place for breakfast.", "zh": "如今，許多門市供應現煮咖啡和熱食，使它們成為熱門的早餐地點。", "sa": "【S】many stores 【V】serve 【O】fresh coffee and hot meals, making them a popular place...<br>📌 分詞構句表結果；make + O + C（名詞）。"}, {"en": "As the table shows, four chains control most of the market.", "zh": "如表格所示，四家連鎖業者掌握了大部分的市場。", "sa": "【M】As the table shows, 【S】four chains 【V】control 【O】most of the market.<br>📌 As + S + V「如……所示」。"}, {"en": "7-Eleven: 6,800 stores; FamilyMart: 4,200; Hi-Life: 1,400; OK Mart: 900", "zh": "7-Eleven：6,800 家；全家：4,200 家；萊爾富：1,400 家；OK 超商：900 家", "sa": "表格數據條列：連鎖名稱 + 店數。"}, {"en": "Experts say the key to this success is convenience: stores are open 24 hours, located close to homes and offices, and offer a wide range of services under one roof.", "zh": "專家說，成功的關鍵在於便利：商店 24 小時營業、位於住家和辦公室附近，而且在同一個屋簷下提供各式各樣的服務。", "sa": "【S】the key to this success 【V】is 【C】convenience；冒號後 【S】stores 【V】are open..., (are) located..., and offer...<br>📌 the key to + 名詞「……的關鍵」；三個並列述語。"}, {"en": "However, some critics worry that small, family-run grocery stores cannot compete with these large chains.", "zh": "然而，一些批評者擔心小型的家庭式雜貨店無法與這些大型連鎖店競爭。", "sa": "【S】some critics 【V】worry 【O】that small, family-run grocery stores cannot compete with...<br>📌 compete with「與……競爭」；family-run 為複合形容詞。"}], "36": [{"en": "Many teenagers struggle to wake up for early classes, and scientists say it is not simply laziness.", "zh": "許多青少年早上很難起床去上早課，而科學家說這不單純是懶惰。", "sa": "【S】Many teenagers 【V】struggle 【O】to wake up..., and 【S】scientists 【V】say 【O】(that) it is not simply laziness.<br>📌 struggle to V「費力去做……」。"}, {"en": "During adolescence the body clock shifts, so teens naturally feel sleepy later at night and need to sleep later in the morning.", "zh": "在青春期，生理時鐘會改變，所以青少年自然而然到夜裡較晚才想睡，早上也需要睡得比較晚。", "sa": "【S】the body clock 【V】shifts, so 【S】teens 【V】feel 【C】sleepy... and 【V】need to sleep later.<br>📌 feel + adj.（連綴動詞）；so 表結果。"}, {"en": "Doctors recommend eight to ten hours of sleep for teenagers, yet a survey in Taiwan found that most high school students sleep fewer than seven hours on school days.", "zh": "醫生建議青少年睡八到十個小時，然而台灣一項調查發現，大多數高中生在上學日睡不到七小時。", "sa": "【S】Doctors 【V】recommend 【O】eight to ten hours of sleep, yet 【S】a survey 【V】found 【O】that...<br>📌 yet 表轉折；fewer than + 可數名詞。"}, {"en": "Lack of sleep makes it hard to concentrate, weakens memory, and can even affect mood.", "zh": "睡眠不足會讓人難以專心、削弱記憶力，甚至可能影響情緒。", "sa": "【S】Lack of sleep 【V】makes 【O】it 【C】hard to concentrate, 【V】weakens 【O】memory, and 【V】can affect 【O】mood.<br>📌 make it + adj. + to V；三個並列動詞。"}, {"en": "To solve the problem, some schools in the United States moved their start time from 7:30 to 8:30 a.m.", "zh": "為了解決這個問題，美國一些學校把上學時間從早上 7:30 延到 8:30。", "sa": "【M】To solve the problem, 【S】some schools 【V】moved 【O】their start time 【M】from 7:30 to 8:30 a.m.<br>📌 不定詞表目的；from A to B。"}, {"en": "After the change, students were less likely to fall asleep in class, their grades improved slightly, and fewer students were late.", "zh": "改變之後，學生較少在課堂上睡著，成績稍有進步，遲到的學生也變少了。", "sa": "三個並列子句：【S】students 【V】were 【C】less likely to fall asleep / 【S】their grades 【V】improved / 【S】fewer students 【V】were 【C】late.<br>📌 be likely to V「可能……」。"}, {"en": "However, critics point out that later start times may interfere with after-school sports and make it harder for parents with early jobs to drop off their children.", "zh": "然而，批評者指出，較晚上學可能妨礙課後運動，也讓早上班的家長更難送孩子上學。", "sa": "【S】critics 【V】point out 【O】that later start times may interfere with... and make it harder for parents... to drop off...<br>📌 interfere with「妨礙」；make it + 比較級 + for 人 + to V。"}, {"en": "As a result, many schools remain unwilling to change.", "zh": "因此，許多學校仍不願意改變。", "sa": "【S】many schools 【V】remain 【C】unwilling to change.<br>📌 remain + adj.（連綴動詞）；be unwilling to V「不願意……」。"}], "39": [{"en": "Taiwan is often called the \"Kingdom of Bicycles.\"", "zh": "台灣常被稱為「自行車王國」。", "sa": "【S】Taiwan 【V】is called 【C】the \"Kingdom of Bicycles.\"<br>📌 被動式 be called + 名稱「被稱為……」。"}, {"en": "Although the island has no large natural resources, its bicycle industry has become one of the strongest in the world.", "zh": "雖然這座島嶼沒有豐富的天然資源，它的自行車產業卻已成為世界上最強的之一。", "sa": "【M】Although the island has no large natural resources, 【S】its bicycle industry 【V】has become 【C】one of the strongest...<br>📌 Although 讓步子句；one of the + 最高級。"}, {"en": "The story began in the 1970s, when Taiwanese factories produced bikes for foreign brands.", "zh": "故事始於 1970 年代，當時台灣工廠為外國品牌生產自行車。", "sa": "【S】The story 【V】began 【M】in the 1970s, when...<br>📌 關係副詞 when 引導非限定子句補充時間。"}, {"en": "Because the work required precise skills, workers learned how to make strong, light frames.", "zh": "因為這份工作需要精密的技術，工人們學會了如何製造堅固又輕巧的車架。", "sa": "【M】Because..., 【S】workers 【V】learned 【O】how to make strong, light frames.<br>📌 疑問詞 + to V（how to make）作受詞。"}, {"en": "Over time, some companies stopped working only for others and started creating their own brands.", "zh": "隨著時間過去，一些公司不再只替別人代工，開始創立自有品牌。", "sa": "【S】some companies 【V】stopped 【O】working only for others and 【V】started 【O】creating their own brands.<br>📌 stop + V-ing「停止做……」；start + V-ing。"}, {"en": "They invested heavily in research, using new materials such as carbon fiber to reduce weight.", "zh": "他們大量投資研發，使用碳纖維等新材料來減輕重量。", "sa": "【S】They 【V】invested 【M】heavily in research, using new materials... to reduce weight.<br>📌 invest in「投資於」；分詞構句 using... 補充說明方式。"}, {"en": "In addition, close cooperation among parts suppliers in central Taiwan allowed manufacturers to solve problems quickly.", "zh": "此外，中台灣零件供應商之間的密切合作，讓製造商能迅速解決問題。", "sa": "【S】close cooperation among parts suppliers 【V】allowed 【O】manufacturers 【C】to solve problems quickly.<br>📌 allow + O + to V「讓……能夠……」。"}, {"en": "By the 2010s, Taiwanese brands were selling high-end bikes in more than 100 countries.", "zh": "到了 2010 年代，台灣品牌已在超過 100 個國家販售高階自行車。", "sa": "【S】Taiwanese brands 【V】were selling 【O】high-end bikes 【M】in more than 100 countries.<br>📌 by + 時間「到……時」；過去進行式描述當時的狀態。"}, {"en": "When the pandemic made cycling popular, demand jumped, and some factories had to ask customers to wait for months.", "zh": "當疫情讓騎自行車蔚為風潮時，需求暴增，有些工廠甚至得請顧客等上好幾個月。", "sa": "【M】When the pandemic made cycling popular, 【S】demand 【V】jumped, and 【S】some factories 【V】had to ask 【O】customers 【C】to wait...<br>📌 make + O + adj.；ask + O + to V。"}, {"en": "Industry leaders now say the next step is electric bikes, which they believe will open the door to older riders and city commuters.", "zh": "業界領袖現在表示，下一步是電動自行車，他們相信這將為年長騎士和城市通勤族開啟大門。", "sa": "【S】Industry leaders 【V】say 【O】(that) the next step is electric bikes, which (they believe) will open the door to...<br>📌 非限定關係子句 which，they believe 為插入語；open the door to「為……創造機會」。"}]};
const Q = [{"n": 1, "p": 0, "stem": "The soup was too hot, so Ken waited a few minutes for it to _____ down before eating.", "o": ["boil", "burn", "melt", "cool"], "a": 3, "exp": "(D) cool ✓ cool down 為「冷卻」，湯太燙所以要等它變涼。\n❌ (A) boil：煮沸，與太燙後再等待矛盾\n❌ (B) burn：燃燒／燙傷，不接 down\n❌ (C) melt：融化，不適用於湯", "zh": "湯太燙了，所以 Ken 等了幾分鐘讓它冷卻後才吃。", "sa": "【S】The soup 【V】was 【C】too hot, so 【S】Ken 【V】waited 【M】a few minutes 【M】for it to cool down before eating.<br>📌 句型：wait for + O + to V「等待某物做……」；cool down「冷卻、變涼」。<br>例：We waited for the rain to stop."}, {"n": 2, "p": 0, "stem": "After training for months, Lisa finally _____ her goal of running a full marathon.", "o": ["invited", "achieved", "borrowed", "avoided"], "a": 1, "exp": "(B) achieved（達成） ✓ achieve a goal 為固定搭配。\n❌ (A) invited：邀請，語意不通\n❌ (C) borrowed：借入，語意不通\n❌ (D) avoided：避開，與「終於」不合", "zh": "經過好幾個月的訓練，Lisa 終於達成了跑完全程馬拉松的目標。", "sa": "【M】After training for months, 【S】Lisa 【M】finally 【V】achieved 【O】her goal of running a full marathon.<br>📌 句型：achieve a goal「達成目標」；goal of + V-ing「做……的目標」。<br>After + V-ing 表時間，省略與主句相同的主詞。"}, {"n": 3, "p": 0, "stem": "The new subway line is a(n) _____ way to travel, saving commuters almost an hour every day.", "o": ["efficient", "enormous", "fragile", "jealous"], "a": 0, "exp": "(A) efficient（有效率的） ✓ 省下近一小時，表示通勤「有效率」。\n❌ (B) enormous：巨大的，不修飾 way\n❌ (C) fragile：易碎的，語意不通\n❌ (D) jealous：嫉妒的，語意不通", "zh": "新的捷運線是一種有效率的交通方式，讓通勤族每天省下將近一小時。", "sa": "【S】The new subway line 【V】is 【C】an efficient way to travel, 【M】saving commuters almost an hour every day.<br>📌 句型：分詞構句 saving...（= which saves...）補充結果。<br>save + 人 + 時間／金錢「替某人省下……」。"}, {"n": 4, "p": 0, "stem": "The museum offers free _____ to students on the first Sunday of every month.", "o": ["decision", "division", "permission", "admission"], "a": 3, "exp": "(D) admission（入場） ✓ free admission 免費入場。\n❌ (A) decision：決定\n❌ (B) division：分割\n❌ (C) permission：許可，一般不與 free 搭配表入場費", "zh": "博物館在每個月的第一個星期日提供學生免費入場。", "sa": "【S】The museum 【V】offers 【O】free admission 【M】to students 【M】on the first Sunday of every month.<br>📌 句型：offer + 物 + to + 人「提供某物給某人」；free admission「免費入場」。"}, {"n": 5, "p": 0, "stem": "Please _____ your seat belt before the plane takes off.", "o": ["frighten", "soften", "fasten", "flatten"], "a": 2, "exp": "(C) fasten（繫上） ✓ fasten a seat belt 繫安全帶。\n❌ (A) frighten：使害怕，字形相近\n❌ (B) soften：使變軟，字形相近\n❌ (D) flatten：壓平，字形相近", "zh": "飛機起飛前請繫好安全帶。", "sa": "（祈使句，省略主詞 you）Please 【V】fasten 【O】your seat belt 【M】before the plane takes off.<br>📌 句型：祈使句 Please + 原形動詞；before 引導時間副詞子句，用現在式表未來。<br>fasten a seat belt「繫安全帶」。"}, {"n": 6, "p": 0, "stem": "Doctors _____ that people drink at least eight glasses of water a day.", "o": ["recommend", "protest", "punish", "imagine"], "a": 0, "exp": "(A) recommend（建議） ✓ recommend that + S + (should) V，醫生建議每日喝水。\n❌ (B) protest：抗議，語意不合\n❌ (C) punish：處罰，語意不合\n❌ (D) imagine：想像，不接 that 子句表建議", "zh": "醫生建議人們每天至少喝八杯水。", "sa": "【S】Doctors 【V】recommend 【O】that people (should) drink at least eight glasses of water a day.<br>📌 句型：recommend that + S + (should) + 原形動詞（建議類動詞後的 that 子句用原形）。<br>例：I suggest that he (should) see a doctor."}, {"n": 7, "p": 0, "stem": "Typhoons often _____ serious damage to crops in southern Taiwan.", "o": ["prove", "cause", "hide", "spell"], "a": 1, "exp": "(B) cause（造成） ✓ cause damage 造成損害。\n❌ (A) prove：證明，不接 damage\n❌ (C) hide：隱藏，語意不通\n❌ (D) spell：拼字，語意不通", "zh": "颱風常常對台灣南部的農作物造成嚴重損害。", "sa": "【S】Typhoons 【M】often 【V】cause 【O】serious damage 【M】to crops in southern Taiwan.<br>📌 句型：cause damage to + 名詞「對……造成損害」；頻率副詞 often 放在一般動詞前。"}, {"n": 8, "p": 0, "stem": "Jenny is so _____ that she always helps her classmates without being asked.", "o": ["curious", "nervous", "generous", "stubborn"], "a": 2, "exp": "(C) generous（慷慨的、大方的） ✓ 主動幫助同學，表示個性慷慨樂於助人。\n❌ (A) curious：好奇的，與主動幫忙無關\n❌ (B) nervous：緊張的，語意不合\n❌ (D) stubborn：固執的，語意相反", "zh": "Jenny 非常慷慨大方，總是在沒人要求的情況下主動幫助同學。", "sa": "【S】Jenny 【V】is 【C】so generous that she always helps her classmates without being asked.<br>📌 句型：so + 形容詞 + that 子句「如此……以致於……」。<br>without being asked：without + 被動動名詞「沒有被要求」。"}, {"n": 9, "p": 0, "stem": "The speaker's talk was <i>brief<\/i>, so we left the hall early.", "o": ["boring", "short", "careful", "funny"], "a": 1, "exp": "(B) short（簡短的） ✓ *brief* 意為「簡短的」，與 short 同義。\n❌ (A) boring：無聊的，意思不同\n❌ (C) careful：小心的，意思不同\n❌ (D) funny：好笑的，意思不同", "zh": "講者的演講很簡短，所以我們提早離開了會場。", "sa": "【S】The speaker's talk 【V】was 【C】brief, so 【S】we 【V】left 【O】the hall 【M】early.<br>📌 句型：S + V + C, so + S + V（so 連接因果）。<br>brief = short「簡短的」。"}, {"n": 10, "p": 0, "stem": "The tour guide <i>assured<\/i> us that the trip would be safe.", "o": ["warned", "asked", "reminded", "promised"], "a": 3, "exp": "(D) promised（保證） ✓ *assure* 意為「向……保證」，與 promised 接近。\n❌ (A) warned：警告，語意相反\n❌ (B) asked：詢問，語意不同\n❌ (C) reminded：提醒，語意不同", "zh": "導遊向我們保證這趟旅程會很安全。", "sa": "【S】The tour guide 【V】assured 【O】us 【O】that the trip would be safe.<br>📌 句型：assure + 人 + that 子句「向某人保證……」（= promise）。<br>主要動詞為過去式，that 子句用 would 表過去的未來（時態一致）。"}, {"n": 11, "p": 1, "stem": "Waiter: Are you ready to order?<br>Customer: Yes. I'll have the beef noodle soup.<br>Waiter: _____<br>Customer: Iced tea, please.", "o": ["Would you like something to drink?", "How was your meal?", "Do you want to split the bill?", "Is this seat taken?"], "a": 0, "exp": "(A) Would you like something to drink? ✓ 顧客答「冰紅茶」，是在回答飲料詢問。\n❌ (B) How was your meal?：尚未用餐\n❌ (C) Do you want to split the bill?：與點餐流程不符\n❌ (D) Is this seat taken?：與回答無關", "zh": "服務生：您準備好點餐了嗎？<br>顧客：好了。我要一碗牛肉麵。<br>服務生：<b>您想喝點什麼嗎？<\/b><br>顧客：請給我冰紅茶。", "sa": "Would you like something to drink?<br>【S】you 【V】would like 【O】something 【M】to drink<br>📌 句型：Would you like + 名詞？禮貌詢問「您想要……嗎？」<br>something to drink：不定詞 to drink 修飾 something。"}, {"n": 12, "p": 1, "stem": "Amy: Did you finish the science report?<br>Ben: Not yet. I'm still looking for data.<br>Amy: _____<br>Ben: That would be great. Can you send me the link?", "o": ["I finished mine yesterday, so I don't need any.", "I know a website with good statistics. Want me to share it?", "Why do you like science?", "The deadline was last week."], "a": 1, "exp": "(B) I know a website with good statistics. Want me to share it? ✓ Ben 說「太好了，能傳連結嗎？」，表示 Amy 提議分享網站。\n❌ (A) I finished mine yesterday, so I don't need any.：沒有提供協助，後面的「連結」不連貫\n❌ (C) Why do you like science?：與找資料無關\n❌ (D) The deadline was last week.：無法導向「傳連結」", "zh": "Amy：你的自然科報告寫完了嗎？<br>Ben：還沒。我還在找資料。<br>Amy：<b>我知道一個有很好統計資料的網站。要我分享給你嗎？<\/b><br>Ben：那太好了。你可以把連結傳給我嗎？", "sa": "【S】I 【V】know 【O】a website 【M】with good statistics. (Do you) Want me to share it?<br>📌 句型：want + O + to V「想要某人做……」；口語省略 Do you。<br>with + 名詞 作形容詞片語修飾 website。<br>That would be great. 用 would 表示委婉的贊同。"}, {"n": 13, "p": 1, "stem": "Tom: I'm thinking of joining the basketball team.<br>Kim: Really? _____<br>Tom: About twice a week, after school.", "o": ["Who is the coach?", "Where did you buy your shoes?", "How often do they practice?", "How long have you played?"], "a": 2, "exp": "(C) How often do they practice? ✓ 回答頻率「一週兩次」，問的是 How often。\n❌ (A) Who is the coach?：答案應為人名\n❌ (B) Where did you buy your shoes?：答案應為地點\n❌ (D) How long have you played?：答案應為年資", "zh": "Tom：我在考慮加入籃球隊。<br>Kim：真的嗎？<b>他們多久練習一次？<\/b><br>Tom：大概一週兩次，在放學後。", "sa": "How often 【V】do 【S】they 【V】practice?<br>📌 句型：How often...? 詢問「頻率」，回答用 once / twice a week 等。<br>be thinking of + V-ing「正在考慮做……」。"}, {"n": 14, "p": 1, "stem": "Customer: Excuse me, this shirt has a hole in it.<br>Clerk: I'm so sorry. _____<br>Customer: I'd prefer a refund, please.", "o": ["It was on sale last week.", "You should wash it first.", "We close at nine o'clock.", "Would you like to exchange it or get your money back?"], "a": 3, "exp": "(D) Would you like to exchange it or get your money back? ✓ 顧客選擇「退款」，呼應店員給出的兩個選項。\n❌ (A) It was on sale last week.：未回應瑕疵\n❌ (B) You should wash it first.：不合情理\n❌ (C) We close at nine o'clock.：與瑕疵問題無關", "zh": "顧客：不好意思，這件襯衫上有一個破洞。<br>店員：真的很抱歉。<b>您想要換貨還是退錢呢？<\/b><br>顧客：我比較想退款，謝謝。", "sa": "Would 【S】you 【V】like 【O】to exchange it or (to) get your money back?<br>📌 句型：Would you like to V...or...? 提供兩個選項。<br>I'd prefer + 名詞「我比較想要……」；get one's money back「拿回錢＝退款」。"}, {"n": 15, "p": 1, "stem": "Mom: You look tired. Did you sleep well?<br>Son: Not really. I stayed up late playing games.<br>Mom: _____<br>Son: You're right. I'll go to bed earlier tonight.", "o": ["I'm glad you had so much fun.", "That's not healthy. You need enough sleep to focus at school.", "Games are cheaper than movies.", "Why don't you play more?"], "a": 1, "exp": "(B) That's not healthy. You need enough sleep to focus at school. ✓ 兒子說「你說得對，今晚早睡」，表示媽媽提出勸告。\n❌ (A) I'm glad you had so much fun.：不會促使他早睡\n❌ (C) Games are cheaper than movies.：答非所問\n❌ (D) Why don't you play more?：與兒子的回應矛盾", "zh": "媽媽：你看起來很累。你睡得好嗎？<br>兒子：不太好。我熬夜打電動。<br>媽媽：<b>那樣不健康。你需要足夠的睡眠才能在學校專心。<\/b><br>兒子：你說得對。我今晚會早點上床睡覺。", "sa": "【S】That 【V】's 【C】not healthy. 【S】You 【V】need 【O】enough sleep 【M】to focus at school.<br>📌 句型：不定詞 to focus 表目的「為了專心」。<br>stay up late + V-ing「熬夜做……」。"}, {"n": 16, "p": 1, "stem": "Clerk: Can I help you?<br>Guest: I booked a room for two nights under Wang.<br>Clerk: _____ Here is your key.<br>Guest: Thank you. What time is breakfast?", "o": ["Yes, I found it. Please sign here.", "Sorry, we are closed.", "No, you cannot stay here.", "Which airline did you take?"], "a": 0, "exp": "(A) Yes, I found it. Please sign here. ✓ 找到訂房紀錄並請簽名，接著才給房卡。\n❌ (B) Sorry, we are closed.：之後不會給房卡\n❌ (C) No, you cannot stay here.：與給房卡矛盾\n❌ (D) Which airline did you take?：與入住無關", "zh": "櫃檯人員：需要幫忙嗎？<br>房客：我用王的名字訂了兩晚的房間。<br>櫃檯人員：<b>是的，我找到了。請在這裡簽名。<\/b>這是您的房卡。<br>房客：謝謝。早餐幾點開始？", "sa": "Yes, 【S】I 【V】found 【O】it. Please 【V】sign 【M】here.<br>📌 句型：Please + 原形動詞（祈使句）。<br>book a room under + 名字「用某人名字訂房」。"}, {"n": 17, "p": 1, "stem": "Leo: I'm going to Japan next month.<br>Jin: Cool! _____<br>Leo: Just a week. I can't take more days off.", "o": ["How far is your school?", "Who paid for it?", "How long will you stay there?", "What do you do there?"], "a": 2, "exp": "(C) How long will you stay there? ✓ Leo 回答「一個星期」，是回答停留期間。\n❌ (A) How far is your school?：與回答不合\n❌ (B) Who paid for it?：與回答不合\n❌ (D) What do you do there?：與回答不合", "zh": "Leo：我下個月要去日本。<br>Jin：酷！<b>你會在那裡待多久？<\/b><br>Leo：就一個星期。我沒辦法請更多天假。", "sa": "How long 【V】will 【S】you 【V】stay 【M】there?<br>📌 句型：How long...? 詢問「時間長度」，回答用 a week、three days 等。<br>be going to + V 表預定計畫；take days off「請假」。"}, {"n": 18, "p": 1, "stem": "Wendy: Our flight was delayed for three hours.<br>Alex: That's too bad. _____<br>Wendy: Yes, the airline gave us free meal vouchers.", "o": ["Was the flight on time?", "Did they do anything to make up for it?", "Did you miss your bus?", "Were you the pilot?"], "a": 1, "exp": "(B) Did they do anything to make up for it? ✓ Wendy 回答航空公司給了餐券，作為補償。\n❌ (A) Was the flight on time?：已說延誤三小時\n❌ (C) Did you miss your bus?：與餐券回答不連貫\n❌ (D) Were you the pilot?：不合常理", "zh": "Wendy：我們的班機延誤了三個小時。<br>Alex：真糟糕。<b>他們有做什麼來補償嗎？<\/b><br>Wendy：有，航空公司給了我們免費的餐券。", "sa": "Did 【S】they 【V】do 【O】anything 【M】to make up for it?<br>📌 句型：make up for + 名詞「彌補、補償」。<br>不定詞 to make up for it 表目的。"}, {"n": 19, "p": 1, "stem": "Teacher: Your essay has good ideas, but it's a bit too short.<br>Student: _____<br>Teacher: Try adding a personal example in each paragraph.", "o": ["How can I make it better?", "I'd rather not write essays.", "Is it due tomorrow?", "Can I have a pen?"], "a": 0, "exp": "(A) How can I make it better? ✓ 老師給出具體建議，故學生是在詢問改進方法。\n❌ (B) I'd rather not write essays.：老師不會給建議\n❌ (C) Is it due tomorrow?：與建議不連貫\n❌ (D) Can I have a pen?：答非所問", "zh": "老師：你的作文想法很好，但有點太短了。<br>學生：<b>我要怎麼把它寫得更好？<\/b><br>老師：試著在每一段加入一個個人的例子。", "sa": "How can 【S】I 【V】make 【O】it 【C】better?<br>📌 句型：make + O + C（形容詞）「使……變得……」。<br>try + V-ing「試試看做……」。"}, {"n": 20, "p": 1, "stem": "Nina: Did you watch the baseball game last night?<br>Owen: Yes! Taiwan won 5 to 4 in the ninth inning.<br>Nina: _____<br>Owen: I know. I could hardly sit still.", "o": ["That's a boring score.", "I wish I had played.", "What an exciting finish!", "They lost again?"], "a": 2, "exp": "(C) What an exciting finish! ✓ Owen 說「我知道，我簡直坐不住」，附和了精彩的比賽。\n❌ (A) That's a boring score.：與 Owen 的反應矛盾\n❌ (B) I wish I had played.：語意不連貫\n❌ (D) They lost again?：Taiwan 贏了", "zh": "Nina：你昨晚有看棒球比賽嗎？<br>Owen：有！台灣在第九局以 5 比 4 獲勝。<br>Nina：<b>真是精彩的結局！<\/b><br>Owen：我知道。我簡直坐不住。", "sa": "What an exciting finish!<br>📌 句型：感嘆句 What + a/an + 形容詞 + 名詞 (+ S + V)!<br>could hardly + V「幾乎無法……」；sit still「坐著不動」。"}, {"n": 21, "p": 2, "stem": "(21)", "o": ["From", "At", "Of", "On"], "a": 2, "exp": "(C) Of ✓ Of the hundreds of markets = 「在數百個夜市中」，表示範圍。\n❌ (A) From：from the hundreds 語意不合\n❌ (B) At：at 用於地點，不合\n❌ (D) On：on 不合", "zh": "<i><b>Of<\/b> the hundreds of markets across the island, Shilin Night Market in Taipei is probably the best known.<\/i><br>在全島數百個夜市當中，台北的士林夜市大概是最有名的。", "sa": "【M】Of the hundreds of markets across the island, 【S】Shilin Night Market in Taipei 【V】is 【C】probably the best known.<br>📌 句型：Of + 複數名詞（範圍），S + be + the 最高級「在……之中，……最……」。<br>例：Of all the students, Amy is the tallest."}, {"n": 22, "p": 2, "stem": "(22)", "o": ["private", "practical", "painful", "passive"], "a": 1, "exp": "(B) practical ✓ practical way 實際可行的方式，低租金創業。\n❌ (A) private：私人的，語意不合\n❌ (C) painful：痛苦的，與低成本不合\n❌ (D) passive：被動的，語意不合", "zh": "<i>The markets also offer a <b>practical<\/b> way for small business owners to start their own shops without spending much money on rent.<\/i><br>夜市也為小商家老闆提供了一個實際可行的方式，讓他們不必花很多錢在租金上就能開自己的店。", "sa": "【S】The markets 【V】offer 【O】a practical way 【M】for small business owners to start their own shops 【M】without spending much money on rent.<br>📌 句型：a way for + 人 + to V「讓某人做……的方法」。<br>spend + 錢 + on + 名詞「花錢在……」。"}, {"n": 23, "p": 2, "stem": "(23)", "o": ["even though", "as long as", "in case", "so that"], "a": 0, "exp": "(A) even though ✓ 遊客數量仍高，卻有攤商難以維生，需讓步連接詞。\n❌ (B) as long as：只要，語意不合\n❌ (C) in case：以防，語意不合\n❌ (D) so that：以便，語意不合", "zh": "<i>In recent years, however, rising costs have made it hard for some stalls to survive, <b>even though<\/b> the number of visitors remains high.<\/i><br>然而近年來，成本上漲讓一些攤位難以生存，即使遊客人數仍然很多。", "sa": "【S】rising costs 【V】have made 【O】it 【C】hard 【M】for some stalls to survive, 【M】even though the number of visitors remains high.<br>📌 句型：make + it（虛受詞）+ adj. + for 人 + to V。<br>even though 引導讓步子句「即使、雖然」；the number of + 複數名詞 當主詞用單數動詞 remains。"}, {"n": 24, "p": 2, "stem": "(24)", "o": ["to cut down foreign tourists", "to remove traditional snacks", "to raise the price of every stall", "to improve hygiene and the environment"], "a": 3, "exp": "(D) to improve hygiene and the environment ✓ 為吸引更多遊客，合作改善衛生與環境最合理。\n❌ (A) to cut down foreign tourists：與目的矛盾\n❌ (B) to remove traditional snacks：破壞特色，與目的矛盾\n❌ (C) to raise the price of every stall：不會吸引遊客", "zh": "<i>To attract more tourists, some city governments have worked with vendors <b>to improve hygiene and the environment<\/b>.<\/i><br>為了吸引更多觀光客，一些市政府已和攤商合作，改善衛生與環境。", "sa": "【M】To attract more tourists, 【S】some city governments 【V】have worked 【M】with vendors 【M】to improve hygiene and the environment.<br>📌 句型：句首與句尾的不定詞 to V 皆表「目的」。<br>現在完成式 have worked 表示到目前為止的作為。"}, {"n": 25, "p": 2, "stem": "(25)", "o": ["has had", "had had", "having had", "will have had"], "a": 0, "exp": "(A) has had ✓ so far 搭配現在完成式。\n❌ (B) had had：過去完成式，不搭 so far\n❌ (C) having had：分詞，不能作述語動詞\n❌ (D) will have had：未來完成式，與 so far 不合", "zh": "<i>The policy is meant to reduce plastic waste, but it <b>has had<\/b> only a small effect so far.<\/i><br>這項政策的目的是減少塑膠垃圾，但到目前為止只產生了很小的效果。", "sa": "【S】The policy 【V】is meant 【M】to reduce plastic waste, but 【S】it 【V】has had 【O】only a small effect 【M】so far.<br>📌 句型：so far「到目前為止」搭配現在完成式 have/has + p.p.。<br>be meant to V「目的是要……」；have an effect「產生效果」。"}, {"n": 26, "p": 2, "stem": "(26)", "o": ["bring", "brings", "brought", "bringing"], "a": 0, "exp": "(A) bring ✓ customers 為複數，描述習慣，用現在簡單式複數動詞。\n❌ (B) brings：單數，與 customers 不一致\n❌ (C) brought：過去式，與 regularly 的習慣語意不合\n❌ (D) bringing：缺助動詞", "zh": "<i>A recent survey found that fewer than 10% of customers <b>bring<\/b> reusable cups regularly.<\/i><br>最近一項調查發現，經常自備環保杯的顧客不到一成。", "sa": "【S】A recent survey 【V】found 【O】that fewer than 10% of customers bring reusable cups regularly.<br>📌 句型：that 子句作 found 的受詞；子句中主詞 fewer than 10% of customers 為複數，動詞用 bring。<br>描述普遍、經常的事實用現在簡單式。"}, {"n": 27, "p": 2, "stem": "(27)", "o": ["unless", "while", "so", "since"], "a": 1, "exp": "(B) while ✓ some people ..., while others ... 表對比。\n❌ (A) unless：除非，語意不合\n❌ (C) so：因此，語意不合\n❌ (D) since：自從／因為，語意不如 while 自然", "zh": "<i>Some people forget to carry them, <b>while<\/b> others think that washing them is troublesome.<\/i><br>有些人忘了帶，而另一些人則認為清洗很麻煩。", "sa": "【S】Some people 【V】forget 【O】to carry them, while 【S】others 【V】think 【O】that washing them is troublesome.<br>📌 句型：Some..., while others...「有些……，而有些……」，while 表對比。<br>forget to V「忘了去做」；動名詞 washing them 作子句主詞。"}, {"n": 28, "p": 2, "stem": "(28)", "o": ["as if", "even if", "in case", "so that"], "a": 3, "exp": "(D) so that ✓ so that 表目的：為了讓更多顧客改變習慣。\n❌ (A) as if：彷彿，語意不合\n❌ (B) even if：即使，語意不合\n❌ (C) in case：以防，語意不合", "zh": "<i>Experts suggest that shops should offer a bigger discount <b>so that<\/b> more customers change their habits.<\/i><br>專家建議店家應該提供更大的折扣，好讓更多顧客改變習慣。", "sa": "【S】Experts 【V】suggest 【O】that shops should offer a bigger discount 【M】so that more customers change their habits.<br>📌 句型：suggest that + S + (should) + 原形動詞。<br>so that + S + V 表「目的：以便、好讓」。"}, {"n": 29, "p": 3, "stem": "Which activity will take place in the evening?", "o": ["The cooking class", "The art workshop", "The night walk", "The beach cleanup"], "a": 2, "exp": "(C) The night walk ✓ 19:00 為 Night walk。\n❌ (A) The cooking class：14:00 午後\n❌ (B) The art workshop：15:00 下午\n❌ (D) The beach cleanup：7 月 16 日早上", "zh": "題目：哪一項活動會在晚上進行？<br>(A) 烹飪課<br>(B) 藝術工作坊<br>(C) 夜間散步<br>(D) 淨灘", "sa": "題目：Which activity 【V】will take place 【M】in the evening?（Which activity 本身為主詞）<br>依據：July 14 — 19:00 Night walk.<br>📌 句型：take place「舉行、發生」，不用被動式。"}, {"n": 30, "p": 3, "stem": "If it rains on July 15, what will campers most likely do in the morning?", "o": ["Visit a museum.", "Go hiking.", "Go kayaking.", "Clean the beach."], "a": 0, "exp": "(A) Visit a museum. ✓ 下雨時登山取消，改參觀博物館。\n❌ (B) Go hiking.：取消\n❌ (C) Go kayaking.：是第一天的活動\n❌ (D) Clean the beach.：是第三天的活動", "zh": "題目：如果 7 月 15 日下雨，露營者早上最可能做什麼？<br>(A) 參觀博物館。<br>(B) 去登山健行。<br>(C) 去划獨木舟。<br>(D) 清理海灘。", "sa": "題目：If it rains on July 15, what 【V】will 【S】campers 【M】most likely 【V】do 【M】in the morning?<br>依據：If it rains, 【S】hiking 【V】will be canceled and 【S】campers 【V】will visit 【O】a museum 【M】instead.<br>📌 句型：條件句 If + 現在式, S + will + V；will be canceled 為未來被動式。"}, {"n": 31, "p": 3, "stem": "According to the table, which statement is correct?", "o": ["Screen time dropped in 2022.", "Teenagers used screens 30 hours in 2024.", "The biggest increase was from 2023 to 2024.", "Screen time went up every year from 2020 to 2024."], "a": 3, "exp": "(D) Screen time went up every year from 2020 to 2024. ✓ 數據每年遞增 18→21→24→26→27。\n❌ (A) Screen time dropped in 2022.：2022 為 24，上升\n❌ (B) Teenagers used screens 30 hours in 2024.：2024 為 27\n❌ (C) The biggest increase was from 2023 to 2024.：該年僅增加 1 小時，是最小的", "zh": "題目：根據表格，下列哪一項敘述正確？<br>(A) 螢幕使用時間在 2022 年下降。<br>(B) 青少年在 2024 年使用螢幕 30 小時。<br>(C) 增幅最大的是 2023 年到 2024 年。<br>(D) 從 2020 年到 2024 年，螢幕使用時間每年都在增加。", "sa": "題目：According to the table, which statement 【V】is 【C】correct?<br>依據：表格數據 18 → 21 → 24 → 26 → 27，逐年上升。<br>📌 句型：go up「上升」／drop「下降」；the biggest increase「最大的增幅」（最高級）。"}, {"n": 32, "p": 3, "stem": "Which is NOT mentioned as a cause of the increase?", "o": ["Online classes", "Short videos", "Cheaper phones", "Online games"], "a": 2, "exp": "(C) Cheaper phones ✓ 文中三個原因：線上課程、短影片、線上遊戲。\n❌ (A) Online classes：有提到\n❌ (B) Short videos：有提到\n❌ (D) Online games：有提到", "zh": "題目：下列哪一項沒有被提及是增加的原因？<br>(A) 線上課程<br>(B) 短影音<br>(C) 較便宜的手機<br>(D) 線上遊戲", "sa": "題目：Which 【V】is NOT mentioned 【M】as a cause of the increase?（被動式）<br>依據：First, online classes...; Second, short videos...; Third, online games...<br>📌 句型：be mentioned as...「被提及為……」；NOT 題要找文中「沒有」的選項。"}, {"n": 33, "p": 3, "stem": "According to the table, which statement is correct?", "o": ["7-Eleven has twice as many stores as FamilyMart.", "OK Mart has more stores than Hi-Life.", "FamilyMart has three times as many stores as Hi-Life.", "Hi-Life has about 2,000 more stores than OK Mart."], "a": 2, "exp": "(C) FamilyMart has three times as many stores as Hi-Life. ✓ 4,200 ÷ 1,400 = 3。\n❌ (A) 7-Eleven has twice as many stores as FamilyMart.：6,800 約 1.6 倍\n❌ (B) OK Mart has more stores than Hi-Life.：900 < 1,400\n❌ (D) Hi-Life has about 2,000 more stores than OK Mart.：僅多 500 間", "zh": "題目：根據表格，下列哪一項敘述正確？<br>(A) 7-Eleven 的店數是全家的兩倍。<br>(B) OK 超商的店數比萊爾富多。<br>(C) 全家的店數是萊爾富的三倍。<br>(D) 萊爾富比 OK 超商多約 2,000 家店。", "sa": "題目：According to the table, which statement 【V】is 【C】correct?<br>依據：FamilyMart 4,200 ÷ Hi-Life 1,400 = 3。<br>📌 句型：倍數比較 A has + 倍數 + as many + 名詞 + as B「A 是 B 的……倍」。<br>例：This box is twice as heavy as that one."}, {"n": 34, "p": 3, "stem": "Which of the following is NOT mentioned as a reason for the success of convenience stores?", "o": ["They are open 24 hours a day.", "They are located close to homes and offices.", "They offer a wide range of services.", "Their prices are lower than those of traditional markets."], "a": 3, "exp": "(D) Their prices are lower than those of traditional markets. ✓ 文中提到 24 小時營業、鄰近住家辦公室、服務多元，未提價格較低。\n❌ (A) They are open 24 hours a day.：有提到\n❌ (B) They are located close to homes and offices.：有提到\n❌ (C) They offer a wide range of services.：有提到", "zh": "題目：下列哪一項沒有被提及是便利商店成功的原因？<br>(A) 它們 24 小時營業。<br>(B) 它們位於住家和辦公室附近。<br>(C) 它們提供各式各樣的服務。<br>(D) 它們的價格比傳統市場便宜。", "sa": "題目：Which of the following 【V】is NOT mentioned 【M】as a reason for the success of convenience stores?<br>依據：stores 【V】are open 24 hours, (are) located close to homes and offices, and offer a wide range of services under one roof.<br>📌 句型：三個並列述語 A, B, and C；a wide range of「各式各樣的」。"}, {"n": 35, "p": 3, " const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]+ptrHtml(String(q.n)); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){

 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);

 }

}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}

  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;

  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }

};
})();</script>

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}

  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');

  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){

    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);

  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">

<title>統測英文模擬考卷 C</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">

    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>

    <div class="bar">
      <span>作答進度</span>

    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>

      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 C　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nMany cities around the world are now installing \"smart\" trash bins that use sensors to monitor how full they are. When a bin is almost <span class=\"blk\">21</span> , it sends a signal to the city's waste management system, allowing collection trucks to be sent only when <span class=\"blk\">22</span> . This system reduces unnecessary trips, saving fuel and lowering carbon emissions. In addition, some smart bins are equipped with solar panels, <span class=\"blk\">23</span> them to compress trash automatically and hold up to five times more waste than traditional bins. Although the initial cost of installing these bins is higher than that of ordinary ones, city officials argue that the long-term savings make the investment <span class=\"blk\">24</span> .</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nBefore refrigerators became common household items, people in many cultures relied on a variety of clever methods to keep food fresh. In some regions, families dug deep pits in the ground and lined them with straw, <span class=\"blk\">25</span> a cool, dark space to store vegetables through the winter. Others used natural ice cut from frozen lakes, <span class=\"blk\">26</span> was stored in insulated buildings called icehouses. Fermentation was another popular method; vegetables packed in salt and left to ferment could last for months <span class=\"blk\">27</span> spoiling. Today, even though modern refrigeration is widely available, some of these traditional techniques have <span class=\"blk\">28</span> a comeback, as people look for more sustainable, energy-saving ways to preserve food.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<i>Read the notice below and answer the questions.</i><br><br><b>Riverside Public Library</b><br><b>Notice: Temporary Closure of the Children's Reading Room</b><br><br>Due to renovation work, the Children's Reading Room on the 2nd floor will be closed from <b>July 1 to July 15</b>.<br><br>During this period:<br>• Story-time sessions will be held in the main hall at 3:00 PM every Saturday.<br>• Children's books can still be borrowed and returned at the main circulation desk.<br>• The computer area for kids will remain open as usual.<br><br>We apologize for any inconvenience and look forward to welcoming you to the newly renovated reading room on <b>July 16</b>.<br><br>— Riverside Public Library Management<br></div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<i>Read the following text message conversation and answer the questions.</i><br><br><b>Jenny:</b> Hey, are we still meeting at the café at 6?<br><b>Leo:</b> Actually, something came up at work — can we push it to 7 instead?<br><b>Jenny:</b> Sure, no problem. Should I still book the table for four?<br><b>Leo:</b> Yes, please. Oh, and Mark said he might be 10–15 minutes late.<br><b>Jenny:</b> Got it. I'll let the café know about the later time and the extra guest.<br><b>Leo:</b> Thanks, Jenny! See you all at 7.<br></div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nNight markets have long been an important part of life in Taiwan, offering everything from local snacks to clothing and games. In recent years, however, many night markets have begun to face challenges. Younger generations increasingly prefer the convenience of online shopping and food delivery apps, which has led to a gradual decline in the number of customers visiting traditional night markets.<br><br>To attract visitors again, some night markets have started to modernize. Mobile payment systems have been introduced so customers no longer need to carry cash. Several markets have also created social media accounts to promote popular stalls and special events, drawing in tourists who discover them online. A few markets have even added designated seating areas and improved lighting to make the shopping experience more comfortable.<br><br>Despite these changes, vendors say that the heart of the night market remains the same: fresh, affordable food and a lively atmosphere that cannot be fully replicated online. Many believe that as long as night markets continue to adapt without losing this unique character, they will remain a beloved part of Taiwanese culture for generations to come.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nHave you ever felt more creative after taking a walk or a shower? Many people report that their best ideas come to them during these seemingly unproductive moments. Researchers have studied this phenomenon and found that it is closely related to how our brains work.<br><br>When we are focused on a difficult task, our brain's \"executive control\" network is highly active, helping us concentrate and filter out distractions. However, this focused state can sometimes prevent us from making unusual connections between ideas. In contrast, when we engage in simple, automatic activities — such as walking, showering, or doing the dishes — the brain's \"default mode\" network becomes more active. This network is associated with daydreaming, mind-wandering, and the kind of loose, flexible thinking that often leads to creative insights.<br><br>Interestingly, the activity needs to be simple enough that it doesn't require much conscious attention, but not so passive that we fall asleep or lose focus entirely. This is why activities like walking tend to be more effective for boosting creativity than, say, watching an intense action movie, which demands a lot of attention.<br><br>So the next time you're stuck on a problem, stepping away for a walk might not be a waste of time — it could be exactly what your brain needs to find a solution.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Maria Sato took over her family's small print shop in a quiet neighborhood, most people assumed the business wouldn't survive much longer. Large chain stores offered cheaper printing, and fewer people needed physical documents printed at all. But instead of closing the shop, Maria decided to transform it.<br><br>She began by researching what her neighborhood actually needed. After talking to local artists, students, and small business owners, she realized there was demand for high-quality custom printing — things like art prints, posters, business cards with unique designs, and small batches of zines (self-published magazines). Maria invested in better printing equipment and began offering workshops on design software for beginners.<br><br>Word spread quickly. Local art students started bringing their projects to her shop instead of ordering online, both because of the quality and because Maria could offer advice on design choices. Small business owners appreciated being able to see and approve samples in person before a full print run. The shop also became a meeting place, with a small corner where customers could sit, chat, and look through sample books.<br><br>Three years later, the shop is busier than ever, and Maria has hired two part-time employees to help keep up with demand. \"I didn't try to compete with the big chains on price,\" she explains. \"I focused on what they couldn't offer — personal service, quality, and a sense of community.\"</div>"};
const PTR = {"21": [{"en": "Many cities around the world are now installing \"smart\" trash bins that use sensors to monitor how full they are.", "zh": "現在世界上有許多城市正在設置「智慧」垃圾桶，這種垃圾桶用感測器監測自己裝了多滿。", "sa": "【S】Many cities 【V】are installing 【O】\"smart\" trash bins 【M】that use sensors to monitor how full they are<br>📌 現在進行式表正在發展的趨勢；that 引導關係子句修飾 bins；how full they are 為名詞子句當 monitor 的受詞"}, {"en": "When a bin is almost <b>full<\/b>, it sends a signal to the city's waste management system, allowing collection trucks to be sent only when <b>necessary<\/b>.", "zh": "當垃圾桶快滿時，它會發送訊號給市政府的廢棄物管理系統，讓垃圾車只在必要時才出動。", "sa": "【M】When… 【S】it 【V】sends 【O】a signal… 【M】allowing collection trucks to be sent…<br>📌 分詞構句表結果；allow + O + to be p.p.；only when (it is) necessary 省略句"}, {"en": "This system reduces unnecessary trips, saving fuel and lowering carbon emissions.", "zh": "這套系統減少了不必要的出車，既節省燃料，也降低碳排放。", "sa": "【S】This system 【V】reduces 【O】unnecessary trips 【M】saving fuel and lowering carbon emissions<br>📌 分詞構句 saving… and lowering… 表伴隨的結果"}, {"en": "In addition, some smart bins are equipped with solar panels, <b>allowing<\/b> them to compress trash automatically and hold up to five times more waste than traditional bins.", "zh": "此外，有些智慧垃圾桶配有太陽能板，讓它們能自動壓縮垃圾，最多可容納傳統垃圾桶五倍的垃圾量。", "sa": "【S】some smart bins 【V】are equipped with 【O】solar panels 【M】allowing them to compress… and hold…<br>📌 be equipped with（配備有）；倍數 + more + N + than"}, {"en": "Although the initial cost of installing these bins is higher than that of ordinary ones, city officials argue that the long-term savings make the investment <b>worthwhile<\/b>.", "zh": "雖然安裝這些垃圾桶的初期成本比一般垃圾桶高，但市府官員認為，長期省下的費用讓這項投資很值得。", "sa": "【M】Although…（讓步子句）【S】city officials 【V】argue 【O】that 子句<br>📌 make + O + adj.（使…值得）；that of 代替 the initial cost"}], "25": [{"en": "Before refrigerators became common household items, people in many cultures relied on a variety of clever methods to keep food fresh.", "zh": "在冰箱成為普遍的家用品之前，許多文化中的人們依靠各種巧妙的方法來保持食物新鮮。", "sa": "【M】Before… 【S】people in many cultures 【V】relied on 【O】a variety of clever methods 【M】to keep food fresh<br>📌 rely on（依賴）；keep + O + adj.（使…保持…）"}, {"en": "In some regions, families dug deep pits in the ground and lined them with straw, <b>creating<\/b> a cool, dark space to store vegetables through the winter.", "zh": "在某些地區，家家戶戶在地上挖深坑，並在坑內鋪上稻草，打造出一個陰涼又陰暗的空間，用來儲存蔬菜過冬。", "sa": "【S】families 【V】dug… and lined… 【M】creating a cool, dark space…<br>📌 分詞構句表結果；line A with B（在 A 內鋪上 B）"}, {"en": "Others used natural ice cut from frozen lakes, <b>which<\/b> was stored in insulated buildings called icehouses.", "zh": "其他人則使用從結冰湖面切下的天然冰塊，這些冰被存放在稱為「冰庫」的隔熱建築裡。", "sa": "【S】Others 【V】used 【O】natural ice 【M】cut from frozen lakes<br>📌 逗號 + which 非限定關係子句補充說明 ice；called + 名稱（被稱為…的）"}, {"en": "Fermentation was another popular method; vegetables packed in salt and left to ferment could last for months <b>without<\/b> spoiling.", "zh": "發酵是另一種常見的方法；用鹽醃漬、靜置發酵的蔬菜，可以保存好幾個月都不會壞。", "sa": "【S】Fermentation 【V】was 【C】another popular method；【S】vegetables 【V】could last 【M】for months without spoiling<br>📌 without + V-ing（而不…）；過去分詞片語後位修飾 vegetables"}, {"en": "Today, even though modern refrigeration is widely available, some of these traditional techniques have <b>made<\/b> a comeback, as people look for more sustainable, energy-saving ways to preserve food.", "zh": "如今，儘管現代冷藏技術已經相當普及，這些傳統方法中有一些又重新流行起來，因為人們在尋找更永續、更節能的保存食物方式。", "sa": "【M】even though…（讓步）【S】some of these traditional techniques 【V】have made 【O】a comeback 【M】as…（原因）<br>📌 make a comeback（再度流行）；現在完成式為 have + 過去分詞（have made）"}], "29": [{"en": "Riverside Public Library", "zh": "河濱公立圖書館", "sa": "名詞片語（機構名稱），省略主詞動詞"}, {"en": "Notice: Temporary Closure of the Children's Reading Room", "zh": "公告：兒童閱覽室暫停開放", "sa": "名詞片語標題，省略主詞動詞<br>📌 closure（關閉）為 close 的名詞"}, {"en": "Due to renovation work, the Children's Reading Room on the 2nd floor will be closed from July 1 to July 15.", "zh": "由於整修工程，二樓的兒童閱覽室將於 7 月 1 日至 7 月 15 日關閉。", "sa": "【M】Due to renovation work 【S】the Children's Reading Room (on the 2nd floor) 【V】will be closed 【M】from July 1 to July 15<br>📌 due to + N（由於）；未來式被動 will be + p.p."}, {"en": "During this period:", "zh": "在此期間：", "sa": "介系詞片語，引出下方條列事項"}, {"en": "Story-time sessions will be held in the main hall at 3:00 PM every Saturday.", "zh": "說故事時間將改在每週六下午 3 點於大廳舉行。", "sa": "【S】Story-time sessions 【V】will be held 【M】in the main hall at 3:00 PM every Saturday<br>📌 hold 的被動 be held（舉行）"}, {"en": "Children's books can still be borrowed and returned at the main circulation desk.", "zh": "兒童書籍仍可在總流通櫃檯借閱與歸還。", "sa": "【S】Children's books 【V】can still be borrowed and returned 【M】at the main circulation desk<br>📌 助動詞被動 can be + p.p.，兩個過去分詞對等"}, {"en": "The computer area for kids will remain open as usual.", "zh": "兒童電腦區將照常開放。", "sa": "【S】The computer area for kids 【V】will remain 【C】open 【M】as usual<br>📌 remain + adj.（保持…）；as usual（照常）"}, {"en": "We apologize for any inconvenience and look forward to welcoming you to the newly renovated reading room on July 16.", "zh": "造成不便，敬請見諒；我們期待在 7 月 16 日歡迎您蒞臨整修一新的閱覽室。", "sa": "【S】We 【V】apologize for 【O】any inconvenience and 【V】look forward to 【O】welcoming you…<br>📌 apologize for + N；look forward to + V-ing"}, {"en": "— Riverside Public Library Management", "zh": "河濱公立圖書館管理處　敬啟", "sa": "署名，名詞片語"}], "31": [{"en": "Jenny: Hey, are we still meeting at the café at 6?", "zh": "Jenny：嘿，我們還是 6 點在咖啡廳碰面嗎？", "sa": "【S】we 【V】are (still) meeting 【M】at the café at 6<br>📌 現在進行式表已安排好的未來計畫"}, {"en": "Leo: Actually, something came up at work — can we push it to 7 instead?", "zh": "Leo：其實我工作上臨時有事，可以改到 7 點嗎？", "sa": "【S】something 【V】came up 【M】at work<br>📌 come up（臨時發生）；push A to B（把 A 延到 B）；instead（改為）"}, {"en": "Jenny: Sure, no problem. Should I still book the table for four?", "zh": "Jenny：當然，沒問題。我還是要訂四人桌嗎？", "sa": "【S】I 【V】should book 【O】the table for four<br>📌 book（預訂）；a table for + 人數（幾人桌）"}, {"en": "Leo: Yes, please. Oh, and Mark said he might be 10–15 minutes late.", "zh": "Leo：好，麻煩你了。喔，還有 Mark 說他可能會晚 10 到 15 分鐘到。", "sa": "【S】Mark 【V】said 【O】(that) he might be 10–15 minutes late<br>📌 might（可能，表推測）；時間 + late（晚多久）"}, {"en": "Jenny: Got it. I'll let the café know about the later time and the extra guest.", "zh": "Jenny：了解。我會通知咖啡廳時間延後以及多一位客人的事。", "sa": "【S】I 【V】'll let 【O】the café 【C】know about…<br>📌 let + O + 原形動詞；Got it.（知道了）"}, {"en": "Leo: Thanks, Jenny! See you all at 7.", "zh": "Leo：謝謝你，Jenny！7 點見囉。", "sa": "省略句：(I'll) see you all at 7.<br>📌 口語省略主詞"}], "33": [{"en": "Night markets have long been an important part of life in Taiwan, offering everything from local snacks to clothing and games.", "zh": "夜市長久以來一直是台灣生活中重要的一部分，從在地小吃到衣服和遊戲，應有盡有。", "sa": "【S】Night markets 【V】have long been 【C】an important part of life in Taiwan 【M】offering everything…<br>📌 現在完成式 have been 表持續；from A to B（從 A 到 B）"}, {"en": "In recent years, however, many night markets have begun to face challenges.", "zh": "然而，近年來許多夜市開始面臨挑戰。", "sa": "【S】many night markets 【V】have begun 【O】to face challenges<br>📌 however 插入句中表轉折；begin to V"}, {"en": "Younger generations increasingly prefer the convenience of online shopping and food delivery apps, which has led to a gradual decline in the number of customers visiting traditional night markets.", "zh": "年輕世代越來越偏好網購和外送 App 的便利，導致到傳統夜市消費的顧客人數逐漸減少。", "sa": "【S】Younger generations 【V】prefer 【O】the convenience of… 【M】which has led to…<br>📌 which 指前面整件事；lead to（導致）；the number of + 複數名詞"}, {"en": "To attract visitors again, some night markets have started to modernize.", "zh": "為了再次吸引遊客，有些夜市開始走向現代化。", "sa": "【M】To attract visitors again 【S】some night markets 【V】have started 【O】to modernize<br>📌 不定詞放句首表目的"}, {"en": "Mobile payment systems have been introduced so customers no longer need to carry cash.", "zh": "夜市引進了行動支付系統，顧客不再需要帶現金。", "sa": "【S】Mobile payment systems 【V】have been introduced 【M】so customers no longer need to carry cash<br>📌 現在完成式被動；so（所以）；no longer（不再）"}, {"en": "Several markets have also created social media accounts to promote popular stalls and special events, drawing in tourists who discover them online.", "zh": "有幾個夜市也開設了社群媒體帳號，宣傳人氣攤位和特別活動，吸引在網路上發現它們的觀光客前來。", "sa": "【S】Several markets 【V】have created 【O】social media accounts 【M】to promote… 【M】drawing in tourists…<br>📌 分詞構句表結果；draw in（吸引）；who 修飾 tourists"}, {"en": "A few markets have even added designated seating areas and improved lighting to make the shopping experience more comfortable.", "zh": "少數夜市甚至增設了指定用餐座位區並改善照明，讓逛街的體驗更舒適。", "sa": "【S】A few markets 【V】have added 【O】designated seating areas and improved lighting 【M】to make…<br>📌 make + O + adj.（使…更舒適）"}, {"en": "Despite these changes, vendors say that the heart of the night market remains the same: fresh, affordable food and a lively atmosphere that cannot be fully replicated online.", "zh": "儘管有這些改變，攤商們說夜市的核心始終沒變：新鮮又實惠的食物，以及網路上無法完全複製的熱鬧氣氛。", "sa": "【M】Despite these changes 【S】vendors 【V】say 【O】that the heart… remains the same<br>📌 despite + N（儘管）；remain + C；冒號後補充說明 the same"}, {"en": "Many believe that as long as night markets continue to adapt without losing this unique character, they will remain a beloved part of Taiwanese culture for generations to come.", "zh": "許多人相信，只要夜市持續調整、又不失去這份獨特的特色，未來好幾個世代它都會是台灣文化中深受喜愛的一部分。", "sa": "【S】Many 【V】believe 【O】that… they will remain a beloved part…<br>📌 as long as（只要）；without + V-ing；for generations to come（未來世世代代）"}], "36": [{"en": "Have you ever felt more creative after taking a walk or a shower?", "zh": "你是否曾在散步或洗澡之後覺得自己更有創意？", "sa": "Have 【S】you 【M】ever 【V】felt 【C】more creative 【M】after taking a walk or a shower?<br>📌 現在完成式問經驗 Have you ever + p.p.？；after + V-ing"}, {"en": "Many people report that their best ideas come to them during these seemingly unproductive moments.", "zh": "許多人表示，他們最好的點子都是在這些看似沒有生產力的時刻冒出來的。", "sa": "【S】Many people 【V】report 【O】that their best ideas come to them…<br>📌 idea comes to sb（某人想到點子）；seemingly（看似）修飾形容詞"}, {"en": "Researchers have studied this phenomenon and found that it is closely related to how our brains work.", "zh": "研究人員研究了這個現象，發現它和我們大腦的運作方式密切相關。", "sa": "【S】Researchers 【V】have studied 【O】this phenomenon and (have) found 【O】that…<br>📌 be related to（與…有關）；how our brains work 為名詞子句"}, {"en": "When we are focused on a difficult task, our brain's \"executive control\" network is highly active, helping us concentrate and filter out distractions.", "zh": "當我們專注於困難的任務時，大腦的「執行控制」網路會高度活躍，幫助我們集中注意力、過濾掉干擾。", "sa": "【M】When… 【S】our brain's \"executive control\" network 【V】is 【C】highly active 【M】helping us concentrate…<br>📌 help + O + 原形動詞；filter out（過濾掉）"}, {"en": "However, this focused state can sometimes prevent us from making unusual connections between ideas.", "zh": "然而，這種專注的狀態有時會讓我們無法在想法之間建立不尋常的連結。", "sa": "【S】this focused state 【V】can prevent 【O】us 【M】from making unusual connections…<br>📌 prevent + O + from + V-ing（阻止某人做…）"}, {"en": "In contrast, when we engage in simple, automatic activities — such as walking, showering, or doing the dishes — the brain's \"default mode\" network becomes more active.", "zh": "相對地，當我們從事簡單、不用想就能做的活動，例如走路、洗澡或洗碗時，大腦的「預設模式」網路就會變得比較活躍。", "sa": "【M】when we engage in… 【S】the brain's \"default mode\" network 【V】becomes 【C】more active<br>📌 in contrast（相對地）；engage in（從事）；破折號插入舉例"}, {"en": "This network is associated with daydreaming, mind-wandering, and the kind of loose, flexible thinking that often leads to creative insights.", "zh": "這個網路和做白日夢、思緒漫遊，以及那種常常帶來創意靈感的鬆散、靈活的思考有關。", "sa": "【S】This network 【V】is associated with 【O】daydreaming, mind-wandering, and the kind of… thinking<br>📌 be associated with（與…有關）；that 引導關係子句修飾 thinking"}, {"en": "Interestingly, the activity needs to be simple enough that it doesn't require much conscious attention, but not so passive that we fall asleep or lose focus entirely.", "zh": "有趣的是，這種活動必須簡單到不太需要刻意專注，但又不能被動到讓我們睡著或完全失去專注。", "sa": "【S】the activity 【V】needs to be 【C】simple enough that… but not so passive that…<br>📌 adj. + enough（夠…）；so + adj. + that（如此…以至於）"}, {"en": "This is why activities like walking tend to be more effective for boosting creativity than, say, watching an intense action movie, which demands a lot of attention.", "zh": "這就是為什麼像走路這類活動，比起像是看一部需要高度專注的緊張動作片，更能有效提升創造力。", "sa": "【S】This 【V】is 【C】why activities like walking tend to be more effective…<br>📌 This is why…（這就是為什麼…）；tend to V（往往）；say 插入表「例如」"}, {"en": "So the next time you're stuck on a problem, stepping away for a walk might not be a waste of time — it could be exactly what your brain needs to find a solution.", "zh": "所以下次你被問題卡住時，離開一下去散個步也許不是浪費時間——那可能正是你的大腦找到解答所需要的。", "sa": "【S】stepping away for a walk 【V】might not be 【C】a waste of time<br>📌 動名詞片語當主詞；the next time + 子句（下次…時）；what 引導名詞子句"}], "39": [{"en": "When Maria Sato took over her family's small print shop in a quiet neighborhood, most people assumed the business wouldn't survive much longer.", "zh": "當 Maria Sato 接手家裡位於安靜社區的小印刷店時，大多數人都認為這家店撐不了多久。", "sa": "【M】When… 【S】most people 【V】assumed 【O】(that) the business wouldn't survive much longer<br>📌 take over（接手）；would 表過去的未來"}, {"en": "Large chain stores offered cheaper printing, and fewer people needed physical documents printed at all.", "zh": "大型連鎖店提供更便宜的印刷，而且需要印紙本文件的人也越來越少。", "sa": "【S】Large chain stores 【V】offered 【O】cheaper printing，and 【S】fewer people 【V】needed 【O】physical documents 【C】printed<br>📌 need + O + p.p.（需要某物被…）"}, {"en": "But instead of closing the shop, Maria decided to transform it.", "zh": "但 Maria 沒有把店收掉，而是決定讓它轉型。", "sa": "【M】instead of closing the shop 【S】Maria 【V】decided 【O】to transform it<br>📌 instead of + V-ing（不…而是…）"}, {"en": "She began by researching what her neighborhood actually needed.", "zh": "她先從研究社區真正需要什麼開始著手。", "sa": "【S】She 【V】began 【M】by researching what her neighborhood actually needed<br>📌 by + V-ing（藉由…）；what 引導名詞子句"}, {"en": "After talking to local artists, students, and small business owners, she realized there was demand for high-quality custom printing — things like art prints, posters, business cards with unique designs, and small batches of zines (self-published magazines).", "zh": "在和當地藝術家、學生及小店老闆聊過之後，她發現大家需要高品質的客製化印刷，像是藝術版畫、海報、設計獨特的名片，以及少量印製的獨立刊物（自費出版的雜誌）。", "sa": "【M】After talking to… 【S】she 【V】realized 【O】(that) there was demand for…<br>📌 there is demand for（對…有需求）；破折號後舉例說明"}, {"en": "Maria invested in better printing equipment and began offering workshops on design software for beginners.", "zh": "Maria 投資了更好的印刷設備，並開始開設給初學者的設計軟體工作坊。", "sa": "【S】Maria 【V】invested in 【O】better printing equipment and 【V】began 【O】offering workshops…<br>📌 invest in（投資）；begin + V-ing"}, {"en": "Word spread quickly.", "zh": "消息很快就傳開了。", "sa": "【S】Word 【V】spread 【M】quickly<br>📌 word（不可數）在此指「消息、口碑」"}, {"en": "Local art students started bringing their projects to her shop instead of ordering online, both because of the quality and because Maria could offer advice on design choices.", "zh": "當地的美術系學生開始把作品帶到她店裡，而不是在網路上下單，一方面是因為品質好，一方面是因為 Maria 能針對設計提供建議。", "sa": "【S】Local art students 【V】started 【O】bringing their projects to her shop 【M】instead of ordering online<br>📌 both because of + N and because + 子句（一方面…一方面…）"}, {"en": "Small business owners appreciated being able to see and approve samples in person before a full print run.", "zh": "小店老闆們很喜歡能在正式大量印刷前，親自看過並確認樣品。", "sa": "【S】Small business owners 【V】appreciated 【O】being able to see and approve samples 【M】in person<br>📌 appreciate + V-ing（感謝、重視…）；in person（親自）"}, {"en": "The shop also became a meeting place, with a small corner where customers could sit, chat, and look through sample books.", "zh": "這家店也成了大家聚會的地方，店裡有個小角落讓顧客可以坐下來聊天、翻翻樣品冊。", "sa": "【S】The shop 【V】became 【C】a meeting place 【M】with a small corner where…<br>📌 where 引導關係子句修飾 corner；look through（瀏覽、翻閱）"}, {"en": "Three years later, the shop is busier than ever, and Maria has hired two part-time employees to help keep up with demand.", "zh": "三年後，這家店比以往任何時候都忙，Maria 還雇了兩名兼職員工幫忙應付需求。", "sa": "【S】the shop 【V】is 【C】busier than ever，and 【S】Maria 【V】has hired 【O】two part-time employees<br>📌 比較級 + than ever；keep up with（跟上）"}, {"en": "\"I didn't try to compete with the big chains on price,\" she explains.", "zh": "「我沒有試著在價格上和大型連鎖店競爭，」她解釋道。", "sa": "【S】I 【V】didn't try 【O】to compete with the big chains on price<br>📌 compete with A on B（在 B 方面和 A 競爭）"}, {"en": "\"I focused on what they couldn't offer — personal service, quality, and a sense of community.\"", "zh": "「我專注在他們給不了的東西——個人化的服務、品質，以及社區歸屬感。」", "sa": "【S】I 【V】focused on 【O】what they couldn't offer<br>📌 what 引導名詞子句（＝ the things that）；a sense of community（社區歸屬感）"}]};

["我今天早上把它賣給同學了。", "輪胎沒氣了，所以我在這裡修。", "我其實不太喜歡騎腳踏車了。", "媽媽叫我把它牽進來的。"]}, {"n": 14, "p": 1, "stem": "Anna: Are you free this Saturday? A few of us are going hiking.<br>Ben: _____<br>Anna: No worries. Maybe next time then.", "o": ["Sure, what time should I meet you?", "I'd love to, but I already promised to help my uncle move.", "Hiking is my favorite weekend activity.", "I just bought new hiking boots."], "a": 1, "exp": "✓ (B) I'd love to, but I already promised to help my uncle move.— Anna 回應「沒關係，下次再約」，顯示 Ben 婉拒了邀約。\n❌ (A) 答應赴約並問時間，與「下次再約」矛盾。\n❌ (C) 說登山是最愛的活動，未回應是否能赴約。\n❌ (D) 提到剛買登山鞋，與「下次再約」不連貫。", "zh": "Anna：你這週六有空嗎？我們幾個人要去健行。<br>Ben：我很想去，但我已經答應要幫叔叔搬家了。<br>Anna：沒關係，那就下次吧。", "sa": "正解句：【S】I 【V】'd love to (go)，but 【S】I 【M】already 【V】promised 【O】to help my uncle move<br>📌 句型：I'd love to, but…（委婉拒絕的慣用語）；promise to V；help + O + 原形動詞（help my uncle move）", "on": ["答應赴約並問時間，與「下次再約」矛盾。", "Anna 回應「沒關係，下次再約」，顯示 Ben 婉拒了邀約。", "說登山是最愛的活動，未回應是否能赴約。", "提到剛買登山鞋，與「下次再約」不連貫。"], "oz": ["好啊，我們要幾點碰面？", "我很想去，但我已經答應要幫叔叔搬家了。", "健行是我最喜歡的週末活動。", "我剛買了新的登山鞋。"]}, {"n": 15, "p": 1, "stem": "Receptionist: Good afternoon. Do you have an appointment?<br>Visitor: _____<br>Receptionist: Let me check... Yes, here it is. Please take a seat; Dr. Lin will see you shortly.", "o": ["No, I'm just here to drop off a package.", "Yes, at three o'clock with Dr. Lin.", "I'm afraid I'm in the wrong building.", "Could you recommend a good restaurant nearby?"], "a": 1, "exp": "✓ (B) Yes, at three o'clock with Dr. Lin.— 櫃檯回應「我查一下…有的，請坐」，表示訪客確認有預約。\n❌ (A) 說只是來放包裹，與「請坐，醫生稍後會見你」不符。\n❌ (C) 說來錯大樓，與後句矛盾。\n❌ (D) 問餐廳推薦，與情境無關。", "zh": "接待員：午安，請問您有預約嗎？<br>訪客：有，三點跟林醫師約的。<br>接待員：我查一下……有，在這裡。請先坐一下，林醫師很快就會幫您看診。", "sa": "正解句：Yes, (I have an appointment) at three o'clock with Dr. Lin.（省略與問句重複的部分）<br>關鍵句：【S】Dr. Lin 【V】will see 【O】you 【M】shortly<br>📌 句型：have an appointment with + 人（和某人有約）；shortly ＝ soon（很快）", "on": ["說只是來放包裹，與「請坐，醫生稍後會見你」不符。", "櫃檯回應「我查一下…有的，請坐」，表示訪客確認有預約。", "說來錯大樓，與後句矛盾。", "問餐廳推薦，與情境無關。"], "oz": ["沒有，我只是來送包裹的。", "有，三點和林醫師約的。", "恐怕我走錯大樓了。", "你可以推薦附近好吃的餐廳嗎？"]}, {"n": 16, "p": 1, "stem": "Teacher: Your essay was well organized, but the conclusion felt a bit weak.<br>Student: _____<br>Teacher: That sounds like a good plan. I'll look forward to the revised version.", "o": ["I'm glad you liked the whole essay.", "I'll add a stronger summary and revise it before Friday.", "I don't think the conclusion is important at all.", "Could you write the conclusion for me?"], "a": 1, "exp": "✓ (B) I'll add a stronger summary and revise it before Friday.— 老師回應「聽起來是個好計畫，期待修訂版」，呼應學生提出的修改計畫。\n❌ (A) 說很高興老師喜歡整篇文章，與「結論較弱」的批評不符。\n❌ (C) 說結論不重要，與情境態度不符。\n❌ (D) 要求老師代寫結論，不合理。", "zh": "老師：你的文章組織得很好，但結論感覺有點薄弱。<br>學生：我會加上更有力的總結，並在星期五前修改好。<br>老師：聽起來是個好計畫，我很期待看到修改後的版本。", "sa": "正解句：【S】I 【V】'll add 【O】a stronger summary and 【V】revise 【O】it 【M】before Friday<br>關鍵句：I'll look forward to the revised version.<br>📌 句型：look forward to + 名詞／V-ing（期待…，to 是介系詞）；feel + adj.（the conclusion felt weak）", "on": ["說很高興老師喜歡整篇文章，與「結論較弱」的批評不符。", "老師回應「聽起來是個好計畫，期待修訂版」，呼應學生提出的修改計畫。", "說結論不重要，與情境態度不符。", "要求老師代寫結論，不合理。"], "oz": ["很高興您喜歡整篇文章。", "我會加一段更有力的總結，並在星期五前修改好。", "我認為結論一點也不重要。", "您可以幫我寫結論嗎？"]}, {"n": 17, "p": 1, "stem": "Passenger: Excuse me, does this train stop at Central Station?<br>Staff: _____<br>Passenger: Oh no, I got on the wrong train then. What should I do?<br>Staff: Don't worry, just get off at the next stop and take the train back two stops.", "o": ["Yes, it's the third stop from here.", "No, this train goes directly to the airport without stopping there.", "Central Station is very crowded today.", "The train will arrive in five minutes."], "a": 1, "exp": "✓ (B) No, this train goes directly to the airport without stopping there.— 乘客接著說「搭錯車了」，表示站務員的回答是否定的。\n❌ (A) 回答「是的，第三站」，與乘客「搭錯車」的反應矛盾。\n❌ (C) 說中央車站很擁擠，未回答是否停靠。\n❌ (D) 說火車五分鐘後到，未回答是否停靠該站。", "zh": "乘客：不好意思，請問這班火車有停中央車站嗎？<br>站務員：沒有，這班車直達機場，中間不停那一站。<br>乘客：糟了，那我搭錯車了。我該怎麼辦？<br>站務員：別擔心，在下一站下車，再搭回頭的車坐兩站就到了。", "sa": "正解句：No，【S】this train 【V】goes 【M】directly to the airport 【M】without stopping there<br>關鍵句：just get off at the next stop and take the train back two stops.（祈使句，兩個原形動詞對等）<br>📌 句型：without + V-ing（沒有…）；get off（下車）", "on": ["回答「是的，第三站」，與乘客「搭錯車」的反應矛盾。", "乘客接著說「搭錯車了」，表示站務員的回答是否定的。", "說中央車站很擁擠，未回答是否停靠。", "說火車五分鐘後到，未回答是否停靠該站。"], "oz": ["有，從這裡算起第三站。", "沒有，這班車直達機場，不停那一站。", "中央車站今天人很多。", "火車五分鐘後到站。"]}, {"n": 18, "p": 1, "stem": "Coworker A: Did you finish the report I sent you for feedback?<br>Coworker B: _____<br>Coworker A: No problem, take your time. Just let me know by tomorrow morning.", "o": ["Yes, I think it's perfect as it is.", "Not yet, but I'll finish reading it tonight and send you my comments.", "I already submitted it to the manager.", "I deleted the file by mistake."], "a": 1, "exp": "✓ (B) Not yet, but I'll finish reading it tonight and send you my comments.— 對方回應「沒問題，明天早上前告知即可」，呼應尚未完成但會盡快處理。\n❌ (A) 說報告很完美，與「明天早上前」的時間安排不符。\n❌ (C) 說已交給主管，與請對方提供意見的情境矛盾。\n❌ (D) 說檔案被刪除，與後句的寬容回應不連貫。", "zh": "同事 A：我寄給你、請你給意見的報告，你看完了嗎？<br>同事 B：還沒，但我今晚會看完，再把意見寄給你。<br>同事 A：沒問題，慢慢來。明天早上之前告訴我就好。", "sa": "正解句：Not yet, but 【S】I 【V】'll finish 【O】reading it 【M】tonight and 【V】send 【O】you my comments<br>關鍵句：Just let me know by tomorrow morning.<br>📌 句型：finish + V-ing（完成…）；send + 人 + 物；let + O + 原形動詞；by 表期限（在…之前）", "on": ["說報告很完美，與「明天早上前」的時間安排不符。", "對方回應「沒問題，明天早上前告知即可」，呼應尚未完成但會盡快處理。", "說已交給主管，與請對方提供意見的情境矛盾。", "說檔案被刪除，與後句的寬容回應不連貫。"], "oz": ["有，我覺得這樣就很完美了。", "還沒，但我今晚會讀完，再把意見寄給你。", "我已經交給經理了。", "我不小心把檔案刪掉了。"]}, {"n": 19, "p": 1, "stem": "Mom: How was your first day at the new school?<br>Daughter: _____<br>Mom: That's wonderful! I'm glad you're settling in so quickly.", "o": ["Honestly, I cried the whole day and made no friends.", "It went better than I expected. I already made a few friends.", "I think I want to go back to my old school.", "The teachers forgot to give us our schedules."], "a": 1, "exp": "✓ (B) It went better than I expected. I already made a few friends.— 媽媽回應「太好了，很高興你這麼快適應」，呼應女兒正面的描述。\n❌ (A) 說哭了一整天且沒朋友，與媽媽正面回應矛盾。\n❌ (C) 說想回舊學校，與「適應得很快」矛盾。\n❌ (D) 抱怨老師忘記發課表，與媽媽的回應不符。", "zh": "媽媽：你在新學校的第一天過得怎麼樣？<br>女兒：比我想像的好，我已經交到幾個朋友了。<br>媽媽：太好了！很高興你這麼快就適應了。", "sa": "正解句：【S】It 【V】went 【C】better than I expected. 【S】I 【M】already 【V】made 【O】a few friends.<br>📌 句型：比較級 + than + 子句（better than I expected）；settle in（安頓下來、適應新環境）", "on": ["說哭了一整天且沒朋友，與媽媽正面回應矛盾。", "媽媽回應「太好了，很高興你這麼快適應」，呼應女兒正面的描述。", "說想回舊學校，與「適應得很快」矛盾。", "抱怨老師忘記發課表，與媽媽的回應不符。"], "oz": ["老實說，我哭了一整天，一個朋友也沒交到。", "比我預期的好。我已經交到幾個朋友了。", "我想我想回原來的學校。", "老師忘了發課表給我們。"]}, {"n": 20, "p": 1, "stem": "Tourist: Excuse me, how do I get to the night market from here?<br>Local: _____<br>Tourist: Thanks! And about how long will it take on foot?<br>Local: Around fifteen minutes, maybe less if you walk fast.", "o": ["I'm sorry, I'm not from around here either.", "Just go straight down this street and turn left at the second light.", "The night market is closed on Mondays.", "You should take a taxi; it's too far to walk."], "a": 1, "exp": "✓ (B) Just go straight down this street and turn left at the second light.— 提供路線指引，且遊客接著詢問步行時間，符合邏輯。\n❌ (A) 說自己也不是當地人，與後面提供步行時間的回答矛盾。\n❌ (C) 說夜市星期一不開，未回答如何前往。\n❌ (D) 建議搭計程車，與後句問「走路要多久」不符。", "zh": "遊客：不好意思，請問從這裡到夜市要怎麼走？<br>當地人：沿著這條街直走，到第二個紅綠燈左轉。<br>遊客：謝謝！那走路大概要多久？<br>當地人：大約十五分鐘，走快一點可能更短。", "sa": "正解句（祈使句）：【V】Just go 【M】straight down this street and 【V】turn 【M】left at the second light<br>關鍵句：about how long will it take on foot?<br>📌 句型：祈使句報路（go straight／turn left）；How long will it take…?（要花多久時間）；on foot（步行）", "on": ["說自己也不是當地人，與後面提供步行時間的回答矛盾。", "提供路線指引，且遊客接著詢問步行時間，符合邏輯。", "說夜市星期一不開，未回答如何前往。", "建議搭計程車，與後句問「走路要多久」不符。"], "oz": ["抱歉，我也不是本地人。", "沿著這條街直走，在第二個紅綠燈左轉。", "夜市星期一休息。", "你應該搭計程車，走路太遠了。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["empty", "full", "open", "clean"], "a": 1, "exp": "✓ (B) full（滿的）— 感測器監測垂圾桶是否「快滿了」，才會發送訊號，語意通順。\n❌ (A) empty = 空的，與「發送訊號通知收運」邏輯相反。\n❌ (C) open = 打開的，不適用。\n❌ (D) clean = 乾淨的，不適用。", "zh": "<i>When a bin is almost <b>full<\/b>, it sends a signal to the city's waste management system, allowing collection trucks to be sent only when necessary.<\/i><br>當垃圾桶快滿的時候，它會發送訊號給市政府的廢棄物管理系統，讓垃圾車只在必要時才出動。", "sa": "【M】When a bin is almost full（時間副詞子句）<br>【S】it 【V】sends 【O】a signal 【M】to the city's waste management system<br>【M】allowing collection trucks to be sent only when necessary（分詞構句表結果）<br>📌 句型：be 動詞 + almost + adj.；allow + O + to V", "on": ["空的，與「發送訊號通知收運」邏輯相反。", "感測器監測垂圾桶是否「快滿了」，才會發送訊號，語意通順。", "打開的，不適用。", "乾淨的，不適用。"], "oz": ["空的", "滿的", "打開的；開放的", "乾淨的"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["necessary", "impossible", "forbidden", "optional"], "a": 0, "exp": "✓ (A) necessary（必要的）— 只有在「必要時」才派出收運車，符合「減少不必要的出車」語意。\n❌ (B) impossible = 不可能的，語意不符。\n❌ (C) forbidden = 被禁止的，語意不符。\n❌ (D) optional = 可選擇的，與系統設計目的不符。", "zh": "<i>When a bin is almost full, it sends a signal to the city's waste management system, allowing collection trucks to be sent only when <b>necessary<\/b>.<\/i><br>當垃圾桶快滿的時候，它會發送訊號給市政府的廢棄物管理系統，讓垃圾車只在必要時才出動。", "sa": "【S】it 【V】sends 【O】a signal…，【M】allowing collection trucks to be sent only when necessary<br>📌 句型：only when necessary ＝ only when (it is) necessary（副詞子句省略主詞和 be 動詞）<br>allow + O + to be p.p.（讓某物被…，被動不定詞）", "on": ["只有在「必要時」才派出收運車，符合「減少不必要的出車」語意。", "不可能的，語意不符。", "被禁止的，語意不符。", "可選擇的，與系統設計目的不符。"], "oz": ["必要的；需要的", "不可能的", "被禁止的", "可選擇的；非必要的"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["allow", "allowed", "allowing", "to allow"], "a": 2, "exp": "✓ (C) allowing（現在分詞，引導分詞構句）— 「..., allowing them to compress trash automatically」為分詞構句，修飾前面整句的結果。\n❌ (A) allow = 動詞原形，文法上前面需連接詞或主詞才能單獨使用。\n❌ (B) allowed = 過去式/過去分詞，文法不符分詞構句的主動語意。\n❌ (D) to allow = 不定詞，語意上不如分詞構句自然。", "zh": "<i>In addition, some smart bins are equipped with solar panels, <b>allowing<\/b> them to compress trash automatically and hold up to five times more waste than traditional bins.<\/i><br>此外，有些智慧垃圾桶裝有太陽能板，讓它們能自動壓縮垃圾，最多可容納傳統垃圾桶五倍的垃圾量。", "sa": "【S】some smart bins 【V】are equipped with 【O】solar panels<br>【M】allowing them to compress… and hold…（分詞構句，主動語意用 V-ing，表結果）<br>📌 句型：be equipped with（配備有…）；倍數 + more + N + than（比…多幾倍）", 要他改時間。"]}, {"n": 32, "p": 3, "stem": "What will Jenny do next?", "o": ["Cancel the table reservation.", "Arrive at the café before 6.", "Inform the café about the new time.", "Ask Mark to arrive earlier."], "a": 2, "exp": "Jenny 最後說：「I'll let the café know about the later time and the extra guest.」（我會通知咖啡廳新的時間與多一位客人）。\n(C) Inform the café about the new time. ✓ 為正解。\n❌ (A) 對話中沒有要取消預約。\n❌ (B) Jenny 並未說會提早到。\n❌ (D) 是 Jenny 通知咖啡廳，並非請 Mark 提早到。", "zh": "題目：Jenny 接下來會做什麼？<br>(A) 取消訂位。<br>(B) 6 點前抵達咖啡廳。<br>(C) 通知咖啡廳新的時間。<br>(D) 請 Mark 早點到。", "sa": "依據：【S】I 【V】'll let 【O】the café 【C】know about the later time and the extra guest.<br>📌 句型：let + O + 原形動詞（let… know 讓…知道）；Got it.（我知道了）", "on": ["對話中沒有要取消預約。", "Jenny 並未說會提早到。", "Jenny 最後說：「I'll let the café know about the later time and the extra guest.」（我會通知咖啡廳新的時間與多一位客人）。 ✓ 為正解。", "是 Jenny 通知咖啡廳，並非請 Mark 提早到。"], "oz": ["取消訂位。", "6 點前抵達咖啡廳。", "通知咖啡廳新的時間。", "請 Mark 早點到。"]}, {"n": 33, "p": 3, "stem": "According to the passage, why have fewer people been visiting night markets recently?", "o": ["Night markets have raised their prices significantly.", "Many young people prefer online shopping and delivery apps.", "Most night markets have been closed by the government.", "The food quality at night markets has gotten worse."], "a": 1, "exp": "文中提到：「Younger generations increasingly prefer the convenience of online shopping and food delivery apps, which has led to a gradual decline in the number of customers...」\n(B) Many young people prefer online shopping and delivery apps. ✓ 為正解。\n❌ (A) 文中未提到夜市大幅漲價。\n❌ (C) 文中未提到政府關閉夜市。\n❌ (D) 文中未提到食物品質變差，反而強調食物新鮮。", "zh": "題目：根據本文，為什麼最近去夜市的人變少了？<br>(A) 夜市大幅漲價。<br>(B) 許多年輕人偏好網購和外送 App。<br>(C) 大部分夜市都被政府關閉了。<br>(D) 夜市的食物品質變差了。", "sa": "依據：【S】Younger generations 【M】increasingly 【V】prefer 【O】the convenience of online shopping and food delivery apps，<br>【M】which has led to a gradual decline in the number of customers…（which 指前面整件事）<br>📌 句型：lead to + N（導致…）；the number of + 複數名詞（…的數量）", "on": ["文中未提到夜市大幅漲價。" efault mode network，進而激發創意」。 ✓ 為正解。", "文中反而說動作電影需要太多專注力，不利於激發創意。", "文中說 default mode network 與發白日夢有關，而非 executive control network 阻止發白日夢。"], "oz": ["為什麼人們在工作上應該避開困難的任務", "簡單的活動如何幫助大腦產生創意", "為什麼看動作片能提升專注力", "大腦的執行控制網路如何防止人做白日夢"]}, {"n": 37, "p": 3, "stem": "According to the passage, what happens when the brain's \"default mode\" network is active?", "o": ["We become highly focused on a single task.", "We are more likely to fall asleep immediately.", "Our minds wander in ways that can lead to creative ideas.", "We filter out all distractions completely."], "a": 2, "exp": "文中提到：「This network is associated with daydreaming, mind-wandering, and the kind of loose, flexible thinking that often leads to creative insights.」\n(C) Our minds wander in ways that can lead to creative ideas. ✓ 為正解。\n❌ (A) 高度專注是 executive control network 啟動時的狀態，非 default mode network。\n❌ (B) 文中並未說會立刻入睡。\n❌ (D) 過濾所有干擾是專注狀態的描述，非 default mode network。", "zh": "題目：根據本文，大腦的「預設模式」網路活躍時會發生什麼事？<br>(A) 我們會高度專注在單一任務上。<br>(B) 我們比較容易馬上睡著。<br>(C) 我們的思緒會四處遊走，而可能因此產生創意。<br>(D) 我們會完全過濾掉所有干擾。", "sa": "題目：【S】what 【V】happens 【M】when the brain's \"default mode\" network is active?<br>依據：This network is associated with daydreaming, mind-wandering, and the kind of loose, flexible thinking that often leads to creative insights.<br>📌 句型：關係代名詞 that 引導子句修飾 thinking；lead to（導致、帶來）", "on": ["高度專注是 executive control network 啟動時的狀態，非 default mode network。", "文中並未說會立刻入睡。", "文中提到：「This network is associated with daydreaming, mind-wandering, and the kind of loose, flexible thinking that often leads to creative insights.」 ✓ 為正解。", "過濾所有干擾是專注狀態的描述，非 default mode network。"], "oz": ["我們會高度專注在單一任務上。", "我們比較容易馬上睡著。", "我們的思緒會四處遊走，而可能因此產生創意。", "我們會完全過濾掉所有干擾。"]}, {"n": 38, "p": 3, "stem": "Why might watching an intense action movie NOT help boost creativity?", "o": ["It requires too much conscious attention.", "It is too simple to engage the brain at all.", "It activates the executive control network too little.", "It always makes people f const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();

  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});

});</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>

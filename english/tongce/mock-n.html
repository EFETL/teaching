<title>統測英文模擬考卷 N</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i]; if(!t) return ''; return '<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; }
function rvExp(q){ return '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nThe idea of remote work is not new, but it was the global pandemic that turned it from a rare perk into a mainstream practice. Many companies that had long resisted the idea found <span class=\"blk\">21</span> compelled to adopt it almost overnight, only to discover that productivity had not declined as sharply <span class=\"blk\">22</span> managers had feared. <span class=\"blk\">23</span>, the arrangement has its drawbacks: employees often struggle to separate work from private life, and there is growing concern that teams <span class=\"blk\">24</span> members rarely meet in person may find it hard to build trust.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nCoral reefs, <span class=\"blk\">25</span> cover less than one percent of the ocean floor, support roughly a quarter of all marine species. Rising sea temperatures force corals to expel the algae living in their tissues, leaving them white and vulnerable. Bleached corals can recover <span class=\"blk\">26</span> the water cools quickly enough, but prolonged heat usually proves fatal. Conservationists argue that, <span class=\"blk\">27</span> the damage already done, protecting the remaining reefs should be a global priority. Only by cutting emissions drastically <span class=\"blk\">28</span> hope to preserve them.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice to Library Patrons</b><br><br>Beginning March 3, the Main Library will extend its weekday hours until midnight during the exam period, but the Rare Books Room will continue to close at 6 p.m. Owing to renovation work, group study rooms on the second floor will be unavailable until further notice; students may instead reserve rooms on the third floor through the library website, up to 48 hours in advance. Reservations not claimed within 15 minutes of the start time will be released to walk-in users. Food is not permitted anywhere in the building, though covered beverages are allowed.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Nina: Did you manage to get the concert tickets?<br>Owen: I tried, but they were sold out by the time I logged in.<br>Nina: Ugh. Maybe we can check resale sites?<br>Owen: Prices there are triple the original. My cousin works at the venue, though. He said they sometimes release a few seats the day before.<br>Nina: Worth a shot. Can you ask him?<br>Owen: Already did. He'll text me on Thursday if anything opens up.<br>Nina: Fingers crossed, then.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nConventional economic wisdom holds that more choices make consumers happier, since a wider selection increases the likelihood of finding an option that suits individual tastes. Yet psychologist Barry Schwartz challenges this assumption. In a well-known experiment, shoppers who encountered 24 varieties of jam were more likely to stop and sample, but those who faced only six were roughly ten times more likely to actually buy a jar. Schwartz argues that an excess of options leads to \"decision fatigue\" and heightens the fear of missing out on a better alternative, so that even a satisfying purchase leaves buyers feeling uneasy. Critics note, however, that results have been inconsistent across studies, suggesting that the effect depends on factors such as the shopper's expertise and whether the options are easy to compare.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nCities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt and rooftops absorb solar radiation during the day and release it slowly at night, while the scarcity of vegetation reduces the cooling that would otherwise result from evaporation. Heat produced by vehicles and air conditioners compounds the problem. Beyond discomfort, the effect raises energy demand and can aggravate health risks for the elderly. Planners have responded with a range of measures: reflective \"cool roofs,\" parks and street trees, and green roofs planted with vegetation. Studies show that cool roofs can lower indoor temperatures significantly, yet in cold climates they may increase winter heating costs, which illustrates that no single solution suits every city.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Maria opened her bakery in a quiet neighborhood, she assumed that the quality of her bread would speak for itself. Months later, however, sales remained flat, and she was on the verge of closing. A regular customer casually mentioned that most people nearby commuted early and passed the shop before it opened at 8 a.m. Maria initially dismissed the remark, convinced that early hours would not justify the cost of extra labor. After a sleepless week of running the numbers, she opened at 5:30 a.m. on a trial basis, and a morning rush of commuters materialized almost immediately. Encouraged, she began offering pre-orders through a messaging app, which not only smoothed out the crowds but also reduced waste, since she could bake according to demand. Three years on, she employs six people, yet she still credits that offhand comment from a customer, rather than any marketing campaign, with saving her business.</div>"};
const PTR = {"21": [{"en": "The idea of remote work is not new, but it was the global pandemic that turned it from a rare perk into a mainstream practice.", "zh": "遠距工作的概念並不新，但正是全球疫情把它從罕見的福利變成主流的做法。", "sa": "【S】The idea of remote work 【V】is 【C】not new, but it was the global pandemic that turned it...<br>📌 強調句 It was + 強調部分 + that...；turn A from B into C。"}, {"en": "Many companies that had long resisted the idea found <b>themselves<\/b> compelled to adopt it almost overnight, only to discover that productivity had not declined as sharply <b>as<\/b> managers had feared.", "zh": "許多長期抗拒這個想法的公司，發現自己幾乎在一夕之間被迫採用，結果卻發現生產力並沒有像主管們擔心的那樣大幅下滑。", "sa": "【S】Many companies (that...) 【V】found 【O】themselves 【C】compelled to adopt it, only to discover...<br>📌 find oneself + p.p.；only to V 表意外結果；not as...as。"}, {"en": "<b>Even so<\/b>, the arrangement has its drawbacks: employees often struggle to separate work from private life, and there is growing concern that teams <b>whose<\/b> members rarely meet in person may find it hard to build trust.", "zh": "即使如此，這種安排仍有缺點：員工常常很難把工作和私生活分開，而且越來越多人擔心，成員很少見面的團隊可能難以建立互信。", "sa": "【S】the arrangement 【V】has 【O】its drawbacks；冒號後補充兩個缺點。<br>📌 Even so 轉折；whose + 名詞 所有格關係代名詞；find it hard to V。"}], "25": [{"en": "Coral reefs, <b>which<\/b> cover less than one percent of the ocean floor, support roughly a quarter of all marine species.", "zh": "珊瑚礁覆蓋的面積不到海床的百分之一，卻支撐了大約四分之一的海洋物種。", "sa": "【S】Coral reefs 【V】support 【O】roughly a quarter of all marine species.<br>📌 非限定關係子句 , which..., 插入主詞與動詞之間。"}, {"en": "Rising sea temperatures force corals to expel the algae living in their tissues, leaving them white and vulnerable.", "zh": "海水溫度上升迫使珊瑚排出住在其組織內的藻類，使它們變白而且脆弱。", "sa": "【S】Rising sea temperatures 【V】force 【O】corals 【C】to expel the algae..., leaving them white and vulnerable.<br>📌 force + O + to V；現在分詞 living 修飾 algae；leave + O + adj. 表結果。"}, {"en": "Bleached corals can recover <b>provided<\/b> the water cools quickly enough, but prolonged heat usually proves fatal.", "zh": "只要海水降溫得夠快，白化的珊瑚就能恢復，但長時間的高溫通常是致命的。", "sa": "【S】Bleached corals 【V】can recover + provided 條件子句, but 【S】prolonged heat 【V】proves 【C】fatal.<br>📌 provided (that)「只要」；prove + adj.。"}, {"en": "Conservationists argue that, <b>given<\/b> the damage already done, protecting the remaining reefs should be a global priority.", "zh": "保育人士主張，考慮到已經造成的損害，保護僅存的珊瑚礁應成為全球優先要務。", "sa": "【S】Conservationists 【V】argue 【O】that... protecting the remaining reefs should be a global priority.<br>📌 given + N「考慮到」；動名詞片語作主詞。"}, {"en": "Only by cutting emissions drastically <b>can we<\/b> hope to preserve them.", "zh": "唯有大幅削減排放量，我們才有希望保住它們。", "sa": "【M】Only by cutting emissions drastically 【V】can 【S】we 【V】hope 【O】to preserve them.<br>📌 Only + 副詞片語置首，主句倒裝。"}], "29": [{"en": "Notice to Library Patrons", "zh": "圖書館讀者公告", "sa": "標題：名詞片語；patron「讀者、顧客」。"}, {"en": "Beginning March 3, the Main Library will extend its weekday hours until midnight during the exam period, but the Rare Books Room will continue to close at 6 p.m.", "zh": "自 3 月 3 日起，總館在考試期間的平日開放時間將延長至午夜，但善本書室仍於下午 6 點關閉。", "sa": "【S】the Main Library 【V】will extend 【O】its weekday hours..., but 【S】the Rare Books Room 【V】will continue 【O】to close at 6 p.m.<br>📌 Beginning + 日期「自……起」；continue to V。"}, {"en": "Owing to renovation work, group study rooms on the second floor will be unavailable until further notice; students may instead reserve rooms on the third floor through the library website, up to 48 hours in advance.", "zh": "由於整修工程，二樓的團體研討室在另行通知前暫停使用；學生可改透過圖書館網站預約三樓的研討室，最早可提前 48 小時預約。", "sa": "【S】group study rooms 【V】will be 【C】unavailable...; 【S】students 【V】may reserve 【O】rooms...<br>📌 Owing to + N「由於」；until further notice「直到另行通知」；in advance「事先」。"}, {"en": "Reservations not claimed within 15 minutes of the start time will be released to walk-in users.", "zh": "在開始時間後 15 分鐘內未報到的預約，將釋出給現場使用者。", "sa": "【S】Reservations 【M】not claimed within 15 minutes... 【V】will be released 【M】to walk-in users.<br>📌 過去分詞片語修飾主詞；未來被動 will be p.p.。"}, {"en": "Food is not permitted anywhere in the building, though covered beverages are allowed.", "zh": "館內任何地方都禁止飲食，不過有蓋的飲料可以攜帶。", "sa": "【S】Food 【V】is not permitted 【M】anywhere in the building, though 【S】covered beverages 【V】are allowed.<br>📌 被動式 be permitted / be allowed；though 讓步「不過」。"}], "31": [{"en": "Text Messages", "zh": "簡訊", "sa": "標題：名詞片語。"}, {"en": "Nina: Did you manage to get the concert tickets?", "zh": "Nina：你有買到演唱會的票嗎？", "sa": "Did 【S】you 【V】manage 【O】to get the concert tickets?<br>📌 manage to V「設法做到……」。"}, {"en": "Owen: I tried, but they were sold out by the time I logged in.", "zh": "Owen：我試過了，但等我登入時已經賣完了。", "sa": "【S】they 【V】were 【C】sold out 【M】by the time I logged in.<br>📌 by the time + 子句「到……的時候」。"}, {"en": "Nina: Ugh. Maybe we can check resale sites?", "zh": "Nina：唉。也許我們可以看看轉售網站？", "sa": "【S】we 【V】can check 【O】resale sites?<br>📌 直述句加問號表詢問建議。"}, {"en": "Owen: Prices there are triple the original.", "zh": "Owen：那裡的價格是原價的三倍。", "sa": "【S】Prices there 【V】are 【C】triple the original.<br>📌 倍數 + the + N「是……的幾倍」。"}, {"en": "My cousin works at the venue, though.", "zh": "不過我表哥在那個場館工作。", "sa": "【S】My cousin 【V】works 【M】at the venue, though.<br>📌 though 放句尾作副詞「不過」。"}, {"en": "He said they sometimes release a few seats the day before.", "zh": "他說他們有時會在前一天釋出幾個座位。", "sa": "【S】He 【V】said 【O】(that) they sometimes release a few seats the day before.<br>📌 the day before「前一天」。"}, {"en": "Nina: Worth a shot. Can you ask him?", "zh": "Nina：值得一試。你可以問問他嗎？", "sa": "(It's) Worth a shot.（省略主詞動詞）／Can 【S】you 【V】ask 【O】him?<br>📌 be worth a shot「值得一試」。"}, {"en": "Owen: Already did. He'll text me on Thursday if anything opens up.", "zh": "Owen：已經問了。如果有空位出來，他星期四會傳訊息給我。", "sa": "【S】He 【V】'll text 【O】me 【M】on Thursday + if 條件子句。<br>📌 條件句主句用 will，if 子句用現在式；open up「空出來」。"}, {"en": "Nina: Fingers crossed, then.", "zh": "Nina：那就祈禱好運囉。", "sa": "慣用語，省略主詞動詞。<br>📌 Fingers crossed.「祝好運、祈禱順利」。"}], "33": [{"en": "Conventional economic wisdom holds that more choices make consumers happier, since a wider selection increases the likelihood of finding an option that suits individual tastes.", "zh": "傳統經濟學的看法認為，選擇越多會讓消費者越快樂，因為更多樣的選擇會提高找到符合個人喜好之選項的可能性。", "sa": "【S】Conventional economic wisdom 【V】holds 【O】that more choices make consumers happier, since...<br>📌 make + O + C（形容詞比較級）；since 表原因；that 關係子句修飾 option。"}, {"en": "Yet psychologist Barry Schwartz challenges this assumption.", "zh": "然而，心理學家 Barry Schwartz 挑戰了這個假設。", "sa": "【S】psychologist Barry Schwartz 【V】challenges 【O】this assumption.<br>📌 Yet 置句首表轉折。"}, {"en": "In a well-known experiment, shoppers who encountered 24 varieties of jam were more likely to stop and sample, but those who faced only six were roughly ten times more likely to actually buy a jar.", "zh": "在一項著名的實驗中，看到 24 種果醬的購物者比較可能停下來試吃，但只看到 6 種的人實際買一罐的可能性大約高出十倍。", "sa": "【S】shoppers (who...) 【V】were 【C】more likely to stop and sample, but 【S】those (who...) 【V】were 【C】ten times more likely to buy...<br>📌 be likely to V；倍數 + 比較級；those who...。"}, {"en": "Schwartz argues that an excess of options leads to \"decision fatigue\" and heightens the fear of missing out on a better alternative, so that even a satisfying purchase leaves buyers feeling uneasy.", "zh": "Schwartz 主張，過多的選項會導致「決策疲勞」，並加深錯過更好選擇的恐懼，以致於即使是令人滿意的購買，也讓買家感到不安。", "sa": "【S】Schwartz 【V】argues 【O】that an excess of options leads to... and heightens...<br>📌 lead to「導致」；so that 表結果；leave + O + V-ing。"}, {"en": "Critics note, however, that results have been inconsistent across studies, suggesting that the effect depends on factors such as the shopper's expertise and whether the options are easy to compare.", "zh": "然而，批評者指出，各項研究的結果並不一致，這顯示該效應取決於購物者的專業程度，以及選項是否容易比較等因素。", "sa": "【S】Critics 【V】note 【O】that results have been inconsistent..., suggesting that...<br>📌 分詞構句表推論；depend on；whether 名詞子句作介系詞受詞。"}], "36": [{"en": "Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect.", "zh": "城市常常比周圍的鄉村高出好幾度，這種現象稱為都市熱島效應。", "sa": "【S】Cities 【V】are 【C】several degrees warmer than the surrounding countryside, a phenomenon known as...<br>📌 同位語 a phenomenon... 補充說明整句；known as「被稱為」。"}, {"en": "Dark surfaces such as asphalt and rooftops absorb solar radiation during the day and release it slowly at night, while the scarcity of vegetation reduces the cooling that would otherwise result from evaporation.", "zh": "柏油和屋頂等深色表面白天吸收太陽輻射，夜間再緩慢釋放；同時植物稀少也減少了原本可由蒸發帶來的降溫效果。", "sa": "【S】Dark surfaces 【V】absorb... and 【V】release..., while 【S】the scarcity of vegetation 【V】reduces 【O】the cooling...<br>📌 while 表對照；would otherwise「否則本來會」；result from「起因於」。"}, {"en": "Heat produced by vehicles and air conditioners compounds the problem.", "zh": "車輛和冷氣機產生的熱讓問題更加嚴重。", "sa": "【S】Heat 【M】produced by vehicles and air conditioners 【V】compounds 【O】the problem.<br>📌 過去分詞片語修飾主詞；compound「使惡化」。"}, {"en": "Beyond discomfort, the effect raises energy demand and can aggravate health risks for the elderly.", "zh": "除了讓人不舒服之外，這種效應還會提高能源需求，並可能加重長者的健康風險。", "sa": "【S】the effect 【V】raises 【O】energy demand and 【V】can aggravate 【O】health risks.<br>📌 Beyond + N「除了……之外」；the + adj. = 複數名詞（the elderly 年長者）。"}, {"en": "Planners have responded with a range of measures: reflective \"cool roofs,\" parks and street trees, and green roofs planted with vegetation.", "zh": "都市規劃者採取了一系列措施來因應：反光的「冷屋頂」、公園與行道樹，以及種植植物的綠屋頂。", "sa": "【S】Planners 【V】have responded 【M】with a range of measures；冒號後條列措施。<br>📌 a range of「一系列的」；planted with 過去分詞片語修飾 green roofs。"}, {"en": "Studies show that cool roofs can lower indoor temperatures significantly, yet in cold climates they may increase winter heating costs, which illustrates that no single solution suits every city.", "zh": "研究顯示，冷屋頂能大幅降低室內溫度，但在寒冷氣候中可能增加冬季的暖氣費用，這說明了沒有單一解方適合每座城市。", "sa": "【S】Studies 【V】show 【O】that cool roofs can lower..., yet... they may increase..., which illustrates...<br>📌 yet 轉折；which 非限定子句指前面整件事。"}], "39": [{"en": "When Maria opened her bakery in a quiet neighborhood, she assumed that the quality of her bread would speak for itself.", "zh": "當 Maria 在一個安靜的社區開麵包店時，她以為麵包的品質自然會說明一切。", "sa": "【M】When Maria opened her bakery..., 【S】she 【V】assumed 【O】that the quality of her bread would speak for itself.<br>📌 speak for itself「不言自明」；would 表過去的未來。"}, {"en": "Months later, however, sales remained flat, and she was on the verge of closing.", "zh": "然而幾個月後，銷售仍停滯不前，她瀕臨關店。", "sa": "【S】sales 【V】remained 【C】flat, and 【S】she 【V】was 【M】on the verge of closing.<br>📌 remain + adj.；on the verge of + V-ing「瀕臨……」。"}, {"en": "A regular customer casually mentioned that most people nearby commuted early and passed the shop before it opened at 8 a.m.", "zh": "一位常客隨口提到，附近大多數人很早就去通勤，在店早上 8 點開門前就經過了。", "sa": "【S】A regular customer 【V】mentioned 【O】that most people nearby commuted early and passed the shop before...<br>📌 that 子句作受詞，子句內兩個並列動詞。"}, {"en": "Maria initially dismissed the remark, convinced that early hours would not justify the cost of extra labor.", "zh": "Maria 起初不把這句話當一回事，她深信提早營業不值得額外的人力成本。", "sa": "【S】Maria 【V】dismissed 【O】the remark, (being) convinced that...<br>📌 分詞構句說明原因；justify the cost「值得那個成本」。"}, {"en": "After a sleepless week of running the numbers, she opened at 5:30 a.m. on a trial basis, and a morning rush of commuters materialized almost immediately.", "zh": "經過一週失眠地反覆計算之後，她試著在早上 5 點半開門，結果早晨的通勤人潮幾乎立刻就出現了。", "sa": "【S】she 【V】opened 【M】at 5:30 a.m. on a trial basis, and 【S】a morning rush of commuters 【V】materialized.<br>📌 run the numbers「計算數字」；on a trial basis「試行」。"}, {"en": "Encouraged, she began offering pre-orders through a messaging app, which not only smoothed out the crowds but also reduced waste, since she could bake according to demand.", "zh": "受到鼓舞後，她開始透過通訊軟體接受預購，這不僅分散了人潮，也減少了浪費，因為她可以依需求來烘焙。", "sa": "【M】Encouraged, 【S】she 【V】began 【O】offering pre-orders..., which not only... but also...<br>📌 過去分詞 Encouraged 表被動原因；not only A but also B。"}, {"en": "Three years on, she employs six people, yet she still credits that offhand comment from a customer, rather than any marketing campaign, with saving her business.", "zh": "三年過去，她雇用了六名員工，但她仍把挽救生意歸功於那位顧客的隨口一句話，而不是任何行銷活動。", "sa": "【S】she 【V】employs 【O】six people, yet 【S】she 【V】credits 【O】that offhand comment... with saving her business.<br>📌 credit A with B「把 B 歸功於 A」；A rather than B。"}]};
const Q = [{"n": 1, "p": 0, "stem": "The government introduced stricter regulations to _____ the spread of misinformation online.", "o": ["amplify", "endorse", "curb", "summon"], "a": 2, "exp": "(C) curb（抑制） ✓ \"curb the spread of\" 為常見搭配，表示「抑制、遏止」。\n❌ (A) amplify：放大，與立法目的相反\n❌ (B) endorse：背書、認可，語意不合\n❌ (D) summon：傳喚、召集，不接 spread", "zh": "政府推出更嚴格的法規，以遏止網路上錯誤訊息的散播。", "sa": "【S】The government 【V】introduced 【O】stricter regulations 【M】to curb the spread of misinformation online.<br>📌 句型：不定詞 to V 表目的；curb the spread of + N「遏止……的散播」。<br>例：We must curb the spread of the virus.", "oz": ["放大；增強", "背書；支持", "抑制；控制", "召喚；傳喚"]}, {"n": 2, "p": 0, "stem": "Despite her _____ schedule, Dr. Lin always found time to mentor her graduate students.", "o": ["hectic", "tentative", "fragile", "vacant"], "a": 0, "exp": "(A) hectic（忙亂的） ✓ \"hectic schedule\" 為「忙得不可開交的行程」，與 Despite 形成讓步對比。\n❌ (B) tentative：暫定的，不能與 found time 形成對比\n❌ (C) fragile：易碎的，不修飾 schedule\n❌ (D) vacant：空著的，與 Despite 的轉折語意相反", "zh": "儘管行程忙得不可開交，林博士總是能抽出時間指導她的研究生。", "sa": "【M】Despite her hectic schedule, 【S】Dr. Lin 【M】always 【V】found 【O】time 【M】to mentor her graduate students.<br>📌 句型：Despite + 名詞片語「儘管……」（不可接子句）。<br>find time to V「抽出時間做……」。", "oz": ["忙亂的", "暫定的；試探性的", "易碎的；脆弱的", "空著的"]}, {"n": 3, "p": 0, "stem": "The company's decision to lay off hundreds of workers drew widespread _____ from labor unions.", "o": ["compensation", "cooperation", "consideration", "condemnation"], "a": 3, "exp": "(D) condemnation（譴責） ✓ \"draw condemnation from\" 表「招致……的譴責」，裁員引來工會批評。\n❌ (A) compensation：補償，工會不會因裁員「給予補償」\n❌ (B) cooperation：合作，語意與裁員後的反應不符\n❌ (C) consideration：考量，不帶批評意味", "zh": "公司裁撤數百名員工的決定，招致工會廣泛的譴責。", "sa": "【S】The company's decision to lay off hundreds of workers 【V】drew 【O】widespread condemnation 【M】from labor unions.<br>📌 句型：decision to V「做……的決定」，不定詞修飾 decision。<br>draw condemnation / criticism from「招致……的譴責／批評」。", "oz": ["補償；賠償金", "合作", "考慮；體貼", "譴責"]}, {"n": 4, "p": 0, "stem": "The witness's account was _____ with the security footage, which proved that he was telling the truth.", "o": ["contrary", "consistent", "concerned", "confused"], "a": 1, "exp": "(B) consistent（一致的） ✓ \"be consistent with\" 表「與……一致」，證詞與監視器畫面相符才能證明他說實話。\n❌ (A) contrary：需搭配 to，且語意相反\n❌ (C) concerned：關心的，語意不通\n❌ (D) confused：困惑的，不接 with 表一致", "zh": "證人的陳述與監視器畫面一致，證明了他說的是實話。", "sa": "【S】The witness's account 【V】was 【C】consistent with the security footage, 【M】which proved that he was telling the truth.<br>📌 句型：be consistent with「與……一致」。<br>逗號 + which 非限定關係子句，指前面整件事。", "oz": ["相反的", "一致的；始終如一的", "擔心的；有關的", "困惑的"]}, {"n": 5, "p": 0, "stem": "The scientist's findings were so _____ that they forced the entire field to reconsider long-held assumptions.", "o": ["predictable", "groundbreaking", "trivial", "redundant"], "a": 1, "exp": "(B) groundbreaking（開創性的） ✓ so...that 結構：成果「開創性」，才會迫使整個領域重新檢討舊有假設。\n❌ (A) predictable：可預料的，不會迫使重新檢討\n❌ (C) trivial：瑣碎的，結果與結構不符\n❌ (D) redundant：多餘的，語意不通", "zh": "這位科學家的研究成果極具開創性，迫使整個領域重新思考長久以來的假設。", "sa": "【S】The scientist's findings 【V】were 【C】so groundbreaking that they forced the entire field to reconsider long-held assumptions.<br>📌 句型：so + adj. + that 子句「如此……以致於」。<br>force + O + to V「迫使……去做」。", "oz": ["可預測的", "開創性的；突破性的", "瑣碎的", "多餘的"]}, {"n": 6, "p": 0, "stem": "Employees who _____ company policies may face disciplinary action, including termination.", "o": ["violate", "validate", "venture", "vacate"], "a": 0, "exp": "(A) violate（違反） ✓ \"violate policies\" 違反規定，才會面臨懲處甚至解僱。\n❌ (B) validate：驗證、使有效，不會招致懲處\n❌ (C) venture：冒險，不及物或接 into\n❌ (D) vacate：騰出、搬離，不接 policies", "zh": "違反公司規定的員工可能會面臨懲處，包括被解僱。", "sa": "【S】Employees 【M】who violate company policies 【V】may face 【O】disciplinary action, 【M】including termination.<br>📌 句型：關係代名詞 who 引導形容詞子句修飾 Employees，主要動詞是 may face。<br>including + N「包括……」。", "oz": ["違反", "證實；使有效", "冒險；冒險進入", "空出；搬離"]}, {"n": 7, "p": 0, "stem": "The mayor's remarks were deliberately _____, allowing him to avoid committing himself to any specific policy.", "o": ["explicit", "abrupt", "ambiguous", "adequate"], "a": 2, "exp": "(C) ambiguous（模稜兩可的） ✓ 刻意說得「模稜兩可」，才能避免承諾具體政策。\n❌ (A) explicit：明確的，會造成明確承諾，與句意相反\n❌ (B) abrupt：突然的，無法達到避免承諾的效果\n❌ (D) adequate：足夠的，語意不通", "zh": "市長的發言刻意說得模稜兩可，讓他得以避免對任何具體政策做出承諾。", "sa": "【S】The mayor's remarks 【V】were 【M】deliberately 【C】ambiguous, 【M】allowing him to avoid committing himself to any specific policy.<br>📌 句型：分詞構句 allowing... 表結果；allow + O + to V。<br>avoid + V-ing；commit oneself to「承諾、致力於」。", "oz": ["明確的", "突然的", "模稜兩可的", "足夠的"]}, {"n": 8, "p": 0, "stem": "Years of overfishing have _____ fish populations in the region to dangerously low levels.", "o": ["deployed", "deprived", "deposited", "depleted"], "a": 3, "exp": "(D) depleted（耗盡、大幅減少） ✓ \"deplete A to low levels\" 表使資源減少到很低的程度。\n❌ (A) deployed：部署，不接魚群\n❌ (B) deprived：需用 deprive A of B，此處結構不合\n❌ (C) deposited：存放，語意不通", "zh": "多年來的過度捕撈，已使該地區的魚群數量減少到危險的低點。", "sa": "【S】Years of overfishing 【V】have depleted 【O】fish populations in the region 【M】to dangerously low levels.<br>📌 句型：現在完成式 have + p.p. 表示持續到現在的影響。<br>deplete + O + to + 程度「使……減少到……」。", "oz": ["部署；配置", "被剝奪的", "存放；存入", "耗盡的"]}, {"n": 9, "p": 0, "stem": "The board met the manager's proposal with considerable <i>skepticism<\/i>.", "o": ["enthusiasm", "doubt", "relief", "hostility"], "a": 1, "exp": "(B) doubt（懷疑） ✓ *skepticism* 意為「懷疑、質疑」，與 doubt 同義。\n❌ (A) enthusiasm：熱情，意思相反\n❌ (C) relief：寬慰，語意不符\n❌ (D) hostility：敵意，程度與語意過強且不同", "zh": "董事會以相當大的懷疑態度看待經理的提案。", "sa": "【S】The board 【V】met 【O】the manager's proposal 【M】with considerable skepticism.<br>📌 句型：meet + O + with + 態度「以……態度回應某事」。<br>skepticism = doubt「懷疑」。", "oz": ["熱忱", "懷疑", "放心；解脫", "敵意"]}, {"n": 10, "p": 0, "stem": "The CEO attempted to <i>mitigate<\/i> the damage caused by the scandal.", "o": ["conceal", "exaggerate", "lessen", "assess"], "a": 2, "exp": "(C) lessen（減輕） ✓ *mitigate* 意為「減輕、緩和」，與 lessen 同義。\n❌ (A) conceal：隱瞞，並非減輕損害\n❌ (B) exaggerate：誇大，意思相反\n❌ (D) assess：評估，語意不同", "zh": "執行長試圖減輕醜聞所造成的損害。", "sa": "【S】The CEO 【V】attempted 【O】to mitigate the damage 【M】caused by the scandal.<br>📌 句型：attempt to V「試圖……」；過去分詞片語 caused by... 修飾 damage（= which was caused by）。<br>mitigate = lessen「減輕」。", "oz": ["隱藏", "誇大", "減輕", "評估"]}, {"n": 11, "p": 1, "stem": "Customer: I was charged twice for the same order.<br>Agent: _____<br>Customer: Then I'll expect the refund within the week.", "o": ["Our records show you only ordered once, so there is nothing to refund.", "I apologize. The duplicate charge will be reversed within five business days.", "You'll need to speak to your bank, since we can't see payment data.", "Unfortunately, refunds are only processed after thirty days."], "a": 1, "exp": "(B) I apologize. The duplicate charge will be reversed within five business days. ✓ 客服承諾五個工作日內退款，顧客才會說「那我期待一週內收到退款」。\n❌ (A) Our records show you only ordered once, so there is nothing to refund.：否認重複扣款，顧客不會再提退款\n❌ (C) You'll need to speak to your bank, since we can't see payment data.：推給銀行，顧客不會預期一週內退款\n❌ (D) Unfortunately, refunds are only processed after thirty days.：三十天與顧客「一週內」的期待矛盾", "zh": "顧客：同一筆訂單我被扣了兩次款。<br>客服人員：<b>非常抱歉。重複的扣款將在五個工作天內退還。<\/b><br>顧客：那我就等著這週內收到退款。", "sa": "【S】I 【V】apologize. 【S】The duplicate charge 【V】will be reversed 【M】within five business days.<br>📌 句型：未來被動式 will be + p.p.；within + 時間「在……之內」。<br>be charged twice「被扣款兩次」（被動）。", "oz": ["我們的紀錄顯示您只訂了一次，所以沒有要退的款。", "很抱歉。重複扣的款項會在五個工作天內退回。", "您得去問您的銀行，因為我們看不到付款資料。", "很遺憾，退款只在三十天後才會處理。"]}, {"n": 12, "p": 1, "stem": "A: Do you mind if I open the window?<br>B: _____<br>A: Oh, then I'll just turn on the fan.", "o": ["Actually, I'd rather you didn't. I'm just getting over a cold.", "Not at all, go right ahead.", "Yes, I'd be glad to open it for you.", "I don't mind either way, so it's up to you."], "a": 0, "exp": "(A) Actually, I'd rather you didn't. I'm just getting over a cold. ✓ B 婉拒開窗，A 才改說「那我開電扇就好」。\n❌ (B) Not at all, go right ahead.：等於同意，A 無須改開電扇\n❌ (C) Yes, I'd be glad to open it for you.：同意開窗，與 A 的回應矛盾\n❌ (D) I don't mind either way, so it's up to you.：無所謂，A 不會改變做法", "zh": "A：你介意我開窗嗎？<br>B：<b>其實我希望你不要開。我感冒才剛好。<\/b><br>A：喔，那我開電風扇就好。", "sa": "【S】I 【V】'd rather 【O】you didn't (open it). 【S】I 【V】'm just getting over 【O】a cold.<br>📌 句型：would rather + S + 過去式「寧願某人……」（表現在的期望）。<br>Do you mind if...? 回答「不介意」要說 No / Not at all；get over「從（疾病）恢復」。", "oz": ["其實我寧願你不要開。我感冒才剛好。", "一點也不介意，請便。", "好的，我很樂意幫你打開。", "我都可以，由你決定。"]}, {"n": 13, "p": 1, "stem": "Interviewer: What would you say is your greatest weakness?<br>Candidate: _____<br>Interviewer: That's a refreshingly honest answer.", "o": ["I don't really have any weaknesses.", "I'm never late and always meet my deadlines.", "I tend to take on too much because I find it hard to say no to colleagues.", "I would prefer not to discuss that."], "a": 2, "exp": "(C) I tend to take on too much because I find it hard to say no to colleagues. ✓ 具體承認缺點，面試官才會稱讚「坦率」。\n❌ (A) I don't really have any weaknesses.：否認缺點，不會被稱為坦率\n❌ (B) I'm never late and always meet my deadlines.：這是優點，並未回答缺點\n❌ (D) I would prefer not to discuss that.：迴避問題，不算坦率", "zh": "面試官：你認為自己最大的缺點是什麼？<br>應徵者：<b>我常常攬下太多工作，因為我很難拒絕同事。<\/b><br>面試官：這是個難得坦率的回答。", "sa": "【S】I 【V】tend 【O】to take on too much 【M】because I find it hard to say no to colleagues.<br>📌 句型：tend to V「往往會……」；take on「承擔」。<br>find + it（虛受詞）+ adj. + to V「覺得做……很……」。", "oz": ["我其實沒有什麼缺點。", "我從不遲到，而且總是能趕上期限。", "我常常攬太多工作，因為我很難拒絕同事。", "我不想談這個。"]}, {"n": 14, "p": 1, "stem": "A: I heard the project deadline got pushed back again.<br>B: _____<br>A: Tell me about it. I've already rescheduled two client meetings.", "o": ["Great, now we can finally relax for a while.", "I didn't even know the project had started.", "Good news travels fast around here.", "That's the third time this month. It's throwing everything off."], "a": 3, "exp": "(D) That's the third time this month. It's throwing everything off. ✓ B 抱怨延期造成混亂，A 以 Tell me about it（我懂）附和。\n❌ (A) Great, now we can finally relax for a while.：正面反應，A 不會用 Tell me about it 附和\n❌ (B) I didn't even know the project had started.：與 A 的附和不連貫\n❌ (C) Good news travels fast around here.：延期不是好消息，語意不合", "zh": "A：我聽說專案的截止日又延後了。<br>B：<b>這已經是這個月第三次了。一切都被打亂了。<\/b><br>A：可不是嘛。我已經重新安排了兩場客戶會議。", "sa": "【S】That 【V】's 【C】the third time this month. 【S】It 【V】's throwing 【O】everything 【M】off.<br>📌 句型：throw + O + off「打亂……」；push back「延後」。<br>Tell me about it.「我完全懂／可不是嘛」，表示附和。", "oz": ["太好了，現在我們終於可以放鬆一下了。", "我根本不知道這個專案已經開始了。", "好消息在這裡傳得很快。", "這已經是這個月第三次了。整個進度都被打亂了。"]}, {"n": 15, "p": 1, "stem": "Student: Professor, would it be possible to get an extension on the essay?<br>Professor: _____<br>Student: I understand. I'll hand it in on Friday as planned.", "o": ["I'm afraid I can't make exceptions, since grades are due next week.", "Certainly, take as long as you need.", "Sure, hand it in whenever you like.", "The essay isn't due until next month."], "a": 0, "exp": "(A) I'm afraid I can't make exceptions, since grades are due next week. ✓ 教授拒絕延期，學生才說「我了解，照原定星期五交」。\n❌ (B) Certainly, take as long as you need.：同意延期，學生不會照原訂時間交\n❌ (C) Sure, hand it in whenever you like.：同意延期，與學生回應矛盾\n❌ (D) The essay isn't due until next month.：與學生「星期五交」矛盾", "zh": "學生：教授，請問報告有可能延期繳交嗎？<br>教授：<b>恐怕我不能破例，因為成績下週就要交了。<\/b><br>學生：我了解。我會按原定計畫在星期五交。", "sa": "【S】I 【V】'm afraid 【S】I 【V】can't make 【O】exceptions, 【M】since grades are due next week.<br>📌 句型：I'm afraid (that)...「恐怕……」委婉拒絕；since 表原因「既然、因為」。<br>be due「到期、該交」；make an exception「破例」。", "oz": ["恐怕我不能破例，因為成績下週就要交了。", "當然，你需要多久都可以。", "好啊，你想什麼時候交都行。", "這篇作文下個月才要交。"]}, {"n": 16, "p": 1, "stem": "A: How did the negotiation go?<br>B: _____<br>A: Well, a compromise is better than nothing.", "o": ["They accepted every one of our demands.", "We walked out after five minutes.", "Neither side got everything it wanted, but we reached a deal.", "It hasn't started yet."], "a": 2, "exp": "(C) Neither side got everything it wanted, but we reached a deal. ✓ 雙方各讓步而達成協議，A 才會說「妥協總比沒有好」。\n❌ (A) They accepted every one of our demands.：全盤接受，無需談「妥協」\n❌ (B) We walked out after five minutes.：談判破裂，不會有妥協\n❌ (D) It hasn't started yet.：尚未開始，無從評論結果", "zh": "A：談判進行得怎麼樣？<br>B：<b>雙方都沒有得到想要的全部，但我們達成了協議。<\/b><br>A：嗯，有妥協總比什麼都沒有好。", "sa": "【S】Neither side 【V】got 【O】everything it wanted, but 【S】we 【V】reached 【O】a deal.<br>📌 句型：Neither + 單數名詞「兩者都不……」，代名詞用 it。<br>reach a deal「達成協議」；A is better than nothing「有總比沒有好」。", "oz": ["他們接受了我們所有的要求。", "我們五分鐘後就離席了。", "雙方都沒有得到想要的全部，但我們達成了協議。", "它還沒開始。"]}, {"n": 17, "p": 1, "stem": "Customer: This jacket looks great, but it's a bit out of my budget.<br>Clerk: _____<br>Customer: In that case, I'll wait until then.", "o": ["It goes on sale next Monday, if you can hold off until then.", "It's actually our most affordable item.", "We raised the price just this morning.", "Sorry, we never offer discounts."], "a": 0, "exp": "(A) It goes on sale next Monday, if you can hold off until then. ✓ 店員提出下週一特價，顧客才說「那我等到那時候」。\n❌ (B) It's actually our most affordable item.：與顧客「超出預算」及 until then 不合\n❌ (C) We raised the price just this morning.：漲價不會讓顧客想等\n❌ (D) Sorry, we never offer discounts.：不打折，顧客無從等到 then", "zh": "顧客：這件外套看起來很棒，但有點超出我的預算。<br>店員：<b>如果您能等到下週一，它就會開始特價。<\/b><br>顧客：既然這樣，我就等到那時候。", "sa": "【S】It 【V】goes on sale 【M】next Monday, 【M】if you can hold off until then.<br>📌 句型：現在簡單式表「已排定的未來」（goes on sale next Monday）。<br>hold off「延後、暫緩」；out of one's budget「超出預算」。", "oz": ["如果你能等到下週一，它就會開始特價。", "它其實是我們最便宜的商品。", "我們今天早上才剛漲價。", "抱歉，我們從不打折。"]}, {"n": 18, "p": 1, "stem": "A: I can't believe Mark quit without giving notice.<br>B: _____<br>A: You're right. Maybe there's more to the story.", "o": ["Yes, he certainly deserves a promotion.", "Exactly, he must be a lazy person.", "Obviously, he hated all of us.", "Well, let's not jump to conclusions before we hear his side."], "a": 3, "exp": "(D) Well, let's not jump to conclusions before we hear his side. ✓ B 勸別妄下結論，A 才回「你說得對，也許另有隱情」。\n❌ (A) Yes, he certainly deserves a promotion.：與離職事件無關\n❌ (B) Exactly, he must be a lazy person.：妄下定論，A 不會回「也許另有隱情」\n❌ (C) Obviously, he hated all of us.：同樣武斷，與 A 的回應矛盾", "zh": "A：我真不敢相信 Mark 沒有事先通知就辭職了。<br>B：<b>嗯，在聽到他的說法之前，我們先別妄下結論。<\/b><br>A：你說得對。也許事情另有隱情。", "sa": "Let's not 【V】jump 【M】to conclusions 【M】before we hear his side.<br>📌 句型：Let's not + 原形動詞「我們別……」。<br>jump to conclusions「妄下結論」；there's more to the story「另有隱情」。", "oz": ["是啊，他的確值得升職。", "沒錯，他一定是個懶惰的人。", "顯然他討厭我們所有人。", "嗯，在聽他的說法之前，我們先別急著下結論。"]}, {"n": 19, "p": 1, "stem": "Passenger: Excuse me, does this train stop at Taichung?<br>Attendant: _____<br>Passenger: Then I'd better get off and wait for the next one.", "o": ["Yes, we'll arrive in about ten minutes.", "Not this one. It's an express that runs straight to Kaohsiung.", "It certainly does, so you can stay on board.", "I'm afraid the station is closed today."], "a": 1, "exp": "(B) Not this one. It's an express that runs straight to Kaohsiung. ✓ 此班車不停台中，乘客才決定下車等下一班。\n❌ (A) Yes, we'll arrive in about ten minutes.：會停靠，乘客不必下車\n❌ (C) It certainly does, so you can stay on board.：與乘客「下車等下一班」矛盾\n❌ (D) I'm afraid the station is closed today.：車站關閉與「等下一班」不合", "zh": "乘客：不好意思，這班火車有停台中嗎？<br>站務人員：<b>這班不停。這是直達高雄的快車。<\/b><br>乘客：那我最好下車等下一班。", "sa": "Not this one. 【S】It 【V】's 【C】an express 【M】that runs straight to Kaohsiung.<br>📌 句型：關係代名詞 that 引導形容詞子句修飾 express。<br>had better + 原形動詞「最好……」。", "oz": ["是的，我們大約十分鐘後到。", "這班不停。這是直達高雄的快車。", "當然有停，所以你可以留在車上。", "恐怕車站今天關閉。"]}, {"n": 20, "p": 1, "stem": "A: Would you rather work from home or in the office?<br>B: _____<br>A: I see your point, but I'd miss the face-to-face interaction.", "o": ["Home, definitely. I save two hours of commuting every day.", "The office. I love the face-to-face chats.", "It depends on the weather.", "I haven't decided which restaurant to try."], "a": 0, "exp": "(A) Home, definitely. I save two hours of commuting every day. ✓ B 選擇在家工作並給理由，A 才說「我懂，但我會想念面對面互動」。\n❌ (B) The office. I love the face-to-face chats.：B 選辦公室，A 不會說 but I'd miss\n❌ (C) It depends on the weather.：與工作地點無關\n❌ (D) I haven't decided which restaurant to try.：答非所問", "zh": "A：你比較想在家工作還是在辦公室工作？<br>B：<b>當然是在家。我每天可以省下兩小時的通勤時間。<\/b><br>A：我懂你的意思，但我會懷念面對面的互動。", "sa": "Home, definitely. 【S】I 【V】save 【O】two hours of commuting 【M】every day.<br>📌 句型：Would you rather A or B?「你比較想 A 還是 B？」。<br>I see your point, but...「我懂你的意思，但……」委婉表達不同意見。", "oz": ["當然是在家。我每天省下兩小時通勤時間。", "辦公室。我喜歡面對面聊天。", "看天氣而定。", "我還沒決定要去哪家餐廳。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["themselves", "them", "their", "they"], "a": 0, "exp": "(A) themselves ✓ find oneself + 過去分詞：主詞 companies 為動作者，反身代名詞 themselves 作受詞。\n❌ (B) them：找不到反身結構，且指稱不同對象\n❌ (C) their：所有格後須接名詞\n❌ (D) they：主格不能作 found 的受詞", "zh": "<i>Many companies that had long resisted the idea found <b>themselves<\/b> compelled to adopt it almost overnight, only to discover that productivity had not declined as sharply as managers had feared.<\/i><br>許多長期抗拒這個想法的公司，發現自己幾乎在一夕之間被迫採用，結果卻發現生產力並沒有像主管們擔心的那樣大幅下滑。", "sa": "【S】Many companies 【M】that had long resisted the idea 【V】found 【O】themselves 【C】compelled to adopt it almost overnight, only to discover...<br>📌 句型：find oneself + p.p.「發覺自己（被）……」，主詞與受詞同一人用反身代名詞。<br>only to V「結果卻……」表出乎意料的結果。", "oz": ["他們自己（反身代名詞）", "他們（受格）", "他們的（所有格）", "他們（主格）"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["as", "than", "that", "what"], "a": 0, "exp": "(A) as ✓ as sharply as 為同等比較，後一個 as 引導比較子句。\n❌ (B) than：須與 more/less 搭配\n❌ (C) that：此處不構成比較\n❌ (D) what：不能引導比較子句", "zh": "<i>...only to discover that productivity had not declined as sharply <b>as<\/b> managers had feared.<\/i><br>……結果卻發現生產力並沒有像主管們擔心的那樣大幅下滑。", "sa": "that 子句：【S】productivity 【V】had not declined 【M】as sharply as managers had feared.<br>📌 句型：not as/so + 副詞 + as「不如……那樣……」（同等比較）。<br>過去完成式 had declined / had feared 表示比 discover 更早發生。", "oz": ["像……一樣；如同", "比……（比較級用）", "那個（連接詞／關代）", "……的事物（複合關代）"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["Even so", "Likewise", "As a result", "In addition"], "a": 0, "exp": "(A) Even so ✓ 前文說生產力沒下降（正面），後文說仍有缺點，需讓步轉折。\n❌ (B) Likewise：表相同，語氣不合\n❌ (C) As a result：表因果，前後非因果\n❌ (D) In addition：表補充，但前後方向相反", "zh": "<i><b>Even so<\/b>, the arrangement has its drawbacks: employees often struggle to separate work from private life.<\/i><br>即使如此，這種安排仍有缺點：員工常常很難把工作和私生活分開。", "sa": "【M】Even so, 【S】the arrangement 【V】has 【O】its drawbacks: 【S】employees 【V】struggle 【O】to separate work from private life.<br>📌 句型：Even so「即使如此」轉折副詞，承認前文後再提出相反看法。<br>separate A from B「把 A 與 B 分開」。", "oz": ["即使如此；儘管這樣", "同樣地", "因此；結果", "此外"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["who", "which", "whose", "whom"], "a": 2, "exp": "(C) whose ✓ teams whose members...：所有格關係代名詞，指「團隊的成員」。\n❌ (A) who：主格，後面已有主詞 members\n❌ (B) which：主格/受格，不表所屬\n❌ (D) whom：受格，語意不合", "zh": "<i>...and there is growing concern that teams <b>whose<\/b> members rarely meet in person may find it hard to build trust.<\/i><br>……而且越來越多人擔心，成員很少見面的團隊可能難以建立互信。", "sa": "there is 【S】growing concern 【M】that teams whose members rarely meet in person may find it hard to build trust.<br>📌 句型：所有格關係代名詞 whose + 名詞（teams whose members = 團隊的成員）。<br>concern that 為同位語子句；find it + adj. + to V。", "oz": ["（關代，指人，主格）", "（關代，指物）", "……的（關代所有格）", "（關代，指人，受格）"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["what", "that", "where", "which"], "a": 3, "exp": "(D) which ✓ 非限定用法，逗號後用 which 指 reefs 且作 cover 的主詞。\n❌ (A) what：不能有先行詞\n❌ (B) that：不可用於逗號之後的非限定子句\n❌ (C) where：reefs 非地點，且後面缺主詞", "zh": "<i>Coral reefs, <b>which<\/b> cover less than one percent of the ocean floor, support roughly a quarter of all marine species.<\/i><br>珊瑚礁覆蓋的面積不到海床的百分之一，卻支撐了大約四分之一的海洋物種。", "sa": "【S】Coral reefs, 【M】which cover less than one percent of the ocean floor, 【V】support 【O】roughly a quarter of all marine species.<br>📌 句型：逗號 + which 非限定關係子句（不可用 that），which 作子句主詞。<br>a quarter of「四分之一的」。", "oz": ["……的事物（複合關代）", "（連接詞／關代）", "……的地方（關係副詞）", "（關代，指物）"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["unless", "although", "provided", "whereas"], "a": 2, "exp": "(C) provided ✓ provided (that) = 只要，引導條件：只要水溫迅速下降，珊瑚就能恢復。\n❌ (A) unless：「除非」會使語意相反\n❌ (B) although：讓步，與後句 but 不合\n❌ (D) whereas：對比連接詞，非條件", "zh": "<i>Bleached corals can recover <b>provided<\/b> the water cools quickly enough, but prolonged heat usually proves fatal.<\/i><br>只要海水降溫得夠快，白化的珊瑚就能恢復，但長時間的高溫通常是致命的。", "sa": "【S】Bleached corals 【V】can recover 【M】provided (that) the water cools quickly enough, but 【S】prolonged heat 【V】proves 【C】fatal.<br>📌 句型：provided (that) = if / as long as「只要」，引導條件子句。<br>prove + adj.「結果證明是……」（連綴動詞）。", "oz": ["除非", "雖然", "只要；假如", "然而；反之"]}, {"n": 27, "p": 2, "stem": "(27)", "o": ["given", "giving", "to give", "having given"], "a": 0, "exp": "(A) given ✓ given + 名詞片語 = 「考慮到」，介系詞用法。\n❌ (B) giving：現在分詞語意為主動\n❌ (C) to give：不定詞，文法不合\n❌ (D) having given：主詞 protection 不是給予者", "zh": "<i>Conservationists argue that, <b>given<\/b> the damage already done, protecting the remaining reefs should be a global priority.<\/i><br>保育人士主張，考慮到已經造成的損害，保護僅存的珊瑚礁應成為全球優先要務。", "sa": "【S】Conservationists 【V】argue 【O】that, given the damage already done, 【S】protecting the remaining reefs 【V】should be 【C】a global priority.<br>📌 句型：given + N「考慮到……」（介系詞用法）；動名詞片語作主詞。<br>the damage (which has been) already done：過去分詞修飾名詞。", "oz": ["考慮到；鑑於（過去分詞）", "給（現在分詞）", "去給（不定詞）", "已經給了（完成式分詞）"]}, {"n": 28, "p": 2, "stem": "(28)", "o": ["we can", "can we", "we will", "will be"], "a": 1, "exp": "(B) can we ✓ Only + 副詞片語置句首，主句須倒裝：can we hope。\n❌ (A) we can：未倒裝\n❌ (C) we will：未倒裝\n❌ (D) will be：缺主詞", "zh": "<i>Only by cutting emissions drastically <b>can we<\/b> hope to preserve them.<\/i><br>唯有大幅削減排放量，我們才有希望保住它們。", "sa": "【M】Only by cutting emissions drastically 【V】can 【S】we 【V】hope 【O】to preserve them.<br>📌 句型：Only + 副詞片語置句首，主要子句須倒裝（助動詞 + S + V）。<br>例：Only then did I understand the truth.", "oz": ["我們能（直述句語序）", "我們能……嗎（倒裝語序）", "我們將會", "將會是"]}, {"n": 29, "p": 3, "stem": "Which of the following is true about the extended hours?", "o": ["They apply to every section of the library.", "They will remain in place after the exam period.", "They do not apply to the Rare Books Room.", "They are limited to the third floor."], "a": 2, "exp": "(C) They do not apply to the Rare Books Room. ✓ 公告說 Rare Books Room 仍於下午六點關閉。\n❌ (A) They apply to every section of the library.：Rare Books Room 例外\n❌ (B) They will remain in place after the exam period.：僅限考試期間\n❌ (D) They are limited to the third floor.：公告說的是 Main Library，並非只限三樓", "zh": "題目：關於延長的開放時間，下列何者正確？<br>(A) 適用於圖書館的每一個區域。<br>(B) 考試期間結束後仍會維持。<br>(C) 不適用於善本書室。<br>(D) 僅限於三樓。", "sa": "題目：Which of the following 【V】is 【C】true about the extended hours?<br>依據：the Main Library will extend its weekday hours until midnight..., but 【S】the Rare Books Room 【V】will continue 【O】to close at 6 p.m.<br>📌 句型：continue to V「繼續……」；but 表對比，指出例外。", "oz": ["適用於圖書館的每一個區域。", "考試期間結束後仍會維持。", "不適用於善本書室。", "僅限於三樓。"]}, {"n": 30, "p": 3, "stem": "What might happen if a student arrives 20 minutes late for a reserved room?", "o": ["The reservation will be extended by 20 minutes.", "The room may be given to someone without a reservation.", "The student will be fined.", "The student must rebook 48 hours in advance."], "a": 1, "exp": "(B) The room may be given to someone without a reservation. ✓ 逾時 15 分鐘未到，預約會釋出給現場使用者。\n❌ (A) The reservation will be extended by 20 minutes.：公告未提延長\n❌ (C) The student will be fined.：公告未提罰款\n❌ (D) The student must rebook 48 hours in advance.：公告未要求重新預約", "zh": "題目：如果學生預約了研討室卻遲到 20 分鐘，可能會發生什麼事？<br>(A) 預約時間會延長 20 分鐘。<br>(B) 研討室可能會讓給沒有預約的人。<br>(C) 學生會被罰款。<br>(D) 學生必須提前 48 小時重新預約。", "sa": "題目：What 【V】might happen 【M】if a student arrives 20 minutes late for a reserved room?<br>依據：【S】Reservations 【M】not claimed within 15 minutes of the start time 【V】will be released 【M】to walk-in users.<br>📌 句型：過去分詞片語 not claimed... 修飾 Reservations；未來被動 will be released。", "oz": ["預約時間會延長 20 分鐘。", "研討室可能會讓給沒有預約的人。", "學生會被罰款。", "學生必須提前 48 小時重新預約。"]}, {"n": 31, "p": 3, "stem": "What does Owen imply about the resale sites?", "o": ["Their prices are unreasonably high.", "They only sell tickets for other events.", "They are run by his cousin.", "They usually have many seats available."], "a": 0, "exp": "(A) Their prices are unreasonably high. ✓ Owen 說價格是原價的三倍，暗示太貴。\n❌ /* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){
if(window.AK)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});
return secs;
});</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

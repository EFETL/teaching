<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統測英文模擬考卷 I</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>統測英文　<span style="opacity:.9">模擬考卷 I</span></h1>
    <p>科技校院四年制與專科學校二年制統一入學測驗　共同科目：英文（模擬）</p>
    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 42</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 I　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nBefore the invention of electric lighting, city streets at night were often dark and dangerous. Residents who needed to go out after dark usually <span class=\"blk\">21</span> their own lanterns for light. In the 19th century, gas lamps began <span class=\"blk\">22</span> along major streets, which allowed people to walk safely after dark for the first time. This change not only improved safety but also extended the hours during which people could shop, work, and socialize, <span class=\"blk\">23</span> led to a noticeable shift in city life. By the early 20th century, electric streetlights had largely replaced gas lamps, a development that was widely <span class=\"blk\">24</span> as a major step forward in urban life.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nLearning a second language offers benefits that go well beyond being able to communicate with more people. Research has shown that bilingual individuals often perform better on tasks <span class=\"blk\">25</span> require switching attention between different activities, possibly because managing two languages trains the brain to handle competing information. In addition, studies suggest that people who speak more than one language may be <span class=\"blk\">26</span> likely to develop certain age-related memory problems later in life, although researchers caution that more studies are needed before drawing firm conclusions. <span class=\"blk\">27</span> these potential benefits, learning a new language requires significant time and effort, and many adult learners give up before reaching fluency. Nevertheless, experts agree that even basic knowledge of another language can <span class=\"blk\">28</span> to a deeper understanding of different cultures.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Gym Notice</b><br><br>The swimming pool will be closed for maintenance from Monday to Wednesday this week. During this time, members can use the indoor pool at our sister location on Park Avenue free of charge by showing their membership card. All other gym facilities, including the weight room and group fitness classes, will operate as usual. We apologize for any inconvenience.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Ben: Don't forget, Sarah's surprise party is this Saturday at 6 PM. Tom: Got it. Should I bring anything? Ben: Maybe some drinks? I've got the cake and decorations covered. Tom: Sounds good. See you there!</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nNoise-canceling headphones have become increasingly popular, especially among people who work in open offices or travel frequently. These headphones use small microphones to detect surrounding sounds and produce opposite sound waves that cancel out much of the background noise before it reaches the ear. While many users praise the headphones for helping them concentrate, some researchers have raised concerns about overuse. Constantly blocking out environmental sounds, they argue, may make it harder for people to notice important signals, such as a colleague calling their name or an approaching vehicle. Additionally, a few studies have found that some users experience mild dizziness or ear pressure after wearing the headphones for long periods, although more research is needed to confirm these effects. Despite these concerns, most experts agree that occasional use of noise-canceling headphones is unlikely to cause harm for the average person.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nIn recent years, a growing number of people have embraced minimalism — a lifestyle that focuses on owning fewer possessions and prioritizing experiences over material goods. Supporters of minimalism argue that having fewer belongings can reduce stress, make cleaning and organizing easier, and free up money for travel or other experiences. Critics, however, point out that minimalism can sometimes become its own form of consumerism, as people buy specially designed \"minimalist\" products or pay for organizing services. Others note that minimalism may be easier for people with higher incomes, who can more easily replace items if needed, while those with lower incomes may need to keep extra items for practical reasons. Despite these criticisms, many people who have adopted a minimalist lifestyle report feeling less overwhelmed and more focused on what truly matters to them.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Hannah began teaching at a local elementary school, she noticed that the amount of trash thrown away during lunchtime was enormous, with much of it being recyclable materials and uneaten food. Concerned about the waste, she started a small project with her class: students would sort their lunch waste into separate bins for recycling, composting, and trash, and the class would track how much was diverted from the landfill each week. Within a few months, other classes became interested and asked to join the project. Hannah worked with the school administration to expand the program to the entire school, and the school's overall trash output dropped significantly. Local news outlets featured the program, and several nearby schools reached out to Hannah for advice on starting similar initiatives. Hannah now spends some of her weekends helping other schools set up their own waste-sorting programs, in addition to her regular teaching duties.</div>"};

"en": "While many users praise the headphones for helping them concentrate, some researchers have raised concerns about overuse.", "zh": "雖然許多使用者稱讚這種耳機能幫助他們專心，但有些研究人員對過度使用提出了疑慮。", "sa": "【S】some researchers 【V】have raised 【O】concerns about overuse<br>📌 While 表讓步「雖然」；praise sb for + V-ing；help + O + 原形"}, {"en": "Constantly blocking out environmental sounds, they argue, may make it harder for people to notice important signals, such as a colleague calling their name or an approaching vehicle.", "zh": "他們認為，持續隔絕環境聲音，可能會讓人更難注意到重要的訊號，例如同事叫自己的名字，或是有車輛逼近。", "sa": "【S】Constantly blocking out environmental sounds 【V】may make 【O】it 【C】harder…<br>📌 make it + adj. + for sb to V（it 為虛受詞）；they argue 為插入語"}, {"en": "Additionally, a few studies have found that some users experience mild dizziness or ear pressure after wearing the headphones for long periods, although more research is needed to confirm these effects.", "zh": "此外，少數研究發現，有些使用者長時間戴耳機後會出現輕微頭暈或耳壓不適，不過還需要更多研究來證實這些影響。", "sa": "【S】a few studies 【V】have found 【O】that 子句<br>📌 after + V-ing；although 表讓步；be needed to V"}, {"en": "Despite these concerns, most experts agree that occasional use of noise-canceling headphones is unlikely to cause harm for the average person.", "zh": "儘管有這些疑慮，大多數專家都同意，對一般人而言，偶爾使用抗噪耳機不太可能造成傷害。", "sa": "【S】most experts 【V】agree 【O】that 子句<br>📌 Despite + 名詞；be unlikely to V「不太可能」"}], "36": [{"en": "In recent years, a growing number of people have embraced minimalism — a lifestyle that focuses on owning fewer possessions and prioritizing experiences over material goods.", "zh": "近年來，越來越多人接受極簡主義——一種著重擁有較少物品、把體驗看得比物質更重要的生活方式。", "sa": "【S】a growing number of people 【V】have embraced 【O】minimalism<br>📌 a number of + 複數名詞（動詞用複數）；破折號後為同位語；prioritize A over B"}, {"en": "Supporters of minimalism argue that having fewer belongings can reduce stress, make cleaning and organizing easier, and free up money for travel or other experiences.", "zh": "極簡主義的支持者認為，擁有較少的東西可以減輕壓力、讓打掃和整理更輕鬆，並且省下錢用在旅行或其他體驗上。", "sa": "【S】Supporters of minimalism 【V】argue 【O】that 子句<br>📌 子句中動名詞 having fewer belongings 當主詞，接三個並列動詞 reduce / make / free up；make + O + adj."}, {"en": "Critics, however, point out that minimalism can sometimes become its own form of consumerism, as people buy specially designed \"minimalist\" products or pay for organizing services.", "zh": "然而，批評者指出，極簡主義有時本身就會變成另一種消費主義，因為人們會購買特別設計的「極簡」產品，或花錢請人整理收納。", "sa": "【S】Critics 【V】point out 【O】that 子句<br>📌 however 插入表轉折；as 表原因；pay for「付錢買…」"}, {"en": "Others note that minimalism may be easier for people with higher incomes, who can more easily replace items if needed, while those with lower incomes may need to keep extra items for practical reasons.", "zh": "也有人指出，極簡主義對收入較高的人可能比較容易，因為他們需要時能較輕易地重新買東西；而收入較低的人可能因實際需要，得保留額外的物品。", "sa": "【S】Others 【V】note 【O】that 子句<br>📌 , who 引導非限定子句補充說明；if needed ＝ if it is needed；while 表對比"}, {"en": "Despite these criticisms, many people who have adopted a minimalist lifestyle report feeling less overwhelmed and more focused on what truly matters to them.", "zh": "儘管有這些批評，許多採用極簡生活方式的人表示，他們覺得比較不會不堪負荷，也更能專注在對自己真正重要的事情上。", "sa": "【S】many people 【M】who have adopted… 【V】report 【O】feeling less overwhelmed and more focused…<br>📌 report + V-ing；what 引導名詞子句當介系詞 on 的受詞"}], "39": [{"en": "When Hannah began teaching at a local elementary school, she noticed that the amount of trash thrown away during lunchtime was enormous, with much of it being recyclable materials and uneaten food.", "zh": "Hannah 開始在當地一所小學教書時，注意到午餐時間丟掉的垃圾量非常驚人，其中很多是可回收物和沒吃完的食物。", "sa": "【S】she 【V】noticed 【O】that the amount of trash… was enormous<br>📌 When 引導時間副詞子句；thrown away 為過去分詞修飾 trash；with + O + V-ing 表附帶狀況"}, {"en": "Concerned about the waste, she started a small project with her class: students would sort their lunch waste into separate bins for recycling, composting, and trash, and the class would track how much was diverted from the landfill each week.", "zh": "她擔心這樣的浪費，於是和班上同學展開一項小計畫：學生把午餐的廢棄物分類到回收、堆肥和一般垃圾的不同桶子裡，全班每週追蹤有多少量不必送進掩埋場。", "sa": "【S】she 【V】started 【O】a small project 【M】with her class<br>📌 Concerned about… 為分詞構句（＝Because she was concerned…）；sort A into B；how much 引導名詞子句"}, {"en": "Within a few months, other classes became interested and asked to join the project.", "zh": "幾個月之內，其他班級也產生興趣，並要求加入這項計畫。", "sa": "【S】other classes 【V】became 【C】interested 【V】and asked 【O】to join the project<br>📌 become + adj.；ask to V"}, {"en": "Hannah worked with the school administration to expand the program to the entire school, and the school's overall trash output dropped significantly.", "zh": "Hannah 和學校行政單位合作，把計畫擴大到全校，學校整體的垃圾量也大幅下降。", "sa": "【S】Hannah 【V】worked 【M】with the school administration 【M】to expand…；【S】the school's overall trash output 【V】dropped<br>📌 to V 表目的；and 連接兩個子句"}, {"en": "Local news outlets featured the program, and several nearby schools reached out to Hannah for advice on starting similar initiatives.", "zh": "地方新聞媒體報導了這項計畫，附近好幾所學校也主動聯絡 Hannah，請教如何推動類似的計畫。", "sa": "【S】Local news outlets 【V】featured 【O】the program；【S】several nearby schools 【V】reached out to 【O】Hannah<br>📌 feature「專題報導」；reach out to「聯繫」"}, {"en": "Hannah now spends some of her weekends helping other schools set up their own waste-sorting programs, in addition to her regular teaching duties.", "zh": "除了平常的教學工作之外，Hannah 現在還利用部分週末，協助其他學校建立自己的垃圾分類計畫。", "sa": "【S】Hannah 【V】spends 【O】some of her weekends 【M】helping other schools set up…<br>📌 spend + 時間 + V-ing；help + O + 原形；in addition to + 名詞"}]};

 had to _____ a steep hill to reach the viewpoint.", "o": ["climb", "clean", "clip", "clap"], "a": 0, "exp": "✓ (A) climb（攀爬）— 健行者必須「攀爬」一座陡峭的山丘才能到達觀景點。\n❌ (B) clean = 清潔，語意不符。\n❌ (C) clip = 剪、夾，語意不符。\n❌ (D) clap = 拍手，語意不符。", "zh": "健行者必須<b>爬<\/b>上一座陡峭的山丘才能抵達觀景點。", "sa": "【S】The hikers 【V】had to climb 【O】a steep hill 【M】to reach the viewpoint<br>📌 句型：had to + 原形「（過去）必須」；to reach 表目的<br>例：We had to wake up early to catch the train.", "on": ["健行者必須「攀爬」一座陡峭的山丘才能到達觀景點。", "清潔，語意不符。", "剪、夾，語意不符。", "拍手，語意不符。"], "oz": ["爬；攀登", "清理", "剪；夾", "拍手"]}, {"n": 5, "p": 0, "stem": "The company's profits have _____ significantly over the past year.", "o": ["increased", "instructed", "inserted", "installed"], "a": 0, "exp": "✓ (A) increased（增加）— 該公司的利潤在過去一年中顯著「增加」。\n❌ (B) instructed = 指示，語意不符。\n❌ (C) inserted = 插入，語意不符。\n❌ (D) installed = 安裝，語意不符。", "zh": "這家公司的利潤在過去一年裡大幅<b>增加<\/b>。", "sa": "【S】The company's profits 【V】have increased 【M】significantly 【M】over the past year<br>📌 句型：現在完成式 have + p.p. 搭配 over the past year，表示「到目前為止的變化」；increase 為不及物動詞<br>例：Prices have risen sharply over the past month.", "on": ["該公司的利潤在過去一年中顯著「增加」。", "指示，語意不符。", "插入，語意不符。", "安裝，語意不符。"], "oz": ["增加", "指示；教導", "插入", "安裝"]}, {"n": 6, "p": 0, "stem": "The teacher asked students to _____ their opinions during the discussion.", "o": ["express", "expand", "expect", "expose"], "a": 0, "exp": "✓ (A) express（表達）— 老師要求學生在討論中「表達」他們的意見。\n❌ (B) expand = 擴展，語意不符。\n❌ (C) expect = 期待，語意不符。\n❌ (D) expose = 暴露，語意不符。", "zh": "老師請學生在討論時<b>表達<\/b>自己的意見。", "sa": "【S】The teacher 【V】asked 【O】students 【C】to express their opinions 【M】during the discussion<br>📌 句型：ask + O + to V「要求某人做某事」<br>例：My mom asked me to clean my room.", "on": ["老師要求學生在討論中「表達」他們的意見。", "擴展，語意不符。", "期待，語意不符。", "暴露，語意不符。"], "oz": ["表達", "擴大；擴展", "預期；期待", "暴露；揭露"]}, {"n": 7, "p": 0, "stem": "The firefighters managed to _____ the family from the burning building.", "o": ["rescue", "reduce", "refuse", "reveal"], "a": 0, "exp": "✓ (A) rescue（救援）— 消防員設法將這家人從燃燒的建築物中「救出」。\n❌ (B) reduce = 減少，語意不符。\n❌ (C) refuse = 拒絕，語意不符。\n❌ (D) reveal = 揭露，語意不符。", "zh": "消防員成功把這一家人從燃燒的建築物中<b>救<\/b>出來。", "sa": "【S】The firefighters 【V】managed to rescue 【O】the family 【M】from the burning building<br>📌 句型：manage to V「設法（成功）做到」；rescue A from B「從 B 救出 A」；burning 為現在分詞當形容詞<br>例：He managed to finish the report on time.", "on": ["消防員設法將這家人從燃燒的建築物中「救出」。", "減少，語意不符。", "拒絕，語意不符。", "揭露，語意不符。"], "oz": ["救援；營救", "減少", "拒絕", "揭露；透露"]}, {"n": 8, "p": 0, "stem": "The committee will _____ the final decision after reviewing all proposals.", "o": ["announce", "annoy", "appoint", "approve"], "a": 0, "exp": "✓ (A) announce（宣布）— 委員會將在審查所有提案後「宣布」最終決定。\n❌ (B) annoy = 使惱怒，語意不符。\n❌ (C) appoint = 任命，語意不符。\n❌ (D) approve = 批准，\"approve the final decision\" 語意稍可通但不如 announce（宣布決定）貼切，且委員會的角色是做出並「宣布」決定，而非批准既有決定。", "zh": "委員會在審查完所有提案後，將會<b>宣布<\/b>最終決定。", "sa": "【S】The committee 【V】will announce 【O】the final decision 【M】after reviewing all proposals<br>📌 句型：after + V-ing（介系詞後接動名詞，省略與主句相同的主詞）<br>例：After finishing dinner, we went for a walk.", "on": ["委員會將在審查所有提案後「宣布」最終決定。", "使惱怒，語意不符。", "任命，語意不符。", "批准，\"approve the final decision\" 語意稍可通但不如 announce（宣布決定）貼切，且委員會的角色是做出並「宣布」決定，而非批准既有決定。"], "oz": ["宣布", "惹惱", "任命；指派", "批准；贊成"]}, {"n": 9, "p": 0, "stem": "The instructions were so <i>ambiguous<\/i> that no one understood what to do.", "o": ["clear", "unclear", "simple", "detailed"], "a": 1, "exp": "✓ (B) unclear（不清楚的）— ambiguous（含糊不清的）與 unclear 意義最接近。\n❌ (A) clear = 清楚的，語意相反。\n❌ (C) simple = 簡單的，語意不符。\n❌ (D) detailed = 詳細的，語意不符。", "zh": "說明寫得太<b>含糊不清<\/b>，以致於沒有人知道該做什麼。", "sa": "【S】The instructions 【V】were 【C】so ambiguous 【M】that no one understood what to do<br>📌 句型：so + adj. + that 子句「如此…以致於…」；what to do = 疑問詞 + 不定詞，當受詞<br>例：The box was so heavy that I couldn't lift it.", "on": ["清楚的，語意相反。", "ambiguous（含糊不清的）與 unclear 意義最接近。", "簡單的，語意不符。", "詳細的，語意不符。"], "oz": ["清楚的", "不清楚的；模稜兩可的", "簡單的", "詳細的"]}, {"n": 10, "p": 0, "stem": "The team worked <i>diligently<\/i> to finish the project before the deadline.", "o": ["carelessly", "hard", "slowly", "occasionally"], "a": 1, "exp": "✓ (B) hard（努力地）— diligently（勤勉地）與 hard（努力地）意義最接近。\n❌ (A) carelessly = 粗心地，語意相反。\n❌ (C) slowly = 緩慢地，語意不符。\n❌ (D) occasionally = 偶爾地，語意不符。", "zh": "團隊<b>勤奮地<\/b>工作，要在截止期限前完成專案。", "sa": "【S】The team 【V】worked 【M】diligently 【M】to finish the project before the deadline<br>📌 句型：副詞 diligently（＝hard）修飾動詞 worked；to finish 表目的<br>注意：hard 當副詞是「努力地」，hardly 是「幾乎不」。", "on": ["粗心地，語意相反。", "diligently（勤勉地）與 hard（努力地）意義最接近。", "緩慢地，語意不符。", "偶爾地，語意不符。"], "oz": ["粗心地", "努力地；勤奮地", "慢慢地", "偶爾"]}, {"n": 11, "p": 1, "stem": "Customer: I'd like to apply for a credit card. What documents do I need?<br>Bank staff: _____<br>Customer: Okay, I have those with me.", "o": ["We don't issue credit cards anymore.", "You'll need your ID and proof of income.", "The bank is closed for the day.", "You should apply online instead."], "a": 1, "exp": "✓ (B) You'll need your ID and proof of income.— 顧客回應「好，這些我都帶來了」，呼應行員告知所需的文件。\n❌ (A) 說「我們不再發行信用卡了」，與顧客接著說「我都有帶」矛盾。\n❌ (C) 說「銀行今天休息」，與顧客的回應不連貫。\n❌ (D) 說「你應該改用線上申請」，與顧客接著表示已準備好文件矛盾。", "zh": "顧客：我想申請信用卡，需要準備哪些文件？<br>銀行行員：<b>您需要帶身分證件和收入證明。<\/b><br>顧客：好的，這些我都有帶來。", "sa": "正解句：【S】You 【V】'll need 【O】your ID and proof of income<br>前句：【S】What documents 【V】do I need?（疑問詞 what + 名詞 開頭的問句）<br>📌 句型：I'd like to V「我想要…」（客氣說法）；apply for「申請」<br>例：I'd like to apply for a library card.", "on": ["說「我們不再發行信用卡了」，與顧客接著說「我都有帶」矛盾。", "顧客回應「好，這些我都帶來了」，呼應行員告知所需的文件。", "說「銀行今天休息」，與顧客的回應不連貫。", "說「你應該改用線上申請」，與顧客接著表示已準備好文件矛盾。"], "oz": ["我們已經不發信用卡了。", "您需要身分證件和收入證明。", "銀行今天已經關門了。", "您應該改成線上申請。"]}, {"n": 12, "p": 1, "stem": "Coworker A: Have you finished setting up the conference room for tomorrow?<br>Coworker B: _____<br>Coworker A: Great, thanks for taking care of that.", "o": ["Yes, everything is ready to go.", "The conference was canceled.", "I forgot we had a meeting tomorrow.", "Someone else is supposed to do that."], "a": 0, "exp": "✓ (A) Yes, everything is ready to go.— 同事B回答已經準備好，同事A回應「太好了，謝謝你處理這件事」，前 面上，朋友A回應「對耶！謝謝你提醒我」，前後呼應。\n❌ (B) 說「我從不碰你的東西」，與A的感謝回應不連貫，且未回答鑰匙位置。\n❌ (C) 說「你應該換個新鎖」，與A回應「謝謝提醒」不連貫。\n❌ (D) 說「我已經把門鎖上了」，與尋找鑰匙的話題不連貫。", "zh": "朋友 A：我到處都找不到鑰匙，你有看到嗎？<br>朋友 B：<b>我想你把它們放在廚房流理臺上了。<\/b><br>朋友 A：喔，你說得對！謝謝你提醒我。", "sa": "正解句：【S】I 【V】think 【O】(that) you left them on the kitchen counter<br>📌 句型：I think (that) + 子句（that 可省略）；leave + 物 + 地方「把東西留在／忘在某處」；thanks for + V-ing<br>例：I think I left my umbrella on the bus.", "on": ["朋友B提示鑰匙可能放在廚房檯面上，朋友A回應「對耶！謝謝你提醒我」，前後呼應。", "說「我從不碰你的東西」，與A的感謝回應不連貫，且未回答鑰匙位置。", "說「你應該換個新鎖」，與A回應「謝謝提醒」不連貫。", "說「我已經把門鎖上了」，與尋找鑰匙的話題不連貫。"], "oz": ["我想你把它放在廚房流理台上了。", "我從來不碰你的東西。", "也許你該買個新鎖。", "我已經鎖門了。"]}, {"n": 15, "p": 1, "stem": "Tour guide: We'll be heading to the next site in about ten minutes.<br>Tourist: _____<br>Tour guide: Sure, the restroom is just over there.", "o": ["Is there a restroom nearby before we leave?", "How far is the next site?", "Can we skip this site?", "I think we should leave now."], "a": 0, "exp": "✓ (A) Is there a restroom nearby before we leave?— 導遊回答「有，洗手間就在那邊」，呼應遊客詢問離開前是否有洗手間。\n❌ (B) 問下一個景點有多遠，與導遊回答「洗手間在那邊」不連貫。\n❌ (C) 問可不可以跳過這個景點，與導遊的回應不連貫。\n❌ (D) 說「我覺得我們該離開了」，與導遊回答洗手間位置不連貫。", "zh": "導遊：我們大約十分鐘後要前往下一個景點。<br>遊客：<b>出發前附近有洗手間嗎？<\/b><br>導遊：有，洗手間就在那邊。", "sa": "正解句：Is there + 名詞 + 地點?「…有…嗎？」<br>前句：【S】We 【V】'll be heading 【M】to the next site 【M】in about ten minutes（未來進行式，表預定的動作）<br>📌 句型：in + 時間「再過…之後」<br>例：The train will be leaving in five minutes.", "on": ["導遊回答「有，洗手間就在那邊」，呼應遊客詢問離開前是否有洗手間。", "問下一個景點有多遠，與導遊回答「洗手間在那邊」不連貫。", "問可不可以跳過這個景點，與導遊的回應不連貫。", "說「我覺得我們該離開了」，與導遊回答洗手間位置不連貫。"], "oz": ["出發前附近有洗手間嗎？", "下一個景點有多遠？", "我們可以跳過這個景點嗎？", "我覺得我們現在就該走了。"]}, {"n": 16, "p": 1, "stem": "Manager: I noticed the sales numbers dropped last month.<br>Employee: _____<br>Manager: That makes sense. Let's discuss it more in our meeting.", "o": ["I think our prices are too low.", "It might be due to the new competitor that opened nearby.", "Sales have always been this low.", "I haven't checked the numbers yet."], "a": 1, "exp": "✓ (B) It might be due to the new competitor that opened nearby.— 員工提出銷售下滑的可能原因，主管回應「這樣說得通，我們在會議中再詳談」，前後呼應。\n❌ (A) 說「我覺得我們價格太低了」，與「銷售下滑」的因果方向不合理（價格過低通常會帶動銷量）。\n❌ (C) 說「銷售一直都這麼低」，與主管說「上個月下降」（暗示之前並非如此低）的語意不符。\n❌ (D) 說「我還沒檢查數字」，與主管回應「這樣說得通」不連貫（未檢查就無法說得通）。", "zh": "經理：我注意到上個月的銷售數字下滑了。<br>員工：<b>可能是因為附近新開了一家競爭對手。<\/b><br>經理：這說得通。我們開會時再進一步討論。", "sa": "正解句：【S】It 【V】might be 【C】due to the new competitor 【M】that opened nearby<br>📌 句型：be due to + 名詞「由於…」；that 引導形容詞子句修飾 competitor<br>例：The delay was due to bad weather.", "on": ["說「我覺得我們價格太低了」，與「銷售下滑」的因果方向不合理（價格過低通常會帶動銷量）。", "員工提出銷售下滑的可能原因，主管回應「這樣說得通，我們在會議中再詳談」，前後呼應。", "說「銷售一直都這麼低」，與主管說「上個月下降」（暗示之前並非如此低）的語意不符。", "說「我還沒檢查數字」，與主管回應「這樣說得通」不連貫（未檢查就無法說得通）。"], "oz": ["我覺得我們的價格太低了。", "可能是因為附近新開了一家競爭對手。", "銷售一直都這麼低。", "我還沒看數字。"]}, {"n": 17, "p": 1, "stem": "Student A: Do you know if the library is open on holidays?<br>Student B: _____<br>Student A: Okay, I'll go on a regular weekday then.", "o": ["It's open 24 hours a day.", "No, it's closed on public holidays.", "The library moved to a new building.", "I've never been to the library."], "a": 1, "exp": "✓ (B) No, it's closed on public holidays.— 學生B回答圖書館假日不開放，學生A回應「好，那我平日再去」，前後呼應。\n❌ (A) 說「它一天24小時開放」，與A回應「那我平日再去」矛盾（若24小時開放，假日去也可以）。\n❌ (C) 說「圖書館搬到新大樓了」，與「假日是否開放」的問題不連貫。\n❌ (D) 說「我從來沒去過圖書館」，未回答問題。", "zh": "學生 A：你知道圖書館假日有開嗎？<br>學生 B：<b>沒有，國定假日不開。<\/b><br>學生 A：好，那我就平日再去。", "sa": "前句：Do you know if + 子句?（if 引導名詞子句「是否」，用直述句語序）<br>正解句：【S】it 【V】's 【C】closed 【M】on public holidays<br>📌 句型：be closed / be open「關閉／開放」（形容詞當補語）", "on": ["說「它一天24小時開放」，與A回應「那我平日再去」矛盾（若24小時開放，假日去也可以）。", "學生B回答圖書館假日不開放，學生A回應「好，那我平日再去」，前後呼應。", "說「圖書館搬到新大樓了」，與「假日是否開放」的問題不連貫。", "說「我從來沒去過圖書館」，未回答問題。"], "oz": ["它二十四小時開放。", "不，國定假日不開。", "圖書館搬到新大樓了。", "我從來沒去過圖書館。"]}, {"n": 18, "p": 1, "stem": "Passenger: Excuse me, does this bus stop near the city hall?<br>Driver: _____<br>Passenger: Perfect, that's exactly where I need to go.", "o": ["This bus doesn't go downtown at all.", "Yes, it's the third stop from here.", "You'll need to transfer to another bus.", "The city hall moved last year."], "a": 1, "exp": "✓ (B) Yes, it's the third stop from here.— 司機確認會停靠市政廳附近，乘客回應「太好了，那正是我要去的地方」，前後呼應。\n❌ (A) 說「這班公車根本不去市中心」，與乘客回應「太好了，正是我要去的地方」矛盾。\n❌ (C) 說「你需要轉乘另一班公車」，與乘客回應「太好了」不連貫（需轉車通常不會說「太好了」）。\n❌ (D) 說「市政廳去年搬走了」，與乘客回應「正是我要去的地方」矛盾。", "zh": "乘客：不好意思，這班公車有停靠市政府附近嗎？<br>司機：<b>有，從這裡算起第三站。<\/b><br>乘客：太好了，那正是我要去的地方。", "sa": "正解句：【S】it 【V】's 【C】the third stop 【M】from here<br>後句：that's exactly where I need to go（where 引導名詞子句當補語）<br>📌 句型：序數 the third + 名詞；stop near「停靠在…附近」", "on": ["說「這班公車根本不去市中心」，與乘客回應「太好了，正是我要去的地方」矛盾。", "司機確認會停靠市政廳附近，乘客回應「太好了，那正是我要去的地方」，前後呼應。", "說「你需要轉乘另一班公車」，與乘客回應「太好了」不連貫（需轉車通常不會說「太好了」）。", "說「市政廳去年搬走了」，與乘客回應「正是我要去的地方」矛盾。"], "oz": ["這班公車完全不到市中心。", "有，從這裡算第三站。", "你需要轉乘另一班公車。", "市政府去年搬家了。"]}, {"n": 19, "p": 1, "stem": "Coworker A: I'm thinking about taking a vacation next month.<br>Coworker B: _____<br>Coworker A: That's a great idea. I'll start looking at flights.", "o": ["You should ask your boss for approval first.", "Vacations are a waste of time.", "Maybe somewhere warm would be nice this time of year.", "I never take vacations."], "a": 2, "exp": "✓ (C) Maybe somewhere warm would be nice this time of year.— 同事B提出目的地建議，同事A回應「好主意，我來查查機票」，前後呼應，顯示話題延續到旅行地點與機票。\n❌ (A) 說「你應該先問老闆同意」，與A回應「好主意，我來查機票」（已決定要去）不連貫。\n❌ (B) 說「放假是浪費時間」，與A回應「好主意」矛盾。\n❌ (D) 說「我從不放假」，與「正在討論放假地點」的話題不連貫。", "zh": "同事 A：我在考慮下個月去度假。<br>同事 B：<b>這個時節去溫暖一點的地方或許不錯。<\/b><br>同事 A：好主意，我來開始查機票。", "sa": "正解句：【S】somewhere warm 【V】would be 【C】nice 【M】this time of year<br>📌 句型：形容詞放在 somewhere / something 之後（somewhere warm）；think about + V-ing「考慮做…」<br>例：Let's go somewhere quiet.", "on": ["說「你應該先問老闆同意」，與A回應「好主意，我來查機票」（已決定要去）不連貫。", "說「放假是浪費時間」，與A回應「好主意」矛盾。", "同事B提出目的地建議，同事A回應「好主意，我來查查機票」，前後呼應，顯示話題延續到旅行地點與機票。", "說「我從不放假」，與「正在討論放假地點」的話題不連貫。"], "oz": ["你應該先請老闆核准。", "度假是浪費時間。", "這個時節去溫暖一點的地方也許不錯。", "我從來不休假。"]}, {"n": 20, "p": 1, "stem": "Customer: I'd like to cancel my subscription to this magazine.<br>Representative: _____<br>Customer: Yes, I understand. Please go ahead and cancel it.", "o": ["I'm sorry to hear that. May I ask why you'd like to cancel?", "We don't offer subscriptions anymore.", "Your subscription was canceled last month.", "You'll need to renew first before canceling."], "a": 0, "exp": "✓ (A) I'm sorry to hear that. May I ask why you'd like to cancel?— 客服人員詢問取消原因，顧客回應「我了解，請幫我取消」，前後呼應（顧客在被詢問後仍選擇取消）。\n❌ (B) 說「我們不再提供訂閱了」，與顧客接著說「請幫我取消」矛盾（若不提供訂閱，顧客也無需被取消）。\n❌ (C) 說「您的訂閱上個月已經取消了」，與顧客「請幫我取消」的請求矛盾（尚未取消）。\n❌ (D) 說「您需要先續訂才能取消」，邏輯不合理，且與顧客的回應不連貫。", "zh": "顧客：我想取消這本雜誌的訂閱。<br>客服人員：<b>很遺憾聽到這個消息。請問您為什麼想取消呢？<\/b><br>顧客：是的，我了解。請直接幫我取消。", "sa": "正解句：May I ask why you'd like to cancel?（why 引導間接問句，用直述句語序 you'd like）<br>📌 句型：I'm sorry to hear that.「聽到這件事很遺憾」；cancel one's subscription to…「取消…的訂閱」", "on": ["客服人員詢問取消原因，顧客回應「我了解，請幫我取消」，前後呼應（顧客在被詢問後仍選擇取消）。", "說「我們不再提供訂閱了」，與顧客接著說「請幫我取消」矛盾（若不提供訂閱，顧客也無需被取消）。", "說「您的訂閱上個月已經取消了」，與顧客「請幫我取消」的請求矛盾（尚未取消）。", "說「您需要先續訂才能取消」，邏輯不合理，且與顧客的回應不連貫。"], "oz": ["很遺憾聽到這個消息。請問您為什麼想取消呢？", "我們已經不提供訂閱了。", "您的訂閱上個月已經取消了。", "您得先續訂才能取消。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["carried", "carry", "carrying", "to carry"], "a": 0, "exp": "✓ (A) carried（過去式動詞）— \"Residents... usually carried their own lanterns for light\" 描述過去的常態，主詞 Residents 為複數，搭配過去式動詞 carried，作句子的主要動詞。\n❌ (B) carry = 現在式原形，與全文描述「電燈發明之前」的過去時間不符。\n❌ (C) carrying = 現在分詞，不能單獨作句子的主要動詞。\n❌ (D) to carry = 不定詞，不能單獨作句子的主要動詞。", "zh": "<i>Residents who needed to go out after dark usually <b>carried<\/b> their own lanterns for light.<\/i><br>天黑後需要外出的居民，通常會自己<b>提<\/b>著燈籠照明。", "sa": "【S】Residents 【M】who needed to go out after dark 【V】usually carried 【O】their own lanterns 【M】for light<br>📌 句型：who 引導形容詞子句修飾主詞 Residents；主要動詞用過去式 carried 描述過去習慣", "on": ["\"Residents... usually carried their own lanterns for light\" 描述過去的常態，主詞 Residents 為複數，搭配過去式動詞 carried，作句子的主要動詞。", "現在式原形，與全文描述「電燈發明之前」的過去時間不符。", "現在分詞，不能單獨作句子的主要動詞。", "不定詞，不能單獨作句子的主要動詞。"], "oz": ["攜帶；拿（過去式）", "攜帶（原形／現在式）", "攜帶（現在分詞）", "去攜帶（不定詞）"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["install", "installing", "to be installed", "installed"], "a": 2, "exp": "✓ (C) to be installed（不定詞被動式）— \"gas lamps began to be installed along major streets\" 表示「瓦斯燈開始被裝設在主要街道上」，gas lamps 是被裝設的對象，begin 後接不定詞，且需用被動式表示「被裝設」。\n❌ (A) install = 主動原形，begin 後不可直接接原形動詞，且與被動語意不符。\n❌ (B) installing = 主動現在分詞，與被動語意不符。\n❌ (D) installed = 過去分詞，但 begin 後須接不定詞或動名詞，不能直接接過去分詞。", "zh": "<i>In the 19th century, gas lamps began <b>to be installed<\/b> along major streets, which allowed people to walk safely after dark for the first time.<\/i><br>十九世紀時，主要街道開始<b>裝設<\/b>瓦斯燈，這讓人們第一次能在天黑後安全地行走。", "sa": "【S】gas lamps 【V】began 【O】to be installed along major streets 【M】, which allowed people to walk safely…<br>📌 句型：begin to be + p.p.（不定詞被動）；, which 代替前面整件事，引導非限定子句；allow + O + to V<br>例：New trees began to be planted in the park.", "on": ["主動原形，begin 後不可直接接原形動詞，且與被動語意不符。", "主動現在分詞，與被動語意不符。", "\"gas lamps began to be installed along major streets\" 表示「瓦斯燈開始被裝設在主要街道上」，gas lamps 是被裝設的對象，begin 後接不定詞，且需用被動式表示「被裝設」。", "過去分詞，但 begin 後須接不定詞或動名詞，不能直接接過去分詞。"], "oz": ["安裝（原形）", "安裝（動名詞）", "被安裝（不定詞被動式）", "被安裝的（過去分詞）"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["that", "which", "what", "it"], "a": 1, "exp": "✓ (B) which（關係代名詞，代替前面整個句子）— \"..., which led to a noticeable shift in city life\" 中，which 代替前面整句話的概念（safety improved and hours extended），引導補述關係子句，在子句中作主詞。\n❌ (A) that = 通常不用於非限定（補述）關係子句，且 that 前不可加逗號。\n❌ (C) what = what 引導名詞子句且本身不能有先行詞，不適用於此處的補述用法。\n❌ (D) it = it 為代名詞，不能引導從屬子句，會造成句子結構錯誤（兩個句子缺少連接詞）。", "zh": "<i>This change not only improved safety but also extended the hours during which people could shop, work, and socialize, <b>which<\/b> led to a noticeable shift in city life.<\/i><br>這項改變不但提升了安全，也延長了人們可以購物、工作和社交的時間，<b>而這<\/b>讓城市生活產生了明顯的轉變。", "sa": "【S】This change 【V】not only improved 【O】safety 【V】but also extended 【O】the hours 【M】during which people could…<br>📌 句型：not only A but also B；介系詞 + which（during which）；, which 代替前面整句，在子句中當主詞", "on": ["通常不用於非限定（補述）關係子句，且 that 前不可加逗號。", "\"..., which led to a noticeable shift in city life\" 中，which 代替前面整句話的概念（safety improved and hours extended），引導補述關係子句，在子句中作主詞。", "what 引導名詞子句且本身不能有先行詞，不適用於此處的補述用法。", "it 為代名詞，不能引導從屬子句，會造成句子結構錯誤（兩個句子缺少連接詞）。"], "oz": ["那個（連接詞／關代）", "這件事（非限定關代，指前面整句）", "……的事物（複合關代）", "它（代名詞）"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["regarded", "regarding", "regard", "regards"], "a": 0, "exp": "✓ (A) regarded（過去分詞，被動修飾）— \"a development that was widely regarded as a major step forward\" 表示「一項被廣泛視為重大進展的發展」，\"regard A as B\" 的被動式為 \"A is regarded as B\"，過去分詞 regarded 與 be動詞 was 搭配構成被動語態。\n❌ (B) regarding = 現在分詞/介系詞「關於」，與 was 搭配文法不符。\n❌ (C) regard = 動詞原形，與 was 搭配文法不符。\n❌ (D) regards = 第三人稱單數現在式，與 was 搭配文法不符。", "zh": "<i>By the early 20th century, electric streetlights had largely replaced gas lamps, a development that was widely <b>regarded<\/b> as a major step forward in urban life.<\/i><br>到了二十世紀初，電力路燈已大致取代瓦斯燈，這項發展被普遍<b>視為<\/b>城市生活的一大進步。", "sa": "【S】electric streetlights 【V】had largely replaced 【O】gas lamps 【M】, a development that was widely regarded as…（同位語）<br>📌 句型：A be regarded as B「A 被視為 B」；By + 過去時間 + 過去完成式 had p.p.", "on": ["\"a development that was widely regarded as a major step forward\" 表示「一項被廣泛視為重大進展的發展」，\"regard A as B\" 的被動式為 \"A is regarded as B\"，過去分詞 regarded 與 be動詞 was 搭配構成被動語態。", "現在分詞/介系詞「關於」，與 was 搭配文法不符。", "動詞原形，與 was 搭配文法不符。", "第三人稱單數現在式，與 was 搭配文法不符。"], "oz": ["被視為（過去分詞）", "關於（介系詞）", "視為（原形）", "視為（第三人稱單數）；問候"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["who", "that", "whom", "whose"], "a": 1, "exp": "✓ (B) that（關係代名詞，指事物，作主格）— \"tasks that require switching attention\" 中，that 代替先行詞 tasks（事物），在子句中作主詞，引導形容詞子句修飾 tasks。\n❌ (A) who = 用於指人，tasks 為事物，不適用。\n❌ (C) whom = 用於指人且作受格，不適用於事物，且此處子句缺主詞而非受詞。\n❌ (D) whose = 所有格關係代名詞，此處子句缺的是主詞而非所有格修飾語，不符。", "zh": "<i>Research has shown that bilingual individuals often perform better on tasks <b>that<\/b> require switching attention between different activities, possibly because managing two languages trains the brain to handle competing information.<\/i><br>研究顯示，雙語者在<b>需要<\/b>於不同活動之間切換注意力的任務上通常表現較好，可能是因為管理兩種語言能訓練大腦處理互相競爭的資訊。", "sa": "【S】Research 【V】has shown 【O】that bilingual individuals often perform better on tasks 【M】that require switching attention…<br>📌 句型：that 為關係代名詞（主格）修飾 tasks；require + V-ing；動名詞片語 managing two languages 當主詞", "on": ["用於指人，tasks 為事物，不適用。", "\"tasks that require switching attention\" 中，that 代替先行詞 tasks（事物），在子句中作主詞，引導形容詞子句修飾 tasks。", "用於指人且作受格，不適用於事物，且此處子句缺主詞而非受詞。", "所有格關係代名詞，此處子句缺的是主詞而非所有格修飾語，不符。"], "oz": ["（關代，指人，主格）", "（關代，指人或物）", "（關代，指人，受格）", "……的（關代所有格）"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["more", "less", "most", "least"], "a": 1, "exp": "✓ (B) less（較不…）— \"people who speak more than one language may be less likely to develop certain age-related memory problems\" 表示「會說多種語言的人可能較不容易出現某些與年齡相關的記憶問題」，符合「學習語言對大腦有保護作用」的正面語意脈絡。\n❌ (A) more = 與全文強調學習第二語言「益處」的正面脈絡相反（若更容易出現記憶問題，便不是益處）。\n❌ (C) most = 最高級，與句子語意及文法搭配皆不自然。\n❌ (D) least = 最不…，語意過於極端，與全文謹慎保留語氣（\"researchers caution that more studies are needed\"）不符。", "zh": "<i>In addition, studies suggest that people who speak more than one language may be <b>less<\/b> likely to develop certain age-related memory problems later in life, although researchers caution that more studies are needed before drawing firm conclusions.<\/i><br>此外，研究指出，會說一種以上語言的人，晚年可能<b>較不<\/b>容易出現某些與年齡相關的記憶問題，不過研究人員提醒，在下定論之前還需要更多研究。", "sa": "【S】studies 【V】suggest 【O】that people who speak more than one language may be less likely to develop…<br>📌 句型：be (more / less) likely to V「（較／較不）可能…」；although 引導讓步子句<br>例：Tired drivers are more likely to have accidents.", "on": ["與全文強調學習第二語言「益處」的正面脈絡相反（若更容易出現記憶問題，便不是益處）。", "\"people who speak more than one language may be less likely to develop certain age-related memory problems\" 表示「會說多種語言的人可能較不容易出現某些與年齡相關的記憶問題」，符合「學習語言對大腦有保護作用」的正面語意脈絡。", "最高級，與句子語意及文法搭配皆不自然。", "最不…，語意過於極端，與全文謹慎保留語氣（\"researchers caution that more studies are needed\"）不符。"], "oz": ["較多；更", "較少；較不", "最多；最", "最少；最不"]}, {"n": 27, "p": 2, "stem": "(27)", "o": ["Despite", "Because of", "Although", "Since"], "a": 0, "exp": "✓ (A) Despite（儘管，介系詞）— \"Despite these potential benefits, learning a new language requires significant time and effort\" 表示「儘管有這些潛在益處，學習新語言仍需要大量時間與努力」，despite 後接名詞片語 these potential benefits，形成語意轉折。\n❌ (B) Because of = 因為，表因果關係，與「儘管有益處仍需努力」的轉折語意不符。\n❌ (C) Although = 雖然，後面須接「主詞+動詞」的完整子句，而此處接的是名詞片語 these potential benefits，文法不符。\n❌ (D) Since = 因為／自從，不符合轉折語意。", "zh": "<i><b>Despite<\/b> these potential benefits, learning a new language requires significant time and effort, and many adult learners give up before reaching fluency.<\/i><br><b>儘管<\/b>有這些潛在的好處，學習新語言仍需要大量的時間與努力，許多成人學習者在達到流利之前就放棄了。", "sa": "【M】Despite these potential benefits 【S】learning a new language 【V】requires 【O】significant time and effort<br>📌 句型：Despite + 名詞（介系詞）＝ Although + 子句；動名詞片語當主詞，動詞用單數 requires", "on": ["\"Despite these potential benefits, learning a new language requires significant time and effort\" 表示「儘管有這些潛在益處，學習新語言仍需要大量時間與努力」，despite 後接名詞片語 these potential benefits，形成語意轉折。", "因為，表因果關係，與「儘管有益處仍需努力」的轉折語意不符。", "雖然，後面須接「主詞+動詞」的完整子句，而此處接的是名詞片語 these potential benefits，文法不符。", "因為／自從，不符合轉折語意。"], "oz": ["儘管（介系詞）", "因為（介系詞片語）", "雖然（連接詞）", "因為；自從（連接詞）"]}, {"n": 28, "p": 2, "stem": "(28)", "o": ["lead", "leads", "leading", "led"], "a": 0, "exp": "✓ (A) lead（動詞原形）— 情態助動詞 can 後須接動詞原形，\"even basic knowledge... can lead to a deeper understanding\" 表示「即使是基本的語言知識也能促成更深刻的理解」，\"lead to\" 表示「導致、促成」。\n❌ (B) leads = 第三人稱單數現在式，can 後不可接此形式。\n❌ (C) leading = 現在分詞，can 後不可直接接此形式。\n❌ (D) led = 過去式/過去分詞，can 後不可直接接此形式。", "zh": "<i>Nevertheless, experts agree that even basic knowledge of another language can <b>lead<\/b> to a deeper understanding of different cultures.<\/i><br>儘管如此，專家都同意，即使只懂另一種語言的基礎知識，也能<b>帶來<\/b>對不同文化更深入的理解。", "sa": "【S】experts 【V】agree 【O】that even basic knowledge of another language can lead to a deeper understanding…<br>📌 句型：助動詞 can + 原形；lead to + 名詞「導致、帶來」<br>例：Hard work can lead to success.", "on": ["情態助動詞 can 後須接動詞原形，\"even basic knowledge... can lead to a deeper understanding\" 表示「即使是基本的語言知識也能促成更深刻的理解」，\"lead to\" 表示「導致、促成」。", "第三人稱單數現在式，can 後不可接此形式。", "現在分詞，can 後不可直接接此形式。", "過去式/過去分詞，can 後不可直接接此形式。"], "oz": ["導致（原形）", "導致（第三人稱單數）", "導致（現在分詞）", "導致了（過去式／過去分詞）"]}, {"n": 29, "p": 3, "stem": "Why is the pool closed this week?", "o": ["It is being used for a private event.", "It is undergoing maintenance.", "It has been permanently closed.", "There is a staff shortage."], "a": 1, "exp": "公告提到：「The swimming pool will be closed for maintenance from Monday to Wednesday this week.」\n(B) It is undergoing maintenance. ✓ 為正解。\n❌ (A) 公告未提到私人活動。\n❌ (C) 公告說是「本週一到三」暫時關閉，並非永久關閉。\n❌ (D) 公告未提到人手不足。", "zh": "題目：這週游泳池為什麼關閉？<br>(A) 它被用來舉辦私人活動。<br>(B) 它正在進行維修。<br>(C) 它已永久關閉。<br>(D) 人手不足。", "sa": "問句：Why is the pool closed this week?（be closed 狀態）<br>依據句：【S】The swimming pool 【V】will be closed 【M】for maintenance 【M】from Monday to Wednesday this week<br>📌 句型：be undergoing maintenance「正在維修」＝ be closed for maintenance；for 表原因", "on": ["公告未提到私人活動。", "公告提到：「The swimming pool will be closed for maintenance from Monday to Wednesday this week.」 ✓ 為正解。", "公告說是「本週一到三」暫時關閉，並非永久關閉。", "公告未提到人手不足。"], "oz": ["它被用來舉辦私人活動。", "它正在進行維修。", "它已永久關閉。", "人手不足。"]}, {"n": 30, "p": 3, "stem": "What can members do during the pool closure?", "o": ["Get a refund for their membership.", "Use the pool at the Park Avenue location for free.", "Use the weight room for free.", "Wait until next month to swim."], "a": 1, "exp": "公告提到：「members can use the indoor pool at our sister location on Park Avenue free of charge by showing their membership card」\n(B) Use the pool at the Park Avenue location for free. ✓ 為正解。\n❌ (A) 公告未提到退費。\n❌ (C) 公告說重訓室「照常開放」，並非「免費使用」（重訓室原本就是會員設施，並非此次特別免費項目）。\n❌ (D) 公告提供替代方案（去姊妹館游泳），並非要會員等到下個月。", "zh": "題目：游泳池關閉期間，會員可以做什麼？<br>(A) 申請會費退款。<br>(B) 免費使用公園大道分館的游泳池。<br>(C) 免費使用重訓室。<br>(D) 等到下個月再去游泳。", "sa": "依據句：【S】members 【V】can use 【O】the indoor pool at our sister location on Park Avenue 【M】free of charge 【M】by showing their membership card<br>📌 句型：free of charge ＝ for y block all sound from entering the ear physically.", "They play music louder than the surrounding noise."], "a": 1, "exp": "文中提到：「These headphones use small microphones to detect surrounding sounds and produce opposite sound waves that cancel out much of the background noise before it reaches the ear.」\n(B) They produce sound waves that cancel out background noise. ✓ 為正解。\n❌ (A) 文中說耳機是要「抵消」背景噪音，並非「增加」音量。\n❌ (C) 文中描述的是透過聲波抵消噪音，並非物理性地完全阻隔所有聲音。\n❌ (D) 文中未提到耳機是靠播放更大聲的音樂來蓋過噪音。", "zh": "題目：根據本文，抗噪耳機如何運作？<br>(A) 它們會把背景噪音的音量調大。<br>(B) 它們會產生聲波來抵消背景噪音。<br>(C) 它們以物理方式擋住所有聲音進入耳朵。<br>(D) 它們播放比周遭噪音更大聲的音樂。", "sa": "依據句：【S】These headphones 【V】use 【O】small microphones 【M】to detect surrounding sounds 【V】and produce 【O】opposite sound waves 【M】that cancel out much of the background noise…<br>📌 句型：to V 表目的；that 引導形容詞子句修飾 sound waves；cancel out「抵消」", "on": ["文中說耳機是要「抵消」背景噪音，並非「增加」音量。", "文中提到：「These headphones use small microphones to detect surrounding sounds and produce opposite sound waves that cancel out much of the background noise before it reaches the ear.」 ✓ 為正解。", "文中描述的是透過聲波抵消噪音，並非物理性地完全阻隔所有聲音。", "文中未提到耳機是靠播放更大聲的音樂來蓋過噪音。"], "oz": ["它們會把背景噪音的音量調大。", "它們會產生聲波來抵消背景噪音。", "它們以物理方式擋住所有聲音進入耳朵。", "它們播放比周遭噪音更大聲的音樂。"]}, {"n": 34, "p": 3, "stem": "What concern have some researchers raised about these headphones?", "o": ["They are too expensive for most people.", "They may make it harder to notice important signals.", "They cannot be used in open offices.", "They damage hearing immediately."], "a": 1, "exp": "文中提到：「Constantly blocking out environmental sounds, they argue, may make it harder for people to notice important signals, such as a colleague calling their name or an approaching vehicle.」\n(B) They may make it harder to notice important signals. ✓ 為正解。\n❌ (A) 文中未提到價格過高的問題。\n❌ (C) 文中說這類耳機在開放式辦公室「特別受歡迎」，並非不能使用。\n❌ (D) 文中說部分使用者「可能」出現輕微暈眩或耳壓不適，且需更多研究確認，並非「立即」造成聽力損害。", "zh": "題目：有些研究人員對這種耳機提出了什麼疑慮？<br>(A) 對大多數人來說太貴。<br>(B) 可能讓人比較難注意到重要的訊號。<br>(C) 不能在開放式辦公室使用。<br>(D) 會立即損害聽力。", "sa": "依據句 function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){
if(window.AK)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);

 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);

  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

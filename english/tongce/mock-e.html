<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">

<title>統測英文模擬考卷 E</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">

    <div class="score" id="scoreNum">0</div>

      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 E　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題<\/h3>\nSleep plays a crucial role in maintaining both physical and mental health. During deep sleep, the body repairs muscles and tissues, while the brain processes information <span class=\"blk\">21<\/span> during the day. Experts recommend that adults get between seven and nine hours of sleep each night, <span class=\"blk\">22<\/span> many people fall short of this due to busy schedules and screen use before bed. Studies have shown that exposure to bright screens late at night can make it <span class=\"blk\">23<\/span> to fall asleep, since the light interferes with the body's natural sleep signals. To improve sleep quality, doctors suggest <span class=\"blk\">24<\/span> a consistent bedtime and avoiding caffeine in the evening.<\/div>", "25": "<div class=\"passage\"><h3>第 25–28 題<\/h3>\nVolunteering has become an important part of many students' lives, not only because it benefits the community but also because it helps students develop valuable skills. By working with people from <span class=\"blk\">25<\/span> backgrounds, volunteers learn to communicate effectively and solve problems creatively. Some schools now require students <span class=\"blk\">26<\/span> a certain number of volunteer hours before graduation. While a few students view this requirement as a burden, most come to appreciate the experience <span class=\"blk\">27<\/span> they have completed it. In fact, many former volunteers say that the friendships and lessons they gained were <span class=\"blk\">28<\/span> anything they learned in the classroom.<\/div>", "29": "<div class=\"passage\"><h3>第 29–30 題<\/h3>\n<b>LOST CAT — PLEASE HELP!<\/b><br><br>Our cat, Mochi, has been missing since Monday evening. He is a small gray cat with white paws and a torn left ear. He was last seen near Maple Street Park wearing a blue collar with a small bell. Mochi is very shy around strangers, so please do not try to chase him — instead, call us right away if you spot him. A reward of $50 is offered for anyone who helps bring him home safely.<br><br>Contact: 0912-345-678 (the Chen family)<\/div>", "31": "<div class=\"passage\"><h3>第 31–32 題<\/h3>\n<b>Online Chat<\/b><br><br>Tina: Hey, are you coming to the study group tonight? Jake: I want to, but I still have to finish my chemistry lab report. Tina: How much do you have left? Jake: Just the conclusion section. I think I can finish it in an hour. Tina: Okay, we'll probably start around 7. Just join whenever you're done. Jake: Sounds good, see you then!<\/div>", "33": "<div class=\"passage\"><h3>第 33–35 題<\/h3>\nIn recent years, more restaurants have started offering \"imperfect produce\" on their menus — fruits and vegetables that are perfectly edible but do not meet the cosmetic standards of supermarkets, such as oddly shaped carrots or apples with small blemishes. These items are often sold at a lower cost, allowing restaurants to reduce expenses while also cutting down on food waste. According to some estimates, a large percentage of fruits and vegetables grown on farms never reach store shelves simply because of their appearance, even though their taste and nutritional value are unaffected. By partnering directly with local farms, restaurants can purchase this produce at a discount and create dishes that highlight fresh, seasonal ingredients. Some chefs say that customers rarely notice any difference in taste, and many appreciate knowing that their meal helped reduce food waste.<\/div>", "36": "<div class=\"passage\"><h3>第 36–38 題<\/h3>\nMost people assume that taking frequent breaks during work or study reduces productivity, but research suggests the opposite may be true. A well-known study found that participants who took short breaks every hour performed better on tasks requiring focus than those who worked straight through without stopping. Researchers believe this is because the brain's ability to concentrate naturally declines over time, and brief breaks allow it to \"reset.\" Interestingly, the type of break matters as well — looking at a smartphone during a break was found to be less restorative than activities such as stretching, walking outside, or simply looking out a window. Based on these findings, some companies have begun encouraging employees to step away from their desks for a few minutes every hour, rather than working continuously until lunch.<\/div>", "39": "<div class=\"passage\"><h3>第 39–42 題<\/h3>\nWhen Hana was a teenager, she struggled to find clothes that fit her properly, since most stores only carried a limited range of sizes. Frustrated by this experience, she began sewing her own clothes using fabric from secondhand shops. At first, her designs were simple, but as she practiced, she developed a unique style that combined traditional patterns with modern cuts. After posting photos of her creations online, she started receiving requests from people who wanted similar pieces made to fit their own bodies. Recognizing an opportunity, Hana opened a small studio where she offers custom-made clothing in a wide range of sizes, using sustainable fabrics whenever possible. She also hosts free workshops to teach basic sewing skills to anyone interested, especially those who, like her, have had difficulty finding clothes that fit. Hana hopes that her studio will encourage the fashion industry to become more inclusive of different body types.<\/div>"};
const PTR = {"21": [{"en": "Sleep plays a crucial role in maintaining both physical and mental health.", "zh": "睡眠在維持身心健康上扮演關鍵的角色。", "sa": "【S】Sleep 【V】plays 【O】a crucial role 【M】in maintaining both physical and mental health<br>📌 play a role in + V-ing「在……扮演角色」；both A and B。"}, {"en": "During deep sleep, the body repairs muscles and tissues, while the brain processes information <b>collected<\/b> during the day.", "zh": "在深層睡眠時，身體會修復肌肉與組織，而大腦則處理白天所蒐集的資訊。", "sa": "【S】the body 【V】repairs 【O】muscles and tissues, while 【S】the brain 【V】processes 【O】information<br>📌 collected during the day 為過去分詞後位修飾（被動）；while 表對比。"}, {"en": "Experts recommend that adults get between seven and nine hours of sleep each night, <b>but<\/b> many people fall short of this due to busy schedules and screen use before bed.", "zh": "專家建議成人每晚睡七到九小時，但許多人因為行程忙碌和睡前使用螢幕而睡不到這個時數。", "sa": "【S】Experts 【V】recommend 【O】that adults (should) get…, but 【S】many people 【V】fall short of 【O】this<br>📌 recommend that + S + (should) 原形 V；fall short of「未達到」。"}, {"en": "Studies have shown that exposure to bright screens late at night can make it <b>hard<\/b> to fall asleep, since the light interferes with the body's natural sleep signals.", "zh": "研究顯示，深夜接觸明亮的螢幕會讓人難以入睡，因為光線會干擾身體自然的睡眠訊號。", "sa": "【S】Studies 【V】have shown 【O】that exposure… can make it hard to fall asleep<br>📌 make + it + adj. + to V（it 為虛受詞）；interfere with「干擾」。"}, {"en": "To improve sleep quality, doctors suggest <b>setting<\/b> a consistent bedtime and avoiding caffeine in the evening.", "zh": "為了改善睡眠品質，醫生建議設定固定的就寢時間，並在晚上避免攝取咖啡因。", "sa": "【M】To improve sleep quality 【S】doctors 【V】suggest 【O】setting… and avoiding…<br>📌 suggest + V-ing；to V 表目的。"}], "25": [{"en": "Volunteering has become an important part of many students' lives, not only because it benefits the community but also because it helps students develop valuable skills.", "zh": "當志工已成為許多學生生活中重要的一部分，不只是因為它對社區有益，也因為它幫助學生培養寶貴的技能。", "sa": "【S】Volunteering 【V】has become 【C】an important part of many students' lives<br>📌 not only because… but also because…；help + O + 原形 V。"}, {"en": "By working with people from <b>different<\/b> backgrounds, volunteers learn to communicate effectively and solve problems creatively.", "zh": "藉由和來自不同背景的人一起工作，志工學會有效溝通，並有創意地解決問題。", "sa": "【M】By working with… 【S】volunteers 【V】learn 【O】to communicate… and (to) solve…<br>📌 by + V-ing「藉由」；learn to V「學會」。"}, {"en": "Some schools now require students <b>to complete<\/b> a certain number of volunteer hours before graduation.", "zh": "現在有些學校要求學生在畢業前完成一定時數的志工服務。", "sa": "【S】Some schools 【V】require 【O】students 【C】to complete…<br>📌 require + O + to V「要求某人做某事」。"}, {"en": "While a few students view this requirement as a burden, most come to appreciate the experience <b>once<\/b> they have completed it.", "zh": "雖然少數學生把這項規定視為負擔，但大多數人一旦完成之後，就會開始珍惜這段經驗。", "sa": "【S】most 【V】come to appreciate 【O】the experience 【M】once they have completed it<br>📌 while「雖然」；view A as B；once「一旦……就」。"}, {"en": "In fact, many former volunteers say that the friendships and lessons they gained were <b>more valuable than<\/b> anything they learned in the classroom.", "zh": "事實上，許多曾當過志工的人說，他們獲得的友誼和收穫，比在課堂上學到的任何東西都更有價值。", "sa": "【S】many former volunteers 【V】say 【O】that the friendships and lessons… were more valuable than…<br>📌 比較級 + than anything 表「最……」；they gained 前省略關代 that。"}], "29": [{"en": "LOST CAT — PLEASE HELP!", "zh": "尋貓啟事——請幫幫忙！", "sa": "標題：名詞片語＋祈使句（Please help!），省略主詞 you。"}, {"en": "Our cat, Mochi, has been missing since Monday evening.", "zh": "我們的貓 Mochi 從週一晚上就失蹤了。", "sa": "【S】Our cat, Mochi,（同位語）【V】has been 【C】missing 【M】since Monday evening<br>📌 現在完成式 + since 時間點，表持續到現在。"}, {"en": "He is a small gray cat with white paws and a torn left ear.", "zh": "牠是一隻小灰貓，有白色的腳掌，左耳有個缺口。", "sa": "【S】He 【V】is 【C】a small gray cat 【M】with white paws and a torn left ear<br>📌 with + N 描述外觀特徵；torn 為過去分詞當形容詞。"}, {"en": "He was last seen near Maple Street Park wearing a blue collar with a small bell.", "zh": "最後一次有人看到牠是在楓樹街公園附近，牠戴著一個繫有小鈴鐺的藍色項圈。", "sa": "【S】He 【V】was last seen 【M】near Maple Street Park 【C】wearing a blue collar…<br>📌 被動 be seen + V-ing「被看到正在……」。"}, {"en": "Mochi is very shy around strangers, so please do not try to chase him — instead, call us right away if you spot him.", "zh": "Mochi 在陌生人面前非常害羞，所以請不要試著追牠——如果發現牠，請立刻打電話給我們。", "sa": "【S】Mochi 【V】is 【C】very shy 【M】around strangers, so please do not try to chase him<br>📌 so 連接結果；祈使句 call us…；instead「改為」。"}, {"en": "A reward of $50 is offered for anyone who helps bring him home safely.", "zh": "任何協助讓牠平安回家的人，都可獲得 50 美元的酬謝。", "sa": "【S】A reward of $50 【V】is offered 【M】for anyone who helps bring him home safely<br>📌 被動 be offered；who 引導關係子句；help (to) + 原形 V。"}, {"en": "Contact: 0912-345-678 (the Chen family)", "zh": "聯絡電話：0912-345-678（陳家）", "sa": "聯絡資訊條列，省略主詞動詞。"}], "31": [{"en": "Tina: Hey, are you coming to the study group tonight?", "zh": "Tina：嘿，你今晚會來讀書會嗎？", "sa": "現在進行式表已安排的未來：are you coming…?"}, {"en": "Jake: I want to, but I still have to finish my chemistry lab report.", "zh": "Jake：我想去，但我還得完成化學實驗報告。", "sa": "【S】I 【V】want to（省略 come）, but 【S】I 【V】still have to finish 【O】my chemistry lab report<br>📌 have to「必須」。"}, {"en": "Tina: How much do you have left?", "zh": "Tina：你還剩多少？", "sa": "How much do you have left? → have + O + 過去分詞 left「剩下」。"}, {"en": "Jake: Just the conclusion section. I think I can finish it in an hour.", "zh": "Jake：只剩結論的部分。我想我一個小時內可以完成。", "sa": "第一句省略主詞動詞（I have just the conclusion section left）；in an hour「一小時內／後」。"}, {"en": "Tina: Okay, we'll probably start around 7. Just join whenever you're done.", "zh": "Tina：好，我們大概七點左右開始。你做完隨時加入就好。", "sa": "祈使句 Just join…；whenever「無論何時」引導副詞子句。"}, {"en": "Jake: Sounds good, see you then!", "zh": "Jake：聽起來不錯，到時候見！", "sa": "口語省略主詞：(That) sounds good；see you then「到時見」。"}], "33": [{"en": "In recent years, more restaurants have started offering \"imperfect produce\" on their menus — fruits and vegetables that are perfectly edible but do not meet the cosmetic standards of supermarkets, such as oddly shaped carrots or apples with small blemishes.", "zh": "近年來，越來越多餐廳開始在菜單上使用「不完美農產品」——也就是完全可以食用、但不符合超市外觀標準的蔬果，例如形狀奇怪的紅蘿蔔或有小斑點的蘋果。", "sa": "【S】more restaurants 【V】have started 【O】offering \"imperfect produce\"<br>📌 破折號後為同位語說明；that 引導形容詞子句；start + V-ing。"}, {"en": "These items are often sold at a lower cost, allowing restaurants to reduce expenses while also cutting down on food waste.", "zh": "這些食材通常以較低的價格出售，讓餐廳能降低開支，同時也減少食物浪費。", "sa": "【S】These items 【V】are often sold 【M】at a lower cost<br>📌 allowing… 為分詞構句表結果；allow + O + to V；cut down on「減少」。"}, {"en": "According to some estimates, a large percentage of fruits and vegetables grown on farms never reach store shelves simply because of their appearance, even though their taste and nutritional value are unaffected.", "zh": "根據一些估計，農場種植的蔬果中有很大比例，只因為外觀不佳就從未上架販售，即使它們的味道和營養價值完全不受影響。", "sa": "【S】a large percentage of fruits and vegetables 【V】never reach 【O】store shelves<br>📌 grown on farms 過去分詞後位修飾；even though「即使」。"}, {"en": "By partnering directly with local farms, restaurants can purchase this produce at a discount and create dishes that highlight fresh, seasonal ingredients.", "zh": "藉由直接和在地農場合作，餐廳能以折扣價購買這些農產品，並做出凸顯新鮮當季食材的料理。", "sa": "【S】restaurants 【V】can purchase 【O】this produce… and 【V】create 【O】dishes<br>📌 by + V-ing；that highlight… 修飾 dishes。"}, {"en": "Some chefs say that customers rarely notice any difference in taste, and many appreciate knowing that their meal helped reduce food waste.", "zh": "有些主廚說，顧客很少察覺味道有什麼不同，而且許多人很高興知道自己的這一餐有助於減少食物浪費。", "sa": "【S】Some chefs 【V】say 【O】that customers rarely notice…, and many appreciate knowing…<br>📌 appreciate + V-ing；help (to) + 原形 V。"}], "36": [{"en": "Most people assume that taking frequent breaks during work or study reduces productivity, but research suggests the opposite may be true.", "zh": "大多數人以為，在工作或讀書時經常休息會降低效率，但研究顯示事實可能正好相反。", "sa": "【S】Most people 【V】assume 【O】that taking frequent breaks… reduces productivity<br>📌 動名詞片語當主詞，動詞用單數；the opposite「相反的情況」。"}, {"en": "A well-known study found that participants who took short breaks every hour performed better on tasks requiring focus than those who worked straight through without stopping.", "zh": "一項知名研究發現，每小時短暫休息的受試者，在需要專注力的任務上，表現比一路不停工作的人更好。", "sa": "【S】A well-known study 【V】found 【O】that participants who… performed better… than those who…<br>📌 those who「那些……的人」；requiring focus 為現在分詞後位修飾 tasks。"}, {"en": "Researchers believe this is because the brain's ability to concentrate naturally declines over time, and brief breaks allow it to \"reset.\"", "zh": "研究人員認為，這是因為大腦的專注能力會隨著時間自然下降，而短暫的休息能讓它「重新設定」。", "sa": "【S】Researchers 【V】believe 【O】(that) this is because…<br>📌 This is because + 子句；allow + O + to V。"}, {"en": "Interestingly, the type of break matters as well — looking at a smartphone during a break was found to be less restorative than activities such as stretching, walking outside, or simply looking out a window.", "zh": "有趣的是，休息的方式也很重要——研究發現，休息時看手機的恢復效果，不如伸展、到戶外散步，或只是看看窗外等活動。", "sa": "【S】the type of break 【V】matters（matter 當動詞「重要」）<br>📌 動名詞片語當主詞；be found to be；less… than…。"}, {"en": "Based on these findings, some companies have begun encouraging employees to step away from their desks for a few minutes every hour, rather than working continuously until lunch.", "zh": "根據這些研究結果，有些公司已開始鼓勵員工每小時離開座位幾分鐘，而不是一路連續工作到午餐時間。", "sa": "【S】some companies 【V】have begun 【O】encouraging employees to step away…<br>📌 encourage + O + to V；rather than + V-ing「而不是」。"}], "39": [{"en": "When Hana was a teenager, she struggled to find clothes that fit her properly, since most stores only carried a limited range of sizes.", "zh": "Hana 十幾歲時，很難找到合身的衣服，因為大部分的店只賣有限的尺寸。", "sa": "【S】she 【V】struggled to find 【O】clothes 【M】that fit her properly<br>📌 when 子句表時間；since「因為」；struggle to V「很難……」。"}, {"en": "Frustrated by this experience, she began sewing her own clothes using fabric from secondhand shops.", "zh": "這段經歷讓她很挫折，於是她開始用二手店買來的布料自己縫衣服。", "sa": "【M】Frustrated by this experience 【S】she 【V】began sewing 【O】her own clothes<br>📌 過去分詞構句表原因（＝Because she was frustrated…）。"}, {"en": "At first, her designs were simple, but as she practiced, she developed a unique style that combined traditional patterns with modern cuts.", "zh": "一開始，她的設計很簡單，但隨著不斷練習，她發展出一種結合傳統圖案與現代剪裁的獨特風格。", "sa": "【S】she 【V】developed 【O】a unique style 【M】that combined traditional patterns with modern cuts<br>📌 as「隨著」；combine A with B「結合 A 與 B」。"}, {"en": "After posting photos of her creations online, she started receiving requests from people who wanted similar pieces made to fit their own bodies.", "zh": "她把作品的照片貼上網後，開始收到一些人的請求，希望她做出類似、合乎他們身形的衣服。", "sa": "【S】she 【V】started receiving 【O】requests 【M】from people who wanted similar pieces made to fit…<br>📌 after + V-ing；want + O + p.p.（被動）。"}, {"en": "Recognizing an opportunity, Hana opened a small studio where she offers custom-made clothing in a wide range of sizes, using sustainable fabrics whenever possible.", "zh": "Hana 看準了這個機會，開了一間小工作室，提供各種尺寸的訂製服裝，並盡可能使用環保永續的布料。", "sa": "【M】Recognizing an opportunity 【S】Hana 【V】opened 【O】a small studio 【M】where she offers…<br>📌 現在分詞構句；where 引導關係副詞子句。"}, {"en": "She also hosts free workshops to teach basic sewing skills to anyone interested, especially those who, like her, have had difficulty finding clothes that fit.", "zh": "她也舉辦免費工作坊，教任何有興趣的人基本的縫紉技巧，特別是那些和她一樣曾經很難找到合身衣服的人。", "sa": "【S】She 【V】hosts 【O】free workshops 【M】to teach basic sewing skills to anyone interested<br>📌 those who；have difficulty + V-ing。"}, {"en": "Hana hopes that her studio will encourage the fashion industry to become more inclusive of different body types.", "zh": "Hana 希望她的工作室能促使時尚產業更加包容不同的體型。", "sa": "【S】Hana 【V】hopes 【O】that her studio will encourage the fashion industry to become…<br>📌 encourage + O + to V；be inclusive of「包容」。"}]};

澆水習慣。\n❌ (B) 說好幾週沒澆水，與「花園看起來很棒」矛盾。\n❌ (C) 說考慮放棄花園，與「花園看起來很棒」矛盾。\n❌ (D) 說鄰居幫忙照顧，與 A 接著說「我也該更常澆水」不連貫。", "zh": "鄰居A：你的花園看起來好棒！你怎麼讓花長得這麼健康？<br>鄰居B：<b>我每天早上澆水，每週除一次草。<\/b><br>鄰居A：有道理。我也應該更規律地幫我的花澆水。", "sa": "空格句：【S】I 【V】water 【O】them 【M】every morning and 【V】remove 【O】the weeds 【M】weekly<br>📌 句型：現在簡單式表習慣；and 連接兩個動詞。<br>前句：How do you keep the flowers so healthy? → keep + O + 形容詞「使保持……」。", "on": ["Neighbor A 回應「這樣說得通，我也該更常澆水」，呼應 B 分享澆水習慣。", "說好幾週沒澆水，與「花園看起來很棒」矛盾。", "說考慮放棄花園，與「花園看起來很棒」矛盾。", "說鄰居幫忙照顧，與 A 接著說「我也該更常澆水」不連貫。"], "oz": ["我每天早上澆水，每週拔一次雜草。", "其實我已經好幾週沒澆水了。", "我在考慮不要這個花園了。", "我鄰居幫我照顧的。"]}, {"n": 15, "p": 1, "stem": "Student: Excuse me, professor. Could I ask for an extension on the essay?<br>Professor: _____<br>Student: Thank you so much. I really appreciate it.", "o": ["I'm afraid extensions are not allowed under any circumstances.", "Sure, you can have until next Monday.", "The essay was due last week.", "You should have started earlier."], "a": 1, "exp": "✓ (B) Sure, you can have until next Monday.— 學生回應「太感謝了」，呼應教授同意延期。\n❌ (A) 說「絕對不允許延期」，與學生「非常感謝」的回應矛盾。\n❌ (C) 說論文上週就到期了，與「同意延期」矛盾。\n❌ (D) 說「你應該早點開始」，語氣與「非常感謝」不符。", "zh": "學生：教授，不好意思，我可以申請報告延期嗎？<br>教授：<b>當然，你可以延到下週一。<\/b><br>學生：非常感謝您，真的很感激。", "sa": "空格句：【S】you 【V】can have (it) 【M】until next Monday<br>📌 句型：until「直到……」表期限。<br>前句：Could I ask for an extension on the essay? → Could I…? 禮貌請求；ask for「要求」。", "on": ["說「絕對不允許延期」，與學生「非常感謝」的回應矛盾。", "學生回應「太感謝了」，呼應教授同意延期。", "說論文上週就到期了，與「同意延期」矛盾。", "說「你應該早點開始」，語氣與「非常感謝」不符。"], "oz": ["恐怕無論如何都不能延期。", "可以，你可以延到下週一。", "這篇報告上週就該交了。", "你應該早點開始寫。"]}, {"n": 16, "p": 1, "stem": "Caller: Hi, I'd like to book a table for four this Saturday evening.<br>Staff: _____<br>Caller: 7:30 would be perfect.", "o": ["I'm sorry, we're fully booked this weekend.", "What time would you prefer, 7 or 7:30?", "Could you spell your last name for me?", "We don't accept reservations on Saturdays."], "a": 1, "exp": "✓ (B) What time would you prefer, 7 or 7:30?— 來電者回應「7:30 最好」，呼應服務人員詢問時間選項。\n❌ (A) 說「本週末已全部預訂滿」，與來電者選擇時間矛盾。\n❌ (C) 問如何拼姓氏，與來電者回答時間不連貫。\n❌ (D) 說「週六不接受訂位」，與來電者選擇時間矛盾。", "zh": "來電者：你好，我想訂這週六晚上四個人的位子。<br>服務人員：<b>您希望幾點，七點還是七點半？<\/b><br>來電者：七點半剛好。", "sa": "空格句：What time 【V】would 【S】you 【V】prefer, 7 or 7:30?<br>📌 句型：would prefer 禮貌詢問偏好；選擇疑問句 A or B。<br>前句：I'd like to book a table for four → would like to V「想要」；book a table「訂位」。", "on": ["說「本週末已全部預訂滿」，與來電者選擇時間矛盾。", "來電者回應「7:30 最好」，呼應服務人員詢問時間選項。", "問如何拼姓氏，與來電者回答時間不連貫。", "說「週六不接受訂位」，與來電者選擇時間矛盾。"], "oz": ["抱歉，我們這週末已經客滿了。", "您想要幾點，七點還是七點半？", "可以拼一下您的姓氏嗎？", "我們星期六不接受訂位。"]}, {"n": 17, "p": 1, "stem": "Coworker A: Have you tried the new coffee machine in the break room?<br>Coworker B: _____<br>Coworker A: I agree. It makes much better coffee than the old one.", "o": ["No, I prefer to bring my own coffee from home.", "Yes, it's so much faster and the coffee tastes great.", "I think the break room needs to be cleaned.", "We should buy a new microwave too."], "a": 1, "exp": "✓ (B) Yes, it's so much faster and the coffee tastes great.— Coworker A 回應「我同意，比舊的好喝多了」，呼應 B 對新咖啡機的稱讚。\n❌ (A) 說自己從家裡帶咖啡，與 A 的「我同意」回應不連貫。\n❌ (C) 說休息室需要打掃，與咖啡機話題無關。\n❌ (D) 提議買新微波爐，與話題無關。", "zh": "同事A：你試過休息室那台新咖啡機了嗎？<br>同事B：<b>試過了，它快多了，咖啡也很好喝。<\/b><br>同事A：我同意。它煮的咖啡比舊的好喝多了。", "sa": "空格句：【S】it 【V】's 【C】so much faster and 【S】the coffee 【V】tastes 【C】great<br>📌 句型：感官動詞 taste + 形容詞；much + 比較級加強語氣。<br>前句：Have you tried…? → 現在完成式問經驗。", "on": ["說自己從家裡帶咖啡，與 A 的「我同意」回應不連貫。", "Coworker A 回應「我同意，比舊的好喝多了」，呼應 B 對新咖啡機的稱讚。", "說休息室需要打掃，與咖啡機話題無關。", "提議買新微波爐，與話題無關。"], "oz": ["沒有，我比較喜歡從家裡帶咖啡。", "有啊，它快多了，咖啡也很好喝。", "我覺得休息室需要打掃了。", "我們也該買一台新的微波爐。"]}, {"n": 18, "p": 1, "stem": "Mother: Did you remember to feed the cat before you left?<br>Son: _____<br>Mother: Good. Don't forget to give her fresh water too.", "o": ["I forgot we even have a cat.", "Yes, I fed her right after breakfast.", "The cat ran away last week.", "I think the cat already ate twice today."], "a": 1, "exp": "✓ (B) Yes, I fed her right after breakfast.— 媽媽回應「很好，別忘了給牠新鮮的水」，呼應兒子已經餵過貓。\n❌ (A) 說忘記家裡有貓，與媽媽的「很好」回應矛盾。\n❌ (C) 說貓上週跑走了，與媽媽接著提到「給牠水」矛盾。\n❌ (D) 說貓今天已經吃了兩次，未直接回答「是否記得餵貓」且與媽媽回應不連貫。", "zh": "媽媽：你出門前有記得餵貓嗎？<br>兒子：<b>有，我吃完早餐就餵了。<\/b><br>媽媽：很好。別忘了也給牠新鮮的水。", "sa": "空格句：【S】I 【V】fed 【O】her 【M】right after breakfast<br>📌 句型：remember to V「記得去做」；feed 的過去式 fed。<br>回應句：Don't forget to give her fresh water → give + 人 + 物。", "on": ["說忘記家裡有貓，與媽媽的「很好」回應矛盾。", "媽媽回應「很好，別忘了給牠新鮮的水」，呼應兒子已經餵過貓。", "說貓上週跑走了，與媽媽接著提到「給牠水」矛盾。", "說貓今天已經吃了兩次，未直接回答「是否記得餵貓」且與媽媽回應不連貫。"], "oz": ["我都忘了我們有養貓。", "有，我吃完早餐就餵了。", "貓上週跑掉了。", "我想貓今天已經吃兩次了。"]}, {"n": 19, "p": 1, "stem": "Tour guide: We'll be stopping here for about thirty minutes. Feel free to take photos.<br>Tourist: _____<br>Tour guide: Of course, there's one just behind the gift shop.", "o": ["Is there a restroom nearby?", "How long is the whole tour?", "Can we buy souvenirs here?", "What time does the tour end?"], "a": 0, "exp": "✓ (A) Is there a restroom nearby?— 導遊回應「當然有，就在禮品店後面」，呼應遊客詢問廁所位置。\n❌ (B) 問整個行程多長，與導遊回答「禮品店後面」不符。\n❌ (C) 問是否能在這裡買紀念品，與導遊的回答（指向廁所位置）不符。\n❌ (D) 問行程何時結束，與導遊的回答不符。", "zh": "導遊：我們會在這裡停留大約三十分鐘，請隨意拍照。<br>遊客：<b>附近有洗手間嗎？<\/b><br>導遊：當然有，就在禮品店後面。", "sa": "空格句：Is there 【S】a restroom 【M】nearby?<br>📌 句型：There is 句型的疑問句 Is there + N?<br>回應句：there's one just behind the gift shop → one 代替 a restroom。", "on": ["導遊回應「當然有，就在禮品店後面」，呼應遊客詢問廁所位置。", "問整個行程多長，與導遊回答「禮品店後面」不符。", "問是否能在這裡買紀念品，與導遊的回答（指向廁所位置）不符。", "問行程何時結束，與導遊的回答不符。"], "oz": ["附近有洗手間嗎？", "整個行程要多久？", "我們可以在這裡買紀念品嗎？", "行程幾點結束？"]}, {"n": 20, "p": 1, "stem": "Roommate A: The Wi-Fi has been really slow all day.<br>Roommate B: _____<br>Roommate A: Good idea. Let's try that.", "o": ["Maybe we should restart the router.", "I think we should cancel the internet plan.", "The Wi-Fi password was changed yesterday.", "I already called the company about the bill."], "a": 0, "exp": "✓ (A) Maybe we should restart the router.— Roommate A 回應「好主意，我們來試試」，呼應 B 提出重啟路由器的建議。\n❌ (B) 建議取消網路方案，與「好主意，來試試」的正面回應不符（取消網路並非「可以嘗試」的小動作）。\n❌ (C) 說 Wi-Fi 密碼昨天被改了，未提出解決方案。\n❌ (D) 說已經打電話給網路公司詢問帳單，與「好主意，來試試」不連貫。", "zh": "室友A：網路一整天都好慢。<br>室友B：<b>也許我們應該重新啟動路由器。<\/b><br>室友A：好主意，我們試試看。", "sa": "空格句：【M】Maybe 【S】we 【V】should restart 【O】the router<br>📌 句型：Maybe we should + V 提出建議；Let's + V「我們來……」。<br>前句：The Wi-Fi has been really slow all day → 現在完成式表持續狀態。", "on": ["Roommate A 回應「好主意，我們來試試」，呼應 B 提出重啟路由器的建議。", "建議取消網路方案，與「好主意，來試試」的正面回應不符（取消網路並非「可以嘗試」的小動作）。", "說 Wi-Fi 密碼昨天被改了，未提出解決方案。", "說已經打電話給網路公司詢問帳單，與「好主意，來試試」不連貫。"], "oz": ["也許我們該重開一下路由器。", "我覺得我們該取消網路方案。", "Wi-Fi 密碼昨天改了。", "我已經打電話給公司問帳單的事了。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["collect", "collected", "collecting", "to collect"], "a": 1, "exp": "✓ (B) collected（過去分詞，被動修飾）— \"information collected during the day\" 表示「白天所蒐集到的資訊」，過去分詞作形容詞，修飾 information（被動關係：資訊是被蒐集的）。\n❌ (A) collect = 動詞原形，不能直接修飾名詞。\n❌ (C) collecting = 現在分詞，語意上會變成「正在蒐集的資訊」（主動），與文意不符。\n❌ (D) to collect = 不定詞表目的，語意不符。", "zh": "<i>During deep sleep, the body repairs muscles and tissues, while the brain processes information <b>collected<\/b> during the day.<\/i><br>在深層睡眠時，身體會修復肌肉與組織，而大腦則處理白天所蒐集的資訊。", "sa": "【M】During deep sleep 【S】the body 【V】repairs 【O】muscles and tissues<br>, while 【S】the brain 【V】processes 【O】information 【M】collected during the day<br>📌 句型：過去分詞片語後位修飾名詞（＝which is collected，表被動）；while 表對比「而……」。", "on": ["動詞原形，不能直接修飾名詞。", "\"information collected during the day\" 表示「白天所蒐集到的資訊」，過去分詞作形容詞，修飾 information（被動關係：資訊是被蒐集的）。", "現在分詞，語意上會變成「正在蒐集的資訊」（主動），與文意不符。", "不定詞表目的，語意不符。"], "oz": ["收集（原形動詞）", "被收集的（過去分詞，修飾 information）", "收集（現在分詞）", "去收集（不定詞）"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["but", "so", "or", "for"], "a": 0, "exp": "✓ (A) but（但是）— 「專家建議每晚睡7-9小時，但許多人因忙碌和睡前使用螢幕而達不到」，前後句為對比關係，用 but 連接。\n❌ (B) so = 所以，因果關係不符。\n❌ (C) or = 或者，語意不符。\n❌ (D) for = 因為（連接詞），語意上不構成因果關係。", "zh": "<i>Experts recommend that adults get between seven and nine hours of sleep each night, <b>but<\/b> many people fall short of this due to busy schedules and screen use before bed.<\/i><br>專家建議成人每晚睡七到九小時，但許多人因為行程忙碌和睡前使用螢幕而睡不到這個時數。", "sa": "【S】Experts 【V】recommend 【O】that adults (should) get…<br>, but 【S】many people 【V】fall short of 【O】this 【M】due to busy schedules…<br>📌 句型：recommend that + S + (should) 原形 V（get 用原形）；fall short of「未達到」；but 連接對比。", "on": ["「專家建議每晚睡7-9小時，但許多人因忙碌和睡前使用螢幕而達不到」，前後句為對比關係，用 but 連接。", "所以，因果關係不符。", "或者，語意不符。", "因為（連接詞），語意上不構成因果關係。"], "oz": ["但是（對等連接詞，表轉折）", "所以", "或者", "因為（對等連接詞）"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["hard", "hardly", "hardness", "hardening"], "a": 0, "exp": "✓ (A) hard（形容詞，困難的）— \"make it hard to fall asleep\" 為固定句型 make + it + 形容詞 + to V，表示「使入睡變得困難」。\n❌ (B) hardly = 副詞「幾乎不」，不能放在 it 之後作補語。\n❌ (C) hardness = 名詞「硬度」，語意與詞性皆不符。\n❌ (D) hardening = 動名詞/現在分詞「使變硬」，語意不符。", "zh": "<i>Studies have shown that exposure to bright screens late at night can make it <b>hard<\/b> to fall asleep, since the light interferes with the body's natural sleep signals.<\/i><br>研究顯示，深夜接觸明亮的螢幕會讓人難以入睡，因為光線會干擾身體自然的睡眠訊號。", "sa": "【S】Studies 【V】have shown 【O】that…<br>that 子句：【S】exposure to bright screens 【V】can make 【O】it 【C】hard 【M】to fall asleep<br>📌 句型：make + it（虛受詞）+ 形容詞 + to V（真受詞）；since「因為」。<br>例：The noise made it hard to study.", "on": ["\"make it hard to fall asleep\" 為固定句型 make + it + 形容詞 + to V，表示「使入睡變得困難」。", "副詞「幾乎不」，不能放在 it 之後作補語。", "名詞「硬度」，語意與詞性皆不符。", "動名詞/現在分詞「使變硬」，語意不符。"], "oz": ["困難的（形容詞，make it hard to V）", "幾乎不（副詞）", "堅硬；困難（名詞）", "變硬（現在分詞）"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["set", "sets", "setting", "to setting"], "a": 2, "exp": "✓ (C) setting（動名詞）— \"doctors suggest setting a consistent bedtime\" — suggest 後面接動名詞作受詞，表示「建議設定固定的睡覺時間」。\n❌ (A) set = 動詞原形，suggest 後不可直接接原形動詞。\n❌ (B) sets = 第三人稱單數，文法不符。\n❌ (D) to setting = 不定詞+動名詞的混合形式，文法上不存在。", "zh": "<i>To improve sleep quality, doctors suggest <b>setting<\/b> a consistent bedtime and avoiding caffeine in the evening.<\/i><br>為了改善睡眠品質，醫生建議設定固定的就寢時間，並在晚上避免攝取咖啡因。", "sa": "【M】To improve sleep quality（不定詞表目的）<br>【S】doctors 【V】suggest 【O】setting a consistent bedtime and avoiding caffeine<br>📌 句型：suggest + V-ing（動名詞當受詞）；and 連接兩個動名詞，形式對稱。", "on": ["動詞原形，suggest 後不可直接接原形動詞。", "第三人稱單數，文法不符。", "\"doctors suggest setting a consistent bedtime\" — suggest 後面接動名詞作受詞，表示「建議設定固定的睡覺時間」。", "不定詞+動名詞的混合形式，文法上不存在。"], "oz": ["設定（原形動詞）", "設定（第三人稱單數）", "設定（動名詞，suggest + V-ing）", "去設定（to＋V-ing，此處不合文法）"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["difference", "different", "differently", "differ"], "a": 1, "exp": "✓ (B) different（形容詞，不同的）— \"people from different backgrounds\" 表示「來自不同背景的人」，形容詞修飾名詞 backgrounds。\n❌ (A) difference = 名詞「差異」，詞性不符。\n❌ (C) differently = 副詞，不能修飾名詞。\n❌ (D) differ = 動詞「不同」，詞性不符。", "zh": "<i>By working with people from <b>different<\/b> backgrounds, volunteers learn to communicate effectively and solve problems creatively.<\/i><br>藉由和來自不同背景的人一起工作，志工學會有效溝通，並有創意地解決問題。", "sa": "【M】By working with people from different backgrounds<br>【S】volunteers 【V】learn 【O】to communicate effectively and (to) solve problems creatively<br>📌 句型：by + V-ing「藉由……」；形容詞 different 修飾名詞 backgrounds；learn to V「學會」。", "on": ["名詞「差異」，詞性不符。", "\"people from different backgrounds\" 表示「來自不同背景的人」，形容詞修飾名詞 backgrounds。", "副詞，不能修飾名詞。", "動詞「不同」，詞性不符。"], "oz": ["差異（名詞）", "不同的（形容詞）", "不同地（副詞）", "不同（動詞）"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["complete", "completing", "to complete", "completed"], "a": 2, "exp": "✓ (C) to complete（不定詞）— \"require + 受詞 + to V\" 為固定句型，\"require students to complete\" 表示「要求學生完成」。\n❌ (A) complete = 動詞原形，與 require 受詞後的句型不符。\n❌ (B) completing = 動名詞，require 受詞後不接動名詞。\n❌ (D) completed = 過去分詞，文法不符。", "zh": "<i>Some schools now require students <b>to complete<\/b> a certain number of volunteer hours before graduation.<\/i><br>現在有些學校要求學生在畢業前完成一定時數的志工服務。", "sa": "【S】Some schools 【V】require 【O】students 【C】to complete a certain number of volunteer hours 【M】before graduation<br>📌 句型：require + O + to V「要求某人做某事」；a certain number of + 複數名詞「一定數量的」。", "on": ["動詞原形，與 require 受詞後的句型不符。", "動名詞，require 受詞後不接動名詞。", "\"require + 受詞 + to V\" 為固定句型，\"require students to complete\" 表示「要求學生完成」。", "過去分詞，文法不符。"], "oz": ["完成（原形動詞）", "完成（動名詞）", "去完成（不定詞，require sb to V）", "已完成的（過去分詞）"]}, {"n": 27, "p": 2, "stem": "(27)", "o": ["unless", "once", "although", "before"], "a": 1, "exp": "✓ (B) once（一旦…就）— \"most come to appreciate the experience once they have completed it\" 表示「一旦完成後，大多數學生便會欣賞這段經歷」，語意通順。\n❌ (A) unless = 除非，語意不符（並非「除非完成才欣賞」的條件關係）。\n❌ (C) although = 雖然，語意上不構成讓步關係。\n❌ (D) before = 在…之前，與「完成之後才欣賞」的時間順序相反。", "zh": "<i>While a few students view this requirement as a burden, most come to appreciate the experience <b>once<\/b> they have completed it.<\/i><br>雖然少數學生把這項規定視為負擔，但大多數人一旦完成之後，就會開始珍惜這段經驗。", "sa": "【M】While a few students view this requirement as a burden（while＝雖然）<br>【S】most 【V】come to appreciate 【O】the experience 【M】once they have completed it<br>📌 句型：view A as B「把 A 視為 B」；come to V「漸漸開始……」；once「一旦……就」。", "on": ["除非，語意不符（並非「除非完成才欣賞」的條件關係）。", "\"most come to appreciate the experience once they have completed it\" 表示「一旦完成後，大多數學生便會欣賞這段經歷」，語意通順。", "雖然，語意上不構成讓步關係。", "在…之前，與「完成之後才欣賞」的時間順序相反。"], "oz": ["除非", "一旦", "雖然", "在……之前"]}, {"n": 28, "p": 2, "stem": "(28)", "o": ["as valuable as", "more valuable than", "less valuable than", "valuable enough for"], "a": 1, "exp": "✓ (B) more valuable than（比較級）— \"were more valuable than anything they learned in the classroom\" 表示「比他們在課堂上學到的任何東西都更有價值」，為比較級的標準用法。\n❌ (A) as valuable as = 表示「一樣有價值」，與文意強調「友誼與經驗更勝課堂所學」不符。\n❌ (C) less valuable than = 表示「較不重要」，語意相反。\n❌ (D) valuable enough for = 文法與語意皆不符此處的比較句構。", "zh": "<i>In fact, many former volunteers say that the friendships and lessons they gained were <b>more valuable than<\/b> anything they learned in the classroom.<\/i><br>事實上，許多曾當過志工的人說，他們獲得的友誼和收穫，比在課堂上學到的任何東西都更有價值。", "sa": "【S】many former volunteers 【V】say 【O】that…<br>that 子句：【S】the friendships and lessons (that) they gained 【V】were 【C】more valuable than anything…<br>📌 句型：比較級 + than anything 表最高級意涵；省略受格關代 that 的形容詞子句。", "on": ["表示「一樣有價值」，與文意強調「友誼與經驗更勝課堂所學」不符。", "\"were more valuable than anything they learned in the classroom\" 表示「比他們在課堂上學到的任何東西都更有價值」，為比較級的標準用法。", "表示「較不重要」，語意相反。", "文法與語意皆不符此處的比較句構。"], "oz const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "在做出最終決定之前，我們應該考慮所有可能的選項。<br><span class=\"blankline\">Before making a final d<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① , we should c<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② all the possible options.<\/span>", "ans": "① <b>decision<\/b>　② <b>consider<\/b>", "exp": "① decision（決定）— 依提示字首 d 及句意「做出最終決定」。\n② consider（考慮）— 依提示字首 c 及句意「考慮所有可能的選項」。", "zh": "① decision「決定」　② consider「考慮」<br>全句：在做出最終決定之前，我們應該考慮所有可能的選項。", "sa": "參考句：Before making a final <b>decision<\/b>, we should <b>consider<\/b> all possible options.<br>【M】Before making a final decision 【S】we 【V】should consider 【O】all possible options<br>📌 句型：before + V-ing；make a decision「做決定」；should + 原形 V。"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>has increased / over the past decade / the number of / significantly / electric cars on the road<\/i>", "ans": "The number of electric cars on the road has increased significantly over the past decade.", "exp": "句構：主詞 (The number of electric cars on the road) + has increased significantly（現在完成時，表示持續到現在的變化）+ over the past decade（時間副詞，表示「過去十年間」）。", "zh": "道路上的電動車數量在過去十年間大幅增加。", "sa": "【S】The number of electric cars on the road 【V】has increased 【M】significantly over the past decade<br>📌 句型：the number of + 複數名詞，動詞用單數（has）；現在完成式 + over the past + 時間，表到目前為止的變化。<br>比較：A number of cars are…（許多車，動詞用複數）。"}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>如果你每天練習英語會話，你的口說能力就會進步。", "ans": "If you practice English conversation every day, your speaking ability will improve.", "exp": "重點結構：if 條件句，現在簡單式 (practice) + 主要子句用 will + 動詞原形 (will improve)，表示條件達成後的未來結果。", "zh": "題意：如果你每天練習英文會話，你的口說能力就會進步。", "sa": "【M】If you practice English conversation every day<br>【S】your speaking ability 【V】will improve<br>📌 句型：條件句 If + 現在式, S + will + 原形 V（if 子句用現在式代替未來式）；improve 在此為不及物動詞「進步」。"}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();

<script>
/* ================= ✏️ 老師手寫 =================

(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}

  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}

  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;

  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}

  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';

  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];

  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);

  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}

  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};

  let tp=null;

  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

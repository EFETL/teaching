<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}
</style>

<div class="wrap">

    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nReading before bed has long been recommended as a way to relax and improve sleep quality. Unlike screens, which emit blue light that can interfere with the body's natural sleep cycle, books <span class=\"blk\">21</span> no such light and therefore do not disturb the brain's production of melatonin, a hormone <span class=\"blk\">22</span> helps regulate sleep. In addition to its physical benefits, reading can also reduce stress by allowing the mind <span class=\"blk\">23</span> escape from daily worries and focus on a different world. Experts suggest that even just ten minutes of reading each night can make it easier <span class=\"blk\">24</span> fall asleep.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nCommunity gardens have become increasingly popular in cities around the world, offering residents a space <span class=\"blk\">25</span> they can grow their own vegetables and flowers. These gardens not only provide fresh produce but also create opportunities for neighbors <span class=\"blk\">26</span> meet and build relationships. Some studies have found that people who garden regularly report feeling less stressed and more connected to their community. <span class=\"blk\">27</span> the many benefits, however, community gardens require ongoing maintenance, and without enough volunteers, they can quickly fall into disrepair. City planners hope that by <span class=\"blk\">28</span> more land for community gardens, they can encourage healthier and more connected neighborhoods.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Library Notice</b><br><br>Starting next week, the library will extend its weekday hours, staying open until 9 PM instead of 7 PM, to better accommodate students preparing for exams. Weekend hours remain unchanged (10 AM–5 PM). The quiet study room on the second floor will also be available for reservation up to two weeks in advance through the library's website.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Mia: Are we still on for dinner tonight at 7? Leo: Actually, something came up at work. Can we push it to 8? Mia: Sure, that works for me. Should I make a reservation? Leo: Yes, please. Somewhere not too far from the office would be great.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nIn recent years, more city dwellers have taken up beekeeping, placing hives on rooftops and in backyards. Urban beekeeping offers several benefits: bees help pollinate gardens and parks, producing healthier plants, and the honey produced in cities is often surprisingly diverse in flavor due to the variety of flowers available in urban areas. However, urban beekeeping also comes with challenges. Bees need a reliable source of water and flowering plants nearby, which can be difficult to guarantee in heavily built-up areas. Additionally, some neighbors may be concerned about safety, even though most bees used in beekeeping are not aggressive unless their hive is directly disturbed. To address these concerns, many cities now offer beekeeping classes and require beekeepers to register their hives, ensuring that hives are properly maintained and placed at a safe distance from public areas.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nThe placebo effect refers to a phenomenon in which a person experiences a real improvement in their condition after receiving a treatment that has no actual medical effect, such as a sugar pill. Researchers believe the effect occurs because the brain, expecting the treatment to work, releases chemicals that can genuinely reduce pain or other symptoms. Interestingly, studies have shown that the placebo effect can be influenced by factors such as the color of a pill, the cost of the treatment, or even the confidence of the doctor administering it. While the placebo effect cannot cure serious illnesses, it has led some researchers to explore how a patient's mindset and expectations might be used alongside traditional medicine to improve treatment outcomes.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nAfter working for over a decade as an accountant, Marco decided to make a major change in his life. He had always enjoyed woodworking as a hobby, spending his evenings and weekends building small furniture pieces for friends and family. When a friend asked to buy one of his handmade tables, Marco realized there might be a market for his work. He began selling his furniture at local craft fairs on weekends while continuing his accounting job during the week. As demand grew, Marco gradually reduced his hours at the accounting firm and eventually left to open his own small workshop. Although his income was less predictable than his accounting salary, Marco found that he was far happier spending his days building furniture by hand. He now also offers weekend classes for beginners who want to learn basic woodworking skills, hoping to pass on his passion to others.</div>"};
const PTR = {"21": [{"en": "Reading before bed has long been recommended as a way to relax and improve sleep quality.", "zh": "睡前閱讀長久以來一直被推薦為放鬆和改善睡眠品質的方法。", "sa": "【S】Reading before bed（動名詞主詞） 【V】has long been recommended 【M】as a way to relax…<br>📌 現在完成式被動 has been p.p."}, {"en": "Unlike screens, which emit blue light that can interfere with the body's natural sleep cycle, books <b>emit<\/b> no such light and therefore do not disturb the brain's production of melatonin, a hormone <b>which<\/b> helps regulate sleep.", "zh": "和會發出藍光、可能干擾身體自然睡眠週期的螢幕不同，書本不會發出這種光，因此不會干擾大腦分泌褪黑激素——一種幫助調節睡眠的荷爾蒙。", "sa": "【S】books 【V】emit 【O】no such light and therefore do not disturb…<br>📌 unlike + N；非限定 which 子句；a hormone which… 為 melatonin 的同位語"}, {"en": "In addition to its physical benefits, reading can also reduce stress by allowing the mind <b>to escape<\/b> from daily worries and focus on a different world.", "zh": "除了對身體的好處，閱讀還能讓心思逃離日常煩惱、專注於另一個世界，藉此減輕壓力。", "sa": "【S】reading 【V】can reduce 【O】stress 【M】by allowing the mind to escape…<br>📌 allow + O + to V；by + V-ing"}, {"en": "Experts suggest that even just ten minutes of reading each night can make it easier <b>to fall<\/b> asleep.", "zh": "專家建議，即使每晚只讀十分鐘，也能讓人更容易入睡。", "sa": "【S】Experts 【V】suggest 【O】that…<br>📌 make it + adj. + to V（虛受詞 it）"}], "25": [{"en": "Community gardens have become increasingly popular in cities around the world, offering residents a space <b>where<\/b> they can grow their own vegetables and flowers.", "zh": "社區花園在世界各地的城市越來越受歡迎，為居民提供一個可以種自己的蔬菜和花卉的空間。", "sa": "【S】Community gardens 【V】have become 【C】increasingly popular<br>📌 offering… 分詞構句；where 修飾 a space"}, {"en": "These gardens not only provide fresh produce but also create opportunities for neighbors <b>to meet<\/b> and build relationships.", "zh": "這些花園不只提供新鮮農產品，也為鄰居創造相識並建立關係的機會。", "sa": "【S】These gardens 【V】not only provide… but also create…<br>📌 not only A but also B；for + 人 + to V"}, {"en": "Some studies have found that people who garden regularly report feeling less stressed and more connected to their community.", "zh": "有些研究發現，經常從事園藝的人表示自己壓力較小，也和社區更有連結。", "sa": "【S】Some studies 【V】have found 【O】that people who garden regularly report feeling…<br>📌 who 子句修飾 people；report + V-ing"}, {"en": "<b>Despite<\/b> the many benefits, however, community gardens require ongoing maintenance, and without enough volunteers, they can quickly fall into disrepair.", "zh": "然而，儘管好處很多，社區花園需要持續維護，如果志工不夠，很快就會荒廢失修。", "sa": "【S】community gardens 【V】require 【O】ongoing maintenance<br>📌 despite + N；fall into disrepair（年久失修）"}, {"en": "City planners hope that by <b>allocating<\/b> more land for community gardens, they can encourage healthier and more connected neighborhoods.", "zh": "城市規劃者希望藉由撥出更多土地給社區花園，促成更健康、關係更緊密的社區。", "sa": "【S】City planners 【V】hope 【O】that… they can encourage…<br>📌 by + V-ing（藉由…）"}], "29": [{"en": "Library Notice", "zh": "圖書館公告", "sa": "標題，名詞片語"}, {"en": "Starting next week, the library will extend its weekday hours, staying open until 9 PM instead of 7 PM, to better accommodate students preparing for exams.", "zh": "從下週開始，圖書館將延長平日開放時間，開到晚上 9 點而不是 7 點，以便更方便準備考試的學生。", "sa": "【S】the library 【V】will extend 【O】its weekday hours<br>📌 staying open… 分詞構句；to V 表目的；preparing for exams 修飾 students"}, {"en": "Weekend hours remain unchanged (10 AM–5 PM).", "zh": "週末開放時間不變（上午 10 點至下午 5 點）。", "sa": "【S】Weekend hours 【V】remain 【C】unchanged<br>📌 remain + adj.（保持…）"}, {"en": "The quiet study room on the second floor will also be available for reservation up to two weeks in advance through the library's website.", "zh": "二樓的安靜自習室也可以透過圖書館網站，最早提前兩週預約。", "sa": "【S】The quiet study room on the second floor 【V】will be 【C】available for reservation<br>📌 up to（最多）；in advance（事先）"}], "31": [{"en": "Text Messages", "zh": "簡訊", "sa": "標題，名詞片語"}, {"en": "Mia: Are we still on for dinner tonight at 7?", "zh": "Mia：我們今晚 7 點的晚餐還照約嗎？", "sa": "【V】Are 【S】we 【C】still on…?<br>📌 be on（〈約定〉照常進行）"}, {"en": "Leo: Actually, something came up at work. Can we push it to 8?", "zh": "Leo：其實，工作上臨時有事。我們可以延到 8 點嗎？", "sa": "【S】something 【V】came up；【S】we 【V】push 【O】it 【M】to 8<br>📌 come up（臨時發生）；push A to B（把 A 延到 B）"}, {"en": "Mia: Sure, that works for me. Should I make a reservation?", "zh": "Mia：好啊，我可以。要我訂位嗎？", "sa": "【S】that 【V】works 【M】for me<br>📌 work for + 人（對某人來說可行）；make a reservation（訂位）"}, {"en": "Leo: Yes, please. Somewhere not too far from the office would be great.", "zh": "Leo：好，麻煩妳。離辦公室不太遠的地方就很好。", "sa": "【S】Somewhere not too far from the office 【V】would be 【C】great<br>📌 形容詞片語後置修飾 somewhere"}], "33": [{"en": "In recent years, more city dwellers have taken up beekeeping, placing hives on rooftops and in backyards.", "zh": "近幾年，越來越多城市居民開始養蜂，把蜂巢放在屋頂和後院。", "sa": "【S】more city dwellers 【V】have taken up 【O】beekeeping<br>📌 take up（開始從事〈嗜好〉）；placing… 分詞構句"}, {"en": "Urban beekeeping offers several benefits: bees help pollinate gardens and parks, producing healthier plants, and the honey produced in cities is often surprisingly diverse in flavor due to the variety of flowers available in urban areas.", "zh": "都市養蜂有幾個好處：蜜蜂幫花園和公園授粉，讓植物長得更健康；而且由於都市裡可採的花種類繁多，城市生產的蜂蜜風味往往出乎意料地多樣。", "sa": "【S】Urban beekeeping 【V】offers 【O】several benefits<br>📌 冒號後說明；produced in cities 過去分詞修飾 honey；due to + N"}, {"en": "However, urban beekeeping also comes with challenges.", "zh": "然而，都市養蜂也伴隨著挑戰。", "sa": "【S】urban beekeeping 【V】comes with 【O】challenges<br>📌 come with（伴隨…）"}, {"en": "Bees need a reliable source of water and flowering plants nearby, which can be difficult to guarantee in heavily built-up areas.", "zh": "蜜蜂需要附近有穩定的水源和開花植物，而這在建築密集的地區可能很難保證。", "sa": "【S】Bees 【V】need 【O】a reliable source of water and flowering plants nearby<br>📌 , which 代替前面整件事；be difficult to V"}, {"en": "Additionally, some neighbors may be concerned about safety, even though most bees used in beekeeping are not aggressive unless their hive is directly disturbed.", "zh": "此外，有些鄰居可能擔心安全問題，儘管養蜂所用的大多數蜜蜂除非蜂巢被直接干擾，否則並不具攻擊性。", "sa": "【S】some neighbors 【V】may be 【C】concerned about safety<br>📌 even though（儘管）；unless（除非）；used in beekeeping 修飾 bees"}, {"en": "To address these concerns, many cities now offer beekeeping classes and require beekeepers to register their hives, ensuring that hives are properly maintained and placed at a safe distance from public areas.", "zh": "為了處理這些疑慮，許多城市現在開設養蜂課程，並要求養蜂人登記蜂巢，以確保蜂巢受到妥善維護，並放在距離公共區域安全的地方。", "sa": "【M】To address these concerns 【S】many cities 【V】offer… and require 【O】beekeepers 【C】to register their hives<br>📌 require + O + to V；ensuring that… 分詞構句表結果"}], "36": [{"en": "The placebo effect refers to a phenomenon in which a person experiences a real improvement in their condition after receiving a treatment that has no actual medical effect, such as a sugar pill.", "zh": "安慰劑效應指的是一種現象：一個人在接受沒有實際醫療效果的治療（例如糖錠）後，病情真的出現改善。", "sa": "【S】The placebo effect 【V】refers to 【O】a phenomenon 【M】in which…<br>📌 介系詞＋關係代名詞 in which；that 子句修飾 treatment"}, {"en": "Researchers believe the effect occurs because the brain, expecting the treatment to work, releases chemicals that can genuinely reduce pain or other symptoms.", "zh": "研究人員認為，這種效應之所以發生，是因為大腦預期治療會有效，便釋放出真的能減輕疼痛或其他症狀的化學物質。", "sa": "【S】Researchers 【V】believe 【O】(that) the effect occurs because the brain… releases chemicals<br>📌 插入分詞片語 expecting…；expect + O + to V"}, {"en": "Interestingly, studies have shown that the placebo effect can be influenced by factors such as the color of a pill, the cost of the treatment, or even the confidence of the doctor administering it.", "zh": "有趣的是，研究顯示安慰劑效應會受到一些因素影響，例如藥丸的顏色、治療的費用，甚至是給藥醫師的自信程度。", "sa": "【S】studies 【V】have shown 【O】that the placebo effect can be influenced by factors…<br>📌 助動詞被動 can be p.p.；such as 列舉"}, {"en": "While the placebo effect cannot cure serious illnesses, it has led some researchers to explore how a patient's mindset and expectations might be used alongside traditional medicine to improve treatment outcomes.", "zh": "雖然安慰劑效應無法治癒重病，它卻促使一些研究人員探索，如何把病人的心態和期待與傳統醫學搭配運用，以改善治療成效。", "sa": "【M】While… 【S】it 【V】has led 【O】some researchers 【C】to explore how…<br>📌 while 表讓步（雖然）；lead + O + to V；間接問句"}], "39": [{"en": "After working for over a decade as an accountant, Marco decided to make a major change in his life.", "zh": "當了十多年的會計師後，Marco 決定在人生中做一個重大改變。", "sa": "【S】Marco 【V】decided 【O】to make a major change<br>📌 after + V-ing；as + 職業"}, {"en": "He had always enjoyed woodworking as a hobby, spending his evenings and weekends building small furniture pieces for friends and family.", "zh": "他一直很喜歡把木工當作嗜好，晚上和週末都花在為親友做小件家具上。", "sa": "【S】He 【V】had always enjoyed 【O】woodworking<br>📌 過去完成式；spend + 時間 + V-ing"}, {"en": "When a friend asked to buy one of his handmade tables, Marco realized there might be a market for his work.", "zh": "當一位朋友想買他手工做的一張桌子時，Marco 意識到他的作品可能有市場。", "sa": "【M】When… 【S】Marco 【V】realized 【O】(that) there might be a market…<br>📌 there be 句型＋助動詞 might"}, {"en": "He began selling his furniture at local craft fairs on weekends while continuing his accounting job during the week.", "zh": "他開始在週末到當地工藝市集賣家具，平日則繼續做會計工作。", "sa": "【S】He 【V】began 【O】selling his furniture<br>📌 begin + V-ing；while + V-ing（同時…）"}, {"en": "As demand grew, Marco gradually reduced his hours at the accounting firm and eventually left to open his own small workshop.", "zh": "隨著需求增加，Marco 逐漸減少在會計事務所的工時，最後離職開了自己的小工作室。", "sa": "【M】As demand grew 【S】Marco 【V】reduced… and left<br>📌 as 表「隨著」；to V 表目的"}, {"en": "Although his income was less predictable than his accounting salary, Marco found that he was far happier spending his days building furniture by hand.", "zh": "雖然他的收入不像當會計師時的薪水那麼穩定，Marco 發現每天親手做家具讓他快樂得多。", "sa": "【M】Although… 【S】Marco 【V】found 【O】that he was far happier…<br>📌 far + 比較級（…得多）；by hand（手工）"}, {"en": "He now also offers weekend classes for beginners who want to learn basic woodworking skills, hoping to pass on his passion to others.", "zh": "他現在也為想學基本木工技巧的初學者開設週末課程，希望把他的熱情傳承給別人。", "sa": "【S】He 【V】offers 【O】weekend classes 【M】for beginners who…<br>📌 who 子句修飾 beginners；hoping… 分詞構句；pass on A to B"}]};
const Q = [{"n": 1, "p": 0, "stem": "The manager decided to _____ the meeting until next week due to scheduling conflicts.", "o": ["postpone", "propose", "provide", "protect"], "a": 0, "exp": "✓ (A) postpone（延期）— 經理因行程衝突決定將會議「延期」至下週。\n❌ (B) propose = 提議，語意不符。\n❌ (C) provide = 提供，語意不符。\n❌ (D) protect = 保護，語意不符。", "zh": "由於行程衝突，經理決定把會議延到下週。", "sa": "【S】The manager 【V】decided 【O】to postpone the meeting 【M】until next week 【M】due to scheduling conflicts<br>📌 句型：decide to V（決定做…）；due to + N（由於…）；postpone A until B（把 A 延到 B）<br>例：The game was postponed due to rain."}, {"n": 2, "p": 0, "stem": "She felt a sense of _____ after finally finishing the marathon she had trained for months.", "o": ["accomplishment", "accusation", "acquisition", "admission"], "a": 0, "exp": "✓ (A) accomplishment（成就感）— 完成訓練多月的馬拉松後，她感到一股「成就感」。\n❌ (B) accusation = 指控，語意不符。\n❌ (C) acquisition = 取得、收購，語意不符。\n❌ (D) admission = 入學許可、承認，語意不符。", "zh": "她在終於跑完訓練了好幾個月的馬拉松之後，有一種成就感。", "sa": "【S】She 【V】felt 【O】a sense of accomplishment 【M】after finally finishing the marathon (that) she had trained for months<br>📌 句型：a sense of + N（…的感覺）；after + V-ing；過去完成式 had trained 表更早發生<br>例：Volunteering gives me a sense of purpose."}, {"n": 3, "p": 0, "stem": "The museum's new exhibit _____ visitors with its stunning collection of ancient artifacts.", "o": ["impresses", "imposes", "implies", "imitates"], "a": 0, "exp": "✓ (A) impresses（使印象深刻）— 博物館的新展覽以其驚人的古文物收藏「使」訪客「印象深刻」。\n❌ (B) imposes = 強加，語意不符。\n❌ (C) implies = 暗示，語意不符。\n❌ (D) imitates = 模仿，語意不符。", "zh": "博物館的新展覽以令人驚豔的古文物收藏讓參觀者印象深刻。", "sa": "【S】The museum's new exhibit 【V】impresses 【O】visitors 【M】with its stunning collection of ancient artifacts<br>📌 句型：impress + 人 + with + N（以…讓某人印象深刻）；主詞 exhibit 單數 → impresses<br>例：She impressed the judges with her voice."}, {"n": 4, "p": 0, "stem": "Due to the storm, the flight was _____ for two hours before finally departing.", "o": ["delayed", "divided", "doubled", "decorated"], "a": 0, "exp": "✓ (A) delayed（被延誤）— 由於暴風雨，班機被「延誤」兩小時才終於起飛。\n❌ (B) divided = 被分割，語意不符。\n❌ (C) doubled = 被加倍，語意不符。\n❌ (D) decorated = 被裝飾，語意不符。", "zh": "由於暴風雨，班機延誤了兩個小時才終於起飛。", "sa": "【M】Due to the storm 【S】the flight 【V】was delayed 【M】for two hours 【M】before finally departing<br>📌 句型：be delayed（被延誤，被動語態）；before + V-ing<br>例：The train was delayed by heavy snow."}, {"n": 5, "p": 0, "stem": "The company is looking for a candidate who is both _____ and detail-oriented.", "o": ["reliable", "realistic", "relative", "reluctant"], "a": 0, "exp": "✓ (A) reliable（可靠的）— 公司正在尋找既「可靠」又注重細節的人才。\n❌ (B) realistic = 現實的，語意不符。\n❌ (C) relative = 相對的，語意不符。\n❌ (D) reluctant = 不情願的，語意不符。", "zh": "這家公司正在尋找一位既可靠又注重細節的應徵者。", "sa": "【S】The company 【V】is looking for 【O】a candidate 【M】who is both reliable and detail-oriented<br>📌 句型：關係代名詞 who 修飾 candidate；both A and B（A 和 B 兩者都）<br>例：He is both smart and hardworking."}, {"n": 6, "p": 0, "stem": "The teacher gave clear _____ on how to complete the assignment.", "o": ["instructions", "inspections", "institutions", "intentions"], "a": 0, "exp": "✓ (A) instructions（指示、說明）— 老師針對如何完成作業給予清楚的「說明」。\n❌ (B) inspections = 檢查，語意不符。\n❌ (C) institutions = 機構，語意不符。\n❌ (D) intentions = 意圖，語意不符。", "zh": "老師針對如何完成這份作業給了清楚的指示。", "sa": "【S】The teacher 【V】gave 【O】clear instructions 【M】on how to complete the assignment<br>📌 句型：give instructions on + N（針對…給指示）；how to V（如何做…，疑問詞＋不定詞當名詞）<br>例：Do you know how to use this machine?"}, {"n": 7, "p": 0, "stem": "He was _____ for his outstanding contribution to the project.", "o": ["recognized", "recovered", "recorded", "recalled"], "a": 0, "exp": "✓ (A) recognized（被表揚、被認可）— 他因對專案的卓越貢獻而「被表揚」。\n❌ (B) recovered = 康復、恢復，語意不符。\n❌ (C) recorded = 被記錄，語意不符。\n❌ (D) recalled = 被召回、回想，語意不符。", "zh": "他因為對這個專案的傑出貢獻而受到表揚。", "sa": "【S】He 【V】was recognized 【M】for his outstanding contribution to the project<br>📌 句型：be recognized for + N（因…受到肯定、表揚，被動語態）；contribution to + N（對…的貢獻）<br>例：She was recognized for her hard work."}, {"n": 8, "p": 0, "stem": "The bridge was built to _____ the river that divided the two towns.", "o": ["cross", "crash", "crowd", "crush"], "a": 0, "exp": "✓ (A) cross（橫越）— 這座橋是為了「橫越」分隔兩座城鎮的河流而建造的。\n❌ (B) crash = 撞毀，語意不符。\n❌ (C) crowd = 群聚、擠滿，語意不符。\n❌ (D) crush = 壓碎，語意不符。", "zh": "這座橋是為了跨越那條把兩個小鎮隔開的河而建的。", "sa": "【S】The bridge 【V】was built 【M】to cross the river 【M】that divided the two towns<br>📌 句型：be built to V（為了…而建，to V 表目的）；that 引導形容詞子句修飾 the river<br>例：The tunnel was built to connect the two cities."}, {"n": 9, "p": 0, "stem": "The lecture was so <i>tedious<\/i> that several students fell asleep.", "o": ["interesting", "boring", "short", "difficult"], "a": 1, "exp": "✓ (B) boring（無聊的）— tedious（冗長乏味的）與 boring 意義最接近。\n❌ (A) interesting = 有趣的，語意相反。\n❌ (C) short = 短的，語意不符。\n❌ (D) difficult = 困難的，語意不符。", "zh": "那堂課冗長乏味到好幾個學生都睡著了。", "sa": "【S】The lecture 【V】was 【C】so tedious 【M】that several students fell asleep<br>📌 句型：so + adj. + that + 子句（如此…以致於…）；fall asleep（睡著）<br>例：The movie was so boring that I left early."}, {"n": 10, "p": 0, "stem": "The new regulation will <i>gradually<\/i> take effect over the next six months.", "o": ["suddenly", "slowly", "immediately", "rarely"], "a": 1, "exp": "✓ (B) slowly（緩慢地）— gradually（逐漸地）與 slowly 意義最接近。\n❌ (A) suddenly = 突然地，語意相反。\n❌ (C) immediately = 立即地，語意相反。\n❌ (D) rarely = 很少地，語意不符。", "zh": "新規定將在接下來六個月內逐步生效。", "sa": "【S】The new regulation 【V】will take effect 【M】gradually 【M】over the next six months<br>📌 句型：take effect（生效）＝ come into effect；over + 一段時間（在…期間內）<br>例：Prices will rise gradually over the next year."}, {"n": 11, "p": 1, "stem": "Customer: This shirt has a stain on it. Can I exchange it for a new one?<br>Clerk: _____<br>Customer: That's great, thank you.", "o": ["We don't have any other shirts in stock.", "Sure, let me get you a new one from the back.", "I'm afraid all sales are final.", "You should have checked it before buying."], "a": 1, "exp": "✓ (B) Sure, let me get you a new one from the back.— 顧客回應「太好了，謝謝」，呼應店員同意更換新品。\n❌ (A) 說「我們沒有其他庫存了」，與顧客回應「太好了」矛盾。\n❌ (C) 說「恐怕一律不能退換」，與顧客回應「太好了，謝謝」矛盾。\n❌ (D) 說「你買之前應該先檢查」，語氣指責且與顧客的感謝回應不連貫。", "zh": "Customer：這件襯衫上有污漬。我可以換一件新的嗎？<br>Clerk：當然，我去後面幫您拿一件新的。<br>Customer：太好了，謝謝。", "sa": "【V】let 【O】me 【C】get you a new one 【M】from the back<br>【助V】Can 【S】I 【V】exchange 【O】it 【M】for a new one?<br>📌 句型：exchange A for B（把 A 換成 B）；let + O + 原形動詞；get + 人 + 物（雙受詞）"}, {"n": 12, "p": 1, "stem": "Coworker A: I heard the printer on the third floor is broken again.<br>Coworker B: _____<br>Coworker A: Thanks, that would really help.", "o": ["I'll call IT to take a look at it.", "The printer was just replaced last month.", "I never use that printer anyway.", "We should throw it away."], "a": 0, "exp": "✓ (A) I'll call IT to take a look at it.— 同事A回應「謝謝，那真的很有幫助」，呼應同事B主動表示會找IT處理。\n❌ (B) 說「印表機上個月才換新的」，與A回應「謝謝，那很有幫助」不連貫。\n❌ (C) 說「我反正都不用那台印表機」，與A的感謝回應不連貫。\n❌ (D) 說「我們應該把它丟了」，與A的感謝回應不連貫。", "zh": "Coworker A：我聽說三樓的印表機又壞了。<br>Coworker B：我會打電話請 IT 來看看。<br>Coworker A：謝謝，那真的幫了大忙。", "sa": "【S】I 【V】'll call 【O】IT 【M】to take a look at it<br>📌 句型：to V 表目的；take a look at + N（看一下）；I heard (that)…（我聽說…）<br>例：Let me take a look at your homework."}, {"n": 13, "p": 1, "stem": "Doctor: How long have you had this headache?<br>Patient: _____<br>Doctor: Let's run a few tests to find out what's causing it.", "o": ["I think I need new glasses.", "It started about three days ago.", "My family doctor moved away.", "I haven't seen a doctor in years."], "a": 1, "exp": "✓ (B) It started about three days ago.— 病人回答頭痛持續的時間，呼應醫生詢問「多久了」。\n❌ (A) 說「我想我需要新眼鏡」，未回答「多久了」的問題。\n❌ (C) 說「我的家庭醫生搬走了」，與醫生詢問頭痛時長不連貫。\n❌ (D) 說「我好幾年沒看醫生了」，未回答頭痛持續的時間。", "zh": "Doctor：你頭痛多久了？<br>Patient：大約三天前開始的。<br>Doctor：我們來做幾項檢查，找出原因。", "sa": "【S】It 【V】started 【M】about three days ago<br>【疑問】How long 【助V】have 【S】you 【V】had 【O】this headache?（現在完成式問持續時間）<br>📌 句型：How long have you + p.p.?；run tests（做檢查）；find out what's causing it（名詞子句）"}, {"n": 14, "p": 1, "stem": "Friend A: Are you going to the workshop on photography this weekend?<br>Friend B: _____<br>Friend A: That's too bad. It's supposed to be really informative.", "o": ["Yes, I signed up last week.", "I've already taken that workshop twice.", "I have to work this weekend, so I can't go.", "I don't own a camera."], "a": 2, "exp": "✓ (C) I have to work this weekend, so I can't go.— 朋友A回應「太可惜了」，呼應朋友B表示週末要工作無法參加。\n❌ (A) 說「有，我上週就報名了」，與A回應「太可惜了」矛盾。\n❌ (B) 說「我已經上過那個工作坊兩次了」，與A回應「太可惜了」不連貫。\n❌ (D) 說「我沒有相機」，與A回應「太可惜了」不連貫（沒有相機不代表不能去）。", "zh": "Friend A：你這週末要去參加攝影工作坊嗎？<br>Friend B：我這週末要上班，所以不能去。<br>Friend A：真可惜。聽說那個內容很豐富。", "sa": "【S】I 【V】have to work 【M】this weekend, so 【S】I 【V】can't go<br>📌 句型：have to V（必須…）；so 連接結果子句；be supposed to V（據說／應該…）<br>例：It's supposed to rain tomorrow."}, {"n": 15, "p": 1, "stem": "Manager: We're short-staffed today. Could you stay an extra hour?<br>Employee: _____<br>Manager: I really appreciate it.", "o": ["I already left for the day.", "Sure, I don't mind helping out.", "I think we have too many staff already.", "I quit yesterday."], "a": 1, "exp": "✓ (B) Sure, I don't mind helping out.— 員工答應留下幫忙，主管回應「我真的很感激」，前後呼應。\n❌ (A) 說「我已經下班離開了」，與主管當面詢問的情境矛盾，且主管不會因此感激。\n❌ (C) 說「我覺得我們員工已經太多了」，與主管說「人手不足」矛盾。\n❌ (D) 說「我昨天已經辭職了」，與主管的感謝回應不連貫。", "zh": "Manager：我們今天人手不足。你可以多留一個小時嗎？<br>Employee：當然，我不介意幫忙。<br>Manager：真的很感謝你。", "sa": "【S】I 【V】don't mind 【O】helping out<br>📌 句型：mind + V-ing（介意做…），mind 後接動名詞；help out（幫忙）；short-staffed（人手不足的）<br>例：Do you mind opening the window?"}, {"n": 16, "p": 1, "stem": "Tourist: Excuse me, is the museum within walking distance from here?<br>Local: _____<br>Tourist: Great, that's not too far. Thanks!", "o": ["The museum closed down last year.", "It's about a fifteen-minute walk from here.", "You'll need to take a taxi; it's too far.", "I've never been to the museum myself."], "a": 1, "exp": "✓ (B) It's about a fifteen-minute walk from here.— 當地人回答步行所需時間，遊客回應「太好了，不會太遠」，前後呼應。\n❌ (A) 說「博物館去年已經關閉了」，與遊客回應「太好了，不會太遠，謝謝」矛盾。\n❌ (C) 說「你需要搭計程車，太遠了」，與遊客回應「不會太遠」矛盾。\n❌ (D) 說「我自己從未去過博物館」，未回答遊客的問題。", "zh": "Tourist：不好意思，博物館從這裡走路到得了嗎？<br>Local：從這裡走大約十五分鐘。<br>Tourist：太好了，不會太遠。謝謝！", "sa": "【S】It 【V】's 【C】about a fifteen-minute walk 【M】from here<br>📌 句型：a + 數字-minute + walk（…分鐘的路程，連字號複合形容詞，minute 不加 s）；within walking distance（走路可到的距離內）<br>例：It's a ten-minute drive to the station."}, {"n": 17, "p": 1, "stem": "Coworker A: Did you get a chance to review the report I sent you?<br>Coworker B: _____<br>Coworker A: No problem, just let me know when you're done.", "o": ["Not yet, but I'll get to it this afternoon.", "I already submitted the report.", "I never received any report.", "The report was due last week."], "a": 0, "exp": "✓ (A) Not yet, but I'll get to it this afternoon.— 同事B表示還沒看但下午會處理，同事A回應「沒問題，完成後告訴我」，前後呼應。\n❌ (B) 說「我已經提交報告了」，與A詢問「是否看過我寄的報告」角色混淆。\n❌ (C) 說「我從未收到任何報告」，與A回應「沒問題，完成後告訴我」矛盾（若未收到，A不會這樣回應）。\n❌ (D) 說「報告上週就到期了」，與A回應「沒問題」的寬容語氣不連貫。", "zh": "Coworker A：你有機會看我寄給你的報告了嗎？<br>Coworker B：還沒，不過我今天下午會處理。<br>Coworker A：沒問題，看完再跟我說一聲。", "sa": "Not yet, but 【S】I 【V】'll get to 【O】it 【M】this afternoon<br>📌 句型：get to + N（著手處理…）；let me know when…（…時告訴我）；the report (that) I sent you（省略關係代名詞）<br>例：I'll get to your email after lunch."}, {"n": 18, "p": 1, "stem": "Student: I'm having trouble understanding this chapter. Could you explain it again?<br>Teacher: _____<br>Student: Thank you so much, that really helps.", "o": ["You should have asked earlier.", "Sure, let's go over it step by step.", "That chapter isn't on the test.", "I don't have time right now."], "a": 1, "exp": "✓ (B) Sure, let's go over it step by step.— 老師同意逐步講解，學生回應「非常感謝，這真的有幫助」，前後呼應。\n❌ (A) 說「你應該早點問」，語氣責備且未提供協助，與學生的感謝回應不連貫。\n❌ (C) 說「這章不會考」，未回應學生想理解內容的請求。\n❌ (D) 說「我現在沒時間」，與學生的感謝回應矛盾。", "zh": "Student：我看不太懂這一章。您可以再解釋一次嗎？<br>Teacher：當然，我們一步一步來複習。<br>Student：非常謝謝您，這真的很有幫助。", "sa": "【V】let's go over 【O】it 【M】step by step<br>📌 句型：have trouble + V-ing（做…有困難）；let's + 原形動詞（我們來…）；go over（複習、檢查）<br>例：I have trouble remembering names."}, {"n": 19, "p": 1, "stem": "Receptionist: Good morning, do you have an appointment?<br>Visitor: _____<br>Receptionist: Let me check our records.", "o": ["No, but I'd like to schedule one for next week.", "I work here.", "I'm just looking around.", "I already left."], "a": 0, "exp": "✓ (A) No, but I'd like to schedule one for next week.— 訪客表示沒有預約但想安排下週的預約，櫃台人員回應「讓我查一下紀錄」，前後呼應。\n❌ (B) 說「我在這裡工作」，與櫃台詢問「是否有預約」的訪客情境不符。\n❌ (C) 說「我只是隨意看看」，與櫃台回應「讓我查一下紀錄」不連貫。\n❌ (D) 說「我已經離開了」，文法與情境皆不合理。", "zh": "Receptionist：早安，請問您有預約嗎？<br>Visitor：沒有，不過我想預約下週的時間。<br>Receptionist：我查一下我們的紀錄。", "sa": "No, but 【S】I 【V】'd like 【O】to schedule one 【M】for next week<br>📌 句型：would like to V（想要…，客氣說法）；one 代替前面的 an appointment<br>例：I'd like to book a table for two."}, {"n": 20, "p": 1, "stem": "Friend A: My phone screen cracked when I dropped it yesterday.<br>Friend B: _____<br>Friend A: I hope so. I'll take it to the repair shop tomorrow.", "o": ["You should buy a new phone case.", "That's too bad. I hope it can still be fixed.", "Phones are too expensive nowadays.", "I never drop my phone."], "a": 1, "exp": "✓ (B) That's too bad. I hope it can still be fixed.— 朋友A回應「希望如此，我明天會拿去修」，呼應朋友B表達同情並希望手機還能修。\n❌ (A) 說「你應該買個手機殼」，與A回應「希望還能修」不連貫（事後建議無助於當下情況）。\n❌ (C) 說「現在手機太貴了」，與A回應「希望還能修」不連貫。\n❌ (D) 說「我從來不會摔手機」，與朋友A的情境不連貫，且語氣不合宜。", "zh": "Friend A：我的手機昨天掉在地上，螢幕裂了。<br>Friend B：真糟糕。希望還修得好。<br>Friend A：希望如此。我明天會拿去維修店。", "sa": "【S】That 【V】's 【C】too bad. 【S】I 【V】hope 【O】(that) it can still be fixed<br>📌 句型：助動詞被動 can be p.p.（能被…）；I hope so.（希望如此）；when I dropped it（時間子句）<br>例：The car can't be repaired."}, {"n": 21, "p": 2, "stem": "(21)", "o": ["emit", "emits", "emitted", "emitting"], "a": 0, "exp": "✓ (A) emit（現在式動詞，主詞 books 為複數）— \"books emit no such light\" 為描述書本特性的現在事實，主詞 books 為複數，動詞用原形 emit。\n❌ (B) emits = 第三人稱單數現在式，與複數主詞 books 不一致。\n❌ (C) emitted = 過去式，與描述一般事實的現在時不符。\n❌ (D) emitting = 現在分詞，不能單獨作句子的主要動詞。", "zh": "<i>Unlike screens, which emit blue light that can interfere with the body's natural sleep cycle, books <b>emit<\/b> no such light and therefore do not disturb the brain's production of melatonin, a hormone which helps regulate sleep.<\/i><br>和會發出藍光、可能干擾身體自然睡眠週期的螢幕不同，書本不會發出這種光，因此不會干擾大腦分泌褪黑激素——一種幫助調節睡眠的荷爾蒙。", "sa": "【M】Unlike screens, which emit blue light… 【S】books 【V1】emit 【O】no such light 【V2】and therefore do not disturb 【O】the brain's production of melatonin<br>📌 主詞 books 為複數、敘述一般事實 → 現在式原形 emit；unlike + N（不像…）<br>例：Cats sleep more than dogs."}, {"n": 22, "p": 2, "stem": "(22)", "o": ["who", "whom", "which", "whose"], "a": 2, "exp": "✓ (C) which（關係代名詞，指物，作主格）— \"melatonin, a hormone which helps regulate sleep\" 中，which 代替前面的 a hormone（事物），在子句中作主詞，引導形容詞子句說明 melatonin 的作用。\n❌ (A) who = 用於指人，hormone 為事物，不適用。\n❌ (B) whom = 用於指人且作受格，不適用於事物。\n❌ (D) whose = 表「…的」所有格關係代名詞，此處子句缺的是主詞而非所有格修飾語，不符。", "zh": "<i>…books emit no such light and therefore do not disturb the brain's production of melatonin, a hormone <b>which<\/b> helps regulate sleep.<\/i><br>……書本不會發出這種光，因此不會干擾大腦分泌褪黑激素——一種幫助調節睡眠的荷爾蒙。", "sa": "melatonin, 【同位語】a hormone 【M】which helps regulate sleep<br>📌 句型：which（指物、作主詞）引導形容詞子句修飾 a hormone；help + (to) V<br>例：Vitamin C is a nutrient which helps fight colds."}, {"n": 23, "p": 2, "stem": "(23)", "o": ["escape", "escaping", "escaped", "to escape"], "a": 3, "exp": "✓ (D) to escape（不定詞）— \"allow + 受詞 + to V\" 為固定句型，\"allowing the mind to escape from daily worries\" 表示「讓心靈得以逃脫日常的煩惱」。\n❌ (A) escape = 動詞原形，不符合 \"allow + O + to V\" 的句型。\n❌ (B) escaping = 現在分詞，不符合此句型。\n❌ (C) escaped = 過去分詞，不符合此句型。", "zh": "<i>In addition to its physical benefits, reading can also reduce stress by allowing the mind <b>to escape<\/b> from daily worries and focus on a different world.<\/i><br>除了對身體的好處之外，閱讀還能讓心思得以逃離日常煩惱、專注在另一個世界裡，藉此減輕壓力。", "sa": "【M】In addition to its physical benefits 【S】reading 【V】can reduce 【O】stress 【M】by allowing the mind to escape… and (to) focus on…<br>📌 句型：allow + O + to V（讓…得以…）；by + V-ing（藉由…）；in addition to + N（除了…之外還有）<br>例：The app allows users to share photos."}, {"n": 24, "p": 2, "stem": "(24)", "o": ["fall", "falling", "fell", "to fall"], "a": 3, "exp": "✓ (D) to fall（不定詞）— \"make it easier to V\" 為固定句型，\"make it easier to fall asleep\" 表示「使入睡變得更容易」。\n❌ (A) fall = 動詞原形，不符合 \"make it easier to V\" 的句型。\n❌ (B) falling = 現在分詞，不符合此句型。\n❌ (C) fell = 過去式，不符合此句型。", "zh": "<i>Experts suggest that even just ten minutes of reading each night can make it easier <b>to fall<\/b> asleep.<\/i><br>專家建議，即使每晚只讀十分鐘，也能讓人更容易入睡。", "sa": "【S】Experts 【V】suggest 【O】that even just ten minutes of reading each night can make it easier to fall asleep<br>📌 句型：make + it（虛受詞）+ adj. + to V（使做…變得…），真受詞是 to fall asleep<br>例：Glasses make it easier to read."}, {"n": 25, "p": 2, "stem": "(25)", "o": ["which", "where", "when", "what"], "a": 1, "exp": "✓ (B) where（關係副詞，指地方）— \"a space where they can grow their own vegetables and flowers\" 中，where 代替 in that space，引導形容詞子句修飾地方名詞 a space。\n❌ (A) which = 關係代名詞，子句中需擔任主詞或受詞，但此處 \"they can grow vegetables\" 已是完整句子，缺的是地方副詞而非代名詞。\n❌ (C) when = 關係副詞，用於修飾時間名詞，space 為地方名詞，不適用。\n❌ (D) what = what 本身需在子句中擔任成分且前面不能有先行詞，不適用。", "zh": "<i>Community gardens have become increasingly popular in cities around the world, offering residents a space <b>where<\/b> they can grow their own vegetables and flowers.<\/i><br>社區花園在世界各地的城市越來越受歡迎，為居民提供一個可以種植自己的蔬菜和花卉的空間。", "sa": "【S】Community gardens 【V】have become 【C】increasingly popular 【M】offering residents a space where…（分詞構句）<br>📌 句型：關係副詞 where ＝ in which，修飾地方名詞 a space，後接完整子句；offer + 人 + 物<br>例：This is the park where we first met."}, {"n": 26, "p": 2, "stem": "(26)", "o": ["meet", "meeting", "to meet", "met"], "a": 2, "exp": "✓ (C) to meet（不定詞）— \"opportunities for neighbors to meet and build relationships\" 為 \"for + 人 + to V\" 句型，表示「讓鄰居能夠相遇並建立關係的機會」。\n❌ (A) meet = 動詞原形，不符合 \"for + 人 + to V\" 的句型。\n❌ (B) meeting = 動名詞，不符合此句型。\n❌ (D) met = 過去式，不符合此句型。", "zh": "<i>These gardens not only provide fresh produce but also create opportunities for neighbors <b>to meet<\/b> and build relationships.<\/i><br>這些花園不只提供新鮮農產品，也為鄰居創造相識並建立關係的機會。", "sa": "【S】These gardens 【V】not only provide 【O】fresh produce 【V】but also create 【O】opportunities 【M】for neighbors to meet and build relationships<br>📌 句型：not only A but also B；opportunity for + 人 + to V（讓某人做…的機會）<br>例：The club offers chances for students to practice English."}, {"n": 27, "p": 2, "stem": "(27)", "o": ["Despite", "Because of", "Due to", "As"], "a": 0, "exp": "✓ (A) Despite（儘管，介系詞）— \"Despite the many benefits, however, community gardens require ongoing maintenance\" 表示「儘管有許多好處，社區花園仍需要持續的維護」，despite 後接名詞片語 the many benefits，語意形成轉折，與句中的 however 呼應。\n❌ (B) Because of = 因為，表因果關係，與「儘管有好處仍需要維護」的轉折語意不符。\n❌ (C) Due to = 因為，同樣表因果關係，不符合轉折語意。\n❌ (D) As = 因為／當…時，不符合轉折語意。", "zh": "<i><b>Despite<\/b> the many benefits, however, community gardens require ongoing maintenance, and without enough volunteers, they can quickly fall into disrepair.<\/i><br>然而，儘管有許多好處，社區花園需要持續維護，如果沒有足夠的志工，很快就會荒廢失修。", "sa": "【M】Despite the many benefits 【S】community gardens 【V】require 【O】ongoing maintenance, and 【M】without enough volunteers 【S】they 【V】can fall 【M】into disrepair<br>📌 句型：despite + N（儘管，介系詞，後不接子句）＝ in spite of；although 才接子句<br>例：Despite the rain, we went hiking."}, {"n": 28, "p": 2, "stem": "(28)", "o": ["allocate", "allocating", "allocated", "to allocate"], "a": 1, "exp": "✓ (B) allocating（動名詞）— 介系詞 by 後須接動名詞，\"by allocating more land for community gardens\" 表示「藉由分配更多土地給社區花園」。\n❌ (A) allocate = 動詞原形，介系詞後不可直接接動詞原形。\n❌ (C) allocated = 過去分詞，介系詞後不可直接接過去分詞作主要動作。\n❌ (D) to allocate = 不定詞，介系詞後不可直接接不定詞。", "zh": "<i>City planners hope that by <b>allocating<\/b> more land for community gardens, they can encourage healthier and more connected neighborhoods.<\/i><br>城市規劃者希望藉由撥出更多土地給社區花園，能促成更健康、關係更緊密的社區。", "sa": "【S】City planners 【V】hope 【O】that 【M】by allocating more land for community gardens, 【S】they 【V】can encourage 【O】healthier and more connected neighborhoods<br>📌 句型：介系詞 by + V-ing（藉由…）；allocate A for B（撥出 A 給 B）<br>例：You can improve your English by reading every day."}, {"n": 29, "p": 3, "stem": "What change is being made to the library's weekday hours?", "o": ["The library will open later in the morning.", "The library will close two hours later than before.", "The library will be closed on weekdays.", "The library will only open for students."], "a": 1, "exp": "公告提到：「the library will extend its weekday hours, staying open until 9 PM instead of 7 PM」\n(B) The library will close two hours later than before. ✓ 為正解（從7點延長到9點，正好晚兩小時）。\n❌ (A) 公告未提到開館時間提早。\n❌ (C) 公告說平日開放時間「延長」，並非關閉。\n❌ (D) 公告未提到只限學生入館。", "zh": "題目：圖書館平日的開放時間有什麼改變？<br>(A) 圖書館早上會比較晚開。<br>(B) 圖書館會比以前晚兩小時關門。<br>(C) 圖書館平日會休館。<br>(D) 圖書館只開放給學生。", "sa": "題目：【疑問詞】What change 【V】is being made 【M】to the library's weekday hours?（現在進行式被動）<br>依據句：【S】the library 【V】will extend 【O】its weekday hours, staying open until 9 PM instead of 7 PM<br>📌 句型：staying open… 分詞構句補充說明；A instead of B（是 A 而不是 B）"}, {"n": 30, "p": 3, "stem": "How can students reserve the quiet study room?", "o": ["By calling the library.", "By visiting in person.", "Through the library's website.", "By asking a librarian on weekends."], "a": 2, "exp": "公告提到：「The quiet study room on the second floor will also be available for reservation up to two weeks in advance through the library's website.」\n(C) Through the library's website. ✓ 為正解。\n❌ (A) 公告未提到電話預約。\n❌ (B) 公告未提到現場預約。\n❌ (D) 公告未提到向館員詢問或週末預約方式。", "zh": "題目：學生要怎麼預約安靜自習室？<br>(A) 打電話給圖書館。<br>(B) 親自到館。<br>(C) 透過圖書館網站。<br>(D) 週末詢問館員。", "sa": "題目：【疑問詞】How 【助V】can 【S】students 【V】reserve 【O】the quiet study room?<br>依據句：【S】The quiet study room 【V】will be 【C】available for reservation 【M】up to two weeks in advance through the library's website<br>📌 句型：be available for + N（可供…）；up to（最多）；in advance（事先）"}, {"n": 31, "p": 3, "stem": "Why does Leo want to change the dinner time?", "o": ["He wants to eat earlier.", "Something came up at work.", "The restaurant is closed at 7.", "Mia asked him to change it."], "a": 1, "exp": "Leo 說：「Actually, something came up at work. Can we push it to 8?」\n(B) Something came up at work. ✓ 為正解。\n❌ (A) Leo 是要將時間「推後」，並非想提早。\n❌ (C) 對話未提到餐廳7點關門。\n❌ (D) 是 Leo 主動提出要改時間，並非 Mia 要求的。", "zh": "題目：Leo 為什麼想改晚餐時間？<br>(A) 他想早點吃。<br>(B) 工作上臨時有事。<br>(C) 餐廳 7 點打烊。<br>(D) Mia 要他改的。", "sa": "題目：【疑問詞】Why 【助V】does 【S】Leo 【V】want 【O】to change the dinner time?<br>依據句：【S】something 【V】came up 【M】at work. Can we push it to 8?<br>📌 句型：come up（〈事情〉突然發生）；push A to B（把 A 延到 B）"}, {"n": 32, "p": 3, "stem": "What does Leo ask Mia to do?", "o": ["Cancel the dinner plans.", "Pick him up from work.", "Make a reservation near the office.", "Choose a different day."], "a": 2, "exp": "Leo 說：「Yes, please. Somewhere not too far from the office would be great.」（回應 Mia 詢問是否要訂位）\n(C) Make a reservation near the office. ✓ 為正解。\n❌ (A) 對話顯示晚餐計畫只是改時間，並未取消。\n❌ (B) 對話未提到去接他。\n❌ (D) 對話未提到更換日期，只是調整時間。", "zh": "題目：Leo 請 Mia 做什麼？<br>(A) 取消晚餐計畫。<br>(B) 下班去接他。<br>(C) 在辦公室附近訂位。<br>(D) 改另一天。", "sa": "題目：【疑問詞】What 【助V】does 【S】Leo 【V】ask 【O】Mia 【C】to do?<br>依據句：Mia：Should I make a reservation? → Leo：Yes, please. Somewhere not too far from the office would be great.<br>📌 句型：ask + O + to V（要求某人做…）；make a reservation（訂位）"}, {"n": 33, "p": 3, "stem": "What is one benefit of urban beekeeping mentioned in the passage?", "o": ["It reduces the price of honey.", "Bees help pollinate gardens and parks.", "It eliminates the need for parks.", "It prevents bees from being aggressive."], "a": 1, "exp": "文中提到：「bees help pollinate gardens and parks, producing healthier plants」\n(B) Bees help pollinate gardens and parks. ✓ 為正解。\n❌ (A) 文中未提到降低蜂蜜價格。\n❌ (C) 文中未提到取代公園的需求。\n❌ (D) 文中說多數蜜蜂「除非蜂巢被直接干擾，否則不具攻擊性」，並非「養蜂能防止蜜蜂具攻擊性」。", "zh": "題目：本文提到都市養蜂的一項好處是什麼？<br>(A) 它讓蜂蜜價格降低。<br>(B) 蜜蜂幫花園和公園授粉。<br>(C) 它讓城市不再需要公園。<br>(D) 它能防止蜜蜂具攻擊性。", "sa": "題目：【疑問詞】What 【V】is 【S】one benefit of urban beekeeping 【M】mentioned in the passage?<br>依據句：【S】bees 【V】help pollinate 【O】gardens and parks, producing healthier plants<br>📌 句型：過去分詞 mentioned… 修飾 benefit；help + (to) V；producing… 分詞構句表結果"}, {"n": 34, "p": 3, "stem": "What challenge does urban beekeeping face, according to the passage?", "o": ["Bees cannot survive in cities at all.", "Finding water and flowering plants nearby.", "Honey produced in cities lacks flavor.", "Cities do not allow any hives."], "a": 1, "exp": "文中提到：「Bees need a reliable source of water and flowering plants nearby, which can be difficult to guarantee in heavily built-up areas.」\n(B) Finding water and flowering plants nearby. ✓ 為正解。\n❌ (A) 文中說都市養蜂日漸增加，並非完全無法在城市中生存。\n❌ (C) 文中說城市蜂蜜「風味出乎意料地多樣」，並非缺乏風味。\n❌ (D) 文中未提到城市完全禁止蜂巢，而是要求登記。", "zh": "題目：根據本文，都市養蜂面臨什麼挑戰？<br>(A) 蜜蜂在城市裡完全無法生存。<br>(B) 要在附近找到水源和開花植物。<br>(C) 城市生產的蜂蜜沒有風味。<br>(D) 城市完全不允許設置蜂巢。", "sa": "題目：【疑問詞】What challenge 【助V】does 【S】urban beekeeping 【V】face?<br>依據句：【S】Bees 【V】need 【O】a reliable source of water and flowering plants nearby, which can be difficult to guarantee in heavily built-up areas<br>📌 句型：非限定 which 子句；be difficult to V（難以…）"}, {"n": 35, "p": 3, "stem": "What have many cities done to address concerns about urban beekeeping?", "o": ["Banned beekeeping entirely.", "Required beekeepers to register their hives.", "Removed all flowering plants from parks.", "Limited beekeeping to rural areas only."], "a": 1, "exp": "文中提到：「many cities now offer beekeeping classes and require beekeepers to register their hives」\n(B) Required beekeepers to register their hives. ✓ 為正解。\n❌ (A) 文中說許多城市「提供養蜂課程」，並非禁止養蜂。\n❌ (C) 文中未提到移除公園中的花卉植物。\n❌ (D) 文中說城市養蜂日漸增加，並非限制只能在郊區進行。", "zh": "題目：許多城市做了什麼來回應對都市養蜂的疑慮？<br>(A) 全面禁止養蜂。<br>(B) 要求養蜂人登記蜂巢。<br>(C) 移除公園裡所有開花植物。<br>(D) 限制只能在鄉下養蜂。", "sa": "題目：【疑問詞】What 【助V】have 【S】many cities 【V】done 【M】to address concerns about urban beekeeping?<br>依據句：【S】many cities 【V】now offer 【O】beekeeping classes and 【V】require 【O】beekeepers 【C】to register their hives<br>📌 句型：require + O + to V（要求某人做…）；To address these concerns（為了處理疑慮，to V 表目的）"}, {"n": 36, "p": 3, "stem": "What is the placebo effect, according to the passage?", "o": ["A treatment that always cures serious illness.", "An improvement in condition caused by an ineffective treatment.", "A side effect caused by real medicine.", "A failure of medicine to work as expected."], "a": 1, "exp": "文中提到：「The placebo effect refers to a phenomenon in which a person experiences a real improvement in their condition after receiving a treatment that has no actual medical effect」\n(B) An improvement in condition caused by an ineffective treatment. ✓ 為正解。\n❌ (A) 文中說安慰劑效應「無法治癒嚴重疾病」，並非「總能治癒嚴重疾病」。\n❌ (C) 文中描述的是「沒有實際醫療效果的治療」所引發的反應，並非真實藥物的副作用。\n❌ (D) 文中描述的是「治療奏效」的現象，並非藥物失效。", "zh": "題目：根據本文，什麼是安慰劑效應？<br>(A) 一種總能治癒重病的療法。<br>(B) 由沒有實際療效的治療所帶來的病情改善。<br>(C) 真正藥物造成的副作用。<br>(D) 藥物未如預期發揮效用。", "sa": "題目：【疑問詞】What 【V】is 【S】the placebo effect?<br>依據句：【S】The placebo effect 【V】refers to 【O】a phenomenon 【M】in which a person experiences a real improvement… after receiving a treatment that has no actual medical effect<br>📌 句型：refer to（指的是…）；介系詞＋關係代名詞 in which"}, {"n": 37, "p": 3, "stem": "According to the passage, what can influence the placebo effect?", "o": ["Only the patient's age.", "The color of a pill or the doctor's confidence.", "The weather on the day of treatment.", "The size of the hospital."], "a": 1, "exp": "文中提到：「the placebo effect can be influenced by factors such as the color of a pill, the cost of the treatment, or even the confidence of the doctor administering it」\n(B) The color of a pill or the doctor's confidence. ✓ 為正解。\n❌ (A) 文中未提到僅受病患年齡影響。\n❌ (C) 文中未提到治療當天的天氣。\n❌ (D) 文中未提到醫院規模的影響。", "zh": "題目：根據本文，什麼會影響安慰劑效應？<br>(A) 只有病人的年齡。<br>(B) 藥丸的顏色或醫師的自信。<br>(C) 治療當天的天氣。<br>(D) 醫院的規模。", "sa": "題目：【疑問詞】what 【助V】can 【V】influence 【O】the placebo effect?（what 作主詞）<br>依據句：【S】the placebo effect 【V】can be influenced 【M】by factors such as the color of a pill, the cost of the treatment, or even the confidence of the doctor administering it<br>📌 句型：助動詞被動 can be p.p.；such as 列舉；administering it 分詞修飾 the doctor"}, {"n": 38, "p": 3, "stem": "What do some researchers hope to do, according to the passage?", "o": ["Replace traditional medicine entirely with placebos.", "Use patients' mindset alongside traditional medicine.", "Stop researching the placebo effect.", "Prove that all illnesses are imaginary."], "a": 1, "exp": "文中提到：「it has led some researchers to explore how a patient's mindset and expectations might be used alongside traditional medicine to improve treatment outcomes」\n(B) Use patients' mindset alongside traditional medicine. ✓ 為正解。\n❌ (A) 文中說是「搭配傳統醫學使用」，並非完全取代傳統醫學。\n❌ (C) 文中描述研究者持續探索此現象，並非停止研究。\n❌ (D) 文中未提到證明所有疾病都是想像出來的。", "zh": "題目：根據本文，有些研究人員希望做什麼？<br>(A) 用安慰劑完全取代傳統醫學。<br>(B) 搭配傳統醫學運用病人的心態。<br>(C) 停止研究安慰劑效應。<br>(D) 證明所有疾病都是想像出來的。", "sa": "題目：【疑問詞】What 【助V】do 【S】some researchers 【V】hope 【O】to do?<br>依據句：【S】it 【V】has led 【O】some researchers 【C】to explore how a patient's mindset and expectations might be used alongside traditional medicine<br>📌 句型：lead + O + to V（促使某人…）；間接問句 how + S + V；alongside（與…並用）"}, {"n": 39, "p": 3, "stem": "What was Marco's profession before he became a woodworker?", "o": ["A teacher.", "An accountant.", "A craft fair organizer.", "A furniture salesman."], "a": 1, "exp": "文中提到：「After working for over a decade as an accountant, Marco decided to make a major change in his life.」\n(B) An accountant. ✓ 為正解。\n❌ (A) 文中未提到他曾是老師。\n❌ (C) 文中說他是在工藝品市集「販售」家具，並非「主辦」市集。\n❌ (D) 文中未提到他曾是家具銷售員。", "zh": "題目：Marco 成為木工之前的職業是什麼？<br>(A) 老師。<br>(B) 會計師。<br>(C) 工藝市集主辦人。<br>(D) 家具銷售員。", "sa": "題目：【疑問詞】What 【V】was 【S】Marco's profession 【M】before he became a woodworker?<br>依據句：【M】After working for over a decade as an accountant, 【S】Marco 【V】decided 【O】to make a major change in his life<br>📌 句型：after + V-ing；as + 職業（擔任…）；make a change（做改變）"}, {"n": 40, "p": 3, "stem": "What made Marco realize there might be a market for his furniture?", "o": ["A friend asked to buy one of his tables.", "He read an article about woodworking.", "His accounting firm went out of business.", "He won a woodworking competition."], "a": 0, "exp": "文中提到：「When a friend asked to buy one of his handmade tables, Marco realized there might be a market for his work.」\n(A) A friend asked to buy one of his tables. ✓ 為正解。\n❌ (B) 文中未提到他讀過相關文章。\n❌ (C) 文中未提到會計事務所倒閉。\n❌ (D) 文中未提到他贏得木工比賽。", "zh": "題目：是什麼讓 Marco 意識到他的家具可能有市場？<br>(A) 一位朋友想買他的一張桌子。<br>(B) 他讀了一篇關於木工的文章。<br>(C) 他的會計事務所倒閉了。<br>(D) 他贏得了一場木工比賽。", "sa": "題目：【疑問詞】What 【V】made 【O】Marco 【C】realize there might be a market for his furniture?<br>依據句：【M】When a friend asked to buy one of his handmade tables, 【S】Marco 【V】realized 【O】(that) there might be a market for his work<br>📌 句型：使役 make + O + 原形動詞；one of + 複數名詞"}, {"n": 41, "p": 3, "stem": "How did Marco transition into woodworking full-time?", "o": ["He quit his job immediately to open a workshop.", "He sold furniture at fairs while still working as an accountant, then gradually reduced his hours.", "He borrowed money to open a large furniture factory.", "He hired someone else to do the woodworking."], "a": 1, "exp": "文中提到：「He began selling his furniture at local craft fairs on weekends while continuing his accounting job during the week. As demand grew, Marco gradually reduced his hours at the accounting firm and eventually left to open his own small workshop.」\n(B) He sold furniture at fairs while still working as an accountant, then gradually reduced his hours. ✓ 為正解。\n❌ (A) 文中說他是「逐漸」減少工時，並非立刻辭職開店。\n❌ (C) 文中未提到借錢開設大型家具工廠。\n❌ (D) 文中說 Marco 親自製作家具，並非僱用他人。", "zh": "題目：Marco 是怎麼轉換成全職做木工的？<br>(A) 他立刻辭職開工作室。<br>(B) 他一邊當會計師一邊在市集賣家具，再逐漸減少工時。<br>(C) 他借錢開了一間大型家具工廠。<br>(D) 他雇用別人來做木工。", "sa": "題目：【疑問詞】How 【助V】did 【S】Marco 【V】transition 【M】into woodworking full-time?<br>依據句：【S】He 【V】began selling 【O】his furniture… while continuing his accounting job… As demand grew, 【S】Marco 【V】gradually reduced 【O】his hours… and eventually left<br>📌 句型：while + V-ing（一邊…）；as 表「隨著…」"}, {"n": 42, "p": 3, "stem": "What does Marco now offer to beginners?", "o": ["Free furniture.", "Investment advice.", "Weekend woodworking classes.", "Accounting lessons."], "a": 2, "exp": "文中提到：「He now also offers weekend classes for beginners who want to learn basic woodworking skills」\n(C) Weekend woodworking classes. ✓ 為正解。\n❌ (A) 文中未提到提供免費家具。\n❌ (B) 文中未提到提供投資建議。\n❌ (D) 文中提供的是木工課程，並非會計課程。", "zh": "題目：Marco 現在為初學者提供什麼？<br>(A) 免費家具。<br>(B) 投資建議。<br>(C) 週末木工課。<br>(D) 會計課程。", "sa": "題目：【疑問詞】What 【助V】does 【S】Marco 【M】now 【V】offer 【M】to beginners?<br>依據句：【S】He 【M】now also 【V】offers 【O】weekend classes 【M】for beginners who want to learn basic woodworking skills<br>📌 句型：who 引導形容詞子句修飾 beginners；hoping to pass on… 分詞構句"}];
const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "我們應該尊重不同文化的傳統與信仰。<br><span class=\"blankline\">We should r<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① the traditions and b<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② of different cultures.<\/span>", "ans": "① <b>respect<\/b>　② <b>beliefs<\/b>", "exp": "① respect（尊重）— 依提示字首 r 及句意「我們應該尊重不同文化的傳統與信仰」。\n② beliefs（信仰）— 依提示字首 b 及句意「傳統與信仰」，與 traditions 並列作 respect 的受詞。", "zh": "題意：我們應該尊重不同文化的傳統與信仰。（① respect 尊重　② beliefs 信仰）", "sa": "參考句：【S】We 【V】should respect 【O】the traditions and beliefs 【M】of different cultures<br>📌 句型：助動詞 should + 原形動詞；traditions and beliefs 對等並列作受詞（belief 複數為 beliefs）<br>例：We should respect other people's opinions."}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>for tourists / one of the most / this museum / popular attractions / has become<\/i>", "ans": "This museum has become one of the most popular attractions for tourists.", "exp": "句構：主詞 (This museum) + has become（現在完成時，表示「已成為」）+ one of the most popular attractions（受詞，\"one of the + 最高級 + 複數名詞\" 表示「最…的其中之一」）+ for tourists（介系詞片語修飾語）。", "zh": "這座博物館已成為最受觀光客歡迎的景點之一。", "sa": "【S】This museum 【V】has become 【C】one of the most popular attractions 【M】for tourists<br>📌 句型：現在完成式 has become（已經成為）；one of the + 最高級 + 複數名詞（最…的之一）<br>例：She is one of the best players on the team."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>政府正計畫興建更多公園，讓市民能有更多空間運動。", "ans": "The government is planning to build more parks so that citizens can have more space to exercise.", "exp": "重點結構：be planning to + 動詞原形（is planning to build）表示「正計畫……」；so that + 主詞 + can + 動詞原形，引導表「目的／結果」的子句；more space to exercise 中不定詞 to exercise 修飾 space。", "zh": "題意：政府正計畫興建更多公園，讓市民有更多運動的空間。", "sa": "【S】The government 【V】is planning 【O】to build more parks 【M】so that citizens can have more space to exercise<br>📌 句型：be planning to V（正計畫…）；so that + S + can + V（以便…，表目的）；space to exercise（不定詞修飾名詞）<br>例：Speak louder so that everyone can hear you."}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]+ptrHtml(String(q.n)); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

 for(var i=0;i<s.items.length;i+=10){

  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});

});</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統測英文模擬考卷 F</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<a href="index.html" style="position:fixed;top:12px;left:12px;background:rgba(255,255,255,.92);color:#2b8cff;padding:7px 15px;border-radius:20px;text-decoration:none;font-size:1rem;font-weight:800;z-index:999;box-shadow:0 3px 10px rgba(0,0,0,.15);">&#8592; 回統測模擬卷</a>
<div class="wrap">
  <header class="top">
    <h1>統測英文　<span style="opacity:.9">模擬考卷 F</span></h1>
    <p>科技校院四年制與專科學校二年制統一入學測驗　共同科目：英文（模擬）</p>
    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 42</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 F　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題<\/h3>\nMany people believe that learning a musical instrument is only useful for those who want to become professional musicians. However, research suggests that <span class=\"blk\">21<\/span> an instrument can benefit the brain in many other ways. For example, children who study music often perform better in subjects <span class=\"blk\">22<\/span> mathematics, since reading music involves recognizing patterns and ratios. Playing an instrument also requires coordination between the hands, eyes, and ears, which can improve focus and memory. Some researchers even believe that <span class=\"blk\">23<\/span> musical training begins, the greater the impact on brain development. Of course, not every child will become a professional musician, but the skills <span class=\"blk\">24<\/span> through music lessons can be useful in many areas of life.<\/div>", "25": "<div class=\"passage\"><h3>第 25–28 題<\/h3>\nThe history of the umbrella dates back thousands of years, with early versions appearing in ancient Egypt, China, and Greece. In many of these cultures, umbrellas were originally used <span class=\"blk\">25<\/span> as protection from the sun rather than the rain, and they were often associated with status — only royalty or the wealthy were allowed to use them. It wasn't until much later that umbrellas became <span class=\"blk\">26<\/span> for everyday people to protect themselves from rain. Today, umbrellas are so common that we rarely think about their long history. <span class=\"blk\">27<\/span> their simple design, modern umbrellas still rely on the same basic principle as ancient ones: a frame covered with material that blocks out the sun or rain. Some designers have tried to reinvent the umbrella with new materials and folding mechanisms, but the basic shape has <span class=\"blk\">28<\/span> largely unchanged for centuries.<\/div>", "29": "<div class=\"passage\"><h3>第 29–30 題<\/h3>\n<b>Community Center Schedule Update<\/b><br><br>Starting next Monday, the yoga class will move from the second-floor studio to the first-floor multipurpose room due to renovation work upstairs. The class time remains the same: Tuesdays and Thursdays at 6:00 PM. Please note that the multipurpose room is located next to the front entrance, not the gym. Members are advised to arrive five minutes early, as seating is limited to 20 people. We thank you for your understanding during this temporary change.<\/div>", "31": "<div class=\"passage\"><h3>第 31–32 題<\/h3>\n<b>Text Messages<\/b><br><br>Emma: Hi, I'm at the train station but I don't see you. Where are you? Noah: I'm so sorry! My train was delayed by 15 minutes. I just got off and I'm walking toward the exit now. Emma: No worries, take your time. I'll wait by the coffee shop near the main entrance. Noah: Got it, I'll be there in two minutes.<\/div>", "33": "<div class=\"passage\"><h3>第 33–35 題<\/h3>\nIn the past, most maps were printed on paper and needed to be replaced whenever roads changed or new buildings were constructed. Today, digital maps on smartphones are updated constantly, often using information submitted by users themselves. When a road is closed or a new restaurant opens, users can report the change, and the information becomes available to others almost immediately. This crowd-sourced approach has made digital maps far more accurate and up-to-date than traditional paper maps could ever be. However, some experts point out a downside: because digital maps rely on satellite signals and data connections, they can become useless in areas with poor reception, such as remote mountains or underground spaces. For this reason, many hikers and travelers still recommend carrying a paper map as a backup, especially when traveling to areas without reliable cell service.<\/div>", "36": "<div class=\"passage\"><h3>第 36–38 題<\/h3>\nMany parents believe that giving children too many choices, such as which toy to play with or which snack to eat, will make them happier. However, some psychologists argue that too much choice can actually cause stress, even in children. In one study, children who were given a small number of options to choose from seemed more satisfied with their final choice than those who were given a large number of options. Researchers believe this is because too many choices make it harder to feel confident about a decision — there is always a nagging feeling that another option might have been better. This phenomenon, sometimes called \"choice overload,\" has also been observed in adults when shopping for products like cereal or shampoo, where dozens of nearly identical options can make simple decisions surprisingly difficult. Based on these findings, some experts suggest that offering a smaller, carefully selected range of choices may actually lead to greater satisfaction.<\/div>", "39": "<div class=\"passage\"><h3>第 39–42 題<\/h3>\nGrowing up in a small fishing village, Tomas often watched his grandfather repair nets and boats using skills passed down through generations. As tourism in the area increased, Tomas noticed that visitors were fascinated by these traditional skills, which were becoming rare as younger people moved to cities for other jobs. Instead of leaving the village like many of his friends, Tomas decided to open a small workshop where tourists could learn traditional net-making and boat repair from local fishermen, including his grandfather. The workshop not only provided extra income for the older fishermen but also gave tourists a meaningful, hands-on experience that was different from typical tourist activities. Word of the workshop spread, and soon people were traveling specifically to the village to participate. Tomas hopes that by combining tourism with tradition, he can help keep these skills alive for future generations while also supporting his community economically.<\/div>"};

ices, such as which toy to play with or which snack to eat, will make them happier.", "zh": "許多父母以為，給孩子很多選擇——例如要玩哪個玩具、要吃哪種點心——會讓他們更快樂。", "sa": "【S】Many parents 【V】believe 【O】that giving children too many choices… will make them happier<br>📌 動名詞片語當主詞；make + O + C；which + N + to V。"}, {"en": "However, some psychologists argue that too much choice can actually cause stress, even in children.", "zh": "然而，有些心理學家主張，選擇太多其實會造成壓力，即使對孩子也是如此。", "sa": "【S】some psychologists 【V】argue 【O】that too much choice can actually cause stress<br>📌 argue that「主張」；too much + 不可數名詞。"}, {"en": "In one study, children who were given a small number of options to choose from seemed more satisfied with their final choice than those who were given a large number of options.", "zh": "在一項研究中，只拿到少數選項可以挑的孩子，比拿到大量選項的孩子，對自己最後的選擇似乎更滿意。", "sa": "【S】children who were given a small number of options 【V】seemed 【C】more satisfied with their final choice<br>📌 seem + 形容詞；be satisfied with；those who 指 children。"}, {"en": "Researchers believe this is because too many choices make it harder to feel confident about a decision — there is always a nagging feeling that another option might have been better.", "zh": "研究人員認為，這是因為選擇太多會讓人更難對決定有信心——總會有一種揮之不去的感覺，覺得另一個選項也許會更好。", "sa": "【S】too many choices 【V】make 【O】it 【C】harder 【M】to feel confident<br>📌 make it + adj. + to V；might have + p.p.；that 子句為 feeling 的同位語。"}, {"en": "This phenomenon, sometimes called \"choice overload,\" has also been observed in adults when shopping for products like cereal or shampoo, where dozens of nearly identical options can make simple decisions surprisingly difficult.", "zh": "這種現象有時被稱為「選擇過載」，也在成人購買麥片或洗髮精這類產品時被觀察到；在這些情況下，幾十種幾乎一模一樣的選項，會讓簡單的決定變得出奇地困難。", "sa": "【S】This phenomenon 【V】has also been observed 【M】in adults when shopping…<br>📌 sometimes called… 為過去分詞插入語；where 引導關係子句；make + O + adj.。"}, {"en": "Based on these findings, some experts suggest that offering a smaller, carefully selected range of choices may actually lead to greater satisf e employee satisfaction and (to) reduce turnover<br>📌 句型：aim to V「旨在、目標是……」；and 連接兩個原形動詞。<br>enhance ≒ improve「提升」。", "on": ["測量，語意不符。", "enhance（提升、增強）與 improve 意義最接近。", "限制，語意相反。", "討論，語意不符。"], "oz": ["測量；衡量", "改善；提升", "限制", "討論"]}, {"n": 11, "p": 1, "stem": "Employee: I finished organizing the files you asked for.<br>Manager: _____<br>Employee: I put them in the cabinet by the window, sorted by date.", "o": ["Did you remember to lock the office?", "Great, where did you put them?", "When is the meeting scheduled?", "Who asked you to do that?"], "a": 1, "exp": "✓ (B) Great, where did you put them?— 員工回答檔案放在哪裡，呼應主管詢問檔案位置。\n❌ (A) 問是否鎖門，與「整理檔案」話題無關。\n❌ (C) 問會議時間，與話題無關。\n❌ (D) 問「誰要求你做的」，與主管自己交代的任務矛盾。", "zh": "員工：您要我整理的檔案，我整理好了。<br>經理：<b>很好，你把它們放在哪裡？<\/b><br>員工：我放在窗邊的櫃子裡，按照日期排好了。", "sa": "空格句：where did 【S】you 【V】put 【O】them?（疑問詞開頭，助動詞 did 提前）<br>📌 前句：the files (that) you asked for → 省略受格關代。<br>回應句：sorted by date 為過去分詞片語，補充說明檔案狀態。", "on": ["問是否鎖門，與「整理檔案」話題無關。", "員工回答檔案放在哪裡，呼應主管詢問檔案位置。", "問會議時間，與話題無關。", "問「誰要求你做的」，與主管自己交代的任務矛盾。"], "oz": ["你有記得鎖辦公室嗎？", "太好了，你放在哪裡？", "會議排在什麼時候？", "誰叫你做的？"]}, {"n": 12, "p": 1, "stem": "Passenger: Excuse me, is this seat taken?<br>Stranger: _____<br>Passenger: Thanks, I'll just put my bag here then.", "o": ["No, go ahead. It's free.", "Yes, my friend is sitting there.", "I'm getting off at the next stop.", "This train is always crowded."], "a": 0, "exp": "✓ (A) No, go ahead. It's free.— 乘客回應「謝謝，那我把包包放這裡」，呼應陌生人表示座位是空的。\n❌ (B) 說「有人坐」，與乘客接著「把包包放這裡」矛盾。\n❌ (C) 說自己下一站要下車，未直接回答座位是否有人。\n❌ (D) 說火車總是很擠，與問題無直接關聯。", "zh": "乘客：不好意思，這個位子有人坐嗎？<br>陌生人：<b>沒有，請坐，這位子是空的。<\/b><br>乘客：謝謝，那我就把包包放在這裡。", "sa": "空格句：No, go ahead.（祈使句「請便」）【S】It 【V】's 【C】free<br>📌 句型：Is this seat taken? → 被動 be taken「被佔用」；回答 No 表示「沒人坐」。", "on": ["乘客回應「謝謝，那我把包包放這裡」，呼應陌生人表示座位是空的。", "說「有人坐」，與乘客接著「把包包放這裡」矛盾。", "說自己下一站要下車，未直接回答座位是否有人。", "說火車總是很擠，與問題無直接關聯。"], "oz": ["沒有，請坐，這位子沒人。", "有，我朋友坐那裡。", "我下一站就要下車了。", "這班火車總是很擠。"]}, {"n": 13, "p": 1, "stem": "Wife: Did you remember to turn off the oven before we left?<br>Husband: _____<br>Wife: Oh good, I was worried we left it on.", "o": ["I think we should buy a new oven.", "Yes, I checked it twice before locking the door.", "The oven hasn't worked properly for weeks.", "We don't even have an oven at home."], "a": 1, "exp": "✓ (B) Yes, I checked it twice before locking the door.— 妻子回應「太好了，我還擔心烤箱沒關」，呼應丈夫確認已關閉。\n❌ (A) 提議買新烤箱，未回答問題。\n❌ (C) 說烤箱壞了好幾週，與妻子「擔心沒關」的回應不符。\n❌ (D) 說家裡根本沒有烤箱，與妻子的問題矛盾。", "zh": "太太：我們出門前，你有記得關烤箱嗎？<br>先生：<b>有，我鎖門前檢查了兩次。<\/b><br>太太：喔，太好了，我還擔心我們沒關。", "sa": "空格句：【S】I 【V】checked 【O】it 【M】twice before locking the door<br>📌 句型：before + V-ing；remember to V「記得去做」。<br>回應句：I was worried (that) we left it on → leave + O + on「讓……開著」。", "on": ["提議買新烤箱，未回答問題。", "妻子回應「太好了，我還擔心烤箱沒關」，呼應丈夫確認已關閉。", "說烤箱壞了好幾週，與妻子「擔心沒關」的回應不符。", "說家裡根本沒有烤箱，與妻子的問題矛盾。"], "oz": ["我覺得我們該買一台新烤箱。", "有，我鎖門前檢查了兩次。", "烤箱好幾週都不太正常了。", "我們家根本沒有烤箱。"]}, {"n": 14, "p": 1, "stem": "Customer: I ordered this jacket online, but it arrived with a small tear.<br>Staff: _____<br>Customer: That would be great, thank you.", "o": ["We don't accept returns on sale items.", "I'm sorry to hear that. We can send you a replacement right away.", "The jacket looks fine to me.", "You should have checked it before ordering."], "a": 1, "exp": "✓ (B) I'm sorry to hear that. We can send you a replacement right away.— 顧客回應「那真是太好了，謝謝」，呼應店員提供換貨服務。\n❌ (A) 說特價商品不接受退貨，與店員「立即補寄」的服務態度不符。\n❌ (C) 說外套看起來沒問題，否定顧客的描述，與顧客滿意的回應矛盾。\n❌ (D) 責備顧客「應該下訂前先檢查」，語氣不符且與顧客滿意的回應矛盾。", "zh": "顧客：我在網路上訂了這件夾克，但送來時有個小破洞。<br>店員：<b>很抱歉聽到這件事。我們可以馬上寄一件新的給您。<\/b><br>顧客：那太好了，謝謝。", "sa": "空格句：【S】We 【V】can send 【O】you 【O】a replacement 【M】right away<br>📌 句型：send + 人 + 物（雙受詞）；I'm sorry to hear that「聽到這件事很遺憾」。<br>前句：it arrived with a small tear → with 表附帶狀態。", "on": ["說特價商品不接受退貨，與店員「立即補寄」的服務態度不符。", "顧客回應「那真是太好了，謝謝」，呼應店員提供換貨服務。", "說外套看起來沒問題，否定顧客的描述，與顧客滿意的回應矛盾。", "責備顧客「應該下訂前先檢查」，語氣不符且與顧客滿意的回應矛盾。"], "oz": ["特價商品恕不退貨。", "很抱歉聽到這件事，我們馬上寄一件新的給您。", "我看這件外套沒問題啊。", "您應該在訂購前先檢查。"]}, {"n": 15, "p": 1, "stem": "Friend A: I'm thinking about learning to play the guitar.<br>Friend B: _____<br>Friend A: That's a good idea. Maybe I'll ask him this weekend.", "o": ["I don't think music lessons are worth the money.", "My cousin teaches guitar lessons on weekends; you could ask him.", "I've never been interested in music at all.", "You should sell your old guitar instead."], "a": 1, "exp": "✓ (B) My cousin teaches guitar lessons on weekends; you could ask him.— Friend A 回應「好主意，這週末我會問問他」，呼應 B 提供吉他老師的建議。\n❌ (A) 說音樂課不值得花錢，與 A「好主意」的回應矛盾。\n❌ (C) 說自己對音樂毫無興趣，未提供建議。\n❌ (D) 建議賣掉舊吉他，與「想學吉他」的話題不符。", "zh": "朋友A：我在考慮學彈吉他。<br>朋友B：<b>我表哥週末在教吉他課，你可以去問問他。<\/b><br>朋友A：好主意，也許我這個週末就去問他。", "sa": "空格句：【S】My cousin 【V】teaches 【O】guitar lessons 【M】on weekends; 【S】you 【V】could ask 【O】him<br>📌 句型：think about + V-ing「考慮做……」；could 表委婉建議。<br>（cousin 可指表／堂兄弟姊妹，此處依 him 為男性。）", "on": ["說音樂課不值得花錢，與 A「好主意」的回應矛盾。", "Friend A 回應「好主意，這週末我會問問他」，呼應 B 提供吉他老師的建議。", "說自己對音樂毫無興趣，未提供建議。", "建議賣掉舊吉他，與「想學吉他」的話題不符。"], "oz": ["我覺得音樂課不值得花錢。", "我表哥週末有教吉他，你可以問他。", "我從來都對音樂沒興趣。", "你應該把舊吉他賣掉。"]}, {"n": 16, "p": 1, "stem": "Teacher: Has everyone submitted their permission slips for the trip?<br>Student: _____<br>Teacher: That's fine, just bring it tomorrow morning at the latest.", "o": ["Yes, I submitted mine last week.", "I forgot to bring mine today, but I have it at home.", "The trip was canceled, wasn't it?", "I already went on the trip last year."], "a": 1, "exp": "✓ (B) I forgot to bring mine today, but I have it at home.— 老師回應「沒關係，明天早上前帶來就好」，呼應學生表示忘了帶但家裡有。\n❌ (A) 說上週就交了，與老師「明天帶來」的回應不符。\n❌ (C) 問「校外教學不是被取消了嗎」，與老師的回應不連貫。\n❌ (D) 說去年已經參加過這次校外教學，與情境不符。", "zh": "老師：大家都交了校外教學的家長同意書嗎？<br>學生：<b>我今天忘了帶，但它在我家。<\/b><br>老師：沒關係，最晚明天早上帶來就好。", "sa": "空格句：【S】I 【V】forgot to bring 【O】mine 【M】today, but 【S】I 【V】have 【O】it 【M】at home<br>📌 句型：forget to V「忘了去做」；mine＝my permission slip。<br>回應句：at the latest「最晚」。", "on": ["說上週就交了，與老師「明天帶來」的回應不符。", "老師回應「沒關係，明天早上前帶來就好」，呼應學生表示忘了帶但家裡有。", "問「校外教學不是被取消了嗎」，與老師的回應不連貫。", "說去年已經參加過這次校外教學，與情境不符。"], "oz": ["有，我上週就交了。", "我今天忘了帶，但在家裡。", "校外教學取消了，不是嗎？", "我去年已經去過了。"]}, {"n": 17, "p": 1, "stem": "Repairman: The leak seems to be coming from this pipe under the sink.<br>Homeowner: _____<br>Repairman: It shouldn't take more than an hour to fix.", "o": ["How long do you think it will take to fix?", "Is the kitchen sink broken too?", "When did you arrive?", "Should I call another repairman?"], "a": 0, "exp": "✓ (A) How long do you think it will take to fix?— 修理工回答「應該不會超過一小時」，呼應屋主詢問所需時間。\n❌ (B) 問廚房水槽是否也壞了，與修理工的回答不符。\n❌ (C) 問「你什麼時候到的」，與情境不符（修理工已在工作）。\n❌ (D) 問是否該叫另一位修理工，與修理工自信的回應不符。", "zh": "修理工：漏水好像是從水槽下面這根水管來的。<br>屋主：<b>你覺得要多久才能修好？<\/b><br>修理工：應該不會超過一個小時。", "sa": "空格句：How long do you think 【S】it 【V】will take 【M】to fix?<br>📌 句型：It takes + 時間 + to V「花多少時間做……」；疑問詞 + do you think + S + V（後面用直述句語序）。", "on": ["修理工回答「應該不會超過一小時」，呼應屋主詢問所需時間。", "問廚房水槽是否也壞了，與修理工的回答不符。", "問「你什麼時候到的」，與情境不符（修理工已在工作）。", "問是否該叫另一位修理工，與修理工自信的回應不符。"], "oz": ["你覺得要修多久？", "廚房水槽也壞了嗎？", "你什麼時候到的？", "我應該再找別的水電工嗎？"]}, {"n": 18, "p": 1, "stem": "Coach: You did really well in today's practice. Keep it up!<br>Player: _____<br>Coach: Of course. Practice makes perfect.", "o": ["I don't think I'll play in the next game.", "Thanks, Coach. I've been practicing every day after school.", "The weather was too hot for practice today.", "Can we skip practice tomorrow?"], "a": 1, "exp": "✓ (B) Thanks, Coach. I've been practicing every day after school.— 教練回應「當然，熟能生巧」，呼應球員提到每天練習。\n❌ (A) 說「我不打算參加下一場比賽」，與教練「保持下去」的鼓勵矛盾。\n❌ (C) 說今天天氣太熱不適合練習，與教練稱讚「今天練習表現很好」矛盾。\n❌ (D) 問是否能跳過明天的練習，與教練「保持下去」的鼓勵矛盾。", "zh": "教練：你今天練習表現得很好，繼續保持！<br>球員：<b>謝謝教練。我每天放學後都在練習。<\/b><br>教練：當然，熟能生巧。", "sa": "空格句：【S】I 【V】've been practicing 【M】every day after school<br>📌 句型：現在完成進行式 have been + V-ing，表持續到現在的動作；Keep it up「繼續保持」。", "on": ["說「我不打算參加下一場比賽」，與教練「保持下去」的鼓勵矛盾。", "教練回應「當然，熟能生巧」，呼應球員提到每天練習。", "說今天天氣太熱不適合練習，與教練稱讚「今天練習表現很好」矛盾。", "問是否能跳過明天的練習，與教練「保持下去」的鼓勵矛盾。"], "oz": ["我覺得下一場比賽我不會上場。", "謝謝教練，我每天放學後都有練習。", "今天天氣太熱，不適合練習。", "我們明天可以不練習嗎？"]}, {"n": 19, "p": 1, "stem": "Librarian: I'm sorry, but this book is already checked out by another student.<br>Visitor: _____<br>Librarian: Sure, I can put it on hold for you. It should be returned by next week.", "o": ["That's okay, can you let me know when it's available?", "I'll just buy a copy online instead.", "Never mind, I didn't really need it.", "Can I borrow your library card instead?"], "a": 0, "exp": "✓ (A) That's okay, can you let me know when it's available?— 圖書館員回應「可以幫你預約，下週應該會還回來」，呼應訪客詢問書何時可借。\n❌ (B) 說會直接在網路上買一本，與圖書館員提供「預約」服務的回應不連貫。\n❌ (C) 說「沒關係，其實不太需要」，與圖書館員主動提供預約服務矛盾。\n❌ (D) 要求借用圖書館員的借書證，不合理且與情境不符。", "zh": "圖書館員：抱歉，這本書已經被另一位學生借走了。<br>訪客：<b>沒關係，書可以借的時候，能通知我嗎？<\/b><br>圖書館員：當然，我可以幫你預約保留。這本書應該下週前會歸還。", "sa": "空格句：can you 【V】let 【O】me 【C】know 【M】when it's available?<br>📌 句型：let + O + 原形 V；when 引導副詞子句。<br>前句：be checked out（圖書）被借出；回應句 put it on hold「預約保留」。", "on": ["圖書館員回應「可以幫你預約，下週應該會還回來」，呼應訪客詢問書何時可借。", "說會直接在網路上買一本，與圖書館員提供「預約」服務的回應不連貫。", "說「沒關係，其實不太需要」，與圖書館員主動提供預約服務矛盾。", "要求借用圖書館員的借書證，不合理且與情境不符。"], "oz": ["沒關係，有書的時候可以通知我嗎？", "那我直接上網買一本好了。", "算了，我其實也不太需要。", "我可以改借你的借書證嗎？"]}, {"n": 20, "p": 1, "stem": "Babysitter: The kids just fell asleep about ten minutes ago.<br>Parent: _____<br>Babysitter: Of course. Thanks for letting me know. Drive safe!", "o": ["We should wake them up before dinner.", "Perfect timing. We'll be home in about twenty minutes.", "Did they eat their dinner already?", "I think they slept too much today."], "a": 1, "exp": "✓ (B) Perfect timing. We'll be home in about twenty minutes.— 保母回應「好的，謝謝告知，開車小心」，呼應家長告知即將到家的時間。\n❌ (A) 說「應該在晚餐前叫醒他們」，與「孩子剛睡著」的情境矛盾（不合理要求立刻叫醒）。\n❌ (C) 問孩子是否吃過晚餐，與保母「謝謝告知」的回應不連貫。\n❌ (D) 說「他們今天睡太多了」，與保母的回應不連貫。", "zh": "保母：孩子們大約十分鐘前剛睡著。<br>家長：<b>時間剛剛好。我們大概再二十分鐘就到家。<\/b><br>保母：好的，謝謝您告訴我。開車小心！", "sa": "空格句：【S】We 【V】'll be 【C】home 【M】in about twenty minutes<br>📌 句型：in + 一段時間「在……之後」（用於未來）；fall asleep「睡著」；ago 搭配過去式。", "on": ["說「應該在晚餐前叫醒他們」，與「孩子剛睡著」的情境矛盾（不合理要求立刻叫醒）。", "保母回應「好的，謝謝告知，開車小心」，呼應家長告知即將到家的時間。", "問孩子是否吃過晚餐，與保母「謝謝告知」的回應不連貫。", "說「他們今天睡太多了」，與保母的回應不連貫。"], "oz": ["我們應該在晚餐前叫醒他們。", "時間剛好，我們大約二十分鐘後到家。", "他們吃過晚餐了嗎？", "我覺得他們今天睡太多了。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["play", "played", "playing", "to play"], "a": 2, "exp": "✓ (C) playing（動名詞作主詞）— \"playing an instrument can benefit the brain\" 中，playing an instrument 為動名詞片語，作該子句的主詞。\n❌ (A) play = 動詞原形，不能單獨作主詞。\n❌ (B) played = 過去式/過去分詞，不能作主詞。\n❌ (D) to play = 不定詞，雖可作主詞但與全文語感的動名詞用法不符，且後方動詞 can benefit 搭配動名詞主詞更自然。", "zh": "<i>However, research suggests that <b>playing<\/b> an instrument can benefit the brain in many other ways.<\/i><br>然而，研究顯示，演奏樂器能在其他許多方面對大腦有益。", "sa": "【S】research 【V】suggests 【O】that…<br>that 子句：【S】playing an instrument（動名詞當主詞）【V】can benefit 【O】the brain 【M】in many other ways<br>📌 句型：動名詞片語當主詞；suggest that 在此表「顯示」，不是「建議」，所以不用 should。", "on": ["動詞原形，不能單獨作主詞。", "過去式/過去分詞，不能作主詞。", "\"playing an instrument can benefit the brain\" 中，playing an instrument 為動名詞片語，作該子句的主詞。", "不定詞，雖可作主詞但與全文語感的動名詞用法不符，且後方動詞 can benefit 搭配動名詞主詞更自然。"], "oz": ["演奏（原形動詞）", "演奏（過去式）", "演奏（動名詞，當主詞）", "去演奏（不定詞）"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["like", "alike", "likely", "liking"], "a": 0, "exp": "✓ (A) like（介系詞，例如）— \"subjects like mathematics\" 表示「像數學這樣的科目」，like 作「例如」之意。\n❌ (B) alike = 形容詞/副詞「相似的」，不能直接接名詞作此用法。\n❌ (C) likely = 形容詞「可能的」，語意不符。\n❌ (D) liking = 動名詞「喜歡」，語意與用法皆不符。", "zh": "<i>For example, children who study music often perform better in subjects <b>like<\/b> mathematics, since reading music involves recognizing patterns and ratios.<\/i><br>例如，學音樂的孩子在數學等科目上往往表現較好，因為讀樂譜需要辨識規律和比例。", "sa": "【S】children who study music 【V】often perform 【M】better in subjects like mathematics<br>【M】since reading music involves recognizing patterns and ratios<br>📌 句型：介系詞 like「像是、例如」，後接名詞；involve + V-ing「涉及……」。", "on": ["\"subjects like mathematics\" 表示「像數學這樣的科目」，like 作「例如」之意。", "形容詞/副詞「相似的」，不能直接接名詞作此用法。", "形容詞「可能的」，語意不符。", "動名詞「喜歡」，語意與用法皆不符。"], "oz": ["像是；例如（介系詞）", "相似的；同樣地", "可能的", "喜好"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["earlier", "the earlier", "early", "earliest"], "a": 1, "exp": "✓ (B) the earlier（the + 比較級）— \"The earlier musical training begins, the greater the impact...\" 為 \"the + 比較級..., the + 比較級...\" 句型，表示「越早…就越…」。\n❌ (A) earlier = 缺少 the，不符合此句型結構。\n❌ (C) early = 原級，不符合比較句型。\n❌ (D) earliest = 最高級，不符合 \"the + 比較級, the + 比較級\" 的句型。", "zh": "<i>Some researchers even believe that <b>the earlier<\/b> musical training begins, the greater the impact on brain development.<\/i><br>有些研究者甚至認為，音樂訓練開始得越早，對大腦發展的影響就越大。", "sa": "【S】Some researchers 【V】even believe 【O】that…<br>📌 句型：The + 比較級 + S + V, the + 比較級 + S + V「越……就越……」（後半省略 is：the greater the impact is）。<br>例：The more you read, the better you write.", "on": ["缺少 the，不符合此句型結構。", "\"The earlier musical training begins, the greater the impact...\" 為 \"the + 比較級..., the + 比較級...\" 句型，表示「越早…就越…」。", "原級，不符合比較句型。", "最高級，不符合 \"the + 比較級, the + 比較級\" 的句型。"], "oz": ["較早的（比較級）", "越早……（the 比較級，越……就越……）", "早的", "最早的（最高級）"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["gain", "gained", "gaining", "to gain"], "a": 1, "exp": "✓ (B) gained（過去分詞，被動修飾）— \"the skills gained through music lessons\" 表示「透過音樂課所獲得的技能」，過去分詞修飾 skills（技能是被獲得的）。\n❌ (A) gain = 動詞原形，不能直接修飾名詞。\n❌ (C) gaining = 現在分詞，語意上會變成「正在獲得的技能」，與「透過音樂課程獲得」的被動關係不符。\n❌ (D) to gain = 不定詞表目的，語意不符。", "zh": "<i>Of course, not every child will become a professional musician, but the skills <b>gained<\/b> through music lessons can be useful in many areas of life.<\/i><br>當然，不是每個孩子都會成為職業音樂家，但透過音樂課獲得的技能，在生活的許多方面都很有用。", "sa": "【S】not every child 【V】will become 【C】a professional musician<br>, but 【S】the skills 【M】gained through music lessons 【V】can be 【C】useful<br>📌 句型：過去分詞後位修飾（＝which are gained，被動）；not every「並非每個」為部分否定。", "on": ["動詞原形，不能直接修飾名詞。", "\"the skills gained through music lessons\" 表示「透過音樂課所獲得的技能」，過去分詞修飾 skills（技能是被獲得的）。", "現在分詞，語意上會變成「正在獲得的技能」，與「透過音樂課程獲得」的被動關係不符。", "不定詞表目的，語意不符。"], "oz": ["獲得（原形動詞）", "獲得的（過去分詞，修飾 skills）", "獲得（現在分詞）", "去獲得（不定詞）"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["main", "mainly", "mainland", "maintain"], "a": 1, "exp": "✓ (B) mainly（副詞，主要地）— \"umbrellas were originally used mainly as protection from the sun\" 表示「最初主要被用作遮陽」，副詞修飾動詞 used。\n❌ (A) main = 形容詞，不能修飾動詞 used。\n❌ (C) mainland = 名詞「大陸」，語意與詞性皆不符。\n❌ (D) maintain = 動詞「維持」，語意與詞性皆不符。", "zh": "<i>In many of these cultures, umbrellas were originally used <b>mainly<\/b> as protection from the sun rather than the rain, and they were often associated with status — only royalty or the wealthy were allowed to use them.<\/i><br>在其中許多文化裡，傘最初主要是用來遮陽而不是擋雨，而且常和身分地位連結在一起——只有王室或有錢人才被允許使用。", "sa": "【S】umbrellas 【V】were originally used 【M】mainly as protection from the sun rather than the rain<br>📌 句型：副詞 mainly 修飾 used as…；A rather than B「是 A 而非 B」；be associated with「與……有關」；the wealthy＝the + 形容詞表一群人。", "on": ["形容詞，不能修飾動詞 used。", "\"umbrellas were originally used mainly as protection from the sun\" 表示「最初主要被用作遮陽」，副詞修飾動詞 used。", "名詞「大陸」，語意與詞性皆不符。", "動詞「維持」，語意與詞性皆不符。"], "oz": ["主要的（形容詞）", "主要地（副詞）", "大陸；本土", "維持；保養"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["afford", "afforded", "affordable", "affording"], "a": 2, "exp": "✓ (C) affordable（形容詞，負擔得起的）— \"umbrellas became affordable for everyday people\" 表示「雨傘變得讓一般人也能負擔得起」，become + 形容詞為常見句型。\n❌ (A) afford = 動詞原形，become 後通常接形容詞而非動詞原形。\n❌ (B) afforded = 過去分詞，與 become 搭配不符常見用法。\n❌ (D) affording = 現在分詞，與 become 搭配不自然。", "zh": "<i>It wasn't until much later that umbrellas became <b>affordable<\/b> for everyday people to protect themselves from rain.<\/i><br>直到很久以後，傘才變得一般人也買得起，用來替自己擋雨。", "sa": "【S】umbrellas 【V】became 【C】affordable 【M】for everyday people to protect themselves from rain<br>📌 句型：It was not until + 時間 + that + 子句「直到……才……」（強調句型）；become + 形容詞。", "on": ["動詞原形，become 後通常接形容詞而非動詞原形。", "過去分詞，與 become 搭配不符常見用法。", "\"umbrellas became affordable for everyday people\" 表示「雨傘變得讓一般人也能負擔得起」，become + 形容詞為常見句型。", "現在分詞，與 become 搭配不自然。"], "oz": ["負擔得起（原形動詞）", "負擔得起（過去式）", "負擔得起的；平價的（形容詞）", "負擔得起（現在分詞）"]}, {"n": 27, "p": 2, "stem": "(27)", "o": ["Despite", "Because", "Unless", "Although"], "a": 0, "exp": "✓ (A) Despite（儘管，介系詞）— \"Despite their simple design, modern umbrellas still rely on...\" 表示「儘管設計簡單，現代雨傘仍依賴…」，despite 後接名詞片語 their simple design。\n❌ (B) Because = 因為，後面需接 of + 名詞或完整子句，且語意上「因為設計簡單」與「仍依賴相同原理」非因果關係。\n❌ (C) Unless = 除非，語意不符。\n❌ (D) Although = 雖然，後面需接完整子句（主詞+動詞），而此處接的是名詞片語 their simple design，文法不符。", "zh": "<i><b>Despite<\/b> their simple design, modern umbrellas still rely on the same basic principle as ancient ones: a frame covered with material that blocks out the sun or rain.<\/i><br>儘管設計簡單，現代的傘仍然依靠和古代的傘相同的基本原理：一個框架，上面覆蓋著能遮擋陽光或雨水的材料。", "sa": "【M】Despite their simple design（despite + 名詞）<br>【S】modern umbrellas 【V】still rely on 【O】the same basic principle as ancient ones<br>📌 句型：despite＝in spite of，為介系詞，後接名詞；although／because 是連接詞，後面要接子句；the same… as…。", "on": ["\"Despite their simple design, modern umbrellas still rely on...\" 表示「儘管設計簡單，現代雨傘仍依賴…」，despite 後接名詞片語 their simple design。", "因為，後面需接 of + 名詞或完整子句，且語意上「因為設計簡單」與「仍依賴相同原理」非因果關係。", "除非，語意不符。", "雖然，後面需接完整子句（主詞+動詞），而此處接的是名詞片語 their simple design，文法不符。"], "oz": ["儘管（介系詞）", "因為（連接詞）", "除非", "雖然（連接詞）"]}, {"n": 28, "p": 2, "stem": "(28)", "o": ["remain", "remained", "remains", "remaining"], "a": 1, "exp": "✓ (B) remained（過去分詞，與 has 構成現在完成時）— \"the basic shape has remained largely unchanged for centuries\" 為現在完成時 has + 過去分詞，表示「幾個世紀以來基本上維持不變」。\n❌ (A) remain = 動詞原形，與 has 搭配文法不符。\n❌ (C) remains = 第三人稱單數現在式，與 has 搭配文法不符。\n❌ (D) remaining = 現在分詞，與 has 搭配文法不符。", "zh": "<i>Some designers have tried to reinvent the umbrella with new materials and folding mechanisms, but the basic shape has <b>remained<\/b> largely unchanged for centuries.<\/i><br>有些設計師曾試著用新材料和折疊機制重新改造傘，但幾個世紀以來，傘的基本形狀大致都沒有改變。", "sa": "【S】the basic shape 【V】has remained 【C】largely unchanged 【M】for centuries<br>📌 句型：現在完成式 has + p.p. + for + 一段時間；remain + 形容詞（連綴動詞）。", "on": ["動詞原形，與 has 搭配文法不符。", "\"the basic shape has remained largely unchanged for centuries\" 為現在完成時 has + 過去分詞，表示「幾個世紀以來基本上維持不變」。", "第三人稱單數現在式，與 has 搭配文法不符。", "現在分詞，與 has 搭配文法不符。"], "oz": ["保持（原形動詞）", "保持（過去分詞，完成式 has  and data connections, they can become useless in areas with poor reception, such as remote mountains or underground spaces」 ✓ 為正解。", "文中說的是數位地圖比紙本地圖「更新得更快」，並非更慢。"], "oz": ["比紙本地圖貴。", "無法顯示餐廳或新建築。", "在訊號不好的地方可能無法使用。", "更新速度比紙本地圖慢。"]}, {"n": 35, "p": 3, "stem": "What do many hikers and travelers still recommend?", "o": ["Avoiding digital maps altogether.", "Carrying a paper map as a backup.", "Only traveling to areas with strong signal.", "Printing a new map every day."], "a": 1, "exp": "文中提到：「many hikers and travelers still recommend carrying a paper map as a backup, especially when traveling to areas without reliable cell service」\n(B) Carrying a paper map as a backup. ✓ 為正解。\n❌ (A) 文中並未建議完全避免使用數位地圖。\n❌ (C) 文中未建議只前往訊號良好的地區。\n❌ (D) 文中未提到每天列印新地圖。", "zh": "題目：許多健行者和旅人仍然建議做什麼？<br>(A) 完全避免使用數位地圖。<br>(B) 攜帶紙本地圖作為備用。<br>(C) 只去訊號強的地方旅行。<br>(D) 每天印一張新地圖。", "sa": "依據句：【S】many hikers and travelers 【V】still recommend 【O】carrying a paper map as a backup<br>📌 句型：recommend + V-ing；as a backup「作為備用」；For this reason「因此」。", "on": ["文中並未建議完全避免使用數位地圖。", "文中提到：「many hikers and travelers still recommend carrying a paper map as a backup, especially when traveling to areas without reliable cell service」 ✓ 為正解。", "文中未建議只前往訊號良好的地區。", "文中未提到每天列印新地圖。"], "oz": ["完全避免使用數位地圖。", "攜帶紙本地圖作為備用。", "只去訊號強的地方旅行。", "每天印一張新地圖。"]}, {"n": 36, "p": 3, "stem": "What is the main idea of this passage?", "o": ["Children should never be given any choices.", "Having too many choices can cause stress rather than happiness.", "Adults are immune to choice overload.", "More choices always lead to better decisions."], "a": 1, "exp": "全文主旨：給予孩童（甚至成人）過多選擇反而可能造成壓力，而非更開心。\n(B) Having too many choices can cause stress rather than happiness. ✓ 為正解。\n❌ (A) 文中並未主張「完全不該給孩子選擇」，而是建議提供「較少但精心挑選」的選項。\n❌ (C) 文中明確說成人也會經歷 choice overload，並非免於此現象。\n❌ (D) 文中說的恰好相反——選擇過多反而讓人較不滿意。", "zh": "題目：本文的主旨是什麼？<br>(A) 永遠不該讓孩子做任何選擇。<br>(B) 選擇太多可能帶來壓力，而不是快樂。<br>(C) 成人不會受到選擇過多的影響。<br>(D) 選擇越多，一定會做出越好的決定。", "sa": "依據句：However, 【S】some psychologists 【V】argue 【O】that too much choice can actually cause stress, even in children<br>📌 句型：However 轉折後通常就是主旨；too much + 不可數名詞（choice 在此當不可數）。", "on": ["文中並未主張「完全不該給孩子選擇」，而是建議提供「較少但精心挑選」的選項。", "全文主旨：給予孩童（甚至成人）過多選擇反而可能造成壓力，而非更開心。 ✓ 為正解。", "文中明確說成人也會經歷 choice overload，並非免於此現象。", "文中說的恰好相反——選擇過多反而讓人較不滿意。"], "oz": ["永遠不該讓孩子做任何選擇。", "選擇太多可能帶來壓力，而不是快樂。", "成人不會受到選擇過多的影響。", "選擇越多，一定會做出越好的決定。"]}, {"n": 37, "p": 3, "stem": "According to the passage, why might too many choices make people less confident?", "o": ["They take too long to read all the options.", "They worry that another option might have been better.", "They cannot remember what they chose.", "They are not allowed to change their minds."], "a": 1, "exp": "文中提到：「too many choices make it harder to feel confident about a decision — there is always a nagging feeling that another option might have been better」\n(B) They worry that another option might have been better. ✓ 為正解。\n❌ (A) 文中未提到閱讀所有選項耗時。\n❌ (C) 文中未提到記不住自己選了什麼。\n❌ (D) 文中未提到不能改變心意。", "zh": "題目：根據本文，為什麼選擇太多可能讓人比較沒有信心？<br>(A) 要花太久時間讀完所有選項。<br>(B) 他們擔心另一個選項可能更好。<br>(C) 他們記不得自己選了什麼。<br>(D) 他們不被允許改變主意。", "sa": "依據句：【S】too many choices 【V】make 【O】it 【C】harder 【M】to feel confident about a decision — there is always a nagging feeling that another option might have been better<br>📌 句型：make + it + 形容詞 + to V；might have + p.p.「（過去）可能本來會……」；that 子句為 feeling 的同位語。", "on": ["文中未提到閱讀所有選項耗時。", "文中提到：「too many choices make it harder to feel confident about a decision — there is always a nagging feeling that another option might have been better」 ✓ 為正解。", "文中未提到記不住自己選了什麼。", "文中未提到不能改變心意。"], "oz": ["要花太久時間讀完所有選項。", "他們擔心另一個選項可能更好。", "他們記不得自己選了什麼。", "他們不被允許改變主意。"]}, {"n": 38, "p": 3, "stem": "Where else has \"choice overload\" been observed, according to the passage?", "o": ["In job interviews.", "In children's classrooms.", "In adults shopping for products like cereal or shampoo.", "In online video games."], "a": 2, "exp": "文中提到：「This phenomenon...has also been observed in adults when sho const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "許多學生在準備考試時會感到壓力，因此適當的休息是重要的。<br><span class=\"blankline\">Many students feel s<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① when preparing for exams, so getting proper r<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② is important.<\/span>", "ans": "① <b>stressed<\/b>　② <b>rest<\/b>", "exp": "① stressed（感到壓力）— 依提示字首 s 及句意「準備考試時感到壓力」。\n② rest（休息）— 依提示字首 r 及句意「適當的休息」。", "zh": "① stressed「感到有壓力的」　② rest「休息」<br>全句：許多學生在準備考試時會感到壓力，因此適當的休息是重要的。", "sa": "參考句：Many students feel <b>stressed<\/b> when preparing for exams, so proper <b>rest<\/b> is important.<br>【S】Many students 【V】feel 【C】stressed 【M】when preparing for exams, so 【S】proper rest 【V】is 【C】important<br>📌 句型：feel + 形容詞（人「感到」用 -ed）；when + V-ing 省略主詞與 be 動詞。"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>among travelers / and friendly people / this city / its delicious street food / is known for<\/i>", "ans": "This city is known for its delicious street food and friendly people among travelers.", "exp": "句構：主詞 (This city) + is known for（be known for 為固定用法，表「以…聞名」）+ its delicious street food and friendly people（受詞，兩個並列名詞片語）+ among travelers（介系詞片語修飾語）。", "zh": "這座城市在旅客之間以美味的街頭小吃和友善的人們聞名。", "sa": "【S】This city 【V】is known for 【O】its delicious street food and friendly people 【M】among travelers<br>📌 句型：be known for + 原因「因……而聞名」；比較 be known as + 身分、be known to + 人。<br>較自然的語序：This city is known among travelers for…。"}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>學生應該學習如何有效地管理他們的時間。", "ans": "Students should learn how to manage their time effectively.", "exp": "重點結構：should + 動詞原形（should learn）；how to + 動詞原形（how to manage）作 learn 的受詞；effectively 為副詞修飾 manage。", "zh": "題意：學生應該學會如何有效地管理自己的時間。", "sa": "【S】Students 【V】should learn 【O】how to manage their time effectively<br>📌 句型：should + 原形 V；疑問詞 + to V（how to manage）當受詞；副詞 effectively 修飾 manage。"}];
const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){

 }
 return out;
}
window.AK=function(fn){
 function run(){

  window.__AK_DATA=secs;
  if(!secs.length)return;

  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});
return secs;
});</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>

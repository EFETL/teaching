<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統測英文模擬考卷 L</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>統測英文　<span style="opacity:.9">模擬考卷 L</span></h1>
    <p>科技校院四年制與專科學校二年制統一入學測驗　共同科目：英文（模擬）</p>
    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 42</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 L　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nBefore the printing press was invented, books <span class=\"blk\">21</span> copied by hand, a process that could take months or even years for a single volume. When Johannes Gutenberg developed a printing press using movable type in the 15th century, it became possible <span class=\"blk\">22</span> produce many copies of a book in a much shorter amount of time. This invention, <span class=\"blk\">23</span> spread quickly across Europe, made books more affordable and allowed ideas to circulate more widely than ever before. Many historians consider the printing press to be one of the most important inventions <span class=\"blk\">24</span> created.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nCities tend to be significantly warmer than the surrounding countryside, a phenomenon known as the \"urban heat island\" effect. This occurs largely because materials commonly used in cities, such as asphalt and concrete, absorb and retain heat <span class=\"blk\">25</span> natural surfaces like grass and trees, which reflect more sunlight and provide cooling through a process called evapotranspiration. As a result, city residents may experience higher energy bills in summer, <span class=\"blk\">26</span> they rely more heavily on air conditioning to stay comfortable. To reduce the urban heat island effect, some cities have begun <span class=\"blk\">27</span> trees along streets, installing green roofs covered in vegetation, and using lighter-colored materials for roads and buildings, all of <span class=\"blk\">28</span> can help reflect sunlight and lower temperatures.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice</b><br><br>The water fountains on the third and fourth floors will be out of service tomorrow due to scheduled maintenance. Employees on these floors may use the water fountain in the first-floor lobby during this time. We expect the work to be completed by the end of the day, and normal service will resume the following morning.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Lily: I'm going on a trip next week. Could you water my plants while I'm gone? Noah: Sure, no problem. How often do they need water? Lily: Just twice, on Tuesday and Friday should be enough. Noah: Got it, I'll take care of it.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nAs social media platforms have made it easier than ever to share information quickly, researchers have become increasingly interested in how false information, often called misinformation, spreads online. Studies have found that posts containing surprising or emotionally charged claims tend to be shared more often and more quickly than accurate but less exciting information, regardless of whether the claims are true. This pattern can make it difficult for accurate information to compete with misinformation once a false claim has already spread widely. Some platforms have responded by adding warning labels to posts that contain unverified claims and by working with independent fact-checking organizations to review popular content. However, researchers note that warning labels alone may not be enough, since many users share posts without reading them carefully, and some users may distrust fact-checkers regardless of the labels provided. For this reason, many experts argue that teaching people to evaluate sources critically, a skill often called media literacy, is just as important as any technical solution.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nWith laptops and tablets now common in classrooms, many students take notes by typing rather than writing by hand. However, several studies have suggested that students who take notes by hand may understand and remember material better than those who type, even when the typed notes contain more information overall. Researchers believe this may be because typing allows students to write down what a speaker says nearly word for word, without needing to think carefully about the meaning. Writing by hand, on the other hand, is generally slower, which forces students to summarize and process information as they write, leading to deeper understanding. This does not mean that typing notes is always worse — for students with certain physical disabilities, typing may be the only practical option, and digital notes are often easier to organize and search later. Still, for students who are able to choose either method, some researchers recommend at least occasionally taking notes by hand, particularly when trying to deeply understand a complex topic.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Oscar moved into his apartment building, he noticed that many of his neighbors struggled with small home repairs because they didn't own basic tools like drills, ladders, or wrenches, and buying these items for occasional use seemed wasteful. Oscar, who had a small collection of tools from years of doing his own repairs, offered to lend tools to neighbors who needed them. At first, he kept track of who borrowed what using a simple notebook by his door. As more neighbors learned about the arrangement, Oscar's small collection wasn't enough to meet the demand, so he asked neighbors to donate tools they no longer used. Within a few months, Oscar had collected enough tools to fill a storage closet in the building's basement, which the building manager agreed to let him use. Oscar now sets aside a few hours each weekend to manage the tool library, helping neighbors find what they need and offering basic advice on how to use unfamiliar tools safely.</div>"};

": "我不在的時候，你可以幫我澆花嗎？", "sa": "【S】you 【V】water 【O】my plants<br>📌 Could you + V?（客氣請求）；while I'm gone（我不在時）"}, {"en": "Noah: Sure, no problem.", "zh": "Noah：當然，沒問題。", "sa": "口語回應，省略主詞動詞"}, {"en": "How often do they need water?", "zh": "它們多久需要澆一次水？", "sa": "【S】they 【V】need 【O】water<br>📌 How often…?（多久一次）"}, {"en": "Lily: Just twice, on Tuesday and Friday should be enough.", "zh": "Lily：只要兩次，星期二和星期五澆就夠了。", "sa": "【V】should be 【C】enough<br>📌 口語省略，should 表推測"}, {"en": "Noah: Got it, I'll take care of it.", "zh": "Noah：了解，我會處理好的。", "sa": "【S】I 【V】'll take care of 【O】it<br>📌 Got it（了解）；take care of（照顧、處理）"}], "33": [{"en": "As social media platforms have made it easier than ever to share information quickly, researchers have become increasingly interested in how false information, often called misinformation, spreads online.", "zh": "隨著社群媒體平台讓快速分享資訊變得前所未有地容易，研究人員越來越關注錯誤資訊（常被稱為「假訊息」）如何在網路上散播。", "sa": "【S】researchers 【V】have become 【C】increasingly interested in how…<br>📌 make it + adj. + to V（虛受詞 it）；how 引導名詞子句"}, {"en": "Studies have found that posts containing surprising or emotionally charged claims tend to be shared more often and more quickly than accurate but less exciting information, regardless of whether the claims are true.", "zh": "研究發現，含有令人驚訝或煽動情緒說法的貼文，往往比正確但較不刺激的資訊被分享得更頻繁、更快速，不論這些說法是否屬實。", "sa": "【S】Studies 【V】have found 【O】that posts… tend to be shared…<br>📌 containing… 後位修飾；regardless of whether…（不論是否）"}, {"en": "This pattern can make it difficult for accurate information to compete with misinformation once a false claim has already spread widely.", "zh": "一旦錯誤說法已經廣為流傳，這種模式就會讓正確資訊難以和假訊息競爭。", "sa": "【S】This pattern 【V】can make 【O】it 【C】difficult for… to compete<br>📌 make it + adj. + for 人 + to V；once（一旦）"}, {"en": "Some platforms have responded by adding warning labels to posts that contain unverified claims and by working with independent fact-checking organizations to review popular content.", "zh": "有些平台的因應方式是在含有未經證實說法的貼文加上警告標籤，並與獨立的事實查核機構合作審查熱門內容。", "sa": "【S】Some platforms 【V】have responded 【M】by adding… and by working…<br>📌 by + V-ing 表方法，兩個 by 片語對等"}, {"en": "However, researchers note that warning labels alone may not be enough, since many users share posts without reading them carefully, and some users may distrust fact-checkers regardless of the labels provided.", "zh": "然而，研究人員指出，光靠警告標籤可能不夠，因為許多使用者沒有仔細閱讀就分享貼文，而且有些使用者無論標籤如何都可能不信任事實查核者。", "sa": "【S】researchers 【V】note 【O】that warning labels alone may not be enough<br>📌 since（因為）；without + V-ing；provided 過去分詞後位修飾 labels"}, {"en": "For this reason, many experts argue that teaching people to evaluate sources critically, a skill often called media literacy, is just as important as any technical solution.", "zh": "因此，許多專家主張，教導人們批判性地評估資訊來源——也就是常說的「媒體素養」——和任何技術性解決方案一樣重要。", "sa": "【S】many experts 【V】argue 【O】that teaching people… is just as important as…<br>📌 動名詞片語當子句主詞；as + adj. + as"}], "36": [{"en": "With laptops and tablets now common in classrooms, many students take notes by typing rather than writing by hand.", "zh": "如今筆電和平板在教室中很普遍，許多學生用打字而非手寫來做筆記。", "sa": "【S】many students 【V】take 【O】notes 【M】by typing rather than writing by hand<br>📌 With + O + adj.（獨立分詞構句，表附帶狀況）；rather than"}, {"en": "However, several studies have suggested that students who take notes by hand may understand and remember material better than those who type, even when the typed notes contain more information overall.", "zh": "然而，數項研究指出，用手寫筆記的學生可能比打字的學生更能理解和記住內容，即使打字筆記整體包含的資訊更多。", "sa": "【S】several studies 【V】have suggested 【O】that students who… may understand…<br>📌 those who（那些……的人）；even when（即使在……時）"}, {"en": "Researchers believe this may be because typing allows students to write down what a speaker says nearly word for word, without needing to think carefully about the meaning.", "zh": "研究人員認為，這可能是因為打字讓學生幾乎能逐字記下講者說的話，而不需要仔細思考其意義。", "sa": "【S】Researchers 【V】believe 【O】this may be because…<br>📌 allow + O + to V；what 引導名詞子句；word for word（逐字地）"}, {"en": "Writing by hand, on the other hand, is generally slower, which forces students to summarize and process information as they write, leading to deeper understanding.", "zh": "另一方面，手寫通常比較慢，這迫使學生在書寫時摘要並消化資訊，進而帶來更深入的理解。", "sa": "【S】Writing by hand 【V】is 【C】generally slower<br>📌 動名詞當主詞；, which 指前句；force + 人 + to V；leading to… 表結果"}, {"en": "This does not mean that typing notes is always worse — for students with certain physical disabilities, typing may be the only practical option, and digital notes are often easier to organize and search later.", "zh": "這並不表示打字筆記總是比較差——對某些有身體障礙的學生來說，打字可能是唯一可行的選擇，而且數位筆記之後通常更容易整理與搜尋。", "sa": "【S】This 【V】does not mean 【O】that typing notes is always worse<br>📌 adj. + to V（easier to organize：整理起來比較容易）"}, {"en": "Still, for students who are able to choose either method, some researchers recommend at least occasionally taking notes by hand, particularly when trying to deeply understand a complex topic.", "zh": "儘管如此，對於能自由選擇任一方式的學生，有些研究人員建議至少偶爾用手寫筆記，特別是在想深入理解複雜主題的時候。", "sa": "【S】some researchers 【V】recommend 【O】(at least occasionally) taking notes by hand<br>📌 recommend + V-ing；when trying… 為省略主詞的副詞子句"}], "39": [{"en": "When Oscar moved into his apartment building, he noticed that many of his neighbors struggled with small home repairs because they didn't own basic tools like drills, ladders, or wrenches, and buying these items for occasional use seemed wasteful.", "zh": "Oscar 搬進公寓大樓時，注意到許多鄰居為家裡的小修繕所苦，因為他們沒有電鑽、梯子或扳手等基本工具，而為了偶爾使用就買這些東西似乎很浪費。", "sa": "【S】he 【V】noticed 【O】that many of his neighbors struggled with…<br>📌 struggle with；動名詞片語 buying… 當主詞，seem + adj."}, {"en": "Oscar, who had a small collection of tools from years of doing his own repairs, offered to lend tools to neighbors who needed them.", "zh": "Oscar 多年來自己動手修東西，累積了一些工具，他主動提議把工具借給有需要的鄰居。", "sa": "【S】Oscar 【V】offered 【O】to lend tools to neighbors<br>📌 , who… 非限定子句補充說明；offer to V（主動提議做……）"}, {"en": "At first, he kept track of who borrowed what using a simple notebook by his door.", "zh": "起初，他用門邊一本簡單的筆記本記錄誰借了什麼。", "sa": "【S】he 【V】kept track of 【O】who borrowed what<br>📌 keep track of（記錄）；using… 分詞片語表方法"}, {"en": "As more neighbors learned about the arrangement, Oscar's small collection wasn't enough to meet the demand, so he asked neighbors to donate tools they no longer used.", "zh": "隨著越來越多鄰居知道這項安排，Oscar 那一小批工具不夠應付需求，於是他請鄰居捐出不再使用的工具。", "sa": "【S】Oscar's small collection 【V】wasn't 【C】enough to meet the demand, so 【S】he 【V】asked 【O】neighbors 【C】to donate…<br>📌 enough to V；ask + 人 + to V"}, {"en": "Within a few months, Oscar had collected enough tools to fill a storage closet in the building's basement, which the building manager agreed to let him use.", "zh": "幾個月內，Oscar 收集到的工具已足以裝滿大樓地下室的一間儲藏室，大樓管理員也同意讓他使用那間儲藏室。", "sa": "【S】Oscar 【V】had collected 【O】enough tools to fill…<br>📌 過去完成式；, which 當 use 的受詞；let + O + 原形V"}, {"en": "Oscar now sets aside a few hours each weekend to manage the tool library, helping neighbors find what they need and offering basic advice on how to use unfamiliar tools safely.", "zh": "Oscar 現在每個週末撥出幾個小時管理這個工具圖書館，幫鄰居找到需要的工具，並提供如何安全使用陌生工具的基本建議。", "sa": "【S】Oscar 【V】sets aside 【O】a few hours 【M】to manage the tool library<br>📌 set aside（撥出）；helping… and offering… 分詞構句；how to V"}]};

n…?（……考得如何？）；That's a relief.（鬆了一口氣）", "on": ["✓ B 表示考得比預期好，A 回應「鬆了一口氣，我也很擔心」，語意連貫。", "「我沒有去考試」無法引發「鬆了一口氣」的回應。", "「考試被取消了」與「鬆了一口氣」不連貫。", "「我考得很差」會引發安慰而非「鬆了一口氣」。"], "oz": ["我覺得我考得比預期好。", "我沒有去考。", "考試取消了。", "我完全考砸了。"]}, {"n": 15, "p": 1, "stem": "Patient: I'd like to schedule a check-up.<br>Receptionist: _____<br>Patient: Tuesday morning works for me.", "o": ["We're fully booked for the rest of the year.", "Would Tuesday morning at 9 work for you?", "The doctor is on vacation.", "You don't need a check-up."], "a": 1, "exp": "(B) Would Tuesday morning at 9 work for you? ✓ 接待員提出星期二上午的時間，病人回應「星期二上午對我來說可以」，前後呼應。\n❌ (A) 「今年剩下時間都已預約滿」與後續病人接受星期二的安排矛盾。\n❌ (C) 「醫生休假中」無法接續安排時間。\n❌ (D) 「你不需要做健康檢查」與病人的請求矛盾。", "zh": "病人：我想預約健康檢查。<br>櫃檯人員：星期二早上 9 點可以嗎？<br>病人：星期二早上我可以。", "sa": "正解句：Would 【S】Tuesday morning at 9 【V】work 【M】for you?<br>📌 work for + 人（對某人來說方便、可行）<br>📌 schedule a check-up（預約健檢）", "on": ["「今年剩下時間都已預約滿」與後續病人接受星期二的安排矛盾。", "✓ 接待員提出星期二上午的時間，病人回應「星期二上午對我來說可以」，前後呼應。", "「醫生休假中」無法接續安排時間。", "「你不需要做健康檢查」與病人的請求矛盾。"], "oz": ["今年剩下的時間都已經約滿了。", "星期二早上九點可以嗎？", "醫生在休假。", "您不需要做健康檢查。"]}, {"n": 16, "p": 1, "stem": "Customer: Do you carry organic vegetables?<br>Clerk: _____<br>Customer: Great, I'll head over there now.", "o": ["We stopped selling vegetables.", "Yes, they're in aisle five.", "Organic food isn't healthy.", "We're out of vegetables today."], "a": 1, "exp": "(B) Yes, they're in aisle five. ✓ 店員告知有機蔬菜在第五排走道，顧客回應「我現在就過去」，文意連貫。\n❌ (A) 「我們不賣蔬菜了」與顧客接著要前往購買矛盾。\n❌ (C) 「有機食物不健康」非店員應有的回應，且與後續不符。\n❌ (D) 「今天蔬菜缺貨」與顧客「現在就過去」矛盾。", "zh": "顧客：你們有賣有機蔬菜嗎？<br>店員：有，在第五走道。<br>顧客：太好了，我現在就過去。", "sa": "正解句：Yes, 【S】they 【V】're 【M】in aisle five<br>📌 they 指 organic vegetables<br>📌 carry（店家販售、有進貨）；head over（前往）", "on": ["「我們不賣蔬菜了」與顧客接著要前往購買矛盾。", "✓ 店員告知有機蔬菜在第五排走道，顧客回應「我現在就過去」，文意連貫。", "「有機食物不健康」非店員應有的回應，且與後續不符。", "「今天蔬菜缺貨」與顧客「現在就過去」矛盾。"], "oz": ["我們已經不賣蔬菜了。", "有，在第五走道。", "有機食物不健康。", "我們今天蔬菜賣完了。"]}, {"n": 17, "p": 1, "stem": "Friend A: Has the package I ordered arrived yet?<br>Friend B: _____<br>Friend A: Okay, I'll keep an eye on the tracking number then.", "o": ["It's still in transit, but it should arrive tomorrow.", "It arrived this morning.", "The order was canceled.", "We never received your order."], "a": 0, "exp": "(A) It's still in transit, but it should arrive tomorrow. ✓ 包裹仍在運送中，A 回應「我會繼續追蹤」，文意連貫。\n❌ (B) 「今天早上已送達」與「我會繼續追蹤」矛盾。\n❌ (C) 「訂單已取消」與後續追蹤動作矛盾。\n❌ (D) 「我們從未收到你的訂單」邏輯不合（B 應為賣方或物流人員才合理，且與後續矛盾）。", "zh": "朋友 A：我訂的包裹到了嗎？<br>朋友 B：還在運送中，不過應該明天會到。<br>朋友 A：好，那我會持續留意追蹤號碼。", "sa": "正解句：【S】It 【V】's 【C】still in transit, but 【S】it 【V】should arrive 【M】tomorrow<br>📌 in transit（運送途中）；should 表推測（應該會）<br>📌 keep an eye on（留意、注意）；I ordered 為省略 that 的關係子句", "on": ["✓ 包裹仍在運送中，A 回應「我會繼續追蹤」，文意連貫。", "「今天早上已送達」與「我會繼續追蹤」矛盾。", "「訂單已取消」與後續追蹤動作矛盾。", "「我們從未收到你的訂單」邏輯不合（B 應為賣方或物流人員才合理，且與後續矛盾）。"], "oz": ["還在運送中，不過明天應該會到。", "今天早上就到了。", "訂單被取消了。", "我們從沒收到你的訂單。"]}, {"n": 18, "p": 1, "stem": "Classmate A: Are you joining the photography club this semester?<br>Classmate B: _____<br>Classmate A: That's great! We meet every Wednesday after school.", "o": ["I've never been interested in photography.", "Yes, I signed up yesterday.", "I don't have a camera.", "The club was canceled."], "a": 1, "exp": "(B) Yes, signed up yesterday. ✓ B 表示已加入攝影社，A 回應「太好了！我們每週三放學後聚會」，文意連貫。\n❌ (A) 「我從來對攝影沒興趣」與 A 接下來的歡迎語氣矛盾。\n❌ (C) 「我沒有相機」未直接回答是否加入社團。\n❌ (D) 「社團已經被取消」與 A 接著說明聚會時間矛盾。", "zh": "同學 A：你這學期要參加攝影社嗎？<br>同學 B：要，我昨天報名了。<br>同學 A：太好了！我們每週三放學後聚會。", "sa": "正解句：Yes, 【S】I 【V】signed up 【M】yesterday<br>📌 sign up (for)（報名、登記）<br>📌 現在進行式 Are you joining…? 表近期的計畫", "on": ["「我從來對攝影沒興趣」與 A 接下來的歡迎語氣矛盾。", "Yes, signed up yesterday. ✓ B 表示已加入攝影社，A 回應「太好了！我們每週三放學後聚會」，文意連貫。", "「我沒有相機」未直接回答是否加入社團。", "「社團已經被取消」與 A 接著說明聚會時間矛盾。"], "oz": ["我從來對攝影沒興趣。", "有啊，我昨天報名了。", "我沒有相機。", "社團被取消了。"]}, {"n": 19, "p": 1, "stem": "Customer: Does this dish contain peanuts? I have an allergy.<br>Server: _____<br>Customer: Thank you for checking.", "o": ["I'm not sure, let me ask the kitchen.", "Everything here contains peanuts.", "Allergies aren't a big deal.", "You should have asked before ordering."], "a": 0, "exp": "(A) I'm not sure, let me ask the kitchen. ✓ 服務生表示會去詢問廚房，顧客回應「謝謝你幫忙確認」，文意連貫。\n❌ (B) 「這裡所有餐點都含花生」過於武斷且未涉及「確認」動作。\n❌ (C) 「過敏不是什麼大問題」態度不當，且與「謝謝你幫忙確認」不符。\n❌ (D) 「你應該點餐前先問」語氣責備，與「謝謝」不連貫。", "zh": "顧客：這道菜有花生嗎？我會過敏。<br>服務生：我不確定，我去問一下廚房。<br>顧客：謝謝你幫我確認。", "sa": "正解句：【S】I 【V】'm 【C】not sure, let 【O】me 【C】ask the kitchen<br>📌 let + O + 原形動詞（讓某人做……）<br>📌 Thank you for + V-ing（謝謝你做……）", "on": ["✓ 服務生表示會去詢問廚房，顧客回應「謝謝你幫忙確認」，文意連貫。", "「這裡所有餐點都含花生」過於武斷且未涉及「確認」動作。", "「過敏不是什麼大問題」態度不當，且與「謝謝你幫忙確認」不符。", "「你應該點餐前先問」語氣責備，與「謝謝」不連貫。"], "oz": ["我不確定，我去問一下廚房。", "我們這裡每道菜都有花生。", "過敏沒什麼大不了的。", "你應該在點餐前就問。"]}, {"n": 20, "p": 1, "stem": "Coworker A: Are you nervous about the presentation tomorrow?<br>Coworker B: _____<br>Coworker A: That's a good way to think about it.", "o": ["A little, but I've prepared a lot, so I should be fine.", "I'm not giving any presentation.", "Presentations are pointless.", "I forgot about it completely."], "a": 0, "exp": "(A) A little, but I've prepared a lot, so I should be fine. ✓ B 表達了正向、務實的態度，A 回應「這是個好的想法」，文意連貫。\n❌ (B) 「我沒有要做任何報告」與 A 詢問「明天的報告」矛盾。\n❌ (C) 「報告根本沒有意義」消極態度，與 A 的正面回應不符。\n❌ (D) 「我完全忘了這件事」與 A 稱讚「想法很好」不連貫。", "zh": "同事 A：你對明天的簡報會緊張嗎？<br>同事 B：有一點，但我準備了很多，所以應該沒問題。<br>同事 A：這樣想很好。", "sa": "正解句：A little, but 【S】I 【V】've prepared 【O】a lot, so 【S】I 【V】should be 【C】fine<br>📌 現在完成式表已完成的準備；but 轉折、so 表結果<br>📌 be nervous about（對……緊張）", "on": ["✓ B 表達了正向、務實的態度，A 回應「這是個好的想法」，文意連貫。", "「我沒有要做任何報告」與 A 詢問「明天的報告」矛盾。", "「報告根本沒有意義」消極態度，與 A 的正面回應不符。", "「我完全忘了這件事」與 A 稱讚「想法很好」不連貫。"], "oz": ["有一點，不過我準備了很多，應該沒問題。", "我沒有要報告。", "報告根本沒意義。", "我完全忘了這件事。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["were", "was", "are", "is"], "a": 0, "exp": "(A) were ✓ 與複數主詞 books 及被動語態 copied 搭配正確。\n❌ (B) was 為單數動詞，與複數主詞 books 不一致。\n❌ (C) are／(D) is 均為現在時，與全文過去時態（invented, developed）不一致。", "zh": "<i>Before the printing press was invented, books <b>were<\/b> copied by hand, a process that could take months or even years for a single volume.<\/i><br>在印刷機發明之前，書籍都是靠手抄寫的，光一冊書就可能要花上好幾個月甚至好幾年。", "sa": "【S】books 【V】were copied 【M】by hand<br>📌 過去式被動 were + p.p.（複數主詞 books）<br>📌 a process that… 為同位語，補充說明「手抄」這件事", "on": ["✓ 與複數主詞 books 及被動語態 copied 搭配正確。", "為單數動詞，與複數主詞 books 不一致。", "／", "均為現在時，與全文過去時態（invented, developed）不一致。"], "oz": ["是；被（過去式，複數）", "是；被（過去式，單數）", "是；被（現在式，複數）", "是；被（現在式，單數）"]}, {"n": 22, "p": 2, "stem": "(22)", "o": ["to produce", "producing", "produce", "produced"], "a": 0, "exp": "(A) to produce ✓ 符合 \"it became possible to + 原形動詞\" 的句型。\n❌ (B) producing／(C) produce／(D) produced 皆不符合此句型的固定搭配。", "zh": "<i>When Johannes Gutenberg developed a printing press using movable type in the 15th century, it became possible <b>to produce<\/b> many copies of a book in a much shorter amount of time.<\/i><br>當古騰堡在 15 世紀發展出使用活字的印刷機時，在短得多的時間內印出一本書的許多副本就成為可能。", "sa": "【S】it（虛主詞）【V】became 【C】possible 【S】to produce many copies…（真主詞）<br>📌 It + be/become + adj. + to V（做……是……的）<br>例：It is important to drink water.", "on": ["✓ 符合 \"it became possible to + 原形動詞\" 的句型。", "／", "／", "皆不符合此句型的固定搭配。"], "oz": ["去生產（不定詞）", "生產（現在分詞／動名詞）", "生產（原形）", "生產了（過去式／過去分詞）"]}, {"n": 23, "p": 2, "stem": "(23)", "o": ["which", "that", "who", "whom"], "a": 0, "exp": "(A) which ✓ 非限定關係子句中指代「事物」的主格關係代名詞。\n❌ (B) that 不可用於有逗號的非限定關係子句。\n❌ (C) who／(D) whom 用於指「人」，invention 為事物，不可使用。", "zh": "<i>This invention, <b>which<\/b> spread quickly across Europe, made books more affordable and allowed ideas to circulate more widely than ever before.<\/i><br>這項很快傳遍歐洲的發明，讓書籍變得更便宜，也讓思想比以往傳播得更廣。", "sa": "【S】This invention 【V】made 【O】books 【C】more affordable and 【V】allowed 【O】ideas 【C】to circulate…<br>📌 , which… 非限定關係子句（逗號後不能用 that）<br>📌 make + O + adj.；allow + O + to V", "on": ["✓ 非限定關係子句中指代「事物」的主格關係代名詞。", "不可用於有逗號的非限定關係子句。", "／", "用於指「人」，invention 為事物，不可使用。"], "oz": ["（關代，指物，可用於非限定子句）", "（關代，不可用於逗號後）", "（關代，指人，主格）", "（關代，指人，受格）"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["once", "already", "ever", "never"], "a": 2, "exp": "(C) ever ✓ 與最高級搭配，表示「有史以來」。\n❌ (A) once = 曾經（一次），語意與最高級搭配不自然。\n❌ (B) already = 已經，文意不通。\n❌ (D) never = 從未，與「最重要的發明」語意矛盾。", "zh": "<i>Many historians consider the printing press to be one of the most important inventions <b>ever<\/b> created.<\/i><br>許多歷史學家認為印刷機是有史以來最重要的發明之一。", "sa": "【S】Many historians 【V】consider 【O】the printing press 【C】to be one of the most important inventions ever created<br>📌 consider + O + (to be) + C（認為……是……）<br>📌 最高級 + ever + p.p.（有史以來……過的）", "on": ["曾經（一次），語意與最高級搭配不自然。", "已經，文意不通。", "✓ 與最高級搭配，表示「有史以來」。", "從未，與「最重要的發明」語意矛盾。"], "oz": ["曾經（一次）", "已經", "曾經；有史以來（搭配最高級）", "從未"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["more than", "more", "better than", "rather"], "a": 0, "exp": "(A) more than ✓ 構成完整的比較句構。\n❌ (B) more 缺少 than，比較對象不完整。\n❌ (C) better than 語意不合（熱量不能用 better 比較）。\n❌ (D) rather 無法構成比較句。", "zh": "<i>This occurs largely because materials commonly used in cities, such as asphalt and concrete, absorb and retain heat <b>more than<\/b> natural surfaces like grass and trees, which reflect more sunlight and provide cooling through a process called evapotranspiration.<\/i><br>這主要是因為城市常用的材料，例如柏油和混凝土，比草地和樹木等自然地表更會吸收並保留熱能；而草木會反射較多陽光，並透過一種稱為「蒸發散」的過程提供降溫效果。", "sa": "【S】materials (commonly used in cities) 【V】absorb and retain 【O】heat 【M】more than natural surfaces<br>📌 動詞 + 受詞 + more than + 比較對象<br>📌 used… 為過去分詞後位修飾；, which 補充說明 natural surfaces", "on": ["✓ 構成完整的比較句構。", "缺少 than，比較對象不完整。", "語意不合（熱量不能用 better 比較）。", "無法構成比較句。"], "oz": ["比……更多（比較級）", "更多（缺 than）", "比……更好", "寧可；相當"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["so", "but", "or", "although"], "a": 0, "exp": "(A) so ✓ 表示因果中的「結果」，符合句意邏輯。\n❌ (B) but 表轉折，與句意不合。\n❌ (C) or 表選擇，與句意不合。\n❌ (D) although 表讓步，會使句子變成從屬子句，與句構不符。", "zh": "<i>As a result, city residents may experience higher energy bills in summer, <b>so<\/b> they rely more heavily on air conditioning to stay comfortable.<\/i><br>因此，城市居民夏天的電費可能比較高，所以他們更依賴冷氣來保持舒適。", "sa": "【S】city residents 【V】may experience 【O】higher energy bills…, so 【S】they 【V】rely 【M】more heavily marize and process information as they write. ✓ 文中說明手寫較慢，因此「迫使學生在書寫時整理並處理資訊」，進而帶來更深的理解。\n❌ (A) 文章指出手寫「較慢」，並非較快。\n❌ (C) 「逐字記錄」是打字筆記的特徵，並非手寫帶來理解的原因。\n❌ (D) 文章並未指出手寫「較不費力」。", "zh": "題目：根據本文，為什麼手寫可能帶來更深入的理解？<br>(A) 它比打字快。<br>(B) 它迫使學生在書寫時摘要並消化資訊。<br>(C) 它讓學生能逐字寫下所有內容。<br>(D) 它比打字省力。", "sa": "依據句：【S】Writing by hand 【V】is 【C】generally slower, which forces students to summarize and process information as they write<br>📌 動名詞 Writing 當主詞；force + 人 + to V（迫使）<br>📌 , which 指前面整句；leading to… 分詞構句表結果", "on": ["文章指出手寫「較慢」，並非較快。", "✓ 文中說明手寫較慢，因此「迫使學生在書寫時整理並處理資訊」，進而帶來更深的理解。", "「逐字記錄」是打字筆記的特徵，並非手寫帶來理解的原因。", "文章並未指出手寫「較不費力」。"], "oz": ["它比打字快。", "它迫使學生在書寫時摘要並消化資訊。", "它讓學生能逐字寫下所有內容。", "它比打字省力。"]}, {"n": 38, "p": 3, "stem": "For whom might typing notes be the only practical option?", "o": ["Students with certain physical disabilities.", "Students who prefer quiet classrooms.", "Students studying foreign languages.", "Students who sit in the back of the room."], "a": 0, "exp": "(A) Students with certain physical disabilities. ✓ 文中明確指出 \"for students with certain physical disabilities, typing may be the only practical option\"。\n❌ (B) 文章未提及偏好安靜教室的學生。\n❌ (C) 文章未特別針對學習外語的學生討論。\n❌ (D) 文章未提及坐在教室後方的學生。", "zh": "題目：對誰來說，打字做筆記可能是唯一可行的選擇？<br>(A) 有某些身體障礙的學生。<br>(B) 喜歡安靜教室的學生。<br>(C) 學習外語的學生。<br>(D) 坐在教室後面的學生。", "sa": "依據句：for students with certain physical disabilities, 【S】typing 【V】may be 【C】the only practical option<br>📌 For whom…? 介系詞 + whom 放句首的疑問句<br>📌 動名詞 typing 當主詞", "on": ["✓ 文中明確指出 \"for students with certain physical disabilities, typing may be the only practical option\"。", "文章未提及偏好安靜教室的學生。", "文章未特別針對學習外語的學生討論。", "文章未提及坐在教室後方的學生。"], "oz": ["有某些身體障礙的學生。", "喜歡安靜教室的學生。", "學習外語的學生。", "坐在教室後面的學生。"]}, {"n": 39, "p": 3, "stem": "Why did Oscar start lending tools to his neighbors?", "o": ["He wanted to start a rental business.", "Many neighbors lacked basic tools for occasional repairs.", "The building required him to do so.", "He had too many tools and needed to get rid of them."], "a": 1, "ex const WRITTEN = [{"title": "Ⅰ. 填充（4 分）", "prompt": "良好的睡眠習慣對健康和學習表現都很重要。<br><span class=\"blankline\">Good sleep h<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>① are important for both h<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u>② and academic performance.<\/span>", "ans": "① <b>habits<\/b>　② <b>health<\/b>", "exp": "① habits（習慣）：句中 \"sleep h___\" 須與 \"good\" 搭配構成「良好的睡眠習慣」，對應中文「習慣」，字首為 h，即 habits。\n② health（健康）：\"both h___ and academic performance\" 對應中文「健康和學習表現」，字首為 h，即 health。", "zh": "良好的睡眠習慣（habits）對健康（health）和學習表現都很重要。<br>參考：Good sleep <b>habits<\/b> are important for both <b>health<\/b> and academic performance.", "sa": "【S】Good sleep habits 【V】are 【C】important 【M】for both health and academic performance<br>📌 be important for + N（對……很重要）<br>📌 both A and B（A 和 B 兩者都）"}, {"title": "Ⅱ. 句子重組（6 分）", "prompt": "請將下列提示字詞重組成一句完整的句子，並於句尾加上適當標點符號：<br><i>their hands / before eating / people / wash / should always<\/i>", "ans": "People should always wash their hands before eating.", "exp": "\"should always\" 為「助動詞 + 頻率副詞」固定順序，置於主詞之後、動詞之前。\n\"before eating\" 為介系詞 before 接動名詞，表示「在……之前」。", "zh": "人們在吃東西之前應該一定要洗手。", "sa": "【S】People 【V】should always wash 【O】their hands 【M】before eating<br>📌 頻率副詞放在助動詞之後、一般動詞之前（should always wash）<br>📌 before + V-ing（介系詞後接動名詞）<br>例：You should always lock the door before leaving."}, {"title": "Ⅲ. 中譯英（6 分）", "prompt": "請將以下中文句子譯成正確、通順、達意的英文：<br>這家公司因其優質的客服而受到顧客的高度評價。", "ans": "This company is highly rated by customers for its excellent customer service.", "exp": "「受到顧客的高度評價」可用被動語態 \"is highly rated by customers\" 表達。\n「因其優質的客服」用 \"for its excellent customer service\" 說明評價的原因，\"for\" 表示「因為……的緣故」。", "zh": "題意：這家公司因為優質的客戶服務而受到顧客高度評價。", "sa": "【S】This company 【V】is highly rated 【M】by customers／for its excellent customer service<br>📌 現在式被動 is + (adv.) + p.p.；by + 行為者<br>📌 for + N 表原因（因為……）<br>例：The restaurant is well known for its noodles."}];

const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){

  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;

  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

<script id="ak-core">(function(){

function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){

 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';

<script>AK(function(){

if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});
return secs;
});</script>
<!-- /AK -->
<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<title>統測英文模擬考卷 D</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:1rem;opacity:.95;}
  .meta{margin-top:14px;font-size:1rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:1rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:1rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:1rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:1rem;}
  .email-h{font-size:1rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:1rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:1rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .written h4{margin:0 0 8px;color:var(--blue-dark);font-size:1rem;}
  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:1rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:1rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:1rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:1rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:1rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:1rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:1rem;margin:24px 0;}

.xtra{margin-top:10px;border-top:1px dashed #cfdcec;padding-top:10px}
.xtra .xh{display:inline-block;font-weight:800;font-size:16px;border-radius:8px;padding:2px 10px;margin:6px 0 4px}
.xtra .xh.zh{background:#e8f3ff;color:#1f6fe0}
.xtra .xh.sa{background:#f3ecff;color:#7a3fd6}
.xtra .xb{font-size:17px;line-height:1.75}
details.ptr{background:#fff;border:1px solid #e3edf9;border-radius:12px;margin:-4px 0 16px;box-shadow:0 3px 10px rgba(43,140,255,.08)}
details.ptr summary{cursor:pointer;padding:12px 16px;font-weight:800;color:#1f6fe0;font-size:17px;list-style:none}
details.ptr summary::-webkit-details-marker{display:none}
details.ptr summary::before{content:'▶ ';font-size:16px}
details.ptr[open] summary::before{content:'▼ '}
.ps{padding:12px 16px;border-top:1px solid #eef3fa}
.ps .en{font-size:17px;font-weight:600;color:#22303f}
.ps .en b{color:#e0560a}
.ps .zh{font-size:17px;color:#1f6fe0;margin-top:4px}
.ps .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border-radius:8px;padding:6px 10px;margin-top:6px;line-height:1.7}
.ps .no{display:inline-block;min-width:26px;text-align:center;background:#2b8cff;color:#fff;border-radius:6px;font-size:16px;font-weight:800;margin-right:6px}
@media print{details.ptr{display:none}}

/* ===== 檢討模式 ===== */
#rvBtn{position:fixed;top:12px;right:12px;z-index:999;border:0;border-radius:999px;padding:9px 18px;font:800 17px/1.2 "PingFang TC","Microsoft JhengHei",sans-serif;background:#7a3fd6;color:#fff;box-shadow:0 4px 14px rgba(122,63,214,.35);cursor:pointer}
body.review #rvBtn{background:#22b573;box-shadow:0 4px 14px rgba(34,181,115,.35)}
.rv,.rvo,.rvexp,.passage.rvp{display:none}
body.review .rv,body.review .rvexp{display:block}
body.review .rvo{display:inline;margin-left:12px}
body.review .rvo.blk{display:block;margin-left:0}
.rvn{display:none}
body.review .rvn{display:block;font-size:16px;color:#8a5a1a;line-height:1.65;margin-top:4px;white-space:pre-line}
body.review .passage.rvp{display:block;padding:6px 6px 10px}
body.review .stem.og,body.review .passage.orig,body.review details.ptr,body.review .exp{display:none!important}
body.review .opt.ans{border-color:var(--green);background:var(--green-bg)}
body.review .opt.ans .lab::after{content:' ✓';color:var(--green)}
.rv{margin-bottom:10px}
.rv .rl{margin:0 0 8px}
.rv .en,.rvp .en{font-size:18px;font-weight:600;color:#22303f;line-height:1.6}
.rv .en b,.rvp .en b{color:#e0560a;background:#fff1e6;border-radius:4px;padding:0 3px}
.rv .zh,.rvp .zh,.rvo{font-size:17px;color:#1f6fe0;line-height:1.6;margin-top:2px}
.rvo{font-weight:400}
.rv .sa,.rvp .sa{font-size:16px;color:#5b4a7a;background:#faf7ff;border:1px solid #ece2ff;border-radius:8px;padding:7px 11px;margin-top:6px;line-height:1.75}
.rv .num{margin-right:6px}
.rvp h3{margin:6px 10px 4px}
.rvp .ps{padding:10px 10px;border-top:1px dashed #ffe1b8}
.rvp .ps:first-of-type{border-top:0}
.rvexp{margin-top:10px}
.rvexp .rvb{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;white-space:pre-line;font-size:16px;line-height:1.7}
@media print{#rvBtn{display:none}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>統測英文　<span style="opacity:.9">模擬考卷 D</span></h1>
    <p>科技校院四年制與專科學校二年制統一入學測驗　共同科目：英文（模擬）</p>
    <div class="meta">選擇題共 42 題，每題 2 分，共 84 分　|　每題選擇答案後立即顯示解析＋中文翻譯＋句型分析　|　送出後顯示總分與作答統計</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>

      <span id="count">0 / 42</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">交卷並查看總分</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <div class="section-title s2" style="margin-top:30px;">二、非選擇題（共 16 分，點擊查看答案與解析）</div>
  <div id="written"></div>

  <footer>統測英文模擬考卷 D　&middot;　全民補習班 線上教學</footer>
</div>

<script>
function xtra(q){
  var h='';
  if(q.zh) h+='<span class="xh zh">🈶 中文翻譯</span><div class="xb">'+q.zh+'</div>';
  if(q.sa) h+='<span class="xh sa">🧩 句型分析</span><div class="xb">'+q.sa+'</div>';
  return h?'<div class="xtra">'+h+'</div>':'';
}
function ptrHtml(key){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  return '<details class="ptr"><summary>📖 全文逐句翻譯＋句型分析（建議作答後再打開）</summary>'+
    L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</details>';
}

function _lines(h){return String(h||'').split(/<br\s*\/?>/i).map(function(x){return x.trim();}).filter(function(x){return x;});}
function _fill(stem,q){var a='<b>'+q.o[q.a]+'</b>';return /_{3,}/.test(stem)?stem.replace(/_{3,}/,a):stem;}
function _zhParts(q){var L=_lines(q.zh),head=[],opt={};L.forEach(function(x){var m=x.match(/^\(([A-D])\)\s*(.*)$/);if(m)opt['ABCD'.indexOf(m[1])]=m[2];else head.push(x.replace(/^題目[：:]\s*/,''));});return {head:head,opt:opt};}
function rvStem(q){
  var num='<span class="num">'+q.n+'</span>', h='';
  if(q.p===2){
    h='<div class="rl"><div class="en">'+num+'第 '+q.n+' 格　正解：<b>'+'ABCD'[q.a]+'　'+q.o[q.a]+'</b></div></div>';
  } else if(q.p===1){
    var E=_lines(_fill(q.stem,q)), Z=_lines(q.zh);
    if(E.length===Z.length){ h=E.map(function(e,i){return '<div class="rl"><div class="en">'+(i===0?num:'')+e+'</div><div class="zh">'+Z[i]+'</div></div>';}).join(''); }
    else { h='<div class="rl"><div class="en">'+num+E.join('<br>')+'</div><div class="zh">'+Z.join('<br>')+'</div></div>'; }
  } else if(q.p===3){
    var P=_zhParts(q);
    h='<div class="rl"><div class="en">'+num+q.stem+'</div><div class="zh">'+P.head.join('<br>')+'</div></div>';
  } else {
    h='<div class="rl"><div class="en">'+num+_fill(q.stem,q)+'</div><div class="zh">'+(q.zh||'')+'</div></div>';
  }
  if(q.sa) h+='<div class="sa">🧩 '+q.sa+'</div>';
  return '<div class="rv">'+h+'</div>';
}
function optZh(q,i){ var t=q.oz&&q.oz[i], n=q.on&&q.on[i], h=''; if(t) h+='<span class="rvo'+((q.p===1||q.p===3)?' blk':'')+'">'+t+'</span>'; if(n) h+='<span class="rvn">'+n+'</span>'; return h; }
function rvExp(q){ return q.on ? '' : '<div class="rvexp"><div class="rvb">'+q.exp+'</div></div>'; }
function rvPassage(key,orig){
  var L=(typeof PTR!=='undefined')&&PTR[key]; if(!L||!L.length) return '';
  var t=(String(orig).match(/<h3>[\s\S]*?<\/h3>/)||[''])[0];
  return '<div class="passage rvp">'+t+L.map(function(s,i){return '<div class="ps"><div class="en"><span class="no">'+(i+1)+'</span>'+s.en+'</div><div class="zh">'+s.zh+'</div>'+(s.sa?'<div class="sa">🧩 '+s.sa+'</div>':'')+'</div>';}).join('')+'</div>';
}
(function(){
  function setRv(on){document.body.classList.toggle('review',on);var b=document.getElementById('rvBtn');if(b)b.textContent=on?'✏️ 回作答模式':'🔍 檢討模式';try{localStorage.setItem('tongce-review',on?'1':'0');}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('button');b.id='rvBtn';b.type='button';document.body.appendChild(b);
    b.addEventListener('click',function(){var y=window.scrollY,h=document.body.scrollHeight;setRv(!document.body.classList.contains('review'));window.scrollTo(0,y*document.body.scrollHeight/h);});
    var on=false;try{on=localStorage.getItem('tongce-review')==='1';}catch(e){}
    setRv(on);
  });
})();

const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nMany companies now allow employees to work from home a few days a week. Supporters say this arrangement gives workers more freedom <span class=\"blk\">21</span> how they organize their day, and it also saves them the time and stress of commuting. Without long commutes, employees often have <span class=\"blk\">22</span> energy for their families and hobbies. However, some managers worry that workers who are not <span class=\"blk\">23</span> supervised may become less productive. To address this concern, many companies now use online tools <span class=\"blk\">24</span> track project progress and hold regular video meetings to keep everyone connected.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nCoral reefs are sometimes called the \"rainforests of the sea\" because they support an enormous <span class=\"blk\">25</span> of marine life. Unfortunately, rising ocean temperatures have caused many reefs to lose their bright colors, a process known as bleaching. <span class=\"blk\">26</span> a reef is bleached, the coral becomes weak and is more likely to die. Scientists around the world are working to find ways <span class=\"blk\">27</span> protect these fragile ecosystems, including breeding heat-resistant coral in laboratories. If these efforts succeed, future generations may still be able <span class=\"blk\">28</span> enjoy the beauty of healthy coral reefs.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice to All Residents</b><br><br>The water supply in our building will be temporarily shut off for pipe maintenance on <b>Thursday, June 18, from 9:00 AM to 3:00 PM</b>. Residents are advised to store enough water for cooking and washing before the maintenance begins. The elevator on the east side will also be out of service during this time, so please use the west elevator if needed. We apologize for any inconvenience and appreciate your understanding.<br><br>— Building Management Office</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Ryan: Hey, are we still meeting at the gym at 6? Sophie: Actually, I just got out of work late. Can we make it 6:30 instead? Ryan: Sure, no problem. Want me to save you a treadmill? Sophie: That would be great, thanks! I'll bring my sneakers and meet you there. Ryan: Sounds good. See you soon!</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nUrban beekeeping has become increasingly popular in cities around the world. More and more people are setting up beehives on rooftops, balconies, and in community gardens. Supporters argue that city bees actually have access to a wider variety of flowers than bees in farming areas, where a single crop often dominates the landscape. The honey produced by urban bees can also help local residents who suffer from seasonal allergies, since the bees collect pollen from plants in the area. In addition, urban beekeeping projects often bring neighbors together, as people share tips, tools, and the honey harvest. However, city beekeepers must also follow local regulations, which may limit the number of hives allowed or require that hives be placed a certain distance from public walkways.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nFor centuries, people have used the position of the sun and stars to find direction, but a small bird called the European robin appears to use something entirely different: its eyes. Researchers have found that robins can sense Earth's magnetic field, a phenomenon known as magnetoreception, and that this ability depends on light entering the right eye. In experiments, robins with their right eye covered had difficulty orienting themselves correctly, while those with their left eye covered had no trouble at all. Scientists believe that special molecules in the robin's eye react to magnetic fields in a way that is affected by light, allowing the bird to \"see\" magnetic information layered onto its normal vision. This discovery may help explain how many migratory birds manage to travel thousands of kilometers to the same destination every year, even when flying at night or through clouds.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Daniel first opened his small repair shop, he mainly fixed bicycles for people in his neighborhood. Business was steady but slow, and he often wondered if he had made the right choice in leaving his office job. One day, a customer asked if Daniel could also repair her electric scooter, which had become a popular form of transportation in the city. Daniel had never worked on one before, but he spent his evenings watching online tutorials and practicing on an old scooter he bought secondhand. Word quickly spread that there was finally a shop in the area that could handle both bicycles and electric scooters. Within a year, Daniel had to hire an assistant just to keep up with the growing number of customers. Looking back, Daniel says that being willing to learn something new, even outside his comfort zone, was the turning point for his small business. He now offers workshops for teenagers who want to learn basic repair skills, hoping to pass on what he has learned to the next generation.</div>"};
const PTR = {"21": [{"en": "Many companies now allow employees to work from home a few days a week.", "zh": "現在許多公司允許員工每週有幾天在家工作。", "sa": "【S】Many companies 【V】allow 【O】employees 【C】to work from home 【M】a few days a week<br>📌 allow + O + to V（允許某人做…）；work from home（在家工作）"}, {"en": "Supporters say this arrangement gives workers more freedom <b>over<\/b> how they organize their day, and it also saves them the time and stress of commuting.", "zh": "支持者說，這種安排讓員工對如何安排自己的一天有更多自主權，也為他們省下了通勤的時間和壓力。", "sa": "【S】Supporters 【V】say 【O】(that) this arrangement gives workers more freedom…<br>📌 give／save + 人 + 物；how 引導名詞子句當介系詞 over 的受詞"}, {"en": "Without long commutes, employees often have <b>more<\/b> energy for their families and hobbies.", "zh": "不必長途通勤，員工通常有更多精力留給家人和嗜好。", "sa": "【M】Without long commutes 【S】employees 【V】have 【O】more energy<br>📌 without + N（沒有…的話）；energy 不可數，用 more"}, {"en": "However, some managers worry that workers who are not <b>directly<\/b> supervised may become less productive.", "zh": "然而，有些主管擔心，沒有受到直接督導的員工可能會變得比較沒有效率。", "sa": "【S】some managers 【V】worry 【O】that workers… may become less productive<br>📌 who 引導關係子句修飾 workers；副詞 directly 修飾過去分詞 supervised"}, {"en": "To address this concern, many companies now use online tools <b>to<\/b> track project progress and hold regular video meetings to keep everyone connected.", "zh": "為了解決這個疑慮，現在許多公司使用線上工具來追蹤專案進度，並定期舉行視訊會議，讓大家保持聯繫。", "sa": "【M】To address this concern 【S】many companies 【V】use… and hold…<br>📌 不定詞表目的；keep + O + C（使…保持…）"}], "25": [{"en": "Coral reefs are sometimes called the \"rainforests of the sea\" because they support an enormous <b>variety<\/b> of marine life.", "zh": "珊瑚礁有時被稱為「海洋中的雨林」，因為它們孕育了種類極為豐富的海洋生物。", "sa": "【S】Coral reefs 【V】are called 【C】the \"rainforests of the sea\" 【M】because…<br>📌 be called + 名稱；a variety of（各式各樣的）"}, {"en": "Unfortunately, rising ocean temperatures have caused many reefs to lose their bright colors, a process known as bleaching.", "zh": "不幸的是，海水溫度上升已使許多珊瑚礁失去鮮豔的色彩，這個過程稱為「白化」。", "sa": "【S】rising ocean temperatures 【V】have caused 【O】many reefs 【C】to lose their bright colors<br>📌 cause + O + to V（導致…）；a process known as… 為同位語，補充說明前句"}, {"en": "<b>Once<\/b> a reef is bleached, the coral becomes weak and is more likely to die.", "zh": "珊瑚礁一旦白化，珊瑚就會變得虛弱，也更容易死亡。", "sa": "【M】Once a reef is bleached 【S】the coral 【V】becomes 【C】weak and 【V】is 【C】more likely to die<br>📌 once（一旦）；be likely to V"}, {"en": "Scientists around the world are working to find ways <b>to<\/b> protect these fragile ecosystems, including breeding heat-resistant coral in laboratories.", "zh": "世界各地的科學家正努力尋找保護這些脆弱生態系的方法，包括在實驗室裡培育耐熱的珊瑚。", "sa": "【S】Scientists around the world 【V】are working 【M】to find ways to protect…<br>📌 ways to V（做…的方法）；including + V-ing（包括…）"}, {"en": "If these efforts succeed, future generations may still be able <b>to<\/b> enjoy the beauty of healthy coral reefs.", "zh": "如果這些努力成功，未來的世代或許仍能欣賞到健康珊瑚礁的美麗。", "sa": "【M】If these efforts succeed 【S】future generations 【V】may still be able to enjoy 【O】the beauty…<br>📌 條件子句用現在式表未來；be able to V"}], "29": [{"en": "Notice to All Residents", "zh": "全體住戶公告", "sa": "名詞片語標題，省略主詞動詞"}, {"en": "The water supply in our building will be temporarily shut off for pipe maintenance on Thursday, June 18, from 9:00 AM to 3:00 PM.", "zh": "本大樓將於 6 月 18 日（星期四）上午 9 點至下午 3 點，因水管維修暫時停止供水。", "sa": "【S】The water supply (in our building) 【V】will be (temporarily) shut off 【M】for pipe maintenance 【M】on Thursday…<br>📌 未來式被動 will be + p.p.；shut off（關閉、切斷）"}, {"en": "Residents are advised to store enough water for cooking and washing before the maintenance begins.", "zh": "建議住戶在維修開始前，儲存足夠的煮飯和清洗用水。", "sa": "【S】Residents 【V】are advised 【C】to store enough water… 【M】before the maintenance begins<br>📌 be advised to V（被建議…）；時間子句用現在式表未來"}, {"en": "The elevator on the east side will also be out of service during this time, so please use the west elevator if needed.", "zh": "這段期間東側電梯也將停止運作，如有需要請使用西側電梯。", "sa": "【S】The elevator on the east side 【V】will be 【C】out of service 【M】during this time，so please use… if needed<br>📌 out of service（停用）；if needed ＝ if (it is) needed"}, {"en": "We apologize for any inconvenience and appreciate your understanding.", "zh": "造成不便，敬請見諒，感謝您的體諒。", "sa": "【S】We 【V】apologize for 【O】any inconvenience and 【V】appreciate 【O】your understanding<br>📌 apologize for + N；appreciate（感謝）"}, {"en": "— Building Management Office", "zh": "大樓管理室　敬啟", "sa": "署名，名詞片語"}], "31": [{"en": "Ryan: Hey, are we still meeting at the gym at 6?", "zh": "Ryan：嘿，我們還是 6 點在健身房碰面嗎？", "sa": "【S】we 【V】are (still) meeting 【M】at the gym at 6<br>📌 現在進行式表已安排好的未來計畫"}, {"en": "Sophie: Actually, I just got out of work late. Can we make it 6:30 instead?", "zh": "Sophie：其實我剛剛比較晚下班，可以改成 6:30 嗎？", "sa": "【S】I 【V】got out of work 【M】late；Can 【S】we 【V】make 【O】it 【C】6:30?<br>📌 get out of work（下班）；make it + 時間（約在…）"}, {"en": "Ryan: Sure, no problem. Want me to save you a treadmill?", "zh": "Ryan：當然，沒問題。要我幫你先佔一台跑步機嗎？", "sa": "(Do you) 【V】want 【O】me 【C】to save you a treadmill?<br>📌 口語省略 Do you；save + 人 + 物（幫某人保留…）"}, {"en": "Sophie: That would be great, thanks! I'll bring my sneakers and meet you there.", "zh": "Sophie：那太好了，謝謝！我會帶運動鞋，在那裡跟你會合。", "sa": "【S】I 【V】'll bring 【O】my sneakers and 【V】meet 【O】you 【M】there<br>📌 That would be great.（那就太好了，委婉接受）"}, {"en": "Ryan: Sounds good. See you soon!", "zh": "Ryan：好啊，待會見！", "sa": "省略句：(That) sounds good. (I'll) see you soon!<br>📌 口語省略主詞"}], "33": [{"en": "Urban beekeeping has become increasingly popular in cities around the world.", "zh": "都市養蜂在世界各地的城市越來越受歡迎。", "sa": "【S】Urban beekeeping 【V】has become 【C】increasingly popular 【M】in cities around the world<br>📌 現在完成式表變化結果；increasingly（越來越）修飾形容詞"}, {"en": "More and more people are setting up beehives on rooftops, balconies, and in community gardens.", "zh": "越來越多人在屋頂、陽台和社區花園裡設置蜂箱。", "sa": "【S】More and more people 【V】are setting up 【O】beehives 【M】on rooftops, balconies, and in community gardens<br>📌 more and more + 複數名詞（越來越多的…）；set up（設置）"}, {"en": "Supporters argue that city bees actually have access to a wider variety of flowers than bees in farming areas, where a single crop often dominates the landscape.", "zh": "支持者認為，城市的蜜蜂其實比農業區的蜜蜂能接觸到更多種類的花，因為農業區的景觀常常被單一作物佔據。", "sa": "【S】Supporters 【V】argue 【O】that city bees have access to a wider variety of flowers than…<br>📌 have access to（能取得）；where 引導非限定子句修飾 farming areas"}, {"en": "The honey produced by urban bees can also help local residents who suffer from seasonal allergies, since the bees collect pollen from plants in the area.", "zh": "都市蜜蜂所產的蜂蜜也能幫助患有季節性過敏的當地居民，因為蜜蜂採集的是當地植物的花粉。", "sa": "【S】The honey (produced by urban bees) 【V】can help 【O】local residents (who suffer from seasonal allergies)<br>📌 過去分詞片語後位修飾 honey；since（因為）；suffer from（患有）"}, {"en": "In addition, urban beekeeping projects often bring neighbors together, as people share tips, tools, and the honey harvest.", "zh": "此外，都市養蜂計畫常常讓鄰居們聚在一起，大家分享訣竅、工具和採收的蜂蜜。", "sa": "【S】urban beekeeping projects 【V】bring 【O】neighbors 【M】together，as…<br>📌 bring + O + together（讓…聚在一起）"}, {"en": "However, city beekeepers must also follow local regulations, which may limit the number of hives allowed or require that hives be placed a certain distance from public walkways.", "zh": "不過，城市養蜂人也必須遵守當地法規，這些法規可能會限制蜂箱的數量，或要求蜂箱必須和公共步道保持一定距離。", "sa": "【S】city beekeepers 【V】must follow 【O】local regulations，which may limit… or require…<br>📌 require that + S + 原形動詞（hives be placed）；the number of hives allowed（被允許的蜂箱數量）"}], "36": [{"en": "For centuries, people have used the position of the sun and stars to find direction, but a small bird called the European robin appears to use something entirely different: its eyes.", "zh": "幾個世紀以來，人們利用太陽和星星的位置來辨別方向，但一種叫做歐亞鴝（歐洲知更鳥）的小鳥，似乎用的是完全不同的東西：牠的眼睛。", "sa": "【S】people 【V】have used 【O】the position of the sun and stars 【M】to find direction，but 【S】a small bird… 【V】appears to use 【O】something entirely different<br>📌 appear to V（似乎…）；called + 名稱；冒號後補充說明"}, {"en": "Researchers have found that robins can sense Earth's magnetic field, a phenomenon known as magnetoreception, and that this ability depends on light entering the right eye.", "zh": "研究人員發現，知更鳥能感應地球的磁場，這種現象稱為「磁感應」，而且這項能力取決於進入右眼的光線。", "sa": "【S】Researchers 【V】have found 【O】that robins can sense… and that this ability depends on…<br>📌 兩個 that 子句對等當受詞；a phenomenon known as… 為同位語"}, {"en": "In experiments, robins with their right eye covered had difficulty orienting themselves correctly, while those with their left eye covered had no trouble at all.", "zh": "在實驗中，右眼被遮住的知更鳥很難正確辨別方向，而左眼被遮住的則完全沒有問題。", "sa": "【S】robins (with their right eye covered) 【V】had 【O】difficulty orienting themselves，while 【S】those… 【V】had 【O】no trouble<br>📌 with + O + p.p.（附帶狀況）；have difficulty + V-ing；while 表對比"}, {"en": "Scientists believe that special molecules in the robin's eye react to magnetic fields in a way that is affected by light, allowing the bird to \"see\" magnetic information layered onto its normal vision.", "zh": "科學家認為，知更鳥眼中的特殊分子會以一種受光線影響的方式對磁場產生反應，讓這種鳥能「看見」疊加在正常視覺上的磁場資訊。", "sa": "【S】Scientists 【V】believe 【O】that special molecules… react to magnetic fields 【M】in a way that is affected by light<br>📌 react to（對…起反應）；分詞構句 allowing + O + to V 表結果"}, {"en": "This discovery may help explain how many migratory birds manage to travel thousands of kilometers to the same destination every year, even when flying at night or through clouds.", "zh": "這項發現或許能幫助解釋，為什麼許多候鳥每年都能飛越數千公里抵達同一個目的地，即使是在夜間或穿越雲層飛行時也一樣。", "sa": "【S】This discovery 【V】may help explain 【O】how many migratory birds manage to travel…<br>📌 help + 原形動詞；manage to V（設法做到）；even when + V-ing（即使在…時）"}], "39": [{"en": "When Daniel first opened his small repair shop, he mainly fixed bicycles for people in his neighborhood.", "zh": "Daniel 剛開他的小修理店時，主要是幫附近的居民修腳踏車。", "sa": "【M】When Daniel first opened his small repair shop 【S】he 【M】mainly 【V】fixed 【O】bicycles 【M】for people in his neighborhood<br>📌 when 引導時間子句"}, {"en": "Business was steady but slow, and he often wondered if he had made the right choice in leaving his office job.", "zh": "生意穩定但清淡，他常常懷疑自己辭掉上班族的工作是不是做了正確的選擇。", "sa": "【S】Business 【V】was 【C】steady but slow，and 【S】he 【V】wondered 【O】if he had made the right choice…<br>📌 wonder if（懷疑是否）；過去完成式 had made 表更早發生"}, {"en": "One day, a customer asked if Daniel could also repair her electric scooter, which had become a popular form of transportation in the city.", "zh": "有一天，一位顧客問 Daniel 能不能也修她的電動滑板車，這種車在城市裡已經成為很受歡迎的交通工具。", "sa": "【S】a customer 【V】asked 【O】if Daniel could also repair her electric scooter<br>📌 ask if（問是否）；逗號 + which 補充說明 scooter"}, {"en": "Daniel had never worked on one before, but he spent his evenings watching online tutorials and practicing on an old scooter he bought secondhand.", "zh": "Daniel 以前從來沒修過電動滑板車，但他每天晚上看線上教學影片，並拿一台買來的二手舊車練習。", "sa": "【S】Daniel 【V】had never worked on 【O】one，but 【S】he 【V】spent 【O】his evenings 【M】watching… and practicing…<br>📌 spend + 時間 + V-ing；work on（修理、處理）"}, {"en": "Word quickly spread that there was finally a shop in the area that could handle both bicycles and electric scooters.", "zh": "消息很快傳開：這一帶終於有一家店既能修腳踏車，也能修電動滑板車。", "sa": "【S】Word 【V】spread 【M】that there was finally a shop… that could handle both…<br>📌 Word spread that…（消息傳開…）；both A and B"}, {"en": "Within a year, Daniel had to hire an assistant just to keep up with the growing number of customers.", "zh": "不到一年，Daniel 就必須雇一位助理，才應付得了越來越多的客人。", "sa": "【M】Within a year 【S】Daniel 【V】had to hire 【O】an assistant 【M】just to keep up with…<br>📌 within（在…之內）；keep up with（跟上、應付）"}, {"en": "Looking back, Daniel says that being willing to learn something new, even outside his comfort zone, was the turning point for his small business.", "zh": "回顧過去，Daniel 說，願意學習新事物，即使超出自己的舒適圈，正是他這家小店的轉捩點。", "sa": "【M】Looking back 【S】Daniel 【V】says 【O】that being willing to learn something new… was the turning point<br>📌 分詞構句 Looking back；動名詞片語當 that 子句的主詞"}, {"en": "He now offers workshops for teenagers who want to learn basic repair skills, hoping to pass on what he has learned to the next generation.", "zh": "他現在為想學基本維修技能的青少年開設工作坊，希望把自己學到的東西傳承給下一代。", "sa": "【S】He 【V】offers 【O】workshops 【M】for teenagers who…，hoping to pass on…<br>📌 who 修飾 teenagers；pass on A to B（把 A 傳給 B）"}]};
const Q = [{"n": 1, "p": 0, "stem": "The two countries finally signed a peace _____ after years of conflict.", "o": ["treaty", "tunnel", "trail", "trick"], "a": 0, "exp": "✓ (A) treaty（條約）— 兩國經多年衝突後簽署「和平條約」。\n❌ (B) tunnel = 隧道，語意不符。\n❌ (C) trail = 步道，不適用。\n❌ (D) trick = 把戲，語意不符。", "zh": "經過多年的衝突，兩國終於簽署了和平條約。", "sa": "【S】The two countries 【M】finally 【V】signed 【O】a peace treaty 【M】after years of conflict<br>📌 句型：sign a treaty（簽署條約）；years of + N（多年的…）", "on": ["兩國經多年衝突後簽署「和平條約」。", "隧道，語意不符。", "步道，不適用。", "把戲，語意不符。"], "oz": ["條約", "隧道", "步道；小徑", "把戲；詭計"]}, {"n": 2, "p": 0, "stem": "The teacher asked the students to _____ their homework before the bell rang.", "o": ["submit", "suspect", "subtract", "survive"], "a": 0, "exp": "✓ (A) submit（提交）— 老師要求學生在鐘聲響起前「交出」作業。\n❌ (B) suspect = 懷疑，語意不符。\n❌ (C) subtract = 減去，不適用。\n❌ (D) survive = 倖存，語意不符。", "zh": "老師要求學生在鐘響之前繳交作業。", "sa": "【S】The teacher 【V】asked 【O】the students 【C】to submit their homework<br>【M】before the bell rang<br>📌 句型：ask + O + to V（要求某人做…）；submit ＝ hand in（繳交）", "on": ["老師要求學生在鐘聲響起前「交出」作業。", "懷疑，語意不符。", "減去，不適用。", "倖存，語意不符。"], "oz": ["繳交；提交", "懷疑", "減去；扣除", "倖存；存活"]}, {"n": 3, "p": 0, "stem": "The little boy was _____ to find a puppy waiting for him on his birthday.", "o": ["thrilled", "thirsty", "thorough", "threatened"], "a": 0, "exp": "✓ (A) thrilled（興奮的）— 生日時發現有小狗在等他，男孩感到「興奮」。\n❌ (B) thirsty = 渴的，語意不符。\n❌ (C) thorough = 徹底的，不適用。\n❌ (D) threatened = 受到威脅的，語意不符。", "zh": "小男孩在生日當天發現有一隻小狗在等他，興奮極了。", "sa": "【S】The little boy 【V】was 【C】thrilled<br>【M】to find a puppy waiting for him on his birthday<br>📌 句型：be + 情緒形容詞 + to V（因…而感到…）；find + O + V-ing（發現某物正在…）", "on": ["生日時發現有小狗在等他，男孩感到「興奮」。", "渴的，語意不符。", "徹底的，不適用。", "受到威脅的，語意不符。"], "oz": ["非常興奮的；欣喜的", "口渴的", "徹底的；仔細的", "受到威脅的"]}, {"n": 4, "p": 0, "stem": "Because the road was blocked, drivers had to take a _____ route to reach downtown.", "o": ["detour", "deposit", "decade", "defeat"], "a": 0, "exp": "✓ (A) detour（繞道）— 道路封閉，駕駛人必須走「繞道」路線才能到市中心。\n❌ (B) deposit = 存款，語意不符。 s 【O】ancient paintings<br>【M】that are over two hundred years old（that 引導關係子句修飾 paintings）<br>📌 句型：形容詞放名詞前（ancient paintings）；「數字 + years old」表示「有……年歷史」。<br>例：This is an old house that is over fifty years old.", "on": ["空格在名詞 paintings 前，需要形容詞；超過兩百年的畫作是「古老的」畫作。", "在前方（副詞），不能修飾名詞。", "在國外（副詞），語意不符。", "在交通工具上，語意不符。"], "oz": ["古老的；古代的", "在前面；提前", "在國外", "在（車、船、飛機）上"]}, {"n": 8, "p": 0, "stem": "After the long meeting, everyone felt _____ and went straight home to rest.", "o": ["exhausted", "excited", "exposed", "expanded"], "a": 0, "exp": "✓ (A) exhausted（疲憊不堪的）— 開完長會後大家感到「疲憊」，直接回家休息。\n❌ (B) excited = 興奮的，與「直接回家休息」不符。\n❌ (C) exposed = 暴露的，語意不符。\n❌ (D) expanded = 擴張的，不適用。", "zh": "開完冗長的會議後，大家都筋疲力盡，直接回家休息。", "sa": "【M】After the long meeting，【S】everyone 【V】felt 【C】exhausted and 【V】went 【M】straight home to rest<br>📌 句型：feel + adj.；everyone 視為單數；go straight home（home 為副詞，不加 to）", "on": ["開完長會後大家感到「疲憊」，直接回家休息。", "興奮的，與「直接回家休息」不符。", "暴露的，語意不符。", "擴張的，不適用。"], "oz": ["精疲力竭的", "興奮的", "暴露的；揭露的", "擴大的；擴張的"]}, {"n": 9, "p": 0, "stem": "The witness gave a <i>vivid<\/i> description of the accident to the police.", "o": ["brief", "vague", "detailed", "false"], "a": 2, "exp": "✓ (C) detailed（詳細的）— vivid（生動、逼真的）在此語境中與「詳細的」意義最接近。\n❌ (A) brief = 簡短的，與 vivid 意義相反。\n❌ (B) vague = 模糊的，與 vivid 意義相反。\n❌ (D) false = 虛假的，語意不符。", "zh": "目擊者向警方生動地描述了這起事故。（vivid ≒ detailed 詳細的）", "sa": "【S】The witness 【V】gave 【O】a vivid description of the accident 【M】to the police<br>📌 句型：give + 物 + to + 人；give a description of ＝ describe（描述…）", "on": ["簡短的，與 vivid 意義相反。", "模糊的，與 vivid 意義相反。", "vivid（生動、逼真的）在此語境中與「詳細的」意義最接近。", "虛假的，語意不符。"], "oz": ["簡短的", "模糊的；含糊的", "詳細的", "錯誤的；虛假的"]}, {"n": 10, "p": 0, "stem": "The two designs are <i>identical<\/i> except for the color.", "o": ["different", "the same", "expensive", "outdated"], "a": 1, "exp": "✓ (B) the same（相同的）— identical（完全相同的）與 the same 意義最接近。\n❌ (A) different = 不同的，語意相反。\n❌ (C) expensive = 昂貴的，語意不符。\n❌ (D) outdated = 過時的，語意不符。", "zh": "這兩個設計除了顏色之外，完全一模一樣。（identical ≒ the same）", "sa": "【S】The two designs 【V】are 【C】identical 【M】except for the color<br>📌 句型：be identical to（和…完全相同）；except for（除了…之外）", "on": ["不同的，語意相反。", "identical（完全相同的）與 the same 意義最接近。", "昂貴的，語意不符。", "過時的，語意不符。"], "oz": ["不同的", "相同的", "昂貴的", "過時的"]}, {"n": 11, "p": 1, "stem": "Lisa: I can't find my umbrella anywhere. Have you seen it?<br>Tom: _____<br>Lisa: Oh right, I forgot. Thanks for reminding me.", "o": ["It's raining really hard outside.", "You left it at the office yesterday.", "I don't think it will rain today.", "Maybe you should buy a new bag."], "a": 1, "exp": "✓ (B) You left it at the office yesterday.— Lisa 回應「對，我忘了，謝謝提醒」，呼應 Tom 提醒她把雨傘留在辦公室。\n❌ (A) 說外面雨下得很大，未回答雨傘在哪裡。\n❌ (C) 說今天應該不會下雨，與「謝謝提醒」不連貫。\n❌ (D) 建議買新包包，與問題無關。", "zh": "Lisa：我到處都找不到我的雨傘，你有看到嗎？<br>Tom：你昨天把它留在辦公室了。<br>Lisa：喔對，我忘了。謝謝你提醒我。", "sa": "正解句：【S】You 【V】left 【O】it 【M】at the office yesterday<br>📌 句型：leave + 物 + 地點（把…遺留在…）；Thanks for + V-ing（謝謝你…）；remind（提醒）", "on": ["說外面雨下得很大，未回答雨傘在哪裡。", "Lisa 回應「對，我忘了，謝謝提醒」，呼應 Tom 提醒她把雨傘留在辦公室。", "說今天應該不會下雨，與「謝謝提醒」不連貫。", "建議買新包包，與問題無關。"], "oz": ["外面雨下得好大。", "你昨天把它留在辦公室了。", "我覺得今天不會下雨。", "也許你該買個新包包。"]}, {"n": 12, "p": 1, "stem": "Customer: Excuse me, this shirt doesn't fit. Can I exchange it for a larger size?<br>Clerk: _____<br>Customer: Sure, here it is.", "o": ["Sorry, we don't sell shirts here.", "Of course. Do you have the receipt?", "We're closing in five minutes.", "That color looks great on you."], "a": 1, "exp": "✓ (B) Of course. Do you have the receipt?— 顧客回應「當然，在這裡」，呼應店員詢問收據。\n❌ (A) 說這裡不賣襯衫，與顧客已購買的情境矛盾。\n❌ (C) 說即將關店，與換貨情境無關。\n❌ (D) 稱讚顏色好看，與顧客要求換貨不符。", "zh": "顧客：不好意思，這件襯衫不合身，可以換大一號的嗎？<br>店員：當然可以。請問您有收據嗎？<br>顧客：有，在這裡。", "sa": "正解句：Of course. Do 【S】you 【V】have 【O】the receipt?<br>關鍵句：Can I exchange it for a larger size?<br>📌 句型：exchange A for B（把 A 換成 B）；fit（合身，動詞）", "on": ["說這裡不賣襯衫，與顧客已購買的情境矛盾。", "顧客回應「當然，在這裡」，呼應店員詢問收據。", "說即將關店，與換貨情境無關。", "稱讚顏色好看，與顧客要求換貨不符。"], "oz": ["抱歉，我們這裡不賣襯衫。", "當然可以。您有收據嗎？", "我們五分鐘後就要打烊了。", "那個顏色很適合你。"]}, {"n": 13, "p": 1, "stem": "Mark: You look tired today. Did you sleep well?<br>Jenny: _____<br>Mark: That's too bad. Maybe you should go to bed early tonight.", "o": ["Yes, I slept for ten hours straight.", "Not really, my neighbors had a party until 2 a.m.", "I just woke up from a great nap.", "I'm going to a concert tonight."], "a": 1, "exp": "✓ (B) Not really, my neighbors had a party until 2 a.m.— Mark 回應「真糟糕，今晚早點睡吧」，呼應 Jenny 表示沒睡好。\n❌ (A) 說睡了十小時，與「看起來很累」矛盾。\n❌ (C) 說剛睡醒做了個美好的午睡，與「看起來很累」矛盾。\n❌ (D) 提到今晚要去演唱會，與「早點睡」的建議不符。", "zh": "Mark：你今天看起來好累，昨晚睡得好嗎？<br>Jenny：不太好，我鄰居開派對開到凌晨兩點。<br>Mark：真糟糕，也許你今晚該早點睡。", "sa": "正解句：Not really，【S】my neighbors 【V】had 【O】a party 【M】until 2 a.m.<br>📌 句型：look + adj.（看起來…）；should + 原形動詞（建議）；until（直到…）", "on": ["說睡了十小時，與「看起來很累」矛盾。", "Mark 回應「真糟糕，今晚早點睡吧」，呼應 Jenny 表示沒睡好。", "說剛睡醒做了個美好的午睡，與「看起來很累」矛盾。", "提到今晚要去演唱會，與「早點睡」的建議不符。"], "oz": ["有啊，我一口氣睡了十個小時。", "不太好，我鄰居開派對開到凌晨兩點。", "我剛睡了一場很棒的午覺起來。", "我今晚要去聽演唱會。"]}, {"n": 14, "p": 1, "stem": "Receptionist: Good morning, how can I help you?<br>Guest: _____<br>Receptionist: Let me check... Yes, your room is ready. Here's your key card.", "o": ["I'd like to check in. I have a reservation under Wang.", "Could you call me a taxi to the airport?", "I think I lost my key card somewhere.", "Is the swimming pool open today?"], "a": 0, "exp": "✓ (A) I'd like to check in. I have a reservation under Wang.— 櫃檯回應「我查一下…您的房間已準備好，這是房卡」，符合辦理入住情境。\n❌ (B) 要求叫計程車去機場，與「房間已準備好」不符。\n❌ (C) 說鑰匙卡不見了，與「這是您的房卡」邏輯矛盾（尚未拿到卡）。\n❌ (D) 問游泳池是否開放，與櫃檯回應無關。", "zh": "接待員：早安，請問有什麼需要幫忙的嗎？<br>房客：我要辦理入住，我用「王」的名字訂了房。<br>接待員：我查一下……好的，您的房間已經準備好了，這是您的房卡。", "sa": "正解句：【S】I 【V】'd like to check in. 【S】I 【V】have 【O】a reservation 【M】under Wang.<br>📌 句型：would like to V（想要…）；a reservation under + 名字（以…的名義預訂）；check in（辦理入住）", "on": ["櫃檯回應「我查一下…您的房間已準備好，這是房卡」，符合辦理入住情境。", "要求叫計程車去機場，與「房間已準備好」不符。", "說鑰匙卡不見了，與「這是您的房卡」邏輯矛盾（尚未拿到卡）。", "問游泳池是否開放，與櫃檯回應無關。"], "oz": ["我要辦理入住，我有用王的名字訂房。", "可以幫我叫一輛去機場的計程車嗎？", "我想我把房卡弄丟了。", "游泳池今天有開嗎？"]}, {"n": 15, "p": 1, "stem": "Son: Mom, can I go to Jake's house after school?<br>Mom: _____<br>Son: Okay, I'll be home by six. I promise.", "o": ["Jake doesn't live near our house.", "Sure, but make sure you're back before dinner.", "I already cooked your favorite dish.", "You should call your teacher first."], "a": 1, "exp": "✓ (B) Sure, but make sure you're back before dinner.— 兒子回應「好，我六點前會回家」，呼應媽媽要求準時回家吃晚餐。\n❌ (A) 說 Jake 家不在附近，未回答是否同意。\n❌ (C) 說已經煮好兒子最愛的菜，與「同意外出」矛盾。\n❌ (D) 建議先打電話給老師，與情境無關。", "zh": "兒子：媽，放學後我可以去 Jake 家嗎？<br>媽媽：可以，但一定要在晚餐前回來。<br>兒子：好，我六點前會到家，我保證。", "sa": "正解句（祈使句）：Sure, but 【V】make sure 【O】(that) you're back before dinner<br>📌 句型：make sure + (that) 子句（確定、務必…）；be home by six（六點前到家，by 表期限）", "on": ["說 Jake 家不在附近，未回答是否同意。", "兒子回應「好，我六點前會回家」，呼應媽媽要求準時回家吃晚餐。", "說已經煮好兒子最愛的菜，與「同意外出」矛盾。", "建議先打電話給老師，與情境無關。"], "oz": ["Jake 不住在我們家附近。", "可以，但晚餐前一定要回來。", "我已經煮了你最愛吃的菜。", "你應該先打電話給老師。"]}, {"n": 16, "p": 1, "stem": "Waiter: Are you ready to order, or do you need more time?<br>Customer: _____<br>Waiter: Great choice. Anything to drink?", "o": ["I think I'll have the grilled salmon, please.", "The restaurant was really crowded last night.", "Can I get the bill, please?", "I left my wallet at home."], "a": 0, "exp": "✓ (A) I think I'll have the grilled salmon, please.— 服務生回應「好選擇，要喝點什麼嗎」，呼應顧客已點餐。\n❌ (B) 提到餐廳昨晚很擁擠，與「點餐」情境無關。\n❌ (C) 要求結帳，與服務生問「要喝什麼」矛盾（尚未用餐）。\n❌ (D) 說忘記帶錢包，與點餐情境無關。", "zh": "服務生：請問可以點餐了嗎？還是需要再看一下？<br>顧客：我想我要點烤鮭魚，謝謝。<br>服務生：很好的選擇。要喝點什麼嗎？", "sa": "正解句：【S】I 【V】think 【O】I'll have the grilled salmon, please.<br>📌 句型：I'll have…（點餐慣用：我要…）；Anything to drink?（不定代名詞 + to V 修飾）", "on": ["服務生回應「好選擇，要喝點什麼嗎」，呼應顧客已點餐。", "提到餐廳昨晚很擁擠，與「點餐」情境無關。", "要求結帳，與服務生問「要喝什麼」矛盾（尚未用餐）。", "說忘記帶錢包，與點餐情境無關。"], "oz": ["我想點烤鮭魚，謝謝。", "那家餐廳昨晚好擠。", "可以幫我結帳嗎？", "我把錢包忘在家裡了。"]}, {"n": 17, "p": 1, "stem": "Amy: Why didn't you come to the meeting this morning?<br>Ben: _____<br>Amy: Oh no! I hope you feel better soon.", "o": ["I was stuck in traffic for two hours.", "I had a terrible headache and stayed home.", "I thought the meeting was canceled.", "I was talking to a client on the phone."], "a": 1, "exp": "✓ (B) I had a terrible headache and stayed home.— Amy 回應「希望你早點好起來」，呼應 Ben 因頭痛而請假。\n❌ (A) 說被困在車流中兩小時，與「希望你早點好起來」不符。\n❌ (C) 說以為會議取消了，與「希望你早點好起來」不連貫。\n❌ (D) 說在跟客戶講電話，與「希望你早點好起來」不符。", "zh": "Amy：你今天早上怎麼沒來開會？<br>Ben：我頭痛得很厲害，所以待在家裡。<br>Amy：喔不！希望你早日康復。", "sa": "正解句：【S】I 【V】had 【O】a terrible headache and 【V】stayed 【M】home<br>📌 句型：have a headache（頭痛）；I hope (that) you feel better soon.（祝早日康復）", "on": ["說被困在車流中兩小時，與「希望你早點好起來」不符。", "Amy 回應「希望你早點好起來」，呼應 Ben 因頭痛而請假。", "說以為會議取消了，與「希望你早點好起來」不連貫。", "說在跟客戶講電話，與「希望你早點好起來」不符。"], "oz": ["我塞車塞了兩個小時。", "我頭痛得很厲害，所以待在家。", "我以為會議取消了。", "我在跟客戶講電話。"]}, {"n": 18, "p": 1, "stem": "Tourist: Do you know if there's a pharmacy nearby?<br>Local: _____<br>Tourist: Thank you so much for your help!", "o": ["I'm sorry, I'm new here too.", "Yes, there's one just around the corner.", "The pharmacy closes at noon on Sundays.", "You should see a doctor first."], "a": 1, "exp": "✓ (B) Yes, there's one just around the corner.— 遊客回應「非常感謝你的幫助」，呼應當地人提供藥局位置資訊。\n❌ (A) 說自己也是外地人，與「感謝幫助」不符。\n❌ (C) 說藥局星期日中午就關門，未直接回答是否有藥局。\n❌ (D) 建議先看醫生，與詢問藥局位置無關。", "zh": "遊客：請問你知道附近有藥局嗎？<br>當地人：有，轉角就有一家。<br>遊客：非常感謝你的幫忙！", "sa": "正解句：Yes, there 【V】's (is) 【S】one 【M】just around the corner<br>📌 句型：There is + N（有…）；Do you know if…?（間接問句，if＝是否，後接直述句語序）；around the corner（在轉角處）", "on": ["說自己也是外地人，與「感謝幫助」不符。", "遊客回應「非常感謝你的幫助」，呼應當地人提供藥局位置資訊。", "說藥局星期日中午就關門，未直接回答是否有藥局。", "建議先看醫生，與詢問藥局位置無關。"], "oz": ["抱歉，我也是剛來這裡的。", "有，轉角就有一間。", "藥局星期天中午就關門了。", "你應該先去看醫生。"]}, {"n": 19, "p": 1, "stem": "Teacher: Why is your assignment late again, David?<br>David: _____<br>Teacher: I understand, but please let me know in advance next time.", "o": ["My computer crashed and I lost all my files.", "I think the assignment was too easy.", "I finished it three days early.", "I forgot we had an assignment."], "a": 0, "exp": "✓ (A) My computer crashed and I lost all my files.— 老師回應「我理解，但下次請提前告知」，呼應 David 說明遲交原因。\n❌ (B) 說作業太簡單，未回答「為什麼遲交」。\n❌ (C) 說提早三天完成，與「作業遲交」矛盾。\n❌ (D) 說忘記有作業，雖也是原因，但與老師「理解」的寬容回應相比，(A) 的客觀理由更符合教師「下次請提前告知」的回應語氣。", "zh": "老師：David，你的作業怎麼又遲交了？<br>David：我的電腦當機，所有檔案都不見了。<br>老師：我了解，但下次請事先告訴我。", "sa": "正解句：【S】My computer 【V】crashed and 【S】I 【V】lost 【O】all my files<br>關鍵句：please let me know in advance next time.<br>📌 句型：let + O + 原形動詞（let me know 讓我知道）；in advance（事先）", "on": ["老師回應「我理解，但下次請提前告知」，呼應 David 說明遲交原因。 的客觀理由更符合教師「下次請提前告知」的回應語氣。", "說作業太簡單，未回答「為什麼遲交」。", "說提早三天完成，與「作業遲交」矛盾。", "說忘記有作業，雖也是原因，但與老師「理解」的寬容回應相比，"], "oz": ["我的電腦當機，檔案全不見了。", "我覺得這份作業太簡單了。", "我三天前就寫完了。", "我忘了有作業。"]}, {"n": 20, "p": 1, "stem": "Friend A: I heard you're moving to a new apartment next month.<br>Friend B: _____<br>Friend A: That's exciting! Do you need any help packing?", "o": ["Actually, I've decided to stay here a bit longer.", "Yes, I found a place closer to my office.", "I just got back from a trip to Japan.", "My landlord raised the rent last year."], "a": 1, "exp": "✓ (B) Yes, I found a place closer to my office.— Friend A 回應「太棒了！需要幫忙打包嗎」，呼應 Friend B 確認要搬家。\n❌ (A) 說決定繼續住這裡，與「搬家」消息矛盾。\n❌ (C) 提到剛從日本旅行回來，與搬家話題無關。\n❌ (D) 說房東去年漲租金，未回應「是否要搬家」。", "zh": "朋友 A：聽說你下個月要搬到新公寓。<br>朋友 B：對，我找到一個離公司比較近的地方。<br>朋友 A：真令人興奮！你需要人幫忙打包嗎？", "sa": "正解句：Yes，【S】I 【V】found 【O】a place 【M】closer to my office<br>📌 句型：形容詞片語 closer to… 後位修飾 place；現在進行式表已確定的未來（you're moving next month）", "on": ["說決定繼續住這裡，與「搬家」消息矛盾。", "Friend A 回應「太棒了！需要幫忙打包嗎」，呼應 Friend B 確認要搬家。", "提到剛從日本旅行回來，與搬家話題無關。", "說房東去年漲租金，未回應「是否要搬家」。"], "oz": ["其實我決定再多住這裡一陣子。", "對啊，我找到一個離公司比較近的地方。", "我剛從日本旅行回來。", "我的房東去年漲了房租。"]}, {"n": 21, "p": 2, "stem": "(21)", "o": ["about", "over", "at", "up"], "a": 1, "exp": "✓ (B) over（在…方面的掌控）— \"freedom over how they organize their day\" 為慣用搭配，表示對於如何安排自己的一天有「掌控的自由」。\n❌ (A) about = 關於，搭配 freedom 不自然。\n❌ (C) at = 在，不符合此處的固定用法。\n❌ (D) up = 向上，語意不符。", "zh": "<i>Supporters say this arrangement gives workers more freedom <b>over<\/b> how they organize their day, and it also saves them the time and stress of commuting.<\/i><br>支持者說，這種安排讓員工對如何安排自己的一天有更多自主權，也為他們省下了通勤的時間和壓力。" 在分詞）"]}, {"n": 24, "p": 2, "stem": "(24)", "o": ["to", "for", "of", "by"], "a": 0, "exp": "✓ (A) to（不定詞，表目的）— \"online tools to track project progress\" 表示「用來追蹤專案進度的線上工具」，為不定詞修飾名詞表目的。\n❌ (B) for = 介系詞，後面需接動名詞（for tracking），與 track 原形不符。\n❌ (C) of = 介系詞，語意與用法不符。\n❌ (D) by = 介系詞，後面需接動名詞，與 track 原形不符。", "zh": "<i>To address this concern, many companies now use online tools <b>to<\/b> track project progress and hold regular video meetings to keep everyone connected.<\/i><br>為了解決這個疑慮，現在許多公司使用線上工具來追蹤專案進度，並定期舉行視訊會議，讓大家保持聯繫。", "sa": "【M】To address this concern 【S】many companies 【V】use 【O】online tools 【M】to track project progress<br>and 【V】hold 【O】regular video meetings 【M】to keep everyone connected<br>📌 句型：不定詞 to V 表目的；keep + O + C（keep everyone connected 讓大家保持聯繫）", "on": ["\"online tools to track project progress\" 表示「用來追蹤專案進度的線上工具」，為不定詞修飾名詞表目的。", "介系詞，後面需接動名詞（for tracking），與 track 原形不符。", "介系詞，語意與用法不符。", "介系詞，後面需接動名詞，與 track 原形不符。"], "oz": ["去；以便（不定詞，表目的）", "為了", "……的", "藉由；被"]}, {"n": 25, "p": 2, "stem": "(25)", "o": ["variety", "vary", "various", "variously"], "a": 0, "exp": "✓ (A) variety（名詞，多樣性）— \"an enormous variety of marine life\" 表示「種類繁多的海洋生物」，variety 為名詞，符合 an enormous ___ of 的結構。\n❌ (B) vary = 動詞「變化」，詞性不符。\n❌ (C) various = 形容詞「各式各樣的」，不能直接接 of 作為名詞使用。\n❌ (D) variously = 副詞，詞性不符。", "zh": "<i>Coral reefs are sometimes called the \"rainforests of the sea\" because they support an enormous <b>variety<\/b> of marine life.<\/i><br>珊瑚礁有時被稱為「海洋中的雨林」，因為它們孕育了種類極為豐富的海洋生物。", "sa": "【S】Coral reefs 【V】are called 【C】the \"rainforests of the sea\"<br>【M】because they support an enormous variety of marine life<br>📌 句型：被動 be called + 名稱（被稱為…）；a variety of + N（各式各樣的…）", "on": ["\"an enormous variety of marine life\" 表示「種類繁多的海洋生物」，variety 為名詞，符合 an enormous ___ of 的結構。", "動詞「變化」，詞性不符。", "形容詞「各式各樣的」，不能直接接 of 作為名詞使用。", "副詞，詞性不符。"], "oz": ["多樣；種類（名詞，a variety of）", "變化；不同（動詞）", "各式各樣的（形容詞）", "不同地（副詞）"]}, {"n": 26, "p": 2, "stem": "(26)", "o": ["Despite", "Because of", "Once", "Although const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; if(d.firstElementChild) d.firstElementChild.classList.add('orig'); d.insertAdjacentHTML('beforeend', ptrHtml(String(q.n))+rvPassage(String(q.n),PASSAGES[q.n])); while(d.firstChild) form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem og"><span class="num">${q.n}</span>${stemHtml}</div>`+rvStem(q);
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}${optZh(q,i)}</span>`; if(i===q.a) lab.classList.add('ans');
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  card.insertAdjacentHTML('beforeend', rvExp(q));
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>${xtra(q)}`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>${xtra(q)}`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>${xtra(w)}
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();

  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
<script>AK(function(){
// quiz.efetl.com mock-a～p 版型：PARTS[{title}] + Q[{n,p,o,a(0-3 索引)}] + WRITTEN[{title,ans}]（非選擇題列精簡參考答案）
function txt(h){var d=document.createElement('div');d.innerHTML=String(h).replace(/<br\s*\/?>/gi,' ');var s=d.textContent.replace(/\s+/g,' ').trim();return s.length>60?s.slice(0,60)+'…':s}
var secs=PARTS.map(function(p){return {title:p.title.replace(/\s+/g,' '),items:[]}});
Q.forEach(function(q){secs[q.p].items.push([q.n,'ABCD'[q.a]])});
if(typeof WRITTEN!=='undefined'&&WRITTEN.length)secs.push({title:'非選擇題（參考答案）',items:WRITTEN.map(function(w){
  var t=String(w.title).replace(/<[^>]*>/g,'');var m=t.match(/^\s*([^.．\s]+)[.．]?\s*([^（(]*)/);
  return [m?m[1]+' '+m[2].trim():t,txt(w.ans)]})});

});</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>

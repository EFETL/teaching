<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五權國中 國二上第一次段考</title>
<style>
:root{--main:#1d5c63;--main2:#2f8f83;--accent:#f2a541;--bg:#f6f4ef;--card:#fff;--ink:#23303f;--muted:#6b7686;--line:#e3e0d8;--ok:#2e9e6b;--okbg:#e3f5ec;--bad:#d9534f;--badbg:#fbe7e6;--hi:#fff4d6}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,#163f45,#2f8f83 60%,#f2a541 140%);color:#fff;padding:32px 0 24px}
header h1{margin:0 0 4px;font-size:1.6rem}
header p{margin:0;opacity:.92}
header a{color:#fff;font-size:1rem}
.bar{position:sticky;top:0;z-index:10;background:rgba(246,244,239,.96);border-bottom:1px solid var(--line);padding:8px 0}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{font-size:1rem}
.bar button,.btn{font:inherit;font-size:1rem;border:0;border-radius:99px;padding:6px 16px;background:var(--main);color:#fff;cursor:pointer}
.bar button.alt{background:var(--accent);color:#3a2a00}
.prog{height:6px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--main2);transition:width .2s}
h2.sec{margin:32px 0 6px;color:var(--main);font-size:1.25rem;border-left:6px solid var(--accent);padding-left:10px}
.sub{color:var(--muted);font-size:1rem;margin:0 0 12px}
.passage{background:var(--hi);border-left:5px solid var(--accent);border-radius:10px;padding:12px 16px;margin:12px 0;font-size:1rem}
.passage h4{margin:0 0 6px}
.passage p{margin:0 0 8px}
.q{background:var(--card);border-radius:14px;box-shadow:0 4px 18px rgba(30,45,70,.08);padding:14px 16px;margin:12px 0}
.q .t{font-weight:600;margin-bottom:8px}
.q .n{display:inline-block;background:var(--main);color:#fff;border-radius:8px;padding:0 9px;margin-right:6px;font-size:1rem}
.opt{display:block;width:100%;text-align:left;font:inherit;background:#fafaf7;border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.done{cursor:default}
.exp{display:none;margin-top:8px;background:#eef6f5;border-radius:10px;padding:10px 14px;font-size:1rem}
.exp.show{display:block}
.exp b.h{color:var(--main)}
.fill input,.fill textarea{font:inherit;width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0}
.rev{font:inherit;font-size:1rem;border:2px solid var(--main);background:#fff;color:var(--main);border-radius:99px;padding:4px 14px;cursor:pointer}
.ans{display:none;margin-top:8px;background:var(--okbg);border-radius:10px;padding:8px 14px;font-size:1rem}
.ans.show{display:block}
#result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#result.show{display:flex}
#result .card{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;text-align:center}
#result .score{font-size:3rem;font-weight:900;color:var(--main)}
.submit{display:block;margin:28px auto 60px;font:inherit;font-size:1.1rem;border:0;border-radius:99px;padding:12px 32px;background:var(--accent);color:#3a2a00;cursor:pointer;font-weight:700}
@media print{.bar,.submit,.rev{display:none}.exp{display:block}}
</style>
</head>
<body>
<header><div class="wrap">
<a href="../">← 回英文科</a>
<h1>五權國中 國二上第一次段考</h1>
<p>臺中市立五權國中 114 學年度第 1 學期 二年級英文科第一次定期評量 ‧ 過去式 ‧ Because / So / But ‧ 閱讀</p>
</div></header>
<div class="bar"><div class="wrap">
<b id="cnt">已作答 0 / 31</b><b id="sc">得分 0</b>
<button class="alt" id="showAll">📖 顯示全部解析</button>
</div></div>
<div class="prog"><i id="pg"></i></div>
<main class="wrap" id="app"></main>
<div id="result"><div class="card">
<div>選擇題得分（滿分 56）</div><div class="score" id="rs">0</div><div id="rm"></div>
<p><button class="btn" onclick="document.getElementById('result').classList.remove('show')">繼續檢討</button>
<button class="btn" style="background:var(--muted)" onclick="location.reload()">重新作答</button></p>
</div></div>

<script>
// pt = 配分；a = 正解索引(0-3)
const P1=[
{q:"Cindy: By the way, ______ you about my birthday? Bob: My daughter did.",o:["what did you tell","what do you tell","who did you tell","who told"],a:3,e:"Bob 回答「My daughter did.」＝女兒告訴了他，所以問的是「誰告訴你」。<b>who 當主詞，直接接過去式 told</b>，不需要 did。(C) who did you tell 是問「你告訴了誰」，與答句不合。"},
{q:"The weather ______ cloudy ten minutes ago, but it is sunny now.",o:["was","were","is","are"],a:0,e:"<b>ten minutes ago</b> 是過去時間；weather 不可數、視為單數，所以用 <b>was</b>。"},
{q:"The man didn’t ______ to work today because his parents ______ sick.",o:["went; was","go; were","go; was","went; were"],a:1,e:"<b>didn’t 後面接原形動詞 go</b>；because 子句的主詞 parents 是複數，過去式 be 動詞用 <b>were</b>。"},
{q:"My mom cooked dinner and then ______ songs in front of us.",o:["to sing","singing","sang","sing"],a:2,e:"and 連接兩個對等的動作：cooked … and then <b>sang</b>，時態一致用過去式。sing 的過去式是 sang。"},
{q:"Alice: Was your son a doctor ______? Peter: Yes, he was.",o:["now","tomorrow","ago","then"],a:3,e:"問句是過去式 Was，要搭配過去的時間副詞。<b>then＝那時候</b>。ago 前面要有時間長度（two years ago），不能單獨放句尾。"},
{q:"Tiffany picked up the leaf, but Kathy ______.",o:["did","don’t","didn’t","doesn’t"],a:2,e:"前半句是過去式肯定（picked up），but 表轉折，後半句用<b>過去式否定 didn’t</b>（＝didn’t pick up the leaf）。"},
{q:"Cathy: Did Mark buy flowers for me this morning? Andy: Yes, he ______.",o:["were","was","didn’t","did"],a:3,e:"Did 開頭的問句，肯定回答用 <b>Yes, he did.</b>；Yes 後面不能接 didn’t。"},
{q:"Because David was hungry, ______ he ate two bowls of rice.",o:["X","when","but","so"],a:0,e:""},
{q:"Judy: ______ did you go to cram school? Tim: I went there ______ I didn’t pass the English test.",o:["Why/,so","Why/ because","Where/, but","What/, so"],a:1,e:"問原因用 <b>Why</b>；回答原因用 <b>because</b>（因為我英文考試沒通過）。"},
{q:"Amy didn’t want to be late for school, ______ she got up early this morning.",o:["X","but","because","so"],a:3,e:"前句是原因（不想遲到），後句是結果（早起），用 <b>so（所以）</b> 連接。"},
{q:"Harry: Who prepared these birthday gifts? Sam: My mom ______. She ______ my favorite toys for me.",o:["did; buy","didn’t; bought","did; bought","didn’t; buy"],a:2,e:"第一格是代替 prepared 的肯定回答 <b>did</b>；第二格是過去式事實，用 <b>bought</b>（buy 的過去式）。"},
{q:"Lisa and I ______ shopping last weekend, but Bob ______.",o:["went; did","goes; did","go; didn’t","went; didn’t"],a:3,e:"last weekend → 過去式 <b>went</b>；but 後面轉折為否定，用 <b>didn’t</b>（＝didn’t go shopping）。"},
{q:"There ______ ten books on the desk yesterday, but now there isn’t any.",o:["are","is","were","was"],a:2,e:"yesterday 是過去；ten books 是複數，所以用 <b>were</b>。"},
{q:"The bad guy ______ too many people, so the police ______ him and took him to the police station.",o:["hit; caught","hit; catch","hitting; caught","hitting; catch"],a:0,e:"兩個動詞都在過去：hit 的過去式仍是 <b>hit</b>，catch 的過去式是 <b>caught</b>；後面 took 也是過去式，可作對照。"},
{q:"Did you go to the shopping mall ______ afternoon? I didn’t see you.",o:["yesterday","last","before","then"],a:0,e:"空格後是 afternoon，<b>yesterday afternoon（昨天下午）</b>。last 用在 last night / last week，不會說 last afternoon。"},
{q:"Alex: ______ you at Emma’s house this morning? Andy: Yes, I was with her.",o:["Do","Did","Were","Was"],a:2,e:"答句 I was with her 是 be 動詞過去式，所以問句用 <b>Were you …</b>（主詞 you 搭配 were）。"},
{q:"Nancy: What happened to you last night? Zoe: I ______ with my little brother.",o:["fighting","didn’t fight","fight","fought"],a:3,e:"last night 為過去，回答「發生什麼事」要用肯定的過去式 <b>fought</b>（fight 的過去式）。"},
{q:"David: Bullying is really like a nightmare. Edward: Yes, we must stop it and ______ now.",o:["cry for us","pass away","do something","run away"],a:2,e:"前面說「我們必須阻止它」，所以接 <b>do something（採取行動）</b>。pass away 是過世、run away 是逃跑，語意不合。"},
];
const P2=[
{n:19,q:"A ten-year-old girl from Niger, Geeta, got married ____ a thirty-year-old man.",o:["to","of","from","in"],a:0,e:"<b>get married to + 人</b>＝和某人結婚。"},
{n:20,q:"Geeta became a mother ____ eleven.",o:["about","of","at","to"],a:2,e:"<b>at the age of / at + 年齡</b>：在幾歲時，用 at eleven。"},
{n:21,q:"She couldn’t go to school ____ her baby needed her.",o:["because","so","but","or"],a:0,e:"前面是結果（不能上學），後面是原因（寶寶需要她），用 <b>because</b>。"},
{n:22,q:"Her husband ____ her very often.",o:["kissed","won","bought","hit"],a:3,e:"上下文說她過著悲慘（miserable）的生活，所以是丈夫常常<b>打（hit）</b>她。"},
{n:23,q:"She was ____ and couldn’t sleep at night.",o:["dead","curious","scared","terrible"],a:2,e:"害怕到睡不著：<b>scared（害怕的）</b>。dead 是死的、curious 是好奇的，語意不合。"},
{n:24,q:"The marriage was like a ____.",o:["pair","arm","nobody","nightmare"],a:3,e:"婚姻像一場<b>惡夢（nightmare）</b>。第 18 題 Bullying is like a nightmare 也出現過同樣的字。"},
{n:25,q:"Children like them need help. Let’s ____ now.",o:["look after","take action","check in","check out"],a:1,e:"需要幫助兒童，所以「讓我們現在<b>採取行動（take action）</b>」。look after 是照顧，不合文意。",pt:2},
];
const P3=[
{n:26,q:"What do “ones” mean in the article? （She misses the same old ones.）",o:["Stories.","Fishes.","Beef noodles.","Memories."],a:0,e:"文中說 grandpa often told the same <b>stories</b>；題目的 ones 指前面提到的 the same old stories。"},
{n:27,q:"Which is true?",o:["Tracy lives in Taitung now.","Tracy lives in Taichung now.","Tracy didn’t eat any beef noodles.","Tracy didn’t miss her days in Taitung."],a:1,e:"文中 Now, Tracy lives with her parents in <b>Taichung</b>。其他三項都和文章相反。"},
];
const P4=[
{n:28,q:"How can AI chatbots help with English learning?",o:["They take English tests for students.","They help us to speak English well.","They teach us to cook.","They sing English songs for us."],a:1,e:"第一段：Some students also use AI to practice writing and speaking English … make their English better。"},
{n:29,q:"What is good about AI chatbots for teens?",o:["They help teens run faster.","They make teens rich.","They help teens sleep better.","They make teens feel less lonely."],a:3,e:"補充句：when they have no one to talk to … It’s like having a helpful friend。所以是讓青少年<b>較不孤單</b>。"},
{n:30,q:"What is a problem when students copy chatbot answers?",o:["They become too smart.","They forget to eat.","They don’t learn well.","They have more friends."],a:2,e:"第二段：copy the chatbot’s answers without thinking. This is not good for learning。所以是<b>學不好</b>。"},
{n:31,q:"What is the writer trying to say when we use AI?",o:["Use it smartly.","Never use it.","Use it only for games.","Ask AI to do all their work."],a:0,e:"結論句：teenagers should learn to use them in a smart and healthy way。作者的重點是<b>聰明地使用</b>。"},
];
// 第 8 題官方答案 (A) X
P1[7].a=0;
P1[7].e="Because 與 so 不能同時使用，<b>有 Because 開頭的子句，後面主要子句不再加 so</b>。所以空格不填（X）。<br>對比第 10 題：沒有 because 時，才用 so 表示結果。";
const W1=[
["c_ _ _ _ _ n","children","My teacher and his wife have three ____, two sons and one daughter.","child 的複數是不規則變化 children。"],
["h_ _ _ _ _ d","happened","What ____ to you this morning?","happen（發生）的過去式 happened。第 17 題的 What happened to you? 同一句型。"],
["r_ _ _ _ _ r","remember","I don’t ____ her birthday.","remember＝記得。"],
["s_ _ _ t","sweet","We like Kathy very much because she is ____ to us.","sweet＝甜美的、貼心的，be sweet to sb 對某人很好。"],
["s_ _ _ _ d","scared","My little brother is ____ of snakes.","be scared of＝害怕。第 23 題 scared 同字。"],
["p_ _ _ _ ts","parents","My ____ are engineers.","parents＝父母。"],
["b_ y","buy","Could you ____ it for me?","buy＝買。Could you buy it for me? 請你幫我買。"],
["c_ _ _ _ e","choose","I often ____ to help poor people.","choose to V＝選擇去做某事。"],
];
const W2=[["have","had"],["win","won"],["make","made"],["drink","drank"],["say","said"]];
const W3=[
["They can go to the park this afternoon. They have free time. （用 Because … 合併句子）","Because they have free time, they can go to the park this afternoon.","<b>Because + 原因, 結果.</b> 原因（have free time）放在 Because 後面；because 句在句首要加逗號，且後面主要子句不能再用 so。"],
["Tim walked his dog last Sunday. （依畫線部分 last Sunday 造原問句）","What did Tim do last Sunday?","畫線部分是動作 walked his dog，所以問 <b>What did Tim do last Sunday?</b>，did 後用原形。"],
];
const W4=[
["她在 18 歲時當了媽媽並照顧自己的寶寶。（4 分）","She became a mother at the age of 18 and looked after / took care of her baby.","become 的過去式 became；at the age of 18＝在 18 歲時；look after / take care of＝照顧。"],
["我祖父去年 12 月過世。那時我很難過。（3 分）","My grandfather passed away / died last December. I was sad then / at that time.","pass away / die 的過去式 passed away / died；last December 去年十二月；sad 的 be 動詞用過去式 was。"],
];

const app=document.getElementById('app');
let answered=0,score=0,total=31;
const L="ABCD";
function mcq(q,idx,num,pt){
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<div class="t"><span class="n">${num}</span>${q.q}</div>`;
  const ex=document.createElement('div');ex.className='exp';
  ex.innerHTML=`<b class="h">💡 答案：(${L[q.a]}) ${q.o[q.a]}</b><br>${q.e}`;
  q.o.forEach((t,i)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=`(${L[i]}) ${t}`;
    b.onclick=()=>{
      if(d.dataset.done)return;d.dataset.done=1;
      [...d.querySelectorAll('.opt')].forEach(x=>x.classList.add('done'));
      d.querySelectorAll('.opt')[q.a].classList.add('ok');
      if(i===q.a){score+=pt;}else b.classList.add('bad');
      ex.classList.add('show');answered++;upd();
    };
    d.appendChild(b);
  });
  d.appendChild(ex);d._ex=ex;d._reveal=()=>{ex.classList.add('show');d.querySelectorAll('.opt')[q.a].classList.add('ok');};
  q._el=d;return d;
}
function upd(){
  document.getElementById('cnt').textContent=`已作答 ${answered} / ${total}`;
  document.getElementById('sc').textContent=`得分 ${score}`;
  document.getElementById('pg').style.width=(answered/total*100)+'%';
}
function sec(t,s){const h=document.createElement('h2');h.className='sec';h.textContent=t;app.appendChild(h);if(s){const p=document.createElement('p');p.className='sub';p.textContent=s;app.appendChild(p);}}
function passage(h){const d=document.createElement('div');d.className='passage';d.innerHTML=h;app.appendChild(d);}
const els=[];
sec("第一部分：單題（第 1～18 題）","每題 2 分 ‧ 過去式、because / so / but、疑問詞");
P1.forEach((q,i)=>{const e=mcq(q,i,i+1,2);app.appendChild(e);els.push(e);});

sec("題組 19～25：童婚（克漏字）","第 19～24 題每題 1 分；第 25 題 2 分");
passage(`<p>A ten-year-old girl from Niger, Geeta, got married <b>(19)</b> a thirty-year-old man. Geeta became a mother <b>(20)</b> eleven. She couldn’t go to school <b>(21)</b> her baby needed her.</p>
<p>Tanya, from Yemen, lived a miserable (悲慘的) life. Her husband <b>(22)</b> her very often. She was <b>(23)</b> and couldn’t sleep at night. The marriage was like a <b>(24)</b>. Child marriage is happening in many countries. Children like them need help. Let’s <b>(25)</b> now.</p>`);
P2.forEach(q=>{const e=mcq(q,0,q.n,q.pt||1);app.appendChild(e);els.push(e);});

sec("題組 26～27：Tracy’s Memory of Taitung","每題 2 分");
passage(`<h4>Tracy’s Memory of Taitung</h4><p>Several years ago, Tracy’s parents were busy in Taichung. They were very busy, so she lived with her grandparents in Taitung.</p>
<p>Tracy loved Taitung so much. Her grandparents looked after her and prepared her favorite food: beef noodles. They were so delicious. Tracy’s grandpa always took her to go fishing and told her lots of interesting stories. Tracy loved these funny stories although (雖然) he often told the same ones.</p>
<p>Now, Tracy lives with her parents in Taichung, but she misses (想念) Taitung so much. The place is full of wonderful memories. She misses the beef noodles. She misses the old days. She misses the same old stories. She misses her grandparents. She misses them all.</p>`);
P3.forEach(q=>{const e=mcq(q,0,q.n,2);app.appendChild(e);els.push(e);});

sec("題組 28～31：Teenagers and AI Chatbots","每題 2 分");
passage(`<h4>Teenagers and AI Chatbots</h4><p>This year, more and more teenagers use AI chatbots (聊天機器人) every day. These smart tools can help students with many things. For example, when teens (青少年) have trouble with homework, they can ask an AI chatbot for help. The chatbot can make difficult ideas clear. This helps students know the answers better. Some students also use AI to practice writing and speaking English. By talking with AI, they can learn new words and make their English better.</p>
<p>AI chatbots can also be helpful when teens feel unhappy without friends. Talking to an AI can make them feel better, especially (尤其是) when they have no one to talk to at that time. It’s like having a helpful friend.</p>
<p>However (然而), there are also some problems. Some students may become lazy (懶惰的) and just copy (複製) the chatbot’s answers without thinking. This is not good for learning. Also, when teens spend (花費) too much time using AI, they have less (較少的) time to talk with people, like their family and friends.</p>
<p>In the end, AI chatbots can be very useful, but teenagers should learn to use them in a smart and healthy (健康的) way.</p>`);
P4.forEach(q=>{const e=mcq(q,0,q.n,2);app.appendChild(e);els.push(e);});

const btn=document.createElement('button');btn.className='submit';btn.textContent='📝 交卷 / 查看選擇題成績';
btn.onclick=()=>{
  document.getElementById('rs').textContent=score;
  const r=score>=50?'太強了！過去式很穩 👏':score>=40?'不錯，再檢討錯的題目':'多看一次解析，再重做一次';
  document.getElementById('rm').textContent=`已作答 ${answered}/31 ｜ ${r}`;
  document.getElementById('result').classList.add('show');
};

function fillBlock(title,sub){sec(title,sub);}
function revq(prompt,ans,exp,input){
  const d=document.createElement('div');d.className='q fill';
  d.innerHTML=`<div class="t">${prompt}</div>${input||'<input placeholder="寫下你的答案…">'}<button class="rev">看答案</button><div class="ans"><b>✔ ${ans}</b><br>${exp}</div>`;
  d.querySelector('.rev').onclick=()=>d.querySelector('.ans').classList.toggle('show');
  app.appendChild(d);
}
sec("第二部分：非選擇題（共 24 分）","作答後按「看答案」自我檢查");
fillBlock("一、文意字彙（每題 1 分）","依字首提示補完單字");
W1.forEach((w,i)=>revq(`${i+1}. ${w[2]}　<span class="sub">（提示：${w[0]}）</span>`,w[1],w[3]));
fillBlock("二、填入過去式動詞（每題 1 分）","");
W2.forEach((w,i)=>revq(`${9+i}. ${w[0]} →`,w[1],"不規則動詞變化，要背起來。"));
fillBlock("三、依提示作答（每題 2 分）","");
W3.forEach((w,i)=>revq(`${14+i}. ${w[0]}`,w[1],w[2],'<textarea rows="2" placeholder="寫下你的答案…"></textarea>'));
fillBlock("四、翻譯","");
W4.forEach((w,i)=>revq(`${16+i}. ${w[0]}`,w[1],w[2],'<textarea rows="2" placeholder="寫下你的翻譯…"></textarea>'));
app.appendChild(btn);

document.getElementById('showAll').onclick=()=>{
  els.forEach(e=>e._reveal());document.querySelectorAll('.ans').forEach(a=>a.classList.add('show'));
};
</script>
</body>
</html>

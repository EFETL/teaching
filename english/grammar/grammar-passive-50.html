<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>國高中文法 · 被動式改寫 50 題</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    color:#22303f;line-height:1.6;background:linear-gradient(180deg,#eef6ff,#fff4f7 70%);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;}
  .home{display:inline-block;margin-bottom:14px;color:#ff7aa8;font-weight:800;text-decoration:none;
    background:#fff;padding:7px 16px;border-radius:20px;box-shadow:0 3px 10px rgba(255,122,168,.18);font-size:.9rem;}
  header.hero{background:linear-gradient(135deg,#ff9a9e,#fbc2eb 55%,#ffb6e6);color:#5a2540;
    border-radius:22px;padding:28px 26px;margin-bottom:22px;box-shadow:0 10px 26px rgba(255,154,158,.32);}
  header.hero h1{margin:0 0 8px;font-size:1.7rem;}
  header.hero p{margin:0;font-size:.95rem;}
  header.hero .badge{display:inline-block;margin-top:12px;background:rgba(255,255,255,.4);
    padding:8px 14px;border-radius:12px;font-size:.85rem;}

  .formula{background:#fff;border-radius:16px;padding:16px 20px;margin-bottom:18px;
    box-shadow:0 5px 16px rgba(43,140,255,.12);border:1px solid #eaf1fb;text-align:center;}
  .formula b{font-size:1.15rem;color:#2b6cb0;}
  .formula .frame{font-family:Georgia,serif;font-size:1.05rem;margin-top:8px;display:block;}
  .formula .frame u{color:#ff7aa8;font-weight:800;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .btn{border:0;cursor:pointer;font-weight:800;font-size:.88rem;padding:9px 16px;border-radius:20px;
    background:#fff;color:#2b6cb0;box-shadow:0 3px 10px rgba(43,108,176,.18);font-family:inherit;}
  .btn:hover{transform:translateY(-1px);}
  .btn.pdf{background:#2b6cb0;color:#fff;text-decoration:none;display:inline-block;}
  .prog{margin-left:auto;font-size:.85rem;color:#7a8694;font-weight:700;}

  section.blk{background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:18px;
    box-shadow:0 5px 16px rgba(43,140,255,.12);border:1px solid #eaf1fb;}
  section.blk > h2{margin:0 0 4px;font-size:1.1rem;color:#33414f;}
  section.blk > .sub{margin:0 0 12px;font-size:.86rem;color:#7a8694;}
  .demo{background:#f4f8ff;border:1px dashed #9cc0ea;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem;}
  .demo .tag{font-weight:800;color:#2b6cb0;margin-right:8px;}
  .demo .en{font-family:Georgia,serif;}
  .demo b{color:#d6336c;}

  .q{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dotted #dbe6f2;}
  .q:last-child{border-bottom:0;}
  .q .no{flex:0 0 26px;font-weight:800;color:#9aa7b4;font-size:.85rem;padding-top:2px;}
  .q .body{flex:1;min-width:0;}
  .q .act{font-family:Georgia,serif;font-size:1rem;}
  .q .hint{font-size:.8rem;color:#98a4b0;}
  .q .ans{display:none;margin-top:5px;font-family:Georgia,serif;font-size:1rem;
    background:#fff6fa;border-left:3px solid #ff7aa8;padding:6px 10px;border-radius:0 8px 8px 0;}
  .q .ans b{color:#d6336c;}
  .q .ans .pt{display:block;font-family:inherit;font-size:.8rem;color:#7a8694;margin-top:3px;}
  .q.open .ans{display:block;}
  .q .rv{flex:0 0 auto;border:0;cursor:pointer;background:#ffeaf2;color:#d6336c;font-weight:800;
    border-radius:14px;padding:4px 12px;font-size:.8rem;font-family:inherit;}
  .q.open .rv{background:#e8f3ff;color:#2b6cb0;}
  footer{text-align:center;color:#7a8694;font-size:.82rem;margin-top:34px;}
  @media(max-width:520px){ .q .act{font-size:.95rem;} header.hero h1{font-size:1.4rem;} }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="index.html">← 回國高中文法</a>

  <header class="hero">
    <h1>✍️ 國高中文法 · 被動式改寫 50 題</h1>
    <p>整份練習的主詞、受詞都不變，永遠是 <b>Mom</b> 和 <b>the car</b>。學生不必判讀生字，只專注在「改變的那一格」。</p>
    <span class="badge">第一面 1–25 時態／分詞／單複數／代名詞　·　第二面 26–50 否定疑問／雙受詞／使役／片語動詞</span>
  </header>

  <div class="formula">
    被動式 ＝ <b>be 動詞 ＋ 過去分詞 (p.p.)</b>
    <span class="frame">The car <u>&nbsp;?&nbsp;</u> washed by Mom.　←　整份練習只有中間這一格在變</span>
  </div>

  <div class="toolbar">
    <button class="btn" id="showAll">全部顯示答案</button>
    <button class="btn" id="hideAll">全部收合</button>
    <a class="btn pdf" href="passive-50-print.pdf" target="_blank">📄 下載列印版 PDF</a>
    <span class="prog" id="prog">已看答案 0 / 50</span>
  </div>

  <div id="app"></div>

  <footer>全民補習班 · 國高中文法　|　被動式改寫 50 題（點「？」看答案）</footer>
</div>

<script>
const DATA=[
 {t:"第一段　動詞不動，只換時態",s:"動詞固定 wash，過去分詞永遠是 washed，只有 be 的部分在變",
  demo:["Mom washes the car.","The car <b>is washed</b> by Mom."],q:[
  [1,"Mom washed the car.","The car <b>was washed</b> by Mom.","過去簡單式"],
  [2,"Mom will wash the car.","The car <b>will be washed</b> by Mom.","未來式：will 後面用原形 be"],
  [3,"Mom is washing the car.","The car <b>is being washed</b> by Mom.","現在進行式：is ＋ being"],
  [4,"Mom was washing the car.","The car <b>was being washed</b> by Mom.","過去進行式：was ＋ being"],
  [5,"Mom has washed the car.","The car <b>has been washed</b> by Mom.","現在完成式：has ＋ been"],
  [6,"Mom had washed the car.","The car <b>had been washed</b> by Mom.","過去完成式：had ＋ been"],
  [7,"Mom must wash the car.","The car <b>must be washed</b> by Mom.","助動詞後面接原形 be"],
  [8,"Mom can wash the car.","The car <b>can be washed</b> by Mom.","同上"],
  [9,"Mom is going to wash the car.","The car <b>is going to be washed</b> by Mom.","be going to ＋ be ＋ p.p."]]},

 {t:"第二段　時態照舊，只換動詞",s:"這次換動詞在變，注意過去分詞的不規則變化",
  demo:["Mom cleaned the car.","The car <b>was cleaned</b> by Mom."],q:[
  [10,"Mom drove the car.","The car <b>was driven</b> by Mom.","drive → drove → driven"],
  [11,"Mom has sold the car.","The car <b>has been sold</b> by Mom.","sell → sold → sold"],
  [12,"Mom will buy the car.","The car <b>will be bought</b> by Mom.","buy → bought → bought"],
  [13,"Mom found the car.","The car <b>was found</b> by Mom.","find → found → found"],
  [14,"Mom has taken the car.","The car <b>has been taken</b> by Mom.","take → took → taken"]]},

 {t:"第三段　不知道是誰做的，by 不用寫",s:"句尾的 by … 整個拿掉，前面完全一樣",
  demo:["Someone washed the car.","The car <b>was washed</b>."],q:[
  [15,"Someone stole the car last night.","The car <b>was stolen</b> last night.","steal → stolen；by someone 省略"],
  [16,"Someone has moved the car.","The car <b>has been moved</b>.","不知道是誰做的，不必寫 by"],
  [17,"They will repair the car tomorrow.","The car <b>will be repaired</b> tomorrow.","they 泛指，by them 省略"]]},

 {t:"第四段　the car → the cars",s:"只多一個 s，但 be 動詞要跟著變；和第 1、3、5 題對照著看",
  demo:["Mom will wash the cars.","The cars <b>will be washed</b> by Mom."],q:[
  [18,"Mom washes the cars.","The cars <b>are washed</b> by Mom.","↔ 示範題 is washed"],
  [19,"Mom washed the cars.","The cars <b>were washed</b> by Mom.","↔ 第 1 題 was washed"],
  [20,"Mom is washing the cars.","The cars <b>are being washed</b> by Mom.","↔ 第 3 題 is being washed"],
  [21,"Mom has washed the cars.","The cars <b>have been washed</b> by Mom.","↔ 第 5 題 has been washed（has→have）"]]},

 {t:"第五段　受詞換成「人」",s:"動詞固定 drive；代名詞當主詞要換一個樣子",
  demo:["Mom drives you to school.","<b>You are driven</b> to school by Mom."],q:[
  [22,"Mom drives me to school.","<b>I am driven</b> to school by Mom.","me → I"],
  [23,"Mom drove him to school.","<b>He was driven</b> to school by Mom.","him → He"],
  [24,"Mom will drive us to school.","<b>We will be driven</b> to school by Mom.","us → We"],
  [25,"Mom is driving them to school.","<b>They are being driven</b> to school by Mom.","them → They"]]},

 {t:"第六段　否定句與疑問句",s:"否定：not 放在 be 後面；疑問：be 搬到句首",
  demo:["Mom doesn't wash the car.","The car <b>isn't washed</b> by Mom."],q:[
  [26,"Mom didn't wash the car.","The car <b>wasn't washed</b> by Mom.","not 放在 be 後面"],
  [27,"Mom won't wash the car.","The car <b>won't be washed</b> by Mom.","won't ＋ be ＋ p.p."],
  [28,"Mom hasn't washed the car.","The car <b>hasn't been washed</b> by Mom.","hasn't ＋ been ＋ p.p."],
  [29,"Does Mom wash the car?","<b>Is</b> the car <b>washed</b> by Mom?","be 搬到句首，Does 消失"],
  [30,"Did Mom wash the car?","<b>Was</b> the car <b>washed</b> by Mom?","Did → Was"]]},

 {t:"第七段　兩個受詞，兩種改法",s:"人、物都可以當主詞；物當主詞時，人的前面要補 to",
  demo:["Mom gave me the key.","① <b>I was given</b> the key by Mom.　② The key <b>was given to me</b> by Mom."],q:[
  [31,"Mom gave him the key.","① <b>He was given</b> the key by Mom.<br>② The key <b>was given to him</b> by Mom.","兩種改法都要會"],
  [32,"Mom has shown us the car.","① <b>We have been shown</b> the car by Mom.<br>② The car <b>has been shown to us</b> by Mom.","①主詞 We 用 have，②主詞 The car 用 has"],
  [33,"Mom will send me the key.","① <b>I will be sent</b> the key by Mom.<br>② The key <b>will be sent to me</b> by Mom.","will be ＋ p.p."],
  [34,"Mom told them the news.","① <b>They were told</b> the news by Mom.<br>② The news <b>was told to them</b> by Mom.","tell → told"]]},

 {t:"第八段　使役與感官動詞",s:"主動接原形動詞，改成被動要把 to 還回來",
  demo:["Mom made him wash the car.","He <b>was made to wash</b> the car by Mom."],q:[
  [35,"Mom made me wash the car.","<b>I was made to wash</b> the car by Mom.","made 後面原形 → 被動補 to"],
  [36,"Mom saw him drive the car.","<b>He was seen to drive</b> the car by Mom.","saw 後面原形 → 被動補 to"],
  [37,"Mom heard us start the car.","<b>We were heard to start</b> the car by Mom.","heard 後面原形 → 被動補 to"],
  [38,"Mom let me drive the car.　<span class='hint'>（let 沒有被動，要換一個字）</span>","<b>I was allowed to drive</b> the car.","let 沒有被動式，改用 be allowed to"]]},

 {t:"第九段　片語動詞：介系詞不能丟",s:"take care of、look after 是一整組，後面那個小字要跟著搬過去",
  demo:["Mom looked after the car.","The car <b>was looked after</b> by Mom."],q:[
  [39,"Mom takes care of the car.","The car <b>is taken care of</b> by Mom.","of 不能丟"],
  [40,"Mom picked up the car yesterday.","The car <b>was picked up</b> by Mom yesterday.","up 不能丟"],
  [41,"Someone must turn off the lights.","The lights <b>must be turned off</b>.","助動詞＋片語動詞＋省略 by"],
  [42,"Everyone laughed at him.","<b>He was laughed at</b>（by everyone）.","at 不能丟；him → He"]]},

 {t:"第十段　不用 by 的被動",s:"有些被動後面不接 by，要背固定的介系詞；get 也可以代替 be",
  demo:["Everyone knows Mom.","Mom <b>is known to</b> everyone."],q:[
  [43,"Snow covers the car.　<span class='hint'>（用 with）</span>","The car <b>is covered with</b> snow.","covered with，不是 by"],
  [44,"Everyone knows the car.　<span class='hint'>（用 to）</span>","The car <b>is known to</b> everyone.","known to"],
  [45,"The news surprised Mom.　<span class='hint'>（用 at）</span>","Mom <b>was surprised at</b> the news.","surprised at"],
  [46,"Someone broke the car window.　<span class='hint'>（用 get）</span>","The car window <b>got broken</b>.","get ＋ p.p. 也是被動，口語常用"]]},

 {t:"第十一段　混合題：這次不告訴你考什麼",s:"前面十段全部混在一起，整句寫出來",
  demo:null,q:[
  [47,"Mom has already washed the cars.","The cars <b>have already been washed</b> by Mom.","完成式＋複數 have＋already 的位置"],
  [48,"Someone must take care of the car.","The car <b>must be taken care of</b>.","助動詞＋片語動詞 of＋省略 by"],
  [49,"Mom didn't drive us to school.","We <b>weren't driven</b> to school by Mom.","否定＋us→We＋複數 were"],
  [50,"Did Mom give him the key?","<b>Was he given</b> the key by Mom?<br>／ <b>Was</b> the key <b>given to him</b> by Mom?","疑問＋兩個受詞兩種改法"]]}
];

const app=document.getElementById('app');
DATA.forEach(sec=>{
  const el=document.createElement('section'); el.className='blk';
  let h=`<h2>${sec.t}</h2><p class="sub">${sec.s}</p>`;
  if(sec.demo) h+=`<div class="demo"><span class="tag">示範</span><span class="en">${sec.demo[0]}　→　${sec.demo[1]}</span></div>`;
  sec.q.forEach(([n,a,ans,pt])=>{
    h+=`<div class="q" data-n="${n}"><div class="no">${n}</div>
      <div class="body"><div class="act">${a}</div>
      <div class="ans">${ans}<span class="pt">💡 ${pt}</span></div></div>
      <button class="rv">？</button></div>`;
  });
  el.innerHTML=h; app.appendChild(el);
});

const prog=document.getElementById('prog');
function sync(){ prog.textContent='已看答案 '+document.querySelectorAll('.q.open').length+' / 50'; }
app.addEventListener('click',e=>{
  const b=e.target.closest('.rv'); if(!b) return;
  const q=b.closest('.q'); q.classList.toggle('open');
  b.textContent=q.classList.contains('open')?'收合':'？'; sync();
});
document.getElementById('showAll').onclick=()=>{document.querySelectorAll('.q').forEach(q=>{q.classList.add('open');q.querySelector('.rv').textContent='收合';});sync();};
document.getElementById('hideAll').onclick=()=>{document.querySelectorAll('.q').forEach(q=>{q.classList.remove('open');q.querySelector('.rv').textContent='？';});sync();};
sync();
</script>
</body>
</html>

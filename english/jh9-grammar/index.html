<script>
const LESSONS = [{"id":"emo","emoji":"😲","title":"情緒動詞","en":"-ing / -ed Adjectives","color":"#e8590c","img":"img/emo.webp","goal":"分得出 boring 和 bored，三秒選對。","steps":[{"h":"中文一個「無聊」，英文要兩個字","body":"\n<p>中文說「這部電影好無聊」和「我好無聊」，都用同一個詞。<\/p>\n<p>英文不行，要分成兩個：<\/p>\n<div class=\"pair\"><div class=\"card2\"><div class=\"big\">The movie is <b class=\"V\">boring<\/b>.<button class=\"say\" data-say=\"c6e8f07dc0\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div><div class=\"zh\">電影<b>讓人<\/b>覺得無聊<\/div><\/div>\n<div class=\"card2\"><div class=\"big\">I am <b class=\"V\">bored<\/b>.<button class=\"say\" data-say=\"078ef93e07\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div><div class=\"zh\">我<b>自己<\/b>覺得無聊<\/div><\/div><\/div>\n<p class=\"tip\">差在哪裡？下一步告訴你。<\/p>"},{"h":"口訣：-ing 給感覺，-ed 有感覺","body":"\n<div class=\"rule\"><div><b class=\"V\">-ing<\/b>　＝　<b>給<\/b>別人感覺的（人、事、物）<\/div><div><b class=\"V\">-ed<\/b>　＝　心裡<b>有<\/b>感覺的（人）<\/div><\/div>\n<div class=\"flow\"><span class=\"box\">📺 電影<\/span><span class=\"arrow\">── 讓人無聊 ──▶<\/span><span class=\"box\">🙍 我<\/span><\/div>\n<div class=\"flow\"><span class=\"lab\">boring（給感覺）<\/span><span class=\"lab\">bored（有感覺）<\/span><\/div>\n<p>想像箭頭：箭頭<b>出發<\/b>的那邊用 <b>-ing<\/b>，箭頭<b>打到<\/b>的那邊用 <b>-ed<\/b>。<\/p>"},{"h":"三秒判斷法","body":"\n<ol class=\"steps3\"><li>先看要形容<b>誰<\/b>（主詞或後面的名詞）。<\/li><li>問一句：<b>他是讓別人有感覺，還是他自己有感覺？<\/b><\/li><li>讓別人 → <b>-ing<\/b>；自己 → <b>-ed<\/b>。<\/li><\/ol>\n<div class=\"ask\">The soccer game was very <u>excit___<\/u>. <span class=\"rv\">→ <b>exciting<\/b>（比賽讓人興奮）<button class=\"say\" data-say=\"29324637de\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\">All the fans were <u>excit___<\/u>. <span class=\"rv\">→ <b>excited<\/b>（球迷自己興奮）<\/span><\/div>\n<div class=\"ask\">Lisa looked <u>surpris___<\/u> when she opened the box. <span class=\"rv\">→ <b>surprised<\/b>（Lisa 自己嚇一跳）<button class=\"say\" data-say=\"39da98e5cd\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"陷阱一：人也可以用 -ing","body":"\n<p>很多同學以為「人就用 -ed」，<b>錯！<\/b>要看意思。<\/p>\n<div class=\"pair\"><div class=\"card2\"><div class=\"big\">Mr. Wang is <b class=\"V\">boring<\/b>.<button class=\"say\" data-say=\"0c97d1d0d7\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div><div class=\"zh\">王老師很<b>無趣<\/b>（大家聽他講話覺得無聊）<\/div><\/div>\n<div class=\"card2\"><div class=\"big\">Mr. Wang is <b class=\"V\">bored<\/b>.<button class=\"say\" data-say=\"3bfb8c1d79\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div><div class=\"zh\">王老師<b>覺得無聊<\/b>（他自己沒事做）<\/div><\/div><\/div>\n<p class=\"tip\">所以不是看「人或東西」，而是看「<b>給<\/b>感覺還是<b>有<\/b>感覺」。<\/p>"},{"h":"陷阱二：放在名詞前面也一樣","body":"\n<table class=\"tb\"><tr><th>給感覺（-ing）<\/th><th>有感覺（-ed）<\/th><\/tr>\n<tr><td>an <b class=\"V\">amazing<\/b> trip　令人驚奇的旅行<button class=\"say\" data-say=\"c9fa302528\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td><b class=\"V\">amazed<\/b> tourists　感到驚奇的遊客<button class=\"say\" data-say=\"536884a896\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>a <b class=\"V\">confusing<\/b> map　讓人搞混的地圖<button class=\"say\" data-say=\"ecf517f2e4\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>a <b class=\"V\">confused<\/b> boy　搞不清楚的男孩<button class=\"say\" data-say=\"143d214377\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>a <b class=\"V\">touching<\/b> story　感人的故事<button class=\"say\" data-say=\"4b00e8c3ff\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td><b class=\"V\">touched<\/b> readers　被感動的讀者<button class=\"say\" data-say=\"125fa2f87e\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>\n<p>特別注意：<b>a surprised look／a worried face<\/b>（表情、臉）是「人的感覺」露出來，所以用 <b>-ed<\/b>。<\/p>"},{"h":"常考 12 組，一次記","body":"\n<table class=\"tb small\"><tr><th>動詞（使…）<\/th><th>-ing 令人…的<\/th><th>-ed 感到…的<\/th><\/tr>\n<tr><td>interest 使有興趣<button class=\"say\" data-say=\"5e8aa8dfec\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>interesting<button class=\"say\" data-say=\"68f5555179\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>interested<button class=\"say\" data-say=\"ebfb2e9c2a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>excite 使興奮<button class=\"say\" data-say=\"eccc4d3ab4\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>exciting<button class=\"say\" data-say=\"29324637de\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>excited<button class=\"say\" data-say=\"f529c0de3c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>bore 使無聊<button class=\"say\" data-say=\"7edf1cd496\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>boring<button class=\"say\" data-say=\"2c7fba4938\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>bored<button class=\"say\" data-say=\"aa6897a908\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>surprise 使驚訝<button class=\"say\" data-say=\"63e76d7b9e\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>surprising<button class=\"say\" data-say=\"50b8de2eb5\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>surprised<button class=\"say\" data-say=\"39da98e5cd\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>amaze 使驚奇<button class=\"say\" data-say=\"00a8426e40\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>amazing<button class=\"say\" data-say=\"5749570a40\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>amazed<button class=\"say\" data-say=\"f301793c8b\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>tire 使疲累<button class=\"say\" data-say=\"63f72cc7de\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>tiring<button class=\"say\" data-say=\"2d1f13d97b\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>tired<button class=\"say\" data-say=\"511e991159\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>confuse 使困惑<button class=\"say\" data-say=\"27d748cf56\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>confusing<button class=\"say\" data-say=\"5bccaca18d\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>confused<button class=\"say\" data-say=\"bc622619b8\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>disappoint 使失望<button class=\"say\" data-say=\"2c0aae3028\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>disappointing<button class=\"say\" data-say=\"793ff57f82\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>disappointed<button class=\"say\" data-say=\"7469961612\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>frighten／scare 使害怕<\/td><td>frightening／scary*<\/td><td>frightened／scared<\/td><\/tr>\n<tr><td>touch 使感動<button class=\"say\" data-say=\"f4d1f01938\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>touching<button class=\"say\" data-say=\"01f62711ef\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>touched<button class=\"say\" data-say=\"fb188e4e2a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>embarrass 使尷尬<button class=\"say\" data-say=\"0a7737e711\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>embarrassing<button class=\"say\" data-say=\"cac2a0e522\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>embarrassed<button class=\"say\" data-say=\"ecc16fe251\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>satisfy 使滿意<button class=\"say\" data-say=\"fb36f0d0af\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>satisfying<button class=\"say\" data-say=\"ae045ec376\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>satisfied<button class=\"say\" data-say=\"a34b2d93b4\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>\n<p class=\"tip\">* scare 的「令人害怕的」常用 <b>scary<\/b>。另外 <b>worried<\/b>（擔心的）也很常考：I'm worried about the test.<\/p>"},{"h":"-ed 後面常接的介系詞","body":"\n<p>人「有感覺」時，常說<b>對什麼<\/b>有感覺，就要接介系詞：<\/p>\n<table class=\"tb\"><tr><td>be <b class=\"V\">interested<\/b> <b class=\"W\">in<\/b>　對…有興趣<button class=\"say\" data-say=\"6e80385755\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>be <b class=\"V\">excited<\/b> <b class=\"W\">about<\/b>　對…很興奮<button class=\"say\" data-say=\"e304df482c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>be <b class=\"V\">surprised<\/b> <b class=\"W\">at／by<\/b>　對…感到驚訝<\/td><td>be <b class=\"V\">worried<\/b> <b class=\"W\">about<\/b>　擔心…<button class=\"say\" data-say=\"588347b4f0\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>be <b class=\"V\">tired<\/b> <b class=\"W\">of<\/b>　厭倦…<button class=\"say\" data-say=\"14905c5087\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>be <b class=\"V\">bored<\/b> <b class=\"W\">with<\/b>　對…感到厭煩<button class=\"say\" data-say=\"0f67d731a2\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>be <b class=\"V\">satisfied<\/b> <b class=\"W\">with<\/b>　對…滿意<button class=\"say\" data-say=\"162e4f8738\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>be <b class=\"V\">scared<\/b> <b class=\"W\">of<\/b>　害怕…<button class=\"say\" data-say=\"e413a9859c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td colspan=\"2\">be <b class=\"V\">disappointed<\/b> <b class=\"W\">in／with<\/b>　對…失望<\/td><\/tr><\/table>\n<div class=\"ask\">Ben is interested ___ making robots. <span class=\"rv\">→ <b>in<\/b>，後面是動詞要加 -ing（making）<\/span><\/div>\n<p>反過來，從「東西」的角度說，用 <b>-ing＋to＋人<\/b>：<\/p>\n<div class=\"big\">The ending of the story was <b class=\"V\">surprising<\/b> <b class=\"W\">to<\/b> me.<button class=\"say\" data-say=\"d5e8cfed86\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<div class=\"zh\">＝ I was <b>surprised at<\/b> the ending of the story.（故事結局讓我很驚訝）<\/div>"},{"h":"小結","body":"\n<div class=\"sum\"><div>① <b>-ing 給感覺、-ed 有感覺<\/b>（箭頭出發 vs 箭頭打到）<\/div>\n<div>② 不是「人用 -ed、物用 -ing」，要看意思（He is boring. 也對）<\/div>\n<div>③ 放名詞前也一樣；表情、臉用 -ed（a surprised look）<\/div>\n<div>④ -ed 常配介系詞：interested in、excited about、tired of、worried about<\/div><\/div>"}]},{"id":"tag","emoji":"❓","title":"附加問句","en":"Tag Questions","color":"#7048e8","img":"img/tag.webp","goal":"會加句尾小尾巴「…對吧？」，連特殊句型都不怕。","steps":[{"h":"句尾的小尾巴：「…對吧？」","body":"\n<p>中文常說「你是新同學，<b>對吧？<\/b>」「他不吃辣，<b>是嗎？<\/b>」<\/p>\n<p>英文在句子後面加一個<b>短短的問句<\/b>，就是附加問句：<\/p>\n<div class=\"big\">You are a new student, <b class=\"X\">aren't<\/b> <b class=\"S\">you<\/b>?<button class=\"say\" data-say=\"351d5a9bae\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<div class=\"big\">He doesn't eat spicy food, <b class=\"X\">does<\/b> <b class=\"S\">he<\/b>?<button class=\"say\" data-say=\"5d5435df25\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<p class=\"tip\">小尾巴只有兩個字：<b>助動詞＋代名詞<\/b>。<\/p>"},{"h":"三步驟：找、反、換","body":"\n<ol class=\"steps3\"><li><b>找<\/b>：找出句子裡的 be 動詞或助動詞（is, are, can, will, have…）。沒有的話，用 <b>do／does／did<\/b> 當分身。<\/li>\n<li><b>反<\/b>：前面肯定 → 後面否定；前面否定 → 後面肯定。（否定要縮寫：isn't、don't、can't）<\/li>\n<li><b>換<\/b>：主詞換成代名詞（Amy → she、my parents → they、this → it）。<\/li><\/ol>\n<div class=\"big\">Amy <b class=\"X\">is<\/b> from Tainan, <span class=\"rv\"><b class=\"X\">isn't<\/b> <b class=\"S\">she<\/b>?<\/span><button class=\"say\" data-say=\"ba4be52d7b\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>"},{"h":"一般動詞：找 do／does／did 當分身","body":"\n<p>句子裡只有一般動詞（play, like, went…）時，小尾巴要用 do 家族：<\/p>\n<table class=\"tb\"><tr><th>句子的動詞<\/th><th>小尾巴用<\/th><th>例句<\/th><\/tr>\n<tr><td>原形（I/you/we/they）<\/td><td>don't／do<\/td><td>They <b class=\"V\">live<\/b> in Taichung, <span class=\"rv\"><b class=\"X\">don't<\/b> they?<button class=\"say\" data-say=\"a2770f8437\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>加 -s（he/she/it）<\/td><td>doesn't／does<\/td><td>Your cat <b class=\"V\">sleeps<\/b> a lot, <span class=\"rv\"><b class=\"X\">doesn't<\/b> it?<button class=\"say\" data-say=\"7acd60728d\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>過去式<\/td><td>didn't／did<\/td><td>Kevin <b class=\"V\">forgot<\/b> his key, <span class=\"rv\"><b class=\"X\">didn't<\/b> he?<button class=\"say\" data-say=\"579e0e7249\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr><\/table>\n<p class=\"tip\">看動詞「長什麼樣子」就知道用 do、does 還是 did。<\/p>"},{"h":"有助動詞：直接搬","body":"\n<table class=\"tb\"><tr><td>She <b class=\"X\">can<\/b> ride a bike,<\/td><td><span class=\"rv\"><b class=\"X\">can't<\/b> she?<button class=\"say\" data-say=\"b6e74986c7\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>We <b class=\"X\">will<\/b> meet at noon,<\/td><td><span class=\"rv\"><b class=\"X\">won't<\/b> we?<button class=\"say\" data-say=\"64e87f7160\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span>（will not ＝ won't）<\/td><\/tr>\n<tr><td>You <b class=\"X\">have<\/b> finished your homework,<\/td><td><span class=\"rv\"><b class=\"X\">haven't<\/b> you?<button class=\"say\" data-say=\"1a440c59d5\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span>（完成式的 have）<\/td><\/tr>\n<tr><td>The kids <b class=\"X\">were<\/b> sleeping,<\/td><td><span class=\"rv\"><b class=\"X\">weren't<\/b> they?<button class=\"say\" data-say=\"3cfbb4281a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>Tom <b class=\"X\">shouldn't<\/b> be late,<\/td><td><span class=\"rv\"><b class=\"X\">should<\/b> he?<button class=\"say\" data-say=\"4aeb80aabc\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr><\/table>\n<p class=\"tip\">注意：<b>has to／have to<\/b> 的 have 是一般動詞 → He has to leave, <b>doesn't he<\/b>?<\/p>"},{"h":"看起來肯定，其實是否定","body":"\n<p>這些字本身就有「不、很少、幾乎沒有」的意思，句子算<b>否定<\/b>，小尾巴要用<b>肯定<\/b>：<\/p>\n<div class=\"chips\"><span>never 從不<button class=\"say\" data-say=\"85777c03b7\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><span>seldom 很少<button class=\"say\" data-say=\"74e023ef23\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><span>hardly 幾乎不<button class=\"say\" data-say=\"be67ab6fe5\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><span>no／nobody／nothing<\/span><span>few 很少（可數）<\/span><span>little 很少（不可數）<\/span><\/div>\n<div class=\"ask\">Jenny <b>never<\/b> drinks coffee, <span class=\"rv\"><b class=\"X\">does<\/b> she?<button class=\"say\" data-say=\"decf5cd9ab\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\">There is <b>little<\/b> milk in the bottle, <span class=\"rv\"><b class=\"X\">is<\/b> there?<button class=\"say\" data-say=\"50da2df25f\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<p class=\"tip\">小心：a few、a little 是「有一些」＝肯定 → There are a few eggs, <b>aren't there<\/b>?<\/p>"},{"h":"魔王關：特殊句型","body":"\n<table class=\"tb\"><tr><th>前面的句子<\/th><th>小尾巴<\/th><th>例句<\/th><\/tr>\n<tr><td>I am …<\/td><td><b>aren't I<\/b>?<button class=\"say\" data-say=\"a732da5314\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I'm your best friend, <span class=\"rv\">aren't I?<button class=\"say\" data-say=\"6b87a8aa95\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>Let's …（一起來）<\/td><td><b>shall we<\/b>?<button class=\"say\" data-say=\"eae39ba86a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>Let's take a break, <span class=\"rv\">shall we?<button class=\"say\" data-say=\"b0306ccade\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>祈使句（叫別人做）<\/td><td><b>will you<\/b>?<button class=\"say\" data-say=\"13d363ce7f\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>Close the door, <span class=\"rv\">will you?<button class=\"say\" data-say=\"9f92141152\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>There is／are …<\/td><td><b>isn't／aren't there<\/b>?<\/td><td>There is a bank nearby, <span class=\"rv\">isn't there?<button class=\"say\" data-say=\"151c0ed532\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>everyone／someone／nobody<\/td><td>代名詞用 <b>they<\/b><\/td><td>Everyone is here, <span class=\"rv\">aren't they?<button class=\"say\" data-say=\"803d5a3932\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>everything／nothing<\/td><td>代名詞用 <b>it<\/b><\/td><td>Everything looks fine, <span class=\"rv\">doesn't it?<button class=\"say\" data-say=\"611def2b59\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>this／that<\/td><td>it<\/td><td>That is your bag, <span class=\"rv\">isn't it?<button class=\"say\" data-say=\"e1f2fd5513\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>these／those<\/td><td>they<\/td><td>These are new, <span class=\"rv\">aren't they?<button class=\"say\" data-say=\"60976cf320\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>動名詞（V-ing）當主詞<\/td><td>代名詞用 <b>it<\/b><\/td><td>Playing chess is fun, <span class=\"rv\">isn't it?<button class=\"say\" data-say=\"2f6bad1af4\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr>\n<tr><td>I think／I believe＋子句<\/td><td>看<b>後面子句<\/b><\/td><td>I think Amy is sick, <span class=\"rv\">isn't she?<button class=\"say\" data-say=\"9c40574d70\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/td><\/tr><\/table>"},{"h":"怎麼回答？照事實！","body":"\n<p>這裡最容易錯：英文回答<b>不看問法，只看事實<\/b>。<\/p>\n<div class=\"big\">You don't like fish, do you?<button class=\"say\" data-say=\"eafcea0669\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<table class=\"tb\"><tr><th>事實<\/th><th>英文<\/th><th>中文意思<\/th><\/tr>\n<tr><td>我<b>喜歡<\/b>魚<\/td><td><b>Yes<\/b>, I do.<button class=\"say\" data-say=\"7694bd6238\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>不，我喜歡。<\/td><\/tr>\n<tr><td>我<b>不喜歡<\/b>魚<\/td><td><b>No<\/b>, I don't.<button class=\"say\" data-say=\"284da0cb3a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>對，我不喜歡。<\/td><\/tr><\/table>\n<p class=\"tip\">Yes 後面一定接肯定（Yes, I do），No 後面一定接否定（No, I don't），不會混搭。<\/p>\n<p>小知識：句尾<b>語調上揚↗<\/b>是真的不確定在問；<b>下降↘<\/b>是自己很確定、只是要對方附和。<\/p>"},{"h":"小結","body":"\n<div class=\"sum\"><div>① 三步驟：<b>找<\/b>助動詞 → 正反<b>反<\/b>過來 → 主詞<b>換<\/b>代名詞<\/div>\n<div>② 一般動詞找 do／does／did；has to 也用 does<\/div>\n<div>③ never、seldom、hardly、little、few、no 算否定 → 尾巴用肯定<\/div>\n<div>④ I am → aren't I；Let's → shall we；祈使句 → will you；There is → isn't there；everyone → they<\/div>\n<div>⑤ 回答看事實：Yes＋肯定、No＋否定<\/div><\/div>"}]},{"id":"wh","emoji":"📦","title":"名詞子句（間接問句）","en":"Indirect Questions","color":"#1971c2","img":"img/wh.webp","goal":"會把 wh- 問句「塞進」句子裡，順序不出錯。","steps":[{"h":"把問句「塞進」另一個句子","body":"\n<p>直接問：<b>Where is the library?<\/b>（圖書館在哪？）<\/p>\n<p>客氣一點：<b>Do you know where the library is?<\/b>（你知道圖書館在哪嗎？）<\/p>\n<p>第二句裡面藏了一個問句，這個被塞進去的問句就叫<b>名詞子句<\/b>（也叫間接問句）。<\/p>\n<p class=\"tip\">常用來「塞問句」的開頭：I don't know…／Do you know…?／Can you tell me…?／I wonder…（我想知道）／Please tell me…<\/p>"},{"h":"口訣：問句進句子，順序變回直述句","body":"\n<div class=\"rule\"><div>問句：　<b class=\"W\">疑問詞<\/b>＋<b class=\"X\">be／助動詞<\/b>＋<b class=\"S\">主詞<\/b>…?<\/div><div>塞進去：<b class=\"W\">疑問詞<\/b>＋<b class=\"S\">主詞<\/b>＋<b class=\"V\">動詞<\/b>…<\/div><\/div>\n<p>就像進教室要脫帽子：問句一進到別人的句子裡，<b>主詞要站回動詞前面<\/b>。<\/p>\n<div class=\"big\"><b class=\"W\">What<\/b> <b class=\"X\">is<\/b> <b class=\"S\">her name<\/b>?<button class=\"say\" data-say=\"5b419ccce1\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<div class=\"big\">→ I don't know <b class=\"W\">what<\/b> <b class=\"S\">her name<\/b> <b class=\"X\">is<\/b>.<button class=\"say\" data-say=\"89a4176337\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>"},{"h":"第一種：be 動詞、can、will…「搬到主詞後面」","body":"\n<div class=\"ask\"><b class=\"W\">Where<\/b> <b class=\"X\">are<\/b> <b class=\"S\">my glasses<\/b>?<button class=\"say\" data-say=\"16dac8c219\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Can you tell me <span class=\"rv\"><b class=\"W\">where<\/b> <b class=\"S\">my glasses<\/b> <b class=\"X\">are<\/b>?<button class=\"say\" data-say=\"133519bc25\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">When<\/b> <b class=\"X\">will<\/b> <b class=\"S\">the bus<\/b> come?<button class=\"say\" data-say=\"29786a2619\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Do you know <span class=\"rv\"><b class=\"W\">when<\/b> <b class=\"S\">the bus<\/b> <b class=\"X\">will<\/b> come?<button class=\"say\" data-say=\"9a55f05ff5\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">How<\/b> <b class=\"X\">can<\/b> <b class=\"S\">I<\/b> join the club?<button class=\"say\" data-say=\"b6c0906c13\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Please tell me <span class=\"rv\"><b class=\"W\">how<\/b> <b class=\"S\">I<\/b> <b class=\"X\">can<\/b> join the club.<button class=\"say\" data-say=\"c0543a635e\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"第二種：do／does／did「脫帽子」","body":"\n<p>do／does／did 只是問句用的帽子。塞進句子裡就<b>拿掉<\/b>，但它帶的<b>時態要還給動詞<\/b>：<\/p>\n<div class=\"ask\"><b class=\"W\">What<\/b> <s class=\"gone\">does<\/s> <b class=\"S\">Ken<\/b> <b class=\"V\">want<\/b>?<button class=\"say\" data-say=\"83a83bb020\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ I don't know <span class=\"rv\"><b class=\"W\">what<\/b> <b class=\"S\">Ken<\/b> <b class=\"V\">wants<\/b>.（does 拿掉，-s 還給 want）<button class=\"say\" data-say=\"ccaab49e4b\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">Where<\/b> <s class=\"gone\">did<\/s> <b class=\"S\">they<\/b> <b class=\"V\">go<\/b>?<button class=\"say\" data-say=\"15c77e700c\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Do you know <span class=\"rv\"><b class=\"W\">where<\/b> <b class=\"S\">they<\/b> <b class=\"V\">went<\/b>?（did 拿掉，過去式還給 go → went）<button class=\"say\" data-say=\"820bf6ed75\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">Why<\/b> <s class=\"gone\">do<\/s> <b class=\"S\">you<\/b> <b class=\"V\">like<\/b> math?<button class=\"say\" data-say=\"cd763beaf9\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Tell me <span class=\"rv\"><b class=\"W\">why<\/b> <b class=\"S\">you<\/b> <b class=\"V\">like<\/b> math.<button class=\"say\" data-say=\"3e2b03e461\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<p class=\"tip\">最常見的錯：✗ I don't know where does he live. ✓ I don't know where he <b>lives<\/b>.<\/p>"},{"h":"第三種：疑問詞自己就是主詞 → 不用動","body":"\n<p>who、what 如果<b>自己就是主詞<\/b>（後面直接接動詞），順序本來就是對的，<b>直接塞進去<\/b>：<\/p>\n<div class=\"ask\"><b class=\"W\">Who<\/b> <b class=\"V\">took<\/b> my umbrella?<button class=\"say\" data-say=\"d799a49c0a\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ I wonder <span class=\"rv\"><b class=\"W\">who<\/b> <b class=\"V\">took<\/b> my umbrella.<button class=\"say\" data-say=\"018912f982\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">What<\/b> <b class=\"V\">happened<\/b> last night?<button class=\"say\" data-say=\"0bd17c9cf7\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Nobody knows <span class=\"rv\"><b class=\"W\">what<\/b> <b class=\"V\">happened<\/b> last night.<button class=\"say\" data-say=\"89c92ce6cd\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<p class=\"tip\">判斷法：疑問詞後面<b>直接就是動詞<\/b>（沒有另一個主詞）→ 順序不動。<\/p>"},{"h":"整組一起搬：how many、what time、which…","body":"\n<p>疑問詞後面黏著的字，要<b>整組一起搬<\/b>，不能拆開：<\/p>\n<div class=\"ask\"><b class=\"W\">How many students<\/b> <b class=\"X\">are<\/b> <b class=\"S\">there<\/b> in your class?<button class=\"say\" data-say=\"4988c42936\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ I wonder <span class=\"rv\"><b class=\"W\">how many students<\/b> <b class=\"S\">there<\/b> <b class=\"X\">are<\/b> in your class.<button class=\"say\" data-say=\"9ed792619e\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">What time<\/b> <s class=\"gone\">does<\/s> <b class=\"S\">the store<\/b> <b class=\"V\">open<\/b>?<button class=\"say\" data-say=\"8d053a90f7\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Do you know <span class=\"rv\"><b class=\"W\">what time<\/b> <b class=\"S\">the store<\/b> <b class=\"V\">opens<\/b>?<button class=\"say\" data-say=\"60629ce313\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"W\">How old<\/b> <b class=\"X\">is<\/b> <b class=\"S\">your grandma<\/b>?<button class=\"say\" data-say=\"1a1201c676\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ May I ask <span class=\"rv\"><b class=\"W\">how old<\/b> <b class=\"S\">your grandma<\/b> <b class=\"X\">is<\/b>?<button class=\"say\" data-say=\"5237197cef\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"時態照原來的問句，未來就用 will","body":"\n<p>塞進去以後，<b>時態不要改<\/b>：原本是過去就用過去，原本是未來就留著 will。<\/p>\n<div class=\"ask\">When <b class=\"X\">will<\/b> Grandpa come back?<button class=\"say\" data-say=\"e2ed8222d5\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ I don't know <span class=\"rv\">when Grandpa <b class=\"X\">will come<\/b> back.（✓ 名詞子句的未來要用 will）<button class=\"say\" data-say=\"fa1cf9691c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<p class=\"tip\">小心不要和「when＝當…的時候」搞混：<b>When he comes back<\/b>, we will eat dinner.（這個 when 是「當…時」，用現在式代替未來）<\/p>"},{"h":"句尾是問號還是句號？","body":"\n<p>看<b>外面那個大句子<\/b>，不是看裡面的問句：<\/p>\n<table class=\"tb\"><tr><td>大句子是問句<\/td><td>Do you know where he is<b>?<\/b><button class=\"say\" data-say=\"192f441993\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>大句子是直述句<\/td><td>I don't know where he is<b>.<\/b><button class=\"say\" data-say=\"6ab0083281\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>大句子是祈使句<\/td><td>Please tell me where he is<b>.<\/b><button class=\"say\" data-say=\"78c923bf5d\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>"},{"h":"小結","body":"\n<div class=\"sum\"><div>① 問句塞進句子 → <b>疑問詞＋主詞＋動詞<\/b>（直述句順序）<\/div>\n<div>② be、can、will 搬到主詞後面<\/div>\n<div>③ do／does／did 拿掉，時態還給動詞（wants、went）<\/div>\n<div>④ who／what 當主詞 → 順序不動<\/div>\n<div>⑤ how many＋名詞、what time 整組搬；句尾標點看大句子<\/div><\/div>"}]},{"id":"ifw","emoji":"🚪","title":"if／whether 子句","en":"if / whether = 是否","color":"#2b8a3e","img":"img/ifw.webp","goal":"沒有疑問詞的問句也會塞，分得清 if 和 whether。","steps":[{"h":"沒有疑問詞的問句怎麼塞？","body":"\n<p>上一課的問句都有 what、where、how 當開頭。但有些問句只能回答 Yes／No：<\/p>\n<div class=\"big\">Is Amy at home?　Can you swim?　Did he call you?<button class=\"say\" data-say=\"02977d875a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<p>這種問句沒有疑問詞當「門牌」，塞進句子時就要<b>借一個門牌<\/b>：<b class=\"W\">if<\/b> 或 <b class=\"W\">whether<\/b>，意思是「<b>是否<\/b>」。<\/p>"},{"h":"三步驟：加門牌、改順序、脫帽子","body":"\n<ol class=\"steps3\"><li>前面加 <b class=\"W\">if／whether<\/b>（是否）<\/li><li>改成直述句順序：<b class=\"S\">主詞<\/b>＋<b class=\"V\">動詞<\/b><\/li><li>do／does／did 拿掉，時態還給動詞<\/li><\/ol>\n<div class=\"ask\"><b class=\"X\">Is<\/b> <b class=\"S\">Amy<\/b> at home?<button class=\"say\" data-say=\"6feb69391d\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ I don't know <span class=\"rv\"><b class=\"W\">if<\/b> <b class=\"S\">Amy<\/b> <b class=\"X\">is<\/b> at home.<button class=\"say\" data-say=\"e9e0aa7019\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><b class=\"X\">Can<\/b> <b class=\"S\">you<\/b> swim?<button class=\"say\" data-say=\"2a9e6738e3\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ The coach wants to know <span class=\"rv\"><b class=\"W\">whether<\/b> <b class=\"S\">you<\/b> <b class=\"X\">can<\/b> swim.<button class=\"say\" data-say=\"eb34358bc0\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\"><s class=\"gone\">Did<\/s> <b class=\"S\">he<\/b> <b class=\"V\">call<\/b> you?<button class=\"say\" data-say=\"bf9da32c6b\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ Mom asked <span class=\"rv\"><b class=\"W\">if<\/b> <b class=\"S\">he<\/b> <b class=\"V\">called<\/b> me.<button class=\"say\" data-say=\"d75f008c21\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"if 和 whether 大部分一樣，但有 4 個地方只能用 whether","body":"\n<table class=\"tb\"><tr><th>位置<\/th><th>例句<\/th><\/tr>\n<tr><td>① 後面緊接 <b>or not<\/b><\/td><td>I can't decide <b>whether or not<\/b> I should go.（✗ if or not）<button class=\"say\" data-say=\"a0398d8290\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>② 放在<b>句首<\/b>當主詞<\/td><td><b>Whether<\/b> we win or lose doesn't matter.<button class=\"say\" data-say=\"70d1f7ad23\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>③ 在<b>介系詞<\/b>後面<\/td><td>We talked <b>about whether<\/b> we should move.<button class=\"say\" data-say=\"725a4d17ff\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>④ 後面接 <b>to V<\/b><\/td><td>She doesn't know <b>whether to<\/b> laugh or cry.<button class=\"say\" data-say=\"16eeb42b20\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>\n<p class=\"tip\">記法：<b>whether 比較「大方」，哪裡都能去；if 只能乖乖待在動詞後面。<\/b> or not 放在句尾的話，if 也可以：I wonder if he likes it or not.<\/p>"},{"h":"大陷阱：兩種 if 長得一樣","body":"\n<table class=\"tb\"><tr><th><\/th><th>是否（名詞子句）<\/th><th>如果（條件句）<\/th><\/tr>\n<tr><td>位置<\/td><td>在 know／ask／wonder 後面，當受詞<\/td><td>前後是兩件事，表示條件<\/td><\/tr>\n<tr><td>未來時間<\/td><td>要用 <b>will<\/b><\/td><td>用<b>現在式<\/b>代替未來<\/td><\/tr>\n<tr><td>例句<\/td><td>I don't know if it <b>will rain<\/b> tomorrow.<br/>（我不知道明天是否會下雨）<button class=\"say\" data-say=\"4862584f06\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>If it <b>rains<\/b> tomorrow, we will stay home.<br/>（如果明天下雨，我們就待在家）<button class=\"say\" data-say=\"b7c9e621f2\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>\n<p class=\"tip\">判斷：把 if 換成「<b>是否<\/b>」唸得通 → 未來用 will；換成「<b>如果<\/b>」才通 → 用現在式。<\/p>"},{"h":"小結","body":"\n<div class=\"sum\"><div>① Yes／No 問句塞進句子 → 加 <b>if／whether<\/b>（是否）＋主詞＋動詞<\/div>\n<div>② do／does／did 一樣要脫帽子<\/div>\n<div>③ 只能用 whether：緊接 or not、句首當主詞、介系詞後、接 to V<\/div>\n<div>④「是否」的 if 未來用 will；「如果」的 if 用現在式<\/div><\/div>"}]},{"id":"np","emoji":"✂️","title":"名詞片語（疑問詞＋to V）","en":"wh- + to V","color":"#c2255c","img":"img/np.webp","goal":"會把子句瘦身成「疑問詞＋to V」，也會反過來還原。","steps":[{"h":"子句太長？幫它瘦身！","body":"\n<div class=\"big\">I don't know <b class=\"W\">what<\/b> <b class=\"S\">I<\/b> <b class=\"X\">should<\/b> <b class=\"V\">do<\/b>.<button class=\"say\" data-say=\"fcaa4de8a5\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<div class=\"big\">→ I don't know <b class=\"W\">what<\/b> <b class=\"V\">to do<\/b>.<button class=\"say\" data-say=\"6336629e4c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/div>\n<p>意思一樣：我不知道<b>該做什麼<\/b>。後面那句少了主詞、沒有 should，變成一個<b>名詞片語<\/b>。<\/p>"},{"h":"公式：疑問詞＋to＋原形動詞","body":"\n<div class=\"rule\"><div><b class=\"W\">疑問詞<\/b>＋<s class=\"gone\">主詞＋should／can<\/s>＋<b class=\"V\">to V<\/b><\/div><\/div>\n<table class=\"tb\"><tr><td><b>what to<\/b> eat　該吃什麼<button class=\"say\" data-say=\"dc8e7a05fb\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td><b>where to<\/b> go　該去哪裡<button class=\"say\" data-say=\"37efebd2ca\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td><b>how to<\/b> cook　怎麼煮<button class=\"say\" data-say=\"242a9e0cd1\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td><b>when to<\/b> leave　何時離開<button class=\"say\" data-say=\"6017608ae1\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td><b>which<\/b> shirt <b>to<\/b> buy　該買哪件<button class=\"say\" data-say=\"16ac6e69ba\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td><b>who to<\/b> ask　該問誰<button class=\"say\" data-say=\"aa79f8101a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td colspan=\"2\"><b>whether to<\/b> stay or go　是否該留下（接上一課：這裡只能用 whether）<button class=\"say\" data-say=\"accb1ebe87\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr><\/table>"},{"h":"什麼時候可以瘦身？","body":"\n<p>兩個條件都符合才行：<\/p>\n<ol class=\"steps3\"><li>子句裡的意思是「<b>應該／可以<\/b>」（should、can）。<\/li><li>子句的主詞就是<b>句子裡在講的那個人<\/b>（或泛指大家）。<\/li><\/ol>\n<div class=\"ask\">Can you show me how I can use this app?<button class=\"say\" data-say=\"b73d3e63bb\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ <span class=\"rv\">Can you show me <b>how to use<\/b> this app?（✓ 會用 app 的是 me）<button class=\"say\" data-say=\"7ad68ae414\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\">I don't know where Tom lives.<button class=\"say\" data-say=\"42f121dfc1\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ <span class=\"rv\">✗ 不能瘦身：沒有 should／can，而且住的人是 Tom 不是 I。<\/span><\/div>"},{"h":"陷阱一：how to do it vs. what to do","body":"\n<table class=\"tb\"><tr><td><b>what<\/b> to do<button class=\"say\" data-say=\"4a89f88f70\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>what 自己就是 do 的受詞（做「什麼」）→ 後面<b>不能再加 it<\/b><\/td><\/tr>\n<tr><td><b>how<\/b> to do <b>it<\/b><button class=\"say\" data-say=\"60a31f7ed2\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>how 只是「方法」，do 還缺受詞 → 要<b>加 it<\/b>（或別的名詞）<\/td><\/tr><\/table>\n<div class=\"ask\">Can you teach me how to fix ___? <span class=\"rv\">→ 要補受詞：how to fix <b>it<\/b>／how to fix <b>the bike<\/b><\/span><\/div>\n<div class=\"ask\">I don't know what to say ___. <span class=\"rv\">→ 不用補：what to say 就完整了（✗ what to say it）<button class=\"say\" data-say=\"eb903cebf7\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"陷阱二：why 不能瘦身","body":"\n<p>✗ I don't know <b>why to<\/b> study history.<\/p>\n<p>✓ I don't know <b>why I should<\/b> study history.<\/p>\n<p class=\"tip\">why 後面要保留完整子句。其他 what、where、when、how、which、who、whether 都可以接 to V。<\/p>"},{"h":"雙向練習：瘦身 ⇄ 還原","body":"\n<div class=\"ask\">We are discussing where we should hold the party.<button class=\"say\" data-say=\"1676751675\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ <span class=\"rv\">We are discussing <b>where to hold<\/b> the party.<button class=\"say\" data-say=\"90dce05bd1\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\">Please tell me which bus to take.<button class=\"say\" data-say=\"c479e5e3cc\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ <span class=\"rv\">Please tell me <b>which bus I should take<\/b>.<button class=\"say\" data-say=\"851cf74ecb\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>\n<div class=\"ask\">She asked me when she should start.<button class=\"say\" data-say=\"1a17bfc8ed\" title=\"播放發音\" type=\"button\">🔊<\/button><br/>→ <span class=\"rv\">She asked me <b>when to start<\/b>.<button class=\"say\" data-say=\"202c19c713\" title=\"播放發音\" type=\"button\">🔊<\/button><\/span><\/div>"},{"h":"小結：三兄弟一起看","body":"\n<table class=\"tb\"><tr><th>原本的問句<\/th><th>塞進句子（子句）<\/th><th>瘦身（片語）<\/th><\/tr>\n<tr><td>Where should I go?<button class=\"say\" data-say=\"a98a163a3c\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I don't know <b>where I should go<\/b>.<button class=\"say\" data-say=\"17c6b629b1\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I don't know <b>where to go<\/b>.<button class=\"say\" data-say=\"99cb31b27f\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>Should I buy it?<button class=\"say\" data-say=\"857bef2006\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I don't know <b>whether I should buy<\/b> it.<button class=\"say\" data-say=\"0165d462b3\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I don't know <b>whether to buy<\/b> it.<button class=\"say\" data-say=\"510970586a\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><\/tr>\n<tr><td>Where does she live?<button class=\"say\" data-say=\"47b334df15\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>I don't know <b>where she lives<\/b>.<button class=\"say\" data-say=\"70bf7349ca\" title=\"播放發音\" type=\"button\">🔊<\/button><\/td><td>（不能瘦身）<\/td><\/tr><\/table>\n<div class=\"sum\"><div>① 疑問詞＋to＋原形，意思是「該…／怎麼…」<\/div><div>② 要有 should／can 的意思、主詞是句中那個人才能瘦身<\/div><div>③ how to do it 要受詞；what to do 不再加 it<\/div><div>④ why 不能接 to V<\/div><\/div>"}]}];
const ROUNDS = [[{"t":"mc","g":"emo","q":"The math problem was so ___ that nobody in our class could solve it.","o":["confused","confusing","confuse","confuses"],"a":1,"ex":"題目「讓人」困惑 → 給感覺用 -ing：confusing。","say":"6a9625c35b"},{"t":"mc","g":"emo","q":"Grandpa was ___ at the price of the new phone.","o":["surprised","surprising","surprise","surprises"],"a":0,"ex":"爺爺自己「感到」驚訝 → -ed；be surprised at 對…感到驚訝。","say":"8d5234ef36"},{"t":"mc","g":"tag","q":"Your sister plays the violin, ___?","o":["isn't she","does she","didn't she","doesn't she"],"a":3,"ex":"plays 是一般動詞現在式第三人稱 → 分身用 does；前肯後否 → doesn't she。","say":"4cfb3e4578"},{"t":"mc","g":"tag","q":"Peter has to clean his room today, ___?","o":["hasn't he","has he","doesn't he","isn't he"],"a":2,"ex":"has to 的 has 是一般動詞（必須），不是完成式 → 用 does：doesn't he。","say":"d9cd41112e"},{"t":"mc","g":"wh","q":"Could you tell me ___?","o":["where is the nearest MRT station","where the nearest MRT station is","where does the nearest MRT station","the nearest MRT station is where"],"a":1,"ex":"問句塞進句子 → 疑問詞＋主詞＋動詞：where the nearest MRT station is。","say":"c069fcb8aa"},{"t":"mc","g":"wh","q":"I wonder ___ ate my sandwich. It was on the table a minute ago.","o":["who","when","how","where"],"a":0,"ex":"「誰」吃了三明治 → who。who 自己是主詞，後面直接接動詞 ate。","say":"8b285795b5"},{"t":"mc","g":"ifw","q":"I'm not sure ___ Jenny will come to the party. She hasn't answered my message.","o":["that","what","which","whether"],"a":3,"ex":"不確定「是否」會來 → whether（也可用 if）。","say":"6ae5231c68"},{"t":"mc","g":"ifw","q":"Do you know if it ___ sunny this weekend? If it ___ sunny, we'll go hiking.","o":["is; will be","will be; will be","will be; is","is; is"],"a":2,"ex":"第一格 if＝是否（名詞子句）→ 未來用 will be；第二格 If＝如果（條件句）→ 用現在式 is 代替未來。","say":"f5cd4bbc30"},{"t":"mc","g":"np","q":"This machine looks strange. Can you show me how to ___?","o":["use","use it","using it","used"],"a":1,"ex":"how 只是「方法」，use 還缺受詞 → how to use it。","say":"a4a57e635f"},{"t":"fill","g":"emo","q":"We were all ______ (excite) about the school trip to Kenting.","ans":["excited"],"o":["excited","exciting","excite","excites"],"a":0,"ex":"我們自己「感到」興奮 → excited；be excited about 對…感到興奮。","say":"42474fa3f2"},{"t":"fill","g":"tag","q":"There are some cookies in the box, ______?","ans":["aren't there"],"o":["aren't they","aren't there","are there","isn't it"],"a":1,"ex":"There are … → 尾巴用 there；前肯後否 → aren't there。","say":"e1eb9d36e7"},{"t":"fill","g":"tag","q":"Lily seldom watches TV, ______?","ans":["does she"],"o":["doesn't she","is she","does she","isn't she"],"a":2,"ex":"seldom（很少）算否定 → 尾巴用肯定；watches 用 does → does she。","say":"1b6912db6a"},{"t":"fill","g":"wh","q":"Do you remember what time the movie ______ (start) last night?","ans":["started"],"o":["starts","did start","will start","started"],"a":3,"ex":"last night 是過去 → started。名詞子句裡不用 did，時態直接放在動詞上。","say":"bec51c28df"},{"t":"rw","g":"wh","q":"合併：Where does Mr. Lin live? ＋ I don't know.　→ I don't know ______.","ans":["where Mr. Lin lives"],"o":["where Mr. Lin lives","where does Mr. Lin live","where Mr. Lin live","where lives Mr. Lin"],"a":0,"ex":"does 拿掉，-s 還給 live → where Mr. Lin lives。","say":"d38085a545"},{"t":"rw","g":"wh","q":"合併：How much did your bike cost? ＋ Can you tell me …?　→ Can you tell me ______?","ans":["how much your bike cost"],"o":["how much did your bike cost","how much your bike cost","how much your bike costs","how much cost your bike"],"a":1,"ex":"did 拿掉，過去式還給動詞。cost 的過去式還是 cost → how much your bike cost。","say":"54da250f13"},{"t":"rw","g":"ifw","q":"合併：Is the museum open on Mondays? ＋ Please check …　→ Please check ______.","ans":["if the museum is open on Mondays","whether the museum is open on Mondays"],"o":["if is the museum open on Mondays","the museum is open on Mondays if","if the museum is open on Mondays","what the museum is open on Mondays"],"a":2,"ex":"Yes／No 問句 → 加 if／whether，改成主詞＋動詞：if the museum is open on Mondays。","say":"43ee814c89"},{"t":"rw","g":"np","q":"改寫：I don't know what I should say to her.　→ I don't know ______ to her.","ans":["what to say"],"o":["what to say it","what should I say","how to say","what to say"],"a":3,"ex":"疑問詞＋S＋should＋V → 疑問詞＋to V：what to say（what 已經是受詞，不加 it）。","say":"cdef9b75dc"},{"t":"ord","g":"wh","q":"重組：你知道艾咪今天為什麼遲到嗎？","tiles":["Do","you","know","why","Amy","was","late","today?"],"o":["Do you know why Amy was late today?","Do you know why was Amy late today?","Do you know Amy why was late today?","Do you know why did Amy late today?"],"a":0,"ex":"Do you know＋why＋主詞 Amy＋動詞 was。","say":"95a24d0692"},{"t":"ord","g":"ifw","q":"重組：我想知道他到底喜不喜歡辣的食物。","tiles":["I","wonder","whether","or","not","he","likes","spicy","food."],"alt":[["I","wonder","whether","he","likes","spicy","food","or","not."]],"o":["I wonder if or not he likes spicy food.","I wonder whether or not he likes spicy food.","I wonder whether does he like spicy food or not.","I wonder or not whether he likes spicy food."],"a":1,"ex":"whether or not 可以連在一起（if 不行）；or not 也可放句尾。","say":"0c619169c6"},{"t":"ord","g":"np","q":"重組：她無法決定要穿哪一件洋裝。","tiles":["She","can't","decide","which","dress","to","wear."],"o":["She can't decide which to wear dress.","She can't decide to wear which dress.","She can't decide which dress to wear.","She can't decide which dress should wear."],"a":2,"ex":"which＋名詞要整組一起：which dress＋to wear。","say":"6b8ff50719"}],[{"t":"mc","g":"emo","q":"Kevin is a ___ speaker. Everyone falls asleep during his talks.","o":["boring","bored","bore","bores"],"a":0,"ex":"大家聽他講話覺得無聊 → 他「給」人無聊的感覺 → boring。人也可以用 -ing！","say":"151e32b3cb"},{"t":"mc","g":"emo","q":"The kids are tired ___ playing the same game every day.","o":["in","at","to","of"],"a":3,"ex":"be tired of＋V-ing：厭倦做…。","say":"bf2110b173"},{"t":"mc","g":"tag","q":"You have finished your report, ___?","o":["don't you","didn't you","haven't you","have you"],"a":2,"ex":"have finished 是現在完成式，have 是助動詞 → haven't you。","say":"e05447c22d"},{"t":"mc","g":"tag","q":"Let's order pizza tonight, ___?","o":["will you","shall we","don't we","won't we"],"a":1,"ex":"Let's … → 固定用 shall we。","say":"3ccca96770"},{"t":"mc","g":"wh","q":"Nobody knows ___.","o":["what happened to the old man","what did happen to the old man","what was happened to the old man","what does happen the old man"],"a":0,"ex":"what 自己是主詞 → 直接接動詞 happened，不加 did。","say":"4708574f71"},{"t":"mc","g":"wh","q":"I can't find my keys. Do you know ___ them?","o":["where did I put","where put I","where do I put","where I put"],"a":3,"ex":"名詞子句要直述句順序：where＋I＋put（put 的過去式也是 put）。","say":"952a6a732b"},{"t":"mc","g":"ifw","q":"___ we take the bus or the MRT doesn't matter. Both are fast.","o":["If","That","Whether","What"],"a":2,"ex":"放句首當主詞的「是否」只能用 whether。","say":"b253956330"},{"t":"mc","g":"ifw","q":"Ask your mom ___ you can stay at my house tonight.","o":["that","if","what","which"],"a":1,"ex":"問媽媽「是否」可以 → if（也可用 whether）。","say":"02a3e1d8d4"},{"t":"mc","g":"np","q":"I have no idea ___ for Dad's birthday. Do you have any ideas?","o":["what to buy","what to buy it","how to buy","why to buy"],"a":0,"ex":"買「什麼」→ what to buy；what 已是受詞不加 it；why 不能接 to V。","say":"9139e028ee"},{"t":"fill","g":"emo","q":"The ending of the movie was really ______ (touch). I cried a lot.","ans":["touching"],"o":["touching","touched","touch","touches"],"a":0,"ex":"電影結局「令人」感動 → touching。","say":"b49d5b728b"},{"t":"fill","g":"tag","q":"Close the window, ______?","ans":["will you"],"o":["do you","will you","shall we","don't you"],"a":1,"ex":"祈使句（叫別人做事）→ will you。","say":"ddaac08412"},{"t":"fill","g":"tag","q":"Nobody was in the classroom, ______?","ans":["were they"],"o":["wasn't he","was he","were they","weren't they"],"a":2,"ex":"nobody 是否定 → 尾巴用肯定；nobody 的代名詞用 they → were they。","say":"04e60e7faf"},{"t":"fill","g":"wh","q":"Please tell me how many students ______ (be) absent yesterday.","ans":["were"],"o":["are","was","be","were"],"a":3,"ex":"yesterday 是過去、students 是複數 → were。","say":"5cc80a2649"},{"t":"rw","g":"wh","q":"合併：Who wrote this song? ＋ I want to know …　→ I want to know ______.","ans":["who wrote this song"],"o":["who wrote this song","who did write this song","who this song wrote","who did this song write"],"a":0,"ex":"who 是主詞，順序不動 → who wrote this song。","say":"41e5cc4d2b"},{"t":"rw","g":"wh","q":"合併：When will the concert begin? ＋ Do you know …?　→ Do you know ______?","ans":["when the concert will begin"],"o":["when will the concert begin","when the concert will begin","when the concert begins will","when does the concert begin"],"a":1,"ex":"will 搬到主詞後面；名詞子句的未來保留 will。","say":"1ae508d106"},{"t":"rw","g":"ifw","q":"合併：Did Ben finish his homework? ＋ The teacher asked …　→ The teacher asked ______.","ans":["if Ben finished his homework","whether Ben finished his homework","if Ben had finished his homework","whether Ben had finished his homework"],"o":["if did Ben finish his homework","that Ben finished his homework","if Ben finished his homework","Ben if finished his homework"],"a":2,"ex":"加 if／whether，did 拿掉、過去式還給 finish → if Ben finished his homework。","say":"89de8f2dc1"},{"t":"rw","g":"np","q":"改寫：Can you tell me where I should get off the bus?　→ Can you tell me ______ the bus?","ans":["where to get off"],"o":["where should I get off","where get off","where to getting off","where to get off"],"a":3,"ex":"where I should get off → where to get off。","say":"188e0bf152"},{"t":"ord","g":"wh","q":"重組：我不知道他的電話號碼是幾號。","tiles":["I","have","no","idea","what","his","phone","number","is."],"o":["I have no idea what is his phone number.","I have no idea his phone number what is.","I have no idea what does his phone number.","I have no idea what his phone number is."],"a":3,"ex":"what＋主詞 his phone number＋be 動詞 is。","say":"8243b56247"},{"t":"ord","g":"ifw","q":"重組：我們會不會去露營還是個問題。","tiles":["Whether","we","will","go","camping","is","still","a","question."],"o":["Whether we will go camping is still a question.","If we will go camping is still a question.","Whether will we go camping is still a question.","Whether we go camping will is still a question."],"a":0,"ex":"句首當主詞只能用 whether，後面接主詞＋動詞。","say":"4d8cfe380d"},{"t":"ord","g":"np","q":"重組：你可以教我怎麼包水餃嗎？","tiles":["Could","you","teach","me","how","to","make","dumplings?"],"o":["Could you teach me how make dumplings?","Could you teach me how to make dumplings?","Could you teach me to make how dumplings?","Could you teach me how to making dumplings?"],"a":1,"ex":"how＋to＋原形動詞 make。","say":"9bf30e54e8"}],[{"t":"mc","g":"emo","q":"Look at the ___ look on Tim's face. He didn't know about the party.","o":["surprising","surprise","surprises","surprised"],"a":3,"ex":"表情是 Tim 自己的感覺露出來 → a surprised look。","say":"415aebc8b2"},{"t":"mc","g":"emo","q":"Reading comic books is never ___ to me. I can read them all day.","o":["bored","boredom","boring","bore"],"a":2,"ex":"看漫畫這件事「讓我」無聊 → 東西＋be＋-ing＋to＋人：boring to me。","say":"dff9d0b62b"},{"t":"mc","g":"tag","q":"There's little water in the bottle, ___?","o":["isn't there","is there","isn't it","is it"],"a":1,"ex":"little（幾乎沒有）算否定 → 尾巴用肯定；There's → there：is there。","say":"1717ce2c33"},{"t":"mc","g":"tag","q":"Mary and Joe went to the night market last night, ___?","o":["didn't they","weren't they","don't they","did they"],"a":0,"ex":"went 是一般動詞過去式 → 分身 did；前肯後否 → didn't they。","say":"05db8dcf85"},{"t":"mc","g":"wh","q":"Mom asked me ___ this morning.","o":["what time did I get up","what time got I up","what time do I get up","what time I got up"],"a":3,"ex":"直述句順序＋過去時態 → what time I got up。","say":"8bd0679a4b"},{"t":"mc","g":"wh","q":"A: Do you know ___ the boy in the red cap is?　B: He's my cousin, Leo.","o":["what","where","who","how"],"a":2,"ex":"回答是「他是誰」→ who。","say":"b5524d8d27"},{"t":"mc","g":"ifw","q":"I don't know whether ___.","o":["is he a doctor or not","he is a doctor or not","or not he is a doctor","does he a doctor"],"a":1,"ex":"whether＋主詞＋動詞，or not 放句尾 → whether he is a doctor or not。","say":"d796607069"},{"t":"mc","g":"ifw","q":"We are talking about ___ we should move to Taipei.","o":["whether","if","that","what"],"a":0,"ex":"介系詞 about 後面的「是否」只能用 whether。","say":"83e6217519"},{"t":"mc","g":"np","q":"The kids didn't know ___ to go after school, so they just stayed in the classroom.","o":["what","why","who","where"],"a":3,"ex":"不知道該「去哪裡」→ where to go；why 不能接 to V。","say":"3c91f4a81c"},{"t":"fill","g":"emo","q":"Are you interested ______ joining the dance club?","ans":["in"],"o":["in","at","on","of"],"a":0,"ex":"be interested in＋V-ing：對…有興趣。","say":"2556aa57a4"},{"t":"fill","g":"tag","q":"Your dog has to stay outside, ______?","ans":["doesn't it"],"o":["hasn't it","doesn't it","isn't it","does it"],"a":1,"ex":"has to 的 has 是一般動詞 → doesn't；dog 用 it。","say":"63a70ed652"},{"t":"fill","g":"tag","q":"I think Sam is right, ______?","ans":["isn't he"],"o":["don't I","doesn't he","isn't he","is he"],"a":2,"ex":"I think＋子句 → 尾巴跟著後面子句（Sam is）→ isn't he。","say":"0e5b6e1fb7"},{"t":"fill","g":"wh","q":"I wonder when Grandma ______ (visit) us next week.","ans":["will visit","is going to visit"],"o":["visits","visited","does visit","will visit"],"a":3,"ex":"next week 是未來；名詞子句的未來要用 will → will visit。","say":"cdd26db429"},{"t":"rw","g":"wh","q":"合併：What does this word mean? ＋ Can you tell me …?　→ Can you tell me ______?","ans":["what this word means"],"o":["what this word means","what does this word mean","what this word mean","what means this word"],"a":0,"ex":"does 拿掉，-s 還給 mean → what this word means。","say":"1e10103290"},{"t":"rw","g":"wh","q":"合併：Why were you angry? ＋ I don't understand …　→ I don't understand ______.","ans":["why you were angry"],"o":["why were you angry","why you were angry","why you are angry","why did you angry"],"a":1,"ex":"be 動詞搬到主詞後面，時態不變 → why you were angry。","say":"5b7590dc68"},{"t":"rw","g":"ifw","q":"合併：Will it snow on Hehuan Mountain tomorrow? ＋ I wonder …　→ I wonder ______.","ans":["if it will snow on Hehuan Mountain tomorrow","whether it will snow on Hehuan Mountain tomorrow"],"o":["if it snows on Hehuan Mountain tomorrow","if will it snow on Hehuan Mountain tomorrow","if it will snow on Hehuan Mountain tomorrow","that it will snow on Hehuan Mountain tomorrow"],"a":2,"ex":"「是否」的 if，未來要保留 will → if it will snow …。","say":"780ad4253a"},{"t":"rw","g":"np","q":"還原：I don't know how to answer this question.　→ I don't know ______ this question.","ans":["how I should answer","how I can answer"],"o":["how should I answer","how I answer should","how I should to answer","how I should answer"],"a":3,"ex":"how to answer ＝ how I should answer（直述句順序：主詞 I＋should）。","say":"db83a0cb02"},{"t":"ord","g":"wh","q":"重組：你可以告訴我火車站有多遠嗎？","tiles":["Can","you","tell","me","how","far","the","train","station","is?"],"o":["Can you tell me how far is the train station?","Can you tell me how the train station is far?","Can you tell me how far the train station is?","Can you tell me far how the train station is?"],"a":2,"ex":"how far 整組一起搬，後面主詞＋is。","say":"52d164db12"},{"t":"ord","g":"ifw","q":"重組：請問 Kevin 是否需要任何幫忙。","tiles":["Please","ask","Kevin","if","he","needs","any","help."],"o":["Please ask Kevin if does he need any help.","Please ask Kevin he needs if any help.","Please ask Kevin that he needs any help.","Please ask Kevin if he needs any help."],"a":3,"ex":"if＋主詞 he＋動詞 needs（does 拿掉，-s 還給 need）。","say":"df26fcc3ab"},{"t":"ord","g":"np","q":"重組：我們還沒決定什麼時候開會。","tiles":["We","haven't","decided","when","to","start","the","meeting."],"o":["We haven't decided when to start the meeting.","We haven't decided to start when the meeting.","We haven't decided when start the meeting.","We haven't decided when should start the meeting."],"a":0,"ex":"when＋to＋原形 start。","say":"48108183ae"}],[{"t":"mc","g":"emo","q":"Everyone was ___ with the dinner. The food was great.","o":["satisfying","satisfy","satisfied","satisfaction"],"a":2,"ex":"大家「感到」滿意 → be satisfied with。","say":"30f2c8b633"},{"t":"mc","g":"emo","q":"The ghost house was so ___ that my little brother screamed.","o":["frightened","frightening","frighten","frightens"],"a":1,"ex":"鬼屋「讓人」害怕 → frightening。","say":"75a0d056af"},{"t":"mc","g":"tag","q":"Cooking for the whole family is hard work, ___?","o":["isn't it","isn't cooking","doesn't it","is it"],"a":0,"ex":"動名詞片語當主詞 → 代名詞用 it；is → isn't it。","say":"d40f1f41cc"},{"t":"mc","g":"tag","q":"A: Ann can't swim, can she?　B: ___ She learned last summer and swims very well now.","o":["No, she can't.","Yes, she can't.","No, she can.","Yes, she can."],"a":3,"ex":"事實是她「會」游 → Yes, she can.（回答只看事實，Yes 配肯定）","say":"1b213c96f7"},{"t":"mc","g":"wh","q":"I don't know ___. Let's ask the teacher.","o":["what does \"unique\" mean","what means \"unique\"","what \"unique\" means","\"unique\" what means"],"a":2,"ex":"does 拿掉，-s 還給 mean → what \"unique\" means。","say":"d68ddfce79"},{"t":"mc","g":"wh","q":"Do you know ___ she bought those shoes? They're so cheap!","o":["who","where","what","which"],"a":1,"ex":"問在「哪裡」買的 → where；who、what 在這裡意思不通。","say":"da7baf3cb2"},{"t":"mc","g":"ifw","q":"I'm not sure if Dad ___ home early tonight. If he ___ early, we can play games together.","o":["will come; comes","comes; will come","will come; will come","came; comes"],"a":0,"ex":"第一個 if＝是否 → will come；第二個 If＝如果 → 現在式 comes。","say":"7e8f0e02c8"},{"t":"mc","g":"ifw","q":"The question is ___ we have enough money for the trip.","o":["what","who","where","whether"],"a":3,"ex":"問題在於「是否」有足夠的錢 → whether。","say":"a3243b3257"},{"t":"mc","g":"np","q":"A: I'm lost.　B: Don't worry. I'll tell you ___.","o":["where should you go","where to go it","where to go","why to go"],"a":2,"ex":"where to go；選項 B 是問句順序，名詞片語裡不能用。","say":"b877c24df4"},{"t":"fill","g":"emo","q":"Mom was ______ (worry) about me because I came home late.","ans":["worried"],"o":["worried","worrying","worry","worries"],"a":0,"ex":"媽媽自己「感到」擔心 → be worried about。","say":"67a90b43f5"},{"t":"fill","g":"tag","q":"Let's sing a song together, ______?","ans":["shall we"],"o":["will you","shall we","don't we","do we"],"a":1,"ex":"Let's … → shall we。","say":"194dba0534"},{"t":"fill","g":"tag","q":"Those are your new shoes, ______?","ans":["aren't they"],"o":["aren't those","isn't it","aren't they","are they"],"a":2,"ex":"those 的代名詞用 they；前肯後否 → aren't they。","say":"204e075758"},{"t":"fill","g":"wh","q":"Can you tell me who ______ (break) the window yesterday?","ans":["broke"],"o":["did break","breaks","broken","broke"],"a":3,"ex":"who 是主詞，直接接過去式 broke（不加 did）。","say":"a1090e157d"},{"t":"rw","g":"wh","q":"合併：How old is your little sister? ＋ May I ask …?　→ May I ask ______?","ans":["how old your little sister is"],"o":["how old your little sister is","how old is your little sister","how your little sister is old","how old does your little sister"],"a":0,"ex":"how old 整組搬，主詞＋is 放後面。","say":"b1f5e21c2f"},{"t":"rw","g":"wh","q":"合併：Where did Jason go last weekend? ＋ I wonder …　→ I wonder ______.","ans":["where Jason went last weekend"],"o":["where did Jason go last weekend","where Jason went last weekend","where Jason go last weekend","where Jason goes last weekend"],"a":1,"ex":"did 拿掉，過去式還給 go → went。","say":"1dab69ea82"},{"t":"rw","g":"ifw","q":"合併：Does Cindy like cats? ＋ I don't know.　→ I don't know ______.","ans":["if Cindy likes cats","whether Cindy likes cats","whether or not Cindy likes cats","if Cindy likes cats or not","whether Cindy likes cats or not"],"o":["if does Cindy like cats","if Cindy like cats","if Cindy likes cats","Cindy likes cats if"],"a":2,"ex":"加 if，does 拿掉、-s 還給 like → if Cindy likes cats。","say":"62f55e01f2"},{"t":"rw","g":"np","q":"還原：Please tell me which bus to take.　→ Please tell me ______.","ans":["which bus I should take","which bus I can take"],"o":["which bus should I take","which I should take bus","which bus I should to take","which bus I should take"],"a":3,"ex":"which bus to take → which bus I should take（直述句順序）。","say":"851cf74ecb"},{"t":"ord","g":"wh","q":"重組：你知道圖書館幾點關門嗎？","tiles":["Do","you","know","what","time","the","library","closes?"],"o":["Do you know what time does the library close?","Do you know what time the library closes?","Do you know the library what time closes?","Do you know what the library time closes?"],"a":1,"ex":"what time 整組搬；does 拿掉，-s 還給 close。","say":"a4b192d47e"},{"t":"ord","g":"ifw","q":"重組：我不確定該留下來還是離開。","tiles":["I'm","not","sure","whether","to","stay","or","leave."],"alt":[["I'm","not","sure","whether","to","leave","or","stay."]],"o":["I'm not sure if to stay or leave.","I'm not sure to stay whether or leave.","I'm not sure whether to stay or leave.","I'm not sure whether stay or leave."],"a":2,"ex":"「是否該…」用 whether to V；if 不能接 to V。","say":"bd2838044f"},{"t":"ord","g":"np","q":"重組：沒有人告訴我們接下來該做什麼。","tiles":["Nobody","told","us","what","to","do","next."],"o":["Nobody told us what to do it next.","Nobody told us to do what next.","Nobody told us what should do next.","Nobody told us what to do next."],"a":3,"ex":"what to do（what 已是受詞，不加 it）。","say":"c50d721000"}],[{"t":"mc","g":"emo","q":"The news is ___. Let's tell everyone in our class!","o":["amazed","amazing","amaze","amazes"],"a":1,"ex":"消息「令人」驚奇 → amazing。","say":"e7693cfa08"},{"t":"mc","g":"emo","q":"Jenny was ___ in her brother because he broke his promise.","o":["disappointed","disappointing","disappoint","disappointment"],"a":0,"ex":"Jenny 自己「感到」失望 → be disappointed in。","say":"149887195e"},{"t":"mc","g":"tag","q":"No one called me this morning, ___?","o":["didn't they","did he","didn't he","did they"],"a":3,"ex":"no one 是否定 → 尾巴用肯定；代名詞用 they → did they。","say":"a7fc2e2b96"},{"t":"mc","g":"tag","q":"The bridge was built 100 years ago, ___?","o":["didn't it","isn't it","wasn't it","was it"],"a":2,"ex":"was built 是過去被動，助動詞是 was → wasn't it。","say":"0bbf1ededc"},{"t":"mc","g":"wh","q":"Do you know ___?","o":["how many people are there in your family","how many people there are in your family","how many are there people in your family","there are how many people in your family"],"a":1,"ex":"how many people 整組搬，後面是 there are（直述句順序）。","say":"eb7a5e87fe"},{"t":"mc","g":"wh","q":"I can't remember ___ I met that girl. Was it at the park or at school?","o":["where","who","what","which"],"a":0,"ex":"後面問「在公園還是學校」→ 地點 → where。","say":"587dc1bf50"},{"t":"mc","g":"ifw","q":"I wonder ___ he will come or not.","o":["if","whether","Both A and B are correct.","that"],"a":2,"ex":"or not 放在句尾時，if 和 whether 都可以；緊接在後面（whether or not）才只能用 whether。","say":"f520c792fc"},{"t":"mc","g":"ifw","q":"We don't know ___ to laugh or cry.","o":["if","what","that","whether"],"a":3,"ex":"後面接 to V 的「是否」只能用 whether。","say":"b658090bb7"},{"t":"mc","g":"np","q":"There are so many books here. I don't know which ___.","o":["to read it","I read it","one to read","reading"],"a":2,"ex":"which one to read：疑問詞＋名詞＋to V；read 的受詞就是 which one，不加 it。","say":"b611cd05a8"},{"t":"fill","g":"emo","q":"The long walk was ______ (tire). My legs hurt.","ans":["tiring"],"o":["tiring","tired","tire","tires"],"a":0,"ex":"這段路「讓人」疲累 → tiring。","say":"6efb098bd9"},{"t":"fill","g":"tag","q":"You've never been to Japan, ______?","ans":["have you"],"o":["haven't you","have you","did you","do you"],"a":1,"ex":"never 算否定 → 尾巴用肯定；You've＝You have（完成式）→ have you。","say":"699a7bf2a6"},{"t":"fill","g":"tag","q":"Everyone likes the new teacher, ______?","ans":["don't they"],"o":["doesn't he","doesn't everyone","don't they","do they"],"a":2,"ex":"everyone 的代名詞用 they；likes 用 do 家族，配 they 用 don't → don't they。","say":"900f790659"},{"t":"fill","g":"wh","q":"Do you know where Mike ______ (go) every Sunday morning?","ans":["goes"],"o":["go","does go","went","goes"],"a":3,"ex":"every Sunday 是習慣（現在式），Mike 第三人稱 → goes。","say":"a91f1a14cd"},{"t":"rw","g":"wh","q":"合併：What happened to your arm? ＋ Tell me …　→ Tell me ______.","ans":["what happened to your arm"],"o":["what happened to your arm","what did happen to your arm","what your arm happened","what happens your arm"],"a":0,"ex":"what 是主詞，順序不動 → what happened to your arm。","say":"6e0059cca0"},{"t":"rw","g":"wh","q":"合併：Which team won the game? ＋ Do you know …?　→ Do you know ______?","ans":["which team won the game"],"o":["which team did win the game","which team won the game","which the game team won","which team wins the game did"],"a":1,"ex":"which team 是主詞，直接接動詞 won。","say":"ffe08c3044"},{"t":"rw","g":"ifw","q":"合併：Can I borrow your pen? ＋ I wonder …　→ I wonder ______.","ans":["if I can borrow your pen","whether I can borrow your pen"],"o":["if can I borrow your pen","that I can borrow your pen","if I can borrow your pen","if I borrow can your pen"],"a":2,"ex":"加 if，can 搬到主詞後面 → if I can borrow your pen。","say":"6c0417035e"},{"t":"rw","g":"np","q":"改寫：We don't know who we should invite.　→ We don't know ______.","ans":["who to invite","whom to invite"],"o":["who should we invite","who to invite them","to invite who","who to invite"],"a":3,"ex":"who we should invite → who（whom）to invite。","say":"feb3b275b8"},{"t":"ord","g":"wh","q":"重組：我想知道寶寶為什麼在哭。","tiles":["I","wonder","why","the","baby","is","crying."],"o":["I wonder why the baby is crying.","I wonder why is the baby crying.","I wonder the baby why is crying.","I wonder why does the baby crying."],"a":0,"ex":"why＋主詞 the baby＋is crying。","say":"8e1e5dccad"},{"t":"ord","g":"ifw","q":"重組：讓我看看那家店有沒有開。","tiles":["Let","me","check","if","the","store","is","open."],"o":["Let me check if is the store open.","Let me check if the store is open.","Let me check the store if is open.","Let me check that the store is open."],"a":1,"ex":"if＋主詞 the store＋is。","say":"ee349e126e"},{"t":"ord","g":"np","q":"重組：你知道怎麼彈吉他嗎？","tiles":["Do","you","know","how","to","play","the","guitar?"],"o":["Do you know to play how the guitar?","Do you know how play the guitar?","Do you know how to play the guitar?","Do you know how to playing the guitar?"],"a":2,"ex":"how＋to＋原形 play。","say":"a2aa93c903"}]];
</script>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const G={emo:["情緒動詞","#e8590c"],tag:["附加問句","#7048e8"],wh:["名詞子句","#1971c2"],ifw:["if／whether","#2b8a3e"],np:["名詞片語","#c2255c"]};
const T={mc:"一、選擇題",fill:"二、填空題（依提示寫出正確答案）",rw:"三、句子改寫（在空格寫出答案）",ord:"四、句子重組（依序點字卡）"};
const KEY="jh9grammar_v1";
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(KEY+"_"+k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+"_"+k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ").replace(/\s*([?.!,])/g,"$1").replace(/[.?!]+$/,"").trim();
const LETTERS="ABCD";
const tch=()=>/[?&]teacher\b/.test(location.search)||document.documentElement.classList.contains("bw-tch");

/* 字體大小（存在這台裝置） */
function setFs(px){px=Math.max(16,Math.min(34,px));document.documentElement.style.setProperty("--fs",px+"px");LS.set("fs",px)}
const savedFs=LS.get("fs",0); if(savedFs) setFs(savedFs);
if(LS.get("proj",false)) document.documentElement.classList.add("proj");

/* 📒 錯題本：答錯收進來、之後答對就拿掉（藍鯨 efetl 也會包住 WB.hit／miss，記到帳號的學習紀錄） */
window.WB={
  miss(kind,q,title){const w=LS.get("wrong",[]);if(!w.some(x=>x.q===q.q))w.push({q:q.q,r:q.__r,i:q.__i});LS.set("wrong",w)},
  hit(kind,q){LS.set("wrong",LS.get("wrong",[]).filter(x=>x.q!==q.q))},
  count(){return LS.get("wrong",[]).length}
};
ROUNDS.forEach((r,ri)=>r.forEach((q,qi)=>{Object.defineProperty(q,"__r",{value:ri});Object.defineProperty(q,"__i",{value:qi})}));
const byQ=new Map();ROUNDS.forEach(r=>r.forEach(q=>byQ.set(q.q,q)));

/* ---------- 路由 ---------- */
function go(h){location.hash=h}
window.addEventListener("hashchange",render);
function topbar(back){
  return `<header class="top noprint"><a class="home" href="/english/">📚 英文選單</a>${back?`<button class="home" onclick="go('')">← 回首頁</button>`:""}<span class="sp"></span>
  <button class="tb-btn" onclick="setFs(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))-2)" aria-label="字體縮小">A−</button>
  <button class="tb-btn" onclick="setFs(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))+2)" aria-label="字體放大">A＋</button>
  <button class="tb-btn ${document.documentElement.classList.contains("proj")?"on":""}" onclick="toggleProj(this)">📽️ 投影</button></header>`;
}
function toggleProj(b){const on=document.documentElement.classList.toggle("proj");LS.set("proj",on);if(!on){document.documentElement.style.removeProperty("--fs");const f=LS.get("fs",0);if(f)setFs(f)}else document.documentElement.style.removeProperty("--fs");b.classList.toggle("on",on)}
function render(){
  const h=location.hash.slice(1), app=$("#app"); window.scrollTo(0,0);
  if(tch()) document.documentElement.classList.add("tch");
  let m;
  if((m=/^L(\d)(?:-(\d+))?$/.exec(h))&&LESSONS[+m[1]]) return lessonView(app,+m[1],+(m[2]||0));
  if((m=/^R(\d)$/.exec(h))&&ROUNDS[+m[1]]) return roundView(app,+m[1]);
  if(h==="wrong") return wrongView(app);
  if(h==="ak") return akView(app);
  homeView(app);
}

/* ---------- 首頁 ---------- */
function homeView(app){
  const best=LS.get("best",{}), wn=WB.count();
  app.innerHTML=topbar(false)+`
  <section class="hero"><h1>國三上 文法特訓<br>五大文法一次搞懂</h1>
  <p>情緒動詞・附加問句・名詞子句・if／whether・名詞片語。先看「觀念講解」，一步一步弄懂；再做 5 回闖關，每回 20 題。</p></section>
  <h2 class="sec">📖 觀念講解（老師上課可按「📽️ 投影」放大）</h2>
  <p class="zh" style="margin-top:-6px">建議順序：情緒動詞 → 附加問句 → 名詞子句 → if／whether → 名詞片語（後三個是同一個故事：問句變身三部曲）</p>
  <div class="grid">${LESSONS.map((l,i)=>`<button class="card" onclick="go('L${i}')"><img src="${l.img}" alt="" loading="lazy"><div class="cap"><div class="t">${l.emoji} ${i+1}. ${l.title} <span class="zh">${l.en}</span></div><div class="d">${l.goal}</div></div></button>`).join("")}</div>
  <h2 class="sec">🎯 闖關練習（每回 20 題：選擇 9・填空 4・改寫 4・重組 3）</h2>
  <div class="grid">${ROUNDS.map((r,i)=>`<button class="rcard" onclick="go('R${i}')"><span class="n" style="background:${["#1c7ed6","#7048e8","#e8590c","#2b8a3e","#c2255c"][i]}">${i+1}</span><span><span class="t">第 ${i+1} 回</span><br><span class="d">五個文法都有，題目每回不同</span></span>${best[i]!=null?`<span class="sc">最佳 ${best[i]}／20</span>`:""}</button>`).join("")}</div>
  <div class="row" style="margin-top:18px"><button class="btn alt" onclick="go('wrong')">📒 錯題本（${wn} 題）</button><button class="btn ghost akbtn" onclick="go('ak')">📋 答案總表（老師）</button></div>`;
}

/* ---------- 講解（點按） ---------- */
function lessonView(app,li,si){
  const L=LESSONS[li], n=L.steps.length; si=Math.max(0,Math.min(n-1,si));
  const seen=LS.get("seen_"+L.id,[]); if(!seen.includes(si)){seen.push(si);LS.set("seen_"+L.id,seen)}
  const st=L.steps[si];
  app.innerHTML=topbar(true)+`<div style="--c:${L.color}">
  <div class="lesson-hd">${si===0?`<img src="${L.img}" alt="">`:""}<div class="cap"><h1>${L.emoji} ${L.title} <span class="zh">${L.en}</span></h1><div class="zh">🎯 ${L.goal}</div></div></div>
  <div class="legend"><span><b class="S">藍＝主詞</b></span><span><b class="V">紅＝動詞</b></span><span><b class="X">橘＝be／助動詞</b></span><span><b class="W">綠＝疑問詞／if／介系詞</b></span></div>
  <div class="dots">${L.steps.map((s,k)=>`<button class="${k===si?"on":seen.includes(k)?"seen":""}" onclick="go('L${li}-${k}')" title="${esc(s.h)}">${k+1}</button>`).join("")}</div>
  <div class="step"><h2>${si+1}／${n}　${st.h}</h2><div class="tblwrap">${st.body}</div>
  <div class="row noprint" style="margin-top:10px"><button class="btn ghost" id="openall" style="padding:6px 14px">👀 全部答案打開</button></div></div>
  <div class="nav noprint"><button class="btn ghost" ${si===0?"disabled":""} onclick="go('L${li}-${si-1}')">◀ 上一步</button>
  ${si<n-1?`<button class="btn" onclick="go('L${li}-${si+1}')">下一步 ▶</button>`:(li<LESSONS.length-1?`<button class="btn" onclick="go('L${li+1}')">下一個觀念：${LESSONS[li+1].title} ▶</button>`:`<button class="btn alt" onclick="go('R0')">去闖關 ▶</button>`)}</div></div>`;
  const oa=$("#openall",app);
  const syncOA=()=>{const left=$$(".rvb",app).length;if(!left){oa.disabled=true;oa.textContent="✅ 答案都打開了"}};
  $$(".step .rv",app).forEach(rv=>{rv.hidden=true;const b=document.createElement("button");b.className="rvb";b.textContent="👆 看答案";b.onclick=()=>{rv.hidden=false;rv.classList.add("on");b.remove();syncOA()};rv.before(b)});
  if(!$$(".rvb",app).length) oa.parentElement.remove();     // 這一步沒有要點開的答案：不顯示「全部答案打開」
  else oa.onclick=()=>$$(".rvb",app).forEach(b=>b.click());
  $$(".step table.tb",app).forEach(t=>{const n=Math.max(...[...t.rows].map(r=>r.cells.length));if(n>=3&&innerWidth<620){t.style.minWidth=(n*190)+"px";t.insertAdjacentHTML("beforebegin",'<div class="zh">👉 表格可以左右滑動</div>')}});
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const m=/^#L(\d)(?:-(\d+))?$/.exec(location.hash); if(!m)return;
  const li=+m[1],si=+(m[2]||0);
  if(e.key==="ArrowRight"||e.key===" "){const nx=$$(".rvb")[0];if(nx&&e.key===" "){e.preventDefault();nx.click();return}if(si<LESSONS[li].steps.length-1)go(`L${li}-${si+1}`);e.preventDefault()}
  if(e.key==="ArrowLeft"&&si>0)go(`L${li}-${si-1}`);
});

/* ---------- 題目畫面 ---------- */
function tagHtml(q){const f=byQ.get(q.q)||q,g=G[f.g];return g?`<span class="tag src" style="background:${g[1]}">${g[0]}</span>`:""}
function stemHtml(q,no){return `<span class="no">${no}.</span>${esc(q.q).replace(/_{3,}/g,m=>"<u>"+"&nbsp;".repeat(m.length>4?10:6)+"</u>")}${tagHtml(q)}`}
function sayBtn(q){const f=byQ.get(q.q)||q;return f.say?`<button class="say" type="button" data-say="${f.say}" title="播放完整句子">🔊</button>`:""}
function exHtml(q,ok,mine){return `<div class="res ${ok?"ok":"ng"}">${sayBtn(q)}${ok?"✅ 答對了！":"❌ "+(mine?"你的答案："+esc(mine)+"　":"")+"正確答案：<span class=ans>"+esc(q.t==="ord"&&mine?q.tiles.join(" "):(q.t==="fill"||q.t==="rw")&&mine?q.ans[0]:q.o[q.a])+"</span>"}<br>💡 ${esc(q.ex)}</div>`}

/* 選擇題（也是藍鯨「重練錯題／老師派作業」用的共通介面：renderMCQ(el, 題目, code, 標題, opt)） */
function renderMCQ(el,qs,code,title,opt){
  opt=opt||{}; const list=Array.isArray(qs)?qs:[qs];
  const wrap=document.createElement("div");
  list.forEach((q,i)=>{
    const box=document.createElement("div"); box.className="mq";
    const order=(/Both A and B/.test(q.o.join("|")))?[0,1,2,3]:shuf([0,1,2,3]);
    box.dataset.q=q.q;
    box.innerHTML=`<div class="stem">${stemHtml(q,opt.no!=null?opt.no+i:i+1)}</div><div class="opts">${order.map((k,j)=>`<button class="o" data-k="${k}" data-o="${esc(q.o[k])}"><span class="k">(${LETTERS[j]})</span>${esc(q.o[k])}</button>`).join("")}</div>`;
    $$("button.o",box).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===q.a; q.my=k;
      $$("button.o",box).forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("good")});
      if(!ok)b.classList.add("bad");
      box.classList.add(ok?"ok":"ng");
      box.insertAdjacentHTML("beforeend",exHtml(q,ok));
      ok?WB.hit("m",q):WB.miss("m",q,title||"");
      opt.onDone&&opt.onDone(q,ok);
    });
    wrap.appendChild(box);
  });
  if(opt.redraw){const b=document.createElement("div");b.className="row";b.style.marginTop="14px";b.innerHTML=`<button class="btn ghost">${esc(opt.rsLabel||"🔁 再做一次")}</button>`;b.firstChild.onclick=opt.redraw;wrap.appendChild(b)}
  el.innerHTML="";el.appendChild(wrap);
}
/* 填空／改寫：打字 */
function renderType(el,q,no,onDone){
  const box=document.createElement("div");box.className="qf";
  box.innerHTML=`<div class="stem">${stemHtml(q,no)}</div><div class="fillrow"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.t==="rw"?"寫出空格裡的部分":"寫出答案"}"><button class="btn">檢查</button></div>`;
  const inp=$("input",box),btn=$("button.btn",box);
  const check=()=>{const v=inp.value.trim();if(!v){inp.focus();return}
    const ok=q.ans.some(a=>norm(a)===norm(v));q.my=ok?q.a:undefined;
    inp.disabled=btn.disabled=true;box.classList.add(ok?"ok":"ng");box.insertAdjacentHTML("beforeend",exHtml(q,ok,v));
    ok?WB.hit("m",q):WB.miss("m",q,"");onDone&&onDone(q,ok)};
  btn.onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};
  el.appendChild(box);
}
/* 重組：點字卡 */
function renderOrder(el,q,no,onDone){
  const box=document.createElement("div");box.className="qf";
  let bank=shuf(q.tiles.map((w,i)=>({w,i})));
  if(bank.every((x,i)=>x.i===i)) bank=bank.reverse();
  let built=[];
  box.innerHTML=`<div class="stem">${stemHtml(q,no)}</div><div class="built"></div><div class="tiles"></div><div class="row"><button class="btn">檢查</button><button class="btn ghost">↺ 重來</button></div>`;
  const bEl=$(".built",box),tEl=$(".tiles",box),[chk,rst]=$$(".row button",box);let done=false;
  const draw=()=>{bEl.innerHTML=built.map((x,k)=>`<button class="tile" data-k="${k}">${esc(x.w)}</button>`).join("")||`<span class="zh">點下面的字卡，依序排成句子</span>`;
    tEl.innerHTML=bank.map((x,k)=>`<button class="tile" data-k="${k}">${esc(x.w)}</button>`).join("");
    if(done)return;
    $$(".tile",bEl).forEach(b=>b.onclick=()=>{bank.push(built.splice(+b.dataset.k,1)[0]);draw()});
    $$(".tile",tEl).forEach(b=>b.onclick=()=>{built.push(bank.splice(+b.dataset.k,1)[0]);draw()})};
  draw();
  rst.onclick=()=>{if(done)return;bank=bank.concat(built);built=[];draw()};
  chk.onclick=()=>{if(bank.length){tEl.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:250});return}
    const bare=t=>t.map(w=>w.replace(/[.?!,]$/,"")).join(" ").toLowerCase(),s=bare(built.map(x=>x.w)),ok=[q.tiles,...(q.alt||[])].some(t=>bare(t)===s);
    done=true;q.my=ok?q.a:undefined;chk.disabled=rst.disabled=true;box.classList.add(ok?"ok":"ng");
    box.insertAdjacentHTML("beforeend",exHtml(q,ok,built.map(x=>x.w).join(" ")));draw();
    ok?WB.hit("m",q):WB.miss("m",q,"");onDone&&onDone(q,ok)};
  el.appendChild(box);
}
function renderItem(el,q,no,onDone){
  if(q.t==="mc"){const d=document.createElement("div");el.appendChild(d);renderMCQ(d,[q],null,"",{no,onDone})}
  else if(q.t==="ord")renderOrder(el,q,no,onDone);else renderType(el,q,no,onDone);
}

/* ---------- 一回 ---------- */
function roundView(app,ri){
  const R=ROUNDS[ri];let answered=0,right=0;
  app.innerHTML=topbar(true)+`<h1 style="font-size:1.3rem;margin:4px 0">🎯 第 ${ri+1} 回　文法闖關</h1>
  <div class="row noprint" style="margin:4px 0 6px"><button class="btn ghost" style="padding:4px 12px;font-size:.85rem" onclick="printRound(${ri},false)">🖨️ 列印題目卷</button><button class="btn ghost akbtn" style="padding:4px 12px;font-size:.85rem" onclick="printRound(${ri},true)">🖨️ 列印解答卷</button></div>
  <div class="qhead noprint"><div class="prog"><i></i></div><b id="cnt">0／20</b></div>
  <div id="qs"></div><div id="end"></div>`;
  const qs=$("#qs",app);let no=1;
  ["mc","fill","rw","ord"].forEach(t=>{
    const items=R.filter(q=>q.t===t);qs.insertAdjacentHTML("beforeend",`<div class="qsec">${T[t]}</div>`);
    items.forEach(q=>renderItem(qs,q,no++,(q,ok)=>{answered++;if(ok)right++;
      $(".prog i",app).style.width=answered*5+"%";$("#cnt",app).textContent=`${answered}／20`;
      if(answered===20)finish()}));
  });
  function finish(){
    const best=LS.get("best",{});if(best[ri]==null||right>best[ri]){best[ri]=right;LS.set("best",best)}
    const msg=right>=18?"太厲害了！文法高手 🏆":right>=14?"很不錯！把錯的再看一次解析 💪":"別灰心！先回去看觀念講解，再挑戰一次 🌱";
    $("#end",app).innerHTML=`<div class="endbox"><div>第 ${ri+1} 回完成</div><div class="score">${right}／20</div><p>${msg}</p><div class="row" style="justify-content:center"><button class="btn alt" onclick="go('wrong')">📒 看錯題（${WB.count()}）</button><button class="btn ghost" onclick="render()">🔁 再做一次</button>${ri<4?`<button class="btn" onclick="go('R${ri+1}')">下一回 ▶</button>`:""}</div></div>`;
    $("#end",app).scrollIntoView({behavior:"smooth"});
  }
}

/* ---------- 錯題本 ---------- */
function wrongView(app){
  const w=LS.get("wrong",[]).map(x=>byQ.get(x.q)).filter(Boolean);
  app.innerHTML=topbar(true)+`<h1 style="font-size:1.3rem">📒 錯題本</h1><p class="zh">答錯的題目會自動收進來；在這裡（或任何一回）答對，就會拿掉。</p><div id="qs"></div>`;
  const qs=$("#qs",app);
  if(!w.length){qs.innerHTML=`<div class="empty">🎉 目前沒有錯題！</div>`;return}
  w.forEach((q,i)=>{qs.insertAdjacentHTML("beforeend",`<div class="zh" style="margin-top:14px">第 ${q.__r+1} 回 第 ${q.__i+1} 題・${G[q.g][0]}</div>`);renderItem(qs,q,i+1)});
}

/* ---------- 答案總表（老師） ---------- */
function ansText(q){return q.t==="mc"?`(${LETTERS[q.a]}) ${q.o[q.a]}`:q.t==="ord"?q.tiles.join(" "):q.ans.join("／")}
function akView(app){
  if(!tch()){go("");return}
  app.innerHTML=topbar(true)+`<h1 style="font-size:1.3rem">📋 答案總表</h1><p class="zh">選擇題的 (A)～(D) 是列印卷上的順序；線上作答時選項會重新洗牌。</p><div id="akbox" class="tblwrap">${ROUNDS.map((r,ri)=>`<h2 class="sec">第 ${ri+1} 回</h2><table class="tb"><tr><th>題</th><th>文法</th><th>答案</th></tr>${printOrder(r).map((q,i)=>`<tr><td>${i+1}</td><td>${G[q.g][0]}</td><td style="font-family:Georgia,serif">${esc(ansText(q))}</td></tr>`).join("")}</table>`).join("")}</div>`;
}
function printOrder(r){return ["mc","fill","rw","ord"].flatMap(t=>r.filter(q=>q.t===t))}

/* ---------- 列印 ---------- */
function printRound(ri,withAns){
  if(withAns&&!tch())return;
  const r=printOrder(ROUNDS[ri]);let no=0,html=`<div class="printonly"><h2 style="margin:0 0 4px">國三上 文法特訓　第 ${ri+1} 回${withAns?"（解答）":""}</h2><p style="margin:0 0 10px">班級：＿＿＿＿　座號：＿＿＿　姓名：＿＿＿＿＿＿　得分：＿＿＿／20</p>`;
  ["mc","fill","rw","ord"].forEach(t=>{html+=`<h3 style="margin:12px 0 6px">${T[t]}</h3>`;
    r.filter(q=>q.t===t).forEach(q=>{no++;
      let body=esc(q.q);
      if(t==="mc")body+=`<br>${q.o.map((o,k)=>`(${LETTERS[k]}) ${esc(o)}`).join("　")}`;
      if(t==="ord")body+=`<br>【${shuf(q.tiles).map(esc).join(" / ")}】<div class="line"></div>`;
      if(t==="rw")body+=`<div class="line"></div>`;
      html+=`<div class="pq">${t==="mc"?"(　) ":""}${no}. ${body}${withAns?`<div style="color:#c92a2a">答：${esc(ansText(q))}　｜　${esc(q.ex)}</div>`:""}</div>`})});
  html+="</div>";
  const holder=document.createElement("div");holder.id="printholder";holder.innerHTML=html;document.body.appendChild(holder);
  const old=$("#app");old.classList.add("noprint");
  setTimeout(()=>{window.print();setTimeout(()=>{holder.remove();old.classList.remove("noprint")},500)},50);
}

/* 🔊 微軟發音（en-US-AriaNeural，預錄 mp3；同一時間只播一個） */
const player=new Audio();let playingBtn=null;
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button.say");if(!b)return;e.preventDefault();e.stopPropagation();
  if(playingBtn===b&&!player.paused){player.pause();b.classList.remove("playing");playingBtn=null;return}
  if(playingBtn)playingBtn.classList.remove("playing");
  player.src="audio/"+b.dataset.say+".mp3";playingBtn=b;b.classList.add("playing");
  const p=player.play();if(p&&p.catch)p.catch(()=>{b.classList.remove("playing")});},true);
player.addEventListener("ended",()=>{if(playingBtn)playingBtn.classList.remove("playing");playingBtn=null});
player.addEventListener("error",()=>{if(playingBtn)playingBtn.classList.remove("playing");playingBtn=null});
render();
/* 藍鯨老師帳號登入後才會加上 html.bw-tch：晚一點再檢查一次，讓答案總表按鈕出現 */
setTimeout(()=>{if(tch()&&!document.documentElement.classList.contains("tch")){document.documentElement.classList.add("tch")}},1500);
</script>

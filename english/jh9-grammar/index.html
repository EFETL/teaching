<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國三上 文法特訓｜情緒動詞・附加問句・名詞子句・if／whether・名詞片語</title>
<style>
:root{--fs:19px;--ink:#1f2a37;--mut:#5b6b7f;--bg:#f6f3ec;--card:#fff;--line:#e6e0d4;--main:#1864ab}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 80px}
header.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
header.top .home{font-weight:800;color:var(--main);text-decoration:none;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:0}
header.top .sp{flex:1}
.tb-btn{border:0;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:700;color:#334}
.tb-btn.on{background:var(--main);color:#fff}
.hero{background:linear-gradient(135deg,#1864ab,#5f3dc4);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:18px;box-shadow:0 8px 22px rgba(24,100,171,.3)}
.hero h1{margin:0 0 6px;font-size:1.45rem;line-height:1.35}
.hero p{margin:0;opacity:.95}
h2.sec{font-size:1.15rem;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08);border:0;text-align:left;padding:0;color:inherit;display:block;width:100%}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#eee}
.card .cap{padding:12px 16px 14px}
.card .t{font-weight:800;font-size:1.08rem}
.card .d{color:var(--mut);font-size:.88rem}
.rcard{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.08);border:0;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.rcard .n{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.3rem;flex:none}
.rcard .t{font-weight:800}.rcard .d{color:var(--mut);font-size:.85rem}
.rcard .sc{margin-left:auto;font-weight:800;color:#2b8a3e;white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:800;background:var(--main);color:#fff}
.btn.ghost{background:#fff;color:var(--main);box-shadow:inset 0 0 0 2px var(--main)}
.btn.alt{background:#e8590c}
.btn:disabled{opacity:.45}
/* 講解 */
.lesson-hd{border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:14px}
.lesson-hd img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.lesson-hd .cap{padding:12px 16px}
.lesson-hd h1{margin:0;font-size:1.3rem}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.dots button{width:34px;height:34px;border-radius:50%;border:0;background:#dde3ea;font-weight:800;color:#456;font-size:.8rem}
.dots button.on{background:var(--c,#1864ab);color:#fff}
.dots button.seen{background:#c5d5e6}
.step{background:#fff;border-radius:20px;padding:18px 18px 20px;box-shadow:0 3px 12px rgba(0,0,0,.08);border-top:6px solid var(--c,#1864ab);min-height:220px}
.step h2{margin:0 0 10px;font-size:1.25rem;color:var(--c,#1864ab)}
.step p{margin:8px 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav .btn{flex:1;padding:14px}
.big{font-size:1.15rem;font-weight:600;margin:8px 0;font-family:Georgia,"Times New Roman",serif;line-height:1.6}
.zh{color:var(--mut);font-size:.92rem}
.tip{background:#fff8e1;border-left:5px solid #f59f00;padding:8px 12px;border-radius:8px}
.rule{background:#eef4fb;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:1.05rem}
.rule div{margin:4px 0}
.pair{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
@media(min-width:620px){.pair{grid-template-columns:1fr 1fr}}
.card2{background:#f8f9fb;border-radius:14px;padding:12px 14px;border:2px solid #e5e9f0}
.flow{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0;flex-wrap:nowrap}
.flow .box{background:#fff3e6;border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap}
.flow .arrow{color:#e8590c;font-weight:800;text-align:center;flex:1;font-size:.9rem}
.flow .lab{font-weight:800;color:#e03131;font-size:.9rem}
.steps3{padding-left:1.4em}.steps3 li{margin:6px 0}
.ask{background:#f4f7fb;border-radius:12px;padding:10px 12px;margin:10px 0;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem}
.ask .rvb,.rvb{font-family:-apple-system,"PingFang TC",sans-serif;border:0;background:#fff;border:2px dashed #94a3b8;border-radius:999px;padding:2px 12px;color:#475569;font-size:.85rem;margin-left:4px}
.rv.on{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips span{background:#f1f3f5;border-radius:999px;padding:3px 12px;font-weight:700}
table.tb{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem;background:#fff}
table.tb th,table.tb td{border:1px solid #e3e7ee;padding:7px 9px;text-align:left;vertical-align:top}
table.tb th{background:#f1f5fa}
table.tb.small{font-size:.85rem}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sum{background:#ebfbee;border-radius:14px;padding:12px 14px}.sum div{margin:6px 0}
b.S{color:#1864ab}b.V{color:#e03131}b.X{color:#e8590c}b.W{color:#2b8a3e}
s.gone{color:#adb5bd;text-decoration:line-through 3px #e03131}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;color:var(--mut);margin:4px 0 10px}
.legend b{font-weight:800}
/* 闖關 */
.qhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:160px;height:12px;background:#dde3ea;border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,#37b24d,#1c7ed6);width:0;transition:width .3s}
.qsec{font-weight:900;margin:22px 0 8px;font-size:1.05rem;color:#334}
.mq,.qf{background:#fff;border-radius:16px;padding:14px 14px 12px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:6px solid #ced4da}
.mq.ok,.qf.ok{border-left-color:#37b24d}.mq.ng,.qf.ng{border-left-color:#f03e3e}
.stem{font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.6;margin-bottom:8px}
.stem .no{font-family:-apple-system,"PingFang TC",sans-serif;font-weight:900;color:var(--main);margin-right:4px}
.stem .tag{font-family:-apple-system,"PingFang TC",sans-serif;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;color:#fff}
.opts{display:grid;gap:8px}
button.o{border:2px solid #dee2e6;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
button.o .k{font-family:-apple-system,sans-serif;font-weight:900;color:#868e96;margin-right:6px}
button.o.good{background:#ebfbee;border-color:#37b24d}button.o.bad{background:#fff5f5;border-color:#f03e3e}
button.o:disabled{cursor:default;color:inherit}
.fillrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fillrow input{flex:1;min-width:200px;font-size:1.05rem;padding:10px 12px;border-radius:12px;border:2px solid #ced4da;font-family:Georgia,"Times New Roman",serif}
.fillrow input:focus{outline:none;border-color:var(--main)}
.res{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.95rem}
.res.ok{background:#ebfbee}.res.ng{background:#fff5f5}
.res .ans{font-family:Georgia,"Times New Roman",serif;font-weight:700}
.tiles,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:12px}
.built{background:#f1f5fa;border:2px dashed #b6c4d6;margin-bottom:8px}
.tiles{background:#fafafa}
.tile{border:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);border-radius:10px;padding:8px 12px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.built .tile{background:#e7f5ff}
.endbox{background:#fff;border-radius:18px;padding:20px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);margin:20px 0}
.endbox .score{font-size:2.2rem;font-weight:900;color:#2b8a3e}
.empty{color:var(--mut);text-align:center;padding:30px}
button.say{border:0;background:#e7f5ff;border-radius:999px;width:2em;height:2em;padding:0;margin:0 0 0 6px;font-size:.85em;vertical-align:middle;line-height:2em;box-shadow:0 1px 3px rgba(0,0,0,.12);font-family:-apple-system,sans-serif}
button.say.playing{background:#1c7ed6;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
@media print{button.say{display:none!important}}
/* 投影（老師上課）模式 */
html.proj{--fs:26px}
html.proj .wrap{max-width:1180px}
html.proj .lesson-hd img{max-height:34vh}
/* 答案總表、列印 */
.akbtn{display:none}
html.tch .akbtn{display:inline-block}
#akbox table{font-size:.85rem}
.printonly{display:none}
@media print{
  :root{--fs:13px}
  body{background:#fff}
  .noprint,header.top,.qhead,.endbox,.res,.rvb,.akbtn{display:none!important}
  .printonly{display:block!important}
  .wrap{max-width:none;padding:0}
  .pq{break-inside:avoid;margin:0 0 10px;font-family:Georgia,"Times New Roman",serif}
  .pq .line{border-bottom:1px solid #999;height:1.6em;margin-top:4px}
}
</style>
</head>

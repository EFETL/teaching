<style>
:root{--pri:#2563eb;--prid:#1e40af;--sec:#f59e0b;--bg:#eef2f7;--card:#fff;--txt:#1f2937;--muted:#6b7280;--border:#e5e7eb;--ok:#16a34a;--err:#dc2626;--acc:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-size:16px;line-height:1.75;background:var(--bg);color:var(--txt)}
.site-header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.back-btn{background:#fff;color:var(--pri);border:none;padding:6px 13px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}
.site-title{font-size:17px;font-weight:700}
.toolbar{position:sticky;top:52px;z-index:90;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.toolbar .tt{font-size:14px;color:var(--muted);margin-right:auto}
.tb-btn{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:9px;padding:8px 15px;cursor:pointer;transition:.15s}
.tb-btn:hover{filter:brightness(.95);transform:translateY(-1px)}
.b-reveal{background:var(--sec);color:#fff}.b-hide{background:#6b7280;color:#fff}.b-print{background:var(--pri);color:#fff}
.b-score{background:var(--acc);color:#fff}
/* 分頁紙張 */
#doc{padding:22px 0 60px}
.sheet{width:210mm;height:297mm;background:#fff;margin:0 auto 18px;box-shadow:0 3px 16px rgba(0,0,0,.14);padding:15mm 16mm 8mm;display:flex;flex-direction:column;position:relative;overflow:hidden}

.blk{margin-bottom:11px}
.cover-blk{background:linear-gradient(135deg,#eff6ff,#f8fbff);border:2px solid #bfdbfe;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.exam-cover-blk{background:linear-gradient(135deg,#fef3e7,#fffaf3);border:2px solid #fcd9a8;border-radius:12px;padding:20px 22px;margin-bottom:16px}
.doc-kicker{font-size:15px;font-weight:700;color:var(--pri)}.doc-kicker.ex{color:#c2740c}
.doc-h1{font-size:22px;font-weight:800;color:#111827;margin:4px 0 6px}
.doc-sub{font-size:14px;color:var(--muted)}

.info-tb{width:100%;border-collapse:collapse;font-size:14px}
.info-tb th{background:var(--pri);color:#fff;padding:8px 10px;border:1px solid #cbd5e1;text-align:center}
.info-tb td{padding:8px 10px;border:1px solid #d1d5db;text-align:center}
.info-tb tr:nth-child(even) td{background:#f6f9fd}
.blank{display:inline-block;border-bottom:2px solid #9ca3af;min-width:2.6em;text-align:center;margin:0 3px;color:#fff;background:var(--pri);cursor:pointer;padding:1px 10px;border-radius:6px;font-weight:700;user-select:none;transition:.15s}
.blank:hover{background:var(--prid)}
.blank.show{color:#fff;background:var(--ok);border-color:var(--ok)}
.topic-group-box{background:#eff6ff;border:2px solid #bfdbfe;border-radius:10px;padding:12px 16px;font-size:15px}
.topic-group-box strong{color:var(--pri);display:block;font-size:16px;margin-bottom:4px}
.q-blk{background:#fff;border:1px solid #eceff3;border-radius:11px;padding:13px 16px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.q-num{font-size:13px;font-weight:700;color:#fff;background:var(--pri);border-radius:6px;padding:1px 9px}
.q-src{font-size:12px;color:var(--muted);background:#f3f4f6;border-radius:5px;padding:1px 7px}
.q-text{font-size:16px;font-weight:700;line-height:1.7;margin-bottom:9px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opt-btn{background:#f9fafb;border:2px solid var(--border);border-radius:9px;padding:8px 11px;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:flex-start;gap:7px;font-family:inherit;transition:.12s}

.opt-btn.correct{border-color:var(--ok);background:#dcfce7;color:#15803d;font-weight:700}
.opt-btn.wrong{border-color:var(--err);background:#fee2e2;color:var(--err)}
.opt-btn:disabled{cursor:default}
.opt-letter{font-weight:800;min-width:20px}
.analysis-box{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:9px;padding:10px 13px;margin-top:9px;font-size:14px;color:#5b21b6;line-height:1.7;display:none}
.analysis-box.show{display:block}
#scorebar{position:fixed;bottom:0;left:0;right:0;background:var(--prid);color:#fff;padding:10px;text-align:center;font-size:16px;font-weight:700;display:none;z-index:120}
/* 螢幕外量測容器 */
#measure{position:absolute;left:-9999px;top:0;width:calc(210mm - 32mm)}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .site-header,.toolbar,#scorebar{display:none!important}
  #doc{padding:0}

  /* 學生列印版：空格變底線、不顯示答案/解析 */
  body.print-student .blank{background:none!important;color:transparent!important;border-bottom:1.6px solid #333!important;border-radius:0!important;min-width:110px!important;padding:0 6px!important}

  body.print-student .opt-btn{box-shadow:none}
  /* 解答版：空格顯示答案、解析全開 */
  body.print-answer .blank{background:#dcfce7!important;color:#15803d!important;border:1px solid #15803d!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-answer .analysis-box{display:block!important}
  .opt-btn,.info-tb th,.q-num,.blank,.cover-blk,.exam-cover-blk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:820px){.sheet{width:100%;height:auto;min-height:auto;padding:18px 16px}.options{grid-template-columns:1fr}}
</style></head>

<script>

// 原始區塊
const RAW = `<div class="blk cover-blk">
    <div class="doc-kicker">🏯　重點整理講義</div>
    <div class="doc-h1">第一次段考重點複習：日治時期政治與經濟</div>
    <div class="doc-sub">從日本領臺、總督府體制、統治三階段，到警察保甲、理蕃政策與經濟建設的完整重點整理　·　範圍：第二冊 L1~L2　日治時期的政治與經濟</div>
    <div class="doc-tip">💡 點藍色「？」看答案；老師可按「顯示全部答案」；列印時空格自動變作答底線。</div>
  </div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">一、日本領臺與臺灣民主國</div></div>
<div class="blk"><div class="fill-text">1894 年清朝與日本因<span class="blank" data-ans="朝鮮">？</span>問題爆發<span class="blank" data-ans="甲午戰爭">？</span>，清朝戰敗。</div></div>
<div class="blk"><div class="fill-text">1895 年（乙未年）清朝派<span class="blank" data-ans="李鴻章">？</span>與日本簽訂<span class="blank" data-ans="馬關條約">？</span>，將臺灣、澎湖割讓給日本，日治時期就此開始。</div></div>
<div class="blk"><div class="fill-text">臺灣士紳為抗拒日本接收，成立<span class="blank" data-ans="臺灣民主國">？</span>，年號<span class="blank" data-ans="永清">？</span>，以<span class="blank" data-ans="藍地黃虎旗">？</span>為國旗，推舉巡撫<span class="blank" data-ans="唐景崧">？</span>為大總統。</div></div>
<div class="blk"><div class="note-text">補充：臺灣民主國成立於馬關條約簽訂「之後」，目的是抗拒日本接收、繼續作為清朝領土，並非真正要獨立建國。曾任臺灣巡撫的還有劉銘傳、沈葆楨。</div></div>
<div class="blk"><div class="fill-text">日治時期的開始與結束分別與<span class="blank" data-ans="馬關條約">？</span>簽訂、<span class="blank" data-ans="中日戰爭">？</span>結束（日本二戰投降）兩事件有關，共統治臺灣約 50 年。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">二、總督府體制與六三法</div></div>
<div class="blk"><div class="fill-text">日本設立<span class="blank" data-ans="臺灣總督府">？</span>作為最高統治機構，位於今日的<span class="blank" data-ans="總統府">？</span>。</div></div>
<div class="blk"><div class="fill-text">1896 年頒布<span class="blank" data-ans="六三法">？</span>（法律第六十三號），規定總督可在其轄區內頒布具法律效力的命令，形成<span class="blank" data-ans="總督專制">？</span>的統治體制。</div></div>
<div class="blk"><div class="fill-text">第四任總督<span class="blank" data-ans="兒玉源太郎">？</span>任用<span class="blank" data-ans="後藤新平">？</span>為民政長官，推動各項現代化建設，奠定日後臺灣發展的基礎。</div></div>
<div class="blk"><div class="note-text">後藤新平主張以「生物學原則」治臺（因地制宜、先充分調查再統治），並主導人口普查、專賣制度等，被視為奠定日本殖民臺灣基礎的關鍵人物。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">三、殖民統治三階段</div></div>
<div class="blk"><div class="note-text">日本統治臺灣 50 年，政策依序分為三階段。請記住「順序」與「對應總督身分」：</div></div>
<div class="blk"><table class="info-tb"><thead><tr><th>階段（依序）</th><th>別稱</th><th>總督身分</th><th>關鍵背景</th></tr></thead><tbody><tr><td>殖民地特殊統治時期</td><td><span class="blank" data-ans="無方針主義">？</span></td><td><span class="blank" data-ans="武官">？</span></td><td>武裝抗日不斷，鎮撫並施、因地制宜</td></tr><tr><td><span class="blank" data-ans="內地延長主義">？</span>時期</td><td>日臺合一、一視同仁</td><td><span class="blank" data-ans="文官">？</span></td><td>受第一次世界大戰後<span class="blank" data-ans="民族自決">？</span>思潮影響</td></tr><tr><td><span class="blank" data-ans="皇民化運動">？</span>時期</td><td>皇民化</td><td><span class="blank" data-ans="武官">？</span></td><td>因<span class="blank" data-ans="中日戰爭">？</span>爆發，要動員臺人效忠日本</td></tr></tbody></table></div>
<div class="blk"><div class="fill-text">總督身分的轉變順序為：武官→<span class="blank" data-ans="文官">？</span>→武官。首任文官總督是<span class="blank" data-ans="田健治郎">？</span>，標榜「內地延長主義」為統治方針。</div></div>
<div class="blk"><div class="fill-text">由第一階段轉為第二階段（內地延長主義）的原因，是第一次世界大戰後美國總統<span class="blank" data-ans="威爾遜">？</span>提倡的「<span class="blank" data-ans="民族自決">？</span>」思潮興起。</div></div>
<div class="blk"><div class="fill-text">皇民化運動的措施包括：廢除報紙<span class="blank" data-ans="漢文">？</span>欄、要求說日語、改<span class="blank" data-ans="日本姓名">？</span>、參拜<span class="blank" data-ans="神社">？</span>、頒發「<span class="blank" data-ans="國語家庭">？</span>」認定證書、徵召臺人從軍（志願兵）等。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">四、警察與保甲制度</div></div>
<div class="blk"><div class="fill-text">日治時期<span class="blank" data-ans="警察">？</span>權力極大，幾乎無所不管，被臺灣人稱為「<span class="blank" data-ans="大人">？</span>」，也負責鎮壓地方反抗活動。</div></div>
<div class="blk"><div class="fill-text">總督府沿用並改良自<span class="blank" data-ans="清帝國">？</span>時期的<span class="blank" data-ans="保甲">？</span>制度，並採取<span class="blank" data-ans="連坐法">？</span>，讓民眾相互監督，協助警察維持治安。</div></div>
<div class="blk"><div class="fill-text">保甲制度以<span class="blank" data-ans="十">？</span>戶為一甲、<span class="blank" data-ans="十">？</span>甲為一保；保設「<span class="blank" data-ans="保正">？</span>」、甲設「甲長」，須輔助警察辦理戶口調查、政令宣達與救災等事務。</div></div>
<div class="blk"><div class="note-text">保正、甲長由地方推選、輔助警察，是官方與百姓間的橋樑，本身並非警察或總督。透過警察與保甲制度，總督府得以確實掌握戶口、瓦解反抗勢力。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">五、武裝抗日與理蕃政策</div></div>
<div class="blk"><div class="fill-text">1915 年<span class="blank" data-ans="余清芳">？</span>領導的<span class="blank" data-ans="西來庵事件">？</span>（噍吧哖事件），是日治時期規模最大的<span class="blank" data-ans="漢人">？</span>武裝抗日事件，帶有宗教色彩。</div></div>
<div class="blk"><div class="note-text">西來庵事件後，漢人武裝抗日大致停止，知識份子轉向非武裝的政治社會運動。此事件除宗教因素外，也和新式糖廠壟斷、林野被收歸官有等經濟問題有關。</div></div>
<div class="blk"><div class="fill-text">總督<span class="blank" data-ans="佐久間左馬太">？</span>於 1910 年推動「<span class="blank" data-ans="五年理蕃計畫">？</span>」，以武力鎮壓、沒收槍械迫使原住民臣服，主要目的是取得山區的<span class="blank" data-ans="樟腦">？</span>與森林資源。</div></div>
<div class="blk"><div class="fill-text">1930 年爆發<span class="blank" data-ans="霧社事件">？</span>，發生於今<span class="blank" data-ans="南投縣仁愛鄉">？</span>（霧社），領導人是<span class="blank" data-ans="賽德克">？</span>族頭目<span class="blank" data-ans="莫那魯道">？</span>。</div></div>
<div class="blk"><div class="note-text">霧社事件後，日本以飛機轟炸、施放毒氣鎮壓，原住民死傷慘重並引起國際輿論。事後總督府重新檢討理蕃政策，並將原住民集體遷徙到近山地區、加強教化管理。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">六、財政與專賣制度</div></div>
<div class="blk"><div class="fill-text">後藤新平推動<span class="blank" data-ans="專賣">？</span>制度，把<span class="blank" data-ans="鴉片">？</span>、樟腦、菸酒等列為官方獨佔經營，是總督府財政由虧轉盈、收入逐年增加的最主要原因。</div></div>
<div class="blk"><div class="fill-text">總督府進行<span class="blank" data-ans="土地調查">？</span>，確定土地所有權，使可課稅的<span class="blank" data-ans="田賦">？</span>稅收大幅增加。</div></div>
<div class="blk"><div class="fill-text">1905 年總督府完成臺灣首次科學性的<span class="blank" data-ans="人口普查">？</span>，目的是掌握臺灣人口實況以因地制宜統治。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">七、交通、糖業與稻米建設</div></div>
<div class="blk"><div class="fill-text">1908 年臺灣西部<span class="blank" data-ans="縱貫鐵路">？</span>全線通車，串連南北、統一島內市場，是重要的「資本主義基礎工事」。</div></div>
<div class="blk"><div class="fill-text">臺灣第一座新式製糖廠是 1901 年設立於高雄<span class="blank" data-ans="橋仔頭">？</span>（橋頭）的糖廠。總督府劃定「<span class="blank" data-ans="原料採取區域">？</span>」制度，規定蔗農不得越區出售甘蔗，以保障資本家（糖廠）利益。</div></div>
<div class="blk"><div class="note-text">俗諺「第一戇，種甘蔗予會社磅」與漫畫「三個保正八十斤」，都在諷刺製糖會社磅秤造假、剝削蔗農，臺灣雖成糖業王國，蔗農待遇卻未改善。</div></div>
<div class="blk"><div class="fill-text">1920 年代<span class="blank" data-ans="磯永吉">？</span>改良稻米品種，培育出適合日本人口味的<span class="blank" data-ans="蓬萊米">？</span>，被稱為「蓬萊米之父」。</div></div>
<div class="blk"><div class="fill-text">工程師<span class="blank" data-ans="八田與一">？</span>興建<span class="blank" data-ans="嘉南大圳">？</span>（水源來自烏山頭水庫），使嘉南平原灌溉面積大增、稻米產量提高。</div></div>
<div class="blk sec-title-blk keep-next"><div class="ht-sec-title">八、工業化、南進政策與美術</div></div>
<div class="blk"><div class="fill-text">1934 年<span class="blank" data-ans="日月潭">？</span>水力發電所完工，提供充足電力，配合日本的<span class="blank" data-ans="南進政策">？</span>，推動臺灣工業化。</div></div>
<div class="blk"><div class="fill-text">1937 年中日戰爭後，經濟口號由「農業臺灣，工業日本」轉為「<span class="blank" data-ans="工業臺灣">？</span>，農業南洋」，臺灣成為日本南進的<span class="blank" data-ans="基地">？</span>。</div></div>

<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 1 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">臺灣的歷史發展從清領時期進入日本殖民統治，與下列哪一條約有關？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>《北京條約》</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>《天津條約》</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>《南京條約》</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>《馬關條約》</span></button></div>
      <div class="analysis-box"><b>解析：</b>1894 年甲午戰爭清朝戰敗，1895 年簽訂《馬關條約》，將臺灣、澎湖割讓給日本，臺灣自此進入日治時期。《南京條約》是鴉片戰爭結果、《天津條約》《北京條約》是英法聯軍相關條約，皆與臺灣割讓無關。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 2 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">日本與清帝國爆發戰爭最終取得臺灣，這場戰爭最初是因為哪一地區的問題而爆發？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>朝鮮</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>琉球</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>臺灣</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>遼東半島</span></button></div>
      <div class="analysis-box"><b>解析：</b>甲午戰爭（1894）因中日爭奪朝鮮的控制權而爆發，清朝戰敗後於馬關條約割讓臺灣、澎湖與遼東半島（遼東後因三國干涉還遼歸還）。導火線是朝鮮問題，並非臺灣本身。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 3 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">某告示提到「本總督已與清國欽差完成交接，臺灣全島及澎湖已屬我國版圖，前臺灣巡撫竟支持在臺灣的唐景崧清兵反抗……」此告示最可能與下列何者有關？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>臺灣民主國</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>噍吧哖事件</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>霧社事件</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>中日戰爭</span></button></div>
      <div class="analysis-box"><b>解析：</b>告示提到唐景崧、清兵反抗日本接收，正是 1895 年臺灣民主國抗拒日本接收臺灣的情形。噍吧哖（西來庵）、霧社為後來的抗日事件，中日戰爭則在 1937 年。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 4 題</span><span class="q-src">仁愛</span></div>
      <div class="q-text">有關臺灣民主國的敘述，正確的組合為何？（甲）年號「永清」（乙）以藍地黃虎旗為國旗（丙）成立目的是抗拒日本接收臺灣（丁）成立於馬關條約簽訂前</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>甲乙丙</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>乙丙丁</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>甲丁</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>甲乙</span></button></div>
      <div class="analysis-box"><b>解析：</b>臺灣民主國年號「永清」（表示永戴大清）、以藍地黃虎旗為旗、目的在抗拒日本接收，故甲乙丙正確。（丁）錯，臺灣民主國成立於馬關條約簽訂「之後」；重要領導人是唐景崧與丘逢甲，而非劉銘傳。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 5 題</span><span class="q-src">仁愛</span></div>
      <div class="q-text">下列哪一事件「不」發生於 1895 年（乙未年）？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>臺灣民主國成立</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>臺灣總督府設立</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>日本對臺灣發布「六三法」</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>清日簽訂馬關條約</span></button></div>
      <div class="analysis-box"><b>解析：</b>馬關條約簽訂、臺灣民主國成立、臺灣總督府設立皆在 1895 年（乙未年）；六三法則於 1896 年才頒布，故選六三法。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 6 題</span><span class="q-src">林園</span></div>
      <div class="q-text">日治時期的開始與結束，分別與下列哪兩個事件有關？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>清法戰爭爆發、中日戰爭爆發</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>馬關條約簽訂、中日戰爭爆發</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>英法聯軍爆發、中日戰爭結束</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>馬關條約簽訂、中日戰爭結束</span></button></div>
      <div class="analysis-box"><b>解析：</b>日治始於 1895 年馬關條約割臺，終於 1945 年中日戰爭（二戰）結束、日本投降，共約 50 年。中日戰爭「爆發」是 1937 年，並非日治結束，故選馬關條約簽訂、中日戰爭結束。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 7 題</span><span class="q-src">林園</span></div>
      <div class="q-text">「臺灣總督得於其轄區內頒布具有法律效力之命令」，這條「六三法」條文對當時臺灣的意義是什麼？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>從此臺灣人可以自主管理</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>形成總督專制的統治體制</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>臺灣總督須具備司法背景</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>視臺灣為日本內地的延長</span></button></div>
      <div class="analysis-box"><b>解析：</b>六三法讓總督兼具行政、立法（發布法令）大權，形成總督專制的統治體制。臺灣人並未因此自主；「內地延長」是後來第二階段的政策方針，與六三法賦權的性質不同。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 8 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">石川欽一郎被譽為「臺灣近代西洋美術的啟蒙者」，其作品描繪臺灣總督府。日本以總督為首長、形成專制體制，是因何法頒布？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>三一法</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>一三法</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>三六法</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>六三法</span></button></div>
      <div class="analysis-box"><b>解析：</b>1896 年頒布「六三法」授權總督頒布具法律效力的命令，形成總督專制。三一法、法三號是後續修訂法規，權限已縮減；「一三法」「三六法」為虛構選項。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 9 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">某文章關鍵詞為「奠定日本殖民臺灣的基礎」「臺灣民政長官」與「人口普查」，這篇文章應指下列何人？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>兒玉源太郎</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>八田與一</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>後藤新平</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>小林躋造</span></button></div>
      <div class="analysis-box"><b>解析：</b>擔任民政長官、主導人口普查並奠定殖民基礎者為後藤新平。兒玉源太郎是他的上司（總督）、八田與一為水利工程師、小林躋造是後期推動皇民化的總督。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 10 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">日治三階段依序將總督官職身分排列，下列何者正確？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>武官、文官、武官</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>武官、武官、武官</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>文官、武官、武官</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>文官、武官、文官</span></button></div>
      <div class="analysis-box"><b>解析：</b>第一階段（特殊統治）武裝抗日多，用武官；第二階段（內地延長）受民族自決影響改派文官；第三階段（皇民化）因戰爭需要軍事動員又改回武官。故為武官→文官→武官。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 11 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">由第一階段（特殊統治）轉變為第二階段（內地延長主義）的主要原因為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>臺人武裝抗日不斷</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>臺灣總督頒布六三法</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>民族自決思潮興起</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>推行皇民化運動</span></button></div>
      <div class="analysis-box"><b>解析：</b>第一次世界大戰後，美國總統威爾遜提倡「民族自決」，殖民地民族運動興起，日本因此改採內地延長主義、日臺合一以安撫臺人。武裝抗日、六三法屬第一階段，皇民化屬第三階段。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 12 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">關於「內地延長主義」政策的敘述，下列何者「錯誤」？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>推行時間是在第二次世界大戰結束後</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>臺灣人民仍受到不平等待遇</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>目的之一是安撫臺灣知識份子</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>將臺灣視為日本內地的一部分</span></button></div>
      <div class="analysis-box"><b>解析：</b>內地延長主義推行於一戰後的 1920 年代，並非二戰結束後（二戰後日本已離臺），故此敘述錯誤。臺人待遇仍不平等、政策旨在安撫知識份子、將臺灣視為內地延長，皆為正確描述。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 13 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">「廢除報紙漢文欄、要求臺灣民眾改用日本姓名、強制參拜神社、參加特別志願軍」等措施，發生在日本殖民時期的哪一階段？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>臺灣民主國時期</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>內地延長主義時期</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>殖民地特殊統治時期</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>皇民化運動時期</span></button></div>
      <div class="analysis-box"><b>解析：</b>廢漢文、改日本姓名、參拜神社、志願從軍都是皇民化運動（1937 年中日戰爭後）為使臺人效忠日本、配合戰爭動員所推行的措施。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 14 題</span><span class="q-src">大業</span></div>
      <div class="q-text">資料一「布袋戲皆以日語演出、廢除漢文欄與漢語課」；資料二「臺灣未受日本憲法保障，總督得頒布法律命令」；資料三「總督高喊日臺合一以消弭民族意識」。三則資料按出現順序排列為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>資料二→資料三→資料一</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>資料二→資料一→資料三</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>資料三→資料二→資料一</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>資料一→資料三→資料二</span></button></div>
      <div class="analysis-box"><b>解析：</b>資料二（總督專制、六三法）對應第一階段特殊統治；資料三（日臺合一）對應第二階段內地延長；資料一（禁漢文、日語演出）對應第三階段皇民化。故順序為二→三→一。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 15 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">大毛說新政府設立便所、不能隨地便溺，颱風時「大人」會組織救災，但也監控民間一舉一動。文中「大人」指下列何者？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>憲兵</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>總督</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>保正</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>警察</span></button></div>
      <div class="analysis-box"><b>解析：</b>日治時期臺灣人稱權力極大、深入基層管理生活衛生與治安的警察為「大人」。總督高居統治頂端不直接管地方瑣事，保正是地方推選的協助者，憲兵屬軍事系統。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 16 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">關於日治時期「保甲制度」的敘述，下列何者「不正確」？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>規定十戶為一保，十保為一甲</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>保設「保正」，甲設「甲長」</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>須輔助警察管理地方事務</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>保甲內若有人犯法，眾人也要連帶處罰</span></button></div>
      <div class="analysis-box"><b>解析：</b>保甲制度是「十戶為一甲、十甲為一保」，選項把保、甲的層級寫反，故不正確。保設保正、甲設甲長、輔助警察、連坐處罰皆為正確敘述。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 17 題</span><span class="q-src">林園</span></div>
      <div class="q-text">日治時期臺灣某抗日事件筆記：1.西元 1915 年 2.余清芳 3.日治時期規模最大的武裝抗日事件。此為何事件？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>朱一貴事件</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>西來庵事件</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>霧社事件</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>郭懷一事件</span></button></div>
      <div class="analysis-box"><b>解析：</b>1915 年由余清芳領導、規模最大的漢人武裝抗日是西來庵事件（噍吧哖事件）。朱一貴、郭懷一屬清領與荷治時期；霧社事件是 1930 年原住民抗日。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 18 題</span><span class="q-src">大業</span></div>
      <div class="q-text">綜合資料（新式糖廠壟斷使舊糖廍破產、樟腦開採政策、林野收歸官有）分析，除余清芳以宗教名義煽動外，噍吧哖事件還有什麼補充因素？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>臺灣社會迷信宗教易受煽動</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>總督府理蕃政策失當導致民變</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>總督府忽略經濟政策造成的民生問題</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>總督集大權於一身獨裁專制</span></button></div>
      <div class="analysis-box"><b>解析：</b>資料呈現新式糖廠壓垮舊糖廍、樟腦與林野被收歸官有，斷了地方仕紳與百姓生計，反映經濟政策忽略民生問題。理蕃政策針對原住民、與噍吧哖（漢人）事件無關。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 19 題</span><span class="q-src">仁愛</span></div>
      <div class="q-text">總督佐久間左馬太推動「五年理蕃計畫」，以武力鎮壓原住民，主要是為了取得臺灣哪一項資源？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>紡織品</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>樟腦</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>蔗糖</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>蓬萊米</span></button></div>
      <div class="analysis-box"><b>解析：</b>山區蘊藏大量樟腦與森林資源，樟腦更是當時重要的專賣暴利商品，故五年理蕃計畫以武力壓迫原住民、開發山林以取得樟腦。蔗糖、稻米屬平地農業，紡織非山區資源。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 20 題</span><span class="q-src">林園</span></div>
      <div class="q-text">有關電影《賽德克‧巴萊》所描述事件的整理，何者正確？（乙）發生於 1930 年霧社（今南投仁愛鄉）（丙）領導人為賽德克族的莫那魯道（丁）日本先派軍警鎮壓，後以飛機轟炸、施放毒氣造成原住民死傷慘重</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>甲乙丙丁戊皆對</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>乙丙丁</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>乙丙戊</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>甲乙丙丁</span></button></div>
      <div class="analysis-box"><b>解析：</b>乙（時地）、丙（領導人莫那魯道）、丁（軍警鎮壓、飛機毒氣）皆正確。甲誤在把「茶葉」列為被掠奪資源（霧社主因是勞役與山林資源，非茶葉），戊誤在說事後「改派文官總督」（霧社事件時已是武官總督時期）。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 21 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">1930 年總督府明訂《高砂族集體移住十年計畫》，將原住民遷至近山地區並教導定耕。促使總督推此政策的原因為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>中日戰爭爆發需要原住民參戰</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>民族自決思潮盛行、重視原住民居住自主</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>西來庵事件影響、擔心原漢聯合叛亂</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>因霧社事件的刺激，需調整理蕃政策</span></button></div>
      <div class="analysis-box"><b>解析：</b>1930 年霧社事件震驚國際後，總督府重新檢討理蕃政策，將原住民集體遷移、加強教化管理。中日戰爭在 1937 年尚未爆發，民族自決與尊重自主不符高壓遷徙，西來庵屬漢人事件。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 22 題</span><span class="q-src">仁愛</span></div>
      <div class="q-text">1896～1906 年臺灣財政收入逐年增加、日本補助逐年減少，最主要原因為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>日月潭發電所完工帶動工業</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>鴉片、樟腦等列為專賣，由政府獨佔經營</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>臺灣銀行發行統一貨幣，金融整頓有成</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>基隆、高雄港擴建完成促進運輸</span></button></div>
      <div class="analysis-box"><b>解析：</b>後藤新平推動鴉片、樟腦、菸酒等專賣，官方獨佔獲取暴利，是財政由虧轉盈、收入大增的最主要原因。日月潭發電所要到 1934 年才完工，時間不符；統一貨幣與港口建設影響較間接。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 23 題</span><span class="q-src">仁愛</span></div>
      <div class="q-text">1905 年總督府田賦稅收比 1896 年多了近 4 倍，造成田賦大幅增長的原因為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>平定抗日勢力、治安漸安定</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>日本移民漸多、在臺拓墾新地</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>實施土地調查、確定土地所有權</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>將原住民遷徙山下、開發土地</span></button></div>
      <div class="analysis-box"><b>解析：</b>總督府進行土地調查，清丈出大量過去隱匿未登記的田地並確定所有權，使可課稅田地大增、田賦稅收大幅成長。治安、移民、原住民遷徙對田賦的直接影響均不如土地調查。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 24 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">臺灣某種農產品加工廠多分布於中南部平原。此種在原料採取區域制度下、由新式糖廠加工出口的商品最可能是下列何者？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>茶葉</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>樟腦</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>咖啡</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>蔗糖</span></button></div>
      <div class="analysis-box"><b>解析：</b>新式糖廠與「原料採取區域」制度針對的是蔗糖，加工廠集中於中南部產蔗平原。茶葉、樟腦主要產於北部與丘陵山區，咖啡並非當時大宗出口加工品。</div>
    </div>
<div class="blk q-blk" data-ans="2">
      <div class="q-head"><span class="q-num">第 25 題</span><span class="q-src">大業</span></div>
      <div class="q-text">總督府公告：全島蔗作區劃分區域，蔗農不得越區出售甘蔗，只能賣給指定區域內糖廠，收購價由糖廠決定。此「原料採取區域」政策的主要目的可能為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>使甘蔗有固定買主、保障蔗農利益</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>確保砂糖供給以滿足日本需求</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>確保糖廠原料供給與價格、保障資本家利益</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>簡化貿易流程</span></button></div>
      <div class="analysis-box"><b>解析：</b>限定蔗農只能賣給指定糖廠、價格由糖廠決定，實際上是確保糖廠（資本家）穩定取得便宜原料、保障其利益，蔗農反而被剝削。並非保障蔗農，俗諺「種甘蔗予會社磅」即諷刺此事。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 26 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">俗諺「第一戇，種甘蔗予會社磅」與漫畫「三個保正八十斤」，主要在諷刺何事？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>甘蔗產量不如蓬萊米</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>警察干預民眾生活</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>製糖工廠機械設備老舊</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>製糖會社磅秤造假、欺壓蔗農</span></button></div>
      <div class="analysis-box"><b>解析：</b>三個保正一起上磅竟只有八十斤，諷刺製糖會社磅秤動手腳、低報甘蔗重量以剝削蔗農。臺灣雖為糖業王國，蔗農待遇卻未改善，這正是俗諺的含意。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 27 題</span><span class="q-src">誠正</span></div>
      <div class="q-text">1927 年臺北市臺灣人與日本人每天工資比較表顯示日人工資明顯高於臺人。這最能說明下列何事？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>工業日本、農業臺灣</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>工業臺灣、農業南洋</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>武官總督統治的嚴酷</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>臺灣人與日本人之間的差別待遇仍然存在</span></button></div>
      <div class="analysis-box"><b>解析：</b>同工不同酬的工資差距，反映即使在內地延長主義（日臺合一、一視同仁）口號下，臺灣人仍未獲得與日本人相同的待遇，差別待遇依舊存在。與經濟口號、武官嚴酷無直接關係。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 28 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">1920 年代引進新耕作技術、改良臺灣稻米品種，被稱為「蓬萊米之父」的是何人？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>磯永吉</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>後藤新平</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>八田與一</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>唐景崧</span></button></div>
      <div class="analysis-box"><b>解析：</b>磯永吉改良育成適合日本人口味的蓬萊米，被稱為「蓬萊米之父」。後藤新平是民政長官、八田與一建嘉南大圳、唐景崧是臺灣民主國大總統，皆非育種者。</div>
    </div>
<div class="blk q-blk" data-ans="3">
      <div class="q-head"><span class="q-num">第 29 題</span><span class="q-src">大業</span></div>
      <div class="q-text">八田與一興建的水利工程，關於它的介紹下列何者「有誤」？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>設計者是八田與一</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>水源來自烏山頭水庫</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>完工後增加臺灣蓬萊米產量</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>最初修築目的是為南進政策奠定基礎</span></button></div>
      <div class="analysis-box"><b>解析：</b>嘉南大圳（1930 年完工）目的是改善嘉南平原灌溉、增加稻米（含蓬萊米）與農作產量，屬農業建設，與 1930 年代後期才推動的南進政策無關，故此敘述有誤。</div>
    </div>
<div class="blk q-blk" data-ans="1">
      <div class="q-head"><span class="q-num">第 30 題</span><span class="q-src">台南復興</span></div>
      <div class="q-text">日月潭水力發電工程竣工，是考量下列哪一項因素的發展？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>糖業發展停滯</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>配合發展南進政策（工業化）</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>方便開發山林資源</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>稻米產量不足</span></button></div>
      <div class="analysis-box"><b>解析：</b>1934 年日月潭發電所完工提供大量電力，配合日本南進政策推動臺灣工業化（如鋁業、化學工業）。與糖業停滯、開發山林、稻米不足無關。</div>
    </div>
<div class="blk q-blk" data-ans="0">
      <div class="q-head"><span class="q-num">第 31 題</span><span class="q-src">林園</span></div>
      <div class="q-text">1930 年代以後總督府在臺灣積極推動工業化，主要目的為何？</div>
      <div class="options"><button class="opt-btn" data-oi="0" onclick="pick(this)"><span class="opt-letter">Ａ</span><span>使臺灣成為南進的補給基地</span></button><button class="opt-btn" data-oi="1" onclick="pick(this)"><span class="opt-letter">Ｂ</span><span>改善臺灣經濟、提升人民生活水準</span></button><button class="opt-btn" data-oi="2" onclick="pick(this)"><span class="opt-letter">Ｃ</span><span>使臺灣成為日本國內工業零組件供應地</span></button><button class="opt-btn" data-oi="3" onclick="pick(this)"><span class="opt-letter">Ｄ</span><span>有效利用臺灣資源、促進臺灣工業發展</span></button></div>
      <div class="analysis-box"><b>解析：</b>1937 年後日本推南進政策，將臺灣打造為南進東南亞的軍需與補給基地，故積極工業化。工業化是為日本侵略需要服務，並非為改善臺灣人生活或發展臺灣本身。</div>

<div class="blk q-blk" data-ans="2">

      <div class="analysis-box"><b>解析：</b>1905 年人口普查目的在全面掌握臺灣人口與社會實況，作為因地制宜統治的基礎。皇民化、中日戰爭在 1937 年後才發生，日臺合一屬 1920 年代，時序皆晚於 1905 年。</div>

      <div class="analysis-box"><b>解析：</b>五年理蕃計畫是佐久間左馬太於 1910 年推動（1910～1915），並非 1920 年，故此敘述有誤。開發林木、強迫勞役、教日語灌輸文化皆為理蕃政策的實際內容。</div>

const MODE = window.__MODE__||'screen';

// ── 互動 ──
function reveal(el){if(el.classList.contains('show'))return;el.classList.add('show');el.textContent=el.dataset.ans;}
function revealAll(){document.querySelectorAll('.blank').forEach(b=>{b.classList.add('show');b.textContent=b.dataset.ans;});
  document.querySelectorAll('.q-blk').forEach(q=>showQ(q));}
function hideAll(){document.querySelectorAll('.blank').forEach(b=>{b.classList.remove('show');b.textContent='？';});
  document.querySelectorAll('.opt-btn').forEach(o=>{o.classList.remove('correct','wrong');o.disabled=false;});
  document.querySelectorAll('.analysis-box').forEach(a=>a.classList.remove('show'));}
function showQ(q){const ans=+q.dataset.ans;q.querySelectorAll('.opt-btn').forEach(o=>{const oi=+o.dataset.oi;o.disabled=true;if(oi===ans)o.classList.add('correct');});q.querySelector('.analysis-box').classList.add('show');}
function pick(btn){const q=btn.closest('.q-blk');if(btn.disabled)return;const ans=+q.dataset.ans,oi=+btn.dataset.oi;
  q.querySelectorAll('.opt-btn').forEach(o=>o.disabled=true);
  if(oi===ans){btn.classList.add('correct');}else{btn.classList.add('wrong');q.querySelector('[data-oi="'+ans+'"]').classList.add('correct');}
  q.querySelector('.analysis-box').classList.add('show');q.dataset.done=oi===ans?'1':'0';}
function grade(){const qs=[...document.querySelectorAll('.q-blk')];let done=0,ok=0;
  qs.forEach(q=>{if(q.dataset.done!==undefined){done++;if(q.dataset.done==='1')ok++;}});
  const bar=document.getElementById('scorebar');bar.style.display='block';
  bar.textContent='已作答 '+done+' / '+qs.length+' 題　答對 '+ok+' 題'+(done?('　得分 '+Math.round(ok/qs.length*100)+' 分'):'');}

// ── A4 分頁：像素預算法（先在 #measure 量好每塊高度，再依固定預算裝頁）──
// srcNodes 目前位於 #measure 內（寬度與 sheet-body 相同），量測後搬入各 .sheet
function layout(srcNodes, footLabel){
  const doc=document.getElementById('doc');
  // 先量每塊高度（含上下 margin）
  const H=srcNodes.map(n=>{const st=getComputedStyle(n);
    return n.offsetHeight+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0);});
  doc.innerHTML='';
  function newSheet(){const s=document.createElement('div');s.className='sheet';
    const b=document.createElement('div');b.className='sheet-body';
    const f=document.createElement('div');f.className='sheet-foot';
    s.appendChild(b);s.appendChild(f);doc.appendChild(s);return {s,b,f};}
  let cur=newSheet();
  // 一頁可用高度（px）；若量到異常小（窄視窗觸發 RWD）則用 A4 預設值保底
  const cH=cur.b.clientHeight;
  const AVAIL=cH>200?cH:1000;
  let used=0;
  for(let i=0;i<srcNodes.length;i++){
    // keep-next：標題與下一塊視為一體，避免標題落在頁尾
    if(srcNodes[i].classList.contains('keep-next') && i+1<srcNodes.length){
      const pair=H[i]+H[i+1];
      if(used>0 && used+pair>AVAIL){cur=newSheet();used=0;}
      cur.b.appendChild(srcNodes[i]);cur.b.appendChild(srcNodes[i+1]);
      used+=pair;i++;continue;
    }
    if(used>0 && used+H[i]>AVAIL){cur=newSheet();used=0;}
    cur.b.appendChild(srcNodes[i]);used+=H[i];
  }
  const sheets=[...doc.querySelectorAll('.sheet')];const M=sheets.length;
  sheets.forEach((s,idx)=>{s.querySelector('.sheet-foot').innerHTML=
    '<span>'+footLabel+'</span><span>第 '+(idx+1)+' 頁　共 '+M+' 頁</span>';});
}

const FOOT='國一歷史第二冊　第一次段考複習';
document.addEventListener('DOMContentLoaded',()=>{
  const meas=document.getElementById('measure');
  meas.innerHTML=RAW;
  if(MODE==='answer'){
    // 解答版：先在量測容器內展開答案＋解析，再依展開後高度分頁
    document.body.classList.add('print-answer');
    meas.querySelectorAll('.blank').forEach(b=>{b.classList.add('show');b.textContent=b.dataset.ans;});
    meas.querySelectorAll('.analysis-box').forEach(a=>a.classList.add('show'));
    meas.querySelectorAll('.q-blk').forEach(q=>{const ans=+q.dataset.ans;
      q.querySelectorAll('.opt-btn').forEach(o=>{o.disabled=true;if(+o.dataset.oi===ans)o.classList.add('correct');});});
    layout([...meas.children], FOOT+'（解答版）');
  }else{
    if(MODE==='student')document.body.classList.add('print-student');
    layout([...meas.children], FOOT);
  }
  meas.innerHTML='';
});
</script>

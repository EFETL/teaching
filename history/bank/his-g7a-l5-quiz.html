<script>
const QS=[{"stem": "十八世紀以後，中國大陸東南沿海地區的居民大量渡海來臺，主要原因是什麼？", "opts": [["A", "引進西方宗教"], ["B", "人口增加、謀生不易"], ["C", "政府強制移民"], ["D", "逃避戰亂徵兵"]], "ans": "B", "exp": "三版課本皆指出，十八世紀以後中國大陸人口增加、謀生不易，福建、廣東居民因而渡海來臺謀生，從事土地開墾與水利建設。"}, {"stem": "清帝國時期，漢人若要合法開墾政府認定的無主土地，須向官府申請下列何種文件？", "opts": [["A", "路引"], ["B", "地契"], ["C", "戶籍謄本"], ["D", "墾照"]], "ans": "D", "exp": "移民可向原住民承租土地，也可向官府申請「墾照」（開墾許可證）進行合法開墾。"}, {"stem": "清代臺灣土地開墾需要龐大資金與人力，因此移民大多採取下列何種方式進行拓墾？", "opts": [["A", "合資"], ["B", "個人單獨開墾"], ["C", "政府全額資助"], ["D", "向外國銀行貸款"]], "ans": "A", "exp": "由於開墾需要大筆資金與人力，移民大多以合資方式共同拓墾，也因此留下許多與股份分配相關的地名，如臺南「七股」、苗栗「頭份」。"}, {"stem": "「金廣福」是由哪兩地移民合股成立、開墾新竹、苗栗一帶土地的拓墾組織？", "opts": [["A", "泉州、漳州"], ["B", "福建、浙江"], ["C", "福建、廣東"], ["D", "廣東、廣西"]], "ans": "C", "exp": "19世紀中，廣東、福建的移民合股成立「金廣福」，向官府申請墾照後，共同開墾新竹、苗栗一帶。"}, {"stem": "18世紀末，率眾進入蛤仔難（今宜蘭）開墾的漢人領袖是誰？", "opts": [["A", "施世榜"], ["B", "吳沙"], ["C", "張達京"], ["D", "郭錫瑠"]], "ans": "B", "exp": "除了合法申請墾照外，也有漢人不顧禁令越界開墾，18世紀末吳沙即率眾進入蛤仔難（今宜蘭）開墾。"}, {"stem": "清帝國雖然多次重新劃定「番界」，但仍無法完全阻止下列何種現象？", "opts": [["A", "漢人越界開墾"], ["B", "原住民出草馘首"], ["C", "官府濫收賦稅"], ["D", "海盜劫掠商船"]], "ans": "A", "exp": "課文明確提到清帝國雖數度重定番界，仍無法阻止漢人越界進入番界開墾。"}, {"stem": "清代臺灣人開墾土地後，為了灌溉水稻等作物，接下來最迫切需要興建下列何者？", "opts": [["A", "城牆"], ["B", "廟宇"], ["C", "官署"], ["D", "水利設施（水圳）"]], "ans": "D", "exp": "早期農業以水稻種植最重要，開墾者為獲得灌溉水源，常合資興建水利設施，這也擴大了拓墾範圍。"}, {"stem": "下列哪一條水圳是由施世榜於康熙年間興建、灌溉彰化平原，且是清代灌溉範圍最大的水利設施？", "opts": [["A", "瑠公圳"], ["B", "貓霧捒圳"], ["C", "八堡圳"], ["D", "曹公圳"]], "ans": "C", "exp": "八堡圳於18世紀初（康熙年間）由施世榜興建，灌溉彰化平原，是清代規模最大的水圳。"}, {"stem": "由郭錫瑠父子於乾隆年間興建、灌溉臺北盆地的重要水圳是？", "opts": [["A", "八堡圳"], ["B", "瑠公圳"], ["C", "曹公圳"], ["D", "貓霧捒圳"]], "ans": "B", "exp": "瑠公圳於18世紀中（乾隆年間）由郭錫瑠父子興建，是臺北地區最重要的灌溉渠道。"}, {"stem": "貓霧捒圳的興建有何特殊之處？", "opts": [["A", "由官府全額出資興建"], ["B", "灌溉範圍居全臺之冠"], ["C", "興建於道光年間"], ["D", "由漢人與原住民合作興建"]], "ans": "D", "exp": "貓霧捒圳（雍正年間，張達京主導）是漢人與原住民合作修築水圳的代表例子，灌溉臺中盆地。"}, {"stem": "曹公圳是由哪一位官員主導興建、灌溉今高雄地區？", "opts": [["A", "曹謹"], ["B", "施世榜"], ["C", "張達京"], ["D", "郭錫瑠"]], "ans": "A", "exp": "曹公圳於19世紀前期（道光年間）由鳳山知縣曹謹主導興建，特色是官方主導的水利工程。"}, {"stem": "依興建時間先後排列，下列水圳何者最早完工？", "opts": [["A", "瑠公圳"], ["B", "曹公圳"], ["C", "八堡圳"], ["D", "以上同時完工"]], "ans": "C", "exp": "八堡圳完工於康熙年間（約18世紀初，課本標示1719年），早於瑠公圳（乾隆年間）與曹公圳（道光年間）。"}, {"stem": "張達京與岸裡社首領潘敦仔合作推行的「割地換水」，其內容主要是指？", "opts": [["A", "漢人繳稅換取兵役豁免"], ["B", "原住民出兵協助平亂換取官職"], ["C", "商人捐款換取免稅"], ["D", "漢人出資興建水圳，原住民則割讓土地以換取水源"]], "ans": "D", "exp": "張達京為首的漢人提供資金、技術興建水圳，岸裡社則割讓土地以換取穩定水源，雙方訂立契約並報請官府承認。"}, {"stem": "依清帝國時期的族群分類標準，文中提及已學習漢人農耕技術、願意繳納賦稅的「岸裡社」應屬於下列哪個族群？", "opts": [["A", "生番"], ["B", "熟番"], ["C", "化外之民"], ["D", "客家人"]], "ans": "B", "exp": "岸裡社已學習漢人的飲食起居、農業技術，並願意向官府繳納賦稅，符合清帝國分類中「熟番」（已歸化、納餉服役的原住民）的特徵。"}, {"stem": "清代臺灣水利設施的興築，除了擴大拓墾範圍外，還帶來下列哪項直接影響？", "opts": [["A", "提高米、糖等農作物產量"], ["B", "使原住民全數遷離平原"], ["C", "加速臺灣建省"], ["D", "促成外國勢力入侵"]], "ans": "A", "exp": "水圳興築不僅擴大拓墾範圍，也提高了米、糖等農作物的產量，使臺灣農業得以自給並外銷。"}, {"stem": "清帝國統治初期，官府指定與福建廈門對渡通航的正口（正港）是？", "opts": [["A", "安平"], ["B", "打狗"], ["C", "鹿耳門"], ["D", "淡水"]], "ans": "C", "exp": "清廷最初僅指定鹿耳門為對渡港口，與廈門對渡通航，並設官管理，帶動臺灣府（今臺南）的經濟發展。"}, {"stem": "官府之所以指定鹿耳門為對渡港口，主要是因為當地具備下列哪項條件？", "opts": [["A", "水深港闊，便於大型船艦停泊"], ["B", "盛產稻米可就近徵糧"], ["C", "鄰近原住民部落便於管理"], ["D", "臺南（府城）已發展成頗具規模的城鎮，且清廷官署多設於此"]], "ans": "D", "exp": "十七世紀以來臺南已發展成頗具規模的城鎮，清廷主要官署也位在臺南，官府因此指定臺南外海的鹿耳門為對渡港口，並非因為當地水道寬深（事實上鹿耳門水道狹窄水淺）。"}, {"stem": "隨著臺灣中、北部逐漸開發，清廷陸續開放下列哪兩個港口為對渡港口？", "opts": [["A", "鹿港、八里坌"], ["B", "安平、打狗"], ["C", "淡水、雞籠"], ["D", "高雄、基隆"]], "ans": "A", "exp": "隨著貿易量與移民增多，清廷陸續開放鹿港（今彰化縣鹿港鎮）、八里坌（今新北市八里區）作為對渡港口。"}, {"stem": "「一府二鹿三艋舺」這句諺語，反映的是清代臺灣哪一種歷史現象？", "opts": [["A", "科舉考試的名次排行"], ["B", "由南向北拓墾與商貿發展的歷程"], ["C", "三大宗教信仰中心"], ["D", "三大水利工程的規模"]], "ans": "B", "exp": "府城、鹿港、艋舺依序因對渡貿易而興起，「一府二鹿三艋舺」反映臺灣拓墾與商貿由南向北發展的歷程。"}, {"stem": "「一府二鹿三艋舺」中的「二鹿」指的是今日何處？", "opts": [["A", "臺南市"], ["B", "臺北市萬華區"], ["C", "彰化縣鹿港鎮"], ["D", "新北市八里區"]], "ans": "C", "exp": "「二鹿」指鹿港，即今彰化縣鹿港鎮，清代曾有全臺最長的商店街「五福街」（不見天街）。"}, {"stem": "八里坌開港初期，貿易最繁榮的市街原本在新莊，後來因河道淤積，商業重心轉移到下列何處？", "opts": [["A", "艋舺"], ["B", "鹿港"], ["C", "大稻埕"], ["D", "安平"]], "ans": "A", "exp": "八里坌開放對渡後，初期以新莊貿易最繁榮，後來河道淤積，商人轉往艋舺交易，使艋舺興起為北部商業中心。"}, {"stem": "開港（十九世紀中期）以前，臺灣商人主要以稻米、蔗糖等農產品，換取中國大陸的哪些商品？", "opts": [["A", "黃金、白銀"], ["B", "鴉片、軍火"], ["C", "茶葉、樟腦"], ["D", "紡織品、藥材等日用品"]], "ans": "D", "exp": "開港前臺灣手工業不發達，商人以米、糖換取中國大陸的紡織品、藥材等生活日用品；鴉片是開港通商後才成為主要進口商品，並非開港前。"}, {"stem": "商人為維護利益、避免惡性競爭而成立的商業組織稱為什麼？", "opts": [["A", "公館"], ["B", "會館"], ["C", "郊（行郊）"], ["D", "幫會"]], "ans": "C", "exp": "商人為避免惡性競爭、維護共同利益，成立「郊」（行郊）這種商業組織；「會館」則是郊商聚會辦公的場所，兩者不可混淆。"}, {"stem": "「泉郊」、「廈郊」是依據下列哪種方式組成的商業團體？", "opts": [["A", "依姓氏宗親劃分"], ["B", "依貿易地區（如泉州、廈門）劃分"], ["C", "依信仰宗教劃分"], ["D", "依船隻噸位劃分"]], "ans": "B", "exp": "早期成立的「郊」多以貿易地作為名稱，如專與泉州做生意的商人組成泉郊，與廈門有大宗貿易的商人組成廈郊。"}, {"stem": "「糖郊」、「布郊」、「米郊」是依據下列哪種方式組成的商業團體？", "opts": [["A", "依貿易地區劃分"], ["B", "依出身省籍劃分"], ["C", "依信仰宗教劃分"], ["D", "依經營商品（如糖、布、米）劃分"]], "ans": "D", "exp": "隨著商業發展，經營同類商品的商人也組織起「郊」，如糖郊、布郊、米郊等，是依經營商品種類劃分。"}, {"stem": "郊商除了從事貿易活動，在地方上還經常扮演下列哪種角色？", "opts": [["A", "主持祭祀、排解糾紛、捐資修建公共設施"], ["B", "擔任地方官員審理案件"], ["C", "負責徵收全臺賦稅"], ["D", "統籌科舉考試事務"]], "ans": "A", "exp": "郊商除商業功能外，也參與地方事務，如主持祭祀、排解糾紛、修建公共設施等，成為安定社會的力量。"}, {"stem": "臺南「開基武廟」的重修碑文記載，該廟宇曾獲得下列哪個商業組織的大筆捐款？", "opts": [["A", "鹿港泉郊"], ["B", "艋舺廈郊"], ["C", "府城三郊"], ["D", "大稻埕茶郊"]], "ans": "C", "exp": "臺南的「府城三郊」是臺灣最早的郊商組織，除商業活動外也積極投入地方建設，開基武廟碑文記錄了三郊重修廟宇時的大筆捐款。"}, {"stem": "十九世紀中期，清帝國因為在下列哪場戰爭中失利，被迫開放臺灣港口通商？", "opts": [["A", "鴉片戰爭"], ["B", "英法聯軍之役"], ["C", "甲午戰爭"], ["D", "中法戰爭"]], "ans": "B", "exp": "清帝國在英法聯軍之役戰敗後被迫簽訂條約，開放臺灣港口通商，使臺灣與外國接觸日漸頻繁。"}, {"stem": "開港通商後，清帝國開放臺灣哪四個港口作為通商口岸？", "opts": [["A", "鹿耳門、鹿港、八里坌、艋舺"], ["B", "高雄、基隆、花蓮、宜蘭"], ["C", "澎湖、金門、馬祖、東引"], ["D", "淡水、雞籠、安平、打狗"]], "ans": "D", "exp": "十九世紀中期，清帝國被迫開放淡水、雞籠（今基隆）、安平、打狗（今高雄）為通商口岸，這四個港口與先前對渡貿易時期的鹿耳門、鹿港、八里坌不同。"}, {"stem": "開港通商後，外國商人紛紛在通商口岸設立下列何種機構，經營進出口貿易？", "opts": [["A", "洋行"], ["B", "總督府"], ["C", "海關"], ["D", "郊行"]], "ans": "A", "exp": "開港後外國商人來臺設立「洋行」，以資金與運輸優勢主導臺灣進出口貿易，如英商德記洋行即設立於安平。"}, {"stem": "開港通商後，臺灣主要的進口商品為鴉片與下列何者？", "opts": [["A", "茶葉"], ["B", "紡織品"], ["C", "樟腦"], ["D", "蔗糖"]], "ans": "B", "exp": " function pick(card,btn,L,q){

    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

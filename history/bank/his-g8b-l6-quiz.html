em": "韓戰期間，指揮以美國為首的聯合國部隊、協助南韓作戰的美國將領是下列何人？", "opts": [["A", "尼克森"], ["B", "麥克阿瑟"], ["C", "艾森豪"], ["D", "杜魯門"]], "ans": "B", "exp": "麥克阿瑟率領聯合國部隊支援南韓作戰，是韓戰期間重要的軍事指揮官。"}, {"stem": "韓戰期間遭聯合國軍隊俘虜的中國士兵中，有一萬四千多人後來選擇前往下列何地？", "opts": [["A", "臺灣"], ["B", "日本"], ["C", "蘇聯"], ["D", "香港"]], "ans": "A", "exp": "韓戰期間許多中國士兵遭俘虜，其中約一萬四千多人選擇不返回中國大陸，而前往臺灣，被稱為「反共義士」。"}, {"stem": "中華民國政府將韓戰期間首批「反共義士」抵達臺灣的日子，訂定為下列哪一個紀念日？", "opts": [["A", "光復節"], ["B", "反共抗俄紀念日"], ["C", "國軍紀念日"], ["D", "一二三自由日"]], "ans": "D", "exp": "西元1954年1月23日首批「反共義士」抵達臺灣，這一天後來被定為「一二三自由日」。"}, {"stem": "韓戰的爆發對當時的中華民國政府產生下列何種影響？", "opts": [["A", "使中華民國喪失聯合國席次"], ["B", "使美國提高臺灣的戰略地位，並提供美援"], ["C", "導致中華民國與美國斷交"], ["D", "促使中華民國加入東協"]], "ans": "B", "exp": "韓戰爆發後，美國重新評估亞太地區的外交策略，提高臺灣在其國際政策中的重要性，並提供臺灣軍事、經濟及外交上的「美援」。"}, {"stem": "美國與日本為強化雙方關係，於西元哪一年簽訂「美日安保條約」？", "opts": [["A", "1950年"], ["B", "1972年"], ["C", "1960年"], ["D", "1979年"]], "ans": "C", "exp": "西元1960年，美、日兩國簽訂美日安保條約，強化雙方軍事同盟關係。"}, {"stem": "依據「美日安保條約」的內容，美、日雙方各自承擔下列哪一項義務？", "opts": [["A", "美國有防衛日本的義務，日本則提供美軍基地"], ["B", "日本負責出兵協防美國本土"], ["C", "美國提供日本無償軍備，日本不負擔任何義務"], ["D", "兩國共同出兵協防臺灣"]], "ans": "A", "exp": "條約中規定美國有防衛日本的義務，日本則有提供美軍基地等義務，強化了美日軍事同盟關係。"}, {"stem": "下列何者是帶動戰後日本經濟快速成長、被視為「日本經濟奇蹟」開端的重要因素？", "opts": [["A", "東協的成立"], ["B", "韓戰期間美國向日本大量採購軍需物資（特需）"], ["C", "越戰爆發"], ["D", "中日建交"]], "ans": "B", "exp": "韓戰期間，美國基於戰略考量，向日本企業大量訂購武器、車輛、服裝、食品等軍需物資，稱為「特需」，帶動日本經濟快速成長，被視為「日本經濟奇蹟」的開端。"}, {"stem": "課本中所稱韓戰期間日本獲得的「特需」，其意義為下列何者？", "opts": [["A", "日本政府特別發放的社會福利"], ["B", "美國給予日本的無償經濟援助金"], ["C", "日本對外銷售武器的收入"], ["D", "美國因戰略考量向日本企業大量採購軍需物資"]], "ans": "D", "exp": "「特需」指美國因韓戰的戰略需求，向日本企業大量訂購武器、車輛、服裝、食品等軍需物資，為日本帶來龐大訂單。"}, {"stem": "根據課本描述，西元1951年日本因「特需」訂單，經濟成長率達到約下列何者？", "opts": [["A", "12%"], ["B", "3%"], ["C", "60%"], ["D", "77%"]], "ans": "A", "exp": "課本提到1951年日本的經濟成長率達12%，此一時期被視為「日本經濟奇蹟」的開端。"}, {"stem": "課本所稱的「日本經濟奇蹟」，其開端主要與下列哪一場戰爭的爆發密切相關？", "opts": [["A", "越戰"], ["B", "中日戰爭"], ["C", "韓戰"], ["D", "波灣戰爭"]], "ans": "C", "exp": "韓戰期間日本因承接美國大量軍需訂單（特需）而經濟快速成長，此一時期被視為「日本經濟奇蹟」的開端。"}, {"stem": "中華人民共和國建國初期，在外交上採取下列何種路線？", "opts": [["A", "親美路線"], ["B", "完全中立不結盟"], ["C", "優先發展與日本的關係"], ["D", "「一邊倒」的親蘇路線"]], "ans": "D", "exp": "中華人民共和國建國初期採取「一邊倒」的親蘇路線，對抗以美國為首的反共陣營，蘇聯也提供大量資金、技術與人才援助。"}, {"stem": "下列何者是造成1950年代末期以後中、蘇兩國關係逐漸惡化的原因？", "opts": [["A", "蘇聯派兵協助臺灣"], ["B", "中國加入東南亞公約組織"], ["C", "兩國因理念分歧，並於1969年爆發邊界武裝衝突"], ["D", "蘇聯支持中華民國政府"]], "ans": "C", "exp": "1950年代末期，中、蘇兩國因對共產主義理念分歧等問題關係惡化，蘇聯撤銷援助；1969年更因邊界領土糾紛爆發武裝衝突，關係降至冰點。"}, {"stem": "下列何者最能代表中、蘇兩國關係走向正常化的重要事件？", "opts": [["A", "西元1950年中蘇簽訂友好同盟條約"], ["B", "西元1989年蘇聯領袖戈巴契夫訪問北京"], ["C", "西元1969年珍寶島事件"], ["D", "西元1972年尼克森訪問中國"]], "ans": "B", "exp": "鄧小平推行改革開放後致力改善與蘇聯的緊張關係，西元1989年蘇聯領袖戈巴契夫訪問北京，中蘇雙方恢復正常往來。"}, {"stem": "西元1971年促成中、美兩國展開接觸的「乒乓外交」，其起因與下列何者有關？", "opts": [["A", "世界桌球錦標賽期間中、美選手的偶然互動"], ["B", "雙方外交部長會談"], ["C", "聯合國安理會決議"], ["D", "兩國元首互訪"]], "ans": "A", "exp": "1971年世界桌球錦標賽期間，美國選手因故搭上中國隊巴士，中國選手主動與其交流並贈禮，這一插曲促成中、美兩國桌球隊互訪，開啟外交接觸的契機，被稱為「乒乓外交」。"}, {"stem": "「乒乓外交」一詞主要用來形容下列何種現象？", "opts": [["A", "中、美兩國以桌球比賽決定外交勝負"], ["B", "蘇聯利用桌球比賽拉攏中國"], ["C", "藉由民間體育交流，帶動兩國高層外交關係的突破"], ["D", "東協以桌球賽促進區域整合"]], "ans": "C", "exp": "中、美兩國桌球隊互訪，被稱為「小球推動大球」的「乒乓外交」，意指藉由民間體育交流的契機，進而帶動兩國高層外交關係的突破與改善。"}, {"stem": "美國總統尼克森正式訪問中國，登上長城留影，是在西元哪一年？", "opts": [["A", "1972年"], ["B", "1950年"], ["C", "1960年"], ["D", "1971年"]], "ans": "A", "exp": "西元1972年，美國總統尼克森訪問中國，並登上長城留影，象徵中、美關係的重大突破。"}, {"stem": "中華人民共和國與美國正式建立外交關係，是在西元哪一年？", "opts": [["A", "1971年"], ["B", "1972年"], ["C", "1989年"], ["D", "1979年"]], "ans": "D", "exp": "隨著中、美關係持續改善，兩國於西元1979年正式建立外交關係。"}, {"stem": "隨著中、美關係逐漸改善並正式建交，對中華民國造成下列何種直接影響？", "opts": [["A", "中華民國順利加入東協"], ["B", "中華民國面臨退出聯合國、與美國斷交等外交挫折"], ["C", "中華民國與蘇聯建交"], ["D", "中華民國經濟因此快速起飛"]], "ans": "B", "exp": "隨著支持中華人民共和國的國家日益增加、中、美關係改善，中華民國陸續面臨退出聯合國、與美國斷交等外交上的重大挫折。"}, {"stem": "中華人民共和國取得聯合國「中國代表權」、中華民國被迫退出聯合國，是在西元哪一年？", "opts": [["A", "1971年"], ["B", "1969年"], ["C", "1979年"], ["D", "1989年"]], "ans": "A", "exp": "隨著中、美關係改善及國際情勢變化，中華人民共和國於西元1971年取得聯合國的中國代表權，中華民國因而退出聯合國。"}, {"stem": "越南脫離法國殖民統治，是在西元哪一年？", "opts": [["A", "1945年"], ["B", "1950年"], ["C", "1954年"], ["D", "1961年"]], "ans": "C", "exp": "西元1954年，越南脫離法國的殖民統治，同年並依協議分裂為南、北越。"}, {"stem": "越南在脫離法國殖民統治後分裂為南、北越，此後雙方的政治立場分別受到下列何者的支持？", "opts": [["A", "南越由蘇聯扶植，北越由美國援助"], ["B", "南、北越皆由聯合國共同扶持"], ["C", "南、北越皆宣布加入東南亞公約組織"], ["D", "南越由美國扶植，北越由蘇聯、中共援助"]], "ans": "D", "exp": "越南分裂後，美國扶植南越政權以防堵共產勢力擴張，而蘇聯與中共則援助由共產黨控制的北越，雙方隨後爆發越戰。"}, {"stem": "美國自1960年代起派兵介入越南戰事，其主要考量為下列何者？", "opts": [["A", "協助越南發展觀光產業"], ["B", "防堵北越共產勢力擴張，避免骨牌效應"], ["C", "回應聯合國的出兵決議"], ["D", "爭奪越南的石油資源"]], "ans": "B", "exp": "美國擔心若北越共產勢力持續擴張，會如骨牌般引發鄰近東南亞國家相繼赤化，因此自1960年代起派兵援助南越，介入越戰。"}, {"stem": "美國正式派兵參與越戰，主要是從下列哪一個時期開始？", "opts": [["A", "1950年代初期"], ["B", "1970年代末期"], ["C", "1960年代"], ["D", "1980年代"]], "ans": "C", "exp": "1961年起，美國為阻止北越共產勢力擴張，開始派兵援助南越，1960年代越戰全面爆發。"}, {"stem": "美國因國內反戰聲浪高漲、戰爭曠日費時且傷亡慘重，於西元哪一年自越南撤軍？", "opts": [["A", "1973年"], ["B", "1954年"], ["C", "1961年"], ["D", "1975年"]], "ans": "A", "exp": "越戰因戰爭曠日費時、美軍傷亡慘重，加上美國國內反戰聲浪高漲，美國於西元1973年自越南撤軍。"}, {"stem": "北越攻占南越、越南實現統一，最可能發生於下列哪一段期間？", "opts": [["A", "1954年"], ["B", "1975年至1976年間"], ["C", "1961年"], ["D", "1989年"]], "ans": "B", "exp": "美軍撤離後，北越持續進攻，西元1975年南越政府敗亡，隔年（1976年）北越正式統一全國，越戰結束。"}, {"stem": "越戰期間，美軍在越南境內噴灑「落葉劑」以清剿叢林中的越共，此舉造成下列何種後果？", "opts": [["A", "使越南迅速實現工業化"], ["B", "促成越南提前統一"], ["C", "加速美軍勝利撤軍"], ["D", "造成嚴重環境破壞並長期危害人民健康"]], "ans": "D", "exp": "美軍在越南噴灑落葉劑意在清除叢林掩護、打擊越共，卻意外造成嚴重的環境傷害，並長期影響當地人民的健康。"}, {"stem": "西元1975年起，大批越南人乘船出海、試圖逃往他國尋求新生活，這群人被稱為下列何者？", "opts": [["A", "越南船民"], ["B", "反共義士"], ["C", "新住民"], ["D", "難僑"]], "ans": "A", "exp": "1975年起，許多越南人基於對共產黨統治的恐懼而乘船逃離家鄉，尋求新生活，被稱為「越南船民」。"}, {"stem": "西元1975年後，大批越南船民主要試圖逃往下列哪些地區？", "opts": [["A", "中國大陸沿海"], ["B", "韓國、日本"], ["C", "澳洲、紐西蘭"], ["D", "香港、新加坡、馬來西亞、印尼等地"]], "ans": "D", "exp": "許多越南船民乘船出海，試圖逃往香港、新加坡、馬來西亞、印尼等鄰近地區，尋求庇護與移民機會。"}, {"stem": "西元1979年，香港因英國政府簽署的國際條約，扮演下列何種角色，成為許多越南船民的首選目的地？", "opts": [["A", "東協創始會員國"], ["B", "東南亞公約組織成員"], ["C", "第一收容港"], ["D", "越南的軍事同盟國"]], "ans": "C", "exp": "1979年，香港因英國政府簽署的國際條約，成為越南難民的「第一收容港」，因而湧入大量越南船民。"}, {"stem": "下列何者最能說明越戰與臺灣之間的密切關係？", "opts": [["A", "臺灣派兵直接參與越戰作戰"], ["B", "我國政府為協助美國越戰軍事任務，因而促成中華航空的成立"], ["C", "臺灣接收大量越南船民定居"], ["D", "臺灣因越戰而加入東南亞公約組織"]], "ans": "B", "exp": "越戰爆發前，我國政府為幕後協助美國的軍事準備，決定成立航空公司作為掩護，從事飛行任務，這正是中華航空成立的背景。"}, {"stem": "主張「若中南半島落入共產黨控制，其他東南亞國家也將如骨牌般接連赤化」的理論，是由下列何人提出？", "opts": [["A", "尼克森"], ["B", "杜魯門"], ["C", "麥克阿瑟"], ["D", "艾森豪"]], "ans": "D", "exp": "「骨牌理論」由美國總統艾森豪於西元1954年提出，此後成為冷戰時期美國介入他國事務（如越戰）的重要根據。"}, {"stem": "為防制共產勢力在東南亞蔓延，美國於西元1955年主導成立下列哪一個組織？", "opts": [["A", "東南亞國家協會"], ["B", "東南亞公約組織"], ["C", "聯合國東南亞委員會"], ["D", "亞太經濟合作會議"]], "ans": "B", "exp": "西元1955年，美國聯合其他國家組成「東南亞公約組織」（SEATO），使東南亞成為亞太地區圍堵共產勢力體系的一部分。"}, {"stem": "關於「東南亞公約組織」的成員組成，下列敘述何者正確？", "opts": [["A", "該組織共有8個會員國，但僅菲律賓、泰國位處東南亞"], ["B", "該組織所有會員國皆位於東南亞"], ["C", "該組織由中華人民共和國主導成立"], ["D", "該組織成員全數為共產國家"]], "ans": "A", "exp": "東南亞公約組織共有8個會員國，但其中僅菲律賓、泰國位處東南亞，其餘多為美、英、法等域外國家。"}, {"stem": "「東南亞公約組織」於西元1977年解散，下列何者最可能是其主要原因？", "opts": [["A", "遭到聯合國強制解散"], ["B", "東協主動併吞了該組織"], ["C", "成員國意見難以一致，加上美中關係緩和、美國退出越戰"], ["D", "越南加入後導致組織瓦解"]], "ans": "C", "exp": "東南亞公約組織由美國主導，但內部難以建立明確共識；隨著1970年代美中關係逐漸和緩、美國退出越戰，該組織逐漸失去存在價值，於1977年解散。"}, {"stem": "「東南亞國家協會」（東協）是在西元哪一年、於何地簽署宣言成立？", "opts": [["A", "1955年，馬尼拉"], ["B", "1967年，泰國曼谷"], ["C", "1975年，胡志明市"], ["D", "1991年，新加坡"]], "ans": "B", "exp": "西元1967年，以印尼為首的東南亞國家在泰國曼谷簽署宣言，成立「東南亞國家協會」，簡稱「東協」。"}, {"stem": "東南亞國家協會（東協）成立之初，其主要目的與冷戰時期的政治氛圍有何關聯？", "opts": [["A", "純粹以發展觀光為目的，與政治無關"], ["B", "目的在推翻境內的殖民政府"], ["C", "冷戰時期著重政治協商，以維持東南亞區域政治與社會的穩定"], ["D", "主要為對抗東南亞公約組織"]], "ans": "C", "exp": "東協在冷戰時期著重政治協商，希望藉由區域統合維護東南亞的政治與社會穩定，冷戰結束後才逐漸轉向經貿合作。"}, {"stem": "冷戰結束後，東南亞國家協會（東協）的發展重心逐漸轉向下列何者？", "opts": [["A", "完全終止與非東南亞國家的往來"], ["B", "恢復冷戰時期的軍事對抗立場"], ["C", "解散組織、各自獨立發展"], ["D", "注重成員間的經貿合作與互惠，減少貿易限制"]], "ans": "D", "exp": "冷戰結束後，東協逐漸轉型，注重成員間的經貿合作與互惠、減少貿易限制，近年更擴大規模，與非東南亞國家展開合作。"}, {"stem": "下列何者最能顯示東協在冷戰結束後轉型、擴大合作範圍的具體作為？", "opts": [["A", "接納越南等共產國家加入"], ["B", "拒絕與任何共產國家往來"], ["C", "退出聯合國"], ["D", "與東南亞公約組織合併"]], "ans": "A", "exp": "西元1991年蘇聯解體、冷戰結束後，東協逐漸轉型，接納越南等共產國家加入，使該組織的影響力不斷擴大。"}, {"stem": "根據課本描述，截至西元2025年為止，東南亞國家協會（東協）共有多少個會員國？", "opts": [["A", "8個"], ["B", "15個"], ["C", "11個"], ["D", "21個"]], "ans": "C", "exp": "課本提到，至西元2025年止，東協共有11個會員國。"}, {"stem": "近年來我國政府為強化與東南亞國家的經貿往來，積極推展下列哪一項政策？", "opts": [["A", "亞太營運中心"], ["B", "南向規劃辦公室"], ["C", "前進大陸政策"], ["D", "新南向政策"]], "ans": "D", "exp": "近年來政府側重「新南向政策」，進一步強化我國與東協各國的經貿、人才與資源交流，並鼓勵臺商赴東協國家投資設廠。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

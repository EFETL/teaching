<script>
const QS=[{"stem": "中華人民共和國於哪一年成立，並以何處為首都？", "opts": [["A", "1945年，重慶"], ["B", "1949年，北京"], ["C", "1949年，南京"], ["D", "1958年，北京"]], "ans": "B", "exp": "西元1949年10月1日，中共在北京天安門舉行建國典禮，中華人民共和國正式成立，定都北京。"}, {"stem": "中華人民共和國成立初期，政權主要掌握在下列何人手中？", "opts": [["A", "蔣中正"], ["B", "鄧小平"], ["C", "江澤民"], ["D", "毛澤東"]], "ans": "D", "exp": "建國初期，中華人民共和國由毛澤東主政，實行中國共產黨一黨專政。"}, {"stem": "中華人民共和國建國後，其政治體制屬於下列何者？", "opts": [["A", "中國共產黨一黨專政"], ["B", "民主共和、多黨競爭"], ["C", "君主立憲"], ["D", "軍政府聯合執政"]], "ans": "A", "exp": "中華人民共和國由中國共產黨全面掌握政權，實行一黨專政，並清剿反對勢力。"}, {"stem": "中共建國初期推動「土地改革」，其主要做法為何？", "opts": [["A", "將全國土地收歸軍隊管理"], ["B", "廢除農業、全力發展工業"], ["C", "沒收地主土地，分配給貧苦農民"], ["D", "鼓勵農民出國耕種以換取外匯"]], "ans": "C", "exp": "土地改革強制沒收地主的土地與財產，重新分配給農民耕種，因此獲得農民的支持。"}, {"stem": "中共建國初期針對民間工商企業採取下列何種措施？", "opts": [["A", "鼓勵私人企業自由競爭"], ["B", "逐步收歸國有"], ["C", "全面開放外商投資"], ["D", "全部關閉停業，不再營運"]], "ans": "B", "exp": "土地改革之後，中共針對工商業者，逐步將民間企業收歸國有，消除私有資本。"}, {"stem": "中共建國初期對知識分子採取的做法，下列敘述何者正確？", "opts": [["A", "給予言論自由，鼓勵批評政府"], ["B", "大量選送出國留學"], ["C", "免除其工作義務、優渥禮遇"], ["D", "推動思想改造，控制其言論思想"]], "ans": "D", "exp": "中共針對知識分子推動大規模的「思想改造」，灌輸共產主義思想，並強化對思想、言論的控制。"}, {"stem": "承上題，中共對知識分子的思想控制手段，常見透過下列何種方式進行？", "opts": [["A", "監督與批鬥"], ["B", "舉辦公開選舉"], ["C", "提供高額獎學金"], ["D", "召開國際學術會議"]], "ans": "A", "exp": "課本提到中共透過監督、批鬥的方式，控制知識分子的言論與思想，清除反對勢力。"}, {"stem": "土地改革與工商企業國有化的推動，反映出中共建國初期最主要的目標為何？", "opts": [["A", "促進國際貿易"], ["B", "恢復傳統科舉制度"], ["C", "鞏固共產政權、掌控經濟資源"], ["D", "發展觀光產業"]], "ans": "C", "exp": "建國初期，中共透過土地改革、消滅私營、控制思想等措施，目的都在鞏固共黨政權、全面掌控經濟與社會資源。"}, {"stem": "毛澤東於西元1958年推動的「大躍進」運動，其目標是希望達成下列何種口號？", "opts": [["A", "民主自由"], ["B", "超英趕美"], ["C", "統一中國"], ["D", "三民主義"]], "ans": "B", "exp": "毛澤東希望快速提升中國農、工業產量，達成「超英趕美」的目標，因而推行大躍進運動。"}, {"stem": "大躍進期間，中共在農村推行下列何種組織，以集體方式進行生產？", "opts": [["A", "生產合作社"], ["B", "農民議會"], ["C", "合作農場"], ["D", "人民公社"]], "ans": "D", "exp": "大躍進期間，中共在農村建立「人民公社」，集中土地、勞動力等資源，進行集體生產。"}, {"stem": "人民公社的生產方式與結果，下列敘述何者正確？", "opts": [["A", "個人自由耕作，糧食產量大增"], ["B", "引進外資機械，提升生產效率"], ["C", "集體生產、收穫共享，導致農民生產意願低落"], ["D", "完全私有化，農民彼此競爭激烈"]], "ans": "C", "exp": "人民公社實行集體生產與收穫共享，削弱了農民的生產意願，導致農業生產力大幅下滑。"}, {"stem": "大躍進期間，中共為提高鋼鐵產量，號召民眾進行下列何種運動？", "opts": [["A", "土法煉鋼"], ["B", "興修水利"], ["C", "開墾荒地"], ["D", "植樹造林"]], "ans": "A", "exp": "毛澤東號召全民「土法煉鋼」，在各地建土高爐，投入大量勞力煉鋼，以支持工業建設。"}, {"stem": "「土法煉鋼」運動最後導致的結果為何？", "opts": [["A", "鋼鐵產量大幅提升，達成超英趕美目標"], ["B", "煉出大量優質鋼材，支援工業建設"], ["C", "使中國成為世界鋼鐵出口大國"], ["D", "多半煉出無用廢鐵，浪費大量人力與資源"]], "ans": "D", "exp": "小煉鋼爐因技術不成熟，生產的僅是粗糙的鐵塊，完全無法達到預期目標，反而導致農業勞動力嚴重短缺。"}, {"stem": "大躍進期間，許多地方官員為迎合中央政策，往往採取下列何種做法？", "opts": [["A", "如實回報生產不足的情形"], ["B", "虛報浮誇的生產數字"], ["C", "公開批評大躍進政策"], ["D", "拒絕執行中央下達的命令"]], "ans": "B", "exp": "地方官員為達成中央制定的生產指標，往往誇大農業和工業的實際產量，形成「浮誇風」，讓中央誤以為經濟狀況良好。"}, {"stem": "大躍進運動最終造成的嚴重後果為何？", "opts": [["A", "中國迅速超越英美，成為世界強權"], ["B", "農業生產力大幅提升"], ["C", "發生大規模饑荒，數千萬人因而喪生"], ["D", "城市化快速完成，人民生活富裕"]], "ans": "C", "exp": "大躍進政策運用失當，加上糧食不足與過度勞動，造成大規模饑荒，估計有數千萬人死於飢餓相關疾病。"}, {"stem": "依據課本內容，大躍進失敗後，毛澤東的處境有何變化？", "opts": [["A", "地位受到黨內挑戰，因而辭去國家元首職務"], ["B", "聲望不減反增，順利連任"], ["C", "立即遭到罷黜並流放海外"], ["D", "獲得國際社會一致讚揚"]], "ans": "A", "exp": "大躍進的災難性後果在中共黨內引發批評聲浪，毛澤東因此辭去國家元首的職務，其後才又於文革中設法重新掌權。"}, {"stem": "下列關於大躍進運動的敘述，何者錯誤？", "opts": [["A", "內容包括農業集體化與全民煉鋼"], ["B", "目的是希望快速提升生產力，趕上英美"], ["C", "造成農業與工業資源的嚴重浪費"], ["D", "是一場成功的經濟建設，大幅提高人民生活水準"]], "ans": "D", "exp": "大躍進其實是一場失敗的政策，非但沒有提高人民生活水準，反而導致經濟惡化與大饑荒，故此敘述錯誤。"}, {"stem": "人民公社時期曾出現「吃飯不花錢」的做法，這指的是下列何種制度？", "opts": [["A", "免費醫療"], ["B", "公共食堂"], ["C", "義務教育"], ["D", "集體婚禮"]], "ans": "B", "exp": "人民公社集結生產大隊，在集體互助前提下開辦公共食堂，主張「吃飯不花錢，努力搞生產」。"}, {"stem": "毛澤東於西元1966年發動「文化大革命」，其主要目的為何？", "opts": [["A", "推動經濟改革開放"], ["B", "加強與國際社會的交流"], ["C", "重新掌握最高權力，打擊政敵"], ["D", "促進兩岸和平統一"]], "ans": "C", "exp": "大躍進失敗後毛澤東地位受挑戰，他為重掌大權，於1966年發動文化大革命，藉批鬥官員打擊政敵。"}, {"stem": "文化大革命期間，毛澤東號召下列何種身分的人組成「紅衛兵」？", "opts": [["A", "青年學生"], ["B", "農民"], ["C", "軍人"], ["D", "知識分子"]], "ans": "A", "exp": "毛澤東利用青年學生組織「紅衛兵」，展開鬥爭、批鬥官員與知識分子。"}, {"stem": "文化大革命提出的「破四舊、立四新」，其中「四舊」是指下列何者？", "opts": [["A", "蘇聯共產主義思想"], ["B", "西方資本主義制度"], ["C", " ，這正是中華航空成立的背景。"}, {"stem": "主張「若中南半島落入共產黨控制，其他東南亞國家也將如骨牌般接連赤化」的理論，是由下列何人提出？", "opts": [["A", "尼克森"], ["B", "杜魯門"], ["C", "麥克阿瑟"], ["D", "艾森豪"]], "ans": "D", "exp": "「骨牌理論」由美國總統艾森豪於西元1954年提出，此後成為冷戰時期美國介入他國事務（如越戰）的重要根據。"}, {"stem": "為防制共產勢力在東南亞蔓延，美國於西元1955年主導成立下列哪一個組織？", "opts": [["A", "東南亞國家協會"], ["B", "東南亞公約組織"], ["C", "聯合國東南亞委員會"], ["D", "亞太經濟合作會議"]], "ans": "B", "exp": "西元1955年，美國聯合其他國家組成「東南亞公約組織」（SEATO），使東南亞成為亞太地區圍堵共產勢力體系的一部分。"}, {"stem": "關於「東南亞公約組織」的成員組成，下列敘述何者正確？", "opts": [["A", "該組織共有8個會員國，但僅菲律賓、泰國位處東南亞"], ["B", "該組織所有會員國皆位於東南亞"], ["C", "該組織由中華人民共和國主導成立"], ["D", "該組織成員全數為共產國家"]], "ans": "A", "exp": "東南亞公約組織共有8個會員國，但其中僅菲律賓、泰國位處東南亞，其餘多為美、英、法等域外國家。"}, {"stem": "「東南亞公約組織」於西元1977年解散，下列何者最可能是其主要原因？", "opts": [["A", "遭到聯合國強制解散"], ["B", "東協主動併吞了該組織"], ["C", "成員國意見難以一致，加上美中關係緩和、美國退出越戰"], ["D", "越南加入後導致組織瓦解"]], "ans": "C", "exp": "東南亞公約組織由美國主導，但內部難以建立明確共識；隨著1970年代美中關係逐漸和緩、美國退出越戰，該組織逐漸失去存在價值，於1977年解散。"}, {"stem": "「東南亞國家協會」（東協）是在西元哪一年、於何地簽署宣言成立？", "opts": [["A", "1955年，馬尼拉"], ["B", "1967年，泰國曼谷"], ["C", "1975年，胡志明市"], ["D", "1991年，新加坡"]], "ans": "B", "exp": "西元1967年，以印尼為首的東南亞國家在泰國曼谷簽署宣言，成立「東南亞國家協會」，簡稱「東協」。"}, {"stem": "東南亞國家協會（東協）成立之初，其主要目的與冷戰時期的政治氛圍有何關聯？", "opts": [["A", "純粹以發展觀光為目的，與政治無關"], ["B", "目的在推翻境內的殖民政府"], ["C", "冷戰時期著重政治協商，以維持東南亞區域政治與社會的穩定"], ["D", "主要為對抗東南亞公約組織"]], "ans": "C", "exp": "東協在冷戰時期著重政治協商，希望藉由區域統合維護東南亞的政治與社會穩定，冷戰結束後才逐漸轉向經貿合作。"}, {"stem": "冷戰結束後，東南亞國家協會（東協）的發展重心逐漸轉向下列何者？", "opts": [["A", "完全終止與非東南亞國家的往來"], ["B", "恢復冷戰時期的軍事對抗立場"], ["C", "解散組織、各自獨立發展"], ["D", "注重成員間的經貿合作與互惠，減少貿易限制"]], "ans": "D", "exp": "冷戰結束後，東協逐漸轉型，注重成員間的經貿合作與互惠、減少貿易限制，近年更擴大規模，與非東南亞國家展開合作。"}, {"stem": "下列何者最能顯示東協在冷戰結束後轉型、擴大合作範圍的具體作為？", "opts": [["A", "接納越南等共產國家加入"], ["B", "拒絕與任何共產國家往來"], ["C", "退出聯合國"], ["D", "與東南亞公約組織合併"]], "ans": "A", "exp": "西元1991年蘇聯解體、冷戰結束後，東協逐漸轉型，接納越南等共產國家加入，使該組織的影響力不斷擴大。"}, {"stem": "根據課本描述，截至西元2025年為止，東南亞國家協會（東協）共有多少個會員國？", "opts": [["A", "8個"], ["B", "15個"], ["C", "11個"], ["D", "21個"]], "ans": "C", "exp": "課本提到，至西元2025年止，東協共有11個會員國。"}, {"stem": "近年來我國政府為強化與東南亞國家的經貿往來，積極推展下列哪一項政策？", "opts": [["A", "亞太營運中心"], ["B", "南向規劃辦公室"], ["C", "前進大陸政策"], ["D", "新南向政策"]], "ans": "D", "exp": "近年來政府側重「新南向政策」，進一步強化我國與東協各國的經貿、人才與資源交流，並鼓勵臺商赴東協國家投資設廠。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

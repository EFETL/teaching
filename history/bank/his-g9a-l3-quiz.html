<script>
const QS=[{"stem": "阿利安人約在西元前1500年遷入印度河與恆河流域後，逐漸發展出區分身分貴賤、限制職業與通婚的制度，這種制度稱為什麼？", "opts": [["A", "婆羅門教"], ["B", "佛教"], ["C", "種姓制度"], ["D", "伊斯蘭教"]], "ans": "C", "exp": "阿利安人進入印度後，除了信仰婆羅門教，也發展出身分與職業區分嚴明的種姓制度，這是佛教興起前印度社會的重要背景。"}, {"stem": "阿利安人所信仰的婆羅門教，主張下列何種觀念？", "opts": [["A", "因果報應與靈魂輪迴"], ["B", "人人平等，不分貴賤"], ["C", "信奉唯一真神阿拉"], ["D", "信奉上帝耶和華"]], "ans": "A", "exp": "婆羅門教相信因果報應與靈魂輪迴，這正是後來釋迦牟尼所要挑戰、超脫的觀念。"}, {"stem": "下列何者是印度種姓制度所造成的社會現象？", "opts": [["A", "商業活動發達，貿易網絡完善"], ["B", "政教合一，皇帝兼管宗教事務"], ["C", "出現政教衝突"], ["D", "身分與職業世代區分嚴明，社會階級分明"]], "ans": "D", "exp": "種姓制度強調身分與職業的世襲區分，形成階級分明的社會結構，這是佛教興起的社會背景之一。"}, {"stem": "西元前6世紀左右，印度社會為何逐漸出現挑戰婆羅門教權威、質疑種姓制度的思潮？", "opts": [["A", "阿育王大力提倡佛教"], ["B", "人民不滿婆羅門教的既有權威，也質疑種姓制度的不公"], ["C", "羅馬政府迫害異教徒"], ["D", "阿拉伯人建立跨三洲帝國"]], "ans": "B", "exp": "課本指出，前6世紀左右人民對婆羅門教既有的權威不滿，也質疑種姓制度的不公，是佛教興起的背景。"}, {"stem": "佛教的創始人釋迦牟尼主張以下列何種方式，超脫生死輪迴？", "opts": [["A", "藉由修行"], ["B", "完全遵守種姓制度規範"], ["C", "對統治者朝拜獻祭"], ["D", "誦讀古蘭經"]], "ans": "A", "exp": "釋迦牟尼主張藉由修行超脫生死輪迴，並打破階級觀念，主張人人平等，因而吸引不少信徒，日後形成佛教。"}, {"stem": "佛教創立之初，最吸引信徒追隨的核心主張為何？", "opts": [["A", "政教合一"], ["B", "順服阿拉"], ["C", "打破種姓階級觀念，主張人人平等"], ["D", "以聖經為信仰經典"]], "ans": "C", "exp": "釋迦牟尼打破婆羅門教的階級觀念，主張人人平等，此一理念吸引不少不滿種姓制度的信徒。"}, {"stem": "西元前3世紀，哪一位國王大力提倡佛教，並派遣高僧向外傳教？", "opts": [["A", "君士坦丁"], ["B", "阿育王"], ["C", "穆罕默德"], ["D", "查士丁尼"]], "ans": "B", "exp": "前3世紀，孔雀王朝國王阿育王提倡佛教，並派遣高僧向外傳教，促成佛教向外傳播。"}, {"stem": "阿育王提倡佛教時，他所統治的印度王朝為下列何者？", "opts": [["A", "阿拉伯帝國"], ["B", "鄂圖曼帝國"], ["C", "拜占庭帝國"], ["D", "孔雀王朝"]], "ans": "D", "exp": "阿育王是孔雀王朝的國王，前3世紀在位期間大力提倡佛教並派遣高僧對外傳教。"}, {"stem": "阿育王死後，佛教在印度本土的發展趨勢為何？", "opts": [["A", "佛教成為印度的國教"], ["B", "佛教與婆羅門教合併為同一宗教"], ["C", "佛教在印度逐漸沒落，卻分別向南、北兩個方向對外傳播"], ["D", "佛教遭到伊斯蘭教徹底取代"]], "ans": "C", "exp": "阿育王死後，印度境內的佛教沒落，但分別從南北兩個方向外傳，形成南傳佛教與北傳佛教。"}, {"stem": "「南傳佛教」主要經由下列哪個地區，傳播到東南亞一帶？", "opts": [["A", "中亞"], ["B", "錫蘭"], ["C", "西藏"], ["D", "巴格達"]], "ans": "B", "exp": "課本指出，南傳佛教經錫蘭（今斯里蘭卡）傳播到東南亞地區。"}, {"stem": "「北傳佛教」主要經由下列哪條路線傳入中國？", "opts": [["A", "經中亞傳入中國"], ["B", "經錫蘭傳入中國"], ["C", "經阿拉伯半島傳入中國"], ["D", "經地中海傳入中國"]], "ans": "A", "exp": "北傳佛教經中亞傳入中國，再由中國向外傳播，與南傳佛教的路線不同。"}, {"stem": "北傳佛教在西元8世紀時，還傳入了下列哪個地區？", "opts": [["A", "阿拉伯半島"], ["B", "義大利"], ["C", "麥加"], ["D", "西藏"]], "ans": "D", "exp": "課本提到，8世紀時北傳佛教也傳入西藏，使佛教在亞洲的傳播範圍更加擴大。"}, {"stem": "佛教傳入中國後逐漸中國化，並進一步向外傳播到下列哪些地區？", "opts": [["A", "巴勒斯坦與地中海東岸"], ["B", "臺灣、日本、朝鮮半島、越南等地"], ["C", "阿拉伯半島與北非"], ["D", "伊比利半島"]], "ans": "B", "exp": "佛教傳入中國後逐漸形成中國化佛教，之後再從中國外傳到臺灣、日本、朝鮮半島、越南等地。"}, {"stem": "中國的雲岡石窟，最能反映佛教傳入中國後產生的下列哪種現象？", "opts": [["A", "佛教在印度本土持續興盛"], ["B", "佛教與伊斯蘭教融合"], ["C", "佛教僅流傳於王室貴族之間"], ["D", "佛像的衣著與相貌隨時間逐漸中國化"]], "ans": "D", "exp": "雲岡石窟最早建於5世紀，隨時間發展，佛像的衣著與相貌逐漸中國化，是佛教本土化的代表例證。"}, {"stem": "位於古代絲路要衝、於西元2001年遭塔利班政權炸毀的佛教遺跡「巴米揚大佛」，位於下列哪個地區？", "opts": [["A", "印度"], ["B", "中國"], ["C", "阿富汗"], ["D", "錫蘭"]], "ans": "C", "exp": "巴米揚大佛建於6世紀，位於阿富汗，地處絲綢之路上，2001年遭塔利班政權炸毀，是佛教曾在中亞興盛的重要見證。"}, {"stem": "西元一世紀前後，生活在地中海東岸、受羅馬帝國統治的猶太人，其傳統信仰為下列何者？", "opts": [["A", "猶太教"], ["B", "佛教"], ["C", "伊斯蘭教"], ["D", "希臘正教"]], "ans": "A", "exp": "課本指出，西元一世紀前後猶太人主要生活在地中海東岸，受羅馬帝國統治，他們的傳統信仰是猶太教，這是基督教興起的背景。"}, {"stem": "猶太人耶穌批評猶太教的腐敗，並宣揚下列哪些理念？", "opts": [["A", "因果報應、靈魂輪迴"], ["B", "政教合一"], ["C", "順服阿拉、齋戒禮拜"], ["D", "人人平等、神愛世人"]], "ans": "D", "exp": "一世紀時，耶穌批評猶太教的腐敗，宣揚人人平等、神愛世人等主張，逐漸形成基督教的核心理念。"}, {"stem": "根據課本敘述，耶穌最後為何被釘死在十字架上？", "opts": [["A", "他率兵反抗羅馬政府"], ["B", "猶太教祭司向羅馬政府控告耶穌，耶穌最終被處死"], ["C", "他拒絕繳納賦稅"], ["D", "他與伊斯蘭教徒發生衝突"]], "ans": "B", "exp": "猶太教祭司因不滿耶穌的主張，向羅馬政府控告耶穌，最後耶穌被釘死在十字架上，但其門徒繼續宣揚理念，逐漸形成基督教。"}, {"stem": "基督教的經典「聖經」，其內容架構為何？", "opts": [["A", "舊約（猶太教經典）與新約（記載耶穌言行）"], ["B", "全部為記載阿拉話語的古蘭經內容"], ["C", "完全是穆罕默德所傳達的啟示"], ["D", "專門記載羅馬皇帝的詔令"]], "ans": "A", "exp": "聖經包含舊約與新約，舊約是猶太教的經典，新約則是信徒記載耶穌言行編纂而成。"}, {"stem": "早期基督徒常遭到羅馬政府迫害的原因，下列何者正確？", "opts": [["A", "基督徒公開反抗羅馬政府的稅制"], ["B", "基督徒破壞羅馬的公共建築"], ["C", "基督教是一神信仰，且基督徒不肯膜拜羅馬皇帝像，違背羅馬多神信仰傳統"], ["D", "基督徒拒絕使用羅馬的貨幣"]], "ans": "C", "exp": "基督教信奉唯一真神，違背羅馬傳統的多神信仰，加上基督徒不肯膜拜皇帝像，因此早期基督徒常遭到羅馬政府迫害。"}, {"stem": "基督徒雖遭羅馬政府迫害，卻仍吸引更多信徒追隨，主要原因為何？", "opts": [["A", "羅馬皇帝主動下令保護基督徒"], ["B", "基督徒殉教及博愛互助的精神感動人心"], ["C", "羅馬政府提供獎金鼓勵人民改信基督教"], ["D", "猶太教祭司大力宣傳基督教"]], "ans": "B", "exp": "課本指出，基督徒殉教及博愛的精神，反而吸引更多信徒追隨，使基督教信仰人數逐漸增加。"}, {"stem": "四世紀初，承認基督教為合法宗教的羅馬皇帝是下列何者？", "opts": [["A", "君士坦丁"], ["B", "狄奧多西"], ["C", "查士丁尼"], ["D", "圖拉真"]], "ans": "A", "exp": "四世紀初，羅馬皇帝君士坦丁承認基督教為合法宗教，是基督教發展史上的重要轉折。"}, {"stem": "下列何者將基督教定為羅馬帝國唯一合法宗教，並禁止多神信仰？", "opts": [["A", "君士坦丁"], ["B", "圖拉真"], ["C", "查士丁尼"], ["D", "狄奧多西"]], "ans": "D", "exp": "四世紀末，狄奧多西皇帝禁止多神信仰，並將基督教定為唯一的合法宗教，基督教遂成為羅馬帝國的國教。"}, {"stem": "西羅馬帝國滅亡、歐洲進入中古（中世紀）時期，大約發生在下列哪一年？", "opts": [["A", "西元前6世紀"], ["B", "西元4世紀初"], ["C", "西元476年"], ["D", "西元1453年"]], "ans": "C", "exp": "西元476年西羅馬帝國滅亡後，日耳曼人在西歐建立國家，歐洲自此進入中古（中世紀）時期。"}, {"stem": "中古初期，西歐政局混亂，基督教教會扮演了下列哪種角色？", "opts": [["A", "帶頭發動十字軍東征"], ["B", "統一政治，成為西歐唯一的統治政權"], ["C", "積極向阿拉伯人傳教"], ["D", "藉由宣講、興學與濟貧，成為穩定社會的力量"]], "ans": "D", "exp": "中古初期西歐局勢動盪，基督教教會宣講、興學與濟貧，成為穩定社會的重要力量。"}, {"stem": "中古西歐社會中，人民的婚禮、喪禮與各種公共活動大多在何處舉行？", "opts": [["A", "皇宮"], ["B", "教堂"], ["C", "清真寺"], ["D", "商隊驛站"]], "ans": "B", "exp": "人民在教堂舉行婚禮、喪禮與各種公共活動，教會因此成為中古西歐社會人們生活的中心。"}, {"stem": "中古基督教教會對歐洲文化保存的具體貢獻為何？", "opts": [["A", "派遣高僧向外傳教"], ["B", "翻譯古蘭經為各國語言"], ["C", "教士在修院抄寫古籍，保存部分古希臘、羅馬的知識"], ["D", "建立跨三洲的貿易網絡"]], "ans": "C", "exp": "基督教教會為培育教士設立學校，許多教士在修院抄寫古籍，保存部分古希臘、羅馬的知識。"}, {"stem": "中古西歐，羅馬教會的權力有時凌駕各國君主，因而導致下列哪種情形？", "opts": [["A", "政教衝突"], ["B", "政教合一"], ["C", "伊斯蘭世界的形成"], ["D", "佛教在印度衰落"]], "ans": "A", "exp": "中古西歐各國君主掌握政治權力、教會掌握宗教權力，屬於「政教分離」，但有時仍會導致「政教衝突」的發生。"}, {"stem": "拜占庭帝國的政治與宗教體制，屬於下列何種型態？", "opts": [["A", "政教分離，皇帝與教會互不相干"], ["B", "政教合一，皇帝同時掌管政府與教會"], ["C", "完全沒有宗教信仰"], ["D", "由伊斯蘭教主導"]], "ans": "B", "exp": "拜占庭帝國皇帝同時掌管政府與教會，屬於「政教合一」的狀態，與西歐的「政教分離」不同。"}, {"stem": "東、西方教會因爭奪宗教領導權，於西元1054年導致基督教會第一次分裂，這一年最接近下列哪個世紀？", "opts": [["A", "4世紀"], ["B", "6世紀"], ["C", "8世紀"], ["D", "11世紀"]], "ans": "D", "exp": "西元1054年屬於11世紀，此時東、西方教會因爭奪宗教領導權，導致基督教會第一次分裂。"}, {"stem": "基督教會第一次分裂後，分別形成以羅馬為中心與以君士坦丁堡為中心的兩大教派，依序為下列何者？", "opts": [["A", "羅馬公教、希臘正教"], ["B", "希臘正教、羅馬公教"], ["C", "遜尼派、什葉派" let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

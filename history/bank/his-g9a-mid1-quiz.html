<script>
const QS=[{"stem": "西亞古文明主要分布在兩河流域、小亞細亞、地中海東岸與下列哪個地區？", "opts": [["A", "尼羅河三角洲"], ["B", "伊朗高原"], ["C", "恆河平原"], ["D", "阿爾卑斯山區"]], "ans": "B", "exp": "課本指出西亞古文明主要分布於兩河流域、小亞細亞、地中海東岸及伊朗高原等地區。"}, {"stem": "「兩河流域」（又稱美索不達米亞）指的是哪兩條河流之間的地帶？", "opts": [["A", "尼羅河與約旦河"], ["B", "印度河與恆河"], ["C", "黃河與長江"], ["D", "幼發拉底河與底格里斯河"]], "ans": "D", "exp": "兩河流域為幼發拉底河和底格里斯河所流經的地帶，又稱「美索不達米亞」，意為「兩河之間的土地」。"}, {"stem": "最早在兩河流域建立城邦、並發明楔形文字的民族是？", "opts": [["A", "蘇美人"], ["B", "巴比倫人"], ["C", "希伯來人"], ["D", "波斯人"]], "ans": "A", "exp": "蘇美人最早在兩河流域建立城邦，是目前所知最早發明文字的民族，發明了通行於西亞的楔形文字。"}, {"stem": "蘇美人的楔形文字是用什麼材料、以什麼方式寫成的？", "opts": [["A", "用毛筆寫在絲帛上"], ["B", "用鑿子刻在石碑上"], ["C", "用蘆葦稈壓刻在溼泥版上"], ["D", "用羽毛筆寫在莎草紙上"]], "ans": "C", "exp": "蘇美人用削尖的蘆葦稈以刻壓方式在溼泥版上寫字，筆畫狀如楔子，因此稱為楔形文字。"}, {"stem": "關於蘇美人在曆法與數學上的成就，下列敘述何者正確？", "opts": [["A", "制定陽曆、採十進位法"], ["B", "制定陰曆、採六十進位法"], ["C", "制定農民曆、採十二進位法"], ["D", "制定太陰太陽曆、採百進位法"]], "ans": "B", "exp": "蘇美人依據月亮的運行制定陰曆，並使用六十進位法，這些都成為西亞文明的共同遺產。"}, {"stem": "「肥沃月彎」是指從兩河流域延伸到下列何處，因形狀如新月且土地肥沃而得名？", "opts": [["A", "地中海東岸"], ["B", "阿拉伯半島南端"], ["C", "紅海沿岸"], ["D", "裏海沿岸"]], "ans": "A", "exp": "從兩河流域延伸到地中海東岸一帶，因形狀如同一彎新月且土地肥沃，稱為「肥沃月彎」。"}, {"stem": "制定「漢摩拉比法典」、強調「以牙還牙，以眼還眼」報復原則的是哪一位國王？", "opts": [["A", "蘇美王"], ["B", "大流士"], ["C", "阿育王"], ["D", "漢摩拉比"]], "ans": "D", "exp": "巴比倫國王漢摩拉比制定漢摩拉比法典，強調「以牙還牙，以眼還眼」的報復原則。"}, {"stem": "兩河流域民族特別重視契約與法律觀念，最主要的原因是？", "opts": [["A", "宗教信仰要求"], ["B", "氣候乾旱少雨"], ["C", "往來民族眾多、商業交易頻繁"], ["D", "王室貴族壟斷土地"]], "ans": "C", "exp": "由於兩河流域地區往來的民族眾多、商業交易頻繁，因此當地較注重契約和法律觀念。"}, {"stem": "漢摩拉比法典的石碑上，雕刻著太陽神授予漢摩拉比象徵王權的是什麼物品？", "opts": [["A", "權杖"], ["B", "王冠"], ["C", "寶劍"], ["D", "盾牌"]], "ans": "A", "exp": "法典刻在玄武岩石碑上，石碑上方雕刻著太陽神授予漢摩拉比象徵王權的權杖，下方則為楔形文書寫的法律條文。"}, {"stem": "希伯來人（猶太人）主要居住在下列哪個地區？", "opts": [["A", "伊朗高原"], ["B", "小亞細亞"], ["C", "兩河流域"], ["D", "地中海東岸的巴勒斯坦"]], "ans": "D", "exp": "希伯來人居住在地中海東岸的巴勒斯坦地區，並在此創立猶太教。"}, {"stem": "希伯來人創立的猶太教，信奉哪一位神祇為唯一真神？", "opts": [["A", "阿胡拉馬茲達"], ["B", "耶和華"], ["C", "太陽神"], ["D", "宙斯"]], "ans": "B", "exp": "猶太教認為上帝耶和華是唯一真神，猶太人則自認是上帝的選民。"}, {"stem": "猶太教屬於哪一種信仰型態，且信徒自認為是這位神的「選民」？", "opts": [["A", "多神信仰"], ["B", "祖先崇拜"], ["C", "一神信仰"], ["D", "泛靈信仰"]], "ans": "C", "exp": "猶太教是一神信仰，認為上帝耶和華是唯一真神，猶太人自認是上帝的選民。"}, {"stem": "猶太教的一神信仰，對後來哪兩個宗教的形成有很大的影響？", "opts": [["A", "佛教與印度教"], ["B", "婆羅門教與祆教"], ["C", "印度教與伊斯蘭教"], ["D", "基督教與伊斯蘭教"]], "ans": "D", "exp": "課本指出，猶太教的一神信仰影響了後來的基督教與伊斯蘭教。"}, {"stem": "波斯人原本興起於下列哪個地區？", "opts": [["A", "伊朗高原"], ["B", "小亞細亞"], ["C", "阿拉伯半島"], ["D", "兩河流域下游"]], "ans": "A", "exp": "波斯人興起於伊朗高原，西元前六世紀征服西亞、埃及等地，建立大帝國。"}, {"stem": "波斯帝國建立於西元前幾世紀？", "opts": [["A", "前3世紀"], ["B", "前8世紀"], ["C", "前6世紀"], ["D", "前1世紀"]], "ans": "C", "exp": "西元前六世紀，興起於伊朗高原的波斯人建立了橫跨歐、亞、非三洲的大帝國。"}, {"stem": "波斯帝國在歷史上具有下列哪一項重要地位？", "opts": [["A", "最早發明文字的帝國"], ["B", "第一個橫跨歐、亞、非三洲的大帝國"], ["C", "第一個實施種姓制度的帝國"], ["D", "唯一信奉一神教的帝國"]], "ans": "B", "exp": "波斯人征服西亞、埃及等地後，建立了橫跨歐、亞、非三洲的大帝國。"}, {"stem": "波斯帝國統治遼闊版圖時，採取下列何種統治方式？", "opts": [["A", "中央集權，同時尊重各地特有文化"], ["B", "完全地方自治、不加干涉"], ["C", "強迫各地放棄原有信仰"], ["D", "廢除各地原有語言文字"]], "ans": "A", "exp": "波斯帝國建立後，雖採取中央集權的統治，仍重視各地的特有文化，促使不同文化間的交流增加。"}, {"stem": "波斯人信奉的宗教崇拜象徵光明的什麼元素？", "opts": [["A", "水"], ["B", "太陽"], ["C", "火"], ["D", "月亮"]], "ans": "C", "exp": "波斯人信奉祆教，崇拜象徵光明的「火」。"}, {"stem": "波斯人的宗教信仰認為世界上存在哪兩股對立的力量，且相信善神終將戰勝惡神？", "opts": [["A", "天與地"], ["B", "生與死"], ["C", "文明與野蠻"], ["D", "善與惡"]], "ans": "D", "exp": "波斯人相信世上有善與惡兩股對立勢力，善神終會戰勝惡神。"}, {"stem": "下列關於西亞古文明的敘述，何者正確？", "opts": [["A", "蘇美人的楔形文字是由腓尼基人發明的拼音文字"], ["B", "蘇美人是目前所知最早發明文字的民族之一"], ["C", "漢摩拉比法典是由希伯來人所制定"], ["D", "祆教是猶太人所信奉的宗教"]], "ans": "B", "exp": "蘇美人最早在兩河流域建立城邦，並發明了通行於西亞的楔形文字，是目前所知最早發明文字的民族之一；其餘選項的民族與文化成就對應錯誤。"}, {"stem": "埃及位於非洲的哪個區域？", "opts": [["A", "撒哈拉沙漠西緣"], ["B", "剛果盆地"], ["C", "東北部的沙漠地帶"], ["D", "好望角附近"]], "ans": "C", "exp": "埃及位於北非（非洲東北部）的沙漠地帶。"}, {"stem": "埃及雖然地處沙漠地帶，卻能發展出高度農業文明，最主要的原因是？", "opts": [["A", "尼羅河每年定期氾濫，帶來肥沃淤泥"], ["B", "降雨量特別豐沛"], ["C", "引進兩河流域的灌溉技術"], ["D", "地中海季風帶來充足水氣"]], "ans": "A", "exp": "尼羅河每年定期氾濫，帶來肥沃的淤泥，使埃及能發展出高度的農業文明。"}, {"stem": "「埃及是尼羅河的贈禮」這句話，是哪一群人所說？", "opts": [["A", "埃及法老"], ["B", "猶太祭司"], ["C", "蘇美商人"], ["D", "希臘史學家"]], "ans": "D", "exp": "課本記載，希臘史學家曾說：「埃及是尼羅河的贈禮。」"}, {"stem": "埃及四周有沙漠與高山作為天然屏障，這對其政治發展造成什麼影響？", "opts": [["A", "政權交替頻繁、戰亂不斷"], ["B", "較不易受外來政權入侵，政治發展穩定"], ["C", "完全與外界隔絕、毫無文化交流"], ["D", "導致長期分裂為多個城邦"]], "ans": "B", "exp": "埃及四周有沙漠與高山屏障，不易受外來政權入侵，因此政治發展較為穩定。"}, {"stem": "古埃及出現中央集權的統一政權，大約在西元前哪一年？", "opts": [["A", "前3100年左右"], ["B", "前1500年左右"], ["C", "前776年左右"], ["D", "前221年左右"]], "ans": "A", "exp": "約西元前3100年，古埃及出現中央集權的統一政權，並在國力富強下動員人力建造金字塔。"}, {"stem": "「法老」一詞原本的意思是？", "opts": [["A", "太陽神的使者"], ["B", "河流之神"], ["C", "「大房子」或「王宮」"], ["D", "最高祭司"]], "ans": "C", "exp": "法老原意是指「王宮」或「大房子」，後來演變為對古埃及國王的尊稱。"}, {"stem": "埃及古文明在西元前6世紀被下列哪一個帝國征服，此後逐漸走向沒落？", "opts": [["A", "亞述帝國"], ["B", "波斯帝國"], ["C", "巴比倫帝國"], ["D", "羅馬帝國"]], "ans": "B", "exp": "西元前六世紀，波斯帝國征服了埃及，此後埃及不斷被外來政權統治，古文明逐漸沒落。"}, {"stem": "古埃及宗教信仰的性質屬於？", "opts": [["A", "一神信仰"], ["B", "祖先崇拜為主"], ["C", "無神論"], ["D", "多神信仰"]], "ans": "D", "exp": "埃及的宗教屬於多神信仰，其中太陽神是宇宙的主宰。"}, {"stem": "在古埃及宗教中，法老以何種身分統治人間？", "opts": [["A", "尼羅河神的使者"], ["B", "眾神的僕人"], ["C", "太陽神之子"], ["D", "死神的代理人"]], "ans": "C", "exp": "太陽神是宇宙的主宰，法老以太陽神之子的身分統治人間。"}, {"stem": "古埃及的尼羅河神象徵什麼樣的力量？", "opts": [["A", "周而復始的再生力量"], ["B", "毀滅與懲罰的力量"], ["C", "戰爭與征服的力量"], ["D", "智慧與文字的力量"]], "ans": "A", "exp": "尼羅河神象徵周而復始的再生力量，這與尼羅河每年定期氾濫、滋養農業的特性有關。"}, {"stem": "古埃及人相信死後靈魂必須經過審判才能復活，因此他們會將死者的肉體如何處理？", "opts": [["A", "火化後灑入尼羅河"], ["B", "製成木乃伊保存"], ["C", "埋入金字塔頂端"], ["D", "交由祭司焚燒祭天"]], "ans": "B", "exp": "埃及人相信死後靈魂通過審判就能死而復生，因此將死者的肉體製成木乃伊保存，以備復活之用。"}, {"stem": "依據古埃及「死者之書」的描述，審判時死者的心臟會被放在天秤上，與象徵真理的什麼物品比較重量？", "opts": [["A", "太陽神的權杖"], ["B", "尼羅河的河水"], ["C", "法老的王冠"], ["D", "一根羽毛"]], "ans": "D", "exp": "死者之書描繪死者靈魂接受審判的場景：死者的心臟被放到天秤上與象徵真理的羽毛比較，若天秤保持平衡即獲宣判無罪，得以復活；若不平衡則心臟被怪獸吞噬。"}, {"stem": "古埃及人制定太陽曆，主要目的是為了掌握什麼？", "opts": [["A", "尼羅河氾濫的時間"], ["B", "金字塔建造的方位"], ["C", "法老即位的吉日"], ["D", "祭祀太陽神的時辰"]], "ans": "A", "exp": "埃及人制定太陽曆，以掌握尼羅河氾濫的時間，利於農業生產的安排。"}, {"stem": "古埃及人因建造金字塔、丈量氾濫後的土地，因而在哪些學科上有很高的成就？", "opts": [["A", "天文學與 ["D", "社會安定、經濟繁榮，此盛世長達約兩百年"]], "ans": "D", "exp": "羅馬進入帝國時期後，開啟長達兩世紀的和平與繁榮，史稱「羅馬和平」，恰與中國漢朝遙相輝映。"}, {"stem": "下列有關拜占庭帝國的敘述，何者錯誤？", "opts": [["A", "西元476年滅亡"], ["B", "又稱東羅馬帝國"], ["C", "定都於君士坦丁堡"], ["D", "查士丁尼在位時國力鼎盛"]], "ans": "A", "exp": "西元476年滅亡的是西羅馬帝國，拜占庭帝國（東羅馬帝國）則一直延續到西元1453年才亡於鄂圖曼土耳其人，故(A)敘述錯誤。"}, {"stem": "綜合而言，古希臘與古羅馬文化被視為下列何者的重要源頭？", "opts": [["A", "中國文化"], ["B", "歐洲文化"], ["C", "印度文化"], ["D", "阿拉伯文化"]], "ans": "B", "exp": "希臘文化建立民主政治與哲學、文學、藝術的基礎，羅馬文化承襲希臘文化並發展法律、建築、語文，兩者共同構成歐洲文化的重要源頭。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "第二次世界大戰後初期，臺灣為何會出現物價飛漲、經濟混亂的情形？", "opts": [["A", "政府大量印製新臺幣，導致通貨膨脹"], ["B", "戰爭期間工業設施遭嚴重破壞，生產力低落、物資缺乏"], ["C", "日本政府撤離前，將全臺工廠設備盡數搬走"], ["D", "國際社會對臺灣實施貿易禁運"]], "ans": "B", "exp": "二戰末期臺灣遭受美軍轟炸，工業設施嚴重受損，加上生產力低落、物資缺乏，戰後才會出現物價飛漲、經濟混亂的狀況。"}, {"stem": "民國38年，政府發行新臺幣取代舊臺幣，其主要目的為何？", "opts": [["A", "提升臺灣產品的出口競爭力"], ["B", "配合加入國際經貿組織的規定"], ["C", "慶祝中央政府遷臺"], ["D", "穩定金融秩序，抑制物價持續飛漲"]], "ans": "D", "exp": "政府為解決戰後經濟混亂的問題，於民國38年發行新臺幣取代舊臺幣（舊臺幣四萬元兌換新臺幣一元），藉以穩定金融秩序、遏止物價飛漲。"}, {"stem": "「三七五減租」規定佃農繳納的地租，不得超過該耕地年收穫量的多少比例？", "opts": [["A", "37.5%"], ["B", "50%"], ["C", "25%"], ["D", "75%"]], "ans": "A", "exp": "三七五減租規定地租不得超過年收穫量的37.5%，藉此減輕佃農的租稅負擔。"}, {"stem": "土地改革政策中的「三七五減租」，主要保障了下列何者的權益？", "opts": [["A", "地主"], ["B", "政府"], ["C", "佃農"], ["D", "商人"]], "ans": "C", "exp": "三七五減租限制地租上限，減輕佃農負擔，是保障佃農權益的第一步土地改革政策。"}, {"stem": "下列關於「公地放領」政策內容的描述，何者正確？", "opts": [["A", "政府沒收所有地主的私有土地"], ["B", "政府興建大量公共住宅供人民居住"], ["C", "政府開放山地保留地供企業開發"], ["D", "政府將公有耕地放領（出售）給實際耕作的佃農"]], "ans": "D", "exp": "公地放領是由佃農優先承購政府所有的公有耕地，使佃農得以取得屬於自己的土地。"}, {"stem": "「耕者有其田」政策的具體作法為何？", "opts": [["A", "由佃農優先承購公有耕地"], ["B", "政府徵收地主部分土地，再轉售給實際耕作的佃農"], ["C", "全面免除地主的稅賦"], ["D", "廢除土地私有制度"]], "ans": "B", "exp": "耕者有其田由政府徵收地主超出保留限額的土地，再由實際耕作的佃農承領認購，使更多佃農擁有自己的耕地。"}, {"stem": "政府遷臺後推動的土地改革政策，依實施先後順序排列，下列何者正確？", "opts": [["A", "耕者有其田→公地放領→三七五減租"], ["B", "公地放領→三七五減租→耕者有其田"], ["C", "三七五減租→公地放領→耕者有其田"], ["D", "耕者有其田→三七五減租→公地放領"]], "ans": "C", "exp": "土地改革分三階段推行：民國38年三七五減租、民國40年公地放領、民國42年耕者有其田。"}, {"stem": "土地改革過程中，部分土地被徵收的地主，後續的發展方向為何？", "opts": [["A", "在政府引導下，將所獲補償轉而投入工商業發展"], ["B", "全數移居海外，退出臺灣社會"], ["C", "土地與資產全部收歸國營農場經營"], ["D", "從此喪失所有政治參與的權利"]], "ans": "A", "exp": "部分土地被徵收的地主，在政府引導下將取得的補償轉向工商業發展，這也為日後臺灣的工商業發展奠定基礎。"}, {"stem": "整體而言，土地改革為戰後臺灣農業帶來的主要影響為何？", "opts": [["A", "加速臺灣都市化的腳步"], ["B", "使多數佃農獲得屬於自己的土地，成為自耕農，提高生產意願"], ["C", "造成大量農民失業、被迫離開農村"], ["D", "使全臺地價大幅下跌"]], "ans": "B", "exp": "土地改革使佃農逐漸轉型為自耕農，提高了農民的生產意願，帶動農業生產的提升。"}, {"stem": "美國大規模對中華民國提供經濟與技術援助（美援），主要與下列哪個歷史事件的爆發有關？", "opts": [["A", "中日戰爭"], ["B", "第一次能源危機"], ["C", "國共內戰爆發"], ["D", "韓戰爆發，美國為圍堵共產勢力而再次援助我國"]], "ans": "D", "exp": "韓戰爆發後，美國為防堵共產勢力擴張，再次啟動對中華民國的經濟與技術援助，也就是一般所稱的「美援」。"}, {"stem": "下列關於美援內容的描述，何者最為完整正確？", "opts": [["A", "美援僅用於採購軍事武器"], ["B", "美援資金全部用於興建學校"], ["C", "美援補充民生物資、穩定物價，並提供工業發展所需的資金與原料"], ["D", "美援主要用於償還對日本的戰爭賠款"]], "ans": "C", "exp": "美援不僅補充民生物資的供給、使物價趨於平穩，也為臺灣工業發展提供所需的原料、資金與技術。"}, {"stem": "「農復會」是由哪兩國聯合組成，負責運用美援推動臺灣農村建設的機構？", "opts": [["A", "中、美聯合組成的中國農村復興聯合委員會，推動農村建設與土地改革"], ["B", "專門負責美援軍事物資分配的機構"], ["C", "負責十大建設工程督導的機構"], ["D", "負責審核僑外資金投資的機構"]], "ans": "A", "exp": "農復會（中國農村復興聯合委員會）由中、美聯合組成，運用美援款項與物資推動公地放領、耕者有其田政策，並協助農村重建與水利建設。"}, {"stem": "石門水庫的興建過程，與美援有何關聯？", "opts": [["A", "完全由本國技術獨力完成，與美援無關"], ["B", "是由日本技師設計監造完成"], ["C", "石門水庫屬於十大建設中的一項"], ["D", "石門水庫的興建有美援資金挹注，並有美籍顧問參與工程指導"]], "ans": "D", "exp": "中、美合作興建石門水庫，美援經費運用於美國工程顧問公司及相關設備採購，水庫主體工程也在美籍顧問指導下完成。"}, {"stem": "下列哪一項美援物資，對緩解戰後臺灣的民生困境有直接幫助？", "opts": [["A", "美援武器裝備"], ["B", "美援麵粉與棉花，分別緩解糧食短缺並帶動紡織業發展"], ["C", "美援黃金存底"], ["D", "美援煤炭"]], "ans": "B", "exp": "美援麵粉緩解了臺灣糧食匱乏的問題；美援棉花則配合政府扶植，帶動臺灣紡織業快速成長。"}, {"stem": "政府在民國40年代推行的「進口替代」政策，其主要作法為何？", "opts": [["A", "扶植紡織等輕工業生產民生用品，以減少進口"], ["B", "大力發展重化工業"], ["C", "設立加工出口區以拓展外銷"], ["D", "積極加入世界貿易組織"]], "ans": "A", "exp": "進口替代政策是以農業培養工業，利用外銷農產所得購入設備，扶植紡織等輕工業生產民生用品，藉此減少對進口商品的依賴。"}, {"stem": "政府為何在民國50年代由「進口替代」轉為「出口導向」政策？", "opts": [["A", "政府決定將所有企業收歸國營"], ["B", "國際能源危機爆發，衝擊經濟發展"], ["C", "國內輕工業產品市場漸趨飽和，且先進國家逐漸將勞力密集產業外移"], ["D", "加入世界貿易組織後被迫調整"]], "ans": "C", "exp": "民國50年代，臺灣輕工業產品市場漸趨飽和，加上日、美等先進國家因工資上升而將勞力密集產業外移，政府因而轉向出口導向政策。"}, {"stem": "政府設立加工出口區的主要目的為何？", "opts": [["A", "培養重工業技術人才"], ["B", "吸引國內外企業投資設廠，發展勞力密集的出口產業"], ["C", "開發臺灣觀光資源"], ["D", "推動高科技技術研發"]], "ans": "B", "exp": "政府設立加工出口區，提供優惠條件吸引國內外企業投資設廠，藉此發展成衣、家電等勞力密集的出口產業。"}, {"stem": "我國最早設立的加工出口區，位於下列何地？", "opts": [["A", "臺北"], ["B", "新竹"], ["C", "臺中"], ["D", "高雄"]], "ans": "D", "exp": "政府為推動出口導向政策，最早在高雄等地成立加工出口區，吸引外商投資設廠。"}, {"stem": "出口導向時期，臺灣主力發展外銷的產業類型為何？", "opts": [["A", "成衣、家電等勞力密集產業"], ["B", "半導體、電腦等技術密集產業"], ["C", "鋼鐵、造船等重 展"], ["B", "強制地主移居海外"], ["C", "將地主的土地與資產收歸國營農場經營"], ["D", "禁止地主從事任何經濟活動"]], "ans": "A", "exp": "政府在土地改革過程中，引導部分土地被徵收的地主將所獲補償轉向工商業發展，這也成為日後臺灣民間企業發展的重要基礎。"}, {"stem": "依課本內容，民國50年代以後，臺灣邁向何種社會型態，並因此衍生出哪些都市問題？", "opts": [["A", "農業社會，出現缺工問題"], ["B", "商業社會，出現通貨緊縮問題"], ["C", "工業社會，大量人口移入都市，衍生交通壅塞、房價過高等問題"], ["D", "資訊社會，出現數位落差問題"]], "ans": "C", "exp": "民國50年代以後，臺灣逐漸邁向工業社會，大量人口移往都市，都市人口密集造成交通堵塞、房價過高、生活品質低落等都市問題。"}, {"stem": "綜觀戰後臺灣經濟政策的演變，反映出下列何種產業轉型的趨勢？", "opts": [["A", "由技術密集產業轉向勞力密集產業"], ["B", "由自由貿易政策轉向鎖國政策"], ["C", "由重工業轉向輕工業"], ["D", "由勞力密集產業逐漸轉型為技術密集產業"]], "ans": "D", "exp": "從民國50年代的成衣、家電等勞力密集產業，到民國70年代以後發展電腦、半導體等技術密集產業，反映出臺灣產業由勞力密集逐漸轉型為技術密集的趨勢。"}, {"stem": "下列何者「不是」政府遷臺初期推動土地改革政策的實際內容？", "opts": [["A", "三七五減租"], ["B", "全面將私有農地收歸國家所有"], ["C", "公地放領"], ["D", "耕者有其田"]], "ans": "B", "exp": "土地改革的三個階段為三七五減租、公地放領、耕者有其田，其精神是在維持土地私有制的前提下，透過減租、放領、徵收轉售等方式重新分配土地，並非全面將私有農地收歸國有。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

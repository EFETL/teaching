<script>
const QS=[{"stem": "西元1894年，清、日兩國因為哪個地區的主權問題爆發甲午戰爭？", "opts": [["A", "越南"], ["B", "琉球"], ["C", "澎湖"], ["D", "朝鮮"]], "ans": "D", "exp": "光緒20年（西元1894年，歲次甲午），清帝國與日本因朝鮮問題發生衝突，爆發甲午戰爭。"}, {"stem": "甲午戰爭清廷戰敗後，與日本簽訂了哪個條約，將臺灣、澎湖割讓給日本？", "opts": [["A", "北京條約"], ["B", "天津條約"], ["C", "馬關條約"], ["D", "南京條約"]], "ans": "C", "exp": "西元1895年，清廷戰敗，與日本簽訂馬關條約，將臺灣、澎湖割讓給日本。"}, {"stem": "臺灣官紳為抗拒日本接收臺灣，倡組成立的政權稱為？", "opts": [["A", "臺灣民主國"], ["B", "臺灣共和國"], ["C", "臺灣自治國"], ["D", "臺灣獨立國"]], "ans": "A", "exp": "馬關條約簽訂後，臺灣官紳倡組「臺灣民主國」，共同抗拒日本接收臺灣。"}, {"stem": "臺灣民主國成立時，被推舉為總統的人物是？", "opts": [["A", "丘逢甲"], ["B", "唐景崧"], ["C", "劉永福"], ["D", "莫那魯道"]], "ans": "B", "exp": "臺灣民主國推舉臺灣巡撫唐景崧為總統，丘逢甲為義軍統領，劉永福為大將軍。"}, {"stem": "下列何人在臺灣民主國中擔任義軍統領？", "opts": [["A", "唐景崧"], ["B", "劉永福"], ["C", "丘逢甲"], ["D", "余清芳"]], "ans": "C", "exp": "丘逢甲在臺灣民主國中擔任義軍統領，領導義軍抵抗日軍登陸。"}, {"stem": "臺灣民主國採用「永清」作為年號，其用意為何？", "opts": [["A", "紀念鄭成功開臺"], ["B", "表達對日本天皇的感念"], ["C", "象徵臺灣要永久獨立建國"], ["D", "表示永遠效忠清帝國"]], "ans": "D", "exp": "臺灣民主國的國旗為「藍地黃虎旗」，年號訂為「永清」，意在表示永遠效忠清帝國，而非真正謀求獨立。"}, {"stem": "臺灣民主國最後為何迅速瓦解？", "opts": [["A", "日本以外交談判方式和平收回臺灣"], ["B", "兵力、武器不如日本，領導者陸續離開臺灣"], ["C", "清廷派兵渡臺支援唐景崧作戰"], ["D", "臺灣民主國內部發生政變而崩解"]], "ans": "B", "exp": "日軍登陸後，臺灣民主國因兵力、武器不如日本，領導者唐景崧、劉永福等人先後離臺，臺灣民主國隨即瓦解。"}, {"stem": "關於甲午戰爭到臺灣民主國瓦解的歷史過程，下列敘述何者正確？", "opts": [["A", "清廷戰敗簽約割臺後，臺灣官紳才另立臺灣民主國以求抵抗"], ["B", "臺灣民主國成立於甲午戰爭爆發之前"], ["C", "臺灣民主國成功擊退日軍，維持了長期獨立"], ["D", "馬關條約簽訂後，日本隨即放棄接收臺灣"]], "ans": "A", "exp": "歷史發展順序為：甲午戰爭爆發→清廷戰敗簽訂馬關條約割讓臺灣→臺灣官紳成立臺灣民主國抗拒接收→日軍登陸後民主國瓦解，日本展開殖民統治。"}, {"stem": "日治時期統治臺灣的最高機構稱為？", "opts": [["A", "臺灣省行政長官公署"], ["B", "臺灣巡撫衙門"], ["C", "拓殖務省"], ["D", "臺灣總督府"]], "ans": "D", "exp": "日本在臺設立「臺灣總督府」作為統治臺灣的最高機構，以臺灣總督為地方最高行政首長。"}, {"stem": "日本國會頒布的「法律第六十三號」，簡稱為？", "opts": [["A", "保甲法"], ["B", "治安維持法"], ["C", "六三法"], ["D", "皇民化法"]], "ans": "C", "exp": "日本國會頒布「法律第六十三號」，簡稱「六三法」，用以授權臺灣總督特殊的統治權力。"}, {"stem": "「六三法」的頒布，主要授權臺灣總督可以做到下列何事？", "opts": [["A", "公布等同法律效力的命令"], ["B", "直接統治日本本土事務"], ["C", "罷免日本天皇"], ["D", "廢除臺灣的保甲制度"]], "ans": "A", "exp": "六三 s": "B", "exp": "總督府透過資金援助與各種保護措施，扶植資本家設立新式製糖廠，並擴大蔗園種植面積，使臺灣製糖業蓬勃發展。"}, {"stem": "由於新式製糖業蓬勃發展，臺灣在日治時期獲得下列何種稱號？", "opts": [["A", "米倉王國"], ["B", "森林王國"], ["C", "鐵道王國"], ["D", "糖業王國"]], "ans": "D", "exp": "總督府扶植新式製糖廠，使臺灣製糖業快速發展，蔗糖產量大增，因而獲得「糖業王國」的稱號。"}, {"stem": "總督府規定農民只能將甘蔗販售給指定的新式糖廠，不得自由買賣，這種制度稱為下列何者？", "opts": [["A", "專賣制度"], ["B", "保甲制度"], ["C", "原料採集區域制度"], ["D", "土地調查制度"]], "ans": "C", "exp": "總督府劃定各製糖會社專屬的原料採集區域，規定區域內的蔗農只能將甘蔗賣給指定糖廠，藉此避免糖廠間的原料競爭，也使蔗農喪失議價能力。"}, {"stem": "民間流傳「第一戇，種甘蔗予會社磅」的俗諺，主要反映出下列何種現象？", "opts": [["A", "糖廠常刻意壓低甘蔗收購價格，蔗農備受剝削"], ["B", "種植甘蔗獲利豐厚，人人搶種"], ["C", "稻米產量因此大幅減少"], ["D", "原住民被迫遷離山區"]], "ans": "A", "exp": "糖廠可單方面決定甘蔗的秤重及收購價格，常刻意壓低價格、在秤重時動手腳，使蔗農深感不滿，因而出現此俗諺。"}, {"stem": "臺灣第一家現代化製糖工廠「橋仔頭製糖廠」位於今日何處？", "opts": [["A", "臺北市"], ["B", "臺中市"], ["C", "臺南市"], ["D", "高雄市橋頭區"]], "ans": "D", "exp": "橋仔頭製糖廠位於今高雄市橋頭區，是臺灣第一家採用現代化機械生產的製糖工廠。"}, {"stem": "相較於傳統糖廍以人力或獸力榨蔗汁再人工熬製，新式製糖廠有何改變？", "opts": [["A", "完全停止使用機械"], ["B", "引進現代化機械，並藉鐵路運送甘蔗與蔗糖，提升效率與品質"], ["C", "改以人工方式製糖以確保品質"], ["D", "將製糖廠全數遷往日本本土"]], "ans": "B", "exp": "新式製糖廠引進現代化機械取代人力、獸力榨汁，並藉由鐵路運送甘蔗與蔗糖，降低運輸成本、提升製糖效率與品質。"}, {"stem": "在總督府扶植新式製糖業、保護資本家的政策下，下列敘述何者最符合史實？", "opts": [["A", "主要受益者是日本企業，蔗農常受到糖廠剝削"], ["B", "蔗農獲利遠高於製糖會社"], ["C", "總督府完全不介入糖業經營"], ["D", "臺灣糖業因此逐漸沒落"]], "ans": "A", "exp": "新式製糖業雖使部分蔗農收益略增，但主要受益者仍是日本企業；在總督府保護資本家的措施下，糖廠常壓榨、剝削蔗農。"}, {"stem": "新式製糖業能夠快速發展，與下列哪一項基礎建設關係最密切？", "opts": [["A", "專賣制度"], ["B", "統一貨幣"], ["C", "鐵路等交通建設，便於運送甘蔗與蔗糖"], ["D", "戶口調查"]], "ans": "C", "exp": "鐵路等交通建設的完善，使甘蔗與蔗糖得以更有效率地運送到糖廠與港口，降低運輸成本，有助於新式製糖業的快速發展。"}, {"stem": "總督府引進新耕作技術，培植出符合日本人口味、產量較高的稻米新品種，稱為下列何者？", "opts": [["A", "秈稻"], ["B", "在來米"], ["C", "糯米"], ["D", "蓬萊米"]], "ans": "D", "exp": "總督府引進新的農耕技術，推動品種改良，成功培植出符合日人口味、產量較高的「蓬萊米」，使稻米產量增加，可大量銷往日本。"}, {"stem": "課本提到，蓬萊米品種是由下列何人（或其團隊）改良研發成功？", "opts": [["A", "後藤新平"], ["B", "磯永吉"], ["C", "八田與一"], ["D", "長谷川謹介"]], "ans": "B", "exp": "總督府委託磯永吉等學者改良臺灣原有的稻米品種，研發出符合日本人口味、產量較高的「蓬萊米」。"}, {"stem": "許多臺灣農民選擇改種蓬萊米，最主要的原因是下列何者？", "opts": [["A", "蓬萊米種植面積較小，容易照顧"], ["B", "總督府強制規定農民只能種植蓬萊米"], ["C", "稻米輸往日本可獲得較高收益"], ["D", "蓬萊米不需要灌溉水利設施"]], "ans": "C", "exp": "由於稻米輸往日本可以獲得較多收益，許多臺灣農民因此選擇改種產量較高、符合日人口味的蓬萊米。"}, {"stem": "在「農業臺灣」政策推動下，臺灣的蔗糖與稻米產量出現下列何種變化？", "opts": [["A", "產量進一步提升，並大量銷往日本"], ["B", "產量大幅下降"], ["C", "僅蔗糖產量提升，稻米產量下降"], ["D", "產量提升但完全供臺灣本地使用"]], "ans": "A", "exp": "在新式製糖業、稻作改良與水利建設的共同影響下，臺灣的蔗糖與稻米產量都進一步提升，並大量銷往日本，以配合殖民母國的需求。"}, {"stem": "翰林版課本引用「臺灣新文學之父」賴和的小說，描述蔗農秤重甘蔗時遭受剝削的情形，這與下列哪一句俗諺所呈現的情境最為相似？", "opts": [["A", "有唐山公，無唐山媽"], ["B", "臺灣頭，臺灣尾"], ["C", "一府二鹿三艋舺"], ["D", "三個保正，八十斤"]], "ans": "D", "exp": "賴和小說描述蔗農秤重時遭糖廠會社剝削的不合理現象，與日治時期諺語「三個保正，八十斤」所呈現會社剝削蔗農、秤重不實的情境相似。"}, {"stem": "嘉南大圳是由下列何人設計監造，是日治時期臺灣規模最大的水利設施？", "opts": [["A", "後藤新平"], ["B", "八田與一"], ["C", "磯永吉"], ["D", "長谷川謹介"]], "ans": "B", "exp": "八田與一發揮其土木專業能力，設計監造嘉南大圳，是日治時期臺灣規模最大的水利工程。"}, {"stem": "嘉南大圳是在西元哪一年完工？", "opts": [["A", "1930年"], ["B", "1908年"], ["C", "1919年"], ["D", "1934年"]], "ans": "A", "exp": "嘉南大圳於西元1930年完工，增加了嘉南平原的灌溉面積，是日治時期臺灣最重要的水利工程之一。"}, {"stem": "嘉南大圳完工後，其灌溉水源主要來自下列何處？", "opts": [["A", "日月潭"], ["B", "石門水庫"], ["C", "烏山頭水庫"], ["D", "曾文水庫"]], "ans": "C", "exp": "嘉南大圳的灌溉水源主要來自烏山頭水庫，八田與一的銅像至今仍立於烏山頭水庫旁，紀念他對臺灣水利建設的貢獻。"}, {"stem": "嘉南大圳完工後，對嘉南平原帶來的主要影響是下列何者？", "opts": [["A", "水旱田面積比例不變"], ["B", "稻米、甘蔗產量因缺水而下降"], ["C", "原住民生活空間因此擴大"], ["D", "灌溉面積增加，稻米、甘蔗產量逐漸提高"]], "ans": "D", "exp": "嘉南大圳完工後，嘉南平原的灌溉面積大幅增加，原本「看天吃飯」的水旱田轉為穩定灌溉的良田，使稻米、甘蔗產量逐漸提高。"}, {"stem": "1930年代，日本推動南進政策，將經濟政策由「工業日本，農業臺灣」調整為下列何者？", "opts": [["A", "農業日本，工業臺灣"], ["B", "工業臺灣，農業南洋"], ["C", "工業南洋，農業臺灣"], ["D", "農業南洋，工業日本"]], "ans": "B", "exp": "1930年代起，日本推動南進政策，將臺灣視為前進南洋的補給基地，經濟政策調整為「工業臺灣，農業南洋」，致力於推動工業化。"}, {"stem": "日本推動南進政策，主要目的是希望藉由臺灣取得下列何種資源？", "opts": [["A", "東南亞（南洋）的石油、橡膠等資源"], ["B", "中國大陸的煤鐵資源"], ["C", "臺灣原住民的傳統領域"], ["D", "歐美國家的先進技術"]], "ans": "A", "exp": "日本以南洋（東南亞）等地為侵略目標，希望藉此取得當地豐富的石油、橡膠等資源，並將臺灣當作重要的南進補給基地。"}, {"stem": "日月潭水力發電所是在西元哪一年完工？", "opts": [["A", "1908年"], ["B", "1919年"], ["C", "1934年"], ["D", "1945年"]], "ans": "C", "exp": "總督府為因應臺灣的用電需求，著手各項電力開發計畫，日月潭水力發電所於西元1934年完工。"}, {"stem": "日月潭水力發電所完工後，帶來的主要影響是下列何者？", "opts": [["A", "使臺灣糖業因此沒落"], ["B", "促成縱貫鐵路的興建"], ["C", "使臺灣人口普查得以順利完成"], ["D", "為工業發展與民生需求提供充足電力，曾是亞洲最大發電廠"]], "ans": "D", "exp": "日月潭水力發電所完工後，為臺灣西半部的工業發展與民生需求提供充足穩定的電力，當時是亞洲最大的發電廠。"}, {"stem": "負責興建日月潭水力發電所的「臺灣電力株式會社」，是由下列何種方式成立？", "opts": [["A", "完全由臺灣民間人士獨立出資成立"], ["B", "由臺灣總督府與民間合資成立"], ["C", "由日本天皇直接下令成立"], ["D", "由蔗農集資成立"]], "ans": "B", "exp": "西元1919年成立的臺灣電力株式會社，是由臺灣總督府與民間合資成立，其主要任務是興建日月潭水力發電所。"}, {"stem": "南進政策推動後，總督府在臺灣積極發展下列哪一類工業，以配合戰爭需求？", "opts": [["A", "機械、石化等軍需工業"], ["B", "紡織、食品加工等輕工業"], ["C", "傳統糖廍產業"], ["D", "稻米栽培技術"]], "ans": "A", "exp": "為配合南進政策與戰爭需求，總督府積極發展機械、石化、金屬、造船等軍需工業，以支援日本的對外擴張。"}, {"stem": "日治後期，臺灣除了軍需工業外，下列哪一類工業也有顯著成長？", "opts": [["A", "造船、金屬等重工業"], ["B", "專賣事業"], ["C", "紡織、食品加工等輕工業"], ["D", "縱貫鐵路修築工程"]], "ans": "C", "exp": "這段時期，總督府一方面積極發展軍需工業，另一方面紡織、食品加工等輕工業也有顯著成長。"}, {"stem": "日治時期臺灣重要的食品加工業產品「鳳梨罐頭」，最能反映出下列哪一項工業類型的發展？", "opts": [["A", "軍需工業"], ["B", "專賣事業"], ["C", "電力工業"], ["D", "輕工業（食品加工業）"]], "ans": "D", "exp": "鳳梨罐頭是日治時期重要的食品加工業產品，屬於輕工業（民生工業）的代表，說明當時輕工業也有顯著發展。"}, {"stem": "課本描述「日治後期的臺灣處於從農業社會邁向工業社會的過渡階段」，這句話最能說明下列何者？", "opts": [["A", "臺灣經濟發展已完全脫離農業"], ["B", "臺灣經濟型態正逐漸從農業為主轉變為工業為主"], ["C", "臺灣的糖業與稻作生產已全面停止"], ["D", "臺灣在此階段完全沒有工業建設"]], "ans": "B", "exp": "這句話說明日治後期臺灣的經濟型態正處於轉型階段，逐漸從以農業為主的經濟結構，轉變為工業比重逐漸提高的社會，並非農業已完全消失。"}, {"stem": "課本提及，位於今新北市新店區、西元1909年完工的發電所，是臺灣目前仍在運轉中最古老的水力發電廠，指的是下列何者？", "opts": [["A", "日月潭水力發電所"], ["B", "烏山頭發電所"], ["C", "小粗坑發電所"], ["D", "大觀發電廠"]], "ans": "C", "exp": "小粗坑發電所位於今新北市新店區，西元1909年完工，是臺灣目前仍在運轉中、歷史最悠久的水力發電廠。"}, {"stem": "比較日治時期前後兩期的經濟政策，下列敘述何者正確？", "opts": [["A", "前期以農業臺灣（米糖生產）為主，後期因南進政策轉向推動工業化"], ["B", "前期即以工業化為主，後期才發展農業"], ["C", "兩階段的經濟政策完全相同，未曾改變"], ["D", "臺灣的經濟政策始終未配合日本的需求"]], "ans": "A", "exp": "日治前期總督府推動「工業日本，農業臺灣」，以生產米、糖為主；1930年代起因應南進政策，調整為「工業臺灣，農業南洋」，開始積極推動工業化。"}, {"stem": "日治初期，總督府推動的各項調查工作（土地、林野、戶口）與統一貨幣等基礎建設，主要是配合下列何種統治考量？", "opts": [["A", "培養臺灣人民自治能力"], ["B", "促進原住民傳統文化保存"], ["C", "完全遵循清帝國舊有制度"], ["D", "強化殖民統治基礎，並為資本家創造有利的投資環境"]], "ans": "D", "exp": "總督府在臺推動各項調查工作，作為統治的基礎，並藉此為日本資本家創造有利的投資環境，以利日後各項經濟建設的推展。"}, {"stem": "綜觀日治時期臺灣經濟發展的各項政策與建設，下列敘述何者最為正確？", "opts": [["A", "臺灣經濟發展完全獨立於日本之外，不受殖民母國需求影響"], ["B", "總督府的經濟建設兼具現代化與殖民化特色，主要為配合日本的需求與利益"], ["C", "日治時期臺灣未曾出現任何現代化建設"], ["D", "臺灣的農業與工業發展與日本經濟政策毫無關聯"]], "ans": "B", "exp": "日治時期總督府的經濟政策一方面在臺推動現代化基礎建設，另一方面前期發展農業、後期推動工業化，皆是為了配合殖民母國日本的需求與利益，兼具現代化與殖民化的雙重特色。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

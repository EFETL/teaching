<script>
const QS=[{"stem": "元朝末年群雄並起，最後是下列何人擊敗群雄，建立明朝，定都應天（今江蘇南京）？", "opts": [["A", "李自成"], ["B", "朱元璋"], ["C", "朱棣（明成祖）"], ["D", "吳三桂"]], "ans": "B", "exp": "元末群雄並起，朱元璋擊敗其他勢力，建立「大明」，定都應天（今南京），即為明太祖。"}, {"stem": "明成祖在位期間，為了防範蒙古人南侵，將首都遷到下列何處？", "opts": [["A", "開封"], ["B", "北京（順天）"], ["C", "南京（應天）"], ["D", "西安"]], "ans": "B", "exp": "明成祖時為防範蒙古，將首都從應天遷到北京，並重新修築長城。"}, {"stem": "明成祖遷都北京後，除了遷都以外，還做了下列哪一項防範蒙古的措施？", "opts": [["A", "廢除科舉制度"], ["B", "重新修築長城"], ["C", "實施海禁鎖國"], ["D", "派兵占領日本"]], "ans": "B", "exp": "明成祖為了防範蒙古，除了遷都北京外，也重新修築長城，鞏固北方邊防。"}, {"stem": "下列關於明代中晚期以後國勢衰退原因的敘述，何者「錯誤」？", "opts": [["A", "西班牙軍隊入侵並占領北京"], ["B", "內政逐漸腐敗"], ["C", "北方蒙古持續進犯"], ["D", "東南沿海有倭寇騷擾"]], "ans": "A", "exp": "明代中葉以後，國勢衰退主要因內政腐敗、北方蒙古侵犯及東南沿海倭寇騷擾所致，西班牙並未入侵占領北京。"}, {"stem": "明朝末年發生大饑荒，饑民與饑兵結合形成「流寇」，其中勢力最大、後來攻陷北京導致明朝滅亡的是下列何人？", "opts": [["A", "李自成"], ["B", "皇太極"], ["C", "吳三桂"], ["D", "鄭成功"]], "ans": "A", "exp": "明末大饑荒造成流寇四起，其中以李自成勢力最大，他率軍攻陷北京，明朝因而滅亡。"}, {"stem": "明朝晚期，東北的女真族再度崛起，並且改族名為下列何者，逐漸取代蒙古成為北方強權？", "opts": [["A", "鮮卑"], ["B", "契丹"], ["C", "回紇"], ["D", "滿洲"]], "ans": "D", "exp": "明朝晚期女真族再度崛起，改族名為「滿洲」，並建立「大清」，逐漸取代蒙古成為東亞強權。"}, {"stem": "西元1644年，清兵能夠順利入關，與下列何人的投降或協助關係最密切？", "opts": [["A", "鄭成功"], ["B", "徐光啟"], ["C", "吳三桂"], ["D", "李自成"]], "ans": "C", "exp": "西元1644年，明將吳三桂投降清朝，清兵因此得以順利入關，隨後逐步消滅流寇與明朝殘餘勢力。"}, {"stem": "清兵入關、進占北京之後，隨即展開了下列哪一項行動，以穩固統治基礎？", "opts": [["A", "消滅流寇及明朝殘餘勢力"], ["B", "與荷蘭結盟攻打日本"], ["C", "立刻遠征西方國家"], ["D", "全面禁止漢人科舉"]], "ans": "A", "exp": "清兵入關後，逐一消滅李自成等流寇勢力及明朝殘餘的抵抗力量，才逐步開啟清朝的穩固統治。"}, {"stem": "明朝滅亡後，鄭成功以下列何地做為「反清復明」的根據地？", "opts": [["A", "長崎"], ["B", "馬尼拉"], ["C", "臺灣"], ["D", "澳門"]], "ans": "C", "exp": "明朝滅亡後，鄭成功攻取臺灣，將其作為「反清復明」的基地，直到清朝康熙年間才將臺灣納入版圖。"}, {"stem": "臺灣在下列哪一位清朝皇帝在位期間，被正式納入清朝版圖？", "opts": [["A", "順治"], ["B", "康熙"], ["C", "乾隆"], ["D", "雍正"]], "ans": "B", "exp": "清朝於康熙年間擊敗臺灣的鄭氏政權，將臺灣納入版圖，逐步穩固對外圍地區的統治。"}, {"stem": "康熙、雍正、乾隆三朝，因社會經濟安定、文治武功強盛，歷史上稱這段時期為？", "opts": [["A", "洪武之治"], ["B", "永樂盛世"], ["C", "康雍乾盛世"], ["D", "開元盛世"]], "ans": "C", "exp": "康熙、雍正、乾隆三帝在位期間，社會經濟安定、文治武功  "ans": "C", "exp": "日本鎖國期間，仍允許荷蘭商人至長崎貿易，荷蘭商人帶來的西方學術知識，在日本被稱為「蘭學」，奠定近代日本科學發展的基礎。"}, {"stem": "清初臺灣收歸版圖、海禁政策解除後，清廷對西方貿易仍抱持的態度為何？", "opts": [["A", "以天朝上國自居，僅開放少數口岸與外國通商，採取閉關自守的態度"], ["B", "完全開放，自由貿易不加限制"], ["C", "全面斷絕與歐洲各國的一切往來"], ["D", "主動出兵占領歐洲在亞洲的殖民地"]], "ans": "A", "exp": "清初臺灣收歸版圖後解除海禁，貿易復甦，但清廷仍以天朝上國自居，僅開放少數口岸通商，這種閉關自守的態度與西方自由貿易觀念相牴觸。"}, {"stem": "東南亞地區在歐洲殖民統治下，文化受到深刻影響，下列敘述何者正確？", "opts": [["A", "東南亞全面採用中國的科舉制度"], ["B", "東南亞居民普遍改信儒家思想"], ["C", "菲律賓馬尼拉出現許多西班牙式建築，居民至今多信奉天主教"], ["D", "東南亞完全拒絕接受任何外來文化"]], "ans": "C", "exp": "隨著歐洲人的殖民統治，東南亞文化受到重大影響，例如菲律賓馬尼拉出現許多西班牙式建築，當地居民至今仍多信奉天主教。"}, {"stem": "朝鮮在明清時期與中國的關係，下列敘述何者正確？", "opts": [["A", "朝鮮長期接受中國冊封並定期朝貢，政治、經濟、文化上都與中國關係密切"], ["B", "朝鮮完全獨立，從未與中國有任何往來"], ["C", "朝鮮長期與中國處於戰爭狀態"], ["D", "朝鮮拒絕接受中國文化的任何影響"]], "ans": "A", "exp": "明清時期，朝鮮長期接受中國冊封、定期朝貢，不僅政治經濟上與中國關係密切，文化上也深受中國影響。"}, {"stem": "十六世紀末，日本大舉進犯朝鮮時，明朝採取了下列哪一項行動？", "opts": [["A", "派遣援軍與朝鮮合力擊退日軍"], ["B", "與日本結盟共同瓜分朝鮮"], ["C", "袖手旁觀、不介入朝鮮戰事"], ["D", "要求朝鮮立刻投降日本"]], "ans": "A", "exp": "十六世紀末日本大舉進犯朝鮮，明朝為維護國防安全，派兵前往朝鮮，與朝鮮合力擊退日軍，使朝鮮免於亡國。"}, {"stem": "朝鮮使節前往中國朝見、進貢的行為，被稱為「朝天」或下列何者？", "opts": [["A", "東渡"], ["B", "燕行"], ["C", "西征"], ["D", "北伐"]], "ans": "B", "exp": "朝鮮使節出使中國被稱為「朝天」或「燕行」，前者指朝見天朝上國，後者則指前往北京。"}, {"stem": "十七世紀初，日本入侵琉球後，琉球所處的特殊政治局勢，被稱為下列何者？", "opts": [["A", "完全獨立於中日之外"], ["B", "中、日二屬時期（同時向中、日朝貢）"], ["C", "成為日本的正式領土"], ["D", "成為中國的內地行省"]], "ans": "B", "exp": "十七世紀初日本入侵琉球後，琉球表面維持獨立，但須同時向中國、日本朝貢，形成「中、日二屬時期」，也成為十九世紀晚期牡丹社事件的遠因。"}, {"stem": "清朝統治漢人時，除了對漢人的高壓與懷柔政策外，對蒙古、西藏等邊境地區，主要採取下列哪一種方式強化控制？", "opts": [["A", "派遣漢人官員全面取代當地統治者"], ["B", "聯姻或宗教等方式"], ["C", "完全放任邊境地區獨立自治"], ["D", "以武力屠殺當地人口"]], "ans": "B", "exp": "滿洲人對邊境的蒙古、西藏，主要以聯姻或宗教等方式強化控制，與對漢人採取的高壓懷柔策略有所不同。"}, {"stem": "下列關於「天朝體制」下藩屬國朝貢動機的敘述，何者最符合課本內容？", "opts": [["A", "藩屬國受到通商利益的吸引，且能獲得中國皇帝的賞賜與保護"], ["B", "藩屬國朝貢是為了獲得中國的軍事援助對抗歐洲"], ["C", "藩屬國朝貢單純只是宗教義務"], ["D", "藩屬國完全被中國以武力強迫朝貢"]], "ans": "A", "exp": "接受冊封的藩屬國受到通商利益吸引，紛紛前來朝貢貿易，不僅能獲得中國皇帝豐厚的賞賜，還能得到中國的保護。"}, {"stem": "明代東南沿海居民（如廣東、福建等地）在海禁政策下的因應方式，下列敘述何者正確？", "opts": [["A", "迫於生計，仍有許多人違反禁令、私自出海貿易"], ["B", "集體向朝廷請願廢除海禁並獲准"], ["C", "完全遵守禁令、絕不出海"], ["D", "全部轉往內陸從事農業"]], "ans": "A", "exp": "東南沿海如廣東、福建等地居民迫於生計，儘管明朝實施海禁，仍有許多人違反禁令、私自出海謀生。"}, {"stem": "下列有關明清時期東西文化交流的敘述，何者最為正確？", "opts": [["A", "明清時期中國與歐洲之間完全沒有任何文化往來"], ["B", "交流完全是單向的，只有中國文化傳入歐洲"], ["C", "交流完全是單向的，只有西方文化傳入中國"], ["D", "西方的科學技術（如曆法、幾何學、天文學）傳入中國，中國的典籍、瓷器等也傳入歐洲，形成雙向交流"]], "ans": "D", "exp": "明清時期的中西文化交流是雙向的：傳教士將西方科學知識與技術介紹到中國，同時也把中國的典籍、園林建築、瓷器、醫藥等傳入歐洲。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

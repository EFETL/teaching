<script>
const QS=[{"stem": "西元1917年3月（俄曆2月），俄國人民推翻沙皇尼古拉二世，建立臨時政府，這場革命被稱為下列何者？", "opts": [["A", "十月革命"], ["B", "二月革命"], ["C", "光榮革命"], ["D", "法國大革命"]], "ans": "B", "exp": "1917年3月（俄曆2月）俄國人民起義推翻沙皇尼古拉二世，建立臨時政府，史稱「二月革命」，終結俄國帝制。"}, {"stem": "二月革命後成立的臨時政府，為何很快就失去民心？", "opts": [["A", "大量屠殺猶太人，引發國際抗議"], ["B", "與德國簽訂互不侵犯條約，遭指責賣國"], ["C", "提高關稅保護工商業，引發他國仿效"], ["D", "決定繼續參戰，且無力解決經濟與土地問題"]], "ans": "D", "exp": "臨時政府成立後決定繼續對同盟國作戰，卻無法解決民眾迫切的糧食、土地與經濟問題，因而失去民心，給列寧發動革命的機會。"}, {"stem": "列寧在發動十月革命時，提出下列哪一句口號，號召群眾支持？", "opts": [["A", "「自由、平等、博愛」"], ["B", "「還我河山」"], ["C", "「和平、土地、麵包」"], ["D", "「不自由，毋寧死」"]], "ans": "C", "exp": "列寧以「和平、土地、麵包」的口號爭取民心，號召群眾發動十月革命，推翻臨時政府。"}, {"stem": "西元1917年11月（俄曆10月），列寧領導的十月革命成功後，造成下列何種結果？", "opts": [["A", "推翻臨時政府，建立世界上第一個共產政權，並退出第一次世界大戰"], ["B", "推翻沙皇專制，建立君主立憲政府"], ["C", "與英、法等協約國締結同盟，繼續對同盟國作戰"], ["D", "迫使德國皇帝退位，成立威瑪共和"]], "ans": "A", "exp": "十月革命由列寧領導的布爾什維克黨（俄國共產黨）發動，推翻臨時政府，建立世界上第一個共產主義政權，隨後與德國停戰，退出第一次世界大戰。"}, {"stem": "列寧掌權後成立「共產國際」，其主要目的為何？", "opts": [["A", "協調各國解決經濟大恐慌問題"], ["B", "促進歐洲各國貿易往來，降低關稅"], ["C", "監督各國落實凡爾賽條約內容"], ["D", "支持、控制世界各地共產主義運動的發展"]], "ans": "D", "exp": "列寧成立共產國際，目的在支持並控制各地共產勢力的發展，向外輸出世界革命，使歐、亞政局出現動盪。"}, {"stem": "西元1922年，列寧將俄國改名為下列何者，簡稱「蘇聯」？", "opts": [["A", "俄羅斯帝國"], ["B", "蘇維埃社會主義共和國聯邦"], ["C", "俄羅斯聯邦共和國"], ["D", "大俄羅斯人民共和國"]], "ans": "B", "exp": "西元1922年，列寧成立「蘇維埃社會主義共和國聯邦」，簡稱「蘇聯」，是世界上第一個共產主義國家。"}, {"stem": "列寧死後，史達林掌權，其統治具有下列哪一項特色？", "opts": [["A", "開放言論自由，實施多黨政治"], ["B", "推行市場經濟，減少政府對經濟的干預"], ["C", "獨裁統治並推行計畫經濟，全力發展國防與重工業"], ["D", "與德國結盟，共同對抗西方民主國家"]], "ans": "C", "exp": "史達林透過獨裁統治穩固權力，推行「計畫經濟」，全力發展軍事國防工業，使蘇聯成為工業強國，但人民生活水準未見改善。"}, {"stem": "第一次世界大戰期間，美國經濟為何得以大幅擴張？", "opts": [["A", "供應協約國軍火與糧食物資，農工業因而擴張"], ["B", "大量開採本國石油，出口至歐洲各國"], ["C", "吸收歐洲移民，勞動力大增"], ["D", "廢除關稅，吸引各國資金投資"]], "ans": "A", "exp": "一次大戰期間，美國供給協約國軍火及糧食物資，農、工業發展大為擴張，逐漸掌握世界經濟的主導權。"}, {"stem": "下列何者是造成世界經濟大恐慌爆發的背景因素之一？", "opts": [["A", "蘇聯共產國際鼓動各國罷工"], ["B", "德國無力償還一次大戰賠款"], ["C", "日本占領中國東北，破壞國際貿易秩序"], ["D", "美國調高關稅保護工商業，各國競相仿效，造成國際貿易萎縮"]], "ans": "D", "exp": "歐洲工商業復甦後，美國農工產品供過於求，加上美國提高關稅保護工商業，各國競相仿效，使國際交易市場萎縮，助長經濟大恐慌的爆發。"}, {"stem": "世界經濟大恐慌是因下列何地股市崩盤所引發？", "opts": [["A", "倫敦"], ["B", "紐約"], ["C", "東京"], ["D", "柏林"]], "ans": "B", "exp": "西元1929年，美國紐約股市狂跌，各地工廠和銀行紛紛倒閉，失業率攀升，社會嚴重失序，這波風暴迅速蔓延，形成世界經濟大恐慌。"}, {"stem": "羅斯福就任美國總統後推行的「新政」，主要採取下列何種做法以減緩經濟大恐慌的衝擊？", "opts": [["A", "興建大型公共建設，增加就業機會，帶動民間消費與投資"], ["B", "提高關稅，限制外國商品進口"], ["C", "沒收銀行資產，實施國有化"], ["D", "退出國際聯盟，採取孤立政策"]], "ans": "A", "exp": "羅斯福推行「新政」，興建大型公共建設以增加就業機會，並帶動民間消費與投資，同時建立社會福利制度，逐漸減緩經濟大恐慌對美國的衝擊。"}, {"stem": "羅斯福透過廣播節目向美國人民說明新政內容，這個廣播節目被稱為下列何者？", "opts": [["A", "白宮論壇"], ["B", "國情咨文"], ["C", "爐邊談話"], ["D", "自由之聲"]], "ans": "C", "exp": "羅斯福主持廣播「爐邊談話（爐邊閒談）」，向美國人民陳述新政內容，藉此恢復民眾對政府的信心。"}, {"stem": "西元1933年，就任美國總統並大力推動新政的是下列何人？", "opts": [["A", "威爾遜"], ["B", "林肯"], ["C", "邱吉爾"], ["D", "羅斯福"]], "ans": "D", "exp": "西元1933年，羅斯福就任美國總統後，致力推行「新政」，逐漸減緩經濟大恐慌對美國的衝擊。"}, {"stem": "義大利雖為第一次世界大戰的戰勝國，戰後卻面臨下列何種處境？", "opts": [["A", "獲得大量海外殖民地，經濟迅速起飛"], ["B", "經濟瀕臨崩潰、失業率大增，社會動盪不安"], ["C", "與德國組成同盟，共同對抗蘇聯"], ["D", "廢除君主制，成立共和政府"]], "ans": "B", "exp": "義大利雖為戰勝國，但戰後經濟瀕臨崩潰，失業率大增，共產黨藉機鼓動工人罷工，造成社會經濟失序，給了墨索里尼崛起的機會。"}, {"stem": "墨索里尼領導的法西斯黨，主要提出下列哪些主張以爭取民眾支持？", "opts": [["A", "反共及恢復古羅馬光榮"], ["B", "廢除凡爾賽條約及種族優越理論"], ["C", "建立共產國際，輸出世界革命"], ["D", "推行新政及社會福利制度"]], "ans": "A", "exp": "墨索里尼率領法西斯黨提出反共及恢復古羅馬光榮等主張，藉此獲得民眾支持。"}, {"stem": "墨索里尼是透過下列何種方式取得義大利政權？", "opts": [["A", "贏得國會大選"], ["B", "推翻國王，成立共和"], ["C", "發動政變，迫使國王任命他為首相"], ["D", "發動十月革命"]], "ans": "C", "exp": "墨索里尼率領法西斯黨（黑衫軍）發動政變，迫使義大利國王任命他為首相，藉此建立極權統治政權。"}, {"stem": "「法西斯」一詞的原意及後世用法為下列何者？", "opts": [["A", "拉丁文原意為「和平」，後指崇尚和平的政黨"], ["B", "原指古羅馬的元老院，後指民主議會制度"], ["C", "原為俄文，指共產黨的祕密警察組織"], ["D", "拉丁文原指一綑棍棒加上斧頭，象徵權力，後世用以指稱領袖崇拜與極權統治"]], "ans": "D", "exp": "「法西斯」是拉丁文Fasces的音譯，原指一綑棍棒加上斧頭，是古羅馬官吏權力的象徵，義大利法西斯黨以此為黨徽，後世常用「法西斯」指稱領袖崇拜與極權統治。"}, {"stem": "第一次世界大戰結束後，德國被迫接受的和約及其影響為下列何者？", "opts": [["A", "凡爾賽條約，使德國獲得大量賠款"], ["B", "凡爾賽條約，使德國經濟更加困頓，助長極端政黨崛起"], ["C", "慕尼黑協定，使德國喪失蘇臺德區"], ["D", "德蘇互不侵犯條約，使德國與蘇聯交惡"]], "ans": "B", "exp": "一次大戰結束後，德國被迫接受凡爾賽條約，又遭逢經濟大恐慌衝擊，經濟困頓，共產黨趁機活動，社會不安 求，這群國家被稱為？", "opts": [["A", "華沙集團"], ["B", "第三世界"], ["C", "大英國協"], ["D", "獨立國家國協"]], "ans": "B", "exp": "這些不願參與美、蘇兩大陣營、主張反帝反殖民的亞、非、拉丁美洲國家，形成所謂的「第三世界」。"}, {"stem": "第三世界國家為表明不與美、蘇任何一方集團結盟的立場，發起了下列哪一項國際運動？", "opts": [["A", "泛美聯盟運動"], ["B", "歐洲統合運動"], ["C", "圍堵政策"], ["D", "不結盟運動"]], "ans": "D", "exp": "第三世界發起「不結盟運動」，標榜不與任何集團結盟，藉由成員間協調共識，形成第三股國際勢力。"}, {"stem": "第三世界國家個別國力大多不強，卻仍能在國際舞臺上發揮影響力，主要是憑藉下列何種優勢？", "opts": [["A", "擁有最先進的核子武器"], ["B", "掌握全球最多的黃金儲備"], ["C", "數目眾多，能以集體外交之力展現影響力"], ["D", "獲得聯合國安全理事會常任理事國席位"]], "ans": "C", "exp": "第三世界國家個別實力有限，但因成員數量眾多，透過協調取得共識，能以集體外交之力在國際舞臺上發揮影響力。"}, {"stem": "冷戰時期，蘇聯長期偏重下列哪一方面的發展，導致民生經濟停滯、人民生活困苦？", "opts": [["A", "農業與畜牧業"], ["B", "觀光旅遊業"], ["C", "輕工業與消費產業"], ["D", "國防（軍事）工業"]], "ans": "D", "exp": "冷戰期間，蘇聯長期偏重國防（軍事）工業、投入龐大軍費，忽視民生經濟發展，使人民生活困苦。"}, {"stem": "西元1985年，蘇聯出現一位推動政治、經濟與外交改革的領導人，他是下列何人？", "opts": [["A", "史達林"], ["B", "列寧"], ["C", "戈巴契夫"], ["D", "赫魯雪夫"]], "ans": "C", "exp": "1985年，蘇聯領導人戈巴契夫展開一連串政治、經濟、外交改革，並改善與歐、美國家的關係。"}, {"stem": "戈巴契夫上臺後推動的改革，主要方向為何？", "opts": [["A", "加強對東歐國家的軍事控制"], ["B", "推動政治、經濟改革，並改善與西方國家的關係"], ["C", "退出聯合國，走向鎖國"], ["D", "重新發動與美國的軍備競賽"]], "ans": "B", "exp": "戈巴契夫推動政治、經濟改革，降低政府管制，並在外交上積極改善與西方國家的關係。"}, {"stem": "戈巴契夫宣布對東歐國家採取下列哪一項政策，間接促成東歐民主化浪潮？", "opts": [["A", "減少對東歐國家內政的干預"], ["B", "出兵占領所有東歐國家首都"], ["C", "提高對東歐國家的經濟援助以換取效忠"], ["D", "要求東歐國家全數加入華沙公約組織"]], "ans": "A", "exp": "戈巴契夫宣布減少干預東歐國家內政後，東歐國家趁勢推動民主化運動，共產政權因而受到挑戰。"}, {"stem": "戈巴契夫宣布放鬆對東歐的控制後，東歐國家出現下列哪一種變化？", "opts": [["A", "共產政權更加穩固、持續掌權"], ["B", "紛紛推動民主化運動，共產政權相繼失勢瓦解"], ["C", "集體宣布加入美國"], ["D", "恢復君主專制政體"]], "ans": "B", "exp": "蘇聯不再干預東歐內政後，東歐各國掀起民主化運動，原本的共產政權紛紛失勢瓦解。"}, {"stem": "西元1991年蘇聯解體後，多個原蘇聯加盟共和國組成下列哪一個組織？", "opts": [["A", "華沙公約組織"], ["B", "歐洲聯盟"], ["C", "獨立國家國協"], ["D", "不結盟運動"]], "ans": "C", "exp": "各加盟共和國陸續宣布脫離蘇聯獨立，並另組「獨立國家國協」，蘇聯正式解體。"}, {"stem": "西元1991年，蘇聯國內保守派人士為阻止戈巴契夫的改革，採取下列哪一項行動，卻反而加速了蘇聯的解體？", "opts": [["A", "發動政變、軟禁戈巴契夫"], ["B", "宣布蘇聯永久解散"], ["C", "邀請美國派兵協助鎮壓"], ["D", "主動歸還柏林圍牆遺址"]], "ans": "A", "exp": "隨著戈巴契夫國內改革失利，保守派於1991年發動政變、軟禁戈巴契夫，政變雖平定，但蘇聯政局更加動盪，加速走向解體。"}, {"stem": "西元1991年蘇聯解體後，長達數十年的美、蘇對抗局勢也隨之發生下列何種變化？", "opts": [["A", "進一步升高為全面戰爭"], ["B", "演變為更激烈的軍備競賽"], ["C", "美、蘇改為共同統治歐洲"], ["D", "冷戰正式結束"]], "ans": "D", "exp": "蘇聯解體後，長達數十年的美、蘇冷戰對抗也隨之結束。"}, {"stem": "冷戰結束後，國際秩序不再是單純的美、蘇兩極對抗，而是逐漸走向下列何種局面？", "opts": [["A", "多元並立的國際秩序"], ["B", "完全由聯合國單一主導的世界政府"], ["C", "回復到帝國主義殖民體系"], ["D", "恢復兩大陣營對抗但角色互換"]], "ans": "A", "exp": "冷戰結束後，世界邁入全球化與多元並立的時代，各文化與民族相互依存、彼此影響。"}, {"stem": "冷戰結束、蘇聯解體後，世界雖然不再有兩大陣營的直接對抗，但仍因下列哪些因素而衝突不斷？", "opts": [["A", "兩極對抗再度復燃"], ["B", "全球恢復君主專制"], ["C", "各國重新殖民非洲"], ["D", "宗教、經濟、文化等方面的差異"]], "ans": "D", "exp": "冷戰結束並不代表世界從此和平，各地仍因宗教、經濟、文化上的差異而衝突頻傳，甚至引發恐怖攻擊等新的國際問題。"}, {"stem": "「華沙公約組織」的性質最適合以下列何者描述？", "opts": [["A", "亞、非新興國家組成的經濟合作組織"], ["B", "美國與西歐國家組成的反共軍事同盟"], ["C", "蘇聯與東歐共產國家組成的軍事同盟"], ["D", "聯合國轄下維持和平的常設機構"]], "ans": "C", "exp": "華沙公約組織是蘇聯聯合東歐共產國家建立的軍事同盟，用以與美國陣營相抗衡。"}, {"stem": "西元1971年，聯合國大會中因為許多第三世界國家代表的支持，決定讓下列哪一個政府加入聯合國，使中華民國因此宣布退出聯合國？", "opts": [["A", "蘇聯"], ["B", "中華人民共和國"], ["C", "東德"], ["D", "巴勒斯坦"]], "ans": "B", "exp": "課本提到，1971年聯合國大會中，許多第三世界國家代表支持中華人民共和國加入聯合國，我國因此宣布退出聯合國，顯示第三世界國家在國際組織中已具有相當的影響力。"}, {"stem": "「馬歇爾計畫」援助歐洲戰後經濟重建的資金，主要由下列哪一國提供？", "opts": [["A", "蘇聯"], ["B", "英國"], ["C", "美國"], ["D", "中國"]], "ans": "C", "exp": "馬歇爾計畫由美國提供大筆資金，協助歐洲各國進行戰後經濟重建，防止共產勢力藉經濟蕭條擴張。"}, {"stem": "二次大戰後，德國與柏林曾由下列哪四個國家分區占領，種下日後柏林危機與東西德分裂的遠因？", "opts": [["A", "美、英、法、義"], ["B", "美、英、法、蘇"], ["C", "美、蘇、中、英"], ["D", "英、法、蘇、日"]], "ans": "B", "exp": "二次大戰後，德國與柏林由美、英、法、蘇四國分區占領，日後美、英、法占領區合併成立西德，蘇聯占領區則成立東德。"}, {"stem": "西元1948年，蘇聯之所以封鎖通往西柏林的陸路交通，主要是因為不滿下列哪一項行動？", "opts": [["A", "西柏林民眾發起獨立公投"], ["B", "西德加入不結盟運動"], ["C", "西柏林拒絕接受馬歇爾計畫援助"], ["D", "美、英、法三國企圖在其占領區成立獨立的政府"]], "ans": "D", "exp": "蘇聯不滿美、英、法三國企圖在其占領區成立政府，於是封鎖通往西柏林的陸路交通，引發柏林危機。"}, {"stem": "冷戰期間，美、蘇兩國之間展開激烈的軍備競賽，雙方競相研發與生產下列哪一種毀滅性武器？", "opts": [["A", "核子武器"], ["B", "生化武器"], ["C", "弓箭與刀劍等冷兵器"], ["D", "無人飛機"]], "ans": "A", "exp": "冷戰時期，美、蘇兩國大量研發與生產核子武器，展開軍備競賽，使國際局勢籠罩在核戰陰影之下。"}, {"stem": "美、蘇兩大陣營雖然對立，卻始終避免爆發全面戰爭，主要原因為何？", "opts": [["A", "雙方經濟過於貧困，無力發動戰爭"], ["B", "聯合國強制雙方簽署互不侵犯條約"], ["C", "雙方領導人私交甚篤"], ["D", "雙方憂慮核子武器造成的毀滅性後果"]], "ans": "D", "exp": "美、蘇兩大陣營因憂慮核子武器一旦使用將帶來互相毀滅的後果，因此避免全面開戰，形成「冷戰」的僵持局面。"}, {"stem": "「古巴危機」發生於西元哪一年？", "opts": [["A", "1962年"], ["B", "1948年"], ["C", "1949年"], ["D", "1991年"]], "ans": "A", "exp": "西元1962年，蘇聯在古巴部署飛彈，引發美、蘇之間的「古巴危機」。"}, {"stem": "以色列宣布建國是在西元哪一年？", "opts": [["A", "1945年"], ["B", "1948年"], ["C", "1955年"], ["D", "1962年"]], "ans": "B", "exp": "西元1948年，以色列宣布建國，隨即與周邊阿拉伯國家爆發戰爭。"}, {"stem": "「柏林危機」發生於西元哪一年，蘇聯下令封鎖通往西柏林的陸路交通？", "opts": [["A", "1945年"], ["B", "1947年"], ["C", "1948年"], ["D", "1961年"]], "ans": "C", "exp": "西元1948年，蘇聯下令封鎖通往西柏林的陸路交通，美、英兩國以空運物資援助，史稱「柏林危機」。"}, {"stem": "冷戰時期，美、蘇兩大陣營的對抗，本質上最主要是下列哪兩種制度或理念之爭？", "opts": [["A", "民主（資本主義）與共產主義之爭"], ["B", "君主制與共和制之爭"], ["C", "一神教與多神教之爭"], ["D", "農業社會與工業社會之爭"]], "ans": "A", "exp": "冷戰是以美國為首的民主（反共）陣營，與以蘇聯為首的共產陣營之間的對抗，本質上是兩種政治、經濟制度與理念之爭。"}, {"stem": "冷戰結束後，國際局勢邁入全球化，但下列哪一類事件顯示世界仍未因此完全和平，衝突與挑戰依然存在？", "opts": [["A", "馬歇爾計畫的推行"], ["B", "柏林圍牆的興建"], ["C", "北大西洋公約組織的成立"], ["D", "恐怖攻擊事件（如美國九一一事件）"]], "ans": "D", "exp": "冷戰結束後，世界並未從此完全和平，各地仍因政治、經濟、宗教等差異發生嚴重衝突，恐怖攻擊事件（如2001年美國九一一事件）即為一例，顯示當前國際局勢仍充滿挑戰。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

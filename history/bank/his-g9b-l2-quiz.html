<script>
const QS=[{"stem": "十九世紀帝國主義興起的背景中，下列何者屬於「經濟因素」？", "opts": [["A", "列強強調民族光榮，欲藉武力展現國威"], ["B", "社會達爾文主義主張優勝劣敗、適者生存"], ["C", "列強欲教化落後地區，實踐宗教使命"], ["D", "列強需要海外原料與廣大市場，故積極向外爭奪殖民地"]], "ans": "D", "exp": "課本說明十九世紀帝國主義興起有經濟、政治、文化三項因素，經濟上列強因工業化需要海外原料與市場，積極向外拓展殖民地；(A)屬政治因素，(B)(C)屬文化因素。"}, {"stem": "十九世紀盛行的「社會達爾文主義」，其理論基礎源自於下列何者？", "opts": [["A", "亞當斯密的自由經濟學說"], ["B", "達爾文的生物演化論「優勝劣敗，適者生存」"], ["C", "馬克思的階級鬥爭理論"], ["D", "孟德斯鳩的三權分立學說"]], "ans": "B", "exp": "生物學家達爾文提出演化論「優勝劣敗，適者生存」，後來被應用來解釋人類社會的發展，稱為「社會達爾文主義」。"}, {"stem": "下列何者是十九世紀歐美列強用來合理化其對外殖民侵略行為的說法？", "opts": [["A", "民族自決原則"], ["B", "十四點和平原則"], ["C", "社會達爾文主義，主張列強有「教化」落後民族的責任"], ["D", "門羅宣言"]], "ans": "C", "exp": "十九世紀晚期歐美盛行社會達爾文主義，列強藉此合理化其侵略行為，自認負有教化落後地區的使命。"}, {"stem": "十九世紀帝國主義興起後，下列何者是課本中提到亞洲部分國家因應列強侵略的方式？", "opts": [["A", "中國、日本分別推動改革，仍保有獨立地位"], ["B", "亞洲各國全數淪為列強殖民地"], ["C", "亞洲各國組成軍事同盟共同對抗列強"], ["D", "亞洲各國邀請美國協助對抗歐洲列強"]], "ans": "A", "exp": "十九世紀西方列強侵略亞洲時，中國、日本分別實施改革（如自強運動、明治維新）因應，仍能保有獨立地位；但許多南亞、東南亞國家則淪為殖民地。"}, {"stem": "關於英國在印度的殖民統治，下列敘述何者正確？", "opts": [["A", "英國協助印度發展民主制度"], ["B", "英國扶植印度成立獨立政府"], ["C", "英國推動印度全面工業化，帶動經濟起飛"], ["D", "英國在印度大量種植棉花、茶葉等經濟作物，造成當地糧食短缺甚至引發饑荒"]], "ans": "D", "exp": "課本提到英國在印度種植棉花、茶葉等經濟作物，造成當地糧食短缺，甚至引發饑荒。"}, {"stem": "法國殖民越南時，採取下列何種做法？", "opts": [["A", "扶植越南建立君主立憲制度"], ["B", "積極傳教，迫使當地人接受天主教信仰，使原有文化受到衝擊"], ["C", "協助越南發展現代化教育體系"], ["D", "允許越南保有完全自治權"]], "ans": "B", "exp": "課本提到法國在殖民越南時積極傳教，迫使當地接受天主教信仰，使其原有文化受到衝擊。"}, {"stem": "關於美國在拉丁美洲的作為，下列敘述何者正確？", "opts": [["A", "美國藉軍事與經濟力量掌控拉丁美洲部分地區的內政與經濟，並鎮壓當地反抗"], ["B", "美國協助拉丁美洲各國建立海外殖民地"], ["C", "美國與拉丁美洲各國組成同盟對抗歐洲列強"], ["D", "美國將拉丁美洲全數納為正式殖民地"]], "ans": "A", "exp": "美國自十九世紀以來透過軍事與經濟力量，掌控拉丁美洲部分地區的內政與經濟，當地人民曾因不堪剝削而抗爭，卻遭美軍鎮壓。"}, {"stem": "十九世紀末，非洲地區除下列哪兩國仍保持獨立外，其餘地區幾乎都已淪為歐洲列強的殖民地？", "opts": [["A", "埃及與蘇丹"], ["B", "摩洛哥與突尼西亞"], ["C", "衣索比亞與賴比瑞亞"], ["D", "剛果與奈及利亞"]], "ans": "C", "exp": "三版本課本皆提到，至十九世紀末，除衣索比亞與賴比瑞亞外，非洲絕大部分地區已被歐洲列強瓜分殆盡。"}, {"stem": "歐洲列強瓜分非洲之時，未考慮下列何種因素，導致日後容易出現領土與民族糾紛？", "opts": [["A", "各地礦產資源的分布"], ["B", "各地氣候與地形條件"], ["C", "傳教士活動的範圍"], ["D" let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

<script>
const QS=[{"stem": "清代前期，臺灣移墾社會中，許多沒有固定工作、沒有成家的單身男子被稱為什麼？", "opts": [["A", "羅漢腳"], ["B", "客頭"], ["C", "義民"], ["D", "熟番"]], "ans": "A", "exp": "「羅漢腳」指清代來臺移民中沒有固定工作與居所的單身男子，他們缺乏家庭依靠，經常為爭奪資源與利益而爆發衝突，是社會上不安定的因素之一。"}, {"stem": "清代來臺開墾的漢人以福建、廣東兩省人數最多，其中福建移民又以下列何者居多？", "opts": [["A", "汀州、永春"], ["B", "福州、興化"], ["C", "泉州、漳州"], ["D", "惠州、潮州"]], "ans": "C", "exp": "清代移民來臺者，以福建（簡稱「閩」）的泉州、漳州兩地移民（閩南人）最多，其次是廣東（簡稱「粵」）的客家人。"}, {"stem": "清代渡臺禁令限制移民攜眷來臺，加上偷渡來臺者多為單身男性，導致臺灣移墾社會出現下列何種現象？", "opts": [["A", "讀書風氣鼎盛"], ["B", "男女比例懸殊，性別比例失衡"], ["C", "商業高度發達"], ["D", "宗教信仰統一"]], "ans": "B", "exp": "由於渡臺禁令的影響，加上偷渡來臺者以男性居多，使得臺灣移墾社會呈現「男多女少」，性別比例懸殊的現象。"}, {"stem": "「有唐山公，無唐山媽」這句俗諺，反映清代臺灣移民社會的哪一種現象？", "opts": [["A", "移民多信奉媽祖"], ["B", "移民都來自福建"], ["C", "移民重視宗族祭祀"], ["D", "漢人男子與原住民女子通婚十分普遍"]], "ans": "D", "exp": "由於清代渡臺禁令與男女比例失衡，許多來臺男子終身未婚成為「羅漢腳」，部分則與原住民女子通婚，因而出現「有唐山公，無唐山媽」的說法。"}, {"stem": "清代移民渡海來臺過程艱辛，因此有「六死，三留，一回頭」的俗諺，這句話主要描述的是？", "opts": [["A", "械鬥造成的死傷比例"], ["B", "科舉考試的錄取率"], ["C", "原住民人口的消長"], ["D", "移民渡海來臺過程中面臨的死亡風險與去留情況"]], "ans": "D", "exp": "這句諺語意指渡海來臺的人，超過半數會因海難、水土不服、漢番衝突等因素而死亡，還有部分選擇返回故鄉，最終只有三成的人會留下，反映移民渡臺的艱辛與高風險。"}, {"stem": "下列關於清代臺灣移墾社會特色的敘述，何者正確？", "opts": [["A", "移民男女比例均衡，社會相當安定"], ["B", "移民以男性居多，性別比例失衡，社會衝突頻傳"], ["C", "移民多攜家帶眷來臺，鮮少單身男子"], ["D", "移民全部來自廣東，沒有福建移民"]], "ans": "B", "exp": "清代來臺移民以青壯年單身男子居多，性別比例失衡；加上移民間爭奪資源、官府控制力不足，導致械鬥、民變等社會衝突頻繁發生。"}, {"stem": "清代移民來臺後，常因語言、生活習慣不同，或為爭奪水源、田地、商業利益而爆發集體武力衝突，這種現象稱為什麼？", "opts": [["A", "械鬥"], ["B", "民變"], ["C", "開山撫番"], ["D", "劃界封山"]], "ans": "A", "exp": "移民因語言、祖籍差異，或為爭奪田地、水源、商業利益而爆發衝突時，常糾集同祖籍或姓氏的群眾，以武力相互鬥毆解決，稱為「械鬥」，這與反抗官府的「民變」不同。"}, {"stem": "下列哪一組械鬥，是清代臺灣以「祖籍」劃分、最常見的械鬥類型之一？", "opts": [["A", "官民衝突"], ["B", "漢番通婚糾紛"], ["C", "閩、粵械鬥"], ["D", "教會與官府衝突"]], "ans": "C", "exp": "清代臺灣的械鬥中，以不同祖籍或地區之間的衝突最頻繁，例如閩、粵械鬥與漳、泉械鬥，都是以祖籍作為劃分依據的集體衝突。"}, {"stem": "彰化縣鹿港鎮在清代歷經多次械鬥，當地商人與士紳為了防禦，設置了下列哪一項設施？", "opts": [["A", "書院"], ["B", "醫館"], ["C", "隘門"], ["D", "義民廟"]], "ans": "C", "exp": "鹿港歷經多次漳泉械鬥，商人與士紳為了維護地方安全，設置隘門作為防禦工事，平時每日傍晚關閉，以防止盜匪或械鬥衝突入侵。"}, {"stem": "械鬥發生時，衝突雙方通常會如何組織群眾？", "opts": [["A", "糾集同祖籍或同姓氏的群眾"], ["B", "依官府指派的職務分組"], ["C", "依信仰的神明分組"], ["D", "依科舉功名的高低分組"]], "ans": "A", "exp": "當移民因爭奪資源產生衝突時，往往各自糾集同祖籍或同姓氏的群眾，集體以武力互鬥，形成械鬥，這是清代臺灣社會衝突的重要特徵。"}, {"stem": "下列關於清代臺灣械鬥的敘述，何者正確？", "opts": [["A", "械鬥只發生在原住民與漢人之間"], ["B", "械鬥經常由官府主動發起"], ["C", "械鬥在清代中期以後完全絕跡"], ["D", "械鬥的起因常與爭奪水源、土地、商業利益有關"]], "ans": "D", "exp": "械鬥主要是漢人移民內部因語言、祖籍不同，加上爭奪水源、田地與商業利益等因素所引發的集體武力衝突，並非全然針對原住民，也並非官府主動發起。"}, {"stem": "有應公廟、萬善祠等祭祀無主孤魂的廟宇，在清代臺灣大量出現，最能反映下列哪一種社會現象？", "opts": [["A", "移民生活富裕安定"], ["B", "械鬥、民變等社會衝突頻繁，客死異鄉者眾多"], ["C", "原住民信仰十分興盛"], ["D", "科舉制度相當發達"]], "ans": "B", "exp": "許多移民來臺後因械鬥、民變或疫病而客死異鄉，卻無子孫供奉，民間便為這些無主孤魂建祠祭祀，稱為有應公廟、萬善祠等，反映清代臺灣社會生存艱辛、衝突頻繁的現象。"}, {"stem": "清代臺灣官員治理不佳、社會動盪不安，因此有「三年一小反，五年一大亂」的說法，這句話主要用來形容？", "opts": [["A", "械鬥發生的頻率"], ["B", "民變經常發生"], ["C", "科舉考試舉行的週期"], ["D", "原住民遷徙的頻率"]], "ans": "B", "exp": "由於治臺官員良莠不齊、社會浮動不安，反抗官府的民變經常發生，因此有「三年一小反，五年一大亂」的說法，用來形容民變頻繁的現象。"}, {"stem": "西元1721年（康熙60年），因不滿官府強徵財物，以「反清復明」為號召起事抗官的民變是？", "opts": [["A", "林爽文事件"], ["B", "戴潮春事件"], ["C", "大甲西社事件"], ["D", "朱一貴事件"]], "ans": "D", "exp": "朱一貴事件發生於西元1721年，朱一貴不滿官府強徵財物，以「反清復明」為號召起事抗官，是清代臺灣三大民變中最早發生的一次。"}, {"stem": "清代臺灣規模最大的一場民變，是因官府清剿民間祕密組織「天地會」而引發，這場事件是？", "opts": [["A", "朱一貴事件"], ["B", "戴潮春事件"], ["C", "林爽文事件"], ["D", "大港口事件"]], "ans": "C", "exp": "西元1786年（乾隆51年），官府清剿天地會，導致林爽文等人起事抗官，最終演變為清帝國時期臺灣規模最大的民變，史稱林爽文事件。"}, {"stem": "清代臺灣歷時最久的一場抗官事件，是由地方會黨首領率眾起事，清廷費時三年多才平定，這場事件是？", "opts": [["A", "戴潮春事件"], ["B", "朱一貴事件"], ["C", "林爽文事件"], ["D", "牡丹社事件"]], "ans": "A", "exp": "西元1862年（同治元年），地方會黨首領戴潮春領導群眾起事，清廷費時三年多才得以平定，是清帝國時期臺灣歷時最長的抗官事件。"}, {"stem": "林爽文事件爆發後，桃竹苗地區的客家居民組織武力協助清帝國圍攻林爽文的追隨者，事後乾隆皇帝御賜哪一匾額褒揚客家族群？", "opts": [["A", "褒忠"], ["B", "開臺進士"], ["C", "義薄雲天"], ["D", "忠孝節義"]], "ans": "A", "exp": "林爽文事件爆發後，桃竹苗地區的客家居民組織義民軍保衛家園並協助官府平亂，事件平定後，乾隆皇帝御賜「褒忠」匾額給客家族群，新竹一帶客家族群也建廟奉祀犧牲的同胞（即褒忠亭義民廟）。"}, {"stem": "戴潮春事件之所以能持續三年多才平定，主要原因之一是下列何者？", "opts": [["A", "官府完全不派兵鎮壓"], ["B", "戴潮春事先擬定了周詳的建國計畫"], ["C", "站在官府一方的霧峰林家將主力部隊調往中國大陸平亂，駐臺清軍戰力不足"], ["D", "原住民全面支持戴潮春起事"]], "ans": "C", "exp": "戴潮春事件歷時三年多，很大原因是站在官府這邊的中部大族霧峰林家，把主力部隊調去協助平定中國大陸的動亂，駐臺清軍戰力不足，因此拖到調兵來臺後才逐漸平定。"}, {"stem": "下列關於清代臺灣「三大民變」的敘述，何者正確？", "opts": [["A", "三大民變都發生在同一年"], ["B", "三大民變依發生先後依序為朱一貴事件、林爽文事件、戴潮春事件"], ["C", "三大民變都是原住民與漢人衝突所引發"], ["D", "三大民變後清廷完全停止治理臺灣"]], "ans": "B", "exp": "清帝國統治期間規模較大的民變依發生先後為：朱一貴事件（1721年）、林爽文事件（1786年）、戴潮春事件（1862年），三者合稱「臺灣三大民變」，都是反抗官府的行動，而非原漢衝突。"}, {"stem": "下列哪一組神明，是清代臺灣移民不分祖籍、逐漸成為共同信仰的神明？", "opts": [["A", "清水祖師、開漳聖王"], ["B", "三山國王、關聖帝君"], ["C", "保生大帝、開臺聖王"], ["D", "媽祖、王爺、土地公"]], "ans": "D", "exp": "早期移民多供奉原鄉神明，但媽祖、王爺、土地公等神明，隨著移民互動增加，逐漸跨越族群與祖籍限制，成為臺灣共同的信仰。"}, {"stem": "清水祖師信仰在清代臺灣，主要與下列哪一籍貫的移民關係最密切？", "opts": [["A", "漳州人"], ["B", "潮州人"], ["C", "客家人"], ["D", "泉州人"]], "ans": "D", "exp": "清水祖師是泉州人的原鄉信仰代表，隨著泉州移民來臺而傳入，成為臺灣民間信仰的一部分。"}, {"stem": "開漳聖王信仰在清代臺灣，主要是下列哪一籍貫移民所供奉？", "opts": [["A", "泉州人"], ["B", "漳州人"], ["C", "潮州人"], ["D", "平埔族"]], "ans": "B", "exp": "開漳聖王是漳州人的原鄉信仰，隨著漳州移民渡海來臺而在臺灣落地生根，信眾以漳州人為主。"}, {"stem": "三山國王信仰在清代臺灣，主要與下列哪一籍貫移民的原鄉信仰有關？", "opts": [["A", "潮州人"], ["B", "泉州人"], ["C", "漳州人"], ["D", "福建客家人"]], "ans": "A", "exp": "三山國王是潮州人的原鄉信仰，隨潮州移民來臺而傳入，成為臺灣移民社會中具地區特色的信仰之一。"}, {"stem": "清代移民渡海來臺後，往往在同鄉聚居的村莊建廟供奉神明，最主要的目的為何？", "opts": [["A", "純粹為了觀光"], ["B", "官府強制規定"], ["C", "拓墾過程中尋求心靈慰藉與神明庇佑"], ["D", "與科舉考試直接相關"]], "ans": "C", "exp": "早期移民在拓墾過程中充滿不安與危機，常在同鄉聚居的村莊建廟，供奉原鄉神明作為守護神，藉此尋求心靈上的慰藉與庇佑。"}, {"stem": "下列關於清代臺灣宗教信仰的敘述，何者正確？", "opts": [["A", "移民的信仰完全相同，沒有原鄉差異"], ["B", "有應公廟祭祀的是德高望重的地方仕紳"], ["C", "媽祖、王爺、土地公等信仰逐漸成為不分祖籍的共同信仰"], ["D", "原住民完全沒有接觸漢人信仰"]], "ans": "C", "exp": "移民雖各自供奉原鄉神明，但媽祖、王爺、土地公等神明逐漸跨越族群與祖籍限制，成為地區或全臺性的共同信仰；有應公廟祭祀的是無主孤魂而非仕紳。"}, {"stem": "清代早期移民以祭祀原鄉同姓歷史人物為對象，藉此凝聚不一定有血緣關係的同姓者，這種祭祀對象稱為？", "opts": [["A", "唐山祖"], ["B", "開臺祖"], ["C", "有應公"], ["D", "義民"]], "ans": "A", "exp": "「唐山祖」是初期移民共同祭祀的對象，通常是原鄉較著名的同姓歷史人物，其組成分子同姓但未必有血緣關係，目的在凝聚同姓移民的力量。"}, {"stem": "隨著移民定居日久、子孫繁衍，宗族開始改為祭祀來臺開墾的第一代祖先，這種祭祀對象稱為？", "opts": [["A", "唐山祖"], ["B", "城隍爺"], ["C", "保生大帝"], ["D", "開臺祖"]], "ans": "D", "exp": "移民定居日久後，有血緣關係的同姓族人開始修族譜、建祠堂，並祭祀來臺開墾的第一代祖先，稱為「開臺祖」，以紀念其拓墾之功。"}, {"stem": " m": "清代規模最大的原住民抗官事件，發生於雍正年間，起因是官府指派的勞役過重，這場事件是？", "opts": [["A", "牡丹社事件"], ["B", "大港口事件"], ["C", "戴潮春事件"], ["D", "大甲西社事件"]], "ans": "D", "exp": "西元1731年（雍正9年），大甲西社因官府指派的勞役過重，聯合中部其他平埔族群發動武裝抗官行動，是清代臺灣規模最大的原住民抗官事件。"}, {"stem": "大甲西社事件中，帶頭反抗官府的族群主要分布於下列何處？", "opts": [["A", "花蓮豐濱一帶的阿美族"], ["B", "恆春半島的排灣族"], ["C", "今臺中市大甲區一帶的平埔族"], ["D", "埔里盆地的邵族"]], "ans": "C", "exp": "大甲西社位於今臺中市大甲區一帶，是平埔族群的一支，因不堪官府沉重的勞役負擔，聯合其他平埔族群共同起事抗官。"}, {"stem": "大甲西社事件的爆發，主要與下列哪一項官府政策或作為的壓迫有關？", "opts": [["A", "沉重的勞役（差役）負擔"], ["B", "渡臺禁令的限制"], ["C", "劃界封山政策"], ["D", "科舉制度的限制"]], "ans": "A", "exp": "已歸順清帝國的平埔族群須向官方繳納賦稅、服勞役，但官員經常欺壓、過度役使原住民，導致大甲西社不堪沉重勞役而聯合各社起事反抗。"}, {"stem": "清帝國統治初期，為隔離漢人與高山原住民（生番）而劃定界線的政策，稱為？", "opts": [["A", "劃界封山"], ["B", "開山撫番"], ["C", "移民實邊"], ["D", "保甲制度"]], "ans": "A", "exp": "清初實施「劃界封山」政策，以人為或天然地形劃定番界，隔離漢人與高山原住民的活動範圍，使高山原住民得以保留較多傳統文化，不易受到外人侵擾。"}, {"stem": "西元1877年（光緒3年），清廷強行開闢通往東部的道路，引起原住民反抗，最終導致當地阿美族人遭清軍殺害，這場事件稱為？", "opts": [["A", "牡丹社事件"], ["B", "大甲西社事件"], ["C", "大港口事件"], ["D", "戴潮春事件"]], "ans": "C", "exp": "西元1877年，清廷強行開闢水尾至大港口的道路，引起原住民部落反抗，結果當地阿美族人遭清軍殺害，史稱「大港口事件」，是清帝國開山撫番政策下原漢衝突的重要案例。"}];
let done=0,right=0;
const box=document.getElementById('qs');

    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

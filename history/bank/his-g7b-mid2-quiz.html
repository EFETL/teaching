<script>
const QS=[{"stem": "日治時期，臺灣總督府規定日本人子弟主要就讀哪一種學校？", "opts": [["A", "小學校"], ["B", "公學校"], ["C", "蕃童教育所"], ["D", "國語傳習所"]], "ans": "A", "exp": "總督府採差別待遇原則，日本人子弟就讀「小學校」，教學內容與日本本國一致；臺灣人子弟則就讀「公學校」，原住民就讀「蕃童教育所」或「蕃人公學校」。"}, {"stem": "日治時期，臺灣人（非原住民）子弟主要就讀哪一種學校？", "opts": [["A", "小學校"], ["B", "高等女學校"], ["C", "公學校"], ["D", "蕃人公學校"]], "ans": "C", "exp": "臺人多就讀「公學校」，雖以日語教學為主，但師資、教材、設備都不如小學校。"}, {"stem": "日治時期，原住民兒童主要就讀哪一（些）教育機構？", "opts": [["A", "小學校"], ["B", "蕃童教育所或蕃人公學校"], ["C", "公學校"], ["D", "師範學校"]], "ans": "B", "exp": "原住民兒童就讀「蕃童教育所」或「蕃人公學校」，教學設備與師資都不如小學校。"}, {"stem": "總督府建立差別待遇的教育制度，其背後最主要的目的為何？", "opts": [["A", "提升臺灣人受教育年限"], ["B", "落實日臺教育完全平等"], ["C", "培養臺灣人參政能力"], ["D", "同化臺人並培養殖民統治所需人力"]], "ans": "D", "exp": "總督府推動現代教育的目的在於同化臺人、培養產業發展所需人力，藉此強化殖民統治。"}, {"stem": "西元1941年，總督府配合哪一運動，將小學校、公學校一律改稱「國民學校」？", "opts": [["A", "文化啟蒙運動"], ["B", "皇民化運動"], ["C", "地方自治運動"], ["D", "議會設置請願運動"]], "ans": "B", "exp": "西元1941年，總督府配合皇民化運動，將小學校、公學校一律改稱「國民學校」。"}, {"stem": "西元1943年，總督府開始在臺灣實施何種教育制度？", "opts": [["A", "六年義務教育"], ["B", "地方議員選舉"], ["C", "鴉片完全禁止"], ["D", "男子普選制度"]], "ans": "A", "exp": "西元1943年開始實施六年義務教育，兒童就學率與日語普及率因此逐漸提升。"}, {"stem": "臺灣第一所專為臺灣人子弟設立的中學校是？", "opts": [["A", "臺北帝國大學"], ["B", "國語學校"], ["C", "臺中中學校"], ["D", "醫學校"]], "ans": "C", "exp": "西元1915年，林獻堂等臺灣士紳集資成立臺中中學校（今臺中一中），是第一所專收臺人子弟的中學校。"}, {"stem": "臺中中學校的創辦，主要是由哪些人士推動促成？", "opts": [["A", "總督府官員"], ["B", "日本內地商人"], ["C", "蔣渭水等醫師"], ["D", "林獻堂等臺灣士紳"]], "ans": "D", "exp": "林獻堂等臺灣士紳為爭取臺人受教育的機會，於西元1915年促成臺中中學校的設立。"}, {"stem": "日治時期中等以上教育以何種原則為主？", "opts": [["A", "實用取向，偏重職業教育"], ["B", "完全比照日本本土的普通教育"], ["C", "以培養行政官員為主"], ["D", "專門培育軍事人才"]], "ans": "A", "exp": "日治時期中等教育以實用為原則，總督府設立師範、醫學與農工商等職業學校，培養教師、醫師與技術人才。"}, {"stem": "西元1928年，總督府設立的臺灣最高學府是？", "opts": [["A", "臺中中學校"], ["B", "國語學校"], ["C", "臺灣總督府醫學校"], ["D", "臺北帝國大學"]], "ans": "D", "exp": "西元1928年，總督府設立臺北帝國大學（今國立臺灣大學前身），是日治時期臺灣的最高學府。"}, {"stem": "若臺灣人希望接受完整的高等教育，日治時期多數人會選擇？", "opts": [["A", "就讀臺中中學校"], ["B", "前往日本本國留學"], ["C", "進入蕃人公學校進修"], ["D", "就讀公學校高等科"]], "ans": "B", "exp": "由於臺灣高等教育機會不足，經濟條件較佳的臺灣人若要繼續升學，大多前往日本國內就學。"}, {"stem": "一九二〇年代以後，透過現代教育與海外求學崛起的新社會精英，日後扮演了什麼角色？", "opts": [["A", "全力配合總督府的殖民統治"], ["B", "專注於經商累積財富"], ["C", "成為推動政治、社會、文化運動的重要人物"], ["D", "多數返鄉從事農業生產"]], "ans": "C", "exp": "新社會精英普遍接受新思想與專業訓練，成為推動臺灣政治、社會、文化運動的重要人物，如林獻堂、蔣渭水等人。"}, {"stem": "西元1921年，林獻堂、蔣渭水等人成立的組織是？", "opts": [["A", "臺灣民眾黨"], ["B", "臺灣文化協會"], ["C", "臺灣地方自治聯盟"], ["D", "臺灣共產黨"]], "ans": "B", "exp": "西元1921年，林獻堂、蔣渭水等人成立「臺灣文化協會」，開啟臺灣的文化啟蒙運動。"}, {"stem": "臺灣文化協會成立的主要目的為何？", "opts": [["A", "啟迪民智、喚起臺人民族意識"], ["B", "爭取臺灣獨立建國"], ["C", "發展臺灣工業經濟"], ["D", "推動全面武裝抗日"]], "ans": "A", "exp": "臺灣文化協會希望透過各種活動，達到啟迪民智及喚起臺人民族意識的目的。"}, {"stem": "臺灣文化協會主要透過哪一份刊物發表言論、宣傳理念？", "opts": [["A", "臺灣日日新報"], ["B", "臺灣時報"], ["C", "漢文臺灣日日新報"], ["D", "臺灣民報"]], "ans": "D", "exp": "臺灣文化協會透過「臺灣民報」發表言論，這是了解當時臺灣人爭取權利歷程的珍貴史料。"}, {"stem": "臺灣文化協會曾舉辦下列哪些活動，以啟迪民智？", "opts": [["A", "選美活動與運動會"], ["B", "地方議員選舉"], ["C", "演講會、夏季學校、讀報社"], ["D", "農工運動與罷工"]], "ans": "C", "exp": "臺灣文化協會舉辦演講會、夏季學校、讀報社等活動，希望啟迪民智、喚起臺人的民族意識。"}, {"stem": "「臺灣民報」在西元1930年後改稱為？", "opts": [["A", "臺灣新民報"], ["B", "臺灣公論報"], ["C", "臺灣青年"], ["D", "臺灣新聞"]], "ans": "A", "exp": "臺灣民報於西元1930年後改稱為臺灣新民報。"}, {"stem": "第一次世界大戰後，帶動臺灣文化啟蒙與政治社會運動蓬勃發展的國際思潮為何？", "opts": [["A", "社會主義革命浪潮"], ["B", "帝國殖民擴張風潮"], ["C", "宗教復興運動"], ["D", "民族自決風潮"]], "ans": "D", "exp": "第一次世界大戰後，全球瀰漫民族自決的風潮，加上日本國內要求民主的聲浪高漲，衝擊臺灣青年，促使政治、社會運動蓬勃發展。"}, {"stem": "西元1921年，林獻堂、蔣渭水等人發起的政治運動稱為？", "opts": [["A", "臺灣民眾黨運動"], ["B", "地方自治聯盟運動"], ["C", "臺灣議會設置請願運動"], ["D", "臺灣共產黨運動"]], "ans": "C", "exp": "西元1921年，林獻堂、蔣渭水等人發起「臺灣議會設置請願運動」。"}, {"stem": "臺灣議會設置請願運動的主要訴求為何？", "opts": [["A", "在臺設立「臺灣議會」"], ["B", "廢除公學校制度"], ["C", "全面禁止鴉片"], ["D", "實施地方自治選舉"]], "ans": "A", "exp": "該運動要求在臺灣設立「臺灣議會」，以爭取臺人的政治參與權。"}, {"stem": "臺灣議會設置請願運動總共歷經多少次請願行動？", "opts": [["A", "五次"], ["B", "八次"], ["C", "十次"], ["D", "十五次"]], "ans": "D", "exp": "林獻堂、蔣渭水等人歷經十五次的請願行動，雖未獲日本政府同意，但喚起了臺灣民眾的政治意識。"}, {"stem": "臺灣議會設置請願運動最終的結果為何？", "opts": [["A", "總督府同意成立臺灣議會"], ["B", "未獲日本政府同意，但喚起臺人政治意識"], ["C", "促成臺灣獨立"], ["D", "促使總督府立即實施全面普選"]], "ans": "B", "exp": "這場運動雖未獲得日本政府同意，卻喚起了臺灣民眾的政治意識，具有重要的歷史意義。"}, {"stem": "西元1927年，蔣渭水等人籌組的臺灣第一個合法政黨是？", "opts": [["A", "臺灣共產黨"], ["B", "臺灣地方自治聯盟"], ["C", "臺灣民眾黨"], ["D", "臺灣文化協會"]], "ans": "C", "exp": "西元1927年，蔣渭水等人籌組臺灣第一個合法政黨「臺灣民眾黨」。"}, {"stem": "臺灣民眾黨除了宣導民權、地方自治觀念外，也積極參與哪一類運動？", "opts": [["A", "農工運動"], ["B", "議會請願運動"], ["C", "皇民化運動"], ["D", "放足斷髮運動"]], "ans": "A", "exp": "臺灣民眾黨也積極參與農工運動，以爭取農民與工人的權益。"}, {"stem": "西元1930年，林獻堂等人成立的團體是？", "opts": [["A", "臺灣民眾黨"], ["B", "臺灣文化協會"], ["C", "臺灣共產黨"], ["D", "臺灣地方自治聯盟"]], "ans": "D", "exp": "西元1930年，林獻堂等人成立「臺灣地方自治聯盟」，主張實施地方自治。"}, {"stem": "臺灣地方自治聯盟主要的訴求為何？", "opts": [["A", "廢除公學校制度"], ["B", "主張實施地方自治"], ["C", "要求全面武裝抗日"], ["D", "推動臺灣獨立建國"]], "ans": "B", "exp": "臺灣地方自治聯盟主張實施地方自治，經過知識分子不斷的請願和鼓吹，促成西元1935年的地方議員選舉。"}, {"stem": "西元1935年總督府舉辦的地方議員選舉，有何限制？", "opts": [["A", "全面開放男女普選"], ["B", "完全由臺灣人自治"], ["C", "半數議員仍由官方選任"], ["D", "僅開放給日本人投票"]], "ans": "C", "exp": "西元1935年的地方議員選舉，半數議員仍由官方選任，被視為有限度的地方自治。"}, {"stem": "西元1935年的地方議員選舉，在臺灣歷史上具有什麼重要意義？", "opts": [["A", "是臺灣史上民眾第一次行使投票權"], ["B", "是臺灣首次實施男女平等教育"], ["C", "標誌臺灣議會正式成立"], ["D", "象徵皇民化運動正式結束"]], "ans": "A", "exp": "這是臺灣史上民眾第一次行使投票權，雖不完全，卻讓臺人對自治、選舉觀念有了初步認識。"}, {"stem": "臺灣的政治社會運動最終因何事而被迫終止？", "opts": [["A", "臺灣議會成功設立"], ["B", "蔣渭水去世"], ["C", "地方自治完全落實"], ["D", "皇民化運動的推行（中日戰爭爆發後）"]], "ans": "D", "exp": "皇民化運動推行後，總督府強化對臺灣的控制，臺人的政治社會運動被迫終止。"}, {"stem": "綜觀臺灣議會設置請願運動、臺灣民眾黨、臺灣地方自治聯盟等政治社會運動，為臺灣人帶來什麼共同影響？", "opts": [["A", "使臺灣立即獨立建國"], ["B", "讓臺人對自治、參政等觀念有初步認識"], ["C", "徹底終結日本殖民統治"], ["D", "使臺灣議會正式成立"]], "ans": "B", "exp": "這些政治社會運動雖未能完全達成訴求，但已讓臺人對自治、選舉、參政等觀念有了初步的認識。"}, {"stem": "蔣渭水在從事政治社會運動之前，原本的職業是？", "opts": [["A", "教師"], ["B", "律師"], ["C", "醫師"], ["D", "記者"]], "ans": "C", "exp": "蔣渭水是一名醫師，在行醫濟世的同時，積極投入臺灣的文化啟蒙運動。"}, {"stem": "西元1921年，蔣渭水發表了哪一篇著名文章，以診斷書形式分析臺灣社會問題？", "opts": [["A", "臨床講義"], ["B", "臺灣通史"], ["C", "臺灣青年宣言"], ["D", "送報伕"]], "ans": "A", "exp": "西元1921年，蔣渭水發表「臨床講義」，利用醫生的角度，以診斷書的形式，深入淺出地分析臺灣社會的各種「疾病」。"}, {"stem": "在「臨床講義」中，蔣渭水將「臺灣」比喻為？", "opts": [["A", "一位智者"], 陸續開放黨禁、報禁。"}, {"stem": "政府在解除戒嚴後，陸續開放了下列哪些項目？", "opts": [["A", "兵役制度"], ["B", "出國觀光名額"], ["C", "貿易禁令"], ["D", "黨禁、報禁"]], "ans": "D", "exp": "解嚴後，政府陸續開放黨禁、報禁，保障人民集會結社的自由。"}, {"stem": "蔣經國總統逝世後，繼任總統的是？", "opts": [["A", "李登輝"], ["B", "嚴家淦"], ["C", "連戰"], ["D", "蔣緯國"]], "ans": "A", "exp": "蔣經國逝世後，由李登輝繼任總統，並繼續推動民主改革。"}, {"stem": "蔣經國逝世的時間點，下列敘述何者正確？", "opts": [["A", "在解嚴之前逝世"], ["B", "與解嚴同一年逝世"], ["C", "於解嚴隔年（民國77年）逝世"], ["D", "與解嚴時間無關"]], "ans": "C", "exp": "民國76年蔣經國宣布解嚴，隔年（民國77年）蔣經國逝世，李登輝繼任總統。"}, {"stem": "「三月學運」（野百合學運）發生於民國幾年？", "opts": [["A", "75 年"], ["B", "79 年"], ["C", "77 年"], ["D", "85 年"]], "ans": "B", "exp": "民國79年3月，青年學生發起「三月學運」，隔年促使政府廢除臨時條款、終止動員戡亂。"}, {"stem": "三月學運期間，數千名大學生聚集在下列哪一地點？", "opts": [["A", "高雄中正體育場"], ["B", "臺中公園"], ["C", "臺南孔廟"], ["D", "臺北市中正紀念堂廣場（今自由廣場）"]], "ans": "D", "exp": "數千名大學生聚集於臺北市中正紀念堂廣場（今自由廣場），提出「廢除臨時條款」等多項政治改革訴求。"}, {"stem": "三月學運又被稱為「野百合學運」，主要原因是？", "opts": [["A", "活動時間剛好是野百合花季"], ["B", "學生穿著印有野百合圖案的衣服"], ["C", "以臺灣野百合作為學運的精神象徵"], ["D", "學運領袖的姓氏諧音野百合"]], "ans": "C", "exp": "三月學運因以臺灣野百合作為精神象徵，又稱「野百合學運」。"}, {"stem": "三月學運期間，學生所提出的主要訴求是？", "opts": [["A", "廢除動員戡亂時期臨時條款等政治改革"], ["B", "要求立即實施總統直選"], ["C", "要求二二八事件立即平反"], ["D", "要求解散中國國民黨"]], "ans": "A", "exp": "學生公開提出「廢除臨時條款」等多項政治改革訴求，促使政府隔年回應。"}, {"stem": "政府回應三月學運、宣布廢除臨時條款、終止動員戡亂，是在學運的隔一年，也就是民國幾年？", "opts": [["A", "79 年"], ["B", "81 年"], ["C", "85 年"], ["D", "80 年"]], "ans": "D", "exp": "民國79年三月學運後，政府於隔年（民國80年）宣布終止動員戡亂、廢除臨時條款，並進行修憲。"}, {"stem": "民國80年，政府宣布終止動員戡亂時期，並廢除了下列何者？", "opts": [["A", "中華民國憲法"], ["B", "動員戡亂時期臨時條款"], ["C", "戒嚴令"], ["D", "二二八事件處理委員會"]], "ans": "B", "exp": "李登輝總統宣布終止動員戡亂、廢除臨時條款，並進一步修訂憲法以保障人民權益。"}, {"stem": "民國80年代以後，政府陸續推動了下列哪一項政治改革？", "opts": [["A", "推動中央民意代表（國會）全面改選"], ["B", "恢復臺灣省行政長官公署"], ["C", "重新實施戒嚴"], ["D", "廢除總統直選制度"]], "ans": "A", "exp": "廢除臨時條款、修訂憲法後，政府又陸續推動中央民意代表全面改選、開放省長與直轄市長直接民選。"}, {"stem": "長期以來未曾改選、由大陸選出的老代表繼續行使職權的中央民意機構，一般被稱為？", "opts": [["A", "地方議會"], ["B", "臨時立法機構"], ["C", "萬年國會"], ["D", "戒嚴時期軍事法庭"]], "ans": "C", "exp": "在動員戡亂時期，中央民意代表（國民大會、立法院等）長期不用改選，被稱為「萬年國會」，直到民國80年代才推動全面改選。"}, {"stem": "我國第一次舉行總統直接民選是在民國幾年？", "opts": [["A", "80 年"], ["B", "85 年"], ["C", "83 年"], ["D", "88 年"]], "ans": "B", "exp": "民國85年，政府實施總統直選，這是中華民國歷史上第一次由人民直接選出總統。"}, {"stem": "民國85年，我國第一任民選總統是？", "opts": [["A", "蔣經國"], ["B", "陳水扁"], ["C", "馬英九"], ["D", "李登輝"]], "ans": "D", "exp": "民國85年政府實施總統直選，李登輝當選第一任民選總統。"}, {"stem": "民國85年總統直選以後，臺灣政治發展出現了下列哪一項重要特徵？", "opts": [["A", "恢復戒嚴體制"], ["B", "廢除總統直選制度"], ["C", "透過選舉出現政黨輪替"], ["D", "重新設立臺灣省行政長官公署"]], "ans": "C", "exp": "民國85年總統直選後，之後透過選舉，出現政黨輪替，臺灣的民主政治因此更加落實。"}, {"stem": "下列哪一個選項，正確按照時間先後排列了臺灣民主化歷程中的重大事件？", "opts": [["A", "二二八事件 → 戒嚴 → 美麗島事件 → 解嚴 → 總統直選"], ["B", "解嚴 → 二二八事件 → 戒嚴 → 總統直選 → 美麗島事件"], ["C", "總統直選 → 二二八事件 → 戒嚴 → 解嚴 → 美麗島事件"], ["D", "美麗島事件 → 二二八事件 → 戒嚴 → 總統直選 → 解嚴"]], "ans": "A", "exp": "正確順序為：二二八事件（民國36年）→ 戒嚴開始（民國38年）→ 美麗島事件（民國68年）→ 解除戒嚴（民國76年）→ 總統直選（民國85年）。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

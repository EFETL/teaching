<script>
const QS=[{"stem": "東周時期，黃河流域各國陸續修築城牆，其最主要的目的是什麼？", "opts": [["A", "抵禦匈奴等游牧民族南下侵擾"], ["B", "防範諸侯國之間互相攻伐"], ["C", "保護絲路商旅往來安全"], ["D", "阻止佛教僧侶越境傳教"]], "ans": "A", "exp": "商周以來，農業民族與草原民族即常有貿易與衝突，東周末年黃河流域各國修築城牆，主要是為了抵禦匈奴等北方游牧民族南下。"}, {"stem": "秦統一天下後，將戰國時期各國所築的城牆連結而成的建設，具有什麼樣的歷史意義？", "opts": [["A", "成為絲路的起點"], ["B", "成為農業民族與草原民族的分界線"], ["C", "成為佛教傳入中國的路線"], ["D", "成為東亞文化圈的邊界"]], "ans": "B", "exp": "秦統一後將各國城牆連結成長城，作為北方抵禦匈奴的防線，長城自此成為農業民族與草原民族的分界線。"}, {"stem": "漢武帝派遣張騫出使西域，最初的主要目的是什麼？", "opts": [["A", "傳播佛教"], ["B", "尋求與羅馬帝國通商"], ["C", "聯絡西域各國共同夾擊匈奴"], ["D", "迎娶西域公主和親"]], "ans": "C", "exp": "漢武帝時為了聯絡西域國家打擊匈奴，派遣張騫出使西域，此舉強化了與西域各國的往來，也使東西商路更加活絡。"}, {"stem": "後世將漢代開通的東西陸路交通路線稱為「絲路」，主要是因為什麼？", "opts": [["A", "該路線最早由西域商人開闢"], ["B", "沿途盛產絲織品的原料"], ["C", "是佛教傳入中國的唯一途徑"], ["D", "中國的絲綢是當時通道上主要的貿易商品"]], "ans": "D", "exp": "張騫通西域後東西商路活絡，當時中國的絲綢為主要貿易商品之一，因此後世將這條通道稱為「絲路」。"}, {"stem": "課本所稱的「西域」，狹義而言是指今日的什麼地方？", "opts": [["A", "蒙古高原一帶"], ["B", "今新疆、中亞一帶"], ["C", "朝鮮半島與日本列島"], ["D", "長江流域以南地區"]], "ans": "B", "exp": "西域狹義是指今新疆、中亞各國，廣義則是指經由絲路可到達的中國以西地區。"}, {"stem": "東漢以後，被漢人稱為「胡」而陸續遷入黃河流域的民族，主要是指下列哪一群體？", "opts": [["A", "匈奴、鮮卑等北方游牧民族"], ["B", "東南沿海的百越民族"], ["C", "西南山區的少數民族"], ["D", "來自阿拉伯的商人"]], "ans": "A", "exp": "漢代以來，匈奴、鮮卑等被稱為「胡」的境外民族陸續遷入黃河流域，與漢人雜居，因風俗不同而衝突不斷。"}, {"stem": "西元311年，匈奴攻陷西晉首都洛陽、晉室被迫南遷的歷史事件，史稱什麼？", "opts": [["A", "五胡亂華"], ["B", "安史之亂"], ["C", "怛羅斯之役"], ["D", "永嘉之禍"]], "ans": "D", "exp": "西元311年匈奴攻進西晉首都洛陽，皇帝被俘，史稱「永嘉之禍」，不久西晉滅亡，晉室南遷長江流域。"}, {"stem": "永嘉之禍後，大批中原人士南遷長江流域，對中國歷史發展造成的主要影響是什麼？", "opts": [["A", "使絲路貿易因此中斷"], ["B", "加速北方游牧民族全面漢化"], ["C", "加速南方經濟開發，促使經濟重心逐漸南移"], ["D", "促成東亞文化圈正式形成"]], "ans": "C", "exp": "永嘉之禍後大批北方人士避難南遷，帶來人力與技術，加速南方經濟的開發，也促使中國經濟重心逐漸南移。"}, {"stem": "永嘉之禍後，晉室南遷至長江流域所建立的政權，史稱什麼？", "opts": [["A", "東晉"], ["B", "東漢"], ["C", "東魏"], ["D", "南齊"]], "ans": "A", "exp": "永嘉之禍後西晉滅亡，晉人南遷長江流域，建立的政權史稱「東晉」。"}, {"stem": "西晉滅亡後，北方陷入分裂局面，最終由哪一民族建立的政權統一北方？", "opts": [["A", "匈奴"], ["B", "突厥"], ["C", "羌族"], ["D", "鮮卑"]], "ans": "D", "exp": "永嘉之禍後北方形成分裂局勢，最終由鮮卑人建立的北魏統一北方。"}, {"stem": "北魏孝文帝將首都從平城遷至何處，作為推行漢化的重要措施之一？", "opts": [["A", "長安"], ["B", "洛陽"], ["C", "大興城"], ["D", "咸陽"]], "ans": "B", "exp": "北魏孝文帝時積極推行漢化，將首都從平城遷至洛陽，並要求鮮卑人改用漢姓、穿漢服、鼓勵與漢人通婚。"}, {"stem": "下列何者不屬於北魏孝文帝所推行的漢化政策？", "opts": [["A", "規定鮮卑人改用漢姓"], ["B", "要求鮮卑人穿漢服、說漢語"], ["C", "鼓勵漢人改穿胡服、學習胡語"], ["D", "鼓勵胡人與漢人通婚"]], "ans": "C", "exp": "孝文帝的漢化政策是要求「胡人」改採漢人的語言、服飾與姓氏，而非讓漢人改採胡人習俗，故選項C方向相反，不符合課本內容。"}, {"stem": "北魏孝文帝推行漢化政策的主要目的最可能是什麼？", "opts": [["A", "響應佛教信仰的需求"], ["B", "配合絲路貿易的擴張"], ["C", "抵禦南朝的軍事威脅"], ["D", "穩固鮮卑政權的統治，促進胡漢融合"]], "ans": "D", "exp": "胡人君主為了鞏固政權、化解胡漢衝突，致力於推行漢化，其中北魏孝文帝的措施最具代表性，促成胡漢融合。"}, {"stem": "依課本內容，魏晉南北朝時期胡漢文化互相影響下，下列敘述何者正確？", "opts": [["A", "漢人也開始接受胡人的生活方式，例如飲用乳製品、穿著胡服"], ["B", "胡人完全揚棄自身文化，全面漢化"], ["C", "漢人與胡人之間並無任何生活習慣上的交流"], ["D", "胡漢衝突自此完全消失，再無摩擦"]], "ans": "A", "exp": "民族互動是雙向的，部分漢人也接受胡人的生活方式，例如飲用乳製品、穿著胡服，可見胡漢文化交流並非單向。"}, {"stem": "「永嘉之禍」發生的背景，與下列何者關係最密切？", "opts": [["A", "唐太宗被尊為天可汗"], ["B", "張騫出使西域"], ["C", "胡人與漢人長期雜居、風俗差異衍生的胡漢衝突"], ["D", "阿拉伯商人東來貿易"]], "ans": "C", "exp": "胡漢長期雜居，因風俗不同加上胡人受漢人歧視，衝突不斷，最終匈奴攻進洛陽，爆發永嘉之禍。"}, {"stem": "魏晉南北朝時期，胡人君主在黃河流域建立政權後所面臨的主要統治難題是什麼？", "opts": [["A", "缺乏文字記錄制度"], ["B", "胡漢風俗不同，衝突不斷"], ["C", "無法取得絲路貿易的商品"], ["D", "佛教勢力過度擴張威脅政權"]], "ans": "B", "exp": "胡人建國後，因胡漢風俗差異，衝突不斷，部分胡人君主因此致力推行漢化以鞏固統治。"}, {"stem": "隋唐時期延續魏晉以來的民族互動趨勢，其社會風氣呈現的特色是什麼？", "opts": [["A", "兼容並蓄、胡漢融合"], ["B", "排斥外族、閉關自守"], ["C", "獨尊儒術、拒絕外來宗教"], ["D", "全面禁止胡人在中國經商"]], "ans": "A", "exp": "魏晉以來民族融合的結果，加上許多外族來華經商、留學與傳教，使唐朝前期社會風氣具有兼容並蓄、胡漢融合的特色。"}, {"stem": "唐太宗滅東突厥後，被西北各族尊稱為「天可汗」，此一稱號代表的意義是什麼？", "opts": [["A", "唐太宗成為佛教最高精神領袖"], ["B", "唐太宗兼任西域各國的宰相"], ["C", "唐太宗獲得絲路貿易的獨占權"], ["D", "唐太宗地位高於西北各民族領袖，是各族的共同君長"]], "ans": "D", "exp": "唐太宗滅東突厥後被尊為「天可汗」，代表其地位高於西北各民族領袖，是東亞各族的共同君長與國際盟主。"}, {"stem": "「可汗」一詞原本是指什麼？", "opts": [["A", "中國古代對皇帝的尊稱"], ["B", "佛教僧侶的最高稱謂"], ["C", "草原民族領袖的稱呼"], ["D", "絲路商隊首領的頭銜"]], "ans": "C", "exp": "「可汗」原是草原民族領袖的稱呼，唐太宗滅東突厥後被尊為「天可汗」，意即可汗中的可汗。"}, {"stem": "唐代長安城之所以被形容為國際色彩濃厚的城市，下列敘述何者最能佐證？", "opts": [["A", "城內居民全數為漢人，僅少數官員為外族"], ["B", "居住著來自突厥、朝鮮、高昌、吐蕃等地的外國人，並流傳多種外來宗教"], ["C", "長安城從未與絲路產生貿易往來"], ["D", "唐代政府嚴格禁止外國人進入長安"]], "ans": "B", "exp": "唐代長安居住著來自突厥、朝鮮、高昌、吐蕃等地的外國人，並可見佛教、道教及三夷教等多種宗教，充分展現國際色彩。"}, {"stem": "日本僧侶圓仁法師曾到長安學習佛法，並將自己的經歷寫成何書？", "opts": [["A", "大唐西域記"], ["B", "東亞文化圈"], ["C", "絲路新史"], ["D", "入唐求法巡禮行記"]], "ans": "D", "exp": "圓仁法師為了學習佛法而到長安城旅行，將自己的經歷寫成《入唐求法巡禮行記》一書。"}, {"stem": "唐代長安城中所謂的「三夷教」，是指祆教、景教與下列何者？", "opts": [["A", "摩尼教"], ["B", "儒教"], ["C", "道教"], ["D", "伊斯蘭教"]], "ans": "A", "exp": "課本提到長安城裡除了佛教和道教外，還有來自西方的「三夷教」，也就是祆教、景教，以及摩尼教。"}, {"stem": "根據課本描述，來自今日烏茲別克一帶、擅長經商、深眼高鼻的民族是誰？", "opts": [["A", "高昌人"], ["B", "粟特人"], ["C", "大食人"], ["D", "吐蕃人"]], "ans": "B", "exp": "粟特人來自今天烏茲別克一帶，長得深眼高鼻、留著鬍鬚，是天生的商人，特別擅長貿易。"}, {"stem": "粟特人在唐代長安的生活中，主要扮演的角色與貢獻是什麼？", "opts": [["A", "擔任朝廷史官，編修國史"], ["B", "傳授佛教經典的翻譯"], ["C", "從事貿易，並帶來西域的音樂、舞蹈與生活習慣"], ["D", "負責修築長安城的城牆"]], "ans": "C", "exp": "粟特人不僅帶來西域的商品、食品，也帶來西方的生活習慣，包括音樂、舞蹈與運動，讓唐代長安的生活更為多采多姿。"}, {"stem": "唐代人喜歡飲用葡萄酒、穿著窄袖短衣的「胡服」、以胡旋舞為娛樂，這種流行時尚被稱為什麼？", "opts": [["A", "胡風"], ["B", "夷風"], ["C", "蕃俗"], ["D", "唐化"]], "ans": "A", "exp": "課本提到唐朝人喜歡喝葡萄酒、穿胡服、跳胡旋舞，「胡風」成為當時的流行時尚。"}, {"stem": "依課本描述，唐代長安城的內部空間規畫，下列敘述何者正確？", "opts": [["A", "皇帝居住的宮城位於城市最南端"], ["B", "一般百姓與官員混居於同一坊內，不分等級"], ["C", "長安城呈圓形，四周無城牆環繞"], ["D", "城內呈棋盤狀街道分布，一般百姓多居住在稱為「里坊」的地區"]], "ans": "D", "exp": "長安城內部空間呈棋盤狀，北邊是宮城，宮城以南是皇城，一般百姓則居住在皇城以南、被稱為「里坊」的地方。"}, {"stem": "唐代長安城的建造始於何時，到唐代已成為人口近百萬、世界排名第一的巨大城市？", "opts": [["A", "東漢末年"], ["B", "隋代初年"], ["C", "北魏孝文帝時期"], ["D", "唐玄宗時期"]], "ans": "B", "exp": "長安的建造自隋代初年開始，到了唐代已成為居住人口將近一百萬、在當時世界排名第一的巨大城市。"}, {"stem": "依課本所述，唐代狗肉逐漸從中國人餐桌上消失的現象，學者認為與下列何者最為相關？", "opts": [["A", "政府明令禁止食用狗肉"], ["B", "絲路貿易導致狗肉價格上漲"], ["C", "佛教倡導愛護生命，以及胡漢交流帶來游牧民族愛狗的習慣"], ["D", "狗隻數量因戰亂而大量減少"]], "ans": "C", "exp": "學者認為此一飲食變化與佛教倡導愛護生命、拒絕殺生，以及游牧民族視狗為狩獵夥伴、不食狗肉的習慣影響漢人有關。"}, {"stem": "北魏鮮卑貴族在洛陽開鑿佛教石窟，其歷史背景與下列何種政策關係最密切？", "opts": [["A", "唐太宗的天可汗體制"], ["B", "張騫通西域政策"], ["C", "東亞文化圈的形成"], ["D", "孝文帝推動的漢化政策"]], "ans": "D", "exp": "孝文帝遷都洛陽、推動漢化後，大量信仰佛教的鮮卑貴族便在新都洛陽附近開鑿石窟，展現佛教與胡漢文化融合的過程。"}, {"stem": "唐代將領與士兵中不乏胡人身影，課本提及的 國化的過程。"}, {"stem": "唐代長安城內流傳著多種來自西方的宗教，下列何者不屬於課本所提及的外來宗教？", "opts": [["A", "景教"], ["B", "猶太教"], ["C", "摩尼教"], ["D", "伊斯蘭教"]], "ans": "B", "exp": "課本提到唐代長安城流傳的外來宗教包括佛教、伊斯蘭教，以及三夷教（祆教、景教、摩尼教），並未提及猶太教。"}, {"stem": "隋唐時期，東亞哪些地區與中國交往密切，逐漸形成所謂的「東亞文化圈」？", "opts": [["A", "朝鮮、日本等地"], ["B", "印度、大食等地"], ["C", "歐洲、非洲等地"], ["D", "中亞、西亞等地"]], "ans": "A", "exp": "隋唐盛世時期，東亞地區的朝鮮、日本等地與中國交往密切，廣受中國文化影響，逐漸形成「東亞文化圈」。"}, {"stem": "「東亞文化圈」中，各地共同具備的文化要素不包括下列何者？", "opts": [["A", "漢字"], ["B", "儒學"], ["C", "佛教信仰"], ["D", "伊斯蘭教教義"]], "ans": "D", "exp": "課本指出中國的漢字、儒學、典章制度、佛教信仰成為東亞許多地區的共通要素，伊斯蘭教則非東亞文化圈的共同要素。"}, {"stem": "七世紀中葉，日本推動以唐代律令、制度為藍本的政治改革運動，史稱什麼？", "opts": [["A", "明治維新"], ["B", "應仁之亂"], ["C", "大化革新"], ["D", "遣唐使制度"]], "ans": "C", "exp": "七世紀中葉，日本推動的「大化革新」，即是以唐代的律令、制度為藍本的「唐化運動」。"}, {"stem": "日本文字創作深受漢字影響，下列敘述何者正確？", "opts": [["A", "片假名摹仿漢字草書而成，平假名採漢字楷書偏旁簡化而成"], ["B", "片假名採漢字楷書偏旁簡化而成，平假名摹仿漢字草書而成"], ["C", "片假名與平假名皆與漢字毫無關聯"], ["D", "片假名與平假名皆直接照抄漢字原形、不作簡化"]], "ans": "B", "exp": "課本提到日文的片假名採取漢字楷書偏旁簡化而成，平假名則是摹仿漢字草書所作。"}, {"stem": "隋唐時期，朝鮮半島上哪一國最仰慕中國文化，因而有「君子國」之稱？", "opts": [["A", "高句麗"], ["B", "百濟"], ["C", "加羅"], ["D", "新羅"]], "ans": "D", "exp": "隋唐時期朝鮮半島各國以新羅最仰慕中國文化，仿效唐的衣冠、曆法、律令、漢字等，文風興盛，號稱「君子國」。"}, {"stem": "新羅仿效唐朝文化的具體作為，不包括下列何者？", "opts": [["A", "建立獨立的文字系統以取代漢字"], ["B", "學習中國的儒學與佛教"], ["C", "仿效唐朝的衣冠、曆法"], ["D", "仿效唐朝的律令、漢字"]], "ans": "A", "exp": "課本提到新羅是仿效唐朝的衣冠、曆法、律令、漢字等，直接沿用漢字，並未如日本般另創文字系統。"}, {"stem": "唐太宗時，將文成公主嫁至吐蕃和親，此舉為漢藏之間帶來何種影響？", "opts": [["A", "導致漢藏爆發長期戰爭"], ["B", "使吐蕃放棄原有宗教信仰"], ["C", "文成公主攜帶穀物種子、工藝品、藥材、書籍等，加強漢藏經濟文化交流"], ["D", "使吐蕃成為唐朝的直轄行政區"]], "ans": "C", "exp": "吐蕃國勢大盛時曾遣使向唐朝求婚，太宗以文成公主和親，文成公主攜帶穀物種子、工藝品、藥材、茶葉及書籍到吐蕃，加強了漢藏之間的經濟文化交流。"}, {"stem": "依課本所述，唐代造紙術是透過下列哪一事件而傳播至西方？", "opts": [["A", "文成公主入藏"], ["B", "怛羅斯之役"], ["C", "永嘉之禍"], ["D", "大化革新"]], "ans": "B", "exp": "課本提到造紙術因怛羅斯之役而西傳，使造紙技術傳入中亞與西方世界。"}, {"stem": "新羅留學生崔致遠的事蹟，最能反映下列何種歷史現象？", "opts": [["A", "唐代吸引許多外國留學生前來學習，並可透過考試在中國任官"], ["B", "新羅拒絕與唐朝往來"], ["C", "唐代嚴格禁止外國人參加科舉考試"], ["D", "崔致遠終身未曾返回新羅"]], "ans": "A", "exp": "崔致遠年僅12歲即到中國留學，在長安學習儒家經典，通過考試後於中國任官，反映唐代開放外國留學生求學、任官的風氣。"}, {"stem": "綜合商周至隋唐的歷史發展，下列敘述何者最符合課本的主旨？", "opts": [["A", "中國自古以來與周邊民族毫無互動，文化發展獨立封閉"], ["B", "民族之間的接觸只帶來衝突，未曾促成文化交流"], ["C", "絲路僅止於軍事用途，與貿易及文化交流無關"], ["D", "商周至隋唐期間，民族間的互動與交流帶動了政治、經濟、文化的發展與融合"]], "ans": "D", "exp": "從商周的長城分界、張騫通西域，到魏晉南北朝的胡漢融合，再到隋唐兼容並蓄的國際文化，民族互動始終帶動著中國政治、經濟、文化的發展與融合。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

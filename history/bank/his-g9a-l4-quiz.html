<script>
const QS=[{"stem": "文藝復興運動大約發生在什麼時間、最早從何處興起？", "opts": [["A", "十一至十三世紀；法蘭西"], ["B", "十四至十六世紀；義大利半島"], ["C", "十六至十八世紀；英格蘭"], ["D", "十二至十四世紀；日耳曼地區"]], "ans": "B", "exp": "課本明白指出文藝復興是十四至十六世紀，義大利學者以古希臘、羅馬文化為基礎發展出的文化運動，義大利半島是文藝復興的搖籃，後來才傳播到歐洲各地。"}, {"stem": "下列哪一項是文藝復興得以在義大利各城市興起的背景之一？", "opts": [["A", "各國國王大力提倡以方言取代拉丁文"], ["B", "羅馬教會主動出資鼓勵藝術創作"], ["C", "拜占庭帝國派兵協助義大利對抗鄂圖曼土耳其"], ["D", "義大利城市位居東西貿易要地，商業興盛，貴族富商樂於贊助文藝創作"]], "ans": "D", "exp": "中古後期義大利北部城市因位居貿易要地而商業興盛，累積財富的貴族與富商在此背景下支持文藝創作，是文藝復興興起的重要背景之一。"}, {"stem": "十三世紀末，為躲避鄂圖曼土耳其人的侵擾而遷居義大利、並帶來古希臘羅馬典籍研究的是哪一群學者？", "opts": [["A", "拜占庭學者"], ["B", "阿拉伯學者"], ["C", "法蘭克學者"], ["D", "波斯學者"]], "ans": "A", "exp": "拜占庭學者為躲避鄂圖曼土耳其人侵擾而遷入義大利，帶入古希臘、羅馬典籍的研究，加上阿拉伯人翻譯的古書輾轉傳回歐洲，共同促成文藝復興的知識基礎。"}, {"stem": "下列何者是文藝復興時期有助於知識傳播與文化流通的技術條件？", "opts": [["A", "電報的發明"], ["B", "羅盤的改良"], ["C", "造紙術與印刷術的普及"], ["D", "蒸汽動力印刷機的問世"]], "ans": "C", "exp": "課本提到造紙術、印刷術逐漸普及，使各類著作得以流通，有助於歐洲知識文化的發展，是文藝復興興起的條件之一；蒸汽動力印刷機屬於工業革命之後的技術。"}, {"stem": "文藝復興時期人文主義者所強調的核心精神為何？", "opts": [["A", "否定人性的價值，一切以來世為重"], ["B", "肯定人性價值與尊嚴，追求現世幸福，「以人為本」"], ["C", "強調君主專制是唯一合法的統治方式"], ["D", "主張廢除一切宗教信仰"]], "ans": "B", "exp": "人文主義是文藝復興的主要內涵，將中古以神為中心的思想，轉為肯定人性價值與尊嚴、追求現世幸福、「以人為本」的精神。"}, {"stem": "比較中古時期與文藝復興時期的思想重心，下列敘述何者正確？", "opts": [["A", "中古以神為中心，文藝復興轉而重視人的價值與現世生活"], ["B", "中古重視人的價值，文藝復興才轉回以神為中心"], ["C", "兩個時期思想重心完全相同，沒有明顯轉變"], ["D", "中古與文藝復興都以君主權威為思想核心"]], "ans": "A", "exp": "人文主義的興起代表歐洲社會逐漸從中古以神為本的思想，轉向重視人性尊嚴與現世幸福，這是文藝復興與中古世界觀最大的差異。"}, {"stem": "文藝復興時期，除了拉丁文寫作外，許多學者也開始以何種語文創作，進而促成方言文學的興盛？", "opts": [["A", "希臘文"], ["B", "阿拉伯文"], ["C", "希伯來文"], ["D", "各地方言（如義大利文、英文）"]], "ans": "D", "exp": "課本說明文藝復興時期的作者除了以拉丁文寫作，部分也以方言創作，促成方言文學的興盛，代表人物包括但丁、佩脫拉克、薄伽丘與莎士比亞。"}, {"stem": "義大利文藝復興時期方言文學代表作家中，以史詩式作品描寫遊歷地獄、煉獄與天堂的是下列何人？", "opts": [["A", "佩脫拉克"], ["B", "莎士比亞"], ["C", "但丁"], ["D", "米開朗基羅"]], "ans": "C", "exp": "但丁以方言創作，其作品被稱為「神曲」，描述遊歷地獄、煉獄、天堂的情節，是義大利文藝復興文壇代表人物之一。"}, {"stem": "下列何者是文藝復興時期以短篇小說集描寫黑死病流行下人性百態、後世稱為「人曲」的義大利作家？", "opts": [["A", "佩脫拉克"], ["B", "薄伽丘"], ["C", "莎士比亞"], ["D", "拉斐爾"]], "ans": "文藝復興運動對歐洲社會發展的意義，下列敘述何者最為恰當？", "opts": [["A", "使歐洲社會重心由「以神為本」逐漸轉向「以人為本」，並影響日後歐洲的發展"], ["B", "使歐洲各國立刻放棄基督教信仰"], ["C", "讓歐洲完全脫離希臘羅馬文化的影響"], ["D", "使歐洲社會退回中古封建制度"]], "ans": "A", "exp": "人文主義「以人為本」的精神，使歐洲社會逐漸從中古以神為中心的思維中轉變，這種轉變也成為影響日後歐洲政治、宗教與社會發展的重要思想基礎。"}, {"stem": "下列有關文藝復興的敘述，何者錯誤？", "opts": [["A", "人文主義是文藝復興的主要內涵"], ["B", "文藝復興時期出現了方言文學的興盛"], ["C", "文藝復興運動最早興起於英格蘭"], ["D", "達文西、米開朗基羅、拉斐爾都是文藝復興的代表藝術家"]], "ans": "C", "exp": "文藝復興最早興起於義大利半島，而非英格蘭；英格蘭的莎士比亞雖是方言文學代表人物，但運動的發源地是義大利。"}, {"stem": "宗教改革興起的背景，與下列何種現象最直接相關？", "opts": [["A", "羅馬教會權力鬥爭、教士素質低落，並出現買賣神職與販售贖罪券的陋規"], ["B", "羅馬教會過於清貧，缺乏經費維持教堂運作"], ["C", "各國君主主動放棄一切世俗權力給教會"], ["D", "文藝復興運動使人們完全脫離基督教信仰"]], "ans": "A", "exp": "課本說明中古以來教會的權力與教產雖不斷增加，卻出現權力鬥爭、教士素質低落，以及買賣神職與販售贖罪券的陋規，成為宗教改革興起的重要背景。"}, {"stem": "許多國家的君主之所以支持新教改革，最主要的考量是下列何者？", "opts": [["A", "希望擺脫教會束縛，並取得教會的財產"], ["B", "希望與羅馬教宗建立更緊密的合作關係"], ["C", "為了推廣古希臘、羅馬的多神信仰"], ["D", "為了資助義大利文藝復興的藝術創作"]], "ans": "A", "exp": "各國君主希望擺脫教會的束縛、取得教會的財產，因此大多支持新教改革，這是宗教改革能在許多地區順利推展的重要政治因素。"}, {"stem": "西元1517年，公開張貼「九十五條論綱」批評羅馬教會腐敗、揭開宗教改革序幕的日耳曼教士是下列何人？", "opts": [["A", "喀爾文"], ["B", "羅耀拉"], ["C", "馬丁路德"], ["D", "亨利八世"]], "ans": "C", "exp": "西元1517年，日耳曼教士馬丁路德公開張貼九十五條論綱，批評羅馬教會的腐敗，揭開了宗教改革的序幕。"}, {"stem": "馬丁路德所主張的「因信得救」，其核心意涵是下列何者？", "opts": [["A", "人只要憑藉自身對上帝的信仰即可得救，不須仰賴教會的中介"], ["B", "得救與否完全由教士的宣判決定"], ["C", "只要繳納贖罪券金錢即可獲得救贖"], ["D", "得救與否早已由上帝預先選定，個人努力毫無作用"]], "ans": "A", "exp": "馬丁路德主張「因信得救」，認為人憑藉自身對上帝的信仰即可得救，並鼓勵信徒藉由閱讀聖經與上帝溝通，不需透過教會或神職人員作為中介。"}, {"stem": "馬丁路德為了方便一般信徒能直接閱讀聖經、與上帝溝通，做了下列哪一項重要工作？", "opts": [["A", "下令焚毀所有拉丁文版聖經"], ["B", "建議教宗重新編修聖經內容"], ["C", "提出「預選說」以取代信仰的重要性"], ["D", "將聖經翻譯成平民慣用的德文"]], "ans": "D", "exp": "馬丁路德鼓勵信徒藉由閱讀聖經與上帝溝通，因此將聖經翻譯成平民慣用的德文，方便一般信徒閱讀，這也是路德教派的重要特色。"}, {"stem": "發動宗教改革、主張因信得救的馬丁路德，其身分背景為下列何者？", "opts": [["A", "日耳曼地區的教士"], ["B", "法國籍的商人"], ["C", "英格蘭的國王"], ["D", "西班牙籍的軍人"]], "ans": "A", "exp": "馬丁路德是日耳曼（德意志）地區的教士，因不滿羅馬教會販售贖罪券等腐敗現象，張貼九十五條論綱，揭開宗教改革序幕。"}, {"stem": "喀爾文所提出、認為人能否得救是由上帝預先選定的主張，稱為下列何者？", "opts": [["A", "因信得救"], ["B", "預選說"], ["C", "君權神授說"], ["D", "世界主義"]], "ans": "B", "exp": "法國人喀爾文在瑞士建立新教會，提出「預選說」，強調人能否得救是上帝預先選定，與馬丁路德「因信得救」的主張有所不同。"}, {"stem": "喀爾文教派主張信徒應努力工作以榮耀上帝，這種觀點特別受到下列哪一族群的歡迎？", "opts": [["A", "貴族地主"], ["B", "羅馬教會的樞機主教"], ["C", "工商業者"], ["D", "傳統莊園農民"]], "ans": "C", "exp": "喀爾文主張人應努力工作，以榮耀上帝，打破了中古將追求財富視為罪惡的觀點，因此深受工商業者的歡迎。"}, {"stem": "喀爾文建立新教會、提出「預選說」的地點，主要是在下列何處？", "opts": [["A", "瑞士"], ["B", "英格蘭"], ["C", "義大利"], ["D", "西班牙"]], "ans": "A", "exp": "法人喀爾文在瑞士建立新教會，提出「預選說」，強調人能否得救是上帝預先選定，並主張人應努力工作以榮耀上帝。"}, {"stem": "下列何者屬於喀爾文教派系統下較為重要的分支教會？", "opts": [["A", "英格蘭國教派"], ["B", "耶穌會"], ["C", "羅馬公教"], ["D", "長老教會"]], "ans": "D", "exp": "喀爾文教派的分支中，以長老教會較為重要，其教義仍延續喀爾文強調預選說與勤奮工作的精神。"}, {"stem": "十六世紀初，因婚姻問題與羅馬教會決裂、進而成立英格蘭國教派的君主是下列何人？", "opts": [["A", "馬丁路德"], ["B", "喀爾文"], ["C", "亨利八世"], ["D", "羅耀拉"]], "ans": "C", "exp": "十六世紀初，英王亨利八世因婚姻問題與羅馬教會決裂，成立英格蘭國教派，藉此擺脫羅馬教會的掌控。"}, {"stem": "英格蘭國教派成立後，教會領袖的身分主要由下列何者擔任？", "opts": [["A", "羅馬教宗"], ["B", "英格蘭國王"], ["C", "法國喀爾文教派領袖"], ["D", "耶穌會會長"]], "ans": "B", "exp": "亨利八世成立英格蘭國教派後，由國王擔任教會領袖，藉此擺脫羅馬教會的掌控，這是英格蘭國教派與其他新教教派不同之處。"}, {"stem": "路德教派、喀爾文教派與英格蘭國教派雖然主張各有不同，但仍有共同之處，下列敘述何者正確？", "opts": [["A", "都主張教宗擁有至高無上的權威"], ["B", "都強調透過購買贖罪券可以得到救贖"], ["C", "都認為神職人員是信徒與上帝溝通的唯一橋梁"], ["D", "都否定教宗與教會的權威，強調聖經為信仰的唯一依歸"]], "ans": "D", "exp": "課本指出新教的共同點在於否定教宗與教會的權威，強調聖經為信仰唯一依歸，重視個人內在的虔誠，這是路德教派、喀爾文教派、英格蘭國教派共同的特徵。"}, {"stem": "面對新教興起的衝擊，羅馬教會內部也出現改革聲浪，其中創立耶穌會、最具代表性的西班牙人是下列何人？", "opts": [["A", "羅耀拉"], ["B", "喀爾文"], ["C", "馬丁路德"], ["D", "但丁"]], "ans": "A", "exp": "受到新教的刺激，羅馬教會內部出現改革聲浪，其中以西班牙人羅耀拉創立的耶穌會最具代表性，重塑了羅馬教會的威望。"}, {"stem": "耶穌會重視教士信仰的虔誠與知識訓練，並鼓勵教士從事下列何種活動，藉此重塑羅馬教會的威望？", "opts": [["A", "留在歐洲各地擔任地方行政官員"], ["B", "前往海外傳教（如遠赴澳門、日本等地）"], ["C", "專心撰寫方言文學作品"], ["D", "協助各國君主徵收賦稅"]], "ans": "B", "exp": "耶穌會重視教士信仰的虔誠與知識的訓練，並鼓勵教士前往海外傳教，例如在澳門興建的大三巴牌坊即為耶穌會教士所留下的遺跡，藉此重塑羅馬教會威望。"}, {"stem": "宗教改革後，歐洲基督教世界大致分裂為哪兩大陣營？", "opts": [["A", "伊斯蘭教與佛教"], ["B", "東正教與伊斯蘭教"], ["C", "支持羅馬教會的「舊教」與脫離羅馬教會的「新教」"], ["D", "人文主義者與經院學者"]], "ans": "C", "exp": "宗教改革使基督教世界出現第二次分裂，形成仍效忠羅馬教會的「舊教」（天主教）與脫離羅馬教會權威的「新教」（如路德教派、喀爾文教派、英格蘭國教派）兩大陣營。"}, {"stem": "宗教改革對歐洲政治發展造成的重要影響是下列何者？", "opts": [["A", "各國君主完全喪失統治權力"], ["B", "羅馬教宗成為凌駕各國君主之上的世界統治者"], ["C", "歐洲各國自此不再發生任何戰爭"], ["D", "信仰新教的君主聯合本國教會、強化民族意識，以對抗羅馬教會的勢力"]], "ans": "D", "exp": "宗教改革造成基督教世界的第二次分裂，信仰新教的君主往往聯合本國教會，並強化民族意識，以對抗羅馬教會的勢力，有助於日後民族國家的興起。"}, {"stem": "從經濟角度來看，新教（尤其是喀爾文教派）的興起對歐洲產生下列何種影響？", "opts": [["A", "使歐洲徹底放棄商業活動"], ["B", "強化了中古視追求財富為罪惡的觀念"], ["C", "肯定努力工作與追求財富的價值，促成歐洲經濟的成長"], ["D", "使工商業者轉而支持羅馬教會"]], "ans": "C", "exp": "喀爾文教派主張人應努力工作以榮耀上帝，打破中古將追求財富視為罪惡的觀點，這種肯定工作價值的態度，有助於促成歐洲經濟的成長。"}, {"stem": "宗教改革者重視閱讀與翻譯聖經，這項作法對歐洲社會文化層面帶來下列何種影響？", "opts": [["A", "帶動教育發展，提高識字率"], ["B", "使民眾完全放棄閱讀能力"], ["C", "使拉丁文重新成為唯一通行的文字"], ["D", "導致印刷術逐漸失傳"]], "ans": "A", "exp": "新教改革者重視閱讀、翻譯聖經，鼓勵信徒直接閱讀聖經與上帝溝通，這種風氣帶動了教育的發展，也提高了社會的識字率。"}, {"stem": "十六、十七世紀，新舊教國家之間因信仰不同而發生一連串宗教衝突，戰後各國逐漸發展出下列何種趨勢？", "opts": [["A", "羅馬教會重新取得對全歐洲的絕對統治權"], ["B", "各國簽訂條約，承認新教國家獨立，逐步發展宗教寬容"], ["C", "各國一致改信伊斯蘭教以避免衝突"], ["D", "歐洲各國從此停止任何形式的外交往來"]], "ans": "B", "exp": "十七世紀新舊教國家發生宗教衝突後，戰後各國簽訂條約，承認新教國家的獨立，給予各國決定本國信仰的權力，逐步發展出宗教寬容的原則。"}, {"stem": "十七世紀歐洲新舊教國家間爆發長期宗教戰爭後，各國透過國際法試圖達成下列何種目標？", "opts": [["A", "恢復羅馬教宗對全歐洲政治的直接統治"], ["B", "廢除所有國家的君主制度"], ["C", "制止歐洲國家以宗教為名發動戰爭"], ["D", "強迫所有新教國家改宗舊教"]], "ans": "C", "exp": "課本提到十七世紀新舊教國家發生宗教衝突，戰後各國簽訂條約，除承認新教國家獨立外，也透過國際法制止歐洲國家以宗教為名發動戰爭，展現宗教寬容原則的建立。"}, {"stem": "比較馬丁路德與喀爾文兩人的宗教主張，下列敘述何者正確？", "opts": [["A", "兩人主張完全相同，沒有任何差異"], ["B", "馬丁路德強調「因信得救」，喀爾文則提出「預選說」"], ["C", "馬丁路德提出「預選說」，喀爾文強調「因信得救」"], ["D", "兩人都主張教宗擁有至高無上的宗教權威"]], "ans": "B", "exp": "馬丁路德主張「因信得救」，強調個人對上帝的信仰即可得救；喀爾文則提出「預選說」，認為得救與否早已由上帝預先選定，兩者主張並不相同。"}, {"stem": "喀爾文教派與英格蘭國教派雖然同屬新教，但兩者興起的直接原因並不相同，下列敘述何者正確？", "opts": [["A", "兩者都是因為君主的婚姻問題而興起"], ["B", "兩者都是因為喀爾文本人親自到英格蘭傳教而興起"], ["C", "喀爾文教派源自對「預選說」等教義的主張，英格蘭國教派則源自亨利八世的婚姻問題與羅馬教會決裂"], ["D", "兩者興起的原因完全出於經濟因素"]], "ans": "C", "exp": "喀爾文教派的興起是基於喀爾文對「預選說」與勤奮工作等教義的主張；英格蘭國教派則是因為亨利八世因婚姻問題與羅馬教會決裂而另立教會，兩者興起的背景不同。"}, {"stem": "依課本所述時序，下列有關文藝復興與宗教改革的先後順序，何者正確？", "opts": [["A", "文藝復興大約始於十四世紀，宗教改革則要到十六世紀初（1517年）才正式展開"], ["B", "宗教改革遠早於文藝復興，約在十世紀便已展開"], ["C", "兩者發生於完全相同的世紀，無先後之別"], ["D", "宗教改革先於文藝復興約三百年"]], "ans": "A", "exp": "文藝復興大約從十四世紀展開，而宗教改革則以馬丁路德在1517年張貼九十五條論綱為起點，時間上宗教改革晚於文藝復興的興起。"}, {"stem": "綜合來看，義大利半島之所以成為文藝復興搖籃，最主要結合了下列哪些條件？", "opts": [["A", "王室大量鑄造金幣、獨尊天主教信仰"], ["B", "全面實施君主立憲、廢除封建制度"], ["C", "貿易興盛帶來的財富贊助、古典文化的保存，以及造紙印刷術帶動的知識流通"], ["D", "完全與外界隔絕、獨立發展出全新的文字系統"]], "ans": "C", "exp": "課本指出義大利半島之所以成為文藝復興搖籃，與貴族富商因貿易致富而支持文藝創作、古代典籍的翻譯保存，以及造紙術印刷術普及帶動知識傳播等因素有關。"}, {"stem": "文藝復興人文主義「以人為本」的精神，對後世歐洲發展帶來下列何種深遠影響？", "opts": [["A", "成為日後歐洲社會逐漸重視個人價值、追求現世幸福等發展的重要思想基礎"], ["B", "使歐洲社會從此完全揚棄宗教信仰"], ["C", "導致歐洲各國立即實施民主選舉制度"], ["D", "使歐洲重新回到中古封建莊園經濟"]], "ans": "A", "exp": "人文主義強調肯定人性價值與尊嚴、追求現世幸福，這種「以人為本」的思維成為影響日後歐洲政治、社會、文化發展的重要思想基礎。"}, {"stem": "某段資料描述：「這位人物否定教宗與教會的權威，將聖經翻譯成平民慣用的文字，鼓勵信徒直接閱讀聖經與上帝溝通。」這段描述最可能是在說下列何人？", "opts": [["A", "但丁"], ["B", "馬丁路德"], ["C", "羅耀拉"], ["D", "拉斐爾"]], "ans": "B", "exp": "資料中「否定教會權威」「翻譯聖經」「鼓勵直接閱讀聖經」等描述，正符合馬丁路德的主張與作為，他將聖經翻譯成德文，主張因信得救，揭開宗教改革序幕。"}, {"stem": "小明參觀一幅文藝復興時期的畫作，畫面呈現多位古代哲學家聚集討論、氣氛理性莊嚴，並未特別強調宗教救贖的情節。這幅畫最可能是下列何者？", "opts": [["A", "拉斐爾的「雅典學院」"], ["B", "米開朗基羅的「大衛像」"], ["C", "達文西的「最後的晚餐」"], ["D", "馬丁路德的畫像"]], "ans": "A", "exp": "「雅典學院」是拉斐爾的作品，畫面聚集了多位古代哲學家，呈現理性思辨的氛圍，展現文藝復興對古典希臘文化與人文精神的推崇，與強調宗教救贖的宗教畫作不同。"}, {"stem": "某資料描述：「他認為人能否得救，早在上帝創造世界之初便已預先決定，信徒唯有努力工作，才能榮耀上帝。」這段話最可能是下列何人的主張？", "opts": [["A", "但丁"], ["B", "亨利八世"], ["C", "羅耀拉"], ["D", "喀爾文"]], "ans": "D", "exp": "資料中「得救與否早已預先決定」「努力工作以榮耀上帝」的敘述，正是喀爾文提出「預選說」的核心主張，這也是喀爾文教派受工商業者歡迎的原因。"}, {"stem": "綜合文藝復興與宗教改革兩大運動來看，下列敘述何者最為恰當？", "opts": [["A", "兩者互不相關，文藝復興只影響藝術，宗教改革只影響信仰"], ["B", "文藝復興使人開始重視現世與人性，宗教改革則挑戰了羅馬教會的權威，兩者都削弱了中古以來教會對歐洲社會的絕對主導地位"], ["C", "宗教改革使歐洲重新回到以神為本的中古思想"], ["D", "文藝復興的發生，是因為宗教改革先削弱了教會權威所致"]], "ans": "B", "exp": "文藝復興的人文主義使人們重視現世生活與人性價值，宗教改革則直接挑戰羅馬教會的權威與教義。兩者雖然性質不同（一為文化藝術運動、一為宗教信仰改革），但都削弱了中古以來教會對歐洲社會的絕對主導地位，共同揭開了近代歐洲興起的序幕。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

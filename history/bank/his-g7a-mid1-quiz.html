<script>
const QS=[{"stem": "考古學家將臺灣史前時代分為「舊石器時代」、「新石器時代」與「金屬器時代」三個階段，其主要的分期依據是什麼？", "opts": [["A", "人類使用器具的材質與製作方式"], ["B", "是否已經擁有文字紀錄"], ["C", "居住地理位置的不同"], ["D", "宗教信仰的差異"]], "ans": "A", "exp": "三版課本皆指出，由於史前時代沒有文字紀錄，考古學家是依據史前人類「使用器物的材質與製作方式（技術）」的差異，將史前時代分為舊石器、新石器、金屬器三個階段。"}, {"stem": "依時間先後順序排列，臺灣史前時代三個階段的正確順序為何？", "opts": [["A", "新石器時代→舊石器時代→金屬器時代"], ["B", "舊石器時代→新石器時代→金屬器時代"], ["C", "金屬器時代→新石器時代→舊石器時代"], ["D", "新石器時代→金屬器時代→舊石器時代"]], "ans": "B", "exp": "依課本時空架構圖，臺灣史前時代由早到晚依序為舊石器時代（距今約5萬～5千年前）、新石器時代（距今約7千～2千年前）、金屬器時代（距今約2千～400年前）。"}, {"stem": "目前臺灣所發現最早的舊石器時代文化為何？主要分布於何地？", "opts": [["A", "大坌坑文化；新北市八里區"], ["B", "十三行文化；新北市八里區"], ["C", "長濱文化；臺東縣長濱鄉"], ["D", "卑南文化；臺東縣"]], "ans": "C", "exp": "三版課本皆說明，臺灣目前發現最早的舊石器時代文化是長濱文化，出土於臺東縣長濱鄉的八仙洞遺址，大約距今五萬到五千年前。"}, {"stem": "長濱文化時期的人們，主要以下列何種方式維生？", "opts": [["A", "農耕、飼養家畜"], ["B", "商業貿易"], ["C", "燒製陶器出售"], ["D", "採集、狩獵、漁撈"]], "ans": "D", "exp": "舊石器時代生產技術尚未發展出農業，長濱文化的人們以採集、狩獵、漁撈作為主要的維生方式。"}, {"stem": "舊石器時代的人類製作石器時，主要採取下列何種方式？", "opts": [["A", "磨製"], ["B", "敲打（打製）"], ["C", "鑄造"], ["D", "燒製"]], "ans": "B", "exp": "舊石器時代以敲打的方式製作石器（打製石器），到新石器時代才進一步發展出磨製石器的技術。"}, {"stem": "長濱文化的人們，主要居住於下列何種環境？", "opts": [["A", "木造房屋聚落"], ["B", "干欄式建築"], ["C", "磚造聚落"], ["D", "天然海邊洞穴"]], "ans": "D", "exp": "長濱文化的人們利用濱海地區的天然洞穴（如八仙洞）遮風避雨，過著採集、狩獵、漁撈的生活。"}, {"stem": "「長濱文化」這個名稱的由來，是因為該文化最早發現於下列何處？", "opts": [["A", "臺東縣長濱鄉的八仙洞"], ["B", "新北市八里區的十三行"], ["C", "臺北市的圓山"], ["D", "南投縣的日月潭"]], "ans": "A", "exp": "長濱文化因最早於臺東縣長濱鄉八仙洞被發現，考古學家便以當地地名將其命名為「長濱文化」。"}, {"stem": "臺灣史前文化的命名方式，通常是依據下列何者？", "opts": [["A", "發現該文化的考古學家姓名"], ["B", "該文化存續時間的長短"], ["C", "最早發現該文化遺址所在地的地名"], ["D", "出土器物的顏色"]], "ans": "C", "exp": "課本說明，史前文化的命名通常以最先發現該文化遺址處的較小地名（如鄉鎮名）來稱呼，例如長濱文化、大坌坑文化、十三行文化皆是如此。"}, {"stem": "臺灣新石器時代大約距今多久？此一時期出現了哪些重大的生活變革？", "opts": [["A", "距今五萬至五千年前；已知用火"], ["B", "距今兩千至四百年前；懂得煉鐵"], ["C", "距今一萬年前；發明文字"], ["D", "距今七千至二千年前；出現農業、磨製石器、燒製陶器、飼養家畜"]], "ans": "D", "exp": "新石器時代大約距今七千年到兩千年前，此時人類生活出現農業生產、磨製石器、燒製陶器及飼養家畜等重大變革，是與舊石器時代最大的差異。"}, {"stem": "臺灣新石器時代「早期」的代表文化為何？", "opts": [["A", "大坌坑文化"], ["B", "圓山文化"], ["C", "卑南文化"], ["D", "十三行文化"]], "ans": "A", "exp": "三版課本皆指出，新北市八里區的大坌坑文化是臺灣新石器時代早期的代表文化，圓山文化與卑南文化則屬於新石器時代晚期。"}, {"stem": "大坌坑文化出土的陶器，最具代表性的特徵為何？", "opts": [["A", "彩繪陶器"], ["B", "黑色磨光陶"], ["C", "粗繩紋陶器"], ["D", "白色素陶"]], "ans": "C", "exp": "大坌坑文化最具代表性的出土文物是帶有粗繩狀紋路的陶器，即「粗繩紋陶器」，是辨識該文化的重要指標。"}, {"stem": "大坌坑文化遺址位於臺灣的什麼地方？", "opts": [["A", "臺東縣長濱鄉"], ["B", "新北市八里區"], ["C", "臺北市"], ["D", "南投縣"]], "ans": "B", "exp": "大坌坑文化遺址位於新北市八里區，與同樣位於八里區的十三行文化（金屬器時代代表）鄰近但年代不同。"}, {"stem": "圓山文化遺址中出土大量「貝塚」（貝殼堆積層），這項考古發現可作為下列何者的證據？", "opts": [["A", "臺北盆地曾經是一片湖泊（臺北湖）"], ["B", "當地曾經有煉鐵活動"], ["C", "當地曾為對外貿易港口"], ["D", "當時已使用文字紀錄"]], "ans": "A", "exp": "圓山遺址出土的貝塚，是當時人們食用貝肉後丟棄貝殼堆積而成，考古學家據此推測臺北盆地在史前時期曾經是一片湖泊，即「臺北湖」。"}, {"stem": "圓山文化屬於新石器時代的哪個階段？主要分布於何地？", "opts": [["A", "早期；新北市八里區"], ["B", "早期；臺東縣"], ["C", "晚期；臺東縣"], ["D", "晚期；臺北盆地"]], "ans": "D", "exp": "圓山文化與卑南文化同屬臺灣新石器時代晚期文化，圓山文化分布於臺北盆地，卑南文化則分布於臺東縣。"}, {"stem": "卑南文化遺址出土數量高達兩千多具的下列何種文物，展現其獨特的喪葬文化？", "opts": [["A", "青銅劍"], ["B", "石板棺"], ["C", "鐵製農具"], ["D", "陶土人偶"]], "ans": "B", "exp": "卑南文化遺址是臺灣出土遺留最豐富的考古遺址之一，光是石板棺就出土超過兩千具，展現當時獨特而發達的喪葬習俗。"}, {"stem": "卑南文化遺址出土的「人獸形玉器」，在下列哪個地區也曾被發現，可證實臺灣史前文化與外界早有互動往來？", "opts": [["A", "中國大陸北方"], ["B", "日本"], ["C", "東南亞"], ["D", "歐洲"]], "ans": "C", "exp": "卑南文化出土精美的人獸形玉器，在東南亞地區也曾發現類似玉器，顯示臺灣史前時代已與海外地區有所往來交流。"}, {"stem": "卑南文化遺址位於臺灣的什麼地方？", "opts": [["A", "新北市八里區"], ["B", "臺北市"], ["C", "南投縣"], ["D", "臺東縣"]], "ans": "D", "exp": "卑南文化遺址位於臺東縣，是臺灣新石器時代晚期的重要代表文化之一，出土大量石板棺與玉器。"}, {"stem": "臺灣的金屬器時代大約距今多久？以下列何者為代表文化？", "opts": [["A", "兩千至四百年前；十三行文化"], ["B", "七千至二千年前；大坌坑文化"], ["C", "五萬至五千年前；長濱文化"], ["D", "一萬年前；圓山文化"]], "ans": "A", "exp": "臺灣金屬器時代大約距今兩千年到四百年前，以新北市八里區的十三行文化為代表。"}, {"stem": "十三行文化遺址出土的鐵渣與煉鐵作坊遺跡，說明當時的人們可能已經如何？", "opts": [["A", "發明了文字"], ["B", "開始從事農業"], ["C", "懂得使用（製作）鐵製工具"], ["D", "建立了城市國家"]], "ans": "C", "exp": "十三行文化遺址出土鐵渣及煉鐵作坊，是判斷該文化已進入金屬器時代、懂得使用鐵器的重要證據。"}, {"stem": "十三行文化遺址出土的玻璃手環、瑪瑙珠飾及外來銅錢，主要顯示當時的人們？", "opts": [["A", "已經擁有自己的文字系統"], ["B", "與其他地區有貿易往來"], ["C", "已建立起中央集權的政治組織"], ["D", "完全以農業作為唯一的維生方式"]], "ans": "B", "exp": "玻璃手環、瑪瑙珠飾及銅錢等皆屬外來器物，其出土顯示十三行文化的人們與海外其他地區已有貿易往來。"}, {"stem": "十三行文化遺址位於臺灣的什麼地方？", "opts": [["A", "臺東縣長濱鄉"], ["B", "新北市八里區"], ["C", "臺北市圓山"], ["D", "南投縣日月潭"]], "ans": "B", "exp": "十三行文化遺址位於新北市八里區，與新石器時代早期的大坌坑文化遺址相近，但年代較晚，屬於金屬器時代。"}, {"stem": "考古遺址中不同時期的堆積會形成「文化層」，關於文化層堆疊次序的敘述，下列何者正確？", "opts": [["A", "愈上方的文化層年代愈早"], ["B", "各層堆疊順序與時間先後無關"], ["C", "愈下方的文化層年代愈晚"], ["D", "愈下方的文化層，年代愈早"]], "ans": "D", "exp": "遺址中的文化層是隨著時間推移一層層堆積而成，愈早期的人類活動遺留會被壓在愈下方，因此文化層愈下方，年代愈早。"}, {"stem": "由於史前時代沒有留下文字紀錄，考古學家主要透過下列何種方式推測當時人類的生活情形？", "opts": [["A", "根據出土的遺物與遺址進行研究、推測"], ["B", "參考同時代其他文明留下的文字史料"], ["C", "依據後世史書上的記載"], ["D", "直接依照口述傳說還原史實"]], "ans": "A", "exp": "三版課本都強調，史前時代因缺乏文字紀錄，只能依靠考古學家發掘出的遺址與遺物，推測遠古人類的生活樣貌。"}, {"stem": "臺灣原住民族在語言與文化系統上，屬於下列哪一個語族？", "opts": [["A", "漢藏語族"], ["B", "阿爾泰語族"], ["C", "南島語族"], ["D", "印歐語族"]], "ans": "C", "exp": "臺灣原住民各族群屬於南島語族，學者研究認為原住民族在數千年前移居臺灣，並向外擴散遷徙。"}, {"stem": "南島語族主要分布在太平洋與印度洋的島嶼上，臺灣位於此一分布範圍的哪個位置？", "opts": [["A", "最南端"], ["B", "最東端"], ["C", "正中央"], ["D", "最北端"]], "ans": "D", "exp": "南島語族分布廣泛，涵蓋太平洋與印度洋諸島，而臺灣正位於南島語族地理分布上的最北端。"}, {"stem": "學者透過分析下列哪一種植物在臺灣與太平洋各地的分布與特徵，推論臺灣可能是南島語族的起源地（故鄉）？", "opts": [["A", "竹子"], ["B", "構樹"], ["C", "稻米"], ["D", "茶樹"]], "ans": "B", "exp": "學者研究發現，太平洋各地南島語族用來製作樹皮布（樹皮衣）的構樹，與臺灣南部本土構樹特徵高度相似，因而推論臺灣可能是南島語族向外遷徙擴散的起點。"}, {"stem": "學者發現太平洋各地的構樹與臺灣構樹特徵相似，因此據以推論下列何者？", "opts": [["A", "構樹自古便廣泛分布全球，與人群遷徙無關"], ["B", "南島語族起源於太平洋諸島，之後才傳入臺灣"], ["C", "太平洋的構樹很可能是隨南島語族從臺灣遷徙時攜帶出去的"], ["D", "構樹只能生長在熱帶地區"]], "ans": "C", "exp": "由於太平洋諸島的氣候本不利於構樹自然繁殖，學者推論當地構樹應是南島語族先民從臺灣遷徙擴散時，將構樹一併攜帶出去所致，可作為臺灣是南島語族故鄉的佐證。"}, {"stem": "臺灣原住民族由於未曾發展出自己的文字，主要透過下列何種方式傳承其歷史與文化？", "opts": [["A", "口耳相傳的神話與傳說"], ["B", "官方編纂的史書"], ["C", "碑文與石刻文字"], ["D", "契約與帳冊紀錄"]], "ans": "A", "exp": "臺灣原住民族沒有留下自己的文字資料，但透過神話與口述傳說，呈現並傳承早期的生活樣貌與族群歷史。"}, {"stem": "泰雅族流傳的起源傳說，內容主要與下列何者有關？", "opts": [["A", "巨石（岩石）誕生始祖"], ["B", "洪水導致族群遷徙"], ["C", "追逐白鹿而遷居"], ["D", "矮人協助族人農耕"]], "ans": "A", "exp": "泰雅族流傳以巨石（岩石）誕生始祖的傳說，藉此說明族群的起源與發展，族人至今仍會到相關地點祭祖。"}, const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

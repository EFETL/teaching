<script>
const QS=[{"stem": "隨著洋人陸續在通商口岸定居發展，中國城市的建築景觀出現下列何種變化？", "opts": [["A", "傳統四合院更加流行"], ["B", "政府下令禁止興建任何新式建築"], ["C", "只有官員才被允許興建洋樓"], ["D", "西洋樓房逐漸取代傳統建築"]], "ans": "D", "exp": "隨著洋人在重要通商口岸定居發展，中國傳統的建築逐漸被西洋樓房取代，各式外國商品也充斥市面，使中國人眼界大開。"}, {"stem": "晚清通商口岸城市中，使用洋貨逐漸成為下列何種現象的象徵？", "opts": [["A", "身分地位的象徵"], ["B", "貧窮落後的象徵"], ["C", "觸犯法律的象徵"], ["D", "反抗朝廷的象徵"]], "ans": "A", "exp": "各式外國商品充斥通商口岸，使中國人眼界大開，使用洋貨逐漸成為一種身分地位的象徵，也反映當時社會審美觀與消費觀的轉變。"}, {"stem": "根據康軒版課本所附「上海賽馬場」、「吳淞鐵路通車」等資料判斷，這類文化景象最可能出現於何時？", "opts": [["A", "十七世紀末"], ["B", "十八世紀初"], ["C", "十八世紀末"], ["D", "十九世紀末"]], "ans": "D", "exp": "隨著通商口岸開放與西方物質文明傳入，賽馬場、鐵路等新興事物多出現於十九世紀末的上海等城市，反映當時城市生活的新風貌。"}, {"stem": "晚清的上海之所以能吸引大量鄉村人口移居，其主要原因與下列何者最相關？", "opts": [["A", "鄉村發生嚴重飢荒"], ["B", "國際貿易與工商業發達，提供多樣化的就業機會"], ["C", "朝廷下令強迫遷徙"], ["D", "上海全面免除賦稅"]], "ans": "B", "exp": "由於國際貿易與工商業在通商口岸獲得成長，提供了多樣性的就業機會，吸引鄉村人口移居城市，上海因而逐漸成為融合中西文化的城市。"}, {"stem": "翰林版課本〈課後閱讀〉提到一種在19世紀中期傳入中國、被稱為「洋鬼子的魔水」的西式飲品，指的是下列何者？", "opts": [["A", "番茄汁"], ["B", "荷蘭水（汽水）"], ["C", "葡萄酒"], ["D", "咖啡"]], "ans": "B", "exp": "荷蘭水（即汽水）最初由西方傳入中國，19世紀中期已可見於上海街頭，是當時通商口岸新興的西式飲食文化代表之一。"}, {"stem": "「荷蘭水」最初之所以被稱為「洋鬼子的魔水」，主要原因是下列何者？", "opts": [["A", "它含有劇毒，飲用後會產生幻覺"], ["B", "它是官府禁止販售的違禁品"], ["C", "它為西方傳入的稀少舶來品，加上社會瀰漫仇外保守的氣氛"], ["D", "它只在租界內販售，中國人完全買不到"]], "ans": "C", "exp": "荷蘭水最初由西方傳入，數量稀少、物以稀為貴，加上開港通商後社會仍瀰漫仇外保守的氣氛，因此被稱為「洋鬼子的魔水」；後來中國人習得製作技術，成本降低，才逐漸在各地流行。"}, {"stem": "晚清出現的圖像式報刊（如畫報），對一般民眾產生下列何種影響？", "opts": [["A", "使民眾更加抗拒新知識"], ["B", "使不識字的民眾也能透過圖像閱讀，豐富庶民的娛樂生活"], ["C", "導致報刊業迅速沒落"], ["D", "只有官員能夠閱讀"]], "ans": "B", "exp": "晚清出現許多圖像式報刊，內容常刊載時事風俗畫，使不識字的民眾也能透過圖像了解時事、獲得娛樂，豐富了庶民的閱讀與娛樂生活。"}, {"stem": "南一版課本指出，清廷是在推動下列哪一項改革運動之後，才開始陸續設立西式學堂？", "opts": [["A", "自強運動"], ["B", "立憲運動"], ["C", "新文化運動"], ["D", "國民革命運動"]], "ans": "A", "exp": "除了外國人於各地城市設立學校外，清廷也在自強運動以後，陸續設立西式學堂，加速了新知識在中國的傳播，許多青年也因此前往城市求學，接觸各種新觀念。"}, {"stem": "陳擷芬在16歲創辦《女報》之前，曾就讀於外國傳教士創辦的哪一所女校？", "opts": [["A", "經正女學"], ["B", "金陵女子大學"], ["C", "中西女塾"], ["D", "京師大學堂"]], "ans": "C", "exp": "陳擷芬幼時隨父親遷往上海，進入外國傳教士創辦的女校「中西女塾」就讀，16歲時便創辦《女報》（後改名《女學報》），積極鼓吹女權、提倡女學。"}, {"stem": "陳擷芬之所以能較早接觸辦報事業、鼓吹女權，與她父親陳範的下列何種身分最相關？", "opts": [["A", "清廷科舉考官"], ["B", "著名的新式報刊經營者"], ["C", "外國傳教士"], ["D", "上海天足會負責人"]], "ans": "B", "exp": "陳擷芬的父親陳範是著名的新式報刊經營者，在其影響下，陳擷芬得以接觸辦報事業，並在16歲時創辦《女報》，積極鼓吹女權、提倡女學。"}, {"stem": "傳統中國社會中，婦女接受教育的機會為何？", "opts": [["A", "完全沒有機會接受任何教育"], ["B", "與男性完全平等，只是課程內容不同"], ["C", "機會不多，且多半僅在家中進行，直到晚清才出現專門的女子學校"], ["D", "只有官宦人家的女性才需要學習家務"]], "ans": "C", "exp": "在傳統中國社會中，女性不是完全沒有接受教育的機會，但她們所受的教育大多是在家中進行；直到十九世紀末，才開始出現針對女性而開辦的專門學校。"}, {"stem": "纏足對傳統中國婦女造成下列何種實際影響？", "opts": [["A", "使婦女的社會地位大幅提升"], ["B", "限制婦女的行動能力"], ["C", "讓婦女更容易外出工作"], ["D", "與婦女能否接受教育完全無關"]], "ans": "B", "exp": "傳統中國認為婦女的主要職責是在家庭中從事家務、撫育子女，纏足更限制了她們的行動，成為晚清廢纏足運動亟欲革除的對象。"}, {"stem": "南一版課本指出，清代晚期部分中國知識分子接觸西方追求個人自由的觀念後，對傳統倫理產生下列何種反應？", "opts": [["A", "完全否定西方觀念，更加堅持傳統倫理"], ["B", "對此議題毫無反應"], ["C", "一致主張廢除所有家族制度"], ["D", "有人重新檢視傳統倫理，也有人開始鼓吹婚姻自主"]], "ans": "D", "exp": "清代晚期，中國知識分子接觸西方追求個人獨立自由等新觀念後，有人因此重新檢視傳統倫理，也有人開始鼓吹婚姻自主，家族對個人的影響力也逐漸動搖。"}, {"stem": "康軒版課本指出，清末部分女學生除了在國內求學外，也選擇到海外留學，其中以下列哪一個國家最為熱門？", "opts": [["A", "美國"], ["B", "英國"], ["C", "法國"], ["D", "日本"]], "ans": "D", "exp": "十九世紀末開始，也有一些女性選擇到海外留學，日本尤其是熱門的地點，著名的革命家秋瑾就是在東京留學。"}, {"stem": "秋瑾在日本東京留學期間，與數十位女留學生共同從事下列何種活動？", "opts": [["A", "專心研讀西方文學作品"], ["B", "組織暗殺部門，積極參與革命運動"], ["C", "集資興建女子學校"], ["D", "拒絕與其他留學生往來"]], "ans": "B", "exp": "清末，這群在東京留學的女學生組織暗殺部門，製造彈藥軍火，積極參與革命，推翻清朝統治，展現當時女性參與政治運動的意識。"}, {"stem": "秋瑾出生於西元哪一年，出身於什麼樣的家庭？", "opts": [["A", "1875年，官宦之家"], ["B", "1900年，商人之家"], ["C", "1850年，農民之家"], ["D", "1911年，工匠之家"]], "ans": "A", "exp": "秋瑾於西元1875年出生，出身於傳統的官宦之家，長大後雖奉父母之命與富紳之子結婚，卻對婚姻的束縛感到不滿，最終走上留學與革命之路。"}, {"stem": "晚清通商口岸中，哪一座城市的現代化發展最具代表性，被視為融合中西文化的城市？", "opts": [["A", "天津"], ["B", "廣州"], ["C", "上海"], ["D", "福州"]], "ans": "C", "exp": "通商口岸中，上海因國際貿易與工商業發達，吸引大量人口移居，自來水、電燈、電話、電車等現代化設施陸續出現，是最具代表性的新興城市。"}, {"stem": "晚清城市中出現許多西式餐館，「吃西餐」逐漸成為下列何種現象？", "opts": [["A", "只有窮人才吃的食物"], ["B", "只在鄉村流行的風氣"], ["C", "被官府嚴格禁止的活動"], ["D", "上流社會的社交場所與時尚象徵"]], "ans": "D", "exp": "晚清城市中西餐館與咖啡廳逐漸 xp": "晚清西式學堂多使用西方教材，部分還聘請西方人士任教，除了教育知識外，新式教育也重視體育，試圖培養學生體魄。"}, {"stem": "傳統中國社會中，家族對個人的約束力極強，下列何者是促使這種約束力逐漸動搖的原因？", "opts": [["A", "政府強制廢除家族制度"], ["B", "個人前往城市謀生求學，加上西方個人自由觀念的傳入"], ["C", "戰爭導致家族全數消失"], ["D", "科舉制度的維持"]], "ans": "B", "exp": "隨著中國知識分子接觸西方追求個人獨立自由等新觀念，加上許多人前往城市謀生、求學而暫時脫離家族，家族對個人的影響力因此逐漸動搖。"}, {"stem": "下列關於晚清社會文化變遷的敘述，何者「正確」？", "opts": [["A", "教育、報刊、服飾、婦女角色等各方面同時出現新舊並陳的現象"], ["B", "傳統與新式文化完全沒有衝突"], ["C", "社會文化變遷只發生在鄉村地區"], ["D", "婦女地位在晚清完全沒有任何改變"]], "ans": "A", "exp": "晚清社會在教育（科舉廢除、新式學堂）、傳播媒介（報刊興起）、生活風氣（服飾、娛樂）、婦女角色（興女學、廢纏足）等各層面都出現新舊並陳、逐步轉變的現象。"}, {"stem": "清末「立憲派轉而支持革命運動」這件事，說明了下列何種因果關係？", "opts": [["A", "革命運動與立憲運動完全無關"], ["B", "立憲運動的成功，鞏固了清朝統治"], ["C", "立憲運動的失敗，加速了清朝統治的滅亡"], ["D", "立憲派最後選擇支持義和團"]], "ans": "C", "exp": "清廷成立的皇族內閣讓立憲派人士大為失望，於是轉而支持革命運動，這股力量的匯聚也加速了清朝統治的滅亡，為之後辛亥革命與民國建立埋下伏筆。"}, {"stem": "綜合來看，晚清教育改革（廢科舉、興新式學堂）、報刊傳播新思潮、社會風氣變化（服飾、辮髮）、女權與放足運動等，反映了下列何種歷史趨勢？", "opts": [["A", "中國社會在西方衝擊下，逐漸從傳統走向現代化的轉型過程"], ["B", "中國社會完全拒絕接受西方事物"], ["C", "這些變化與辛亥革命的爆發毫無關聯"], ["D", "這些變化僅侷限於北京一地"]], "ans": "A", "exp": "晚清的教育改革、新式傳播媒介、城市生活風氣與婦女角色的轉變，共同反映出中國社會在西方文明衝擊下，從傳統逐步走向現代化轉型的過程，這股力量最終也匯聚為推動辛亥革命與民國建立的重要背景。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

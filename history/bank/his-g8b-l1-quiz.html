<script>
const QS=[{"stem": "清末面對內憂外患，主張以「君主立憲」方式改革救國的代表人物是誰？", "opts": [["A", "孫中山、黃興"], ["B", "袁世凱、段祺瑞"], ["C", "宋教仁、黃興"], ["D", "康有為、梁啟超"]], "ans": "D", "exp": "康有為、梁啟超主張在既有體制內改革，實施君主立憲；孫中山等人才是主張推翻帝制、建立共和的革命派。"}, {"stem": "孫中山、宋教仁等革命派人士所主張的救國之道為何？", "opts": [["A", "維持清朝帝制，實施地方自治"], ["B", "推翻清朝帝制，建立民主共和"], ["C", "聯合列強共同對抗革命聲浪"], ["D", "恢復傳統科舉制度以選拔人才"]], "ans": "B", "exp": "革命派主張徹底推翻既有的君主專制體制，建立全新的民主共和國家。"}, {"stem": "孫中山於西元1894年成立的革命團體稱為什麼？", "opts": [["A", "同盟會"], ["B", "華興會"], ["C", "興中會"], ["D", "國民黨"]], "ans": "C", "exp": "甲午戰爭後，孫中山受戰敗刺激，於1894年成立興中會，是最早的革命團體之一。"}, {"stem": "西元1905年，興中會、華興會等革命團體在日本合併而成的組織是？", "opts": [["A", "光復會"], ["B", "立憲派"], ["C", "國民黨"], ["D", "中國革命同盟會（同盟會）"]], "ans": "D", "exp": "1905年，各革命團體合併為同盟會，目的是集結力量共同推翻清朝統治。"}, {"stem": "依課本內容，下列何者是同盟會的重要領袖之一？", "opts": [["A", "袁世凱"], ["B", "黃興"], ["C", "張作霖"], ["D", "段祺瑞"]], "ans": "B", "exp": "黃興與孫中山、宋教仁同為同盟會的重要領袖，長期投入革命行動。"}, {"stem": "西元1911年，清廷宣布將民間集資興建的鐵路收歸國有，引發哪一場民間抗爭運動？", "opts": [["A", "保路運動"], ["B", "護法運動"], ["C", "二次革命"], ["D", "五四運動"]], "ans": "A", "exp": "清廷將鐵路收歸國有，損及地方士紳與人民的投資利益，引發「保路運動」。"}, {"stem": "保路運動中，抗爭最為激烈的省分是？", "opts": [["A", "湖北省"], ["B", "四川省"], ["C", "廣東省"], ["D", "雲南省"]], "ans": "B", "exp": "課本明確指出，保路運動中以四川省的抗爭最為激烈。"}, {"stem": "保路運動與辛亥革命的爆發有何直接關聯？", "opts": [["A", "清廷調動湖北新軍前往四川鎮壓保路運動，導致武昌防務空虛"], ["B", "保路運動促使列強直接出兵佔領中國"], ["C", "保路運動使袁世凱提前稱帝"], ["D", "保路運動導致臨時約法提前公布"]], "ans": "A", "exp": "清廷為鎮壓四川的保路運動，調動湖北新軍前往四川，使武昌守備空虛，革命黨人趁機起事。"}, {"stem": "辛亥革命的關鍵事件「武昌起事」發生於何時？", "opts": [["A", "1912年1月1日"], ["B", "1913年3月20日"], ["C", "1911年10月10日"], ["D", "1915年5月9日"]], "ans": "C", "exp": "潛伏在新軍內部的革命黨人於1911年10月10日深夜在武昌起事，揭開辛亥革命的序幕。"}, {"stem": "武昌起事後，各省的反應大致為何？", "opts": [["A", "長江以南各省相繼宣告獨立，脫離清朝統治"], ["B", "各省立即派兵協助清廷鎮壓"], ["C", "各省擁立袁世凱為新皇帝"], ["D", "各省聯合列強共組聯合政府"]], "ans": "A", "exp": "武昌起事成功後，各省紛紛響應，長江以南各省陸續宣告獨立，清朝統治迅速瓦解。"}, {"stem": "「辛亥革命」在中國歷史上最主要的意義是什麼？", "opts": [["A", "結束中國兩千多年的帝制，開創民主共和"], ["B", "使中國走向君主立憲"], ["C", "促成中國與列強簽訂平等條約"], ["D", "使袁世凱順利登基稱帝"]], "ans": "A", "exp": "辛亥革命終結了中國兩千多年的帝制，開啟了追求民主、自由的中華民國。"}, {"stem": "中華民國臨時政府於何時、何地成立？", "opts": [["A", "1911年10月，武昌"], ["B", "1912年1月1日，南京"], ["C", "1913年3月，北京"], ["D", "1916年6月，廣州"]], "ans": "B", "exp": "西元1912年1月1日，中華民國臨時政府在南京正式成立。"}, {"stem": "中華民國臨時政府成立後，各省代表推舉何人為臨時大總統？", "opts": [["A", "袁世凱"], ["B", "黎元洪"], ["C", "段祺瑞"], ["D", "孫中山"]], "ans": "D", "exp": "各省代表推舉革命領袖孫中山擔任中華民國臨時大總統。"}, {"stem": "清朝末代皇帝溥儀是在何人的協調下宣布退位？", "opts": [["A", "孫中山"], ["B", "袁世凱"], ["C", "段祺瑞"], ["D", "張勳"]], "ans": "B", "exp": "臨時政府與袁世凱協議，只要他能說服清帝退位，便推舉他為臨時大總統，袁世凱因此迫使溥儀退位。"}, {"stem": "宣統皇帝溥儀退位，代表了什麼歷史意義？", "opts": [["A", "中華民國正式加入國際聯盟"], ["B", "軍閥割據局面正式形成"], ["C", "結束中國兩千多年來的帝制"], ["D", "護法運動獲得最終勝利"]], "ans": "C", "exp": "溥儀退位，象徵中國兩千多年的君主專制體制正式終結。"}, {"stem": "南京臨時政府與袁世凱協議，只要袁世凱做到什麼，便推選他擔任臨時大總統？", "opts": [["A", "說服清帝溥儀退位"], ["B", "對日本宣戰"], ["C", "恢復科舉制度"], ["D", "遷都南京"]], "ans": "A", "exp": "臨時政府提出的條件是袁世凱須促成清帝退位，事成之後才推舉他為臨時大總統。"}, {"stem": "《中華民國臨時約法》的主要作用與目的為何？", "opts": [["A", "將政府體制由總統制改為內閣制，藉此牽制袁世凱"], ["B", "擴大總統職權，方便袁世凱集權"], ["C", "恢復清朝的君主專制體制"], ["D", "宣布中國參加第一次世界大戰"]], "ans": "A", "exp": "臨時約法效力等同憲法，將總統制改為內閣制，由內閣掌握實際政治權力，藉此牽制即將接任的袁世凱。"}, {"stem": "《中華民國臨時約法》是在下列哪一個時間點頒布？", "opts": [["A", "護法運動爆發之後"], ["B", "孫中山卸任臨時大總統之前"], ["C", "袁世凱稱帝之後"], ["D", "二十一條簽訂之後"]], "ans": "B", "exp": "孫中山卸任前，臨時政府先頒布臨時約法，用以限制即將接任的袁世凱的權力。"}, {"stem": "袁世凱就任臨時大總統時，實際的就職地點在何處？", "opts": [["A", "南京"], ["B", "廣州"], ["C", "北京"], ["D", "武昌"]], "ans": "C", "exp": "袁世凱不願南下就職，便在北京就任臨時大總統。"}, {"stem": "因為袁世凱不願南下就職，臨時政府因此做了什麼決定？", "opts": [["A", "解散國會"], ["B", "宣布獨立"], ["C", "發動二次革命"], ["D", "遷往北京"]], "ans": "D", "exp": "袁世凱堅持在北京就職，臨時政府因此被迫遷往北京。"}, {"stem": "民國元年成立的「國民黨」，其組成基礎主要來自於？", "opts": [["A", "立憲派人士"], ["B", "同盟會成員"], ["C", "北洋軍系將領"], ["D", "保路運動領袖"]], "ans": "B", "exp": "國民黨是以同盟會成員為基礎所組成的政黨。"}, {"stem": "民國2年的國會選舉中，國民黨的表現如何？", "opts": [["A", "大敗，喪失席次"], ["B", "被袁世凱明令解散"], ["C", "與袁世凱合組聯合內閣"], ["D", "贏得選舉，成為國會第一大黨"]], "ans": "D", "exp": "民國2年國會大選，國民黨贏得選舉，成為國會第一大黨，卻也因此引來袁世凱的忌憚。"}, {"stem": "主導國民黨黨務、有望出任內閣總理的重要人物，卻在民國2年遭到暗殺，此人是？", "opts": [["A", "宋教仁"], ["B", "黃興"], ["C", "蔡鍔"], ["D", "段祺瑞"]], "ans": "A", "exp": "宋教仁積極主導國民黨黨務並贏得國會選舉，卻不幸遇刺身亡，成為民初政局的重大轉折點。"}, {"stem": "宋教仁遇刺身亡後，當時輿論多將矛頭指向何人是幕後主謀？", "opts": [["A", "張勳"], ["B", "段祺瑞"], ["C", "黎元洪"], ["D", "袁世凱"]], "ans": "D", "exp": "由於宋教仁的行動不利於袁世凱擴權，輿論多懷疑袁世凱是暗殺的幕後主使者。"}, {"stem": "國民黨因宋教仁案而號召討伐袁世凱的軍事行動，史稱什麼？", "opts": [["A", "護法運動"], ["B", "護國運動"], ["C", "二次革命"], ["D", "張勳復辟"]], "ans": "C", "exp": "國民黨因宋教仁案號召討袁，史稱「二次革命」，但最終失敗。"}, {"stem": "「二次革命」最後的結果為何？", "opts": [["A", "成功推翻袁世凱政權"], ["B", "迅速失敗"], ["C", "促成南北分裂正式和解"], ["D", "促使清帝復辟"]], "ans": "B", "exp": "討袁軍力量不足、未能齊心合力，二次革命最終迅速失敗。"}, {"stem": "二次革命失敗後，袁世凱透過什麼方式鞏固自身權力？", "opts": [["A", "逼迫國會改選他為正式大總統"], ["B", "主動辭去大總統職位"], ["C", "恢復臨時約法內閣制"], ["D", "邀請孫中山共組內閣"]], "ans": "A", "exp": "二次革命失敗後，袁世凱逼迫國會改選他為正式大總統，藉此鞏固權力。"}, {"stem": "袁世凱擔任正式大總統後，進一步採取了什麼行動來擴張總統職權？", "opts": [["A", "召開國民大會制定新憲法"], ["B", "宣布恢復科舉制度"], ["C", "遷都廣州"], ["D", "解散國會，廢除臨時約法"]], "ans": "D", "exp": "袁世凱解散國會、廢除臨時約法，藉此擴大總統職權，並開始醞釀稱帝。"}, {"stem": "第一次世界大戰爆發後，哪一國藉口對德宣戰，出兵佔領德國在山東的勢力範圍？", "opts": [["A", "俄國"], ["B", "英國"], ["C", "美國"], ["D", "日本"]], "ans": "D", "exp": "民國3年一次大戰爆發，日本藉口向德國宣戰，趁機出兵佔領德國在山東的勢力範圍。"}, {"stem": "民國4年，日本向北京政府提出的無理要求稱為什麼？", "opts": [["A", "五九國恥"], ["B", "馬關條約"], ["C", "二十一條要求"], ["D", "辛丑條約"]], "ans": "C", "exp": "民國4年，日本向北京政府提出「二十一條」要求，企圖擴張在中國的利益。"}, {"stem": "袁世凱被迫接受日本大部分「二十一條」條文的日期是5月9日，因此後世稱這一天為？", "opts": [["A", "五九國恥"], ["B", "護法紀念日"], ["C", "雙十節"], ["D", "洪憲紀念日"]], "ans": "A", "exp": "袁世凱在5月9日被迫接受大部分二十一條條文，此事後來被稱為「五九國恥」。"}, {"stem": "日本提出二十一條要求，主要意圖擴張其在哪些地區的利益？", "opts": [["A", "廣東、廣西"], ["B", "雲南、貴州"], ["C", "東北、山東"], ["D", "新疆、西藏"]], "ans": "C", "exp": "二十一條要求意圖擴張日本在中國東北及山東的利益。"}, {"stem": "袁世凱稱帝後，將國號改為什麼？", "opts": [["A", "大清帝國"], ["B", "大同帝國"], ["C", "大中華民國"], ["D", "中華帝國"]], "ans": "D", "exp": "袁世凱著手稱帝，將國號改為「中華帝國」。"}, {"stem": "袁世凱稱帝，以民國5年為哪一個年號元年？", "opts": [["A", "宣統"], ["B", "洪憲"], ["C", "光緒"], ["D", "建元"]], "ans": "B", "exp": "袁世凱以民國5年為「洪憲元年」，史稱「洪憲帝制」。"}, {"stem": "依課本敘述，袁世凱稱帝後，最終為何撤銷帝制？", "opts": tem": "張勳復辟最終被誰所推翻？", "opts": [["A", "孫中山"], ["B", "袁世凱"], ["C", "段祺瑞"], ["D", "黎元洪"]], "ans": "C", "exp": "張勳復辟最終被段祺瑞率兵推翻，張勳則逃往荷蘭公使館避難。"}, {"stem": "民國6年，主張對德宣戰的國務總理段祺瑞，與反對此議的大總統之間爆發衝突，這位大總統是？", "opts": [["A", "袁世凱"], ["B", "黎元洪"], ["C", "溥儀"], ["D", "孫中山"]], "ans": "B", "exp": "依翰林版課本補充內容，主張對德宣戰的國務總理段祺瑞，與反對此議的大總統黎元洪之間發生「府院之爭」，張勳便藉此機會入京調解，卻反而發動復辟。"}, {"stem": "中華民國建立後，一直沿用到民國17年的國旗是？", "opts": [["A", "青天白日滿地紅旗"], ["B", "黃龍旗"], ["C", "十八星旗"], ["D", "五色旗"]], "ans": "D", "exp": "中華民國建立後，一直到民國17年北伐完成前，所使用的國旗是五色旗。"}, {"stem": "下列民初重大事件，依發生先後順序排列，正確的是？\n甲、洪憲帝制　乙、二次革命　丙、辛亥革命　丁、二十一條要求", "opts": [["A", "甲乙丙丁"], ["B", "乙丙丁甲"], ["C", "丙乙丁甲"], ["D", "丁丙乙甲"]], "ans": "C", "exp": "正確順序為：辛亥革命（1911）→ 二次革命（民國2年）→ 二十一條要求（民國4年）→ 洪憲帝制（民國5年），故為丙乙丁甲。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

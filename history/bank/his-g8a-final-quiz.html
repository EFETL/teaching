<script>
const QS=[{"stem": "18世紀中期，清廷為管理來華貿易的外國商人，將通商口岸限定於何處，並規定外商須透過「公行」才能買賣商品？", "opts": [["A", "廣州"], ["B", "上海"], ["C", "天津"], ["D", "福州"]], "ans": "A", "exp": "乾隆年間，清廷為方便管理來華貿易的外商，限定西方商人僅能在廣州一地貿易，並須透過官方支持的商行「公行」轉達交涉事宜，外商不得直接與中國官府接觸。"}, {"stem": "18世紀末，英國曾派遣使節團前來中國，希望能夠放寬通商限制，但最終無功而返。這是下列何人所率領的使節團？", "opts": [["A", "培里"], ["B", "伊藤博文"], ["C", "馬加爾尼"], ["D", "李鴻章"]], "ans": "C", "exp": "英國曾派遣馬加爾尼使節團來華，希望開放通商限制，但因中國天朝體制的觀念與雙方對跪拜禮儀（單膝下跪與三跪九叩）看法不同而發生爭議，最終未能達成目的。"}, {"stem": "英國在對中國貿易中，購買茶葉、絲綢、瓷器等商品的金額，遠超過賣給中國的商品金額，造成嚴重的貿易失衡。英國商人為解決此問題，採取了下列何種做法？", "opts": [["A", "向中國要求開放通商口岸"], ["B", "從印度大量走私鴉片來華銷售"], ["C", "派兵直接占領廣州"], ["D", "提高茶葉、絲綢的收購價格"]], "ans": "B", "exp": "由於英國賣給中國的商品有限，為了平衡貿易逆差，英商將印度所產的鴉片大量走私輸入中國，不僅造成中國白銀大量外流，也嚴重危害人民健康。"}, {"stem": "道光皇帝為解決鴉片氾濫的問題，派遣下列何人前往廣州查禁鴉片，使英商財物大受損失？", "opts": [["A", "曾國藩"], ["B", "康有為"], ["C", "奕訢"], ["D", "林則徐"]], "ans": "D", "exp": "道光皇帝派遣林則徐前往廣州查禁鴉片，林則徐強制沒收並銷毀鴉片，使英商蒙受巨大損失，英國便以此為藉口出兵中國，引爆鴉片戰爭。"}, {"stem": "鴉片戰爭於西元哪一年爆發？", "opts": [["A", "1840年"], ["B", "1842年"], ["C", "1851年"], ["D", "1858年"]], "ans": "A", "exp": "道光20年（西元1840年），英國以查禁鴉片、財物受損為藉口出兵中國，中、英爆發戰爭，史稱「鴉片戰爭」，最後中國戰敗。"}, {"stem": "鴉片戰爭結束後，中、英兩國簽訂了下列哪一項條約？", "opts": [["A", "辛丑和約"], ["B", "馬關條約"], ["C", "南京條約"], ["D", "天津條約"]], "ans": "C", "exp": "西元1842年（道光22年），清廷戰敗後被迫與英國簽訂南京條約，內容包括賠款、割讓香港、開放五個通商口岸等，中國因而喪失重要的司法及經濟主權。"}, {"stem": "南京條約簽訂後，英國又陸續在續約中取得許多特權。其中規定「外國僑民在中國犯罪時，不受中國法律管束，而由該國領事依其本國法律處理」，這項特權稱為什麼？", "opts": [["A", "協定關稅"], ["B", "領事裁判權"], ["C", "片面最惠國待遇"], ["D", "租界"]], "ans": "B", "exp": "領事裁判權規定外國僑民在中國犯罪時不受中國法律管轄，而由該國領事依其本國法律處理，此舉嚴重破壞了中國司法主權的獨立與完整。"}, {"stem": "下列何項特權的內容是「中國政府必須與外國政府協商，才能訂定外國貨物進口的稅率」？", "opts": [["A", "領事裁判權"], ["B", "租界"], ["C", "片面最惠國待遇"], ["D", "協定關稅"]], "ans": "D", "exp": "協定關稅規定中國須與外國政府協商才能訂定進口稅率，使中國喪失了關稅自主權，是不平等條約對中國經濟主權的重大侵害之一。"}, {"stem": "各國在通商口岸劃定特定區域，供該國僑民居住或經商，外國人在此區域內不受中國政府管轄，形同「國中之國」，這是指下列何者？", "opts": [["A", "租界"], ["B", "協定關稅"], ["C", "領事裁判權"], ["D", "片面最惠國待遇"]], "ans": "A", "exp": "租界是各國在中國通商口岸劃定的特定區域，供僑民居住或經商，外國人在租界內不受中國政府管轄，嚴重破壞了中國領土主權的完整。"}, {"stem": "「當中國給予某一國新的權利時，其他享有此特權的國家也能一併獲得相同的權利，但中國卻無法因此獲得對等待遇」，這種特權稱為下列何者？", "opts": [["A", "租界"], ["B", "協定關稅"], ["C", "片面最惠國待遇"], ["D", "領事裁判權"]], "ans": "C", "exp": "片面最惠國待遇是指中國給予他國優惠時，其他享有此待遇的國家也能一併獲得同樣的權利，但中國本身卻無法比照獲得同等待遇，故稱「片面」。"}, {"stem": "南京條約簽訂後，英國希望進一步透過修約來擴大對中國的通商範圍，卻遭到清廷拒絕。英國因此聯合下列哪一國出兵中國？", "opts": [["A", "美國"], ["B", "法國"], ["C", "俄國"], ["D", "德國"]], "ans": "B", "exp": "鴉片戰爭後，英國希望修約達成全面開放通商，卻遭清廷拒絕，於是聯合法國出兵中國，史稱「英法聯軍」，戰爭前後共有兩次。"}, {"stem": "英法聯軍之役後，清廷被迫簽約，下列何者不屬於此役後清廷所同意的內容？", "opts": [["A", "開放內地通商口岸"], ["B", "允許外國公使駐京"], ["C", "允許外人至內地遊歷、傳教"], ["D", "割讓香港"]], "ans": "D", "exp": "割讓香港是鴉片戰爭後南京條約的內容，而非英法聯軍之役的結果。英法聯軍之役後，清廷同意開放內地通商口岸、允許外國公使駐京、外人可至內地遊歷傳教等。"}, {"stem": "英法聯軍之役帶來的最直接影響為何？", "opts": [["A", "列強勢力由沿海深入中國內地"], ["B", "中國喪失朝鮮宗主權"], ["C", "台灣、澎湖遭到割讓"], ["D", "科舉制度被迫廢除"]], "ans": "A", "exp": "英法聯軍之役後，清廷被迫開放內地通商口岸，並允許外人深入內地遊歷、傳教，使得列強勢力得以從沿海地區深入中國內地，加深了知識分子的危機感。"}, {"stem": "英法聯軍之役發生於下列哪一位皇帝在位期間？", "opts": [["A", "道光皇帝"], ["B", "同治皇帝"], ["C", "咸豐皇帝"], ["D", "光緒皇帝"]], "ans": "C", "exp": "英法聯軍之役發生於咸豐年間（西元1857年起），負責交涉及作戰的官員在此役中深刻體會到西方船堅炮利的實力，促使清廷日後推動自強運動。"}, {"stem": "清廷推動自強運動的主要背景為何？", "opts": [["A", "甲午戰爭戰敗的刺激"], ["B", "英法聯軍期間官員見識到西方船堅炮利的事實"], ["C", "義和團事件引發的排外浪潮"], ["D", "日俄戰爭日本獲勝的震撼"]], "ans": "B", "exp": "英法聯軍期間，負責交涉及作戰的官員（如奕訢、曾國藩、李鴻章等）親身體會到西方軍事科技的先進，因而在戰後推動自強運動，仿效西方器物技藝以求自強。"}, {"stem": "下列何組人物為推動自強運動的主要代表人物？", "opts": [["A", "康有為、梁啟超"], ["B", "光緒皇帝、慈禧太后"], ["C", "全琫準、崔濟愚"], ["D", "恭親王奕訢、曾國藩、李鴻章"]], "ans": "D", "exp": "自強運動主要由恭親王奕訢與曾國藩、李鴻章等地方官員推動，他們在英法聯軍之役中見識到西方的船堅炮利，因而致力於引進西方軍事、技術，推行改革。"}, {"stem": "自強運動期間所設立的「總理各國事務衙門」，其主要功能為何？", "opts": [["A", "統籌管理科舉考試"], ["B", "訓練新式陸軍"], ["C", "統籌辦理對外交涉事務"], ["D", "負責審理外國人在中國犯罪案件"]], "ans": "C", "exp": "總理各國事務衙門（簡稱總理衙門）成立於咸豐10年（1861年）左右，負責統籌辦理對外交涉事務，象徵中國正式進入現代外交體系，後來也成為推動自強運動的中樞機構。"}, {"stem": "自強運動大約始於下列哪一個年代？", "opts": [["A", "1842年"], ["B", "1861年"], ["C", "1894年"], ["D", "1900年"]], "ans": "B", "exp": "英法聯軍之役後，清廷於咸豐10年（西元1861年）左右成立總理各國事務衙門，並開始推動以引進西方器物、技術為主的自強運動。"}, {"stem": "下列何者不屬於自強運動所推動的建設項目？", "opts": [["A", "設立兵工廠、鋪設鐵路"], ["B", "建立君主立憲制度"], ["C", "派遣幼童出國留學"], ["D", "建立北洋艦隊、成立輪船招商局"]], "ans": "B", "exp": "自強運動的建設偏重於軍事、交通、教育等器物層面，包括設立兵工廠、鋪設鐵路、派遣留學生、建立北洋艦隊、創辦輪船招商局等；至於君主立憲屬於制度層面的改革，是日本明治維新的內容，並非自強運動所推動。"}, {"stem": "比較中國的自強運動與日本的明治維新，自強運動在改革層面上主要著重於下列何者？", "opts": [["A", "政治制度的全面革新"], ["B", "教育體制的根本翻轉"], ["C", "君主立憲的建立"], ["D", "器物、技藝層面的引進"]], "ans": "D", "exp": "自強運動主要仿效西方的器物技藝，例如引進西式武器、船艦、鐵路等，而未觸及政治制度的根本改革，這也是它與日本明治維新在改革深度上的重要差異。"}, {"stem": "自強運動推行的成效不如預期，其主要原因為何？", "opts": [["A", "地方官員各自為政，加上守舊派人士反對"], ["B", "康有為、梁啟超等人強力反對"], ["C", "列強聯合出兵阻止改革"], ["D", "光緒皇帝下令停止所有新政"]], "ans": "A", "exp": "自強運動的建設大多由地方官員各自推動，缺乏整體性的規劃，加上朝中守舊派人士的反對，使得整體改革成效有限。"}, {"stem": "儘管自強運動整體成效有限，但仍為中國帶來哪一項正面貢獻？", "opts": [["A", "使中國躍升為亞洲第一強國"], ["B", "完全廢除了不平等條約"], ["C", "培養了一批外交、科技等新式人才"], ["D", "使日本放棄併吞朝鮮的計畫"]], "ans": "C", "exp": "自強運動雖然成效不彰，但透過設立新式學堂、派遣留學生等方式，培養了一批熟悉外交、科技的新式人才，對中國日後的現代化發展仍有一定貢獻。"}, {"stem": "西元1853年，美國海軍將領培里率領艦隊駛入日本，要求日本開港通商，因軍艦船體漆黑，此事件在日本被稱為什麼？", "opts": [["A", "甲申事變"], ["B", "黑船事件"], ["C", "東學黨事件"], ["D", "牡丹社事件"]], "ans": "B", "exp": "西元1853年，美國海軍將領培里率艦隊駛入江戶灣，要求日本開港通商，因美艦船體漆黑，日本人稱此事為「黑船事件」，此後日本被迫結束鎖國、開港通商。"}, {"stem": "日本的明治維新開始於下列哪一年？由何人主導推動？", "opts": [["A", "1861年，由恭親王奕訢主導"], ["B", "1894年，由伊藤博文主導"], ["C", "1900年，由慈禧太后主導"], ["D", "1868年，由明治天皇主導"]], "ans": "D", "exp": "西元1868年，日本在黑船事件、被迫開港通商後，由明治天皇展開一連串效法西方的現代化改革，史稱「明治維新」。"}, {"stem": "明治維新的改革內容，下列何者正確？", "opts": [["A", "實施君主立憲制、建立新式軍隊、發展現代工商業與新式教育"], ["B", "僅限於引進西式武器與船艦"], ["C", "全面廢止傳統天皇制度，改行共和制"], ["D", "拒絕與西方各國往來，繼續維持鎖國政策"]], "ans": "A", "exp": "明治維新的改革內容涵蓋政治、軍事、經濟、教育等層面，包括實施君主立憲制、建立新式軍隊、扶植現代化工商業、普及新式教育等，是一場全面性的現代化改革。"}, {"stem": "日本明治維新的改革成效遠優於中國自強運動，其中一項關鍵差異在於：", "opts": [["A", "日本完全沒有守舊派人士的反對"], ["B", "日本改革僅侷限於軍事層面"], ["C", "明治維新從制度層面全面革新，自強運動則多侷限於器物技藝的引進"], ["D", "中國自強運動缺乏西方顧問協助"]], "ans": "C", "exp": "明治維新從政治制度（如君主立憲）到社會經濟全面西化，改革層面較深；相較之下，自強運動主要仿效西方器物技藝，缺乏制度層面的根本革新，這是兩者成效差異的重要原因。"}, {"stem": "明治維新後，日本國力大增，開始積極對外擴張，下列何者為其擴張行動之一？", "opts": [["A", "出兵占領北京"], ["B", "出兵臺灣（牡丹社事件）並併吞琉球"], ["C", "出兵占領香港"], ["D", "出兵占領廣州"]], "ans": "B", "exp": "明治維新使日本國力大增，日本便以此為基礎向外擴張，例如藉口琉球漁民被殺而出兵臺灣（牡丹社事件），並進一步併吞琉球，同時將擴張目標指向朝鮮半島。"}, {"stem": "甲午戰爭爆發的導火線，與下列哪一事件有關？", "opts": [["A", "朝鮮境內爆發東學黨事件（農民起義）"], ["B", "義和團在北京燒毀教堂"], ["C", "英國要求修約遭清廷拒絕"], ["D", "德國強行租借膠州灣"]], "ans": "A", "exp": "甲午戰爭的導火線是朝鮮境內的東學黨事件，農民領袖全琫準率領農民起義，朝鮮政府因而向清廷求援，日本則趁機出兵朝鮮，最終引發中日兩國的軍事衝突。"}, {"stem": "朝鮮東學黨事件發生後，中、日兩國的軍隊為何會發生正面衝突？", "opts": [["A", "朝鮮亂事平定後，日本拒絕撤兵，反而進攻朝鮮王宮"], ["B", "中國率先向日本宣戰"], ["C", "日本要求朝鮮割讓領土"], ["D", "朝鮮國王主動邀請兩國開戰"]], "ans": "A", "exp": "東學黨事件發生後，中、日兩國皆出兵朝鮮，農民軍與朝鮮政府雖已議和，但日本不僅拒絕撤兵，反而進攻朝鮮王宮，最終導致中、日雙方在朝鮮半島正式宣戰。"}, {"stem": "甲午戰爭爆發於西元哪一年？", "opts": [["A", "1885年"], ["B", "1890年"], ["C", "1894年"], ["D", "1898年"]], "ans": "C", "exp": "西元1894年（歲次甲午，光緒20年），中、日兩國因朝鮮問題爆發戰爭，史稱「甲午戰爭」，最終中國戰敗。"}, {"stem": "甲午戰爭後，中、日兩國簽訂馬關條約，其中規定中國須割讓下列哪些地區給日本？", "opts": [["A", "香港與九龍"], ["B", "臺灣、澎湖（及遼東半島）"], ["C", "廣州與福州"], ["D", "山東半島"]], "ans": "B", "exp": "甲午戰爭戰敗後，中國於西元1895年與日本簽訂馬關條約，除賠款外，並割讓臺灣、澎湖及遼東半島給日本（遼東半島後因三國干涉而由中國贖回）。"}, {"stem": "馬關條約中，中國承認下列哪一個國家獨立自主，使其脫離與中國的傳統宗藩關係？", "opts": [["A", "越南"], ["B", "琉球"], ["C", "緬甸"], ["D", "朝鮮"]], "ans": "D", "exp": "馬關條約規定中國須承認朝鮮獨立自主，這使中國與朝鮮長期以來的宗藩關係正式終結，也象徵著中國傳統東亞秩序的瓦解。"}, {"stem": "馬關條約簽訂後，日本除了割地、賠款外，還取得下列何種經濟特權，衝擊中國本土工業發展？", "opts": [["A", "可在中國通商口岸設廠、製造商品"], ["B", "可自由開採中國全境礦產"], ["C", "可任意徵收中國關稅"], ["D", "可接管中國全部鐵路"]], "ans": "A", "exp": "馬關條約允許日本在中國各通商口岸設立工廠、製造商品，歐美列強也援引片面最惠國待遇取得相同權利，嚴重衝擊中國本土工業與經濟的發展。"}, {"stem": "馬關條約簽訂後，俄國聯合下列哪兩國共同干涉，迫使日本歸還遼東半島？", "opts": [["A", "英國、美國"], ["B", "法國、德國"], ["C", "義大利、奧地利"], ["D", "荷蘭、比利時"]], "ans": "B", "exp": "馬關條約簽訂後，俄國、德國、法國三國聯合干預，迫使日本同意讓中國以三千萬兩白銀贖回遼東半島，史稱「三國干涉還遼」。"}, {"stem": "三國干涉還遼後，俄國以「干涉還遼有功」為藉口，向中國要求下列何種權利，進而引發其他列強跟進？", "opts": [["A", "廢除科舉制度"], ["B", "租借中國東北港灣"], ["C", "派兵駐守北京"], ["D", "接管中國海關"]], "ans": "B", "exp": "俄國以干涉還遼有功為由，向中國要求租借東北港灣，此舉刺激德國、法國等其他列強紛紛跟進，在中國租借港灣、劃分勢力範圍，使中國陷入被瓜分的危機。"}, {"stem": "面對列強瓜分中國的危機，美國提出了下列何種政策，主張尊重中國主權與領土完整？", "opts": [["A", "三國干涉政策"], ["B", "片面最惠國政策"], ["C", "領事裁判政策"], ["D", "門戶開放政策"]], "ans": "D", "exp": "甲午戰爭後列強競相在中國租借港灣、劃分勢力範圍（如德國租借膠州灣、勢力擴及山東），美國則提出門戶開放政策，主張尊重中國主權和領土完整，使中國暫時免於遭到列強瓜分。"}, {"stem": "甲午戰爭戰敗，暴露清廷自強運動的侷限，下列哪兩位人物因而主張從制度層面進行更根本的改革？", "opts": [["A", "康有為、梁啟超"], ["B", "曾國藩、李鴻章"], ["C", "全琫準、崔濟愚"], ["D", "伊藤博文、陸奧宗光"]], "ans": "A", "exp": "甲午戰爭戰敗後，康有為、梁啟超等人有鑑於自強運動只重器物層面、成效有限，主張應從制度層面進行改革，因而推動戊戌變法。"}, {"stem": "戊戌變法是由下列哪一位皇帝所支持推動的改革？發生於西元哪一年？", "opts": [["A", "咸豐皇帝，1861年"], ["B", "光緒皇帝，1898年"], ["C", "同治皇帝，1875年"], ["D", "宣統皇帝，1911年"]], "ans": "B", "exp": "西元1898年（歲次戊戌，光緒24年），光緒皇帝採納康有為、梁啟超等人的建議，推動制度層面的改革，史稱「戊戌變法」。"}, {"stem": "戊戌變法的改革內容中，下列何者是為了革新教育所設立的新式學堂？", "opts": [["A", "京師同文館"], ["B", "京師大學堂"], ["C", "黃埔軍校"], ["D", "福州船政學堂"]], "ans": "B", "exp": "戊戌變法的內容包括精簡政府機構以裁汰冗員，以及設立京師大學堂以革新教育，京師大學堂即為今日北京大學的前身。"}, {"stem": "戊戌變法最終因觸動守舊派利益而失敗，下列何人發動政變，軟禁光緒皇帝並終止變法？", "opts": [["A", "康有為"], ["B", "李鴻章"], ["C", "全琫準"], ["D", "慈禧太后"]], "ans": "D", "exp": "戊戌變法內容過於龐雜且動搖守舊派利益，未能獲得多數士人支持，慈禧太后於是聯合守舊派大臣發動戊戌政變，軟禁光緒皇帝，參與變法者多被殺害或被迫逃亡海外。"}, {"stem": "戊戌變法因僅推行約一百天便告失敗，因此又被稱為下列何者？", "opts": [["A", "百日維新"], ["B", "明治維新"], ["C", "庚子新政"], ["D", "立憲運動"]], "ans": "A", "exp": "戊戌變法自光緒皇帝下詔變法到慈禧太后發動政變終止，前後僅維持約一百天左右，因此後世又稱這場改革為「百日維新」。"}, {"stem": "英法聯軍之役後，外國傳教士得以深入中國內地傳教，卻因宗教、文化差異與部分傳教士袒護教民，激起民眾何種情緒，進而醞釀出義和團事件？", "opts": [["A", "支持變法圖強的情緒"], ["B", "要求君主立憲的情緒"], ["C", "仇洋反教的排外情緒"], ["D", "主張全面西化的情緒"]], "ans": "C", "exp": "英法聯軍之役以後，傳教士深入內地傳教，因宗教與文化差異，加上部分傳教士袒護教民而與民眾發生衝突，激起民間仇洋反教的排外情緒，義和團便是在此背景下興起。"}, {"stem": "義和團打著下列何種口號，在北京一帶燒毀教堂、殺害傳教士？", "opts": [["A", "自強圖存"], ["B", "扶清滅洋"], ["C", "尊王攘夷"], ["D", "變法維新"]], "ans": "B", "exp": "源起於山東的義和團，打著「扶清滅洋」的口號，在北京一帶燒毀教堂、殺害傳教士，並包圍外國使館區，最終引發八國聯軍出兵攻陷北京。"}, {"stem": "義和團事件爆發後，引來哪些國家組成聯軍出兵攻陷北京？", "opts": [["A", "英、法兩國聯軍"], ["B", "美、俄兩國聯軍"], ["C", "僅日本單獨出兵"], ["D", "英、美、德、法、俄、日、義、奧等八國聯軍"]], "ans": "D", "exp": "西元1900年（庚子年），義和團事件引發列強不滿，英、美、德、法、俄、日、義大利、奧地利等八個國家組成聯軍，攻陷北京城，史稱「八國聯軍」。"}, {"stem": "八國聯軍攻陷北京後，清廷被迫與各國簽訂下列哪一項條約？其內容為何？", "opts": [["A", "辛丑和約，同意懲辦禍首、支付鉅額賠款"], ["B", "馬關條約，割讓臺灣、澎湖"], ["C", "南京條約，割讓香港"], ["D", "天津條約，開放內地口岸"]], "ans": "A", "exp": "八國聯軍攻陷北京後，慈禧太后拒 , {"stem": "晚清的上海之所以能吸引大量鄉村人口移居，其主要原因與下列何者最相關？", "opts": [["A", "鄉村發生嚴重飢荒"], ["B", "國際貿易與工商業發達，提供多樣化的就業機會"], ["C", "朝廷下令強迫遷徙"], ["D", "上海全面免除賦稅"]], "ans": "B", "exp": "由於國際貿易與工商業在通商口岸獲得成長，提供了多樣性的就業機會，吸引鄉村人口移居城市，上海因而逐漸成為融合中西文化的城市。"}, {"stem": "翰林版課本〈課後閱讀〉提到一種在19世紀中期傳入中國、被稱為「洋鬼子的魔水」的西式飲品，指的是下列何者？", "opts": [["A", "番茄汁"], ["B", "荷蘭水（汽水）"], ["C", "葡萄酒"], ["D", "咖啡"]], "ans": "B", "exp": "荷蘭水（即汽水）最初由西方傳入中國，19世紀中期已可見於上海街頭，是當時通商口岸新興的西式飲食文化代表之一。"}, {"stem": "「荷蘭水」最初之所以被稱為「洋鬼子的魔水」，主要原因是下列何者？", "opts": [["A", "它含有劇毒，飲用後會產生幻覺"], ["B", "它是官府禁止販售的違禁品"], ["C", "它為西方傳入的稀少舶來品，加上社會瀰漫仇外保守的氣氛"], ["D", "它只在租界內販售，中國人完全買不到"]], "ans": "C", "exp": "荷蘭水最初由西方傳入，數量稀少、物以稀為貴，加上開港通商後社會仍瀰漫仇外保守的氣氛，因此被稱為「洋鬼子的魔水」；後來中國人習得製作技術，成本降低，才逐漸在各地流行。"}, {"stem": "晚清出現的圖像式報刊（如畫報），對一般民眾產生下列何種影響？", "opts": [["A", "使民眾更加抗拒新知識"], ["B", "使不識字的民眾也能透過圖像閱讀，豐富庶民的娛樂生活"], ["C", "導致報刊業迅速沒落"], ["D", "只有官員能夠閱讀"]], "ans": "B", "exp": "晚清出現許多圖像式報刊，內容常刊載時事風俗畫，使不識字的民眾也能透過圖像了解時事、獲得娛樂，豐富了庶民的閱讀與娛樂生活。"}, {"stem": "南一版課本指出，清廷是在推動下列哪一項改革運動之後，才開始陸續設立西式學堂？", "opts": [["A", "自強運動"], ["B", "立憲運動"], ["C", "新文化運動"], ["D", "國民革命運動"]], "ans": "A", "exp": "除了外國人於各地城市設立學校外，清廷也在自強運動以後，陸續設立西式學堂，加速了新知識在中國的傳播，許多青年也因此前往城市求學，接觸各種新觀念。"}, {"stem": "陳擷芬在16歲創辦《女報》之前，曾就讀於外國傳教士創辦的哪一所女校？", "opts": [["A", "經正女學"], ["B", "金陵女子大學"], ["C", "中西女塾"], ["D", "京師大學堂"]], "ans": "C", "exp": "陳擷芬幼時隨父親遷往上海，進入外國傳教士創辦的女校「中西女塾」就讀，16歲時便創辦《女報》（後改名《女學報》），積極鼓吹女權、提倡女學。"}, {"stem": "陳擷芬之所以能較早接觸辦報事業、鼓吹女權，與她父親陳範的下列何種身分最相關？", "opts": [["A", "清廷科舉考官"], ["B", "著名的新式報刊經營者"], ["C", "外國傳教士"], ["D", "上海天足會負責人"]], "ans": "B", "exp": "陳擷芬的父親陳範是著名的新式報刊經營者，在其影響下，陳擷芬得以接觸辦報事業，並在16歲時創辦《女報》，積極鼓吹女權、提倡女學。"}, {"stem": "傳統中國社會中，婦女接受教育的機會為何？", "opts": [["A", "完全沒有機會接受任何教育"], ["B", "與男性完全平等，只是課程內容不同"], ["C", "機會不多，且多半僅在家中進行，直到晚清才出現專門的女子學校"], ["D", "只有官宦人家的女性才需要學習家務"]], "ans": "C", "exp": "在傳統中國社會中，女性不是完全沒有接受教育的機會，但她們所受的教育大多是在家中進行；直到十九世紀末，才開始出現針對女性而開辦的專門學校。"}, {"stem": "纏足對傳統中國婦女造成下列何種實際影響？", "opts": [["A", "使婦女的社會地位大幅提升"], ["B", "限制婦女的行動能力"], ["C", "讓婦女更容易外出工作"], ["D", "與婦女能否接受教育完全無關"]], "ans": "B", " }, {"stem": "唐群英在西元1912年國民黨成立大會上，因為黨綱缺乏何種內容而衝上主席臺質問宋教仁？", "opts": [["A", "經濟建設政策"], ["B", "男女平權"], ["C", "對外貿易政策"], ["D", "教育改革方案"]], "ans": "B", "exp": "西元1912年，國民黨舉辦成立大會，但黨綱中卻缺乏男女平權，唐群英氣得衝上主席臺，質問主席宋教仁，展現當時女性爭取參政權的意識。"}, {"stem": "秋瑾與唐群英等女性積極參與革命運動、爭取男女平權的作為，在歷史上被視為什麼樣的意義？", "opts": [["A", "完全沒有影響社會風氣"], ["B", "反而使女性地位更加低落"], ["C", "女性參政的先聲，展現女權意識逐漸抬頭"], ["D", "導致清廷立即廢除科舉"]], "ans": "C", "exp": "秋瑾勇於反抗傳統家庭對女性的限制，唐群英則在辛亥革命前後積極爭取男女平權，兩人的作為都成為女性參政的先聲，反映當時女權意識逐漸抬頭。"}, {"stem": "民國初年的報紙上，對女學生的批評逐漸增加，這些批評內容最常針對下列何者？", "opts": [["A", "女學生的穿著追逐時髦、行為不夠自愛"], ["B", "女學生功課成績太差"], ["C", "女學生不願意繼續升學"], ["D", "女學生要求提高學費"]], "ans": "A", "exp": "民國初年報紙上對女學生的批評，多針對其穿著追逐時髦、沉迷奢侈消費，以及與男學生出雙入對、行為不夠自愛等，反映部分男性知識分子的焦慮。"}, {"stem": "部分男性知識分子雖然支持女子教育，但認為女性受教育的目的主要是為了培養下列何者？", "opts": [["A", "賢妻良母"], ["B", "國家官員"], ["C", "職業革命家"], ["D", "商業人才"]], "ans": "A", "exp": "對很多男性知識分子而言，女性受教育的目的是培養更多「賢妻良母」，而不是讓女性出現他們眼中「踰矩」的行為，顯示傳統觀念仍未完全改變。"}, {"stem": "整體而言，晚清以來女子教育的推展，為中國社會帶來下列何種改變？", "opts": [["A", "男女完全平等，傳統觀念徹底消失"], ["B", "女子教育遭到全面禁止"], ["C", "女性從此完全退出家庭生活"], ["D", "給予女性更多參與社會的機會與能力，逐漸改變社會風氣"]], "ans": "D", "exp": "女子教育的推展，給予中國女性更多參與社會的機會與能力，不論是進入職場還是參與革命，都逐漸改變原本的社會風氣，儘管男女不平等的觀念依舊部分存在。"}, {"stem": "清末西式學堂教育與傳統私塾教育相比，下列敘述何者正確？", "opts": [["A", "西式學堂完全不重視體育"], ["B", "西式學堂只教授四書五經"], ["C", "西式學堂僅限男性就讀，且人數逐年減少"], ["D", "西式學堂多使用西方教材，部分聘請西方人士任教"]], "ans": "D", "exp": "晚清西式學堂多使用西方教材，部分還聘請西方人士任教，除了教育知識外，新式教育也重視體育，試圖培養學生體魄。"}, {"stem": "傳統中國社會中，家族對個人的約束力極強，下列何者是促使這種約束力逐漸動搖的原因？", "opts": [["A", "政府強制廢除家族制度"], ["B", "個人前往城市謀生求學，加上西方個人自由觀念的傳入"], ["C", "戰爭導致家族全數消失"], ["D", "科舉制度的維持"]], "ans": "B", "exp": "隨著中國知識分子接觸西方追求個人獨立自由等新觀念，加上許多人前往城市謀生、求學而暫時脫離家族，家族對個人的影響力因此逐漸動搖。"}, {"stem": "下列關於晚清社會文化變遷的敘述，何者「正確」？", "opts": [["A", "教育、報刊、服飾、婦女角色等各方面同時出現新舊並陳的現象"], ["B", "傳統與新式文化完全沒有衝突"], ["C", "社會文化變遷只發生在鄉村地區"], ["D", "婦女地位在晚清完全沒有任何改變"]], "ans": "A", "exp": "晚清社會在教育（科舉廢除、新式學堂）、傳播媒介（報刊興起）、生活風氣（服飾、娛樂）、婦女角色（興女學、廢纏足）等各層面都出現新舊並陳、逐步轉變的現象。"}, {"stem": "清末「立憲派轉而支持革命運動」這件事，說明了下列何種因果關係？", "opts": [["A", "革命運動與立憲運動完全無關"], ["B", "立憲運動的成功，鞏固了清朝統治"], ["C", "立憲運動的失敗，加速了清朝統治的滅亡"], ["D", "立憲派最後選擇支持義和團"]], "ans": "C", "exp": "清廷成立的皇族內閣讓立憲派人士大為失望，於是轉而支持革命運動，這股力量的匯聚也加速了清朝統治的滅亡，為之後辛亥革命與民國建立埋下伏筆。"}, {"stem": "綜合來看，晚清教育改革（廢科舉、興新式學堂）、報刊傳播新思潮、社會風氣變化（服飾、辮髮）、女權與放足運動等，反映了下列何種歷史趨勢？", "opts": [["A", "中國社會在西方衝擊下，逐漸從傳統走向現代化的轉型過程"], ["B", "中國社會完全拒絕接受西方事物"], ["C", "這些變化與辛亥革命的爆發毫無關聯"], ["D", "這些變化僅侷限於北京一地"]], "ans": "A", "exp": "晚清的教育改革、新式傳播媒介、城市生活風氣與婦女角色的轉變，共同反映出中國社會在西方文明衝擊下，從傳統逐步走向現代化轉型的過程，這股力量最終也匯聚為推動辛亥革命與民國建立的重要背景。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

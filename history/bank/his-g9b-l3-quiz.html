<script>
const QS=[{"stem": "西元1917年3月（俄曆2月），俄國人民推翻沙皇尼古拉二世，建立臨時政府，這場革命被稱為下列何者？", "opts": [["A", "十月革命"], ["B", "二月革命"], ["C", "光榮革命"], ["D", "法國大革命"]], "ans": "B", "exp": "1917年3月（俄曆2月）俄國人民起義推翻沙皇尼古拉二世，建立臨時政府，史稱「二月革命」，終結俄國帝制。"}, {"stem": "二月革命後成立的臨時政府，為何很快就失去民心？", "opts": [["A", "大量屠殺猶太人，引發國際抗議"], ["B", "與德國簽訂互不侵犯條約，遭指責賣國"], ["C", "提高關稅保護工商業，引發他國仿效"], ["D", "決定繼續參戰，且無力解決經濟與土地問題"]], "ans": "D", "exp": "臨時政府成立後決定繼續對同盟國作戰，卻無法解決民眾迫切的糧食、土地與經濟問題，因而失去民心，給列寧發動革命的機會。"}, {"stem": "列寧在發動十月革命時，提出下列哪一句口號，號召群眾支持？", "opts": [["A", "「自由、平等、博愛」"], ["B", "「還我河山」"], ["C", "「和平、土地、麵包」"], ["D", "「不自由，毋寧死」"]], "ans": "C", "exp": "列寧以「和平、土地、麵包」的口號爭取民心，號召群眾發動十月革命，推翻臨時政府。"}, {"stem": "西元1917年11月（俄曆10月），列寧領導的十月革命成功後，造成下列何種結果？", "opts": [["A", "推翻臨時政府，建立世界上第一個共產政權，並退出第一次世界大戰"], ["B", "推翻沙皇專制，建立君主立憲政府"], ["C", "與英、法等協約國締結同盟，繼續對同盟國作戰"], ["D", "迫使德國皇帝退位，成立威瑪共和"]], "ans": "A", "exp": "十月革命由列寧領導的布爾什維克黨（俄國共產黨）發動，推翻臨時政府，建立世界上第一個共產主義政權，隨後與德國停戰，退出第一次世界大戰。"}, {"stem": "列寧掌權後成立「共產國際」，其主要目的為何？", "opts": [["A", "協調各國解決經濟大恐慌問題"], ["B", "促進歐洲各國貿易往來，降低關稅"], ["C", "監督各國落實凡爾賽條約內容"], ["D", "支持、控制世界各地共產主義運動的發展"]], "ans": "D", "exp": "列寧成立共產國際，目的在支持並控制各地共產勢力的發展，向外輸出世界革命，使歐、亞政局出現動盪。"}, {"stem": "西元1922年，列寧將俄國改名為下列何者，簡稱「蘇聯」？", "opts": [["A", "俄羅斯帝國"], ["B", "蘇維埃社會主義共和國聯邦"], ["C", "俄羅斯聯邦共和國"], ["D", "大俄羅斯人民共和國"]], "ans": "B", "exp": "西元1922年，列寧成立「蘇維埃社會主義共和國聯邦」，簡稱「蘇聯」，是世界上第一個共產主義國家。"}, {"stem": "列寧死後，史達林掌權，其統治具有下列哪一項特色？", "opts": [["A", "開放言論自由，實施多黨政治"], ["B", "推行市場經濟，減少政府對經濟的干預"], ["C", "獨裁統治並推行計畫經濟，全力發展國防與重工業"], ["D", "與德國結盟，共同對抗西方民主國家"]], "ans": "C", "exp": "史達林透過獨裁統治穩固權力，推行「計畫經濟」，全力發展軍事國防工業，使蘇聯成為工業強國，但人民生活水準未見改善。"}, {"stem": "第一次世界大戰期間，美國經濟為何得以大幅擴張？", "opts": [["A", "供應協約國軍火與糧食物資，農工業因而擴張"], ["B", "大量開採本國石油，出口至歐洲各國"], ["C", "吸收歐洲移民，勞動力大增"], ["D", "廢除關稅，吸引各國資金投資"]], "ans": "A", "exp": "一次大戰期間，美國供給協約國軍火及糧食物資，農、工業發展大為擴張，逐漸掌握世界經濟的主導權。"}, {"stem": "下列何者是造成世界經濟大恐慌爆發的背景因素之一？", "opts": [["A", "蘇聯共產國際鼓動各國罷工"], ["B", "德國無力償還一次大戰賠款"], ["C", "日本占領中國東北，破壞國際貿易秩序"], ["D", "美國調高關稅保護工商業，各國競相仿效，造成國際貿易萎縮"]], "ans": "D", "exp": "歐洲工商業復甦後，美國農工產 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

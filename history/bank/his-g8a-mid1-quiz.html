<script>
const QS=[{"stem": "距今三千多年前，黃河下游的商人建立了商朝，考古學者依據下列哪一項出土文物，證實商朝已經進入「有文字記載」的歷史時代？", "opts": [["A", "青銅禮器"], ["B", "甲骨文"], ["C", "兵馬俑"], ["D", "竹簡"]], "ans": "B", "exp": "商朝晚期的殷墟遺址出土大量刻有占卜文字的龜甲、獸骨，即甲骨文，證明商代已進入有文字的歷史時代；青銅器雖能顯示高度工藝技術，但無法單獨證明文字的存在。"}, {"stem": "關於商朝的統治型態，下列敘述何者正確？", "opts": [["A", "商王名義上是各部落的共主，但對各地勢力的控制力有限"], ["B", "商王直接派任官員治理全國各地"], ["C", "商朝已全面推行郡縣制度"], ["D", "商朝以科舉考試選拔官員"]], "ans": "A", "exp": "商朝仍需透過分封來維繫與周遭部落的關係，商王雖是名義上的共主，但對封國內部事務的控制力有限，郡縣制與科舉都是後來才出現的制度。"}, {"stem": "周人原本居於黃河中游，趁商朝晚期國力衰微之際興起，最後採取下列何種方式取得天下共主地位？", "opts": [["A", "透過通婚與商王室結盟"], ["B", "以科舉考試選拔賢才治國"], ["C", "承襲商朝的郡縣制度"], ["D", "聯合各方勢力擊敗商人，建立周朝"]], "ans": "D", "exp": "商朝晚期國力衰微，黃河中游的周人趁勢擴張，聯合各方勢力擊敗商人，建立周朝，史稱西周。"}, {"stem": "西周建立後，統治者為了鞏固對新征服地區的控制，採取了下列哪一項制度？", "opts": [["A", "廢除諸侯，全面由中央派官治理"], ["B", "以考試選拔官員任官"], ["C", "施行封建，分封親戚與功臣為諸侯，駐守要地以拱衛王室"], ["D", "實施均田制，平均分配土地給人民"]], "ans": "C", "exp": "西周為加強對新征服地的控制，施行封建，將土地、人民分封給親戚和功臣，使他們建立封國、駐守重要地點，以保衛王室安全。"}, {"stem": "在西周封建制度下，諸侯對周天子負有哪些義務？", "opts": [["A", "需向周王進獻貢物、服從周王調兵，但對封國內部事務有較高的自主權"], ["B", "諸侯的職位須經中央考試合格才能繼承"], ["C", "諸侯完全沒有軍隊，一切軍務由周王直接指揮"], ["D", "諸侯需定期向周王繳交統一的貨幣與度量衡"]], "ans": "A", "exp": "封建制度下，諸侯雖對外必須服從周王的命令、進獻貢物、接受調兵，但在封國內部事務上仍擁有較大的自主權，這與郡縣制下地方官員完全聽命中央不同。"}, {"stem": "西周統治者利用「宗法」制度來確立貴族間的關係，其核心精神為何？", "opts": [["A", "依照官員的考試成績排定尊卑"], ["B", "透過血緣的親疏遠近，確立貴族世代相襲的尊卑地位"], ["C", "依照財富多寡分配爵位高低"], ["D", "由地方官員推舉決定貴族身分"]], "ans": "B", "exp": "宗法制度以血緣親疏作為判定貴族尊卑地位的依據，貴族諸子中擁有繼承權者為「大宗」，其餘則降級受封為「小宗」，藉此建立世代相襲的身分秩序。"}, {"stem": "西周貴族在祭祀、宴飲、喪葬等場合，必須使用符合自己身分等級的禮器與音樂，這種制度稱為什麼？", "opts": [["A", "郡縣制"], ["B", "科舉制"], ["C", "禮樂制度"], ["D", "九品官人之法"]], "ans": "C", "exp": "禮樂制度藉由制定祭祀、宴飲、喪葬等禮儀，並配合相應的音樂、器物規格（例如「周王九鼎、諸侯七鼎」），規範貴族的政治活動與生活方式，以彰顯等級差異、穩定封建秩序。"}, {"stem": "下列關於西周封建體制下貴族身分的敘述，何者正確？", "opts": [["A", "貴族身分須每年重新考核認定"], ["B", "貴族身分由地方官員任命"], ["C", "貴族只有在戰爭時期才具有特殊身分"], ["D", "貴族的身分世代相襲，其行為舉止皆受禮樂規範"]], "ans": "D", "exp": "封建制度下，貴族的身分世代相襲，且日常行為與器物使用都受到禮樂制度的規範，以確保封建秩序不被破壞。"}, {"stem": "西周末年發生了什麼事件，導致周王室被迫東遷，史稱「東周」？", "opts": [["A", "諸侯聯合舉行科舉考試，推翻周王室"], ["B", "周王因破壞宗法，導致諸侯聯合犬戎攻入首都"], ["C", "周王實施郡縣制，引起諸侯不滿而叛變"], ["D", "商朝遺民復國，攻占鎬京"]], "ans": "B", "exp": "西周末年，周王破壞宗法制度，引發諸侯不滿，諸侯遂聯合犬戎攻入首都，迫使周王室東遷，史稱東周。"}, {"stem": "下列何者是東周以來封建秩序逐漸瓦解的具體現象？", "opts": [["A", "全國改行科舉考試選才"], ["B", "中央政府廢除所有諸侯，直接派官治理"], ["C", "秦國率先推行均田制"], ["D", "諸侯間血緣關係日漸疏遠，諸侯國勢力坐大，彼此征戰不休"]], "ans": "D", "exp": "隨著周王室分封已久，諸侯與周王室的血緣關係日漸疏遠，加上王室衰微、威望下降，諸侯國勢力坐大、征戰不休，封建秩序因而逐漸瓦解。"}, {"stem": "東周以後，社會文化方面出現了什麼重要轉變，使平民也有機會接受教育？", "opts": [["A", "部分流落民間的貴族以辦學宣講謀生，帶動私人講學風氣"], ["B", "政府設立太學，強制全民入學"], ["C", "諸侯下令廢除所有私塾"], ["D", "周天子親自巡視各國講學"]], "ans": "A", "exp": "東周以後，部分貴族因封建瓦解而流落民間，以辦學宣講維生，私人講學風氣因此興盛，使原本僅貴族才能接受的教育，逐漸擴及平民。"}, {"stem": "東周時期，各國為求富國強兵、在競爭中勝出，紛紛進行改革，下列哪一項是課本提到的著名例子？", "opts": [["A", "齊國推行科舉取士"], ["B", "楚國建立九品官人之法"], ["C", "秦國任用商鞅變法，厲行法治、按軍功授爵、編列戶籍"], ["D", "燕國全面恢復封建制度"]], "ans": "C", "exp": "東周時期各國競爭激烈，秦國任用商鞅變法，厲行法治，依軍功授予爵位，並編列戶籍要求人民納稅服役，為日後秦國統一天下奠定基礎。"}, {"stem": "東周時期「社會階層流動日益頻繁」，其中一項重要原因為何？", "opts": [["A", "各國恢復嚴格的封建世襲制度"], ["B", "政府明令禁止平民接受教育"], ["C", "各國君主用人唯才，平民逐漸得以參與政治"], ["D", "各國統一施行科舉考試"]], "ans": "C", "exp": "東周以後各國君主為求富國強兵，改採用人唯才的方針，平民得以憑才能參與政治，加上私人講學普及，社會階層流動因而日益頻繁；科舉考試要到隋代以後才出現。"}, {"stem": "西元前221年，秦王嬴政統一天下後，採用了哪一個新的君主稱號？", "opts": [["A", "天子"], ["B", "皇帝，自稱「始皇帝」"], ["C", "大王"], ["D", "共主"]], "ans": "B", "exp": "秦王嬴政統一天下後，以「皇帝」作為君主的新稱號，自稱「始皇帝」，此後「皇帝」成為中國歷代最高統治者的稱號。"}, {"stem": "秦始皇統一天下後，在地方統治制度上做了哪一項重大改變？", "opts": [["A", "廢除封建，全面推行郡縣，郡縣長官由中央直接任免"], ["B", "維持封建制度不變"], ["C", "將郡縣制與封建制平均分配施行"], ["D", "交由地方貴族世襲管理"]], "ans": "A", "exp": "秦始皇不再實施封建，改為全面推行郡縣制，郡縣長官皆由中央直接任免，確立了中央集權的政治體制，這與封建下諸侯世襲、自主性較高的情形明顯不同。"}, {"stem": "秦始皇為了加強統治、促進各地經濟與文化交流，下令統一了哪些事物？", "opts": [["A", "只統一貨幣，其餘保留原制"], ["B", "只統一文字，其餘保留原制"], ["C", "只統一度量衡"], ["D", "文字、貨幣、車軌、度量衡等"]], "ans": "D", "exp": "秦始皇下令統一文字、貨幣、車軌、度量衡等，消除各地因長期分裂造成的制度差異，有助於各地經濟與文化的交流整合。"}, {"stem": "下列哪一組原因，是秦朝在統一天下後迅速滅亡的主要原因？", "opts": [["A", "廢除封建、改行郡縣"], ["B", "統一文字與度量衡"], ["C", "實施察舉制度用人不當"], ["D", "統治嚴苛、刑罰殘酷，且大興土木、勞民傷財，大失民心"]], "ans": "D", "exp": "秦始皇雖以中央集權強化統治，但因焚書坑儒控制思想、施政嚴苛、刑罰殘酷，加上修築長城、馳道等工程勞民傷財，終致人 窟"]], "ans": "A", "exp": "白馬寺相傳因西域僧侶以白馬馱經來到中國宣揚佛法，皇帝下令修建而成，是佛教進入中國初期的傳播中心。"}, {"stem": "佛教石窟藝術（如敦煌石窟、龍門石窟）中同時出現佛像與伏羲、女媧等中國傳統神話人物，此現象最能說明什麼？", "opts": [["A", "佛教教義與中國神話完全相同"], ["B", "中國本土宗教已被佛教完全取代"], ["C", "佛教在傳入中國後逐漸與本土文化融合、走向中國化"], ["D", "石窟工匠皆來自印度，不了解中國文化"]], "ans": "C", "exp": "敦煌石窟中除了佛像外，也有伏羲、女媧等中國傳統神話諸神，可佐證佛教逐漸中國化的過程。"}, {"stem": "唐代長安城內流傳著多種來自西方的宗教，下列何者不屬於課本所提及的外來宗教？", "opts": [["A", "景教"], ["B", "猶太教"], ["C", "摩尼教"], ["D", "伊斯蘭教"]], "ans": "B", "exp": "課本提到唐代長安城流傳的外來宗教包括佛教、伊斯蘭教，以及三夷教（祆教、景教、摩尼教），並未提及猶太教。"}, {"stem": "隋唐時期，東亞哪些地區與中國交往密切，逐漸形成所謂的「東亞文化圈」？", "opts": [["A", "朝鮮、日本等地"], ["B", "印度、大食等地"], ["C", "歐洲、非洲等地"], ["D", "中亞、西亞等地"]], "ans": "A", "exp": "隋唐盛世時期，東亞地區的朝鮮、日本等地與中國交往密切，廣受中國文化影響，逐漸形成「東亞文化圈」。"}, {"stem": "「東亞文化圈」中，各地共同具備的文化要素不包括下列何者？", "opts": [["A", "漢字"], ["B", "儒學"], ["C", "佛教信仰"], ["D", "伊斯蘭教教義"]], "ans": "D", "exp": "課本指出中國的漢字、儒學、典章制度、佛教信仰成為東亞許多地區的共通要素，伊斯蘭教則非東亞文化圈的共同要素。"}, {"stem": "七世紀中葉，日本推動以唐代律令、制度為藍本的政治改革運動，史稱什麼？", "opts": [["A", "明治維新"], ["B", "應仁之亂"], ["C", "大化革新"], ["D", "遣唐使制度"]], "ans": "C", "exp": "七世紀中葉，日本推動的「大化革新」，即是以唐代的律令、制度為藍本的「唐化運動」。"}, {"stem": "日本文字創作深受漢字影響，下列敘述何者正確？", "opts": [["A", "片假名摹仿漢字草書而成，平假名採漢字楷書偏旁簡化而成"], ["B", "片假名採漢字楷書偏旁簡化而成，平假名摹仿漢字草書而成"], ["C", "片假名與平假名皆與漢字毫無關聯"], ["D", "片假名與平假名皆直接照抄漢字原形、不作簡化"]], "ans": "B", "exp": "課本提到日文的片假名採取漢字楷書偏旁簡化而成，平假名則是摹仿漢字草書所作。"}, {"stem": "隋唐時期，朝鮮半島上哪一國最仰慕中國文化，因而有「君子國」之稱？", "opts": [["A", "高句麗"], ["B", "百濟"], ["C", "加羅"], ["D", "新羅"]], "ans": "D", "exp": "隋唐時期朝鮮半島各國以新羅最仰慕中國文化，仿效唐的衣冠、曆法、律令、漢字等，文風興盛，號稱「君子國」。"}, {"stem": "新羅仿效唐朝文化的具體作為，不包括下列何者？", "opts": [["A", "建立獨立的文字系統以取代漢字"], ["B", "學習中國的儒學與佛教"], ["C", "仿效唐朝的衣冠、曆法"], ["D", "仿效唐朝的律令、漢字"]], "ans": "A", "exp": "課本提到新羅是仿效唐朝的衣冠、曆法、律令、漢字等，直接沿用漢字，並未如日本般另創文字系統。"}, {"stem": "唐太宗時，將文成公主嫁至吐蕃和親，此舉為漢藏之間帶來何種影響？", "opts": [["A", "導致漢藏爆發長期戰爭"], ["B", "使吐蕃放棄原有宗教信仰"], ["C", "文成公主攜帶穀物種子、工藝品、藥材、書籍等，加強漢藏經濟文化交流"], ["D", "使吐蕃成為唐朝的直轄行政區"]], "ans": "C", "exp": "吐蕃國勢大盛時曾遣使向唐朝求婚，太宗以文成公主和親，文成公主攜帶穀物種子、工藝品、藥材、茶葉及書籍到吐蕃，加強了漢藏之間的經濟文化交流。"}, {"stem": "依課本所述，唐代造紙術是透過下列哪一事件而傳播至西方？", "opts": [["A", "文成公主入藏"], ["B", "怛羅斯之役"], ["C", "永嘉之禍"], ["D", "大化革新"]], "ans": "B", "exp": "課本提到造紙術因怛羅斯之役而西傳，使造紙技術傳入中亞與西方世界。"}, {"stem": "新羅留學生崔致遠的事蹟，最能反映下列何種歷史現象？", "opts": [["A", "唐代吸引許多外國留學生前來學習，並可透過考試在中國任官"], ["B", "新羅拒絕與唐朝往來"], ["C", "唐代嚴格禁止外國人參加科舉考試"], ["D", "崔致遠終身未曾返回新羅"]], "ans": "A", "exp": "崔致遠年僅12歲即到中國留學，在長安學習儒家經典，通過考試後於中國任官，反映唐代開放外國留學生求學、任官的風氣。"}, {"stem": "綜合商周至隋唐的歷史發展，下列敘述何者最符合課本的主旨？", "opts": [["A", "中國自古以來與周邊民族毫無互動，文化發展獨立封閉"], ["B", "民族之間的接觸只帶來衝突，未曾促成文化交流"], ["C", "絲路僅止於軍事用途，與貿易及文化交流無關"], ["D", "商周至隋唐期間，民族間的互動與交流帶動了政治、經濟、文化的發展與融合"]], "ans": "D", "exp": "從商周的長城分界、張騫通西域，到魏晉南北朝的胡漢融合，再到隋唐兼容並蓄的國際文化，民族互動始終帶動著中國政治、經濟、文化的發展與融合。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

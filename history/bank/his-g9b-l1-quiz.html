<script>
const QS=[{"stem": "17世紀時，大批歐洲移民陸續前往北美洲建立殖民地，其中在北美洲東岸建立13州殖民地的主要是哪一國的移民？", "opts": [["A", "西班牙"], ["B", "英國"], ["C", "法國"], ["D", "荷蘭"]], "ans": "B", "exp": "17世紀時大批英國移民前往北美洲東岸，建立13州殖民地，成為日後美國獨立革命的基礎。"}, {"stem": "18世紀中期，英國向北美殖民地開徵新稅，主要原因為何？", "opts": [["A", "鼓勵殖民地發展工業"], ["B", "響應啟蒙思想的分權主張"], ["C", "報復殖民地走私茶葉"], ["D", "彌補對外戰爭造成的財政負擔"]], "ans": "D", "exp": "英、法兩國在北美洲爆發戰爭，英國因作戰導致財政惡化，故向北美13州殖民地開徵新稅，引發殖民地人民不滿。"}, {"stem": "北美殖民地人民反對英國開徵新稅，主要的理由是什麼？", "opts": [["A", "認為國會中沒有殖民地代表，政府無權任意徵稅"], ["B", "認為稅率過高導致糧食短缺"], ["C", "主張君主立憲，廢除國王"], ["D", "要求由國際組織仲裁"]], "ans": "A", "exp": "殖民地人民認為自己在英國國會中沒有代表，政府不應強行徵稅，這正是「無代表，不納稅」精神的展現。"}, {"stem": "1773年，北美殖民地人民將英國商船運至波士頓港的茶葉倒入海中以示抗議，這起事件史稱什麼？", "opts": [["A", "大陸會議"], ["B", "獨立宣言事件"], ["C", "波士頓茶葉事件"], ["D", "五月花公約事件"]], "ans": "C", "exp": "此即著名的「波士頓茶葉事件」，是北美殖民地人民公開反抗英國統治的重要開端，使雙方衝突日漸激烈。"}, {"stem": "1774年起，北美各殖民地代表在哪個城市召開會議，決定對英國採取行動？", "opts": [["A", "紐約"], ["B", "費城"], ["C", "波士頓"], ["D", "華盛頓特區"]], "ans": "B", "exp": "各殖民地代表在費城召開「大陸會議」，之後也在此地發表獨立宣言。"}, {"stem": "美國「獨立宣言」發表的確切時間是？", "opts": [["A", "1776年7月4日"], ["B", "1783年9月3日"], ["C", "1789年7月14日"], ["D", "1804年12月2日"]], "ans": "A", "exp": "1776年7月4日，北美13州代表在費城發表獨立宣言，宣布脫離英國統治，這一天後來成為美國國慶日。"}, {"stem": "美國獨立宣言的內容深受哪一思想影響，強調天賦人權與社會契約論？", "opts": [["A", "民族主義"], ["B", "帝國主義"], ["C", "社會主義"], ["D", "啟蒙運動思想"]], "ans": "D", "exp": "獨立宣言吸收啟蒙運動時期重要的政治學說，如天賦人權與社會契約論，強調政府若破壞人權，人民有權將其推翻。"}, {"stem": "領導北美殖民地軍隊對抗英軍，日後被尊稱為「美國國父」的人物是？", "opts": [["A", "富蘭克林"], ["B", "傑弗遜"], ["C", "華盛頓"], ["D", "林肯"]], "ans": "C", "exp": "華盛頓領導殖民地軍隊與英軍作戰，最終獲勝，並於獨立後當選美國首任總統，被稱為美國國父。"}, {"stem": "北美殖民地軍隊在法國、西班牙等國援助下贏得獨立戰爭勝利，英國最終於西元哪一年承認美國獨立？", "opts": [["A", "1783年"], ["B", "1776年"], ["C", "1789年"], ["D", "1804年"]], "ans": "A", "exp": "殖民地軍隊在法國、西班牙等國協助下逐漸扭轉戰局，英國最終於1783年承認美利堅合眾國獨立。"}, {"stem": "美國獨立建國後所制定的憲法，在世界史上具有什麼重要地位？", "opts": [["A", "是世界第一部君主立憲法"], ["B", "是世界第一部成文憲法"], ["C", "是世界第一部保障貴族特權的憲法"], ["D", "是世界第一部廢除私有財產的憲法"]], "ans": "B", "exp": "美國獨立後制定出世界上第一部成文憲法，確立民主政體，對後世民主政治發展影響深遠。"}, {"stem": "美國憲法採用了下列哪位思想家的學說，將政府分為行政、立法、司法三權，彼此制衡？", "opts": [["A", "盧梭"], ["B", "伏爾泰"], ["C", "孟德斯鳩"], ["D", "洛克"]], "ans": "C", "exp": "美國憲法採取孟德斯鳩的三權分立學說，成為後來許多民主共和國仿效的憲政典範。"}, {"stem": "依據美國憲法所建立的中央與地方關係，下列敘述何者正確？", "opts": [["A", "完全廢除各州政府，權力集中於中央"], ["B", "由英王繼續擁有最終裁決權"], ["C", "各州各自獨立，彼此互不隸屬，也無中央政府"], ["D", "成立聯邦政府，各州仍保有司法、財政、教育等權力"]], "ans": "D", "exp": "美國建立聯邦政府，中央統籌全國性事務，同時授予各州司法、財政、教育等權力，落實啟蒙思想中的分權概念。"}, {"stem": "法國大革命爆發前，法國社會主要分為哪三個階級？", "opts": [["A", "教士、貴族、平民"], ["B", "國王、貴族、軍人"], ["C", "資產階級、無產階級、農民"], ["D", "王室、議會、法院"]], "ans": "A", "exp": "中世紀以來，法國社會分為教士、貴族、平民三個階級，教士與貴族人數雖少，卻擁有最多的財富與特權。"}, {"stem": "法王路易十六為解決財政困難，於1789年召開什麼會議，卻意外引發後續革命？", "opts": [["A", "國民會議"], ["B", "三級會議"], ["C", "維也納會議"], ["D", "制憲會議"]], "ans": "B", "exp": "路易十六為徵收新稅而召開三級會議，卻因表決方式引發平民代表不滿，成為法國大革命的導火線。"}, {"stem": "三級會議的表決方式為何會讓平民代表感到不滿？", "opts": [["A", "平民完全沒有投票權"], ["B", "貴族與教士需繳交比平民更高的稅"], ["C", "會議僅開放貴族參加，平民不得列席"], ["D", "採一階級一票，教士與貴族常聯合起來，使平民居於劣勢"]], "ans": "D", "exp": "三級會議依傳統一個階級各有一票，教士與貴族利益相近、常聯合投票，使人數最多的平民代表在表決上居於不利地位。"}, {"stem": "法國大革命的序幕，是1789年7月14日巴黎民眾攻陷了下列哪一座建築？", "opts": [["A", "凡爾賽宮"], ["B", "羅浮宮"], ["C", "巴士底監獄"], ["D", "聖母院"]], "ans": "C", "exp": "1789年7月14日，巴黎群眾攻陷巴士底監獄，揭開法國大革命的序幕，這一天後來訂為法國國慶日。"}, {"stem": "法國大革命期間，接掌政權的國民會議發表了哪一份重要文獻，主張主權在民、保障人民權利？", "opts": [["A", "人權宣言"], ["B", "獨立宣言"], ["C", "拿破崙法典"], ["D", "大憲章"]], "ans": "A", "exp": "國民會議接掌政權後通過人權宣言，主張主權在民、天賦人權不可剝奪，並要求廢除貴族與教會的特權。"}, {"stem": "法國大革命爆發後，部分歐洲國家的君主組成反法聯軍進攻法國，其主要原因為何？", "opts": [["A", "法國拒絕償還外債"], ["B", "擔憂法國大革命的思潮蔓延至本國"], ["C", "法國入侵鄰國領土"], ["D", "法國宣布退出維也納會議"]], "ans": "B", "exp": "歐洲各國君主擔心法國大革命所主張的自由平等思想蔓延到自己國家，因此組成反法聯軍進攻法國。"}, {"stem": "法國大革命期間，大肆處決異己、造成局勢動盪不安的「恐怖統治」，主要與下列何人有關？", "opts": [["A", "拿破崙"], ["B", "路易十六"], ["C", "羅伯斯比"], ["D", "梅特涅"]], "ans": "C", "exp": "羅伯斯比掌權後大肆處決反對者，實施恐怖統治，最終反對者發動政變，將其處死，結束了這段動盪時期。"}, {"stem": "法國將領拿破崙能夠崛起掌權，主要是因為下列哪一項功績？", "opts": [["A", "起草法國人權宣言"], ["B", "領導波士頓茶葉事件"], ["C", "主導召開維也納會議"], ["D", "多次擊敗反法聯軍，被視為革命英雄"]], "ans": "D", "exp": "拿破崙多次擊敗反法聯軍，因而受到人民支持，逐漸掌握政治大權，並於1804年稱帝，建立法蘭西帝國。"}, {"stem": "拿破崙於西元哪一年稱帝，建立法蘭西帝國？", "opts": [["A", "1804年"], ["B", "1789年"], ["C", "1799年"], ["D", "1815年"]], "ans": "A", "exp": "拿破崙利用人民的支持，於1804年稱帝，建立法蘭西帝國，展開對歐洲大部分地區的征服行動。"}, {"stem": "拿破崙對內頒布的法典，對後世法律制度影響深遠，此法典稱為？", "opts": [["A", "人權法典"], ["B", "維也納法典"], ["C", "拿破崙法典"], ["D", "共和法典"]], "ans": "C", "exp": "拿破崙對內頒布拿破崙法典，賦予人民法律上的平等與信仰自由，體現法國大革命「自由、平等、博愛」的精神。"}, {"stem": "拿破崙征服歐洲多國、推行法典的過程，對被占領地人民帶來什麼樣的影響？", "opts": [["A", "使各地完全放棄自身文化"], ["B", "激發被占領地人民的民族意識"], ["C", "讓各地恢復君主專制"], ["D", "使各地退出工業革命"]], "ans": "B", "exp": "拿破崙的占領行動，加上推行法典帶來法律上的平等，激發了當地人民的民族意識，影響19世紀歐洲的建國運動。"}, {"stem": "拿破崙在西元1812年遠征哪一個國家失敗，導致其勢力由盛轉衰？", "opts": [["A", "英國"], ["B", "西班牙"], ["C", "普魯士"], ["D", "俄國"]], "ans": "D", "exp": "1812年，拿破崙率軍征俄失敗，元氣大傷，反法聯軍趁機圍攻法國，迫使他於1814年退位。"}, {"stem": "拿破崙最終在哪一場戰役中戰敗，結束了拿破崙時代？", "opts": [["A", "滑鐵盧之役"], ["B", "波士頓戰役"], ["C", "凡爾賽戰役"], ["D", "萊比錫和談"]], "ans": "A", "exp": "拿破崙於1814年退位後試圖東山再起，卻在1815年的滑鐵盧之役中戰敗，拿破崙時代自此終結。"}, {"stem": "拿破崙失敗後，歐洲各國召開會議重整政治秩序，這場會議是由哪一國主導？", "opts": [["A", "英國"], ["B", "普魯士"], ["C", "奧國"], ["D", "俄國"]], "ans": "C", "exp": "拿破崙失敗後，由奧國首相梅特涅主導召開維也納會議，重整拿破崙戰爭後的歐洲政治秩序。"}, {"stem": "維也納會議所依據的原則與作法，下列敘述何者正確？", "opts": [["A", "主張民族自決，讓各民族自行建國"], ["B", "依「正統原則」恢復各國原有王室的統治權，並維持各國勢力均衡"], ["C", "廢除所有歐洲王室，全面改行共和"], ["D", "支持法國繼續擴張領土"]], "ans": "B", "exp": "維也納會議代表多為保守人士，主張以「正統原則」恢復各國原有王室的統治權，並維持各國勢力均衡，以求歐洲的安定。"}, {"stem": "15世紀末以來，大量歐洲人前往中南美洲墾殖，此後拉丁美洲大部分地區淪為哪兩國的殖民地？", "opts": [["A", "英國與法國"], ["B", "荷蘭與比利時"], ["C", "英國與荷蘭"], ["D", "西班牙與葡萄牙"]], "ans": "D", "exp": "15世紀末起，大量歐洲人前往中南美洲墾殖與傳教，葡萄牙人殖民巴西，其他多數地區則由西班牙人占領。"}, {"stem": "拉丁美洲獨立運動中，領導階層多為「土生白人」，其處境的敘述何者正確？", "opts": [["A", "經濟上較其他階級具有優勢，但政治地位仍不如來自歐洲本土的白人"], ["B", "完全沒有受教育的機會"], ["C", "在政治與經濟上皆與歐洲本土白人平等"], ["D", "是拉丁美洲人口中比例最高的族群"]], "ans": "A", "exp": "土生白人（歐洲人在美洲出生的後裔）在殖民地經濟上占有優勢，也因此較有機會接受啟蒙思想的教育，但政治地位卻不如歐洲本土白人，因而心生不滿。"}, {"stem": "拉丁美洲獨立運動中，領導西屬拉丁美洲人民反抗殖民統治、建立多個新興國家的重要人物是？", "opts": [["A", "馬志尼"], ["B", "門羅"], ["C", "玻利瓦"], ["D", "俾斯麥"]], "ans": "C", "exp": "玻利瓦等土生白人趁拿破崙占領伊比利半島之機，領導西屬 ，取得統一主導地位，後於1870年與法國爆發德法戰爭，隔年戰勝法國，完成統一大業。"}, {"stem": "德意志帝國於西元哪一年正式成立，並由何人出任皇帝？", "opts": [["A", "1871年，普魯士國王威廉一世"], ["B", "1789年，路易十六"], ["C", "1815年，梅特涅"], ["D", "1804年，拿破崙"]], "ans": "A", "exp": "1871年，普魯士戰勝法國後，各邦同意建立德意志帝國，皇帝由普魯士國王威廉一世出任。"}, {"stem": "德意志帝國宣布成立、威廉一世登基的地點，是在下列何處？", "opts": [["A", "柏林皇宮"], ["B", "維也納皇宮"], ["C", "法國凡爾賽宮"], ["D", "倫敦西敏寺"]], "ans": "C", "exp": "1871年，德意志帝國在法國巴黎的凡爾賽宮宣布成立，此舉也深深傷害了法國人的自尊，埋下日後兩國的仇恨。"}, {"stem": "中世紀以來，義大利半島邦國林立，其中唯一維持獨立、未受奧國或法國勢力干預的邦國是？", "opts": [["A", "教宗國"], ["B", "薩丁尼亞（王國）"], ["C", "那不勒斯王國"], ["D", "威尼斯共和國"]], "ans": "B", "exp": "義大利半島上諸邦國中，除薩丁尼亞王國維持獨立外，其他邦國多受到奧國或法國勢力的干預，日後義大利建國即以薩丁尼亞為核心。"}, {"stem": "西元1831年成立「青年義大利黨」，以「恢復古羅馬光榮」為號召，鼓吹建立自由民主共和國的人物是？", "opts": [["A", "加富爾"], ["B", "加里波底"], ["C", "俾斯麥"], ["D", "馬志尼"]], "ans": "D", "exp": "馬志尼於1831年成立愛國革命團體「青年義大利黨」，以「恢復古羅馬光榮」為號召，喚起群眾的民族意識。"}, {"stem": "擔任薩丁尼亞王國首相，善用外交手段拉攏法國、以驅逐奧國在義大利勢力的人物是？", "opts": [["A", "加富爾"], ["B", "馬志尼"], ["C", "加里波底"], ["D", "梅特涅"]], "ans": "A", "exp": "加富爾擔任薩丁尼亞王國首相，巧妙利用外交手段拉攏法國，成功驅逐奧國在義大利半島的勢力。"}, {"stem": "率領「紅衫軍」以武力征服義大利半島南部，並將征服之地獻給薩丁尼亞國王的人物是？", "opts": [["A", "馬志尼"], ["B", "俾斯麥"], ["C", "加里波底"], ["D", "拿破崙"]], "ans": "C", "exp": "加里波底率領千名紅衫軍南征，獲得民眾支持，迅速征服義大利半島南部，並將這些地區獻給薩丁尼亞國王。"}, {"stem": "西元1861年，義大利王國正式建立，是以下列哪一個邦國為核心？", "opts": [["A", "教宗國"], ["B", "薩丁尼亞王國"], ["C", "日耳曼邦聯"], ["D", "那不勒斯王國"]], "ans": "B", "exp": "1861年，以薩丁尼亞王國為核心，建立義大利王國，此後義大利統一大業僅剩教宗國所在的羅馬尚未收復。"}, {"stem": "義大利完成統一大業的關鍵一步，是趁著哪一場戰爭爆發、法軍撤離羅馬之機而完成的？", "opts": [["A", "普奧戰爭"], ["B", "美國獨立戰爭"], ["C", "拿破崙征俄之役"], ["D", "德法戰爭（普法戰爭）"]], "ans": "D", "exp": "1870年德法戰爭爆發，法國撤兵羅馬，義大利趁勢取回羅馬，定為首都，完成統一。"}, {"stem": "19世紀德意志與義大利分別完成建國、統一大業，這股驅動兩地邦國走向統一的政治思潮稱為？", "opts": [["A", "民族主義"], ["B", "帝國主義"], ["C", "社會主義"], ["D", "啟蒙運動"]], "ans": "A", "exp": "19世紀民族主義思潮盛行，主張同一民族應建立一個國家，驅動德意志與義大利各自走向統一建國。"}, {"stem": "綜合來看，德意志與義大利建國過程的共同點，下列敘述何者正確？", "opts": [["A", "都是由單一君主以和平協商方式完成統一"], ["B", "都未曾受到民族主義思潮的影響"], ["C", "兩地在統一前皆長期邦國林立分裂，最終在民族主義驅動下，透過武力或外交手段完成統一建國"], ["D", "兩地的統一運動皆由法國主導促成"]], "ans": "C", "exp": "德意志與義大利在統一之前，都長期處於邦國林立、分裂的狀態，19世紀在民族主義思潮的驅動下，分別透過俾斯麥的鐵血政策與加富爾、加里波底的外交／武力手段，完成統一建國大業。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

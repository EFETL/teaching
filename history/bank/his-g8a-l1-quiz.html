<script>
const QS=[{"stem": "距今三千多年前，黃河下游的商人建立了商朝，考古學者依據下列哪一項出土文物，證實商朝已經進入「有文字記載」的歷史時代？", "opts": [["A", "青銅禮器"], ["B", "甲骨文"], ["C", "兵馬俑"], ["D", "竹簡"]], "ans": "B", "exp": "商朝晚期的殷墟遺址出土大量刻有占卜文字的龜甲、獸骨，即甲骨文，證明商代已進入有文字的歷史時代；青銅器雖能顯示高度工藝技術，但無法單獨證明文字的存在。"}, {"stem": "關於商朝的統治型態，下列敘述何者正確？", "opts": [["A", "商王名義上是各部落的共主，但對各地勢力的控制力有限"], ["B", "商王直接派任官員治理全國各地"], ["C", "商朝已全面推行郡縣制度"], ["D", "商朝以科舉考試選拔官員"]], "ans": "A", "exp": "商朝仍需透過分封來維繫與周遭部落的關係，商王雖是名義上的共主，但對封國內部事務的控制力有限，郡縣制與科舉都是後來才出現的制度。"}, {"stem": "周人原本居於黃河中游，趁商朝晚期國力衰微之際興起，最後採取下列何種方式取得天下共主地位？", "opts": [["A", "透過通婚與商王室結盟"], ["B", "以科舉考試選拔賢才治國"], ["C", "承襲商朝的郡縣制度"], ["D", "聯合各方勢力擊敗商人，建立周朝"]], "ans": "D", "exp": "商朝晚期國力衰微，黃河中游的周人趁勢擴張，聯合各方勢力擊敗商人，建立周朝，史稱西周。"}, {"stem": "西周建立後，統治者為了鞏固對新征服地區的控制，採取了下列哪一項制度？", "opts": [["A", "廢除諸侯，全面由中央派官治理"], ["B", "以考試選拔官員任官"], ["C", "施行封建，分封親戚與功臣為諸侯，駐守要地以拱衛王室"], ["D", "實施均田制，平均分配土地給人民"]], "ans": "C", "exp": "西周為加強對新征服地的控制，施行封建，將土地、人民分封給親戚和功臣，使他們建立封國、駐守重要地點，以保衛王室安全。"}, {"stem": "在西周封建制度下，諸侯對周天子負有哪些義務？", "opts": [["A", "需向周王進獻貢物、服從周王調兵，但對封國內部事務有較高的自主權"], ["B", "諸侯的職位須經中央考試合格才能繼承"], ["C", "諸侯完全沒有軍隊，一切軍務由周王直接指揮"], ["D", "諸侯需定期向周王繳交統一的貨幣與度量衡"]], "ans": "A", "exp": "封建制度下，諸侯雖對外必須服從周王的命令、進獻貢物、接受調兵，但在封國內部事務上仍擁有較大的自主權，這與郡縣制下地方官員完全聽命中央不同。"}, {"stem": "西周統治者利用「宗法」制度來確立貴族間的關係，其核心精神為何？", "opts": [["A", "依照官員的考試成績排定尊卑"], ["B", "透過血緣的親疏遠近，確立貴族世代相襲的尊卑地位"], ["C", "依照財富多寡分配爵位高低"], ["D", "由地方官員推舉決定貴族身分"]], "ans": "B", "exp": "宗法制度以血緣親疏作為判定貴族尊卑地位的依據，貴族諸子中擁有繼承權者為「大宗」，其餘則降級受封為「小宗」，藉此建立世代相襲的身分秩序。"}, {"stem": "西周貴族在祭祀、宴飲、喪葬等場合，必須使用符合自己身分等級的禮器與音樂，這種制度稱為什麼？", "opts": [["A", "郡縣制"], ["B", "科舉制"], ["C", "禮樂制度"], ["D", "九品官人之法"]], "ans": "C", "exp": "禮樂制度藉由制定祭祀、宴飲、喪葬等禮儀，並配合相應的音樂、器物規格（例如「周王九鼎、諸侯七鼎」），規範貴族的政治活動與生活方式，以彰顯等級差異、穩定封建秩序。"}, {"stem": "下列關於西周封建體制下貴族身分的敘述，何者正確？", "opts": [["A", "貴族身分須每年重新考核認定"], ["B", "貴族身分由地方官員任命"], ["C", "貴族只有在戰爭時期才具有特殊身分"], ["D", "貴族的身分世代相襲，其行為舉止皆受禮樂規範"]], "ans": "D", "exp": "封建制度下，貴族的身分世代相襲，且日常行為與器物使用都受到禮樂制度的規範，以確保封建秩序不被破壞。"}, {"stem": "西周末年發生了什麼事件，導致周王室被迫東遷，史稱「東周」？", "opts": [["A", "諸侯聯合舉行科舉考試，推翻周王室"], [ 到世族的輕視，反映魏晉南北朝門第社會對寒門人士的排斥。"}, {"stem": "世族王源將女兒許配給寒門人家，結果招致官員彈劾，這個故事反映出魏晉南北朝世族社會的什麼特質？", "opts": [["A", "世族完全不在意子女的婚姻對象"], ["B", "世族間的通婚受政府強制安排"], ["C", "世族十分重視門第，與寒門通婚會被視為有損世族清譽而遭批評"], ["D", "當時寒門與世族的社會地位並無差異"]], "ans": "C", "exp": "王源將女兒嫁入寒門，被官員彈劾抨擊他唯利是圖、玷汙世族清譽，可見魏晉南北朝時世族極為重視門第，與寒門通婚會被視為降低身分、有損家族聲望之事。"}, {"stem": "北方顯赫世族之女崔徽華因一目失明，親人原打算將她嫁入寒門，但她的姑母卻堅持讓自己的兒子迎娶她。這個故事主要顯示了什麼觀念？", "opts": [["A", "世族即使面對子女條件不理想，仍堅持不願下嫁寒門，重視門第勝於一切"], ["B", "世族之間毫無門第觀念"], ["C", "崔徽華家族當時已經沒落為寒門"], ["D", "政府強制世族之間必須通婚"]], "ans": "A", "exp": "崔徽華的姑母認為，即使徽華條件不如意，也絕不能委屈她嫁入寒微家族，寧可讓自己的兒子娶她，正反映魏晉南北朝世族「寧缺勿濫」、堅持門第優先於個人條件的婚姻觀念。"}, {"stem": "出身高門大族的周浚，因見李家女兒絡秀持家有方而欲納她為妾，絡秀家人原本不肯，絡秀卻主張答應這門婚事，其考量與下列何者最相關？", "opts": [["A", "絡秀家中並不富裕，需要周家的錢財接濟"], ["B", "絡秀本人並不喜歡務農生活"], ["C", "藉由這門婚姻提高自己家族的門第聲望"], ["D", "周浚承諾會廢除九品官人之法"]], "ans": "C", "exp": "絡秀認為自家門第低下，願意下嫁為妾，正是希望藉此提高家族的聲望地位，日後也要求兒子們持續與李家親戚保持往來，反映魏晉南北朝時期，透過婚姻攀附高門以提升家族社會地位的現象。"}, {"stem": "綜觀商周至隋唐的政治發展，中國的地方統治型態經歷了怎樣的轉變過程？", "opts": [["A", "由封建逐漸過渡到郡縣制，中央集權程度隨之提高"], ["B", "由郡縣制逐漸過渡到封建制"], ["C", "始終維持封建制度不變"], ["D", "始終維持郡縣制度不變"]], "ans": "A", "exp": "自國家形成之後，中國政治型態由商周的封建，逐漸過渡到秦漢以後的郡縣制，中央對地方的控制力隨之增強，形成中央集權的統治基礎。"}, {"stem": "依照課本內容，中國歷代選才制度出現的先後順序，下列排列何者正確？", "opts": [["A", "科舉→九品官人之法→察舉"], ["B", "察舉、太學→九品官人之法→科舉"], ["C", "九品官人之法→察舉、太學→科舉"], ["D", "科舉→察舉、太學→九品官人之法"]], "ans": "B", "exp": "中國選才制度的演變依序為：漢代的察舉、太學，到魏晉南北朝的九品官人之法，再到隋唐以後的科舉制度，選才標準也逐漸由重視家世轉向重視考試成績。"}, {"stem": "漢代以後的統治者之所以推崇儒家思想、重用熟習經學的人才，主要是因為儒家思想具有下列哪一項作用？", "opts": [["A", "有利於發展商業貿易"], ["B", "有利於加強對外征戰的軍事力量"], ["C", "有利於統一全國的文字與貨幣"], ["D", "強調忠君、守禮，有助於維持政治社會秩序、鞏固統治"]], "ans": "D", "exp": "儒家以孔子的「仁」（德行）、「禮」（秩序）為核心主張，其忠君、守禮等思想有助於維持政治社會秩序，因此受到後世君主推崇，並藉此作為維繫統治的重要基礎。"}, {"stem": "比較「貴族」與「世族」兩者身分的形成方式，下列敘述何者正確？", "opts": [["A", "貴族與世族的形成方式完全相同"], ["B", "貴族因通過科舉考試而產生，世族因血緣封建而產生"], ["C", "貴族與世族皆由中央考試機關認定"], ["D", "貴族是周代封建社會中以血統世襲身分的統治階級；世族則是漢代以後透過選才制度、世代當官而興盛的家族"]], "ans": "D", "exp": "貴族是周代封建社會下，以血緣世襲身分的統治階級，其地位源於封建與宗法制度；世族則是漢代以後，因察舉、經學傳家等選才制度，經數代累積官位與聲望而形成的政治社會勢力，兩者形成的時代背景與方式並不相同。"}, {"stem": "總結商周至隋唐的國家與社會發展，下列敘述何者最能貼切描述這段歷史的整體趨勢？", "opts": [["A", "政治上由封建走向中央集權，但選才制度逐漸僵化、日益重視門第"], ["B", "政治上由封建走向郡縣、中央集權，選才制度也逐漸由重視門第世襲，轉變為以考試選拔人才"], ["C", "政治與選才制度自商朝以來始終沒有改變"], ["D", "政治上維持封建，僅選才制度改為科舉"]], "ans": "B", "exp": "綜觀商周至隋唐，中國政治體制由封建逐漸過渡到郡縣、中央集權；選才制度也由察舉、九品官人之法等重視家世背景的方式，逐漸演變為隋唐以後以考試成績決定任官資格的科舉制度，兩條脈絡共同反映了統治者鞏固政權、擴大統治基礎的歷史趨勢。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

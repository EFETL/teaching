<script>
const QS=[{"stem": "唐朝滅亡後，北方草原上哪些民族先後崛起，對漢人政權形成威脅？", "opts": [["A", "匈奴、突厥、女真"], ["B", "契丹、女真、蒙古"], ["C", "吐蕃、南詔、契丹"], ["D", "鮮卑、柔然、突厥"]], "ans": "B", "exp": "課本指出，唐末以來契丹、女真、蒙古等草原民族相繼崛起，使東亞地區的民族互動更為頻繁。"}, {"stem": "契丹人趁唐朝滅亡後的混亂局勢崛起，建立的政權國號為何？", "opts": [["A", "遼（大遼）"], ["B", "金"], ["C", "西夏"], ["D", "元"]], "ans": "A", "exp": "契丹族在唐末崛起，建國號「大遼」，成為當時北方的強權。"}, {"stem": "契丹人建國後，向南取得哪一個具有農業與軍事雙重價值的戰略要地，使長城失去防禦功能？", "opts": [["A", "河西走廊"], ["B", "江南地區"], ["C", "遼東半島"], ["D", "燕雲十六州"]], "ans": "D", "exp": "遼取得燕雲十六州後，勢力伸入長城以南，長城因此失去原有的防禦作用。"}, {"stem": "遼國勢力強盛時，下列哪些政權曾向遼稱臣？", "opts": [["A", "南宋、西夏"], ["B", "金、南宋"], ["C", "西夏、女真"], ["D", "大理、吐蕃"]], "ans": "C", "exp": "遼國一度成為北方強權，西北的西夏、東北的女真皆曾向其稱臣。"}, {"stem": "五代十國的紛亂局面結束後，統一中原、建立宋朝的人物是誰？", "opts": [["A", "朱元璋"], ["B", "趙匡胤"], ["C", "忽必烈"], ["D", "鐵木真"]], "ans": "B", "exp": "趙匡胤建立宋朝，是為宋太祖，史稱北宋。"}, {"stem": "北宋建國後，為避免重演唐末以來武將割據的亂象，採取了什麼樣的治國方針？", "opts": [["A", "推行郡縣制、削弱貴族"], ["B", "廣建驛站、鼓勵貿易"], ["C", "實施科舉、任用色目人"], ["D", "偏重文人政治、抑制武將權力"]], "ans": "D", "exp": "北宋鑑於唐末武將憑藉軍力干政的亂象，重用文人、壓抑武將以鞏固皇權，但也因此影響自身的軍事發展。"}, {"stem": "北宋雖多次試圖收復燕雲十六州，卻始終未能成功，其主要原因與下列何者關係最密切？", "opts": [["A", "偏重文人政治，軍事實力相對薄弱"], ["B", "財政困窘，無力發動戰爭"], ["C", "皇帝年幼，朝政混亂"], ["D", "遭西夏、南宋兩面夾攻"]], "ans": "A", "exp": "北宋偏重文人政治、以文人指揮軍隊，導致軍事實力貧弱，難以應付強敵環伺的局面，因此多次奪回燕雲十六州皆未成功。"}, {"stem": "宋真宗在位時，遼軍南下入侵，雙方最終簽訂了哪一個和議？", "opts": [["A", "靖康之盟"], ["B", "隆興和議"], ["C", "澶淵之盟"], ["D", "紹興和議"]], "ans": "C", "exp": "宋真宗時遼軍南下，真宗親征，最後雙方簽訂「澶淵之盟」。"}, {"stem": "依據澶淵之盟的內容，下列敘述何者正確？", "opts": [["A", "宋向遼稱臣，接受遼的冊封"], ["B", "遼割讓燕雲十六州給宋"], ["C", "雙方互不通商、斷絕往來"], ["D", "宋每年支付遼銀、絹等「歲幣」，並劃定疆界"]], "ans": "D", "exp": "盟約規定宋每年支付遼國銀、絹等「歲幣」，形成以財物換取和平的局面，並劃定宋、遼疆界。"}, {"stem": "澶淵之盟中，宋、遼雙方君主約定以何種方式互稱，這與傳統漢人政權對外的關係有何不同？", "opts": [["A", "以君臣相稱，維持傳統朝貢體制"], ["B", "以兄弟相稱，形成較為對等的外交關係"], ["C", "以父子相稱，遼居於上位"], ["D", "互不承認對方為對等政權"]], "ans": "B", "exp": "雙方君主約定以兄弟互稱，內容不同於傳統漢人政權對外的朝貢關係，是中國首度與周邊政權建立較對等的外交關係。"}, {"stem": "澶淵之盟簽訂後，宋、遼之間出現了什麼樣的局面？", "opts": [["A", "維持了百餘年的和平，雙方得以致力於內部發展"], ["B", "立刻爆發更大規模的戰爭"], ["C" const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

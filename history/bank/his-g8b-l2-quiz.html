<script>
const QS=[{"stem": "清末科舉制度雖已廢除，但中國仍面臨積弱不振的困局。新知識分子認為，欲徹底解決此困局，必須從哪一層面進行變革？", "opts": [["A", "器物"], ["B", "制度"], ["C", "思想與文化"], ["D", "軍事"]], "ans": "C", "exp": "清末以器物、制度為主的改革，難以擺脫積弱不振的困局，新知識分子主張須進行思想與文化的變革，才能使中國成為現代化國家，這是新文化運動興起的背景。"}, {"stem": "陳獨秀於民國4年創辦一份刊物，掀開新文化運動的序幕，這份刊物後來改名為下列何者？", "opts": [["A", "新青年"], ["B", "民報"], ["C", "申報"], ["D", "東方雜誌"]], "ans": "A", "exp": "陳獨秀於民國4年創辦《青年雜誌》，後改名為《新青年》，引進西方思潮、批判傳統文化，揭開新文化運動的序幕。"}, {"stem": "誰在擔任北京大學校長期間提倡自由學風，使北京大學成為推動新文化運動的重鎮？", "opts": [["A", "陳獨秀"], ["B", "胡適"], ["C", "魯迅"], ["D", "蔡元培"]], "ans": "D", "exp": "蔡元培出任北京大學校長後，提倡自由學風，讓北京大學成為推動新文化運動的重鎮。"}, {"stem": "蔡元培擔任北大校長時，延攬胡適、陳獨秀等新文化運動要角任教，卻也聘用立場保守、作風古怪的辜鴻銘，這最能顯示他辦學抱持下列何種態度？", "opts": [["A", "只重用留學歸國學者"], ["B", "思想自由、兼容並包"], ["C", "排斥傳統學問"], ["D", "堅持全盤西化"]], "ans": "B", "exp": "蔡元培用人不局限於特定立場，即使辜鴻銘的觀點與新文化運動人士不一致，仍因學問好而聘任，展現「思想自由，兼容並包」的辦學精神。"}, {"stem": "新文化運動時期，知識分子大力鼓吹「賽先生」，這是指下列何種概念的音譯？", "opts": [["A", "Science，科學"], ["B", "Democracy，民主"], ["C", "Society，社會"], ["D", "Socialism，社會主義"]], "ans": "A", "exp": "「賽先生」是Science（科學）的音譯，與「德先生」（Democracy，民主）同為新文化運動引進的重要西方價值。"}, {"stem": "新文化運動中被稱為「德先生」的概念，指的是下列何者？", "opts": [["A", "Doctor，醫學"], ["B", "Discipline，紀律"], ["C", "Democracy，民主"], ["D", "Development，發展"]], "ans": "C", "exp": "「德先生」是Democracy（民主）的音譯，知識分子藉此審視中國傳統思想文化的不足。"}, {"stem": "新文化運動期間，有人提出「打倒孔家店」的口號，其主要目的為何？", "opts": [["A", "呼籲恢復科舉考試"], ["B", "支持軍閥統治中國"], ["C", "反對引進西方思想"], ["D", "抨擊專制思想與迷信觀念，推崇西化"]], "ans": "D", "exp": "新知識分子對傳統文化與儒家思想展開強烈批判，「打倒孔家店」即抨擊專制與迷信，主張西化才是中國現代化的重要途徑。"}, {"stem": "胡適、陳獨秀等人在新文化運動中，大力鼓吹以下列何者取代艱澀難懂的文言文？", "opts": [["A", "篆書"], ["B", "白話文"], ["C", "八股文"], ["D", "甲骨文"]], "ans": "B", "exp": "胡適、陳獨秀等人鼓吹以淺顯易懂的白話文取代文言文，是白話文運動的核心主張。"}, {"stem": "下列何者的作品《狂人日記》被視為白話文創作的典範，引起廣大迴響？", "opts": [["A", "魯迅"], ["B", "胡適"], ["C", "陳獨秀"], ["D", "蔡元培"]], "ans": "A", "exp": "魯迅以白話文、新式標點符號撰寫小說《狂人日記》，是白話文創作的代表作品。"}, {"stem": "在白話文運動的帶動下，報刊媒體逐漸流行使用下列何者，有助於知識的傳播與流通？", "opts": [["A", "文言文"], ["B", "甲骨文字"], ["C", "篆刻印章"], ["D", "新式標點符號"]], "ans": "D", "exp": "隨著白話文的推廣，新式標點符號也逐漸流行，有助於教育普及與知識傳播。"}, {"stem": "新文化運動時期傳入中國的西方思潮中，主張「財產、資源由大家共有，藉此消除貧富不均、建立沒有階級差別的社會」，指的是下列何者？", "opts": [["A", "三民主義"], ["B", "共產主義"], ["C", "資本主義"], ["D", "君主立憲"]], "ans": "B", "exp": "共產主義主張財產資源公有，消除貧富不均，是新文化運動時期傳入中國的重要西方思潮之一。"}, {"stem": "中國共產黨於民國幾年成立於上海？", "opts": [["A", "民國4年"], ["B", "民國8年"], ["C", "民國10年"], ["D", "民國18年"]], "ans": "C", "exp": "受五四運動與共產主義思潮影響的知識分子，於民國10年在上海成立中國共產黨。"}, {"stem": "中國共產黨的成立，主要是受到下列何種思潮傳入中國的影響？", "opts": [["A", "共產主義"], ["B", "君主立憲思想"], ["C", "自由貿易思想"], ["D", "三民主義"]], "ans": "A", "exp": "共產主義隨新文化運動傳入中國，部分知識分子受其影響，於民國10年成立中國共產黨。"}, {"stem": "第一次世界大戰結束後，戰勝國召開了哪一場會議，中國以戰勝國身分參與，希望藉此收回德國在山東的權益？", "opts": [["A", "開羅會議"], ["B", "雅爾達會議"], ["C", "波茨坦會議"], ["D", "巴黎和會"]], "ans": "D", "exp": "一戰結束後，列強召開巴黎和會解決戰後問題，中國以戰勝國身分參與，希望收回德國在山東的特權。"}, {"stem": "巴黎和會最終如何處置德國在山東的權益，導致中國國內群情激憤？", "opts": [["A", "歸還給中國"], ["B", "轉交給日本繼承"], ["C", "交由國際共管"], ["D", "維持德國原有權益"]], "ans": "B", "exp": "巴黎和會決議將山東權益讓與日本，而非歸還中國，消息傳回國內後引起強烈不滿，是五四運動爆發的導火線。"}, {"stem": "五四運動爆發於民國8年的哪一天？", "opts": [["A", "5月1日"], ["B", "5月9日"], ["C", "5月4日"], ["D", "6月4日"]], "ans": "C", "exp": "民國8年5月4日，北京各大學學生集結抗議，是為「五四運動」。"}, {"stem": "五四運動最初是由下列何者率先發起遊行示威？", "opts": [["A", "北京各大學學生"], ["B", "上海商人"], ["C", "軍閥部隊"], ["D", "農民團體"]], "ans": "A", "exp": "五四運動由北京大學等校學生率先發起遊行抗議，隨後各地紛紛響應。"}, {"stem": "下列何者「不是」五四運動時學生提出的訴求口號？", "opts": [["A", "外爭主權、內除國賊"], ["B", "廢除二十一條"], ["C", "還我青島"], ["D", "打倒孔家店"]], "ans": "D", "exp": "「打倒孔家店」是新文化運動批判傳統的口號；「外爭主權、內除國賊」「廢除二十一條」「還我青島」才是五四運動的訴求。"}, {"stem": "五四運動爆發後，各地民眾採取下列哪些行動響應學生？", "opts": [["A", "集資協助政府簽約"], ["B", "罷課、罷工、罷市，抵制日貨"], ["C", "呼籲維持現狀"], ["D", "支持巴黎和會的決議"]], "ans": "B", "exp": "五四運動後，各大城市紛紛罷課、罷工、罷市，並抵制日貨，向政府施加壓力。"}, {"stem": "在五四運動與各地輿論的壓力下，北京政府最後採取了下列何種行動？", "opts": [["A", "立即簽署對德和約"], ["B", "出兵鎮壓學生"], ["C", "拒絕簽署對德和約"], ["D", "宣布解散北京大學"]], "ans": "C", "exp": "在五四運動及各地響應的壓力下，北京政府最終拒絕在對德和約上簽字。"}, {"stem": "五四運動對中國社會產生的深遠影響，下列敘述何者最為恰當？", "opts": [["A", "使中國恢復科舉制度"], ["B", "促成清朝的滅亡"], ["C", "導致新文化運動終止"], ["D", "加深國家民族認同，並擴大新文化運動的影響"]], "ans": "D", "exp": "五四運動是學生救亡圖存的愛國運動，加深了社會各界對國家民族的認同，也進一步擴大了新文化運動的影響力。"}, {"stem": "民國4年，日本利用哪一場國際局勢的機會，向中國提出「二十一條」要求？", "opts": [["A", "第一次世界大戰"], ["B", "中日戰爭"], ["C", "八國聯軍"], ["D", "甲午戰爭"]], "ans": "A", "exp": "民國4年，日本趁歐洲列強陷於第一次世界大戰、無暇東顧之際，向中國提出「二十一條」要求。"}, {"stem": "面對日本提出的「二十一條」要求，當時中華民國的總統袁世凱最後採取何種回應？", "opts": [["A", "完全拒絕所有要求"], ["B", "同意部分要求並簽訂條約"], ["C", "訴諸國際仲裁"], ["D", "立即宣戰"]], "ans": "B", "exp": "在日本的脅迫下，袁世凱同意「二十一條」的部分要求，並簽訂俗稱「中日民四條約」的正式條約。"}, {"stem": "甲午戰爭後，哪一個國家租借膠州灣，將山東劃入其勢力範圍？", "opts": [["A", "日本"], ["B", "英國"], ["C", "德國"], ["D", "俄國"]], "ans": "C", "exp": "甲午戰爭後，德國租借膠州灣，將山東劃入其勢力範圍，這是日後山東問題的遠因。"}, {"stem": "第一次世界大戰爆發後，是下列何者進占了德國在山東的勢力範圍？", "opts": [["A", "英國"], ["B", "美國"], ["C", "俄國"], ["D", "日本"]], "ans": "D", "exp": "一戰爆發後，日本對德宣戰並進占德國在山東的勢力範圍，之後又在巴黎和會中取得繼承該權益的承認，成為五四運動的導火線。"}, {"stem": "清末以來，部分知識分子推動下列何種運動，挑戰傳統「三從四德」及男尊女卑觀念？", "opts": [["A", "廢纏足、興女學"], ["B", "抵制日貨"], ["C", "打倒孔家店"], ["D", "白話文運動"]], "ans": "A", "exp": "清末知識分子提倡廢纏足與興女學，挑戰傳統的三從四德及男尊女卑觀念，使女性自主意識逐漸崛起。"}, {"stem": "新文化運動之後，婦女在教育方面獲得下列何種進展？", "opts": [["A", "女子被禁止就學"], ["B", "僅能就讀私塾"], ["C", "女子學校增加，並逐漸開放男女同校"], ["D", "教育內容維持不變"]], "ans": "C", "exp": "民國以來女子學校數量持續增加，各級學校也陸續開放男女同校共學，教育上的性別平等逐步實現。"}, {"stem": "新文化運動之後，婦女在職場方面獲得下列何種進展？", "opts": [["A", "僅能在家從事家務"], ["B", "私人企業與公營機關開始雇用女性，使其能經濟自主"], ["C", "完全被禁止工作"], ["D", "只能從事農業勞動"]], "ans": "B", "exp": "愈來愈多私人企業、甚至公營機關開始雇用女性，使女性獲得就業機會，能經濟自主，拓寬活動範圍。"}, {"stem": "民初許多新女性除了爭取教育與就業機會外，也積極爭取下列何種權利，並投入街頭遊行？", "opts": [["A", "世襲爵位"], ["B", "免稅特權"], ["C", "兵役豁免"], ["D", "參政權利"]], "ans": "D", "exp": "民初新女性除了力爭自由戀愛婚姻外，也上街參與愛國遊行示威、積極爭取參政權利，如投入五四運動的遊行行列。"}, {"stem": "民初，中國學前教育機構由清末的「蒙養院」改稱為下列何者？", "opts": [["A", "幼稚園"], ["B", "女子學堂"], ["C", "書院"], ["D", "私塾"]], "ans": "A", "exp": "清末設立「蒙養院」作為正式的學前教育，到了新文化運動時期改稱「幼稚園」，並配合培育專門師資。"}, {"stem": "新文化運動時期，學者開始用科學方法研究兒童心理，並重視下列何種出版品的發展？", "opts": [["A", "八股文選集"], ["B", "兒童讀物與兒童文學"], ["C", "科舉考試範本"], ["D", "文言文教材"]], "ans": "B", "exp": "此時期開啟了兒童讀物與兒童文學的創作風氣，強調圖文並茂、符合兒童心智發展，以擴展兒童的視野。"}, {"stem": "陳獨 五四運動為核心，說明民初知識分子如何引進新思潮、批判傳統，並帶動社會風氣的轉變。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

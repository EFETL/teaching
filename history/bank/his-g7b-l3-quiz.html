<script>
const QS=[{"stem": "日治時期，臺灣總督府規定日本人子弟主要就讀哪一種學校？", "opts": [["A", "小學校"], ["B", "公學校"], ["C", "蕃童教育所"], ["D", "國語傳習所"]], "ans": "A", "exp": "總督府採差別待遇原則，日本人子弟就讀「小學校」，教學內容與日本本國一致；臺灣人子弟則就讀「公學校」，原住民就讀「蕃童教育所」或「蕃人公學校」。"}, {"stem": "日治時期，臺灣人（非原住民）子弟主要就讀哪一種學校？", "opts": [["A", "小學校"], ["B", "高等女學校"], ["C", "公學校"], ["D", "蕃人公學校"]], "ans": "C", "exp": "臺人多就讀「公學校」，雖以日語教學為主，但師資、教材、設備都不如小學校。"}, {"stem": "日治時期，原住民兒童主要就讀哪一（些）教育機構？", "opts": [["A", "小學校"], ["B", "蕃童教育所或蕃人公學校"], ["C", "公學校"], ["D", "師範學校"]], "ans": "B", "exp": "原住民兒童就讀「蕃童教育所」或「蕃人公學校」，教學設備與師資都不如小學校。"}, {"stem": "總督府建立差別待遇的教育制度，其背後最主要的目的為何？", "opts": [["A", "提升臺灣人受教育年限"], ["B", "落實日臺教育完全平等"], ["C", "培養臺灣人參政能力"], ["D", "同化臺人並培養殖民統治所需人力"]], "ans": "D", "exp": "總督府推動現代教育的目的在於同化臺人、培養產業發展所需人力，藉此強化殖民統治。"}, {"stem": "西元1941年，總督府配合哪一運動，將小學校、公學校一律改稱「國民學校」？", "opts": [["A", "文化啟蒙運動"], ["B", "皇民化運動"], ["C", "地方自治運動"], ["D", "議會設置請願運動"]], "ans": "B", "exp": "西元1941年，總督府配合皇民化運動，將小學校、公學校一律改稱「國民學校」。"}, {"stem": "西元1943年，總督府開始在臺灣實施何種教育制度？", "opts": [["A", "六年義務教育"], ["B", "地方議員選舉"], ["C", "鴉片完全禁止"], ["D", "男子普選制度"]], "ans": "A", "exp": "西元1943年開始實施六年義務教育，兒童就學率與日語普及率因此逐漸提升。"}, {"stem": "臺灣第一所專為臺灣人子弟設立的中學校是？", "opts": [["A", "臺北帝國大學"], ["B", "國語學校"], ["C", "臺中中學校"], ["D", "醫學校"]], "ans": "C", "exp": "西元1915年，林獻堂等臺灣士紳集資成立臺中中學校（今臺中一中），是第一所專收臺人子弟的中學校。"}, {"stem": "臺中中學校的創辦，主要是由哪些人士推動促成？", "opts": [["A", "總督府官員"], ["B", "日本內地商人"], ["C", "蔣渭水等醫師"], ["D", "林獻堂等臺灣士紳"]], "ans": "D", "exp": "林獻堂等臺灣士紳為爭取臺人受教育的機會，於西元1915年促成臺中中學校的設立。"}, {"stem": "日治時期中等以上教育以何種原則為主？", "opts": [["A", "實用取向，偏重職業教育"], ["B", "完全比照日本本土的普通教育"], ["C", "以培養行政官員為主"], ["D", "專門培育軍事人才"]], "ans": "A", "exp": "日治時期中等教育以實用為原則，總督府設立師範、醫學與農工商等職業學校，培養教師、醫師與技術人才。"}, {"stem": "西元1928年，總督府設立的臺灣最高學府是？", "opts": [["A", "臺中中學校"], ["B", "國語學校"], ["C", "臺灣總督府醫學校"], ["D", "臺北帝國大學"]], "ans": "D", "exp": "西元1928年，總督府設立臺北帝國大學（今國立臺灣大學前身），是日治時期臺灣的最高學府。"}, {"stem": "若臺灣人希望接受完整的高等教育，日治時期多數人會選擇？", "opts": [["A", "就讀臺中中學校"], ["B", "前往日本本國留學"], ["C", "進入蕃人公學校進修"], ["D", "就讀公學校高等科"]], "ans": "B", "exp": "由於臺灣高等教育機會不足，經濟條件較佳的臺灣人若要繼續升學，大多前往日本國內就學。"}, {"stem": "一九二〇年代以後，透過現代教育與海外求學崛起的新社會精英，日後扮演了什麼角色？", "opts": [["A", "全力配合總督府的殖民統治"], ["B", "專注於經商累積財富"], ["C", "成為推動政治、社會、文化運動的重要人物"], ["D", "多數返鄉從事農業生產"]], "ans": "C", "exp": "新社會精英普遍接受新思想與專業訓練，成為推動臺灣政治、社會、文化運動的重要人物，如林獻堂、蔣渭水等人。"}, {"stem": "西元1921年，林獻堂、蔣渭水等人成立的組織是？", "opts": [["A", "臺灣民眾黨"], ["B", "臺灣文化協會"], ["C", "臺灣地方自治聯盟"], ["D", "臺灣共產黨"]], "ans": "B", "exp": "西元1921年，林獻堂、蔣渭水等人成立「臺灣文化協會」，開啟臺灣的文化啟蒙運動。"}, {"stem": "臺灣文化協會成立的主要目的為何？", "opts": [["A", "啟迪民智、喚起臺人民族意識"], ["B", "爭取臺灣獨立建國"], ["C", "發展臺灣工業經濟"], ["D", "推動全面武裝抗日"]], "ans": "A", "exp": "臺灣文化協會希望透過各種活動，達到啟迪民智及喚起臺人民族意識的目的。"}, {"stem": "臺灣文化協會主要透過哪一份刊物發表言論、宣傳理念？", "opts": [["A", "臺灣日日新報"], ["B", "臺灣時報"], ["C", "漢文臺灣日日新報"], ["D", "臺灣民報"]], "ans": "D", "exp": "臺灣文化協會透過「臺灣民報」發表言論，這是了解當時臺灣人爭取權利歷程的珍貴史料。"}, {"stem": "臺灣文化協會曾舉辦下列哪些活動，以啟迪民智？", "opts": [["A", "選美活動與運動會"], ["B", "地方議員選舉"], ["C", "演講會、夏季學校、讀報社"], ["D", "農工運動與罷工"]], "ans": "C", "exp": "臺灣文化協會舉辦演講會、夏季學校、讀報社等活動，希望啟迪民智、喚起臺人的民族意識。"}, {"stem": "「臺灣民報」在西元1930年後改稱為？", "opts": [["A", "臺灣新民報"], ["B", "臺灣公論報"], ["C", "臺灣青年"], ["D", "臺灣新聞"]], "ans": "A", "exp": "臺灣民報於西元1930年後改稱為臺灣新民報。"}, {"stem": "第一次世界大戰後，帶動臺灣文化啟蒙與政治社會運動蓬勃發展的國際思潮為何？", "opts": [["A", "社會主義革命浪潮"], ["B", "帝國殖民擴張風潮"], ["C", "宗教復興運動"], ["D", "民族自決風潮"]], "ans": "D", "exp": "第一次世界大戰後，全球瀰漫民族自決的風潮，加上日本國內要求民主的聲浪高漲，衝擊臺灣青年，促使政治、社會運動蓬勃發展。"}, {"stem": "西元1921年，林獻堂、蔣渭水等人發起的政治運動稱為？", "opts": [["A", "臺灣民眾黨運動"], ["B", "地方自治聯盟運動"], ["C", "臺灣議會設置請願運動"], ["D", "臺灣共產黨運動"]], "ans": "C", "exp": "西元1921年，林獻堂、蔣渭水等人發起「臺灣議會設置請願運動」。"}, {"stem": "臺灣議會設置請願運動的主要訴求為何？", "opts": [["A", "在臺設立「臺灣議會」"], ["B", "廢除公學校制度"], ["C", "全面禁止鴉片"], ["D", "實施地方自治選舉"]], "ans": "A", "exp": "該運動要求在臺灣設立「臺灣議會」，以爭取臺人的政治參與權。"}, {"stem": "臺灣議會設置請願運動總共歷經多少次請願行動？", "opts": [["A", "五次"], ["B", "八次"], ["C", "十次"], ["D", "十五次"]], "ans": "D", "exp": "林獻堂、蔣渭水等人歷經十五次的請願行動，雖未獲日本政府同意，但喚起了臺灣民眾的政治意識。"}, {"stem": "臺灣議會設置請願運動最終的結果為何？", "opts": [["A", "總督府同意成立臺灣議會"], ["B", "未獲日本政府同意，但喚起臺人政治意識"], ["C", "促成臺灣獨立"], ["D", "促使總督府立即實施全面普選"]], "ans": "B", "exp": "這場運動雖未獲得日本政府同意，卻喚起了臺灣民眾的政治意識，具有重要的歷史意義。"}, {"stem": "西元1927年，蔣渭水等人籌組的臺灣第一個合法政黨是？", "opts": [["A", "臺灣共產黨"], ["B", "臺灣地方自治聯盟"], ["C", "臺灣民眾黨"], ["D", "臺灣文化協會"]], "ans": "C", "exp": "西元1927年，蔣渭水等人籌組臺灣第一個合法政黨「臺灣民眾黨」。"}, {"stem": "臺灣民眾黨除了宣導民權、地方自治觀念外，也積極參與哪一類運動？", "opts": [["A", "農工運動"], ["B", "議會請願運動"], ["C", "皇民化運動"], ["D", "放足斷髮運動"]], "ans": "A", "exp": "臺灣民眾黨也積極參與農工運動，以爭取農民與工人的權益。"}, {"stem": "西元1930年，林獻堂等人成立的團體是？", "opts": [["A", "臺灣民眾黨"], ["B", "臺灣文化協會"], ["C", "臺灣共產黨"], ["D", "臺灣地方自治聯盟"]], "ans": "D", "exp": "西元1930年，林獻堂等人成立「臺灣地方自治聯盟」，主張實施地方自治。"}, {"stem": "臺灣地方自治聯盟主要的訴求為何？", "opts": [["A", "廢除公學校制度"], ["B", "主張實施地方自治"], ["C", "要求全面武裝抗日"], ["D", "推動臺灣獨立建國"]], "ans": "B", "exp": "臺灣地方自治聯盟主張實施地方自治，經過知識分子不斷的請願和鼓吹，促成西元1935年的地方議員選舉。"}, {"stem": "西元1935年總督府舉辦的地方議員選舉，有何限制？", "opts": [["A", "全面開放男女普選"], ["B", "完全由臺灣人自治"], ["C", "半數議員仍由官方選任"], ["D", "僅開放給日本人投票"]], "ans": "C", "exp": "西元1935年的地方議員選舉，半數議員仍由官方選任，被視為有限度的地方自治。"}, {"stem": "西元1935年的地方議員選舉，在臺灣歷史上具有什麼重要意義？", "opts": [["A", "是臺灣史上民眾第一次行使投票權"], ["B", "是臺灣首次實施男女平等教育"], ["C", "標誌臺灣議會正式成立"], ["D", "象徵皇民化運動正式結束"]], "ans": "A", "exp": "這是臺灣史上民眾第一次行使投票權，雖不完全，卻讓臺人對自治、選舉觀念有了初步認識。"}, {"stem": "臺灣的政治社會運動最終因何事而被迫終止？", "opts": [["A", "臺灣議會成功設立"], ["B", "蔣渭水去世"], ["C", "地方自治完全落實"], ["D", "皇民化運動的推行（中日戰爭爆發後）"]], "ans": "D", "exp": "皇民化運動推行後，總督府強化對臺灣的控制，臺人的政治社會運動被迫終止。"}, {"stem": "綜觀臺灣議會設置請願運動、臺灣民眾黨、臺灣地方自治聯盟等政治社會運動，為臺灣人帶來什麼共同影響？", "opts": [["A", "使臺灣立即獨立建國"], ["B", "讓臺人對自治、參政等觀念有初步認識"], ["C", "徹底終結日本殖民統治"], ["D", "使臺灣議會正式成立"]], "ans": "B", "exp": "這些政治社會運動雖未能完全達成訴求，但已讓臺人對自治、選舉、參政等觀念有了初步的認識。"}, {"stem": "蔣渭水在從事政治社會運動之前，原本的職業是？", "opts": [["A", "教師"], ["B", "律師"], ["C", "醫師"], ["D", "記者"]], "ans": "C", "exp": "蔣渭水是一名醫師，在行醫濟世的同時，積極投入臺灣的文化啟蒙運動。"}, {"stem": "西元1921年，蔣渭水發表了哪一篇著名文章，以診斷書形式分析臺灣社會問題？", "opts": [["A", "臨床講義"], ["B", "臺灣通史"], ["C", "臺灣青年宣言"], ["D", "送報伕"]], "ans": "A", "exp": "西元1921年，蔣渭水發表「臨床講義」，利用醫生的角度，以診斷書的形式，深入淺出地分析臺灣社會的各種「疾病」。"}, {"stem": "在「臨床講義」中，蔣渭水將「臺灣」比喻為？", "opts": [["A", "一位智者"], ["B", "一位商人"], ["C", "一座監獄"], ["D", "一位病人"]], "ans": "D", "exp": "蔣渭水以診斷書的形式，將臺灣島比喻為一位病人，分析其「病症」與「病因」，藉此提出改革建議。"}, {"stem": "蔣渭水在「臨床講義」中，診斷臺灣這位「病人」的病因為何？", "opts": [["A", "體質過於強健"], ["B", "智識營養不良"], ["C", "缺乏食物"], ["D", "過度勞動"]], "ans": "B", "exp": "蔣渭水診斷臺灣的病因是「智識之營養不良」，因此開出以教育為主的處方。"}, {"stem": "蔣渭水在「臨床講義」中開立的「處方」，主要著重於下列何者？", "opts": [["A", "興建更多醫院"], ["B", "發展農業生產"], ["C", "正規學校教育、補習教育、圖書館、讀報社等"], ["D", "增加警察與保甲人力"]], "ans": "C", "exp": "蔣渭水開出的處方包括正規學校教育、補習教育、幼稚園、圖書館、讀報社等，顯示他認為教育與知識的普及才能對症下藥。"}, {"stem": "總督府將下列哪三項視為臺灣的「三大陋習」？", "opts": [["A", "纏足、辮髮、吸食鴉片"], ["B", "迷信、賭博、械鬥"], ["C", "早婚、多妻、械鬥"], ["D", "文面、出草、室內葬"]], "ans": "A", "exp": "總督府將纏足、辮髮、吸食鴉片視為臺灣的三大陋習。"}, {"stem": "總督府對纏足、辮髮陋習，最初採取的態度是？", "opts": [["A", "立即強制執行禁止"], ["B", "完全放任不理會"], ["C", "只針對原住民實施禁令"], ["D", "為避免臺人抗爭，並未積極禁止"]], "ans": "D", "exp": "起初總督府為避免臺人的抗爭，並未積極禁止纏足辮髮，後來透過士紳倡導，才逐漸帶動放足斷髮的風氣。"}, {"stem": "總督府對於鴉片問題，採取何種政策？", "opts": [["A", "立即全面禁止"], ["B", "漸禁政策，須取得許可證才能購買"], ["C", "完全放任自由買賣"], ["D", "僅禁止日本人吸食"]], "ans": "B", "exp": "總督府對鴉片採取漸禁政策，規定吸食者必須取得許可證才能購買，藉此逐步減少吸食人口。"}, {"stem": "放足斷髮運動及士紳倡導，帶動了臺灣社會哪一方面風氣的改變？", "opts": [["A", "農業生產技術"], ["B", "宗教信仰型態"], ["C", "服飾風氣（西式、日式服裝流行）"], ["D", "政黨政治發展"]], "ans": "C", "exp": "士紳倡導放足斷髮，帶動改變服飾的風氣，西式與日式服裝逐漸在臺灣流行。"}, {"stem": "總督府派駐山地的警察，透過「教育」原住民，強迫其停止哪些傳統習俗？", "opts": [["A", "出草、文面、室內葬"], ["B", "纏足、辮髮"], ["C", "吸食鴉片"], ["D", "拜天公、迎媽祖"]], "ans": "A", "exp": "總督府派駐山地的警察教育原住民接受現代禮儀與醫療等知識，強迫他們停止出草、文面與室內葬等傳統習俗。"}, {"stem": "總督府透過警察改變原住民傳統社會文化，其做法反映了殖民統治的何種特色？", "opts": [["A", "完全尊重原住民傳統文化"], ["B", "僅以經濟利益為考量"], ["C", "只針對平地漢人推行"], ["D", "以現代化之名，強制介入原住民生活方式"]], "ans": "D", "exp": "總督府藉由山地警察力量，以推廣現代禮儀、醫療知識為名，強制改變原住民的傳統習俗與社會文化。"}, {"stem": "總督府為了有效防止傳染病，實施了哪些措施？", "opts": [["A", "廢除所有傳統醫療機構"], ["B", "定期環境衛生清潔、建自來水與下水道"], ["C", "強迫全民接種疫苗並罰款"], ["D", "禁止臺灣人從事醫療工作"]], "ans": "B", "exp": "總督府實施定期的環境衛生清潔工作，並建立自來水、下水道等設施，以有效防止傳染病。"}, {"stem": "總督府設立公立醫院，主要目的為何？", "opts": [["A", "培養軍事醫護人員"], ["B", "增加總督府財政收入"], ["C", "建立現代醫療衛生制度"], ["D", "取代原有的公學校教育"]], "ans": "C", "exp": "總督府設立公立醫院，建立現代的醫療衛生制度，使臺灣地區的死亡率大為降低。"}, {"stem": "總督府推動現代衛生觀念後，臺灣社會出現什麼具體變化？", "opts": [["A", "死亡率大為降低"], ["B", "出生率快速下降"], ["C", "傳染病種類大幅增加"], ["D", "醫療資源集中於原住民部落"]], "ans": "A", "exp": "透過建立現代醫療衛生制度與環境衛生設施，臺灣地區的死亡率大為降低。"}, {"stem": "總督府引進西方的司法制度後，藉由下列何種方式，使人民逐漸養成守法習慣？", "opts": [["A", "廢除所有傳統習俗"], ["B", "完全交由地方仕紳自治"], ["C", "僅在都市地區實施"], ["D", "設置法院，藉警察與保甲嚴格執行法律"]], "ans": "D", "exp": "總督府引進西方司法制度，設置法院審理案件，並藉由警察與保甲嚴格執行法律，使人民逐漸養成守法的習慣。"}, {"stem": "總督府引進的時間制度包括哪些？", "opts": [["A", "農曆二十四節氣"], ["B", "一天二十四小時制與一週七天的星期制"], ["C", "只有星期制，沒有時制"], ["D", "十進位計時制"]], "ans": "B", "exp": "總督府引進一天二十四小時的標準時間制與一週七天的星期制，要求各機關制定生活作息的時間表。"}, {"stem": "學校、工廠及社會團體被要求制定生活作息時間表，其目的為何？", "opts": [["A", "增加總督府稅收"], ["B", "減少臺人受教育機會"], ["C", "使臺人逐漸養成守時的觀念"], ["D", "削弱臺人的政治意識"]], "ans": "C", "exp": "總督府要求各機關制定作息時間表，使臺人逐漸養成守時觀念，形成新的生活規律。"}, {"stem": "到了日治後期，臺灣已形成下列哪些現代化大都市？", "opts": [["A", "臺北、高雄、臺南"], ["B", "花蓮、臺東、宜蘭"], ["C", "新竹、苗栗、彰化"], ["D", "金門、馬祖、澎湖"]], "ans": "A", "exp": "總督府引進現代都市計畫制度，至日治後期，臺灣已形成臺北、高雄、臺南等大都市。"}, {"stem": "隨著都市發展與假日出現，都市居民開始重視下列何種活動？", "opts": [["A", "農耕與畜牧"], ["B", "傳統科舉考試"], ["C", "武裝抗日訓練"], ["D", "郊遊、打棒球、逛百貨公司等休閒娛樂"]], "ans": "D", "exp": "總督府規畫西式公園、博物館等設施，民眾可以郊遊、打棒球、逛百貨公司，在休閒活動中獲得許多樂趣。"}, {"stem": "日治時期，下列哪一項屬於日本文化傳入臺灣後，逐漸流行的休閒風尚？", "opts": [["A", "科舉考試與詩社吟詩"], ["B", "溫泉文化與日式料理"], ["C", "傳統迎神廟會"], ["D", "纏足與辮髮"]], "ans": "B", "exp": "日本的溫泉文化、料理、歌曲開始在臺灣流行；加上喝咖啡、跳舞等西方社交文化，搭乘鐵路觀光旅遊也成為當時時髦的活動。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

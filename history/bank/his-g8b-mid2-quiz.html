<script>
const QS=[{"stem": "民國12年，孫中山為了對抗軍閥、壯大革命力量，決定採取下列哪一項政策？", "opts": [["A", "攘外必先安內"], ["B", "聯俄容共"], ["C", "以黨治國"], ["D", "廢兩改元"]], "ans": "B", "exp": "民國12年，孫中山主張「聯俄容共」，同意中共黨員以個人身分加入國民黨，並藉此爭取蘇聯的經費、武器等援助。"}, {"stem": "關於「聯俄容共」政策的實際做法，下列敘述何者正確？", "opts": [["A", "國民黨與中共組成聯合政府，共同執政"], ["B", "國民黨解散，全面改組為共產黨"], ["C", "中共黨員以個人身分加入國民黨，國民黨換取蘇聯援助"], ["D", "蘇聯出兵協助國民黨北伐統一全國"]], "ans": "C", "exp": "聯俄容共的做法是讓中共黨員以個人身分加入國民黨，而非兩黨對等結盟或組成聯合政府，國民黨則藉此換取蘇聯的援助。"}, {"stem": "孫中山推動「聯俄容共」，最主要是希望藉此換取蘇聯提供下列哪一項協助？", "opts": [["A", "經費、武器等援助"], ["B", "承認中華民國的國際地位"], ["C", "割讓部分領土以求和平"], ["D", "直接派兵消滅各地軍閥"]], "ans": "A", "exp": "課本記載，孫中山採行聯俄容共，是為了換取蘇聯的經費、武器等援助，以壯大革命武力對抗軍閥。"}, {"stem": "下列有關聯俄容共時期國共兩黨關係的敘述，何者最為正確？", "opts": [["A", "兩黨地位完全對等、共同組成聯合內閣"], ["B", "中共完全併入國民黨，兩黨從此合一"], ["C", "兩黨互不往來，僅由蘇聯居中協調"], ["D", "中共黨員以個人身分加入國民黨，而非兩黨對等結盟"]], "ans": "D", "exp": "聯俄容共並非國共兩黨對等結盟，而是中共黨員以個人身分加入國民黨，國民黨本身組織與立場並未改變。"}, {"stem": "民國13年，孫中山在蘇聯協助下，於廣州何處創辦陸軍軍官學校（通稱黃埔軍校）？", "opts": [["A", "珠江"], ["B", "黃埔"], ["C", "廣州灣"], ["D", "虎門"]], "ans": "B", "exp": "民國13年，孫中山在蘇聯協助下於廣州黃埔創辦陸軍軍官學校，因位於黃埔而通稱「黃埔軍校」。"}, {"stem": "黃埔軍校成立的主要目的為何？", "opts": [["A", "培養革命武力，以打倒軍閥"], ["B", "訓練外交人才，對抗列強"], ["C", "培育經濟建設人才"], ["D", "訓練警察維持地方治安"]], "ans": "A", "exp": "黃埔軍校的設立，目的在培養革命武力，作為日後北伐、打倒各地軍閥的軍事基礎。"}, {"stem": "黃埔軍校成立時，出任校長、日後逐漸掌握軍權而成為國民黨重要領導人之一的是下列何人？", "opts": [["A", "孫中山"], ["B", "張學良"], ["C", "蔣中正"], ["D", "汪精衛"]], "ans": "C", "exp": "蔣中正出任黃埔軍校校長，因掌控軍權，此後逐漸成為國民黨及國民政府的主要領導人之一。"}, {"stem": "民國14年，孫中山逝世後，廣州政府隨即改組為下列何者，與北京政府南北對立？", "opts": [["A", "中華蘇維埃政府"], ["B", "武漢國民政府"], ["C", "中華民國臨時政府"], ["D", "國民政府"]], "ans": "D", "exp": "民國14年孫中山病逝後，廣州政府改組為「國民政府」，與當時的北京政府形成南北分立的局面。"}, {"stem": "下列有關孫中山逝世後政局發展的敘述，何者正確？", "opts": [["A", "廣州政府改組為國民政府，持續與北京政府對立"], ["B", "國民黨隨即宣布解散"], ["C", "中共取得廣州政權的主導權"], ["D", "全國立即統一，結束南北分裂"]], "ans": "A", "exp": "孫中山逝世後，廣州政府改組為國民政府，但此時全國尚未統一，仍與北京政府形成南北分立的局面，直到北伐完成後才改變。"}, {"stem": "民國15年，國民政府命何人率軍北伐，展開統一全國的軍事行動？", "opts": [["A", "張學良"], ["B", "蔣中正"], ["C", "汪精衛"], ["D", "張作霖"]], "ans": "B", "exp": "民國15年，國民政府命蔣中正率軍北伐，陸續擊敗各地軍閥。"}, {"stem": "北伐的主要目的為何？", "opts": [["A", "對抗日本的侵略"], ["B", "收回香港、澳門主權"], ["C", "消滅中國共產黨"], ["D", "討伐各地軍閥，統一全國"]], "ans": "D", "exp": "北伐是國民政府為結束軍閥割據局面而發動的軍事行動，目的在討伐各地軍閥、統一全國，並非以消滅中共或對抗日本為出發點。"}, {"stem": "北伐軍展開軍事行動後，最初面對的主要對象是下列何者？", "opts": [["A", "日本占領軍"], ["B", "蘇聯紅軍"], ["C", "割據各地的軍閥"], ["D", "中共領導的紅軍"]], "ans": "C", "exp": "北伐的直接軍事對象是當時割據各地的軍閥，國共兩黨的衝突則是在北伐過程中才逐漸浮現、激化。"}, {"stem": "下列關於北伐起訖的敘述，何者正確？", "opts": [["A", "民國14年開始，17年完成"], ["B", "民國15年開始，17年完成"], ["C", "民國15年開始，19年完成"], ["D", "民國16年開始，20年完成"]], "ans": "B", "exp": "依課本記載，北伐始於民國15年，至民國17年張學良宣布歸順、東北易幟後，中華民國歸於統一，北伐至此完成。"}, {"stem": "北伐期間，國共兩黨關係出現何種變化？", "opts": [["A", "因爭奪領導權而分裂，終致決裂"], ["B", "合作更加緊密，共組聯合政府"], ["C", "中共退出中國，遷往蘇聯"], ["D", "國民黨主動邀請中共取得政權"]], "ans": "A", "exp": "北伐過程中，國共雙方為爭奪領導權而逐漸產生嫌隙，最終導致蔣中正決定清黨，兩黨關係正式決裂。"}, {"stem": "民國16年，國民政府遷往武漢後，發生下列何種情況，促使蔣中正決定清黨？", "opts": [["A", "武漢政府遭日軍占領"], ["B", "武漢政府宣布向日本投降"], ["C", "武漢政府被地方軍閥推翻"], ["D", "武漢政府被親共人士把持"]], "ans": "D", "exp": "國民政府遷往武漢後，政府實際上被親共人士所把持，蔣中正因此決定在南京另立政府，並展開清黨行動。"}, {"stem": "「清黨」是指蔣中正採取下列哪一項行動？", "opts": [["A", "解散國民黨，另組新黨"], ["B", "與中共協商，和平分家"], ["C", "以武力清除國民黨內的中共分子"], ["D", "開除黨內主張北伐的將領"]], "ans": "C", "exp": "清黨是指蔣中正以武力手段清除國民黨內部的共產黨分子，是國共第一次合作走向破裂的關鍵事件。"}, {"stem": "蔣中正清黨後，另於何處成立國民政府，與武漢政府對立？", "opts": [["A", "南京"], ["B", "上海"], ["C", "廣州"], ["D", "北京"]], "ans": "A", "exp": "蔣中正清除黨內共黨分子後，宣布定都南京、另立國民政府，與當時被親共人士把持的武漢政府形成對立。"}, {"stem": "下列關於「寧漢分裂」後續發展的敘述，何者正確？", "opts": [["A", "武漢政府始終與南京政府對抗到底"], ["B", "武漢政府其後結束與共產黨的合作，併入南京政府"], ["C", "南京政府解散，合併入武漢政府"], ["D", "兩個政府同時被中共推翻"]], "ans": "B", "exp": "南京、武漢兩政府對立一段時間後，武漢政府結束與共產黨的合作，最終併入南京國民政府，國民黨內部重新歸於一統。"}, {"stem": "國民黨清黨、南京國民政府成立後，接下來採取了下列何種行動？", "opts": [["A", "停止一切軍事行動，與各方休兵"], ["B", "立即向日本宣戰"], ["C", "全面實施憲政，還政於民"], ["D", "繼續推動北伐，進軍北方"]], "ans": "D", "exp": "國共決裂、南京國民政府確立後，國民黨並未停止軍事行動，而是繼續推動北伐，最終於民國17年完成統一。"}, {"stem": "民國17年，北伐軍攻入北京後，統治東北的軍閥張學良做出下列何種決定，使中華民國完成統一？", "opts": [["A", "聯合日本對抗國民政府"], ["B", "宣布東北獨立建國"], ["C", "宣布歸順南京國民政府"], ["D", "遷都瀋陽，另立政府"]], "ans": "C  "課本圖說提到「民國38年，中華民國政府遷臺，下轄機關、軍隊以及許多平民亦先後撤退來臺」，圖為國軍搭乘飛機由大陸飛往臺灣的畫面。"}, {"stem": "西元1951年9月8日簽訂的「舊金山和約」，其中規定日本放棄了對哪些地區的一切權利？", "opts": [["A", "臺灣及澎湖群島、南沙群島及西沙群島"], ["B", "香港及九龍半島"], ["C", "海南島及廣東沿海島嶼"], ["D", "琉球群島與沖繩"]], "ans": "A", "exp": "課本節錄舊金山和約條文：「茲承認……日本已放棄對於臺灣及澎湖群島以及南沙群島及西沙群島之一切權利、權利名義與要求」。"}, {"stem": "舊金山和會召開時，中華民國最終未能出席並簽署和約，主要原因為何？", "opts": [["A", "中華民國主動抵制和會以示抗議"], ["B", "日本拒絕邀請中華民國參加"], ["C", "美國反對中華民國參與國際會議"], ["D", "中華民國遭部分國家質疑是否能代表「中國」，因而未能參與和會"]], "ans": "D", "exp": "課本說明「舊金山和會召開之際，中華民國遭部分國家質疑是否能代表『中國』，因而未能參與和會、簽署舊金山和約」。"}, {"stem": "中華民國雖未參與舊金山和會，但依國際慣例仍需與日本終止戰爭狀態，因此後續採取了什麼做法？", "opts": [["A", "完全放棄與日本建立任何外交關係"], ["B", "在美國主導下，與日本單獨簽署「中日和約」"], ["C", "委託聯合國代為簽署和約"], ["D", "由中華人民共和國代為簽署和約"]], "ans": "B", "exp": "課本指出「日本與中華民國仍需簽訂和約，以正式終止戰爭狀態。故在美國主導下，兩國單獨簽署『中日和約』」。"}, {"stem": "若將下列事件依發生先後排序，正確的順序應為何？\n甲、珍珠港事變；乙、九一八事變；丙、日本無條件投降；丁、七七事變", "opts": [["A", "甲乙丙丁"], ["B", "丁乙甲丙"], ["C", "乙丁甲丙"], ["D", "乙甲丁丙"]], "ans": "C", "exp": "依課本記載的時間，九一八事變發生於民國20年（1931）、七七事變發生於民國26年（1937）、珍珠港事變發生於民國30年（1941）、日本無條件投降則在民國34年（1945），故正確順序為乙（九一八事變）→丁（七七事變）→甲（珍珠港事變）→丙（日本投降）。"}, {"stem": "西安事變後，國共兩黨基於共同抗日的需求而再度攜手合作，歷史上稱此為下列何者？", "opts": [["A", "第二次國共合作"], ["B", "三民主義統一中國"], ["C", "聯俄容共"], ["D", "動員戡亂"]], "ans": "A", "exp": "課本指出西安事變後國共衝突暫告停止、一致抗日成為共識，這正是「第二次國共合作」的開端，使中國得以團結對抗日本侵略，直到抗戰勝利後國共關係才再度破裂。"}, {"stem": "綜合本課內容，從中日戰爭到國共內戰，最終導致了下列哪一項重大局勢的形成？", "opts": [["A", "中華人民共和國加入舊金山和約"], ["B", "臺灣重新受日本殖民統治"], ["C", "中國永久維持統一政府"], ["D", "中華民國政府遷往臺灣，形成兩岸分治的局面"]], "ans": "D", "exp": "課本總結指出，中日戰爭結束後，國共內戰接續爆發，國民政府在內戰中節節敗退，最終於民國38年底遷往臺灣，「從此形成兩岸分治的局面」，這正是本課的核心脈絡。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

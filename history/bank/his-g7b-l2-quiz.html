<script>
const QS=[{"stem": "日治初期，總督府將鴉片、樟腦等商品收歸政府獨占經營，這項政策的主要目的是什麼？", "opts": [["A", "提升人民生活品質"], ["B", "增加財政收入，減少對日本國庫的依賴"], ["C", "保護原住民的生活空間"], ["D", "促進臺灣人民參政權"]], "ans": "B", "exp": "日治初期臺灣財政仰賴日本國庫補助，總督府將鴉片、樟腦等商品收歸專賣，藉此增加財政收入，逐漸使臺灣財政獨立，減少對日本國庫的依賴。"}, {"stem": "日治時期總督府實施專賣制度，下列何者是總督府列為專賣的商品？", "opts": [["A", "稻米"], ["B", "蔗糖"], ["C", "蓬萊米"], ["D", "鴉片與樟腦"]], "ans": "D", "exp": "總督府將鴉片、樟腦等商品收歸政府獨占經營（專賣），藉以增加財政收入；稻米、蔗糖屬於農業生產的作物，並非專賣商品。"}, {"stem": "課本提及「阿片小賣所鐵牌」，這塊鐵牌的作用最可能是下列何者？", "opts": [["A", "供辨認經官方許可、可合法販售鴉片的商家"], ["B", "標示土地調查完成的地區"], ["C", "代表該商家已加入原料採集區域制度"], ["D", "證明該商家為新式製糖廠"]], "ans": "A", "exp": "「阿片」即鴉片，日治時期只有經官方核可的商家才能懸掛此鐵牌，以供辨認、合法販售專賣商品。"}, {"stem": "總督府推動土地調查後，對臺灣財政帶來的主要影響是什麼？", "opts": [["A", "減少田賦收入"], ["B", "使原住民獲得更多土地"], ["C", "確立地籍資料，使田賦收入大為增加"], ["D", "促成鴉片專賣制度的實施"]], "ans": "C", "exp": "總督府推動土地調查，確實掌握地籍資料、確認土地所有權，使田賦稅收大為增加，作為施政與開發的財政基礎。"}, {"stem": "總督府推動林野調查後，造成的主要影響是什麼？", "opts": [["A", "提升原住民的生活空間"], ["B", "大量林野地收歸國有，壓縮原住民生活空間"], ["C", "使地籍資料更加混亂"], ["D", "促成蓬萊米的改良成功"]], "ans": "B", "exp": "林野調查將大批林野地收歸國有，供資本家（日本企業）開發山區森林資源，但也因此壓縮了原住民原有的生活空間。"}, {"stem": "西元1905年，總督府在臺灣實施了下列何項調查工作？", "opts": [["A", "土地調查"], ["B", "林野調查"], ["C", "糖業普查"], ["D", "第一次人口普查"]], "ans": "D", "exp": "西元1905年，總督府在臺實施第一次人口普查，建立詳實的戶籍與人口資料，以掌握臺灣人口實況，有利於殖民統治與人力資源運用。"}, {"stem": "日治初期，總督府各項現代化調查與建設工作，主要是由下列何人所主導推動？", "opts": [["A", "民政長官後藤新平"], ["B", "臺灣總督兒玉源太郎"], ["C", "農學家磯永吉"], ["D", "土木技師八田與一"]], "ans": "A", "exp": "第四任總督兒玉源太郎起用後藤新平擔任民政長官，後藤新平在其治理下推動土地、林野、戶口調查與統一貨幣等基礎建設，是當時臺灣實際的主政者。"}, {"stem": "清帝國時期，臺灣市場上流通多國貨幣，造成的問題是什麼？", "opts": [["A", "田賦稅收減少"], ["B", "蔗糖無法外銷"], ["C", "貨幣種類混亂，交易時換算不便"], ["D", "縱貫鐵路無法通車"]], "ans": "C", "exp": "清帝國時期各國貨幣皆可在臺灣流通，種類眾多，造成市場交易換算、找錢不便，形成幣制混亂的問題。"}, {"stem": "總督府為解決臺灣貨幣混亂的問題，採取了下列何種措施？", "opts": [["A", "廢除所有舊有貨幣，全面使用日圓現金"], ["B", "委託民間錢莊統一鑄幣"], ["C", "引進歐美國家貨幣作為法定貨幣"], ["D", "成立臺灣銀行，統一發行貨幣"]], "ans": "D", "exp": "總督府成立臺灣銀行，統一發行貨幣（銀行券），以減少市場交易爭議，並方便管理與整頓金融。"}, {"stem": "臺灣銀行除了統一發行貨幣外，後來還扮演了下列何種角色？", "opts": [["A", "主導土地調查工作"], ["B", "為日本企業提供資金，協助其開發臺灣資源"], ["C", "負責鴉片專賣業務"], ["D", "興建嘉南大圳"]], "ans": "B", "exp": "臺灣銀行除統一發行貨幣外，也提供資金給日本企業，協助其在臺投資、開發臺灣的各項資源。"}, {"stem": "西部縱貫鐵路（基隆到高雄）是在西元哪一年完工通車？", "opts": [["A", "1895年"], ["B", "1899年"], ["C", "1908年"], ["D", "1930年"]], "ans": "C", "exp": "總督府自西元1899年推動縱貫鐵路工程，北起基隆、南至高雄，歷經九年興築，於西元1908年正式完工通車。"}, {"stem": "西部縱貫鐵路完工後，對臺灣帶來的主要影響是下列何者？", "opts": [["A", "大幅縮短南北往來的交通時間"], ["B", "使臺灣糖業因此沒落"], ["C", "造成原住民生活空間被壓縮"], ["D", "促成鴉片專賣制度廢除"]], "ans": "A", "exp": "在鐵路完工前，臺灣南北交通受東西向溪流阻隔，陸路往來不便；縱貫鐵路完工後大大縮短南北往返的交通時間，人員流通與物資運輸都更為便利。"}, {"stem": "日治時期總督府整建了哪兩座港口，作為臺灣貨物進出口的重要門戶？", "opts": [["A", "淡水港與安平港"], ["B", "鹿港與旗後港"], ["C", "花蓮港與蘇澳港"], ["D", "基隆港與高雄港"]], "ans": "D", "exp": "總督府整建基隆港與高雄港，使其可停泊大型船隻，作為臺灣貨物進出口的重要門戶。"}, {"stem": "下列何者不屬於日治時期總督府所推動的通訊建設？", "opts": [["A", "郵局"], ["B", "廣播電臺"], ["C", "電報"], ["D", "電話"]], "ans": "B", "exp": "課本提到總督府設立郵局、電報及電話等通訊系統，加強各地聯繫；廣播電臺並非本課提及的通訊建設項目。"}, {"stem": "清帝國統治晚期，臺灣巡撫劉銘傳曾嘗試修築鐵路，但最後只完成到下列何處？", "opts": [["A", "新竹"], ["B", "高雄"], ["C", "臺中"], ["D", "花蓮"]], "ans": "A", "exp": "劉銘傳原本希望修築連通臺北至高雄的鐵路，但因技術限制與經費等因素，最後鐵路只修築到新竹，無法達成原訂的載客運貨目標。"}, {"stem": "日治時期臺灣縱貫鐵路工程，是在下列何人的策畫下歷經九年興築完工？", "opts": [["A", "後藤新平"], ["B", "兒玉源太郎"], ["C", "長谷川謹介"], ["D", "八田與一"]], "ans": "C", "exp": "總督府從西元1899年推動臺灣縱貫鐵路工程，在總工程師長谷川謹介的策畫下，歷經九年興築，於西元1908年正式開通。"}, {"stem": "總督府積極推展臺灣各項交通建設，其主要目的是下列何者？", "opts": [["A", "提升原住民自治地位"], ["B", "促進臺灣人民政治參與"], ["C", "廢除專賣制度"], ["D", "強化對各地的控制，並獲取臺灣資源"]], "ans": "D", "exp": "總督府為強化控制各地，以及獲取臺灣資源，積極推展鐵路、港口與通訊等各項交通建設。"}, {"stem": "總督府所推動的各項基礎建設（調查、貨幣、交通等），對臺灣帶來的整體影響，下列敘述何者最為正確？", "opts": [["A", "使臺灣完全脫離殖民統治"], ["B", "有助於臺灣日後工業化發展，並增強日本企業對臺投資意願"], ["C", "使臺灣的財政持續仰賴日本國庫補助"], ["D", "促成臺灣人民全面掌控經濟資源"]], "ans": "B", "exp": "課本指出，總督府推動的各項基礎建設，不但有助於臺灣日後工業化的發展，也增強了日本民間企業對臺灣投資的意願。"}, {"stem": "日治初期總督府推動的「工業日本，農業臺灣」政策，其主要內涵是下列何者？", "opts": [["A", "臺灣作為農產原料供應地，以配合日本本土的工業化需求"], ["B", "臺灣全面發展重工業，日本負責農業生產"], ["C", "總督府停止在臺灣的一切經濟建設"], ["D", "臺灣與日本各自發展互不往來的經濟體系"]], "ans": "A", "exp": "「工業日本，農業臺灣」是指臺灣作為蔗糖、稻米等農產品的生產地，以供應日本本土工業化後的民生需求，形成臺、日之間的分工體系。"}, {"stem": "在「工業日本，農業臺灣」政策下，總督府推動的農業建設不包括下列何者？", "opts": [["A", "發展新式製糖業"], ["B", "改良稻作（培育蓬萊米）"], ["C", "興建日月潭水力發電所"], ["D", "興修水利設施（如嘉南大圳）"]], "ans": "C", "exp": "日月潭水力發電所屬於後期「工業臺灣，農業南洋」階段配合南進政策的電力建設，並非前期「工業日本，農業臺灣」的農業建設項目。"}, {"stem": "總督府為提高蔗糖產量，採取了下列何種做法？", "opts": [["A", "禁止臺灣人民種植甘蔗"], ["B", "扶植資本家（日本企業）設立新式製糖廠"], ["C", "將製糖業收歸政府直接經營"], ["D", "全面禁止蔗糖外銷"]], "ans": "B", "exp": "總督府透過資金援助與各種保護措施，扶植資本家設立新式製糖廠，並擴大蔗園種植面積，使臺灣製糖業蓬勃發展。"}, {"stem": "由於新式製糖業蓬勃發展，臺灣在日治時期獲得下列何種稱號？", "opts": [["A", "米倉王國"], ["B", "森林王國"], ["C", "鐵道王國"], ["D", "糖業王國"]], "ans": "D", "exp": "總督府扶植新式製糖廠，使臺灣製糖業快速發展，蔗糖產量大增，因而獲得「糖業王國」的稱號。"}, {"stem": "總督府規定農民只能將甘蔗販售給指定的新式糖廠，不得自由買賣，這種制度稱為下列何者？", "opts": [["A", "專賣制度"], ["B", "保甲制度"], ["C", "原料採集區域制度"], ["D", "土地調查制度"]], "ans": "C", "exp": "總督府劃定各製糖會社專屬的原料採集區域，規定區域內的蔗農只能將甘蔗賣給指定糖廠，藉此避免糖廠間的原料競爭，也使蔗農喪失議價能力。"}, {"stem": "民間流傳「第一戇，種甘蔗予會社磅」的俗諺，主要反映出下列何種現象？", "opts": [["A", "糖廠常刻意壓低甘蔗收購價格，蔗農備受剝削"], ["B", "種植甘蔗獲利豐厚，人人搶種"], ["C", "稻米產量因此大幅減少"], ["D", "原住民被迫遷離山區"]], "ans": "A", "exp": "糖廠可單方面決定甘蔗的秤重及收購價格，常刻意壓低價格、在秤重時動手腳，使蔗農深感不滿，因而出現此俗諺。"}, {"stem": "臺灣第一家現代化製糖工廠「橋仔頭製糖廠」位於今日何處？", "opts": [["A", "臺北市"], ["B", "臺中市"], ["C", "臺南市"], ["D", "高雄市橋頭區"]], "ans": "D", "exp": "橋仔頭製糖廠位於今高雄市橋頭區，是臺灣第一家採用現代化機械生產的製糖工廠。"}, {"stem": "相較於傳統糖廍以人力或獸力榨蔗汁再人工熬製，新式製糖廠有何改變？", "opts": [["A", "完全停止使用機械"], ["B", "引進現代化機械，並藉鐵路運送甘蔗與蔗糖，提升效率與品質"], ["C", "改以人工方式製糖以確保品質"], ["D", "將製糖廠全數遷往日本本土"]], "ans": "B", "exp": "新式製糖廠引進現代化機械取代人力、獸力榨汁，並藉由鐵路運送甘蔗與蔗糖，降低運輸成本、提升製糖效率與品質。"}, {"stem": "在總督府扶植新式製糖業、保護資本家的政策下，下列敘述何者最符合史實？", "opts": [["A", "主要受益者是日本企業，蔗農常受到糖廠剝削"], ["B", "蔗農獲利遠高於製糖會社"], ["C", "總督府完全不介入糖業經營"], ["D", "臺灣糖業因此逐漸沒落"]], "ans": "A", "exp": "新式製糖業雖使部分蔗農收益略增，但主要受益者仍是日本企業；在總督府保護資本家的措施下，糖廠常壓榨、剝削蔗農。"}, {"stem": "新式製糖業能夠快速發展，與下列哪一項基礎建設關係最密切？", "opts": [["A", "專賣制度"], ["B", "統一貨幣"], ["C", "鐵路等交通建設，便於運送甘蔗與蔗糖"], ["D", "戶口調查"]], "ans": "C", "exp": "鐵路等交通建設的完善，使甘蔗與蔗糖得以更有效率地運送到糖廠與港口，降低運輸成本，有助於新式製糖業的快速發展。"}, {"stem": "總督府引進新耕作技術，培植出符合日本人口味、產量較高的稻米新品種，稱為下列何者？", "opts": [["A", "秈稻"], ["B", "在來米"], ["C", "糯米"], ["D", "蓬萊米"]], "ans": "D", "exp": "總督府引進新的農耕技術，推動品種改良，成功培植出符合日人口味、產量較高的「蓬萊米」，使稻米產量增加，可大量銷往日本。"}, {"stem": "課本提到，蓬萊米品種是由下列何人（或其團隊）改良研發成功？", "opts": [["A", "後藤新平"], ["B", "磯永吉"], ["C", "八田與一"], ["D", "長谷川謹介"]], "ans": "B", "exp": "總督府委託磯永吉等學者改良臺灣原有的稻米品種，研發出符合日本人口味、產量較高的「蓬萊米」。"}, {"stem": "許多臺灣農民選擇改種蓬萊米，最主要的原因是下列何者？", "opts": [["A", "蓬萊米種植面積較小，容易照顧"], ["B", "總督府強制規定農民只能種植蓬萊米"], ["C", "稻米輸往日本可獲得較高收益"], ["D", "蓬萊米不需要灌溉水利設施"]], "ans": "C", "exp": "由於稻米輸往日本可以獲得較多收益，許多臺灣農民因此選擇改種產量較高、符合日人口味的蓬萊米。"}, {"stem": "在「農業臺灣」政策推動下，臺灣的蔗糖與稻米產量出現下列何種變化？", "opts": [["A", "產量進一步提升，並大量銷往日本"], ["B", "產量大幅下降"], ["C", "僅蔗糖產量提升，稻米產量下降"], ["D", "產量提升但完全供臺灣本地使用"]], "ans": "A", "exp": "在新式製糖業、稻作改良與水利建設的共同影響下，臺灣的蔗糖與稻米產量都進一步提升，並大量銷往日本，以配合殖民母國的需求。"}, {"stem": "翰林版課本引用「臺灣新文學之父」賴和的小說，描述蔗農秤重甘蔗時遭受剝削的情形，這與下列哪一句俗諺所呈現的情境最為相似？", "opts": [["A", "有唐山公，無唐山媽"], ["B", "臺灣頭，臺灣尾"], ["C", "一府二鹿三艋舺"], ["D", "三個保正，八十斤"]], "ans": "D", "exp": "賴和小說描述蔗農秤重時遭糖廠會社剝削的不合理現象，與日治時期諺語「三個保正，八十斤」所呈現會社剝削蔗農、秤重不實的情境相似。"}, {"stem": "嘉南大圳是由下列何人設計監造，是日治時期臺灣規模最大的水利設施？", "opts": [["A", "後藤新平"], ["B", "八田與一"], ["C", "磯永吉"], ["D", "長谷川謹介"]], "ans": "B", "exp": "八田與一發揮其土木專業能力，設計監造嘉南大圳，是日治時期臺灣規模最大的水利工程。"}, {"stem": "嘉南大圳是在西元哪一年完工？", "opts": [["A", "1930年"], ["B", "1908年"], ["C", "1919年"], ["D", "1934年"]], "ans": "A", "exp": "嘉南大圳於西元1930年完工，增加了嘉南平原的灌溉面積，是日治時期臺灣最重要的水利工程之一。"}, {"stem": "嘉南大圳完工後，其灌溉水源主要來自下列何處？", "opts": [["A", "日月潭"], ["B", "石門水庫"], ["C", "烏山頭水庫"], ["D", "曾文水庫"]], "ans": "C", "exp": "嘉南大圳的灌溉水源主要來自烏山頭水庫，八田與一的銅像至今仍立於烏山頭水庫旁，紀念他對臺灣水利建設的貢獻。"}, {"stem": "嘉南大圳完工後，對嘉南平原帶來的主要影響是下列何者？", "opts": [["A", "水旱田面積比例不變"], ["B", "稻米、甘蔗產量因缺水而下降"], ["C", "原住民生活空間因此擴大"], ["D", "灌溉面積增加，稻米、甘蔗產量逐漸提高"]], "ans": "D", "exp": "嘉南大圳完工後，嘉南平原的灌溉面積大幅增加，原本「看天吃飯」的水旱田轉為穩定灌溉的良田，使稻米、甘蔗產量逐漸提高。"}, {"stem": "1930年代，日本推動南進政策，將經濟政策由「工業日本，農業臺灣」調整為下列何者？", "opts": [["A", "農業日本，工業臺灣"], ["B", "工業臺灣，農業南洋"], ["C", "工業南洋，農業臺灣"], ["D", "農業南洋，工業日本"]], "ans": "B", "exp": "1930年代起，日本推動南進政策，將臺灣視為前進南洋的補給基地，經濟政策調整為「工業臺灣，農業南洋」，致力於推動工業化。"}, {"stem": "日本推動南進政策，主要目的是希望藉由臺灣取得下列何種資源？", "opts": [["A", "東南亞（南洋）的石油、橡膠等資源"], ["B", "中國大陸的煤鐵資源"], ["C", "臺灣原住民的傳統領域"], ["D", "歐美國家的先進技術"]], "ans": "A", "exp": "日本以南洋（東南亞）等地為侵略目標，希望藉此取得當地豐富的石油、橡膠等資源，並將臺灣當作重要的南進補給基地。"}, {"stem": "日月潭水力發電所是在西元哪一年完工？", "opts": [["A", "1908年"], ["B", "1919年"], ["C", "1934年"], ["D", "1945年"]], "ans": "C", "exp": "總督府為因應臺灣的用電需求，著手各項電力開發計畫，日月潭水力發電所於西元1934年完工。"}, {"stem": "日月潭水力發電所完工後，帶來的主要影響是下列何者？", "opts": [["A", "使臺灣糖業因此沒落"], ["B", "促成縱貫鐵路的興建"], ["C", "使臺灣人口普查得以順利完成"], ["D", "為工業發展與民生需求提供充足電力，曾是亞洲最大發電廠"]], "ans": "D", "exp": "日月潭水力發電所完工後，為臺灣西半部的工業發展與民生需求提供充足穩定的電力，當時是亞洲最大的發電廠。"}, {"stem": "負責興建日月潭水力發電所的「臺灣電力株式會社」，是由下列何種方式成立？", "opts": [["A", "完全由臺灣民間人士獨立出資成立"], ["B", "由臺灣總督府與民間合資成立"], ["C", "由日本天皇直接下令成立"], ["D", "由蔗農集資成立"]], "ans": "B", "exp": "西元1919年成立的臺灣電力株式會社，是由臺灣總督府與民間合資成立，其主要任務是興建日月潭水力發電所。"}, {"stem": "南進政策推動後，總督府在臺灣積極發展下列哪一類工業，以配合戰爭需求？", "opts": [["A", "機械、石化等軍需工業"], ["B", "紡織、食品加工等輕工業"], ["C", "傳統糖廍產業"], ["D", "稻米栽培技術"]], "ans": "A", "exp": "為配合南進政策與戰爭需求，總督府積極發展機械、石化、金屬、造船等軍需工業，以支援日本的對外擴張。"}, {"stem": "日治後期，臺灣除了軍需工業外，下列哪一類工業也有顯著成長？", "opts": [["A", "造船、金屬等重工業"], ["B", "專賣事業"], ["C", "紡織、食品加工等輕工業"], ["D", "縱貫鐵路修築工程"]], "ans": "C", "exp": "這段時期，總督府一方面積極發展軍需工業，另一方面紡織、食品加工等輕工業也有顯著成長。"}, {"stem": "日治時期臺灣重要的食品加工業產品「鳳梨罐頭」，最能反映出下列哪一項工業類型的發展？", "opts": [["A", "軍需工業"], ["B", "專賣事業"], ["C", "電力工業"], ["D", "輕工業（食品加工業）"]], "ans": "D", "exp": "鳳梨罐頭是日治時期重要的食品加工業產品，屬於輕工業（民生工業）的代表，說明當時輕工業也有顯著發展。"}, {"stem": "課本描述「日治後期的臺灣處於從農業社會邁向工業社會的過渡階段」，這句話最能說明下列何者？", "opts": [["A", "臺灣經濟發展已完全脫離農業"], ["B", "臺灣經濟型態正逐漸從農業為主轉變為工業為主"], ["C", "臺灣的糖業與稻作生產已全面停止"], ["D", "臺灣在此階段完全沒有工業建設"]], "ans": "B", "exp": "這句話說明日治後期臺灣的經濟型態正處於轉型階段，逐漸從以農業為主的經濟結構，轉變為工業比重逐漸提高的社會，並非農業已完全消失。"}, {"stem": "課本提及，位於今新北市新店區、西元1909年完工的發電所，是臺灣目前仍在運轉中最古老的水力發電廠，指的是下列何者？", "opts": [["A", "日月潭水力發電所"], ["B", "烏山頭發電所"], ["C", "小粗坑發電所"], ["D", "大觀發電廠"]], "ans": "C", "exp": "小粗坑發電所位於今新北市新店區，西元1909年完工，是臺灣目前仍在運轉中、歷史最悠久的水力發電廠。"}, {"stem": "比較日治時期前後兩期的經濟政策，下列敘述何者正確？", "opts": [["A", "前期以農業臺灣（米糖生產）為主，後期因南進政策轉向推動工業化"], ["B", "前期即以工業化為主，後期才發展農業"], ["C", "兩階段的經濟政策完全相同，未曾改變"], ["D", "臺灣的經濟政策始終未配合日本的需求"]], "ans": "A", "exp": "日治前期總督府推動「工業日本，農業臺灣」，以生產米、糖為主；1930年代起因應南進政策，調整為「工業臺灣，農業南洋」，開始積極推動工業化。"}, {"stem": "日治初期，總督府推動的各項調查工作（土地、林野、戶口）與統一貨幣等基礎建設，主要是配合下列何種統治考量？", "opts": [["A", "培養臺灣人民自治能力"], ["B", "促進原住民傳統文化保存"], ["C", "完全遵循清帝國舊有制度"], ["D", "強化殖民統治基礎，並為資本家創造有利的投資環境"]], "ans": "D", "exp": "總督府在臺推動各項調查工作，作為統治的基礎，並藉此為日本資本家創造有利的投資環境，以利日後各項經濟建設的推展。"}, {"stem": "綜觀日治時期臺灣經濟發展的各項政策與建設，下列敘述何者最為正確？", "opts": [["A", "臺灣經濟發展完全獨立於日本之外，不受殖民母國需求影響"], ["B", "總督府的經濟建設兼具現代化與殖民化特色，主要為配合日本的需求與利益"], ["C", "日治時期臺灣未曾出現任何現代化建設"], ["D", "臺灣的農業與工業發展與日本經濟政策毫無關聯"]], "ans": "B", "exp": "日治時期總督府的經濟政策一方面在臺推動現代化基礎建設，另一方面前期發展農業、後期推動工業化，皆是為了配合殖民母國日本的需求與利益，兼具現代化與殖民化的雙重特色。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

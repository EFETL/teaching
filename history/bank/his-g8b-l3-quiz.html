<script>
const QS=[{"stem": "民國12年，孫中山為了對抗軍閥、壯大革命力量，決定採取下列哪一項政策？", "opts": [["A", "攘外必先安內"], ["B", "聯俄容共"], ["C", "以黨治國"], ["D", "廢兩改元"]], "ans": "B", "exp": "民國12年，孫中山主張「聯俄容共」，同意中共黨員以個人身分加入國民黨，並藉此爭取蘇聯的經費、武器等援助。"}, {"stem": "關於「聯俄容共」政策的實際做法，下列敘述何者正確？", "opts": [["A", "國民黨與中共組成聯合政府，共同執政"], ["B", "國民黨解散，全面改組為共產黨"], ["C", "中共黨員以個人身分加入國民黨，國民黨換取蘇聯援助"], ["D", "蘇聯出兵協助國民黨北伐統一全國"]], "ans": "C", "exp": "聯俄容共的做法是讓中共黨員以個人身分加入國民黨，而非兩黨對等結盟或組成聯合政府，國民黨則藉此換取蘇聯的援助。"}, {"stem": "孫中山推動「聯俄容共」，最主要是希望藉此換取蘇聯提供下列哪一項協助？", "opts": [["A", "經費、武器等援助"], ["B", "承認中華民國的國際地位"], ["C", "割讓部分領土以求和平"], ["D", "直接派兵消滅各地軍閥"]], "ans": "A", "exp": "課本記載，孫中山採行聯俄容共，是為了換取蘇聯的經費、武器等援助，以壯大革命武力對抗軍閥。"}, {"stem": "下列有關聯俄容共時期國共兩黨關係的敘述，何者最為正確？", "opts": [["A", "兩黨地位完全對等、共同組成聯合內閣"], ["B", "中共完全併入國民黨，兩黨從此合一"], ["C", "兩黨互不往來，僅由蘇聯居中協調"], ["D", "中共黨員以個人身分加入國民黨，而非兩黨對等結盟"]], "ans": "D", "exp": "聯俄容共並非國共兩黨對等結盟，而是中共黨員以個人身分加入國民黨，國民黨本身組織與立場並未改變。"}, {"stem": "民國13年，孫中山在蘇聯協助下，於廣州何處創辦陸軍軍官學校（通稱黃埔軍校）？", "opts": [["A", "珠江"], ["B", "黃埔"], ["C", "廣州灣"], ["D", "虎門"]], "ans": "B", "exp": "民國13年，孫中山在蘇聯協助下於廣州黃埔創辦陸軍軍官學校，因位於黃埔而通稱「黃埔軍校」。"}, {"stem": "黃埔軍校成立的主要目的為何？", "opts": [["A", "培養革命武力，以打倒軍閥"], ["B", "訓練外交人才，對抗列強"], ["C", "培育經濟建設人才"], ["D", "訓練警察維持地方治安"]], "ans": "A", "exp": "黃埔軍校的設立，目的在培養革命武力，作為日後北伐、打倒各地軍閥的軍事基礎。"}, {"stem": "黃埔軍校成立時，出任校長、日後逐漸掌握軍權而成為國民黨重要領導人之一的是下列何人？", "opts": [["A", "孫中山"], ["B", "張學良"], ["C", "蔣中正"], ["D", "汪精衛"]], "ans": "C", "exp": "蔣中正出任黃埔軍校校長，因掌控軍權，此後逐漸成為國民黨及國民政府的主要領導人之一。"}, {"stem": "民國14年，孫中山逝世後，廣州政府隨即改組為下列何者，與北京政府南北對立？", "opts": [["A", "中華蘇維埃政府"], ["B", "武漢國民政府"], ["C", "中華民國臨時政府"], ["D", "國民政府"]], "ans": "D", "exp": "民國14年孫中山病逝後，廣州政府改組為「國民政府」，與當時的北京政府形成南北分立的局面。"}, {"stem": "下列有關孫中山逝世後政局發展的敘述，何者正確？", "opts": [["A", "廣州政府改組為國民政府，持續與北京政府對立"], ["B", "國民黨隨即宣布解散"], ["C", "中共取得廣州政權的主導權"], ["D", "全國立即統一，結束南北分裂"]], "ans": "A", "exp": "孫中山逝世後，廣州政府改組為國民政府，但此時全國尚未統一，仍與北京政府形成南北分立的局面，直到北伐完成後才改變。"}, {"stem": "民國15年，國民政府命何人率軍北伐，展開統一全國的軍事行動？", "opts": [["A", "張學良"], ["B", "蔣中正"], ["C", "汪精衛"], ["D", "張作霖"]], "ans": "B", "exp": "民國15年，國民政府命蔣中正率軍北伐，陸續擊敗各地軍閥。"}, {"stem": "北伐的主要目的為何？", "opts": [["A", "對抗日本的侵略"], ["B", "收回香港、澳門主權"], ["C", "消滅中國共產黨"], ["D", "討伐各地軍閥，統一全國"]], "ans": "D", "exp": "北伐是國民政府為結束軍閥割據局面而發動的軍事行動，目的在討伐各地軍閥、統一全國，並非以消滅中共或對抗日本為出發點。"}, {"stem": "北伐軍展開軍事行動後，最初面對的主要對象是下列何者？", "opts": [["A", "日本占領軍"], ["B", "蘇聯紅軍"], ["C", "割據各地的軍閥"], ["D", "中共領導的紅軍"]], "ans": "C", "exp": "北伐的直接軍事對象是當時割據各地的軍閥，國共兩黨的衝突則是在北伐過程中才逐漸浮現、激化。"}, {"stem": "下列關於北伐起訖的敘述，何者正確？", "opts": [["A", "民國14年開始，17年完成"], ["B", "民國15年開始，17年完成"], ["C", "民國15年開始，19年完成"], ["D", "民國16年開始，20年完成"]], "ans": "B", "exp": "依課本記載，北伐始於民國15年，至民國17年張學良宣布歸順、東北易幟後，中華民國歸於統一，北伐至此完成。"}, {"stem": "北伐期間，國共兩黨關係出現何種變化？", "opts": [["A", "因爭奪領導權而分裂，終致決裂"], ["B", "合作更加緊密，共組聯合政府"], ["C", "中共退出中國，遷往蘇聯"], ["D", "國民黨主動邀請中共取得政權"]], "ans": "A", "exp": "北伐過程中，國共雙方為爭奪領導權而逐漸產生嫌隙，最終導致蔣中正決定清黨，兩黨關係正式決裂。"}, {"stem": "民國16年，國民政府遷往武漢後，發生下列何種情況，促使蔣中正決定清黨？", "opts": [["A", "武漢政府遭日軍占領"], ["B", "武漢政府宣布向日本投降"], ["C", "武漢政府被地方軍閥推翻"], ["D", "武漢政府被親共人士把持"]], "ans": "D", "exp": "國民政府遷往武漢後，政府實際上被親共人士所把持，蔣中正因此決定在南京另立政府，並展開清黨行動。"}, {"stem": "「清黨」是指蔣中正採取下列哪一項行動？", "opts": [["A", "解散國民黨，另組新黨"], ["B", "與中共協商，和平分家"], ["C", "以武力清除國民黨內的中共分子"], ["D", "開除黨內主張北伐的將領"]], "ans": "C", "exp": "清黨是指蔣中正以武力手段清除國民黨內部的共產黨分子，是國共第一次合作走向破裂的關鍵事件。"}, {"stem": "蔣中正清黨後，另於何處成立國民政府，與武漢政府對立？", "opts": [["A", "南京"], ["B", "上海"], ["C", "廣州"], ["D", "北京"]], "ans": "A", "exp": "蔣中正清除黨內共黨分子後，宣布定都南京、另立國民政府，與當時被親共人士把持的武漢政府形成對立。"}, {"stem": "下列關於「寧漢分裂」後續發展的敘述，何者正確？", "opts": [["A", "武漢政府始終與南京政府對抗到底"], ["B", "武漢政府其後結束與共產黨的合作，併入南京政府"], ["C", "南京政府解散，合併入武漢政府"], ["D", "兩個政府同時被中共推翻"]], "ans": "B", "exp": "南京、武漢兩政府對立一段時間後，武漢政府結束與共產黨的合作，最終併入南京國民政府，國民黨內部重新歸於一統。"}, {"stem": "國民黨清黨、南京國民政府成立後，接下來採取了下列何種行動？", "opts": [["A", "停止一切軍事行動，與各方休兵"], ["B", "立即向日本宣戰"], ["C", "全面實施憲政，還政於民"], ["D", "繼續推動北伐，進軍北方"]], "ans": "D", "exp": "國共決裂、南京國民政府確立後，國民黨並未停止軍事行動，而是繼續推動北伐，最終於民國17年完成統一。"}, {"stem": "民國17年，北伐軍攻入北京後，統治東北的軍閥張學良做出下列何種決定，使中華民國完成統一？", "opts": [["A", "聯合日本對抗國民政府"], ["B", "宣布東北獨立建國"], ["C", "宣布歸順南京國民政府"], ["D", "遷都瀋陽，另立政府"]], "ans": "C", "exp": "民國17年，控制東北的軍閥張學良宣布歸順南京國民政府，使中華民國自此歸於統一，北伐大業完成。"}, {"stem": "張學良之父張作霖之死與下列何一事件有關？", "opts": [["A", "九一八事變"], ["B", "皇姑屯事件，遭日軍炸死"], ["C", "西安事變"], ["D", "長征途中遇襲身亡"]], "ans": "B", "exp": "民國17年，張作霖見大勢已去、搭乘鐵路專車返回東北途中，於皇姑屯遭日軍炸死，史稱「皇姑屯事件」。"}, {"stem": "張作霖遇害後，對其子張學良的決定造成下列何種影響？", "opts": [["A", "促使張學良投靠日本，尋求庇護"], ["B", "使東北陷入長期軍閥混戰"], ["C", "使張學良從此退出政壇"], ["D", "加深張學良對日軍的忌恨，並宣布服從國民政府"]], "ans": "D", "exp": "張作霖遭日軍炸死後，張學良繼承父業、統治東北，並因加深對日軍的忌恨而宣布服從國民政府，反而加速促成中國統一。"}, {"stem": "民國17年張學良歸順國民政府一事，一般稱為下列何者？", "opts": [["A", "東北易幟"], ["B", "西安事變"], ["C", "九一八事變"], ["D", "寧漢分裂"]], "ans": "A", "exp": "張學良宣布歸順南京國民政府、改用國民政府旗幟，此舉稱為「東北易幟」，象徵中華民國完成形式上的統一。"}, {"stem": "依據孫中山《建國大綱》的規劃，國家建設應循序經歷下列哪三個階段？", "opts": [["A", "帝制、共和、憲政"], ["B", "割據、統一、憲政"], ["C", "軍政、訓政、憲政"], ["D", "軍政、共和、民主"]], "ans": "C", "exp": "孫中山在《建國大綱》中，將國家建設規劃為軍政、訓政、憲政三個階段，作為國民政府施政的依循方向。"}, {"stem": "北伐統一後，國民政府依《建國大綱》規劃，宣布全國進入下列哪一個時期？", "opts": [["A", "軍政時期"], ["B", "訓政時期"], ["C", "憲政時期"], ["D", "抗戰時期"]], "ans": "B", "exp": "北伐完成、以武力統一全國之後，依建國大綱的規劃，國民政府隨即宣布全國進入「訓政時期」。"}, {"stem": "國民政府在訓政時期頒布下列何種法規，作為施政的根本依據？", "opts": [["A", "中華民國憲法"], ["B", "建國方略"], ["C", "三民主義"], ["D", "中華民國訓政時期約法"]], "ans": "D", "exp": "國民政府在訓政時期頒布《中華民國訓政時期約法》，做為國家正式行憲前的根本大法。"}, {"stem": "訓政時期，國家政治權力主要掌握在下列何者手中？", "opts": [["A", "中國國民黨，以黨治國"], ["B", "全體國民直選的國會"], ["C", "各省軍閥聯合組成的委員會"], ["D", "中國共產黨"]], "ans": "A", "exp": "訓政時期由中國國民黨代為行使政府職權，黨組織與政府組織高度重疊，即所謂「以黨治國」。"}, {"stem": "訓政時期以黨治國、黨政高度重疊的做法，在當時引起下列何種反應？", "opts": [["A", "全國一致擁護，毫無異議"], ["B", "獲得日本高度肯定"], ["C", "引發不少輿論批評"], ["D", "促成國共立即再度合作"]], "ans": "C", "exp": "訓政時期由國民黨一黨執政、掌握絕對政治權力，這種黨國合一的體制在當時引發不少輿論批評。"}, {"stem": "十年建設期間，國民政府與列強談判修改條約，成功取得下列哪一項權利？", "opts": [["A", "治外法權"], ["B", "關稅自主權"], ["C", "領事裁判權"], ["D", "租界管理權"]], "ans": "B", "exp": "十年建設期間，國民政府積極與列強談判修改不平等條約，成功取消協定關稅，收回關稅自主權。"}, {"stem": "十年建設期間，國民政府為統一貨幣、解決幣制混亂，發行下列何種法定貨幣？", "opts": [["A", "銀元"], ["B", "銀兩"], ["C", "關金券"], ["D", "法幣"]], "ans": "D", "exp": "國民政府在幣制改革中發行「法幣」，意為法定貨幣，有利於貨幣統一與經濟發展，解決了長期幣制混亂的問題。"}, {"stem": " let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "原住民在西方勢力來臺以前，經濟生活以下列何者為主？", "opts": [["A", "漁獵與游耕"], ["B", "農耕與畜牧"], ["C", "商業貿易"], ["D", "遠洋捕魚"]], "ans": "A", "exp": "原住民早期的經濟生活以漁獵、游耕為主，種植小米、芋頭等作物，平日以標槍、弓箭獵捕野鹿。"}, {"stem": "「游耕」是原住民傳統的耕作方式，下列敘述何者正確？", "opts": [["A", "使用固定耕地，長期施肥耕作"], ["B", "引進水稻品種，長期耕種同一塊地"], ["C", "先砍樹整地，以焚燒林木後的灰燼作肥料，地力耗盡後再遷移耕地"], ["D", "僅種植進口作物，不需整地"]], "ans": "C", "exp": "游耕是指先砍樹整地，以焚燒林木後的灰燼作為肥料，播種等待收成；耕地使用數年、地力耗盡後便另尋新耕地。"}, {"stem": "原住民早期主要種植的作物為何？", "opts": [["A", "稻米、甘蔗"], ["B", "番薯、玉米"], ["C", "茶葉、咖啡"], ["D", "小米、芋頭"]], "ans": "D", "exp": "課本明確記載原住民早期種植小米、芋頭等作物。"}, {"stem": "十六世紀，臺灣原住民已與哪些外來群體有貿易往來？", "opts": [["A", "只有荷蘭人"], ["B", "漢人與日本商人"], ["C", "只有西班牙人"], ["D", "只有葡萄牙人"]], "ans": "B", "exp": "在荷蘭、西班牙來臺之前，原住民已因東亞貿易興盛，與漢人、日本商人有頻繁往來。"}, {"stem": "「麻豆社事件」的起因為何？", "opts": [["A", "荷蘭人強占原住民農地"], ["B", "麻豆社與新港社爭奪獵場"], ["C", "麻豆社原住民不滿荷蘭壓迫，藉機殺害荷蘭士兵"], ["D", "荷蘭人拒絕與麻豆社進行貿易"]], "ans": "C", "exp": "麻豆社原住民不滿荷蘭統治壓迫，曾藉機殺害荷蘭士兵，此即「麻豆社事件」。"}, {"stem": "荷蘭人為鎮壓不服從的麻豆社，聯合下列哪一原住民部落出兵？", "opts": [["A", "新港社"], ["B", "目加溜灣社"], ["C", "蕭壠社"], ["D", "大肚王"]], "ans": "A", "exp": "荷蘭聯合西拉雅族新港社（今臺南市新市區）攻打麻豆社，迫使麻豆社簽訂條約。"}, {"stem": "「麻豆社事件」（麻豆社之役）最終如何落幕？", "opts": [["A", "麻豆社擊退荷蘭聯軍"], ["B", "荷蘭放棄南臺灣的統治"], ["C", "雙方永久停戰、互不侵犯"], ["D", "麻豆社簽訂條約，接受荷蘭治理"]], "ans": "D", "exp": "1635年荷蘭聯合新港社攻打麻豆社，麻豆社不敵投降，簽訂條約，接受荷蘭人治理，此役也奠定荷蘭在南臺灣的統治權。"}, {"stem": "「大肚王」（大肚王國）的勢力範圍主要位於今日何處？", "opts": [["A", "臺南、高雄一帶"], ["B", "臺中、彰化、南投一帶"], ["C", "基隆、淡水一帶"], ["D", "花蓮、臺東一帶"]], "ans": "B", "exp": "大肚王國由數十個原住民部落組成的聯盟，勢力分布於今臺中、彰化、南投一帶，為中部跨部落聯盟的領袖。"}, {"stem": "荷蘭人與中部大肚王之間的關係為何？", "opts": [["A", "荷蘭多次對大肚王轄區發動攻勢，迫使其歸順"], ["B", "大肚王主動歸順並協助荷蘭統治其他部落"], ["C", "大肚王與荷蘭結盟共同對抗西班牙"], ["D", "荷蘭從未與大肚王發生衝突"]], "ans": "A", "exp": "隨著荷蘭統治勢力由南往北擴張，與大肚王的衝突日趨激烈，荷蘭多次出兵攻擊，迫使大肚王與其訂約接受管轄。"}, {"stem": "荷蘭統治初期對原住民採取的政策，下列敘述何者正確？", "opts": [["A", "完全放任原住民自治"], ["B", "立即與所有部落簽訂平等條約"], ["C", "僅以貿易利誘，不使用武力"], ["D", "憑優勢武力征服部落，並利用部落間的矛盾各個擊破"]], "ans": "D", "exp": "荷蘭統治初期憑藉優勢武力，征服大員周遭部落，並利用不同部落、族群間的矛盾，聯合歸順部落鎮壓反抗勢力。"}, {"stem": "下列關於荷蘭「地方會議」的敘述，何者正確？", "opts": [["A", "由原住民長老主持，荷蘭官員列席"], ["B", "會議只討論貿易事務，不涉及政令宣達"], ["C", "荷蘭長官在會議中賦予長老權杖，象徵治理權威"], ["D", "每月召開一次"]], "ans": "C", "exp": "荷蘭長官在地方會議中，將鑲有聯合東印度公司徽章的籐製權杖頒授給各部落代表，象徵授予其治理部落的權力。"}, {"stem": "荷蘭長官與原住民長老在地方會議中的座位安排，反映了什麼？", "opts": [["A", "雙方地位平等"], ["B", "荷蘭長官高坐涼亭中，長老坐於低矮座椅，顯示雙方上下從屬關係"], ["C", "長老地位高於荷蘭長官"], ["D", "座位安排沒有特殊意義"]], "ans": "B", "exp": "圖像史料顯示荷蘭駐臺長官高坐涼亭中，原住民各族長老則坐在亭外的低矮座椅，藉此表現雙方的上下從屬關係。"}, {"stem": "原住民長老參加地方會議的任務，不包括下列何者？", "opts": [["A", "向聯合東印度公司宣誓效忠"], ["B", "報告部落統治狀況"], ["C", "協助調解部落糾紛"], ["D", "自行決定是否向西班牙繳稅"]], "ans": "D", "exp": "長老在地方會議中須宣誓效忠、報告部落狀況、協助宣達政令與調解糾紛，這是對「荷蘭」統治的義務，與西班牙徵稅無關，此選項為課本未提及、且邏輯不通之敘述。"}, {"stem": "荷蘭採取「間接統治」管理原住民，主要透過什麼人來執行？", "opts": [["A", "各社長老"], ["B", "荷蘭派駐各部落的官員"], ["C", "漢人通事"], ["D", "傳教士"]], "ans": "A", "exp": "荷蘭為有效掌控原住民部落，召開地方會議，授予各社長老管理部落的權力，這是一種間接統治的方式。"}, {"stem": "依康軒版課本補充資料，「地方會議」自哪一年起擴大為年度性集會？", "opts": [["A", "1624年"], ["B", "1635年"], ["C", "1644年"], ["D", "1661年"]], "ans": "C", "exp": "課本記載荷蘭人召開歸順部落代表的集會，於西元1644年擴大為年度的「地方會議」，直到1659年每年皆召開。"}, {"stem": "荷蘭統治期間，原住民與荷蘭之間的鹿皮貿易，主要透過何者居中媒介？", "opts": [["A", "西班牙商人"], ["B", "漢人"], ["C", "日本商人"], ["D", "傳教士"]], "ans": "B", "exp": "荷蘭為方便管理，選擇與漢人合作，由漢人向原住民收購鹿皮，再轉賣給荷蘭聯合東印度公司或自行出售。"}, {"stem": "漢人以何種物資向原住民收購鹿皮？", "opts": [["A", "黃金、白銀"], ["B", "稻米、茶葉"], ["C", "槍砲、彈藥"], ["D", "布匹、鹽、鐵器等生活物資"]], "ans": "D", "exp": "課本明白記載漢人以布匹、鹽、鐵器等生活物資，向原住民收購鹿皮。"}, {"stem": "鹿皮貿易興盛對原住民生活造成的影響為何？", "opts": [["A", "鹿群遭大肆捕捉，數量大幅減少"], ["B", "鹿群數量大增"], ["C", "原住民因此放棄所有狩獵活動"], ["D", "對原住民生活毫無影響"]], "ans": "A", "exp": "鹿原本是原住民主要的維生肉食來源，成為貿易商品後遭大肆捕捉，造成鹿群大幅減少，衝擊原住民傳統生活。"}, {"stem": "荷蘭人（及其後鄭氏政權）取得的臺灣鹿皮，主要銷往下列何處？", "opts": [["A", "歐洲"], ["B", "東南亞"], ["C", "日本"], ["D", "美洲"]], "ans": "C", "exp": "依翰林版補充資料，荷蘭人向原住民取得鹿皮輸往日本，顛峰時期每年出口超過十萬張。"}, {"stem": "荷蘭傳教士為便於向原住民傳教，採取了下列哪種做法？", "opts": [["A", "強迫原住民學習荷蘭文"], ["B", "以羅馬字母拼寫新港社（西拉雅族）的語言，教導原住民讀寫"], ["C", "禁止原住民使用自己的語言"], ["D", "只用口語傳教，不留下任何文字紀錄"]], "ans": "B", "exp": "傳教士為便於傳教，以羅馬字母拼寫新港社的語言，教導原住民閱讀及書寫，並翻譯聖經、教授教義。"}, {"stem": "「新港文書」又稱為什麼？", "opts": [["A", "熱蘭遮城日誌"], ["B", "東印度公司條約"], ["C", "大肚王盟約"], ["D", "番仔契"]], "ans": "D", "exp": "直到十九世紀初，南部平埔族群仍使用新港文字與漢人簽訂雙語的土地契約，此即「新港文書」，又稱「番仔契」。"}, {"stem": "「新港文書」主要的用途為何？", "opts": [["A", "漢人與原住民訂定土地契約"], ["B", "記錄荷蘭東印度公司的財務收支"], ["C", "傳教士之間的書信往來"], ["D", "荷蘭官員的人事任命紀錄"]], "ans": "A", "exp": "新港文書是以新港文（羅馬拼音）與漢文對照書寫，用來與漢人簽訂土地契約，甚至附有土地界圖。"}, {"stem": "依課本敘述，南部平埔族群使用新港文字與漢人簽訂雙語土地契約的習慣，一直持續到何時？", "opts": [["A", "十七世紀中葉"], ["B", "十九世紀初"], ["C", "十八世紀末"], ["D", "二十世紀初"]], "ans": "B", "exp": "課本記載直到十九世紀初，南部的平埔族群還使用新港文字與漢人簽訂雙語的土地契約。"}, {"stem": "荷蘭傳教士曾將何種經典翻譯為新港文，作為傳教教材？", "opts": [["A", "荷蘭法典"], ["B", "航海日誌"], ["C", "聖經"], ["D", "東印度公司章程"]], "ans": "C", "exp": "課本附有「荷蘭文與新港文對照的新約聖經 馬太福音」圖片，說明傳教士曾翻譯聖經、教授教義。"}, {"stem": "荷蘭人在原住民部落設立教堂與學校的主要目的為何？", "opts": [["A", "教授航海技術"], ["B", "訓練原住民士兵"], ["C", "培養貿易人才"], ["D", "傳播基督教信仰"]], "ans": "D", "exp": "荷蘭人來臺後，為宣揚基督教教義，在轄區內設立教堂、學校，部分原住民逐漸接受基督教信仰。"}, {"stem": "「郭懷一事件」的性質為何？", "opts": [["A", "漢人不滿荷蘭嚴苛管制而發動的抗荷行動"], ["B", "原住民反抗荷蘭統治的起事"], ["C", "西班牙與荷蘭之間的軍事衝突"], ["D", "鄭氏攻打荷蘭的戰役"]], "ans": "A", "exp": "荷蘭人對來臺開墾的漢人管制嚴苛，引起漢人不滿，1652年郭懷一領導漢人發動抗荷行動，但最終失敗。"}, {"stem": "「郭懷一事件」爆發時，哪一原住民部落協助荷蘭人加以鎮壓？", "opts": [["A", "大肚王"], ["B", "新港社"], ["C", "麻豆社"], ["D", "目加溜灣社"]], "ans": "B", "exp": "荷蘭人與新港社結盟的對象不限於原住民，郭懷一事件爆發時，新港社也協助荷蘭人對付漢人。"}, {"stem": "荷蘭人攻打小琉球（拉美島）原住民的導火線為何？", "opts": [["A", "小琉球原住民拒絕向荷蘭納稅"], ["B", "小琉球原住民與麻豆社結盟對抗荷蘭"], ["C", "荷蘭船隻「金獅子號」船員登島取水，遭原住民視為侵犯領域而殺害"], ["D", "荷蘭人想強占小琉球作為軍事基地"]], "ans": "C", "exp": "1621年荷蘭船隻「金獅子號」停靠小琉球，船員上岸取水，島上原住民認為此舉侵犯自己的領域，加上語言不通，多數船員遭殺害，此事件成為日後荷蘭出兵的遠因。"}, {"stem": "荷蘭人出兵攻打小琉球時，動員了哪些人力組成聯軍？", "opts": [["A", "只有荷蘭士兵"], ["B", "西班牙傭兵"], ["C", "大肚王的軍隊"], ["D", "漢人與新港社等部落"]], "ans": "D", "exp": "荷蘭鞏固臺灣南部統治後，動員漢人、新港社等部落，並派遣數百名士兵組成聯軍攻打小琉球。"}, {"stem": "小琉球戰役後，倖存的原住民面臨何種命運？", "opts": [["A", "部分被送往新港社、熱蘭遮城等地，淪為奴隸或苦力"], ["B", "全數獲釋返鄉，恢復原有生活"], ["C", "全部遷往澎湖定居"], ["D", "荷蘭人協助其重建家園"]], "ans": "A", "exp": "戰役造成近半數小琉球原住民死於戰火，倖存者部分被送往新港社、熱蘭遮城淪為奴隸，部分被送往聯合東印度公司其他據點充當苦力。"}, {"stem": "西班牙人在臺灣北部的統治中心設於何處？", "opts": [["A", "臺南"], ["B", "社寮島（ QS.forEach((q,i)=>{

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){

  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');

  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "科學革命指的是十六、十七世紀以來，西方學者透過觀察、實驗等方法，在哪些知識領域加速創新，使傳統宇宙觀逐漸改變？", "opts": [["A", "醫學與化學"], ["B", "文學與藝術"], ["C", "法律與政治"], ["D", "天文與物理"]], "ans": "D", "exp": "課本明確指出科學革命以天文學最具代表性，物理學（牛頓）亦有重大突破，使傳統的宇宙觀逐漸改變。"}, {"stem": "科學革命的興起，與文藝復興以來哪一種精神的發展有密切關係？", "opts": [["A", "封建莊園的經濟精神"], ["B", "懷疑與探究的理性精神"], ["C", "崇尚武力的騎士精神"], ["D", "服從教會的信仰精神"]], "ans": "B", "exp": "文藝復興以來，歐洲學者透過懷疑與探究的理性精神，重新思索宇宙萬物的運作法則，不再盲目崇信權威，因而帶動科學革命的發展。"}, {"stem": "英國學者培根提倡下列何種研究方法，主張可透過觀察、實驗獲得的事實，歸納出普遍的原則？", "opts": [["A", "演繹法"], ["B", "辯證法"], ["C", "歸納法"], ["D", "考證法"]], "ans": "C", "exp": "培根提出「歸納法」，認為可透過觀察、實驗所獲得的事實，歸納出普遍的原則，是科學革命重要的新研究方法之一。"}, {"stem": "法國學者笛卡兒強調「我思故我在」，並提倡下列何種方法，主張藉由邏輯推演獲得新知？", "opts": [["A", "歸納法"], ["B", "實驗法"], ["C", "觀察法"], ["D", "演繹法"]], "ans": "D", "exp": "笛卡兒提倡「演繹法」，強調藉由邏輯推演來獲得新知，與培根的歸納法同為科學革命重要的新方法。"}, {"stem": "科學革命期間，望遠鏡、顯微鏡、溫度計等新工具的發明，對科學研究產生下列何種影響？", "opts": [["A", "使科學家不再需要理論推導"], ["B", "使科學研究完全脫離實驗驗證"], ["C", "使科學研究更為便利，觀測與測量更準確"], ["D", "使教會重新掌握科學研究的主導權"]], "ans": "C", "exp": "新工具的發明使科學研究更為便利，改進了觀測與測量的準確度，加速了科學研究的發展。"}, {"stem": "十七世紀起，英、法等國相繼成立的科學研究機構，其主要作用為何？", "opts": [["A", "鼓勵科學家進行研究，帶動學術交流風氣"], ["B", "統一規定科學研究必須符合教會教義"], ["C", "限制學者出版與宗教相違的著作"], ["D", "專門負責審核國王的施政方針"]], "ans": "A", "exp": "十七世紀起，英國、法國等國相繼成立科學研究機構（如法蘭西科學院），鼓勵科學家從事研究，帶動科學研究風氣的展開。"}, {"stem": "十六世紀，哥白尼透過天體觀測提出的學說，衝擊了傳統基督教會的宇宙觀，這個學說被稱為什麼？", "opts": [["A", "地球中心說"], ["B", "太陽中心說"], ["C", "萬有引力說"], ["D", "演化論"]], "ans": "B", "exp": "哥白尼提出「太陽中心說」（日心說），主張太陽為宇宙中心，衝擊了傳統基督教會「地球中心說」的宇宙觀。"}, {"stem": "中古時期以來，基督教教會長期支持並宣揚的傳統宇宙觀，主張地球恆久不動、為宇宙中心，這是下列何種學說？", "opts": [["A", "地球中心說"], ["B", "太陽中心說"], ["C", "三大運動定律"], ["D", "萬有引力定律"]], "ans": "A", "exp": "中古時期歐洲人普遍相信神所創造的地球應位於宇宙中心，這種「地球中心說」（地心說）長期受到教會擁護，直到哥白尼提出太陽中心說才受到挑戰。"}, {"stem": "十七世紀，義大利學者伽利略對科學革命的主要貢獻為何？", "opts": [["A", "提出萬有引力定律"], ["B", "發表社會契約論"], ["C", "使用改良望遠鏡觀測天體，證實哥白尼的學說"], ["D", "編纂百科全書"]], "ans": "C", "exp": "伽利略進一步使用改良望遠鏡觀察天體運行，發現太陽黑子、月球坑洞、銀河由恆星組成等現象，驗證了哥白尼的「太陽中心說」。"}, {"stem": "伽利略因出版專書支持「太陽中心說」，被教會以何種罪名送交宗教法庭審判，最終遭終身軟禁？", "opts": [["A", "煽動人民革命"], ["B", "竊取國家機密"], ["C", "反對教宗、宣傳異端"], ["D", "偽造科學數據"]], "ans": "C", "exp": "伽利略在西元1632年出版專書支持「太陽中心說」，隔年因「反對教宗、宣傳異端」的罪名被押送宗教法庭審判，被迫承認錯誤並遭終身軟禁；直到1992年羅馬教會才承認當年判決錯誤。"}, {"stem": "牛頓總結前人研究成果，結合數學、物理及天文學知識，提出的重要學說為何？", "opts": [["A", "萬有引力定律與三大運動定律"], ["B", "天賦人權與三權分立"], ["C", "主權在民與社會契約"], ["D", "自由放任與看不見的手"]], "ans": "A", "exp": "牛頓提出「三大運動定律」和「萬有引力定律」，奠定近代物理學的發展基礎，是科學革命集大成的代表人物。"}, {"stem": "由於十七世紀歐洲科學人才輩出、成果豐碩，這個世紀因此被後世稱為什麼？", "opts": [["A", "黃金的世紀"], ["B", "天才的世紀"], ["C", "革命的世紀"], ["D", "啟蒙的世紀"]], "ans": "B", "exp": "課本指出十七世紀歐洲科學人才輩出、成果豐碩，因此又被稱為「天才的世紀」。"}, {"stem": "哥白尼提出太陽中心說後，經伽利略等人接續研究驗證，這一連串挑戰傳統學術與宗教界的天文學新立論，被稱為什麼？", "opts": [["A", "光榮革命"], ["B", "工業革命"], ["C", "啟蒙運動"], ["D", "哥白尼革命"]], "ans": "D", "exp": "課本說明哥白尼提出太陽中心說、伽利略以望遠鏡驗證，這一串天文學的新立論挑戰傳統學術與宗教界，被稱為「哥白尼革命」。"}, {"stem": "科學革命以來，人們相信透過理性思維可以探知宇宙萬物的運行法則，這使歐洲逐漸建立起何種世界觀，並促成後續哪一場思想運動？", "opts": [["A", "神權世界觀；促成文藝復興"], ["B", "科學的世界觀；促成啟蒙運動"], ["C", "農業的世界觀；促成大航海時代"], ["D", "貴族的世界觀；促成工業革命"]], "ans": "B", "exp": "科學革命建立起強調理性與科學的世界觀，這種相信理性可以探知萬物規律的想法，進一步促成十七、十八世紀啟蒙運動的出現與發展。"}, {"stem": "十七、十八世紀的啟蒙思想家認為，除了探知宇宙奧祕，人們還能憑藉理性掌握下列何者的運作法則？", "opts": [["A", "教會的宗教儀式"], ["B", "貴族的世襲制度"], ["C", "人類社會"], ["D", "王室的繼承順序"]], "ans": "C", "exp": "啟蒙思想家認為憑藉理性思維，人們不但能探知宇宙的奧祕，也能掌握人類社會的運作法則，希望藉此帶動社會的改變與進步，此即啟蒙運動。"}, {"stem": "英國學者洛克主張生命、自由與財產是人類不可剝奪的權利，這種主張被稱為什麼？", "opts": [["A", "天賦人權"], ["B", "主權在民"], ["C", "三權分立"], ["D", "自由放任"]], "ans": "A", "exp": "十七世紀末，英人洛克發表政府論，提出「天賦人權」，認為上天賦予人類生命、自由與財產等權利。"}, {"stem": "依洛克的主張，若政府破壞、剝奪人民應有的權利，人民可以採取下列何種作為？", "opts": [["A", "起而反抗政府統治"], ["B", "無條件服從政府"], ["C", "交由教會仲裁"], ["D", "遷居海外殖民地"]], "ans": "A", "exp": "洛克認為，若政府剝奪人民的權利，人民有權反抗政府統治，這項主張影響了許多後世的法國思想家。"}, {"stem": "洛克提出「天賦人權」主張的著作名稱為何？", "opts": [["A", "論法的精神"], ["B", "政府論"], ["C", "社會契約論"], ["D", "國富論"]], "ans": "B", "exp": "洛克在政府論一書中提出「天賦人權」的主張，強調人民生命、自由、財產不可被剝奪。"}, {"stem": "法國學者孟德斯鳩認為理想的政府應採行下列何種原則，以避免專制政治出現？", "opts": [["A", "君主專制"], ["B", "主權在民"], ["C", "行政、立法、司法三權分立"], ["D", "天賦人權"]], "ans": "C", "exp": "孟德斯鳩著有論法的精神（法意）一書，認為理想的政府應採行政、立法、司法三權分立原則，避免專制政治出現。"}, {"stem": "孟德斯鳩提出三權分立主張的著作是下列何者？", "opts": [["A", "政府論"], ["B", "社會契約論"], ["C", "百科全書"], ["D", "論法的精神（法意）"]], "ans": "D", "exp": "孟德斯鳩著有論法的精神（不同版本課本或譯為法意），主張政府應採三權分立原則，互相制衡。"}, {"stem": "孟德斯鳩主張三權分立、互相制衡，其最主要的目的為何？", "opts": [["A", "提升國王的統治威望"], ["B", "防止政府專制、避免濫權"], ["C", "加速工業生產效率"], ["D", "促進海外殖民地的開拓"]], "ans": "B", "exp": "孟德斯鳩主張政府組織應行政、立法、司法三權分立，彼此互相制衡，以防止政府專制濫權。"}, {"stem": "盧梭主張政府的權力來自人民，這種觀念稱為什麼，並成為後世民主革命的重要理論基礎？", "opts": [["A", "天賦人權"], ["B", "三權分立"], ["C", "歸納法"], ["D", "主權在民"]], "ans": "D", "exp": "盧梭在社會契約論（民約論）一書中，主張政府的權力來自於人民，這種「主權在民」的觀念，成為後世民主革命的重要理論基礎。"}, {"stem": "盧梭提出「主權在民」主張的著作，又被稱為下列何者？", "opts": [["A", "民約論（社會契約論）"], ["B", "政府論"], ["C", "法意"], ["D", "百科全書"]], "ans": "A", "exp": "盧梭的社會契約論又稱民約論，主張政府權力來自人民的委託，是「主權在民」理念的重要理論基礎。"}, {"stem": "依盧梭的主張，政府成立後所擁有的權力，其根本來源為何？", "opts": [["A", "國王世襲的天命"], ["B", "教會的授權"], ["C", "貴族議會的推舉"], ["D", "人民的委託"]], "ans": "D", "exp": "盧梭主張政府的權力來自人民的委託，這種「主權在民」的觀念強調政府統治的正當性須以人民同意為基礎。"}, {"stem": "法國啟蒙思想家伏爾泰在理性思維下，對教會提出下列何種批評與主張？", "opts": [["A", "抨擊教會腐敗與迷信，強調信仰與言論自由"], ["B", "主張恢復教會的政治統治權"], ["C", "主張以三權分立取代教會制度"], ["D", "提出萬有引力定律解釋宇宙運行"]], "ans": "A", "exp": "伏爾泰挑戰教會規範，抨擊教會的腐敗與迷信，強調信仰與言論自由，顯示啟蒙時代思想不再處處受宗教影響。"}, {"stem": "隨著洛克、孟德斯鳩、盧梭、伏爾泰等思想家競相提出新理念，哪一個國家逐漸成為啟蒙運動的重鎮？", "opts": [["A", "英國"], ["B", "法國"], ["C", "義大利"], ["D", "西班牙"]], "ans": "B", "exp": "課本說明啟蒙運動的自由思想雖源於英國（洛克），但隨著法國啟蒙思想家（孟德斯鳩、伏爾泰、盧梭等）競相提出新理念，法國逐漸成為啟蒙運動的重鎮。"}, {"stem": "法國學者狄德羅邀請眾多學者共同編撰，以理性為基礎將知識做系統性整理的著作是下列何者？", "opts": [["A", "國富論"], ["B", "政府論"], ["C", "論法的精神"], ["D", "百科全書"]], "ans": "D", "exp": "狄德羅邀請眾多學者共同編撰百科全書，以理性為基礎將知識做系統性的整理，開啟日後編纂百科全書類著作的風氣。"}, {"stem": "狄德羅主持編纂百科全書，其主要目的與後續影響為何？", "opts": [["A", "統一規範宗教教義解釋"], ["B", "有系統整理當代知識，開啟百科全書類著作風氣"], ["C", "建立三權分立的政府制度"], ["D", "提供工業革命的技術圖說"]], "ans": "B", "exp": "隨著重新檢討傳統知識觀念的風氣日盛，狄德羅邀集學者以理性為基礎有系統地整理知識，開啟日後編纂百科全書類著作的風氣。"}, {"stem": "啟蒙思想家認為，要了解世界與人類社會的運作，主要應該依靠下列何種方式？", "opts": [["A", "服從君王與貴族的決定"], ["B", "閱讀聖經、依循教會的教導"], ["C", "利用理性分析自然與社會現象"], ["D", "沿用中古以來的封建制度"]], "ans": "C", "exp": "啟蒙思想家認為了解世界與人類社會無須透過閱讀聖經或基督教教會，而需利用理性分析自然與社會現象，顯示人們的思想不再處處受宗教影響。"}, {"stem": "啟蒙運動時期，思想家們常聚集在貴族名流宅第中的哪個場所，藉由聚會談論各種話題以激發新思想？", "opts": [["A", "修道院"], ["B", "議會"], ["C", "沙龍"], ["D", "工廠"]], "ans": "C", "exp": "啟蒙思想家喜歡在貴族名流宅第的「沙龍」聚會，藉此交流意見、激發更多新思想，法國沙龍尤其興盛。"}, {"stem": "課本提到，啟蒙思想家所主張的自由思想與「主權在民」等理念，後來成為下列哪兩起歷史事件的重要理念淵源？", "opts": [["A", "文藝復興與大航海時代"], ["B", "美國獨立與法國大革命"], ["C", "光榮革命與工業革命"], ["D", "科學革命與地理大發現"]], "ans": "B", "exp": "課本指出啟蒙思想家相信藉由理性能了解人類社會秩序，削弱教會影響力並啟迪人們對自我權利的追求，成為近代民主政治的思想淵源，促成日後美國獨立與法國大革命的爆發。"}, {"stem": "英國學者亞當斯密主張市場供需如同「一隻看不見的手」，政府不應過度干預人民的經濟活動，這種經濟學說稱為什麼？", "opts": [["A", "社會主義"], ["B", "重商主義"], ["C", "自由放任"], ["D", "計畫經濟"]], "ans": "C", "exp": "亞當斯密主張「自由放任」的經濟學說，認為市場供需如同「一隻看不見的手」，政府不應過度干預人民的經濟活動，此說後來成為歐美經濟學理論的一環。"}, {"stem": "十八世紀中葉以來，開始以機器動力大量取代人力、使生產力大增的這場重大生產革新，起源於下列哪一個國家？", "opts": [["A", "法國"], ["B", "德國"], ["C", "荷蘭"], ["D", "英國"]], "ans": "D", "exp": "十八世紀中葉，英國為因應棉紡織品市場需求增加，開始以機器動力取代人力，成為工業革命的發源地。"}, {"stem": "下列何者不是英國能夠首先發展出工業革命的有利條件？", "opts": [["A", "政治相對自由與安定"], ["B", "煤礦資源豐富"], ["C", "長期海外貿易與殖民經驗"], ["D", "率先廢除君主制度"]], "ans": "D", "exp": "課本指出英國因政治安定、煤礦豐富、擁有長期海外貿易與殖民經驗、最早通過專利法等因素，成為工業革命發源地；英國並未廢除君主制度（仍為君主立憲）。"}, {"stem": "英國的工業革命，最早是從下列哪一項產業的技術改革開始展開的？", "opts": [["A", "造船業"], ["B", "鋼鐵業"], ["C", "紡織業"], ["D", "化學工業"]], "ans": "C", "exp": "工業革命始於紡織業的改革，十八世紀起英國人為因應市場需求，陸續改良織布機、紡紗機。"}, {"stem": "十八世紀晚期，英國人瓦特改良了下列哪一項設備，為工業生產提供了穩定的動力來源？", "opts": [["A", "望遠鏡"], ["B", "顯微鏡"], ["C", "蒸汽機"], ["D", "織布機"]], "ans": "C", "exp": "十八世紀晚期，瓦特改良的蒸汽機被應用在紡織生產上，提供了穩定的動力來源，是工業革命的重要象徵。"}, {"stem": "十九世紀初期，英國人持續改良蒸汽機，並將其應用在下列哪些設備上，帶動交通運輸的革新？", "opts": [["A", "汽船和火車"], ["B", "馬車和帆船"], ["C", "飛機和汽車"], ["D", "潛水艇和熱氣球"]], "ans": "A", "exp": "十九世紀初期，英國人持續改良蒸汽機，並應用在汽船和火車上，帶動了交通運輸方面的革新。"}, {"stem": "蒸汽動力運用於紡織機、汽船、火車等機具後，除了增進紡織業發展，還促成了下列哪一方面的重大革新？", "opts": [["A", "農業耕作技術"], ["B", "醫療衛生制度"], ["C", "教育普及政策"], ["D", "交通運輸"]], "ans": "D", "exp": "蒸汽動力廣泛運用於紡織機、汽船、火車等機具，除了增進紡織業的發展，也促成了交通運輸方面的革新。"}, {"stem": "隨著蒸汽機廣泛運用於紡織生產，英國因而成為當時全世界最大的哪一項產品的輸出國？", "opts": [["A", "鋼鐵"], ["B", "棉紡織品"], ["C", "汽車"], ["D", "香料"]], "ans": "B", "exp": "十八世紀晚期瓦特改良的蒸汽機應用在紡織生產後，使英國成為當時全世界最大的棉紡織輸出國。"}, {"stem": "英國首先發展工業革命後，此後歐陸各國與美國陸續加入工業發展的行列，這種擴散現象大約始於下列何時？", "opts": [["A", "十五世紀初期"], ["B", "十七世紀初期"], ["C", "十九世紀初期"], ["D", "二十世紀初期"]], "ans": "C", "exp": "課本指出十九世紀初期，工業革命由英國逐漸擴及歐洲大陸與美國，各國也紛紛運用機器生產，加入工業革命的行列。"}, {"stem": "工業革命期間，大型工廠吸引大量人口前往就業，形成新興市鎮，這種現象稱為什麼？", "opts": [["A", "都市化"], ["B", "工業化"], ["C", "民主化"], ["D", "世俗化"]], "ans": "A", "exp": "大型工廠吸引人口前往就業，形成人口集中於工廠附近的新興市鎮，這種現象稱為「都市化」，是工業革命帶來的重要社會變化之一。"}, {"stem": "工業革命後新興起的工業市鎮，普遍出現下列哪些問題？", "opts": [["A", "糧食產量大幅提升、物價下跌"], ["B", "治安不良、居住環境擁擠、衛生惡劣"], ["C", "人口大量外移、勞動力短缺"], ["D", "貴族勢力增強、王權遭到削弱"]], "ans": "B", "exp": "大型工廠吸引大量人口前往就業，形成的新興市鎮逐漸出現治安不良、居住環境擁擠、衛生惡劣等城市問題。"}, {"stem": "工業革命期間，資本家為賺取更多利潤而常不顧工人福祉，這種現象導致了下列何種社會對立？", "opts": [["A", "貴族與平民的對立"], ["B", "城市與鄉村的對立"], ["C", "教會與國家的對立"], ["D", "資本家與工人（勞工）的對立"]], "ans": "D", "exp": "新出現的工廠制度雖帶來就業機會，但資本家為賺取更多利潤，常不顧工人福祉，逐漸形成資本家與工人的對立。"}, {"stem": "十九世紀，部分學者為了解決工業革命所造成的貧富差距、社會問題，提出公平分配財富的各種思想主張，這些主張統稱為什麼？", "opts": [["A", "社會主義"], ["B", "帝國主義"], ["C", "重商主義"], ["D", "民族主義"]], "ans": "A", "exp": "部分學者提出公平分配財富、解決社會問題的思想，統稱為「社會主義」，是針對工業革命所造成的社會問題而興起的思潮。"}, {"stem": "馬克思提倡的共產主義，主張以何種方式達到財產公有、消除階級差異的目標？", "opts": [["A", "發動革命"], ["B", "議會立法改革"], ["C", "教會道德勸說"], ["D", "君主頒布法令"]], "ans": "A", "exp": "社會主義中，馬克思提倡的共產主義主張發動革命，以達到財產公有與消除階級差異的目標，對二十世紀世界局勢影響深遠。"}, {"stem": "工業化強國為擴大工業發展規模，積極在海外尋求原料與市場，這種行為對當時的國際局勢造成下列何種影響？", "opts": [["A", "促成世界和平公約的簽訂"], ["B", "各國友好合作，共同開發資源"], ["C", "列強在海外爭奪殖民地，造成國際局勢緊張"], ["D", "殖民地紛紛獨立，帝國主義因而結束"]], "ans": "C", "exp": "工業革命奠定各國富強基礎，工業化強國為降低成本、增加利潤，積極在海外爭奪殖民地與市場，造成國際局勢的緊張與衝突。"}, {"stem": "歷史學者將十八世紀中葉以來，以機器動力取代人力、使生產力大增的重大生產革新，稱為下列何者？", "opts": [["A", "光榮革命"], ["B", "工業革命"], ["C", "啟蒙運動"], ["D", "科學革命"]], "ans": "B", "exp": "課本明確定義：十八世紀中葉以來，英國開始以機器動力取代人力，使生產力大增，歷史學者將此重大的生產革新稱為「工業革命」。"}, {"stem": "依課本敘述英國工業革命的發展進程，下列排序何者正確？", "opts": [["A", "蒸汽機改良→紡織業興盛→應用於交通運輸"], ["B", "紡織業興盛→蒸汽機改良→應用於紡織與交通運輸"], ["C", "應用於交通運輸→紡織業興盛→蒸汽機改良"], ["D", "蒸汽機改良→應用於交通運輸→紡織業興盛"]], "ans": "B", "exp": "課本圖示說明英國工業革命的進程為：紡織業興盛（帶動技術革新但仍以人力為動力）→瓦特改良蒸汽機（提供穩定動力）→蒸汽動力應用於紡織業與交通運輸（火車、汽船）。"}, {"stem": "課本描繪工業革命時期資本家與勞工生活對照圖，下層是勞工在礦坑辛苦工作，上層則是資本家的生活樣貌，下列敘述何者最符合圖意？", "opts": [["A", "資本家過著奢華生活，勞工仍處於物資匱乏的困境"], ["B", "資本家與勞工的生活水準完全相同"], ["C", "勞工的生活遠比資本家富裕舒適"], ["D", "資本家與勞工共同組成议会監督政府"]], "ans": "A", "exp": "課本圖片說明下層是窮人與礦工辛苦工作的環境，造就上層資本家的奢華日子，反映工業革命後貧富差距擴大、資本家與勞工生活的強烈對比。"}, {"stem": "綜合本課內容，下列關於科學革命、啟蒙運動、工業革命三者關係的敘述，何者最為正確？", "opts": [["A", "三者彼此毫無關聯，各自獨立發生"], ["B", "工業革命最早發生，帶動了科學革命與啟蒙運動"], ["C", "啟蒙運動建立理性精神，才使科學革命得以萌芽"], ["D", "科學革命建立理性的世界觀，促成啟蒙運動以理性看待社會，工業革命則帶來生產技術與物質生活的變革"]], "ans": "D", "exp": "科學革命建立起理性思考、探究自然法則的精神與科學世界觀；啟蒙運動延續此理性精神，進一步用以檢視政治與社會制度；工業革命則是技術與生產方式的革新，三者先後相繼，共同構成近代歐洲的重大變革。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

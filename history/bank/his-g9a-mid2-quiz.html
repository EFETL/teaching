<script>
const QS=[{"stem": "阿利安人約在西元前1500年遷入印度河與恆河流域後，逐漸發展出區分身分貴賤、限制職業與通婚的制度，這種制度稱為什麼？", "opts": [["A", "婆羅門教"], ["B", "佛教"], ["C", "種姓制度"], ["D", "伊斯蘭教"]], "ans": "C", "exp": "阿利安人進入印度後，除了信仰婆羅門教，也發展出身分與職業區分嚴明的種姓制度，這是佛教興起前印度社會的重要背景。"}, {"stem": "阿利安人所信仰的婆羅門教，主張下列何種觀念？", "opts": [["A", "因果報應與靈魂輪迴"], ["B", "人人平等，不分貴賤"], ["C", "信奉唯一真神阿拉"], ["D", "信奉上帝耶和華"]], "ans": "A", "exp": "婆羅門教相信因果報應與靈魂輪迴，這正是後來釋迦牟尼所要挑戰、超脫的觀念。"}, {"stem": "下列何者是印度種姓制度所造成的社會現象？", "opts": [["A", "商業活動發達，貿易網絡完善"], ["B", "政教合一，皇帝兼管宗教事務"], ["C", "出現政教衝突"], ["D", "身分與職業世代區分嚴明，社會階級分明"]], "ans": "D", "exp": "種姓制度強調身分與職業的世襲區分，形成階級分明的社會結構，這是佛教興起的社會背景之一。"}, {"stem": "西元前6世紀左右，印度社會為何逐漸出現挑戰婆羅門教權威、質疑種姓制度的思潮？", "opts": [["A", "阿育王大力提倡佛教"], ["B", "人民不滿婆羅門教的既有權威，也質疑種姓制度的不公"], ["C", "羅馬政府迫害異教徒"], ["D", "阿拉伯人建立跨三洲帝國"]], "ans": "B", "exp": "課本指出，前6世紀左右人民對婆羅門教既有的權威不滿，也質疑種姓制度的不公，是佛教興起的背景。"}, {"stem": "佛教的創始人釋迦牟尼主張以下列何種方式，超脫生死輪迴？", "opts": [["A", "藉由修行"], ["B", "完全遵守種姓制度規範"], ["C", "對統治者朝拜獻祭"], ["D", "誦讀古蘭經"]], "ans": "A", "exp": "釋迦牟尼主張藉由修行超脫生死輪迴，並打破階級觀念，主張人人平等，因而吸引不少信徒，日後形成佛教。"}, {"stem": "佛教創立之初，最吸引信徒追隨的核心主張為何？", "opts": [["A", "政教合一"], ["B", "順服阿拉"], ["C", "打破種姓階級觀念，主張人人平等"], ["D", "以聖經為信仰經典"]], "ans": "C", "exp": "釋迦牟尼打破婆羅門教的階級觀念，主張人人平等，此一理念吸引不少不滿種姓制度的信徒。"}, {"stem": "西元前3世紀，哪一位國王大力提倡佛教，並派遣高僧向外傳教？", "opts": [["A", "君士坦丁"], ["B", "阿育王"], ["C", "穆罕默德"], ["D", "查士丁尼"]], "ans": "B", "exp": "前3世紀，孔雀王朝國王阿育王提倡佛教，並派遣高僧向外傳教，促成佛教向外傳播。"}, {"stem": "阿育王提倡佛教時，他所統治的印度王朝為下列何者？", "opts": [["A", "阿拉伯帝國"], ["B", "鄂圖曼帝國"], ["C", "拜占庭帝國"], ["D", "孔雀王朝"]], "ans": "D", "exp": "阿育王是孔雀王朝的國王，前3世紀在位期間大力提倡佛教並派遣高僧對外傳教。"}, {"stem": "阿育王死後，佛教在印度本土的發展趨勢為何？", "opts": [["A", "佛教成為印度的國教"], ["B", "佛教與婆羅門教合併為同一宗教"], ["C", "佛教在印度逐漸沒落，卻分別向南、北兩個方向對外傳播"], ["D", "佛教遭到伊斯蘭教徹底取代"]], "ans": "C", "exp": "阿育王死後，印度境內的佛教沒落，但分別從南北兩個方向外傳，形成南傳佛教與北傳佛教。"}, {"stem": "「南傳佛教」主要經由下列哪個地區，傳播到東南亞一帶？", "opts": [["A", "中亞"], ["B", "錫蘭"], ["C", "西藏"], ["D", "巴格達"]], "ans": "B", "exp": "課本指出，南傳佛教經錫蘭（今斯里蘭卡）傳播到東南亞地區。"}, {"stem": "「北傳佛教」主要經由下列哪條路線傳入中國？", "opts": [["A", "經中亞傳入中國"], ["B", "經錫蘭傳入中國"], ["C", "經阿拉伯半島傳入中國"], ["D", "經地中海傳入中國"]], "ans": "A", "exp": "北傳佛教經中亞傳入中國，再由中國向外傳播，與南傳佛教的路線不同。"}, {"stem": "北傳佛教在西元8世紀時，還傳入了下列哪個地區？", "opts": [["A", "阿拉伯半島"], ["B", "義大利"], ["C", "麥加"], ["D", "西藏"]], "ans": "D", "exp": "課本提到，8世紀時北傳佛教也傳入西藏，使佛教在亞洲的傳播範圍更加擴大。"}, {"stem": "佛教傳入中國後逐漸中國化，並進一步向外傳播到下列哪些地區？", "opts": [["A", "巴勒斯坦與地中海東岸"], ["B", "臺灣、日本、朝鮮半島、越南等地"], ["C", "阿拉伯半島與北非"], ["D", "伊比利半島"]], "ans": "B", "exp": "佛教傳入中國後逐漸形成中國化佛教，之後再從中國外傳到臺灣、日本、朝鮮半島、越南等地。"}, {"stem": "中國的雲岡石窟，最能反映佛教傳入中國後產生的下列哪種現象？", "opts": [["A", "佛教在印度本土持續興盛"], ["B", "佛教與伊斯蘭教融合"], ["C", "佛教僅流傳於王室貴族之間"], ["D", "佛像的衣著與相貌隨時間逐漸中國化"]], "ans": "D", "exp": "雲岡石窟最早建於5世紀，隨時間發展，佛像的衣著與相貌逐漸中國化，是佛教本土化的代表例證。"}, {"stem": "位於古代絲路要衝、於西元2001年遭塔利班政權炸毀的佛教遺跡「巴米揚大佛」，位於下列哪個地區？", "opts": [["A", "印度"], ["B", "中國"], ["C", "阿富汗"], ["D", "錫蘭"]], "ans": "C", "exp": "巴米揚大佛建於6世紀，位於阿富汗，地處絲綢之路上，2001年遭塔利班政權炸毀，是佛教曾在中亞興盛的重要見證。"}, {"stem": "西元一世紀前後，生活在地中海東岸、受羅馬帝國統治的猶太人，其傳統信仰為下列何者？", "opts": [["A", "猶太教"], ["B", "佛教"], ["C", "伊斯蘭教"], ["D", "希臘正教"]], "ans": "A", "exp": "課本指出，西元一世紀前後猶太人主要生活在地中海東岸，受羅馬帝國統治，他們的傳統信仰是猶太教，這是基督教興起的背景。"}, {"stem": "猶太人耶穌批評猶太教的腐敗，並宣揚下列哪些理念？", "opts": [["A", "因果報應、靈魂輪迴"], ["B", "政教合一"], ["C", "順服阿拉、齋戒禮拜"], ["D", "人人平等、神愛世人"]], "ans": "D", "exp": "一世紀時，耶穌批評猶太教的腐敗，宣揚人人平等、神愛世人等主張，逐漸形成基督教的核心理念。"}, {"stem": "根據課本敘述，耶穌最後為何被釘死在十字架上？", "opts": [["A", "他率兵反抗羅馬政府"], ["B", "猶太教祭司向羅馬政府控告耶穌，耶穌最終被處死"], ["C", "他拒絕繳納賦稅"], ["D", "他與伊斯蘭教徒發生衝突"]], "ans": "B", "exp": "猶太教祭司因不滿耶穌的主張，向羅馬政府控告耶穌，最後耶穌被釘死在十字架上，但其門徒繼續宣揚理念，逐漸形成基督教。"}, {"stem": "基督教的經典「聖經」，其內容架構為何？", "opts": [["A", "舊約（猶太教經典）與新約（記載耶穌言行）"], ["B", "全部為記載阿拉話語的古蘭經內容"], ["C", "完全是穆罕默德所傳達的啟示"], ["D", "專門記載羅馬皇帝的詔令"]], "ans": "A", "exp": "聖經包含舊約與新約，舊約是猶太教的經典，新約則是信徒記載耶穌言行編纂而成。"}, {"stem": "早期基督徒常遭到羅馬政府迫害的原因，下列何者正確？", "opts": [["A", "基督徒公開反抗羅馬政府的稅制"], ["B", "基督徒破壞羅馬的公共建築"], ["C", "基督教是一神信仰，且基督徒不肯膜拜羅馬皇帝像，違背羅馬多神信仰傳統"], ["D", "基督徒拒絕使用羅馬的貨幣"]], "ans": "C", "exp": "基督教信奉唯一真神，違背羅馬傳統的多神信仰，加上基督徒不肯膜拜皇帝像，因此早期基督徒常遭到羅馬政府迫害。"}, {"stem": "基督徒雖遭羅馬政府迫害，卻仍吸引更多信徒追隨，主要原因為何？", "opts": [["A", "羅馬皇帝主動下 島之所以成為文藝復興搖籃，最主要結合了下列哪些條件？", "opts": [["A", "王室大量鑄造金幣、獨尊天主教信仰"], ["B", "全面實施君主立憲、廢除封建制度"], ["C", "貿易興盛帶來的財富贊助、古典文化的保存，以及造紙印刷術帶動的知識流通"], ["D", "完全與外界隔絕、獨立發展出全新的文字系統"]], "ans": "C", "exp": "課本指出義大利半島之所以成為文藝復興搖籃，與貴族富商因貿易致富而支持文藝創作、古代典籍的翻譯保存，以及造紙術印刷術普及帶動知識傳播等因素有關。"}, {"stem": "文藝復興人文主義「以人為本」的精神，對後世歐洲發展帶來下列何種深遠影響？", "opts": [["A", "成為日後歐洲社會逐漸重視個人價值、追求現世幸福等發展的重要思想基礎"], ["B", "使歐洲社會從此完全揚棄宗教信仰"], ["C", "導致歐洲各國立即實施民主選舉制度"], ["D", "使歐洲重新回到中古封建莊園經濟"]], "ans": "A", "exp": "人文主義強調肯定人性價值與尊嚴、追求現世幸福，這種「以人為本」的思維成為影響日後歐洲政治、社會、文化發展的重要思想基礎。"}, {"stem": "某段資料描述：「這位人物否定教宗與教會的權威，將聖經翻譯成平民慣用的文字，鼓勵信徒直接閱讀聖經與上帝溝通。」這段描述最可能是在說下列何人？", "opts": [["A", "但丁"], ["B", "馬丁路德"], ["C", "羅耀拉"], ["D", "拉斐爾"]], "ans": "B", "exp": "資料中「否定教會權威」「翻譯聖經」「鼓勵直接閱讀聖經」等描述，正符合馬丁路德的主張與作為，他將聖經翻譯成德文，主張因信得救，揭開宗教改革序幕。"}, {"stem": "小明參觀一幅文藝復興時期的畫作，畫面呈現多位古代哲學家聚集討論、氣氛理性莊嚴，並未特別強調宗教救贖的情節。這幅畫最可能是下列何者？", "opts": [["A", "拉斐爾的「雅典學院」"], ["B", "米開朗基羅的「大衛像」"], ["C", "達文西的「最後的晚餐」"], ["D", "馬丁路德的畫像"]], "ans": "A", "exp": "「雅典學院」是拉斐爾的作品，畫面聚集了多位古代哲學家，呈現理性思辨的氛圍，展現文藝復興對古典希臘文化與人文精神的推崇，與強調宗教救贖的宗教畫作不同。"}, {"stem": "某資料描述：「他認為人能否得救，早在上帝創造世界之初便已預先決定，信徒唯有努力工作，才能榮耀上帝。」這段話最可能是下列何人的主張？", "opts": [["A", "但丁"], ["B", "亨利八世"], ["C", "羅耀拉"], ["D", "喀爾文"]], "ans": "D", "exp": "資料中「得救與否早已預先決定」「努力工作以榮耀上帝」的敘述，正是喀爾文提出「預選說」的核心主張，這也是喀爾文教派受工商業者歡迎的原因。"}, {"stem": "綜合文藝復興與宗教改革兩大運動來看，下列敘述何者最為恰當？", "opts": [["A", "兩者互不相關，文藝復興只影響藝術，宗教改革只影響信仰"], ["B", "文藝復興使人開始重視現世與人性，宗教改革則挑戰了羅馬教會的權威，兩者都削弱了中古以來教會對歐洲社會的絕對主導地位"], ["C", "宗教改革使歐洲重新回到以神為本的中古思想"], ["D", "文藝復興的發生，是因為宗教改革先削弱了教會權威所致"]], "ans": "B", "exp": "文藝復興的人文主義使人們重視現世生活與人性價值，宗教改革則直接挑戰羅馬教會的權威與教義。兩者雖然性質不同（一為文化藝術運動、一為宗教信仰改革），但都削弱了中古以來教會對歐洲社會的絕對主導地位，共同揭開了近代歐洲興起的序幕。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

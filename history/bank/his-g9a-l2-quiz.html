丁"], ["B", "查士丁尼"], ["C", "奧古斯都"], ["D", "屋大維"]], "ans": "B", "exp": "拜占庭帝國皇帝中，成就最顯著的是六世紀的查士丁尼，他積極對外擴張，致力於恢復羅馬帝國版圖。"}, {"stem": "西元1453年，拜占庭帝國最後亡於下列何者？", "opts": [["A", "日耳曼民族"], ["B", "波斯帝國"], ["C", "鄂圖曼土耳其人"], ["D", "阿拉伯帝國"]], "ans": "C", "exp": "查士丁尼逝世後，拜占庭帝國不斷遭遇周圍民族威脅，於西元1453年亡於鄂圖曼土耳其人。"}, {"stem": "拜占庭帝國長期抵禦東方族群的侵擾，對後世歐洲文化發展有何重要貢獻？", "opts": [["A", "完全阻絕了東西方文化的交流"], ["B", "摧毀大量希臘、羅馬的典籍"], ["C", "建立了世界第一個民主政體"], ["D", "成為中古西歐地區的屏障，並持續保存古希臘、羅馬的典籍"]], "ans": "D", "exp": "拜占庭帝國長期抵禦東方族群的侵擾，成為中古西歐地區的屏障，且持續保存古希臘、羅馬的典籍，有助於日後歐洲文化的發展。"}, {"stem": "羅馬人在共和時期將傳統法律與各地風俗彙編而成，是羅馬最早的成文法，稱為什麼？", "opts": [["A", "查士丁尼法典"], ["B", "十二表法"], ["C", "漢摩拉比法典"], ["D", "《羅馬法大全》"]], "ans": "B", "exp": "共和時期，羅馬人將傳統的法律及各地的風俗彙編成「十二表法」，此為羅馬最早的成文法。"}, {"stem": "「十二表法」對後世造成了什麼樣的影響？", "opts": [["A", "影響後世歐洲法學的發展"], ["B", "僅限羅馬境內使用，未曾流傳後世"], ["C", "遭希臘人全面廢除"], ["D", "只保障貴族的權利，平民完全不受保障"]], "ans": "A", "exp": "十二表法使公民的權利獲得保障，影響後世的法學發展，成為歐洲各國制訂法律的參考基礎。"}, {"stem": "羅馬人使用的文字，隨帝國版圖擴張傳播到歐洲各地，日後成為中古西歐的共通語文，這是指哪一種文字？", "opts": [["A", "希臘文"], ["B", "埃及象形文字"], ["C", "楔形文字"], ["D", "拉丁文"]], "ans": "D", "exp": "羅馬人使用拉丁文，隨著帝國版圖擴張，拉丁文傳播到歐洲各地，日後成為中古西歐的共通語文。"}, {"stem": "羅馬人擅長將科學知識應用於公共建築，下列何者不屬於古羅馬人常見的大型公共工程？", "opts": [["A", "神殿"], ["B", "引水道"], ["C", "金字塔"], ["D", "競技場"]], "ans": "C", "exp": "羅馬人在各地廣建神殿、公路、競技場、引水道、公共浴池等大型工程；金字塔則是古埃及文明的建築成就，並非羅馬。"}, {"stem": "羅馬文化承襲希臘文化，但相較之下更重視下列何種精神？", "opts": [["A", "務實精神"], ["B", "浪漫主義精神"], ["C", "神祕主義色彩"], ["D", "個人主義色彩"]], "ans": "A", "exp": "羅馬承襲希臘文化，但更重視務實的精神，因此在建築、法律、文字等實用層面都有重要貢獻。"}, {"stem": "下列有關雅典與斯巴達的敘述，何者正確？", "opts": [["A", "斯巴達以民主政治著稱"], ["B", "雅典成年男性公民有權參與政治事務"], ["C", "雅典重視軍事訓練與紀律"], ["D", "斯巴達官員多經由抽籤產生"]], "ans": "B", "exp": "雅典成年男性公民有權參與政治事務、議決城邦大事，故(B)正確；民主政治是雅典的特色（非斯巴達），重視軍事訓練與紀律是斯巴達的特色（非雅典），官員抽籤產生也是雅典的做法（非斯巴達），因此(A)(C)(D)皆將雅典、斯巴達的特色說反了。"}, {"stem": "下列有關古希臘城邦的敘述，何者錯誤？", "opts": [["A", "希臘地區多山，地形崎嶇"], ["B", "西元前八世紀左右形成許多獨立城邦"], ["C", "斯巴達和雅典是其中最重要的城邦"], ["D", "全希臘由統一的中央政府治理"]], "ans": "D", "exp": "古希臘因多山地形而形成許多各自獨立的城邦，並未由統一的中央政府治理，故(D)敘述錯誤。"}, {"stem": "亞歷山大在其帝國境內建立希臘式城市、推廣希臘語文並鼓勵民族通婚，其主要作用為何？", "opts": [["A", "壓制被征服地區原有的文化"], ["B", "削弱希臘本土的政治勢力"], ["C", "促進希臘與各地文化的交流融合"], ["D", "恢復埃及的傳統宗教信仰"]], "ans": "C", "exp": "亞歷山大推廣希臘語文、鼓勵民族通婚，促進了希臘與埃及、西亞等地的文化交流融合，形成希臘化文化。"}, {"stem": "下列何者不是古希臘文化的成就？", "opts": [["A", "荷馬史詩"], ["B", "十二表法"], ["C", "帕德嫩神廟"], ["D", "希臘三哲人的哲學思想"]], "ans": "B", "exp": "十二表法是古羅馬共和時期制訂的成文法，屬於羅馬文化的成就，並非古希臘文化。"}, {"stem": "下列何者不是古羅馬文化的成就？", "opts": [["A", "帕德嫩神廟"], ["B", "十二表法"], ["C", "拉丁文"], ["D", "公共浴池等大型建築工程"]], "ans": "A", "exp": "帕德嫩神廟是古希臘最具代表性的建築，體現希臘人重視均衡對稱的美感，屬於希臘文化而非羅馬文化。"}, {"stem": "有關羅馬共和後期的政局，下列敘述何者正確？", "opts": [["A", "政局穩定，元老院權力持續增強"], ["B", "羅馬版圖因內戰而大幅縮減"], ["C", "軍事將領爭奪大權，政局動盪不安"], ["D", "屋大維最早發動政變，但隨即失敗"]], "ans": "C", "exp": "共和後期羅馬爆發政爭，有實力的軍事將領獨攬大權相互爭鬥，如凱撒之後屋大維崛起，政局動盪。"}, {"stem": "有關「羅馬和平」時期的敘述，下列何者正確？", "opts": [["A", "此時期社會動盪不安"], ["B", "羅馬帝國版圖大幅縮減"], ["C", "此時期羅馬尚未統一地中海地區"], ["D", "社會安定、經濟繁榮，此盛世長達約兩百年"]], "ans": "D", "exp": "羅馬進入帝國時期後，開啟長達兩世紀的和平與繁榮，史稱「羅馬和平」，恰與中國漢朝遙相輝映。"}, {"stem": "下列有關拜占庭帝國的敘述，何者錯誤？", "opts": [["A", "西元476年滅亡"], ["B", "又稱東羅馬帝國"], ["C", "定都於君士坦丁堡"], ["D", "查士丁尼在位時國力鼎盛"]], "ans": "A", "exp": "西元476年滅亡的是西羅馬帝國，拜占庭帝國（東羅馬帝國）則一直延續到西元1453年才亡於鄂圖曼土耳其人，故(A)敘述錯誤。"}, {"stem": "綜合而言，古希臘與古羅馬文化被視為下列何者的重要源頭？", "opts": [["A", "中國文化"], ["B", "歐洲文化"], ["C", "印度文化"], ["D", "阿拉伯文化"]], "ans": "B", "exp": "希臘文化建立民主政治與哲學、文學、藝術的基礎，羅馬文化承襲希臘文化並發展法律、建築、語文，兩者共同構成歐洲文化的重要源頭。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

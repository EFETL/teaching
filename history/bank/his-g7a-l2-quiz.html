<script>
const QS=[{"stem": "根據課本內容，「大航海時代」大約從什麼時候開始，歐洲人積極前往世界各地探險與貿易？", "opts": [["A", "十三世紀"], ["B", "十五世紀末前後"], ["C", "十八世紀"], ["D", "二十世紀初"]], "ans": "B", "exp": "三版課本皆指出，大航海時代大約始於十五世紀末（十五、十六世紀），歐洲人開始積極從事遠洋探險與海外貿易。"}, {"stem": "歐洲人積極開闢新航路、前往東亞的主要目的為何？", "opts": [["A", "尋找適合移民的荒地耕種"], ["B", "協助明朝政府打擊倭寇"], ["C", "逃避歐洲本地的宗教戰爭"], ["D", "取得香料、絲綢等商品以謀取貿易利益，並從事傳教"]], "ans": "D", "exp": "課本說明歐洲人是為了取得香料、絲綢等商品運回歐洲賺取高額利潤，同時基於商業利益與傳教目的東來。"}, {"stem": "課本提到，最早來到東方（東亞）從事貿易的兩個歐洲國家是？", "opts": [["A", "葡萄牙、西班牙"], ["B", "英國、法國"], ["C", "荷蘭、丹麥"], ["D", "義大利、瑞典"]], "ans": "A", "exp": "最早來到東方的歐洲人是葡萄牙人及西班牙人，分別占領澳門和菲律賓馬尼拉，作為與中、日貿易的據點。"}, {"stem": "葡萄牙人在東亞建立的主要貿易據點位於？", "opts": [["A", "菲律賓 馬尼拉"], ["B", "印尼 巴達維亞"], ["C", "中國 澳門"], ["D", "臺灣 大員"]], "ans": "C", "exp": "葡萄牙人占領中國澳門，作為與中國、日本貿易的據點。"}, {"stem": "西班牙人在東亞的貿易據點設於？", "opts": [["A", "中國 澳門"], ["B", "菲律賓 馬尼拉"], ["C", "日本 長崎"], ["D", "臺灣 雞籠"]], "ans": "B", "exp": "西班牙人占領菲律賓，以馬尼拉為根據地，經營對中、日貿易。"}, {"stem": "關於荷蘭聯合東印度公司（VOC）的敘述，下列何者正確？", "opts": [["A", "成立於西元1602年，由荷蘭數家公司合併組成"], ["B", "由葡萄牙王室出資成立"], ["C", "專門負責防守澎湖的軍事機構"], ["D", "成立目的僅是傳教，不涉及貿易"]], "ans": "A", "exp": "荷蘭聯合東印度公司於西元1602年由荷蘭數家公司合併組成，經荷蘭政府特許經營亞洲貿易。"}, {"stem": "荷蘭政府特許聯合東印度公司擁有的特殊權力，不包含下列何者？", "opts": [["A", "對外宣戰及談和"], ["B", "任命官員統治殖民地"], ["C", "獨占對亞洲的貿易"], ["D", "直接接管荷蘭本國的政務"]], "ans": "D", "exp": "荷蘭政府賦予聯合東印度公司對外宣戰談和、任命殖民地官員、獨占亞洲貿易等特權，但公司並不掌管荷蘭本國政務。"}, {"stem": "荷蘭聯合東印度公司在亞洲的總部設於何處？", "opts": [["A", "澳門"], ["B", "馬尼拉"], ["C", "巴達維亞（今印尼 雅加達）"], ["D", "長崎"]], "ans": "C", "exp": "荷蘭聯合東印度公司在巴達維亞（今印尼雅加達）設立亞洲總部。"}, {"stem": "西元1604年，荷蘭人曾出兵占領澎湖，後來因何事而撤離？", "opts": [["A", "遭明朝將領沈有容勸退"], ["B", "被鄭成功擊敗"], ["C", "遭遇颱風而撤退"], ["D", "與西班牙人發生衝突而撤離"]], "ans": "A", "exp": "荷蘭人為拓展貿易曾占領澎湖，但被明朝將領沈有容勸退，此事蹟並立碑紀念，現存放於澎湖馬公天后宮。"}, {"stem": "荷蘭人第二次占領澎湖失敗後，於西元1624年轉往何處發展，並興建熱蘭遮城？", "opts": [["A", "臺灣北部 雞籠"], ["B", "臺灣南部 大員（今臺南 安平）"], ["C", "臺灣東部 花蓮"], ["D", "澎湖 馬公"]], "ans": "B", "exp": "西元1624年，荷蘭人再度占領澎湖失敗後，轉往臺灣南部大員（今臺南市安平區）發展，並興建熱蘭遮城作為統治中心。"}, {"stem": "荷蘭人在今日臺南赤崁一帶建立的商業市街，稱為？", "opts": [["A", "熱蘭遮"], ["B , "鄭氏政權→荷蘭→西班牙"]], "ans": "C", "exp": "依時間先後：1624年荷蘭占領臺灣南部、1626年西班牙占領臺灣北部、1642年荷蘭統一全臺殖民據點，1662年鄭成功取代荷蘭建立漢人政權。"}, {"stem": "荷蘭聯合東印度公司的英文簡稱為？", "opts": [["A", "DEIC"], ["B", "VOC"], ["C", "EIC"], ["D", "NWC"]], "ans": "B", "exp": "荷蘭聯合東印度公司（Vereenigde Oost-Indische Compagnie）簡稱VOC，是荷蘭政府特許經營亞洲貿易的機構。"}, {"stem": "紀念明將沈有容勸退荷蘭人事蹟的石碑，目前存放於何處？", "opts": [["A", "澎湖 馬公 天后宮"], ["B", "臺南 孔廟"], ["C", "淡水 紅毛城"], ["D", "安平古堡"]], "ans": "A", "exp": "此碑紀念明將沈有容勸退荷蘭人的事蹟，現今存放於澎湖馬公天后宮，為臺澎地區現存年代最早的石碑之一。"}, {"stem": "淡水「紅毛城」名稱的由來，與下列哪一段歷史有關？", "opts": [["A", "因城堡外牆漆成紅色而得名"], ["B", "鄭成功攻下此城後所命名"], ["C", "荷蘭人攻下西班牙人的聖多明哥城後於附近重建城堡，漢人稱荷蘭人為「紅毛」，故稱紅毛城"], ["D", "日治時期日本人所興建"]], "ans": "C", "exp": "荷蘭人驅離西班牙人、占領其聖多明哥城後，在附近重建城堡，因漢人稱荷蘭人為「紅毛」，故此城被稱為紅毛城。"}, {"stem": "郭懷一的身分背景為何？", "opts": [["A", "荷蘭聯合東印度公司派駐臺灣的長官"], ["B", "移墾臺南赤崁一帶的漢人領袖"], ["C", "鄭成功麾下的水師將領"], ["D", "西班牙駐臺灣北部的傳教士"]], "ans": "B", "exp": "郭懷一是移墾臺南赤崁一帶漢人的領袖，因不堪荷蘭聯合東印度公司的繁重稅金，率眾發動對荷蘭人的反抗，但最終失敗。"}, {"stem": "荷蘭人平定郭懷一事件後，採取了什麼措施以鞏固對臺灣南部的統治？", "opts": [["A", "撤離臺灣南部，退往北部"], ["B", "與鄭芝龍簽訂軍事同盟"], ["C", "興建西式城堡「普羅民遮城」，以鞏固統治"], ["D", "全面禁止漢人來臺開墾"]], "ans": "C", "exp": "荷蘭人平定郭懷一事件後，在赤崁一帶興建西式城堡普羅民遮城，以鞏固對臺灣南部的統治。"}, {"stem": "康熙皇帝在鄭氏政權降清後，賜予鄭成功輓聯，稱讚其「孤忠」的行為，這反映出什麼歷史現象？", "opts": [["A", "鄭成功生前即受到清帝國的推崇"], ["B", "歷史事實只有一種固定不變的解釋"], ["C", "康熙皇帝與鄭成功私交甚篤"], ["D", "對歷史人物的評價，可能隨政治局勢與立場而有所轉變"]], "ans": "D", "exp": "鄭氏政權尚未被征服前，清廷視鄭成功為「叛賊」；降清後康熙卻讚美其忠義，顯示歷史人物的評價會隨政治局勢與統治需要而改變。"}, {"stem": "荷蘭人所著《被遺誤的臺灣》一書中，將鄭成功描述為殘暴的形象；而清康熙皇帝的輓聯卻稱讚他忠心堅貞。造成兩種評價差異的最主要原因是？", "opts": [["A", "作者的立場與角度不同，各自從己方利益詮釋鄭成功"], ["B", "兩則史料其中一則必定完全捏造、不具參考價值"], ["C", "鄭成功本人性格在不同時期截然不同"], ["D", "這只是單純的翻譯錯誤所造成"]], "ans": "A", "exp": "荷蘭人作為戰敗的一方，從自身遭遇出發描述鄭成功的殘暴；清帝國則基於籠絡漢人、標榜忠義的政治考量給予正面評價，可見政治立場不同會導致對同一歷史人物的評價產生差異。"}, {"stem": "臺灣民間流傳鄭成功以劍插地湧出泉水（如小金門國姓井、臺中鐵砧山劍井）的傳說，這類傳說主要反映出什麼？", "opts": [["A", "證明鄭成功確實擁有超自然能力"], ["B", "這些地區的水井都是鄭成功親自挖掘"], ["C", "民間將鄭成功神格化，反映臺灣百姓對他的尊崇"], ["D", "傳說內容具有考古學上的實證價值"]], "ans": "C", "exp": "民間傳說賦予鄭成功神奇能力的形象，並非史實紀錄，而是反映臺灣漢人社會對鄭成功驅逐荷蘭人事蹟的崇敬與神格化想像。"}, {"stem": "荷蘭人選擇以臺灣作為國際貿易轉運站的主要考量為何？", "opts": [["A", "臺灣盛產香料，可就地取得"], ["B", "臺灣地理位置適中，便於連結中國、日本與東南亞等地的貿易"], ["C", "臺灣氣候適合荷蘭人長期定居"], ["D", "臺灣當時已有完善的港口建設"]], "ans": "B", "exp": "臺灣位居東亞海域航線要衝，便於荷蘭聯合東印度公司連結中國、日本、東南亞（巴達維亞）等地的轉口貿易，因此成為理想的轉運站。"}, {"stem": "根據翰林版教材中一位英國商人的紀錄，這位商人提到自己帶到臺灣、賣給鄭氏「國王」的貨物包括？", "opts": [["A", "絲綢與瓷器"], ["B", "香料與白銀"], ["C", "稻米與蔗糖"], ["D", "鐵與黑胡椒"]], "ans": "D", "exp": "該英國商人的紀錄提到，他們帶來的鐵和黑胡椒受到大員當地歡迎，鄭氏「國王」買下了這些貨物，顯示鄭氏政權與英國商人間存在貿易往來。"}, {"stem": "根據翰林版教材「荷蘭與鄭氏在臺貿易比較表」，荷蘭與鄭氏政權在臺灣對外貿易上，兩者共同的出口商品為？", "opts": [["A", "蔗糖、鹿皮"], ["B", "白銀、香料"], ["C", "軍用物資、布料"], ["D", "絲綢、瓷器"]], "ans": "A", "exp": "無論是荷蘭統治時期或鄭氏政權時期，臺灣的出口商品都以蔗糖、鹿皮為主，差異主要在於貿易對象與進口物資的不同（如荷蘭進口絲綢、瓷器、香料、白銀；鄭氏則進口軍用物資、布料）。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "歷史學家常以「冷戰」稱呼二次大戰結束後美、蘇兩大陣營的對抗局勢，其中「冷戰」一詞最能反映下列哪種局勢？", "opts": [["A", "美、蘇雙方直接爆發大規模全面戰爭"], ["B", "美、蘇雙方完全終止外交往來、互不接觸"], ["C", "美、蘇雙方雖競爭對抗，卻極力避免直接開戰的「非戰非和」狀態"], ["D", "美、蘇雙方共同出兵鎮壓其他國家的獨立運動"]], "ans": "C", "exp": "冷戰時期美、蘇兩大陣營在政治、軍事上激烈對抗、進行軍備競賽，但因憂慮全面戰爭帶來毀滅性後果，始終未直接開戰，形成「非戰非和」、「亦戰亦和」的局勢，故稱「冷戰」。"}, {"stem": "二次大戰後，美國為了防止歐洲各國因戰後經濟蕭條而倒向共產陣營，提出一項援助歐洲重建經濟的計畫，這項計畫稱為？", "opts": [["A", "馬歇爾計畫"], ["B", "杜魯門主義"], ["C", "圍堵政策委員會"], ["D", "歐洲聯盟計畫"]], "ans": "A", "exp": "美國為協助歐洲戰後重建經濟、防止共產勢力藉經濟蕭條擴張，推動「馬歇爾計畫」援助歐洲。"}, {"stem": "美國為了防堵共產勢力擴張，結合歐、美反共國家成立的軍事同盟組織稱為？", "opts": [["A", "華沙公約組織"], ["B", "東南亞公約組織"], ["C", "不結盟運動"], ["D", "北大西洋公約組織"]], "ans": "D", "exp": "美國聯合歐、美反共國家成立「北大西洋公約組織」，以圍堵共產勢力的擴張。"}, {"stem": "蘇聯為了與美國陣營抗衡、強化對東歐國家的控制，聯合東歐共產國家建立的軍事同盟稱為？", "opts": [["A", "北大西洋公約組織"], ["B", "華沙公約組織"], ["C", "獨立國家國協"], ["D", "第三世界"]], "ans": "B", "exp": "蘇聯建立「華沙公約組織」，聯合東歐共產國家與美國陣營對抗，並強化對東歐的控制。"}, {"stem": "西元1948年，蘇聯下令封鎖通往某座城市的陸路交通，引發美、英兩國以空運方式運送物資馳援，史稱「柏林危機」。蘇聯當時封鎖的是下列哪座城市？", "opts": [["A", "東柏林"], ["B", "西柏林"], ["C", "華沙"], ["D", "布拉格"]], "ans": "B", "exp": "1948年，占有東柏林的蘇聯下令封鎖由美、英、法三國控制的西柏林陸路交通，引發柏林危機。"}, {"stem": "柏林危機期間，美、英兩國為了突破蘇聯的陸路封鎖，將物資送進西柏林，主要採取下列哪種運補方式？", "opts": [["A", "派遣軍隊武力護送陸路車隊"], ["B", "透過地下密道運送物資"], ["C", "賄賂蘇聯官兵放行"], ["D", "以空運方式將物資運送進西柏林"]], "ans": "D", "exp": "面對蘇聯封鎖陸路交通，美、英兩國改以空運方式，將物資源源不絕地運送進西柏林。"}, {"stem": "西元1949年，美、英、法三國將其在德國的占領區合併，成立下列哪一個政府？", "opts": [["A", "德意志聯邦共和國（西德）"], ["B", "德意志民主共和國（東德）"], ["C", "神聖羅馬帝國"], ["D", "獨立國家國協"]], "ans": "A", "exp": "1949年，美、英、法三國占領區合併，成立「德意志聯邦共和國」，即一般所稱的西德。"}, {"stem": "西元1949年，蘇聯將其在德國的占領區改組成立下列哪一個政府？", "opts": [["A", "德意志聯邦共和國（西德）"], ["B", "奧匈帝國"], ["C", "德意志民主共和國（東德）"], ["D", "大德意志國"]], "ans": "C", "exp": "同年，蘇聯占領區則成立「德意志民主共和國」，即一般所稱的東德。"}, {"stem": "「柏林圍牆」是由下列哪一方所興建，目的在防止其國內人民逃往西柏林？", "opts": [["A", "東德政府"], ["B", "西德政府"], ["C", "美國政府"], ["D", "聯合國"]], "ans": "A", "exp": "東德政府為防止人民遷往西柏林，興建「柏林圍牆」，成為冷戰的重要象徵。"}, {"stem": "二次大戰後，歐洲殖民勢力減弱，加上殖民地民族意識高漲，亞、非地區的殖民地能夠陸續獨立建國，主要透過下列哪些方式？", "opts": [["A", "僅能透過武裝革命一途，別無他法"], ["B", "全部由聯合國直接接管、宣布獨立"], ["C", "軍事鬥爭、談判協商、聯合國協助等多元方式"], ["D", "必須先加入北大西洋公約組織才能獨立"]], "ans": "C", "exp": "課本指出，亞、非地區的殖民地陸續透過軍事、談判、聯合國協助等多元方式獨立，出現許多新興國家，並非只靠單一途徑。"}, {"stem": "「柏林圍牆」在冷戰時期，最常被用來象徵下列何者？", "opts": [["A", "歐洲統一的成就"], ["B", "民主陣營與共產陣營對立分裂的局勢"], ["C", "第三世界國家的團結"], ["D", "聯合國維持和平的成果"]], "ans": "B", "exp": "柏林圍牆將同一城市分隔為共產東德與民主西德，成為冷戰時代東、西陣營對立分裂的重要象徵。"}, {"stem": "柏林圍牆於西元哪一年被推倒拆除，成為冷戰即將結束的重要象徵？", "opts": [["A", "1961年"], ["B", "1975年"], ["C", "1985年"], ["D", "1989年"]], "ans": "D", "exp": "西元1989年，東德政府開放邊界，民眾拆除柏林圍牆，象徵冷戰局勢即將終結。"}, {"stem": "東德、西德在柏林圍牆拆除之後，於西元哪一年正式完成統一？", "opts": [["A", "1961年"], ["B", "1985年"], ["C", "1989年"], ["D", "1990年"]], "ans": "D", "exp": "柏林圍牆於1989年拆除後，東德、西德於隔年（1990年）正式統一。"}, {"stem": "西元1962年，美、蘇雙方一度瀕臨戰爭邊緣，其導火線是下列何者？", "opts": [["A", "蘇聯封鎖西柏林陸路交通"], ["B", "蘇聯在古巴部署飛彈基地，直接威脅美國本土安全"], ["C", "美國在古巴駐軍"], ["D", "古巴宣布加入北大西洋公約組織"]], "ans": "B", "exp": "1962年，蘇聯在古巴部署飛彈，飛彈射程涵蓋美國本土，對美國造成嚴重威脅，引發「古巴危機」。"}, {"stem": "面對蘇聯在古巴部署飛彈的威脅，美國採取下列哪一項因應措施？", "opts": [["A", "立即出兵入侵古巴"], ["B", "對蘇聯宣戰"], ["C", "以海軍封鎖古巴海域，要求蘇聯撤除飛彈"], ["D", "退出聯合國以示抗議"]], "ans": "C", "exp": "美國要求蘇聯撤除飛彈，並以海軍封鎖古巴，使戰爭一觸即發，最終雙方透過協調化解危機。"}, {"stem": "「古巴危機」最後如何落幕？", "opts": [["A", "蘇聯同意撤除在古巴的飛彈基地，化解戰爭危機"], ["B", "美國承認古巴為蘇聯的加盟共和國"], ["C", "美、蘇兩國因此爆發全面戰爭"], ["D", "古巴宣布獨立，脫離美、蘇兩大陣營"]], "ans": "A", "exp": "經過多次協調後，蘇聯同意撤除在古巴的飛彈基地，古巴危機因而解除。"}, {"stem": "古巴危機落幕後，美、蘇兩國為避免類似危機再度升高為戰爭，採取下列何種作法？", "opts": [["A", "簽訂全面禁止核武條約，銷毀所有核彈"], ["B", "建立「熱線」等直接溝通管道，以降低誤判風險"], ["C", "解散北大西洋公約組織與華沙公約組織"], ["D", "共同出兵占領古巴"]], "ans": "B", "exp": "古巴危機後，美、蘇政府為避免核武威脅，開始建立直接溝通的管道（熱線），使冷戰局勢漸趨和緩。"}, {"stem": "冷戰時期，美、蘇兩國為避免直接開戰，常在其他國家扶植親近的勢力，導致當地爆發軍事衝突，下列何者屬於此類衝突？", "opts": [["A", "韓戰、越戰"], ["B", "第一次世界大戰"], ["C", "波灣戰爭"], ["D", "拿破崙戰爭"]], "ans": "A", "exp": "冷戰時期，美、蘇兩國扶植親近的政權在他國引發政爭與軍事衝突，韓戰、越戰即是規模較大的例子。"}, {"stem": "冷戰時期，美、蘇兩大陣營分別支持交戰的敵對政權，使下列哪一地區成為兩強角力的戰場？", "opts": [["A", "中南美洲"], ["B", "西歐"], ["C", "北歐"], ["D", "東亞（韓戰、越戰）"]], "ans": "D", "exp": "冷戰期間，以美、蘇為首的民主、共產勢力分別支持韓戰與越戰中的敵對政權，使東亞成為兩大陣營的角力場。"}, {"stem": "二次大戰後，在美、英等國的支持下，下列哪一民族在巴勒斯坦地區建立了以色列？", "opts": [["A", "阿拉伯人"], ["B", "庫德族"], ["C", "猶太人"], ["D", "波斯人"]], "ans": "C", "exp": "二次大戰後，許多曾受迫害的猶太人在美、英等國支持下，於巴勒斯坦地區建立以色列國。"}, {"stem": "以色列建國後，世居當地的巴勒斯坦人（阿拉伯人）面臨下列何種處境？", "opts": [["A", "獲得以色列公民身分，享有平等待遇"], ["B", "遷往歐洲另組新國家"], ["C", "遭到強迫遷離家園，淪為難民"], ["D", "與猶太人共組聯合政府"]], "ans": "C", "exp": "以色列建國後多次擴張領土，並強迫世居此地的巴勒斯坦人遷離，使其成為難民，引發阿拉伯國家不滿。"}, {"stem": "以阿多次戰爭期間，下列哪一強權提供以色列武器與支持？", "opts": [["A", "蘇聯"], ["B", "中國"], ["C", "法國殖民政府"], ["D", "美國"]], "ans": "D", "exp": "以阿戰爭期間，美國扶植並支援以色列，蘇聯則支援阿拉伯國家，使西亞問題捲入冷戰對立情勢。"}, {"stem": "以阿多次戰爭期間，下列哪一強權提供阿拉伯國家武器與支援？", "opts": [["A", "蘇聯"], ["B", "美國"], ["C", "英國"], ["D", "日本"]], "ans": "A", "exp": "蘇聯支援阿拉伯國家對抗以色列，美國則支持以色列，雙方各有靠山，使衝突更加複雜難解。"}, {"stem": "由於中東地區盛產石油，以阿衝突不斷，這對世界經濟造成下列哪一項影響？", "opts": [["A", "促成歐洲共同市場的成立"], ["B", "引發能源（石油）危機"], ["C", "導致美元崩盤"], ["D", "加速蘇聯的解體"]], "ans": "B", "exp": "中東是石油主要產地，以阿衝突不斷使該地區局勢動盪，進而引發能源（石油）危機，影響全球經濟。"}, {"stem": "二次大戰後，歐洲殖民勢力衰退，加上殖民地民族意識高漲，亞、非地區出現下列哪一種普遍趨勢？", "opts": [["A", "許多殖民地陸續獨立建國"], ["B", "殖民地紛紛併入蘇聯版圖"], ["C", "殖民地全數重新回歸歐洲母國統治"], ["D", "殖民地相繼加入北大西洋公約組織"]], "ans": "A", "exp": "二次大戰後歐洲列強國力大衰，無法有效控制殖民地，加上殖民地民族意識升高，亞、非地區陸續出現許多新興獨立國家。"}, {"stem": "部分亞、非、拉丁美洲的新興國家不願加入美、蘇任何一方陣營，彼此合作、提出反帝國主義與反殖民主義的訴求，這群國家被稱為？", "opts": [["A", "華沙集團"], ["B", "第三世界"], ["C", "大英國協"], ["D", "獨立國家國協"]], "ans": "B", "exp": "這些不願參與美、蘇兩大陣營、主張反帝反殖民的亞、非、拉丁美洲國家，形成所謂的「第三世界」。"}, {"stem": "第三世界國家為表明不與美、蘇任何一方集團結盟的立場，發起了下列哪一項國際運動？", "opts": [["A", "泛美聯盟運動"], ["B", "歐洲統合運動"], ["C", "圍堵政策"], ["D", "不結盟運動"]], "ans": "D", "exp": "第三世界發起「不結盟運動」，標榜不與任何集團結盟，藉由成員間協調共識，形成第三股國際勢力。"}, {"stem": "第三世界國家個別國力大多不強，卻仍能在國際舞臺上發揮影響力，主要是憑藉下列何種優勢？", "opts": [["A", "擁有最先進的核子武器"], ["B", "掌握全球最多的黃金儲備"], ["C", "數目眾多，能以集體外交之力展現影響力"], ["D", "獲得聯合國安全理事會常任理事國席位"]], "ans": "C", "exp": "第三世界國家個別實力有限，但因成員數量眾多，透過協調取得共識，能以集體外交之力在國際舞臺上發揮影響力。"}, {"stem": "冷戰時期，蘇聯長期偏重下列哪一方面的發展，導致民生經濟停滯、人民生活困苦？", "opts": [["A", "農業與畜牧業"], ["B", "觀光旅遊業"], ["C", "輕工業與消費產業"], ["D", "國防（軍事）工業"]], "ans": "D", "exp": "冷戰期間，蘇聯長期偏重國防（軍事）工業、投入龐大軍費，忽視民生經濟發展，使人民生活困苦。"}, {"stem": "西元1985年，蘇聯出現一位推動政治、經濟與外交改革的領導人，他是下列何人？", "opts": [["A", "史達林"], ["B", "列寧"], ["C", "戈巴契夫"], ["D", "赫魯雪夫"]], "ans": "C", "exp": "1985年，蘇聯領導人戈巴契夫展開一連串政治、經濟、外交改革，並改善與歐、美國家的關係。"}, {"stem": "戈巴契夫上臺後推動的改革，主要方向為何？", "opts": [["A", "加強對東歐國家的軍事控制"], ["B", "推動政治、經濟改革，並改善與西方國家的關係"], ["C", "退出聯合國，走向鎖國"], ["D", "重新發動與美國的軍備競賽"]], "ans": "B", "exp": "戈巴契夫推動政治、經濟改革，降低政府管制，並在外交上積極改善與西方國家的關係。"}, {"stem": "戈巴契夫宣布對東歐國家採取下列哪一項政策，間接促成東歐民主化浪潮？", "opts": [["A", "減少對東歐國家內政的干預"], ["B", "出兵占領所有東歐國家首都"], ["C", "提高對東歐國家的經濟援助以換取效忠"], ["D", "要求東歐國家全數加入華沙公約組織"]], "ans": "A", "exp": "戈巴契夫宣布減少干預東歐國家內政後，東歐國家趁勢推動民主化運動，共產政權因而受到挑戰。"}, {"stem": "戈巴契夫宣布放鬆對東歐的控制後，東歐國家出現下列哪一種變化？", "opts": [["A", "共產政權更加穩固、持續掌權"], ["B", "紛紛推動民主化運動，共產政權相繼失勢瓦解"], ["C", "集體宣布加入美國"], ["D", "恢復君主專制政體"]], "ans": "B", "exp": "蘇聯不再干預東歐內政後，東歐各國掀起民主化運動，原本的共產政權紛紛失勢瓦解。"}, {"stem": "西元1991年蘇聯解體後，多個原蘇聯加盟共和國組成下列哪一個組織？", "opts": [["A", "華沙公約組織"], ["B", "歐洲聯盟"], ["C", "獨立國家國協"], ["D", "不結盟運動"]], "ans": "C", "exp": "各加盟共和國陸續宣布脫離蘇聯獨立，並另組「獨立國家國協」，蘇聯正式解體。"}, {"stem": "西元1991年，蘇聯國內保守派人士為阻止戈巴契夫的改革，採取下列哪一項行動，卻反而加速了蘇聯的解體？", "opts": [["A", "發動政變、軟禁戈巴契夫"], ["B", "宣布蘇聯永久解散"], ["C", "邀請美國派兵協助鎮壓"], ["D", "主動歸還柏林圍牆遺址"]], "ans": "A", "exp": "隨著戈巴契夫國內改革失利，保守派於1991年發動政變、軟禁戈巴契夫，政變雖平定，但蘇聯政局更加動盪，加速走向解體。"}, {"stem": "西元1991年蘇聯解體後，長達數十年的美、蘇對抗局勢也隨之發生下列何種變化？", "opts": [["A", "進一步升高為全面戰爭"], ["B", "演變為更激烈的軍備競賽"], ["C", "美、蘇改為共同統治歐洲"], ["D", "冷戰正式結束"]], "ans": "D", "exp": "蘇聯解體後，長達數十年的美、蘇冷戰對抗也隨之結束。"}, {"stem": "冷戰結束後，國際秩序不再是單純的美、蘇兩極對抗，而是逐漸走向下列何種局面？", "opts": [["A", "多元並立的國際秩序"], ["B", "完全由聯合國單一主導的世界政府"], ["C", "回復到帝國主義殖民體系"], ["D", "恢復兩大陣營對抗但角色互換"]], "ans": "A", "exp": "冷戰結束後，世界邁入全球化與多元並立的時代，各文化與民族相互依存、彼此影響。"}, {"stem": "冷戰結束、蘇聯解體後，世界雖然不再有兩大陣營的直接對抗，但仍因下列哪些因素而衝突不斷？", "opts": [["A", "兩極對抗再度復燃"], ["B", "全球恢復君主專制"], ["C", "各國重新殖民非洲"], ["D", "宗教、經濟、文化等方面的差異"]], "ans": "D", "exp": "冷戰結束並不代表世界從此和平，各地仍因宗教、經濟、文化上的差異而衝突頻傳，甚至引發恐怖攻擊等新的國際問題。"}, {"stem": "「華沙公約組織」的性質最適合以下列何者描述？", "opts": [["A", "亞、非新興國家組成的經濟合作組織"], ["B", "美國與西歐國家組成的反共軍事同盟"], ["C", "蘇聯與東歐共產國家組成的軍事同盟"], ["D", "聯合國轄下維持和平的常設機構"]], "ans": "C", "exp": "華沙公約組織是蘇聯聯合東歐共產國家建立的軍事同盟，用以與美國陣營相抗衡。"}, {"stem": "西元1971年，聯合國大會中因為許多第三世界國家代表的支持，決定讓下列哪一個政府加入聯合國，使中華民國因此宣布退出聯合國？", "opts": [["A", "蘇聯"], ["B", "中華人民共和國"], ["C", "東德"], ["D", "巴勒斯坦"]], "ans": "B", "exp": "課本提到，1971年聯合國大會中，許多第三世界國家代表支持中華人民共和國加入聯合國，我國因此宣布退出聯合國，顯示第三世界國家在國際組織中已具有相當的影響力。"}, {"stem": "「馬歇爾計畫」援助歐洲戰後經濟重建的資金，主要由下列哪一國提供？", "opts": [["A", "蘇聯"], ["B", "英國"], ["C", "美國"], ["D", "中國"]], "ans": "C", "exp": "馬歇爾計畫由美國提供大筆資金，協助歐洲各國進行戰後經濟重建，防止共產勢力藉經濟蕭條擴張。"}, {"stem": "二次大戰後，德國與柏林曾由下列哪四個國家分區占領，種下日後柏林危機與東西德分裂的遠因？", "opts": [["A", "美、英、法、義"], ["B", "美、英、法、蘇"], ["C", "美、蘇、中、英"], ["D", "英、法、蘇、日"]], "ans": "B", "exp": "二次大戰後，德國與柏林由美、英、法、蘇四國分區占領，日後美、英、法占領區合併成立西德，蘇聯占領區則成立東德。"}, {"stem": "西元1948年，蘇聯之所以封鎖通往西柏林的陸路交通，主要是因為不滿下列哪一項行動？", "opts": [["A", "西柏林民眾發起獨立公投"], ["B", "西德加入不結盟運動"], ["C", "西柏林拒絕接受馬歇爾計畫援助"], ["D", "美、英、法三國企圖在其占領區成立獨立的政府"]], "ans": "D", "exp": "蘇聯不滿美、英、法三國企圖在其占領區成立政府，於是封鎖通往西柏林的陸路交通，引發柏林危機。"}, {"stem": "冷戰期間，美、蘇兩國之間展開激烈的軍備競賽，雙方競相研發與生產下列哪一種毀滅性武器？", "opts": [["A", "核子武器"], ["B", "生化武器"], ["C", "弓箭與刀劍等冷兵器"], ["D", "無人飛機"]], "ans": "A", "exp": "冷戰時期，美、蘇兩國大量研發與生產核子武器，展開軍備競賽，使國際局勢籠罩在核戰陰影之下。"}, {"stem": "美、蘇兩大陣營雖然對立，卻始終避免爆發全面戰爭，主要原因為何？", "opts": [["A", "雙方經濟過於貧困，無力發動戰爭"], ["B", "聯合國強制雙方簽署互不侵犯條約"], ["C", "雙方領導人私交甚篤"], ["D", "雙方憂慮核子武器造成的毀滅性後果"]], "ans": "D", "exp": "美、蘇兩大陣營因憂慮核子武器一旦使用將帶來互相毀滅的後果，因此避免全面開戰，形成「冷戰」的僵持局面。"}, {"stem": "「古巴危機」發生於西元哪一年？", "opts": [["A", "1962年"], ["B", "1948年"], ["C", "1949年"], ["D", "1991年"]], "ans": "A", "exp": "西元1962年，蘇聯在古巴部署飛彈，引發美、蘇之間的「古巴危機」。"}, {"stem": "以色列宣布建國是在西元哪一年？", "opts": [["A", "1945年"], ["B", "1948年"], ["C", "1955年"], ["D", "1962年"]], "ans": "B", "exp": "西元1948年，以色列宣布建國，隨即與周邊阿拉伯國家爆發戰爭。"}, {"stem": "「柏林危機」發生於西元哪一年，蘇聯下令封鎖通往西柏林的陸路交通？", "opts": [["A", "1945年"], ["B", "1947年"], ["C", "1948年"], ["D", "1961年"]], "ans": "C", "exp": "西元1948年，蘇聯下令封鎖通往西柏林的陸路交通，美、英兩國以空運物資援助，史稱「柏林危機」。"}, {"stem": "冷戰時期，美、蘇兩大陣營的對抗，本質上最主要是下列哪兩種制度或理念之爭？", "opts": [["A", "民主（資本主義）與共產主義之爭"], ["B", "君主制與共和制之爭"], ["C", "一神教與多神教之爭"], ["D", "農業社會與工業社會之爭"]], "ans": "A", "exp": "冷戰是以美國為首的民主（反共）陣營，與以蘇聯為首的共產陣營之間的對抗，本質上是兩種政治、經濟制度與理念之爭。"}, {"stem": "冷戰結束後，國際局勢邁入全球化，但下列哪一類事件顯示世界仍未因此完全和平，衝突與挑戰依然存在？", "opts": [["A", "馬歇爾計畫的推行"], ["B", "柏林圍牆的興建"], ["C", "北大西洋公約組織的成立"], ["D", "恐怖攻擊事件（如美國九一一事件）"]], "ans": "D", "exp": "冷戰結束後，世界並未從此完全和平，各地仍因政治、經濟、宗教等差異發生嚴重衝突，恐怖攻擊事件（如2001年美國九一一事件）即為一例，顯示當前國際局勢仍充滿挑戰。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

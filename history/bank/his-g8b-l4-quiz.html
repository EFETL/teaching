<script>
const QS=[{"stem": "民國20年，日本關東軍在中國東北哪一座城市附近自行炸毀鐵路，並藉此為口實進攻中國軍隊，隨後迅速占領東北全境？", "opts": [["A", "瀋陽"], ["B", "北平"], ["C", "南京"], ["D", "上海"]], "ans": "A", "exp": "課本回顧表提到，九一八事變是日本關東軍在瀋陽（奉天）附近製造爆炸事件，藉此侵占中國東北，時間為民國20年（西元1931年）。"}, {"stem": "九一八事變後，日本於民國21年在中國東北扶植成立一個傀儡政權，其名稱為何？", "opts": [["A", "汪精衛政權"], ["B", "華北自治政府"], ["C", "滿洲國"], ["D", "蒙疆聯合自治政府"]], "ans": "C", "exp": "課本時序表載明「民國21年 日本成立滿洲國」，這是日本在占領東北後扶植的傀儡政權，作為進一步侵略中國的基地。"}, {"stem": "西安事變後，中國國民黨與中國共產黨的關係出現了怎樣的轉變？", "opts": [["A", "雙方立即簽署和平協定，正式統一軍隊"], ["B", "國民政府宣布解散共產黨組織"], ["C", "共產黨宣布放棄武裝，接受招安"], ["D", "雙方衝突暫告停止，一致抗日成為共識"]], "ans": "D", "exp": "課本指出「日本占領中國東北後仍繼續擴張，而西安事變後，國共兩黨的衝突暫告停止，國民政府決心抵抗日本進一步的侵略」，這也是國共第二次合作的重要背景。"}, {"stem": "民國26年7月7日，中日兩國軍隊在哪個地點爆發衝突，史稱「七七事變」（又稱盧溝橋事變）？", "opts": [["A", "上海近郊"], ["B", "北平近郊的盧溝橋"], ["C", "南京近郊"], ["D", "瀋陽近郊"]], "ans": "B", "exp": "課本明確記載：「民國26年7月7日，日軍在北平（今北京）近郊的盧溝橋附近演習，與中國守軍發生衝突，史稱『七七事變』（又稱『盧溝橋事變』）」。"}, {"stem": "依課本描述，七七事變爆發的直接導火線為何？", "opts": [["A", "日本要求中國割讓臺灣"], ["B", "中國軍隊主動攻擊日軍基地"], ["C", "日軍要求接管北平城防"], ["D", "日軍藉口一名士兵失蹤，要求入城搜查遭中國守軍拒絕"]], "ans": "D", "exp": "課本說明日軍在河北省宛平縣附近演習時，「藉口士兵失蹤，要求入城搜查，遭中國守軍拒絕，雙方爆發衝突」，成為戰爭爆發的直接導火線。"}, {"stem": "七七事變在中國近代史上具有什麼樣的重要意義？", "opts": [["A", "揭開了中國全面對日抗戰的序幕"], ["B", "標誌著國共內戰正式結束"], ["C", "促成中華民國政府遷臺"], ["D", "使日本正式退出國際聯盟"]], "ans": "A", "exp": "課本指出七七事變後「中日戰爭全面展開」，這場衝突揭開了中國全面抗日的序幕，開啟長達八年的對日戰爭。"}, {"stem": "民國26年8月，日軍進攻上海，其主要戰略意圖為何？", "opts": [["A", "掠奪長江流域的礦產資源"], ["B", "企圖「速戰速決」，直取南京"], ["C", "切斷中國對外海運補給線"], ["D", "建立親日的地方傀儡政權"]], "ans": "B", "exp": "課本記載日軍進攻上海，「企圖『速戰速決』」，以中國首都南京為目標，希望能迅速擊潰中國的抵抗。"}, {"stem": "面對日軍速戰速決的企圖，國民政府採取了什麼樣的因應策略？", "opts": [["A", "立即與日本簽署停戰協定"], ["B", "集中兵力於上海與日軍決一死戰"], ["C", "「以空間換取時間」，遷都重慶，準備長期抗戰"], ["D", "撤守長江以南，放棄整個華中地區"]], "ans": "C", "exp": "課本說明國民政府「深知實力不足，採取『以空間換取時間』的策略」，抵抗一段時間後遷都重慶，準備與日本長期抗戰。"}, {"stem": "震驚國際的「南京大屠殺」發生於下列哪一個時間點？", "opts": [["A", "民國26年12月，日軍攻陷南京之後"], ["B", "民國30年12月，珍珠港事變之後"], ["C", "民國32年，開羅會議召開前夕"], ["D", "民國34年，日本投降前夕"]], "ans": "A", "exp": "課本記載「民國26年12月，日軍攻入（攻陷）南京，殘殺無辜軍民，造成『南京大屠殺』慘況」。"}, {"stem": "為了因應日軍的進逼與長期抗戰的需要，當時中國政府與民間出現了什麼樣的行動？", "opts": [["A", "各地紛紛成立親日自治政府"], ["B", "全國學生一律停止就學"], ["C", "沿海居民大量移居東南亞"], ["D", "政府機關、學術機構紛紛西遷，故宮文物也隨之南遷"]], "ans": "D", "exp": "課本圖說提到「為長期抗戰，許多政府機關、學術機構也紛紛搬遷。圖為北京故宮將文物裝箱，準備南遷」，反映當時舉國西遷以持續抗戰的努力。"}, {"stem": "關於中日戰爭起訖時間的說法，傳統稱為「八年抗戰」，近年中國大陸則提出「十四年抗戰」的說法，這兩種說法分別是以哪一事件作為戰爭的起點？", "opts": [["A", "八年抗戰始於九一八事變；十四年抗戰始於七七事變"], ["B", "兩種說法起點相同，僅終點不同"], ["C", "八年抗戰始於七七事變；十四年抗戰始於九一八事變"], ["D", "八年抗戰始於南京大屠殺；十四年抗戰始於珍珠港事變"]], "ans": "C", "exp": "課本提到傳統上將中日戰爭稱為「八年抗戰」（起自民國26年七七事變），而近年中共提出「十四年抗戰」的說法，是將起點追溯至民國20年的九一八事變。"}, {"stem": "中日戰爭陷入僵局後，日本加緊推動「南進」政策，其主要目的為何？", "opts": [["A", "協助歐美國家鞏固東南亞殖民地"], ["B", "從東南亞取得石油、橡膠等戰略資源"], ["C", "將戰俘遣送至東南亞集中營"], ["D", "與蘇聯共同瓜分東南亞領土"]], "ans": "B", "exp": "課本說明「日本加緊『南進』的步伐，試圖從東南亞取得更多戰略資源」，企圖以「大東亞共榮圈」為號召，掠奪石油、橡膠等資源以支撐長期作戰。"}, {"stem": "美國之所以對日本實施石油禁運，主要是因為下列哪一項原因？", "opts": [["A", "日本南進威脅到歐美國家在東南亞、大洋洲的殖民地"], ["B", "日本拒絕加入國際聯盟"], ["C", "日本片面廢除與美國的貿易條約"], ["D", "日本在中國東北排斥美國商人"]], "ans": "A", "exp": "課本指出「隨著日本積極南進，威脅歐美國家在東南亞、大洋洲的殖民地，美國便對日本實施石油禁運」，這也促使日本鋌而走險偷襲珍珠港。"}, {"stem": "民國30年12月，日本偷襲了美國位於何處的軍事基地，引爆太平洋戰爭？", "opts": [["A", "菲律賓馬尼拉"], ["B", "新加坡"], ["C", "關島"], ["D", "夏威夷珍珠港"]], "ans": "D", "exp": "課本記載「民國30年12月，日本攻擊美國位於夏威夷珍珠港的軍事基地」，此即「珍珠港事變」。"}, {"stem": "珍珠港事變爆發後，隨即產生了什麼樣的後續發展？", "opts": [["A", "日本隨即宣布投降"], ["B", "中國與日本簽署停戰協定"], ["C", "美、日正式宣戰，太平洋戰爭爆發"], ["D", "蘇聯出兵協助日本占領東南亞"]], "ans": "C", "exp": "課本說明珍珠港事變後「美、日正式宣戰，引爆太平洋戰爭」，戰爭規模自此擴大到整個太平洋地區。"}, {"stem": "中國正式對日本宣戰，是在下列哪一事件發生之後？", "opts": [["A", "南京大屠殺"], ["B", "七七事變"], ["C", "珍珠港事變"], ["D", "開羅會議"]], "ans": "C", "exp": "課本記載「珍珠港事變後，中國也對日宣戰，中日戰爭成為第二次世界大戰的一環」，顯示中國正式對日宣戰的時間點是在珍珠港事變之後。"}, {"stem": "從七七事變到珍珠港事變之間，中國對日本的抗戰態勢，最適合以下列何者描述？", "opts": [["A", "中國獨自對日抗戰，尚未獲得其他盟國並肩作戰"], ["B", "中國與美、英已組成正式聯軍共同作戰"], ["C", "中國因內戰而暫停對日抵抗"], ["D", "中國已完全收復東北全境"]], "ans": "A", "exp": "課本指出，直到珍珠港事變後，「中國也由獨自對日抗戰，轉變為與英美等盟國並肩作戰」，可知在此之前（民國26年至30年）中國是獨自對日抗戰。"}, {"stem": "民國32年，美、英等國與中華民國簽訂「平等新約」，這項條約帶來了什麼樣的意義？", "opts": [["A", "中國正式加入同盟國軍事指揮體系"], ["B", "中國取得東北全部主權 let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

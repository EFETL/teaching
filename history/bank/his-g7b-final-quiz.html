<script>
const QS=[{"stem": "古寧頭戰役發生於下列哪一年？", "opts": [["A", "民國37年"], ["B", "民國39年"], ["C", "民國38年"], ["D", "民國40年"]], "ans": "C", "exp": "民國38年（西元1949年）10月，中華人民共和國進攻金門，遭國軍擊退，史稱「古寧頭戰役」。同年12月，中華民國政府遷臺。"}, {"stem": "古寧頭戰役結束後，發生了下列哪一件大事？", "opts": [["A", "中華民國政府遷臺"], ["B", "中美共同防禦條約簽訂"], ["C", "我國退出聯合國"], ["D", "政府開放大陸探親"]], "ans": "A", "exp": "古寧頭戰役發生於民國38年10月，同年12月中華民國政府正式遷臺，兩岸自此進入分裂分治的局面。"}, {"stem": "古寧頭戰役後，兩岸雙方各自提出的目標，下列何者正確？", "opts": [["A", "中國大陸主張「一國兩制」，臺灣主張「三不政策」"], ["B", "中國大陸主張「和平統戰」，臺灣主張「反攻大陸」"], ["C", "中國大陸主張「三通四流」，臺灣主張「務實外交」"], ["D", "中國大陸主張「武力解放臺灣」，臺灣主張「反攻大陸（光復大陸）」"]], "ans": "D", "exp": "古寧頭戰役後，中華人民共和國揚言要「武力解放臺灣」，中華民國政府則以「反攻大陸（光復大陸）」為目標，雙方陷入長期武力對抗。「一國兩制」「和平統戰」「三不政策」是後來政治對峙時期才出現的主張。"}, {"stem": "古寧頭戰役發生的地點是下列何處？", "opts": [["A", "澎湖"], ["B", "金門"], ["C", "馬祖"], ["D", "臺北"]], "ans": "B", "exp": "民國38年，中華人民共和國軍隊進攻金門，國軍在金門將其擊退，史稱「古寧頭戰役」。"}, {"stem": "古寧頭戰役屬於戰後兩岸關係哪一個發展階段的重要事件？", "opts": [["A", "兩岸交流時期"], ["B", "政治對峙時期"], ["C", "武力對抗時期"], ["D", "務實外交時期"]], "ans": "C", "exp": "古寧頭戰役是民國38年至68年「武力對抗（武力對峙）」時期的重要戰役，此時期兩岸軍事衝突頻繁，直到八二三炮戰後才逐漸和緩。"}, {"stem": "震驚一時的「八二三炮戰」發生於下列哪一年？", "opts": [["A", "民國47年"], ["B", "民國50年"], ["C", "民國60年"], ["D", "民國38年"]], "ans": "A", "exp": "民國47年8月23日，中華人民共和國對金門展開密集炮擊，國軍奮力抵抗，史稱「八二三炮戰」。"}, {"stem": "八二三炮戰的交戰地點在下列何處？", "opts": [["A", "澎湖"], ["B", "馬祖"], ["C", "臺南"], ["D", "金門"]], "ans": "D", "exp": "民國47年8月23日，中華人民共和國對金門進行密集炮擊，國軍在金門奮力抵抗，故稱「八二三炮戰」。"}, {"stem": "八二三炮戰結束後，兩岸的軍事情勢出現下列哪一種轉變？", "opts": [["A", "立刻簽訂和平協定"], ["B", "兩岸不再有大規模軍事對戰"], ["C", "中華民國隨即退出聯合國"], ["D", "雙方隨即展開民間探親"]], "ans": "B", "exp": "八二三炮戰結束後，兩岸雖仍有零星軍事衝突，但不再出現大規模的軍事對戰，兩岸關係逐漸由武力對抗轉向政治對峙。"}, {"stem": "八二三炮戰期間，臺灣所使用的炮彈上還繫著哪一項物資援助的標籤？", "opts": [["A", "日援"], ["B", "英援"], ["C", "美援"], ["D", "法援"]], "ans": "C", "exp": "韓戰爆發後，美國提供臺灣軍事、經濟援助，統稱「美援」，八二三炮戰期間美援提供的武器彈藥，正是臺灣得以抵禦炮擊的重要支持。"}, {"stem": "下列關於八二三炮戰性質的敘述，何者正確？", "opts": [["A", "它是兩岸武力對抗時期最後一次大規模軍事衝突"], ["B", "它發生在中美斷交之後"], ["C", "它導致我國退出聯合國"], ["D", "它促成了辜汪會談的舉行"]], "ans": "A", "exp": "八二三炮戰（民國47年）之後，兩岸不再有大規模軍事對戰，可視為武力對抗時期最後一次重大軍事衝突，此後兩岸逐漸轉為政治對峙。"}, {"stem": "韓戰是在下列哪一年爆發的？", "opts": [["A", "民國38年"], ["B", "民國43年"], ["C", "民國47年"], ["D", "民國39年"]], "ans": "D", "exp": "民國39年（西元1950年）6月，北韓出兵攻打南韓，韓戰爆發，聯合國隨即通過決議，派遣以美國為首的聯軍援助南韓。"}, {"stem": "韓戰爆發後，美國為防止共產勢力擴張，採取下列哪一項行動？", "opts": [["A", "立刻與中華民國簽訂臺灣關係法"], ["B", "派遣第七艦隊巡防臺灣海峽"], ["C", "支持中華人民共和國進入聯合國"], ["D", "宣布與中華民國斷交"]], "ans": "B", "exp": "民國39年韓戰爆發後，美國為防止共產勢力擴張，派遣第七艦隊巡防臺灣海峽，並提供我國軍事、經濟及外交支持，即「美援」。"}, {"stem": "下列何者屬於「美援」的內容？", "opts": [["A", "廢止中美共同防禦條約"], ["B", "開放大陸探親"], ["C", "資金借貸、提供武器、捐贈農產品及食物"], ["D", "支持中華人民共和國取得中國代表權"]], "ans": "C", "exp": "美援提供的項目相當繁多，包括資金借貸、提供武器、捐贈農產品及食物等，穩固了臺灣的經濟與社會，讓臺灣情勢轉危為安。"}, {"stem": "韓戰最後在下列哪一年達成停戰協定？", "opts": [["A", "民國42年"], ["B", "民國47年"], ["C", "民國60年"], ["D", "民國68年"]], "ans": "A", "exp": "韓戰爆發後南、北韓長期交戰，最後於民國42年（西元1953年）達成停戰協定，雙方仍以停戰線為界。"}, {"stem": "中美（中華民國與美國）共同防禦條約是在下列哪一年簽訂的？", "opts": [["A", "民國39年"], ["B", "民國47年"], ["C", "民國60年"], ["D", "民國43年"]], "ans": "D", "exp": "民國43年，美國與我國簽訂中美共同防禦條約，將臺灣正式納入西太平洋地區反共防禦體系的一環，臺海局勢漸趨穩定。"}, {"stem": "中美共同防禦條約簽訂後，具有下列哪一項重要意義？", "opts": [["A", "使我國退出聯合國"], ["B", "讓臺灣成為美國西太平洋反共防禦體系的一環"], ["C", "促成兩岸開放探親"], ["D", "使中華人民共和國取得聯合國席位"]], "ans": "B", "exp": "民國43年簽訂的中美共同防禦條約，讓臺灣成為美國在西太平洋地區反共防禦體系的一環，臺海局勢因此趨於穩定。"}, {"stem": "政府遷臺初期（民國38年至60年間），對外關係致力於下列哪一項目標？", "opts": [["A", "推動兩岸兩會的正式會談"], ["B", "開放小三通、大三通"], ["C", "爭取友邦支持，鞏固外交，謀求「確保臺灣，光復大陸」"], ["D", "以「中華台北」名義參與國際組織"]], "ans": "C", "exp": "政府遷臺初期面臨內憂外患，此時期致力爭取友邦支持以鞏固外交，謀求「確保臺灣，光復大陸」，此階段稱為「鞏固外交」時期。"}, {"stem": "美援時期，美國積極在臺灣推廣哪一類食品，進而改變了臺灣人的飲食習慣？", "opts": [["A", "麵粉、麵食"], ["B", "稻米"], ["C", "海鮮"], ["D", "茶葉"]], "ans": "A", "exp": "美援期間，美國為推銷剩餘的小麥農產品，協助臺灣建立麵粉工業、推廣麵食，逐漸改變了臺灣以米食為主的飲食習慣，如麵包、甜甜圈（多福餅）等西式麵食因此普及。"}, {"stem": "我國宣布退出聯合國是在下列哪一年？", "opts": [["A", "民國68年"], ["B", "民國77年"], ["C", "民國82年"], ["D", "民國60年"]], "ans": "D", "exp": "民國60年（西元1971年），聯合國通過決議由中華人民共和國取代我國的代表權，我國隨即宣布退出聯合國。"}, {"stem": "我國退出聯合國的直接原因是下列何者？", "opts": [["A", "美國與我國斷交"], ["B", "聯合國通過決議，由中華人民共和國取得「中國代表權」"], ["C", "政府開放大陸探親"], ["D", "八二三炮戰爆發"]], "ans": "B", "exp": "民國60年，聯合國通過決議，中華人民共和國取代中華民國取得「中國代表權」，我國因而宣布退出聯合國。"}, {"stem": "我國退出聯合國之後，國際外交情勢出現下列哪一種變化？", "opts": [["A", "各國立刻與我國恢復邦交"], ["B", "兩岸隨即簽訂辜汪會談協議"], ["C", "許多友邦紛紛與我國斷交，改與中華人民共和國建交"], ["D", "美國立刻與我國簽訂臺灣關係法"]], "ans": "C", "exp": "我國退出聯合國後，國際地位受到嚴重衝擊，許多原本的友邦紛紛與我國斷交，轉而與中華人民共和國建立邦交關係。"}, {"stem": "中華民國在聯合國中原本具有下列哪一種身分？", "opts": [["A", "觀察員"], ["B", "榮譽會員"], ["C", "創始會員國"], ["D", "候補會員國"]], "ans": "C", "exp": "第二次世界大戰後聯合國成立，中華民國即為創始會員國之一，直到民國60年才因中國代表權問題被迫退出。"}, {"stem": "我國退出聯合國、遭逢外交挫敗後，政府的外交政策轉而採取下列哪一種策略？", "opts": [["A", "徹底放棄與各國往來"], ["B", "完全依賴中華人民共和國協助"], ["C", "只與邦交國維持關係，不與其他國家往來"], ["D", "改採彈性外交，發展與非邦交國之間的經濟、文化實質關係"]], "ans": "D", "exp": "退出聯合國、遭逢斷交潮後，政府為突破外交困境，改採「彈性外交」政策，積極發展與非邦交國之間的經濟、文化等實質交流。"}, {"stem": "美國與我國斷交，是發生在下列哪一年？", "opts": [["A", "民國60年"], ["B", "民國68年"], ["C", "民國77年"], ["D", "民國90年"]], "ans": "B", "exp": "民國68年，美國正式與中華人民共和國建交，並與我國斷交。"}, {"stem": "中美（中華民國與美國）斷交的直接原因是下列何者？", "opts": [["A", "我國退出聯合國"], ["B", "八二三炮戰爆發"], ["C", "美國正式與中華人民共和國建交"], ["D", "政府開放大陸探親"]], "ans": "C", "exp": "民國68年，美國正式與中華人民共和國建交，依國際慣例同時宣布與我國斷交。"}, {"stem": "中美斷交後，下列哪一項條約因此遭到廢止？", "opts": [["A", "中美共同防禦條約"], ["B", "臺灣關係法"], ["C", "辜汪會談協議"], ["D", "一國兩制協議"]], "ans": "A", "exp": "民國68年美國與我國斷交後，同時宣布廢止民國43年簽訂的中美共同防禦條約。"}, {"stem": "中美斷交後，美國國會通過下列哪一項法案，以維持與我國的非官方往來？", "opts": [["A", "兩岸人民關係條例"], ["B", "中美共同防禦條約"], ["C", "國家安全法"], ["D", "臺灣關係法"]], "ans": "D", "exp": "中美斷交、中美共同防禦條約遭廢止後，美國國會另外通過「臺灣關係法」，作為與我國維持非官方往來及提供安全協助的依據。"}, {"stem": "中美斷交後，中華人民共和國對臺灣改採「和平統戰」策略，並提出下列哪一項主張，中華民國政府則以「三不政策」回應？", "opts": [["A", "務實外交"], ["B", "一國兩制"], ["C", "大三通"], ["D", "中華台北"]], "ans": "B", "exp": "民國68年中美斷交後，中華人民共和國對臺改採「和平統戰」，提出「三通四流」「一國兩制」等主張；中華民國政府則以「三不政策」（不接觸、不談判、不妥協）與「三民主義統一中國」回應。"}, {"stem": "政府遷臺後對外關係中的「鞏固外交」時期，其起訖時間大致為下列何者？", "opts": [["A", "民國60年至77年"], ["B", "民國77年至今"], ["C", "民國38年至60年"], ["D", "民國68年至76年"]], "ans": "C", "exp": "「鞏固外交」時期約為民國38年至60年，此時期政府致力爭取友邦支持，鞏固邦交與國際地位，直到民國60年退出聯合國為止。"}, {"stem": "關於「彈性外交」時期（約民國60年至77年）的敘述，下列何者正確？", "opts": [["A", "政府積極發展與非邦交國的經濟、文化交流，但仍堅持中華民國代   if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

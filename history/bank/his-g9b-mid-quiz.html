<script>
const QS=[{"stem": "17世紀時，大批歐洲移民陸續前往北美洲建立殖民地，其中在北美洲東岸建立13州殖民地的主要是哪一國的移民？", "opts": [["A", "西班牙"], ["B", "英國"], ["C", "法國"], ["D", "荷蘭"]], "ans": "B", "exp": "17世紀時大批英國移民前往北美洲東岸，建立13州殖民地，成為日後美國獨立革命的基礎。"}, {"stem": "18世紀中期，英國向北美殖民地開徵新稅，主要原因為何？", "opts": [["A", "鼓勵殖民地發展工業"], ["B", "響應啟蒙思想的分權主張"], ["C", "報復殖民地走私茶葉"], ["D", "彌補對外戰爭造成的財政負擔"]], "ans": "D", "exp": "英、法兩國在北美洲爆發戰爭，英國因作戰導致財政惡化，故向北美13州殖民地開徵新稅，引發殖民地人民不滿。"}, {"stem": "北美殖民地人民反對英國開徵新稅，主要的理由是什麼？", "opts": [["A", "認為國會中沒有殖民地代表，政府無權任意徵稅"], ["B", "認為稅率過高導致糧食短缺"], ["C", "主張君主立憲，廢除國王"], ["D", "要求由國際組織仲裁"]], "ans": "A", "exp": "殖民地人民認為自己在英國國會中沒有代表，政府不應強行徵稅，這正是「無代表，不納稅」精神的展現。"}, {"stem": "1773年，北美殖民地人民將英國商船運至波士頓港的茶葉倒入海中以示抗議，這起事件史稱什麼？", "opts": [["A", "大陸會議"], ["B", "獨立宣言事件"], ["C", "波士頓茶葉事件"], ["D", "五月花公約事件"]], "ans": "C", "exp": "此即著名的「波士頓茶葉事件」，是北美殖民地人民公開反抗英國統治的重要開端，使雙方衝突日漸激烈。"}, {"stem": "1774年起，北美各殖民地代表在哪個城市召開會議，決定對英國採取行動？", "opts": [["A", "紐約"], ["B", "費城"], ["C", "波士頓"], ["D", "華盛頓特區"]], "ans": "B", "exp": "各殖民地代表在費城召開「大陸會議」，之後也在此地發表獨立宣言。"}, {"stem": "美國「獨立宣言」發表的確切時間是？", "opts": [["A", "1776年7月4日"], ["B", "1783年9月3日"], ["C", "1789年7月14日"], ["D", "1804年12月2日"]], "ans": "A", "exp": "1776年7月4日，北美13州代表在費城發表獨立宣言，宣布脫離英國統治，這一天後來成為美國國慶日。"}, {"stem": "美國獨立宣言的內容深受哪一思想影響，強調天賦人權與社會契約論？", "opts": [["A", "民族主義"], ["B", "帝國主義"], ["C", "社會主義"], ["D", "啟蒙運動思想"]], "ans": "D", "exp": "獨立宣言吸收啟蒙運動時期重要的政治學說，如天賦人權與社會契約論，強調政府若破壞人權，人民有權將其推翻。"}, {"stem": "領導北美殖民地軍隊對抗英軍，日後被尊稱為「美國國父」的人物是？", "opts": [["A", "富蘭克林"], ["B", "傑弗遜"], ["C", "華盛頓"], ["D", "林肯"]], "ans": "C", "exp": "華盛頓領導殖民地軍隊與英軍作戰，最終獲勝，並於獨立後當選美國首任總統，被稱為美國國父。"}, {"stem": "北美殖民地軍隊在法國、西班牙等國援助下贏得獨立戰爭勝利，英國最終於西元哪一年承認美國獨立？", "opts": [["A", "1783年"], ["B", "1776年"], ["C", "1789年"], ["D", "1804年"]], "ans": "A", "exp": "殖民地軍隊在法國、西班牙等國協助下逐漸扭轉戰局，英國最終於1783年承認美利堅合眾國獨立。"}, {"stem": "美國獨立建國後所制定的憲法，在世界史上具有什麼重要地位？", "opts": [["A", "是世界第一部君主立憲法"], ["B", "是世界第一部成文憲法"], ["C", "是世界第一部保障貴族特權的憲法"], ["D", "是世界第一部廢除私有財產的憲法"]], "ans": "B", "exp": "美國獨立後制定出世界上第一部成文憲法，確立民主政體，對後世民主政治發展影響深遠。"}, {"stem": "美國憲法採用了下列哪位思想家的學說，將政府分為行政、立法、司法三權，彼此制衡？", "opts": [["A", "盧梭"], ["B", "伏爾泰"], ["C", "孟德斯鳩"], ["D", "洛克"]], "ans": "C", "exp": "美國憲法採取孟德斯鳩的三權分立學說，成為後來許多民主共和國仿效的憲政典範。"}, {"stem": "依據美國憲法所建立的中央與地方關係，下列敘述何者正確？", "opts": [["A", "完全廢除各州政府，權力集中於中央"], ["B", "由英王繼續擁有最終裁決權"], ["C", "各州各自獨立，彼此互不隸屬，也無中央政府"], ["D", "成立聯邦政府，各州仍保有司法、財政、教育等權力"]], "ans": "D", "exp": "美國建立聯邦政府，中央統籌全國性事務，同時授予各州司法、財政、教育等權力，落實啟蒙思想中的分權概念。"}, {"stem": "法國大革命爆發前，法國社會主要分為哪三個階級？", "opts": [["A", "教士、貴族、平民"], ["B", "國王、貴族、軍人"], ["C", "資產階級、無產階級、農民"], ["D", "王室、議會、法院"]], "ans": "A", "exp": "中世紀以來，法國社會分為教士、貴族、平民三個階級，教士與貴族人數雖少，卻擁有最多的財富與特權。"}, {"stem": "法王路易十六為解決財政困難，於1789年召開什麼會議，卻意外引發後續革命？", "opts": [["A", "國民會議"], ["B", "三級會議"], ["C", "維也納會議"], ["D", "制憲會議"]], "ans": "B", "exp": "路易十六為徵收新稅而召開三級會議，卻因表決方式引發平民代表不滿，成為法國大革命的導火線。"}, {"stem": "三級會議的表決方式為何會讓平民代表感到不滿？", "opts": [["A", "平民完全沒有投票權"], ["B", "貴族與教士需繳交比平民更高的稅"], ["C", "會議僅開放貴族參加，平民不得列席"], ["D", "採一階級一票，教士與貴族常聯合起來，使平民居於劣勢"]], "ans": "D", "exp": "三級會議依傳統一個階級各有一票，教士與貴族利益相近、常聯合投票，使人數最多的平民代表在表決上居於不利地位。"}, {"stem": "法國大革命的序幕，是1789年7月14日巴黎民眾攻陷了下列哪一座建築？", "opts": [["A", "凡爾賽宮"], ["B", "羅浮宮"], ["C", "巴士底監獄"], ["D", "聖母院"]], "ans": "C", "exp": "1789年7月14日，巴黎群眾攻陷巴士底監獄，揭開法國大革命的序幕，這一天後來訂為法國國慶日。"}, {"stem": "法國大革命期間，接掌政權的國民會議發表了哪一份重要文獻，主張主權在民、保障人民權利？", "opts": [["A", "人權宣言"], ["B", "獨立宣言"], ["C", "拿破崙法典"], ["D", "大憲章"]], "ans": "A", "exp": "國民會議接掌政權後通過人權宣言，主張主權在民、天賦人權不可剝奪，並要求廢除貴族與教會的特權。"}, {"stem": "法國大革命爆發後，部分歐洲國家的君主組成反法聯軍進攻法國，其主要原因為何？", "opts": [["A", "法國拒絕償還外債"], ["B", "擔憂法國大革命的思潮蔓延至本國"], ["C", "法國入侵鄰國領土"], ["D", "法國宣布退出維也納會議"]], "ans": "B", "exp": "歐洲各國君主擔心法國大革命所主張的自由平等思想蔓延到自己國家，因此組成反法聯軍進攻法國。"}, {"stem": "法國大革命期間，大肆處決異己、造成局勢動盪不安的「恐怖統治」，主要與下列何人有關？", "opts": [["A", "拿破崙"], ["B", "路易十六"], ["C", "羅伯斯比"], ["D", "梅特涅"]], "ans": "C", "exp": "羅伯斯比掌權後大肆處決反對者，實施恐怖統治，最終反對者發動政變，將其處死，結束了這段動盪時期。"}, {"stem": "法國將領拿破崙能夠崛起掌權，主要是因為下列哪一項功績？", "opts": [["A", "起草法國人權宣言"], ["B", "領導波士頓茶葉事件"], ["C", "主導召開維也納會議"], ["D", "多次擊敗反法聯軍，被視為革命英雄"]], "ans": "D", "exp": "拿破崙多次擊敗反法聯軍，因而受到人民支持，逐漸掌握政治大權，並於1804年稱帝 前所有海外殖民地"], ["B", "要求德國承擔戰爭責任"], ["C", "要求德國裁減軍備"], ["D", "要求德國負擔巨額賠款"]], "ans": "A", "exp": "凡爾賽條約要求德國承擔戰爭責任、裁減軍備、負擔巨額賠款並割讓領土，並未允許德國保留所有海外殖民地。"}, {"stem": "「凡爾賽條約」對德國的苛刻要求，造成下列何種後續影響？", "opts": [["A", "促使德國迅速恢復強盛，成為歐洲霸主"], ["B", "引發德國人民強烈不滿，埋下日後第二次世界大戰爆發的禍因"], ["C", "使德國順利加入國際聯盟成為常任理事國"], ["D", "讓德國自願放棄工業發展"]], "ans": "B", "exp": "凡爾賽條約要求德國承擔戰爭責任、割地賠款、限制軍備，引發德國人民強烈不滿，埋下日後第二次世界大戰爆發的禍因。"}, {"stem": "下列關於「孤立主義」的敘述，何者正確？", "opts": [["A", "是指美國積極介入歐洲各國的內政事務"], ["B", "是德國在戰後採取的外交政策"], ["C", "主張美國應主動出兵協助歐洲重建"], ["D", "一次大戰後，美國因戰債難以收回、參戰損失龐大，故不再積極參與國際事務"]], "ans": "D", "exp": "課本說明一次大戰後，美國對歐洲國家的戰債難以收回，加上參戰期間損失龐大，使美國不再積極參與國際事務，此即「孤立主義」，也是美國未加入國聯的主因。"}, {"stem": "十九世紀末，日本因應列強侵略，效仿歐美推動改革並轉而侵略亞洲鄰國的主張，其具體作為為何？", "opts": [["A", "拒絕與西方各國往來，堅持鎖國政策"], ["B", "效仿歐美列強推動改革（如明治維新），並轉而以中國等亞洲鄰國為侵略目標"], ["C", "邀請中國共同抵抗西方列強"], ["D", "主動放棄工業化，維持傳統農業社會"]], "ans": "B", "exp": "康軒版補充資料引用日本思想家主張「不如脫離其行伍，而與西洋各文明國家共進退」，說明日本因應列強侵略採取推動改革、走向工業化的措施，之後更效仿列強侵略亞洲，以中國為主要目標。"}, {"stem": "課本引用十九世紀美國雜誌上「白種人的負擔」諷刺漫畫，圖中描繪英美兩國分別背負著哪些地區人民爬向標有「文明」的山頂？", "opts": [["A", "亞洲、非洲與拉丁美洲"], ["B", "僅限於非洲地區"], ["C", "歐洲各殖民母國"], ["D", "僅限於亞洲地區"]], "ans": "A", "exp": "翰林版課本說明，漫畫中可見英、美兩國分別背負著亞洲、非洲與拉丁美洲國家的人民，爬向標有「文明」的山頂，諷刺帝國主義以「教化」為名的侵略行為。"}, {"stem": "綜合三版本課本內容，第一次世界大戰爆發的根本原因，最主要與下列何者有關？", "opts": [["A", "單純是一場宗教戰爭"], ["B", "純粹因經濟大蕭條而引發"], ["C", "帝國主義下列強競逐殖民地、結盟對抗，加上巴爾幹半島民族與宗教衝突，經塞拉耶佛事件引爆"], ["D", "起因於美洲殖民地的獨立運動"]], "ans": "C", "exp": "三版本課本皆說明，列強因帝國主義競爭而結盟形成三國同盟與三國協約，加上巴爾幹半島「歐洲火藥庫」的民族、宗教衝突，最終因塞拉耶佛事件引爆第一次世界大戰。"}, {"stem": "下列關於第一次世界大戰的敘述，何者正確？", "opts": [["A", "戰爭僅侷限於歐洲本土，未波及殖民地"], ["B", "戰爭期間各國廣泛動員全國人力物力，並運用坦克、毒氣、潛艇、飛機等新式武器，造成大量軍民死傷"], ["C", "戰爭結束後，鄂圖曼帝國勢力反而更加強盛"], ["D", "美國自始至終未曾參與此次戰爭"]], "ans": "B", "exp": "一次大戰期間各國為求勝利而全國總動員，並使用坦克、毒氣、潛艇、飛機等新式武器，造成軍民死傷慘重；鄂圖曼帝國則因戰敗而瓦解，美國也於1917年參戰。"}, {"stem": "綜合而言，第一次世界大戰對戰後國際秩序造成下列何種影響？", "opts": [["A", "世界從此再無戰爭"], ["B", "歐洲列強的殖民地全數獨立"], ["C", "國際聯盟運作順利，成功維持世界和平"], ["D", "舊有四大帝國瓦解、民族自決風潮興起，但巴黎和會的安排也埋下日後衝突的種子"]], "ans": "D", "exp": "一次大戰使俄羅斯、奧匈、德意志、鄂圖曼四大帝國瓦解，民族自決風潮興起，出現許多新興國家；但巴黎和會對德國的苛刻條約與國聯的無力，也埋下日後第二次世界大戰爆發的禍因。"}];
let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}

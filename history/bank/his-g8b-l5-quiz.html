<script>
const QS=[{"stem": "中華人民共和國於哪一年成立，並以何處為首都？", "opts": [["A", "1945年，重慶"], ["B", "1949年，北京"], ["C", "1949年，南京"], ["D", "1958年，北京"]], "ans": "B", "exp": "西元1949年10月1日，中共在北京天安門舉行建國典禮，中華人民共和國正式成立，定都北京。"}, {"stem": "中華人民共和國成立初期，政權主要掌握在下列何人手中？", "opts": [["A", "蔣中正"], ["B", "鄧小平"], ["C", "江澤民"], ["D", "毛澤東"]], "ans": "D", "exp": "建國初期，中華人民共和國由毛澤東主政，實行中國共產黨一黨專政。"}, {"stem": "中華人民共和國建國後，其政治體制屬於下列何者？", "opts": [["A", "中國共產黨一黨專政"], ["B", "民主共和、多黨競爭"], ["C", "君主立憲"], ["D", "軍政府聯合執政"]], "ans": "A", "exp": "中華人民共和國由中國共產黨全面掌握政權，實行一黨專政，並清剿反對勢力。"}, {"stem": "中共建國初期推動「土地改革」，其主要做法為何？", "opts": [["A", "將全國土地收歸軍隊管理"], ["B", "廢除農業、全力發展工業"], ["C", "沒收地主土地，分配給貧苦農民"], ["D", "鼓勵農民出國耕種以換取外匯"]], "ans": "C", "exp": "土地改革強制沒收地主的土地與財產，重新分配給農民耕種，因此獲得農民的支持。"}, {"stem": "中共建國初期針對民間工商企業採取下列何種措施？", "opts": [["A", "鼓勵私人企業自由競爭"], ["B", "逐步收歸國有"], ["C", "全面開放外商投資"], ["D", "全部關閉停業，不再營運"]], "ans": "B", "exp": "土地改革之後，中共針對工商業者，逐步將民間企業收歸國有，消除私有資本。"}, {"stem": "中共建國初期對知識分子採取的做法，下列敘述何者正確？", "opts": [["A", "給予言論自由，鼓勵批評政府"], ["B", "大量選送出國留學"], ["C", "免除其工作義務、優渥禮遇"], ["D", "推動思想改造，控制其言論思想"]], "ans": "D", "exp": "中共針對知識分子推動大規模的「思想改造」，灌輸共產主義思想，並強化對思想、言論的控制。"}, {"stem": "承上題，中共對知識分子的思想控制手段，常見透過下列何種方式進行？", "opts": [["A", "監督與批鬥"], ["B", "舉辦公開選舉"], ["C", "提供高額獎學金"], ["D", "召開國際學術會議"]], "ans": "A", "exp": "課本提到中共透過監督、批鬥的方式，控制知識分子的言論與思想，清除反對勢力。"}, {"stem": "土地改革與工商企業國有化的推動，反映出中共建國初期最主要的目標為何？", "opts": [["A", "促進國際貿易"], ["B", "恢復傳統科舉制度"], ["C", "鞏固共產政權、掌控經濟資源"], ["D", "發展觀光產業"]], "ans": "C", "exp": "建國初期，中共透過土地改革、消滅私營、控制思想等措施，目的都在鞏固共黨政權、全面掌控經濟與社會資源。"}, {"stem": "毛澤東於西元1958年推動的「大躍進」運動，其目標是希望達成下列何種口號？", "opts": [["A", "民主自由"], ["B", "超英趕美"], ["C", "統一中國"], ["D", "三民主義"]], "ans": "B", "exp": "毛澤東希望快速提升中國農、工業產量，達成「超英趕美」的目標，因而推行大躍進運動。"}, {"stem": "大躍進期間，中共在農村推行下列何種組織，以集體方式進行生產？", "opts": [["A", "生產合作社"], ["B", "農民議會"], ["C", "合作農場"], ["D", "人民公社"]], "ans": "D", "exp": "大躍進期間，中共在農村建立「人民公社」，集中土地、勞動力等資源，進行集體生產。"}, {"stem": "人民公社的生產方式與結果，下列敘述何者正確？", "opts": [["A", "個人自由耕作，糧食產量大增"], ["B", "引進外資機械，提升生產效率"], ["C", "集體生產、收穫共享，導致農民生產意願低落"], ["D", "完全私有化，農民彼此競爭激烈"]], "ans": "C", "exp": "人民公社實行集體生產與收穫共享，削弱了農民的生產意願，導致農業生產力大幅下滑。"}, {"stem": "大躍進期間，中共為提高鋼鐵產量，號召民眾進行下列何種運動？", "opts": [["A", "土法煉鋼"], ["B", "興修水利"], ["C", "開墾荒地"], ["D", "植樹造林"]], "ans": "A", "exp": "毛澤東號召全民「土法煉鋼」，在各地建土高爐，投入大量勞力煉鋼，以支持工業建設。"}, {"stem": "「土法煉鋼」運動最後導致的結果為何？", "opts": [["A", "鋼鐵產量大幅提升，達成超英趕美目標"], ["B", "煉出大量優質鋼材，支援工業建設"], ["C", "使中國成為世界鋼鐵出口大國"], ["D", "多半煉出無用廢鐵，浪費大量人力與資源"]], "ans": "D", "exp": "小煉鋼爐因技術不成熟，生產的僅是粗糙的鐵塊，完全無法達到預期目標，反而導致農業勞動力嚴重短缺。"}, {"stem": "大躍進期間，許多地方官員為迎合中央政策，往往採取下列何種做法？", "opts": [["A", "如實回報生產不足的情形"], ["B", "虛報浮誇的生產數字"], ["C", "公開批評大躍進政策"], ["D", "拒絕執行中央下達的命令"]], "ans": "B", "exp": "地方官員為達成中央制定的生產指標，往往誇大農業和工業的實際產量，形成「浮誇風」，讓中央誤以為經濟狀況良好。"}, {"stem": "大躍進運動最終造成的嚴重後果為何？", "opts": [["A", "中國迅速超越英美，成為世界強權"], ["B", "農業生產力大幅提升"], ["C", "發生大規模饑荒，數千萬人因而喪生"], ["D", "城市化快速完成，人民生活富裕"]], "ans": "C", "exp": "大躍進政策運用失當，加上糧食不足與過度勞動，造成大規模饑荒，估計有數千萬人死於飢餓相關疾病。"}, {"stem": "依據課本內容，大躍進失敗後，毛澤東的處境有何變化？", "opts": [["A", "地位受到黨內挑戰，因而辭去國家元首職務"], ["B", "聲望不減反增，順利連任"], ["C", "立即遭到罷黜並流放海外"], ["D", "獲得國際社會一致讚揚"]], "ans": "A", "exp": "大躍進的災難性後果在中共黨內引發批評聲浪，毛澤東因此辭去國家元首的職務，其後才又於文革中設法重新掌權。"}, {"stem": "下列關於大躍進運動的敘述，何者錯誤？", "opts": [["A", "內容包括農業集體化與全民煉鋼"], ["B", "目的是希望快速提升生產力，趕上英美"], ["C", "造成農業與工業資源的嚴重浪費"], ["D", "是一場成功的經濟建設，大幅提高人民生活水準"]], "ans": "D", "exp": "大躍進其實是一場失敗的政策，非但沒有提高人民生活水準，反而導致經濟惡化與大饑荒，故此敘述錯誤。"}, {"stem": "人民公社時期曾出現「吃飯不花錢」的做法，這指的是下列何種制度？", "opts": [["A", "免費醫療"], ["B", "公共食堂"], ["C", "義務教育"], ["D", "集體婚禮"]], "ans": "B", "exp": "人民公社集結生產大隊，在集體互助前提下開辦公共食堂，主張「吃飯不花錢，努力搞生產」。"}, {"stem": "毛澤東於西元1966年發動「文化大革命」，其主要目的為何？", "opts": [["A", "推動經濟改革開放"], ["B", "加強與國際社會的交流"], ["C", "重新掌握最高權力，打擊政敵"], ["D", "促進兩岸和平統一"]], "ans": "C", "exp": "大躍進失敗後毛澤東地位受挑戰，他為重掌大權，於1966年發動文化大革命，藉批鬥官員打擊政敵。"}, {"stem": "文化大革命期間，毛澤東號召下列何種身分的人組成「紅衛兵」？", "opts": [["A", "青年學生"], ["B", "農民"], ["C", "軍人"], ["D", "知識分子"]], "ans": "A", "exp": "毛澤東利用青年學生組織「紅衛兵」，展開鬥爭、批鬥官員與知識分子。"}, {"stem": "文化大革命提出的「破四舊、立四新」，其中「四舊」是指下列何者？", "opts": [["A", "蘇聯共產主義思想"], ["B", "西方資本主義制度"], ["C", "國民政府的政治體制"], ["D", "中國傳統的思想、文化、風俗、習慣"]], "ans": "D", "exp": "「四舊」指中國傳統的思想、文化、風俗、習慣；「四新」則是符合共產主義的思想、文化、風俗、習慣。"}, {"stem": "文化大革命期間，紅衛兵常對下列何種對象進行批鬥？", "opts": [["A", "外國商人"], ["B", "官員、師長與知識分子"], ["C", "農民與工人"], ["D", "軍隊將領"]], "ans": "B", "exp": "紅衛兵批鬥各級官員、師長與知識分子，剷除異己，許多人因此受到迫害。"}, {"stem": "下列何者是文化大革命期間常見的口號？", "opts": [["A", "革命無罪、造反有理"], ["B", "三民主義統一中國"], ["C", "超英趕美"], ["D", "一國兩制"]], "ans": "A", "exp": "文革高倡「破四舊、立四新」、「革命無罪、造反有理」等口號，鼓動群眾展開批鬥行動。"}, {"stem": "文化大革命對中國社會造成的影響，下列敘述何者正確？", "opts": [["A", "教育蓬勃發展，經濟快速成長"], ["B", "民主自由獲得保障"], ["C", "社會動盪、道德扭曲、教育停頓、經濟衰退"], ["D", "知識分子地位大幅提升"]], "ans": "C", "exp": "文革破壞了傳統倫理與文化，導致社會動盪、道德扭曲、教育停頓與經濟衰退，被稱為「十年浩劫」。"}, {"stem": "文化大革命的浪潮也影響了西方社會，下列敘述何者正確？", "opts": [["A", "西方國家出兵鎮壓文革"], ["B", "西方社會全面抵制中國商品"], ["C", "歐美各國與中國斷絕外交關係"], ["D", "文革口號吸引部分歐美青年，促成學生運動與社會抗議風潮"]], "ans": "D", "exp": "文革「革命無罪、造反有理」的口號傳到世界各地，吸引不滿現狀的歐美青年，促成學生運動與社會抗議風潮。"}, {"stem": "西元1968年，哪一個西方國家爆發大規模學運，學生高舉毛澤東肖像作為反抗權威的象徵？", "opts": [["A", "美國"], ["B", "法國"], ["C", "英國"], ["D", "德國"]], "ans": "B", "exp": "西元1968年法國爆發大規模學運，學生占領巴黎大學校園，並高舉毛澤東肖像作為反抗權威的象徵。"}, {"stem": "文化大革命持續多年，被稱為「十年浩劫」，其結束的關鍵在於下列何事？", "opts": [["A", "西元1976年毛澤東逝世"], ["B", "鄧小平發動政變"], ["C", "六四天安門事件爆發"], ["D", "中國加入聯合國"]], "ans": "A", "exp": "西元1976年毛澤東逝世後，文化大革命造成的「十年浩劫」才逐漸告一段落。"}, {"stem": "承上題，文化大革命前後大約持續了多少年？", "opts": [["A", "五年"], ["B", "二十年"], ["C", "十年"], ["D", "三十年"]], "ans": "C", "exp": "文化大革命自西元1966年發動，至1976年毛澤東逝世後才告一段落，前後長達十年，故稱「十年浩劫」。"}, {"stem": "文化大革命結束後，中國政局逐漸由下列何人掌握大權？", "opts": [["A", "江澤民"], ["B", "胡錦濤"], ["C", "習近平"], ["D", "鄧小平"]], "ans": "D", "exp": "文革結束後，鄧小平逐漸掌握政權，一面推動經濟改革，一面致力維護政權穩定。"}, {"stem": "鄧小平於西元1978年開始推動的政策，一般稱為下列何者？", "opts": [["A", "大躍進"], ["B", "改革開放"], ["C", "文化大革命"], ["D", "一國兩制"]], "ans": "B", "exp": "西元1978年，鄧小平開始推動「改革開放」政策，主張優先發展經濟。"}, {"stem": "「改革開放」政策的主要方針，下列敘述何者正確？", "opts": [["A", "對內改革、對外開放，優先發展經濟"], ["B", "政治民主化，經濟持續管制"], ["C", "對內維持計畫經濟，對外完全封閉"], ["D", "全面私有化並放棄共產黨領導"]], "ans": "A", "exp": "鄧小平推動「對內改革，對外開放」，逐步放寬經濟限制，轉而積極發展市場經濟。"}, {"stem": "鄧小平     const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

<script>
const QS=[{"stem": "第二次世界大戰結束、日本宣布無條件投降，臺灣、澎湖改由中華民國治理，是在民國幾年？", "opts": [["A", "32 年"], ["B", "33 年"], ["C", "34 年"], ["D", "35 年"]], "ans": "C", "exp": "民國34年8月，日本宣布無條件投降，第二次世界大戰結束，臺灣、澎湖改由中華民國治理。"}, {"stem": "中華民國政府接收臺灣後，設立了下列哪一個機構負責接收與治理事宜？", "opts": [["A", "臺灣省行政長官公署"], ["B", "臺灣總督府"], ["C", "臺灣省政府"], ["D", "臺灣省議會"]], "ans": "A", "exp": "政府接收臺灣後設立「臺灣省行政長官公署」，負責處理接收與治理事宜；臺灣總督府是日治時期的統治機構，臺灣省政府則是二二八事件後才成立、用以取代行政長官公署。"}, {"stem": "臺灣省行政長官公署首任行政長官是誰？", "opts": [["A", "蔣中正"], ["B", "陳儀"], ["C", "蔣經國"], ["D", "李登輝"]], "ans": "B", "exp": "中華民國政府任命陳儀為行政長官，負責處理接收臺灣的事宜。"}, {"stem": "臺灣省行政長官的職權有何特色？", "opts": [["A", "需經人民選舉產生"], ["B", "只管行政、不管軍事"], ["C", "由臺籍人士出任"], ["D", "集軍政大權於一身"]], "ans": "D", "exp": "行政長官集軍政大權於一身，權力極大，也因此讓臺籍精英未獲政府重視，埋下民怨。"}, {"stem": "下列關於戰後初期臺灣人對政府逐漸不滿的原因，何者「錯誤」？", "opts": [["A", "政府大量引進日本移民來臺開發"], ["B", "部分官員、軍警貪汙或濫用特權"], ["C", "政府將米糧等物資運往大陸，支援國共內戰，導致物價飛漲"], ["D", "臺灣人與大陸人士語言、生活習慣不同，增加彼此隔閡"]], "ans": "A", "exp": "課本並未提到政府引進日本移民來臺開發；戰後初期民怨主要來自官員貪汙濫權、經濟惡化物價飛漲、以及文化語言隔閡等問題。"}, {"stem": "戰後初期臺灣物價飛漲情形加劇，與下列何者關係最密切？", "opts": [["A", "政府大量印製鈔票購買軍火"], ["B", "農民拒絕耕種"], ["C", "行政長官公署將米糧等物資運往大陸，支援國共內戰"], ["D", "日本殖民政府破壞基礎建設"]], "ans": "C", "exp": "行政長官公署將臺灣的米糧等物資運往中國大陸支援國共內戰，導致戰後臺灣物價飛漲情形更加嚴重。"}, {"stem": "二二八事件爆發的直接導火線是？", "opts": [["A", "政府宣布戒嚴"], ["B", "專賣局人員在臺北查緝私菸時誤殺市民"], ["C", "美麗島雜誌社舉行遊行"], ["D", "政府實施報禁"]], "ans": "B", "exp": "民國36年2月27日，官員在臺北查緝私菸時誤殺市民，次日民眾前往行政長官公署抗議卻遭射殺，引發全臺衝突，此即二二八事件。"}, {"stem": "二二八事件發生於民國幾年？", "opts": [["A", "35 年"], ["B", "37 年"], ["C", "38 年"], ["D", "36 年"]], "ans": "D", "exp": "二二八事件發生於民國36年2月27、28日。"}, {"stem": "二二八事件爆發後，各地臺籍精英組成下列哪一組織，維持社會秩序並要求政治改革？", "opts": [["A", "臺灣議會期成同盟會"], ["B", "中國民主黨"], ["C", "二二八事件處理委員會"], ["D", "臺灣省諮議會"]], "ans": "C", "exp": "衝突發生後，各地士紳、臺籍精英組成「二二八事件處理委員會」，維持社會秩序並要求政府進行改革。"}, {"stem": "面對二二八事件的衝突，行政長官陳儀採取了下列哪一項處置方式？", "opts": [["A", "以臺人叛亂為由，請求中央政府派兵鎮壓、進行清鄉"], ["B", "立即實施地方自治"], ["C", "主動辭職謝罪"], ["D", "召開國是會議協商"]], "ans": "A", "exp": "陳儀以臺人叛亂為由請求中央政府派兵，國軍抵臺後展開鎮壓並進行「清鄉」，不少民眾因此遭到殺害。"}, {"stem": "二二八事件後，中央政府採取了下列哪一項措施？", "opts": [["A", "宣布戒嚴"], ["B", "制定動員戡亂時期臨時條款"], ["C", "廢除動員戡亂時期臨時條款"], ["D", "將陳儀解職，成立臺灣省政府取代行政長官公署"]], "ans": "D", "exp": "二二八事件後，中央政府將陳儀解職，成立臺灣省政府取代行政長官公署，並派員來臺調查。"}, {"stem": "關於政府對二二八事件的平反措施，下列何者「不包含」在內？", "opts": [["A", "公開道歉"], ["B", "恢復陳儀原本的官職"], ["C", "賠償受害者家屬"], ["D", "興建紀念碑、訂定和平紀念日"]], "ans": "B", "exp": "民國八十年代，政府對當年的處置失當公開道歉，並透過賠償、訂定和平紀念日、興建紀念碑等行動撫平歷史傷痕，但並未恢復陳儀官職。"}, {"stem": "民國36年，中華民國政府正式做了下列哪一件事？", "opts": [["A", "宣布實施憲政，並選出中央民意代表及總統、副總統"], ["B", "宣布戒嚴"], ["C", "遷都臺北"], ["D", "成立民主進步黨"]], "ans": "A", "exp": "中華民國政府於民國36年宣布實施憲政，隔年（37年）選出中央民意代表及總統、副總統。"}, {"stem": "政府制定動員戡亂時期臨時條款的背景是？", "opts": [["A", "為鎮壓二二八事件"], ["B", "為推動地方自治"], ["C", "為因應國共內戰"], ["D", "為因應美麗島事件"]], "ans": "C", "exp": "政府為因應國共內戰，於民國37年制定動員戡亂時期臨時條款，使全國進入戰爭準備狀態。"}, {"stem": "動員戡亂時期臨時條款對總統職權造成了什麼影響？", "opts": [["A", "限制總統連任次數為兩屆"], ["B", "廢除總統職位"], ["C", "將總統改由地方首長選舉產生"], ["D", "提高總統權力，屢次修訂後使總統得以一再連任"]], "ans": "D", "exp": "動員戡亂時期臨時條款使總統權力提高，政府屢次修訂條文，使總統得以一再連任，不受憲法連任次數限制。"}, {"stem": "臺灣省政府發布戒嚴令是在民國幾年？", "opts": [["A", "36 年"], ["B", "38 年"], ["C", "37 年"], ["D", "39 年"]], "ans": "B", "exp": "民國38年，臺灣省政府為防止共產黨滲透和傳播共產思想，下令戒嚴。"}, {"stem": "戒嚴令限制了人民下列哪些自由？", "opts": [["A", "僅限制出國旅遊"], ["B", "僅限制經商自由"], ["C", "言論、出版、集會、結社等自由"], ["D", "僅限制受教育權"]], "ans": "C", "exp": "戒嚴令限制人民的言論、出版、集會、結社、營業時間等自由，對憲法所賦予人民的自由造成侵害。"}, {"stem": "中華民國政府正式遷往臺灣是在什麼時候？", "opts": [["A", "民國38年底"], ["B", "民國36年"], ["C", "民國37年"], ["D", "民國40年"]], "ans": "A", "exp": "民國38年10月1日中華人民共和國成立，中華民國政府則於同年12月遷往臺灣。"}, {"stem": "關於中華人民共和國成立與中華民國政府遷臺的先後關係，下列敘述何者正確？", "opts": [["A", "兩者互不相關"], ["B", "民國38年10月中華人民共和國成立，同年12月中華民國政府遷臺"], ["C", "中華民國政府遷臺後，中華人民共和國才成立"], ["D", "中華人民共和國成立後，臺灣立即解除戒嚴"]], "ans": "B", "exp": "民國38年10月1日，中華人民共和國成立；中華民國政府則於當年12月遷臺，之後政府為應付兩岸情勢，屢次修訂動員戡亂時期臨時條款。"}, {"stem": "臺灣的白色恐怖，以下列哪個時期最為嚴重？", "opts": [["A", "民國30年代"], ["B", "民國60年代"], ["C", "民國70年代"], ["D", "民國四十、五十年代"]], "ans": "D", "exp": "課本指出白色恐怖尤以民國四十、五十年代最為嚴重。"}, {"stem": "白色恐怖時期，情治機關逮捕異議份子時常用的藉口是？", "opts": [["A", "「反叛政府」、「為匪宣傳」等"], ["B", "貪污瀆職"], ["C", "違反選舉法規"], ["D", "妨害社會風化"]], "ans": "A", "exp": "情治機關常以「反叛政府」、「為匪宣傳」等藉口，不依法律程序逮捕或殺害異議分子，造成許多冤獄。"}, {"stem": "關於白色恐怖受難者，下列敘述何者正確？", "opts": [["A", "僅限外省籍人士"], ["B", "僅限男性"], ["C", "不分性別、年齡，不論本省、外省、原住民"], ["D", "僅限知識分子"]], "ans": "C", "exp": "課本明白指出白色恐怖受難者「不分性別、年齡，不論本省、外省、原住民」，使人民的生命、財產、精神受到嚴重傷害。"}, {"stem": "白色恐怖時期，一般民眾普遍的反應是？", "opts": [["A", "踴躍參與政治活動"], ["B", "積極組織政黨"], ["C", "要求政府立即解嚴"], ["D", "畏懼參與政治、不願談論國事"]], "ans": "D", "exp": "白色恐怖時期人人自危，民眾大多畏懼參與政治，也不願談論國事。"}, {"stem": "政府自民國39年起，推動了下列哪一項政治改革？", "opts": [["A", "廢除動員戡亂時期臨時條款"], ["B", "開放地方首長和民意代表的直接民選"], ["C", "宣布解除戒嚴"], ["D", "舉辦總統直選"]], "ans": "B", "exp": "自民國39年起，政府逐漸開放地方首長和民意代表的直接民選，實施臺灣地方自治。"}, {"stem": "戒嚴時期臺灣的地方自治「並未完全落實」，主要原因是？", "opts": [["A", "地方民意代表選舉全面停辦"], ["B", "人民完全沒有投票權"], ["C", "縣市級以下首長、民代雖已直選，但省主席、直轄市長仍由官方指派"], ["D", "地方政府遭到裁撤"]], "ans": "C", "exp": "戒嚴期間雖開放縣市級以下的地方自治，但省主席、直轄市長仍由官方指派，地方自治未能完全落實。"}, {"stem": "戒嚴時期，雷震主要透過下列哪一種方式批評政府施政？", "opts": [["A", "發行《自由中國》雜誌"], ["B", "組織武裝游擊隊"], ["C", "在立法院提案"], ["D", "於報紙頭版刊登廣告"]], "ans": "A", "exp": "雷震等人在《自由中國》雜誌上持續批評政府施政、提倡民主政治。"}, {"stem": "民國49年，雷震等人試圖籌組下列哪一政黨，最終遭到政府壓制？", "opts": [["A", "民主進步黨"], ["B", "臺灣民眾黨"], ["C", "中國國民黨"], ["D", "中國民主黨"]], "ans": "D", "exp": "民國49年，雷震等人試圖籌組「中國民主黨」以制衡執政黨勢力，最終遭到政府壓制，此即「雷震事件」。"}, {"stem": "「雷震事件」最後的結果是？", "opts": [["A", "政府同意組黨"], ["B", "雷震遭逮捕入獄，組黨計畫遭到壓制"], ["C", "促成蔣中正下臺"], ["D", "直接促成解嚴"]], "ans": "B", "exp": "雷震籌組中國民主黨最終遭到政府壓制，雷震本人也被捕入獄。"}, {"stem": "美麗島事件發生於民國幾年？", "opts": [["A", "68 年"], ["B", "58 年"], ["C", "78 年"], ["D", "88 年"]], "ans": "A", "exp": "民國68年，美麗島雜誌社以紀念國際人權日為由，在高雄舉行遊行活動，發生美麗島事件。"}, {"stem": "美麗島事件發生的地點是？", "opts": [["A", "臺北"], ["B", "臺中"], ["C", "高雄"], ["D", "臺南"]], "ans": "C", "exp": "美麗島事件發生於高雄，美麗島雜誌社在當地舉行「國際人權日紀念大會」的遊行活動。"}, {"stem": "美麗島事件的起因是？", "opts": [["A", "政府開放報禁"], ["B", "美麗島雜誌社以紀念國際人權日為由，舉行遊行活動"], ["C", "政府舉辦總統直選"], ["D", "二二八事件獲得平反"]], "ans": "B", "exp": "民國68年，美麗島雜誌社以紀念國際人權日為由，在高雄舉行遊行活動，呼籲解除戒嚴，過程中發生軍警與人民的衝突。"}, {"stem": "美麗島事件後，黨外人士持續推動民主運動，並於民國幾年成立民主進步黨？", "opt let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

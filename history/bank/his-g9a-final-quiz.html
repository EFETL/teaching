<script>
const QS=[{"stem": "中世紀後期，歐洲人想要開闢前往亞洲的新航路，最主要的原因為何？", "opts": [["A", "想尋找新的傳教據點"], ["B", "想與非洲建立邦交"], ["C", "東西方傳統貿易路線被鄂圖曼土耳其人與義大利商人把持，導致亞洲香料、絲綢等商品價格高昂"], ["D", "想尋找失落的黃金國"]], "ans": "C", "exp": "中世紀後期歐洲人對亞洲香料、絲綢等奢侈品需求增加，但傳統歐亞貿易路線被鄂圖曼土耳其人和義大利商人居間控制、抬高價格，促使歐洲商人另尋通往東方的新航路。"}, {"stem": "「大航海時代」得以興盛的原因，下列何者錯誤？", "opts": [["A", "蒸汽船的發明大幅縮短航行時間"], ["B", "羅盤等航海技術的進步"], ["C", "各國王室的資助與支持"], ["D", "貿易獲利的強烈動機"]], "ans": "A", "exp": "大航海時代（約十五至十七世紀）使用的是帆船，蒸汽船要到十九世紀工業革命後才出現，故為錯誤選項。真正促成大航海時代的因素包括航海技術進步（如羅盤的使用）、王室資助，以及龐大的貿易利益。"}, {"stem": "歐洲最早發展海外探險的國家是？", "opts": [["A", "西班牙"], ["B", "荷蘭"], ["C", "英格蘭"], ["D", "葡萄牙"]], "ans": "D", "exp": "葡萄牙在王室鼓勵下最早尋找新貿易航線，是最早發展海外探險的國家。"}, {"stem": "十五世紀末，首先發現非洲南端好望角的航海家是誰？", "opts": [["A", "哥倫布"], ["B", "狄亞士"], ["C", "達伽馬"], ["D", "麥哲倫"]], "ans": "B", "exp": "狄亞士在十五世紀末抵達非洲南端的好望角，為葡萄牙人開闢通往東方的航路奠定基礎。"}, {"stem": "下列何人繼狄亞士之後，成功繞過好望角、抵達印度，開通歐洲通往亞洲的新航路？", "opts": [["A", "達伽馬"], ["B", "哥倫布"], ["C", "麥哲倫"], ["D", "庫克船長"]], "ans": "A", "exp": "達伽馬繼狄亞士之後，繞過好望角抵達印度，開通歐洲經海路直達亞洲的新航路。"}, {"stem": "里斯本的「發現者紀念碑」是為了紀念下列哪一段歷史而建立？", "opts": [["A", "工業革命"], ["B", "宗教改革"], ["C", "大航海時代"], ["D", "法國大革命"]], "ans": "C", "exp": "發現者紀念碑位於葡萄牙里斯本，建於1940年，碑上刻有亨利王子、狄亞士、達伽馬、麥哲倫等航海家，用以紀念大航海時代。"}, {"stem": "新航路開通後，歐洲歷史發展的重心，逐漸從地中海地區轉移到下列何處？", "opts": [["A", "波羅的海沿岸"], ["B", "紅海沿岸"], ["C", "黑海沿岸"], ["D", "大西洋沿岸"]], "ans": "D", "exp": "隨著新航路的開闢與海外貿易興盛，歐洲的經濟重心由地中海區域轉移至大西洋沿岸的西、葡、英、荷等國。"}, {"stem": "西元1492年，在西班牙王室資助下向西橫渡大西洋、抵達美洲的航海家是誰？", "opts": [["A", "達伽馬"], ["B", "哥倫布"], ["C", "麥哲倫"], ["D", "狄亞士"]], "ans": "B", "exp": "哥倫布於西元1492年獲得西班牙王室資助，向西橫渡大西洋，抵達美洲。"}, {"stem": "哥倫布抵達美洲後，誤以為當地就是他原本要尋找的哪個地方，因而將原住民稱為「印第安人」？", "opts": [["A", "中國"], ["B", "非洲"], ["C", "印度"], ["D", "阿拉伯"]], "ans": "C", "exp": "哥倫布誤以為自己抵達的美洲就是印度，因此將美洲原住民統稱為「印第安人」，這個稱呼延續至今。"}, {"stem": "十六世紀初，率領船隊繞過南美洲，其船隊最終完成人類史上首次環繞世界一周壯舉的航海家是？", "opts": [["A", "麥哲倫"], ["B", "哥倫布"], ["C", "達伽馬"], ["D", "狄亞士"]], "ans": "A", "exp": "麥哲倫率領船隊繞過南美洲後抵達菲律賓，他本人雖於菲律賓遇害，但船隊仍繼續西行，完成了繞行世界一周的壯舉。"}, {"stem": "關於麥哲倫本人的下場，下列敘述何者正確？", "opts": let done=0,right=0;
const box=document.getElementById('qs');
QS.forEach((q,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<span class="qno">第 '+(i+1)+' 題</span><p class="stem">'+esc(q.stem)+'</p>';
  q.opts.forEach(([L,t])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='('+L+') '+esc(t);
    b.onclick=()=>pick(c,b,L,q);
    c.appendChild(b);
  });
  const e=document.createElement('div');e.className='exp';
  e.innerHTML='<b>答案：'+q.ans+'</b><br>'+esc(q.exp);
  c.appendChild(e);box.appendChild(c);
});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function pick(card,btn,L,q){
  if(card.dataset.done)return;card.dataset.done=1;done++;
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('done');
    const l=o.textContent.trim()[1];
    if(l===q.ans)o.classList.add('ok');
    else if(o===btn)o.classList.add('no');
  });
  if(L===q.ans)right++;
  card.querySelector('.exp').classList.add('show');
  document.getElementById('done').textContent=done;
  document.getElementById('right').textContent=right;
  document.getElementById('rate').textContent=Math.round(right/done*100)+'%';
}
</script></body></html>

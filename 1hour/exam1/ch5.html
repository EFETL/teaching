<script>
window.UNIT = {
  exam:'第一次段考', code:'CH5', title:'地球的環境（地科）', color:'#15803d', soft:'#dcfce7',
  subtitle:'水圈與地下水 → 風化、侵蝕、搬運、沉積 → 河道與海岸線 → 岩石與礦物。地科題目多是「配對」，抓對關鍵字就能拿分。',
  range:'翰林 3上 5-1～5-3', nSchools:6,
  sources:'114 學年度第一學期第一次段考：臺中市向上國中；高雄市燕巢、苓雅、英明、鹽埕、鼎金國中（皆翰林版）',
  plan:[
    {id:'map',name:'重點地圖',min:3},
    {id:'c1',name:'風化 vs 侵蝕',min:7},{id:'c2',name:'地形與外營力',min:7},
    {id:'c3',name:'河道與海岸線',min:7},{id:'c4',name:'岩石三大類',min:9},
    {id:'c5',name:'地下水',min:7},{id:'c6',name:'礦物',min:5},
    {id:'terms',name:'名詞對照',min:3},{id:'blist',name:'B 級帶過',min:2},{id:'check',name:'銜接檢查',min:10}
  ],
  map:[
    {name:'下游採砂石 → 橋墩裸露',n:6,lv:'A',go:'c3'},
    {name:'岩石三大類與配對',n:6,lv:'A',go:'c4'},
    {name:'風化 vs 侵蝕（含豆腐岩、蕈狀岩）',n:6,lv:'A',go:'c1'},
    {name:'地形與外營力配對（V 谷、U 谷、風稜石）',n:5,lv:'A',go:'c2'},
    {name:'海岸線前進或後退',n:5,lv:'A',go:'c3'},
    {name:'超抽地下水 → 地層下陷、變鹹',n:5,lv:'A',go:'c5'},
    {name:'礦物（方解石、石英、花岡岩組成）',n:5,lv:'A',go:'c6'},
    {name:'上游有稜角、下游圓滑',n:4,lv:'A',go:'c2'},
    {name:'地下水面、透水層判讀',n:4,lv:'A',go:'c5'},
    {name:'水圈、水的分布、水循環',n:3,lv:'B',go:'blist'},
    {name:'西部沙灘、東部礫石',n:2,lv:'B',go:'blist'}
  ],
  cards:[
  { id:'c1', title:'風化 vs 侵蝕 vs 搬運 vs 沉積', n:6,
    one:'<b>風化</b>＝在原地變碎、變質；<b>侵蝕</b>＝被帶離原處；<b>搬運</b>＝被送走；<b>沉積</b>＝力量變弱就堆下來。',
    formula:'<table class="t"><tr><th>作用</th><th>關鍵字（看到就選它）</th></tr>'+
      '<tr><td>風化</td><td>氧化鐵（紅褐色）、樹根撐裂岩縫、熱脹冷縮、結冰膨脹、酸雨溶解石灰岩</td></tr>'+
      '<tr><td>侵蝕</td><td>海浪拍打掏空、河水下切、風沙磨蝕、「剝離、帶走」</td></tr>'+
      '<tr><td>搬運</td><td>河水、風、冰川把碎屑運到別處</td></tr>'+
      '<tr><td>沉積</td><td>流速變慢、風力減弱 → 三角洲、沙丘、沙灘</td></tr></table>',
    ex:{src:'改編自 向上（豆腐岩）、鼎金（蕈狀岩）、英明（鯨魚洞）',
      q:'海邊岩石受溫度變化和海水影響，逐漸出現裂縫；海浪又長期在裂縫中反覆沖刷，把碎屑帶走，使裂縫越來越大，形成像豆腐的「豆腐岩」。這主要是哪兩種作用？',
      opts:['侵蝕作用與沉積作用','風化作用與侵蝕作用','搬運作用與沉積作用','風化作用與沉積作用'],
      ans:1, exp:'岩石在原地破裂＝<b>風化</b>；海浪把碎屑沖走、裂縫變大＝<b>侵蝕</b>。蕈狀岩、鯨魚洞、女王頭都是同一組答案。'},
    trap:'「岩石在原地破碎、變色」是<b>風化</b>，不是侵蝕。有東西「被帶走」才是侵蝕。',
    pr:{q:'車子經過揚起路上的沙粒，沙粒從沒關緊的窗縫飄進屋內，最後落在地板上。這過程包含哪些作用、順序為何？',
      opts:['先侵蝕後沉積','先沉積後搬運','先搬運後沉積','先搬運後侵蝕'],
      ans:2, exp:'沙粒被風帶進屋＝搬運；進屋後風力減弱掉在地上＝沉積。'} },

  { id:'c2', title:'地形與外營力配對', n:5,
    one:'河流<b>上游</b>：侵蝕強、<b>V 型谷</b>、石頭大又有稜角；<b>下游</b>：沉積為主、鵝卵石圓滑、三角洲。冰川→<b>U 型谷</b>、冰磧石；風→風稜石、沙丘；海浪→海蝕洞、海蝕拱門、蕈狀岩。',
    formula:'<table class="t"><tr><th>外營力</th><th>侵蝕地形</th><th>沉積地形</th></tr>'+
      '<tr><td>河流</td><td>V 型谷、瀑布</td><td>沖積扇、三角洲、鵝卵石</td></tr>'+
      '<tr><td>冰川</td><td>U 型谷</td><td>冰磧石（<b>大小混雜</b>）</td></tr>'+
      '<tr><td>風</td><td>風稜石（風磨石）</td><td>沙丘</td></tr>'+
      '<tr><td>海浪</td><td>海蝕崖、海蝕洞、海蝕拱門、海蝕平臺</td><td>沙灘、沙洲</td></tr></table>'+
      '<div class="small muted">差異侵蝕：砂岩較硬 → 凸出成山脊；頁岩較軟 → 凹下成山谷（女王頭也是：頭硬、脖子軟）。</div>',
    ex:{src:'改編自 鼎金（盜採岩塊）、向上（上下游石頭）',
      q:'稽查人員發現某工廠的岩塊「有稜有角、體積較大」，但老闆宣稱的採集地點石頭都「圓滑、體積小」。老闆最可能在哪裡採的？為什麼？',
      opts:['河川下游，因為下游流量大所以石塊大','河川上游，因為上游雨量多所以石塊大','河川下游，因為搬運距離長所以有稜有角','河川上游，因為搬運距離短所以有稜有角'],
      ans:3, exp:'石頭在河裡被搬運得越遠，碰撞摩擦越久越圓滑。有稜有角＝剛從上游岩壁掉下、還沒搬運多遠。'},
    trap:'① <b>U 型谷是冰川</b>，V 型谷才是河流。② 冰磧石是「大小混雜」，不是顆粒細小。③ 鵝卵石是<b>流水搬運</b>磨圓的，不是風化。',
    pr:{q:'下列地形與成因的配對，何者正確？',
      opts:['V 型谷—冰川侵蝕','三角洲—冰川搬運','風稜石—海浪侵蝕','U 型谷—冰川侵蝕'],
      ans:3, exp:'U 型谷是冰川刻蝕；V 型谷是河流下切；三角洲是河流在河口沉積；風稜石是風沙磨蝕。'} },

  { id:'c3', title:'河道與海岸線的變化', n:6,
    one:'<b>下游挖砂石</b> → 河床變低 → 河水加速侵蝕<b>上游</b>河床 → 上游橋墩裸露。海岸線看泥沙：<b>帶來 ＞ 帶走 → 向海前進</b>（海埔新生地、港口淤積）；<b>帶來 ＜ 帶走 → 向陸地後退</b>。',
    fig:`<svg viewBox="0 0 460 210" width="460" xmlns="http://www.w3.org/2000/svg" font-size="13" font-family="sans-serif">
      <defs><marker id="w1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#2563eb"/></marker></defs>
      <polyline points="10,60 450,120" fill="none" stroke="#60a5fa" stroke-width="3"/>
      <line x1="30" y1="46" x2="130" y2="60" stroke="#2563eb" stroke-width="2" marker-end="url(#w1)"/><text x="30" y="36" fill="#2563eb">上游 → 河水流向 → 下游</text>
      <polyline points="10,90 450,150" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="440" y="146" text-anchor="end" fill="#94a3b8">原本河床</text>
      <polyline points="10,93 200,132 320,150 345,182 395,182 412,152 450,154" fill="none" stroke="#92400e" stroke-width="3"/>
      <rect x="160" y="68" width="80" height="8" fill="#475569"/>
      <line x1="185" y1="76" x2="185" y2="150" stroke="#475569" stroke-width="6"/><line x1="215" y1="76" x2="215" y2="150" stroke="#475569" stroke-width="6"/>
      <line x1="185" y1="116" x2="185" y2="131" stroke="#dc2626" stroke-width="7"/><line x1="215" y1="120" x2="215" y2="137" stroke="#dc2626" stroke-width="7"/>
      <text x="120" y="190" fill="#dc2626" font-weight="700">上游橋墩裸露</text>
      <text x="370" y="200" text-anchor="middle" fill="#92400e" font-weight="700">下游採砂石</text></svg>
      <div class="cap">挖砂的地方在下游，受害的是上游的橋</div>`,
    ex:{src:'6 校都考（向上、苓雅、英明、鼎金幾乎一字不差）',
      q:'臺灣西部河流的跨河大橋常發現橋墩裸露，最可能的原因是？',
      opts:['上游山坡地遭濫墾','上游發生土石流','河流出海口築防波堤','下游河段遭濫採砂石'],
      ans:3, exp:'下游挖走砂石使河床降低，河水會加速侵蝕上游河床來「補平」，上游橋墩就露出來。濫墾、土石流反而是帶來更多泥沙。'},
    trap:'① 裸露的是採砂點<b>上游</b>的橋，不是下游。② 上游<b>蓋水庫、採砂石</b> → 帶到海岸的泥沙變少 → 海岸線<b>後退</b>（八里海岸）。',
    pr:{q:'鹿港在清朝是重要商港，後來港口淤積、大船無法停靠，原本的港渠變成菜園。最主要的原因是？',
      opts:['海平面下降，海水遠離','河川帶來的泥沙淤積，使海岸線向海外移','沿海陸地隆起，海水遠離','大地震造成地殼變動'],
      ans:1, exp:'帶來的泥沙比海流帶走的多 → 海岸線向海前進、港口淤積。'} },

  { id:'c4', title:'岩石三大類', n:6,
    one:'岩石分類的依據是<b>形成過程</b>（不是顏色、礦物）。沉積岩：一層一層、可能有化石；火成岩：岩漿冷卻；變質岩：高溫高壓改變。',
    formula:'<table class="t"><tr><th>類別</th><th>怎麼形成</th><th>要背的岩石</th><th>考點</th></tr>'+
      '<tr><td><b>沉積岩</b></td><td>碎屑沉積、壓密膠結</td><td>礫岩＞砂岩＞頁岩（顆粒大→小）、石灰岩（生物遺骸）、鹽岩（鹹水湖結晶）</td><td>層狀構造、<b>找化石看這類</b></td></tr>'+
      '<tr><td><b>火成岩</b></td><td>岩漿冷卻凝固</td><td>花岡岩（地下<b>慢冷</b>、晶粒大，金門）；玄武岩（澎湖）、安山岩（大屯山）＝地表<b>快冷</b>、晶粒小</td><td>冷卻快慢 ↔ 晶粒大小</td></tr>'+
      '<tr><td><b>變質岩</b></td><td>高溫高壓、未熔融</td><td>頁岩 → <b>板岩</b>；石灰岩 → <b>大理岩</b>（花蓮、太魯閣）</td><td>中央山脈常見</td></tr></table>',
    ex:{src:'改編自 向上、燕巢、苓雅、英明、鼎金（岩石配對）',
      q:'下列岩石與分類的配對，何者<b>錯誤</b>？',
      opts:['板岩—沉積岩','石灰岩—沉積岩','大理岩—變質岩','安山岩—火成岩'],
      ans:0, exp:'板岩是頁岩經高溫高壓形成的<b>變質岩</b>。'},
    trap:'① <b>板岩、大理岩是變質岩</b>（最常被配錯）。② 鹽岩也算沉積岩。③ 酸雨嚴重的地方<b>不要用大理岩／石灰岩</b>做雕像（碳酸鈣遇酸會溶解）。④ 化石要去<b>沉積岩</b>找，變質岩裡通常找不到。',
    pr:{q:'金門常見的花岡岩是怎麼形成的？',
      opts:['岩漿噴出地表，快速冷卻凝固','河流搬運的沉積物經壓密、膠結','岩漿在地下深處緩慢冷卻凝固','石灰岩受擠壓變質'],
      ans:2, exp:'花岡岩是火成岩，在地底慢慢冷卻，所以礦物結晶顆粒大、肉眼看得到不同顏色的顆粒。'} },

  { id:'c5', title:'地下水', n:5,
    one:'雨水往下滲，遇到<b>不透水層</b>（如頁岩）就停住累積成地下水；地下水的頂部＝<b>地下水面</b>，會隨地形起伏、雨季上升旱季下降。<b>超抽</b> → 地層下陷（回不去）＋ 沿海海水入侵，地下水變鹹。',
    fig:`<svg viewBox="0 0 460 210" width="460" xmlns="http://www.w3.org/2000/svg" font-size="13" font-family="sans-serif">
      <path d="M10,60 C120,20 230,20 300,60 S420,85 450,65 L450,160 L10,160 Z" fill="#fde68a"/>
      <path d="M10,105 C120,80 230,80 300,105 S420,120 450,110 L450,160 L10,160 Z" fill="#93c5fd"/>
      <path d="M10,105 C120,80 230,80 300,105 S420,120 450,110" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5"/>
      <rect x="10" y="160" width="440" height="40" fill="#9ca3af"/>
      <rect x="236" y="34" width="10" height="100" fill="#fff" stroke="#475569"/>
      <text x="30" y="52" fill="#92400e">透水層（砂岩）</text><text x="60" y="135" fill="#1e3a8a" font-weight="700">飽含地下水</text>
      <text x="320" y="100" fill="#1d4ed8" font-weight="700">地下水面</text><text x="160" y="186" fill="#fff" font-weight="700">不透水層（頁岩）</text>
      <text x="252" y="46" fill="#475569">井</text></svg>
      <div class="cap">井要挖到地下水面以下才有水</div>`,
    ex:{src:'改編自 苓雅、鼎金、英明、向上、鹽埕（超抽地下水）',
      q:'許多沿海地區長期大量抽取地下水，最可能造成下列哪一種問題？',
      opts:['地層下陷，部分地區低於海平面','地下水位上升，造成土壤液化','土壤變得更肥沃','河流流量增加，有利水力發電'],
      ans:0, exp:'抽掉孔隙裡的水，岩層被上方重量壓扁 → 地層下陷，而且停抽也回不去；沿海還會讓海水滲入，地下水變鹹。'},
    trap:'① 全球<b>淡水最多的是冰川</b>（不是地下水）；但人類能直接用的主要是地下水、河流、湖泊。② 地層下陷<b>不可逆</b>，灌水回去也回不到原高度。',
    pr:{q:'某地層剖面中，x 層是透水層、y 層是不透水層。x、y 最可能分別是？',
      opts:['x 頁岩、y 砂岩','x 礫岩、y 砂岩','x 砂岩、y 頁岩','x 砂岩、y 礫岩'],
      ans:2, exp:'顆粒大的砂岩、礫岩孔隙大，水容易通過（透水）；顆粒最細的頁岩緻密，水過不去（不透水）。'} },

  { id:'c6', title:'礦物', n:5,
    one:'<b>岩石是由礦物組成的</b>（不是反過來）。礦物＝天然、原子排列規則的無機物。花岡岩＝長石（白或肉紅）＋石英（無色透明）＋雲母（黑）。',
    formula:'<table class="t"><tr><th>礦物</th><th>要記的特徵</th></tr>'+
      '<tr><td>方解石 vs 石英</td><td>都無色透明；<b>滴稀鹽酸冒泡的是方解石</b>（含碳酸鈣，產生 CO₂）；石英較硬，鐵釘刻不動</td></tr>'+
      '<tr><td>石英</td><td>完整結晶叫水晶；做玻璃、鐘錶零件</td></tr>'+
      '<tr><td>長石</td><td>地殼最多的礦物，風化成黏土 → 陶瓷</td></tr>'+
      '<tr><td>黃鐵礦</td><td>金黃色金屬光澤，「愚人金」，不是黃金</td></tr>'+
      '<tr><td>寶石</td><td>不易磨蝕、色澤美、產量<b>少</b>（金剛石、剛玉）</td></tr></table>',
    ex:{src:'改編自 向上、鼎金（方解石與石英）',
      q:'方解石和石英外觀都是無色透明。下列哪個方法可以分辨它們？',
      opts:['滴稀鹽酸，會冒泡的是石英','滴稀鹽酸，會冒泡的是方解石','看顏色就能分辨','兩者都會被指甲刻傷，無法分辨'],
      ans:1, exp:'方解石含碳酸鈣，遇鹽酸產生二氧化碳氣泡。石英不會冒泡，而且比鐵釘還硬。'},
    trap:'① 冒泡的是<b>方解石</b>，不是石英（向上的考題就是把這兩個對調）。② 「礦物由岩石組成」是錯的，要反過來。',
    pr:{q:'下列關於岩石與礦物的敘述，何者<b>錯誤</b>？',
      opts:['礦物是由各種岩石組成的','礦物是天然產出、原子排列規則的無機物','石英常用來製造玻璃與鐘錶零件','花岡岩主要由長石、石英、雲母組成'],
      ans:0, exp:'是「岩石由礦物組成」，一種或多種礦物構成一塊岩石。'} }

    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>

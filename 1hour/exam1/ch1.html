  { id:'c2', title:'平均速率 vs 平均速度', n:6,

  { id:'c3', title:'x-t 圖：斜率＝速度', n:6,

             {pts:[[0,6],[8,6]],label:'丙 靜止',color:'#64748b',lab:[5.2,6]},{pts:[[0,9],[6,0]],label:'丁 往負方向',color:'#b91c1c',lab:[3.6,4.2]}]})+'<div class="cap">同一張 x-t 圖：看陡不陡比快慢，看往上或往下判方向</div>',
    ex:{src:'改編自 苓雅（x-t 題組）',
      q:'某物體沿東西方向直線運動（向東為正），x-t 圖如下。下列敘述何者正確？',

      opts:['0～2 秒速度為 4 m/s，向東','2～4 秒物體以等速度前進','0～8 秒的路徑長為 8 m','4～8 秒速度為 +2 m/s'],
      ans:0, exp:'0～2 秒：8÷2＝4 m/s，往上斜＝向東。(B) 水平線是<b>靜止</b>；(C) 去 8 m 回 8 m，路徑長 16 m（位移才是 0）；(D) 往下斜，速度是 −8÷4＝<b>−2</b> m/s。'},
    trap:'<b>x-t 圖的水平線＝靜止</b>，不是等速度！（v-t 圖的水平線才是等速度）另外 x-t 圖的斜直線是「等速度」，不是等加速度。',
    pr:{q:'甲、乙兩人在直線公路上騎車，位置紀錄如下：甲 0→4→8→12→16→20 m；乙 25→20→15→10→5→0 m（每隔 1 秒記一次）。若畫成 x-t 圖，誰的線比較陡（速度大小較大）？',
      opts:['甲','乙','一樣陡','無法比較'], ans:1,
      exp:'甲每秒走 4 m，乙每秒走 5 m（往負方向）。比陡度看大小，乙較陡。注意：兩人都是等速度，所以若改畫 <b>v-t 圖</b>，兩條都是水平線、傾斜程度相同（向上、鼎金考過這個陷阱）。'} },

  { id:'c4', title:'v-t 圖：面積＝位移、斜率＝加速度', n:6,
    one:'v-t 圖（速度-時間圖）三個重點：① 線和時間軸圍成的<b>面積＝位移</b>；② <b>斜率＝加速度</b>；③ 線<b>穿過時間軸＝折返</b>（方向改變）。水平線＝等速度，斜直線＝等加速度。',
    fig:P({w:380,h:220,xmax:8,ymin:0,ymax:8,xticks:[2,4,6,8],yticks:[2,4,6],yl:'v（m/s）',
      fill:[{pts:[[0,0],[2,6],[6,6],[8,0]]}],lines:[{pts:[[0,0],[2,6],[6,6],[8,0]]}],
      notes:[[4,3,'面積＝位移'],[1.1,5.6,'斜率＝a'],[4,7.1,'水平＝等速度','#0e7490']]}),

      q:'汽車以 20 m/s 等速行駛，駕駛看到前方的石虎，經過 0.5 秒反應時間才踩煞車，再經 2 秒等減速停下（v-t 圖如下）。從看到石虎到停下，汽車共前進多少公尺？',
      fig:P({w:380,h:220,xmax:3,ymin:0,ymax:24,xticks:[0.5,1,1.5,2,2.5,3],yticks:[5,10,15,20],yl:'v（m/s）',
        fill:[{pts:[[0,0],[0,20],[0.5,20],[0.5,0]],color:'#d97706',op:.25},{pts:[[0.5,0],[0.5,20],[2.5,0]]}],lines:[{pts:[[0,20],[0.5,20],[2.5,0]]}],
        notes:[[0.25,10,'10 m'],[1.1,7,'20 m','#0e7490']]}),

    trap:'① <b>反應時間內車子還在等速前進</b>，那塊長方形面積也要算。② 數「折返次數」要數線<b>穿過</b>時間軸幾次，不是數轉折點；碰到 0 停住＝停下，不算折返。',
    pr:{q:'小凱在直線跑道上折返跑，v-t 圖如下（向右為正）。整段過程他折返（改變方向）幾次？',
      fig:P({w:380,h:220,xmax:10,ymin:-4,ymax:4,xticks:[2,4,6,8,10],yticks:[-3,3],yl:'v（m/s）',lines:[{pts:[[0,3],[2,3],[4,-3],[6,-3],[8,3],[9,0],[10,0]]}]}),
      opts:['1 次','2 次','3 次','4 次'], ans:1,
      exp:'速度由正變負（約第 3 秒）穿過時間軸一次、由負變正（約第 7 秒）再一次，共 2 次。第 9 秒速度降到 0 後停住不動，是「停下」不是折返。'} },

  { id:'c5', title:'加速度：速度變化 ÷ 時間', n:6,
    one:'加速度＝速度的變化量 ÷ 經過時間，單位 m/s²。加速度和速度<b>同方向→越來越快</b>；<b>反方向→越來越慢</b>（減速時 a 是負的）。',
    formula:'<span class="formula">a ＝ (v<sub>末</sub> − v<sub>初</sub>) ÷ t</span>　<span class="formula">km/h ÷ 3.6 ＝ m/s</span><div class="small muted" style="margin-top:6px">必背：36 km/h＝10 m/s、72＝20、108＝30、144＝40、360＝100</div>',
    ex:{src:'改編自 向上（高鐵）、燕巢（電動車）',
      q:'一輛電動車在 4 秒內由靜止直線加速到 108 km/h，平均加速度是多少？',
      opts:['27 m/s²','7.5 m/s²','30 m/s²','0.75 m/s²'], ans:1,
      exp:'先換單位：108÷3.6＝30 m/s。a＝(30−0)÷4＝7.5 m/s²。(A) 就是忘記換單位的答案。'},
    trap:'① <b>忘記把 km/h 換成 m/s</b>（最常見）。② 單位寫成 m/s（少了平方）。③ 減速時加速度是<b>負</b>的：35 m/s 在 5 秒內減到 15 m/s → a＝(15−35)÷5＝−4 m/s²。',
    pr:{q:'某物體沿直線向東運動（向東為正），速度紀錄：第 0、1、2、3、4 秒分別為 10、7、4、1、−2 m/s。它的加速度是？',
      opts:['向東，3 m/s²','向西，3 m/s','向西，3 m/s²','向東，3 m/s'], ans:2,
      exp:'每秒速度減少 3 m/s → a＝−3 m/s²，負號代表<b>向西</b>。單位是 m/s²（不是 m/s）。第 4 秒速度變成 −2，代表它已經掉頭向西走了。'} },

  { id:'c6', title:'自由落體與鉛直上拋', n:6,
    one:'只受重力落下＝自由落體＝<b>等加速度運動</b>，a＝g＝9.8 m/s²，<b>跟質量無關</b>（真空中羽毛和鐵球同時落地）。每秒速度增加 9.8 m/s。上拋時，往上是減速、最高點速度＝0，但<b>加速度一直是 g、向下</b>。',
    formula:'<span class="formula">v ＝ g × t</span>　<span class="formula">落下距離＝v-t 圖三角形面積＝½ × t × v</span>',
    fig:P({w:300,h:200,xmax:5,ymin:0,ymax:50,xticks:[1,2,3,4,5],yticks:[9.8,19.6,29.4,39.2,49],yl:'v（m/s）',lines:[{pts:[[0,0],[5,49]]}]})+' '+
        P({w:300,h:200,xmax:5,ymin:0,ymax:12,xticks:[1,2,3,4,5],yticks:[9.8],yl:'a（m/s²）',lines:[{pts:[[0,9.8],[5,9.8]]}]})+'<div class="cap">自由落體：v-t 圖是斜直線，a-t 圖是水平線（向下為正）</div>',
    ex:{src:'改編自 鼎金、鹽埕、燕巢（質量無關題，5 校都考）',
      q:'施工時，一支螺絲和一顆質量是它 2 倍的螺帽，從同一高度同時由靜止掉落（不計空氣阻力），螺絲 5 秒落地。下列何者正確？',
      opts:['螺帽 2.5 秒就落地','螺帽每秒速度增加比較多','兩者每秒都落下 9.8 m','兩者每秒速度都增加 9.8 m/s，同時落地'], ans:3,
      exp:'自由落體加速度都是 g，和質量無關，所以同時落地、每秒速度都加 9.8 m/s。(C) 錯在「每秒落下 9.8 m」——9.8 是<b>速度</b>每秒的增加量，不是距離。'},
    trap:'① 最高點「速度＝0」✓，但「加速度＝0」✗（還是 g）。② 9.8 是<b>每秒速度增加量</b>，不是每秒落下距離。③ 落下高度要算 v-t 圖面積：3 秒 → v＝29.4，高度＝½×3×29.4＝44.1 m。',
    pr:{q:'以向上為正，把籃球鉛直往上拋（不計空氣阻力），下列何者正確？',
      opts:['上升過程中，加速度方向向上','上升過程中，加速度越來越小','到最高點的瞬間，速度為 0','到最高點的瞬間，加速度為 0'], ans:2,
      exp:'上升時速度向上、加速度（g）向下，所以越來越慢；到最高點速度＝0，但加速度仍是 9.8 m/s² 向下，所以才會掉回來。(D) 是 6 校共同的陷阱。'} }
  ],
  terms:[
    ['位置 x','以原點為基準，正負代表在哪一邊'],['路徑長','走過軌跡的總長，沒有方向'],['位移 Δx','末位置 − 初位置，有方向'],
    ['速率','快慢，沒有方向；時速表顯示的是「瞬時速率」'],['速度 v','快慢＋方向；正負號代表方向'],['平均 vs 瞬時','一段時間 vs 某一瞬間'],
    ['等速度運動','速度大小、方向都不變；v-t 圖水平線'],['加速度 a','速度變化 ÷ 時間，單位 m/s²'],['等加速度運動','加速度固定；v-t 圖斜直線、a-t 圖水平線'],
    ['重力加速度 g','9.8 m/s²，方向鉛直向下'],['x-t / v-t / a-t 圖','位置、速度、加速度對時間的圖']
  ],
  blist:[

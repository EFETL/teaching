:root{--ink:#22323a;--muted:#6b8894;--paper:#f2fbfc;--a1:#ff7a59;--a2:#ffb057;
--b1:#7b61ff;--b2:#4bc0e6;--ok:#12a150;--no:#e5484d;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);line-height:1.7;

header{position:relative;overflow:hidden;color:#fff;text-align:center;padding:34px 20px 30px;

font-size:15px;font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.14);}

.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid #d8ecef;border-radius:16px;padding:11px 15px;
margin:6px 0 20px;box-shadow:0 6px 18px rgba(20,90,110,.10);}
.score{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
.score .dot{font-size:22px;} .score b{color:#0a8fb0;font-size:22px;} .score .pts{font-size:14px;color:var(--muted);font-weight:600;}
.tools{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:8px 15px;color:#fff;transition:transform .1s;}
.btn:active{transform:scale(.96);}
.btn.rev{background:linear-gradient(120deg,#7b61ff,#4bc0e6);box-shadow:0 4px 12px rgba(90,80,220,.28);}
.btn.pr{background:linear-gradient(120deg,#ff7a59,#ffb057);box-shadow:0 4px 12px rgba(255,120,90,.3);}
.btn.rs{background:#eef4f6;color:#5b7883;}
.sec-h{display:flex;align-items:center;gap:12px;color:#fff;border-radius:16px;padding:13px 18px;margin:26px 0 16px;box-shadow:0 8px 20px rgba(0,0,0,.12);}
.sec-a .sec-h{background:linear-gradient(120deg,var(--a1),var(--a2));}
.sec-b .sec-h{background:linear-gradient(120deg,var(--b1),var(--b2));}
.sec-h .ico{font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
.sec-h .tt{flex:1;} .sec-h .tt b{font-size:20px;letter-spacing:.5px;} .sec-h .tt small{display:block;font-size:13px;opacity:.95;margin-top:1px;}
.sec-h .full{font-weight:800;font-size:14px;background:rgba(255,255,255,.25);border-radius:20px;padding:5px 13px;white-space:nowrap;}
.q{position:relative;background:var(--card);border-radius:15px;padding:15px 17px 15px 20px;margin-bottom:14px;
box-shadow:0 3px 14px rgba(30,80,95,.09);border:1px solid #ecf2f4;overflow:hidden;transition:box-shadow .15s,transform .15s;}
.q:hover{box-shadow:0 10px 24px rgba(30,80,95,.15);transform:translateY(-2px);}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;}
.sec-a .q::before{background:linear-gradient(var(--a1),var(--a2));}
.sec-b .q::before{background:linear-gradient(var(--b1),var(--b2));}
.q.correct{border-color:#bfe9cf;} .q.correct::before{background:linear-gradient(var(--ok),#4fd07f)!important;}
.qtop{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
.num{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.15);}
.sec-a .num{background:linear-gradient(135deg,var(--a1),var(--a2));}
.sec-b .num{background:linear-gradient(135deg,var(--b1),var(--b2));}
.pts{font-weight:800;font-size:12.5px;color:#b5641f;background:#fff1e5;border-radius:20px;padding:3px 11px;}
.sec-b .pts{color:#5b3fd0;background:#efeaff;}
.src{font-size:12px;color:#93a7af;margin-left:auto;background:#f2f6f7;border-radius:20px;padding:3px 11px;}
.expr{font-size:19.5px;font-weight:700;letter-spacing:.5px;padding:2px 2px 4px;font-family:"Menlo","Consolas","Noto Sans TC",monospace;}
.expr sup{font-size:.62em;} .expr .eq{color:#0a8fb0;margin:0 6px;}
.ansrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap;}
.ansrow input{width:170px;font-size:17px;font-weight:700;text-align:center;color:var(--ink);border:2px solid #d5e3e7;border-radius:11px;padding:8px 10px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
.ansrow input:focus{border-color:#4bc0e6;box-shadow:0 0 0 4px rgba(75,192,230,.18);}
.ansrow input.good{border-color:var(--ok);background:#f0fbf4;} .ansrow input.bad{border-color:var(--no);background:#fdf1f1;}
.chk{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;color:#fff;border-radius:11px;padding:9px 16px;background:linear-gradient(120deg,#12b866,#0a9f8f);box-shadow:0 4px 11px rgba(15,170,120,.28);transition:transform .1s;}
.chk:active{transform:scale(.95);}
.see{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;color:#5b7883;background:#eef4f6;border-radius:11px;padding:9px 14px;}
.mark{font-weight:800;font-size:15px;min-width:64px;} .mark.ok{color:var(--ok);} .mark.no{color:var(--no);}
.sol{display:none;margin-top:11px;border-radius:12px;padding:12px 14px;background:#f6fbfc;border:1px dashed #bfdfe6;font-size:14.5px;}
.sol.show{display:block;animation:pop .22s ease;}
@keyframes pop{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:none;}}
.sol .big{font-weight:800;color:#0a8fb0;font-size:16px;} .sol .st{color:#53707a;margin-top:4px;}
.hint{font-size:11.5px;color:#9aabb2;margin-top:5px;}
footer{text-align:center;color:#8fb0b6;font-size:13.5px;margin-top:34px;}
.work{display:none;}
@media(max-width:520px){.expr{font-size:17px;}header h1{font-size:22px;}.src{margin-left:0;}}
@media print{
@page{size:A4;margin:14mm 12mm 15mm;}
body{background:#fff;padding:0;}
header{background:#fff;color:#111;box-shadow:none;padding:0 0 8px;border-bottom:2.5px solid #1f4f86;}
header::before,header::after,.emoji{display:none;}
header h1{color:#1f4f86;font-size:19px;text-shadow:none;} header p{color:#555;font-size:12.5px;}
.back,.bar,.chk,.see,.ansrow input,.mark,.sol,.hint{display:none!important;}
.wrap{max-width:none;padding:6px 0;}
.sec-h{background:#1f4f86!important;color:#fff!important;box-shadow:none;border-radius:6px;padding:6px 12px;margin:14px 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.sec-b .sec-h{background:#0b6b3a!important;} .sec-h .ico{display:none;}
.q{box-shadow:none;border:none;transform:none;padding:4px 2px;margin:0 0 2px;break-inside:avoid;} .q::before{display:none;}
.num{background:#e7eef7!important;color:#1f4f86!important;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.pts,.src{background:none;color:#555;padding:0 4px;} .expr{font-family:inherit;font-weight:600;}
.work{display:block;height:2.4cm;border:1px dashed #cfd6de;border-radius:5px;margin-top:5px;} footer{display:none;}
}
</style></head><body>
<header><div class="emoji">🔟</div><h1>指數記法與科學記號 ‧ 計算特訓</h1><p>乘方 × 10 的次方 × 科學記號 ‧ 12 題 ‧ 滿分 100 分</p>
<a class="back" href="book1.html">← 回第一冊</a></header>
<div class="wrap">
  <div class="bar">
    <div class="score"><span class="dot">🎯</span><span>答對 <b id="sc">0</b> / 12</span>
      <span class="pts">得分 <span id="pt">0</span> / <span id="tot">100</span></span></div>
    <div class="tools">
      <button class="btn rev" id="revAll">👀 全部解答</button>
      <button class="btn rs" id="reset">↺ 重做</button>
      <button class="btn pr" onclick="window.print()">🖨 列印練習卷</button></div>
  </div>
  <div id="app"></div>
  <footer>teaching.efetl.com / math　‧　題目節錄自各校段考真題　‧　💪 先自己算，再看解答！</footer>
</div>
<script>const DATA=[{"sec": "A", "title": "第一組　乘方計算", "ico": "⚡", "sub": "1-4 觀念 1 ‧ 6 題 ‧ 50 分", "qs": [{"p": 8, "s": "基礎", "e": "(−2)<sup>4</sup>", "t": "num", "a": 16, "d": "16", "st": "底數−2、偶次方 → 正；2⁴＝16"}, {"p": 8, "s": "基礎", "e": "−2<sup>4</sup>", "t": "num", "a": -16, "d": "−16", "st": "只有2是底數、負號在外：−(2⁴)＝−16"}, {"p": 8, "s": "課本例題", "e": "−2<sup>3</sup> ＋ (−3)<sup>2</sup> − (−1)<sup>5</sup>", "t": "num", "a": 2, "d": "2", "st": "−8＋9−(−1)＝−8＋9＋1＝2"}, {"p": 9, "s": "高雄翠屏 113", "e": "72 − [(−3)<sup>2</sup> × 2<sup>3</sup> − 5<sup>2</sup>]", "t": "num", "a": 25, "d": "25", "st": "[9×8−25]＝[72−25]＝47；72−47＝25"}, {"p": 9, "s": "北興國中 112", "e": "−7<sup>2</sup> ＋ (−2)<sup>3</sup> ＋ (−1)<sup>2023</sup>", "t": "num", "a": -58, "d": "−58", "st": "−49＋(−8)＋(−1)＝−58"}, {"p": 8, "s": "北興國中 112", "e": "5 × (−3)<sup>2</sup> − ｜6 × (−3)｜ ＋ ｜−81｜", "t": "num", "a": 108, "d": "108", "st": "5×9−|−18|＋81＝45−18＋81＝108"}]}, {"sec": "B", "title": "第二組　10 的次方與科學記號", "ico": "🔬", "sub": "1-4 觀念 2、3 ‧ 6 題 ‧ 50 分", "qs": [{"p": 8, "s": "基礎", "e": "10<sup>4</sup>", "t": "num", "a": 10000, "d": "10000", "st": "10⁴＝10000（1 後面 4 個 0）"}, {"p": 8, "s": "臺中居仁 113", "e": "以小數表示　10<sup>−6</sup>", "t": "num", "a": 1e-06, "d": "1e−06", "st": "10⁻⁶＝0.000001（小數點後第6位是1）"}, {"p": 8, "s": "屏東中正 113", "e": "若 10<sup>a</sup>＝100、100<sup>b</sup>＝100000000，求 a ＋ b", "t": "num", "a": 6, "d": "6", "st": "10²＝100→a＝2；100⁴＝10⁸→b＝4；a＋b＝6"}, {"p": 9, "s": "課本", "e": "將 47000000 寫成科學記號（填 a×10^n）", "t": "sci", "a": [4.7, 7], "d": "4.7×10⁷", "st": "小數點左移7位：4.7×10⁷"}, {"p": 9, "s": "彰化溪湖 111", "e": "冠狀病毒約 0.00000009 公尺，用科學記號表示", "t": "sci", "a": [9, -8], "d": "9×10⁻⁸", "st": "小數點右移8位：9×10⁻⁸"}, {"p": 8, "s": "北興國中 112", "e": "救助金約 28 億 4000 萬元（2840000000），用科學記號表示", "t": "sci", "a": [2.84, 9], "d": "2.84×10⁹", "st": "2840000000＝2.84×10⁹"}]}];

const disp = n => (n<0?'−':'')+Math.abs(n);
function norm(s){return s.replace(/[−–—]/g,'-').replace(/[０-９]/g,d=>'０１２３４５６７８９'.indexOf(d))
  .replace(/[Xx×＊]/g,'*').replace(/[＋]/g,'+').replace(/[\s。，,個位數]/g,'');}
function toNum(raw){let s=norm(raw);if(s==='')return NaN;
  let m=s.match(/^(-?\d*\.?\d*)\*?10\^(-?\d+)$/);
  if(m){let a=(m[1]===''||m[1]==='+')?1:(m[1]==='-'?-1:parseFloat(m[1]));return a*Math.pow(10,parseInt(m[2]));}
  let n=Number(s);return isNaN(n)?NaN:n;}
function toSci(raw){let s=norm(raw);let m=s.match(/^(-?\d+(?:\.\d+)?)\*10\^(-?\d+)$/);
  return m?[parseFloat(m[1]),parseInt(m[2])]:null;}
function isRight(q,raw){
  if(q.t==='sci'){let v=toSci(raw);return !!v&&v[0]===q.a[0]&&v[1]===q.a[1];}
  let v=toNum(raw);if(isNaN(v))return false;let ans=q.a;return Math.abs(v-ans)<=1e-9*Math.max(1,Math.abs(ans));
}
const solved=new Set();let gi=0,total=0;
const app=document.getElementById('app');
DATA.forEach(sec=>{
  const wrap=document.createElement('section');wrap.className='sec-'+sec.sec.toLowerCase();
  wrap.innerHTML=`<div class="sec-h"><span class="ico">${sec.ico}</span>
    <span class="tt"><b>${sec.title}</b><small>${sec.sub}</small></span>
    <span class="full">滿分 50 分</span></div>`;
  sec.qs.forEach((q,i)=>{const id=gi++;total+=q.p;
    const card=document.createElement('div');card.className='q';card.dataset.id=id;card.dataset.pts=q.p;
    card._q=q;
    const hint=q.t==='sci'?'<div class="hint">作答格式：例 4.7×10^7 或 9×10^-8（可用 × 或 x）</div>':'';
    card.innerHTML=`
      <div class="qtop"><span class="num">${i+1}</span><span class="pts">${q.p} 分</span><span class="src">〔${q.s}〕</span></div>
      <div class="expr">${q.e}<span class="eq">＝</span>?</div>
      <div class="ansrow">
        <input type="text" placeholder="${q.t==='sci'?'a×10^n':'答案'}" aria-label="輸入答案">
        <button class="chk">檢查</button><button class="see">看解答</button><span class="mark"></span>
      </div>${hint}
      <div class="sol"><span class="big">答：${q.d}</span><div class="st">${q.st}</div></div>
      <div class="work"></div>`;
    wrap.appendChild(card);
  });
  app.appendChild(wrap);
});
document.getElementById('tot').textContent=total;
function refresh(){document.getElementById('sc').textContent=solved.size;
  let pts=0;solved.forEach(id=>{pts+=+document.querySelector(`.q[data-id="${id}"]`).dataset.pts;});
  document.getElementById('pt').textContent=pts;}
function check(card){const inp=card.querySelector('input'),mark=card.querySelector('.mark'),id=+card.dataset.id;
  if(norm(inp.value)===''){inp.focus();return;}
  if(isRight(card._q,inp.value)){inp.classList.remove('bad');inp.classList.add('good');
    mark.className='mark ok';mark.textContent='✓ 正確';card.classList.add('correct');solved.add(id);}
  else{inp.classList.remove('good');inp.classList.add('bad');mark.className='mark no';mark.textContent='✗ 再想想';
    card.classList.remove('correct');solved.delete(id);}
  refresh();}
app.addEventListener('click',e=>{const card=e.target.closest('.q');if(!card)return;
  if(e.target.classList.contains('chk'))check(card);
  if(e.target.classList.contains('see'))card.querySelector('.sol').classList.toggle('show');});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')check(e.target.closest('.q'));});
let allShown=false;
document.getElementById('revAll').addEventListener('click',()=>{allShown=!allShown;
  document.querySelectorAll('.sol').forEach(s=>s.classList.toggle('show',allShown));
  document.getElementById('revAll').textContent=allShown?'🙈 收合解答':'👀 全部解答';});
document.getElementById('reset').addEventListener('click',()=>{solved.clear();allShown=false;
  document.querySelectorAll('.q').forEach(c=>{c.classList.remove('correct');
    c.querySelector('input').value='';c.querySelector('input').className='';
    c.querySelector('.mark').className='mark';c.querySelector('.mark').textContent='';
    c.querySelector('.sol').classList.remove('show');});
  document.getElementById('revAll').textContent='👀 全部解答';refresh();});
</script>
<style>
#pw-gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#1a3a5c;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;}
#pw-box{background:#fff;border-radius:16px;padding:40px 36px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);}
#pw-box h2{font-size:22px;color:#1a3a5c;margin-bottom:8px;}
#pw-box p{font-size:15px;color:#666;margin-bottom:20px;}
#pw-box input{width:100%;font-size:18px;padding:10px 14px;border:2px solid #cdddef;border-radius:8px;outline:none;margin-bottom:12px;box-sizing:border-box;}
#pw-box input:focus{border-color:#1a3a5c;}
#pw-box button{width:100%;font-size:18px;font-weight:bold;padding:12px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;cursor:pointer;}

#pw-err{color:#c0392b;font-size:15px;margin-top:10px;display:none;}
</style>
<div id="pw-gate"><div id="pw-box">
  <h2>&#128274; 全民補習班</h2>
  <p>teaching.efetl.com<br>請輸入密碼進入教學區</p>
  <input type="password" id="pw-in" placeholder="密碼" onkeydown="if(event.key==='Enter')tryPw()">
  <button onclick="tryPw()">進入</button>
  <div id="pw-err">密碼錯誤，請再試一次</div>
</div></div>
<script>
(function(){
  if(localStorage.getItem('efetl_ok')==='1'){document.getElementById('pw-gate').style.display='none';return;}
  async function sha256(t){const d=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',d);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  window.tryPw=async function(){
    const v=document.getElementById('pw-in').value;
    const h=await sha256(v);
    if(h==='bb6dbcaef9d5ed4d6a7f5df4effdeb3b24b34ae6b1dfb52e1315f511301fb26e'){localStorage.setItem('efetl_ok','1');document.getElementById('pw-gate').style.display='none';}
    else{document.getElementById('pw-err').style.display='block';document.getElementById('pw-in').value='';}
  };
  document.getElementById('pw-in').focus();
})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<title>二年級下數學期末複習卷 第5卷</title>
<style>
  :root{
    --primary:#2f7d8a;--primary-dark:#1f5b66;--accent:#e08a3c;--accent-dark:#c0712a;
    --good:#3a8a5f;--bad:#c0392b;--bg:#f4faf9;--card:#ffffff;--line:#d8e8e6;
    --text:#23332f;--muted:#5f726e;--shade:#9fd0cf;--shade2:#ffd9a8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.9;font-size:18px;}
  .wrap{max-width:880px;margin:0 auto;padding:22px 20px 96px;}

  header.hero{background:linear-gradient(135deg,var(--primary),#48a0ad);color:#fff;
    border-radius:20px;padding:24px 28px;box-shadow:0 6px 18px rgba(47,125,138,.22);}
  header.hero h1{margin:0 0 8px;font-size:25px;letter-spacing:1px;}
  header.hero .sub{font-size:16px;opacity:.97;line-height:1.7;}
  .backlink{display:inline-block;margin-bottom:12px;color:var(--primary-dark);
    text-decoration:none;font-size:16px;font-weight:600;}
  .backlink:hover{text-decoration:underline;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px;}
  .toolbar button{border:none;cursor:pointer;font-size:16px;font-family:inherit;
    padding:11px 18px;border-radius:30px;font-weight:700;transition:.15s;}
  .btn-p1{background:var(--primary);color:#fff;}
  .btn-p1:hover{background:var(--primary-dark);}
  .btn-p2{background:var(--accent);color:#fff;}
  .btn-p2:hover{background:var(--accent-dark);}
  .btn-toggle{background:#6b8f8a;color:#fff;}
  .hint{font-size:16px;color:var(--muted);margin:8px 0 0;}

  .info-bar{display:flex;gap:18px;flex-wrap:wrap;border:1.5px dashed var(--line);
    border-radius:12px;padding:14px 18px;margin:18px 0;font-size:17px;color:#3a4a47;}
  .info-bar span{flex:1;min-width:150px;}

  .section{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 22px;margin:18px 0;box-shadow:0 2px 8px rgba(0,0,0,.03);}
  .section>h3{margin:0 0 4px;font-size:20px;color:var(--primary-dark);display:flex;align-items:center;gap:10px;}
  .section>h3 .num{background:var(--primary);color:#fff;border-radius:8px;font-size:16px;padding:3px 11px;flex:none;}
  .section>h3 .pts{font-size:16px;color:var(--muted);font-weight:400;}
  .section .lead{font-size:16px;color:var(--muted);margin:2px 0 12px;}

  .q{padding:13px 0;border-top:1px dashed var(--line);}
  .q:first-of-type{border-top:none;}
  .q-text{font-size:18px;}
  .q-text .qn{color:var(--accent-dark);font-weight:800;margin-right:7px;}
  .q-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .q-fig{flex:none;}
  .q-body{flex:1;min-width:230px;}

  .blank{display:inline-block;min-width:46px;border-bottom:2px solid var(--accent-dark);
    margin:0 4px;vertical-align:bottom;height:1.25em;}
  .blank-sm{min-width:34px;}
  .tf-box{display:inline-block;width:2.2em;border-bottom:2px solid var(--accent-dark);
    text-align:center;margin-left:8px;}
  .ans-line{margin-top:8px;font-size:17px;color:#3a4a47;}
  .work{border:1.5px solid var(--line);border-radius:10px;background:#fbfdfd;
    min-height:74px;margin:10px 0 4px;padding:8px 12px;}
  .work .lab{font-size:16px;color:var(--muted);}
  .answ{margin-top:6px;font-size:17px;}
  .answ .blank{min-width:80px;}

  .options{margin:8px 0 2px;display:flex;flex-direction:column;gap:5px;}
  .options label{font-size:17px;}
  .options .ch{display:inline-block;width:1.9em;color:var(--accent-dark);font-weight:800;}
  .opt-inline{display:flex;flex-wrap:wrap;gap:6px 22px;}
  .opt-inline label{flex:0 0 auto;}

  /* 圖形 */
  svg{display:block;}
  .fig-cap{font-size:16px;color:var(--muted);text-align:center;margin-top:3px;}
  .grid-set{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;}
  .grid-one{text-align:center;}
  .grid-one .gl{font-size:17px;font-weight:700;color:var(--primary-dark);margin-top:2px;}

  .reveal{margin-top:11px;border:none;cursor:pointer;font-family:inherit;background:#e3f1ef;
    color:var(--primary-dark);padding:7px 15px;border-radius:20px;font-size:16px;font-weight:700;}
  .reveal::before{content:"▸ ";}
  .reveal.open::before{content:"▾ ";}
  .explain{display:none;margin-top:10px;padding:12px 16px;background:#fbf6ee;
    border-left:4px solid var(--accent);border-radius:0 10px 10px 0;font-size:16.5px;color:#43392c;}
  .explain.show{display:block;}
  .explain b{color:var(--accent-dark);}
  .explain .ans{font-weight:800;color:var(--good);}

  footer.foot{text-align:center;color:var(--muted);font-size:16px;margin-top:30px;line-height:1.7;}
  .print-pagenum{display:none;}

  @media print{
    @page{margin:1.5cm 1.3cm 1.7cm;}
    body{background:#fff;font-size:16px;line-height:1.65;}
    .wrap{max-width:none;padding:0;}
    .toolbar,.hint,.backlink,.reveal,footer.foot{display:none !important;}
    header.hero{background:none;color:#000;box-shadow:none;border:none;
      border-bottom:2.5px solid #000;border-radius:0;padding:0 0 8px;margin-bottom:6px;}
    header.hero h1{font-size:21px;}
    header.hero .sub{opacity:1;font-size:16px;}
    .info-bar{border:1.5px solid #000;color:#000;}
    .section{border:none;box-shadow:none;border-radius:0;padding:4px 0;margin:8px 0;break-inside:avoid;}
    .section>h3{color:#000;border-bottom:1.5px solid #000;padding-bottom:3px;}
    .section>h3 .num{background:#000;color:#fff;}
    .q{break-inside:avoid;}
    .work{background:none;border:1.2px solid #555;}
    /* 學用版：隱藏解析；教用版：顯示解析 */
    .explain{display:none !important;}
    body.print-teacher .explain{display:block !important;background:none;border-left:3px solid #000;}
    .print-pagenum{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:16px;color:#000;}
    .print-pagenum::after{counter-increment:page;content:"— 第 " counter(page) " 頁 —";}
  }
</style>

const PAPER = {"n": 5, "sections": [{"cn": "一", "title": "是非題", "pts": "每題 2 分，共 10 分", "type": "tf", "lead": "對的在後面（ ）打○，錯的打✕。", "items": [{"q": "長方體有 8 個頂點和 12 個邊。", "ans": true, "ex": "長方體的頂點是 8 個、邊是 12 條，敘述正確。"}, {"q": "正方體只有 4 個面。", "ans": false, "ex": "正方體有 6 個面，不是 4 個。"}, {"q": "同樣長的彩帶，1/9 條比 1/4 條短。", "ans": true, "ex": "分子都是 1，分母大的每份小，1/9＜1/4，所以比較短。"}, {"q": "全部分完，而且每個人分到的一樣多，才叫做平分。", "ans": true, "ex": "平分要全部分完且每份一樣多，敘述正確。"}, {"q": "爸爸吃 1/2 個大披薩，弟弟吃 1/2 個小披薩，兩人吃的一樣多。", "ans": false, "ex": "披薩大小不同，整體不一樣大時，不能說兩人吃的一樣多。"}]}, {"cn": "二", "title": "選擇題", "pts": "每題 2 分，共 10 分", "type": "choice", "lead": "把正確答案的代號填在（ ）裡。", "items": [{"q": "有 47 顆彈珠，每 6 顆裝 1 袋，裝滿後還剩幾顆？", "opts": ["4 顆", "5 顆", "6 顆"], "ans": 1, "ex": "6×7＝42，47－42＝5，剩 5 顆。"}, {"q": "下列哪一個數量「沒辦法」剛好平分給 9 個人？", "opts": ["36 個", "45 個", "50 個"], "ans": 2, "ex": "36＝9×4、45＝9×5 都整除；50÷9＝5…剩 5，不能剛好平分。"}, {"q": "1 瓶汽水平分倒成 6 杯，1 杯是多少？", "opts": ["1/6 杯汽水", "1/6 瓶汽水", "6 瓶汽水"], "ans": 1, "ex": "把 1 瓶平分成 6 杯，1 杯是 1/6 瓶汽水。"}, {"q": "下列哪一種物品可能是「正方體」？", "opts": ["骰子", "保特瓶", "雞蛋"], "ans": 0, "ex": "骰子 6 個面都是一樣大的正方形，是正方體。"}, {"q": "右圖有 28 個●，每 4 個圈成 1 圈，可以圈成幾圈？", "fig": {"t": "dots", "total": 28, "perRow": 7}, "opts": ["6 圈", "7 圈", "8 圈"], "ans": 1, "ex": "28÷4＝7（4×7＝28），可以圈成 7 圈。"}]}, {"cn": "三", "title": "填填看", "pts": "每格 2 分，共 20 分", "type": "fill", "lead": "把答案寫在（ ）裡。", "items": [{"q": "『1/8』讀作[]。", "ans": "八分之一", "ex": "分母 8 在下、分子 1 在上，讀作八分之一。"}, {"q": "「十分之一」記作[]，它的分母是[]。", "ans": "1/10；10", "ex": "分母 10 寫在橫線下、分子 1 寫在上，記作 1/10，分母是 10。"}, {"q": "1 條巧克力平分成 6 格，1 格是[]條巧克力。", "ans": "1/6", "ex": "平分 6 份取 1 份＝1/6 條。"}, {"q": "正方體有[]個面、[]個邊和[]個頂點。", "ans": "6；12；8", "ex": "正方體固定有 6 面、12 邊、8 頂點。"}, {"q": "寒假有 3 個星期又 4 天，一共是[]天。", "ans": "25", "ex": "3×7＝21，21＋4＝25 天。"}, {"q": "姐姐今年 12 歲，奶奶的年齡是姐姐的 6 倍少 9 歲，奶奶[]歲。", "ans": "63", "ex": "12×6＝72，72－9＝63 歲。"}, {"q": "1 盒蘋果有 10 個，買 5 盒，送人 13 個，還剩[]個。", "ans": "37", "ex": "10×5＝50，50－13＝37 個。"}]}, {"cn": "四", "title": "看圖作答", "pts": "每格 2 分，共 20 分", "type": "figq", "lead": "看圖回答問題，把答案寫在（ ）裡。", "items": [{"q": "右圖的圓平分成[]份，塗色部分是[]個圓。", "fig": {"t": "fracCircle", "parts": 3, "shaded": 1}, "ans": "3；1/3", "ex": "平分 3 份、塗 1 份，就是 1/3 個圓。"}, {"q": "右邊的立體形體是[]體，有[]個面、[]個邊、[]個頂點。", "fig": {"t": "box", "l": 6, "w": 4, "h": 3}, "ans": "長方；6；12；8", "ex": "長、寬、高不完全相同是長方體，有 6 面、12 邊、8 頂點。"}, {"q": "數一數，甲佔[]格、乙佔[]格、丙佔[]格，面最小的是[]。", "fig": {"t": "grids", "shapes": [{"label": "甲", "rows": 3, "cols": 3, "cells": [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 1]]}, {"label": "乙", "rows": 3, "cols": 3, "cells": [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]}, {"label": "丙", "rows": 3, "cols": 2, "cells": [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0]]}]}, "ans": "7；9；5；丙", "ex": "甲 7 格、乙 9 格、丙 5 格，丙的格數最少，面最小。"}]}, {"cn": "五", "title": "分裝與平分（把做法用算式記下來）", "pts": "每題 4 分，共 16 分", "type": "div", "lead": "先列出算式再作答，計算過程寫在框內。", "items": [{"q": "把 63 顆荔枝平分裝進 7 個盒子，每盒裝幾顆？", "method": "乘法", "unit": "顆", "eq": "7×9＝63，每盒 9 顆", "ex": "想 7 乘多少等於 63，7×9＝63，每盒 9 顆。"}, {"q": "有 24 條魚，每 3 條裝 1 袋，可以裝幾袋？", "method": "減法", "unit": "袋", "eq": "24－3－3－3－3－3－3－3－3＝0，可裝 8 袋", "ex": "一直減 3，減 8 次到 0，可裝 8 袋。"}, {"q": "一條彩帶長 45 公分，平分成 5 段，每段長幾公分？", "method": "乘法", "unit": "公分", "eq": "5×9＝45，每段 9 公分", "ex": "想 5 乘多少等於 45，5×9＝45，每段 9 公分。"}, {"q": "有 40 顆糖，每 8 顆裝 1 包，可以裝幾包？", "method": "減法", "unit": "包", "eq": "40－8－8－8－8－8＝0，可裝 5 包", "ex": "一直減 8，減 5 次到 0，可裝 5 包。"}]}, {"cn": "六", "title": "應用題（兩步驟）", "pts": "每題 4 分，共 24 分", "type": "app", "lead": "用兩步驟解題，算式寫在框內，並寫出答案。", "items": [{"q": "1 盒鉛筆有 8 枝，桌上原本有 6 枝，姐姐又買了 4 盒，現在一共有幾枝鉛筆？", "unit": "枝", "eq": "8×4＋6＝38", "ex": "先算買的 8×4＝32，再加原有 6，32＋6＝38 枝。"}, {"q": "1 包軟糖有 9 顆，買了 5 包，吃掉 17 顆，還剩幾顆？", "unit": "顆", "eq": "9×5－17＝28", "ex": "先算 9×5＝45，再減吃掉的 17，45－17＝28 顆。"}, {"q": "1 杯飲料要加 2 顆珍珠和 4 顆椰果，做 8 杯一共要加幾顆配料？", "unit": "顆", "eq": "(2＋4)×8＝48", "ex": "先算 1 杯 2＋4＝6 顆，再 6×8＝48 顆。"}, {"q": "妹妹今年 5 歲，姑姑的年齡是妹妹的 8 倍少 6 歲，姑姑今年幾歲？", "unit": "歲", "eq": "5×8－6＝34", "ex": "先算 5×8＝40，再減 6，40－6＝34 歲。"}, {"q": "1 包葡萄乾 14 元，買 3 包付給老闆 50 元，老闆要找回幾元？", "unit": "元", "eq": "50－14×3＝8", "ex": "先算 14×3＝42，再 50－42＝8 元。"}, {"q": "一個布丁原價 22 元，特價 16 元，買 5 個一共可以省下幾元？", "unit": "元", "eq": "(22－16)×5＝30", "ex": "1 個省 22－16＝6 元，5 個省 6×5＝30 元。"}]}]};

/* ---------- 工具 ---------- */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const blanks = (n,cls) => ('<span class="blank '+(cls||'')+'"></span>').repeat(Number(n)||1);
const ABCD = ['①','②','③','④'];
// 把題幹中的 [] 換成填空底線
function fillText(t){ return esc(t).replace(/\[\]/g,'<span class="blank"></span>'); }
function reveal(html){
  return '<button class="reveal" onclick="tg(this)">查看解析</button>'+
         '<div class="explain">'+html+'</div>';
}
function ansHTML(ans, ex){
  return '<span class="ans">答案：'+ans+'</span>'+(ex?'　'+ex:'');
}

/* ---------- 圖形引擎（SVG） ---------- */
function figFracCircle(parts,shaded){
  const cx=62,cy=62,r=54; let p='';
  for(let i=0;i<parts;i++){
    const a0=(-90+i*360/parts)*Math.PI/180, a1=(-90+(i+1)*360/parts)*Math.PI/180;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const fill=i<shaded?'var(--shade)':'#fff';
    if(parts===1){ p='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(shaded?'var(--shade)':'#fff')+'" stroke="#2f7d8a" stroke-width="2"/>'; break;}
    p+='<path d="M'+cx+','+cy+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+r+','+r+' 0 0 1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+fill+'" stroke="#2f7d8a" stroke-width="2"/>';
  }
  return '<svg width="124" height="124" viewBox="0 0 124 124" role="img">'+p+'</svg>';
}
function figFracBar(parts,shaded){
  const W=252,H=52,bw=W/parts; let p='';
  for(let i=0;i<parts;i++){
    p+='<rect x="'+(i*bw).toFixed(1)+'" y="1" width="'+bw.toFixed(1)+'" height="'+(H-2)+'" fill="'+(i<shaded?'var(--shade)':'#fff')+'" stroke="#2f7d8a" stroke-width="2"/>';
  }
  return '<svg width="'+(W+2)+'" height="'+(H+2)+'" viewBox="0 0 '+(W+2)+' '+(H+2)+'" role="img">'+p+'</svg>';
}
// 等角立體：長 l、深 w、高 h，單位公分
function figBox(l,w,h,labels){
  const u=12;                         // 每公分像素
  const fw=l*u, fh=h*u;
  const dx=w*u*0.6, dy=w*u*0.42;      // 往後上方的位移量（dy 為正值＝往上）
  const padL=72, padT=26, padR=46, padB=26;
  const ox=padL, oy=padT+dy+fh;       // 前面左下角
  const A=[ox,oy-fh], B=[ox+fw,oy-fh], C=[ox+fw,oy], D=[ox,oy];           // 前面四角
  const A2=[A[0]+dx,A[1]-dy], B2=[B[0]+dx,B[1]-dy], C2=[C[0]+dx,C[1]-dy]; // 後面（往後上）
  const pl=(pts)=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  let s='';
  s+='<polygon points="'+pl([A,B,B2,A2])+'" fill="#eaf6f5" stroke="#1f5b66" stroke-width="2"/>';   // 頂面
  s+='<polygon points="'+pl([B,C,C2,B2])+'" fill="#d7eeec" stroke="#1f5b66" stroke-width="2"/>';   // 右側面
  s+='<polygon points="'+pl([A,B,C,D])+'" fill="#f7fdfc" stroke="#1f5b66" stroke-width="2.4"/>';   // 前面
  let lab='';
  if(labels){
    // 長：前面下緣中央
    lab+='<text x="'+((D[0]+C[0])/2)+'" y="'+(C[1]+19)+'" text-anchor="middle" font-size="16" fill="#1f5b66">'+l+'公分</text>';
    // 高：前面左緣外側
    lab+='<text x="'+(A[0]-9)+'" y="'+((A[1]+D[1])/2+5)+'" text-anchor="end" font-size="16" fill="#1f5b66">'+h+'公分</text>';
    // 寬（深度）：左上斜邊上方中央
    lab+='<text x="'+((A[0]+A2[0])/2-2)+'" y="'+(Math.min(A[1],A2[1])-6)+'" text-anchor="middle" font-size="16" fill="#1f5b66">'+w+'公分</text>';
  }
  const Wd=Math.ceil(ox+fw+dx+padR), Hd=Math.ceil(oy+padB);
  return '<svg width="'+Wd+'" height="'+Hd+'" viewBox="0 0 '+Wd+' '+Hd+'" role="img">'+s+lab+'</svg>';
}
// 方格圖（多形）：shapes=[{label,rows,cols,cells:[[r,c]...]}]
function figGrids(shapes){
  const u=20;
  let out='<div class="grid-set">';
  shapes.forEach(sh=>{
    const W=sh.cols*u, H=sh.rows*u; let g='';
    for(let r=0;r<sh.rows;r++)for(let c=0;c<sh.cols;c++){
      const on=sh.cells.some(p=>p[0]===r&&p[1]===c);
      g+='<rect x="'+(c*u)+'" y="'+(r*u)+'" width="'+u+'" height="'+u+'" fill="'+(on?'var(--shade)':'#fff')+'" stroke="#9bb1ae" stroke-width="1"/>';
    }
    out+='<div class="grid-one"><svg width="'+(W+2)+'" height="'+(H+2)+'" viewBox="-1 -1 '+(W+2)+' '+(H+2)+'">'+g+'</svg><div class="gl">'+esc(sh.label)+'</div></div>';
  });
  return out+'</div>';
}
// 分裝畫圈：total 個圓點，每列 perRow
function figDots(total,perRow,emoji){
  perRow=perRow||10; const u=30, R=11; const rows=Math.ceil(total/perRow);
  let g=''; let n=0;
  for(let r=0;r<rows;r++)for(let c=0;c<perRow&&n<total;c++,n++){
    g+='<circle cx="'+(c*u+u/2)+'" cy="'+(r*u+u/2)+'" r="'+R+'" fill="#fff" stroke="#e08a3c" stroke-width="2"/>';
  }
  const W=perRow*u, H=rows*u;
  return '<svg width="'+(W+2)+'" height="'+(H+2)+'" viewBox="-1 -1 '+(W+2)+' '+(H+2)+'" role="img">'+g+'</svg>';
}
// 長條統計圖：cats=[{label,val}], max
function figBar(cats,max){
  const u=22, bw=40, gap=26, padL=34, padB=26, H=max*u;
  const W=padL+cats.length*(bw+gap);
  let g='';
  for(let v=0;v<=max;v++){const y=H-v*u; g+='<line x1="'+padL+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#cfe0de" stroke-width="1"/>';
    g+='<text x="'+(padL-6)+'" y="'+(y+5)+'" text-anchor="end" font-size="13" fill="#5f726e">'+v+'</text>';}
  cats.forEach((c,i)=>{const x=padL+gap/2+i*(bw+gap); const bh=c.val*u;
    g+='<rect x="'+x+'" y="'+(H-bh)+'" width="'+bw+'" height="'+bh+'" fill="var(--shade)" stroke="#1f5b66" stroke-width="1.5"/>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H+18)+'" text-anchor="middle" font-size="15" fill="#23332f">'+esc(c.label)+'</text>';});
  g+='<line x1="'+padL+'" y1="0" x2="'+padL+'" y2="'+H+'" stroke="#1f5b66" stroke-width="2"/>';
  g+='<line x1="'+padL+'" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="#1f5b66" stroke-width="2"/>';
  return '<svg width="'+(W+6)+'" height="'+(H+padB)+'" viewBox="0 0 '+(W+6)+' '+(H+padB)+'" role="img">'+g+'</svg>';
}
function drawFig(f){
  if(!f) return '';
  switch(f.t){
    case 'fracCircle': return figFracCircle(f.parts,f.shaded);
    case 'fracBar': return figFracBar(f.parts,f.shaded);
    case 'box': return figBox(f.l,f.w,f.h,f.labels!==false);
    case 'grids': return figGrids(f.shapes);
    case 'dots': return figDots(f.total,f.perRow);
    case 'bar': return figBar(f.cats,f.max);
  }
  return '';
}

<script id="ak-core">(function(){

}

<script>AK(function(){
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','−':'⁻','－':'⁻','+':'⁺','n':'ⁿ'};
var SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function map(s,M,pre){var o='';for(var i=0;i<s.length;i++){if(!M[s[i]])return pre+s;o+=M[s[i]]}return o}
function T(el){
  if(!el)return '';var c=el.cloneNode(true);
  c.querySelectorAll('.katex-mathml,mjx-assistive-mml,script,style,button,.lab2').forEach(function(x){x.remove()});
  c.querySelectorAll('.frac,.fr').forEach(function(f){var p=f.children;if(p.length>=2){var pv=f.previousSibling,sp=pv&&/[0-9]$/.test(pv.textContent)?' ':'';f.textContent=sp+p[0].textContent.trim()+'/'+p[1].textContent.trim()}});
  c.querySelectorAll('sup').forEach(function(s){s.textContent=map(s.textContent.trim(),SUP,'^')});
  c.querySelectorAll('sub').forEach(function(s){s.textContent=map(s.textContent.trim(),SUB,'_')});
  c.querySelectorAll('br').forEach(function(b){b.replaceWith(' ')});
  return c.textContent.replace(/[ \t\r\n ]+/g,' ').replace(/ ([，。、；）)])/g,'$1').trim();
}
function cut(s){s=String(s).trim();return s.length>60?s.slice(0,59)+'…':s}
function choice(s){var m=s.match(/^\(?([A-EＡ-Ｅ①②③④⑤])\)?(?=[\s　]|$)/);return m?m[1]:s}
function strip(s){return s.replace(/^[✅\s]*(參考)?答案[:：]\s*/,'').trim()}
function ans(ex){
  if(!ex)return '';
  var pr=ex.querySelectorAll('.pair');
  if(pr.length)return [].map.call(pr,T).join('、');
  var as=[].filter.call(ex.querySelectorAll('.ans'),function(a){return !a.querySelector('.ans')});
  if(as.length)return choice(strip(T(as[as.length-1])));
  var t=T(ex);
  if(/^(參考)?答案[:：]/.test(t)){t=strip(t);var k=t.indexOf('　');if(k>0)t=t.slice(0,k);return t.replace(/（第[^（）]*課[^（）]*）$/,'').trim()}
  var bs=[].filter.call(ex.querySelectorAll('b'),function(b){return !b.parentElement.closest('b')});
  if(bs.length)return bs.map(T).join('／');
  return t.replace(/（第[^（）]*課[^（）]*）$/,'').trim();
}
function scrape(pre){
  return [].map.call(document.querySelectorAll('section.section'),function(s){
    var h=s.querySelector('h2,h3');var hc=h?h.cloneNode(true):null;if(hc)hc.querySelectorAll('.pts').forEach(function(x){x.remove()});
    var num=hc&&hc.querySelector('.num');if(num)num.textContent=num.textContent.trim()+'、';
    return {title:pre+(hc?T(hc).replace(/、\s+/,'、'):''),items:[].map.call(s.querySelectorAll('.q'),function(q,i){
      var qn=q.querySelector('.qn');return [qn?qn.textContent.replace(/[.．、\s]/g,''):i+1,cut(ans(q.querySelector('.explain')))]})};
  });
}
if(typeof PAPERS!=='undefined'&&typeof render==='function'){
  var o=cur,out=[];
  for(var i=0;i<PAPERS.length;i++){cur=i;render();out=out.concat(scrape('卷'+(PAPERS[i].n||i+1)+'　'))}
  cur=o;render();return out;
}
return scrape('');
});</script>

      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>

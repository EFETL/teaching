<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國小一上數學・序數和數字塗色（從左邊數）</title>
<style>
  :root { --ink:#222; --pink:#e5527a; --pinkbg:#fff0f4; --blue:#3b8fe0; --bluebg:#eef6ff; --fill:#ffcf3f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#eee; color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; }
  .sheet { width:210mm; height:297mm; margin:12px auto; background:#fff; padding:5mm 10mm 9mm;
    display:flex; flex-direction:column; box-shadow:0 2px 8px rgba(0,0,0,.12); position:relative; }
  .panel { flex:1; border-radius:18px; padding:12px 12px 12px; display:flex; flex-direction:column; }
  .panel.pink { background:var(--pinkbg); } .panel.blue { background:var(--bluebg); }
  .head { text-align:center; margin-bottom:4px; }
  .head h2 { margin:0; font-size:40px; font-weight:900; display:inline-flex; align-items:center; }
  .head h2 .num { font-size:46px; margin-right:4px; }
  .pink .hl .h { color:var(--pink); } .blue .hl .h { color:var(--blue); }
  .head .tip { font-size:20px; margin-top:4px; }
  .head .tip .h { font-size:20px; }
  .head .tip .bw { font-size:9px; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; height:10mm; margin-bottom:2mm; padding:0 2mm; }
  .name { font-size:16px; color:#444; white-space:nowrap; }
  .rows { display:flex; flex-direction:column; gap:8px; flex:1; }
  .row { flex:1; background:#fff; border-radius:12px; border:1.5px solid #e3e3e3; display:flex; align-items:center; padding:0 8px; gap:8px; }
  .no { width:34px; height:34px; border-radius:50%; color:#fff; font-weight:bold; font-size:19px; display:flex; align-items:center; justify-content:center; flex:none; }
  .pink .no { background:var(--pink); } .blue .no { background:var(--blue); }
  .label { width:232px; white-space:nowrap; flex:none; display:flex; align-items:center; }
  .box { flex:none; border:2px solid var(--ink); border-radius:6px; font-size:26px; font-weight:bold; width:40px; height:44px; display:flex; align-items:center; justify-content:center; margin-right:4px; }
  .digit { font-size:28px; font-weight:bold; margin:0 3px; }
  .items { display:flex; gap:3px; flex:1; justify-content:flex-start; }
  .it { width:36px; height:36px; flex:none; cursor:pointer; }
  .it svg { width:100%; height:100%; }
  .s { fill:#fff; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .ln { fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
  .dot { fill:var(--ink); }
  .it.on .s { fill:var(--fill); }
  /* 直式注音 */
  .z { display:inline-flex; align-items:center; margin:0 1px; white-space:nowrap; }
  .z .h { font-size:26px; font-weight:bold; line-height:1; }
  .z .bw { display:flex; flex-direction:column; align-items:center; font-size:11px; line-height:1.02; margin-left:1px; padding-right:.6em; font-weight:normal; color:#333; }
  .z .bw span { position:relative; }
  .z .bw i { font-style:normal; position:absolute; left:100%; top:-.15em; margin-left:.05em; }
  .head h2 .z .h { font-size:40px; font-weight:900; }
  .head h2 .z .bw { font-size:13px; }
  .bar { text-align:center; margin:10px; }
  .bar button { font-size:16px; padding:8px 18px; margin:0 6px; border-radius:20px; border:1px solid #ccc; background:#fff; cursor:pointer; }
  .key-title { font-size:18px; color:var(--pink); font-weight:bold; }
  @media print {
    #fit { zoom:1 !important; }
    #penBtn,#penBar,#penCv,#penHit,#penBoard { display:none !important; }
    body { background:#fff; } .sheet { margin:0; box-shadow:none; page-break-after:always; }
    .bar { display:none; }
    @page { size:A4 portrait; margin:0; }
  }
</style>
</head>
<body>
<header class="bar">
  <button onclick="location.href='./'">← 回國小一年級第一冊</button>
  <a href="ordinal-left.pdf" download><button>下載 PDF</button></a>
  <button onclick="window.print()">列印（第 1、2 頁題目，第 3、4 頁答案）</button>
  <button onclick="document.querySelectorAll('.qs .it.on').forEach(e=>e.classList.remove('on'))">清除塗色</button>
</header>
<main id="fit">
<div id="q1" class="sheet qs"></div>
<div id="q2" class="sheet qs"></div>
<div id="a1" class="sheet"></div>
<div id="a2" class="sheet"></div>
</main>
<script>
// ---- 圖形（viewBox 0 0 40 40）----
const SH = {
  fish:'<path class="s" d="M3 20 C10 9 25 8 31 20 C25 32 10 31 3 20Z"/><path class="s" d="M30 20 L38 12 L38 28Z"/><circle class="dot" cx="11" cy="18" r="1.8"/>',
  apple:'<path class="s" d="M20 12 C14 7 4 9 4 20 C4 30 12 38 17 37 C19 37 19.5 36 20 36 C20.5 36 21 37 23 37 C28 38 36 30 36 20 C36 9 26 7 20 12Z"/><path class="ln" d="M20 12 C20 8 22 5 24 3"/><path class="s" d="M22 7 C25 3 30 4 31 6 C28 9 25 9 22 7Z"/>',
  flower:'<circle class="s" cx="20" cy="9" r="6.5"/><circle class="s" cx="30.5" cy="17" r="6.5"/><circle class="s" cx="26.5" cy="29.5" r="6.5"/><circle class="s" cx="13.5" cy="29.5" r="6.5"/><circle class="s" cx="9.5" cy="17" r="6.5"/><circle class="s" cx="20" cy="20" r="5.5"/>',
  bird:'<path class="s" d="M6 24 C6 15 13 11 19 13 C21 7 31 6 32 14 C33 20 31 24 28 27 C24 33 10 34 6 24Z"/><path class="s" d="M32 13 L38 15 L32 17Z"/><circle class="dot" cx="27" cy="12.5" r="1.6"/><path class="ln" d="M11 21 C14 26 20 26 22 22"/><path class="ln" d="M15 32 L14 37 M21 32 L21 37"/>',
  star:'<polygon class="s" points="20,3 25,14.5 37,15.5 28,23.5 31,36 20,29.5 9,36 12,23.5 3,15.5 15,14.5"/>',
  balloon:'<ellipse class="s" cx="20" cy="15" rx="11" ry="13"/><path class="s" d="M17.5 28 L22.5 28 L20 31Z"/><path class="ln" d="M20 31 C17 34 23 36 20 39" style="stroke-width:1.4"/>',
  butterfly:'<ellipse class="s" cx="11" cy="13" rx="8" ry="8" transform="rotate(-20 11 13)"/><ellipse class="s" cx="29" cy="13" rx="8" ry="8" transform="rotate(20 29 13)"/><ellipse class="s" cx="13" cy="28" rx="6" ry="6.5"/><ellipse class="s" cx="27" cy="28" rx="6" ry="6.5"/><rect class="s" x="18" y="8" width="4" height="26" rx="2"/><path class="ln" d="M19 8 L15 3 M21 8 L25 3" style="stroke-width:1.4"/>',
  strawberry:'<path class="s" d="M6 15 C6 10 12 9 20 10 C28 9 34 10 34 15 C34 25 26 37 20 37 C14 37 6 25 6 15Z"/><path class="s" d="M12 11 L16 5 L20 9 L24 5 L28 11 Z"/><circle class="dot" cx="14" cy="18" r="1"/><circle class="dot" cx="20" cy="17" r="1"/><circle class="dot" cx="26" cy="18" r="1"/><circle class="dot" cx="17" cy="25" r="1"/><circle class="dot" cx="23" cy="25" r="1"/><circle class="dot" cx="20" cy="31" r="1"/>',
  heart:'<path class="s" d="M20 36 C6 26 3 19 3 13 C3 7 7 4 12 4 C16 4 19 7 20 10 C21 7 24 4 28 4 C33 4 37 7 37 13 C37 19 34 26 20 36Z"/>',
  cup:'<path class="s" d="M5 9 L29 9 L27 34 C27 36 26 37 24 37 L10 37 C8 37 7 36 7 34Z"/><path class="ln" d="M28.5 14 C36 13 37 25 28 27"/>',
  mushroom:'<path class="s" d="M3 20 C3 9 11 4 20 4 C29 4 37 9 37 20Z"/><path class="s" d="M14 20 L26 20 L27 35 C27 37 25 38 20 38 C15 38 13 37 13 35Z"/><circle class="s" cx="13" cy="12" r="3"/><circle class="s" cx="25" cy="10" r="2.5"/><circle class="s" cx="30" cy="16" r="2"/>',
  cat:'<path class="s" d="M6 18 L5 4 L15 11 C18 10 22 10 25 11 L35 4 L34 18 C36 30 30 37 20 37 C10 37 4 30 6 18Z"/><circle class="dot" cx="14" cy="21" r="2"/><circle class="dot" cx="26" cy="21" r="2"/><path class="ln" d="M18 27 L20 29 L22 27" style="stroke-width:1.5"/><path class="ln" d="M3 25 L11 26 M3 30 L11 28 M37 25 L29 26 M37 30 L29 28" style="stroke-width:1.2"/>',
  donut:'<circle class="s" cx="20" cy="20" r="17"/><circle cx="20" cy="20" r="6" fill="#fff" stroke="#222" stroke-width="2"/><path class="ln" d="M10 13 L12 11 M28 11 L30 13 M30 26 L28 29 M12 29 L10 27 M20 7 L21 9" style="stroke-width:1.5"/>',
  car:'<path class="s" d="M3 28 L3 21 C3 19 5 18 7 18 L10 18 L14 10 C15 9 16 8 18 8 L27 8 C29 8 30 9 31 10 L34 18 C36 18 37 19 37 21 L37 28Z"/><path class="ln" d="M15 18 L18 11 L22 11 L22 18 Z M25 11 L28 11 L30 18 L25 18Z" style="stroke-width:1.5"/><circle class="s" cx="11" cy="29" r="4.5"/><circle class="s" cx="29" cy="29" r="4.5"/>',
  umbrella:'<path class="s" d="M3 20 C3 10 11 4 20 4 C29 4 37 10 37 20 C34 17 30 17 28 20 C26 17 22 17 20 20 C18 17 14 17 12 20 C10 17 6 17 3 20Z"/><path class="ln" d="M20 20 L20 33 C20 37 14 37 14 33"/>',
  leaf:'<path class="s" d="M5 35 C4 18 14 5 36 4 C36 25 24 36 5 35Z"/><path class="ln" d="M5 35 C14 25 22 17 30 10 M14 26 L13 18 M20 20 L27 21" style="stroke-width:1.5"/>'
};
// ---- 注音字典（量詞「個」讀輕聲） ----
const ZY = {'第':'ㄉㄧˋ','條':'ㄊㄧㄠˊ','魚':'ㄩˊ','顆':'ㄎㄜ','蘋':'ㄆㄧㄥˊ','果':'ㄍㄨㄛˇ','朵':'ㄉㄨㄛˇ','花':'ㄏㄨㄚ',
  '隻':'ㄓ','小':'ㄒㄧㄠˇ','鳥':'ㄋㄧㄠˇ','星':'ㄒㄧㄥ','個':'˙ㄍㄜ','氣':'ㄑㄧˋ','球':'ㄑㄧㄡˊ','蝴':'ㄏㄨˊ','蝶':'ㄉㄧㄝˊ',
  '草':'ㄘㄠˇ','莓':'ㄇㄟˊ','愛':'ㄞˋ','心':'ㄒㄧㄣ','杯':'ㄅㄟ','子':'˙ㄗ','蘑':'ㄇㄛˊ','菇':'ㄍㄨ','貓':'ㄇㄠ','甜':'ㄊㄧㄢˊ',
  '圈':'ㄑㄩㄢ','輛':'ㄌㄧㄤˋ','汽':'ㄑㄧˋ','車':'ㄔㄜ','把':'ㄅㄚˇ','雨':'ㄩˇ','傘':'ㄙㄢˇ','片':'ㄆㄧㄢˋ','葉':'ㄧㄝˋ',
  '以':'ㄧˇ','內':'ㄋㄟˋ','的':'˙ㄉㄜ','序':'ㄒㄩˋ','字':'ㄗˋ','依':'ㄧ','照':'ㄓㄠˋ','題':'ㄊㄧˊ','目':'ㄇㄨˋ',
  '正':'ㄓㄥˋ','確':'ㄑㄩㄝˋ','物':'ㄨˋ','品':'ㄆㄧㄣˇ','塗':'ㄊㄨˊ','上':'ㄕㄤˋ','顏':'ㄧㄢˊ','色':'ㄙㄜˋ',
  '從':'ㄘㄨㄥˊ','左':'ㄗㄨㄛˇ','邊':'ㄅㄧㄢ','開':'ㄎㄞ','始':'ㄕˇ','只':'ㄓˇ','量':'ㄌㄧㄤˋ','出':'ㄔㄨ','一':'ㄧ',
  '姓':'ㄒㄧㄥˋ','名':'ㄇㄧㄥˊ','答':'ㄉㄚˊ','案':'ㄢˋ'};
const TONES = 'ˊˇˋ';
function zy(ch, b){
  b = b || ZY[ch];
  if (!b) return ch;
  let light = b[0]==='˙'; if (light) b = b.slice(1);
  let tone = TONES.includes(b[b.length-1]) ? b[b.length-1] : ''; if (tone) b = b.slice(0,-1);
  const syms = [...b].map((c,i,a)=> `<span>${c}${i===a.length-1&&tone?`<i>${tone}</i>`:''}</span>`).join('');
  return `<span class="z"><span class="h">${ch}</span><span class="bw">${light?'<span>˙</span>':''}${syms}</span></span>`;
}
// 「數」：當動詞（數一數）讀 ㄕㄨˇ，當名詞（序數、數字、數量）讀 ㄕㄨˋ
const zs = (str, over={}) => [...str].map((c,i)=> over[i] ? zy(c, over[i]) : (c==='數' ? zy(c,'ㄕㄨˋ') : (ZY[c]? zy(c) : c))).join('');

// ---- 題目：[數字, 量詞+名稱, 圖形, 圖形總數] ----
const ORD = [ [4,'條魚','fish',10], [2,'顆蘋果','apple',10], [6,'朵花','flower',10], [3,'隻小鳥','bird',10], [7,'顆星星','star',10],
              [5,'個氣球','balloon',10], [9,'隻蝴蝶','butterfly',10], [1,'顆草莓','strawberry',10], [8,'個愛心','heart',10], [10,'個杯子','cup',10] ];
const CNT = [ [6,'個蘑菇','mushroom',10], [4,'隻小貓','cat',10], [3,'個甜甜圈','donut',10], [9,'輛汽車','car',10], [2,'隻小鳥','bird',10],
              [5,'朵花','flower',10], [7,'顆草莓','strawberry',10], [1,'把雨傘','umbrella',10], [10,'片葉子','leaf',10], [8,'條魚','fish',10] ];

function panel(kind, answer){
  const isOrd = kind==='ord';
  const data = isOrd ? ORD : CNT;
  const title = isOrd ? '序數' : '數字';
  const tip1 = '依照題目，把正確的物品塗上顏色。';
  const tip2 = isOrd ? '從左邊開始數，只塗一個。' : '從左邊開始數，塗出正確的數量。';
  // tip2 的「數」第一個是動詞
  const tip2html = [...tip2].map((c,i)=> c==='數' ? zy(c, i===5?'ㄕㄨˇ':'ㄕㄨˋ') : (ZY[c]?zy(c):c)).join('');
  let rows = data.map(([n,word,shape,total],i)=>{
    let items='';
    for (let k=0;k<total;k++){
      const on = answer && (isOrd ? k===n-1 : k<n);
      items += `<div class="it${on?' on':''}" onclick="this.classList.toggle('on')"><svg viewBox="0 0 40 40">${SH[shape]}</svg></div>`;
    }
    const label = isOrd
      ? `${zy('第')}<span class="digit">${n}</span>${zs(word)}`
      : `<span class="box">${n}</span>${zs(word)}`;
    return `<div class="row"><div class="no">${i+1}</div><div class="label">${label}</div><div class="items">${items}</div></div>`;
  }).join('');
  return `<div class="panel ${isOrd?'pink':'blue'}">
    <div class="head"><h2><span class="num">10</span>${zs('以內的')}<span class="hl">${zs(title)}</span></h2>
      <div class="tip">${zs(tip1)}<br>${tip2html}</div></div>
    <div class="rows">${rows}</div></div>`;
}
const NAME = `<div class="top"><span></span><span class="name">${zs('姓名')}：＿＿＿＿＿＿</span></div>`, KEY = `<div class="top"><span class="key-title">${zs('答案')}</span><span></span></div>`;
document.getElementById('q1').innerHTML = NAME + panel('ord',false);
document.getElementById('q2').innerHTML = NAME + panel('cnt',false);
document.getElementById('a1').innerHTML = KEY + panel('ord',true);
document.getElementById('a2').innerHTML = KEY + panel('cnt',true);

/* 版面固定：A4 整張等比例縮放到螢幕寬度，放大縮小時注音、姓名都不會跑位 */
(function(){const M=document.getElementById('fit');
  function fit(){const w=document.documentElement.clientWidth;M.style.zoom=Math.min(1,(w-16)/794);}
  fit();addEventListener('resize',fit);})();

/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  const flow=[...document.body.children].filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
  if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
<style>
#pw-gate{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#1a3a5c;display:flex;align-items:center;justify-content:center;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;}
#pw-box{background:#fff;border-radius:16px;padding:40px 36px;max-width:360px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3);}
#pw-box h2{font-size:22px;color:#1a3a5c;margin-bottom:8px;}
#pw-box p{font-size:15px;color:#666;margin-bottom:20px;}
#pw-box input{width:100%;font-size:18px;padding:10px 14px;border:2px solid #cdddef;border-radius:8px;outline:none;margin-bottom:12px;box-sizing:border-box;}
#pw-box input:focus{border-color:#1a3a5c;}
#pw-box button{width:100%;font-size:18px;font-weight:bold;padding:12px;background:#1a3a5c;color:#fff;border:none;border-radius:8px;cursor:pointer;}
#pw-box button:hover{background:#2a5070;}
#pw-err{color:#c0392b;font-size:15px;margin-top:10px;display:none;}
</style>
<div id="pw-gate"><div id="pw-box">
  <h2>&#128274; 全民補習班</h2>
  <p>teaching.efetl.com<br>請輸入密碼進入教學區</p>
  <input type="password" id="pw-in" placeholder="密碼" onkeydown="if(event.key==='Enter')tryPw()">
  <button onclick="tryPw()">進入</button>
  <div id="pw-err">密碼錯誤，請再試一次</div>
</div></div>
<script>
(function(){
  if(localStorage.getItem('efetl_ok')==='1'){document.getElementById('pw-gate').style.display='none';return;}
  async function sha256(t){const d=new TextEncoder().encode(t);const h=await crypto.subtle.digest('SHA-256',d);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
  window.tryPw=async function(){
    const v=document.getElementById('pw-in').value;
    const h=await sha256(v);
    if(h==='bb6dbcaef9d5ed4d6a7f5df4effdeb3b24b34ae6b1dfb52e1315f511301fb26e'){localStorage.setItem('efetl_ok','1');document.getElementById('pw-gate').style.display='none';}
    else{document.getElementById('pw-err').style.display='block';document.getElementById('pw-in').value='';}
  };
  document.getElementById('pw-in').focus();
})();
</script>
</body>
